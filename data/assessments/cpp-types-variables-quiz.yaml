schemaVersion: 1
id: cpp-types-variables-quiz
title: C++ Types, Variables, and I/O Quiz
assessmentType: quiz
categoryId: c++
subcategoryId: c++-types-and-variables
subcategoryIds:
  - c++-types-and-variables
modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: multipleChoice
    prompt: |
      What is the correct declaration for a constant integer value representing the maximum score of 100?
    choices:
      - id: a
        text: '`const int MAX_SCORE = 100;`'
      - id: b
        text: '`int const MAX_SCORE; MAX_SCORE = 100;`'
      - id: c
        text: '`const MAX_SCORE = 100;`'
      - id: d
        text: '`int MAX_SCORE = 100 const;`'
    answer:
      choiceId: a
    explanation: |
      `const` variables must be initialized at declaration, and require a type (though `const auto` can deduce it).

  - id: q002
    type: multipleChoice
    prompt: |
      What is the deduced type of `result` in this code?
      ```cpp
      int a = 5;
      double b = 2.0;
      auto result = a * b;
      ```
    choices:
      - id: a
        text: '`double`'
      - id: b
        text: '`int`'
      - id: c
        text: '`float`'
      - id: d
        text: '`auto`'
    answer:
      choiceId: a
    explanation: |
      When multiplying an `int` and a `double`, the `int` is promoted to `double`, and the result is a `double`.

  - id: q003
    type: multipleChoice
    prompt: |
      If a user types `Hello World` and hits Enter, what does the following code print?
      ```cpp
      string word;
      cin >> word;
      cout << word;
      ```
    choices:
      - id: a
        text: '`Hello`'
      - id: b
        text: '`Hello World`'
      - id: c
        text: '` World`'
      - id: d
        text: 'An error occurs'
    answer:
      choiceId: a
    explanation: |
      `cin >>` extracts whitespace-separated tokens. It stops reading after "Hello".

  - id: q004
    type: multipleChoice
    prompt: |
      Which data type uses exactly 1 byte of memory?
    choices:
      - id: a
        text: '`char`'
      - id: b
        text: '`int`'
      - id: c
        text: '`float`'
      - id: d
        text: '`double`'
    answer:
      choiceId: a
    explanation: |
      A standard C++ `char` is 1 byte (8 bits).

  - id: q005
    type: multipleChoice
    prompt: |
      Why is `using namespace std;` often avoided in large professional projects (especially in headers)?
    choices:
      - id: a
        text: 'It can cause name collisions if multiple libraries define functions with the same names.'
      - id: b
        text: 'It makes the program run slower.'
      - id: c
        text: 'It increases the compiled executable size.'
      - id: d
        text: 'It is deprecated in modern C++.'
    answer:
      choiceId: a
    explanation: |
      Importing the entire standard namespace makes name conflicts more likely (e.g., if you define your own `count` or `size` function).

  - id: q006
    type: code
    prompt: |
      Write a function `celsiusToFahrenheit` that takes a `double` representing Celsius and returns a `double` representing Fahrenheit.
      Formula: `F = C * (9.0 / 5.0) + 32.0`
    language: cpp
    functionName: celsiusToFahrenheit
    starterCode: |
      double celsiusToFahrenheit(double c) {
          // Return the converted value
          return 0.0;
      }
    tests:
      - input: "0"
        expected: "32"
      - input: "100"
        expected: "212"
      - input: "-40"
        expected: "-40"
    answer: {}
    explanation: |
      Return `c * 9.0 / 5.0 + 32.0;`. Note the `.0` ensures floating point division, preventing truncation.

  - id: q007
    type: code
    prompt: |
      Write a function `isEven` that takes an `int n` and returns `bool` (`true` if even, `false` if odd).
    language: cpp
    functionName: isEven
    starterCode: |
      bool isEven(int n) {
          return false;
      }
    tests:
      - input: "4"
        expected: "1"
      - input: "7"
        expected: "0"
      - input: "0"
        expected: "1"
    answer: {}
    explanation: |
      Use the modulo operator: `return n % 2 == 0;`.

  - id: q008
    type: code
    prompt: |
      Write a function `formatPrice` that takes an `int dollars` and `int cents`, and returns a `string` like `"$5.99"`.
      Assume `cents` is always exactly two digits (00-99). Use the `to_string()` function to convert integers to strings.
    language: cpp
    functionName: formatPrice
    starterCode: |
      #include <string>
      using namespace std;
      
      string formatPrice(int dollars, int cents) {
          return "";
      }
    tests:
      - input: "5, 99"
        expected: "\"$5.99\""
      - input: "0, 50"
        expected: "\"$0.50\""
    answer: {}
    explanation: |
      Return `"$" + to_string(dollars) + "." + to_string(cents);`.
