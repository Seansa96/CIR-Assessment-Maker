questions:
- id: q001
  type: numericResponse
  skills:
  - physics-pendulums
  prompt: A mass of 6.03 kg is attached to a horizontal spring with constant 249.4
    N/m on a frictionless table. If the amplitude is 0.465 m, what is the maximum
    speed in m/s?
  answer:
    value: 2.9905
    tolerance: 0.05
  explanation: v_max = A*omega = 0.465 * sqrt(249.4/6.03) = 2.9905 m/s.
- id: q002
  type: numericResponse
  skills:
  - physics-pendulums
  prompt: A mass of 9.54 kg is attached to a horizontal spring with constant 462.0
    N/m on a frictionless table. Calculate the angular frequency in rad/s.
  answer:
    value: 6.959
    tolerance: 0.05
  explanation: omega = sqrt(k/m) = sqrt(462.0/9.54) = 6.9590 rad/s.
- id: q003
  type: numericResponse
  skills:
  - physics-pendulums
  prompt: In a microgravity experiment, a 3.22 kg sample oscillates on a spring of
    stiffness 331.2 N/m. What is the period of oscillation in seconds?
  answer:
    value: 0.6195
    tolerance: 0.05
  explanation: T = 2*pi*sqrt(m/k) = 2*pi*sqrt(3.22/331.2) = 0.6195 s.
