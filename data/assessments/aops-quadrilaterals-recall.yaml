schemaVersion: 1
id: aops-quadrilaterals-recall
title: Quadrilaterals Recall Drill
assessmentType: recallDrill
categoryId: art-of-problem-solving
topicId: aops-quadrilaterals
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags: [art-of-problem-solving, aops-quadrilaterals, geometry, quadrilateral-terminology]
skills:
- Recall quadrilateral definitions and classification hierarchy
- Recall parallelogram, trapezoid, rhombus, rectangle, square, and kite properties
- Distinguish sufficient conditions from unsafe converses
items:
- id: quadrilateral-angle-sum-flashcard
  type: flashcard
  prompt: What is the interior-angle sum of a quadrilateral, and why?
  answer:
    expected: A quadrilateral's interior angles total $360^\circ$ because a diagonal divides it into two triangles, each with angle sum $180^\circ$.
  explanation: The diagonal derivation is more durable than memorizing 360 in isolation.
  tags: [angle-sum, aops-quadrilaterals]
- id: convex-flashcard
  type: flashcard
  prompt: What makes a quadrilateral convex?
  answer:
    expected: Every interior angle is less than $180^\circ$, and both diagonals lie inside the figure.
  explanation: A concave quadrilateral instead has one reflex interior angle.
  tags: [convexity, aops-quadrilaterals]
- id: diagonal-flashcard
  type: flashcard
  prompt: Define a polygon diagonal.
  answer:
    expected: A segment joining two nonadjacent vertices.
  explanation: Adjacent vertices determine sides, not diagonals.
  tags: [diagonal, aops-quadrilaterals]
- id: parallelogram-definition-flashcard
  type: flashcard
  prompt: State the definition of a parallelogram.
  answer:
    expected: A quadrilateral with both pairs of opposite sides parallel.
  explanation: Other familiar properties are consequences or classification tests.
  tags: [parallelogram, aops-quadrilaterals]
- id: parallelogram-properties-flashcard
  type: flashcard
  prompt: Name four standard consequences of being a parallelogram.
  answer:
    expected: Opposite sides are congruent, opposite angles are congruent, consecutive angles are supplementary, and the diagonals bisect each other.
  explanation: Congruent or perpendicular diagonals are not universal parallelogram properties.
  tags: [parallelogram-properties, aops-quadrilaterals]
- id: parallelogram-tests-flashcard
  type: flashcard
  prompt: Name three sufficient tests for proving a quadrilateral is a parallelogram.
  answer:
    expected: Examples include both opposite side pairs parallel, both opposite side pairs congruent, one opposite pair both parallel and congruent, both opposite angle pairs congruent, or diagonals bisecting each other.
  explanation: Any three of the listed standard tests satisfy the prompt.
  tags: [parallelogram-tests, aops-quadrilaterals]
- id: rectangle-flashcard
  type: flashcard
  prompt: Define a rectangle and state its distinctive diagonal property.
  answer:
    expected: A rectangle is a parallelogram with four right angles; its diagonals are congruent and bisect each other.
  explanation: Congruence alone does not prove an arbitrary quadrilateral is a rectangle.
  tags: [rectangle, aops-quadrilaterals]
- id: rhombus-flashcard
  type: flashcard
  prompt: Define a rhombus and state two distinctive diagonal properties.
  answer:
    expected: A rhombus is a parallelogram with four congruent sides; its diagonals are perpendicular and bisect opposite angles.
  explanation: As a parallelogram, its diagonals also bisect each other.
  tags: [rhombus, aops-quadrilaterals]
- id: square-flashcard
  type: flashcard
  prompt: How does a square fit into the quadrilateral hierarchy?
  answer:
    expected: A square is both a rectangle and a rhombus, so it is also a parallelogram and, under the inclusive convention, a trapezoid.
  explanation: Classifications can overlap; the most specific name does not erase broader valid names.
  tags: [square, hierarchy, aops-quadrilaterals]
- id: trapezoid-convention-flashcard
  type: flashcard
  prompt: What convention issue must be checked when a source defines trapezoid?
  answer:
    expected: Whether trapezoid means at least one designated pair of opposite parallel sides (inclusive) or exactly one pair (exclusive).
  explanation: This curriculum uses the inclusive trapezoid convention, but reserves the usual isosceles-trapezoid theorems for non-parallelogram trapezoids with congruent legs.
  tags: [trapezoid, definition-convention, aops-quadrilaterals]
- id: trapezoid-parts-flashcard
  type: flashcard
  prompt: What are a trapezoid's bases and legs?
  answer:
    expected: The bases are the designated parallel pair; the legs are the two remaining sides. In a non-parallelogram trapezoid, the legs are nonparallel.
  explanation: Height is perpendicular distance between the base lines, not generally a leg.
  tags: [trapezoid-parts, aops-quadrilaterals]
- id: isosceles-trapezoid-flashcard
  type: flashcard
  prompt: What properties follow from an isosceles trapezoid's congruent legs?
  answer:
    expected: Each pair of base angles is congruent and the diagonals are congruent.
  explanation: The two corner right triangles created by altitudes are congruent.
  tags: [isosceles-trapezoid, aops-quadrilaterals]
- id: trapezoid-midsegment-flashcard
  type: flashcard
  prompt: State the trapezoid midsegment theorem.
  answer:
    expected: The segment joining the leg midpoints is parallel to the bases and has length $(b_1+b_2)/2$.
  explanation: Its length is the arithmetic mean of the base lengths.
  tags: [trapezoid-midsegment, aops-quadrilaterals]
- id: trapezoid-area-flashcard
  type: flashcard
  prompt: State and interpret the trapezoid area formula.
  answer:
    expected: $K=\tfrac12(b_1+b_2)h$; area equals average base length times perpendicular height.
  explanation: The average width is exactly the midsegment length.
  tags: [trapezoid-area, aops-quadrilaterals]
- id: kite-flashcard
  type: flashcard
  prompt: Define a kite and state its safe diagonal conclusion.
  answer:
    expected: A kite has two distinct pairs of adjacent congruent sides; one diagonal is the perpendicular bisector of the other.
  explanation: It is unsafe to claim that both diagonals bisect each other.
  tags: [kite, aops-quadrilaterals]
- id: rhombus-area-flashcard
  type: flashcard
  prompt: What is the area formula for a rhombus with diagonals $p$ and $q$, and why?
  answer:
    expected: $K=pq/2$ because the perpendicular bisecting diagonals form four right triangles with legs $p/2$ and $q/2$.
  explanation: The geometric decomposition explains the formula.
  tags: [rhombus-area, aops-quadrilaterals]
- id: converse-flashcard
  type: flashcard
  prompt: What is a converse, and why can it not be assumed automatically?
  answer:
    expected: A converse swaps a conditional theorem's hypothesis and conclusion; it is a separate statement that needs proof and may be false.
  explanation: Isosceles trapezoids and kites provide useful counterexamples to unsafe diagonal converses.
  tags: [converse, aops-quadrilaterals]
- id: sufficient-condition-flashcard
  type: flashcard
  prompt: What is a sufficient condition?
  answer:
    expected: A condition that guarantees the desired conclusion, although it may not be the only condition that does so.
  explanation: Mutual diagonal bisection is sufficient to prove parallelogram status.
  tags: [sufficient-condition, aops-quadrilaterals]
- id: counterexample-flashcard
  type: flashcard
  prompt: Give one counterexample to an unsafe quadrilateral classification claim.
  answer:
    expected: A non-rhombus kite can have perpendicular diagonals, or a non-rectangle isosceles trapezoid can have congruent diagonals.
  explanation: One valid counterexample disproves a universal converse.
  tags: [counterexample, aops-quadrilaterals]
