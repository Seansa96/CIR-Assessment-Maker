workedExamples:
  - id: polar-rose-one-leaf-area
    title: Isolate and integrate exactly one leaf
    problem: |
      Find the area inside one leaf of the rose

      $$
      r=6\sin(6\theta).
      $$

      ![The twelve-leaf rose r equals six sine six theta with one leaf and its tracing interval highlighted](/assessments/calc2-parametric-polar/polar-rose-6sin6theta-one-leaf.svg)
    steps:
      - id: rose-leaf-count
        title: Read the rose structure from the frequency
        instruction: |
          For $r=a\sin(n\theta)$:

          - odd $n$ produces $n$ leaves;
          - even $n$ produces $2n$ leaves.

          Here $n=6$ is even, so the complete curve has $12$ leaves.
        type: multipleChoice
        prompt: How many leaves does the full rose have?
        choices:
          - id: a
            text: '12'
          - id: b
            text: '6'
          - id: c
            text: '3'
          - id: d
            text: '36'
        answer:
          choiceId: a
        hint: Even rose frequency doubles the frequency count.
        explanation: |
          The curve has $2(6)=12$ leaves. This count is a structural check, but the problem asks for only one leaf, so the final area must not be multiplied by 12.

          Related topic: rose-curve classification.

      - id: rose-leaf-boundaries
        title: Find consecutive pole crossings
        instruction: |
          A leaf begins and ends when the curve reaches the pole:

          $$
          6\sin(6\theta)=0.
          $$

          Thus

          $$
          6\theta=k\pi
          \quad\Longrightarrow\quad
          \theta=\frac{k\pi}{6}.
          $$

          Consecutive zeros $\theta=0$ and $\theta=\pi/6$ trace one complete leaf.
        type: multipleChoice
        prompt: Which interval traces exactly the highlighted leaf once?
        choices:
          - id: a
            text: '$0\leq\theta\leq\frac{\pi}{6}$'
          - id: b
            text: '$0\leq\theta\leq2\pi$'
          - id: c
            text: '$0\leq\theta\leq\frac{\pi}{12}$'
          - id: d
            text: '$-\frac{\pi}{6}\leq\theta\leq\frac{\pi}{6}$'
        answer:
          choiceId: a
        hint: The radius must start at zero, reach a maximum, and return to zero.
        explanation: |
          On $[0,\pi/6]$, the radius is nonnegative, reaches $6$ at $\theta=\pi/12$, and returns to zero. The interval $[0,\pi/12]$ traces only half the leaf.

      - id: rose-leaf-area-setup
        title: Apply the polar area formula
        instruction: |
          Use

          $$
          A=\frac12\int_\alpha^\beta r^2\,d\theta.
          $$

          Substituting $r=6\sin(6\theta)$ and the one-leaf bounds gives

          $$
          A
          =\frac12\int_0^{\pi/6}36\sin^2(6\theta)\,d\theta
          =18\int_0^{\pi/6}\sin^2(6\theta)\,d\theta.
          $$
        type: symbolicResponse
        prompt: Enter the integrand after incorporating the polar factor $\frac12$.
        answer:
          expectedLatex: '18\sin^2(6\theta)'
          equivalenceMode: expression
          variables:
            - theta
          tolerance: 0.000001
        hint: Square the entire radius, including the coefficient 6.
        explanation: |
          Squaring gives $36\sin^2(6\theta)$, and the polar area factor reduces the coefficient to $18$.

      - id: rose-leaf-power-reduction
        title: Reduce the squared sine
        instruction: |
          Direct substitution does not remove $\sin^2(6\theta)$. Use

          $$
          \sin^2u=\frac{1-\cos(2u)}{2}
          $$

          with $u=6\theta$:

          $$
          18\sin^2(6\theta)
          =9\left(1-\cos(12\theta)\right).
          $$
        type: multipleChoice
        prompt: Why does the cosine argument become $12\theta$?
        choices:
          - id: a
            text: 'The power-reduction identity uses $\cos(2u)$, and $u=6\theta$.'
          - id: b
            text: The rose has 12 leaves.
          - id: c
            text: Squaring always doubles every coefficient.
          - id: d
            text: The bounds are doubled.
        answer:
          choiceId: a
        hint: Distinguish the identity's doubled angle from the geometric leaf count.
        explanation: |
          The doubled angle comes algebraically from $\cos(2u)$:

          $$
          2u=2(6\theta)=12\theta.
          $$

          Its agreement with the 12-leaf count is a useful pattern, not the reason for the substitution.

      - id: rose-leaf-antiderivative
        title: Integrate the reduced expression
        instruction: |
          Integrate:

          $$
          \int9(1-\cos12\theta)\,d\theta
          =9\theta-\frac34\sin12\theta.
          $$

          The coefficient $3/4$ is $9/12$.
        type: symbolicResponse
        prompt: Enter an antiderivative of $9(1-\cos12\theta)$.
        answer:
          expectedLatex: '9\theta-\frac34\sin(12\theta)'
          equivalenceMode: derivative
          variables:
            - theta
          tolerance: 0.000001
        hint: Integrating $\cos(12\theta)$ introduces a factor of $1/12$.
        explanation: |
          Differentiation verifies

          $$
          \frac{d}{d\theta}
          \left(9\theta-\frac34\sin12\theta\right)
          =9-9\cos12\theta.
          $$

      - id: rose-leaf-evaluate
        title: Evaluate at the pole crossings
        instruction: |
          Apply the bounds:

          $$
          A=
          \left[
          9\theta-\frac34\sin12\theta
          \right]_0^{\pi/6}.
          $$

          Since $\sin(2\pi)=\sin0=0$,

          $$
          A=9\left(\frac{\pi}{6}\right)=\frac{3\pi}{2}.
          $$
        type: symbolicResponse
        prompt: Enter the exact area of one leaf.
        answer:
          expectedLatex: '\frac{3\pi}{2}'
          equivalenceMode: expression
          variables: []
          tolerance: 0.000001
        hint: The sine boundary terms vanish.
        explanation: |
          The exact one-leaf area is

          $$
          \boxed{\frac{3\pi}{2}}.
          $$

          It is an area, so the result is measured in square units.

      - id: rose-leaf-no-multiplier
        title: Keep one leaf distinct from total rose area
        instruction: |
          The chosen interval already traces one whole leaf. Multiplying by 12 would answer a different question: the total area of all leaves.
        type: selectAll
        prompt: Which checks support the one-leaf answer?
        choices:
          - id: starts
            text: The radius is zero at both endpoints.
          - id: maximum
            text: 'The interval contains the maximum radius at $\theta=\pi/12$.'
          - id: nonnegative
            text: The radius remains nonnegative between the endpoints.
          - id: multiply
            text: The integral must be multiplied by 12.
        answer:
          choiceIds: [starts, maximum, nonnegative]
        hint: Sketch how the radius changes from 0 to 6 and back to 0.
        explanation: |
          Those three checks establish that $[0,\pi/6]$ traces one leaf exactly once. No multiplier belongs in the requested answer.

          Related topic: selecting non-retracing bounds for polar area.

      - id: rose-leaf-synthesis
        title: State the complete method
        instruction: |
          The durable pattern for rose-leaf area is:

          1. Find consecutive zeros of $r$.
          2. Verify the interval contains one radius maximum.
          3. Apply $\frac12\int r^2\,d\theta$.
          4. Use power reduction on the squared trigonometric function.
          5. Do not multiply unless total rose area is requested.
        type: freeResponse
        prompt: Explain why $[0,\pi/6]$ is the correct interval and state the exact one-leaf area.
        answer:
          expected: 'The radius is zero at 0 and pi/6, positive between them, and reaches its maximum at pi/12, so the interval traces one leaf exactly once. Its area is 3pi/2.'
          gradingMode: selfCheck
          keyPoints:
            - Consecutive zeros occur at $0$ and $\pi/6$.
            - The maximum radius occurs at $\pi/12$.
            - The exact area is $3\pi/2$.
        hint: Describe the tracing behavior, not only the integral calculation.
        explanation: |
          The complete result is

          $$
          \boxed{
          A_{\text{one leaf}}
          =\frac12\int_0^{\pi/6}
          \left(6\sin6\theta\right)^2\,d\theta
          =\frac{3\pi}{2}
          }.
          $$

          Related topics: rose curves, polar tracing intervals, polar area, and power-reduction identities.
