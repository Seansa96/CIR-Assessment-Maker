glossary:
  introduction: 'Use these terms to connect measured concentration changes to molecular explanations of rate.'
  sections:
    - id: rates-and-laws
      title: Rates and experimental laws
      entries:
        - id: rate
          term: reaction rate
          definition: 'A concentration change per unit time, reported with a positive sign for a physical rate.'
          drills: [{ id: rate-d, type: flashcard, prompt: 'What quantity does reaction rate measure?', answer: { expected: 'concentration change per unit time' }, explanation: 'Solution: Concentration change per unit time. Why it works: Rate connects an observed amount change to elapsed time.' }]
        - id: average-rate
          term: average rate
          definition: 'The concentration change over a finite time interval divided by that interval.'
          drills: [{ id: average-rate-d, type: flashcard, prompt: 'How does an average rate differ from an instantaneous rate?', answer: { expected: 'it uses a finite time interval' }, explanation: 'Solution: It uses a finite time interval. Why it works: An average is a secant-style change, not a single-time limit.' }]
        - id: rate-law
          term: rate law
          definition: 'An experimentally determined relation between rate, a rate constant, and reactant concentrations.'
          drills: [{ id: rate-law-d, type: flashcard, prompt: 'Where do rate-law exponents come from?', answer: { expected: 'experiment' }, explanation: 'Solution: Experiment. Why it works: Overall reaction coefficients do not usually determine a measured rate law.' }]
        - id: rate-constant
          term: rate constant
          definition: 'The proportionality constant in a rate law at a specified temperature and reaction condition.'
          drills: [{ id: rate-constant-d, type: flashcard, prompt: 'Which condition commonly changes a rate constant?', answer: { expected: 'temperature' }, explanation: 'Solution: Temperature. Why it works: Temperature changes the distribution of molecular energies and therefore k.' }]
        - id: reaction-order
          term: reaction order
          definition: 'The exponent on a concentration in a rate law; the total order is the sum of the exponents.'
          drills: [{ id: order-d, type: flashcard, prompt: 'For rate = k[A]^2[B], what is the total order?', answer: { expected: '3', aliases: ['third order'] }, explanation: 'Solution: 3. Why it works: Add the experimental exponents 2 and 1.' }]
        - id: initial-rates
          term: method of initial rates
          definition: 'A method that compares rates near the start of trials in which selected initial concentrations differ.'
          drills: [{ id: initial-rates-d, type: flashcard, prompt: 'What is held fixed when isolating the order in one reactant?', answer: { expected: 'the concentrations of the other reactants' }, explanation: 'Solution: The other reactant concentrations. Why it works: A controlled comparison attributes the rate factor to one changed concentration.' }]
        - id: integrated-law
          term: integrated rate law
          definition: 'A relation that gives concentration as a function of time for a specified reaction order.'
          drills: [{ id: integrated-law-d, type: flashcard, prompt: 'What two variables are connected by an integrated rate law?', answer: { expected: 'concentration and time' }, explanation: 'Solution: Concentration and time. Why it works: The integrated form describes a reaction progress curve.' }]
    - id: time-and-mechanism
      title: Time models and molecular pathways
      entries:
        - id: half-life
          term: half-life
          definition: 'The time required for a reactant concentration to fall to one-half of its current value.'
          drills: [{ id: half-life-d, type: flashcard, prompt: 'For a first-order reaction, does half-life depend on starting concentration?', answer: { expected: 'no' }, explanation: 'Solution: No. Why it works: First-order half-life is 0.693/k, so concentration is absent.' }]
        - id: activation-energy
          term: activation energy
          definition: 'The minimum energy barrier that reactant particles must overcome along a reaction pathway.'
          drills: [{ id: activation-energy-d, type: flashcard, prompt: 'What must a productive collision overcome?', answer: { expected: 'activation energy' }, explanation: 'Solution: Activation energy. Why it works: Collisions below the barrier cannot follow the reaction path.' }]
        - id: collision-theory
          term: collision theory
          definition: 'A model in which reaction requires collisions with sufficient energy and suitable orientation.'
          drills: [{ id: collision-d, type: flashcard, prompt: 'Name the two collision-theory requirements for reaction.', answer: { expected: 'sufficient energy and suitable orientation' }, explanation: 'Solution: Sufficient energy and suitable orientation. Why it works: Frequency alone does not make every collision productive.' }]
        - id: elementary-step
          term: elementary step
          definition: 'One molecular event in a proposed reaction mechanism.'
          drills: [{ id: step-d, type: flashcard, prompt: 'What does an elementary step represent?', answer: { expected: 'one molecular event' }, explanation: 'Solution: One molecular event. Why it works: Mechanisms break an overall reaction into molecular events.' }]
        - id: intermediate
          term: reaction intermediate
          definition: 'A species formed in one mechanism step and consumed in a later step, absent from the net equation.'
          drills: [{ id: intermediate-d, type: flashcard, prompt: 'Is an intermediate present in the net reaction equation?', answer: { expected: 'no' }, explanation: 'Solution: No. Why it works: It cancels when the elementary steps are added.' }]
        - id: rate-determining
          term: rate-determining step
          definition: 'The slow mechanism step that limits the overall reaction rate in a simple mechanism model.'
          drills: [{ id: rds-d, type: flashcard, prompt: 'Which step limits a simple multistep reaction rate?', answer: { expected: 'the slow step', aliases: ['rate-determining step'] }, explanation: 'Solution: The slow step. Why it works: Material cannot pass through a pathway faster than its bottleneck.' }]
        - id: catalyst
          term: catalyst
          definition: 'A substance regenerated during reaction that offers a lower-activation-energy pathway.'
          drills: [{ id: catalyst-d, type: flashcard, prompt: 'What does a catalyst change in a reaction-coordinate model?', answer: { expected: 'the activation-energy pathway' }, explanation: 'Solution: The activation-energy pathway. Why it works: It changes kinetics without being consumed in the net reaction.' }]
        - id: arrhenius
          term: Arrhenius relationship
          definition: 'The temperature dependence of k, commonly modeled as k = A exp(-Ea/RT).'
          drills: [{ id: arrhenius-d, type: flashcard, prompt: 'As temperature rises, what usually happens to k?', answer: { expected: 'it increases' }, explanation: 'Solution: It increases. Why it works: A larger fraction of molecules can cross the activation barrier.' }]
