questions:
- id: q001
  type: numericResponse
  prompt: |
    Calculate the escape velocity from the surface of a spherical asteroid with mass $M = 1.0 \times 10^{20} \text{ kg}$ and radius $R = 2.0 \times 10^5 \text{ m}$.
    Use $G = 6.67 \times 10^{-11} \text{ N m}^2/\text{kg}^2$. Enter your answer in m/s.
  answer:
    value: 258.3
    tolerance: 1.0
  explanation: |
    Solution:
    $v_{esc} = \sqrt{\frac{2GM}{R}} = \sqrt{\frac{2(6.67 \times 10^{-11})(1.0 \times 10^{20})}{2.0 \times 10^5}} = \sqrt{66700} \approx 258.3 \text{ m/s}$.
    
    Why it works:
    The escape velocity formula derived from energy conservation is a direct calculation depending only on the mass and radius of the body.
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
- id: q002
  type: multipleChoice
  prompt: |
    A heavy probe and a light satellite are launched from the same planet. How do their escape velocities compare?
  choices:
  - id: a
    text: 'The heavy probe requires a higher escape velocity.'
  - id: b
    text: 'The light satellite requires a higher escape velocity.'
  - id: c
    text: 'They both require the exact same escape velocity.'
  - id: d
    text: 'It depends on their shapes due to gravity.'
  answer:
    choiceId: c
  explanation: |
    Solution:
    They both require the exact same escape velocity.
    
    Why it works:
    The expression for escape velocity, $v_{esc} = \sqrt{2GM/R}$, does not contain the mass $m$ of the escaping object.
    
    Why the other choices fail:
    While the heavy probe requires more *kinetic energy*, that larger energy requirement exactly matches its larger mass in the $1/2mv^2$ equation, resulting in identical required velocities.
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
