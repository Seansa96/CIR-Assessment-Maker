questions:
  - { id: q001, type: multipleChoice, prompt: 'For $x=t^2$, what is dx?', choices: [{ id: a, text: '$2t\,dt$' }, { id: b, text: '$t^2dt$' }, { id: c, text: dt }, { id: d, text: '$2dt$' }], answer: { choiceId: a }, explanation: 'Solution: Differentiate x to get dx/dt equals 2t. Why it works: dx equals x-prime dt. Common trap: Using x itself. Why the other choices fail: They omit or miscompute the derivative.', difficultyDimensions: [auxiliaryTechnique, simplification], difficultyEvidence: 'Converts a coordinate to its parameter differential.' , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q002, type: multipleChoice, prompt: 'What is the speed for $x=5t,y=12t$?', choices: [{ id: a, text: 13 }, { id: b, text: 17 }, { id: c, text: 60 }, { id: d, text: 7 }], answer: { choiceId: a }, explanation: 'Solution: $\sqrt{5^2+12^2}=13$. Why it works: Speed is velocity magnitude. Common trap: Adding components. Why the other choices fail: They add, multiply, or use an unrelated difference.', difficultyDimensions: [modelOrDerivation, simplification], difficultyEvidence: 'Forms speed from two component rates and applies the Pythagorean relation.' , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q003, type: multipleChoice, prompt: 'Find the length of $x=3t,y=4t$ on $0\le t\le1$.', choices: [{ id: a, text: 5 }, { id: b, text: 7 }, { id: c, text: 25 }, { id: d, text: 1 }], answer: { choiceId: a }, explanation: 'Solution: Speed is 5, so length is $\int_0^15dt=5$. Why it works: Arc length integrates speed. Common trap: Reporting speed squared. Why the other choices fail: They add, square, or omit speed.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Builds speed then integrates over the parameter interval.' , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q004, type: multipleChoice, prompt: 'For $x=\cos t,y=\sin t$, what is speed?', choices: [{ id: a, text: 1 }, { id: b, text: '$\sin t+\cos t$' }, { id: c, text: 0 }, { id: d, text: t }], answer: { choiceId: a }, explanation: 'Solution: Speed is $\sqrt{\sin^2t+\cos^2t}=1$. Why it works: Use the Pythagorean identity. Common trap: Adding trig functions. Why the other choices fail: They do not equal the velocity magnitude.', difficultyDimensions: [identityConstruction, modelOrDerivation], difficultyEvidence: 'Uses a trigonometric identity inside the speed model.' , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q005, type: multipleChoice, prompt: 'What does tracing a closed curve twice do to a directed boundary integral?', choices: [{ id: a, text: doubles it }, { id: b, text: leaves it unchanged }, { id: c, text: makes it undefined }, { id: d, text: makes it negative automatically }], answer: { choiceId: a }, explanation: 'Solution: The path contribution is accumulated on each traversal, so it doubles. Why it works: Directed integrals depend on path multiplicity. Common trap: Looking only at the enclosed region. Why the other choices fail: The second traversal is valid and has the same orientation.', difficultyDimensions: [globalLocalReasoning, representationTransfer], difficultyEvidence: 'Distinguishes a repeated path from its unchanged geometric locus.' , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q006, type: multipleChoice, prompt: 'On $-1\le t\le1$, $\sqrt{t^2}$ must be written as:', choices: [{ id: a, text: '$|t|$' }, { id: b, text: t }, { id: c, text: '$t^2$' }, { id: d, text: '$-t$' }], answer: { choiceId: a }, explanation: 'Solution: The principal square root is nonnegative, so it is absolute t. Why it works: The interval includes both signs. Common trap: Writing t without a sign check. Why the other choices fail: They fail on one side of zero.', difficultyDimensions: [domainCondition, simplification], difficultyEvidence: 'Simplifies a radical using its domain and sign condition.' , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q007, type: multipleChoice, prompt: 'For a counterclockwise closed curve traced once, which formula can compute area?', choices: [{ id: a, text: '$A=-\int y\,dx$' }, { id: b, text: '$A=\int dy/dx$' }, { id: c, text: '$A=\int ds$' }, { id: d, text: '$A=\int x+y$' }], answer: { choiceId: a }, explanation: 'Solution: The directed closed-boundary formula is $A=-\int ydx$ for counterclockwise orientation. Why it works: It converts boundary motion to enclosed area. Common trap: Using arc length. Why the other choices fail: They do not measure enclosed area.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Selects the correct integral model from competing geometric quantities.' , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q008, type: multipleChoice, prompt: 'Which quantity is always nonnegative?', choices: [{ id: a, text: arc length }, { id: b, text: directed $\int ydx$ }, { id: c, text: dx }, { id: d, text: slope }], answer: { choiceId: a }, explanation: 'Solution: Arc length is accumulated speed and is nonnegative. Why it works: Speed is a magnitude. Common trap: Assuming every integral is nonnegative. Why the other choices fail: Each can have sign depending on direction or local behavior.', difficultyDimensions: [representationTransfer, proofJustification], difficultyEvidence: 'Distinguishes a magnitude-based accumulation from signed quantities.' , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q009, type: freeResponse, prompt: 'Set up the area under $x=t,y=t^2$ on $0\le t\le2$.', answer: { gradingMode: selfCheck, keyPoints: ['integral zero to two t squared dt', 'dx dt equals one'] }, explanation: 'Solution: Since dx/dt equals 1, $A=\int_0^2t^2dt$. Why it works: Area under the path uses y dx with parameter bounds. Common trap: Omitting dx/dt without checking it equals one.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Converts an area differential and carries through parameter bounds.' , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q010, type: multipleChoice, prompt: '![One trace](/media/calculus/parametric-review-trace.svg) Which bounds principle avoids duplicate path contribution?', choices: [{ id: a, text: trace the intended arch once }, { id: b, text: use the largest available interval }, { id: c, text: always use 0 to 2 pi }, { id: d, text: ignore endpoints }], answer: { choiceId: a }, explanation: 'Solution: Use the interval that traces the intended piece once. Why it works: Bounds define the actual accumulated path. Common trap: Using a full period automatically. Why the other choices fail: They can retrace or omit path information.', difficultyDimensions: [domainCondition, modelOrDerivation], difficultyEvidence: 'Selects a path interval based on geometric tracing.' , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
