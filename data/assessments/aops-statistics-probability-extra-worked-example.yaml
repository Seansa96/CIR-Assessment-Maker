workedExamples:
- id: aops-prob-ext-1
  title: Expected Value of a Game
  prompt: 'A carnival game involves spinning a wheel with 10 equal-sized sectors. 5 sectors are red, 3 are blue, 1 is green, and 1 is gold. If you land on red, you lose $2. If you land on blue, you win $1. If you land on green, you win $5. If you land on gold, you win $10. What is the expected value of one spin?'
  steps:
  - id: aops-prob-ext-1-s1
    title: Determine the probability and payout for each outcome
    prompt: 'List the four possible colors, their probabilities, and their corresponding numerical payouts.'
    difficultyDimensions:
    - Probabilities: Red $= 5/10$, Blue $= 3/10$, Green $= 1/10$, Gold $= 1/10$.
    - Payouts: Red $= -2$, Blue $= 1$, Green $= 5$, Gold $= 10$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Red: $P = 0.5$, value $= -2$.
      - Blue: $P = 0.3$, value $= 1$.
      - Green: $P = 0.1$, value $= 5$.
      - Gold: $P = 0.1$, value $= 10$.
    explanation: |
      Solution:
      Since the 10 sectors are equal in size, the probability of landing on a color is just the number of sectors of that color divided by 10.
      - **Red**: $5/10$ chance. A loss of $\$2$ is a payout of $-2$.
      - **Blue**: $3/10$ chance. A win of $\$1$ is a payout of $+1$.
      - **Green**: $1/10$ chance. A win of $\$5$ is a payout of $+5$.
      - **Gold**: $1/10$ chance. A win of $\$10$ is a payout of $+10$.

      Why it works:
      Expected value is a weighted average. To compute it, we first need to explicitly pair every possible outcome's probability with its numerical value. Losses must be represented as negative numbers.
  - id: aops-prob-ext-1-s2
    title: Compute the expected value
    prompt: 'Multiply each payout by its probability and sum the results to find the expected value.'
    difficultyDimensions:
    - Multiply: $(-2)(0.5) + (1)(0.3) + (5)(0.1) + (10)(0.1)$.
    - Sum: $-1.0 + 0.3 + 0.5 + 1.0$.
    - Result: $0.8$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $E[X] = (-2)(0.5) + (1)(0.3) + (5)(0.1) + (10)(0.1)$.
      - $E[X] = -1.0 + 0.3 + 0.5 + 1.0 = 0.8$.
      - The expected value is $\$0.80$.
    explanation: |
      Solution:
      The expected value $E[X]$ is the sum of (Probability $\times$ Payout) for all outcomes:
      $$E[X] = (-2)\left(\frac{5}{10}\right) + (1)\left(\frac{3}{10}\right) + (5)\left(\frac{1}{10}\right) + (10)\left(\frac{1}{10}\right)$$
      $$E[X] = -1.0 + 0.3 + 0.5 + 1.0$$
      $$E[X] = 0.8$$
      The expected value of one spin is $\$0.80$.

      Why it works:
      The expected value represents the average amount of money you would win (or lose) per game if you played the game an infinite number of times. Even though it's impossible to win exactly $\$0.80$ on a single spin, playing the game 1,000 times would net you roughly $\$800$. Since the expected value is positive, the game favors the player.

- id: aops-prob-ext-2
  title: Conditional Probability (False Positives)
  prompt: 'A rare disease affects 1% of the population. A test for the disease is 90% accurate (it correctly identifies 90% of sick people as sick, and 90% of healthy people as healthy). If a randomly selected person tests positive, what is the probability they actually have the disease?'
  steps:
  - id: aops-prob-ext-2-s1
    title: Calculate the probability of a true positive
    prompt: 'Find the probability that a randomly chosen person is BOTH sick AND tests positive.'
    difficultyDimensions:
    - $P(\text{Sick}) = 0.01$.
    - $P(\text{Positive} \mid \text{Sick}) = 0.90$.
    - Multiply to find the joint probability: $0.01 \times 0.90 = 0.009$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $P(\text{Sick}) = 0.01$.
      - $P(\text{Test Positive given Sick}) = 0.90$.
      - $P(\text{True Positive}) = 0.01 \times 0.90 = 0.009$.
    explanation: |
      Solution:
      First, the chance a random person has the disease is $1\%$, or $0.01$.
      If they have the disease, the test correctly identifies them $90\%$ of the time ($0.90$).
      The probability that a person is sick AND tests positive is:
      $$P(\text{Sick} \cap \text{Positive}) = P(\text{Sick}) \times P(\text{Positive} \mid \text{Sick})$$
      $$0.01 \times 0.90 = 0.009$$

      Why it works:
      This is an application of the multiplication rule for dependent events. We are traversing the "Sick" branch of a probability tree, followed by the "Tests Positive" sub-branch.
  - id: aops-prob-ext-2-s2
    title: Calculate the probability of a false positive
    prompt: 'Find the probability that a randomly chosen person is BOTH healthy AND tests positive.'
    difficultyDimensions:
    - $P(\text{Healthy}) = 1 - 0.01 = 0.99$.
    - $P(\text{Positive} \mid \text{Healthy}) = 1 - 0.90 = 0.10$.
    - Multiply: $0.99 \times 0.10 = 0.099$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $P(\text{Healthy}) = 0.99$.
      - $P(\text{Test Positive given Healthy}) = 0.10$ (the $10\%$ error rate).
      - $P(\text{False Positive}) = 0.99 \times 0.10 = 0.099$.
    explanation: |
      Solution:
      The chance a random person is healthy is $99\%$, or $0.99$.
      If they are healthy, the test is $90\%$ accurate, meaning it has a $10\%$ error rate. It will falsely test positive $10\%$ of the time ($0.10$).
      The probability that a person is healthy AND tests positive is:
      $$P(\text{Healthy} \cap \text{Positive}) = P(\text{Healthy}) \times P(\text{Positive} \mid \text{Healthy})$$
      $$0.99 \times 0.10 = 0.099$$

      Why it works:
      This is the "Healthy" branch of the probability tree, followed by the "Tests Positive" error sub-branch. Because there are so many more healthy people than sick people ($99\%$ vs $1\%$), even a small $10\%$ error rate produces a surprisingly large number of false positives.
  - id: aops-prob-ext-2-s3
    title: Apply Bayes' Theorem
    prompt: 'Given that the person tested positive, use the results of step 1 and step 2 to find the probability they are actually sick.'
    difficultyDimensions:
    - Find the total probability of testing positive: $0.009 + 0.099 = 0.108$.
    - Divide the true positives by the total positives: $0.009 / 0.108$.
    - Simplify the fraction: $1/12 \approx 8.3\%$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Total positive tests $= 0.009 + 0.099 = 0.108$.
      - $P(\text{Sick} \mid \text{Positive}) = \frac{\text{True Positives}}{\text{Total Positives}}$.
      - $0.009 / 0.108 = 9 / 108 = 1/12$.
    explanation: |
      Solution:
      The person tested positive. This means they are in one of two groups: True Positives ($0.009$) or False Positives ($0.099$).
      The total probability of testing positive is:
      $$P(\text{Positive}) = 0.009 + 0.099 = 0.108$$
      The probability they are actually sick, *given* that they tested positive, is the ratio of True Positives to Total Positives:
      $$P(\text{Sick} \mid \text{Positive}) = \frac{0.009}{0.108} = \frac{9}{108} = \frac{1}{12} \approx 8.3\%$$

      Why it works:
      This is Bayes' Theorem in action: $P(A \mid B) = \frac{P(A \cap B)}{P(B)}$. Despite the test being "90% accurate," a positive result only means an 8.3% chance of actually having the disease. The base rate fallacy occurs when people ignore the extreme rarity of the disease ($1\%$) which floods the results with false positives.

- id: aops-prob-ext-3
  title: Dependent Events (Drawing Without Replacement)
  prompt: 'A bag contains 5 red marbles and 7 blue marbles. You draw two marbles from the bag without replacement. What is the probability that you draw exactly one red marble and one blue marble?'
  steps:
  - id: aops-prob-ext-3-s1
    title: Calculate the probability of drawing Red then Blue
    prompt: 'Find the probability of drawing a red marble first, and then a blue marble second.'
    difficultyDimensions:
    - $P(\text{Red first}) = 5/12$.
    - $P(\text{Blue second}) = 7/11$ (the total number of marbles decreased).
    - Multiply: $(5/12) \times (7/11) = 35/132$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - First draw (Red): $5/12$.
      - Second draw (Blue): $7/11$ (11 marbles left).
      - $P(\text{Red, then Blue}) = \frac{5}{12} \times \frac{7}{11} = \frac{35}{132}$.
    explanation: |
      Solution:
      The bag starts with 12 marbles total.
      The probability of drawing a red marble on the first draw is $\frac{5}{12}$.
      Because we do not replace the marble, the bag now contains 11 marbles (4 red, 7 blue).
      The probability of drawing a blue marble on the second draw is $\frac{7}{11}$.
      The probability of this specific sequence is:
      $$\frac{5}{12} \times \frac{7}{11} = \frac{35}{132}$$

      Why it works:
      Drawing without replacement makes the second event *dependent* on the first. The denominator must decrease to 11 to reflect the new state of the bag.
  - id: aops-prob-ext-3-s2
    title: Calculate the probability of drawing Blue then Red
    prompt: 'Find the probability of the other valid sequence: drawing a blue marble first, and then a red marble second.'
    difficultyDimensions:
    - $P(\text{Blue first}) = 7/12$.
    - $P(\text{Red second}) = 5/11$.
    - Multiply: $(7/12) \times (5/11) = 35/132$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - First draw (Blue): $7/12$.
      - Second draw (Red): $5/11$ (11 marbles left).
      - $P(\text{Blue, then Red}) = \frac{7}{12} \times \frac{5}{11} = \frac{35}{132}$.
    explanation: |
      Solution:
      The bag starts with 12 marbles total.
      The probability of drawing a blue marble on the first draw is $\frac{7}{12}$.
      Because we do not replace the marble, the bag now contains 11 marbles (5 red, 6 blue).
      The probability of drawing a red marble on the second draw is $\frac{5}{11}$.
      The probability of this specific sequence is:
      $$\frac{7}{12} \times \frac{5}{11} = \frac{35}{132}$$

      Why it works:
      The probabilities change depending on what was drawn first, but notice that the numerators (7 and 5) and denominators (12 and 11) are identical to the previous step, just multiplied in a different order. The probability of any specific sequence of items is independent of the order they were drawn.
  - id: aops-prob-ext-3-s3
    title: Combine the disjoint events
    prompt: 'Add the probabilities of the two valid sequences to find the total probability of getting one of each color.'
    difficultyDimensions:
    - Add the two disjoint probabilities: $35/132 + 35/132$.
    - Simplify the fraction: $70/132 = 35/66$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Total probability $= P(\text{Red, then Blue}) + P(\text{Blue, then Red})$.
      - Total probability $= \frac{35}{132} + \frac{35}{132} = \frac{70}{132}$.
      - Simplified: $\frac{35}{66}$.
    explanation: |
      Solution:
      The problem asks for "exactly one red marble and one blue marble", but it doesn't specify the order. There are two disjoint ways this can happen: (Red, Blue) OR (Blue, Red).
      We add the probabilities of these two mutually exclusive events:
      $$P = \frac{35}{132} + \frac{35}{132} = \frac{70}{132}$$
      Dividing numerator and denominator by 2 simplifies the fraction:
      $$P = \frac{35}{66}$$

      Why it works:
      When calculating the probability of a combination of items where order doesn't matter, you must account for all the different permutations (orders) in which those items could be drawn. A common error is calculating only (Red, Blue) and forgetting that (Blue, Red) is a distinct sequence that satisfies the same condition.
