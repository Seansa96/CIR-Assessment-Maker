guidedProject:
  language: cpp
  instructions: "Build a small `GradeClassifier` class that takes an array of numeric\
    \ scores and calculates\rhow many students received each letter grade.\n\nRequired\
    \ behavior:\n- Create a class named exactly `GradeClassifier`.\n- Create a public\
    \ method `classifyGrades(int scores[], int size)` that returns `void`.\n- It must\
    \ iterate through the `scores` array.\n- Keep track of counts for A, B, C, D,\
    \ and F.\n  - A: >= 90\n  - B: 80-89\n  - C: 70-79\n  - D: 60-69\n  - F: < 60\n\
    - If a score is outside the valid 0-100 range, it should be ignored using a `continue`\
    \ statement.\n- Provide getters for the counts: `getA()`, `getB()`, `getC()`,\
    \ `getD()`, and `getF()`. All should return `int`.\n"
  files:
  - path: GradeClassifier.h
    readOnly: false
    content: "#pragma once\n\nclass GradeClassifier {\nprivate:\n    // Store counts\
      \ for A, B, C, D, F\n    int countA = 0;\n    int countB = 0;\n    int countC\
      \ = 0;\n    int countD = 0;\n    int countF = 0;\n\npublic:\n    void classifyGrades(int\
      \ scores[], int size) {\n        // Loop through the array\n        // Ignore\
      \ scores < 0 or > 100\n        // Increment appropriate counts\n    }\n    \n\
      \    int getA() const { return countA; }\n    int getB() const { return countB;\
      \ }\n    int getC() const { return countC; }\n    int getD() const { return\
      \ countD; }\n    int getF() const { return countF; }\n};\n"
  - path: ProjectNotes.md
    readOnly: true
    content: 'Required names:

      - `GradeClassifier`

      - `classifyGrades(int scores[], int size)`

      - `getA()`, `getB()`, `getC()`, `getD()`, `getF()`

      '
  requiredChecks:
  - id: basic-classification
    title: classifyGrades groups scores correctly
    description: Check if counts are correct for valid scores
    expectedOutputContains:
    - CLASSIFY_OK
    testCode: "#include \"GradeClassifier.h\"\n#include <iostream>\nusing namespace\
      \ std;\n\nint main() {\n    GradeClassifier gc;\n    int scores[] = {95, 82,\
      \ 75, 60, 45, 90};\n    gc.classifyGrades(scores, 6);\n    if (gc.getA() ==\
      \ 2 && gc.getB() == 1 && gc.getC() == 1 && gc.getD() == 1 && gc.getF() == 1)\
      \ {\n        cout << \"CLASSIFY_OK\";\n    } else {\n        cout << \"FAIL\"\
      ;\n    }\n    return 0;\n}\n"
  - id: handle-invalid
    title: classifyGrades ignores invalid scores
    description: Check if out-of-bounds scores (< 0 or > 100) are ignored
    expectedOutputContains:
    - IGNORE_OK
    testCode: "#include \"GradeClassifier.h\"\n#include <iostream>\nusing namespace\
      \ std;\n\nint main() {\n    GradeClassifier gc;\n    int scores[] = {105, -5,\
      \ 85, 200};\n    gc.classifyGrades(scores, 4);\n    if (gc.getA() == 0 && gc.getB()\
      \ == 1 && gc.getC() == 0 && gc.getD() == 0 && gc.getF() == 0) {\n        cout\
      \ << \"IGNORE_OK\";\n    } else {\n        cout << \"FAIL\";\n    }\n    return\
      \ 0;\n}\n"
