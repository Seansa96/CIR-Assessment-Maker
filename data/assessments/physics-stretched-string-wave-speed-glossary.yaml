    title: Core terms
    entries:
    - {id: linear-density, term: linear mass density, definition: 'Mass per length, $\mu=m/L$.', drills: [{id: linear-density-drill, type: typed, prompt: 'What is mass per unit length called?', answer: linear mass density}]}
    - {id: tension, term: tension, definition: 'The pulling force $F_T$ that provides the transverse restoring effect.', drills: [{id: tension-drill, type: cloze, prompt: 'String-wave speed increases with {{tension}}.', answer: tension}]}
    - {id: transverse-wave, term: transverse wave, definition: 'A wave whose displacement is perpendicular to propagation.', drills: [{id: transverse-wave-drill, type: typed, prompt: 'What type of wave travels along a plucked string?', answer: transverse wave}]}
