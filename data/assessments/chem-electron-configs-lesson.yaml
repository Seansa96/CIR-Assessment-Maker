lesson:
  introduction: |-
    An **electron configuration** is a shorthand notation that describes how electrons are distributed among the various orbitals of an atom. Understanding this distribution is crucial for predicting chemical bonds, reactivity, and electrical conductivity.
  sections:
  - id: section-1
    title: Fill Lower-Energy Orbitals First
    required: true
    content: |-
      The Aufbau principle fills the lowest-energy available subshell first. For the first 20 elements, the sequence is $1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p$. Each superscript records how many electrons occupy that subshell. For 11 electrons, the first ten fill through $2p^6$ and electron 11 begins $3s$.
    check:
      id: chem-config-check-1
      type: multipleChoice
      prompt: |-
        A neutral atom has 11 electrons. After filling $1s^2 2s^2 2p^6$, which subshell receives electron 11?
      choices:
      - id: a
        text: $3s$
        issueSignals: []
      - id: b
        text: $3p$
        issueSignals:
        - id: electron-configuration-hunds-rule-error
          domains:
          - chemistry
      - id: c
        text: $2d$
        issueSignals:
        - id: electron-configuration-hunds-rule-error
          domains:
          - chemistry
      - id: d
        text: $4s$
        issueSignals:
        - id: electron-configuration-hunds-rule-error
          domains:
          - chemistry
      answer:
        choiceId: a
      explanation: |-
        How to Solve: The written configuration accounts for ten electrons. Follow the Aufbau sequence after $2p$; the next available subshell is $3s$, so electron 11 enters $3s$.
  - id: section-2
    title: Apply the Pauli Exclusion Principle
    required: true
    content: |-
      The Pauli exclusion principle says no two electrons in an atom can share all four quantum numbers. Within one orbital, $n$, $l$, and $m_l$ are the same, so at most two electrons fit there; their spins must be opposite, $m_s=+\frac12$ and $m_s=-\frac12$.
    check:
      id: chem-config-check-2
      type: multipleChoice
      prompt: |-
        An orbital already contains an electron with $m_s=+\frac12$. Which spin can a second electron in that same orbital have?
      choices:
      - id: a
        text: $+\frac12$
        issueSignals:
        - id: electron-configuration-valence-shell-error
          domains:
          - chemistry
      - id: b
        text: $-\frac12$
        issueSignals: []
      - id: c
        text: $+1$
        issueSignals:
        - id: electron-configuration-valence-shell-error
          domains:
          - chemistry
      - id: d
        text: Either spin, including a duplicate
        issueSignals:
        - id: electron-configuration-valence-shell-error
          domains:
          - chemistry
      answer:
        choiceId: b
      explanation: |-
        How to Solve: Both electrons in this orbital already share $n$, $l$, and $m_l$. The Pauli rule requires different complete quantum-number sets, so the second electron must have the opposite allowed spin, $-\frac12$.
  - id: section-3
    title: Distribute Electrons by Hund’s Rule
    required: true
    content: |-
      The three $p$ orbitals have equal energy. Hund’s rule places one electron in each orbital with parallel spins before any orbital receives a second electron. This produces the greatest number of unpaired electrons at this stage.
    check:
      id: section-3-check
      type: multipleChoice
      prompt: |-
        Nitrogen has three electrons in its $2p$ subshell. Which orbital filling follows Hund’s rule?
      choices:
      - id: a
        text: One electron in each of the three $2p$ orbitals, with parallel spins
        issueSignals: []
      - id: b
        text: Two electrons in one $2p$ orbital and one in another
        issueSignals:
        - id: electron-configuration-hunds-rule-error
          domains:
          - chemistry
      - id: c
        text: All three electrons paired in one $2p$ orbital
        issueSignals:
        - id: electron-configuration-hunds-rule-error
          domains:
          - chemistry
      - id: d
        text: One electron in $2p$ and two in $3s$
        issueSignals:
        - id: electron-configuration-hunds-rule-error
          domains:
          - chemistry
      answer:
        choiceId: a
      explanation: |-
        How to Solve: The three $2p$ orbitals are degenerate and there are exactly three electrons to place. Put one electron in each orbital before pairing; Hund’s rule aligns their spins.
  - id: section-4
    title: Count Orbitals and Subshell Capacity
    required: true
    content: |-
      For angular-momentum quantum number $l$, the magnetic values run from $-l$ through $+l$, giving $2l+1$ orbitals. Each orbital holds two electrons, so an $s$ subshell holds 2, $p$ holds 6, $d$ holds 10, and $f$ holds 14.
    check:
      id: section-4-check
      type: multipleChoice
      prompt: |-
        A $d$ subshell has $l=2$. How many electrons can it hold at most?
      choices:
      - id: a
        text: 5, because $m_l$ has five allowed values
        issueSignals:
        - id: electron-configuration-subshell-capacity-error
          domains:
          - chemistry
      - id: b
        text: 10, because five orbitals hold two electrons each
        issueSignals: []
      - id: c
        text: 4, because $l=2$ means two orbitals
        issueSignals:
        - id: electron-configuration-subshell-capacity-error
          domains:
          - chemistry
      - id: d
        text: 14, because all subshells hold the same number
        issueSignals:
        - id: electron-configuration-subshell-capacity-error
          domains:
          - chemistry
      answer:
        choiceId: b
      explanation: |-
        How to Solve: For $l=2$, the allowed $m_l$ values are $-2,-1,0,1,2$, so there are five orbitals. Apply the Pauli limit of two electrons per orbital: $5\times2=10$.
  - id: section-5
    title: Build a Full Configuration from Electron Count
    required: true
    content: |-
      For a neutral atom, the atomic number gives its electron count. Fill subshells in order, respecting their capacities, and stop when the running total reaches that count. For chlorine ($Z=17$), the total is $2+2+6+2+5=17$.
    check:
      id: section-5-check
      type: multipleChoice
      prompt: |-
        A neutral chlorine atom has 17 electrons. Which configuration uses the filling order and totals 17?
      choices:
      - id: a
        text: $1s^2 2s^2 2p^6 3s^2 3p^5$
        issueSignals: []
      - id: b
        text: $1s^2 2s^2 2p^6 3s^2 3p^7$
        issueSignals:
        - id: electron-configuration-electron-count-error
          domains:
          - chemistry
      - id: c
        text: $1s^2 2s^2 2p^6 3s^1 3p^6$
        issueSignals:
        - id: electron-configuration-electron-count-error
          domains:
          - chemistry
      - id: d
        text: $1s^2 2s^2 2p^6 3s^2 3d^5$
        issueSignals:
        - id: electron-configuration-electron-count-error
          domains:
          - chemistry
      answer:
        choiceId: a
      explanation: |-
        How to Solve: Fill $1s^2$, $2s^2$, and $2p^6$ for 10 electrons, then $3s^2$ for 12. The remaining five electrons enter $3p$, giving 17 total and the listed configuration.
  - id: section-6
    title: Identify Valence Electrons
    required: true
    content: |-
      For main-group atoms, valence electrons occupy the highest principal shell, the largest $n$ appearing in the configuration. Count all electrons with that $n$; lower-$n$ electrons form the core.
    check:
      id: section-6-check
      type: multipleChoice
      prompt: |-
        For arsenic, $[\mathrm{Ar}]\,4s^2 3d^{10} 4p^3$, how many electrons are in the outermost shell?
      choices:
      - id: a
        text: '3'
        issueSignals:
        - id: electron-configuration-valence-shell-error
          domains:
          - chemistry
      - id: b
        text: '5'
        issueSignals: []
      - id: c
        text: '15'
        issueSignals:
        - id: electron-configuration-valence-shell-error
          domains:
          - chemistry
      - id: d
        text: '33'
        issueSignals:
        - id: electron-configuration-valence-shell-error
          domains:
          - chemistry
      answer:
        choiceId: b
      explanation: |-
        How to Solve: The highest principal quantum number is $n=4$. Count the $4s^2$ and $4p^3$ electrons: $2+3=5$. The $3d^{10}$ electrons have a lower $n$ and are not in the outermost shell.
  - id: section-7
    title: Adjust Configurations for Ions
    required: true
    content: |-
      When a transition metal forms a cation, remove electrons from the highest principal quantum number first. The $4s$ subshell fills before $3d$ in neutral atoms, but $4s$ electrons are removed before $3d$ electrons when forming cations.
    check:
      id: section-7-check
      type: multipleChoice
      prompt: |-
        Iron has neutral configuration $[\mathrm{Ar}]\,4s^2 3d^6$. Which configuration results after it loses two electrons?
      choices:
      - id: a
        text: $[\mathrm{Ar}]\,3d^6$
        issueSignals: []
      - id: b
        text: $[\mathrm{Ar}]\,4s^2 3d^4$
        issueSignals:
        - id: electron-configuration-cation-removal-error
          domains:
          - chemistry
      - id: c
        text: $[\mathrm{Ar}]\,4s^1 3d^5$
        issueSignals:
        - id: electron-configuration-cation-removal-error
          domains:
          - chemistry
      - id: d
        text: $[\mathrm{Ar}]\,4s^2 3d^6$
        issueSignals:
        - id: electron-configuration-cation-removal-error
          domains:
          - chemistry
      answer:
        choiceId: a
      explanation: |-
        How to Solve: The two electrons lost come from the subshell with the highest principal number, $4s$ ($n=4$), before the $3d$ electrons ($n=3$). Removing both leaves $[\mathrm{Ar}]\,3d^6$.
