lesson:
  introduction: Learn to solve Sequences and Series problems by recognizing arithmetic series, geometric series, infinite series, sigma notation, sequences and means and justifying each theorem or transformation.
  sections:
  - id: aops-sequences-series-motivation
    title: What the topic helps you notice
    required: true
    content: Sequences and Series is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are arithmetic series, geometric series, infinite series, sigma notation, sequences and means.
    check:
      id: aops-sequences-series-motivation-check
      type: multipleChoice
      prompt: In Sequences and Series, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-sequences-series-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-sequences-series-definitions-check
      type: multipleChoice
      prompt: In Sequences and Series, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-sequences-series-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: identify common difference or ratio, sum finite series, test infinite geometric convergence. Record the givens, unknown, and any restriction before selecting a method.'
    check:
      id: aops-sequences-series-recognition-check
      type: multipleChoice
      prompt: In Sequences and Series, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-sequences-series-method
    title: Choose a method
    required: true
    content: Choose the shortest valid route from the givens to the target. Explain why the condition for the chosen method is satisfied.
    check:
      id: aops-sequences-series-method-check
      type: multipleChoice
      prompt: In Sequences and Series, what should be checked before applying a method?
