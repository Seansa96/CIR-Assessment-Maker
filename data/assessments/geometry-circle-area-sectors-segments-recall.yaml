items:
- id: item-sector-area
  type: symbolic
  prompt: 'Write the formula for the area of a circular sector, given the radius $r$ and the central angle $\theta$ in degrees.'
  answer:
    expectedLatex: '\frac{\theta}{360}\pi r^2'
    equivalenceMode: expression
    variables:
    - r
    - \theta
  skills:
  - geometry-circle-area-sectors-segments
- id: item-arc-length
  type: symbolic
  prompt: 'Write the formula for the length of an arc, given the radius $r$ and the central angle $\theta$ in degrees.'
  answer:
    expectedLatex: '\frac{\theta}{360}2\pi r'
    equivalenceMode: expression
    variables:
    - r
    - \theta
  skills:
  - geometry-circle-area-sectors-segments
- id: item-segment-area-definition
  type: flashcard
  prompt: 'How do you calculate the area of a minor circular segment?'
  answer:
    expected: 'Subtract the area of the triangle (formed by the two radii and the chord) from the area of the sector.'
    aliases:
    - 'Area of Sector minus Area of Triangle'
    - 'Sector Area - Triangle Area'
  skills:
  - geometry-circle-area-sectors-segments
