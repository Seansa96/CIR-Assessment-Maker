- id: area-hard-implicit-abs
  title: Implicit Absolute Value Shape
  type: symbolicResponse
  prompt: |
    Find the exact area enclosed by the relation $|x| + |y| = 3$.
  answer:
    gradingMode: auto
    expectedLatex: 18
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. This relation forms a square rotated 45 degrees, centered at the origin, with vertices at $(3,0), (0,3), (-3,0), (0,-3)$.
    2. By symmetry, the area is 4 times the area of the triangle in the first quadrant.
    3. In quadrant 1, $x \ge 0, y \ge 0$, so the equation is $x + y = 3 \implies y = 3 - x$.
    4. Area of this triangle is $\int_0^3 (3 - x) \, dx = [3x - x^2/2]_0^3 = 9 - 9/2 = 4.5$.
    5. Total area = $4 \times 4.5 = 18$.
    6. Alternatively, it's a square with diagonals of length 6. Area = $\frac{1}{2} d_1 d_2 = \frac{1}{2}(6)(6) = 18$.
- id: area-hard-trig-squared
  title: Squared Trigonometric Functions
  type: symbolicResponse
  prompt: |
    Find the exact area of the region bounded by $y = \cos^2 x$ and $y = \sin^2 x$ between $x = 0$ and $x = \pi/4$.
  answer:
    gradingMode: auto
    expectedLatex: 1/2
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. On $[0, \pi/4]$, $\cos x \ge \sin x$, so $\cos^2 x \ge \sin^2 x$.
    2. Integral is $\int_0^{\pi/4} (\cos^2 x - \sin^2 x) \, dx$.
    3. Use the double angle identity: $\cos^2 x - \sin^2 x = \cos(2x)$.
    4. $A = \int_0^{\pi/4} \cos(2x) \, dx = [\frac{1}{2}\sin(2x)]_0^{\pi/4}$.
    5. Evaluate: $\frac{1}{2}\sin(\pi/2) - \frac{1}{2}\sin(0) = \frac{1}{2}(1) - 0 = \frac{1}{2}$.
- id: area-hard-exp-poly
  title: Product of Polynomial and Exponential
  type: symbolicResponse
  prompt: |
    Find the exact area of the region bounded by $y = e^x$ and $y = x e^x$ between $x = 0$ and $x = 1$.
  answer:
    gradingMode: auto
    expectedLatex: e - 2
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. On $[0, 1]$, $e^x > x e^x$ since $1 > x$.
    2. Integral is $\int_0^1 (e^x - x e^x) \, dx$.
    3. Use integration by parts for $\int x e^x \, dx$: let $u = x, dv = e^x dx \implies du = dx, v = e^x$. Result is $xe^x - e^x$.
    4. So the integral of $(e^x - xe^x)$ is $e^x - (xe^x - e^x) = 2e^x - xe^x$.
    5. Evaluate at 1: $2e - e = e$.
    6. Evaluate at 0: $2(1) - 0 = 2$.
    7. Area = $e - 2$.
- id: area-hard-horizontal-quadratics
  title: Horizontal Slicing Two Quadratics
  type: symbolicResponse
  prompt: |
    Find the exact area of the region bounded by $x = y^2 - 4y$ and $x = 2y - y^2$.
  answer:
    gradingMode: auto
    expectedLatex: 9
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Find intersections: $y^2 - 4y = 2y - y^2 \implies 2y^2 - 6y = 0 \implies 2y(y - 3) = 0 \implies y = 0, y = 3$.
    2. Between 0 and 3, $2y - y^2 > y^2 - 4y$ (test $y=1: 1 > -3$).
    3. Set up the integral with respect to $y$: $\int_0^3 ((2y - y^2) - (y^2 - 4y)) \, dy = \int_0^3 (6y - 2y^2) \, dy$.
    4. Integrate: $[3y^2 - \frac{2}{3}y^3]_0^3 = (3(9) - \frac{2}{3}(27)) - 0 = 27 - 18 = 9$.
- id: area-hard-unknown-constant
  title: Unknown Constant
  type: symbolicResponse
  prompt: |
    The area of the region bounded by $y = cx^2$ and $y = c$ (where $c > 0$) is exactly $\frac{32}{3}$. Find the value of $c$.
  answer:
    gradingMode: auto
    expectedLatex: 8
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Intersections: $cx^2 = c \implies x^2 = 1 \implies x = \pm 1$.
    2. Since $c > 0$, $y=c$ is the top boundary on $[-1, 1]$.
    3. Area $A = \int_{-1}^1 (c - cx^2) \, dx = 2c \int_0^1 (1 - x^2) \, dx$.
    4. Evaluate the integral: $2c [x - x^3/3]_0^1 = 2c(1 - 1/3) = \frac{4c}{3}$.
    5. Set equal to given area: $\frac{4c}{3} = \frac{32}{3} \implies 4c = 32 \implies c = 8$.
- id: area-hard-inverse-trig
  title: Inverse Trigonometric Slicing
  type: symbolicResponse
  prompt: |
    Find the exact area of the region bounded by $y = \arcsin x$, the $y$-axis ($x=0$), and the horizontal line $y = \pi/2$.
  answer:
    gradingMode: auto
    expectedLatex: 1
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. While we can integrate $\arcsin x$ using integration by parts, integrating with respect to $y$ is much easier.
    2. If $y = \arcsin x$, then $x = \sin y$.
    3. The bounds for $y$ are from $0$ (since $\arcsin(0) = 0$) to $\pi/2$.
    4. The region is to the right of the y-axis, bounded by $x = \sin y$ and $x=0$.
    5. $A = \int_0^{\pi/2} \sin y \, dy$.
    6. Integrate: $[-\cos y]_0^{\pi/2} = -\cos(\pi/2) - (-\cos(0)) = 0 - (-1) = 1$.
- id: area-hard-cubic-split
  title: Cubic Intersecting Multiple Times
  type: symbolicResponse
  prompt: |
    Find the exact total area of the region bounded by $y = x^3 - x$ and $y = 3x$.
  answer:
    gradingMode: auto
    expectedLatex: 8
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Find intersections: $x^3 - x = 3x \implies x^3 - 4x = 0 \implies x(x^2 - 4) = 0 \implies x = -2, 0, 2$.
    2. By symmetry, the region on $[-2, 0]$ has the same area as the region on $[0, 2]$.
    3. On $[0, 2]$, $3x \ge x^3 - x$. Area = $\int_0^2 (3x - (x^3 - x)) \, dx = \int_0^2 (4x - x^3) \, dx$.
    4. Evaluate: $[2x^2 - x^4/4]_0^2 = 2(4) - 16/4 = 8 - 4 = 4$.
    5. Total area = $2 \times 4 = 8$.
- id: area-hard-rational-atan
  title: Rational Function and Arctangent
  type: symbolicResponse
  prompt: |
    Find the exact area of the region bounded by $y = \frac{1}{x^2+1}$ and $y = \frac{1}{2}$.
  answer:
    gradingMode: auto
    expectedLatex: \pi/2 - 1
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Find intersections: $\frac{1}{x^2+1} = \frac{1}{2} \implies x^2+1 = 2 \implies x^2 = 1 \implies x = \pm 1$.
    2. On $[-1, 1]$, the curve $\frac{1}{x^2+1}$ is above the line $y=1/2$.
    3. $A = \int_{-1}^1 (\frac{1}{x^2+1} - \frac{1}{2}) \, dx = 2\int_0^1 (\frac{1}{x^2+1} - \frac{1}{2}) \, dx$.
    4. Integrate: $2[\arctan x - x/2]_0^1 = 2(\arctan(1) - 1/2) - 0 = 2(\pi/4 - 1/2) = \pi/2 - 1$.
