- id: area-hard-trig-crossings
  title: Multiple Trig Intersections
  type: symbolicResponse
  prompt: |
    Find the exact total area of the region bounded by $y = \sin x$ and $y = \cos x$ between $x = 0$ and $x = \pi$.
  answer:
    gradingMode: auto
    expectedLatex: 2\sqrt{2}
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Intersections on $[0, \pi]$: $\sin x = \cos x \implies \tan x = 1 \implies x = \pi/4$.
    2. The curves cross, so we must split the integral: $\int_0^{\pi/4} (\cos x - \sin x) \, dx + \int_{\pi/4}^{\pi} (\sin x - \cos x) \, dx$.
    3. First integral: $[\sin x + \cos x]_0^{\pi/4} = \sqrt{2} - 1$.
    4. Second integral: $[-\cos x - \sin x]_{\pi/4}^{\pi} = (-\cos\pi - \sin\pi) - (-\cos(\pi/4) - \sin(\pi/4)) = (1 - 0) - (-\sqrt{2}) = 1 + \sqrt{2}$.
    5. Total area: $(\sqrt{2} - 1) + (1 + \sqrt{2}) = 2\sqrt{2}$.
- id: area-hard-logarithmic
  title: Logarithmic Curve and Line
  type: symbolicResponse
  prompt: |
    Find the exact area of the region bounded by $y = \ln x$, $y = 1$, and $x = e^2$.
  answer:
    gradingMode: auto
    expectedLatex: e^2
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Find intersection: $\ln x = 1 \implies x = e$.
    2. Region is bounded between $x = e$ and $x = e^2$.
    3. On $(e, e^2)$, $\ln x > 1$. So we integrate: $\int_e^{e^2} (\ln x - 1) \, dx$.
    4. Using integration by parts, $\int \ln x \, dx = x\ln x - x$.
    5. So the integral is $[x\ln x - x - x]_e^{e^2} = [x\ln x - 2x]_e^{e^2}$.
    6. Evaluate at $e^2$: $e^2\ln(e^2) - 2e^2 = 2e^2 - 2e^2 = 0$.
    7. Evaluate at $e$: $e\ln e - 2e = e - 2e = -e$.
    8. Area = $0 - (-e) = e$.
