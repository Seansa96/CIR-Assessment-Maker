- id: hard-q012
  type: multipleChoice
  prompt: A belt connects two pulleys, $A$ and $B$. If $R_B = 2 R_A$, how does the
    angular velocity of $B$ compare to $A$?
  choices:
  - id: a
    text: $\omega_B = \frac{1}{2}\omega_A$
  - id: b
    text: $\omega_B = 2\omega_A$
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: c
    text: $\omega_B = \omega_A$
    issueSignals:
    - id: rotational-concept-misunderstood
  answer:
    choiceId: a
  explanation: 'Solution:

    $\omega_B = \frac{1}{2}\omega_A$


    Why it works:

    Since the belt speed $v$ is the same for both rims, $v = R_A \omega_A = R_B \omega_B$.
    Thus $\omega_B = \frac{R_A}{R_B}\omega_A = \frac{1}{2}\omega_A$.


    Why the other choices fail:

    The distractors relate to common errors in fixed-axis rotation, such as confusing
    linear and angular kinematics, using the wrong lever arm, or misunderstanding
    moment of inertia.

    '
