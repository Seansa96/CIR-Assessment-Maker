questions:
- id: q1
  type: numericResponse
  prompt: A stone tied to a string of length $1.5 \text{ m}$ experiences a centripetal
    acceleration of $600 \text{ m/s}^2$. What is its angular velocity $\omega$ in
    rad/s?
  answer:
    value: 20.0
    tolerance: 1.0
  explanation: $a_r = r\omega^2 \implies \omega = \sqrt{\frac{600}{1.5}} = \sqrt{400}
    = 20 \text{ rad/s}$.
