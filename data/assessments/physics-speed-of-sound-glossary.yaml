glossary:
  introduction: Material properties and formulas that determine sound speed.
  sections:
  - id: speed-terms
    title: Core terms
    entries:
    - {id: bulk-modulus, term: bulk modulus, definition: 'A fluid’s resistance to compression, $B$, used in $v=\sqrt{B/\rho}$.', drills: [{id: bulk-modulus-drill, type: typed, prompt: 'What fluid property measures resistance to compression?', answer: bulk modulus}]}
    - {id: density, term: density, definition: 'Mass per volume, $\rho$, which supplies inertia in wave-speed formulas.', drills: [{id: density-drill, type: cloze, prompt: 'The inertial property in $v=\sqrt{B/{{\rho}}}$ is density.', answer: '\rho'}]}
    - {id: adiabatic, term: adiabatic, definition: 'A compression process with negligible heat transfer, appropriate for rapid sound fluctuations in gases.', drills: [{id: adiabatic-drill, type: typed, prompt: 'What thermodynamic condition applies to rapid sound compressions?', answer: adiabatic}]}
    - {id: youngs-modulus, term: Young’s modulus, definition: 'The elastic modulus $Y$ used for longitudinal sound speed in a solid rod.', drills: [{id: youngs-modulus-drill, type: cloze, prompt: 'Sound speed in a rod uses {{Young’s modulus}}.', answer: Young’s modulus}]}
