lesson:
  introduction: |
    Lewis dot structures are two-dimensional maps of a molecule's valence electrons. They show every bonding pair and lone pair, making it possible to predict geometry, reactivity, and properties. Mastering the drawing procedure — and knowing when and how to violate the octet rule — is one of the most important skills in general chemistry.
  sections:
    - id: sec-procedure
      title: The Step-by-Step Procedure
      required: true
      content: |
        Follow these five steps to draw any Lewis structure:

        **Step 1 — Count total valence electrons.**
        Sum the valence electrons of all atoms. For anions, add one electron per unit of negative charge. For cations, subtract one per unit of positive charge.

        **Step 2 — Identify the central atom.**
        The least electronegative non-hydrogen atom is usually the central atom. (H and F are *never* central atoms.) Write the skeleton with single bonds.

        **Step 3 — Subtract bonding electrons.**
        Each single bond in the skeleton uses 2 electrons. Subtract $2 \times (\text{number of bonds})$ from the total.

        **Step 4 — Complete octets on terminal atoms first.**
        Distribute the remaining electrons as lone pairs to outer atoms (except H, which only needs 2).

        **Step 5 — Place remaining electrons on the central atom; form multiple bonds if needed.**
        If the central atom has fewer than 8 electrons after Step 4, convert lone pairs from adjacent atoms into bonding pairs (double or triple bonds) until the central atom achieves an octet.

        **Example — $CO_2$:**
        1. Valence e⁻: $C(4) + 2 \times O(6) = 16$
        2. Skeleton: O—C—O (uses 4 e⁻, 12 remaining)
        3. Complete O octets: each O gets 3 lone pairs (6 e⁻ each) = 12 e⁻ used → 0 remaining
        4. Check C: it has only 4 electrons (two bonds). Convert one lone pair from each O → C=O on both sides.
        5. Result: O=C=O (C has 8, each O has 8) ✓
      media:
        - type: image
          src: /media/chemistry/covalent-bonding/chem-lewis-dot-structures-overview.png
          alt: Annotated Lewis structure diagram of ammonia (NH3) showing bonding pairs, lone pair, and formal charges labeled.
          caption: "The parts of a Lewis structure: bonding pairs (shared between atoms), lone pairs (non-bonding), and optional formal charge labels."
      check:
        id: chk-lds-1
        type: multipleChoice
        prompt: |
          How many total valence electrons must be represented in the Lewis structure of the **sulfate ion** ($SO_4^{2-}$)?

          (S is in Group 16; O is in Group 16)
        choices:
          - id: a
            text: '30'
          - id: b
            text: '32'
          - id: c
            text: '34'
          - id: d
            text: '38'
        answer:
          choiceId: b
        explanation: |
          $S$: 6 valence electrons; $4 \times O$: $4 \times 6 = 24$; charge contribution: $+2$ (negative ion adds electrons) = $6 + 24 + 2 = \mathbf{32}$ valence electrons.

    - id: sec-polyatomic
      title: Lewis Structures for Polyatomic Ions
      required: true
      content: |
        The procedure is identical for ions, with one extra step: **adjust the electron count for charge**.

        - **Anion ($-$ charge):** Add 1 electron per unit of negative charge.
        - **Cation ($+$ charge):** Remove 1 electron per unit of positive charge.

        **Example — Hydroxide ion ($OH^-$):**
        - Valence e⁻: $O(6) + H(1) + 1 = 8$
        - Skeleton: H—O (2 e⁻ used, 6 remaining)
        - O gets 3 lone pairs (6 e⁻). H has its 2 (from bond). ✓
        - O: 2 (bond) + 6 (lone pairs) = 8 ✓
        - Formal charges: O: $6 - 6 - 1 = -1$ ✓ (matches ion charge)

        **Example — Ammonium ion ($NH_4^+$):**
        - Valence e⁻: $N(5) + 4 \times H(1) - 1 = 8$
        - N is central, 4 N—H bonds (8 e⁻) = 0 remaining
        - N has 8 electrons (all bonding). No lone pairs. ✓
        - Formal charge on N: $5 - 0 - 4 = +1$ ✓
      check:
        id: chk-lds-2
        type: numericResponse
        prompt: |
          How many total valence electrons must be placed in the Lewis structure of the **phosphate ion** ($PO_4^{3-}$)?

          (P: Group 15, 5 valence electrons; O: Group 16, 6 valence electrons)
        answer:
          value: 32
          tolerance: 0
        explanation: |
          $P$: 5; $4 \times O$: $4 \times 6 = 24$; charge: $+3$ (negative ion) = $5 + 24 + 3 = \mathbf{32}$ valence electrons.

    - id: sec-incomplete-octets
      title: Incomplete Octets — Exceptions Below Octet
      required: true
      content: |
        Certain atoms are **stable with fewer than 8 electrons**. The most common cases:

        **Hydrogen (H):** Always satisfied with 2 electrons (fills the 1s shell).

        **Beryllium (Be):** Often forms only 2 bonds, with just 4 electrons around it. Example: $BeCl_2$ — Be has 4 electrons, linear geometry.

        **Boron (B) and Aluminum (Al):** Often form 3 bonds, stopping at 6 electrons. Example: $BF_3$ — B has 6 electrons, trigonal planar.

        These **electron-deficient** molecules are strong Lewis acids (electron-pair acceptors) precisely because the central atom has room for more electrons. $BF_3$ readily accepts a lone pair from $NH_3$ to form $F_3B{:}NH_3$ (a Lewis acid-base adduct), giving B a full octet.

        The formal charge on B in $BF_3$ is 0 (no expansion needed), even though B has only 6 electrons.
      check:
        id: chk-lds-3
        type: multipleChoice
        prompt: |
          In the Lewis structure of $BF_3$, how many electrons surround the boron atom, and what is boron's formal charge?
        choices:
          - id: a
            text: '8 electrons, formal charge 0'
          - id: b
            text: '6 electrons, formal charge 0'
          - id: c
            text: '6 electrons, formal charge −1'
          - id: d
            text: '8 electrons, formal charge +1'
        answer:
          choiceId: b
        explanation: |
          B in $BF_3$ forms 3 bonds (6 bonding electrons) and has no lone pairs → **6 electrons** total. Formal charge: $V - L - B/2 = 3 - 0 - 6/2 = 0$. Despite the incomplete octet, formal charge is zero, making this the best Lewis structure.

    - id: sec-expanded-octets
      title: Expanded Octets — Exceptions Above Octet
      required: true
      content: |
        Atoms in **Period 3 and beyond** have access to $d$ orbitals, allowing them to accommodate more than 8 electrons — an **expanded octet**.

        Common examples:

        | Molecule | Central Atom | Electrons on Central Atom |
        |---|---|---|
        | $PCl_5$ | P | 10 |
        | $SF_6$ | S | 12 |
        | $SF_4$ | S | 10 |
        | $ClF_3$ | Cl | 10 |
        | $XeF_2$ | Xe | 10 |
        | $XeF_4$ | Xe | 12 |

        **Drawing $PCl_5$:**
        1. Valence e⁻: $5 + 5(7) = 40$
        2. Skeleton: P at center with 5 Cl atoms (5 bonds = 10 e⁻, 30 remaining)
        3. Each Cl gets 3 lone pairs (6 e⁻ × 5 = 30 e⁻) → 0 remaining
        4. P has 10 electrons — acceptable for Period 3.

        **Important:** Elements of Period 1 and 2 (H, He, C, N, O, F, Ne) **cannot** have expanded octets.
      check:
        id: chk-lds-4
        type: multipleChoice
        prompt: |
          Which of the following molecules or ions **cannot** have an expanded octet on its central atom?
        choices:
          - id: a
            text: '$SF_4$'
          - id: b
            text: '$PCl_5$'
          - id: c
            text: '$NF_3$'
          - id: d
            text: '$ClF_3$'
        answer:
          choiceId: c
        explanation: |
          Nitrogen (N) is in Period 2 and has no available $d$ orbitals. It **cannot** exceed 8 electrons. In $NF_3$, N forms 3 bonds and retains 1 lone pair — exactly 8 electrons. $SF_4$, $PCl_5$, and $ClF_3$ all have Period 3+ central atoms that can use $d$ orbitals to expand beyond 8.

    - id: sec-radicals
      title: Odd-Electron Species (Radicals)
      required: true
      content: |
        Molecules with an **odd number of valence electrons** cannot satisfy the octet rule for all atoms — one atom will always have an unpaired electron. These species are called **radicals** (or free radicals).

        **Examples:**
        - Nitric oxide ($NO$): $5 + 6 = 11$ valence electrons. The best Lewis structure shows a double bond with one lone pair on each atom and an extra unpaired electron on N.
        - Nitrogen dioxide ($NO_2$): $5 + 2(6) = 17$ valence electrons. The unpaired electron sits on N between two N—O bonds.
        - Chlorine dioxide ($ClO_2$): 19 valence electrons.

        Radicals are highly reactive because the unpaired electron seeks to pair up by reacting with other molecules. This makes them important in combustion, atmospheric chemistry, and biological damage (reactive oxygen species).

        The formal charge calculation and Lewis structure rules are applied the same way — the result simply shows one atom with fewer than 8 electrons and an odd electron count.
      check:
        id: chk-lds-5
        type: multipleChoice
        prompt: |
          Nitric oxide (NO) is a radical. What is the total number of valence electrons in NO, confirming it must be a radical?
        choices:
          - id: a
            text: '10 (even, but still a radical due to electronegativity)'
          - id: b
            text: '11 (odd, confirming one electron must be unpaired)'
          - id: c
            text: '12 (even, radical due to geometry)'
          - id: d
            text: '8 (even, but one atom has an incomplete octet)'
        answer:
          choiceId: b
        explanation: |
          N: 5 valence electrons + O: 6 valence electrons = **11** total. An odd number of electrons guarantees that at least one electron cannot be paired — the molecule is necessarily a radical with an unpaired electron.
