lesson:
  introduction: 'This lesson introduces UNIX, Linux, and Android through the mental models emphasized by 10 UNIX, Linux, and
    Android. Focus on what the OS is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: unix-design-idea
    title: UNIX design idea
    required: true
    content: 'UNIX emphasizes files, processes, permissions, and composable tools as system-wide organizing ideas.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      The design style matters more than memorizing one command.

      '
    check:
      id: unix-design-idea-check
      title: 'Check: UNIX design idea'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **UNIX design idea**?

        '
      choices:
      - id: a
        text: UNIX emphasizes files, processes, permissions, and composable tools as system-wide organizing ideas.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'UNIX emphasizes files, processes, permissions, and composable tools as system-wide organizing ideas. Related
        topic: UNIX, Linux, and Android.

        '
  - id: everything-as-file-like
    title: Everything as file-like
    required: true
    content: 'Many UNIX interfaces expose devices and resources through file-like operations.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      File-like does not mean every object is stored as ordinary disk data.

      '
    check:
      id: everything-as-file-like-check
      title: 'Check: Everything as file-like'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Everything as file-like**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Many UNIX interfaces expose devices and resources through file-like operations.
      answer:
        choiceId: d
      explanation: 'Many UNIX interfaces expose devices and resources through file-like operations. Related topic: UNIX, Linux,
        and Android.

        '
  - id: fork-and-exec
    title: Fork and exec
    required: true
    content: 'UNIX process creation separates copying a process context from replacing its program image.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Fork and exec are distinct steps with different purposes.

      '
    check:
      id: fork-and-exec-check
      title: 'Check: Fork and exec'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Fork and exec**?

        '
      choices:
      - id: a
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: UNIX process creation separates copying a process context from replacing its program image.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: c
      explanation: 'UNIX process creation separates copying a process context from replacing its program image. Related topic:
        UNIX, Linux, and Android.

        '
  - id: permissions
    title: Permissions
    required: true
    content: 'UNIX permissions model access by owner, group, and others with read, write, and execute bits.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Execute on a directory means traversal, not running the directory.

      '
    check:
      id: permissions-check
      title: 'Check: Permissions'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Permissions**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: UNIX permissions model access by owner, group, and others with read, write, and execute bits.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      answer:
        choiceId: b
      explanation: 'UNIX permissions model access by owner, group, and others with read, write, and execute bits. Related
        topic: UNIX, Linux, and Android.

        '
  - id: linux-kernel
    title: Linux kernel
    required: true
    content: 'Linux combines UNIX-style abstractions with a large monolithic kernel and loadable modules.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Linux is not the same thing as an entire distribution.

      '
    check:
      id: linux-kernel-check
      title: 'Check: Linux kernel'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Linux kernel**?

        '
      choices:
      - id: a
        text: Linux combines UNIX-style abstractions with a large monolithic kernel and loadable modules.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'Linux combines UNIX-style abstractions with a large monolithic kernel and loadable modules. Related topic:
        UNIX, Linux, and Android.

        '
  - id: android-adaptation
    title: Android adaptation
    required: true
    content: 'Android builds mobile-focused services and app isolation on top of a Linux kernel base.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Android app sandboxing adds layers beyond ordinary desktop UNIX assumptions.

      '
    check:
      id: android-adaptation-check
      title: 'Check: Android adaptation'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Android adaptation**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Android builds mobile-focused services and app isolation on top of a Linux kernel base.
      answer:
        choiceId: d
      explanation: 'Android builds mobile-focused services and app isolation on top of a Linux kernel base. Related topic:
        UNIX, Linux, and Android.

        '
