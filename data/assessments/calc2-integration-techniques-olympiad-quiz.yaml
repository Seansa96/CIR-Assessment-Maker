questions:
- id: q001
  type: freeResponse
  skills:
  - integration-techniques
  - olympiad-problem-solving
  prompt: Evaluate $\int x^2e^x\,dx$ by repeated integration by parts.
  answer:
    gradingMode: selfCheck
    expected: $e^x(x^{2}-2x^{1}+21)+C$.
    keyPoints:
    - 'Matches the reference result: $e^x(x^{2}-2x^{1}+21)+C$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: With $u=x^2$ and $dv=e^x dx$, each integration-by-parts step lowers the exponent. The complete finite polynomial is $x^{2}-2x^{1}+21$; differentiating $e^x(x^{2}-2x^{1}+21)$ returns $x^2e^x$.
