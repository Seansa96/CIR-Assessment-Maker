workedExamples:
- id: example-001
  title: Normalize a three-dimensional vector
  problem: Find a unit vector in the direction of $\langle2,-1,2\rangle$.
  steps:
  - id: s001
    title: Compute the magnitude
    instruction: Use the three-dimensional magnitude formula before changing the vector.
    hint: Square the three components, add, then take the positive square root.
    type: numericResponse
    prompt: What is $|\langle2,-1,2\rangle|$?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 3
      tolerance: 0
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $\sqrt{2^2+(-1)^2+2^2}=\sqrt9=3$.


      Why it works: $|\langle a,b,c\rangle|=\sqrt{a^2+b^2+c^2}$.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: s002
    title: Choose the normalization factor
    instruction: A unit vector is the original vector divided by its magnitude.
    hint: Use the reciprocal of the magnitude, not the magnitude itself.
    type: multipleChoice
    prompt: Which scalar should multiply $\langle2,-1,2\rangle$?
    choices:
    - id: a
      text: $1/3$
      media: []
      issueSignals: []
    - id: b
      text: $3$
      media: []
      issueSignals:
      - id: magnitude-formula-error
        domains: []
    - id: c
      text: $-1/3$
      media: []
      issueSignals:
      - id: sign-error
        domains: []
    - id: d
      text: $1/9$
      media: []
      issueSignals:
      - id: vector-component-resolution-error
        domains: []
    answer:
      choiceId: a
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: Multiply by $1/3$.


      Why it works: $\mathbf u=\mathbf v/|\mathbf v|=(1/3)\mathbf v$ preserves direction and makes length one.


      Why the other choices fail: $3$ lengthens the vector; $-1/3$ reverses direction; $1/9$ does not make its magnitude one.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals:
    - id: magnitude-formula-error
      domains: []
  - id: s003
    title: Scale every component
    instruction: Apply the same scalar to all three components.
    hint: Multiply each component by $1/3$.
    type: multipleChoice
    prompt: What unit vector results?
    choices:
    - id: a
      text: $\langle2/3,-1/3,2/3\rangle$
      media: []
      issueSignals: []
    - id: b
      text: $\langle2,-1,2\rangle$
      media: []
      issueSignals:
      - id: vector-component-resolution-error
        domains: []
    - id: c
      text: $\langle2/3,1/3,2/3\rangle$
      media: []
      issueSignals:
      - id: sign-error
        domains: []
    - id: d
      text: $\langle1/3,-1/3,1/3\rangle$
      media: []
      issueSignals:
      - id: vector-component-resolution-error
        domains: []
    answer:
      choiceId: a
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $(1/3)\langle2,-1,2\rangle=\langle2/3,-1/3,2/3\rangle$.


      Why it works: Scalar multiplication acts componentwise, and division by magnitude preserves direction while setting magnitude to one.


      Why the other choices fail: The original vector has length three; choice c changes direction by changing a sign; choice d scales two components incorrectly.
    media: []
