    - id: d
      text: '$\langle2/3,-1/3,2/3\rangle$ (answers ''Which conclusion completes the worked method for ''Find a unit vector
        in the direction of $\langle2,-1,2\rangle$.''?'', not ''What is $|\langle2,-1,2\rangle|$?'')'
