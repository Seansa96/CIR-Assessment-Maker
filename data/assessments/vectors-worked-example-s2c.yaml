workedExamples:
- id: example-001
  title: Build the representation
  problem: 'Find a unit vector in the direction of $\langle2,-1,2\rangle$.'
  steps:
  - id: s001
    title: Find magnitude
    instruction: 'What is $|\langle2,-1,2\rangle|$?'
    type: multipleChoice
    prompt: 'What is $|\langle2,-1,2\rangle|$?'
    choices:
    - id: a
      text: '3'
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: 3

      Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Right Triangle Trigonometry.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
  - id: s002
    title: Normalize
    instruction: What scalar makes the magnitude one?
    type: multipleChoice
    prompt: What scalar makes the magnitude one?
    choices:
    - id: a
      text: $1/3$
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $1/3$

      Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Right Triangle Trigonometry.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
  - id: s003
    title: State the unit vector
    instruction: Which vector is correct?
    type: multipleChoice
    prompt: Which vector is correct?
    choices:
    - id: a
      text: '$\langle2/3,-1/3,2/3\rangle$'
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $\langle2/3,-1/3,2/3\rangle$

      Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Right Triangle Trigonometry.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
