schemaVersion: 1
id: csharp-standard-library-recall
title: C# Standard Library Recall
assessmentType: recallDrill
categoryId: csharp
topicId: csharp-standard-library
skills:
- Apply C# Standard Library and BCL
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - csharp
  - csharp-standard-library
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  prompt: Which built-in class is used to generate pseudo-random numbers in C#?
  answer:
    expected: Random
    aliases:
    - System.Random
- id: r002
  type: typed
  prompt: When using `Random.Next(min, max)`, is the `max` value inclusive or exclusive?
  answer:
    expected: exclusive
- id: r003
  type: typed
  prompt: Which static method in `System.Math` returns the larger of two numbers?
  answer:
    expected: Math.Max
    aliases:
    - Max
    - Max()
    - Math.Max()
- id: r004
  type: typed
  prompt: Which static method in `System.Math` returns the absolute (positive) value
    of a number?
  answer:
    expected: Math.Abs
    aliases:
    - Abs
    - Abs()
    - Math.Abs()
- id: r005
  type: typed
  prompt: What class provides static methods for reading, writing, and creating files
    (e.g., `_____.ReadAllText(path)`)?
  answer:
    expected: File
    aliases:
    - System.IO.File
- id: r006
  type: typed
  prompt: Which method on the `File` class will write a string to a file, completely
    replacing the file if it already exists?
  answer:
    expected: WriteAllText
    aliases:
    - File.WriteAllText
- id: r007
  type: typed
  prompt: Which method on the `File` class returns a boolean indicating whether a
    file exists at a given path?
  answer:
    expected: Exists
    aliases:
    - File.Exists
