questions:
- id: q001
  type: multipleChoice
  prompt: "An object is placed underwater and completely submerged. Upon releasing\
    \ it, you observe the object accelerating upward toward the surface. \nWhat can\
    \ you definitively conclude about the density of this object?\n"
  choices:
  - id: a
    text: Its density is greater than the density of the water.
    issueSignals:
    - id: density-buoyancy-inverted
  - id: b
    text: Its density is exactly equal to the density of the water.
    issueSignals:
    - id: neutral-buoyancy-confusion
  - id: c
    text: Its density is less than the density of the water.
  - id: d
    text: The density cannot be determined without knowing the object’s mass.
    issueSignals:
    - id: mass-dependence-confusion
  answer:
    choiceId: c
  explanation: 'Solution:

    Its density is less than the density of the water.


    Why it works:

    Because it accelerates upward, the upward buoyant force must be greater than the
    downward force of gravity ($F_B > W$). Since both are proportional to volume ($F_B
    = \rho_w V g$ and $W = \rho_{obj} V g$), it strictly implies that $\rho_w > \rho_{obj}$.


    Why the other choices fail:

    If its density were greater, it would sink (accelerate downward). If they were
    equal, it would hover in place (neutral buoyancy).

    '
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
- id: q002
  type: numericResponse
  prompt: "A solid block of volume $V = 2.0 \\text{ m}^3$ is completely submerged\
    \ in water. \nUsing $\\rho_{water} = 1000 \\text{ kg/m}^3$ and $g = 9.8 \\text{\
    \ m/s}^2$, calculate the buoyant force acting on the block in Newtons.\n"
  answer:
    value: 19600
    tolerance: 10
  explanation: 'Solution:

    $F_B = \rho_{water} V g = (1000)(2.0)(9.8) = 19600 \text{ N}$.


    Why it works:

    Archimedes'' Principle states that the buoyant force equals the weight of the
    displaced fluid. Since the block is completely submerged, the displaced volume
    is simply the volume of the block ($2.0 \text{ m}^3$).

    '
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
