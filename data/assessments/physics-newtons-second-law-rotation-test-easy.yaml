- id: easy-q012
  type: multipleChoice
  prompt: The same net torque is applied to a solid disk and a hollow ring of the
    same mass and radius. Which has the greater angular acceleration?
  choices:
  - id: a
    text: The solid disk
  - id: b
    text: The hollow ring
  - id: c
    text: They have the same angular acceleration
  answer:
    choiceId: a
  explanation: |-
    The solid disk has a smaller moment of inertia ($I = \frac{1}{2}MR^2$) compared to the hollow ring ($I = MR^2$). Since $\alpha = \tau/I$, the smaller $I$ yields a larger $\alpha$.
