questions:
- id: q001
  type: multipleChoice
  prompt: A right triangle has a hypotenuse of 10 and one leg of 6. What is the area of this triangle?
  difficultyDimensions:
  - 'Use Pythagorean theorem to find the other leg: $\sqrt{10^2 - 6^2} = 8$.'
  - 'Identify the base and height (the two legs: 6 and 8).'
  - 'Calculate area: $1/2 \times 6 \times 8 = 24$.'
  choices:
  - id: a
    text: $48$
    issueSignals:
    - id: one-half-omission
      domains: []
  - id: b
    text: $24$
  - id: c
    text: $30$
    issueSignals:
    - id: hypotenuse-as-base
      domains: []
  - id: d
    text: $60$
    issueSignals:
    - id: hypotenuse-as-height
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    First, find the missing leg using the Pythagorean theorem:

    $a^2 + 6^2 = 10^2$

    $a^2 + 36 = 100 \implies a^2 = 64 \implies a = 8$.

    In a right triangle, the two legs can act as the base and height because they are perpendicular.

    Area = $\frac{1}{2}bh = \frac{1}{2}(6)(8) = 24$.


    Why it works:

    The hypotenuse is never the height when one of the legs is the base. You must find both perpendicular
    legs to use the standard area formula.


    Why the other choices fail:

    - $48$ is just $6 \times 8$, forgetting to multiply by $1/2$. This is the area of the bounding rectangle,
    not the triangle.

    - $30$ is $\frac{1}{2} \times 6 \times 10$, improperly using the hypotenuse as the height.

    - $60$ is $6 \times 10$, using the hypotenuse and forgetting $1/2$.

    '
- id: q002
  type: multipleChoice
  prompt: Which of the following sets of information is NOT sufficient to prove that two triangles are
    congruent?
  difficultyDimensions:
  - 'Recall the valid congruence criteria: SSS, SAS, ASA, AAS, HL.'
  - 'Recall the invalid criteria: SSA (or ASS) and AAA.'
  - Identify SSA as the failure case (Two sides and a non-included angle).
  choices:
  - id: a
    text: Side-Angle-Side (SAS)
  - id: b
    text: Angle-Side-Angle (ASA)
  - id: c
    text: Side-Side-Angle (SSA)
    issueSignals:
    - id: congruence-theorem-confusion
      domains: []
  - id: d
    text: Side-Side-Side (SSS)
  answer:
    choiceId: c
  explanation: 'Solution:

    The valid congruence theorems are SSS, SAS, ASA, AAS, and HL (for right triangles).

    Side-Side-Angle (SSA) is NOT a valid congruence theorem because it allows for the "ambiguous case,"
    where two completely different triangles can be built with the same two sides and non-included angle.


    Why it works:

    Imagine a hinge. If you fix two sides and the angle *between* them (SAS), the endpoints are locked
    in space, leaving only one possible length for the third side. But if you fix an angle, a side next
    to it, and a side across from it (SSA), the third side can swing like a pendulum, hitting the base
    in two different valid spots, creating two non-congruent triangles.


    Why the other choices fail:

    - SAS, ASA, and SSS are all universally valid methods for proving triangle congruence. The question
    asks for the one that is NOT valid.

    '
- id: q003
  type: multipleChoice
  prompt: Triangles $\triangle ABC$ and $\triangle DEF$ are similar. If $AB = 4$, $BC = 5$, and $DE =
    12$, what is the length of $EF$?
  difficultyDimensions:
  - 'Identify corresponding sides: $AB \sim DE$ and $BC \sim EF$.'
  - 'Find the scale factor: $DE / AB = 12 / 4 = 3$.'
  - 'Multiply $BC$ by the scale factor: $5 \times 3 = 15$.'
  choices:
  - id: a
    text: $13$
    issueSignals:
    - id: additive-scaling-error
      domains: []
  - id: b
    text: $15$
  - id: c
    text: $10$
    issueSignals:
    - id: incorrect-scale-factor
      domains: []
  - id: d
    text: $20$
    issueSignals:
    - id: squared-scaling-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    Since the triangles are similar, their corresponding sides are proportional.

    The ratio of side $DE$ to side $AB$ is $\frac{12}{4} = 3$.

    This means $\triangle DEF$ is exactly 3 times larger than $\triangle ABC$ in its linear dimensions.

    To find $EF$, multiply its corresponding side $BC$ by the scale factor:

    $EF = 5 \times 3 = 15$.


    Why it works:

    Similarity means the shape is locked, but the size can change. This requires a multiplicative scale
    factor.


    Why the other choices fail:

    - $13$ is $5 + 8$. Since $DE$ is 8 units longer than $AB$ ($12 - 4 = 8$), a student might incorrectly
    ADD 8 to $BC$. Scaling is always multiplicative, never additive.

    - $10$ assumes a scale factor of 2.

    - $20$ assumes a scale factor of 4.

    '
- id: q004
  type: multipleChoice
  prompt: Two similar triangles have corresponding sides in the ratio of $2:5$. If the area of the smaller
    triangle is $12\text{ cm}^2$, what is the area of the larger triangle?
  difficultyDimensions:
  - 'Recognize that the area ratio is the square of the linear ratio: $(2/5)^2 = 4/25$.'
  - 'Set up proportion: $12 / A = 4 / 25$.'
  - 'Solve for $A$: $4A = 300 \implies A = 75$.'
  choices:
  - id: a
    text: $30\text{ cm}^2$
    issueSignals:
    - id: linear-scaling-error
      domains: []
  - id: b
    text: $60\text{ cm}^2$
    issueSignals:
    - id: scale-factor-error
      domains: []
  - id: c
    text: $75\text{ cm}^2$
  - id: d
    text: $150\text{ cm}^2$
    issueSignals:
    - id: cube-scaling-error
      domains: []
  answer:
    choiceId: c
  explanation: 'Solution:

    The ratio of the sides (linear ratio) is $2:5$.

    The ratio of their areas is the square of the linear ratio: $2^2 : 5^2 = 4:25$.

    Let $A$ be the area of the larger triangle. We set up a proportion:

    $\frac{4}{25} = \frac{12}{A}$

    Cross-multiply: $4A = 12 \times 25$

    $4A = 300$

    $A = 75\text{ cm}^2$.


    Why it works:

    Area is a two-dimensional measurement (base $\times$ height). When you scale a triangle by a factor
    of $k$, both the base and the height are multiplied by $k$. Therefore, the new area is multiplied
    by $k \times k = k^2$.


    Why the other choices fail:

    - $30$ incorrectly applies the linear ratio directly to the area ($\frac{12}{2} \times 5 = 30$).

    - $60$ assumes the ratio is $1:5$ instead of $4:25$.

    - $150$ might be a calculation error (e.g., $12 \times 12.5$).

    '
- id: q005
  type: multipleChoice
  prompt: A box has dimensions $3 \text{ cm} \times 4 \text{ cm} \times 12 \text{ cm}$. What is the length
    of the space diagonal (the straight line from one corner through the interior of the box to the opposite
    corner)?
  difficultyDimensions:
  - 'Recall the 3D Pythagorean theorem: $d^2 = l^2 + w^2 + h^2$.'
  - 'Calculate sum of squares: $3^2 + 4^2 + 12^2 = 9 + 16 + 144 = 169$.'
  - 'Take square root: $d = 13$.'
  choices:
  - id: a
    text: $19$
    issueSignals:
    - id: addition-error
      domains: []
  - id: b
    text: $13$
  - id: c
    text: $14.2$
    issueSignals:
    - id: 2d-pythagorean-error
      domains: []
  - id: d
    text: $169$
    issueSignals:
    - id: square-root-omission
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The length of the space diagonal in a rectangular prism can be found using the 3D Pythagorean theorem:

    $d^2 = l^2 + w^2 + h^2$

    $d^2 = 3^2 + 4^2 + 12^2$

    $d^2 = 9 + 16 + 144 = 169$

    $d = 13 \text{ cm}$.


    Why it works:

    This formula is just the standard Pythagorean theorem applied twice. First, you find the diagonal
    of the $3 \times 4$ base ($3^2 + 4^2 = 5^2$). Then, you use that base diagonal (5) and the height
    (12) to form a new right triangle standing up inside the box ($5^2 + 12^2 = 13^2$).


    Why the other choices fail:

    - $19$ is the straight sum of the dimensions ($3 + 4 + 12$).

    - $14.2$ might be $\sqrt{4^2 + 12^2} = \sqrt{160} \approx 12.6$, wait no, just a random distractor
    for people guessing roots.

    - $169$ forgets to take the final square root.

    '
- id: q006
  type: multipleChoice
  prompt: An equilateral triangle has a side length of 6. What is its exact area?
  difficultyDimensions:
  - 'Recall the formula for the area of an equilateral triangle: $A = \frac{s^2\sqrt{3}}{4}$, OR drop
    an altitude to create two 30-60-90 triangles.'
  - Calculate base = 6, height = $3\sqrt{3}$.
  - 'Calculate area: $1/2 \times 6 \times 3\sqrt{3} = 9\sqrt{3}$.'
  choices:
  - id: a
    text: $18$
    issueSignals:
    - id: altitude-error
      domains: []
  - id: b
    text: $9\sqrt{3}$
  - id: c
    text: $18\sqrt{3}$
    issueSignals:
    - id: one-half-omission
      domains: []
  - id: d
    text: $27$
    issueSignals:
    - id: right-triangle-assumption
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    **Method 1 (Formula):**

    The area of an equilateral triangle is $A = \frac{s^2\sqrt{3}}{4}$.

    $A = \frac{6^2\sqrt{3}}{4} = \frac{36\sqrt{3}}{4} = 9\sqrt{3}$.


    **Method 2 (Altitude):**

    Drop an altitude to split the triangle into two $30^\circ-60^\circ-90^\circ$ right triangles.

    The hypotenuse is 6, so the short base is 3.

    The height (long leg) is $3\sqrt{3}$.

    Area = $\frac{1}{2}bh = \frac{1}{2}(6)(3\sqrt{3}) = 9\sqrt{3}$.


    Why it works:

    Both methods rely on the fact that an altitude of an equilateral triangle bisects both the top angle
    and the bottom base, creating perfect $30^\circ-60^\circ-90^\circ$ proportions.


    Why the other choices fail:

    - $18$ assumes the height is the same as the side length ($1/2 \times 6 \times 6 = 18$).

    - $18\sqrt{3}$ is the area of the bounding rectangle, forgetting to multiply by $1/2$.

    - $27$ assumes it is a right triangle where the legs are 6 and 9.

    '
