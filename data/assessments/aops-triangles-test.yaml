schemaVersion: 1
id: aops-triangles-test
title: Triangles Easy Test
description: Evaluate multi-step use of triangle inequalities, rigid criteria, similarity, centers, trigonometry, and area.
assessmentType: test
categoryId: art-of-problem-solving
topicId: aops-triangles
skills:
- Solve algebraic triangle constraints
- Transfer information through congruence and similarity
- Apply right-triangle altitude and center theorems
- Verify triangle area with complementary formulas
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags: [art-of-problem-solving, aops-triangles, geometry, easy, triangle-test, congruence, similarity, triangle-centers, triangle-area]
questions:
- id: q001
  type: multipleChoice
  prompt: Sides 9, 14, and integer $x$ form a nondegenerate triangle. How many values of $x$ are possible?
  choices: [{id: a, text: '15'}, {id: b, text: '16'}, {id: c, text: '17'}, {id: d, text: '18'}]
  answer: {choiceId: c}
  explanation: $5<x<23$, so the integers 6 through 22 give 17 values.
- id: q002
  type: multipleChoice
  prompt: A triangle exterior angle is $(3x+10)^\circ$, and its remote interior angles are $(x+20)^\circ$ and $(x+30)^\circ$. Find the exterior angle.
  choices: [{id: a, text: '$90^\circ$'}, {id: b, text: '$120^\circ$'}, {id: c, text: '$130^\circ$'}, {id: d, text: '$150^\circ$'}]
  answer: {choiceId: c}
  explanation: $3x+10=2x+50$ gives $x=40$, so the exterior angle is $130^\circ$.
- id: q003
  type: multipleChoice
  prompt: Classify a triangle with sides 9, 12, and 16 by its angles.
  choices: [{id: a, text: Acute}, {id: b, text: Right}, {id: c, text: Obtuse}, {id: d, text: Degenerate}]
  answer: {choiceId: c}
  explanation: It exists, and $16^2=256>9^2+12^2=225$.
- id: q004
  type: multipleChoice
  prompt: A right triangle has hypotenuse 26 and one leg 10. Find the other leg.
  choices: [{id: a, text: '$16$'}, {id: b, text: '$20$'}, {id: c, text: '$24$'}, {id: d, text: '$28$'}]
  answer: {choiceId: c}
  explanation: The missing square is $26^2-10^2=676-100=576=24^2$.
- id: q005
  type: multipleChoice
  prompt: Congruent triangles have corresponding sides $2x+7$ and $5x-8$. Find the common side length.
  choices: [{id: a, text: '$5$'}, {id: b, text: '$15$'}, {id: c, text: '$17$'}, {id: d, text: '$23$'}]
  answer: {choiceId: c}
  explanation: $2x+7=5x-8$ gives $x=5$, and both sides equal 17.
- id: q006
  type: multipleChoice
  prompt: 'In $\triangle ABC$, $DE\parallel BC$, $AD:AB=3:8$, and $DE=9$. Find $BC$.'
  media:
  - type: image
    src: /assessments/aops/aops-triangles-similarity.svg
    alt: Triangle ABC with segment DE parallel to BC, creating similar triangles ADE and ABC.
  choices: [{id: a, text: '$18$'}, {id: b, text: '$21$'}, {id: c, text: '$24$'}, {id: d, text: '$27$'}]
  answer: {choiceId: c}
  explanation: $9/BC=3/8$, so $BC=24$.
- id: q007
  type: multipleChoice
  prompt: An altitude to a right triangle's hypotenuse divides it into segments 4 and 5. Find the altitude.
  media:
  - type: image
    src: /assessments/aops/aops-triangles-altitude-hypotenuse.svg
    alt: Right triangle with perpendicular altitude to its hypotenuse, dividing the hypotenuse into p and q.
  choices: [{id: a, text: '$3$'}, {id: b, text: '$2\sqrt5$'}, {id: c, text: '$3\sqrt5$'}, {id: d, text: '$9$'}]
  answer: {choiceId: b}
  explanation: $h^2=pq=20$, so $h=\sqrt{20}=2\sqrt5$.
- id: q008
  type: multipleChoice
  prompt: A median has length 18. Find the distance from its vertex to the centroid.
  choices: [{id: a, text: '$6$'}, {id: b, text: '$9$'}, {id: c, text: '$12$'}, {id: d, text: '$15$'}]
  answer: {choiceId: c}
  explanation: The centroid is two thirds of the way from vertex to midpoint, so the distance is 12.
- id: q009
  type: multipleChoice
  prompt: A right triangle has hypotenuse 17. What is its circumradius?
  choices: [{id: a, text: '$17/4$'}, {id: b, text: '$17/2$'}, {id: c, text: '$17$'}, {id: d, text: '$34$'}]
  answer: {choiceId: b}
  explanation: The hypotenuse is a diameter of the circumcircle, so the radius is half of 17.
- id: q010
  type: multipleChoice
  prompt: In a 5-12-13 right triangle, $\theta$ is opposite the side of length 5. What is $\sin\theta$?
  choices: [{id: a, text: '$5/12$'}, {id: b, text: '$5/13$'}, {id: c, text: '$12/13$'}, {id: d, text: '$13/5$'}]
  answer: {choiceId: b}
  explanation: Sine is opposite over hypotenuse, so $\sin\theta=5/13$.
- id: q011
  type: multipleChoice
  prompt: Find the area of a triangle with side lengths 13, 14, and 15.
  choices: [{id: a, text: '$42$'}, {id: b, text: '$72$'}, {id: c, text: '$84$'}, {id: d, text: '$105$'}]
  answer: {choiceId: c}
  explanation: Heron gives $s=21$ and $K=\sqrt{21\cdot8\cdot7\cdot6}=84$.
- id: q012
  type: multipleChoice
  prompt: The triangle in the preceding question has area 84 and semiperimeter 21. Find its inradius.
  choices: [{id: a, text: '$2$'}, {id: b, text: '$4$'}, {id: c, text: '$6$'}, {id: d, text: '$8$'}]
  answer: {choiceId: b}
  explanation: $K=rs$ gives $84=21r$, so $r=4$.
- id: q013
  type: selectAll
  prompt: Which statements about the classical triangle centers are valid?
  media:
  - type: image
    src: /assessments/aops/aops-triangles-four-centers.svg
    alt: Four panels compare the incenter, circumcenter, centroid, and orthocenter.
  choices:
  - {id: a, text: The incenter is equidistant from the side lines.}
  - {id: b, text: The circumcenter is equidistant from the vertices.}
  - {id: c, text: The centroid divides every median $2:1$ from the vertex.}
  - {id: d, text: The orthocenter always lies inside the triangle.}
  answer: {choiceIds: [a, b, c]}
  explanation: An obtuse triangle's orthocenter lies outside, so the last statement is false.
- id: q014
  type: selectAll
  prompt: Which are valid verification checks for a completed triangle solution?
  choices:
  - {id: a, text: Every side length is positive and satisfies triangle inequality.}
  - {id: b, text: An area answer has square units and is positive.}
  - {id: c, text: A claimed hypotenuse is opposite a proved or marked right angle.}
  - {id: d, text: Unmarked equal-looking sides may be treated as equal.}
  answer: {choiceIds: [a, b, c]}
  explanation: Visual appearance cannot replace a marking or proof.
- id: q015
  type: freeResponse
  prompt: Prove that the midpoint of a right triangle's hypotenuse is its circumcenter.
  answer:
    gradingMode: selfCheck
    expected: 'Place the right-angle vertex at $C=(0,0)$ and the other vertices at $A=(a,0)$ and $B=(0,b)$. The hypotenuse midpoint is $M=(a/2,b/2)$. Then $MC^2=(a/2)^2+(b/2)^2$. Also $MA^2=(a/2-a)^2+(b/2)^2=(a/2)^2+(b/2)^2$, and similarly $MB^2=(a/2)^2+(b/2)^2$. All three positive distances are equal, so $M$ is equidistant from $A,B,C$ and is therefore the circumcenter.'
    keyPoints:
    - Chooses coordinates aligned with the perpendicular legs.
    - Writes the hypotenuse midpoint correctly.
    - Establishes $MA^2=MB^2=MC^2$.
    - Concludes that $M$ is the circumcenter.
  explanation: The defining property is equal distance to all vertices, not merely lying on the hypotenuse.
