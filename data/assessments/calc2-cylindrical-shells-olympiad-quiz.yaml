questions:
- id: q001
  type: freeResponse
  skills:
  - cylindrical-shells
  - olympiad-problem-solving
  prompt: Rotate the region $0\le x\le 3$, $0\le y\le x$ about the $y$-axis. Find the volume by shells.
  answer:
    gradingMode: selfCheck
    expected: $\frac{2\pi 27}{3}$.
    keyPoints:
    - 'Matches the reference result: $\frac{2\pi 27}{3}$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: A shell at $x$ has radius $x$ and height $x$, so $V=2\pi\int_0^3x^2dx=2\pi 27/3$.
