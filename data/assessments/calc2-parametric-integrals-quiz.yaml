questions:
  - id: q-param-int-quiz-1
    type: multipleChoice
    title: Area Formula
    prompt: |
      Which of the following integrals gives the area under the parametric curve $x = f(t)$, $y = g(t)$ from $t = \alpha$ to $t = \beta$? 
      Assume the curve is traversed exactly once from left to right and $g(t) \ge 0$.
    choices:
      - id: c1
        text: '$\int_{\alpha}^{\beta} g(t) f''(t) \, dt$'
      - id: c2
        text: '$\int_{\alpha}^{\beta} f(t) g''(t) \, dt$'
      - id: c3
        text: '$\int_{\alpha}^{\beta} g''(t) f''(t) \, dt$'
      - id: c4
        text: '$\int_{\alpha}^{\beta} g(t) \, dt$'
    answer:
      choiceId: c1
    explanation: |
      The area under a curve is given by $\int y \, dx$. 
      Substituting $y = g(t)$ and $dx = f'(t) \, dt$, we get $\int_{\alpha}^{\beta} g(t) f'(t) \, dt$.
    skills:
      - parametric-integrals

  - id: q-param-int-quiz-2
    type: multipleChoice
    title: Arc Length Formula
    prompt: |
      Which integral represents the arc length of the parametric curve $x = x(t)$, $y = y(t)$ for $a \le t \le b$?
    choices:
      - id: c1
        text: '$\int_{a}^{b} \sqrt{ (x''(t))^2 + (y''(t))^2 } \, dt$'
      - id: c2
        text: '$\int_{a}^{b} \sqrt{ 1 + \left(\frac{dy}{dx}\right)^2 } \, dt$'
      - id: c3
        text: '$\int_{a}^{b} (x''(t) + y''(t)) \, dt$'
      - id: c4
        text: '$\int_{a}^{b} \sqrt{ (x(t))^2 + (y(t))^2 } \, dt$'
    answer:
      choiceId: c1
    explanation: |
      The arc length for a parametric curve is the integral of the speed: $L = \int_{a}^{b} \sqrt{ (x'(t))^2 + (y'(t))^2 } \, dt$.
    skills:
      - parametric-integrals

  - id: q-param-int-quiz-3
    type: symbolicResponse
    title: Setting up Arc Length
    prompt: |
      Set up the integral for the arc length of the curve $x = 3t^2$, $y = 2t^3$ from $t=0$ to $t=1$.
      
      What is the integrand (the expression inside the integral $\int_0^1 [\dots] dt$)?
    answer:
      expectedLatex: '\sqrt{36t^2 + 36t^4}'
      equivalenceMode: expression
      variables:
        - t
      tolerance: 0.000001
    explanation: |
      First, find the derivatives:
      $x'(t) = 6t$
      $y'(t) = 6t^2$
      
      Square them and add:
      $(x')^2 + (y')^2 = (6t)^2 + (6t^2)^2 = 36t^2 + 36t^4$
      
      The integrand is the square root of this sum: $\sqrt{36t^2 + 36t^4}$.
    skills:
      - parametric-integrals

  - id: q-param-int-quiz-4
    type: multipleChoice
    title: Surface Area Setup
    prompt: |
      Which integral gives the surface area when the curve $x = f(t)$, $y = g(t)$ (for $\alpha \le t \le \beta$) is rotated about the $x$-axis? 
      Assume $g(t) \ge 0$.
    choices:
      - id: c1
        text: '$\int_{\alpha}^{\beta} 2\pi g(t) \sqrt{(f''(t))^2 + (g''(t))^2} \, dt$'
      - id: c2
        text: '$\int_{\alpha}^{\beta} 2\pi f(t) \sqrt{(f''(t))^2 + (g''(t))^2} \, dt$'
      - id: c3
        text: '$\int_{\alpha}^{\beta} \pi (g(t))^2 f''(t) \, dt$'
      - id: c4
        text: '$\int_{\alpha}^{\beta} 2\pi \sqrt{(f''(t))^2 + (g''(t))^2} \, dt$'
    answer:
      choiceId: c1
    explanation: |
      The surface area of revolution about the $x$-axis is given by $S = \int 2\pi y \, ds$. 
      For parametric curves, $y = g(t)$ and $ds = \sqrt{(f'(t))^2 + (g'(t))^2} \, dt$.
      Thus, $S = \int_{\alpha}^{\beta} 2\pi g(t) \sqrt{(f'(t))^2 + (g'(t))^2} \, dt$.
    skills:
      - parametric-integrals
