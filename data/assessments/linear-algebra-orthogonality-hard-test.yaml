schemaVersion: 1
id: linear-algebra-orthogonality-hard-test
title: Orthogonality and Projections Advanced Test
assessmentType: test
categoryId: linear-algebra
subcategoryIds:
  - linear-algebra-orthogonality-projections
modeDefault: evaluate
randomizeQuestions: true
attemptQuestionCount: 3
skills:
  - orthogonal-complement
  - projection
