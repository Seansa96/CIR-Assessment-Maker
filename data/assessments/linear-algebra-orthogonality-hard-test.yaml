questions:
  - id: ht-best-approximation
    type: multipleChoice
    prompt: |
      Let $W = \text{Span}\left\{ \begin{bmatrix}1\\0\\0\end{bmatrix},\ \begin{bmatrix}0\\1\\0\end{bmatrix} \right\}$ (the $xy$-plane in $\mathbb{R}^3$).
      Which vector in $W$ is closest to $\vec{y} = \begin{bmatrix}2\\5\\3\end{bmatrix}$?
    choices:
      - id: c1
        text: '$\begin{bmatrix}2\\5\\3\end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix}2\\5\\0\end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix}0\\0\\3\end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix}2\\0\\0\end{bmatrix}$'
    answer:
      choiceId: c2
    explanation: |
      The closest point in $W$ to $\vec{y}$ is the orthogonal projection $\hat{\vec{y}} = \text{proj}_W\vec{y}$.
      Since $\{\vec{e}_1, \vec{e}_2\}$ is already an **orthonormal** basis for $W$:
      $\hat{\vec{y}} = (\vec{y}\cdot\vec{e}_1)\vec{e}_1 + (\vec{y}\cdot\vec{e}_2)\vec{e}_2 = 2\vec{e}_1 + 5\vec{e}_2 = \begin{bmatrix}2\\5\\0\end{bmatrix}$.
      Geometrically: projecting onto the $xy$-plane simply zeroes out the $z$-coordinate.

  - id: ht-nul-row-orthogonality
    type: multipleChoice
    prompt: |
      Let $A = \begin{bmatrix}1&2&-1\\0&1&3\end{bmatrix}$. Which of the following vectors is in $[\text{Row}(A)]^\perp = \text{Nul}(A)$?
    choices:
      - id: c1
        text: '$\begin{bmatrix}1\\2\\-1\end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix}0\\1\\3\end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix}7\\-3\\1\end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix}1\\0\\0\end{bmatrix}$'
    answer:
      choiceId: c3
    explanation: |
      $\text{Nul}(A)$ consists of all $\vec{x}$ satisfying $A\vec{x} = \vec{0}$.

      Checking option C: $A\begin{bmatrix}7\\-3\\1\end{bmatrix}$:
      - Row 1: $1(7)+2(-3)+(-1)(1) = 7-6-1 = 0$. ✓
      - Row 2: $0(7)+1(-3)+3(1) = 0-3+3 = 0$. ✓

      Options A and B are rows of $A$ (they're in $\text{Row}(A)$, not $\text{Nul}(A)$). Option D: $A\begin{bmatrix}1\\0\\0\end{bmatrix} = \begin{bmatrix}1\\0\end{bmatrix} \neq \vec{0}$.

  - id: ht-gram-schmidt-3vec
    type: freeResponse
    prompt: |
      Apply the Gram-Schmidt process to
      $\vec{x}_1 = \begin{bmatrix}1\\1\\0\end{bmatrix}$, $\vec{x}_2 = \begin{bmatrix}1\\0\\1\end{bmatrix}$
      to find an orthogonal basis $\{\vec{v}_1, \vec{v}_2\}$ for their span, then verify that $\vec{v}_1 \cdot \vec{v}_2 = 0$.
    answer:
      gradingMode: selfCheck
      keyPoints:
        - |
          **$\vec{v}_1 = \vec{x}_1 = \begin{bmatrix}1\\1\\0\end{bmatrix}$.**
        - |
          **Projection**: $\text{proj}_{\vec{v}_1}\vec{x}_2 = \frac{\vec{x}_2\cdot\vec{v}_1}{\vec{v}_1\cdot\vec{v}_1}\vec{v}_1 = \frac{1}{2}\begin{bmatrix}1\\1\\0\end{bmatrix} = \begin{bmatrix}1/2\\1/2\\0\end{bmatrix}$.
          (Since $\vec{x}_2\cdot\vec{v}_1 = 1+0+0 = 1$ and $\|\vec{v}_1\|^2 = 1+1+0 = 2$.)
        - |
          **$\vec{v}_2 = \vec{x}_2 - \text{proj}_{\vec{v}_1}\vec{x}_2 = \begin{bmatrix}1\\0\\1\end{bmatrix} - \begin{bmatrix}1/2\\1/2\\0\end{bmatrix} = \begin{bmatrix}1/2\\-1/2\\1\end{bmatrix}$.**
          (Scaling by 2 gives the equivalent $\begin{bmatrix}1\\-1\\2\end{bmatrix}$.)
        - |
          **Verification**: $\vec{v}_1 \cdot \vec{v}_2 = (1)(1/2)+(1)(-1/2)+(0)(1) = 1/2 - 1/2 + 0 = 0$. ✓
