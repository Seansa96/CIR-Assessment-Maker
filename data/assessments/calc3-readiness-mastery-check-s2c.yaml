  explanation: >
    Solution: Apply the power rule term by term to obtain $5x^4-3$.

    Why it works: $d(x^n)/dx=nx^{n-1}$ and the derivative of $-3x$ is $-3$. Review path: Calculus 1 Ã¢â€ â€™ The Derivative.

    Why the other choices fail: B leaves an x in the linear derivative, C drops the coefficient 5, and D does not lower the power.
