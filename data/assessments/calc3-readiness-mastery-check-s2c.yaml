  explanation: >
    Solution: Add exponents for a shared base: $3+(-5)=-2$, so the result is $x^{-2}$.

    Why it works: Multiplying powers with the same nonzero base adds their exponents. Review path: Calculus 1 Ã¢â€ â€™ Inequalities and the Real Numbers.

    Why the other choices fail: B adds magnitudes without the negative sign, C multiplies exponents, and D subtracts in the wrong order.
