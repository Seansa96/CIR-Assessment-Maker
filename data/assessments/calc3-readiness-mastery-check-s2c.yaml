questions:
  - id: q001
    type: multipleChoice
    prompt: For $x\ne0$, simplify $x^3x^{-5}$.
    choices:
      - { id: a, text: '$x^{-2}$' }
      - { id: b, text: '$x^8$', issueSignals: [{ id: exponent-rule-misapplied }] }
      - { id: c, text: '$x^{-15}$', issueSignals: [{ id: exponent-rule-misapplied }] }
      - { id: d, text: '$x^2$', issueSignals: [{ id: sign-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: exponent-rule-misapplied }]
    difficultyDimensions: [simplification, domainCondition]
    explanation: |
      Solution: Add exponents for a shared base: $3+(-5)=-2$, so the result is $x^{-2}$.
      Why it works: Multiplying powers with the same nonzero base adds their exponents. Review path: Calculus 1 â†’ Inequalities and the Real Numbers.
      Why the other choices fail: B adds magnitudes without the negative sign, C multiplies exponents, and D subtracts in the wrong order.
  - id: q002
    type: multipleChoice
    prompt: Which factorization is equivalent to $x^2-5x+6$?
    choices:
      - { id: a, text: '$(x-2)(x-3)$' }
      - { id: b, text: '$(x+2)(x+3)$', issueSignals: [{ id: sign-error }] }
      - { id: c, text: '$(x-1)(x-6)$', issueSignals: [{ id: algebraic-simplification-error }] }
      - { id: d, text: '$(x-2)(x+3)$', issueSignals: [{ id: sign-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: algebraic-simplification-error }]
    difficultyDimensions: [simplification, representationTransfer]
    explanation: |
      Solution: The factors 2 and 3 multiply to 6 and add to 5, giving $(x-2)(x-3)$.
      Why it works: Expanding the two binomials gives $x^2-5x+6$. Review path: Calculus 1 â†’ Sets, Sequences, and Functions.
      Why the other choices fail: B has a positive middle term, C produces a middle term of $-7x$, and D produces $+x$.
  - id: q003
    type: multipleChoice
    prompt: What is the real domain of $f(x)=\sqrt{4-x}$?
    choices:
      - { id: a, text: '$x\le4$' }
      - { id: b, text: '$x\ge4$', issueSignals: [{ id: domain-range-misidentified }] }
      - { id: c, text: 'all real x', issueSignals: [{ id: domain-range-misidentified }] }
      - { id: d, text: '$x<4$', issueSignals: [{ id: domain-range-misidentified }] }
    answer: { choiceId: a }
    issueSignals: [{ id: domain-range-misidentified }]
    difficultyDimensions: [domainCondition, representationTransfer]
    explanation: |
      Solution: Require $4-x\ge0$, which rearranges to $x\le4$.
      Why it works: A real square root needs a nonnegative radicand. Review path: Calculus 1 â†’ Inequalities and the Real Numbers.
      Why the other choices fail: B reverses the inequality, C permits negative radicands, and D incorrectly excludes zero.
  - id: q004
    type: multipleChoice
    prompt: Convert $150^\circ$ to radians.
    choices:
      - { id: a, text: '$5\pi/6$' }
      - { id: b, text: '$6\pi/5$', issueSignals: [{ id: unit-circle-evaluation-error }] }
      - { id: c, text: '$5\pi/3$', issueSignals: [{ id: unit-circle-evaluation-error }] }
      - { id: d, text: '$\pi/6$', issueSignals: [{ id: unit-circle-evaluation-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: unit-circle-evaluation-error }]
    difficultyDimensions: [representationTransfer, auxiliaryTechnique]
    explanation: |
      Solution: $150\cdot\pi/180=5\pi/6$.
      Why it works: Degrees convert to radians by multiplying by $\pi/180$. Review path: Trigonometry â†’ Unit Circle Trigonometry.
      Why the other choices fail: B inverts the fraction, C doubles the angle, and D corresponds to 30 degrees.
  - id: q005
    type: multipleChoice
    prompt: The original unit-circle visual marks $\theta=2\pi/3$. What are the point's coordinates?
    media: [{ path: /media/calculus-3/readiness-unit-circle-polar.svg, alt: Unit-circle reference visual; use the angle label in the prompt rather than the drawing's generic theta. }]
    choices:
      - { id: a, text: '$(-1/2,\sqrt3/2)$' }
      - { id: b, text: '$(1/2,\sqrt3/2)$', issueSignals: [{ id: unit-circle-evaluation-error }] }
      - { id: c, text: '$(-\sqrt3/2,1/2)$', issueSignals: [{ id: unit-circle-evaluation-error }] }
      - { id: d, text: '$(\sqrt3/2,-1/2)$', issueSignals: [{ id: unit-circle-evaluation-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: unit-circle-evaluation-error }]
    difficultyDimensions: [representationTransfer, auxiliaryTechnique]
    explanation: |
      Solution: At $2\pi/3$, cosine is $-1/2$ and sine is $\sqrt3/2$.
      Why it works: Unit-circle coordinates are $(\cos\theta,\sin\theta)$; quadrant II makes x negative and y positive. Review path: Trigonometry â†’ Unit Circle Trigonometry.
      Why the other choices fail: B ignores the quadrant sign, C swaps the 30- and 60-degree values, and D has the wrong quadrant.
  - id: q006
    type: multipleChoice
    prompt: Convert $(r,\theta)=(2,\pi/2)$ to rectangular coordinates.
    choices:
      - { id: a, text: '$(0,2)$' }
      - { id: b, text: '$(2,0)$', issueSignals: [{ id: polar-rectangular-conversion-error }] }
      - { id: c, text: '$(2,\pi/2)$', issueSignals: [{ id: polar-rectangular-conversion-error }] }
      - { id: d, text: '$(0,-2)$', issueSignals: [{ id: sign-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: polar-rectangular-conversion-error }]
    difficultyDimensions: [representationTransfer, auxiliaryTechnique]
    explanation: |
      Solution: $x=2\cos(\pi/2)=0$ and $y=2\sin(\pi/2)=2$.
      Why it works: Polar coordinates convert by resolving radius into cosine and sine components. Review path: Trigonometry â†’ Polar Coordinates.
      Why the other choices fail: B uses angle zero, C leaves the point unconverted, and D reverses the positive y direction.
  - id: q007
    type: multipleChoice
    prompt: For $x=t^2$ and $y=t+1$, what point occurs at $t=2$?
    choices:
      - { id: a, text: '$(4,3)$' }
      - { id: b, text: '$(2,3)$', issueSignals: [{ id: mathematical-translation-error }] }
      - { id: c, text: '$(4,2)$', issueSignals: [{ id: mathematical-translation-error }] }
      - { id: d, text: '$(2,4)$', issueSignals: [{ id: mathematical-translation-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: mathematical-translation-error }]
    difficultyDimensions: [representationTransfer, auxiliaryTechnique]
    explanation: |
      Solution: Substitute $2$ into both formulas: $x=4$ and $y=3$.
      Why it works: A single parameter value is used for every coordinate. Review path: Calculus 2 â†’ Parametric Curves.
      Why the other choices fail: B omits squaring, C omits the plus one, and D swaps the coordinates.
  - id: q008
    type: multipleChoice
    prompt: In the original parametric-coordinate visual, how does the point move as $t$ increases from 0 to 2?
    media: [{ path: /media/calculus-3/readiness-parametric-coordinate.svg, alt: Original parametric path with t equals zero lower left, t equals one center, and t equals two upper right. }]
    choices:
      - { id: a, text: From the lower-left point toward the upper-right point.' }
      - { id: b, text: From the upper-right point toward the lower-left point.', issueSignals: [{ id: mathematical-translation-error }] }
      - { id: c, text: It remains at the point marked t equals one.', issueSignals: [{ id: mathematical-translation-error }] }
      - { id: d, text: Direction cannot be determined from parameter labels.', issueSignals: [{ id: mathematical-translation-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: mathematical-translation-error }]
    difficultyDimensions: [representationTransfer, reverseReasoning]
    explanation: |
      Solution: The labels progress from $t=0$ at lower left to $t=2$ at upper right.
      Why it works: A parametric curve gains direction from increasing parameter values. Review path: Calculus 2 â†’ Parametric Curves.
      Why the other choices fail: B reverses the labels, C confuses one sample point with the path, and D ignores the supplied parameter order.
  - id: q009
    type: multipleChoice
    prompt: Differentiate $x^5-3x$.
    choices:
      - { id: a, text: '$5x^4-3$' }
      - { id: b, text: '$5x^4-3x$', issueSignals: [{ id: power-rule-error }] }
      - { id: c, text: '$x^4-3$', issueSignals: [{ id: power-rule-error }] }
      - { id: d, text: '$5x^5-3$', issueSignals: [{ id: power-rule-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: power-rule-error }]
    difficultyDimensions: [auxiliaryTechnique, simplification]
    explanation: |
      Solution: Apply the power rule term by term to obtain $5x^4-3$.
      Why it works: $d(x^n)/dx=nx^{n-1}$ and the derivative of $-3x$ is $-3$. Review path: Calculus 1 â†’ The Derivative.
      Why the other choices fail: B leaves an x in the linear derivative, C drops the coefficient 5, and D does not lower the power.
  - id: q010
    type: multipleChoice
    prompt: Differentiate $x^2e^x$.
    choices:
      - { id: a, text: '$e^x(x^2+2x)$' }
      - { id: b, text: '$2xe^x$', issueSignals: [{ id: product-rule-misapplied }] }
      - { id: c, text: '$x^2e^x$', issueSignals: [{ id: product-rule-misapplied }] }
      - { id: d, text: '$e^x(2x-x^2)$', issueSignals: [{ id: sign-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: product-rule-misapplied }]
    difficultyDimensions: [auxiliaryTechnique, representationTransfer]
    explanation: |
      Solution: $(x^2)'e^x+x^2(e^x)'=2xe^x+x^2e^x=e^x(x^2+2x)$.
      Why it works: The product rule differentiates each factor in a separate term. Review path: Calculus 1 â†’ Classical Theorems of Differential Calculus.
      Why the other choices fail: B differentiates only the polynomial, C differentiates neither product structure, and D introduces an unsupported subtraction.
  - id: q011
    type: multipleChoice
    prompt: Differentiate $\sin(3x)$.
    choices:
      - { id: a, text: '$3\cos(3x)$' }
      - { id: b, text: '$\cos(3x)$', issueSignals: [{ id: chain-rule-missed }] }
      - { id: c, text: '$3\sin(3x)$', issueSignals: [{ id: chain-rule-missed }] }
      - { id: d, text: '$-3\sin(3x)$', issueSignals: [{ id: trigonometric-identity-misapplied }] }
    answer: { choiceId: a }
    issueSignals: [{ id: chain-rule-missed }]
    difficultyDimensions: [auxiliaryTechnique, simplification]
    explanation: |
      Solution: Differentiate sine to cosine and multiply by $(3x)'=3$.
      Why it works: The chain rule includes the derivative of the inner function. Review path: Calculus 1 â†’ Classical Theorems of Differential Calculus.
      Why the other choices fail: B omits the inner derivative, C keeps sine, and D uses the derivative pattern for cosine.
  - id: q012
    type: multipleChoice
    prompt: Evaluate $\int_0^2 3x^2\,dx$.
    choices:
      - { id: a, text: '$8$' }
      - { id: b, text: '$4$', issueSignals: [{ id: power-rule-error }] }
      - { id: c, text: '$12$', issueSignals: [{ id: power-rule-error }] }
      - { id: d, text: '$0$', issueSignals: [{ id: order-of-operations-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: power-rule-error }]
    difficultyDimensions: [auxiliaryTechnique, simplification]
    explanation: |
      Solution: An antiderivative is $x^3$, so $[x^3]_0^2=8$.
      Why it works: A definite integral evaluates an antiderivative at upper bound minus lower bound. Review path: Calculus 1 â†’ Riemann Integration.
      Why the other choices fail: B omits the coefficient effect, C evaluates the integrand rather than an antiderivative, and D ignores the upper endpoint.
  - id: q013
    type: multipleChoice
    prompt: Find $\frac{d}{dx}\int_1^x(t^2+1)\,dt$.
    choices:
      - { id: a, text: '$x^2+1$' }
      - { id: b, text: '$t^2+1$', issueSignals: [{ id: expression-equation-recognition-error }] }
      - { id: c, text: '$x^3/3+x$', issueSignals: [{ id: expression-equation-recognition-error }] }
      - { id: d, text: '$2x$', issueSignals: [{ id: chain-rule-missed }] }
    answer: { choiceId: a }
    issueSignals: [{ id: expression-equation-recognition-error }]
    difficultyDimensions: [representationTransfer, auxiliaryTechnique]
    explanation: |
      Solution: The derivative is the integrand evaluated at the upper limit: $x^2+1$.
      Why it works: This is the Fundamental Theorem of Calculus with fixed lower bound and upper bound $x$. Review path: Calculus 1 â†’ Riemann Integration.
      Why the other choices fail: B leaves a dummy variable, C is the accumulation before differentiating, and D differentiates only part of the result.
  - id: q014
    type: multipleChoice
    prompt: Which substitution is most useful for $\int 2x\cos(x^2)\,dx$?
    choices:
      - { id: a, text: '$u=x^2$' }
      - { id: b, text: '$u=\cos(x^2)$', issueSignals: [{ id: u-substitution-failure }] }
      - { id: c, text: '$u=2x$', issueSignals: [{ id: u-substitution-failure }] }
      - { id: d, text: '$u=x$', issueSignals: [{ id: u-substitution-failure }] }
    answer: { choiceId: a }
    issueSignals: [{ id: u-substitution-failure }]
    difficultyDimensions: [auxiliaryTechnique, representationTransfer]
    explanation: |
      Solution: Let $u=x^2$, so $du=2x\,dx$ and the integral becomes $\int\cos u\,du$.
      Why it works: The derivative of the inner expression is already present. Review path: Calculus 2 â†’ U-Sub Integration.
      Why the other choices fail: B makes du introduce an extra sine factor, C and D do not absorb the composite $x^2$.
  - id: q015
    type: multipleChoice
    prompt: Which coordinate system is most natural for the disk $x^2+y^2\le9$?
    choices:
      - { id: a, text: Polar coordinates' }
      - { id: b, text: Rectangular coordinates only', issueSignals: [{ id: incorrect-model-selection }] }
      - { id: c, text: Parametric coordinates only', issueSignals: [{ id: incorrect-model-selection }] }
      - { id: d, text: Spherical coordinates', issueSignals: [{ id: incorrect-model-selection }] }
    answer: { choiceId: a }
    issueSignals: [{ id: incorrect-model-selection }]
    difficultyDimensions: [representationTransfer, modelOrDerivation]
    explanation: |
      Solution: Use polar coordinates, where the disk is $0\le r\le3$ with a full turn of angle.
      Why it works: Radius from the origin describes circular boundaries directly. Review path: Trigonometry â†’ Polar Coordinates.
      Why the other choices fail: B can work but is less direct, C is not a region-coordinate system here, and D is for three-dimensional settings.
  - id: q016
    type: multipleChoice
    prompt: If $x=t^3-t$, what is $dx/dt$?
    choices:
      - { id: a, text: '$3t^2-1$' }
      - { id: b, text: '$t^2-1$', issueSignals: [{ id: parametric-derivative-error }] }
      - { id: c, text: '$3t^3-1$', issueSignals: [{ id: parametric-derivative-error }] }
      - { id: d, text: '$3t^2-t$', issueSignals: [{ id: parametric-derivative-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: parametric-derivative-error }]
    difficultyDimensions: [representationTransfer, auxiliaryTechnique]
    explanation: |
      Solution: Differentiate each term with respect to $t$ to get $3t^2-1$.
      Why it works: Parametric derivatives use the same ordinary derivative rules, with $t$ as the variable. Review path: Calculus 2 â†’ Parametric Curves.
      Why the other choices fail: B drops the coefficient, C does not lower the exponent, and D leaves t in the derivative of $-t$.
  - id: q017
    type: multipleChoice
    prompt: What is the real domain of $\ln(x-2)$?
    choices:
      - { id: a, text: '$x>2$' }
      - { id: b, text: '$x\ge2$', issueSignals: [{ id: domain-range-misidentified }] }
      - { id: c, text: '$x<2$', issueSignals: [{ id: domain-range-misidentified }] }
      - { id: d, text: 'all real x', issueSignals: [{ id: domain-range-misidentified }] }
    answer: { choiceId: a }
    issueSignals: [{ id: domain-range-misidentified }]
    difficultyDimensions: [domainCondition, simplification]
    explanation: |
      Solution: Require $x-2>0$, giving $x>2$.
      Why it works: A real logarithm requires a strictly positive argument. Review path: Calculus 1 â†’ Sets, Sequences, and Functions.
      Why the other choices fail: B incorrectly permits log zero, C makes the argument negative, and D ignores the logarithm restriction.
  - id: q018
    type: multipleChoice
    prompt: Evaluate $\int_0^1\frac{2t}{1+t^2}\,dt$.
    choices:
      - { id: a, text: '$\ln 2$' }
      - { id: b, text: '$1/2\ln 2$', issueSignals: [{ id: u-substitution-failure }] }
      - { id: c, text: '$2\ln 2$', issueSignals: [{ id: u-substitution-failure }] }
      - { id: d, text: '$1$', issueSignals: [{ id: power-rule-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: u-substitution-failure }]
    difficultyDimensions: [auxiliaryTechnique, representationTransfer, simplification]
    explanation: |
      Solution: Let $u=1+t^2$, so $du=2t\,dt$ and the bounds become 1 and 2. Thus $\int_1^2\frac1u\,du=\ln2$.
      Why it works: A matched inner derivative lets u-substitution transform both the integrand and definite bounds. Review path: Calculus 2 â†’ U-Sub Integration; for broader method selection, Calculus 2 â†’ Integration Techniques.
      Why the other choices fail: B and C mishandle the matched differential, while D treats a logarithmic antiderivative as a power rule result.
