schemaVersion: 1
id: pwsh-basics-directed-project
title: "Explore Your Local System"
assessmentType: directedProject
categoryId: scripting
subcategoryIds:
  - pwsh-navigation
  - pwsh-help-flags
questionCount: 0
guidedProject: null
directedProject:
  summary: "In this project, you will open a local PowerShell terminal and practice navigating your own file system and querying the help system."
  estimatedTimeMinutes: 15
  resources: []
  phases:
    - id: phase-1-terminal
      title: "Open PowerShell"
      steps:
        - id: step-1-open
          title: "Launch the Terminal"
          instruction: |
            1. Press the Windows key.
            2. Type `PowerShell` and press Enter.
            3. Note the prompt (usually starting with `PS C:\Users\YourName>`). This is your current location.
          checklist:
            - id: chk-open
              text: "Opened local PowerShell terminal"
          resources: []
    - id: phase-2-nav
      title: "Navigate and Inspect"
      steps:
        - id: step-2-navigate
          title: "Move Around"
          instruction: |
            1. Run `Get-Location` to verify where you are.
            2. Use `Set-Location ..` to move up one directory.
            3. Run `Get-ChildItem` to list the folders in this directory.
            4. Try using the alias `cd` to move back into your specific user folder.
          checklist:
            - id: chk-loc
              text: "Used Get-Location and Set-Location"
            - id: chk-ls
              text: "Used Get-ChildItem to view directories"
          resources: []
    - id: phase-3-help
      title: "Query the Help System"
      steps:
        - id: step-3-help
          title: "Update and Read Help"
          instruction: |
            1. *(Optional but recommended)*: Run `Update-Help` to ensure your local documentation is up to date (this may take a minute).
            2. Run `Get-Help Get-ChildItem -Examples`.
            3. Read through the examples. Notice how `-Recurse` and `-Filter` are used.
          checklist:
            - id: chk-help
              text: "Successfully queried examples for Get-ChildItem"
          resources: []
