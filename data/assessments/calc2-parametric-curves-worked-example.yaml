schemaVersion: 1
id: calc2-parametric-curves-worked-example
title: Graphing and Eliminating the Parameter
assessmentType: workedExample
categoryId: calculus-2
subcategoryIds:
  - parametric-curves
modeDefault: study
randomizeQuestions: false
workedExamples:
  - id: we-param-curves-1
    title: Eliminating the Parameter
    problem: |
      Consider the parametric equations:

      $$
      x = 3 \cos t, \quad y = 3 \sin t, \quad 0 \le t \le \pi
      $$

      Our goal is to eliminate the parameter $t$ to find a Cartesian equation in terms of $x$ and $y$, and determine the shape and direction of the curve.
    steps:
      - id: step-we-param-1a
        title: Relate the expressions using a trigonometric identity
        instruction: |
          Notice that $x$ and $y$ are defined using $\cos t$ and $\sin t$. 
          The most useful identity for eliminating $t$ when sine and cosine are involved is the Pythagorean identity:

          $$
          \cos^2 t + \sin^2 t = 1
          $$

          First, isolate $\cos t$ and $\sin t$.
        type: symbolicResponse
        prompt: 'What is the expression for $\cos t$ in terms of $x$?'
        answer:
          expectedLatex: '\frac{x}{3}'
          equivalenceMode: algebraic
          variables:
            - x
          tolerance: 0.000001
        explanation: |
          Since $x = 3 \cos t$, dividing both sides by 3 gives $\cos t = \frac{x}{3}$.
        skills:
          - parametric-curves

      - id: step-we-param-1b
        title: Substitute into the identity
        instruction: |
          We know $\cos t = \frac{x}{3}$ and similarly $\sin t = \frac{y}{3}$.
          
          Substitute these into the Pythagorean identity:
          
          $$
          \left(\frac{x}{3}\right)^2 + \left(\frac{y}{3}\right)^2 = 1
          $$
        type: symbolicResponse
        prompt: 'Simplify the equation into the standard form of a conic section (e.g., $x^2 + y^2 = r^2$). What is the value on the right side of the equation?'
        answer:
          expectedLatex: '9'
          equivalenceMode: algebraic
          variables:
            - x
            - y
          tolerance: 0.000001
        explanation: |
          Squaring the terms gives $\frac{x^2}{9} + \frac{y^2}{9} = 1$. 
          Multiplying by 9 yields $x^2 + y^2 = 9$. 
          This is a circle of radius 3 centered at the origin.
        skills:
          - parametric-curves

      - id: step-we-param-1c
        title: Determine the domain and direction
        instruction: |
          The parametric equations are restricted to $0 \le t \le \pi$.
          Let's evaluate the endpoints.
          
          At $t = 0$: $x = 3 \cos(0) = 3$, $y = 3 \sin(0) = 0$. (Point: $(3, 0)$)
          
          At $t = \pi$: $x = 3 \cos(\pi) = -3$, $y = 3 \sin(\pi) = 0$. (Point: $(-3, 0)$)
          
          Since $\sin t \ge 0$ for $0 \le t \le \pi$, the curve is the top half of the circle. As $t$ increases from $0$ to $\pi$, the $x$-coordinate decreases from $3$ to $-3$.
        type: multipleChoice
        prompt: 'In which direction is the curve traced?'
        choices:
          - id: c1
            text: Counter-clockwise
          - id: c2
            text: Clockwise
        answer:
          correctChoiceId: c1
        explanation: |
          The curve starts at $(3,0)$ on the positive x-axis and ends at $(-3,0)$ on the negative x-axis, tracing the upper half of the circle. This motion is counter-clockwise.
        skills:
          - parametric-curves

  - id: we-param-curves-2
    title: Finding Intersection and Collision Points
    problem: |
      Two particles move along curves defined by the following parametric equations:

      Particle A: $x_1 = t, \quad y_1 = t^2$

      Particle B: $x_2 = 3t - 2, \quad y_2 = t + 2$

      Do the paths of the particles intersect? Do the particles collide?
    steps:
      - id: step-we-param-2a
        title: Differentiate between intersection and collision
        instruction: |
          An **intersection point** occurs when the *paths* cross. The particles do not need to be there at the same time. We find these by setting $x_1(t_1) = x_2(t_2)$ and $y_1(t_1) = y_2(t_2)$.
          
          A **collision point** occurs if they reach the same point at the *same time*. We find these by setting $x_1(t) = x_2(t)$ and $y_1(t) = y_2(t)$.
        type: freeResponse
        prompt: Did you understand this difference?
        answer:
          gradingMode: selfCheck
        skills:
          - parametric-curves

      - id: step-we-param-2b
        title: Check for collision points
        instruction: |
          Let's check for collisions first by equating the $x$ and $y$ coordinates at the same time $t$.
          
          Set $x_1(t) = x_2(t)$:
          $t = 3t - 2 \implies 2t = 2 \implies t = 1$
          
          Now check if the $y$-coordinates match at $t=1$:
          $y_1(1) = 1^2 = 1$
          $y_2(1) = 1 + 2 = 3$
          
          Since $1 \neq 3$, the particles do not collide.
        type: freeResponse
        prompt: Did you follow the collision check?
        answer:
          gradingMode: selfCheck
        skills:
          - parametric-curves

      - id: step-we-param-2c
        title: Check for path intersections
        instruction: |
          To find path intersections, we eliminate the parameter for both equations to find their Cartesian forms.
          
          Particle A: $x = t \implies y = x^2$
          
          Particle B: $x = 3t - 2 \implies t = \frac{x+2}{3} \implies y = \frac{x+2}{3} + 2 = \frac{x+8}{3}$
          
          Now set the Cartesian equations equal to each other to find intersections:
          
          $$
          x^2 = \frac{x+8}{3}
          $$
          
          $$
          3x^2 - x - 8 = 0
          $$
          
          Using the quadratic formula:
          $x = \frac{1 \pm \sqrt{1 - 4(3)(-8)}}{6} = \frac{1 \pm \sqrt{97}}{6}$
          
          The paths do intersect at these two $x$-values!
        type: freeResponse
        prompt: Did you follow the intersection check?
        answer:
          gradingMode: selfCheck
        skills:
          - parametric-curves
