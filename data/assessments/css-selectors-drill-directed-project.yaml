schemaVersion: 1
id: css-selectors-drill-directed-project
title: CSS Selectors Drill
assessmentType: guidedProject
categoryId: css
subcategoryIds:
- css-selectors-specificity
modeDefault: practice
guidedProject:
  language: bash
  instructions: Add a CSS rule targeting the `.highlight` class to make the text red.
  files:
  - path: style.css
    readOnly: false
    content: ".highlight {\n  color: red;\n}\n"
  requiredChecks:
  - id: check-exists
    title: Check CSS File
    description: Check that the CSS file was updated.
    expectedOutputContains:
    - OK
    testCode: echo OK
