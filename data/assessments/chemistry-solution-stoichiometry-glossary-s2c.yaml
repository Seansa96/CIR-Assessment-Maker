glossary:
  introduction: 'Vocabulary for solution stoichiometry.'
  sections:
    - id: stoich-terms
      title: Stoichiometry Vocabulary
      entries:
        - id: entry-molarity-conv
          term: molarity conversion
          definition: 'Using molarity as a conversion factor between moles of solute and volume of solution.'
          drills:
            - { id: ssg-01, type: cloze, prompt: 'Molarity converts between volume and ___ of solute.', answer: { expected: moles }, explanation: 'Solution: The blank is moles. Why it works: M = mol/L.' }
        - id: entry-limiting
          term: limiting reactant
          definition: 'The reactant that is completely consumed in a reaction, determining the maximum product yield.'
          drills:
            - { id: ssg-02, type: flashcard, prompt: 'What determines the maximum product yield?', answer: { expected: limiting reactant }, explanation: 'Solution: Limiting reactant. Why it works: The reaction stops when it is gone.' }
        - id: entry-theoretical
          term: theoretical yield
          definition: 'The maximum amount of product that can be generated as calculated from the limiting reactant.'
          drills:
            - { id: ssg-03, type: flashcard, prompt: 'What is theoretical yield?', answer: { expected: maximum amount of product }, explanation: 'Solution: Maximum amount of product. Why it works: It assumes perfect reaction efficiency.' }
