workedExamples:
- id: we2
  title: Entropy of Free Expansion
  steps:
  - id: s1
    prompt: Identify the process and a reversible equivalent.
    explanation: 'Solution:

      1) Recognize that free expansion is an irreversible process with $Q=0$ and $W=0$, so $\Delta U=0$
      and temperature is constant.

      2) To find the entropy change, we must construct a reversible path between the same states. A reversible
      isothermal expansion works.


      Why it works:

      Entropy is a state variable. Its change depends only on the initial and final states, not the path
      taken. So we can use a hypothetical reversible process to calculate $\Delta S$ for an irreversible
      one.'
    title: Identify the process and a reversible equivalent.
    instruction: 'Work through this step: Identify the process and a reversible equivalent.'
    type: freeResponse
    answer:
      gradingMode: selfCheck
  - id: s2
    prompt: Calculate $\Delta S$ using the reversible path.
    explanation: 'Solution:

      1) For a reversible isothermal process, $dU = 0$, so $dQ = dW = P \, dV$.

      2) Substitute into the entropy formula: $dS = \frac{dQ}{T} = \frac{P \, dV}{T}$.

      3) Use the ideal gas law $P = \frac{nRT}{V}$ to get $dS = \frac{nR}{V} dV$.

      4) Integrate: $\Delta S = \int_{V}^{2V} \frac{nR}{V} dV = nR \ln\left(\frac{2V}{V}\right) = nR \ln(2)$.


      Why it works:

      The integration of $\frac{1}{V}$ yields the natural logarithm, showing that entropy increases when
      volume increases isothermally.'
    title: Calculate $\Delta S$ using the reversible path.
    instruction: 'Work through this step: Calculate $\Delta S$ using the reversible path.'
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: An ideal gas undergoes a free expansion from volume $V$ to volume $2V$ in an insulated container.
    Calculate the change in entropy of the gas. Assume $n$ moles of gas.
