modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: multipleChoice
    prompt: |
      A constant force $\vec{F} = (3\hat{i} + 4\hat{j})$ N acts on a particle as it moves from the origin to a position $\vec{r} = (2\hat{i} - 1\hat{j})$ m. How much work is done by the force?
    choices:
      - id: a
        text: 10 J
      - id: b
        text: 2 J
      - id: c
        text: 5 J
      - id: d
        text: 0 J
    answer:
      choiceId: b
    explanation: |
      Work is the dot product of force and displacement. $W = \vec{F} \cdot \vec{r} = (3)(2) + (4)(-1) = 6 - 4 = 2$ J.

  - id: q002
    type: multipleChoice
    prompt: |
      A 2.0 kg block is moving at 5.0 m/s. It experiences a net work of 24 J. What is its final kinetic energy?
    choices:
      - id: a
        text: 49 J
      - id: b
        text: 25 J
      - id: c
        text: 24 J
      - id: d
        text: 7 J
    answer:
      choiceId: a
    explanation: |
      Initial kinetic energy $K_i = \frac{1}{2} m v_i^2 = \frac{1}{2} (2.0) (5.0)^2 = 25$ J. By the Work-Kinetic Energy Theorem, $W_{net} = K_f - K_i \implies 24 = K_f - 25 \implies K_f = 49$ J.

  - id: q003
    type: multipleChoice
    prompt: |
      A force acting on a particle in the x-direction varies with position according to the equation $F(x) = 2x$. How much work is done by this force as the particle moves from $x = 0$ m to $x = 3$ m?
    choices:
      - id: a
        text: 6 J
      - id: b
        text: 9 J
      - id: c
        text: 3 J
      - id: d
        text: 18 J
    answer:
      choiceId: b
    explanation: |
      Work is the integral of the force function: $W = \int_{0}^{3} 2x dx = [x^2]_0^3 = (3)^2 - (0)^2 = 9$ J.


