questions:
- id: q001
  type: multipleChoice
  title: Dot Product Work
  prompt: |
    A constant force $\vec{F} = (3\hat{i} + 4\hat{j})\text{ N}$ acts on a particle as it moves from the origin to a position $\vec{r} = (2\hat{i} - 1\hat{j})\text{ m}$.
    How much work is done by the force?
  choices:
  - id: a
    text: 10 J
  - id: b
    text: 2 J
  - id: c
    text: 5 J
  - id: d
    text: 0 J
  answer:
    choiceId: b
  explanation: |
    Work is the dot product of force and displacement. 
    $W = \vec{F} \cdot \vec{r} = (3)(2) + (4)(-1) = 6 - 4 = 2\text{ J}$.
  skills:
  - physics-work-energy
- id: q002
  type: multipleChoice
  title: Final Kinetic Energy
  prompt: |
    A $2.0\text{ kg}$ block is moving at $5.0\text{ m/s}$. It experiences a net work of $24\text{ J}$.
    What is its final kinetic energy?
  choices:
  - id: a
    text: 49 J
  - id: b
    text: 25 J
  - id: c
    text: 24 J
  - id: d
    text: 7 J
  answer:
    choiceId: a
  explanation: |
    Initial kinetic energy $K_i = \frac{1}{2} m v_i^2 = \frac{1}{2} (2.0)(5.0)^2 = 25\text{ J}$. 
    By the Work-Kinetic Energy Theorem, $W_{\text{net}} = K_f - K_i \implies 24 = K_f - 25 \implies K_f = 49\text{ J}$.
  skills:
  - physics-work-energy
- id: q003
  type: multipleChoice
  title: Variable Force Integral
  prompt: |
    A force acting on a particle in the x-direction varies with position according to the equation $F(x) = 2x$. 
    How much work is done by this force as the particle moves from $x = 0\text{ m}$ to $x = 3\text{ m}$?
  choices:
  - id: a
    text: 6 J
  - id: b
    text: 9 J
  - id: c
    text: 3 J
  - id: d
    text: 18 J
  answer:
    choiceId: b
  explanation: |
    Work is the integral of the force function: 
    $W = \int_{0}^{3} 2x dx = [x^2]_0^3 = (3)^2 - (0)^2 = 9\text{ J}$.
  skills:
  - physics-work-energy
- id: q004
  type: multipleChoice
  title: Negative Net Work
  prompt: |
    A $1.0\text{ kg}$ particle is initially moving at $10\text{ m/s}$. A net force does $-18\text{ J}$ of work on the particle. 
    What is the final speed of the particle?
  choices:
  - id: a
    text: 8 m/s
  - id: b
    text: 6 m/s
  - id: c
    text: 32 m/s
  - id: d
    text: 4 m/s
  answer:
    choiceId: a
  explanation: |
    The initial kinetic energy is $K_i = \frac{1}{2}(1.0)(10)^2 = 50\text{ J}$.
    The Work-Energy theorem states $W_{\text{net}} = K_f - K_i$.
    $-18\text{ J} = K_f - 50\text{ J} \implies K_f = 32\text{ J}$.
    Now solve for final speed: $K_f = \frac{1}{2}mv_f^2 \implies 32 = \frac{1}{2}(1.0)v_f^2 \implies v_f^2 = 64 \implies v_f = 8\text{ m/s}$.
  skills:
  - physics-work-energy
