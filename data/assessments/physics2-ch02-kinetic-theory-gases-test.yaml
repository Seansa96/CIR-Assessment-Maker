questions:
- id: q001
  type: freeResponse
  skills:
  - physics2-ch02-modeling
  prompt: A Kinetic Theory of Gases situation emphasizes ideal-gas assumptions. Define the system and sign convention,
    state when $PV = Nk_BT$ applies, and construct a written solution that includes the relation, units, assumptions,
    and a limiting-case check.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - defines the system and sign convention
    - states or applies $PV = Nk_BT$ with appropriate assumptions
    - shows units and an intermediate relation
    - checks direction or a limiting case
  explanation: 'Solution: Start from a defined system, write the governing relation symbolically, then connect the
    result to units and a physical limit.


    Why it works: The Kinetic Theory of Gases model of molecular motion in an ideal gas is reliable only when its
    relation, conditions, and interpretation are kept together.'
