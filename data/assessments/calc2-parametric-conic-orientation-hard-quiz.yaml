questions:
  - id: q001
    type: multipleChoice
    issueSignals:
    - id: parametric-derivative-error
    - id: expression-equation-recognition-error
    - id: chain-rule-missed
    - id: conic-section-misidentified
    - id: trigonometric-identity-misapplied
    prompt: |
      Select the graph for $0\le t\le2\pi$:

      $$
      x=-1+1.5\cos\left(-t+\frac{\pi}{2}\right),
      \qquad
      y=2+3\sin\left(-t+\frac{\pi}{2}\right).
      $$
    choices:
      - id: a
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-ellipse-top-cw.svg)
      - id: b
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-ellipse-top-ccw.svg)
      - id: c
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-ellipse-shift-right-cw.svg)
      - id: d
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-top-cw.svg)
    answer:
      choiceId: a
    explanation: |
      The center is $(-1,2)$, the vertical radius is larger, the phase shift starts at the top, and the negative $t$ creates clockwise motion.

  - id: q002
    type: multipleChoice
    issueSignals:
    - id: parametric-derivative-error
    - id: expression-equation-recognition-error
    - id: chain-rule-missed
    - id: conic-section-misidentified
    - id: trigonometric-identity-misapplied
    prompt: |
      Select the graph for $-2\le t\le2$:

      $$
      x=t,\qquad y=t^2.
      $$
    choices:
      - id: a
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-parabola-x-t-y-t2.svg)
      - id: b
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-parabola-x-t2-y-t.svg)
      - id: c
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-hyperbola-right.svg)
      - id: d
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-ellipse-top-ccw.svg)
    answer:
      choiceId: a
    explanation: |
      Since $x=t$, the trace moves left to right. The value $y=t^2$ starts high, drops to the vertex, then rises.

  - id: q003
    type: multipleChoice
    issueSignals:
    - id: parametric-derivative-error
    - id: expression-equation-recognition-error
    - id: chain-rule-missed
    - id: conic-section-misidentified
    - id: trigonometric-identity-misapplied
    prompt: |
      Select the graph for $-2\le t\le2$:

      $$
      x=t^2,\qquad y=t.
      $$
    choices:
      - id: a
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-parabola-x-t2-y-t.svg)
      - id: b
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-parabola-x-t-y-t2.svg)
      - id: c
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-hyperbola-left.svg)
      - id: d
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-ellipse-shift-right-ccw.svg)
    answer:
      choiceId: a
    explanation: |
      Here $y=t$, so motion is bottom to top. Since $x=t^2$, the graph is a sideways parabola with vertex at the origin.

  - id: q004
    type: multipleChoice
    issueSignals:
    - id: parametric-derivative-error
    - id: expression-equation-recognition-error
    - id: chain-rule-missed
    - id: conic-section-misidentified
    - id: trigonometric-identity-misapplied
    prompt: |
      Select the graph for $-1.08\le t\le1.08$:

      $$
      x=\sec t,\qquad y=\tan t.
      $$
    choices:
      - id: a
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-hyperbola-right.svg)
      - id: b
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-hyperbola-left.svg)
      - id: c
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-parabola-x-t-y-t2.svg)
      - id: d
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-ellipse-top-cw.svg)
    answer:
      choiceId: a
    explanation: |
      The identity $\sec^2t-\tan^2t=1$ gives $x^2-y^2=1$. Since $x=\sec t>0$ on this interval, the trace is the right branch.

  - id: q005
    type: multipleChoice
    issueSignals:
    - id: parametric-derivative-error
    - id: expression-equation-recognition-error
    - id: chain-rule-missed
    - id: conic-section-misidentified
    - id: trigonometric-identity-misapplied
    prompt: |
      Select the graph for $-1.08\le t\le1.08$:

      $$
      x=-\sec t,\qquad y=\tan t.
      $$
    choices:
      - id: a
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-hyperbola-left.svg)
      - id: b
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-hyperbola-right.svg)
      - id: c
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-parabola-x-t2-y-t.svg)
      - id: d
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-left-cw.svg)
    answer:
      choiceId: a
    explanation: |
      The negative secant forces $x<0$, so this is the left branch of $x^2-y^2=1$.

  - id: q006
    type: multipleChoice
    issueSignals:
    - id: parametric-derivative-error
    - id: expression-equation-recognition-error
    - id: chain-rule-missed
    - id: conic-section-misidentified
    - id: trigonometric-identity-misapplied
    prompt: |
      Select the parameterization that best matches the graph.

      ![Tall ellipse with red starting point at the top and clockwise arrows](/assessments/calc2-parametric-polar/parametric-conic-quiz-ellipse-top-cw.svg)
    choices:
      - id: a
        text: '$x=-1+1.5\cos(-t+\frac{\pi}{2}),\ y=2+3\sin(-t+\frac{\pi}{2})$'
      - id: b
        text: '$x=-1+1.5\cos(t+\frac{\pi}{2}),\ y=2+3\sin(t+\frac{\pi}{2})$'
      - id: c
        text: '$x=2+3\cos(-t),\ y=1+1.2\sin(-t)$'
      - id: d
        text: '$x=\cos(-t+\frac{\pi}{2}),\ y=\sin(-t+\frac{\pi}{2})$'
    answer:
      choiceId: a
    explanation: |
      The graph is centered at $(-1,2)$ and starts at its top. Clockwise orientation requires $-t$.

  - id: q007
    type: multipleChoice
    issueSignals:
    - id: parametric-derivative-error
    - id: expression-equation-recognition-error
    - id: chain-rule-missed
    - id: conic-section-misidentified
    - id: trigonometric-identity-misapplied
    prompt: |
      Select the parameterization that best matches the graph.

      ![Parabola traced from left high point through the vertex to right high point](/assessments/calc2-parametric-polar/parametric-conic-quiz-parabola-x-t-y-t2.svg)
    choices:
      - id: a
        text: '$x=t,\ y=t^2,\ -2\le t\le2$'
      - id: b
        text: '$x=t^2,\ y=t,\ -2\le t\le2$'
      - id: c
        text: '$x=\sec t,\ y=\tan t,\ -1.08\le t\le1.08$'
      - id: d
        text: '$x=\cos t,\ y=\sin t,\ 0\le t\le2\pi$'
    answer:
      choiceId: a
    explanation: |
      The motion proceeds left to right, so $x=t$ is the natural parameter. The vertical coordinate is squared.

  - id: q008
    type: multipleChoice
    issueSignals:
    - id: parametric-derivative-error
    - id: expression-equation-recognition-error
    - id: chain-rule-missed
    - id: conic-section-misidentified
    - id: trigonometric-identity-misapplied
    prompt: |
      Select the parameterization that best matches the graph.

      ![Sideways parabola traced from lower right through the vertex to upper right](/assessments/calc2-parametric-polar/parametric-conic-quiz-parabola-x-t2-y-t.svg)
    choices:
      - id: a
        text: '$x=t^2,\ y=t,\ -2\le t\le2$'
      - id: b
        text: '$x=t,\ y=t^2,\ -2\le t\le2$'
      - id: c
        text: '$x=-\sec t,\ y=\tan t,\ -1.08\le t\le1.08$'
      - id: d
        text: '$x=2+3\cos t,\ y=1+1.2\sin t$'
    answer:
      choiceId: a
    explanation: |
      The graph opens right because $x=t^2\ge0$. Since $y=t$, the red starting point is at the lower end and the trace moves upward.

  - id: q009
    type: multipleChoice
    issueSignals:
    - id: parametric-derivative-error
    - id: expression-equation-recognition-error
    - id: chain-rule-missed
    - id: conic-section-misidentified
    - id: trigonometric-identity-misapplied
    prompt: |
      Select the parameterization that best matches the graph.

      ![Right hyperbola branch with red starting point low and arrows moving upward](/assessments/calc2-parametric-polar/parametric-conic-quiz-hyperbola-right.svg)
    choices:
      - id: a
        text: '$x=\sec t,\ y=\tan t,\ -1.08\le t\le1.08$'
      - id: b
        text: '$x=-\sec t,\ y=\tan t,\ -1.08\le t\le1.08$'
      - id: c
        text: '$x=t^2,\ y=t,\ -2\le t\le2$'
      - id: d
        text: '$x=\cos t,\ y=\sin t,\ 0\le t\le2\pi$'
    answer:
      choiceId: a
    explanation: |
      The trace is on the right branch because $\sec t$ is positive on the interval. The tangent coordinate increases with $t$, so the arrows move upward.

  - id: q010
    type: multipleChoice
    issueSignals:
    - id: parametric-derivative-error
    - id: expression-equation-recognition-error
    - id: chain-rule-missed
    - id: conic-section-misidentified
    - id: trigonometric-identity-misapplied
    prompt: |
      Select the parameterization that best matches the graph.

      ![Shifted ellipse with red starting point at the right and clockwise arrows](/assessments/calc2-parametric-polar/parametric-conic-quiz-ellipse-shift-right-cw.svg)
    choices:
      - id: a
        text: '$x=2+3\cos(-t),\ y=1+1.2\sin(-t)$'
      - id: b
        text: '$x=2+3\cos t,\ y=1+1.2\sin t$'
      - id: c
        text: '$x=-1+1.5\cos(-t+\frac{\pi}{2}),\ y=2+3\sin(-t+\frac{\pi}{2})$'
      - id: d
        text: '$x=t,\ y=t^2$'
    answer:
      choiceId: a
    explanation: |
      The rightmost starting point matches $t=0$ with cosine equal to $1$. The arrows move clockwise, so the parameter is negated.
