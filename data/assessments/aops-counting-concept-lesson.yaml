lesson:
  introduction: Learn to solve Learning to Count problems by recognizing multiplication principle, number of divisors, permutations, arrangements, overcounting, complements, binomial theorem and justifying each theorem or transformation.
  sections:
  - id: aops-counting-motivation
    title: What the topic helps you notice
    required: true
    content: Learning to Count is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are multiplication principle, number of divisors, permutations, arrangements, overcounting, complements, binomial theorem.
    check:
      id: aops-counting-motivation-check
      type: multipleChoice
      prompt: In Learning to Count, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-counting-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-counting-definitions-check
      type: multipleChoice
      prompt: In Learning to Count, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
