      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-counting-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: choose distinguishable vs identical, count the complement, divide by symmetry. Record the givens, unknown, and any restriction before selecting a method.'
    check:
