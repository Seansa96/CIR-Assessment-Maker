  - id: sec-6
    title: Concentration versus strength
    required: true
    content: Concentration is how much solute is present per volume; strength is the equilibrium tendency to ionize. A dilute strong acid can have less hydronium than a concentrated weak acid.
    media:
    - type: image
      src: /media/chemistry/chem-acids-model.svg
      alt: Acid-base model diagram.
      caption: 
    check:
      id: chk-6
      type: multipleChoice
      prompt: Which comparison is logically valid?
      choices:
      - id: a
        text: A 0.001 M strong acid can be less acidic than a 1.0 M weak acid only if their ionization produces the stated hydronium values
        media: []
        issueSignals: []
      - id: b
        text: Strength and concentration are identical properties
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      - id: c
        text: A dilute weak acid always gives more H3O+ than a strong acid
        media: []
        issueSignals:
        - id: strong-weak-acid-base-confusion
          domains:
          - chemistry
      - id: d
        text: Hydronium is unrelated to ionization
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
