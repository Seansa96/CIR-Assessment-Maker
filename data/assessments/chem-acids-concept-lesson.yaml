    - type: image
      src: /media/chemistry/chem-acids-model.svg
      alt: Acid-base model diagram.
      caption: 
    check:
      id: chk-4
      type: multipleChoice
      prompt: Which statement describes a weak acid in water?
      choices:
      - id: a
        text: It ionizes partially and remains in equilibrium with its conjugate base
        media: []
        issueSignals: []
      - id: b
        text: It dissociates only partially and reaches a reversible equilibrium
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
