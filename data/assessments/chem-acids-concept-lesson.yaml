lesson:
  introduction: Build the foundational acid-base vocabulary used to classify aqueous substances and predict proton-transfer partners.
  sections:
  - id: sec-1
    title: Aqueous identification
    required: true
    content: An Arrhenius acid increases aqueous hydronium, while an Arrhenius base increases hydroxide. Start by identifying the species whose concentration changes in water.
    media:
    - type: image
      src: /media/chemistry/chem-acids-model.svg
      alt: Acid-base model diagram.
      caption: 
    check:
      id: chk-1
      type: multipleChoice
      prompt: Which observation identifies an Arrhenius acid?
      choices:
      - id: a
        text: The solution gains H3O+ when the solute dissolves
        media: []
        issueSignals: []
      - id: b
        text: It lowers H3O+ while increasing oxidation number
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      - id: c
        text: It must contain oxygen in its formula
        media: []
        issueSignals:
        - id: strong-weak-acid-base-confusion
          domains:
          - chemistry
      - id: d
        text: It is classified from color alone
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: Choice A (The solution gains H3O+ when the solute dissolves).


        Why it works: For the Aqueous identification check, identify the governing acid-base relation in the prompt, apply it to the stated species or values, and verify charge, units, or model scope.


        Why the other choices fail: Choice B (It lowers H3O+ while increasing oxidation number) uses the wrong model or operation; choice C (It must contain oxygen in its formula) ignores a stated condition; choice D (It is classified from color alone) substitutes an irrelevant shortcut.
