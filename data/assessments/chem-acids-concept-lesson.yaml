  - id: sec-3
    title: Conjugate partners
    required: true
    content: Removing one proton from an acid gives its conjugate base; adding one proton to a base gives its conjugate acid. Partners differ by exactly one $H^+$.
    media:
    - type: image
      src: /media/chemistry/acid-conjugate-pairs.svg
      alt: Carbonic acid loses one proton to form bicarbonate.
      caption: Carbonic acid loses one proton to form bicarbonate.
    check:
      id: chk-3
      type: multipleChoice
      prompt: What is the conjugate base of $H_2CO_3$?
      choices:
      - id: a
        text: $HCO_3^-$
        media: []
        issueSignals: []
      - id: b
        text: $CO_3^{2-}$
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      - id: c
        text: $H_3O^+$
        media: []
        issueSignals:
        - id: strong-weak-acid-base-confusion
          domains:
          - chemistry
      - id: d
        text: A species formed by adding two protons
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        How to Solve: Choice A ($HCO_3^-$).


        Why it works: A conjugate base forms when its acid loses one H⁺. Removing one proton from H₂CO₃ leaves HCO₃⁻.


        Why the other choices fail: Choice B ($CO_3^{2-}$) uses the wrong model or operation; choice C ($H_3O^+$) ignores a stated condition; choice D (A species formed by adding two protons) substitutes an irrelevant shortcut.
