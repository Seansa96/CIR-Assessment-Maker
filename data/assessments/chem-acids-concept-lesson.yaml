  - id: sec-4
    title: Strong and weak behavior
    required: true
    content: A strong acid or base is treated as completely dissociated in water; a weak one establishes a partial-ionization equilibrium. Strength is not the same as solution concentration.
    media:
    - type: image
      src: /media/chemistry/acid-strength-equilibrium.svg
      alt: A weak acid remains in equilibrium with its ions.
      caption: A weak acid remains in equilibrium with its ions.
    check:
      id: chk-4
      type: multipleChoice
      prompt: Which statement describes a weak acid in water?
      choices:
      - id: a
        text: It ionizes partially and remains in equilibrium with its conjugate base
        media: []
        issueSignals: []
      - id: b
        text: It ionizes completely, so essentially no HA remains
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      - id: c
        text: It dissociates completely by definition
        media: []
        issueSignals:
        - id: strong-weak-acid-base-confusion
          domains:
          - chemistry
      - id: d
        text: Its concentration alone makes it strong
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        How to Solve: Choice A (It ionizes partially and remains in equilibrium with its conjugate base).


        Why it works: A weak acid ionizes only partly, so both the undissociated acid and its ions remain at equilibrium. Strength describes ionization, not concentration.


        Why the other choices fail: Choice B (It ionizes completely, so essentially no HA remains) uses the wrong model or operation; choice C (It dissociates completely by definition) ignores a stated condition; choice D (Its concentration alone makes it strong) substitutes an irrelevant shortcut.
