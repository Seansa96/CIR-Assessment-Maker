  - id: sec-2
    title: Proton donation and acceptance
    required: true
    content: In the Bronsted-Lowry model, an acid donates $H^+$ and a base accepts $H^+$. Track the proton, not just the oxygen or hydrogen count.
    media:
    - type: image
      src: /media/chemistry/acid-proton-transfer.svg
      alt: Water donates a proton to ammonia, forming ammonium and hydroxide.
      caption: Water donates a proton to ammonia, forming ammonium and hydroxide.
    check:
      id: chk-2
      type: multipleChoice
      prompt: In $NH_3$ + H2O ⇌ $NH_4^+$ + $OH^-$, which species is the proton donor?
      choices:
      - id: a
        text: H2O
        media: []
        issueSignals: []
      - id: b
        text: $NH_3$
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      - id: c
        text: $Cl^-$ after it has already accepted $H^+$
        media: []
        issueSignals:
        - id: strong-weak-acid-base-confusion
          domains:
          - chemistry
      - id: d
        text: Only the solvent can donate a proton
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        How to Solve: Choice A (H2O).


        Why it works: In the equation, water becomes hydroxide, so it has lost H⁺ and is the proton donor. Ammonia gains that proton and becomes ammonium.


        Why the other choices fail: Choice B ($NH_3$) uses the wrong model or operation; choice C ($Cl^-$ after it has already accepted $H^+$) ignores a stated condition; choice D (Only the solvent can donate a proton) substitutes an irrelevant shortcut.
