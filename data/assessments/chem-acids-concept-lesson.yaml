        text: It remains entirely as neutral molecules
        media: []
        issueSignals:
        - id: strong-weak-acid-base-confusion
          domains:
          - chemistry
      - id: d
        text: It conducts because oxidation states change
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      answer:
        choiceId: a
        choiceIds: []
