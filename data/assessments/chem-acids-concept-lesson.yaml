lesson:
  introduction: Build the foundational acid-base vocabulary used to classify aqueous substances and predict proton-transfer partners.
  sections:
  - id: sec-1
    title: Aqueous identification
    required: true
    content: An Arrhenius acid increases aqueous hydronium, while an Arrhenius base increases hydroxide. Start by identifying the species whose concentration changes in water.
    media:
    - type: image
      src: /media/chemistry/acid-arrhenius-identification.svg
      alt: A solute that raises hydronium in water is an Arrhenius acid.
      caption: A solute that raises hydronium in water is an Arrhenius acid.
    check:
      id: chk-1
      type: multipleChoice
      prompt: Which observation identifies an Arrhenius acid?
      choices:
      - id: a
        text: The solution gains $H_3O^+$ when the solute dissolves
        media: []
        issueSignals: []
      - id: b
        text: It lowers $H_3O^+$ while increasing oxidation number
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      - id: c
        text: It must contain oxygen in its formula
        media: []
        issueSignals:
        - id: strong-weak-acid-base-confusion
          domains:
          - chemistry
      - id: d
        text: It is classified from color alone
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        How to Solve: Choice A (The solution gains $H_3O^+$ when the solute dissolves).


        Why it works: An Arrhenius acid increases hydronium concentration in water; the other choices confuse the definition with oxidation, formula composition, or an indicator shortcut.


        Why the other choices fail: Choice B (It lowers $H_3O^+$ while increasing oxidation number) uses the wrong model or operation; choice C (It must contain oxygen in its formula) ignores a stated condition; choice D (It is classified from color alone) substitutes an irrelevant shortcut.
