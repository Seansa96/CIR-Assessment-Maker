  - id: sec-5
    title: Electrolyte consequences
    required: true
    content: Dissociation creates mobile ions, so strong electrolytes conduct more completely at comparable concentration. Count ions and charge to check a representation.
    media:
    - type: image
      src: /media/chemistry/acid-electrolyte-conduction.svg
      alt: Hydronium and chloride ions move in opposite directions and carry current.
      caption: Hydronium and chloride ions move in opposite directions and carry current.
    check:
      id: chk-5
      type: multipleChoice
      prompt: Why does aqueous HCl conduct as a strong electrolyte?
      choices:
      - id: a
        text: It produces nearly complete populations of mobile $H_3O^+$ and $Cl^-$ ions
        media: []
        issueSignals: []
      - id: b
        text: It creates mobile ions nearly completely in water
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
