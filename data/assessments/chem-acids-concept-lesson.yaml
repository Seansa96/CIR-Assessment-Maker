    - type: image
      src: /media/chemistry/chem-acids-model.svg
      alt: Acid-base model diagram.
      caption: 
    check:
      id: chk-2
      type: multipleChoice
      prompt: In NH3 + H2O ⇌ NH4+ + OH−, which species is the proton donor?
      choices:
      - id: a
        text: H2O
        media: []
        issueSignals: []
      - id: b
        text: NH3
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      - id: c
        text: Cl− after it has already accepted H+
        media: []
        issueSignals:
        - id: strong-weak-acid-base-confusion
          domains:
          - chemistry
      - id: d
        text: Only the solvent can donate a proton
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
