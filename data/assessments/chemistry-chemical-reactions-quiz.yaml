schemaVersion: 1
id: chemistry-chemical-reactions-quiz
title: Chemical Reactions Quiz
assessmentType: quiz
categoryId: chemistry
subcategoryIds:
- chemistry-reactions
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  prompt: 'Which of the following describes a precipitation reaction?

    '
  choices:
  - id: a
    text: Two aqueous solutions are mixed, and a solid insoluble product is formed.
  - id: b
    text: An acid and a base are mixed, forming water and a salt.
  - id: c
    text: A solid dissolves in a liquid to form a\rhomogeneous solution.
  - id: d
    text: Electrons are transferred from one species to another.
  answer:

    choiceId: a
  explanation: 'A precipitation reaction is characterized by the formation of an insoluble
    solid (the precipitate) when two aqueous solutions are combined.

    '
- id: q002
  type: multipleChoice
  prompt: 'Based on general solubility rules, which of the following compounds is
    insoluble in water?

    '
  choices:
  - id: a
    text: AgCl
  - id: b
    text: NaNO3
  - id: c
    text: KCl
  - id: d
    text: NH4Br
  answer:

    choiceId: a
  explanation: 'Most chlorides are soluble, but AgCl, PbCl2, and Hg2Cl2 are notable
    exceptions. AgCl is insoluble. Compounds containing Na+, K+, NH4+, or NO3- are
    almost always soluble.

    '
- id: q003
  type: multipleChoice
  prompt: 'What is the net ionic equation for the reaction between aqueous solutions
    of BaCl2 and Na2SO4?

    (BaSO4 is insoluble in water).

    '
  choices:
  - id: a
    text: Ba2+(aq) + SO42-(aq) → BaSO4(s)
  - id: b
    text: BaCl2(aq) + Na2SO4(aq) → BaSO4(s) + 2NaCl(aq)
  - id: c
    text: Na+(aq) + Cl-(aq) → NaCl(aq)
  - id: d
    text: Ba2+(aq) + 2Cl-(aq) + 2Na+(aq) + SO42-(aq) → BaSO4(s) + 2Na+(aq) + 2Cl-(aq)
  answer:

    choiceId: a
  explanation: 'The net ionic equation shows only the species that participate in
    forming the precipitate. The spectator ions (Na+ and Cl-) are omitted. The participating
    ions are Ba2+ and SO42- forming BaSO4(s).

    '
- id: q004
  type: multipleChoice
  prompt: 'Identify the spectator ions in the following complete ionic equation:

    Ag+(aq) + NO3-(aq) + K+(aq) + Cl-(aq) → AgCl(s) + K+(aq) + NO3-(aq)

    '
  choices:
  - id: a
    text: K+ and NO3-
  - id: b
    text: Ag+ and Cl-
  - id: c
    text: Ag+ and K+
  - id: d
    text: Cl- and NO3-
  answer:

    choiceId: a
  explanation: 'Spectator ions appear unchanged on both sides of the equation. K+
    and NO3- are aqueous on the reactant side and aqueous on the product side, so
    they are the spectator ions.

    '
- id: q005
  type: multipleChoice
  prompt: 'In the reaction: Zn(s) + Cu2+(aq) → Zn2+(aq) + Cu(s)

    Which species is oxidized, and which is reduced?

    '
  choices:
  - id: a
    text: Zn is oxidized; Cu2+ is reduced.
  - id: b
    text: Cu2+ is oxidized; Zn is reduced.
  - id: c
    text: Zn is reduced; Cu is oxidized.
  - id: d
    text: Both Zn and Cu2+ are oxidized.
  answer:

    choiceId: a
  explanation: 'Zn goes from 0 to +2 (loss of electrons = oxidation). Cu2+ goes from
    +2 to 0 (gain of electrons = reduction). Remember OIL RIG.

    '
- id: q006
  type: multipleChoice
  prompt: 'What is the oxidation state of sulfur in the sulfate ion (SO42-)?

    '
  choices:
  - id: a
    text: 6
  - id: b
    text: -2
  - id: c
    text: 4
  - id: d
    text: 8
  answer:

    choiceId: a
  explanation: 'Oxygen is typically -2. Four oxygens give a total of -8. The overall
    charge of the ion is -2. Therefore, S + (-8) = -2, which means S must be +6.

    '
- id: q007
  type: multipleChoice
  prompt: 'In a redox reaction, what role does the reducing agent play?

    '
  choices:
  - id: a
    text: It donates electrons and becomes oxidized.
  - id: b
    text: It accepts electrons and becomes oxidized.
  - id: c
    text: It donates electrons and becomes reduced.
  - id: d
    text: It accepts electrons and becomes reduced.
  answer:

    choiceId: a
  explanation: 'The reducing agent *causes* reduction by donating its electrons to
    another species. In the process of donating electrons (losing them), the reducing
    agent itself is oxidized.

    '
- id: q008
  type: multipleChoice
  prompt: 'Which of the following reactions is NOT an oxidation-reduction (redox)
    reaction?

    '
  choices:
  - id: a
    text: HCl(aq) + NaOH(aq) → H2O(l) + NaCl(aq)
  - id: b
    text: 2Na(s) + Cl2(g) → 2NaCl(s)
  - id: c
    text: CH4(g) + 2O2(g) → CO2(g) + 2H2O(g)
  - id: d
    text: Fe2O3(s) + 3CO(g) → 2Fe(s) + 3CO2(g)
  answer:

    choiceId: a
  explanation: 'HCl + NaOH is an acid-base neutralization (double displacement). No
    oxidation states change (H remains +1, Cl remains -1, Na remains +1, O remains
    -2). The other three are redox reactions (synthesis, combustion, and single displacement/reduction
    of an ore).

    '
- id: q009
  type: multipleChoice
  prompt: 'In an acid-base titration, what is the purpose of the indicator?

    '
  choices:
  - id: a
    text: It changes color to signal the equivalence point (or endpoint) of the reaction.
  - id: b
    text: It acts as a catalyst to speed up the neutralization.
  - id: c
    text: It neutralizes the excess acid or base.
  - id: d
    text: It measures the exact pH of the solution continuously.
  answer:

    choiceId: a
  explanation: 'An indicator is a substance that undergoes a distinct color change
    near the equivalence point of a titration, allowing the experimenter to know when
    the reaction is complete (the endpoint).

    '
- id: q010
  type: numericResponse
  prompt: 'A 25.00 mL sample of HCl of unknown concentration is titrated with 0.100
    M NaOH. It requires 18.50 mL of the NaOH solution to reach the endpoint. What
    is the molarity of the HCl solution?

    '
  answer:
    value: 0.074
    tolerance: 0.001
  explanation: 'HCl + NaOH → NaCl + H2O. Mole ratio is 1:1.

    moles NaOH = 0.100 M × 0.01850 L = 0.00185 mol.

    moles HCl = 0.00185 mol.

    Molarity HCl = 0.00185 mol / 0.02500 L = 0.0740 M.

    '
