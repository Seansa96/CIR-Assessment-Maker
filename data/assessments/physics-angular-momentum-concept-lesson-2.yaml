lesson:
  introduction: By differentiating angular momentum with respect to time, we find
    a profound relationship between torque and angular momentum.
  sections:
  - id: sec-1
    title: Torque and Angular Momentum
    content: "Newton's second law in linear form is $\\vec{F}_{net} = \\frac{d\\vec{p}}{dt}$.\
      \ \n\nThe rotational equivalent states that the net external torque acting on\
      \ a system equals the rate of change of the system's angular momentum:\n\n$$\\\
      vec{\\tau}_{net} = \\frac{d\\vec{L}}{dt}$$\n\nIf the moment of inertia is constant,\
      \ this simplifies to $\\tau_{net} = I \\frac{d\\omega}{dt} = I\\alpha$, which\
      \ we saw previously. But $\\vec{\\tau}_{net} = \\frac{d\\vec{L}}{dt}$ is the\
      \ more fundamental and universally true law."
    media: []
    check:
      id: chk-am-3
      type: multipleChoice
      prompt: If a constant net external torque of $10 \text{ N}\cdot\text{m}$ is
        applied to a wheel for 3 seconds, by how much does the wheel's angular momentum
        change?
      choices:
      - id: a
        text: $3.33 \text{ kg}\cdot\text{m}^2/\text{s}$
      - id: b
        text: $10 \text{ kg}\cdot\text{m}^2/\text{s}$
      - id: c
        text: $30 \text{ kg}\cdot\text{m}^2/\text{s}$
      - id: d
        text: It depends on the moment of inertia.
      answer:
        choiceId: c
      explanation: Since $\tau_{net} = \frac{\Delta L}{\Delta t}$, the change in angular
        momentum is $\Delta L = \tau_{net} \Delta t = (10)(3) = 30 \text{ kg}\cdot\text{m}^2/\text{s}$.
        This is true regardless of the moment of inertia.
  - id: sec-2
    title: Angular Impulse
    content: 'The integral of torque over time is called **angular impulse** ($\vec{J}_{rot}$).
      Just as linear impulse causes a change in linear momentum, angular impulse causes
      a change in angular momentum:


      $$\int \vec{\tau}_{net} dt = \Delta\vec{L}$$


      A massive torque applied for a fraction of a second (like a sharp strike to
      a billiard ball) delivers a discrete angular impulse, instantly changing the
      ball''s rotation.'
    media: []
    check:
      id: chk-am-4
      type: multipleChoice
      prompt: What are the standard SI units for angular impulse?
      choices:
      - id: a
        text: Joules (J)
      - id: b
        text: Newtons (N)
      - id: c
        text: $\text{N}\cdot\text{m}\cdot\text{s}$ (equivalent to $\text{kg}\cdot\text{m}^2/\text{s}$)
      - id: d
        text: $\text{rad/s}$
      answer:
        choiceId: c
      explanation: Angular impulse is torque times time ($\text{N}\cdot\text{m}\cdot\text{s}$).
        Since it equals the change in angular momentum, its units are identical to
        angular momentum ($\text{kg}\cdot\text{m}^2/\text{s}$).
  - { id: am2-3, title: Zero torque, content: 'Zero net external torque leaves total angular momentum unchanged.', check: { id: am2c3, type: multipleChoice, prompt: 'If net external torque is zero, angular momentum is:', choices: [{ id: a, text: 'constant' }, { id: b, text: 'necessarily zero' }], answer: { choiceId: a }, explanation: 'Solution: It is constant.\n\nWhy it works: $\tau_{net}=dL/dt$.\n\nWhy the other choices fail: A nonzero constant angular momentum is possible.' } }
  - { id: am2-4, title: Torque direction, content: 'Torque changes angular momentum in the torque direction.', check: { id: am2c4, type: multipleChoice, prompt: 'A torque parallel to $\vec L$ changes primarily its:', choices: [{ id: a, text: 'magnitude' }, { id: b, text: 'direction only' }], answer: { choiceId: a }, explanation: 'Solution: It changes magnitude.\n\nWhy it works: $d\vec L$ is parallel to $\vec L$.\n\nWhy the other choices fail: Perpendicular torque mainly turns the vector.' } }
  - { id: am2-5, title: Angular impulse, content: 'Angular impulse is torque integrated over time.', check: { id: am2c5, type: multipleChoice, prompt: 'A larger torque acting for the same time gives:', choices: [{ id: a, text: 'larger angular impulse' }, { id: b, text: 'smaller angular impulse' }], answer: { choiceId: a }, explanation: 'Solution: It gives larger impulse.\n\nWhy it works: $J_{rot}=\tau\Delta t$ for constant torque.\n\nWhy the other choices fail: Impulse scales directly with torque.' } }
  - { id: am2-6, title: Changing inertia, content: 'The torque-angular-momentum law remains valid even if moment of inertia changes.', check: { id: am2c6, type: multipleChoice, prompt: 'The most general rotational Newton law is:', choices: [{ id: a, text: '$\vec\tau=d\vec L/dt$' }, { id: b, text: '$\tau=I\alpha$ always' }], answer: { choiceId: a }, explanation: 'Solution: Use $\vec\tau=d\vec L/dt$.\n\nWhy it works: It remains valid for changing $I$.\n\nWhy the other choices fail: $\tau=I\alpha$ needs appropriate fixed-$I$ conditions.' } }
  - { id: am2-7, title: Units check, content: 'Torque times time has the same units as angular momentum.', check: { id: am2c7, type: multipleChoice, prompt: 'Angular impulse units are:', choices: [{ id: a, text: '$\mathrm{N\,m\,s}$' }, { id: b, text: '$\mathrm{N/m}$' }], answer: { choiceId: a }, explanation: 'Solution: The unit is $\mathrm{N\,m\,s}$.\n\nWhy it works: Angular impulse is torque times time.\n\nWhy the other choices fail: N/m is not torque times time.' } }
