  visualRationale: Compression, rarefaction, and spreading are easier to distinguish with a wave diagram.
lesson:
  introduction: Sound is a mechanical pressure disturbance whose speed and intensity depend on the medium.
  sections:
  - id: disturbance
    title: Treat sound as a longitudinal disturbance
    content: |
      A sound source makes nearby material oscillate, producing alternating compressions and rarefactions. The disturbance travels outward; individual particles oscillate near equilibrium rather than traveling all the way to the listener.
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Longitudinal sound wave showing compressions, rarefactions, and particle displacement.
      caption: Particle displacement and pressure variation describe the same propagating sound wave.
  - id: speed
    title: Connect sound speed to material properties
    content: |
      Sound speed is set by a restoring property and density. A stiffer medium tends to transmit disturbances faster; greater density increases inertia. This explains why changing medium can change sound speed and wavelength.
  - id: frequency
    title: Preserve frequency across a boundary
    content: |
      For a wave driven by a source, frequency is fixed by the source. When speed changes in a new medium, wavelength changes according to $v=f\lambda$. At an interface between media with different wave speeds, some sound-wave energy can be reflected and some can be transmitted. This is a foundation for later boundary analysis; it does not require an acoustic-impedance model here.
  - id: intensity
    title: Track spreading through intensity
    content: |
      Intensity is power per area. For an ideal point source spreading spherically, the same power crosses larger spherical areas as distance grows, so intensity follows an inverse-square trend.
  - id: pressure
    title: Link pressure amplitude and intensity
    content: |
      Larger pressure variations correspond to a more energetic sound wave. Density and sound speed enter the quantitative relation between pressure amplitude and intensity, so the medium affects both propagation and measurement.
  - id: ultrasound
    title: Use echoes as a qualitative application
    content: |
      Ultrasound can probe an interior when a pulse is sent into material and returned signals are detected. At this level, use travel time to reason about distance; do not assume this lesson develops imaging reconstruction or tomography.
  - id: seismic
    title: Use seismic waves as conceptual evidence
    content: |
      Seismic waves travel differently through different Earth materials. Observed travel-time and shadow-pattern differences can reveal that Earth has internal layers. This is evidence-based inference, not a full subsurface-survey method.
