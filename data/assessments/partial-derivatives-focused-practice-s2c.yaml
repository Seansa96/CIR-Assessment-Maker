questions:
- id: q001
  type: multipleChoice
  prompt: Find $f_x$ for $f(x,y)=x^3y+2y$.
  choices:
  - id: a
    text: $3x^2y$
  - id: b
    text: $x^3+2$
    issueSignals:
    - id: product-rule-misapplied
  - id: c
    text: $3x^2y+2$
    issueSignals:
    - id: product-rule-misapplied
  - id: d
    text: $x^2y$
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: product-rule-misapplied
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Treat y and the $2y$ term as constants.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Classical Theorems of Differential
    Calculus.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q002
  type: multipleChoice
  prompt: Find $f_y$ for $f(x,y)=x^2y^3$.
  choices:
  - id: a
    text: $3x^2y^2$
  - id: b
    text: $2xy^3$
    issueSignals:
    - id: product-rule-misapplied
  - id: c
    text: $x^2y^2$
    issueSignals:
    - id: product-rule-misapplied
  - id: d
    text: $3xy^2$
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: product-rule-misapplied
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Treat x squared as a constant coefficient.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Classical Theorems of Differential
    Calculus.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q003
  type: multipleChoice
  prompt: What does $f_y(a,b)$ describe?
  choices:
  - id: a
    text: The y-direction slice slope at $(a,b)$
  - id: b
    text: The function value only
    issueSignals:
    - id: product-rule-misapplied
  - id: c
    text: A vector normal
    issueSignals:
    - id: product-rule-misapplied
  - id: d
    text: An x-intercept
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: product-rule-misapplied
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: It measures rate as y changes while x is fixed.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Classical Theorems of Differential
    Calculus.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q004
  type: multipleChoice
  prompt: If $f=x^2+y^2$, what is $f_{xy}$?
  choices:
  - id: a
    text: '0'
  - id: b
    text: '2'
    issueSignals:
    - id: product-rule-misapplied
  - id: c
    text: $2x$
    issueSignals:
    - id: product-rule-misapplied
  - id: d
    text: $2y$
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: product-rule-misapplied
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: $f_x=2x$, which has no y dependence.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Classical Theorems of Differential
    Calculus.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
