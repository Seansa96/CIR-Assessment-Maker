    text: The function value only
    issueSignals:
    - id: product-rule-misapplied
  - id: c
    text: A vector normal (answers 'Which result has the correct type for divergence?', not 'What does $f_y(a,b)$ describe?')
    issueSignals:
    - id: product-rule-misapplied
  - id: d
    text: An x-intercept
    issueSignals:
