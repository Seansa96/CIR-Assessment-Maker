questions:
- id: q001
  type: multipleChoice
  prompt: For $f(x,y)=x^3y+2y$, what is $f_x$?
  choices:
  - id: a
    text: $x^3+2$
    issueSignals:
    - id: product-rule-misapplied
  - id: b
    text: $3x^2y+2$
    issueSignals:
    - id: product-rule-misapplied
  - id: c
    text: $x^2y$
    issueSignals:
    - id: product-rule-misapplied
  - id: d
    text: $3x^2y$
  answer:
    choiceId: d
  issueSignals:
  - id: product-rule-misapplied
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Algebraic partial requires the student to track the requested variable or derivative order
    and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-readiness
  extensionObjectiveIds: []
  explanation: 'Solution: Holding y fixed gives $f_x=3x^2y$.


    Why it works: The derivative of $x^3$ is $3x^2$, while the term $2y$ is constant with respect to x.


    Why the other choices fail:


    Choice a: This differentiates the y factors instead of x.

    Choice b: The y-only term is constant in x, so it contributes zero.

    Choice c: This omits the factor 3 from the power rule.'
- id: q002
  type: multipleChoice
  prompt: For $g(x,y)=x^2e^y$, what is $g_y$?
  choices:
  - id: a
    text: $2xe^y$
    issueSignals:
    - id: held-variable-confusion
  - id: b
    text: $x^2ye^y$
    issueSignals:
    - id: held-variable-confusion
  - id: c
    text: $x^2e^y$
  - id: d
    text: $2xe^y+x^2e^y$
    issueSignals:
    - id: held-variable-confusion
  answer:
    choiceId: c
  issueSignals:
  - id: held-variable-confusion
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Product with frozen factor requires the student to track the requested variable or derivative
    order and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-readiness
  extensionObjectiveIds: []
  explanation: 'Solution: Treat $x^2$ as constant, so $g_y=x^2e^y$.


    Why it works: Only y varies; the frozen x factor remains as a coefficient.


    Why the other choices fail:


    Choice a: This differentiates the frozen factor $x^2$ in x.

    Choice b: The derivative of $e^y$ is $e^y$; no extra y factor appears.

    Choice d: This combines an x derivative with the requested y derivative.'
- id: q003
  type: multipleChoice
  prompt: Let $g(x)=f(x,2)$. What does $g'(1)$ equal?
  choices:
  - id: a
    text: $f(1,2)$
    issueSignals:
    - id: held-variable-confusion
  - id: b
    text: $f_x(1,2)$
  - id: c
    text: $f_y(1,2)$
    issueSignals:
    - id: held-variable-confusion
  - id: d
    text: The slope along every path through $(1,2)
    issueSignals:
    - id: held-variable-confusion
  answer:
    choiceId: b
  issueSignals:
  - id: held-variable-confusion
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Surface-to-slice geometry requires the student to track the requested variable or derivative
    order and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-readiness
  extensionObjectiveIds: []
  explanation: 'Solution: The fixed-y slice has derivative $g''(1)=f_x(1,2)$.


    Why it works: Setting y=2 leaves a one-variable curve whose ordinary tangent slope is the x partial.


    Why the other choices fail:


    Choice a: A function value is height, not the slice derivative.

    Choice c: This varies y while x is fixed, the other coordinate slice.

    Choice d: A general path can change both coordinates and has its own rate.'
- id: q004
  type: multipleChoice
  prompt: For $h(x,y)=\sin(xy)$, what is $h_x$?
  choices:
  - id: a
    text: $y\cos(xy)$
  - id: b
    text: $\cos(xy)$
    issueSignals:
    - id: chain-rule-missed
  - id: c
    text: $x\cos(xy)$
    issueSignals:
    - id: chain-rule-missed
  - id: d
    text: $-y\sin(xy)$
    issueSignals:
    - id: chain-rule-missed
  answer:
    choiceId: a
  issueSignals:
  - id: chain-rule-missed
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Composite function requires the student to track the requested variable or derivative order
    and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-readiness
  extensionObjectiveIds: []
  explanation: 'Solution: The chain rule gives $h_x=\cos(xy)\,y$.


    Why it works: Differentiate the outer sine and multiply by the x derivative of its argument, holding y fixed.


    Why the other choices fail:


    Choice b: This omits the inner derivative $\partial(xy)/\partial x=y$.

    Choice c: The inner x derivative is y, not x.

    Choice d: This differentiates a cosine-like expression rather than sine.'
- id: q005
  type: multipleChoice
  prompt: For $f(x,y)=x^2y^3$, find $f_{xy}$.
  choices:
  - id: a
    text: $2xy^3$
    issueSignals:
    - id: mixed-partial-order
  - id: b
    text: $3x^2y^2$
    issueSignals:
    - id: mixed-partial-order
  - id: c
    text: $6x^2y^2$
    issueSignals:
    - id: mixed-partial-order
  - id: d
    text: $6xy^2$
  answer:
    choiceId: d
  issueSignals:
  - id: mixed-partial-order
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Successive polynomial partials requires the student to track the requested variable or derivative
    order and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-partial-rates
  extensionObjectiveIds:
  - calc3-partial-rates
  explanation: 'Solution: First $f_x=2xy^3$; then $f_{xy}=6xy^2$.


    Why it works: The subscript order means x first and y second.


    Why the other choices fail:


    Choice a: This stops after the first partial $f_x$.

    Choice b: This is $f_y$, not the mixed derivative.

    Choice c: This differentiates in x twice instead of differentiating the first x partial in y.'
- id: q006
  type: multipleChoice
  prompt: For $u(x,y)=x^3e^y$, what is $u_{xx}$?
  choices:
  - id: a
    text: $3x^2e^y$
    issueSignals:
    - id: mixed-partial-order
  - id: b
    text: $x^3e^y$
    issueSignals:
    - id: mixed-partial-order
  - id: c
    text: $6xe^y$
  - id: d
    text: $6x^2e^y$
    issueSignals:
    - id: mixed-partial-order
  answer:
    choiceId: c
  issueSignals:
  - id: mixed-partial-order
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Pure second partial requires the student to track the requested variable or derivative order
    and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-partial-rates
  extensionObjectiveIds:
  - calc3-partial-rates
  explanation: 'Solution: Since $u_x=3x^2e^y$, the second x derivative is $u_{xx}=6xe^y$.


    Why it works: The factor $e^y$ remains constant through both x differentiations.


    Why the other choices fail:


    Choice a: This is only the first x partial.

    Choice b: This differentiates with respect to y, not x.

    Choice d: The second x derivative reduces the power to x, not $x^2$.'
- id: q007
  type: multipleChoice
  prompt: For $v(x,y)=e^{x+y}$, what is $v_{xy}$?
  choices:
  - id: a
    text: $0$
    issueSignals:
    - id: mixed-partial-order
  - id: b
    text: $e^{x+y}$
  - id: c
    text: $e^x$
    issueSignals:
    - id: mixed-partial-order
  - id: d
    text: $2e^{x+y}$
    issueSignals:
    - id: mixed-partial-order
  answer:
    choiceId: b
  issueSignals:
  - id: mixed-partial-order
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Mixed exponential derivative requires the student to track the requested variable or derivative
    order and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-partial-rates
  extensionObjectiveIds:
  - calc3-partial-rates
  explanation: 'Solution: Both successive partial derivatives preserve the exponential: $v_{xy}=e^{x+y}$.


    Why it works: Differentiate the intermediate expression and retain all of its dependence.


    Why the other choices fail:


    Choice a: The intermediate x partial still depends on y.

    Choice c: This drops the y dependence in the unchanged exponential.

    Choice d: Each inner derivative is 1; there is no factor 2.'
- id: q008
  type: multipleChoice
  prompt: If the second partial derivatives of f are continuous on a neighborhood of $(a,b)$, what can you conclude?
  choices:
  - id: a
    text: $f_{xy}(a,b)=f_{yx}(a,b)$
  - id: b
    text: The mixed partials are equal for every function without conditions
    issueSignals:
    - id: mixed-partial-order
  - id: c
    text: Both mixed partials must be zero
    issueSignals:
    - id: mixed-partial-order
  - id: d
    text: They are equal only when $f_x(a,b)=f_y(a,b)$
    issueSignals:
    - id: mixed-partial-order
  answer:
    choiceId: a
  issueSignals:
  - id: mixed-partial-order
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Theorem condition requires the student to track the requested variable or derivative order
    and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-partial-rates
  extensionObjectiveIds:
  - calc3-partial-rates
  explanation: 'Solution: Clairaut''s theorem gives $f_{xy}(a,b)=f_{yx}(a,b)$.


    Why it works: Continuity of the second partials on a neighborhood is a sufficient condition for equality.


    Why the other choices fail:


    Choice b: Equality is not guaranteed for every function at every point.

    Choice c: Clairaut equates them; it does not force their common value to zero.

    Choice d: Equality of first partial values is unrelated to the theorem condition.'
- id: q009
  type: multipleChoice
  prompt: For $p(x,y)=\sin(xy)$, what is $p_{xy}$?
  choices:
  - id: a
    text: $y\cos(xy)$
    issueSignals:
    - id: chain-rule-missed
  - id: b
    text: $\cos(xy)+xy\sin(xy)$
    issueSignals:
    - id: chain-rule-missed
  - id: c
    text: $-xy\sin(xy)$
    issueSignals:
    - id: chain-rule-missed
  - id: d
    text: $\cos(xy)-xy\sin(xy)$
  answer:
    choiceId: d
  issueSignals:
  - id: chain-rule-missed
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Product and chain in mixed order requires the student to track the requested variable or
    derivative order and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-partial-rates
  extensionObjectiveIds:
  - calc3-partial-rates
  explanation: 'Solution: First $p_x=y\cos(xy)$; then $p_{xy}=\cos(xy)-xy\sin(xy)$.


    Why it works: The y derivative uses the product rule and then the chain rule on cosine.


    Why the other choices fail:


    Choice a: This is the intermediate first partial $p_x$.

    Choice b: Differentiating cosine by the chain rule creates a negative sine term.

    Choice c: This omits the derivative of the leading y factor.'
- id: q010
  type: multipleChoice
  prompt: For $W(x,y)=e^{xy}+x$, what is $W_y(0,2)?
  choices:
  - id: a
    text: '1'
    issueSignals:
    - id: held-variable-confusion
  - id: b
    text: '2'
    issueSignals:
    - id: held-variable-confusion
  - id: c
    text: '0'
  - id: d
    text: $e^2$
    issueSignals:
    - id: held-variable-confusion
  answer:
    choiceId: c
  issueSignals:
  - id: held-variable-confusion
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Slice interpretation requires the student to track the requested variable or derivative
    order and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-readiness
  extensionObjectiveIds: []
  explanation: 'Solution: $W_y=xe^{xy}$, so $W_y(0,2)=0$.


    Why it works: The chain rule contributes the inner factor x, and the added x term is constant in y.


    Why the other choices fail:


    Choice a: This incorrectly differentiates the added x term with respect to y.

    Choice b: The inner y derivative of xy is x, which is zero at the point.

    Choice d: At $(0,2)$ the exponent is zero, not 2.'
