    prompt specifies.

    Choice c, ''A vector normal'', does not give ''The y-direction slice slope at $(a,b)$'' for ''What does $f_y(a,b)$ describe?''.
    It substitutes a different result, representation, or condition for the one the prompt specifies.

    Choice d, ''An x-intercept'', does not give ''The y-direction slice slope at $(a,b)$'' for ''What does $f_y(a,b)$ describe?''.
    It substitutes a different result, representation, or condition for the one the prompt specifies.'
- id: q004
  type: multipleChoice
  prompt: If $f=x^2+y^2$, what is $f_{xy}$?
  choices:
  - id: a
    text: '0'
  - id: b
    text: 2 (answers 'For F=<2x,2y,2z>, what is div F?', not 'If $f=x^2+y^2$, what is $f_{xy}$?')
    issueSignals:
    - id: product-rule-misapplied
  - id: c
    text: '$2x$ (answers ''Find $\frac{d}{dx}\int_1^x(t^2+1)\,dt$.'', not ''If $f=x^2+y^2$, what is $f_{xy}$?'')'
    issueSignals:
    - id: product-rule-misapplied
  - id: d
    text: $2y$
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: product-rule-misapplied
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: $f_x=2x$, which has no y dependence.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Classical Theorems of Differential
    Calculus.

    Why the other choices fail: Choice b, ''2'', does not give ''0'' for ''If $f=x^2+y^2$, what is $f_{xy}$?''. It substitutes
    a different result, representation, or condition for the one the prompt specifies.

    Choice c, ''$2x$'', does not give ''0'' for ''If $f=x^2+y^2$, what is $f_{xy}$?''. It substitutes a different result,
    representation, or condition for the one the prompt specifies.

    Choice d, ''$2y$'', does not give ''0'' for ''If $f=x^2+y^2$, what is $f_{xy}$?''. It substitutes a different result,
    representation, or condition for the one the prompt specifies.'
