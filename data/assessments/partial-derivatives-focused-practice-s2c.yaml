questions:
- id: q001
  type: multipleChoice
  prompt: Find $f_x$ for $f(x,y)=x^3y+2y$.
  choices:
  - id: a
    text: $3x^2y$
  - id: b
    text: $x^3+2$
    issueSignals:
    - id: product-rule-misapplied
  - id: c
    text: $3x^2y+2$
    issueSignals:
    - id: product-rule-misapplied
  - id: d
    text: $x^2y$
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: product-rule-misapplied
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Treat y and the $2y$ term as constants.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Classical Theorems of Differential
    Calculus.

    Why the other choices fail: Choice b, ''$x^3+2$'', does not give ''$3x^2y$'' for ''Find $f_x$ for $f(x,y)=x^3y+2y$.''.
    It substitutes a different result, representation, or condition for the one the prompt specifies.

    Choice c, ''$3x^2y+2$'', does not give ''$3x^2y$'' for ''Find $f_x$ for $f(x,y)=x^3y+2y$.''. It substitutes a different
    result, representation, or condition for the one the prompt specifies.

    Choice d, ''$x^2y$'', does not give ''$3x^2y$'' for ''Find $f_x$ for $f(x,y)=x^3y+2y$.''. It substitutes a different result,
    representation, or condition for the one the prompt specifies.'
