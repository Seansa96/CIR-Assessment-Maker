  explanation: 'Solution: $A(x)\,dx$ has units $\text{in}^2\cdot\text{in}=\text{in}^3$, so the integral measures volume. Why it works: Each contribution is a thin slab with area times thickness. Common trap: The units of the integrand’s measurement alone are not the final units. Why the other choices fail: b omits thickness; c omits area; d has inverse units not produced by the product.'
