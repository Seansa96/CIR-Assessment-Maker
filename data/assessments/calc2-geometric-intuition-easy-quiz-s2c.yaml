    circuitAnswer: 
    graphingAnswer: 
  explanation: 'Solution: For $x<0$, the x-axis lies above $y=x$; for $x>0$, $y=x$ lies above the axis, so the slice order changes at 0. Why it works: Geometric area requires a nonnegative slice height. Common trap: Signed integral cancellation is not geometric area. Why the other choices fail: $dx$ remains valid; every interval has endpoints; linear functions integrate normally.'
