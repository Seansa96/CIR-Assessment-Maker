  explanation: 'Solution: On this interval, 5 is the upper y-value and $x^2$ the lower y-value; therefore $A=\int_{-1}^{1}(5-x^2)\,dx$. Why it works: Vertical slices use top minus bottom times $dx$. Common trap: A positive region requires the larger y-value first. Why the other choices fail: b is negative; c multiplies boundaries instead of finding distance; d mismatches the x-bounds and vertical slices.'
