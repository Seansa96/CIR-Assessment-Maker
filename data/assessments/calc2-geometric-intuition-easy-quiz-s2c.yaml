  explanation: 'Solution: The bounds 2 and 5 state where accumulation starts and stops, so they identify the first and last slice locations. Why it works: A definite integral adds contributions only over its stated variable interval. Common trap: Bounds do not describe the slice height. Why the other choices fail: b belongs in the integrand; c is found after evaluation; d is represented by $dx$.'
