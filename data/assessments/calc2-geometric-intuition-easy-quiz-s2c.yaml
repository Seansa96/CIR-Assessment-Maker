  explanation: 'Solution: The right boundary is 4 and the left boundary is $y^2$, giving length $4-y^2$. Why it works: Horizontal distance is right minus left. Common trap: $dy$ is thickness, not the across-slice distance. Why the other choices fail: b reverses the distance; c is a product rather than a distance; d supplies no boundary measurement.'
