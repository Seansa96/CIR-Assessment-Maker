- id: q005
  type: multipleChoice
  prompt: Why must the area between $y=x$ and the x-axis on $[-1,1]$ be split at 0 when using vertical slices?
  choices:
  - id: a
    text: The top and bottom relation changes at 0.
    media: []
    issueSignals: []
  - id: b
    text: $dx$ is undefined at 0.
    media: []
    issueSignals: []
  - id: c
    text: The interval has two endpoints.
    media: []
    issueSignals: []
  - id: d
    text: Linear functions cannot be integrated across zero.
    media: []
    issueSignals: []
  answer:
    choiceId: a
