questions:
  - id: q001
    type: multipleChoice
    issueSignals:
    - id: expression-equation-recognition-error
    - id: sign-error
    - id: geometric-area-formula-error
    - id: pythagorean-theorem-misapplied
    - id: mathematical-translation-error
    prompt: 'For a vertical slice bounded above by $y=f(x)$ and below by $y=g(x)$, what is its differential area?'
    media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Vertical slice with height upper minus lower and width dx }]
    choices: [{ id: a, text: '$(f(x)-g(x))\,dx$' }, { id: b, text: '$(g(x)-f(x))\,dy$' }, { id: c, text: '$f(x)g(x)$' }, { id: d, text: '$(f(x)-g(x))\,dy$' }]
    answer: { choiceId: a }
    explanation: 'Solution: The vertical height is $f(x)-g(x)$ and the horizontal thickness is $dx$, so $dA=(f(x)-g(x))\,dx$. Why it works: A rectangle’s area is height times width. Common trap: The difference must be upper minus lower. Why the other choices fail: b reverses both orientation pieces; c omits thickness and is not a distance; d uses the thickness of a horizontal slice.'
    difficultyDimensions: [representationTransfer, domainCondition]
    difficultyEvidence: Interprets a visual slice and selects the orientation-consistent boundary difference and differential.
  - id: q002
    type: multipleChoice
    issueSignals:
    - id: expression-equation-recognition-error
    - id: sign-error
    - id: geometric-area-formula-error
    - id: pythagorean-theorem-misapplied
    - id: mathematical-translation-error
    prompt: 'For the region between $y=5$ and $y=x^2$ on $-1\le x\le1$, which integral gives its area?'
    media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Vertical-slice area model between an upper constant and lower curve }]
    choices: [{ id: a, text: '$\int_{-1}^{1}(5-x^2)\,dx$' }, { id: b, text: '$\int_{-1}^{1}(x^2-5)\,dx$' }, { id: c, text: '$\int_{-1}^{1}5x^2\,dx$' }, { id: d, text: '$\int_{-1}^{1}(5-x^2)\,dy$' }]
    answer: { choiceId: a }
    explanation: 'Solution: On this interval, 5 is the upper y-value and $x^2$ the lower y-value; therefore $A=\int_{-1}^{1}(5-x^2)\,dx$. Why it works: Vertical slices use top minus bottom times $dx$. Common trap: A positive region requires the larger y-value first. Why the other choices fail: b is negative; c multiplies boundaries instead of finding distance; d mismatches the x-bounds and vertical slices.'
    difficultyDimensions: [modelOrDerivation, representationTransfer]
    difficultyEvidence: Builds a slice model from the listed boundaries and checks which curve is upper on the interval.
  - id: q003
    type: multipleChoice
    issueSignals:
    - id: expression-equation-recognition-error
    - id: sign-error
    - id: geometric-area-formula-error
    - id: pythagorean-theorem-misapplied
    - id: mathematical-translation-error
    prompt: 'A horizontal slice extends from $x=y^2$ to $x=4$. What is its length?'
    choices: [{ id: a, text: '$4-y^2$' }, { id: b, text: '$y^2-4$' }, { id: c, text: '$4y^2$' }, { id: d, text: '$dy$' }]
    answer: { choiceId: a }
    explanation: 'Solution: The right boundary is 4 and the left boundary is $y^2$, giving length $4-y^2$. Why it works: Horizontal distance is right minus left. Common trap: $dy$ is thickness, not the across-slice distance. Why the other choices fail: b reverses the distance; c is a product rather than a distance; d supplies no boundary measurement.'
    difficultyDimensions: [representationTransfer, domainCondition]
    difficultyEvidence: Transfers from horizontal-boundary notation to an orientation-correct distance expression.
  - id: q004
    type: multipleChoice
    issueSignals:
    - id: expression-equation-recognition-error
    - id: sign-error
    - id: geometric-area-formula-error
    - id: pythagorean-theorem-misapplied
    - id: mathematical-translation-error
    prompt: 'If $A(x)$ is measured in square inches and x in inches, what quantity does $\int_0^{10}A(x)\,dx$ measure?'
    choices: [{ id: a, text: volume in cubic inches }, { id: b, text: area in square inches }, { id: c, text: length in inches }, { id: d, text: surface area in square inches per inch }]
    answer: { choiceId: a }
    explanation: 'Solution: $A(x)\,dx$ has units $\text{in}^2\cdot\text{in}=\text{in}^3$, so the integral measures volume. Why it works: Each contribution is a thin slab with area times thickness. Common trap: The units of the integrand’s measurement alone are not the final units. Why the other choices fail: b omits thickness; c omits area; d has inverse units not produced by the product.'
    difficultyDimensions: [representationTransfer, modelOrDerivation]
    difficultyEvidence: Uses dimensional modeling to identify the geometric quantity accumulated.
  - id: q005
    type: multipleChoice
    issueSignals:
    - id: expression-equation-recognition-error
    - id: sign-error
    - id: geometric-area-formula-error
    - id: pythagorean-theorem-misapplied
    - id: mathematical-translation-error
    prompt: 'Why must the area between $y=x$ and the x-axis on $[-1,1]$ be split at 0 when using vertical slices?'
    media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Slice model reminding learners that geometric area must remain nonnegative }]
    choices: [{ id: a, text: The top and bottom relation changes at 0. }, { id: b, text: $dx$ is undefined at 0. }, { id: c, text: The interval has two endpoints. }, { id: d, text: Linear functions cannot be integrated across zero. }]
    answer: { choiceId: a }
    explanation: 'Solution: For $x<0$, the x-axis lies above $y=x$; for $x>0$, $y=x$ lies above the axis, so the slice order changes at 0. Why it works: Geometric area requires a nonnegative slice height. Common trap: Signed integral cancellation is not geometric area. Why the other choices fail: $dx$ remains valid; every interval has endpoints; linear functions integrate normally.'
    difficultyDimensions: [casePartition, representationTransfer]
    difficultyEvidence: Detects a changing geometric relation and chooses the necessary partition point.
  - id: q006
    type: multipleChoice
    issueSignals:
    - id: expression-equation-recognition-error
    - id: sign-error
    - id: geometric-area-formula-error
    - id: pythagorean-theorem-misapplied
    - id: mathematical-translation-error
    prompt: 'The diagram’s highlighted slice is vertical. Which variable should index the integral?'
    media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Highlighted vertical representative slice labelled dx }]
    choices: [{ id: a, text: x }, { id: b, text: y }, { id: c, text: both x and y simultaneously }, { id: d, text: neither variable }]
    answer: { choiceId: a }
    explanation: 'Solution: Vertical slices move horizontally, so x indexes their positions and their thickness is $dx$. Why it works: Slice orientation determines the differential variable. Common trap: The slice height is a y-distance, but that does not make y the indexing variable. Why the other choices fail: b describes horizontal slicing; c is not a single-variable definite-integral setup; d leaves no accumulation coordinate.'
    difficultyDimensions: [representationTransfer, domainCondition]
    difficultyEvidence: Interprets slice orientation and connects it to the independent variable and differential.
  - id: q007
    type: multipleChoice
    issueSignals:
    - id: expression-equation-recognition-error
    - id: sign-error
    - id: geometric-area-formula-error
    - id: pythagorean-theorem-misapplied
    - id: mathematical-translation-error
    prompt: 'A model gives $\int_2^5(3x+1)\,dx$. What does the interval $[2,5]$ identify?'
    choices: [{ id: a, text: the first and last slice locations }, { id: b, text: the height of every slice }, { id: c, text: the final numerical area }, { id: d, text: the differential thickness }]
    answer: { choiceId: a }
    explanation: 'Solution: The bounds 2 and 5 state where accumulation starts and stops, so they identify the first and last slice locations. Why it works: A definite integral adds contributions only over its stated variable interval. Common trap: Bounds do not describe the slice height. Why the other choices fail: b belongs in the integrand; c is found after evaluation; d is represented by $dx$.'
    difficultyDimensions: [representationTransfer, domainCondition]
    difficultyEvidence: Distinguishes interval bounds from the integrand’s geometric measurement.
  - id: q008
    type: multipleChoice
    issueSignals:
    - id: expression-equation-recognition-error
    - id: sign-error
    - id: geometric-area-formula-error
    - id: pythagorean-theorem-misapplied
    - id: mathematical-translation-error
    prompt: 'Which expression is a valid positive horizontal-slice area contribution for a region with right boundary $x=2y+3$ and left boundary $x=y^2$?'
    media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Diagram emphasizing right minus left for a horizontal slice }]
    choices: [{ id: a, text: '$(2y+3-y^2)\,dy$' }, { id: b, text: '$(y^2-2y-3)\,dy$' }, { id: c, text: '$(2y+3-y^2)\,dx$' }, { id: d, text: '$(2y+3)y^2\,dy$' }]
    answer: { choiceId: a }
    explanation: 'Solution: Right minus left is $(2y+3)-y^2$, and horizontal thickness is $dy$. Why it works: A horizontal rectangle has x-length times y-thickness. Common trap: Preserve parentheses before simplifying a boundary difference. Why the other choices fail: b reverses sign; c uses the wrong differential; d multiplies boundary coordinates instead of subtracting them.'
    difficultyDimensions: [representationTransfer, simplification]
    difficultyEvidence: Converts directional boundary data into a correctly ordered slice formula.
  - id: q009
    type: multipleChoice
    issueSignals:
    - id: expression-equation-recognition-error
    - id: sign-error
    - id: geometric-area-formula-error
    - id: pythagorean-theorem-misapplied
    - id: mathematical-translation-error
    prompt: 'Which check most directly detects a model that claims to compute volume but has final units of square centimeters?'
    choices: [{ id: a, text: dimensional analysis }, { id: b, text: the Fundamental Theorem only }, { id: c, text: increasing the number of slices }, { id: d, text: changing the integration variable randomly }]
    answer: { choiceId: a }
    explanation: 'Solution: Dimensional analysis compares the calculated units with the requested quantity and exposes a missing length factor. Why it works: Volume must have cubic units. Common trap: A mechanically correct antiderivative can still evaluate the wrong model. Why the other choices fail: b evaluates a model but does not validate its units; c does not fix a wrong measurement; d changes notation rather than reasoning.'
    difficultyDimensions: [errorDiagnosis, representationTransfer]
    difficultyEvidence: Uses units as an independent diagnostic of the constructed geometric model.
  - id: q010
    type: multipleChoice
    issueSignals:
    - id: expression-equation-recognition-error
    - id: sign-error
    - id: geometric-area-formula-error
    - id: pythagorean-theorem-misapplied
    - id: mathematical-translation-error
    prompt: 'What is the best first action when a geometric integration problem is stated?'
    media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Representative slice diagram showing boundary labels and thickness }]
    choices: [{ id: a, text: sketch and label one representative slice }, { id: b, text: choose an antiderivative immediately }, { id: c, text: substitute the endpoints into both curves }, { id: d, text: memorize a formula without identifying the quantity }]
    answer: { choiceId: a }
    explanation: 'Solution: Sketching a representative slice exposes its measurement, thickness, and bounds before any calculation. Why it works: The integral is built from that infinitesimal geometric contribution. Common trap: Starting with an antiderivative can hide a wrong model. Why the other choices fail: b skips model construction; c cannot supply a slice formula alone; d has no mechanism for choosing a correct formula.'
    difficultyDimensions: [modelOrDerivation, representationTransfer]
    difficultyEvidence: Selects the modeling action that precedes and constrains all later calculation.
