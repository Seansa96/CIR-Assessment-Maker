- id: q002
  type: multipleChoice
  prompt: For the region between $y=5$ and $y=x^2$ on $-1\le x\le1$, which integral gives its area?
  choices:
  - id: a
    text: $\int_{-1}^{1}(5-x^2)\,dx$
    media: []
    issueSignals: []
  - id: b
    text: $\int_{-1}^{1}(x^2-5)\,dx$
    media: []
    issueSignals: []
  - id: c
    text: $\int_{-1}^{1}5x^2\,dx$
    media: []
    issueSignals: []
  - id: d
    text: $\int_{-1}^{1}(5-x^2)\,dy$
    media: []
    issueSignals: []
  answer:
