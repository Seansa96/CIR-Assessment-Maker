questions:
- id: q001
  type: multipleChoice
  prompt: For a vertical slice bounded above by $y=f(x)$ and below by $y=g(x)$, what is its differential area?
  choices:
  - id: a
    text: $(f(x)-g(x))\,dx$
    media: []
    issueSignals: []
  - id: b
    text: $(g(x)-f(x))\,dy$
    media: []
    issueSignals: []
  - id: c
    text: $f(x)g(x)$
    media: []
    issueSignals: []
  - id: d
    text: $(f(x)-g(x))\,dy$
    media: []
    issueSignals: []
  answer:
    choiceId: a
    choiceIds: []
    expected: 
    gradingMode: 
    expectedLatex: 
    equivalenceMode: 
    variables: []
    value: 
    tolerance: 
    media: []
    keyPoints: []
    circuitAnswer: 
    graphingAnswer: 
  explanation: 'Solution: The vertical height is $f(x)-g(x)$ and the horizontal thickness is $dx$, so $dA=(f(x)-g(x))\,dx$. Why it works: A rectangle’s area is height times width. Common trap: The difference must be upper minus lower. Why the other choices fail: b reverses both orientation pieces; c omits thickness and is not a distance; d uses the thickness of a horizontal slice.'
