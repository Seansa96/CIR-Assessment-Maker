    - id: term-01
      term: formal charge
      definition: The bookkeeping charge obtained by assigning each atom all nonbonding electrons and half the bonding electrons.
      drills:
      - id: g01
        type: flashcard
        prompt: State the meaning of formal charge in this bonding unit.
        answer:
          expected: The bookkeeping charge obtained by assigning each atom all nonbonding electrons and half the bonding electrons.
          aliases:
          - formal charge
        explanation: 'Solution: The bookkeeping charge obtained by assigning each atom all nonbonding electrons and half the
          bonding electrons. Why it works: This meaning keeps the term tied to the particle or electron model used in the
          topic.'
    - id: term-02
      term: formal-charge sum
      definition: The requirement that all atomic formal charges add to the species' net charge.
      drills:
      - id: g02
        type: flashcard
        prompt: State the meaning of formal-charge sum in this bonding unit.
