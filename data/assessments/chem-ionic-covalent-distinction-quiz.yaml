- id: bond-type-1
  title: Bond Identification
  type: multipleChoice
  prompt: 'Adapted from OpenStax College Chemistry 2e.


    Identify the primary bond type in $\ce{KCl}$.'
  choices:
  - id: Ionic
    text: Ionic
  - id: Covalent
    text: Covalent
  answer:
    gradingMode: auto
    choiceId: Ionic
  explanation: Generally, metal + nonmetal = Ionic. Nonmetal + Nonmetal = Covalent.
    $\ce{KCl}$ is Ionic.
