questions:
  - id: ic-dist-q01
    title: Fundamental Difference
    type: multipleChoice
    prompt: |
      What is the fundamental difference in how electrons are handled between an ionic bond and a covalent bond?
    choices:
      - id: a
        text: In an ionic bond, electrons are completely transferred from one atom to another; in a covalent bond, electrons are shared between atoms.
      - id: b
        text: In an ionic bond, electrons are shared equally; in a covalent bond, they are transferred.
      - id: c
        text: Ionic bonds only involve inner-shell electrons, while covalent bonds involve valence electrons.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Ionic bonding is based on the electrostatic attraction between oppositely charged ions formed by electron transfer (usually metal to nonmetal). Covalent bonding is based on the mutual sharing of one or more pairs of valence electrons (usually between nonmetals).

  - id: ic-dist-q02
    title: Predicting Bond Type from Elements
    type: multipleChoice
    prompt: |
      Based on their position in the periodic table, what type of bond is most likely to form between Potassium (K) and Chlorine (Cl)?
    choices:
      - id: a
        text: Ionic, because it is a bond between a metal and a nonmetal.
      - id: b
        text: Covalent, because it is a bond between two nonmetals.
      - id: c
        text: Metallic, because Potassium is a metal.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Potassium is an alkali metal (Group 1) and Chlorine is a halogen (Group 17, nonmetal). The large difference in electronegativity means Potassium will give its electron to Chlorine, forming an ionic bond ($\text{K}^+ \text{Cl}^-$).

  - id: ic-dist-q03
    title: Covalent Bond Example
    type: multipleChoice
    prompt: |
      Which of the following compounds is expected to be entirely covalently bonded?
    choices:
      - id: a
        text: $\text{CO}_2$ (Carbon dioxide)
      - id: b
        text: $\text{NaCl}$ (Sodium chloride)
      - id: c
        text: $\text{Fe}_2\text{O}_3$ (Iron(III) oxide)
      - id: d
        text: $\text{MgBr}_2$ (Magnesium bromide)
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Carbon and Oxygen are both nonmetals. Bonds between two nonmetals are covalent, as neither atom has a strong enough pull to completely strip electrons from the other; instead, they share them. The others all contain a metal (Na, Fe, Mg).

  - id: ic-dist-q04
    title: Electrical Conductivity
    type: multipleChoice
    prompt: |
      A white crystalline solid is dissolved in water. The resulting solution conducts electricity very well. What type of compound was the solid most likely to be?
    choices:
      - id: a
        text: Ionic
      - id: b
        text: Covalent
      - id: c
        text: Metallic
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Ionic compounds (like salt) dissociate into free-floating charged ions ($\text{Na}^+$ and $\text{Cl}^-$) when dissolved in water. These mobile charges allow the solution to conduct electricity (it is an electrolyte). Covalent compounds (like sugar) do not form ions in solution and do not conduct electricity.

  - id: ic-dist-q05
    title: Melting Points
    type: multipleChoice
    prompt: |
      Why do ionic compounds generally have much higher melting and boiling points than covalent (molecular) compounds?
    choices:
      - id: a
        text: Melting an ionic compound requires breaking the strong electrostatic forces (ionic bonds) holding the entire 3D crystal lattice together. Melting a covalent compound only requires breaking weak intermolecular forces between molecules, not the covalent bonds themselves.
      - id: b
        text: Covalent bonds are physically weaker than ionic bonds.
      - id: c
        text: Ionic compounds are heavier than covalent compounds.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** In an ionic solid, every ion is locked in a rigid crystal lattice by strong electrostatic attractions to all surrounding ions. In a covalent solid (like ice), the strong covalent bonds hold the $\text{H}_2\text{O}$ molecule together, but only weak forces hold one molecule to the next.

  - id: ic-dist-q06
    title: Physical State at Room Temperature
    type: multipleChoice
    prompt: |
      Which of the following describes the most likely physical state of a typical covalent compound at room temperature?
    choices:
      - id: a
        text: It could be a gas, liquid, or low-melting solid.
      - id: b
        text: It is always a hard, brittle, crystalline solid.
      - id: c
        text: It is always a gas.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Because intermolecular forces in covalent compounds are relatively weak, they can exist in all three states at room temperature (e.g., $\text{O}_2$ is a gas, $\text{H}_2\text{O}$ is a liquid, wax is a soft solid). Ionic compounds are virtually all hard solids at room temp.

  - id: ic-dist-q07
    title: Electronegativity Difference
    type: multipleChoice
    prompt: |
      How does the concept of electronegativity (EN) help predict bond type?
    choices:
      - id: a
        text: A large difference in EN (usually > 1.7) leads to an ionic bond; a small or zero difference in EN leads to a covalent bond.
      - id: b
        text: A large difference in EN leads to a nonpolar covalent bond.
      - id: c
        text: Electronegativity only applies to noble gases.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Electronegativity is an atom's ability to attract shared electrons. If one atom is much stronger (large difference), it steals the electron completely (ionic). If they are roughly equal (small difference), they share the electrons (covalent).

  - id: ic-dist-q08
    title: Molecule vs Formula Unit
    type: multipleChoice
    prompt: |
      Why is it technically incorrect to refer to a "molecule of $\text{NaCl}$"?
    choices:
      - id: a
        text: Because $\text{NaCl}$ exists as a massive continuous lattice of alternating $\text{Na}^+$ and $\text{Cl}^-$ ions, not as discrete individual $\text{NaCl}$ pairs.
      - id: b
        text: Because $\text{NaCl}$ is a liquid, and molecules only exist in gases.
      - id: c
        text: Because the bonds in $\text{NaCl}$ are covalent.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** The term "molecule" implies a discrete, standalone unit of atoms bonded covalently (like a single $\text{H}_2\text{O}$ unit). Ionic compounds do not form distinct molecules; they form a continuous 3D network. "Formula unit" is the correct term for the lowest ratio ($\text{NaCl}$) in that network.

  - id: ic-dist-q09
    title: Polyatomic Ions - Both bond types
    type: multipleChoice
    prompt: |
      Consider the compound Sodium Nitrate ($\text{NaNO}_3$). What types of bonds are present in this compound?
    choices:
      - id: a
        text: Both ionic and covalent bonds.
      - id: b
        text: Only ionic bonds.
      - id: c
        text: Only covalent bonds.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** The bond between the Sodium ion ($\text{Na}^+$) and the entire Nitrate ion ($\text{NO}_3^-$) is ionic. However, within the Nitrate ion itself, the Nitrogen and Oxygen atoms are nonmetals bound tightly together by covalent bonds.

  - id: ic-dist-q10
    title: Polar vs Nonpolar
    type: multipleChoice
    prompt: |
      The terms "polar" and "nonpolar" are sub-categories of which type of bond?
    choices:
      - id: a
        text: Covalent bonds
      - id: b
        text: Ionic bonds
      - id: c
        text: Metallic bonds
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Polarity refers to how equally electrons are *shared*. Therefore, it only applies to covalent bonds. If shared equally (identical nonmetals), it's nonpolar covalent. If shared unequally (different nonmetals), it's polar covalent. (Ionic bonds don't share at all).
