lesson:
  introduction: Encodings and checksums add structure to bit patterns so transitions, detection, or correction become easier. The point is not magic; it is carefully chosen redundancy.
  sections:
  - id: enc-mental-model
    title: Mental model
    required: true
    content: Encodings, Checksums, and Error Correction problems should begin with the representation contract. Decide the word width, which bits matter, and which operation preserves the property you want.
    check:
      id: enc-mental-model-check
      title: Check understanding
      type: multipleChoice
      prompt: What should be named before applying a low-level arithmetic trick?
      choices:
      - id: a
        text: The word width and interpretation
      - id: b
        text: Only the decimal answer
      - id: c
        text: The fastest-looking operator
      - id: d
        text: The source textbook chapter
      answer:
        choiceId: a
      explanation: The same expression may behave differently under a different width or interpretation.
  - id: enc-invariant
    title: Invariant
    required: true
    content: 'A good encodings, checksums, and error correction technique has an invariant: the thing that remains true after each transformation. Track that invariant before memorizing the expression.'
    check:
      id: enc-invariant-check
      title: Check understanding
      type: multipleChoice
      prompt: Why is an invariant useful?
      choices:
      - id: a
        text: It explains why the transformation remains correct.
      - id: b
        text: It removes the need to test edge cases.
      - id: c
        text: It means overflow is impossible.
      - id: d
        text: It replaces all documentation.
      answer:
        choiceId: a
      explanation: The invariant is the reason the manipulation is trustworthy.
  - id: enc-edge-cases
    title: Edge cases
    required: true
    content: Most encodings, checksums, and error correction bugs appear at zero, all-ones patterns, sign boundaries, exact powers of two, and maximum-width shifts.
    check:
      id: enc-edge-cases-check
      title: Check understanding
      type: multipleChoice
      prompt: Which input is usually worth checking explicitly in bit-level code?
      choices:
      - id: a
        text: Zero or a boundary value
      - id: b
        text: Only random large values
      - id: c
        text: Only values from a UI form
      - id: d
        text: Only prime numbers
      answer:
        choiceId: a
      explanation: Boundary patterns often reveal incorrect assumptions.
