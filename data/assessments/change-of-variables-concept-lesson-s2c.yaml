  - id: s02
    title: The Jacobian rescales area
    required: true
    content: The absolute determinant measures local area scaling under a transformation. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
