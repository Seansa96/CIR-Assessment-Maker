  - id: s04
    title: Worked micro-example
    required: true
    content: 'Use the short task Use $x=u+v$, $y=u-v$ to find $|\partial(x,y)/\partial(u,v)|$. as a model. First, build derivative matrix: What is the matrix? The resulting statement is $\begin{pmatrix}1&1\\1&-1\end{pmatrix}$. This identifies the governing relation and gives a checkable intermediate result.'
