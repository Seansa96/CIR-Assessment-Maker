  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 2 → Integration Techniques if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Transform a difficult region
    required: true
    content: 'A coordinate map can turn a slanted or curved region into a simpler uv-region. In Change of Variables in Multiple Integrals, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
