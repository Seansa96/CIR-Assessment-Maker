- id: q008
  title: Explain Kernel and user mode
  type: freeResponse
  prompt: 'In a short answer, explain why **Kernel and user mode** matters in Introduction and System Calls.

    '
  answer:
    expected: 'Privileged operations run in kernel mode so ordinary programs cannot directly damage devices, memory, or other
      processes. A complete answer should also note that if user code could execute privileged instructions directly, protection
      would collapse.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Kernel and user mode
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: Introduction and System Calls. The key is to connect the term to what the OS controls or protects.

    '
