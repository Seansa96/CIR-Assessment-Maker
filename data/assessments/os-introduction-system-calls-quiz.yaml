questions:
- id: q001
  title: Recognize Operating system roles
  type: multipleChoice
  prompt: 'Which statement best describes **Operating system roles** in operating systems?

    '
  choices:
  - id: a
    text: An operating system presents useful abstractions while allocating shared hardware resources fairly and safely.
  - id: b
    text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
  - id: c
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: d
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  answer:
    choiceId: a
  explanation: 'An operating system presents useful abstractions while allocating shared hardware resources fairly and safely.
    The distractors either ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
- id: q002
  title: Recognize Kernel and user mode
  type: multipleChoice
  prompt: 'Which statement best describes **Kernel and user mode** in operating systems?

    '
  choices:
  - id: a
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: b
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  - id: c
    text: It removes the need for explicit policies, permissions, or resource-management decisions.
  - id: d
    text: Privileged operations run in kernel mode so ordinary programs cannot directly damage devices, memory, or other processes.
  answer:
    choiceId: d
  explanation: 'Privileged operations run in kernel mode so ordinary programs cannot directly damage devices, memory, or other
