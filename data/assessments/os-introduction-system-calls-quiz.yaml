- id: q004
  title: Explain Hardware context
  type: freeResponse
  prompt: 'In a short answer, explain why **Hardware context** matters in Introduction and System Calls.

    '
  answer:
    expected: 'CPUs, memory, disks, buses, and interrupts shape what the OS can abstract and what it must protect. A complete
      answer should also note that ignoring hardware leads to wrong mental models for performance and protection.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Hardware context
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: Introduction and System Calls. The key is to connect the term to what the OS controls or protects.

    '
