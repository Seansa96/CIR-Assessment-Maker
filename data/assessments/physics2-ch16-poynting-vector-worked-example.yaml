title: Calculating Intensity
assessmentType: workedExample
categoryId: physics-2
topicId: physics2-electromagnetic-waves
workedExamples:
- id: we1
  title: Intensity of an EM Wave
  prompt: An electromagnetic wave has a maximum electric field of $30\text{ V/m}$.
    What is the time-averaged intensity of this wave? (Use $c = 3.0 \times 10^8\text{
    m/s}$ and $\mu_0 = 4\pi \times 10^{-7}\text{ T m/A}$).
  steps:
  - id: s1
    prompt: Use the intensity formula.
    explanation: 'Solution:

      1) Intensity $I = \frac{E_{max}^2}{2 \mu_0 c}$.

      2) Substitute values: $I = \frac{30^2}{2 (4\pi \times 10^{-7}) (3.0 \times 10^8)}$.

      3) $I = \frac{900}{24\pi \times 10^1} = \frac{900}{240\pi} \approx 1.19\text{
      W/m}^2$.


      Why it works:

      The Poynting vector gives the instantaneous power per area, and averaging over
      one cycle brings in the factor of 1/2.'
