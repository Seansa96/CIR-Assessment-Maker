items:
- id: quadratic-definition
  type: flashcard
  prompt: What coefficient condition makes $ax^2+bx+c$ genuinely quadratic?
  answer:
    expected: The leading coefficient a must be nonzero.
  explanation: Otherwise the degree is below two.
  tags: [quadratic-polynomial]
- id: zero-product-trigger
  type: flashcard
  prompt: What must be true before the zero-product property can be applied to factors?
  answer:
    expected: Their product must equal zero.
  explanation: A nonzero product does not force any factor to vanish.
  tags: [zero-product-property]
- id: completing-square-number
  type: typed
  prompt: Complete $x^2+12x+\_\_$ to a perfect square.
  answer:
    expected: '36'
  explanation: Square half of the linear coefficient.
  tags: [completing-square]
- id: formula-denominator
  type: typed
  prompt: Complete the quadratic-formula denominator $x=(-b\pm\sqrt{b^2-4ac})/\_\_$.
  answer:
    expected: 2a
    aliases: ['$2a$']
  explanation: The derivation divides the completed-square equation by $2a$.
  tags: [quadratic-formula]
- id: discriminant-positive
  type: flashcard
  prompt: What root pattern does $b^2-4ac>0$ give for real coefficients?
  answer:
    expected: Two distinct real roots.
  explanation: The square-root term is a nonzero real number.
  tags: [discriminant]
- id: discriminant-zero
  type: flashcard
  prompt: What root pattern does $b^2-4ac=0$ give?
  answer:
    expected: One repeated real root.
  explanation: The plus/minus branches coincide.
  tags: [discriminant, repeated-root]
- id: discriminant-negative
  type: flashcard
  prompt: What root pattern does $b^2-4ac<0$ give for real coefficients?
  answer:
    expected: Two nonreal complex-conjugate roots.
  explanation: The square root introduces $i$, and the two signs form a conjugate pair.
  tags: [discriminant]
- id: vieta-sum
  type: typed
  prompt: If $r,s$ solve $ax^2+bx+c=0$, complete $r+s=$ ____.
  answer:
    expected: -b/a
    aliases: ['$-b/a$', negative b over a]
  explanation: This is the linear-coefficient Vieta relation.
  tags: [vieta]
- id: vieta-product
  type: typed
  prompt: If $r,s$ solve $ax^2+bx+c=0$, complete $rs=$ ____.
  answer:
    expected: c/a
    aliases: ['$c/a$', c over a]
  explanation: This is the constant-coefficient Vieta relation.
  tags: [vieta]
- id: disguised-quadratic-cue
  type: flashcard
  prompt: What substitution reduces $x^4-7x^2+10=0$ to a quadratic?
  answer:
    expected: Let u equal x squared.
    aliases: ['$u=x^2$']
  explanation: The powers are consecutive powers of the repeated expression $x^2$.
  tags: [quadratic-substitution]
- id: reverse-substitution-check
  type: flashcard
  prompt: Why is solving the transformed quadratic in $u=g(x)$ not the final step?
  answer:
    expected: Each u-value must be converted back to x and checked against the range and domain of g.
  explanation: Some transformed roots may have no admissible preimage.
  tags: [quadratic-substitution]
- id: extraneous-root-check
  type: flashcard
  prompt: What is the final safeguard after squaring an equation or clearing variable denominators?
  answer:
    expected: Substitute every candidate into the original equation and reject any invalid value.
  explanation: Those transformations can introduce candidates or ignore excluded values.
  tags: [extraneous-root]
