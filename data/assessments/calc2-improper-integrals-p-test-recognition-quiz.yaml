questions:
- id: q001
  type: multipleChoice
  skills:
  - improper-integrals-p-test-recognition
  prompt: 'Decide convergence:


    $$

    \int_1^\infty \frac{1}{x^2}\,dx

    $$

    '
  choices:
  - id: a
    text: Converges, because $p=2>1$ for an infinite tail.
  - id: b
    text: Diverges, because the interval is infinite.
  - id: c
    text: Diverges, because $p=2>1$.
  - id: d
    text: Converges, because all positive functions converge.
  answer:
    choiceId: a
  explanation: 'Use the Type 1 $p$-test:


    $$

    \int_1^\infty \frac{1}{x^p}\,dx

    $$


    converges exactly when $p>1$. Here $p=2$.


    Related topic: infinite-tail $p$-test.

    '
- id: q002
  type: multipleChoice
  skills:
  - improper-integrals-p-test-recognition
  prompt: 'Decide convergence:


    $$

    \int_1^\infty \frac{1}{x^{1/2}}\,dx

    $$

    '
  choices:
  - id: a
    text: Diverges, because $p=\frac{1}{2}\le1$ for an infinite tail.
  - id: b
    text: Converges, because $p=\frac{1}{2}<1$.
  - id: c
    text: Converges, because the integrand approaches $0$.
  - id: d
    text: Diverges only if $p<0$.
  answer:
    choiceId: a
  explanation: 'For $\int_1^\infty x^{-p}\,dx$, convergence requires $p>1$. Here $p=\frac{1}{2}$,
    so the tail area diverges.


    Related topic: slow decay at infinity.

    '
- id: q003
  type: multipleChoice
  skills:
  - improper-integrals-p-test-recognition
  prompt: 'Decide convergence:


    $$

    \int_0^1 \frac{1}{x^{1/2}}\,dx

    $$

    '
  choices:
  - id: a
    text: Converges, because $p=\frac{1}{2}<1$ for an endpoint singularity.
  - id: b
    text: Diverges, because all endpoint singularities diverge.
  - id: c
    text: Diverges, because $p=\frac{1}{2}<1$.
  - id: d
    text: Converges only when $p>1$.
  answer:
    choiceId: a
  explanation: 'For $\int_0^1 x^{-p}\,dx$, convergence requires $p<1$. This is the
    endpoint version of the $p$-test.


    Related topic: endpoint $p$-test.

    '
- id: q004
  type: multipleChoice
  skills:
  - improper-integrals-p-test-recognition
  prompt: 'Decide convergence:


    $$

    \int_0^1 \frac{1}{x^{3/2}}\,dx

    $$

    '
  choices:
  - id: a
    text: Diverges, because $p=\frac{3}{2}\ge1$ at an endpoint.
  - id: b
    text: Converges, because $p=\frac{3}{2}>1$.
  - id: c
    text: Converges, because the interval is finite.
  - id: d
    text: Diverges only at infinity.
  answer:
    choiceId: a
  explanation: 'The singularity is at $x=0$, so use the endpoint $p$-test. Since $p=\frac{3}{2}\ge1$,
    the integral diverges.


    Related topic: Type 2 endpoint singularity.

    '
- id: q005
  type: multipleChoice
  skills:
  - improper-integrals-p-test-recognition
  prompt: 'Decide convergence:


    $$

    \int_2^\infty \frac{1}{x(\ln x)^2}\,dx

    $$

    '
  choices:
  - id: a
    text: Converges, but not by the basic $1/x^p$ test alone; use $u=\ln x$.
  - id: b
    text: Diverges by the $p$-test with $p=1$.
  - id: c
    text: Converges by endpoint $p<1$.
  - id: d
    text: Diverges because $\ln x$ is present.
  answer:
    choiceId: a
  explanation: 'This resembles a $p$-test boundary, but the extra $(\ln x)^2$ matters.
    With $u=\ln x$, $du=\frac{1}{x}\,dx$, so the tail becomes


    $$

    \int_{\ln 2}^{\infty}\frac{1}{u^2}\,du,

    $$


    which converges.


    Related topic: logarithmic correction at the $p=1$ boundary.

    '
- id: q006
  type: multipleChoice
  skills:
  - improper-integrals-p-test-recognition
  prompt: 'Decide convergence:


    $$

    \int_2^\infty \frac{1}{x\ln x}\,dx

    $$

    '
  choices:
  - id: a
    text: Diverges; with $u=\ln x$, it becomes $\int_{\ln 2}^{\infty}\frac{1}{u}\,du$.
  - id: b
    text: Converges because $\ln x$ grows.
  - id: c
    text: Converges by $p=2$.
  - id: d
    text: Diverges because the lower bound is $2$.
  answer:
    choiceId: a
  explanation: 'Use $u=\ln x$. The integral becomes a divergent $p=1$ tail:


    $$

    \int_{\ln 2}^{\infty}\frac{1}{u}\,du.

    $$


    Related topic: logarithmic divergence.

    '
- id: q007
  type: multipleChoice
  skills:
  - improper-integrals-p-test-recognition
  prompt: 'Decide convergence:


    $$

    \int_{-\infty}^{-1}\frac{1}{x^2}\,dx

    $$

    '
  choices:
  - id: a
    text: Converges, because the left tail behaves like a $p=2$ tail.
  - id: b
    text: Diverges because the lower bound is negative infinity.
  - id: c
    text: Diverges because $x^2$ is positive.
  - id: d
    text: Converges only on positive intervals.
  answer:
    choiceId: a
  explanation: 'A left infinite tail uses the same decay idea. Since $\frac{1}{x^2}$
    has $p=2>1$, the tail converges.


    Related topic: left-tail $p$-test.

    '
- id: q008
  type: multipleChoice
  skills:
  - improper-integrals-p-test-recognition
  prompt: 'Decide convergence:


    $$

    \int_{-\infty}^{\infty}\frac{1}{1+x^2}\,dx

    $$

    '
  choices:
  - id: a
    text: Converges, because both tails behave like $\frac{1}{x^2}$.
  - id: b
    text: Diverges, because every two-tail integral diverges.
  - id: c
    text: Converges only as a principal value, not ordinarily.
  - id: d
    text: Diverges because the integrand is positive.
  answer:
    choiceId: a
  explanation: 'Split the integral into two tails. For large $|x|$, the integrand
    behaves like $\frac{1}{x^2}$, so both tails converge.


    Related topic: two-tail convergence condition.

    '

