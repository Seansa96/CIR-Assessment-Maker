title: Improper Integral P-Test Recognition Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: improper-integrals
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 10
skills: [improper-integral-p-test, identify-defect-location, logarithmic-boundary]
navigation: { learningGoal: practice, activityType: focusedPractice, tags: [calculus-2, improper-integrals, p-test, easy] }
authoring: { visualRequirement: required, visualRationale: The limit map reinforces that p-test inequalities depend on whether the defect is a tail or an endpoint., difficultyTier: easy }
questions:
- id: q001
  type: multipleChoice
  prompt: 'Does $\int_1^\infty x^{-2}\,dx$ converge?'
  choices: [{ id: a, text: 'Yes; it is a tail p-test with p=2>1.' }, { id: b, text: 'No; every infinite interval diverges.' }, { id: c, text: 'No; p>1 diverges at infinity.' }, { id: d, text: 'Yes; every positive integrand converges.' }]
  answer: { choiceId: a }
  explanation: 'This is an infinite tail, so the relevant threshold is p>1. Its decay is faster than 1/x, giving a finite limiting area.'
  difficultyDimensions: [representationTransfer, domainCondition]
  difficultyEvidence: Identifies the defect as an infinite tail and transfers the exponent to the tail p-test inequality.
  prerequisiteObjectiveIds: [calc2-improper-identify-and-limit]
- id: q002
  type: multipleChoice
  prompt: 'Does $\int_1^\infty x^{-1/2}\,dx$ converge?'
  choices: [{ id: a, text: 'No; a tail requires p>1, and 1/2 is too small.' }, { id: b, text: 'Yes; p<1 always converges.' }, { id: c, text: 'Yes; the integrand tends to zero.' }, { id: d, text: 'No; only negative powers diverge.' }]
  answer: { choiceId: a }
  explanation: 'Tending to zero is necessary but not sufficient. At infinity x to the negative one-half decays more slowly than 1/x, so its accumulated area is infinite.'
  difficultyDimensions: [representationTransfer, errorDiagnosis]
  difficultyEvidence: Applies the tail p-test and rejects the common false inference that a zero integrand limit guarantees convergence.
  prerequisiteObjectiveIds: [calc2-improper-identify-and-limit]
- id: q003
  type: multipleChoice
  prompt: 'Does $\int_0^1x^{-1/2}\,dx$ converge?'
  choices: [{ id: a, text: 'Yes; an endpoint singularity requires p<1.' }, { id: b, text: 'No; all vertical asymptotes diverge.' }, { id: c, text: 'No; p<1 diverges.' }, { id: d, text: 'Yes; p>1 is required.' }]
  answer: { choiceId: a }
  explanation: 'The defect is at zero, not infinity. For an endpoint p-test, the integrable range reverses: p must be less than one, and one-half satisfies that rule.'
  difficultyDimensions: [representationTransfer, domainCondition]
  difficultyEvidence: Locates the finite-endpoint singularity and chooses the opposite p-test threshold from the tail case.
  prerequisiteObjectiveIds: [calc2-improper-identify-and-limit]
- id: q004
  type: multipleChoice
  prompt: 'Does $\int_0^1x^{-3/2}\,dx$ converge?'
  choices: [{ id: a, text: 'No; p=3/2 is at least 1 near zero.' }, { id: b, text: 'Yes; p>1 always converges.' }, { id: c, text: 'Yes; the interval is finite.' }, { id: d, text: 'No; only infinite intervals are improper.' }]
  answer: { choiceId: a }
  explanation: 'A finite interval does not cure an unbounded endpoint. Near zero, p at least one makes the antiderivative blow up as the cutoff approaches the singularity.'
  difficultyDimensions: [domainCondition, errorDiagnosis]
  difficultyEvidence: Applies the endpoint threshold and rejects the finite-interval misconception.
  prerequisiteObjectiveIds: [calc2-improper-identify-and-limit]
- id: q005
  type: multipleChoice
  prompt: 'Which comparison correctly classifies $\int_3^\infty 1/(x^2+4)\,dx$?'
  choices: [{ id: a, text: 'It converges because $1/(x^2+4)\le1/x^2$.' }, { id: b, text: 'It diverges because the interval is infinite.' }, { id: c, text: 'It diverges because it is smaller than 1/x squared.' }, { id: d, text: 'It is a p=1 tail.' }]
  answer: { choiceId: a }
  explanation: 'For x positive, adding 4 makes the denominator larger and the integrand smaller. Since the benchmark 1/x squared has a convergent tail, direct comparison proves convergence.'
  difficultyDimensions: [simplification, representationTransfer]
  difficultyEvidence: Compares a rational integrand to a p-test benchmark and uses the correct inequality direction.
  prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison]
- id: q006
  type: multipleChoice
  prompt: 'Which conclusion follows from $1/x\le f(x)$ for all sufficiently large x, where f is nonnegative?'
  choices: [{ id: a, text: '$\int_A^\infty f(x)\,dx$ diverges.' }, { id: b, text: '$\int_A^\infty f(x)\,dx$ converges.' }, { id: c, text: 'No comparison conclusion is possible.' }, { id: d, text: 'The integral equals ln x.' }]
  answer: { choiceId: a }
  explanation: 'The harmonic tail diverges. A nonnegative function eventually at least as large has at least as much tail area, so direct comparison proves divergence.'
  difficultyDimensions: [representationTransfer, proofJustification]
  difficultyEvidence: Transfers an eventual inequality into an area comparison and selects the divergent-benchmark direction.
  prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison]
- id: q007
  type: multipleChoice
  prompt: 'Does $\int_2^\infty1/[x(\ln x)^2]\,dx$ converge?'
  choices: [{ id: a, text: 'Yes; u=ln x gives a convergent u to the negative two tail.' }, { id: b, text: 'No; every expression with 1/x diverges.' }, { id: c, text: 'Yes; it is an endpoint p-test.' }, { id: d, text: 'No; logarithms prevent substitution.' }]
  answer: { choiceId: a }
  explanation: 'The basic p-test boundary is modified by the logarithm. With u equal to ln x, the integral becomes a u to the negative two tail, whose exponent is greater than one.'
  difficultyDimensions: [auxiliaryTechnique, representationTransfer]
  difficultyEvidence: Recognizes a logarithmic boundary form and transforms it with a substitution before applying the p-test.
  prerequisiteObjectiveIds: [calc2-u-substitution]
- id: q008
  type: multipleChoice
  prompt: 'Does $\int_2^\infty1/[x\ln x]\,dx$ converge?'
  choices: [{ id: a, text: 'No; u=ln x gives the divergent 1/u tail.' }, { id: b, text: 'Yes; ln x grows without bound.' }, { id: c, text: 'Yes; it is smaller than 1/x.' }, { id: d, text: 'No; its lower bound is 2.' }]
  answer: { choiceId: a }
  explanation: 'The same substitution produces the p equals one boundary in u. Its antiderivative is ln u, which does not approach a finite limit as the cutoff grows.'
  difficultyDimensions: [auxiliaryTechnique, domainCondition]
  difficultyEvidence: Applies a logarithmic substitution and interprets the resulting infinite-tail boundary case.
  prerequisiteObjectiveIds: [calc2-u-substitution]
- id: q009
  type: multipleChoice
  prompt: 'How must $\int_{-\infty}^{\infty}1/(1+x^2)\,dx$ be checked?'
  choices: [{ id: a, text: 'Split it into two tails and require both to converge.' }, { id: b, text: 'Substitute infinity directly into arctan x.' }, { id: c, text: 'Use only the right tail.' }, { id: d, text: 'Use principal-value cancellation.' }]
  answer: { choiceId: a }
  explanation: 'A two-tailed improper integral is defined as the sum of two one-sided tails. Here each tail behaves like x to the negative two and is finite.'
  difficultyDimensions: [modelOrDerivation, representationTransfer]
  difficultyEvidence: Constructs the required two-limit model and transfers asymptotic behavior to the tail p-test.
  prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate]
- id: q010
  type: multipleChoice
  prompt: 'Which integral is improper because of an interior singularity rather than an infinite interval?'
  choices: [{ id: a, text: '$\int_0^2 1/(x-1)^2\,dx$' }, { id: b, text: '$\int_1^\infty x^{-2}\,dx$' }, { id: c, text: '$\int_{-\infty}^{-1}x^{-2}\,dx$' }, { id: d, text: '$\int_1^2x^2\,dx$' }]
  answer: { choiceId: a }
  explanation: 'The denominator vanishes at x equals one inside the interval. That requires two one-sided limits, unlike the one-sided tail limits in the other improper examples.'
  difficultyDimensions: [representationTransfer, casePartition]
  difficultyEvidence: Locates a discontinuity within an interval and distinguishes it from tail and proper-integral cases.
  prerequisiteObjectiveIds: [calc2-improper-identify-and-limit]
