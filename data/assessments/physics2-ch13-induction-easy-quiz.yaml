questions:
- id: q001
  type: multipleChoice
  difficultyDimensions:
  - conceptual-mapping
  - principle-recognition
  prompt: 'According to Lenz''s Law, if the magnetic flux through a loop is increasing, the induced magnetic
    field will point:'
  explanation: 'Solution:

    The induced field opposes the CHANGE in flux. Since flux is increasing, the induced field points opposite
    to the external field to cancel the increase.


    Why it works:

    This is required by conservation of energy. Otherwise, the induced current would reinforce the change,
    leading to runaway energy generation.

    Why the other choices fail: Pointing in the same direction would happen if the flux were decreasing.'
  choices:
  - id: a
    text: In the opposite direction to the original magnetic field.
  - id: b
    text: In the same direction as the original magnetic field.
  - id: c
    text: Perpendicular to the original magnetic field.
  - id: d
    text: It will randomly fluctuate.
  answer:
    choiceId: a
