- id: q001
  type: multipleChoice
  difficultyDimensions: &id001
  - modelOrDerivation
  - errorDiagnosis
  prompt: 'According to Lenz''s Law, if the magnetic flux through a loop is increasing, the induced magnetic field
    will point:'
  explanation: 'Solution:

    The induced field opposes the CHANGE in flux. Since flux is increasing, the induced field points opposite to
    the external field to cancel the increase.


    Why it works:

    This is required by conservation of energy. Otherwise, the induced current would reinforce the change, leading
    to runaway energy generation.

    Why the other choices fail: Pointing in the same direction would happen if the flux were decreasing.'
  choices:
  - id: a
    text: In the opposite direction to the original magnetic field.
  - id: b
    text: In the same direction as the original magnetic field.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: Perpendicular to the original magnetic field.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: d
    text: It will randomly fluctuate.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  answer:
    choiceId: a
  difficultyEvidence: Requires selecting the governing physical model and checking an assumption or representation.
- id: q002
  type: multipleChoice
  skills:
  - physics2-ch13-modeling
  prompt: When analyzing faraday's law in Electromagnetic Induction, which first step makes use of $\\mathcal{E}=-d\\Phi_B/dt$
    physically meaningful?
  choices:
  - id: a
    text: Define the system, identify the relevant quantities and directions, then check the relation's assumptions.
  - id: b
    text: Substitute every listed number before deciding what quantity the equation represents.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: Ignore units because the formula supplies the correct dimension automatically.
    issueSignals:
    - id: physics2-units-error
      domains:
      - physics-2
  - id: d
    text: Treat directed quantities as positive regardless of the selected convention.
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  answer:
    choiceId: a
  explanation: 'Solution: Define the model before substituting values and then check units, direction, and the stated
    condition.


    Why it works: \\mathcal{E}=-d\\Phi_B/dt relates defined physical quantities in the emf from changing magnetic
    flux model; it is not a number-matching rule.


    Why the other choices fail: The alternatives skip model selection, dimensional analysis, or the sign convention
    that gives the result physical meaning.'
