workedExamples:
- id: we-standing-sound-modes
  title: Deriving and applying Normal Modes of a Standing Sound Wave
  problem: Use the labeled model to derive and calculate the tube mode frequency from $f_n=nv/(2L)$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the type of pipe and its length $L$ from the diagram.
    prompt: 'Identify the parameters.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Pipe type and length L'
    explanation: >-
      We need to know if the pipe is open-open or closed-open, and its length $L$.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the displacement boundary condition at a closed end.
    prompt: 'What is the boundary at a closed end?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Displacement node.'
    explanation: >-
      Air cannot move through a solid wall, so a closed end must be a displacement node.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target: calculate the fundamental frequency $f_1$ of a closed-open pipe.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Fundamental frequency f_1'
    explanation: >-
      We want to find $f_1$.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the frequency relation for a pipe closed at one end.
    prompt: 'Write the equation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'f_n = n v / (4L)'
    explanation: >-
      $f_n = n \frac{v}{4L}$ for odd $n$.
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the fundamental frequency ($n=1$).
    prompt: 'Isolate $f_1$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'f_1 = v / (4L)'
    explanation: >-
      For $n=1$, $f_1 = \frac{v}{4L}$.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given $v = 343$ m/s and $L = 0.50$ m, calculate $f_1$.
    prompt: 'Calculate the frequency.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      value: 170.0
      tolerance: 1.7
    explanation: >-
      $f_1 = 343 / (4 \times 0.50) = 343 / 2.0 = 171.5$ Hz.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the units of $v/L$.
    prompt: 'What are the units?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Hz'
    explanation: >-
      (m/s) / m = $1/\text{s}$ = Hertz (Hz).
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated fundamental frequency.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      value: 170.0
      tolerance: 1.7
    explanation: >-
      The fundamental frequency is $171.5$ Hz.
