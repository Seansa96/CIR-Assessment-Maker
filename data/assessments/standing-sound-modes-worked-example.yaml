workedExamples:
- id: we-standing-sound-modes
  title: Deriving and applying Normal Modes of a Standing Sound Wave
  problem: Use the labeled model to derive and calculate the tube mode frequency from $f_n=nv/(2L)$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: Identify the type of pipe and its length $L$ from the diagram.
    prompt: Identify the parameters.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Pipe type and length L
    explanation: 'Solution: We need to know if the pipe is open-open or closed-open, and its length $L$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step2
    title: State the assumptions
    instruction: State the displacement boundary condition at a closed end.
    prompt: What is the boundary at a closed end?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Displacement node.
    explanation: 'Solution: Air cannot move through a solid wall, so a closed end must be a displacement node.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step3
    title: Name the target
    instruction: 'Identify the target: calculate the fundamental frequency $f_1$ of a closed-open pipe.'
    prompt: Name the target.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Fundamental frequency f_1
    explanation: 'Solution: We want to find $f_1$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step4
    title: Write the governing relation
    instruction: Write the frequency relation for a pipe closed at one end.
    prompt: Write the equation.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - f_n = n v / (4L)
    explanation: 'Solution: $f_n = n \frac{v}{4L}$ for odd $n$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step5
    title: Isolate the target
    instruction: Isolate the fundamental frequency ($n=1$).
    prompt: Isolate $f_1$.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - f_1 = v / (4L)
    explanation: 'Solution: For $n=1$, $f_1 = \frac{v}{4L}$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step6
    title: Substitute the known values
    instruction: Given $v = 343$ m/s and $L = 0.50$ m, calculate $f_1$.
    prompt: Calculate the frequency.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      value: 170.0
      tolerance: 1.7
    explanation: 'Solution: $f_1 = 343 / (4 \times 0.50) = 343 / 2.0 = 171.5$ Hz.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step7
    title: Check units and limiting behavior
    instruction: Check the units of $v/L$.
    prompt: What are the units?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Hz
    explanation: 'Solution: (m/s) / m = $1/\text{s}$ = Hertz (Hz).\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step8
    title: State the result
    instruction: State the final calculated fundamental frequency.
    prompt: State the result.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
    answer:
      value: 170.0
      tolerance: 1.7
    explanation: 'Solution: The fundamental frequency is $171.5$ Hz.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
- id: closed-open-mode-we002
  title: Third Harmonic of a Closed-Open Tube
  problem: A closed-open tube has length $0.50\ \text{m}$ and sound speed $340\ \text{m/s}$. Find its first overtone frequency.
  steps:
  - id: closed-open-mode-we002-step-1
    title: Identify the harmonic number
    instruction: 'Complete this step.'
    type: numericResponse
    prompt: What harmonic number corresponds to the first overtone of a closed-open tube?
    answer: {value: 3, tolerance: 0.01}
    explanation: 'Solution: The first overtone is $n=3$. Why it works: closed-open tubes allow only odd harmonic numbers $1,3,5,\ldots$.'
  - id: closed-open-mode-we002-step-2
    title: Calculate the overtone frequency
    instruction: 'Complete this step.'
    type: numericResponse
    prompt: Calculate the first overtone frequency in hertz.
    answer: {value: 510, tolerance: 0.1}
    explanation: 'Solution: $f_3=3v/(4L)=3(340)/(4\cdot0.50)=510\ \text{Hz}$. Why it works: the closed-open mode formula uses odd integer multiples of the quarter-wave fundamental.'
