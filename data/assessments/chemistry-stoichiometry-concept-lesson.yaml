lesson:
  introduction: 'A balanced chemical equation is a recipe. The coefficients tell you
    exactly what proportions of each ingredient you need and\rhow much product you
    will get. Stoichiometry is the art of reading and using that recipe quantitatively
    — converting between masses, moles, and particle counts across a chemical reaction.

    '
  sections:
  - id: mole-ratios
    title: Mole Ratios from Balanced Equations
    required: true
    content: 'The coefficients in a balanced equation are **mole ratios** — they describe
      the relative amounts (in moles) of each substance consumed or produced.


      **Example:**

      $$

      \text{N}_2(g) + 3\text{H}_2(g) \rightarrow 2\text{NH}_3(g)

      $$


      From this equation, valid mole ratios include:

      - 1 mol N2 per 3 mol H2

      - 1 mol N2 per 2 mol NH3

      - 3 mol H2 per 2 mol NH3


      **Use:** If you know\rhow many moles of one substance you have, you can calculate
      moles of any other substance using the appropriate ratio.


      **Example calculation:** How many moles of NH3 are produced from 6.0 mol of
      H2?


      $$

      6.0 \text{ mol H}_2 \times \frac{2 \text{ mol NH}_3}{3 \text{ mol H}_2} = 4.0
      \text{ mol NH}_3

      $$

      '
    check:
      id: mole-ratio-check
      type: numericResponse
      prompt: 'Using the equation N2 + 3H2 → 2NH3,\rhow many moles of N2 are needed
        to produce 10.0 mol of NH3?

        '
      answer:
        value: 5.0
        tolerance: 0.1
      explanation: '5.0 mol N2. From the ratio 1 mol N2 : 2 mol NH3 → n(N2) = 10.0
        × (1/2) = 5.0 mol.

        '
  - id: mass-to-mass
    title: Mass-to-Mass Stoichiometry
    required: true
    content: 'In the lab, you measure **masses** (grams), not moles directly. The
      three-step roadmap converts masses of one substance to masses of another:


      $$

      \text{g A} \xrightarrow{\div M_A} \text{mol A} \xrightarrow{\times \text{mole
      ratio}} \text{mol B} \xrightarrow{\times M_B} \text{g B}

      $$


      **Example:** How many grams of water (H2O) are produced when 32.0 g of CH4 burns?


      $$

      \text{CH}_4 + 2\text{O}_2 \rightarrow \text{CO}_2 + 2\text{H}_2\text{O}

      $$


      Step 1: $n_{CH_4} = \frac{32.0 \text{ g}}{16.04 \text{ g/mol}} = 1.995 \text{
      mol}$


      Step 2: $n_{H_2O} = 1.995 \text{ mol CH}_4 \times \frac{2 \text{ mol H}_2\text{O}}{1
      \text{ mol CH}_4} = 3.990 \text{ mol}$


      Step 3: $m_{H_2O} = 3.990 \text{ mol} \times 18.015 \text{ g/mol} = 71.9 \text{
      g}$

      '
    check:
      id: mass-to-mass-check
      type: numericResponse
      prompt: 'How many grams of CO2 are produced when 44.0 g of CO burns completely?

        2CO + O2 → 2CO2

        (M(CO) = 28.01, M(CO2) = 44.01 g/mol)

        '
      answer:
        value: 69.1
        tolerance: 0.5
      explanation: 'n(CO) = 44.0/28.01 = 1.571 mol. From ratio 2CO:2CO2, n(CO2) =
        1.571 mol. m(CO2) = 1.571 × 44.01 = 69.1 g.

        '
  - id: limiting-reactant
    title: The Limiting Reactant
    required: true
    content: 'In real reactions, reactants are rarely present in the exact molar ratio
      the equation requires. The **limiting reactant** (limiting reagent) is the one
      that runs out first — it determines the maximum amount of product that can be
      formed.


      The **excess reactant** is the one still remaining after the reaction ends.


      **Strategy — Identifying the Limiting Reactant:**


      Method 1 (Recommended): Calculate the moles of product that would be produced
      from each reactant separately. The reactant that produces the **smaller** amount
      of product is the limiting reactant.


      **Example:**

      $$

      2\text{Al} + 3\text{Cl}_2 \rightarrow 2\text{AlCl}_3

      $$


      Given: 10.0 g Al and 30.0 g Cl2.


      - From Al: $n_{Al} = \frac{10.0}{26.98} = 0.371 \text{ mol}$ → $n_{AlCl_3} =
      0.371 \times \frac{2}{2} = 0.371 \text{ mol}$

      - From Cl2: $n_{Cl_2} = \frac{30.0}{70.90} = 0.423 \text{ mol}$ → $n_{AlCl_3}
      = 0.423 \times \frac{2}{3} = 0.282 \text{ mol}$


      Cl2 gives the smaller amount of product → **Cl2 is the limiting reactant**.
      Maximum AlCl3 = 0.282 mol.

      '
    check:
      id: limiting-check
      type: multipleChoice
      prompt: 'For the reaction H2 + Cl2 → 2HCl, a student mixes 3.0 mol H2 with 2.0
        mol Cl2. Which is the limiting reactant?

        '
      choices:
      - id: a
        text: Cl2 — it produces less HCl (4.0 mol) than H2 would (6.0 mol).
      - id: b
        text: H2 — there is more H2 than Cl2.
      - id: c
        text: Both react completely — neither is limiting.
      - id: d
        text: HCl — it is the product and limits the reaction.
      answer:

        choiceId: a
      explanation: 'From 3.0 mol H2: 3.0 × (2/1) = 6.0 mol HCl possible. From 2.0
        mol Cl2: 2.0 × (2/1) = 4.0 mol HCl possible. Cl2 produces less HCl → Cl2 is
        limiting. 1.0 mol of H2 remains unreacted.

        '
  - id: percent-yield
    title: Theoretical Yield and Percent Yield
    required: true
    content: '**Theoretical yield**: The maximum amount of product that can be formed
      based on the limiting reactant — assuming 100% conversion.


      **Actual yield**: The amount of product actually collected in the lab. It is
      always ≤ theoretical yield because of:

      - Side reactions (product lost to competing reactions)

      - Incomplete reactions

      - Physical loss during transfer and purification


      **Percent yield:**

      $$

      \%\text{ yield} = \frac{\text{actual yield}}{\text{theoretical yield}} \times
      100\%

      $$


      A percent yield of 100% is ideal and rarely achieved. Values of 70–90% are common
      in organic synthesis; over 90% is excellent.


      **Example:** The theoretical yield of a product is 25.0 g. The student collects
      21.3 g.

      $$

      \%\text{ yield} = \frac{21.3}{25.0} \times 100\% = 85.2\%

      $$

      '
    check:
      id: yield-check
      type: numericResponse
      prompt: 'A reaction has a theoretical yield of 40.0 g. Only 33.6 g of product
        is collected. What is the percent yield?

        '
      answer:
        value: 84.0
        tolerance: 0.5
      explanation: '% yield = (33.6 / 40.0) × 100% = 84.0%.

        '
