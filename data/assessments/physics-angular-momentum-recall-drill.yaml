items:
  - { id: ar1, type: cloze, prompt: 'Complete: $\vec L=\vec r\times\underline{\hspace{0.7cm}}$.', answer: { expected: p, expectedLatex: '\vec p', aliases: [momentum], media: [] }, explanation: 'Solution: Insert $\vec p$.\n\nWhy it works: Particle angular momentum is position cross linear momentum.', tags: [particle] }
  - { id: ar2, type: cloze, prompt: 'Complete fixed-axis relation: $L=I\underline{\hspace{0.7cm}}$.', answer: { expected: omega, expectedLatex: '\omega', aliases: ['angular velocity'], media: [] }, explanation: 'Solution: Insert $\omega$.\n\nWhy it works: Fixed-axis angular momentum is inertia times angular speed.', tags: [rigid-body] }
  - { id: ar3, type: typed, prompt: 'What quantity equals the time rate of change of angular momentum?', answer: { expected: torque, expectedLatex: '', aliases: ['net torque'], media: [] }, explanation: 'Solution: The quantity is torque.\n\nWhy it works: $\vec\tau=d\vec L/dt$.', tags: [torque] }
  - { id: ar4, type: cloze, prompt: 'Angular impulse equals change in angular ____.', answer: { expected: momentum, expectedLatex: '', aliases: [L], media: [] }, explanation: 'Solution: Insert momentum.\n\nWhy it works: $\int\tau dt=\Delta L$.', tags: [impulse] }
  - { id: ar5, type: typed, prompt: 'What is the SI unit of angular momentum?', answer: { expected: 'kg m^2/s', expectedLatex: '', aliases: ['kg·m^2/s', 'N m s'], media: [] }, explanation: 'Solution: The unit is kg m^2/s.\n\nWhy it works: $L=I\omega$.', tags: [units] }
  - { id: ar6, type: cloze, prompt: 'With zero net external torque, total angular momentum is ____.', answer: { expected: conserved, expectedLatex: '', aliases: [constant], media: [] }, explanation: 'Solution: Insert conserved.\n\nWhy it works: Zero torque means no change in $L$.', tags: [conservation] }
