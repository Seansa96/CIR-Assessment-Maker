  prompt: 'Simplify and evaluate $\int \frac{4x^3}{1+x^4}\,dx$; state the logarithm domain.'
  answer: { gradingMode: selfCheck, checkModel: '$\ln(1+x^4)+C$; valid for all real x.' }
  explanation: Simplification exposes du; positivity supplies the domain check.
  difficultyDimensions: [simplification, auxiliaryTechnique, domainCondition]
  difficultyEvidence: Simplifies, substitutes, and validates the logarithm.
  prerequisiteObjectiveIds: [calc1-logarithms]
