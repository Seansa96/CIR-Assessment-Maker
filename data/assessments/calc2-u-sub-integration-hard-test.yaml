  prompt: 'Evaluate $\int_0^1\frac{2x}{(x^2+1)^2}\,dx$ with changed bounds and verify by differentiating an antiderivative.'
  answer: { gradingMode: selfCheck, checkModel: '$1/2$.' }
  explanation: Use $u=x^2+1$, bounds 1 to 2, then check $-1/(x^2+1)$.
  difficultyDimensions: [auxiliaryTechnique, representationTransfer, proofJustification]
  difficultyEvidence: Converts bounds, integrates in u, and verifies independently.
  prerequisiteObjectiveIds: [calc1-definite-integrals]
