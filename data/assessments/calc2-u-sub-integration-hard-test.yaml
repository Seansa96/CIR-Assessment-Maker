- id: q-usub-ht-1
  title: Back-Substitution
  prompt: |-
    Evaluate the indefinite integral:
    $$\int x \sqrt{x - 1} \, dx$$
  type: multipleChoice
  choices:
  - id: c1
    text: $\frac{2}{5}(x-1)^{5/2} + \frac{2}{3}(x-1)^{3/2} + C$
  - id: c2
    text: $\frac{2}{5}x^{5/2} + \frac{2}{3}x^{3/2} + C$
  - id: c3
    text: $\frac{2}{3}(x-1)^{3/2} + C$
  - id: c4
    text: $\frac{2}{5}(x-1)^{5/2} - \frac{2}{3}(x-1)^{3/2} + C$
  answer:
    choiceId: c1
  explanation: |-
    Let $u = x - 1$. Then $du = dx$. But we have a leftover $x$!
    Because $u = x - 1$, we can write $x = u + 1$.
    Substitute to get $\int (u + 1)\sqrt{u} \, du = \int (u^{3/2} + u^{1/2}) \, du$.
    Integrate: $\frac{2}{5}u^{5/2} + \frac{2}{3}u^{3/2} + C$.
    Substitute back: $\frac{2}{5}(x-1)^{5/2} + \frac{2}{3}(x-1)^{3/2} + C$.
  skills:
  - calc2-u-sub-integration

- id: q-usub-ht-2
  title: U-Sub with Natural Log
  prompt: |-
    Evaluate the indefinite integral:
    $$\int \frac{\sec^2(\ln x)}{x} \, dx$$
  type: multipleChoice
  choices:
  - id: c1
    text: $\tan(\ln x) + C$
  - id: c2
    text: $\sec(\ln x)\tan(\ln x) + C$
  - id: c3
    text: $\frac{1}{3}\sec^3(\ln x) + C$
  - id: c4
    text: $\ln(\sec^2 x) + C$
  answer:
    choiceId: c1
  explanation: |-
    Let $u = \ln x$. Then $du = \frac{1}{x} \, dx$.
    Substitute to get $\int \sec^2(u) \, du$.
    The antiderivative of $\sec^2(u)$ is $\tan(u) + C$.
    Substitute back to get $\tan(\ln x) + C$.
  skills:
  - calc2-u-sub-integration

- id: q-usub-ht-3
  title: Completing the Square for U-Sub
  prompt: |-
    Evaluate the integral by first completing the square:
    $$\int \frac{dx}{x^2 + 4x + 13}$$
  type: multipleChoice
  choices:
  - id: c1
    text: $\frac{1}{3}\arctan\left(\frac{x+2}{3}\right) + C$
  - id: c2
    text: $\frac{1}{3}\arctan(x+2) + C$
  - id: c3
    text: $\ln|x^2 + 4x + 13| + C$
  - id: c4
    text: $\arctan\left(\frac{x+2}{3}\right) + C$
  answer:
    choiceId: c1
  explanation: |-
    Complete the square in the denominator: $x^2 + 4x + 13 = (x^2 + 4x + 4) + 9 = (x+2)^2 + 3^2$.
    The integral is $\int \frac{dx}{(x+2)^2 + 3^2}$.
    Let $u = x+2$, $du = dx$. The integral becomes $\int \frac{du}{u^2 + 3^2}$.
    This is the standard arctangent form: $\frac{1}{a}\arctan(u/a) + C$, where $a=3$.
    Result: $\frac{1}{3}\arctan\left(\frac{x+2}{3}\right) + C$.
  skills:
  - calc2-u-sub-integration

- id: q-usub-ht-4
  title: U-Sub with Exponential Base
  prompt: |-
    Evaluate the indefinite integral:
    $$\int 5^{x^2} \cdot x \, dx$$
  type: multipleChoice
  choices:
  - id: c1
    text: $\frac{5^{x^2}}{2\ln(5)} + C$
  - id: c2
    text: $\frac{1}{2} 5^{x^2} + C$
  - id: c3
    text: $\frac{5^{x^2}}{\ln(5)} + C$
  - id: c4
    text: $x \cdot 5^{x^2} + C$
  answer:
    choiceId: c1
  explanation: |-
    Let $u = x^2$. Then $du = 2x \, dx$, so $\frac{1}{2}du = x \, dx$.
    The integral becomes $\frac{1}{2} \int 5^u \, du$.
    Recall that $\int a^u \, du = \frac{a^u}{\ln(a)} + C$.
    Result: $\frac{1}{2} \frac{5^u}{\ln(5)} + C = \frac{5^{x^2}}{2\ln(5)} + C$.
  skills:
  - calc2-u-sub-integration

- id: q-usub-ht-5
  title: Tricky Definite Integral
  prompt: |-
    Evaluate the definite integral using u-substitution:
    $$\int_{0}^{\pi/4} \tan(x)\sec^2(x) \, dx$$
  type: numericResponse
  answer:
    value: 0.5
    tolerance: 0.01
  explanation: |-
    Let $u = \tan(x)$. Then $du = \sec^2(x) \, dx$.
    Bounds: when $x=0$, $u=\tan(0)=0$. When $x=\pi/4$, $u=\tan(\pi/4)=1$.
    The integral becomes $\int_{0}^{1} u \, du = [\frac{1}{2}u^2]_{0}^{1}$.
    Evaluate: $\frac{1}{2}(1^2) - \frac{1}{2}(0^2) = \frac{1}{2} = 0.5$.
    (Note: You could also let $u = \sec(x)$ and $du = \sec(x)\tan(x) \, dx$, which leads to $\int_{1}^{\sqrt{2}} u \, du$, giving the same $0.5$ result).
  skills:
  - calc2-u-sub-integration
