  prompt: 'Evaluate $\int_0^{\pi/4}\frac{\sin x}{2+\cos^2x}\,dx$ by converting bounds; explain the sign change.'
  answer: { gradingMode: selfCheck, checkModel: '$\frac1{\sqrt2}(\arctan(1/\sqrt2)-\arctan(1/2))$.' }
  explanation: $u=\cos x$ reverses the bounds and produces $-du/(2+u^2)$.
  difficultyDimensions: [auxiliaryTechnique, representationTransfer, domainCondition]
  difficultyEvidence: Handles a negative differential, transformed bounds, and inverse-trig domain form.
  prerequisiteObjectiveIds: [calc1-inverse-trig]
