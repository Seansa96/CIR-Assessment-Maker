  prompt: 'Classify $\int_2^\infty\frac{x}{x^2+1}\,dx$ before evaluating it with u-substitution.'
  answer: { gradingMode: selfCheck, checkModel: 'Divergent; it becomes one-half times ln(x^2+1), which is unbounded.' }
  explanation: Use a limit after substitution rather than reporting an antiderivative alone.
