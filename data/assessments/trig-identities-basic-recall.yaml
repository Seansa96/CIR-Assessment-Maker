items:
- id: pythagorean-identity
  type: symbolic
  prompt: 'Write the primary Pythagorean Identity.

    '
  answer:
    expectedLatex: '\sin^2(x)+\cos^2(x)=1

      '
    aliases:
    - sin^2(x)+cos^2(x)=1
  explanation: 'This is the unit-circle identity that says the squared\rhorizontal
    component plus the squared vertical component equals the radius squared. On the
    unit circle, the radius is 1, so the sum is 1.

    '
  tags:
  - pythagorean-identity
  - trig
- id: quotient-identity-tangent
  type: typed
  prompt: 'State the quotient identity for tangent.

    '
  answer:
    expected: tan(x) = sin(x) / cos(x)
    aliases:
    - tangent equals sine over cosine
    - tan x = sin x / cos x
  explanation: 'Tangent compares the sine component to the cosine component. This
    identity is often the quickest way to rewrite tangent-heavy expressions in terms
    of sine and cosine.

    '
  tags:
  - quotient-identities
  - trig
- id: reciprocal-identity-secant
  type: flashcard
  prompt: 'What is secant in terms of cosine?

    '
  answer:
    expected: sec(x) = 1 / cos(x)
  explanation: 'Secant is the reciprocal of cosine. This is useful when simplifying
    expressions containing secant powers or when converting everything to sine and
    cosine.

    '
  tags:
  - reciprocal-identities
  - trig
- id: pythagorean-cloze-cosine
  type: cloze
  prompt: 'Complete:


    sin^2(x) + ____ = 1

    '
  answer:
    expected: cos^2(x)
  explanation: 'The missing term is cos^2(x), giving the primary Pythagorean identity.

    '
  tags:
  - pythagorean-identity
  - trig
