questions:
- id: q001
  type: freeResponse
  skills:
  - parametric-derivatives
  - olympiad-problem-solving
  prompt: For $x=t^2+1$, $y=t^3-5t$, find $dy/dx$ at $t=1$.
  answer:
    gradingMode: selfCheck
    expected: $\frac{-2}2$.
    keyPoints:
    - 'Matches the reference result: $\frac{-2}2$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: $dy/dx=(dy/dt)/(dx/dt)=(3t^2-5)/(2t)$, and substitution at $t=1$ gives $(3-5)/2$.
