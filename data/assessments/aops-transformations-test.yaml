questions:
- id: q001
  type: multipleChoice
  prompt: 'A point $P(-2, 5)$ is first reflected across the $y$-axis, and then translated 3 units down. What are the final coordinates of the point?'
  difficultyDimensions:
  - Step 1: Reflect across y-axis $(x, y) \to (-x, y)$. $P(-2, 5) \to (2, 5)$.
  - Step 2: Translate 3 units down $(x, y) \to (x, y-3)$. $(2, 5) \to (2, 2)$.
  - Evaluate final point: $(2, 2)$.
  choices:
  - id: a
    text: '$(-2, 2)$'
    issueSignals:
    - reflection-omission
  - id: b
    text: '$(2, 2)$'
  - id: c
    text: '$(2, 8)$'
    issueSignals:
    - translation-direction-error
  - id: d
    text: '$(-5, 5)$'
    issueSignals:
    - translation-axis-error
  answer:
    choiceId: b
  explanation: |
    Solution:
    This is a composite transformation. We must perform the steps in exact order.
    Step 1: Reflect across the $y$-axis. The rule is $(x, y) \to (-x, y)$.
    $(-2, 5) \to (2, 5)$.
    Step 2: Translate 3 units down. This affects only the $y$-coordinate.
    $(2, 5) \to (2, 5 - 3) = (2, 2)$.
    The final coordinates are $(2, 2)$.

    Why it works:
    Composite transformations are like functions in algebra; the output of the first transformation becomes the input for the second transformation.

    Why the other choices fail:
    - $(-2, 2)$ translates the original point down but forgets to reflect it first.
    - $(2, 8)$ reflects the point correctly but translates it UP instead of down.
    - $(-5, 5)$ translates the point left instead of down.

- id: q002
  type: multipleChoice
  prompt: 'What is the smallest angle of rotational symmetry for a regular octagon (8-sided polygon)?'
  difficultyDimensions:
  - Recall that a regular polygon with $n$ sides has $n$ lines of symmetry and $n$-fold rotational symmetry.
  - Calculate smallest angle: $360^\circ / n$.
  - Substitute $n = 8$: $360 / 8 = 45^\circ$.
  choices:
  - id: a
    text: '$60^\circ$'
    issueSignals:
    - hexagon-confusion
  - id: b
    text: '$45^\circ$'
  - id: c
    text: '$90^\circ$'
    issueSignals:
    - square-confusion
  - id: d
    text: '$30^\circ$'
    issueSignals:
    - dodecagon-confusion
  answer:
    choiceId: b
  explanation: |
    Solution:
    A regular polygon has a center of rotation. A full circle is $360^\circ$.
    For a regular polygon with $n$ sides, the smallest angle of rotational symmetry is found by dividing $360^\circ$ by $n$.
    For an octagon, $n = 8$.
    $360^\circ / 8 = 45^\circ$.
    Rotating the octagon $45^\circ$ will map it perfectly onto itself.

    Why it works:
    Imagine connecting the center of the octagon to all 8 vertices. This creates 8 identical slices of a pie. Each slice takes up exactly $360^\circ / 8 = 45^\circ$. Rotating by one slice shifts every vertex to the next position.

    Why the other choices fail:
    - $60^\circ$ is for a regular hexagon (6 sides).
    - $90^\circ$ is for a square (4 sides).
    - $30^\circ$ is for a regular dodecagon (12 sides).

- id: q003
  type: multipleChoice
  prompt: 'A triangle has vertices $A(1, 2)$, $B(3, 2)$, and $C(2, 5)$. The triangle is dilated with the center of dilation at the origin $(0,0)$ and a scale factor of $k = 3$. What are the coordinates of the new vertex $C''$?'
  difficultyDimensions:
  - Recall the rule for dilation centered at the origin: $(x, y) \to (kx, ky)$.
  - Identify the target vertex $C(2, 5)$.
  - Multiply by scale factor $k=3$: $(3 \cdot 2, 3 \cdot 5)$.
  - Evaluate: $(6, 15)$.
  choices:
  - id: a
    text: '$(5, 8)$'
    issueSignals:
    - addition-instead-of-multiplication
  - id: b
    text: '$(6, 15)$'
  - id: c
    text: '$(9, 6)$'
    issueSignals:
    - wrong-vertex-error
  - id: d
    text: '$(6, 5)$'
    issueSignals:
    - one-axis-dilation-error
  answer:
    choiceId: b
  explanation: |
    Solution:
    A dilation centered at the origin scales the distance of every point from the origin by the scale factor $k$.
    The rule is $(x, y) \to (kx, ky)$.
    We only need to find the new coordinates for vertex $C(2, 5)$.
    $C' = (3 \times 2, 3 \times 5) = (6, 15)$.

    Why it works:
    Dilation is the only standard transformation that changes the *size* of the shape (it is not a rigid motion). It stretches the shape proportionally away from the origin in all directions.

    Why the other choices fail:
    - $(5, 8)$ adds 3 to the coordinates instead of multiplying by 3 (acting like a translation).
    - $(9, 6)$ dilates vertex $B(3, 2)$ instead of vertex $C$.
    - $(6, 5)$ only multiplies the $x$-coordinate by 3 and leaves the $y$-coordinate unchanged.

- id: q004
  type: multipleChoice
  prompt: 'Point $Q(4, -1)$ is rotated $180^\circ$ about the origin. What are the coordinates of the new point $Q''$?'
  difficultyDimensions:
  - Recall the rule for a $180^\circ$ rotation: $(x, y) \to (-x, -y)$.
  - Apply rule: change the signs of both coordinates.
  - Evaluate: $(-4, 1)$.
  choices:
  - id: a
    text: '$(-4, -1)$'
    issueSignals:
    - reflection-y-axis-confusion
  - id: b
    text: '$(-1, -4)$'
    issueSignals:
    - 90-rotation-confusion
  - id: c
    text: '$(-4, 1)$'
  - id: d
    text: '$(1, 4)$'
    issueSignals:
    - 90-rotation-confusion
  answer:
    choiceId: c
  explanation: |
    Solution:
    A $180^\circ$ rotation (a half-turn) about the origin moves a point directly through the origin to the opposite side of the coordinate plane.
    The rule is $(x, y) \to (-x, -y)$.
    Applying this to $Q(4, -1)$, we flip the sign of both coordinates:
    $Q'(-4, 1)$.

    Why it works:
    Rotating $180^\circ$ is mathematically identical to reflecting the point across the origin. Both transformations use the exact same rule: flip all signs.

    Why the other choices fail:
    - $(-4, -1)$ is a reflection across the $y$-axis.
    - $(-1, -4)$ is a $90^\circ$ counter-clockwise rotation (or reflection across $y=-x$).
    - $(1, 4)$ is a $90^\circ$ clockwise rotation.

- id: q005
  type: multipleChoice
  prompt: 'What are the coordinates of point $R(3, 5)$ after it is reflected across the vertical line $x = 1$?'
  difficultyDimensions:
  - Determine horizontal distance from point to the line of reflection: $3 - 1 = 2$ units.
  - Point is to the right of the line, so reflection must move it to the left by the same distance.
  - New x-coordinate: $1 - 2 = -1$.
  - The y-coordinate is unchanged for a vertical reflection: 5.
  - Combine: $(-1, 5)$.
  choices:
  - id: a
    text: '$(-3, 5)$'
    issueSignals:
    - reflection-y-axis-confusion
  - id: b
    text: '$(3, -3)$'
    issueSignals:
    - axis-swap-reflection-error
  - id: c
    text: '$(-1, 5)$'
  - id: d
    text: '$(1, 5)$'
    issueSignals:
    - line-of-reflection-confusion
  answer:
    choiceId: c
  explanation: |
    Solution:
    Reflecting across the line $x = 1$ means the point will jump horizontally, keeping the same vertical $y$-height.
    1. Find the horizontal distance from the point's $x$-coordinate (3) to the line ($x=1$).
       Distance = $3 - 1 = 2$ units.
    2. The point is 2 units to the *right* of the line, so its reflection must be 2 units to the *left* of the line.
       New $x$-coordinate = $1 - 2 = -1$.
    3. The $y$-coordinate stays the same.
    The new point is $(-1, 5)$.

    Why it works:
    You can also use the general algebraic formula for reflecting a point $(x,y)$ across the vertical line $x = k$: $(2k - x, y)$.
    Here, $k=1$, so $2(1) - 3 = -1$.

    Why the other choices fail:
    - $(-3, 5)$ reflects the point across the $y$-axis ($x=0$) instead of $x=1$.
    - $(3, -3)$ reflects the point across a horizontal line ($y=1$).
    - $(1, 5)$ just projects the point directly onto the line of reflection.

- id: q006
  type: multipleChoice
  prompt: 'If you reflect a shape across the $x$-axis, and then immediately reflect it across the $y$-axis, the final result is exactly identical to which single transformation?'
  difficultyDimensions:
  - Follow the rules: $(x,y) \to (x, -y) \to (-x, -y)$.
  - Identify what single transformation has the rule $(-x, -y)$.
  - Result: $180^\circ$ rotation about the origin.
  choices:
  - id: a
    text: 'A $90^\circ$ counter-clockwise rotation about the origin.'
    issueSignals:
    - 90-rotation-confusion
  - id: b
    text: 'A $180^\circ$ rotation about the origin.'
  - id: c
    text: 'A reflection across the line $y = x$.'
    issueSignals:
    - diagonal-reflection-confusion
  - id: d
    text: 'A translation 2 units left and 2 units down.'
    issueSignals:
    - translation-confusion
  answer:
    choiceId: b
  explanation: |
    Solution:
    Let's trace a general point $(x, y)$ through the two transformations.
    1. Reflection across the $x$-axis: $(x, y) \to (x, -y)$.
    2. Reflection across the $y$-axis: $(x, -y) \to (-x, -y)$.
    The final mapping is $(x, y) \to (-x, -y)$.
    This rule (flipping both signs) is exactly the rule for a $180^\circ$ rotation about the origin.

    Why it works:
    This is a fundamental theorem of transformations: reflecting a shape across two intersecting lines is identical to rotating the shape around their point of intersection. The angle of rotation is twice the angle between the two lines. The $x$-axis and $y$-axis intersect at $90^\circ$, so the rotation is $2 \times 90^\circ = 180^\circ$.

    Why the other choices fail:
    - A $90^\circ$ rotation maps $(x,y) \to (-y, x)$.
    - A reflection across $y = x$ maps $(x,y) \to (y, x)$.
    - A translation maps $(x,y) \to (x+a, y+b)$, which cannot emulate a reflection or rotation.
