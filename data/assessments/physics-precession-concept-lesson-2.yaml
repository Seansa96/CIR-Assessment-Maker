lesson:
  introduction: We now apply Precession to complex, multi-body physical systems.
  sections:
  - id: sec-1
    title: Complex Systems
    content: When applying Precession to systems with multiple interconnected moving
      parts, conservation laws become our most powerful tools. If net external torque
      is zero, angular momentum is conserved.
    media: []
    check:
      id: chk-physics-precession-3
      type: multipleChoice
      prompt: When can you assume angular momentum is conserved?
      choices:
      - id: a
        text: Always.
      - id: b
        text: Only when the object is isolated from gravity.
      - id: c
        text: When the net external torque is zero.
      answer:
        choiceId: c
      explanation: $\tau_{net} = dL/dt$. If $\tau_{net} = 0$, then $dL/dt = 0$, meaning
        $L$ is constant.
  - id: sec-2
    title: Problem Solving Strategy
    content: '1. Identify the system and the axis of rotation.

      2. Draw a free-body diagram.

      3. Determine all torques and forces.

      4. Apply Newton''s Second Law for rotation and translation simultaneously.'
    media: []
    check:
      id: chk-physics-precession-4
      type: multipleChoice
      prompt: What is the first step in solving a complex rotational dynamics problem?
      choices:
      - id: a
        text: Pick an arbitrary equation.
      - id: b
        text: Identify the system and the axis of rotation.
      - id: c
        text: Plug in all known numbers immediately.
      answer:
        choiceId: b
      explanation: A clear understanding of the system boundary and the pivot axis
        is required before any equations can be written.
  - { id: p2-3, title: Steady precession, content: 'Steady precession has a spin axis moving around vertically at nearly constant rate.', check: { id: p2c3, type: multipleChoice, prompt: 'In steady precession, the spin-axis direction:', choices: [{ id: a, text: 'changes continuously' }, { id: b, text: 'is fixed in space' }], answer: { choiceId: a }, explanation: 'Solution: It changes continuously.\n\nWhy it works: The axis traces a cone.\n\nWhy the other choices fail: A fixed direction means no precession.' } }
  - { id: p2-4, title: Spin dependence, content: 'A faster-spinning gyroscope has larger angular momentum and precesses more slowly under fixed torque.', check: { id: p2c4, type: multipleChoice, prompt: 'Doubling spin speed at fixed torque makes precession rate:', choices: [{ id: a, text: 'smaller' }, { id: b, text: 'larger' }], answer: { choiceId: a }, explanation: 'Solution: It becomes smaller.\n\nWhy it works: $\Omega=\tau/L$ and $L$ rises with spin.\n\nWhy the other choices fail: Torque is unchanged.' } }
  - { id: p2-5, title: Lever arm, content: 'Gravity torque magnitude is approximately $mgr$ for a horizontal lever arm.', check: { id: p2c5, type: multipleChoice, prompt: 'Increasing pivot-to-center-of-mass distance makes gravity torque:', choices: [{ id: a, text: 'larger' }, { id: b, text: 'smaller' }], answer: { choiceId: a }, explanation: 'Solution: It becomes larger.\n\nWhy it works: Torque is force times lever arm.\n\nWhy the other choices fail: A longer lever arm increases moment.' } }
  - { id: p2-6, title: Modeling assumptions, content: 'Simple precession models neglect friction and assume an approximately fixed tilt angle.', check: { id: p2c6, type: multipleChoice, prompt: 'Friction in a real gyroscope tends to:', choices: [{ id: a, text: 'make ideal predictions less exact' }, { id: b, text: 'guarantee perfect steady precession' }], answer: { choiceId: a }, explanation: 'Solution: It makes ideal predictions less exact.\n\nWhy it works: Friction alters angular momentum and energy.\n\nWhy the other choices fail: Ideal steady precession neglects dissipative effects.' } }
  - { id: p2-7, title: Strategy check, content: 'For a precession problem, identify pivot, torque, angular momentum direction, and requested rate.', check: { id: p2c7, type: multipleChoice, prompt: 'Before using $\Omega=\tau/L$, identify:', choices: [{ id: a, text: 'torque and angular momentum' }, { id: b, text: 'only mass' }], answer: { choiceId: a }, explanation: 'Solution: Identify torque and angular momentum.\n\nWhy it works: Both determine precession rate.\n\nWhy the other choices fail: Mass alone cannot specify either quantity.' } }
