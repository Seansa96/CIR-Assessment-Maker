glossary:
  introduction: Use these terms to translate between a geometric arrow and its signed Cartesian component representation.
  sections:
  - id: vector-terms
    title: Vector language
    required: true
    content: Components and unit vectors make a vector calculation explicit while magnitude and direction describe the resulting vector geometrically.
    entries:
    - id: vector
      term: Vector
      definition: A quantity with magnitude and direction.
      notation: $\vec A$
      examples:
      - Displacement is a vector.
      aliases: []
      media: []
      tags:
      - fundamentals
      drills:
      - id: vector-drill
        type: cloze
        prompt: A quantity with magnitude and direction is a ____.
        answer:
          expected: vector
          expectedLatex: ''
          aliases: []
          media: []
          choiceId: 
        explanation: 'Solution: The answer is vector.\n\nWhy it works: Direction distinguishes vectors from scalars.'
        tags:
        - fundamentals
        skills: []
        choices: []
    - id: component
      term: Component
      definition: The signed projection of a vector on a selected coordinate axis.
      notation: $A_x,A_y$
      examples:
      - The x component of a westward vector is negative when east is positive.
      aliases: []
      media: []
      tags:
      - components
      drills:
      - id: component-drill
        type: cloze
        prompt: A vector's signed projection on the x axis is its x ____.
        answer:
          expected: component
          expectedLatex: ''
          aliases: []
          media: []
          choiceId: 
        explanation: 'Solution: The answer is component.\n\nWhy it works: Components encode a vector along the chosen axes.'
        tags:
        - components
        skills: []
        choices: []
    - id: resultant
      term: Resultant
      definition: The single vector equivalent to the vector sum of two or more vectors.
      notation: $\vec R=\sum\vec A$
      examples:
      - The resultant displacement is the sum of two legs of a trip.
      aliases:
      - net vector
      media: []
      tags:
      - addition
      drills:
      - id: resultant-drill
        type: cloze
        prompt: The single vector equivalent to a vector sum is the ____.
        answer:
          expected: resultant
          expectedLatex: ''
          aliases:
          - net vector
          media: []
          choiceId: 
        explanation: 'Solution: The answer is resultant.\n\nWhy it works: It represents the combined effect of the component vectors.'
        tags:
        - addition
        skills: []
        choices: []
    - id: unit-vector
      term: Unit vector
      definition: A vector of magnitude one used to specify direction.
      notation: $\hat i,\hat j$
      examples:
      - $\hat i$ points in the positive x direction.
      aliases: []
      media: []
      tags:
      - components
      drills:
      - id: unit-drill
        type: cloze
        prompt: A unit vector has magnitude ____.
        answer:
          expected: 1
          expectedLatex: 1
          aliases:
          - one
          media: []
          choiceId: 
        explanation: 'Solution: Its magnitude is 1.\n\nWhy it works: Unit vectors normalize length while retaining direction.'
        tags:
        - components
        skills: []
        choices: []
