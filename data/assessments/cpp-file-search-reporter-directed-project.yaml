directedProject:
  summary: Search a file line by line and produce stable, one-based match reports.
  estimatedTimeMinutes: 45
  outcomes:
  - Implement the line-oriented-substring-search family from a precise contract.
  - Explain the invariant and complexity of the implementation.
  - Adapt the base solution to changed requirements without breaking edge cases.
  environment:
    name: Local C++20 console project
    platform:
    - windows
    - linux
    - macos
    toolVersion: C++20
    requiredAccounts: []
    prerequisites:
    - Functions
    - loops
    - standard library containers
    installLinks: []
  resources: []
  phases:
  - id: phase-1-contract-and-approach
    title: Understand the contract and approach
    required: true
    goal: Translate the problem into an invariant before coding.
    steps:
    - id: step-1-problem-contract
      title: Read the canonical problem
      instruction: |
        Source family: `cpp-fsf-file-011`

        Implement `std::optional<std::vector<std::size_t>>
        containing_line_numbers(const std::filesystem::path& path,
        std::string_view needle)`. Return the one-based number of every line
        containing the case-sensitive substring `needle`, once per matching line.
        Reject an empty needle with `nullopt`, and return `nullopt` on I/O failure.
        A successful search with no matches returns an empty vector.
      expectedObservation: Requires exact substring semantics and correct one-based numbering.
      checklist:
      - id: contract-input-output
        text: I can state the exact input, output, and edge-case policy.
      - id: contract-complexity
        text: I identified which operations determine the time and space cost.
      resources: []
    - id: step-2-approach
      title: Plan the implementation
      instruction: |
        Use this approach before opening the sample solution:

        1. Reject an empty search term before opening the file.
        2. Increment the line number only after `getline` succeeds.
        3. Use one substring decision per line when output requires line numbers rather than occurrence counts.
        4. Return no matches separately from an I/O failure.

        Write a short trace for one nontrivial input.
      expectedObservation: Reject the empty search, scan successful lines with a one-based counter, record
        lines containing the substring, and distinguish no matches from I/O failure.
      checklist:
      - id: approach-invariant
        text: My trace preserves the stated invariant at every step.
      resources: []
  - id: phase-2-reference-and-build
    title: Study the example and build your version
    required: true
    goal: Connect the approach to complete, compilable C++.
    steps:
    - id: step-3-example-solution
      title: Trace the example solution
      instruction: |
        The line number increments only after `getline` succeeds, aligning the
        first extracted line with number one. One `find` decision per line
        naturally records the line once regardless of its occurrence count.

        ```cpp
        #include <filesystem>
        #include <fstream>
        #include <optional>
        #include <string>
        #include <string_view>
        #include <vector>

        std::optional<std::vector<std::size_t>>
        containing_line_numbers(const std::filesystem::path& path,
                                std::string_view needle) {
            if (needle.empty()) return std::nullopt;
            std::ifstream input(path);
            if (!input) return std::nullopt;
            std::vector<std::size_t> matches;
            std::size_t number = 0;
            std::string line;
            while (std::getline(input, line)) {
                ++number;
                if (line.find(needle) != std::string::npos) {
                    matches.push_back(number);
                }
            }
            if (input.bad()) return std::nullopt;
            return matches;
        }
        ```

        Trace this solution against every representative case before writing your own version. The sample is a reference, not starter code.
      expectedObservation: Reject the empty search, scan successful lines with a one-based counter, record
        lines containing the substring, and distinguish no matches from I/O failure.
      checklist:
      - id: solution-explained
        text: I can explain every branch, loop, and edge-case decision.
      - id: trap-avoided
        text: 'I can explain why this trap is wrong: Returning zero-based indices even though file-search
          tools conventionally display line numbers beginning at one.'
      resources: []
    - id: step-4-build
      title: Implement independently
      instruction: |
        Create `main.cpp` and implement the canonical contract without copying the reference. Add the representative cases from the bank plus at least three edge cases.
      files:
      - path: main.cpp
        purpose: Learner implementation and tests
        suggestedContent: |
          // Implement the required function here.
          // Keep main() small and use it only for your own test cases.

          int main() {
              return 0;
          }
        readOnly: false
      checklist:
      - id: build-compiles
        text: The program compiles with C++20 warnings enabled.
      - id: build-tests
        text: Representative and edge cases pass.
      troubleshooting:
      - problem: Output differs only at an edge case.
        suggestion: Returning zero-based indices even though file-search tools conventionally display
          line numbers beginning at one.
      resources: []
  - id: phase-3-variants
    title: Implement changed-condition variants
    required: true
    goal: Generalize the family instead of memorizing one solution.
    steps:
    - id: step-5-variants
      title: Complete the family variants
      instruction: |
        Extend the program with these variants:

        1. Return both line number and complete line text for each match.
        2. Add a whole-word mode with explicit ASCII word boundaries.
        3. Add a case-insensitive mode that does not mutate the original displayed line.

        Keep each behavior in a separately testable function.
      checklist:
      - id: variants-distinct
        text: Each variant changes behavior or constraints, not only sample data.
      - id: variants-regression
        text: The original canonical tests still pass.
      notesPrompt: Which part of the original invariant survived every variant, and which part had to
        change?
      resources: []
