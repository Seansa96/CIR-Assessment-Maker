glossary:
  introduction: |
    Study the common polar-curve forms before starting recall. The key habit is to connect each equation family to its graph structure: axis of symmetry, maximum radius, pole crossings, petal count, and whether the radius can become negative.
  sections:
    - id: polar-coordinate-basics
      title: Polar Coordinate Basics
      required: true
      content: |
        Polar curves describe points by distance from the pole and angle from the polar axis. The same physical point can often be represented in more than one polar way, especially when $r=0$ or when $r$ is negative.
      entries:
        - id: pole
          term: Pole
          definition: |
            The origin in polar coordinates. It is the point reached whenever $r=0$, no matter what angle is used.
          notation: '$r=0$'
          examples:
            - The polar coordinates $(0,0)$ and $(0,\pi)$ both represent the pole.
          aliases: [origin]
          tags: [pole, polar-coordinates]
          drills:
            - id: pole-flashcard
              type: flashcard
              prompt: What is the pole in polar coordinates?
              answer:
                expected: The pole is the origin, reached whenever $r=0$.
              explanation: The angle does not matter when the radius is zero.
              tags: [pole, polar-coordinates]

        - id: polar-axis
          term: Polar Axis
          definition: |
            The reference ray for measuring polar angles, usually the positive $x$-axis.
          notation: '$\theta=0$'
          examples:
            - A graph symmetric about the polar axis is symmetric about the horizontal axis.
          aliases: [positive x-axis]
          tags: [polar-axis, polar-coordinates]
          drills:
            - id: polar-axis-cloze
              type: cloze
              prompt: 'The polar axis usually corresponds to the positive ____-axis.'
              answer:
                expected: x
                aliases: [x-axis]
              explanation: Angles are measured from the positive $x$-axis unless another convention is specified.
              tags: [polar-axis, polar-coordinates]

        - id: negative-radius
          term: Negative Radius
          definition: |
            A negative value of $r$ places the point in the direction opposite the angle $\theta$.
          notation: '$(-r,\theta)=(r,\theta+\pi)$'
          examples:
            - The point $(-2,\pi/6)$ is plotted two units in the direction $7\pi/6$.
          aliases: [negative r]
          tags: [negative-radius, polar-coordinates]
          drills:
            - id: negative-radius-recognition
              type: recognition
              prompt: What does a negative radius do in polar coordinates?
              choices:
                - id: a
                  text: It makes the point invalid.
                - id: b
                  text: It plots the point in the opposite direction from the angle.
                - id: c
                  text: It always creates a circle.
                - id: d
                  text: It changes $\theta$ into zero.
              answer:
                choiceId: b
                expected: It plots the point in the opposite direction from the angle.
              explanation: Negative radius values are a major reason inner loops appear in polar graphs.
              tags: [negative-radius, polar-coordinates]

    - id: limacon-forms
      title: Limacons and Cardioids
      required: true
      content: |
        Limacons have the forms

        $$
        r=a\pm b\cos\theta,\qquad r=a\pm b\sin\theta.
        $$

        Their shape depends on the ratio $\frac{a}{b}$:

        - $\frac{a}{b}<1$: inner loop
        - $\frac{a}{b}=1$: cardioid
        - $1<\frac{a}{b}<2$: dimpled limacon
        - $\frac{a}{b}\ge2$: convex limacon
      entries:
        - id: limacon
          term: Limacon
          definition: |
            A polar curve of the form $r=a\pm b\cos\theta$ or $r=a\pm b\sin\theta$. Its shape is controlled by the ratio $\frac{a}{b}$.
          notation: '$r=a\pm b\cos\theta,\quad r=a\pm b\sin\theta$'
          examples:
            - '$r=3+2\cos\theta$ is a dimpled limacon because $1<\frac{3}{2}<2$.'
          aliases: [limacon family]
          media:
            - type: image
              src: /assessments/calc2-parametric-polar/polar-limacons.svg
              alt: Several limacon shapes shown in polar form.
          tags: [limacon, polar-graph-recognition]
          drills:
            - id: limacon-form-symbolic
              type: symbolic
              prompt: Write the general cosine form of a limacon.
              answer:
                expectedLatex: 'r=a\pm b\cos\theta'
                aliases:
                  - 'r = a +/- b cos theta'
              explanation: Limacons use a constant term plus or minus a sine or cosine term.
              tags: [limacon, polar-equation-forms]

        - id: inner-loop-limacon
          term: Inner-Loop Limacon
          definition: |
            A limacon with $\frac{a}{b}<1$. The radius becomes negative for some angles, creating an inner loop.
          notation: '$\frac{a}{b}<1$'
          examples:
            - '$r=1+2\sin\theta$ has an inner loop because $\frac{a}{b}=\frac12<1$.'
          aliases: [limacon with inner loop]
          media:
            - type: image
              src: /assessments/calc2-parametric-polar/polar-limacon-inner-loop.svg
              alt: Inner-loop limacon with pole crossings.
          tags: [inner-loop-limacon, limacon]
          drills:
            - id: inner-loop-limacon-cloze
              type: cloze
              prompt: 'A limacon has an inner loop when $\frac{a}{b}$ is ____ than $1$.'
              answer:
                expected: less
                aliases: [less than, <]
              explanation: If $a<b$, the sinusoidal part can overpower the constant part and make $r$ negative.
              tags: [inner-loop-limacon, limacon-ratio]

        - id: cardioid
          term: Cardioid
          definition: |
            A special limacon with $\frac{a}{b}=1$. It has a single cusp at the pole.
          notation: '$a=b$'
          examples:
            - '$r=2+2\cos\theta$ is a cardioid.'
          aliases: [heart-shaped curve]
          media:
            - type: image
              src: /assessments/calc2-parametric-polar/polar-cardioids.svg
              alt: Cardioid examples in polar coordinates.
          tags: [cardioid, limacon]
          drills:
            - id: cardioid-ratio-recognition
              type: recognition
              prompt: Which condition identifies a cardioid within the limacon family?
              choices:
                - id: a
                  text: '$\frac{a}{b}<1$'
                - id: b
                  text: '$\frac{a}{b}=1$'
                - id: c
                  text: '$1<\frac{a}{b}<2$'
                - id: d
                  text: '$\frac{a}{b}\ge2$'
              answer:
                choiceId: b
                expected: '$\frac{a}{b}=1$'
              explanation: Equal constant and trig coefficients make the limacon touch the pole exactly once.
              tags: [cardioid, limacon-ratio]

        - id: dimpled-limacon
          term: Dimpled Limacon
          definition: |
            A limacon with $1<\frac{a}{b}<2$. It has an indentation but no inner loop.
          notation: '$1<\frac{a}{b}<2$'
          examples:
            - '$r=3+2\cos\theta$ is dimpled because $\frac{3}{2}$ lies between $1$ and $2$.'
          aliases: [dimpled limaçon]
          tags: [dimpled-limacon, limacon]
          drills:
            - id: dimpled-limacon-typed
              type: typed
              prompt: What limacon type occurs when $1<\frac{a}{b}<2$?
              answer:
                expected: dimpled limacon
                aliases: [dimpled limaçon, dimpled]
              explanation: The graph is indented but does not cross through the pole to form an inner loop.
              tags: [dimpled-limacon, limacon-ratio]

        - id: convex-limacon
          term: Convex Limacon
          definition: |
            A limacon with $\frac{a}{b}\ge2$. It has no inner loop and no visible dimple.
          notation: '$\frac{a}{b}\ge2$'
          examples:
            - '$r=4+\cos\theta$ is convex because $\frac{a}{b}=4$.'
          aliases: [convex limaçon]
          tags: [convex-limacon, limacon]
          drills:
            - id: convex-limacon-cloze
              type: cloze
              prompt: 'A limacon is convex when $\frac{a}{b}$ is at least ____.'
              answer:
                expected: 2
                aliases: [two]
              explanation: At ratios of $2$ or greater, the curve no longer has a visible inward dent.
              tags: [convex-limacon, limacon-ratio]

        - id: sine-versus-cosine-limacon
          term: Sine versus Cosine Limacon Orientation
          definition: |
            Cosine limacons are oriented horizontally; sine limacons are oriented vertically. The sign determines the positive or negative direction along that axis.
          notation: '$\cos\theta$ horizontal, $\sin\theta$ vertical'
          examples:
            - '$r=2+2\cos\theta$ opens right.'
            - '$r=2-2\sin\theta$ opens downward.'
          aliases: [limacon orientation]
          tags: [limacon-orientation, polar-symmetry]
          drills:
            - id: limacon-orientation-recognition
              type: recognition
              prompt: Which equation is naturally oriented vertically?
              choices:
                - id: a
                  text: '$r=3+2\sin\theta$'
                - id: b
                  text: '$r=3+2\cos\theta$'
                - id: c
                  text: '$r=4$'
                - id: d
                  text: '$r=4\cos(3\theta)$'
              answer:
                choiceId: a
                expected: '$r=3+2\sin\theta$'
              explanation: Sine terms emphasize the vertical axis; cosine terms emphasize the horizontal polar axis.
              tags: [limacon-orientation, polar-symmetry]

    - id: other-polar-families
      title: Other Common Polar Curve Families
      required: true
      content: |
        Beyond limacons, many polar graphs can be recognized quickly by their equation form. Learn the family first, then refine the exact constants from graph features.
      entries:
        - id: polar-circle
          term: Polar Circle
          definition: |
            A circle can appear as $r=c$, $r=2a\cos\theta$, or $r=2a\sin\theta$ depending on its center.
          notation: '$r=c,\quad r=2a\cos\theta,\quad r=2a\sin\theta$'
          examples:
            - '$r=4\cos\theta$ is a circle centered on the positive $x$-axis.'
          aliases: [circle]
          media:
            - type: image
              src: /assessments/calc2-parametric-polar/polar-circles.svg
              alt: Polar circle examples.
          tags: [polar-circle, polar-graph-recognition]
          drills:
            - id: polar-circle-recognition
              type: recognition
              prompt: What kind of curve is $r=4$?
              choices:
                - id: a
                  text: Circle centered at the pole
                - id: b
                  text: Rose curve
                - id: c
                  text: Dimpled limacon
                - id: d
                  text: Spiral
              answer:
                choiceId: a
                expected: Circle centered at the pole
              explanation: Constant radius means every point is the same distance from the pole.
              tags: [polar-circle, polar-graph-recognition]

        - id: rose-curve
          term: Rose Curve
          definition: |
            A petal-shaped polar curve of the form $r=a\sin(n\theta)$ or $r=a\cos(n\theta)$.
          notation: '$r=a\sin(n\theta),\quad r=a\cos(n\theta)$'
          examples:
            - '$r=4\sin(3\theta)$ has three petals.'
          aliases: [polar rose]
          media:
            - type: image
              src: /assessments/calc2-parametric-polar/polar-roses.svg
              alt: Rose curve examples with different petal counts.
          tags: [rose-curve, petal-count]
          drills:
            - id: rose-curve-form-symbolic
              type: symbolic
              prompt: Write the sine form of a rose curve.
              answer:
                expectedLatex: 'r=a\sin(n\theta)'
                aliases:
                  - 'r = a sin(n theta)'
              explanation: Rose curves use sine or cosine of a multiple angle.
              tags: [rose-curve, polar-equation-forms]

        - id: rose-petal-count
          term: Rose Petal Count
          definition: |
            For $r=a\sin(n\theta)$ or $r=a\cos(n\theta)$, odd $n$ gives $n$ petals, while even $n$ gives $2n$ petals.
          notation: '$n$ odd $\Rightarrow n$ petals; $n$ even $\Rightarrow 2n$ petals'
          examples:
            - '$r=6\sin(6\theta)$ has $12$ petals.'
          aliases: [petal rule]
          tags: [rose-curve, petal-count]
          drills:
            - id: rose-petal-count-cloze
              type: cloze
              prompt: 'If $n$ is even in $r=a\sin(n\theta)$, the rose has ____ petals.'
              answer:
                expected: 2n
                aliases: [twice n, double n]
              explanation: Even $n$ rose curves have twice as many petals as the multiplier.
              tags: [rose-curve, petal-count]

        - id: archimedean-spiral
          term: Archimedean Spiral
          definition: |
            A polar curve where radius changes linearly with angle, commonly $r=a+b\theta$.
          notation: '$r=a+b\theta$'
          examples:
            - '$r=\theta$ moves outward at a steady radial rate as $\theta$ increases.'
          aliases: [spiral]
          tags: [spiral, polar-graph-recognition]
          drills:
            - id: archimedean-spiral-typed
              type: typed
              prompt: What polar family is commonly represented by $r=a+b\theta$?
              answer:
                expected: Archimedean spiral
                aliases: [spiral]
              explanation: The radius increases or decreases linearly as the angle changes.
              tags: [spiral, polar-graph-recognition]

    - id: polar-analysis-features
      title: Features Used to Analyze Polar Graphs
      required: true
      content: |
        When identifying or constructing polar equations from graphs, focus on the family, symmetry, extrema, pole crossings, and trace interval.
      entries:
        - id: pole-crossing
          term: Pole Crossing
          definition: |
            A value of $\theta$ where $r=0$. Pole crossings often mark cusps, intersections, or the start and end of an inner loop.
          notation: '$r(\theta)=0$'
          examples:
            - For $r=1+2\sin\theta$, pole crossings satisfy $\sin\theta=-\frac12$.
          aliases: [zero radius]
          tags: [pole-crossing, polar-analysis]
          drills:
            - id: pole-crossing-cloze
              type: cloze
              prompt: 'To find where a polar curve crosses the pole, set ____ equal to zero.'
              answer:
                expected: r
                aliases: [radius]
              explanation: The pole is reached exactly when the polar radius is zero.
              tags: [pole-crossing, polar-analysis]

        - id: maximum-radius
          term: Maximum Radius
          definition: |
            The largest value of $r$ on a polar curve, often used to determine a coefficient or petal length.
          notation: '$r_{\max}$'
          examples:
            - In $r=4\sin(3\theta)$, the maximum radius is $4$.
          aliases: [petal length]
          tags: [maximum-radius, polar-analysis]
          drills:
            - id: maximum-radius-recognition
              type: recognition
              prompt: In $r=5\cos(2\theta)$, what is the maximum radius?
              choices:
                - id: a
                  text: '$5$'
                - id: b
                  text: '$2$'
                - id: c
                  text: '$10$'
                - id: d
                  text: '$\frac{5}{2}$'
              answer:
                choiceId: a
                expected: '$5$'
              explanation: The coefficient $a$ is the largest possible radius for a basic rose curve.
              tags: [maximum-radius, polar-analysis]

        - id: full-trace-interval
          term: Full-Trace Interval
          definition: |
            An interval of $\theta$ values that traces the entire curve exactly once, or at least captures one full copy of the curve.
          notation: '$0\le\theta\le2\pi$'
          examples:
            - Many limacons are fully traced over $0\le\theta\le2\pi$.
          aliases: [trace interval]
          tags: [trace-interval, polar-analysis]
          drills:
            - id: full-trace-interval-flashcard
              type: flashcard
              prompt: Why does the trace interval matter for polar graphs?
              answer:
                expected: It determines whether you have traced the whole curve, part of it, or repeated it.
              explanation: Polar curves can retrace sections because trig functions are periodic and polar coordinates are not unique.
              tags: [trace-interval, polar-analysis]
