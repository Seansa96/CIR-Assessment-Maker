workedExamples:
- id: we-spring-work
  title: Calculating Spring Work
  problem: |
    Let's use the relationship $W_s = -\Delta U_s$ to find the work done by a spring as it stretches.
  steps:
  - id: step-1
    title: Step 1 — Change in Potential Energy
    instruction: |
      A spring with $k = 200\text{ N/m}$ is stretched from its equilibrium position ($x_i = 0$) out to $x_f = 0.30\text{ m}$.
    type: symbolicResponse
    prompt: |
      Calculate the change in potential energy $\Delta U_s = U_{s,f} - U_{s,i}$ (in Joules).
    answer:
      gradingMode: auto
      expectedLatex: 9.0
      equivalenceMode: expression
      tolerance: 0.1
    explanation: $\Delta U_s = \frac{1}{2}(200)(0.30)^2 - 0 = 100(0.09) = 9.0\text{ J}$.
  - id: step-2
    title: Step 2 — Work Done
    instruction: |
      The work done by any conservative force is the negative of the change in its associated potential energy: $W = -\Delta U$.
    type: symbolicResponse
    prompt: |
      What is the work done *by the spring* during this stretch (in Joules)?
    answer:
      gradingMode: auto
      expectedLatex: -9.0
      equivalenceMode: expression
      tolerance: 0.1
    explanation: Since $\Delta U_s = 9.0\text{ J}$, the work done by the spring is $W_s = -9.0\text{ J}$. This makes sense physically because the spring pulls *backwards* while the displacement is *forwards*, resulting in negative work.
