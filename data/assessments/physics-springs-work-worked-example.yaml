modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we-spring-stretch-work
    title: Work while stretching
    problem: 'A spring with $k=200$ N/m is stretched from $x_i=0$ to $x_f=0.30$ m. Find work done by the spring.'
    steps:
      - id: ssw-1
        title: Change in spring energy
        instruction: 'Calculate $\Delta U_s=\tfrac12k(x_f^2-x_i^2)$.'
        type: numericResponse
        prompt: 'What is $\Delta U_s$ in joules?'
        answer: { value: 9, tolerance: 0.01 }
        explanation: 'Solution: $\Delta U_s=\tfrac12(200)(0.30)^2=9.0$ J.\n\nWhy it works: Stretching increases the spring''s potential energy.'
      - id: ssw-2
        title: Relate work to energy
        instruction: 'The spring force is conservative, so $W_s=-\Delta U_s$.'
        type: numericResponse
        prompt: 'What work does the spring do, in joules?'
        answer: { value: -9, tolerance: 0.01 }
        explanation: 'Solution: $W_s=-9.0$ J.\n\nWhy it works: The spring force opposes the outward stretching displacement.'
  - id: we-spring-release-work
    title: Work while releasing
    problem: 'A spring with $k=100$ N/m relaxes from $x_i=0.40$ m to $x_f=0$. Find the work done by the spring.'
    steps:
      - id: srw-1
        title: Initial spring energy
        instruction: 'Find the energy before release.'
        type: numericResponse
        prompt: 'What is $U_{s,i}$ in joules?'
        answer: { value: 8, tolerance: 0.01 }
        explanation: 'Solution: $U_{s,i}=\tfrac12(100)(0.40)^2=8.0$ J.\n\nWhy it works: The spring is initially displaced from equilibrium.'
      - id: srw-2
        title: Find spring work
        instruction: 'Use $W_s=-(U_f-U_i)$.'
        type: numericResponse
        prompt: 'What work does the spring do during relaxation, in joules?'
        answer: { value: 8, tolerance: 0.01 }
        explanation: 'Solution: $W_s=-(0-8.0)=+8.0$ J.\n\nWhy it works: The spring releases stored energy while its force and displacement align.'
