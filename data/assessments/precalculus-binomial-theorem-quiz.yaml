schemaVersion: 1
id: precalculus-binomial-theorem-quiz
title: Binomial Theorem Practical Quiz
assessmentType: quiz
categoryId: precalculus
subcategoryId: precalc-binomial
subcategoryIds:
  - precalc-binomial
modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: symbolicResponse
    prompt: |
      Expand:

      $$
      (x+2)^4
      $$
    answer:
      expectedLatex: 'x^4+8x^3+24x^2+32x+16'
      equivalenceMode: expression
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      Use row $1,4,6,4,1$ with powers of $x$ descending and powers of $2$ ascending.

      Related topic: fourth-power binomial expansion.

  - id: q002
    type: symbolicResponse
    prompt: |
      Expand:

      $$
      (2x-1)^3
      $$
    answer:
      expectedLatex: '8x^3-12x^2+6x-1'
      equivalenceMode: expression
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      Treat the binomial as $(2x+(-1))^3$. The signs alternate because powers of $-1$ alternate.

      Related topic: signed binomial expansion.

  - id: q003
    type: symbolicResponse
    prompt: |
      Find the coefficient of $x^3$ in:

      $$
      (1+2x)^5
      $$
    answer:
      expectedLatex: '80'
      equivalenceMode: expression
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      The $x^3$ term uses $k=3$:

      $$
      \binom{5}{3}(1)^2(2x)^3=10\cdot8x^3.
      $$

      The coefficient is $80$.

      Related topic: coefficient extraction.

  - id: q004
    type: symbolicResponse
    prompt: |
      Find the $x^2$ term in:

      $$
      (3x+2)^4
      $$
    answer:
      expectedLatex: '216x^2'
      equivalenceMode: expression
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      Need $(3x)^{4-k}$ to have power $2$, so $k=2$:

      $$
      \binom{4}{2}(3x)^2(2)^2=6\cdot9x^2\cdot4=216x^2.
      $$

      Related topic: matching powers in a binomial term.

  - id: q005
    type: symbolicResponse
    prompt: |
      Expand:

      $$
      (x-3)^3
      $$
    answer:
      expectedLatex: 'x^3-9x^2+27x-27'
      equivalenceMode: expression
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      Use coefficients $1,3,3,1$ and include the sign in $-3$.

      Related topic: cube binomial expansion.

  - id: q006
    type: multipleChoice
    prompt: |
      What is the best method if a problem asks for only the coefficient of $x^7$ in a large binomial expansion?
    choices:
      - id: a
        text: 'Use the general term and solve for the needed power.'
      - id: b
        text: 'Expand every term by hand first.'
      - id: c
        text: 'Use polynomial long division.'
      - id: d
        text: 'Use partial fraction decomposition.'
    answer:
      choiceId: a
    explanation: |
      The practical skill is targeted coefficient extraction. The general term avoids unnecessary expansion.

      Related topic: binomial theorem practical use.

  - id: q007
    type: symbolicResponse
    prompt: |
      Find the constant term in:

      $$
      (2x+5)^3
      $$
    answer:
      expectedLatex: '125'
      equivalenceMode: expression
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      The constant term happens when the power of $2x$ is $0$, so use $5^3=125$.

      Related topic: constant term in binomial expansions.

  - id: q008
    type: symbolicResponse
    prompt: |
      Find the coefficient of $x^4$ in:

      $$
      (x-2)^6
      $$
    answer:
      expectedLatex: '60'
      equivalenceMode: expression
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      Need $x^{6-k}=x^4$, so $k=2$:

      $$
      \binom{6}{2}(-2)^2=15\cdot4=60.
      $$

      Related topic: binomial coefficient extraction with signs.


