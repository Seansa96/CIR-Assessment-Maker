- id: q001
  type: numericResponse
  skills:
  - physics-speed-of-sound
  prompt: During a cool morning at -4.5 C... A tuning fork emits a 590.0 Hz tone.
    What is the wavelength of the sound wave in meters?
  answer:
    value: 0.5564
    tolerance: 0.05
  explanation: lambda = v/f = 328.30 / 590.0 = 0.5564 m.
- id: q002
  type: numericResponse
  skills:
  - physics-speed-of-sound
  prompt: In a desert environment with an air temperature of 10.4 C... What is the
    approximate speed of sound in m/s?
  answer:
    value: 337.24
    tolerance: 0.05
  explanation: v = 331 + 0.6*T = 331 + 0.6*(10.4) = 337.24 m/s.
