questions:
- id: q001
  type: numericResponse
  prompt: Use $v=331+0.60T$ with $T$ in degrees C. What speed of sound in m/s is estimated at 20 degrees C?
  answer: { value: 343, tolerance: 0.1 }
  explanation: |
    Solution: $v=331+0.60(20)=343$ m/s.

    Why it works: This linear approximation models sound speed in air as increasing with temperature.
  difficultyDimensions: [modelOrDerivation, unitAnalysis]
- id: q002
  type: numericResponse
  prompt: A 686 Hz tone travels through air at 343 m/s. What wavelength in m does it have?
  answer: { value: 0.5, tolerance: 0.01 }
  explanation: |
    Solution: $\lambda=v/f=343/686=0.500$ m.

    Why it works: The wave relation $v=f\lambda$ links propagation speed, frequency, and wavelength.
  difficultyDimensions: [modelOrDerivation, unitAnalysis]
- id: q003
  type: numericResponse
  prompt: Thunder is heard 3.0 s after lightning is seen. Taking sound speed as 340 m/s and ignoring light-travel time, how far away in m is the storm?
  answer: { value: 1020, tolerance: 2 }
  explanation: |
    Solution: $d=vt=(340)(3.0)=1020$ m.

    Why it works: The observed delay is modeled as the sound's travel time because light arrives much faster over this distance.
  difficultyDimensions: [modelSelection, assumptionCheck]
- id: q004
  type: multipleChoice
  prompt: A sound source raises its pitch while remaining in the same air. Which quantity remains approximately unchanged?
  choices:
  - { id: a, text: Sound speed }
  - { id: b, text: Frequency }
  - { id: c, text: Wavelength }
  - { id: d, text: Number of wavefronts emitted per second }
  answer: { choiceId: a }
  explanation: |
    Solution: Sound speed.

    Why it works: In a fixed medium, wave speed is governed chiefly by medium properties, while higher frequency produces shorter wavelength.

    Why the other choices fail: Frequency and wavefront emission rate rise with pitch, and wavelength changes through $v=f\lambda$.
  difficultyDimensions: [modelComparison, causalReasoning]
