workedExamples:
- id: example-001
  title: Build the representation
  problem: 'Use $x=u+v$, $y=u-v$ to find $|\partial(x,y)/\partial(u,v)|$.'
  steps:
  - id: s001
    title: Build derivative matrix
    instruction: What is the matrix?
    type: multipleChoice
    prompt: What is the matrix?
    choices:
    - id: a
      text: '$\begin{pmatrix}1&1\\1&-1\end{pmatrix}$'
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: algebraic-simplification-error
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: algebraic-simplification-error
    answer:
      choiceId: a
    issueSignals:
    - id: algebraic-simplification-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $\begin{pmatrix}1&1\\1&-1\end{pmatrix}$

      Why it works: This uses the defining relationship for the topic. Review path: Calculus 2 → Integration Techniques.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
