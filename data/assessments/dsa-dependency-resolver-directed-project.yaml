schemaVersion: 1
id: dsa-dependency-resolver-directed-project
title: Dependency Resolver
assessmentType: directedProject
categoryId: dsa
subcategoryIds:
- dsa-graphs
modeDefault: practice
randomizeQuestions: false
directedProject:
  summary: Build a Python dependency graph and topologically order it. Detect cycles and report the smallest useful failure explanation.
  estimatedTimeMinutes: 45
  phases:
  - id: design
    title: Design the invariant
    steps:
    - id: design-workload
      title: State the workload
      instruction: Write the required operations, input bound, and failure behavior.
      checklist:
      - id: operations
        text: Lists dominant operations and constraints.
  - id: implement
    title: Implement and test
    steps:
    - id: implement-core
      title: Build the core operation
      instruction: Build a Python dependency graph and topologically order it. Detect cycles and report the smallest useful failure explanation.
      checklist:
      - id: boundaries
        text: Tests empty, one-item, and full or cyclic boundaries.
      - id: tradeoff
        text: Explains when a standard library or framework is preferable.
