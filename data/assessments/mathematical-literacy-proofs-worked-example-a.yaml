  "workedExamples": [
    {
      "id": "mathematical-literacy-proofs-worked-example-a-example",
      "title": "Annotate a short mathematical passage",
      "problem": "Read the short claim: If an integer n is even, then n squared is even. Annotate what is assumed, what is claimed, and what would justify the transition.",
      "steps": [
        {
          "id": "step-1",
          "title": "Mark the assumption",
          "type": "freeResponse",
          "prompt": "Identify the hypothesis in your own words.",
          "instruction": "Write the assumption before doing any algebra.",
          "difficultyDimensions": [
            "representationTransfer",
            "scopeTracking"
          ],
          "answer": {
            "gradingMode": "selfCheck",
            "keyPoints": [
              "The hypothesis is that n is an even integer."
            ]
          },
          "explanation": "Solution: The assumption is that n is even.\nWhy it works: A conditional begins with its hypothesis; it is the information available to a reader of the proof."
        },
        {
          "id": "step-2",
          "title": "Name the bridge",
          "type": "freeResponse",
          "prompt": "What definition can turn the hypothesis into a usable expression?",
          "instruction": "Name a reason, not merely a new equation.",
          "difficultyDimensions": [
            "definitionUse",
            "argumentMapping"
          ],
          "answer": {
            "gradingMode": "selfCheck",
            "keyPoints": [
              "Use the definition of even: n equals two times an integer."
            ]
          },
          "explanation": "Solution: Use the definition of an even integer.\nWhy it works: Definitions license replacing a named property with its stated structural form."
        },
        {
          "id": "step-3",
          "title": "State the conclusion",
          "type": "freeResponse",
          "prompt": "Explain why the final claim follows.",
          "instruction": "Connect the final form to the conclusion.",
          "difficultyDimensions": [
            "argumentMapping",
            "conclusionCheck"
          ],
          "answer": {
            "gradingMode": "selfCheck",
            "keyPoints": [
              "The square is two times an integer, so it is even."
            ]
          },
          "explanation": "Solution: The square has the form two times an integer, so it is even.\nWhy it works: The conclusion follows by the same definition used to interpret the hypothesis."
        }
      ]
    }
  ]
