workedExamples:
- id: we-sound-waves
  title: Deriving and applying Sound Waves
  problem: Use the labeled model to derive and calculate the sound speed from $v=f\lambda$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the parameters of the sound wave. The maximum displacement is $s_{\text{max}}$, in a medium with density $\rho$ and wave speed $v$.
    prompt: 'Identify the parameters.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 's_{\text{max}}, \rho, v, \omega'
    explanation: >-
      The amplitude $s_{\text{max}}$, density $\rho$, speed $v$, and angular frequency $\omega$ are given.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the assumption about the sound wave type.
    prompt: 'What type of wave is this?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Longitudinal wave.'
    explanation: >-
      Sound in a fluid is assumed to be a longitudinal wave.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target: we want to calculate the maximum pressure variation (pressure amplitude).
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Pressure amplitude \Delta P_{\text{max}}'
    explanation: >-
      We are looking for $\Delta P_{\text{max}}$.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the relation between pressure amplitude and displacement amplitude.
    prompt: 'Write the governing equation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: '\Delta P_{\text{max}} = \rho v \omega s_{\text{max}}'
    explanation: >-
      $\Delta P_{\text{max}} = \rho v \omega s_{\text{max}}$
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the target variable (it is already isolated).
    prompt: 'Isolate the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: '\Delta P_{\text{max}} = \rho v \omega s_{\text{max}}'
    explanation: >-
      The equation is ready to use.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given $\rho = 1.2$ kg/m$^3$, $v = 343$ m/s, $\omega = 1000$ rad/s, and $s_{\text{max}} = 1.0 \times 10^{-6}$ m, calculate $\Delta P_{\text{max}}$.
    prompt: 'Calculate pressure amplitude.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      value: 330.0
      tolerance: 3.3000000000000003
    explanation: >-
      $\Delta P_{\text{max}} = (1.2)(343)(1000)(10^{-6}) = 411.6 \times 10^{-3} \approx 0.41$ Pa.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the resulting units.
    prompt: 'What are the units?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Pascals (Pa)'
    explanation: >-
      The calculation yields Pascals (Pa).
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated pressure amplitude.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      value: 330.0
      tolerance: 3.3000000000000003
    explanation: >-
      The pressure amplitude is $0.41$ Pa.
