workedExamples:
- id: we-sound-waves
  title: Deriving and applying Sound Waves
  problem: Use the labeled model to derive and calculate the sound speed from $v=f\lambda$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the parameters of the sound wave. The maximum displacement is $s_{\text{max}}$, in a medium with density $\rho$ and wave speed $v$.
    prompt: 'Identify the parameters.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints: ['$s_{\text{max}}$', '$\rho$', '$v$', '$\omega$']
    explanation: |
      Solution: Identify the amplitude $s_{\text{max}}$, density $\rho$, speed $v$, and angular frequency $\omega$.

      Why it works: These are the quantities used in the pressure-amplitude model.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the assumption about the sound wave type.
    prompt: 'What type of wave is this?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints: [Longitudinal wave]
    explanation: |
      Solution: Model the sound as a longitudinal wave.

      Why it works: In a fluid, sound propagates through alternating compressions and rarefactions along the direction of travel.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target: we want to calculate the maximum pressure variation (pressure amplitude).
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints: ['$\Delta P_{\text{max}}$']
    explanation: |
      Solution: The target is pressure amplitude $\Delta P_{\text{max}}$.

      Why it works: Naming the target selects the corresponding sound-wave relation.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the relation between pressure amplitude and displacement amplitude.
    prompt: 'Write the governing equation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints: ['$\Delta P_{\text{max}} = \rho v \omega s_{\text{max}}$']
    explanation: |
      Solution: Use $\Delta P_{\text{max}}=\rho v\omega s_{\text{max}}$.

      Why it works: This model relates a longitudinal wave's displacement amplitude to its pressure amplitude.
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the target variable (it is already isolated).
    prompt: 'Isolate the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints: ['$\Delta P_{\text{max}} = \rho v \omega s_{\text{max}}$']
    explanation: |
      Solution: The target is already isolated in $\Delta P_{\text{max}}=\rho v\omega s_{\text{max}}$.

      Why it works: No additional algebra is needed before substitution.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given $\rho = 1.2$ kg/m$^3$, $v = 343$ m/s, $\omega = 1000$ rad/s, and $s_{\text{max}} = 1.0 \times 10^{-6}$ m, calculate $\Delta P_{\text{max}}$.
    prompt: 'Calculate pressure amplitude.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      value: 0.41
      tolerance: 0.05
    explanation: |
      Solution: $\Delta P_{\text{max}}=(1.2)(343)(1000)(10^{-6})=0.4116$ Pa, or about $0.41$ Pa.

      Why it works: Substitution combines density, speed, angular frequency, and displacement amplitude in the governing relation.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the resulting units.
    prompt: 'What are the units?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints: [Pascals, Pa]
    explanation: |
      Solution: The result has units of pascals (Pa).

      Why it works: Pressure amplitude is a pressure quantity.
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated pressure amplitude.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    answer:
      value: 0.41
      tolerance: 0.05
    explanation: |
      Solution: The pressure amplitude is $0.41$ Pa.

      Why it works: The prior substitution evaluated the pressure-amplitude model with the stated wave parameters.
