questions:
  - id: implement-recursive-power
    type: code
    difficultyDimensions: ["Recursive state management", "Base case formulation"]
    subjectDifficultyTags: ["Algorithm-Implementation"]
    prerequisiteObjectiveIds: ["obj-dsa-recursion-01"]
    prompt: |
      **Recursive Exponentiation**

      As you've seen, multiplication can be modeled as repeated addition, and exponentiation can be modeled as repeated multiplication. 

      Consider the formulation for powers of 2:
      $2^0 = 1$
      $2^n = 2 \cdot 2^{n-1}$

      Implement a Python function `power_of_two(n)` that calculates $2^n$ using this recursive definition. Your function must be recursive and not use the `**` operator or the `pow()` function. Assume `n` is a non-negative integer.

      ```python
      def power_of_two(n):
          # Write your recursive code here
          pass
      ```
    answer:
      gradingMode: automatic
      codeLanguage: python
      testCases:
        - input: "power_of_two(0)"
          expectedOutput: "1"
        - input: "power_of_two(1)"
          expectedOutput: "2"
        - input: "power_of_two(5)"
          expectedOutput: "32"
        - input: "power_of_two(10)"
          expectedOutput: "1024"
    explanation: |
      Solution:
      ```python
      def power_of_two(n):
          if n == 0:
              return 1
          else:
              return 2 * power_of_two(n - 1)
      ```

      Why it works:
      The base case handles $n=0$ returning 1. The recursive case breaks the problem down into $2 \times 2^{n-1}$, calling the same function until $n$ reaches 0.
