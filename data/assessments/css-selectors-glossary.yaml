modeDefault: practice
glossary:
  introduction: Review these terms for CSS Selectors Glossary.
  sections:
  - id: main-terms
    title: Core Terms
    required: true
    entries:
    - id: type-selector
      term: Type Selector
      definition: Selects all elements of a given type (e.g. div).
      drills:
      - id: type-selector-drill
        type: typed
        prompt: 'What is the term for: Selects all elements of a given type (e.g. div).?'
        answer:
          expected: Type Selector
          aliases:
          - type selector
        explanation: The term is Type Selector.
    - id: class-selector
      term: Class Selector
      definition: Selects all elements with a given class attribute (e.g. .classname).
      drills:
      - id: class-selector-drill
        type: typed
        prompt: 'What is the term for: Selects all elements with a given class attribute (e.g. .classname).?'
        answer:
          expected: Class Selector
          aliases:
          - class selector
        explanation: The term is Class Selector.
    - id: id-selector
      term: ID Selector
      definition: 'Selects a single element with a given id attribute (e.g. #idname).'
      drills:
      - id: id-selector-drill
        type: typed
        prompt: 'What is the term for: Selects a single element with a given id attribute (e.g. #idname).?'
        answer:
          expected: ID Selector
          aliases:
          - id selector
        explanation: The term is ID Selector.
    - id: pseudo-class
      term: Pseudo-class
      definition: A keyword added to a selector that specifies a special state (e.g. :hover).
      drills:
      - id: pseudo-class-drill
        type: typed
        prompt: 'What is the term for: A keyword added to a selector that specifies a special state (e.g. :hover).?'
        answer:
          expected: Pseudo-class
          aliases:
          - pseudo-class
        explanation: The term is Pseudo-class.
