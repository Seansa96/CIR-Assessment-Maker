schemaVersion: 1
id: css-selectors-glossary
title: CSS Selectors Glossary
assessmentType: glossary
categoryId: css
subcategoryIds:
  - css-selectors-specificity
modeDefault: study
glossary:
  - id: selector
    term: Selector
    definition: |
      A pattern used to select the HTML elements you want to style. Examples include element selectors (`div`), class selectors (`.my-class`), and ID selectors (`#my-id`).
  - id: combinator
    term: Combinator
    definition: |
      A character that explains the relationship between selectors. There are four different combinators in CSS: descendant selector (space), child selector (`>`), adjacent sibling selector (`+`), and general sibling selector (`~`).
  - id: specificity
    term: Specificity
    definition: |
      The algorithm used by browsers to determine which CSS rule applies when multiple rules target the same element. It is calculated based on the number of IDs, classes, and element selectors.
  - id: pseudo-class
    term: Pseudo-class
    definition: |
      A keyword added to a selector that specifies a special state of the selected element(s). For example, `:hover` applies a style when the user hovers over the element.
  - id: pseudo-element
    term: Pseudo-element
    definition: |
      A keyword added to a selector that lets you style a specific part of the selected element(s). For example, `::before` allows you to insert and style content before the element's actual content.
