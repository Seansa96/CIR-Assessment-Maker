workedExamples:
- id: swap-functions
  title: Writing a Swap Function
  problem: 'Write a function to swap the values of two integers. We will compare pass-by-value
    (which fails) with pass-by-reference (which works).

    '
  steps:
  - id: step-swap-functions-1
    title: The failed pass-by-value attempt
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: "If we write a swap function using normal parameters, it only swaps\
      \ local copies.\n\n```cpp\nvoid badSwap(int a, int b) {\n    int temp = a;\n\
      \    a = b;\n    b = temp;\n}\n\nint main() {\n    int x = 5, y = 10;\n    badSwap(x,\
      \ y);\n    // x is still 5, y is still 10\n}\n```\n"
  - id: step-swap-functions-2
    title: The successful pass-by-reference attempt
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: "By adding `&` to the parameter types, `a` and `b` become aliases\
      \ for the original variables passed in.\n\n```cpp\nvoid goodSwap(int& a, int&\
      \ b) {\n    int temp = a;\n    a = b;\n    b = temp;\n}\n\nint main() {\n  \
      \  int x = 5, y = 10;\n    goodSwap(x, y);\n    // x is now 10, y is now 5\n\
      }\n```\n"
  - id: step-swap-functions-3
    title: The C-style pass-by-pointer method
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: "Before C++ added references, the only way to modify originals was\
      \ to pass pointers (memory addresses).\n\n```cpp\nvoid ptrSwap(int* a, int*\
      \ b) {\n    int temp = *a;\n    *a = *b;\n    *b = temp;\n}\n\nint main() {\n\
      \    int x = 5, y = 10;\n    ptrSwap(&x, &y); // Must explicitly pass addresses\n\
      }\n```\nIn modern C++, references are generally preferred over pointers for\
      \ this because the syntax is cleaner and references cannot be `nullptr`.\n"
  check:
    id: pass-by-ref-check
    type: multipleChoice
    prompt: If a function `void resetToZero(int& val)` is called with `int score =
      50; resetToZero(score);`, what is the value of `score` afterwards?
    choices:
    - id: a
      text: '0'
    - id: b
      text: '50'
    - id: c
      text: Depends on the return value
    - id: d
      text: A compiler error occurs
    answer:
      choiceId: a
    explanation: 'Because the function takes an `int&` (reference), any changes made
      to `val` inside the function directly affect `score`.

      '
