workedExamples:
- id: ex-zero-work
  title: Analyzing the Dot Product
  problem: |
    Let's prove exactly under what conditions forces like Tension and Normal force do zero work.
  steps:
  - id: step-1
    title: Step 1 — The Dot Product Condition
    instruction: |
      Start with the definition of work: $dW = \vec F \cdot d\vec r = |\vec F| |d\vec r| \cos\theta$.
    type: multipleChoice
    prompt: Assuming the force and displacement are both non-zero, what must the angle $\theta$ be for the work to be exactly zero?
    choices:
    - id: a
      text: $0^\circ$
    - id: b
      text: $90^\circ$
    - id: c
      text: $180^\circ$
    answer:
      choiceId: b
    explanation: $\cos(90^\circ) = 0$. So if a force is strictly perpendicular to the direction of motion, it does no work.
  - id: step-2
    title: Step 2 — Normal Force
    instruction: |
      Consider a block sliding horizontally across a stationary floor. The normal force points up, and the displacement is horizontal.
    type: multipleChoice
    prompt: Does this specific normal force do work on the block?
    choices:
    - id: a
      text: Yes, it does positive work.
    - id: b
      text: Yes, it does negative work.
    - id: c
      text: No, it does zero work.
    answer:
      choiceId: c
    explanation: Since up is perpendicular to horizontal, $\theta = 90^\circ$, so $W_N = 0$.
  - id: step-3
    title: Step 3 — Normal Force in an Elevator
    instruction: |
      Now consider a person standing in an elevator that is accelerating upward. The normal force from the floor pushes UP on the person. The person's displacement is UP.
    type: multipleChoice
    prompt: Does the normal force from the elevator floor do work on the person?
    choices:
    - id: a
      text: Yes, it does positive work.
    - id: b
      text: Yes, it does negative work.
    - id: c
      text: No, it does zero work.
    answer:
      choiceId: a
    explanation: The normal force points UP and the displacement points UP. The angle is $0^\circ$, so $W_N > 0$. Normal force does NOT always do zero work!
