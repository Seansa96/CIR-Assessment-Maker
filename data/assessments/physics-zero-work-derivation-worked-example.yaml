navigation: { learningGoal: learn, activityType: guidedWorkedExample, tags: [physics-1, physics-work-energy] }
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: ex-zero-work
    title: Perpendicular force on a sliding block
    problem: 'Explain why the normal force does no work on a block moving horizontally on a level floor.'
    steps:
      - id: zw-1
        title: Identify the angle
        instruction: 'Compare the vertical normal force with the horizontal displacement.'
        type: multipleChoice
        prompt: 'What is their angle?'
        choices: [{ id: a, text: '$90^\circ$' }, { id: b, text: '$0^\circ$' }]
        answer: { choiceId: a }
        explanation: 'Solution: The angle is $90^\circ$.\n\nWhy it works: Vertical and horizontal directions are perpendicular.\n\nWhy the other choices fail: Parallel vectors would have an angle of $0^\circ$.'
      - id: zw-2
        title: Apply the dot product
        instruction: 'Use $W=Fd\cos\theta$.'
        type: numericResponse
        prompt: 'If the normal force is $200$ N and displacement is $6.0$ m, what normal-force work is done?'
        answer: { value: 0, tolerance: 0.01 }
        explanation: 'Solution: $W_N=(200)(6.0)\cos90^\circ=0$ J.\n\nWhy it works: A perpendicular force has zero component along displacement.'
  - id: ex-normal-positive-work
    title: Elevator normal force
    problem: 'A $70$ kg person rises $2.0$ m in an elevator while the floor exerts an upward normal force of $800$ N. Find the work by the normal force.'
    steps:
      - id: zn-1
        title: Identify the alignment
        instruction: 'The normal force and displacement both point upward.'
        type: multipleChoice
        prompt: 'What sign should the normal-force work have?'
        choices: [{ id: a, text: 'Positive' }, { id: b, text: 'Zero' }]
        answer: { choiceId: a }
        explanation: 'Solution: The work is positive.\n\nWhy it works: Force and displacement are parallel.\n\nWhy the other choices fail: The normal force is not perpendicular during this vertical motion.'
      - id: zn-2
        title: Calculate work
        instruction: 'Use the parallel-force form of the work equation.'
        type: numericResponse
        prompt: 'What work does the normal force do in joules?'
        answer: { value: 1600, tolerance: 0.01 }
        explanation: 'Solution: $W_N=(800)(2.0)\cos0^\circ=1600$ J.\n\nWhy it works: The normal force transfers energy into the person''s upward motion.'
