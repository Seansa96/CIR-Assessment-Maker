workedExamples:
- id: example-001
  title: A polynomial with mixed powers and a linear cross-term
  problem: Let $f(x,y)=x^3y^2-4xy+2y$. Find $f_{xy}$ and $f_{yx}$ independently, then compare them.
  steps:
  - id: s001
    title: Differentiate first in x
    instruction: Find $f_x$ while holding y fixed.
    type: freeResponse
    prompt: Find $f_x$ while holding y fixed.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $f_x=3x^2y^2-4y$
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: Differentiating each term in x gives $f_x=3x^2y^2-4y$.


      Why it works: The term $2y$ is constant in x, while $-4xy$ contributes $-4y$.'
  - id: s002
    title: Take the y derivative
    instruction: Differentiate your $f_x$ in y to find $f_{xy}$.
    type: freeResponse
    prompt: Differentiate your $f_x$ in y to find $f_{xy}$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $f_{xy}=6x^2y-4$
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: $f_{xy}=6x^2y-4$.


      Why it works: Apply the product and power rules to $3x^2y^2-4y$ with x fixed.'
  - id: s003
    title: Reverse the order
    instruction: Find $f_y$ first, then differentiate it in x to obtain $f_{yx}$.
    type: freeResponse
    prompt: Find $f_y$ first, then differentiate it in x to obtain $f_{yx}$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $f_y=2x^3y-4x+2$
      - $f_{yx}=6x^2y-4$
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: $f_y=2x^3y-4x+2$, so $f_{yx}=6x^2y-4$.


      Why it works: The inner y derivative treats x as constant; the next x derivative recovers the same
      mixed expression.'
  - id: s004
    title: Compare and state the condition
    instruction: Why do the two orders agree everywhere in the domain?
    type: freeResponse
    prompt: Why do the two orders agree everywhere in the domain?
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Both results equal $6x^2y-4$
      - The polynomial has continuous second partial derivatives
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: The two computations give $f_{xy}=f_{yx}=6x^2y-4$.


      Why it works: A polynomial has continuous mixed second partials, so Clairaut’s theorem guarantees
      order equality.'
- id: example-002
  title: A trigonometric-exponential composite
  problem: Let $g(x,y)=\sin(xy)+xe^y$. Find both mixed second partials by differentiating in opposite
    orders.
  steps:
  - id: s005
    title: Differentiate first in x
    instruction: Find $g_x$.
    type: freeResponse
    prompt: Find $g_x$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $g_x=y\cos(xy)+e^y$
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: $g_x=y\cos(xy)+e^y$.


      Why it works: For $\sin(xy)$ the inner x derivative is y; for $xe^y$, $e^y$ is constant in x.'
  - id: s006
    title: Take the y derivative
    instruction: Differentiate $g_x$ in y to find $g_{xy}$.
    type: freeResponse
    prompt: Differentiate $g_x$ in y to find $g_{xy}$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $g_{xy}=\cos(xy)-xy\sin(xy)+e^y$
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: $g_{xy}=\cos(xy)-xy\sin(xy)+e^y$.


      Why it works: Differentiate both the leading y and the cosine factor; the latter contributes $-xy\sin(xy)$.'
  - id: s007
    title: Reverse the order
    instruction: Find $g_y$, then differentiate it in x.
    type: freeResponse
    prompt: Find $g_y$, then differentiate it in x.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $g_y=x\cos(xy)+xe^y$
      - $g_{yx}=\cos(xy)-xy\sin(xy)+e^y$
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: $g_y=x\cos(xy)+xe^y$, so $g_{yx}=\cos(xy)-xy\sin(xy)+e^y$.


      Why it works: The product rule on $x\cos(xy)$ and $xe^y$ produces the same three terms.'
  - id: s008
    title: Check the theorem conditions
    instruction: Identify why Clairaut applies on all of $\mathbb R^2$.
    type: freeResponse
    prompt: Identify why Clairaut applies on all of $\mathbb R^2$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Both mixed partials are continuous everywhere
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: The opposite-order calculations agree, and both mixed partials are continuous
      for every real x and y.


      Why it works: Sine, cosine, and the exponential are smooth, and their sums and products remain smooth.'
