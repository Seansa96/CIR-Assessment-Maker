workedExamples:
  - id: mass-percent-example
    title: Mass Percent From Component Masses
    problem: 'A saline mixture contains 8.50 g NaCl and 141.5 g water. Find mass percent NaCl.'
    steps:
      - { id: sw-01, title: Find total solution mass, instruction: 'Complete this step.', type: numericResponse, prompt: 'What is the total solution mass in grams?', answer: { value: 150.0, tolerance: 0.001 }, explanation: 'Solution: $m_{solution}=8.50+141.5=150.0\ \mathrm g$. Why it works: Total solution mass includes solute and solvent. Common trap: Using solvent mass alone.' }
      - { id: sw-02, title: Form the concentration ratio, instruction: 'Complete this step.', type: freeResponse, prompt: 'Write the mass-percent substitution before evaluating it.', answer: { gradingMode: selfCheck, keyPoints: ['8.50 g divided by 150.0 g', 'times 100 percent'] }, explanation: 'Solution: Use $\frac{8.50\ \mathrm g}{150.0\ \mathrm g}\times100\%$. Why it works: Mass percent compares solute mass with total solution mass. Common trap: Dividing by 141.5 g.' }
      - { id: sw-03, title: State the result with units, instruction: 'Complete this step.', type: numericResponse, prompt: 'What is the mass percent NaCl?', answer: { value: 5.67, tolerance: 0.01 }, explanation: 'Solution: $(8.50/150.0)\times100=5.67\%$. Why it works: Gram units cancel, leaving percent. Common trap: Reporting 0.0567% instead of converting the fraction to percent.' }
  - id: target-molarity-example
    title: Prepare a Target-Molarity Solution
    problem: 'How many grams of KNO3 (101.10 g/mol) are required to prepare 250.0 mL of 0.400 M KNO3?'
    steps:
      - { id: sw-04, title: Convert volume, instruction: 'Complete this step.', type: numericResponse, prompt: 'Convert 250.0 mL to liters.', answer: { value: 0.25, tolerance: 0.0001 }, explanation: 'Solution: $250.0\ \mathrm{mL}\times\frac{1\ \mathrm L}{1000\ \mathrm{mL}}=0.2500\ \mathrm L$. Why it works: Molarity is per liter. Common trap: Leaving 250.0 in the molarity equation.' }
      - { id: sw-05, title: Calculate required moles, instruction: 'Complete this step.', type: numericResponse, prompt: 'How many moles KNO3 are needed?', answer: { value: 0.1, tolerance: 0.0001 }, explanation: 'Solution: $n=MV=(0.400\ \mathrm{mol/L})(0.2500\ \mathrm L)=0.100\ \mathrm{mol}$. Why it works: Rearranging molarity gives moles. Common trap: Dividing M by V.' }
      - { id: sw-06, title: Convert moles to mass, instruction: 'Complete this step.', type: numericResponse, prompt: 'What mass of KNO3 is required in grams?', answer: { value: 10.11, tolerance: 0.02 }, explanation: 'Solution: $m=(0.100\ \mathrm{mol})(101.10\ \mathrm{g/mol})=10.1\ \mathrm g$. Why it works: Molar mass converts the needed amount to a weighable mass. Common trap: Adding the solute to 250.0 mL water instead of diluting to 250.0 mL solution.' }
  - id: dilution-example
    title: Dilute a Stock Solution
    problem: 'What volume of 6.00 M HCl is needed to prepare 500.0 mL of 0.300 M HCl?'
    steps:
      - { id: sw-07, title: Identify stock and target, instruction: 'Complete this step.', type: freeResponse, prompt: 'Identify $M_1$, $V_1$, $M_2$, and $V_2$.', answer: { gradingMode: selfCheck, keyPoints: ['M1 6.00 M', 'V1 unknown', 'M2 0.300 M', 'V2 500.0 mL'] }, explanation: 'Solution: $M_1=6.00\ \mathrm M$, $V_1=?$, $M_2=0.300\ \mathrm M$, and $V_2=500.0\ \mathrm{mL}$. Why it works: Subscript 1 labels stock; subscript 2 labels the final diluted solution. Common trap: Swapping the two concentrations.' }
      - { id: sw-08, title: Solve the dilution equation, instruction: 'Complete this step.', type: numericResponse, prompt: 'What stock volume is required in mL?', answer: { value: 25.0, tolerance: 0.05 }, explanation: 'Solution: $V_1=\frac{M_2V_2}{M_1}=\frac{(0.300)(500.0)}{6.00}=25.0\ \mathrm{mL}$. Why it works: Solute moles are the same before and after dilution, and identical volume units cancel. Common trap: Calculating 10,000 mL by inverting the ratio.' }
      - { id: sw-09, title: Describe the laboratory finish, instruction: 'Complete this step.', type: multipleChoice, prompt: 'After transferring 25.0 mL stock, what completes the preparation?', choices: [{ id: a, text: 'Add water until total solution volume is 500.0 mL.' }, { id: b, text: 'Add exactly 500.0 mL water.' }, { id: c, text: 'Evaporate to 25.0 mL.' }, { id: d, text: 'Add more stock until color changes.' }], answer: { choiceId: a }, explanation: 'Solution: Transfer stock to a volumetric flask and add water to the 500.0 mL mark. Why it works: The target is final solution volume. Common trap: Adding 500.0 mL water, which gives too much final volume. Why the other choices fail: b overshoots volume; c concentrates; d changes solute amount.' }
