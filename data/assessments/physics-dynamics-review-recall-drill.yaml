items:
  - { id: dr1, type: cloze, prompt: 'Newton''s second law is $\sum F=____$.', answer: { expected: ma, expectedLatex: 'ma', aliases: [], media: [] }, explanation: 'Solution: Insert $ma$.\n\nWhy it works: Net force equals mass times acceleration.', tags: [law] }
  - { id: dr2, type: typed, prompt: 'What diagram shows external forces on a system?', answer: { expected: 'free body diagram', expectedLatex: '', aliases: [FBD], media: [] }, explanation: 'Solution: A free-body diagram.\n\nWhy it works: It isolates external interactions.', tags: [model] }
  - { id: dr3, type: cloze, prompt: 'Kinetic friction acts when surfaces ____.', answer: { expected: slide, expectedLatex: '', aliases: [slip], media: [] }, explanation: 'Solution: Insert slide.\n\nWhy it works: Kinetic friction models relative sliding.', tags: [friction] }
  - { id: dr4, type: typed, prompt: 'What quantity must be zero in translational equilibrium?', answer: { expected: 'net force', expectedLatex: '\sum F', aliases: [], media: [] }, explanation: 'Solution: Net force.\n\nWhy it works: Equilibrium has zero acceleration.', tags: [equilibrium] }
  - { id: dr5, type: cloze, prompt: 'An ideal string makes connected objects share ____ magnitude.', answer: { expected: acceleration, expectedLatex: 'a', aliases: [], media: [] }, explanation: 'Solution: Insert acceleration.\n\nWhy it works: Fixed string length constrains motion.', tags: [strings] }
  - { id: dr6, type: typed, prompt: 'Which force is perpendicular to a contact surface?', answer: { expected: 'normal force', expectedLatex: 'N', aliases: [normal], media: [] }, explanation: 'Solution: The normal force.\n\nWhy it works: It is defined perpendicular to the surface.', tags: [contact] }
