lesson:
  introduction: |-
    Now that we understand points and lines, we can build more complex geometric figures: **segments**, **rays**, and **angles**.
  sections:
  - id: sec-segments
    title: Line Segments
    required: true
    content: |-
      A **line segment** is a portion of a line consisting of two endpoints and all points between them. Unlike a line, a segment has a measurable length. 
      
      A segment with endpoints $A$ and $B$ is denoted as $\overline{AB}$. The length of the segment is written without the bar, simply as $AB$. For instance, if the segment is 5 units long, we write $AB = 5$.

  - id: sec-rays
    title: Rays
    required: true
    content: |-
      A **ray** is a part of a line that starts at one endpoint and extends infinitely in one direction.
      
      A ray starting at endpoint $C$ and passing through point $D$ is denoted as $\overrightarrow{CD}$. Notice that the first letter must be the endpoint. $\overrightarrow{CD}$ and $\overrightarrow{DC}$ are entirely different rays because they start at different points and go in opposite directions.

  - id: sec-angles
    title: Angles
    required: true
    content: |-
      An **angle** is formed by two rays that share a common endpoint. The common endpoint is called the **vertex**, and the rays are called the **sides** of the angle.
      
      If an angle has vertex $B$ and sides $\overrightarrow{BA}$ and $\overrightarrow{BC}$, we denote it as $\angle ABC$ or $\angle CBA$. The vertex letter must always be in the middle! Sometimes, if there is no ambiguity, it can simply be called $\angle B$.

questions:
- id: q-geom-fnd2-1
  title: Concept Check - Ray Notation
  prompt: |-
    True or False: The ray $\overrightarrow{XY}$ and the ray $\overrightarrow{YX}$ represent the exact same set of points.
  type: multipleChoice
  choices:
  - id: c1
    text: True
  - id: c2
    text: False
  answer:
    choiceId: c2
  explanation: |-
    **False**. Ray $\overrightarrow{XY}$ starts at $X$ and goes infinitely towards $Y$. Ray $\overrightarrow{YX}$ starts at $Y$ and goes infinitely towards $X$. They are completely different rays!
  skills:
  - geometry-foundations

- id: q-geom-fnd2-2
  title: Concept Check - Angle Naming
  prompt: |-
    If an angle is formed by the rays $\overrightarrow{PQ}$ and $\overrightarrow{PR}$, what is the vertex of the angle?
  type: freeResponse
  answer:
    aliases:
    - P
    - Point P
    gradingMode: auto
  explanation: |-
    The vertex is the common endpoint of the two rays. Both $\overrightarrow{PQ}$ and $\overrightarrow{PR}$ start at the point **P**, making $P$ the vertex of $\angle QPR$.
  skills:
  - geometry-foundations
