questions:
- id: q001
  type: numericResponse
  prompt: '**Tangential Velocity**


    The tangential speed $v$ of a point on a rotating object is directly proportional
    to its distance $r$ from the axis of rotation and the object''s angular velocity
    $\omega$:


    $$

    v = r\omega

    $$


    A DVD is spinning at $30\ \text{rad/s}$. What is the linear (tangential) speed
    of a point on the outer edge, $0.06\ \text{m}$ from the center?

    '
  answer:
    value: 1.8
    tolerance: 0.01
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $$v = r\omega = (0.06\ \text{m})(30\ \text{rad/s}) = 1.8\ \text{m/s}$$

    Notice that a point closer to the center (smaller $r$) has a slower linear speed,
    even though every point on the DVD has the exact same angular velocity $\omega$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q002
  type: numericResponse
  prompt: '**Tangential Acceleration**


    If the rotation is speeding up or slowing down, points on the object have a tangential
    acceleration $a_t$ (directed tangent to the circular path). This is related to
    the angular acceleration $\alpha$:


    $$

    a_t = r\alpha

    $$


    A car tire with a radius of $0.3\ \text{m}$ starts from rest and undergoes a constant
    angular acceleration of $5.0\ \text{rad/s}^2$. What is the tangential acceleration
    of a pebble stuck in the tire tread?

    '
  answer:
    value: 1.5
    tolerance: 0.01
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $$a_t = r\alpha = (0.3\ \text{m})(5.0\ \text{rad/s}^2) = 1.5\ \text{m/s}^2$$

    This tells us\rhow quickly the linear speed of the pebble is increasing along
    its circular path.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q003
  type: numericResponse
  prompt: '**Radial (Centripetal) Acceleration**


    Even if a wheel is rotating at a constant angular speed $\omega$ (so $\alpha=0$
    and $a_t=0$), points on the wheel are constantly changing direction. This means
    they have a radial (centripetal) acceleration pointing toward the center:


    $$

    a_r = \frac{v^2}{r} = r\omega^2

    $$


    If a centrifuge with radius $0.50\ \text{m}$ spins at a constant $10\ \text{rad/s}$,
    what is the centripetal acceleration of a sample at the edge?

    '
  answer:
    value: 50
    tolerance: 0.01
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $$a_r = r\omega^2 = (0.50\ \text{m})(10\ \text{rad/s})^2 = (0.50)(100) = 50\ \text{m/s}^2$$

    This is roughly $5g$''s of acceleration!

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q004
  type: numericResponse
  prompt: '**Rolling Without Slipping**


    When a wheel of radius $r$ rolls without slipping along the ground, the linear
    distance it travels\rhorizontally is exactly equal to the arc length along the
    edge of the wheel that has "laid down" on the ground: $\Delta x = r\Delta \theta$.


    Taking derivatives, this gives us the crucial rolling condition: The linear velocity
    of the wheel''s center of mass is $v_{\text{com}} = r\omega$, and its linear acceleration
    is $a_{\text{com}} = r\alpha$.


    A car travels at $20\ \text{m/s}$. If its tires have a radius of $0.40\ \text{m}$,
    what is the angular velocity of the tires assuming they roll without slipping?

    '
  answer:
    value: 50
    tolerance: 0.01
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    Because the tires roll without slipping, $v_{\text{com}} = r\omega$.

    $$\omega = \frac{v_{\text{com}}}{r} = \frac{20\ \text{m/s}}{0.40\ \text{m}} =
    50\ \text{rad/s}$$

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
