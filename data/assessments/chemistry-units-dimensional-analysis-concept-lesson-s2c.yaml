lesson:
  introduction: Dimensional analysis treats units as algebraic factors. A sound setup displays the path
    from a known quantity to the requested quantity before any arithmetic occurs.
  sections:
  - id: s1
    title: Orient conversion factors by cancellation
    content: An equality such as $1\ \mathrm{m}=100\ \mathrm{cm}$ yields two factors equal to one. Start
      with the given quantity, then choose the orientation that places its unwanted unit opposite it.
      For example, $2.50\ \mathrm{m}\times100\ \mathrm{cm}/1\ \mathrm{m}$ leaves centimeters, so the arithmetic
      has a visible purpose.
    check:
      id: c1
      type: multipleChoice
      prompt: To convert $0.45\ \mathrm{kg}$ to grams, which factor should follow the given value?
      choices:
      - id: a
        text: $1000\ \mathrm{g}/1\ \mathrm{kg}$
        issueSignals: []
      - id: b
        text: $1\ \mathrm{kg}/1000\ \mathrm{g}$
        issueSignals:
        - id: stoichiometry-ratio-error
      - id: c
        text: $1000\ \mathrm{kg}/1\ \mathrm{g}$
        issueSignals:
        - id: stoichiometry-ratio-error
      - id: d
        text: $1\ \mathrm{g}/1000\ \mathrm{kg}$
        issueSignals:
        - id: stoichiometry-ratio-error
      answer:
        choiceId: a
      explanation: 'Solution: Use $1000\ \mathrm{g}/1\ \mathrm{kg}$ so kilograms cancel.


        Why it works: The desired gram unit remains after cancellation.


        Why the other choices fail: b does not follow the stated relationship or reporting rule; c does
        not follow the stated relationship or reporting rule; d does not follow the stated relationship
        or reporting rule.'
      difficultyDimensions:
      - factorOrientation
      - metricPrefix
      difficultyEvidence: Requires interpreting quantitative evidence and rejecting a specific, plausible
        alternative.
      issueSignals:
      - id: stoichiometry-ratio-error
  - id: s2
    title: Respect compound and powered units
    content: 'When a unit is squared or cubed, the conversion factor must be squared or cubed too. Thus
      $1\ \mathrm{m^2}=10^4\ \mathrm{cm^2}$, not $100\ \mathrm{cm^2}$. Density and speed are compound
      units: each numerator and denominator unit must be tracked, so a correct result tells you whether
      you found mass, volume, or a rate.'
    check:
      id: c2
      type: multipleChoice
      prompt: How many $\mathrm{cm^2}$ are in $1.00\ \mathrm{m^2}$?
      choices:
      - id: a
        text: $1.00\times10^4\ \mathrm{cm^2}$
        issueSignals: []
      - id: b
        text: $100\ \mathrm{cm^2}$
        issueSignals:
        - id: stoichiometry-ratio-error
      - id: c
        text: $1.00\times10^6\ \mathrm{cm^2}$
        issueSignals:
        - id: stoichiometry-ratio-error
      - id: d
        text: $0.0100\ \mathrm{cm^2}$
        issueSignals:
        - id: stoichiometry-ratio-error
      answer:
        choiceId: a
      explanation: 'Solution: Square the length factor: $(100\ \mathrm{cm}/1\ \mathrm{m})^2=10^4$.


        Why it works: Area contains two factors of length.


        Why the other choices fail: b does not follow the stated relationship or reporting rule; c does
        not follow the stated relationship or reporting rule; d does not follow the stated relationship
        or reporting rule.'
      difficultyDimensions:
      - squaredUnits
      - exponentReasoning
      difficultyEvidence: Requires interpreting quantitative evidence and rejecting a specific, plausible
        alternative.
      issueSignals:
      - id: stoichiometry-ratio-error
  - id: s3
    title: Build multi-step chemistry pipelines
    content: 'Chemistry calculations often require a chain: mass $\rightarrow$ moles $\rightarrow$ equation
      ratio $\rightarrow$ moles of another substance $\rightarrow$ desired mass or volume. Attach one
      factor at a time and pause after each cancellation. A final unit that is not the requested unit
      is evidence to revisit the setup rather than merely redo arithmetic.'
    check:
      id: c3
      type: multipleChoice
      prompt: Which sequence can convert grams of reactant to liters of gas at STP?
      choices:
      - id: a
        text: grams → moles reactant → moles gas → liters gas
        issueSignals: []
      - id: b
        text: grams → liters reactant → moles gas
        issueSignals:
        - id: stoichiometry-ratio-error
      - id: c
        text: grams → grams gas → liters reactant
        issueSignals:
        - id: stoichiometry-ratio-error
      - id: d
        text: grams → temperature → liters gas
        issueSignals:
        - id: stoichiometry-ratio-error
      answer:
        choiceId: a
      explanation: 'Solution: Use molar mass, the balanced-equation ratio, and molar gas volume in that
        order.


        Why it works: Each conversion creates the quantity needed by the next factor.


        Why the other choices fail: b does not follow the stated relationship or reporting rule; c does
        not follow the stated relationship or reporting rule; d does not follow the stated relationship
        or reporting rule.'
      difficultyDimensions:
      - chemistryPipeline
      - unitCancellation
      - multiStepReasoning
      difficultyEvidence: Requires interpreting quantitative evidence and rejecting a specific, plausible
        alternative.
      issueSignals:
      - id: stoichiometry-ratio-error
