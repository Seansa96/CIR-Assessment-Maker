id: chemistry-units-dimensional-analysis-concept-lesson-s2c
title: Dimensional Analysis in Chemistry
assessmentType: conceptLesson
categoryId: chemistry
topicId: chemistry-units
modeDefault: study
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags:
  - chemistry
