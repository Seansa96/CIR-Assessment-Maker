schemaVersion: 1
id: calc2-convergence-tests-olympiad-test
title: Convergence Tests Olympiad Test
assessmentType: test
categoryId: calculus-2
topicId: convergence-tests
skills:
- Apply Stirling and central-binomial asymptotics
- Derive convergence thresholds from iterated logs and local expansions
- Use complex Dirichlet and bounded-variation summation by parts
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - calculus-2
  - convergence-tests
  - olympiad
  - asymptotic-theorems
modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - use-central-binomial-asymptotics
  prompt: |
    Classify $\displaystyle\sum_{n=1}^{\infty}\binom{2n}{n}/4^n$.
  choices:
  - id: a
    text: Divergent
  - id: b
    text: Convergent
  - id: c
    text: Conditionally convergent
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: |-
    The normalized central binomial coefficient is asymptotic to $1/\sqrt{\pi n}$, a divergent p-series scale.
- id: q002
  type: multipleChoice
  skills:
  - combine-binomial-asymptotics-with-powers
  prompt: |
    How does $\displaystyle\sum_{n=1}^{\infty}\binom{2n}{n}/(4^nn)$
    behave?
  choices:
  - id: a
    text: It converges.
  - id: b
    text: |-
      It diverges like $1/\sqrt n$.
  - id: c
    text: It is conditional.
  - id: d
    text: Its terms approach a nonzero limit.
  answer:
    choiceId: a
  explanation: The terms are asymptotic to a constant times $1/n^{3/2}$.
- id: q003
  type: multipleChoice
  skills:
  - classify-alternating-binomial-series
  prompt: |
    Classify $\displaystyle\sum_{n=1}^{\infty}(-1)^n\binom{2n}{n}/4^n$.
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: |-
    The positive magnitudes decrease to zero and behave like $1/\sqrt{\pi n}$, whose sum diverges.
- id: q004
  type: multipleChoice
  skills:
  - classify-third-iterated-log-series
  prompt: |
    For sufficiently large n, when does
    $$\sum\frac1{n\ln n\,\ln\ln n\,(\ln\ln\ln n)^p}$$
    converge?
  choices:
  - id: a
    text: $p>1$
  - id: b
    text: |-
      $p\ge1$
  - id: c
    text: $p>0$
  - id: d
    text: For every p
  answer:
    choiceId: a
  explanation: |-
    Three logarithmic substitutions reduce the integral to the p-series integral $\int u^{-p}du$.
- id: q005
  type: multipleChoice
  skills:
  - classify-log-stretched-exponentials
  prompt: |
    For $\alpha>0$, when does
    $\sum_{n=2}^{\infty}\exp[-(\ln n)^\alpha]$ converge?
  choices:
  - id: a
    text: |-
      Exactly when $\alpha>1$
  - id: b
    text: |-
      When $\alpha\ge1$
  - id: c
    text: |-
      For every $\alpha>0$
  - id: d
    text: |-
      For no $\alpha$
  answer:
    choiceId: a
  explanation: Above one the decay eventually beats $1/n^2$; at one the terms equal $1/n$, and below one
    they decay more slowly than $1/n$.
- id: q006
  type: multipleChoice
  skills:
  - apply-stirling-to-term-tests
  prompt: |
    Classify $\displaystyle\sum_{n=1}^{\infty}\frac{n^ne^{-n}}{n!}$.
  choices:
  - id: a
    text: Divergent
  - id: b
    text: Convergent
  - id: c
    text: Conditionally convergent
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: |-
    Stirling gives $n!\sim\sqrt{2\pi n}(n/e)^n$, so the term is asymptotic to $1/\sqrt{2\pi n}$.
- id: q007
  type: multipleChoice
  skills:
  - apply-stirling-before-term-tests
  prompt: |
    What happens to
    $\sum_{n=1}^{\infty}(n!)^{1/n}/n$?
  choices:
  - id: a
    text: It diverges because the terms approach $1/e$.
  - id: b
    text: It converges by the root test.
  - id: c
    text: It is conditional.
  - id: d
    text: Its terms approach zero.
  answer:
    choiceId: a
  explanation: |-
    Stirling implies $(n!)^{1/n}\sim n/e$, leaving a nonzero term limit.
- id: q008
  type: multipleChoice
  skills:
  - apply-ratio-tests-after-power-unwrapping
  prompt: |
    Classify
    $\sum_{n=1}^{\infty}[(n!)^{1/n}/n]^n$.
  choices:
  - id: a
    text: Convergent
  - id: b
    text: Divergent by the term test
  - id: c
    text: Conditionally convergent
  - id: d
    text: Harmonic
  answer:
    choiceId: a
  explanation: The nth power is exactly $n!/n^n$, whose consecutive ratio tends to $e^{-1}$.
- id: q009
  type: multipleChoice
  skills:
  - derive-parameter-thresholds-from-local-expansions
  prompt: |
    For which p does
    $\sum_{n=1}^{\infty}[1-\cos(1/n)]^p$ converge?
  choices:
  - id: a
    text: $p>1/2$
  - id: b
    text: |-
      $p\ge1/2$
  - id: c
    text: $p>1$
  - id: d
    text: $p>0$
  answer:
    choiceId: a
  explanation: The bracket is asymptotic to $1/(2n^2)$, so its pth power has p-series exponent $2p$.
- id: q010
  type: multipleChoice
  skills:
  - derive-arctangent-power-thresholds
  prompt: |
    For positive p, when does
    $\sum_{n=1}^{\infty}[\arctan(1/n)]^p$ converge?
  choices:
  - id: a
    text: $p>1$
  - id: b
    text: |-
      $p\ge1$
  - id: c
    text: $p>1/2$
  - id: d
    text: Every positive p
  answer:
    choiceId: a
  explanation: Arctangent x is asymptotic to x at zero, so the terms behave like $1/n^p$.
- id: q011
  type: multipleChoice
  skills:
  - detect-exponential-series-cancellation
  prompt: |
    Classify $\sum_{n=1}^{\infty}[e^{1/n}-1-1/n]$.
  choices:
  - id: a
    text: Convergent
  - id: b
    text: Divergent harmonically
  - id: c
    text: Conditionally convergent
  - id: d
    text: Divergent by the term test
  answer:
    choiceId: a
  explanation: The exponential expansion leaves $1/(2n^2)+O(1/n^3)$ after the constant and linear terms
    are removed.
- id: q012
  type: multipleChoice
  skills:
  - identify-harmonic-leading-terms
  prompt: |
    What happens to $\sum_{n=1}^{\infty}(e^{1/n}-1)$?
  choices:
  - id: a
    text: It diverges by limit comparison with $1/n$.
  - id: b
    text: It converges by comparison with $1/n^2$.
  - id: c
    text: It is conditional.
  - id: d
    text: Its terms approach a nonzero limit.
  answer:
    choiceId: a
  explanation: |-
    $(e^{1/n}-1)/(1/n)\to1$, so the positive series is harmonic-order.
- id: q013
  type: multipleChoice
  skills:
  - apply-complex-dirichlet-series-reasoning
  prompt: |
    For real theta not a multiple of $2\pi$, why does
    $\sum_{n=1}^{\infty}e^{in\theta}/n$ converge?
  choices:
  - id: a
    text: |-
      The coefficient partial sums are bounded and $1/n\downarrow0$.
  - id: b
    text: It converges absolutely.
  - id: c
    text: |-
      $e^{in\theta}\to0$.
  - id: d
    text: Its ratio has magnitude below one.
  answer:
    choiceId: a
  explanation: |-
    Finite geometric sums of $e^{in\theta}$ are uniformly bounded away from the resonant denominator zero, so Dirichlet applies.
- id: q014
  type: multipleChoice
  skills:
  - use-bounded-variation-dirichlet-forms
  prompt: |
    Suppose partial sums of $a_n$ are bounded, $b_n\to0$, and
    $\sum|b_{n+1}-b_n|<\infty$. What follows?
  choices:
  - id: a
    text: |-
      $\sum a_nb_n$ converges.
  - id: b
    text: |-
      $\sum a_nb_n$ converges absolutely.
  - id: c
    text: |-
      $\sum a_n$ converges absolutely.
  - id: d
    text: Nothing can be concluded.
  answer:
    choiceId: a
  explanation: Summation by parts bounds tails using the bounded coefficient partial sums and the finite
    total variation of b.
- id: q015
  type: multipleChoice
  skills:
  - construct-counterexamples-to-test-converses
  prompt: |
    Which pair best proves that $a_n\to0$ does not determine convergence of
    $\sum a_n$?
  choices:
  - id: a
    text: $a_n=1/n$ and $a_n=1/n^2$
  - id: b
    text: $a_n=1$ and $a_n=2$
  - id: c
    text: $a_n=2^{-n}$ and $a_n=3^{-n}$
  - id: d
    text: $a_n=0$ and $a_n=0$
  answer:
    choiceId: a
  explanation: Both sequences tend to zero, while the harmonic series diverges and the reciprocal-square
    series converges.
attemptQuestionCount: 15
