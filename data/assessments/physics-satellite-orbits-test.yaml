questions:
- id: q001
  type: numericResponse
  prompt: |
    Calculate the work required to launch a $500 \text{ kg}$ satellite from the surface of the Earth ($R_E = 6.37 \times 10^6 \text{ m}$) into a stable circular orbit at an altitude of $2R_E$.
    Use $G = 6.67 \times 10^{-11} \text{ N m}^2/\text{kg}^2$ and $M_E = 5.97 \times 10^{24} \text{ kg}$.
    (Hint: The orbital radius is $r = 3R_E$. Calculate the change in total energy from the surface, assuming it starts from rest relative to the center).
  answer:
    value: 26050000000
    tolerance: 100000000
  explanation: |
    Solution:
    The initial energy on the surface (assuming $v \approx 0$) is purely potential:
    $E_i = -\frac{GMm}{R_E}$.
    The final energy in a circular orbit of radius $r = 3R_E$ is:
    $E_f = -\frac{GMm}{2r} = -\frac{GMm}{6R_E}$.
    Work $W = \Delta E = E_f - E_i = -\frac{GMm}{6R_E} - \left(-\frac{GMm}{R_E}\right) = \frac{5GMm}{6R_E}$.
    $W = \frac{5(6.67 \times 10^{-11})(5.97 \times 10^{24})(500)}{6(6.37 \times 10^6)} = \frac{9.955 \times 10^{17}}{3.822 \times 10^7} \approx 2.605 \times 10^{10} \text{ J}$.
    
    Why it works:
    The work done by the rocket must equal the change in total mechanical energy. At the surface, the satellite has zero kinetic energy. In orbit, it has both kinetic and potential energy, whose sum is exactly $-GMm/2r$.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
- id: q002
  type: symbolicResponse
  prompt: |
    Derive the expression for the ratio of the kinetic energy $K$ to the potential energy $U$ for a satellite in a circular orbit.
    Enter the numeric ratio (as a constant).
  answer:
    expectedLatex: -0.5
    equivalenceMode: expression
    variables: []
    tolerance: 0.00001
    keyPoints:
    - -0.5
  explanation: |
    Solution:
    $-0.5$
    
    Why it works:
    For a circular orbit, $F_c = F_g$, so $mv^2/r = GMm/r^2$.
    Multiplying by $r/2$ gives $\frac{1}{2}mv^2 = \frac{GMm}{2r}$.
    So, $K = \frac{GMm}{2r}$.
    The potential energy is $U = -\frac{GMm}{r}$.
    Therefore, the ratio $K / U = \frac{GMm/(2r)}{-GMm/r} = -1/2 = -0.5$.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
