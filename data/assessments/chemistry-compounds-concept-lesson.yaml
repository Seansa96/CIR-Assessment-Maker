schemaVersion: 1
id: chemistry-compounds-concept-lesson
title: 'Chemical Nomenclature and Formula Writing: Concept Lesson'
assessmentType: conceptLesson
categoryId: chemistry
topicId: chem-compound-nomenclature
skills:
- Apply chemistry concepts
- Chemical Nomenclature and Formula Writing
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags:
  - chemistry
  - chem-compound-nomenclature
modeDefault: practice
randomizeQuestions: false
authoring:
  visualRequirement: required
  visualRationale: A particle or electron-level representation supports the topic's core decisions.
  sourceId: src-20260720035703-91ea51b0d8
lesson:
  introduction: Build a reliable model of chemical nomenclature and formula writing by separating electron accounting, particle
    representation, and observable evidence.
  sections:
  - id: ionic-vs-covalent
    title: Choose the naming path
    required: true
    content: Classify the particle type before naming. Ionic names identify ions and charges; molecular names use atom-count
      prefixes.
    check:
      id: chk-ionic-vs-covalent
      type: multipleChoice
      prompt: Which statement correctly applies the idea of choose the naming path?
      choices:
      - id: a
        text: FeCl3 follows the variable-charge ionic path.
        issueSignals: []
      - id: b
        text: FeCl3 uses molecular prefixes because its formula has four atoms.
        issueSignals:
        - id: chemistry-bonding-nomenclature-path-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-nomenclature-path-error
      answer:
        choiceId: a
      explanation: 'Solution: FeCl3 follows the variable-charge ionic path. Why it works: Classify the particle type before
        naming. Ionic names identify ions and charges; molecular names use atom-count prefixes. Why the other choices fail:
        The other statements either reverse the relevant electron or charge accounting or apply a structural model outside
        its stated scope.'
    media:
    - type: image
      src: /media/chemistry/bonding-nomenclature-workflow.svg
      alt: Instructional workflow for chemical nomenclature and formula writing showing the central particle-level decisions.
      caption: Use the representation to connect observable evidence with electron and particle accounting.
  - id: type-i-ionic
    title: Name fixed-charge ionic compounds
    required: true
    content: Name the cation unchanged, then change a monatomic anion ending to ide. A fixed-charge metal does not receive
      a Roman numeral.
    check:
      id: chk-type-i-ionic
      type: multipleChoice
      prompt: Which statement correctly applies the idea of name fixed-charge ionic compounds?
      choices:
      - id: a
        text: K2S is potassium sulfide.
        issueSignals: []
      - id: b
        text: K2S is dipotassium monosulfide.
        issueSignals:
        - id: chemistry-bonding-nomenclature-path-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-nomenclature-path-error
      answer:
        choiceId: a
      explanation: 'Solution: K2S is potassium sulfide. Why it works: Name the cation unchanged, then change a monatomic anion
        ending to ide. A fixed-charge metal does not receive a Roman numeral. Why the other choices fail: The other statements
        either reverse the relevant electron or charge accounting or apply a structural model outside its stated scope.'
  - id: type-ii-ionic
    title: Determine variable metal charge
    required: true
    content: Use anion charge and formula subscripts to infer the metal charge, then write that charge as a Roman numeral.
    check:
      id: chk-type-ii-ionic
      type: multipleChoice
      prompt: Which statement correctly applies the idea of determine variable metal charge?
      choices:
      - id: a
        text: Fe2O3 is iron(III) oxide.
        issueSignals: []
      - id: b
        text: Fe2O3 is iron(II) oxide because the iron subscript is two.
        issueSignals:
        - id: chemistry-bonding-nomenclature-path-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-nomenclature-path-error
      answer:
        choiceId: a
      explanation: 'Solution: Fe2O3 is iron(III) oxide. Why it works: Use anion charge and formula subscripts to infer the
        metal charge, then write that charge as a Roman numeral. Why the other choices fail: The other statements either reverse
        the relevant electron or charge accounting or apply a structural model outside its stated scope.'
  - id: polyatomic-formulas
    title: Preserve polyatomic ions
    required: true
    content: Recognize a polyatomic ion as one unit. Use parentheses only when more than one copy is required.
    check:
      id: chk-polyatomic-formulas
      type: multipleChoice
      prompt: Which statement correctly applies the idea of preserve polyatomic ions?
      choices:
      - id: a
        text: Calcium nitrate is Ca(NO3)2.
        issueSignals: []
      - id: b
        text: Calcium nitrate is CaNO32 because parentheses never matter.
        issueSignals:
        - id: chemistry-bonding-nomenclature-path-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-nomenclature-path-error
      answer:
        choiceId: a
      explanation: 'Solution: Calcium nitrate is Ca(NO3)2. Why it works: Recognize a polyatomic ion as one unit. Use parentheses
        only when more than one copy is required. Why the other choices fail: The other statements either reverse the relevant
        electron or charge accounting or apply a structural model outside its stated scope.'
  - id: molecular-naming
    title: Use molecular prefixes
    required: true
    content: For two nonmetals, prefixes state atom counts; omit mono on the first element and give the second element an
      ide ending.
    check:
      id: chk-molecular-naming
      type: multipleChoice
      prompt: Which statement correctly applies the idea of use molecular prefixes?
      choices:
      - id: a
        text: N2O5 is dinitrogen pentoxide.
        issueSignals: []
      - id: b
        text: N2O5 is nitrogen(V) oxide.
        issueSignals:
        - id: chemistry-bonding-nomenclature-path-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-nomenclature-path-error
      answer:
        choiceId: a
      explanation: 'Solution: N2O5 is dinitrogen pentoxide. Why it works: For two nonmetals, prefixes state atom counts; omit
        mono on the first element and give the second element an ide ending. Why the other choices fail: The other statements
        either reverse the relevant electron or charge accounting or apply a structural model outside its stated scope.'
  - id: special-names
    title: Recognize retained names
    required: true
    content: A small set of conventional names remains standard. Treat these as vocabulary while keeping systematic rules
      available for unfamiliar compounds.
    check:
      id: chk-special-names
      type: multipleChoice
      prompt: Which statement correctly applies the idea of recognize retained names?
      choices:
      - id: a
        text: NH3 is commonly called ammonia.
        issueSignals: []
      - id: b
        text: Every molecular compound has a retained name that replaces systematic naming.
        issueSignals:
        - id: chemistry-bonding-nomenclature-path-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-nomenclature-path-error
      answer:
        choiceId: a
      explanation: 'Solution: NH3 is commonly called ammonia. Why it works: A small set of conventional names remains standard.
        Treat these as vocabulary while keeping systematic rules available for unfamiliar compounds. Why the other choices
        fail: The other statements either reverse the relevant electron or charge accounting or apply a structural model outside
        its stated scope.'
