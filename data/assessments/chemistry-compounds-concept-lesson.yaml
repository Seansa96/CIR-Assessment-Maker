lesson:
  introduction: 'Chemists use a systematic naming system so that every formula has
    one unambiguous name and every name has one unambiguous formula. This lesson covers
    the most important naming rules for the compounds you will encounter in general
    chemistry.

    '
  sections:
  - id: ionic-vs-covalent
    title: Ionic vs. Covalent Compounds
    required: true
    content: 'Before naming, you must identify the compound type:


      **Ionic compounds** form between a **metal and a nonmetal** (or between a metal
      and a polyatomic ion). The metal transfers electrons to the nonmetal.

      - Examples: NaCl, CaO, FeCl3, MgSO4


      **Molecular (covalent) compounds** form between **two or more nonmetals** that
      share electrons.

      - Examples: H2O, CO2, N2O4, CCl4


      **Quick rule:**

      - Metal + nonmetal → ionic

      - Nonmetal + nonmetal → molecular

      '
    check:
      id: ionic-covalent-check
      type: multipleChoice
      prompt: 'Which of the following is an ionic compound?

        '
      choices:
      - id: a
        text: MgCl2 (magnesium + chlorine)
      - id: b
        text: NO2 (nitrogen + oxygen)
      - id: c
        text: PCl3 (phosphorus + chlorine)
      - id: d
        text: SO3 (sulfur + oxygen)
      answer:

        choiceId: a
      explanation: 'MgCl2 contains magnesium (a metal) and chlorine (a nonmetal) —
        that is an ionic compound. The others pair nonmetals together, so they are
        molecular compounds.

        '
  - id: type-i-ionic
    title: Type I Binary Ionic Compounds (Fixed-Charge Metals)
    required: true
    content: '**Type I** applies to metals that have only **one possible charge**
      — primarily Groups 1A and 2A, plus aluminum (Al3+) and zinc (Zn2+).


      **Naming rule:**

      1. Name the metal cation first (use the element name, no modification).

      2. Name the nonmetal anion second, changing the ending to **-ide**.


      | Binary anion | Ion name |

      |---|---|

      | F− | fluoride |

      | Cl− | chloride |

      | Br− | bromide |

      | I− | iodide |

      | O2− | oxide |

      | S2− | sulfide |

      | N3− | nitride |

      | P3− | phosphide |


      **Examples:**

      - NaCl → sodium chloride

      - MgO → magnesium oxide

      - Al2O3 → aluminum oxide (no prefix — ionic compounds never use prefixes)

      - Ca3N2 → calcium nitride

      '
    check:
      id: type-i-check
      type: freeResponse
      prompt: 'What is the name of the ionic compound K2S?

        '
      answer:
        gradingMode: selfCheck
        keyPoints:
        - Potassium is a Group 1A metal with a fixed 1+ charge — no Roman numeral
          needed.
        - Sulfur as a binary anion becomes sulfide (S2−).
        - The name is potassium sulfide.
  - id: type-ii-ionic
    title: Type II Binary Ionic Compounds (Variable-Charge Metals)
    required: true
    content: '**Type II** applies to metals that can form **multiple charge states**
      — mainly transition metals (Fe, Cu, Co, Cr, Mn, Pb, Sn, Hg).


      Because the same metal can have different charges, the charge must be specified
      using a **Roman numeral** in parentheses after the metal''s name.


      **Naming rule:**

      1. Name the metal cation.

      2. In parentheses, write the charge as a Roman numeral: (I), (II), (III), (IV)...

      3. Name the nonmetal anion with the **-ide** suffix.


      **How to find the charge:** Use the anion''s known charge and the formula to
      deduce the metal charge.


      **Example — FeCl2:**

      - Cl is Cl−; there are 2 Cl− ions → total anion charge = 2−

      - So iron must be 2+ to balance: Fe2+

      - Name: iron(II) chloride


      **Example — FeCl3:**

      - 3 Cl− ions → total 3− charge → iron is 3+ (Fe3+)

      - Name: iron(III) chloride


      **Example — CuO vs Cu2O:**

      - CuO: O2− requires Cu2+ → copper(II) oxide

      - Cu2O: O2− shared by 2 Cu+ → copper(I) oxide

      '
    check:
      id: type-ii-check
      type: freeResponse
      prompt: 'What is the correct name for Fe2O3?

        '
      answer:
        gradingMode: selfCheck
        keyPoints:
        - Oxygen is O2−; there are 3 oxygen ions, total charge = 6−.
        - 2 iron ions must provide 6+ total charge, so each iron is 3+ (Fe3+).
        - The compound is iron(III) oxide.
  - id: molecular-naming
    title: Binary Molecular Compounds (Nonmetal + Nonmetal)
    required: true
    content: 'When **two nonmetals** combine, the compound is named using Greek prefixes
      to indicate\rhow many atoms of each element are present.


      **Prefixes:**


      | Number | Prefix |

      |---|---|

      | 1 | mono- |

      | 2 | di- |

      | 3 | tri- |

      | 4 | tetra- |

      | 5 | penta- |

      | 6 | hexa- |

      | 7 | hepta- |

      | 8 | octa- |


      **Rules:**

      - If there is only **one atom of the first element**, skip the "mono-" prefix
      for the first element only.

      - Always use the prefix for the second element.

      - The second element''s ending changes to **-ide**.


      **Examples:**

      - CO → carbon monoxide (no "mono" on carbon, but "mono" on oxygen)

      - CO2 → carbon dioxide

      - N2O4 → dinitrogen tetroxide

      - PCl5 → phosphorus pentachloride

      - SF6 → sulfur hexafluoride

      '
    check:
      id: molecular-check
      type: freeResponse
      prompt: 'What is the name of the molecular compound N2O5?

        '
      answer:
        gradingMode: selfCheck
        keyPoints:
        - Two nitrogen atoms — prefix "di-"
        - Five oxygen atoms — prefix "penta-"
        - Oxygen becomes oxide (with -ide suffix)
        - Name is dinitrogen pentoxide.
  - id: special-names
    title: Special Chemical Names and Polyatomic Ions
    required: true
    content: 'Some common compounds have traditional names that must be memorized:


      | Formula | Systematic or IUPAC name | Common/traditional name |

      |---|---|---|

      | H2O | dihydrogen monoxide | water |

      | NH3 | nitrogen trihydride | ammonia |

      | H2O2 | dihydrogen dioxide | hydrogen peroxide |

      | CH4 | — | methane |


      **Polyatomic ions** are charged groups of atoms that stay together through most
      reactions. You must memorize the most common ones:


      | Ion | Name | Charge |

      |---|---|---|

      | SO4²⁻ | sulfate | 2− |

      | SO3²⁻ | sulfite | 2− |

      | NO3⁻ | nitrate | 1− |

      | NO2⁻ | nitrite | 1− |

      | CO3²⁻ | carbonate | 2− |

      | PO4³⁻ | phosphate | 3− |

      | OH⁻ | hydroxide | 1− |

      | NH4⁺ | ammonium | 1+ |

      | ClO4⁻ | perchlorate | 1− |

      | ClO3⁻ | chlorate | 1− |

      | MnO4⁻ | permanganate | 1− |

      | Cr2O7²⁻ | dichromate | 2− |


      When a polyatomic anion is present, the naming follows the same cation-then-anion
      pattern:

      - CaSO4 → calcium sulfate

      - Fe(NO3)3 → iron(III) nitrate (Fe must be 3+ to balance three NO3− ions)

      '
    check:
      id: special-check
      type: multipleChoice
      prompt: 'What is the formula for copper(II) sulfate?

        '
      choices:
      - id: a
        text: CuSO4
      - id: b
        text: Cu2SO4
      - id: c
        text: CuS
      - id: d
        text: Cu(SO4)2
      answer:

        choiceId: a
      explanation: 'Cu(II) = Cu2+; sulfate = SO4²−. One Cu2+ and one SO4²− balance
        charges (2+ and 2−). Formula: CuSO4.

        '
