questions:
- id: q001
  type: multipleChoice
  prompt: 'Two chords, $AB$ and $CD$, intersect inside a circle at point $E$. If $AE = 4$, $EB = 9$, and $CE = 6$, what is the length of $ED$?'
  difficultyDimensions:
  - Recall the Intersecting Chords Theorem: $AE \cdot EB = CE \cdot ED$.
  - Set up equation: $4 \cdot 9 = 6 \cdot ED$.
  - Solve for $ED$: $36 = 6 \cdot ED \implies ED = 6$.
  choices:
  - id: a
    text: '$13.5$'
    issueSignals:
    - sum-confusion
  - id: b
    text: '$6$'
  - id: c
    text: '$12$'
    issueSignals:
    - arithmetic-error
  - id: d
    text: '$7$'
    issueSignals:
    - addition-instead-of-multiplication
  answer:
    choiceId: b
  explanation: |
    Solution:
    By the Intersecting Chords Theorem (a form of Power of a Point), the product of the segments of one chord is equal to the product of the segments of the other chord.
    $AE \times EB = CE \times ED$
    $4 \times 9 = 6 \times ED$
    $36 = 6 \times ED$
    $ED = 6$.

    Why it works:
    This theorem is a direct consequence of similar triangles. If you draw chords $AC$ and $BD$, $\triangle AEC$ is similar to $\triangle DEB$ because they share vertical angles at $E$ and inscribed angles that intercept the same arcs.

    Why the other choices fail:
    - $13.5$ is $9 + 4.5$ or something similar, perhaps from setting up $4/9 = 6/x \implies 4x = 54 \implies x = 13.5$. This happens if you set up the ratios incorrectly.
    - $7$ is from adding the segments instead of multiplying ($4 + 9 = 6 + x \implies 13 = 6 + x \implies x = 7$).

- id: q002
  type: multipleChoice
  prompt: 'Two secants are drawn to a circle from an external point $P$. The first secant intersects the circle at $A$ and $B$, with $A$ closer to $P$. The second secant intersects the circle at $C$ and $D$, with $C$ closer to $P$. If $PA = 5$, $AB = 7$, and $PC = 4$, what is the length of $CD$?'
  difficultyDimensions:
  - Recall the Secant-Secant Theorem: outside $\cdot$ whole = outside $\cdot$ whole.
  - Calculate whole lengths: $PB = 5 + 7 = 12$. $PD = 4 + CD$.
  - Set up equation: $5 \cdot 12 = 4 \cdot (4 + CD)$.
  - Solve for $CD$: $60 = 16 + 4 \cdot CD \implies 44 = 4 \cdot CD \implies CD = 11$.
  choices:
  - id: a
    text: '$15$'
    issueSignals:
    - full-length-confusion
  - id: b
    text: '$11$'
  - id: c
    text: '$8.75$'
    issueSignals:
    - outside-inside-multiplication-error
  - id: d
    text: '$35$'
    issueSignals:
    - arithmetic-error
  answer:
    choiceId: b
  explanation: |
    Solution:
    By the Secant-Secant Power Theorem, $\text{outside} \times \text{whole} = \text{outside} \times \text{whole}$.
    For the first secant, the outside is $PA = 5$. The whole secant is $PB = 5 + 7 = 12$.
    For the second secant, the outside is $PC = 4$. Let the whole secant be $x$.
    $5 \times 12 = 4 \times x$
    $60 = 4x \implies x = 15$.
    The whole length $PD$ is 15. The question asks for the internal chord $CD$.
    $CD = 15 - 4 = 11$.

    Why it works:
    A common mistake is to multiply the outside segment by the inside segment ($PA \times AB = PC \times CD$). The theorem strictly requires multiplying the outside by the ENTIRE secant length.

    Why the other choices fail:
    - $15$ is the length of the whole secant $PD$, but the question specifically asks for the chord segment $CD$.
    - $8.75$ comes from the classic trap of multiplying outside by inside ($5 \times 7 = 4 \times CD \implies 35 = 4 \times CD \implies 8.75$).
    - $35$ is the product of the outside and inside ($5 \times 7$).

- id: q003
  type: multipleChoice
  prompt: 'A tangent segment $PT$ and a secant segment $PAB$ are drawn to a circle from an external point $P$. The secant intersects the circle at $A$ and $B$, with $A$ closer to $P$. If $PT = 10$ and $PA = 5$, what is the length of the chord $AB$?'
  difficultyDimensions:
  - Recall the Tangent-Secant Theorem: tangent$^2$ = outside $\cdot$ whole.
  - Set up equation: $10^2 = 5 \cdot PB$.
  - Solve for $PB$: $100 = 5 \cdot PB \implies PB = 20$.
  - Calculate chord $AB$: $20 - 5 = 15$.
  choices:
  - id: a
    text: '$20$'
    issueSignals:
    - full-length-confusion
  - id: b
    text: '$15$'
  - id: c
    text: '$50$'
    issueSignals:
    - squared-error
  - id: d
    text: '$4$'
    issueSignals:
    - outside-inside-multiplication-error
  answer:
    choiceId: b
  explanation: |
    Solution:
    By the Tangent-Secant Power Theorem, $\text{tangent}^2 = \text{outside} \times \text{whole}$.
    $PT^2 = PA \times PB$
    $10^2 = 5 \times PB$
    $100 = 5 \times PB$
    $PB = 20$.
    The entire secant $PB$ is 20. We need the chord length $AB$.
    $AB = PB - PA = 20 - 5 = 15$.

    Why it works:
    You can think of a tangent as a secant where both intersection points ($A$ and $B$) have merged into a single point ($T$). Thus, "outside $\times$ whole" becomes "$PT \times PT$" or $PT^2$.

    Why the other choices fail:
    - $20$ is the length of the whole secant $PB$.
    - $50$ comes from forgetting to square the tangent, doing $10 \times 10 / 2$ maybe, or $100 / 2$.
    - $4$ comes from doing tangent = outside $\times$ inside, $10 = 5 \times AB$ wait no, maybe $20 = 5 \times AB$. If $10^2 = 5 \times AB$, then $100 = 5 \times AB \implies AB = 20$.

- id: q004
  type: multipleChoice
  prompt: 'A circle has radius $r = 10$. A point $P$ is located 6 units away from the center of the circle. What is the Power of Point $P$?'
  difficultyDimensions:
  - Recall the formal definition of Power of a Point: $d^2 - r^2$ for exterior points, or $r^2 - d^2$ for interior points (often taught as negative for interior).
  - Absolute power is $|d^2 - r^2|$.
  - Calculate: $|6^2 - 10^2| = |36 - 100| = 64$.
  choices:
  - id: a
    text: '$64$'
  - id: b
    text: '$-136$'
    issueSignals:
    - sum-squared-error
  - id: c
    text: '$16$'
    issueSignals:
    - distance-radius-confusion
  - id: d
    text: '$4$'
    issueSignals:
    - linear-difference-error
  answer:
    choiceId: a
  explanation: |
    Solution:
    The magnitude of the Power of a Point $P$ with respect to a circle is given by $|d^2 - r^2|$, where $d$ is the distance from $P$ to the center of the circle, and $r$ is the radius.
    $d = 6$, $r = 10$.
    Power $= |6^2 - 10^2|$
    Power $= |36 - 100| = 64$.
    (Note: Some texts define the power of an interior point as strictly negative, $-64$, but the magnitude of the power is $64$).

    Why it works:
    If you draw a chord through the center (a diameter) passing through point $P$, the two segments of the chord are $(r + d)$ and $(r - d)$. By the intersecting chords theorem, their product is $(r+d)(r-d) = r^2 - d^2$. 

    Why the other choices fail:
    - $-136$ comes from $-(d^2 + r^2) = -(36 + 100) = -136$.
    - $16$ comes from $(10 - 6)^2 = 4^2 = 16$.
    - $4$ is just the straight distance $r - d = 10 - 6$.

- id: q005
  type: multipleChoice
  prompt: 'Two chords $WX$ and $YZ$ intersect at point $V$ inside a circle. If $WV = 3$, $VX = 8$, and $YV = 4$, what is the length of the entire chord $YZ$?'
  difficultyDimensions:
  - Use intersecting chords theorem: $3 \cdot 8 = 4 \cdot VZ$.
  - Solve for $VZ$: $24 = 4 \cdot VZ \implies VZ = 6$.
  - Add segments to find full chord: $YZ = YV + VZ = 4 + 6 = 10$.
  choices:
  - id: a
    text: '$6$'
    issueSignals:
    - partial-length-confusion
  - id: b
    text: '$10$'
  - id: c
    text: '$24$'
    issueSignals:
    - multiplication-error
  - id: d
    text: '$7$'
    issueSignals:
    - addition-error
  answer:
    choiceId: b
  explanation: |
    Solution:
    Use the Intersecting Chords Theorem:
    $WV \times VX = YV \times VZ$
    $3 \times 8 = 4 \times VZ$
    $24 = 4 \times VZ$
    $VZ = 6$.
    The question asks for the length of the *entire* chord $YZ$.
    $YZ = YV + VZ = 4 + 6 = 10$.

    Why it works:
    Always double-check what the question is asking for! Power of a Point formulas give you the pieces, but you often have to add them back together to find the full length.

    Why the other choices fail:
    - $6$ is the length of just the segment $VZ$, not the full chord.
    - $24$ is the product of the segments ($3 \times 8$).
    - $7$ is from adding instead of multiplying ($3 + 8 = 11$, so $4 + x = 11 \implies x = 7$. Then $YZ = 4 + 7 = 11$ wait, 7 is just $x$).
