schemaVersion: 1
id: aops-proportions-glossary
title: Proportions Glossary
assessmentType: glossary
categoryId: art-of-problem-solving
topicId: aops-proportions
modeDefault: practice
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: glossary
  tags:
  - art-of-problem-solving
  - aops-proportions
  - ratio-vocabulary
  - percent-vocabulary
skills:
- Interpret ratio, rate, variation, and scale terminology
- Identify percent baselines and conversion-factor orientation
- Recognize invariants that justify proportional models
glossary:
  introduction: |-
    Proportional reasoning depends on naming the comparison and its invariant. These terms distinguish a one-time ratio from a constant-ratio model, a constant-product model, a unit conversion, and a percentage comparison.
  sections:
  - id: ratios-rates-and-variation
    title: Ratios, Rates, and Variation
    required: true
    content: Ratios compare quantities; variation models describe how that comparison remains constant.
    entries:
    - id: ratio
      term: Ratio
      definition: An ordered comparison of two quantities by division.
      notation: '$a:b$ or $a/b$'
      examples: ['The ratio $3:5$ is not the same ordered comparison as $5:3$.']
      aliases: []
      media: []
      tags: [ratio]
      drills:
      - id: ratio-drill
        type: flashcard
        prompt: Why does the order of a ratio matter?
        answer:
          expected: Reversing the quantities takes the reciprocal and changes the comparison.
        explanation: $a/b$ and $b/a$ are generally different.
        tags: [ratio]
    - id: proportion
      term: Proportion
      definition: An equation asserting that two defined ratios are equal.
      notation: '$a/b=c/d$'
      examples: ['$6/9=20/30$ is a true proportion.']
      aliases: []
      media: []
      tags: [proportion]
      drills:
      - id: proportion-drill
        type: flashcard
        prompt: What denominator condition is required in $a/b=c/d$?
        answer:
          expected: b and d must both be nonzero.
        explanation: Otherwise one or both original ratios are undefined.
        tags: [proportion]
    - id: rate
      term: Rate
      definition: A ratio comparing quantities with different units.
      notation: null
      examples: ['50 miles per hour compares distance with time.']
      aliases: []
      media: []
      tags: [rate]
      drills:
      - id: rate-drill
        type: typed
        prompt: What type of comparison is 180 parts per 12 minutes?
        answer:
          expected: rate
          aliases: [a rate]
        explanation: The quantities use different units.
        tags: [rate]
    - id: unit-rate
      term: Unit Rate
      definition: A rate whose denominator quantity is one unit.
      notation: null
      examples: ['180 parts in 12 minutes is 15 parts per minute.']
      aliases: []
      media: []
      tags: [unit-rate]
      drills:
      - id: unit-rate-drill
        type: typed
        prompt: Find the unit rate for 72 miles in 3 hours.
        answer:
          expected: 24 miles per hour
          aliases: [24 mph]
        explanation: Divide both quantities by 3 hours.
        tags: [unit-rate]
    - id: direct-variation
      term: Direct Variation
      definition: A relationship $y=kx$ that keeps the ratio $y/x=k$ constant for nonzero $x$.
      notation: '$y=kx$'
      examples: ['At a fixed price per item, total cost varies directly with item count.']
      aliases: [direct proportion]
      media: []
      tags: [direct-variation]
      drills:
      - id: direct-variation-drill
        type: flashcard
        prompt: What invariant identifies direct variation?
        answer:
          expected: The ratio y/x is constant.
        explanation: Equal multiplicative changes in $x$ and $y$ preserve the ratio.
        tags: [direct-variation]
    - id: inverse-variation
      term: Inverse Variation
      definition: A relationship $y=k/x$ that keeps the product $xy=k$ constant.
      notation: '$xy=k$'
      examples: ['For a fixed job, workers and days vary inversely at equal productivity.']
      aliases: [inverse proportion]
      media: []
      tags: [inverse-variation]
      drills:
      - id: inverse-variation-drill
        type: flashcard
        prompt: What invariant identifies inverse variation?
        answer:
          expected: The product xy is constant.
        explanation: Multiplying one quantity by a factor divides the other by that factor.
        tags: [inverse-variation]
  - id: scale-units-and-percent
    title: Scale, Units, and Percent
    required: true
    content: Scaling and percent problems remain proportional only when their dimensions and reference amounts are tracked.
    entries:
    - id: scale-factor
      term: Scale Factor
      definition: The multiplier relating corresponding lengths in similar or scaled figures.
      notation: '$s$'
      examples: ['A linear scale factor 3 multiplies every corresponding side length by 3.']
      aliases: [linear scale factor]
      media: []
      tags: [scale-factor]
      drills:
      - id: scale-factor-drill
        type: flashcard
        prompt: How does area scale under a linear scale factor $s$?
        answer:
          expected: By a factor of s squared.
          aliases: ['$s^2$']
        explanation: Area contains two length dimensions.
        tags: [scale-factor]
    - id: conversion-factor
      term: Conversion Factor
      definition: A ratio of equal quantities expressed in different units, hence numerically equal to one.
      notation: null
      examples: ['$100\text{ cm}/1\text{ m}$ converts meters to centimeters.']
      aliases: []
      media: []
      tags: [conversion-factor]
      drills:
      - id: conversion-factor-drill
        type: flashcard
        prompt: How should a conversion factor be oriented?
        answer:
          expected: So the unwanted unit cancels and the desired unit remains.
        explanation: Visible cancellation checks the factor direction.
        tags: [conversion-factor]
    - id: percent
      term: Percent
      definition: A ratio measured per hundred relative to a stated reference amount.
      notation: '$r\%=r/100$'
      examples: ['25% of 80 is $(25/100)80=20$.']
      aliases: [percentage]
      media: []
      tags: [percent]
      drills:
      - id: percent-drill
        type: typed
        prompt: Write 18% as a decimal multiplier.
        answer:
          expected: '0.18'
          aliases: [.18]
        explanation: Divide the percentage by 100.
        tags: [percent]
    - id: percent-change
      term: Percent Change
      definition: The change divided by the original reference amount, usually expressed as a percentage.
      notation: '$(\text{new}-\text{old})/\text{old}$'
      examples: ['A rise from 80 to 100 is $20/80=25\%$.']
      aliases: [relative change]
      media: []
      tags: [percent-change]
      drills:
      - id: percent-change-drill
        type: flashcard
        prompt: Which amount belongs in the denominator of a standard percent-change calculation?
        answer:
          expected: The original amount.
        explanation: Percent change measures change relative to the starting baseline.
        tags: [percent-change]
    - id: baseline
      term: Percentage Baseline
      definition: The reference amount from which a percentage is calculated.
      notation: null
      examples: ['Tax after a discount usually uses the discounted price as its baseline.']
      aliases: [reference amount]
      media: []
      tags: [baseline]
      drills:
      - id: baseline-drill
        type: flashcard
        prompt: Why may successive equal percentage increases and decreases fail to cancel?
        answer:
          expected: The second percentage is computed from a different baseline.
        explanation: Multiplicative factors track the changing reference amount.
        tags: [baseline]
    - id: concentration
      term: Concentration
      definition: The ratio of the amount of a component to the total mixture amount.
      notation: '$\text{component}/\text{total}$'
      examples: ['A 30% acid solution contains 0.30 times its total volume as acid.']
      aliases: [mixture concentration]
      media: []
      tags: [concentration]
      drills:
      - id: concentration-drill
        type: flashcard
        prompt: What changes in the denominator when pure juice is added to a juice mixture?
        answer:
          expected: The total mixture amount increases by the amount added.
        explanation: Concentration compares component amount with the new total.
        tags: [concentration]
