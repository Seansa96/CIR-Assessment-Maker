  - id: step4
    title: Write the governing relation
    instruction: Derive the speed in air for the Speed of Sound model. Combining the fluid continuity
      relation with Newton's law for a compressed element gives $v^2=(\partial p/\partial\rho)_s$; ideal
      air gives $v=\sqrt{\gamma RT/M}$.
    prompt: 'Complete derivation step 4: Write the governing relation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      gradingMode: selfCheck
      expected: A correct derivation step using $v\approx331+0.6T_C.
    explanation: Combining the fluid continuity relation with Newton's law for a compressed element gives
      $v^2=(\partial p/\partial\rho)_s$; ideal air gives $v=\sqrt{\gamma RT/M}$. This is step 4 of the
      derivation.
