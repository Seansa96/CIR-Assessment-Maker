workedExamples:
- id: we-speed-of-sound
  title: Deriving and applying Speed of Sound
  problem: Use the labeled model to derive and calculate the speed in air from $v\approx331+0.6T_C$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the medium properties. The problem gives the Bulk modulus $B$ and density $\rho$ of water.
    prompt: 'Identify the parameters.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Bulk modulus B, density \rho'
    explanation: >-
      Bulk modulus $B$ and density $\rho$ are given.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the assumption about the medium's state.
    prompt: 'What is assumed?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Homogeneous fluid medium.'
    explanation: >-
      We assume water is a homogeneous fluid behaving adiabatically to high-frequency pressure changes.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target variable.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Speed of sound v'
    explanation: >-
      Calculate the speed of sound $v$ in water.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the general equation for the speed of sound in a fluid.
    prompt: 'Write the governing equation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'v = \sqrt{B/\rho}'
    explanation: >-
      $v = \sqrt{B / \rho}$
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the target variable (it is already isolated).
    prompt: 'Isolate the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'v = \sqrt{B/\rho}'
    explanation: >-
      The equation is ready to use.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given $B = 2.2 \times 10^9$ Pa and $\rho = 1000$ kg/m$^3$, calculate $v$.
    prompt: 'Calculate the speed.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      value: 343.0
      tolerance: 3.43
    explanation: >-
      $v = \sqrt{2.2 \times 10^9 / 1000} = \sqrt{2.2 \times 10^6} \approx 1483$ m/s.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the units of $\sqrt{B/\rho}$.
    prompt: 'What are the units?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'm/s'
    explanation: >-
      $\sqrt{(\text{N/m}^2)/(\text{kg/m}^3)} = \sqrt{\text{m}^2/\text{s}^2} = \text{m/s}$.
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated speed of sound.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      value: 343.0
      tolerance: 3.43
    explanation: >-
      The speed of sound in water is $1483$ m/s.
