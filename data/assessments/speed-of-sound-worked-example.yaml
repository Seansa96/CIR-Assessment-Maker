workedExamples:
- id: we-speed-of-sound
  title: Deriving and applying Speed of Sound
  problem: Use the labeled model to derive and calculate the speed in air from $v\approx331+0.6T_C$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: Identify the medium properties. The problem gives the Bulk modulus $B$ and density $\rho$ of water.
    prompt: Identify the parameters.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Bulk modulus B, density \rho
    explanation: 'Solution: Bulk modulus $B$ and density $\rho$ are given.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step2
    title: State the assumptions
    instruction: State the assumption about the medium's state.
    prompt: What is assumed?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Homogeneous fluid medium.
    explanation: 'Solution: We assume water is a homogeneous fluid behaving adiabatically to high-frequency pressure changes.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step3
    title: Name the target
    instruction: Identify the target variable.
    prompt: Name the target.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Speed of sound v
    explanation: 'Solution: Calculate the speed of sound $v$ in water.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step4
    title: Write the governing relation
    instruction: Write the general equation for the speed of sound in a fluid.
    prompt: Write the governing equation.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - v = \sqrt{B/\rho}
    explanation: 'Solution: $v = \sqrt{B / \rho}$


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step5
    title: Isolate the target
    instruction: Isolate the target variable (it is already isolated).
    prompt: Isolate the target.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - v = \sqrt{B/\rho}
    explanation: 'Solution: The equation is ready to use.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step6
    title: Substitute the known values
    instruction: Given $B = 2.2 \times 10^9$ Pa and $\rho = 1000$ kg/m$^3$, calculate $v$.
    prompt: Calculate the speed.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      value: 343.0
      tolerance: 3.43
    explanation: 'Solution: $v = \sqrt{2.2 \times 10^9 / 1000} = \sqrt{2.2 \times 10^6} \approx 1483$ m/s.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step7
    title: Check units and limiting behavior
    instruction: Check the units of $\sqrt{B/\rho}$.
    prompt: What are the units?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - m/s
    explanation: 'Solution: $\sqrt{(\text{N/m}^2)/(\text{kg/m}^3)} = \sqrt{\text{m}^2/\text{s}^2} = \text{m/s}$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step8
    title: State the result
    instruction: State the final calculated speed of sound.
    prompt: State the result.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    answer:
      value: 343.0
      tolerance: 3.43
    explanation: 'Solution: The speed of sound in water is $1483$ m/s.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
- id: air-temperature-we002
  title: Sound Speed at a Different Air Temperature
  problem: Estimate the speed of sound in air at $30^\circ\text{C}$ using $v\approx331+0.6T_C$.
  steps:
  - id: air-temperature-we002-step-1
    title: Substitute the temperature
    instruction: 'Complete this step.'
    type: numericResponse
    prompt: Calculate sound speed in meters per second.
    answer: {value: 349, tolerance: 0.1}
    explanation: 'Solution: $v=331+0.6(30)=349\ \text{m/s}$. Why it works: the Celsius approximation estimates ordinary-air sound speed.'
  - id: air-temperature-we002-step-2
    title: Compare with cooler air
    instruction: 'Complete this step.'
    type: multipleChoice
    prompt: Is this speed greater or less than the value at $20^\circ\text{C}$?
    choices: [{id: a, text: Greater}, {id: b, text: Less}, {id: c, text: Equal}, {id: d, text: Cannot be determined}]
    answer: {choiceId: a}
    explanation: 'Solution: It is greater. Why it works: higher air temperature increases sound speed. Why the other choices fail: the linear approximation has a positive temperature coefficient, so less or equal contradicts it and all values are specified.'
