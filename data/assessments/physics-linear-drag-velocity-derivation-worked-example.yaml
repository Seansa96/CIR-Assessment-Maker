- id: ex-linear-drag-velocity
  title: Coasting with Air Resistance
  problem: |
    Let's derive the velocity as a function of time for an object coasting horizontally with only a linear drag force acting on it.
  steps:
  - id: step-1
    title: Step 1 — Set up the Differential Equation
    instruction: |
      We start with Newton's second law ($F_{\text{net}} = m \frac{dv}{dt}$) and the linear resistive force $\vec F_d = -b\vec v$.
      Since drag is the only force, $m \frac{dv}{dt} = -bv$.
    type: multipleChoice
    prompt: Why can't we use the standard kinematic equation $v = v_0 + at$ here?
    choices:
    - id: a
      text: Because the acceleration $a$ is not constant; it depends on velocity.
    - id: b
      text: Because the mass is changing.
    - id: c
      text: Because drag only happens in fluids.
    answer:
      choiceId: a
    explanation: 'Solution: Do not use constant-acceleration kinematics.\n\nWhy it works: $a=-bv/m$ changes as velocity changes.\n\nWhy the other choices fail: Mass does not change, and fluid drag can require calculus.'
  - id: step-2
    title: Step 2 — Separate Variables
    instruction: |
      To solve the differential equation $m \frac{dv}{dt} = -bv$, we separate the variables by moving all $v$ terms to the left and $t$ terms to the right.
    type: symbolicResponse
    prompt: What is the resulting equation if we isolate $dv/v$ on the left side? (Write the expression for the right side)
    answer:
      gradingMode: auto
      expectedLatex: -\frac{b}{m} dt
      equivalenceMode: expression
      tolerance: 0
    explanation: 'Solution: $dv/v=-(b/m)dt$.\n\nWhy it works: Separating variables places velocity and time differentials on opposite sides.'
  - id: step-3
    title: Step 3 — Integrate and Exponentiate
    instruction: |
      Integrate the left side from $v_0$ to $v$, and the right side from $0$ to $t$.
      $\int_{v_0}^v \frac{1}{v} dv = \int_0^t -\frac{b}{m} dt$
      This yields $\ln(v) - \ln(v_0) = -\frac{b}{m} t$, which simplifies to $\ln(v/v_0) = -\frac{b}{m} t$.
    type: symbolicResponse
    prompt: To remove the natural log, we raise $e$ to the power of both sides. What is the final formula for $v(t)$?
    answer:
      gradingMode: auto
      expectedLatex: v_0 e^{-bt/m}
      equivalenceMode: expression
      tolerance: 0
    explanation: 'Solution: $v(t)=v_0e^{-bt/m}$.\n\nWhy it works: Exponentiating reverses the logarithm after integration.'

- id: linear-drag-we002
  title: Evaluate Linear Drag Decay
  problem: 'A 2.0 kg cart has linear drag coefficient $b=1.0\ \mathrm{kg/s}$ and initial speed 10 m/s. Find its speed after 2.0 s.'
  steps:
  - id: ldwe4
    title: Substitute into the decay law
    instruction: Use $v=v_0e^{-bt/m}$.
    type: numericResponse
    prompt: 'What is the speed after 2.0 s in m/s?'
    answer: { value: 3.6788, tolerance: 0.01 }
    explanation: 'Solution: $v=10e^{-(1.0)(2.0)/2.0}=10e^{-1}=3.68$ m/s.\n\nWhy it works: Linear drag causes exponential velocity decay.'
  - id: ldwe5
    title: Interpret the result
    instruction: Compare the speed to initial speed.
    type: freeResponse
    prompt: 'Has the cart stopped after 2.0 s?'
    answer: { gradingMode: selfCheck, keyPoints: ['no', 'speed remains positive'] }
    explanation: 'Solution: No; its speed is still positive.\n\nWhy it works: Exponential decay approaches zero asymptotically.'
