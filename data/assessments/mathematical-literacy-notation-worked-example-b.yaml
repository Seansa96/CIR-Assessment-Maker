workedExamples:
- id: mathematical-literacy-notation-worked-example-b-example
  title: Read grouped Cartesian-product notation
  problem: 'A source writes $\mathbb R\times(\mathbb N\times\mathbb Z)$. Explain why an element has nested-pair
    form rather than three ungrouped coordinates.'
  steps:
  - id: step-1
    title: Read the outer product
    type: freeResponse
    prompt: What must the first coordinate belong to?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - 'The first coordinate belongs to $\mathbb R$.'
    explanation: |-
      Solution: The first coordinate belongs to $\mathbb R$.
      Why it works: The outer product places a real number in its first factor.
  - id: step-2
    title: Keep the inner grouping
    type: freeResponse
    prompt: What form must the second component have?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - 'The second component is an ordered pair $(n,z)$ with $n\in\mathbb N$ and $z\in\mathbb Z$.'
    explanation: |-
      Solution: The second component is an ordered pair $(n,z)$ with $n\in\mathbb N$ and $z\in\mathbb Z$.
      Why it works: Parentheses preserve the inner Cartesian product as one component.
  - id: step-3
    title: State the full element shape
    type: freeResponse
    prompt: Write the complete shape of one element.
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - An element has the form $(r,(n,z))$.
    explanation: |-
      Solution: An element has the form $(r,(n,z))$.
      Why it works: The grouped product is not the same structure as an unparenthesized ordered triple.
