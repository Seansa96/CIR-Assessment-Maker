workedExamples:
- id: mathematical-literacy-notation-worked-example-b-example
  title: Read grouped Cartesian-product notation
  problem: 'A source writes $\mathbb R\times(\mathbb N\times\mathbb Z)$. Explain why an element has nested-pair
    form rather than three ungrouped coordinates.'
  steps:
  - id: step-1
    title: Read the outer product
    type: multipleChoice
    prompt: What must the first coordinate belong to?
    choices:
    - id: a
      text: '$\mathbb{R}$'
      issueSignals: []
    - id: b
      text: '$\mathbb{N}$'
      issueSignals:
      - id: mathematical-structure-recognition-error
    - id: c
      text: '$\mathbb{Z}$'
      issueSignals:
      - id: mathematical-structure-recognition-error
    - id: d
      text: '$\mathbb{N}\times\mathbb{Z}$'
      issueSignals:
      - id: mathematical-structure-recognition-error
    answer:
      choiceId: a
    explanation: |-
      Solution: The first coordinate belongs to $\mathbb{R}$.
      Why it works: The outer product places a real number in its first factor.
      Why the other choices fail: The factors are ordered from left to right. The first factor is $\mathbb{R}$, not the inner grouped product or its components.
  - id: step-2
    title: Keep the inner grouping
    type: multipleChoice
    prompt: What form must the second component have?
    choices:
    - id: a
      text: 'An ordered pair $(n,z)$ with $n\in\mathbb{N}$ and $z\in\mathbb{Z}$'
      issueSignals: []
    - id: b
      text: 'Two separate components $n\in\mathbb{N}$ and $z\in\mathbb{Z}$'
      issueSignals:
      - id: mathematical-structure-recognition-error
    - id: c
      text: 'An ordered pair $(z,n)$ with $z\in\mathbb{Z}$ and $n\in\mathbb{N}$'
      issueSignals:
      - id: mathematical-structure-recognition-error
    - id: d
      text: 'A real number $r\in\mathbb{R}$'
      issueSignals:
      - id: mathematical-structure-recognition-error
    answer:
      choiceId: a
    explanation: |-
      Solution: The second component is an ordered pair $(n,z)$ with $n\in\mathbb{N}$ and $z\in\mathbb{Z}$.
      Why it works: Parentheses preserve the inner Cartesian product as one component.
      Why the other choices fail: Without maintaining the ordered pair structure, it would be an ordered triple. The order of $\mathbb{N}$ and $\mathbb{Z}$ also cannot be swapped.
  - id: step-3
    title: State the full element shape
    type: multipleChoice
    prompt: Write the complete shape of one element.
    choices:
    - id: a
      text: '$(r,(n,z))$'
      issueSignals: []
    - id: b
      text: '$(r,n,z)$'
      issueSignals:
      - id: mathematical-structure-recognition-error
    - id: c
      text: '$((r,n),z)$'
      issueSignals:
      - id: mathematical-structure-recognition-error
    - id: d
      text: '$\{r,n,z\}$'
      issueSignals:
      - id: mathematical-structure-recognition-error
    answer:
      choiceId: a
    explanation: |-
      Solution: An element has the form $(r,(n,z))$.
      Why it works: The grouped product is not the same structure as an unparenthesized ordered triple.
      Why the other choices fail: Dropping the inner parentheses produces an ordered triple, and grouping the first two terms produces a different nested product. Set braces denote an unordered set, not a Cartesian product element.
