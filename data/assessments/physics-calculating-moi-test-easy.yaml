- id: q015
  title: Composite strategy
  type: multipleChoice
  prompt: 'For a composite object, the usual strategy is to:'
  choices:
  - id: a
    text: add included pieces and subtract removed pieces
  - id: b
    text: average all radii
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: c
    text: ignore small pieces
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: d
    text: use only the largest piece
    issueSignals:
    - id: rotational-concept-misunderstood
  answer:
    choiceId: a
  explanation: 'Solution:

    add included pieces and subtract removed pieces


    Why it works:

    Moment of inertia is additive about a common axis.


    Why the other choices fail:

    The distractors relate to common errors in fixed-axis rotation, such as confusing
    linear and angular kinematics, using the wrong lever arm, or misunderstanding
    moment of inertia.

    '
