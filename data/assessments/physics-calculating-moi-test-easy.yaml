randomizeQuestions: true
questions:
- id: q1
  type: multipleChoice
  prompt: 'Which has a larger moment of inertia about its center of mass: a solid
    sphere or a hollow spherical shell of the same mass and radius?'
  choices:
  - id: c1
    content: Solid sphere
  - id: c2
    content: Hollow spherical shell
  - id: c3
    content: They have the same moment of inertia.
  answer:
    choiceId: c2
  explanation: The hollow shell has mass further from the axis of rotation ($I = \frac{2}{3}MR^2$)
    compared to the solid sphere ($I = \frac{2}{5}MR^2$).
