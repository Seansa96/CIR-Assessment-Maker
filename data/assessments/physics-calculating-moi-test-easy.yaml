questions:
- id: q001
  title: Single point mass
  type: numericResponse
  prompt: A $2.0\text{ kg}$ point mass is $3.0\text{ m}$ from an axis. What is $I$?
  answer:
    value: 18.0
    tolerance: 0.1
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $I=mr^2=(2)(3^2)=18\text{ kg}\cdot\text{m}^2$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q002
  title: Two point masses
  type: numericResponse
  prompt: Masses $1.0\text{ kg}$ at $2.0\text{ m}$ and $3.0\text{ kg}$ at $1.0\text{
    m}$ rotate about the same axis. What is total $I$?
  answer:
    value: 7.0
    tolerance: 0.1
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $I=1(2^2)+3(1^2)=7$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q003
  title: Thin hoop
  type: numericResponse
  prompt: A hoop has $M=4.0\text{ kg}$ and $R=0.50\text{ m}$. What is $I$?
  answer:
    value: 1.0
    tolerance: 0.02
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $I=MR^2=4(0.5)^2=1.0$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q004
  title: Solid disk
  type: numericResponse
  prompt: A solid disk has $M=6.0\text{ kg}$ and $R=0.20\text{ m}$. What is central
    $I$?
  answer:
    value: 0.12
    tolerance: 0.005
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $I=\frac12MR^2=0.12$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q005
  title: Rod about center
  type: numericResponse
  prompt: A rod has $M=3.0\text{ kg}$ and $L=2.0\text{ m}$. What is $I$ about its
    center?
  answer:
    value: 1.0
    tolerance: 0.02
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $I=\frac1{12}ML^2=1.0$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q006
  title: Rod about end
  type: numericResponse
  prompt: A rod has $M=3.0\text{ kg}$ and $L=2.0\text{ m}$. What is $I$ about one
    end?
  answer:
    value: 4.0
    tolerance: 0.05
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $I=\frac13ML^2=4.0$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q007
  title: Parallel axis theorem
  type: numericResponse
  prompt: A disk has central $I=0.40$ and mass $5.0\text{ kg}$. Find $I$ about a parallel
    axis $0.30\text{ m}$ away.
  answer:
    value: 0.85
    tolerance: 0.02
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $I=I_{cm}+Md^2=0.40+5(0.30)^2=0.85$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q008
  title: Distance weighting
  type: multipleChoice
  prompt: Why does distant mass matter strongly for $I$?
  choices:
  - id: a
    text: Distance is squared in $I=\sum mr^2$.
  - id: b
    text: Mass is squared.
    issueSignals:
    - id: inertia-mass-confusion
  - id: c
    text: Torque is perpendicular.
    issueSignals:
    - id: torque-force-confusion
    - id: trigonometry-error
  - id: d
    text: All point masses have equal $I$.
    issueSignals:
    - id: inertia-mass-confusion
  answer:
    choiceId: a
  explanation: 'Solution:

    Distance is squared in $I=\sum mr^2$.


    Why it works:

    $r^2$ weighting makes distant mass especially important.


    Why the other choices fail:

    The distractors relate to common errors in fixed-axis rotation, such as confusing
    linear and angular kinematics, using the wrong lever arm, or misunderstanding
    moment of inertia.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q009
  title: Solid sphere
  type: numericResponse
  prompt: A solid sphere has $M=10\text{ kg}$ and $R=0.50\text{ m}$. What is $I$ about
    a diameter?
  answer:
    value: 1.0
    tolerance: 0.02
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $I=\frac25MR^2=1.0$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q010
  title: Radius scaling
  type: multipleChoice
  prompt: If mass is fixed and radius doubles for a similar shape, how does $I$ scale?
  choices:
  - id: a
    text: It becomes four times larger.
  - id: b
    text: It doubles.
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: c
    text: It becomes eight times larger.
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: d
    text: It is unchanged.
    issueSignals:
    - id: rotational-concept-misunderstood
  answer:
    choiceId: a
  explanation: 'Solution:

    It becomes four times larger.


    Why it works:

    $I\propto MR^2$, so doubling $R$ multiplies $I$ by $4$.


    Why the other choices fail:

    The distractors relate to common errors in fixed-axis rotation, such as confusing
    linear and angular kinematics, using the wrong lever arm, or misunderstanding
    moment of inertia.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
