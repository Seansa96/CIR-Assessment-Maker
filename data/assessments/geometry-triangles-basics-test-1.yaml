questions:
- title: Triangle Classification by Side
  prompt: |-
    A triangle has interior angles measuring $60^\circ$, $60^\circ$, and $60^\circ$. Classify the triangle by its side lengths.
  type: multipleChoice
  choices:
  - id: scalene
    content: Scalene
  - id: isosceles
    content: Isosceles
  - id: equilateral
    content: Equilateral
  answer:
    choiceId: equilateral
  explanation: The triangle has 3 equal angles, so it has 3 equal sides. It is Equilateral.
  skills:
  - geometry-triangles-basics
  id: q-geom-test-01
- title: Triangle Classification by Angle
  prompt: |-
    A triangle has interior angles measuring $100^\circ$, $50^\circ$, and $30^\circ$. Classify the triangle by its angles.
  type: multipleChoice
  choices:
  - id: acute
    content: Acute
  - id: right
    content: Right
  - id: obtuse
    content: Obtuse
  answer:
    choiceId: obtuse
  explanation: |-
    Since the largest angle is $100^\circ$, the triangle is obtuse.
  skills:
  - geometry-triangles-basics
  id: q-geom-test-02
- title: Exterior Angle Theorem
  prompt: |-
    The measures of two remote interior angles of a triangle are $52^\circ$ and $66^\circ$. What is the measure of the corresponding exterior angle in degrees?
  type: numericResponse
  answer:
    value: 118.0
    tolerance: 0
  explanation: |-
    The exterior angle is equal to the sum of the two remote interior angles: $52 + 66 = 118^\circ$.
  skills:
  - geometry-triangles-basics
  id: q-geom-test-03
