- title: Angle Sum Application
  prompt: |-
    In a triangle, two of the interior angles measure $49^\circ$ and $33^\circ$. What is the measure of the third interior angle in degrees?
  type: numericResponse
  answer:
    value: 98.0
    tolerance: 0
  explanation: |-
    The sum of interior angles is $180^\circ$. $180 - 49 - 33 = 98^\circ$.
  skills:
  - geometry-triangles-basics
  id: q-geom-test-07
