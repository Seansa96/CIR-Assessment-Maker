- title: Isosceles Base Angle
  prompt: |-
    In an isosceles triangle, the vertex angle measures $34^\circ$. What is the measure of one of the base angles in degrees?
  type: numericResponse
  answer:
    value: 73.0
    tolerance: 0
  explanation: |-
    The base angles are equal. $(180 - 34) / 2 = 73^\circ$.
  skills:
  - geometry-triangles-basics
  id: q-geom-test-14
