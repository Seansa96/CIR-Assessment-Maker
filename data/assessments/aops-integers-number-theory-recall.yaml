id: aops-integers-number-theory-recall
title: Using the Integers Recall Drill
assessmentType: recallDrill
categoryId: art-of-problem-solving
topicId: aops-integers-number-theory
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - art-of-problem-solving
  - aops-integers-number-theory
  - number-theory-vocabulary
skills:
- Recall divisibility, gcd/lcm, congruence, and base rules
- Recognize modular proof and cycle-selection cues
items:
- id: divisibility-definition
  type: flashcard
  prompt: Complete the definition of $d\mid n$.
  answer:
    expected: There is an integer k such that n=dk.
  explanation: The integer $k$ witnesses divisibility.
  tags: [divisibility]
- id: prime-definition
  type: flashcard
  prompt: How many positive divisors does a prime have?
  answer:
    expected: Exactly two.
  explanation: They are 1 and the prime itself.
  tags: [prime]
- id: one-classification
  type: typed
  prompt: Is 1 prime, composite, or neither?
  answer:
    expected: neither
    aliases: [neither prime nor composite]
  explanation: One has only one positive divisor.
  tags: [prime]
- id: divisor-count-rule
  type: flashcard
  prompt: How many positive divisors does $p^aq^b$ have for distinct primes $p,q$?
  answer:
    expected: (a+1)(b+1)
  explanation: Choose each divisor exponent independently.
  tags: [divisor-count]
- id: gcd-exponent-rule
  type: flashcard
  prompt: Which prime exponents are used in a gcd?
  answer:
    expected: The minimum shared exponents.
  explanation: A gcd must divide both numbers.
  tags: [gcd]
- id: lcm-exponent-rule
  type: flashcard
  prompt: Which prime exponents are used in an lcm?
  answer:
    expected: The maximum exponents appearing in either number.
  explanation: An lcm must be divisible by both numbers.
  tags: [lcm]
- id: gcd-lcm-product
  type: flashcard
  prompt: State the gcd-lcm product identity for positive integers $a,b$.
  answer:
    expected: gcd(a,b) times lcm(a,b) equals ab.
  explanation: Primewise minimum plus maximum equals the sum of the original exponents.
  tags: [gcd, lcm]
- id: congruence-definition
  type: flashcard
  prompt: What does $a\equiv b\pmod m$ mean?
  answer:
    expected: m divides a-b.
  explanation: Congruent integers differ by a multiple of the modulus.
  tags: [congruence]
- id: modular-cancellation-warning
  type: flashcard
  prompt: When may a common factor be cancelled modulo $m$?
  answer:
    expected: When the factor is invertible modulo m, in particular when it is coprime to m.
  explanation: Noninvertible cancellation can change the congruence class.
  tags: [congruence]
- id: units-digit-modulus
  type: typed
  prompt: Which modulus is used for a units-digit question?
  answer:
    expected: '10'
    aliases: [modulo 10]
  explanation: Equal residues modulo 10 have the same final decimal digit.
  tags: [modulus]
- id: base-digit-rule
  type: flashcard
  prompt: What restriction must every digit in base $b$ satisfy?
  answer:
    expected: It must be an integer from 0 through b-1.
  explanation: No digit may equal or exceed the base.
  tags: [positional-base]
- id: power-cycle-rule
  type: flashcard
  prompt: What must be established before reducing an exponent by a cycle length?
  answer:
    expected: The actual modular power cycle and its length.
  explanation: Reducing by the modulus itself is generally unjustified.
  tags: [power-cycle]
