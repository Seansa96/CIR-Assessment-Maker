items:
  - { id: r1, type: typed, prompt: 'Which two totals must balance in every nuclear equation?', answer: { expected: 'mass number and atomic number', aliases: ['mass numbers and atomic numbers', 'A and Z', 'nucleon number and nuclear charge'] }, explanation: 'Solution: Mass number and atomic number. Why it works: Conserving $A$ balances the nucleon inventory, while conserving $Z$ balances nuclear charge.' }
  - { id: r2, type: typed, prompt: 'How do daughter mass number $A$ and atomic number $Z$ change during alpha decay?', answer: { expected: 'A decreases by 4 and Z decreases by 2', aliases: ['A -4 and Z -2', 'mass number minus 4 atomic number minus 2'] }, explanation: 'Solution: $A$ decreases by 4 and $Z$ decreases by 2. Why it works: The emitted alpha particle is $^4_2He$.' }
  - { id: r3, type: typed, prompt: 'How do $A$ and $Z$ change during beta-minus decay?', answer: { expected: 'A is unchanged and Z increases by 1', aliases: ['A same Z plus 1', 'mass number unchanged atomic number increases by one'] }, explanation: 'Solution: $A$ is unchanged and $Z$ increases by 1. Why it works: A neutron becomes a proton while a beta particle is emitted, so the nucleon total stays fixed.' }
  - { id: r4, type: typed, prompt: 'What daughter-number change is shared by positron emission and electron capture?', answer: { expected: 'A is unchanged and Z decreases by 1', aliases: ['A same Z minus 1', 'mass number unchanged atomic number decreases by one'] }, explanation: 'Solution: $A$ is unchanged and $Z$ decreases by 1. Why it works: Each process converts a proton into a neutron without changing the total number of nucleons.' }
  - { id: r5, type: typed, prompt: 'What happens to $A$ and $Z$ when an excited nucleus emits a gamma photon?', answer: { expected: 'both are unchanged', aliases: ['A and Z unchanged', 'neither changes', 'no change'] }, explanation: 'Solution: Both $A$ and $Z$ are unchanged. Why it works: Gamma emission releases nuclear excitation energy but carries away no protons or neutrons.' }
  - { id: r6, type: typed, prompt: 'Which common decay mode moves a neutron-rich nucleus toward a larger proton-to-neutron ratio?', answer: { expected: 'beta-minus decay', aliases: ['beta decay', 'beta minus', 'β- decay'] }, explanation: 'Solution: Beta-minus decay. Why it works: Converting a neutron into a proton reduces neutron excess while leaving mass number unchanged.' }
  - { id: r7, type: typed, prompt: 'What fraction of a radioactive sample remains after four half-lives?', answer: { expected: '1/16', aliases: ['one sixteenth', '0.0625', '6.25%'] }, explanation: 'Solution: $1/16$. Why it works: Repeated halving gives $(1/2)^4=1/16$.' }
  - { id: r8, type: typed, prompt: 'State the relation between first-order decay constant $k$ and half-life $t_{1/2}$.', answer: { expected: 't1/2 = ln 2 / k', aliases: ['half-life equals ln2 over k', 't_1/2=0.693/k'] }, explanation: 'Solution: $t_{1/2}=\ln 2/k$. Why it works: Substituting $N/N_0=1/2$ into first-order exponential decay and solving for time gives this relation.' }
  - { id: r9, type: typed, prompt: 'Define radioactive activity.', answer: { expected: 'number of nuclear decays per unit time', aliases: ['decays per unit time', 'decay rate', 'disintegrations per second'] }, explanation: 'Solution: Activity is the number of nuclear decays per unit time. Why it works: It measures how rapidly unstable nuclei transform, not how much energy each decay deposits.' }
  - { id: r10, type: typed, prompt: 'Define nuclear mass defect.', answer: { expected: 'separated nucleon mass minus bound nucleus mass', aliases: ['difference between constituent nucleon mass and nuclear mass', 'missing mass when nucleons bind'] }, explanation: 'Solution: Mass defect is the separated-nucleon mass minus the mass of the bound nucleus. Why it works: The positive difference corresponds to binding energy through $E=\Delta mc^2$.' }
  - { id: r11, type: typed, prompt: 'Distinguish nuclear fission from nuclear fusion in one sentence.', answer: { expected: 'fission splits a heavy nucleus while fusion joins light nuclei', aliases: ['fission splits heavy nuclei and fusion combines light nuclei', 'fission is splitting and fusion is joining'] }, explanation: 'Solution: Fission splits a heavy nucleus, whereas fusion joins light nuclei. Why it works: The processes move from opposite sides of the nuclide chart toward more tightly bound products.' }
  - id: r12
    type: recognition
    prompt: 'A sealed alpha source is moved from outside the body into lung tissue. Which statement best describes the hazard change?'
    choices:
      - { id: a, text: 'The hazard can increase because alpha particles deposit energy over a short range inside tissue.', issueSignals: [] }
      - { id: b, text: 'The hazard disappears because alpha particles have low external penetration.', issueSignals: [{ id: chemistry-nuclear-penetration-hazard-confusion }] }
      - { id: c, text: 'The source becomes gamma radiation after entering the body.', issueSignals: [{ id: chemistry-nuclear-decay-daughter-error }] }
      - { id: d, text: 'The hazard depends only on source mass, not source location.', issueSignals: [{ id: chemistry-nuclear-penetration-hazard-confusion }] }
    answer: { choiceId: a }
    explanation: 'Solution: The hazard can increase because alpha energy is deposited over a short range inside tissue. Why it works: Low penetration protects against many external alpha sources but does not protect tissue when the source is internal. Why the other choices fail: b confuses external shielding with internal exposure; c changes the radiation identity without a nuclear process; d ignores exposure geometry and energy deposition.'
