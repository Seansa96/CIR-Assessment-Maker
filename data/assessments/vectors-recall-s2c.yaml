items:
- id: r001
  type: typed
  prompt: What two features determine a vector independently of its location?
  answer:
    expected: magnitude and direction
    expectedLatex: 
    aliases:
    - direction and magnitude
    - length and direction
    - magnitude, direction
    media: []
    choiceId: 
  explanation: >
    Solution: Magnitude and direction.


    Why it works: Equivalent vectors may be drawn in different places, but they represent the same vector only when these two features agree.
  tags: []
  skills: []
  issueSignals:
  - id: scalar-vector-confusion
    domains: []
  choices: []
- id: r002
  type: cloze
  prompt: 'Complete: the vector from $A(x_1,y_1,z_1)$ to $B(x_2,y_2,z_2)$ uses each terminal coordinate minus its corresponding initial coordinate.'
  answer:
    expected: x2-x1, y2-y1, z2-z1
    expectedLatex: 
    aliases:
    - x₂-x₁, y₂-y₁, z₂-z₁
    - terminal minus initial
    - endpoint minus startpoint
    media: []
    choiceId: 
  explanation: >
    Solution: $x_2-x_1, y_2-y_1, z_2-z_1$.


    Why it works: A displacement records terminal coordinate minus initial coordinate in each coordinate direction.
  tags: []
  skills: []
  issueSignals:
  - id: vector-component-resolution-error
    domains: []
  choices: []
- id: r003
  type: recognition
  prompt: Which description names the zero vector?
  answer:
    expected: zero vector
    expectedLatex: 
    aliases:
    - the zero vector
    - 0 vector
    media: []
    choiceId: a
  explanation: >
    Solution: Choose the vector with magnitude zero and no specific direction.


    Why it works: The zero vector is the unique vector with length zero.


    Why the other choices fail: Positive components do not define zero; the positive x unit vector is $\mathbf i$; a normal direction can have nonzero length.
  tags: []
  skills: []
  issueSignals:
  - id: scalar-vector-confusion
    domains: []
  choices:
  - id: a
    text: A vector with magnitude zero and no specific direction
    media: []
    issueSignals: 
  - id: b
    text: A vector whose three components are all positive
    media: []
    issueSignals: 
  - id: c
    text: A unit vector along the positive x-axis
    media: []
    issueSignals: 
  - id: d
    text: Any vector perpendicular to the xy-plane
    media: []
    issueSignals: 
- id: r004
  type: recognition
  prompt: Which standard basis vector points along the positive z-axis?
  answer:
    expected: k
    expectedLatex: 
    aliases:
    - $\mathbf k$
    - k
    - <0,0,1>
    - (0,0,1)
    media: []
    choiceId: a
  explanation: >
    Solution: Choose $\mathbf k=\langle0,0,1\rangle$.


    Why it works: Standard basis vectors isolate one positive coordinate direction; $\mathbf k$ isolates z.


    Why the other choices fail: $\mathbf i$ is x, $\mathbf j$ is y, and $-\mathbf k$ points in negative z.
  tags: []
  skills: []
  issueSignals:
  - id: vector-component-resolution-error
    domains: []
  choices:
  - id: a
    text: $\mathbf k=\langle0,0,1\rangle$
    media: []
    issueSignals: 
  - id: b
    text: $\mathbf i=\langle1,0,0\rangle$
    media: []
    issueSignals: 
  - id: c
    text: $\mathbf j=\langle0,1,0\rangle$
    media: []
    issueSignals: 
  - id: d
    text: $-\mathbf k=\langle0,0,-1\rangle$
    media: []
    issueSignals: 
- id: r005
  type: recognition
  prompt: Which statement gives the unit vector in the same direction as a nonzero vector $\mathbf a$?
  answer:
    expected: a divided by magnitude a
    expectedLatex: 
    aliases:
    - a/|a|
    - vector a over magnitude a
    - a normalized
    media: []
    choiceId: a
  explanation: >
    Solution: Choose $\mathbf a/|\mathbf a|$.


    Why it works: Dividing a nonzero vector by its magnitude scales its length to one without changing its direction.


    Why the other choices fail: Multiplication increases length; the negative reverses direction; adding a scalar to a vector is not vector normalization.
  tags: []
  skills: []
  issueSignals:
  - id: magnitude-formula-error
    domains: []
  choices:
  - id: a
    text: $\mathbf a/|\mathbf a|$
    media: []
    issueSignals: 
  - id: b
    text: $|\mathbf a|\mathbf a$
    media: []
    issueSignals: 
  - id: c
    text: $-\mathbf a/|\mathbf a|$
    media: []
    issueSignals: 
  - id: d
    text: $\mathbf a+|\mathbf a|$
    media: []
    issueSignals: 
- id: r006
  type: typed
  prompt: What is the name for a vector of magnitude one?
  answer:
    expected: unit vector
    expectedLatex: 
    aliases:
    - a unit vector
    - normalized vector
    media: []
    choiceId: 
  explanation: >
    Solution: Unit vector.


    Why it works: “Unit” specifies that the vector has length one; its direction may be any direction.
