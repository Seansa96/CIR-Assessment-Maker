workedExamples:
  - id: t-1d-accel-ex01
    title: 'Why do we add or subtract acceleration when finding tension?'
    problem: |
      Understanding how acceleration affects tension is crucial for Newton's Laws problems. Let's explore why the formula for tension seems to change depending on which way an object is accelerating.

      **The Scenario:**
      A rope is used to move a $50\text{ kg}$ box. Use $g = 9.8\text{ m/s}^2$. The box's weight is $W = mg = 50 \times 9.8 = 490\text{ N}$.

      **Part A:** What is the tension in the rope if the box is pulled upward with an upward acceleration of $2.3\text{ m/s}^2$?

      **Part B:** What would be the tension in the rope if the box is lowered with a downward acceleration of $0.75\text{ m/s}^2$?
    steps:
      - id: step-t1-1
        title: 'Part A: Upward Acceleration'
        instruction: |
          Let's define **upward as the positive y-direction**.

          1. **Identify the forces:** The only forces acting on the box are Tension ($T$) pointing UP, and gravity ($mg$) pointing DOWN.
          2. **Apply Newton's Second Law ($\Sigma F_y = m a_y$):**
             Since Tension is up (positive) and gravity is down (negative), the net force is $T - mg = m a_y$.
        type: numericResponse
        prompt: |
          What is the calculated value of the Tension $T$ in Newtons?
        answer:
          value: 605
          tolerance: 1.0
        explanation: |
          1. **Insert the acceleration:** The box is accelerating UP at $2.3\text{ m/s}^2$. So $a_y = +2.3$.
             $$T - mg = m(+2.3)$$
          2. **Solve for T:**
             $$T = mg + m(2.3) = 50(9.8 + 2.3) = 50(12.1) = 605\text{ N}$$

          **Physical Intuition:** The rope must support the $490\text{ N}$ weight *and* pull extra hard to accelerate it upward. The accelerations effectively add together.

          Solution: $T=605$ N.

          Why it works: With upward positive, $T-mg=m(+2.3)$, so tension exceeds weight.

      - id: step-t1-2
        title: 'Part B: Downward Acceleration'
        instruction: |
          Now let's look at lowering the box. Let's keep the same coordinate system: **upward is positive y**.

          The forces haven't changed direction, so the left side of the equation is exactly the same:
          $$T - mg = m a_y$$
        type: numericResponse
        prompt: |
          Given the downward acceleration of $0.75\text{ m/s}^2$, what is the calculated value of the Tension $T$ in Newtons?
        answer:
          value: 452.5
          tolerance: 1.0
        explanation: |
          1. **Insert the acceleration:** The box is accelerating DOWN at $0.75\text{ m/s}^2$. In our coordinate system, downward is negative. So $a_y = -0.75$.
             $$T - mg = m(-0.75)$$
          2. **Solve for T:**
             $$T = mg - m(0.75) = 50(9.8 - 0.75) = 50(9.05) = 452.5\text{ N}$$

          **Physical Intuition:** To accelerate downward, gravity is doing some of the work. The rope just needs to pull up enough to partially counteract gravity. Thus, the tension is less than the weight.

          Solution: $T=452.5$ N.

          Why it works: With upward positive, downward acceleration is negative in $T-mg=ma$.

      - id: step-t1-3
        title: 'Summary: The Master Equation'
        instruction: |
          You do not need to memorize separate formulas for "$m(g+a)$" and "$m(g-a)$".

          Instead, always use the vector equation based on a fixed coordinate system (usually UP is positive):
          $$T - mg = m a_y$$
        type: multipleChoice
        prompt: |
          If the box is in free fall ($a_y = -g$), what will the master equation naturally evaluate the Tension to be?
        choices:
          - id: a
            text: '$T = mg$'
          - id: b
            text: '$T = 0$'
          - id: c
            text: '$T = -mg$'
        answer:
          choiceId: b
        explanation: |
          If $a_y = -g$, then $T - mg = m(-g)$. Thus $T = mg - mg = 0$. The rope is completely slack!

          Solution: $T=0$.

          Why it works: Free fall has acceleration $-g$ under the stated coordinate convention.

  - id: tension-we002
    title: Elevator Tension
    problem: 'A 70 kg passenger stands on a scale in an elevator accelerating upward at 1.5 m/s$^2$. Find the scale force.'
    steps:
      - id: twe4
        title: Apply vertical Newton's law
        instruction: Use upward as positive.
        type: numericResponse
        prompt: 'What scale force is measured in newtons?'
        answer: { value: 791, tolerance: 1 }
        explanation: 'Solution: $N-mg=ma$, so $N=70(9.8+1.5)=791$ N.\n\nWhy it works: The scale must support weight and provide upward acceleration.'
