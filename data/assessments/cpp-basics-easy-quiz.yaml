questions:
- id: q001
  type: multipleChoice
  prompt: Which function normally begins a hosted C++ program?
  choices: [{ id: a, text: main }, { id: b, text: start }, { id: c, text: cout }, { id: d, text: linker }]
  answer: { choiceId: a }
  explanation: Execution begins in the program's `main` function.
- id: q002
  type: multipleChoice
  prompt: Which header declares the standard console stream `std::cout`?
  choices: [{ id: a, text: '`<iostream>`' }, { id: b, text: '`<string>`' }, { id: c, text: '`<vector>`' }, { id: d, text: '`<limits>`' }]
  answer: { choiceId: a }
  explanation: The iostream header declares the standard stream I/O facilities including `std::cout`.
- id: q003
  type: multipleChoice
  prompt: What is printed by `std::cout << "A" << "B\\n";`?
  choices: [{ id: a, text: AB followed by a newline }, { id: b, text: A and B on separate lines }, { id: c, text: A B with a space }, { id: d, text: Nothing }]
  answer: { choiceId: a }
  explanation: Both insertions append to the same stream; only `\n` adds the line break.
- id: q004
  type: multipleChoice
  prompt: Which build stage combines object code and required library definitions?
  choices: [{ id: a, text: The linker }, { id: b, text: The editor }, { id: c, text: std::cout }, { id: d, text: The preprocessor alone }]
  answer: { choiceId: a }
  explanation: The compiler translates source, while the linker assembles translated pieces and required definitions into an executable.
- id: q005
  type: multipleChoice
  prompt: What does the `std::` prefix in `std::cout` identify?
  choices: [{ id: a, text: The standard-library namespace }, { id: b, text: A decimal type }, { id: c, text: The program's entry point }, { id: d, text: A newline }]
  answer: { choiceId: a }
  explanation: Namespace qualification specifies where the library name is defined and helps avoid name collisions.
- id: q006
  type: multipleChoice
  prompt: A program builds but prints `BuildRun` instead of two lines. What direct change fixes the behavior?
  choices: [{ id: a, text: Add a newline between the output fragments }, { id: b, text: Rename main }, { id: c, text: Remove the header }, { id: d, text: Change the linker }]
  answer: { choiceId: a }
  explanation: |
    The program already builds, so the issue is output content: a newline must be inserted explicitly between `Build` and `Run`.
- id: q007
  type: multipleChoice
  prompt: What is a likely reason a compiler reports that `std::println` is unavailable?
  choices: [{ id: a, text: The selected toolchain/language mode lacks that newer facility }, { id: b, text: C++ cannot print lines }, { id: c, text: All namespaces are disabled }, { id: d, text: '`main` must return a string' }]
  answer: { choiceId: a }
  explanation: Standard-library support depends on the compiler and selected language mode; a supported stream alternative can still be used.
- id: q008
  type: code
  prompt: Write a complete program that prints exactly `Ready` followed by one newline.
  language: cpp
  functionName: main
  starterCode: '#include <iostream>\n\nint main() {\n  // print Ready\n}'
  tests: [{ input: test, expected: "Ready\n" }]
  answer: {}
  explanation: Include `<iostream>`, define `main`, and send `"Ready\n"` to `std::cout`.
- id: q009
  type: code
  prompt: Write a complete program that prints `One` and `Two` on separate lines.
  language: cpp
  functionName: main
  starterCode: '#include <iostream>\n\nint main() {\n  // print two lines\n}'
  tests: [{ input: test, expected: "One\nTwo\n" }]
  answer: {}
  explanation: Write each line with an explicit newline, for example two `std::cout` statements ending in `\n`.
- id: q010
  type: code
  prompt: Write a complete program that prints the exact characters `7:8` followed by one newline.
  language: cpp
  functionName: main
  starterCode: '#include <iostream>\n\nint main() {\n  // use stream insertion\n}'
  tests: [{ input: test, expected: "7:8\n" }]
  answer: {}
  explanation: Chained insertion can append the fragments `7`, `:`, and `8`; the newline remains a separate required output character.
