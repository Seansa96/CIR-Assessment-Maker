schemaVersion: 1
id: csharp-async-recall
title: C# Async and Await Recall
assessmentType: recallDrill
categoryId: csharp
subcategoryId: csharp-async
subcategoryIds:
  - csharp-async
modeDefault: practice
randomizeQuestions: true
items:
  - id: r001
    type: typed
    prompt: 'Which keyword modifies a method signature to allow asynchronous operations inside it?'
    answer:
      expected: async
  - id: r002
    type: typed
    prompt: 'Which keyword is used to non-blockingly pause the execution of a method until a background operation finishes?'
    answer:
      expected: await
  - id: r003
    type: typed
    prompt: 'What return type is used for an `async` method that does not return a value (the async equivalent of `void`)?'
    answer:
      expected: Task
  - id: r004
    type: typed
    prompt: 'What return type is used for an `async` method that returns an integer?'
    answer:
      expected: Task<int>
  - id: r005
    type: typed
    prompt: 'What method safely simulates a delay asynchronously without freezing the main thread?'
    answer:
      expected: Task.Delay
      aliases:
        - Task.Delay()
  - id: r006
    type: typed
    prompt: 'What method forces a thread to freeze completely and should almost never be used in modern UI/Game programming?'
    answer:
      expected: Thread.Sleep
      aliases:
        - Thread.Sleep()
