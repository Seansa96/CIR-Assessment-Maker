workedExamples:
  - id: we-spring-stiffness
    title: Understanding Spring Configurations
    problem: |
      Let's walk through the physical reasoning behind why connecting identical springs in parallel makes the system stiffer, while connecting them in series makes it softer.
    steps:
      - id: step-1
        title: Step 1 — Parallel Springs
        instruction: |
          Imagine pulling a block attached to two identical springs (each with constant $k$) connected side-by-side in parallel. You want to stretch the block by a distance of $1\text{ m}$.
        type: multipleChoice
        prompt: |
          How does the total force required to pull the block compare to pulling just one single spring by $1\text{ m}$?
        choices:
          - id: a
            text: 'It takes half as much force.'
          - id: b
            text: 'It takes exactly the same amount of force.'
          - id: c
            text: 'It takes twice as much force.'
        answer:
          choiceId: c
        explanation: 'Because both springs must be stretched by $1\text{ m}$, you have to provide the force for both of them. This means the parallel system is overall much stiffer to pull.'
      - id: step-2
        title: Step 2 — Series Springs
        instruction: |
          Now imagine the two identical springs are hooked end-to-end in a chain (series). You pull the end of the chain with a specific force $F$.
        type: multipleChoice
        prompt: |
          How much does the total chain stretch compared to a single spring pulled by that same force $F$?
        choices:
          - id: a
            text: 'It stretches half as much.'
          - id: b
            text: 'It stretches the exact same amount.'
          - id: c
            text: 'It stretches twice as much.'
        answer:
          choiceId: c
        explanation: 'Since tension is uniform, *both* springs feel the full force $F$ and both stretch by $F/k$. The total stretch is the sum of their stretches, meaning the chain stretches twice as much. More stretch for the same force means it is softer!'
