    - |-
      1. Roots of parabola: $x=0, x=10$.
      2. Rotation about y-axis using $dx$ implies the Shell method.
      3. $V = \int_0^{10} 2\pi x (10x - x^2) \, dx = 2\pi \int_0^{10} (10x^2 - x^3) \, dx$.
      4. $V = 2\pi \left[ \frac{10}{3}x^3 - \frac{1}{4}x^4 \right]_0^{10} = 2\pi \left( \frac{10000}{3} - 2500 \right) = 2\pi \left( \frac{10000}{3} - \frac{7500}{3} \right) = 2\pi \left( \frac{2500}{3} \right) = \frac{5000\pi}{3}$.
