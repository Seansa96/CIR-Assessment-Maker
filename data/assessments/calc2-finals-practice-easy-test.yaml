  - domainCondition
  difficultyEvidence: The problem requires selecting a representation, carrying out the governing calculus method, and checking the condition that makes the result valid.
- id: q002
  title: Area of Cubic and Quadratic
  type: freeResponse
  skills:
  - geom-applications-comprehensive
  prompt: 'Find the exact area of the region enclosed by $f(x) = x^3 - 4x^2 + x - 1$ and $g(x) = -x^2 + 2x - 4$.

    '
  answer:
    gradingMode: selfCheck
    keyPoints:
    - |-
      1. Intersections: $x^3 - 4x^2 + x - 1 = -x^2 + 2x - 4 \implies x^3 - 3x^2 - x + 3 = 0$.
      2. Factoring by grouping: $x^2(x-3) - 1(x-3) = 0 \implies (x^2-1)(x-3) = 0$.
      3. The curves intersect at $x = -1, 1, 3$.
      4. On $[-1, 1]$, $f(x) > g(x)$. On $[1, 3]$, $g(x) > f(x)$.
      5. $A = \int_{-1}^1 (x^3 - 3x^2 - x + 3) \, dx + \int_1^3 (-x^3 + 3x^2 + x - 3) \, dx$.
      6. Evaluated, the first integral yields 4, and the second integral yields 4.
      7. Total area = $4 + 4 = 8$.
  explanation: |-
    1. Intersections: $x^3 - 4x^2 + x - 1 = -x^2 + 2x - 4 \implies x^3 - 3x^2 - x + 3 = 0$.
    2. Factoring by grouping: $x^2(x-3) - 1(x-3) = 0 \implies (x^2-1)(x-3) = 0$.
    3. The curves intersect at $x = -1, 1, 3$.
    4. On $[-1, 1]$, $f(x) > g(x)$. On $[1, 3]$, $g(x) > f(x)$.
    5. $A = \int_{-1}^1 (x^3 - 3x^2 - x + 3) \, dx + \int_1^3 (-x^3 + 3x^2 + x - 3) \, dx$.
    6. Evaluated, the first integral yields 4, and the second integral yields 4.
    7. Total area = $4 + 4 = 8$.
