- id: q001
  title: Area of Parabolas
  type: freeResponse
  skills:
  - geom-applications-comprehensive
  prompt: 'Find the exact area of the region enclosed by $y = x^2$ and $y = 4 - x^2$.

    '
  answer:
    gradingMode: selfCheck
    keyPoints:
    - |-
      1. Intersection points: $x^2 = 4 - x^2 \implies 2x^2 = 4 \implies x = \pm\sqrt{2}$.
      2. The top curve is $4-x^2$.
      3. $A = \int_{-\sqrt{2}}^{\sqrt{2}} (4 - 2x^2) \, dx = \left[ 4x - \frac{2}{3}x^3 \right]_{-\sqrt{2}}^{\sqrt{2}}$.
      4. $A = \left(4\sqrt{2} - \frac{4\sqrt{2}}{3}\right) - \left(-4\sqrt{2} + \frac{4\sqrt{2}}{3}\right) = 8\sqrt{2} - \frac{8\sqrt{2}}{3} = \frac{16\sqrt{2}}{3}$.
  explanation: |-
    1. Intersection points: $x^2 = 4 - x^2 \implies 2x^2 = 4 \implies x = \pm\sqrt{2}$.
    2. The top curve is $4-x^2$.
    3. $A = \int_{-\sqrt{2}}^{\sqrt{2}} (4 - 2x^2) \, dx = \left[ 4x - \frac{2}{3}x^3 \right]_{-\sqrt{2}}^{\sqrt{2}}$.
    4. $A = \left(4\sqrt{2} - \frac{4\sqrt{2}}{3}\right) - \left(-4\sqrt{2} + \frac{4\sqrt{2}}{3}\right) = 8\sqrt{2} - \frac{8\sqrt{2}}{3} = \frac{16\sqrt{2}}{3}$.
