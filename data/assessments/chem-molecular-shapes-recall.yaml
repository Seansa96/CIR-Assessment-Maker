modeDefault: practice
items:
  - id: item-001
    type: flashcard
    prompt: 'AX₂E₀ — Electron domains: 2, lone pairs: 0'
    answer:
      expected: |
      **Electron-pair geometry:** Linear
      **Molecular geometry:** Linear
      **Bond angle:** 180°
      **Example:** $CO_2$, $BeCl_2$, $HCN$
  - id: item-002
    type: flashcard
    prompt: 'AX₃E₀ — Electron domains: 3, lone pairs: 0'
    answer:
      expected: |
      **Electron-pair geometry:** Trigonal planar
      **Molecular geometry:** Trigonal planar
      **Bond angle:** 120°
      **Example:** $BF_3$, $SO_3$, $CO_3^{2-}$
  - id: item-003
    type: flashcard
    prompt: 'AX₂E₁ — Electron domains: 3, lone pairs: 1'
    answer:
      expected: |
      **Electron-pair geometry:** Trigonal planar
      **Molecular geometry:** Bent
      **Bond angle:** ~117° (less than 120°)
      **Example:** $SO_2$, $O_3$
  - id: item-004
    type: flashcard
    prompt: 'AX₄E₀ — Electron domains: 4, lone pairs: 0'
    answer:
      expected: |
      **Electron-pair geometry:** Tetrahedral
      **Molecular geometry:** Tetrahedral
      **Bond angle:** 109.5°
      **Example:** $CH_4$, $CCl_4$, $SiH_4$
  - id: item-005
    type: flashcard
    prompt: 'AX₃E₁ — Electron domains: 4, lone pairs: 1'
    answer:
      expected: |
      **Electron-pair geometry:** Tetrahedral
      **Molecular geometry:** Trigonal pyramidal
      **Bond angle:** ~107°
      **Example:** $NH_3$, $PCl_3$
  - id: item-006
    type: flashcard
    prompt: 'AX₂E₂ — Electron domains: 4, lone pairs: 2'
    answer:
      expected: |
      **Electron-pair geometry:** Tetrahedral
      **Molecular geometry:** Bent
      **Bond angle:** ~104.5°
      **Example:** $H_2O$, $H_2S$
  - id: item-007
    type: flashcard
    prompt: 'AX₅E₀ — Electron domains: 5, lone pairs: 0'
    answer:
      expected: |
      **Electron-pair geometry:** Trigonal bipyramidal
      **Molecular geometry:** Trigonal bipyramidal
      **Bond angles:** 120° (equatorial), 90° (axial-equatorial)
      **Example:** $PCl_5$, $PF_5$
  - id: item-008
    type: flashcard
    prompt: 'AX₄E₁ — Electron domains: 5, lone pairs: 1'
    answer:
      expected: |
      **Electron-pair geometry:** Trigonal bipyramidal
      **Molecular geometry:** Seesaw
      **Bond angles:** ~177° (ax–ax), ~101° (eq–eq), ~87° (ax–eq)
      **Example:** $SF_4$
  - id: item-009
    type: flashcard
    prompt: 'AX₃E₂ — Electron domains: 5, lone pairs: 2'
    answer:
      expected: |
      **Electron-pair geometry:** Trigonal bipyramidal
      **Molecular geometry:** T-shaped
      **Bond angles:** ~87° (ax–eq), ~175° (ax–ax)
      **Example:** $ClF_3$
  - id: item-010
    type: flashcard
    prompt: 'AX₂E₃ — Electron domains: 5, lone pairs: 3'
    answer:
      expected: |
      **Electron-pair geometry:** Trigonal bipyramidal
      **Molecular geometry:** Linear
      **Bond angle:** 180°
      **Example:** $XeF_2$
  - id: item-011
    type: flashcard
    prompt: 'AX₆E₀ — Electron domains: 6, lone pairs: 0'
    answer:
      expected: |
      **Electron-pair geometry:** Octahedral
      **Molecular geometry:** Octahedral
      **Bond angle:** 90°
      **Example:** $SF_6$, $PF_6^-$
  - id: item-012
    type: flashcard
    prompt: 'AX₅E₁ — Electron domains: 6, lone pairs: 1'
    answer:
      expected: |
      **Electron-pair geometry:** Octahedral
      **Molecular geometry:** Square pyramidal
      **Bond angle:** ~90° (base), slightly less than 90° (ax–eq)
      **Example:** $BrF_5$, $IF_5$
  - id: item-013
    type: flashcard
    prompt: 'AX₄E₂ — Electron domains: 6, lone pairs: 2'
    answer:
      expected: |
      **Electron-pair geometry:** Octahedral
      **Molecular geometry:** Square planar
      **Bond angle:** 90°
      **Example:** $XeF_4$, $PtCl_4^{2-}$
  - id: item-014
    type: flashcard
    prompt: Why do lone pairs compress bond angles below the ideal geometry value?
    answer:
      expected: |
      Lone pairs are held by **only one nucleus** (not shared), so they spread out more and exert stronger repulsion on bonding pairs than bonding pairs do on each other. The hierarchy of repulsion:

      **Lone pair–lone pair > lone pair–bonding pair > bonding pair–bonding pair**

      Each lone pair pushes bonding pairs closer, reducing the observed bond angle.

