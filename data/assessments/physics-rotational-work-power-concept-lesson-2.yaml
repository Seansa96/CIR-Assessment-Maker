lesson:
  introduction: We now apply Rotational Work Power to complex, multi-body physical systems.
  sections:
  - id: sec-1
    title: Complex Systems
    content: When applying Rotational Work Power to systems with multiple interconnected moving parts, conservation laws become our most powerful tools. If net external torque is zero, angular momentum is conserved.
    media:
    - type: image
      src: /media/physics/owa/rotational-variables.svg
      alt: Wheel showing angular speed and tangential speed.
      caption: Angular speed connects rotational power to the motion of the wheel.
    check:
      id: chk-physics-rotational-work-power-3
      type: multipleChoice
      prompt: When can you assume angular momentum is conserved?
      choices:
      - id: a
        text: Always.
      - id: b
        text: Only when the object is isolated from gravity.
      - id: c
        text: When the net external torque is zero.
      answer:
        choiceId: c
      explanation: $\tau_{net} = dL/dt$. If $\tau_{net} = 0$, then $dL/dt = 0$, meaning $L$ is constant.
  - id: sec-2
    title: Problem Solving Strategy
    content: '1. Identify the system and the axis of rotation.

      2. Draw a free-body diagram.

      3. Determine all torques and forces.

      4. Apply Newton''s Second Law for rotation and translation simultaneously.'
    media: []
    check:
      id: chk-physics-rotational-work-power-4
      type: multipleChoice
      prompt: What is the first step in solving a complex rotational dynamics problem?
      choices:
      - id: a
        text: Pick an arbitrary equation.
      - id: b
        text: Identify the system and the axis of rotation.
      - id: c
        text: Plug in all known numbers immediately.
      answer:
        choiceId: b
      explanation: A clear understanding of the system boundary and the pivot axis is required before any equations can be written.
