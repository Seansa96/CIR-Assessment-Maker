lesson:
  introduction: We now apply Rotational Work Power to complex, multi-body physical
    systems.
  sections:
  - id: sec-1
    title: Complex Systems
    content: When applying Rotational Work Power to systems with multiple interconnected
      moving parts, conservation laws become our most powerful tools. If net external
      torque is zero, angular momentum is conserved.
    media:
    - type: image
      src: /media/physics/owa/rotational-variables.svg
      alt: Wheel showing angular speed and tangential speed.
      caption: Angular speed connects rotational power to the motion of the wheel.
    check:
      id: chk-physics-rotational-work-power-3
      type: multipleChoice
      prompt: When can you assume angular momentum is conserved?
      choices:
      - id: a
        text: Always.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: Only when the object is isolated from gravity.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: c
        text: When the net external torque is zero.
      answer:
        choiceId: c
      explanation: 'Solution:

        When the net external torque is zero.


        Why it works:

        $\tau_{net} = dL/dt$. If $\tau_{net} = 0$, then $dL/dt = 0$, meaning $L$ is
        constant.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-3
    title: Power Versus Time
    content: 'Power measures the rate of energy transfer; equal work can be delivered at different power over different times.'
    media: []
    check: { id: chk-rwp-10, type: multipleChoice, prompt: 'Two motors do equal work; which has larger power?', choices: [{ id: a, text: the one taking longer }, { id: b, text: the one taking less time }, { id: c, text: both always equal }, { id: d, text: neither does work }], answer: { choiceId: b }, explanation: 'Solution: The motor taking less time has larger power.\n\nWhy it works: $P=W/t$.\n\nWhy the other choices fail: Equal work does not imply equal rate.' }
  - id: sec-4
    title: Variable Torque
    content: 'For variable torque, rotational work is $W=\int\tau\,d\theta$.'
    media: []
    check: { id: chk-rwp-11, type: multipleChoice, prompt: 'Which expression is needed when torque changes with angle?', choices: [{ id: a, text: '$\tau+\theta$' }, { id: b, text: '$\int\tau d\theta$' }, { id: c, text: '$I/\alpha$' }, { id: d, text: '$\omega/t$' }], answer: { choiceId: b }, explanation: 'Solution: Use $W=\int\tau d\theta$.\n\nWhy it works: Work accumulates differential torque-angle contributions.\n\nWhy the other choices fail: They do not sum variable work.' }
  - id: sec-5
    title: Efficiency
    content: 'Real machines often lose energy to friction and heat, so useful output power can be less than input power.'
    media: []
    check: { id: chk-rwp-12, type: multipleChoice, prompt: 'An efficiency of 80% means useful output energy is:', choices: [{ id: a, text: 20% of input }, { id: b, text: 80% of input }, { id: c, text: 100% of input }, { id: d, text: greater than input }], answer: { choiceId: b }, explanation: 'Solution: Output is 80% of input.\n\nWhy it works: Efficiency is output divided by input.\n\nWhy the other choices fail: They confuse loss fraction with useful fraction.' }
  - id: sec-6
    title: Torque Direction
    content: 'Only the torque component along the rotation axis contributes to angular work and power for fixed-axis motion.'
    media: []
    check: { id: chk-rwp-13, type: multipleChoice, prompt: 'A force through the rotation axis produces what torque?', choices: [{ id: a, text: maximum }, { id: b, text: zero }, { id: c, text: negative only }, { id: d, text: infinite }], answer: { choiceId: b }, explanation: 'Solution: The torque is zero.\n\nWhy it works: The lever arm is zero.\n\nWhy the other choices fail: Force alone does not determine torque.' }
  - id: sec-7
    title: Design Comparison
    content: 'At a fixed power, a machine delivering greater torque turns at lower angular speed, because $P=\tau\omega$.'
    media: []
    check: { id: chk-rwp-14, type: multipleChoice, prompt: 'At fixed power, increasing torque requires angular speed to:', choices: [{ id: a, text: increase }, { id: b, text: decrease }, { id: c, text: remain zero }, { id: d, text: become torque }], answer: { choiceId: b }, explanation: 'Solution: It must decrease.\n\nWhy it works: $\omega=P/\tau$.\n\nWhy the other choices fail: Torque and speed trade off at fixed power.' }
  - id: sec-2
    title: Problem Solving Strategy
    content: '1. Identify the system and the axis of rotation.

      2. Draw a free-body diagram.

      3. Determine all torques and forces.

      4. Apply Newton''s Second Law for rotation and translation simultaneously.'
    media: []
    check:
      id: chk-physics-rotational-work-power-4
      type: multipleChoice
      prompt: What is the first step in solving a complex rotational dynamics problem?
      choices:
      - id: a
        text: Pick an arbitrary equation.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: Identify the system and the axis of rotation.
      - id: c
        text: Plug in all known numbers immediately.
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: b
      explanation: 'Solution:

        Identify the system and the axis of rotation.


        Why it works:

        A clear understanding of the system boundary and the pivot axis is required
        before any equations can be written.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
