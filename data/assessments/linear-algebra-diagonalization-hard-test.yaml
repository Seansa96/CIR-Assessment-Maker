questions:
  - id: ht-identify-d
    type: multipleChoice
    prompt: |
      Let $A = \begin{bmatrix}1 & 3 \\ 2 & 2\end{bmatrix}$. If $A$ is diagonalized as $A = PDP^{-1}$, which of the following could be the matrix $D$?
    choices:
      - id: c1
        text: '$\begin{bmatrix}1 & 0 \\ 0 & 2\end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix}4 & 0 \\ 0 & -1\end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix}3 & 0 \\ 0 & 2\end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix}5 & 0 \\ 0 & -2\end{bmatrix}$'
    answer:
      choiceId: c2
    explanation: |
      The matrix $D$ must contain the eigenvalues of $A$. 
      $\det(A - \lambda I) = (1-\lambda)(2-\lambda) - 6 = 2 - 3\lambda + \lambda^2 - 6 = \lambda^2 - 3\lambda - 4 = 0$.
      Factoring gives $(\lambda - 4)(\lambda + 1) = 0$. The eigenvalues are $4$ and $-1$.
      Therefore, $D$ must be a diagonal matrix with $4$ and $-1$ on the main diagonal.

  - id: ht-non-diagonalizable-proof
    type: multipleChoice
    prompt: |
      Consider the matrix $A = \begin{bmatrix}5 & 1 \\ 0 & 5\end{bmatrix}$. Why is $A$ **not** diagonalizable?
    choices:
      - id: c1
        text: 'Because its determinant is 25.'
      - id: c2
        text: 'Because it has a repeated eigenvalue ($\lambda=5$), so it can never be diagonalized.'
      - id: c3
        text: 'Because the eigenspace for $\lambda=5$ is only 1-dimensional, so it lacks 2 independent eigenvectors.'
      - id: c4
        text: 'Because it is an upper triangular matrix.'
    answer:
      choiceId: c3
    explanation: |
      Because $A$ is triangular, its only eigenvalue is $\lambda = 5$ (algebraic multiplicity 2). 
      If we check the eigenspace: $A - 5I = \begin{bmatrix}0 & 1 \\ 0 & 0\end{bmatrix}$.
      Solving $(A-5I)\vec{x} = \vec{0}$ gives $x_2 = 0$, while $x_1$ is free. The basis is just $\left\{ \begin{bmatrix}1\\0\end{bmatrix} \right\}$.
      Since there is only 1 independent eigenvector, $A$ cannot provide 2 columns for an invertible matrix $P$. (Note: Option B is false because some matrices with repeated eigenvalues *are* diagonalizable, like the identity matrix!).

  - id: ht-diagonalize-upper-triangular
    type: freeResponse
    prompt: |
      Find matrices $P$ and $D$ that diagonalize $A = \begin{bmatrix}3 & 2 \\ 0 & 1\end{bmatrix}$.
      (Use $\lambda_1 = 3$ and $\lambda_2 = 1$).
    answer:
      gradingMode: selfCheck
      keyPoints:
        - |
          **Eigenvalues**: Because $A$ is upper triangular, the eigenvalues are simply the diagonal entries: $\lambda_1 = 3$ and $\lambda_2 = 1$.
          Thus, $D = \begin{bmatrix}3 & 0 \\ 0 & 1\end{bmatrix}$.
        - |
          **Eigenspace for $\lambda_1 = 3$**:
          $A - 3I = \begin{bmatrix}0 & 2 \\ 0 & -2\end{bmatrix}$.
          Solving $(A-3I)\vec{x} = \vec{0}$ yields $2x_2 = 0 \implies x_2 = 0$. $x_1$ is free.
          Basis vector: $\vec{v}_1 = \begin{bmatrix}1\\0\end{bmatrix}$.
        - |
          **Eigenspace for $\lambda_2 = 1$**:
          $A - I = \begin{bmatrix}2 & 2 \\ 0 & 0\end{bmatrix}$.
          Solving $(A-I)\vec{x} = \vec{0}$ yields $2x_1 + 2x_2 = 0 \implies x_1 = -x_2$.
          Basis vector: $\vec{v}_2 = \begin{bmatrix}-1\\1\end{bmatrix}$ (or equivalent).
        - |
          **Matrix P**:
          Assemble the eigenvectors as columns in the same order as $D$:
          $P = \begin{bmatrix}1 & -1 \\ 0 & 1\end{bmatrix}$.
