lesson:
  introduction: |-
    A circle is the set of all points that are the exact same distance from a center point. When we put a circle on a coordinate plane, we can use algebra to describe it perfectly using an equation!
  sections:
  - id: sec-standard-form
    title: Standard Form of a Circle
    required: true
    content: |-
      The equation of a circle is actually just the **Distance Formula** (or Pythagorean Theorem) in disguise!
      
      The standard form of a circle's equation is:
      $$(x - h)^2 + (y - k)^2 = r^2$$
      
      - $(h, k)$ are the coordinates of the **center** of the circle.
      - $r$ is the **radius** of the circle.
      
      *Warning:* Notice the minus signs in the formula! If the equation is $(x - 3)^2 + (y + 5)^2 = 16$, the center is at $(3, -5)$, and the radius is $\sqrt{16} = 4$. You must flip the signs to find the center!

  - id: sec-origin
    title: Circles Centered at the Origin
    required: true
    content: |-
      If a circle is centered exactly at the origin $(0,0)$, the $h$ and $k$ values are just $0$. 
      
      The equation simplifies beautifully to:
      $$x^2 + y^2 = r^2$$
      
      This is the purest form of the Pythagorean Theorem on the coordinate plane. Any point $(x,y)$ on this circle forms a right triangle with the origin, where $x$ and $y$ are the legs, and the radius $r$ is the hypotenuse.

questions:
- id: q-geom-ceq-1
  title: Concept Check - Finding the Center and Radius
  prompt: |-
    A circle has the equation $(x + 2)^2 + (y - 7)^2 = 81$. What are the coordinates of the center, and what is the radius?
  type: multipleChoice
  choices:
  - id: c1
    text: Center $(2, -7)$, Radius $81$
  - id: c2
    text: Center $(-2, 7)$, Radius $81$
  - id: c3
    text: Center $(-2, 7)$, Radius $9$
  - id: c4
    text: Center $(2, -7)$, Radius $9$
  answer:
    choiceId: c3
  explanation: |-
    The standard formula is $(x - h)^2 + (y - k)^2 = r^2$.
    Flip the signs of the numbers inside the parentheses: $(+2 \rightarrow -2)$ and $(-7 \rightarrow +7)$. The center is $(-2, 7)$.
    The radius is the square root of the number on the right: $\sqrt{81} = 9$.
  skills:
  - geometry-circle-equations-coordinate

- id: q-geom-ceq-2
  title: Concept Check - Writing the Equation
  prompt: |-
    Write the equation of a circle centered at the origin with a radius of $5$.
  type: multipleChoice
  choices:
  - id: c1
    text: $x^2 + y^2 = 5$
  - id: c2
    text: $x^2 + y^2 = 25$
  - id: c3
    text: $(x-5)^2 + (y-5)^2 = 25$
  answer:
    choiceId: c2
  explanation: |-
    A circle centered at the origin uses the formula $x^2 + y^2 = r^2$.
    Because the radius is $5$, $r^2 = 5^2 = 25$.
    The equation is $x^2 + y^2 = 25$.
  skills:
  - geometry-circle-equations-coordinate
