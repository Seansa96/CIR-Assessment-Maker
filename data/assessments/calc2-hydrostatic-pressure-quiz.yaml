questions:
- id: q001
  type: numericResponse
  skills:
  - hydrostatic-pressure
  prompt: 'A circular viewing window of radius 1 m is installed vertically in an aquarium.
    The center of the window is 3 meters below the surface.

    What is the total hydrostatic force on the window? (Use $\rho g = 9800$).

    Provide the exact decimal value to 0 decimal places.

    *(Hint: you can use integration, or remember that for symmetric shapes, $F = \rho
    g \times \text{Depth of Center of Mass} \times \text{Area}$)*.

    '
  answer:
    value: 92363
    tolerance: 10
  explanation: 'Area = $\pi (1)^2 = \pi$. Depth of centroid = $3$.

    $F = 9800(3)(\pi) = 29400\pi \a\approx 92363$ N.

    '
- id: q002
  type: multipleChoice
  skills:
  - hydrostatic-pressure
  prompt: 'A tank contains water up to height $y=10$. Which integral represents the
    hydrostatic force on a vertical square plate with corners at $(0,0), (2,0), (0,2),
    (2,2)$?

    '
  choices:
  - id: a
    text: $\int_0^2 \rho g (10-y)(2)\,dy$
  - id: b
    text: $\int_0^2 \rho g (y-10)(2)\,dy$
  - id: c
    text: $\int_0^2 \rho g (10-y)\,dy$
  - id: d
    text: $\int_0^{10} \rho g (10-y)(2)\,dy$
  answer:
    choiceId: a
  explanation: 'The plate exists from $y=0$ to $y=2$. Its width is $w=2$. The depth
    is $10-y$. Integral is $\int_0^2 \rho g (10-y)(2)\,dy$.

    '
- id: q003
  type: numericResponse
  skills:
  - hydrostatic-pressure
  prompt: 'An isosceles right triangle with\rhorizontal leg 3m and vertical leg 3m
    is placed vertically in water, with the right angle at the bottom right corner
    (at a depth of 5m). The top flat edge of the triangle is at a depth of 2m.

    Find the hydrostatic force. (Use $\rho g = 10000$ for simpler math).

    '
  answer:
    value: 135000
    tolerance: 100
  explanation: 'Let $y=0$ be the bottom tip (depth 5m) and $y=3$ be the top edge (depth
    2m).

    Width at $y$ is $y$. Depth is $5-y$.

    $F = \int_0^3 10000(5-y)(y)\,dy = 10000 \int_0^3 (5y - y^2)\,dy = 10000 [\frac{5y^2}{2}
    - \frac{y^3}{3}]_0^3$.

    $10000( 45/2 - 27/3 ) = 10000( 22.5 - 9 ) = 10000(13.5) = 135,000$.

    '
- id: q004
  type: multipleChoice
  skills:
  - hydrostatic-pressure
  prompt: 'What is the geometric difference between computing hydrostatic force and
    computing the work done pumping liquid out of a tank?

    '
  choices:
  - id: a
    text: For force, $w(y)$ is the width of a 2D plate. For work, $A(y)$ is the cross-sectional
      area of a 3D tank.
  - id: b
    text: For force, distance is measured from the bottom. For work, it is measured
      from the top.
  - id: c
    text: Force integrates density, work integrates weight.
  - id: d
    text: There is no mathematical difference, the integrals are always identical.
  answer:
    choiceId: a
  explanation: 'In both, you multiply by depth $D(y)$ and weight density. But for
    force, you are integrating over a 2D vertical area ($width \times dy$). For work,
    you are integrating over a 3D volume ($Area \times dy$).

    '
- id: q005
  type: numericResponse
  skills:
  - hydrostatic-pressure
  prompt: 'A dam has the shape of the parabola $y = x^2$ up to $y=4$. The water level
    is at $y=4$.

    Find the hydrostatic force. (Use $\rho g = 9800$).

    '
  answer:
    value: 167253
    tolerance: 10
  explanation: 'Width $w(y)$: $y = x^2 \implies x = \pm\sqrt{y}$, so width is $2\sqrt{y}$.

    Depth $d(y) = 4 - y$.

    $F = \int_0^4 9800(4-y)(2\sqrt{y})\,dy = 19600 \int_0^4 (4y^{1/2} - y^{3/2})\,dy
    = 19600 [ \frac{8}{3}y^{3/2} - \frac{2}{5}y^{5/2} ]_0^4$.

    At $y=4$: $\frac{8}{3}(8) - \frac{2}{5}(32) = 64/3 - 64/5 = 128/15 \a\approx 8.5333$.

    $F = 19600 \times \frac{128}{15} = \frac{2508800}{15} = 167253.333$.

    '

