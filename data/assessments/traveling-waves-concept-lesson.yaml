lesson:
  introduction: This lesson develops Traveling Waves from a diagram, a mathematical model, and a calculus-based
    interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      A traveling wave is a disturbance that propagates through a medium (like a pulse along a stretched string or ripples on water) or through space (like electromagnetic waves). The physical system transports energy and momentum without permanently displacing the medium's particles.
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    check: {id: travel-s1, type: multipleChoice, prompt: 'What does a traveling wave transport?', choices: [{id: a, text: 'Energy without permanent particle transport'}, {id: b, text: 'No motion'}, {id: c, text: 'A constant displacement'}, {id: d, text: 'A standing-only pattern'}], answer: {choiceId: a}, explanation: 'This follows from the traveling-wave model.'}
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      Important measurable quantities include the wave speed $v$ (how fast the disturbance travels), the wavelength $\lambda$ (the spatial length of one full wave cycle), and the period $T$ or frequency $f$ (the temporal duration of one cycle).
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    check: {id: travel-s2, type: multipleChoice, prompt: 'What quantities describe spatial and temporal repetition?', choices: [{id: a, text: 'Wavelength and frequency'}, {id: b, text: 'No motion'}, {id: c, text: 'A constant displacement'}, {id: d, text: 'A standing-only pattern'}], answer: {choiceId: a}, explanation: 'This follows from the traveling-wave model.'}
  - id: s3
    title: Mathematical model
    content: >-
      Mathematically, a traveling wave moving in the $+x$ direction without changing shape is represented by a function of the form $y(x,t) = f(x - vt)$. If the wave moves in the $-x$ direction, the argument becomes $(x + vt)$.
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    check: {id: travel-s3, type: multipleChoice, prompt: 'What form travels in the positive x direction?', choices: [{id: a, text: '$f(x-vt)$'}, {id: b, text: 'No motion'}, {id: c, text: 'A constant displacement'}, {id: d, text: 'A standing-only pattern'}], answer: {choiceId: a}, explanation: 'This follows from the traveling-wave model.'}
  - id: s4
    title: Calculus connection
    content: >-
      The calculus connection is the linear wave equation, a second-order partial differential equation: $\frac{\partial^2 y}{\partial x^2} = \frac{1}{v^2} \frac{\partial^2 y}{\partial t^2}$. Any valid traveling wave function $f(x \pm vt)$ must satisfy this equation.
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    check: {id: travel-s4, type: multipleChoice, prompt: 'What equation must a traveling wave satisfy?', choices: [{id: a, text: 'The linear wave equation'}, {id: b, text: 'No motion'}, {id: c, text: 'A constant displacement'}, {id: d, text: 'A standing-only pattern'}], answer: {choiceId: a}, explanation: 'This follows from the traveling-wave model.'}
  - id: s5
    title: Derivation or justification
    content: >-
      By taking partial derivatives of $y = f(x - vt)$ using the chain rule, $\frac{\partial y}{\partial x} = f'(x-vt)$ and $\frac{\partial y}{\partial t} = -v f'(x-vt)$. Taking the second derivatives yields $\frac{\partial^2 y}{\partial x^2} = f''(x-vt)$ and $\frac{\partial^2 y}{\partial t^2} = v^2 f''(x-vt)$, which perfectly verifies the wave equation.
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    check: {id: travel-s5, type: multipleChoice, prompt: 'What verifies f(x-vt) satisfies the wave equation?', choices: [{id: a, text: 'Chain-rule derivatives'}, {id: b, text: 'No motion'}, {id: c, text: 'A constant displacement'}, {id: d, text: 'A standing-only pattern'}], answer: {choiceId: a}, explanation: 'This follows from the traveling-wave model.'}
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, a 'snapshot' graph plots $y$ vs $x$ at a fixed time $t$, showing the wave's shape in space. A 'history' graph plots $y$ vs $t$ at a fixed position $x$, showing how a single particle in the medium oscillates over time.
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    check: {id: travel-s6, type: multipleChoice, prompt: 'What two graph views represent a wave?', choices: [{id: a, text: 'Snapshot and history graphs'}, {id: b, text: 'No motion'}, {id: c, text: 'A constant displacement'}, {id: d, text: 'A standing-only pattern'}], answer: {choiceId: a}, explanation: 'This follows from the traveling-wave model.'}
  - id: s7
    title: Quantitative strategy
    content: >-
      The most critical quantitative relationship for periodic traveling waves is $v = \frac{\lambda}{T}$, which is universally written as $v = f\lambda$. This relates the wave's spatial and temporal periodicities to its propagation speed.
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    check: {id: travel-s7, type: multipleChoice, prompt: 'What relates speed frequency and wavelength?', choices: [{id: a, text: '$v=f\lambda$'}, {id: b, text: 'No motion'}, {id: c, text: 'A constant displacement'}, {id: d, text: 'A standing-only pattern'}], answer: {choiceId: a}, explanation: 'This follows from the traveling-wave model.'}
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: The wave speed $v$ is determined solely by the mechanical properties of the medium (like tension and density). Therefore, if a source increases the frequency $f$ of the waves it creates, the wavelength $\lambda$ must decrease proportionally to keep $v$ constant.
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    check: {id: travel-s8, type: multipleChoice, prompt: 'For fixed speed, what happens to wavelength if frequency doubles?', choices: [{id: a, text: 'It halves'}, {id: b, text: 'It doubles'}, {id: c, text: 'It stays fixed'}, {id: d, text: 'It is undefined'}], answer: {choiceId: a}, explanation: 'Because $v=f\lambda$, wavelength is inversely proportional to frequency at fixed speed.'}
