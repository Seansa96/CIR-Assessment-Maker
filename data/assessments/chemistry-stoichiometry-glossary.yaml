glossary:
  introduction: |
    Master the core vocabulary and relationships used in chemical stoichiometry, including mass-to-mole conversions and reaction yields.
  sections:
    - id: fundamental-concepts
      title: Fundamental Concepts
      required: true
      content: |
        These terms form the foundation of mass stoichiometry and molar conversions.
      entries:
        - id: molar-mass
          term: Molar Mass
          definition: |
            The mass of one mole of a substance, usually expressed in grams per mole (g/mol).
          notation: '$M$ or $\mathcal{M}$'
          examples:
            - 'The molar mass of water ($H_2O$) is approximately 18.015 g/mol.'
          aliases: [Molecular weight, Formula mass]
          media: []
          tags: [molar-mass, stoichiometry]
          drills:
            - id: molar-mass-typed
              type: typed
              prompt: 'What term describes the mass of exactly one mole of a given substance?'
              answer:
                expected: Molar mass
                aliases: [molar mass]
              explanation: Molar mass allows chemists to convert between grams and moles.
              tags: [molar-mass, stoichiometry]

        - id: avogadros-number
          term: Avogadro's Number
          definition: |
            The number of constituent particles (usually atoms or molecules) that are contained in one mole of a given substance.
          notation: '$N_A \approx 6.022 \times 10^{23} \text{ mol}^{-1}$'
          examples:
            - 'One mole of carbon contains $6.022 \times 10^{23}$ carbon atoms.'
          aliases: [Avogadro constant]
          media: []
          tags: [avogadro, stoichiometry, moles]
          drills:
            - id: avogadros-number-cloze
              type: cloze
              prompt: 'The value $6.022 \times 10^{23}$ is known as ____ Number.'
              answer:
                expected: Avogadro's
                aliases: [Avogadros, Avogadro]
              explanation: Avogadro's number defines the number of particles in a mole.
              tags: [avogadro, stoichiometry]

        - id: mole-ratio
          term: Mole Ratio
          definition: |
            The ratio between the amounts in moles of any two compounds involved in a chemical reaction, derived from the coefficients of the balanced chemical equation.
          notation: ''
          examples:
            - 'In $2H_2 + O_2 \rightarrow 2H_2O$, the mole ratio of $H_2$ to $O_2$ is 2:1.'
          aliases: [Molar ratio]
          media: []
          tags: [mole-ratio, stoichiometry]
          drills:
            - id: mole-ratio-cloze
              type: cloze
              prompt: 'The conversion factor derived from the coefficients of a balanced chemical equation is called the ____ ratio.'
              answer:
                expected: mole
                aliases: [molar]
              explanation: The mole ratio acts as a bridge to convert from moles of one substance to moles of another.
              tags: [mole-ratio, stoichiometry]

    - id: reaction-yield
      title: Reaction Yield and Limiting Reactants
      required: true
      content: |
        These terms describe how the amounts of reactants dictate the amount of product formed.
      entries:
        - id: limiting-reactant
          term: Limiting Reactant
          definition: |
            The reactant in a chemical reaction that limits the amount of product that can be formed. The reaction will stop when all of the limiting reactant is consumed.
          notation: ''
          examples:
            - 'If you have 10 hot dogs and 8 buns, the buns are the limiting reactant.'
          aliases: [Limiting reagent]
          media: []
          tags: [limiting-reactant, yield]
          drills:
            - id: limiting-reactant-recognition
              type: recognition
              prompt: 'Which term describes the substance that is completely consumed first in a chemical reaction?'
              choices:
                - id: a
                  text: Excess reactant
                - id: b
                  text: Limiting reactant
                - id: c
                  text: Theoretical yield
                - id: d
                  text: Molar mass
              answer:
                choiceId: b
                expected: Limiting reactant
              explanation: The limiting reactant determines the maximum amount of product that can be formed.
              tags: [limiting-reactant, yield]

        - id: theoretical-yield
          term: Theoretical Yield
          definition: |
            The maximum amount of product that can be produced from a given amount of reactant, assuming a perfect reaction with no losses.
          notation: ''
          examples:
            - 'Calculated using stoichiometry based on the limiting reactant.'
          aliases: []
          media: []
          tags: [theoretical-yield, yield]
          drills:
            - id: theoretical-yield-typed
              type: typed
              prompt: 'The maximum calculated amount of product that can form from a reaction is called the ____ yield.'
              answer:
                expected: theoretical
                aliases: [theoretical yield]
              explanation: The theoretical yield is always an ideal, calculated value.
              tags: [theoretical-yield, yield]

        - id: percent-yield
          term: Percent Yield
          definition: |
            The ratio of the actual yield to the theoretical yield, expressed as a percentage. It measures the efficiency of a chemical reaction.
          notation: '$\%\text{ yield} = \frac{\text{Actual Yield}}{\text{Theoretical Yield}} \times 100\%$'
          examples:
            - 'If theoretical yield is 10g and actual yield is 9g, the percent yield is 90%.'
          aliases: []
          media: []
          tags: [percent-yield, yield]
          drills:
            - id: percent-yield-cloze
              type: cloze
              prompt: 'The ratio of actual yield to theoretical yield multiplied by 100 is known as the ____ yield.'
              answer:
                expected: percent
                aliases: [percentage]
              explanation: Percent yield tells you how efficient the reaction was in reality.
              tags: [percent-yield, yield]
