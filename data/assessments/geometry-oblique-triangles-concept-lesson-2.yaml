lesson:
  introduction: |-
    If you don't have a "complete pair" (an angle and its opposite side), the Law of Sines is useless. To solve triangles with SAS or SSS information, we use a generalized version of the Pythagorean Theorem called the Law of Cosines.
  sections:
  - id: sec-law-of-cosines
    title: The Law of Cosines Formula
    required: true
    content: |-
      The **Law of Cosines** allows us to find a missing side or a missing angle in any triangle. 
      
      For any $\triangle ABC$ with side lengths $a$, $b$, and $c$ opposite to angles $A$, $B$, and $C$ respectively:
      $$c^2 = a^2 + b^2 - 2ab \cos(C)$$
      
      Notice that if angle $C$ happens to be $90^\circ$, then $\cos(90^\circ) = 0$, and the entire $- 2ab \cos(C)$ term disappears, leaving you with exactly the Pythagorean Theorem ($c^2 = a^2 + b^2$)!
      
      You can write the formula starting with any side:
      - $a^2 = b^2 + c^2 - 2bc \cos(A)$
      - $b^2 = a^2 + c^2 - 2ac \cos(B)$

  - id: sec-when-to-use
    title: When to use the Law of Cosines
    required: true
    content: |-
      The Law of Cosines is your go-to tool for two specific scenarios where the Law of Sines fails:
      
      1. **SAS (Side-Angle-Side)**: You know two sides and the included angle. You can use the Law of Cosines to find the third side.
      2. **SSS (Side-Side-Side)**: You know all three side lengths. You can use the Law of Cosines to solve for any of the angles by algebraically isolating the cosine term:
      $$\cos(C) = \frac{a^2 + b^2 - c^2}{2ab}$$

questions:
- id: q-geom-obl2-1
  title: Concept Check - Finding an Angle (SSS)
  prompt: |-
    You know all three sides of a triangle: $a=5$, $b=6$, $c=7$. Which equation correctly isolates $\cos(A)$ to solve for angle $A$?
  type: multipleChoice
  choices:
  - id: c1
    text: $\cos(A) = \frac{6^2 + 7^2 - 5^2}{2(6)(7)}$
  - id: c2
    text: $\cos(A) = \frac{5^2 + 6^2 - 7^2}{2(5)(6)}$
  - id: c3
    text: $\cos(A) = \frac{5^2 + 7^2 - 6^2}{2(5)(7)}$
  answer:
    choiceId: c1
  explanation: |-
    Start with the formula starting with $a$: $a^2 = b^2 + c^2 - 2bc \cos(A)$. 
    Rearrange to isolate $\cos(A)$: $\cos(A) = \frac{b^2 + c^2 - a^2}{2bc}$.
    Plug in the numbers: $\cos(A) = \frac{6^2 + 7^2 - 5^2}{2(6)(7)}$.
  skills:
  - geometry-oblique-triangles

- id: q-geom-obl2-2
  title: Concept Check - Pythagorean Connection
  prompt: |-
    What happens to the Law of Cosines ($c^2 = a^2 + b^2 - 2ab \cos(C)$) when angle $C$ is obtuse (greater than $90^\circ$)?
  type: multipleChoice
  choices:
  - id: c1
    text: The cosine becomes negative, so the $- 2ab \cos(C)$ term turns into a plus, making $c^2 > a^2 + b^2$.
  - id: c2
    text: The formula breaks down and cannot be used for obtuse angles.
  - id: c3
    text: The $- 2ab \cos(C)$ term remains negative, making $c^2 < a^2 + b^2$.
  answer:
    choiceId: c1
  explanation: |-
    The cosine of an obtuse angle is negative. Subtracting a negative number turns into addition! Therefore, $c^2$ becomes strictly greater than $a^2 + b^2$, which perfectly matches the Converse of the Pythagorean Theorem for obtuse triangles.
  skills:
  - geometry-oblique-triangles
