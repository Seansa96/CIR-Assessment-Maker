glossary:
  introduction: Core terms for inductance.
  sections:
  - id: terms
    title: Core terms
    required: true
    content: Definitions of inductance and circuits.
    entries:
    - id: t1
      term: Inductance
      definition: The property of an electrical conductor by which a change in current
        induces an electromotive force (EMF) in both the conductor itself and in any
        nearby conductors.
    - id: t2
      term: Henry (H)
      definition: The SI unit of inductance. One henry is $1\text{ V}\cdot\text{s}/\text{A}$.
    - id: t3
      term: LC Circuit
      definition: A resonant circuit consisting of an inductor and a capacitor, capable
        of oscillating electrical energy.
