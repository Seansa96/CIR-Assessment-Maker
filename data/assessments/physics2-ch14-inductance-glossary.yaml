    - id: t1
      term: Inductance
      definition: The property of an electrical conductor by which a change in current induces an electromotive
        force (EMF) in both the conductor itself and in any nearby conductors.
      drills:
      - id: t1-drill
        type: flashcard
        prompt: What does Inductance mean?
        answer:
          expected: The property of an electrical conductor by which a change in current induces an electromotive
            force (EMF) in both the conductor itself and in any nearby conductors.
        explanation: 'Solution:


          The property of an electrical conductor by which a change in current induces an electromotive
          force (EMF) in both the conductor itself and in any nearby conductors.


          Why it works:


          This definition identifies the essential meaning of Inductance.'
        tags: []
    - id: t2
      term: Henry (H)
      definition: The SI unit of inductance. One henry is $1\text{ V}\cdot\text{s}/\text{A}$.
      drills:
