glossary:
  sections:
    - title: "Principles"
      entries:
        - term: "LIFO"
          definition: "Last In, First Out. The access principle governing stacks."
        - term: "FIFO"
          definition: "First In, First Out. The access principle governing queues."
    - title: "Operations"
      entries:
        - term: "Push"
          definition: "Adding an element to the top of a stack."
        - term: "Pop"
          definition: "Removing and returning the element at the top of a stack."
        - term: "Enqueue"
          definition: "Adding an element to the back (tail) of a queue."
        - term: "Dequeue"
          definition: "Removing and returning the element at the front (head) of a queue."
