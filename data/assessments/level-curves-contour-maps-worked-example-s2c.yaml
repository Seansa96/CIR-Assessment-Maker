- id: example-001
  title: Analyze the Blue Basin temperature map
  problem: Use the original contour map of water temperature to compare locations A, B, and C, estimate temperature
    change, and interpret contour spacing.
  steps:
  - type: multipleChoice
    prompt: What is the temperature at B?
    choices:
    - id: a
      text: $24^\circ$C
    - id: b
      text: $20^\circ$C
      issueSignals:
      - id: contour-label-misread
    - id: c
      text: $16^\circ$C
      issueSignals:
      - id: contour-interpolation-error
    - id: d
      text: $8^\circ$C
      issueSignals:
      - id: contour-direction-error
    answer:
      choiceId: a
    explanation: 'Solution: The correct choice is $24^\circ$C.


      Why it works: reading the lowest labeled contour


      Why the other choices fail:


      Choice b: $20^\circ$C results from reading the next outer contour.


      Choice c: $16^\circ$C results from reading an adjacent contour on the other side.


      Choice d: $8^\circ$C results from reading the lowest labeled contour.'
    issueSignals:
    - id: contour-label-misread
    - id: contour-interpolation-error
    - id: contour-direction-error
    difficultyDimensions:
    - representationTransfer
    - estimationOrBounds
    difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the
      interpretation against neighboring levels.
    subjectDifficultyTags:
    - contour-map-interpretation
    id: s001
    title: Read the contour label at B
    instruction: What is the temperature at B?
    media:
    - type: image
      src: /media/calculus-3/contour-worked-reservoir.svg
      alt: Original Blue Basin water-temperature contour map with points A, B, and C.
      caption: Use the map labels and relative spacing at the marked points.
  - type: multipleChoice
    prompt: A lies between which adjacent values, and what is its best midpoint estimate?
    choices:
    - id: a
      text: $18^\circ$C
    - id: b
      text: $17^\circ$C
      issueSignals:
      - id: contour-label-misread
    - id: c
      text: $19^\circ$C
      issueSignals:
      - id: contour-interpolation-error
    - id: d
      text: $21^\circ$C
      issueSignals:
      - id: contour-direction-error
    answer:
      choiceId: a
    explanation: 'Solution: The correct choice is $18^\circ$C.


      Why it works: using the midpoint of the wrong 20-to-22 interval


      Why the other choices fail:


      Choice b: $17^\circ$C results from interpolating one quarter rather than halfway across the 16-to-20
      band.


      Choice c: $19^\circ$C results from interpolating three quarters rather than halfway across the 16-to-20
      band.


      Choice d: $21^\circ$C results from using the midpoint of the wrong 20-to-22 interval.'
    issueSignals:
    - id: contour-label-misread
    - id: contour-interpolation-error
    - id: contour-direction-error
    difficultyDimensions:
    - representationTransfer
    - estimationOrBounds
    difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the
      interpretation against neighboring levels.
    subjectDifficultyTags:
    - contour-map-interpretation
    id: s002
    title: Estimate the value at A
    instruction: A lies between which adjacent values, and what is its best midpoint estimate?
    media:
    - type: image
      src: /media/calculus-3/contour-worked-reservoir.svg
      alt: Original Blue Basin water-temperature contour map with points A, B, and C.
      caption: Use the map labels and relative spacing at the marked points.
  - type: multipleChoice
    prompt: Using those readings, how much warmer is B than A?
    choices:
    - id: a
      text: $6^\circ$C
    - id: b
      text: $-6^\circ$C
      issueSignals:
      - id: contour-label-misread
    - id: c
      text: $2^\circ$C
      issueSignals:
      - id: contour-interpolation-error
    - id: d
      text: $42^\circ$C
      issueSignals:
      - id: contour-direction-error
    answer:
      choiceId: a
    explanation: 'Solution: The correct choice is $6^\circ$C.


      Why it works: adding the readings


      Why the other choices fail:


      Choice b: $-6^\circ$C results from subtracting B minus A in reverse order.


      Choice c: $2^\circ$C results from using 20 rather than the interpolated A value.


      Choice d: $42^\circ$C results from adding the readings.'
    issueSignals:
    - id: contour-label-misread
    - id: contour-interpolation-error
    - id: contour-direction-error
    difficultyDimensions:
    - representationTransfer
    - estimationOrBounds
    difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the
      interpretation against neighboring levels.
    subjectDifficultyTags:
    - contour-map-interpretation
    id: s003
    title: Compare the two locations
    instruction: Using those readings, how much warmer is B than A?
    media:
    - type: image
      src: /media/calculus-3/contour-worked-reservoir.svg
      alt: Original Blue Basin water-temperature contour map with points A, B, and C.
      caption: Use the map labels and relative spacing at the marked points.
  - type: multipleChoice
    prompt: From A, which way on the map leads toward larger contour values?
    choices:
    - id: a
      text: Toward the basin center, where labels rise from 16 to 24.
    - id: b
      text: Away from the basin center, where labels fall from 16 to 8.
      issueSignals:
      - id: contour-label-misread
    - id: c
      text: Along the 16 contour.
      issueSignals:
      - id: contour-interpolation-error
    - id: d
      text: Toward the map edge, regardless of labels.
      issueSignals:
      - id: contour-direction-error
    answer:
      choiceId: a
    explanation: 'Solution: The correct choice is Toward the basin center, where labels rise from 16 to 24..


      Why it works: using geographic position instead of contour values


      Why the other choices fail:


      Choice b: Away from the basin center, where labels fall from 16 to 8. results from following decreasing
      labels.


      Choice c: Along the 16 contour. results from staying on the same level curve.


      Choice d: Toward the map edge, regardless of labels. results from using geographic position instead of
      contour values.'
    issueSignals:
    - id: contour-label-misread
    - id: contour-interpolation-error
    - id: contour-direction-error
    difficultyDimensions:
    - representationTransfer
    - estimationOrBounds
    difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the
      interpretation against neighboring levels.
    subjectDifficultyTags:
    - contour-map-interpretation
    id: s004
    title: Identify the direction of increase
    instruction: From A, which way on the map leads toward larger contour values?
    media:
    - type: image
      src: /media/calculus-3/contour-worked-reservoir.svg
      alt: Original Blue Basin water-temperature contour map with points A, B, and C.
      caption: Use the map labels and relative spacing at the marked points.
  - type: multipleChoice
    prompt: Where do equal temperature changes occur over the shortest map distance?
    choices:
    - id: a
      text: Near the northeast basin edge, where neighboring contours are closest.
    - id: b
      text: Near the south edge, where contours are widely separated.
      issueSignals:
      - id: contour-label-misread
    - id: c
      text: The spacing gives no rate information.
      issueSignals:
      - id: contour-interpolation-error
    - id: d
      text: Where the contour values are largest, independent of spacing.
      issueSignals:
      - id: contour-direction-error
    answer:
      choiceId: a
    explanation: 'Solution: The correct choice is Near the northeast basin edge, where neighboring contours
      are closest..


      Why it works: confusing high value with high rate


      Why the other choices fail:


      Choice b: Near the south edge, where contours are widely separated. results from choosing the wider interval
      as steeper.


      Choice c: The spacing gives no rate information. results from ignoring map distance.


      Choice d: Where the contour values are largest, independent of spacing. results from confusing high value
      with high rate.'
    issueSignals:
    - id: contour-label-misread
    - id: contour-interpolation-error
    - id: contour-direction-error
    difficultyDimensions:
    - representationTransfer
    - estimationOrBounds
    difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the
      interpretation against neighboring levels.
    subjectDifficultyTags:
    - contour-map-interpretation
    id: s005
    title: Compare local steepness
    instruction: Where do equal temperature changes occur over the shortest map distance?
    media:
    - type: image
      src: /media/calculus-3/contour-worked-reservoir.svg
      alt: Original Blue Basin water-temperature contour map with points A, B, and C.
      caption: Use the map labels and relative spacing at the marked points.
  - type: multipleChoice
    prompt: What equation describes the contour labeled 16°C on this map?
    choices:
    - id: a
      text: $T(x,y)=16$
    - id: b
      text: $x=16$
      issueSignals:
      - id: contour-label-misread
    - id: c
      text: $y=16$
      issueSignals:
      - id: contour-interpolation-error
    - id: d
      text: $T(16,y)=x$
      issueSignals:
      - id: contour-direction-error
    answer:
      choiceId: a
    explanation: 'Solution: The correct choice is $T(x,y)=16$.


      Why it works: swapping input and output roles


      Why the other choices fail:


      Choice b: $x=16$ results from using the output label as the first input.


      Choice c: $y=16$ results from using the output label as the second input.


      Choice d: $T(16,y)=x$ results from swapping input and output roles.'
    issueSignals:
    - id: contour-label-misread
    - id: contour-interpolation-error
    - id: contour-direction-error
    difficultyDimensions:
    - representationTransfer
    - estimationOrBounds
    difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the
      interpretation against neighboring levels.
    subjectDifficultyTags:
    - contour-map-interpretation
    id: s006
    title: Translate one contour into notation
    instruction: What equation describes the contour labeled 16°C on this map?
    media:
    - type: image
      src: /media/calculus-3/contour-worked-reservoir.svg
      alt: Original Blue Basin water-temperature contour map with points A, B, and C.
      caption: Use the map labels and relative spacing at the marked points.
- id: volcano
  title: Analyze the North Cone elevation map
  problem: Use the original contour map to estimate values, compare changes, and interpret the geometry.
  steps:
  - type: multipleChoice
    prompt: At D, halfway between 300 m and 350 m, what elevation should you estimate?
    choices:
    - id: a
      text: 325 m.
    - id: b
      text: 300 m.
      issueSignals:
      - id: contour-label-misread
    - id: c
      text: 350 m.
      issueSignals:
      - id: contour-interpolation-error
    - id: d
      text: 375 m.
      issueSignals:
      - id: contour-direction-error
    answer:
      choiceId: a
    explanation: 'Solution: The correct choice is 325 m..


      Why it works: moving past the upper contour


      Why the other choices fail:


      Choice b: 300 m. results from using only the lower label.


      Choice c: 350 m. results from using only the upper label.


      Choice d: 375 m. results from moving past the upper contour.'
    issueSignals:
    - id: contour-label-misread
    - id: contour-interpolation-error
    - id: contour-direction-error
    difficultyDimensions:
    - representationTransfer
    - estimationOrBounds
    difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the
      interpretation against neighboring levels.
    subjectDifficultyTags:
    - contour-map-interpretation
    id: ex01
    title: Trace an elevation change across a volcanic slope
    instruction: At D, halfway between 300 m and 350 m, what elevation should you estimate?
    media:
    - type: image
      src: /media/calculus-3/contour-worked-volcano.svg
      alt: Original North Cone elevation contour map with marked points D and E.
      caption: Track the labels at the marked locations and compare adjacent contour spacing.
  - type: multipleChoice
    prompt: E is on the 200-m contour. Estimate the signed elevation change from D to E.
    choices:
    - id: a
      text: -125 m.
    - id: b
      text: +125 m.
      issueSignals:
      - id: contour-label-misread
    - id: c
      text: -75 m.
      issueSignals:
      - id: contour-interpolation-error
    - id: d
      text: +525 m.
      issueSignals:
      - id: contour-direction-error
    answer:
      choiceId: a
    explanation: 'Solution: The correct choice is -125 m..


      Why it works: adding the endpoint elevations


      Why the other choices fail:


      Choice b: +125 m. results from reversing final minus initial.


      Choice c: -75 m. results from using 250 m rather than the midpoint at D.


      Choice d: +525 m. results from adding the endpoint elevations.'
    issueSignals:
    - id: contour-label-misread
    - id: contour-interpolation-error
    - id: contour-direction-error
    difficultyDimensions:
    - representationTransfer
    - estimationOrBounds
    difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the
      interpretation against neighboring levels.
    subjectDifficultyTags:
    - contour-map-interpretation
    id: ex02
    title: Compare a route from D to E
    instruction: E is on the 200-m contour. Estimate the signed elevation change from D to E.
    media:
    - type: image
      src: /media/calculus-3/contour-worked-volcano.svg
      alt: Original North Cone elevation contour map with marked points D and E.
      caption: Track the labels at the marked locations and compare adjacent contour spacing.
  - type: multipleChoice
    prompt: Where is a 50-m elevation change packed into less horizontal distance?
    choices:
    - id: a
      text: Near D, where the inner contours are closer.
    - id: b
      text: Near E, where the outer contours are wider.
      issueSignals:
      - id: contour-label-misread
    - id: c
      text: The regions are equally steep because the same elevation interval is shown.
      issueSignals:
      - id: contour-interpolation-error
    - id: d
      text: At the 400-m contour because it has the largest value.
      issueSignals:
      - id: contour-direction-error
    answer:
      choiceId: a
    explanation: 'Solution: The correct choice is Near D, where the inner contours are closer..


      Why it works: confusing function value with rate


      Why the other choices fail:


      Choice b: Near E, where the outer contours are wider. results from reversing the spacing-rate relationship.


      Choice c: The regions are equally steep because the same elevation interval is shown. results from comparing
      only the elevation interval.


      Choice d: At the 400-m contour because it has the largest value. results from confusing function value
      with rate.'
    issueSignals:
    - id: contour-label-misread
    - id: contour-interpolation-error
    - id: contour-direction-error
    difficultyDimensions:
    - representationTransfer
    - estimationOrBounds
    difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the
      interpretation against neighboring levels.
    subjectDifficultyTags:
    - contour-map-interpretation
    id: ex03
    title: Find the steeper part of the slope
    instruction: Where is a 50-m elevation change packed into less horizontal distance?
    media:
    - type: image
      src: /media/calculus-3/contour-worked-volcano.svg
      alt: Original North Cone elevation contour map with marked points D and E.
      caption: Track the labels at the marked locations and compare adjacent contour spacing.
  - type: multipleChoice
    prompt: What equation describes the 300-m contour for elevation H?
    choices:
    - id: a
      text: H(x,y)=300.
    - id: b
      text: x=300.
      issueSignals:
      - id: contour-label-misread
    - id: c
      text: y=300.
      issueSignals:
      - id: contour-interpolation-error
    - id: d
      text: H(x,y)=0.
      issueSignals:
      - id: contour-direction-error
    answer:
      choiceId: a
    explanation: 'Solution: The correct choice is H(x,y)=300..


      Why it works: writing the zero contour instead


      Why the other choices fail:


      Choice b: x=300. results from using the output level as an input coordinate.


      Choice c: y=300. results from using the output level as the other input coordinate.


      Choice d: H(x,y)=0. results from writing the zero contour instead.'
    issueSignals:
    - id: contour-label-misread
    - id: contour-interpolation-error
    - id: contour-direction-error
    difficultyDimensions:
    - representationTransfer
    - estimationOrBounds
    difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the
      interpretation against neighboring levels.
    subjectDifficultyTags:
    - contour-map-interpretation
    id: ex04
    title: Write the level-set equation
    instruction: What equation describes the 300-m contour for elevation H?
    media:
    - type: image
      src: /media/calculus-3/contour-worked-volcano.svg
      alt: Original North Cone elevation contour map with marked points D and E.
      caption: Track the labels at the marked locations and compare adjacent contour spacing.
- id: weather
  title: Analyze the Harbor temperature map
  problem: Use the original contour map to estimate values, compare changes, and interpret the geometry.
  steps:
  - type: multipleChoice
    prompt: N lies on the 0°C isotherm. What is the temperature at N?
    choices:
    - id: a
      text: 0°C.
    - id: b
      text: -4°C.
      issueSignals:
      - id: contour-label-misread
    - id: c
      text: 4°C.
      issueSignals:
      - id: contour-interpolation-error
    - id: d
      text: The temperature changes along the same isotherm.
      issueSignals:
      - id: contour-direction-error
    answer:
      choiceId: a
    explanation: 'Solution: The correct choice is 0°C..


      Why it works: confusing movement along a contour with crossing one


      Why the other choices fail:


      Choice b: -4°C. results from reading the next lower contour.


      Choice c: 4°C. results from reading the next higher contour.


      Choice d: The temperature changes along the same isotherm. results from confusing movement along a contour
      with crossing one.'
    issueSignals:
    - id: contour-label-misread
    - id: contour-interpolation-error
    - id: contour-direction-error
    difficultyDimensions:
    - representationTransfer
    - estimationOrBounds
    difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the
      interpretation against neighboring levels.
    subjectDifficultyTags:
    - contour-map-interpretation
    id: ex05
    title: Read a temperature at N
    instruction: N lies on the 0°C isotherm. What is the temperature at N?
    media:
    - type: image
      src: /media/calculus-3/contour-worked-weather.svg
      alt: Original Harbor air-temperature contour map with marked points M and N.
      caption: Track the labels at the marked locations and compare adjacent contour spacing.
  - type: multipleChoice
    prompt: M is on the 4°C contour and N is on the 0°C contour. What is $T(N)-T(M)$?
    choices:
    - id: a
      text: -4°C.
    - id: b
      text: +4°C.
      issueSignals:
      - id: contour-label-misread
    - id: c
      text: 0°C.
      issueSignals:
      - id: contour-interpolation-error
    - id: d
      text: 4°C warmer per contour crossing.
      issueSignals:
      - id: contour-direction-error
    answer:
      choiceId: a
    explanation: 'Solution: The correct choice is -4°C..


      Why it works: reporting magnitude without sign


      Why the other choices fail:


      Choice b: +4°C. results from reversing the order in final minus initial.


      Choice c: 0°C. results from assuming distinct contours mean equal temperatures.


      Choice d: 4°C warmer per contour crossing. results from reporting magnitude without sign.'
    issueSignals:
    - id: contour-label-misread
    - id: contour-interpolation-error
    - id: contour-direction-error
    difficultyDimensions:
    - representationTransfer
    - estimationOrBounds
    difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the
      interpretation against neighboring levels.
    subjectDifficultyTags:
    - contour-map-interpretation
    id: ex06
    title: Estimate temperature change from M to N
    instruction: M is on the 4°C contour and N is on the 0°C contour. What is $T(N)-T(M)$?
    media:
    - type: image
      src: /media/calculus-3/contour-worked-weather.svg
      alt: Original Harbor air-temperature contour map with marked points M and N.
      caption: Track the labels at the marked locations and compare adjacent contour spacing.
  - type: multipleChoice
    prompt: From the 0°C contour at N, which direction leads toward increasing temperature?
    choices:
    - id: a
      text: Toward the contour labeled 4.
    - id: b
      text: Toward contours labeled -4 and -8.
      issueSignals:
      - id: contour-label-misread
    - id: c
      text: Along the 0°C contour.
      issueSignals:
      - id: contour-interpolation-error
    - id: d
      text: Toward the map edge regardless of labels.
      issueSignals:
      - id: contour-direction-error
    answer:
      choiceId: a
    explanation: 'Solution: The correct choice is Toward the contour labeled 4..


      Why it works: ignoring the contour labels


      Why the other choices fail:


      Choice b: Toward contours labeled -4 and -8. results from following decreasing values.


      Choice c: Along the 0°C contour. results from staying on a level curve.


      Choice d: Toward the map edge regardless of labels. results from ignoring the contour labels.'
    issueSignals:
    - id: contour-label-misread
    - id: contour-interpolation-error
    - id: contour-direction-error
    difficultyDimensions:
    - representationTransfer
    - estimationOrBounds
    difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the
      interpretation against neighboring levels.
    subjectDifficultyTags:
    - contour-map-interpretation
    id: ex07
    title: Locate the warmest direction
    instruction: From the 0°C contour at N, which direction leads toward increasing temperature?
    media:
    - type: image
      src: /media/calculus-3/contour-worked-weather.svg
      alt: Original Harbor air-temperature contour map with marked points M and N.
      caption: Track the labels at the marked locations and compare adjacent contour spacing.
  - type: multipleChoice
    prompt: If M lies on the 4°C isotherm, which equation describes that curve?
    choices:
    - id: a
      text: T(x,y)=4.
    - id: b
      text: x=4.
      issueSignals:
      - id: contour-label-misread
    - id: c
      text: T(4,y)=x.
      issueSignals:
      - id: contour-interpolation-error
    - id: d
      text: T(x,y)=0.
      issueSignals:
      - id: contour-direction-error
    answer:
      choiceId: a
    explanation: 'Solution: The correct choice is T(x,y)=4..


      Why it works: using the wrong labeled contour


      Why the other choices fail:


      Choice b: x=4. results from using the output as an input.


      Choice c: T(4,y)=x. results from swapping input and output roles.


      Choice d: T(x,y)=0. results from using the wrong labeled contour.'
    issueSignals:
    - id: contour-label-misread
    - id: contour-interpolation-error
    - id: contour-direction-error
    difficultyDimensions:
    - representationTransfer
    - estimationOrBounds
    difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the
      interpretation against neighboring levels.
    subjectDifficultyTags:
    - contour-map-interpretation
    id: ex08
    title: Relate an isotherm to notation
    instruction: If M lies on the 4°C isotherm, which equation describes that curve?
    media:
    - type: image
      src: /media/calculus-3/contour-worked-weather.svg
      alt: Original Harbor air-temperature contour map with marked points M and N.
      caption: Track the labels at the marked locations and compare adjacent contour spacing.
