schemaVersion: 1
id: calc2-area-between-curves-concept-lesson-s2c
title: 'Area Between Curves: Bound, Order, Partition, Integrate'

assessmentType: conceptLesson
categoryId: calculus-2
topicId: area-between-curves
modeDefault: practice
randomizeQuestions: false
skills: [curve-intersections, area-between-curves, vertical-horizontal-slices, piecewise-partitioning]
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags: [calculus-2, area-between-curves, geometric-modeling]
authoring:
  visualRequirement: required
  visualRationale: Curve order, intersection bounds, and slice orientation are spatial decisions.
lesson:
  introduction: 'An area-between-curves integral is not a formula hunt. First locate the enclosed region, then make every slice’s height or length nonnegative on its interval.'
  sections:
    - id: bounds
      title: 1. Intersections create the bounds
      required: true
      content: 'Solve $f(x)=g(x)$ or the corresponding horizontal-boundary equation to find where an enclosed region begins and ends. A graph estimates the structure; algebra supplies exact bounds when possible.'
      media: [{ type: image, src: /media/calculus/area-between-curves-model.svg, alt: Shaded region between two curves with intersections labelled, caption: 'The intersection points identify the first and last included slices.' }]
      check: { id: c1, type: multipleChoice, prompt: 'Why solve $f(x)=g(x)$ before a vertical area setup?', choices: [{ id: a, text: To find where the slice interval begins and ends. }, { id: b, text: To find an antiderivative. }, { id: c, text: To make dx equal zero. }, { id: d, text: To eliminate one curve. }], answer: { choiceId: a }, explanation: 'Solution: Equal y-values locate curve intersections, which often bound the region. Why it works: Slices are accumulated only between those locations. Common trap: An intersection is a boundary location, not automatically the integrand. Why the other choices fail: Antiderivatives and dx are unrelated to solving equality; neither curve is discarded.' }
    - id: vertical
      title: 2. Build vertical slices as top minus bottom
      required: true
      content: 'When both curves are functions of x and one stays above the other, use $A=\int_a^b[f(x)-g(x)]\,dx$. Test one interior x-value if the graph does not make the order obvious.'
      media: [{ type: image, src: /media/calculus/area-between-curves-model.svg, alt: Vertical slice labelled top minus bottom and dx, caption: 'A vertical slice measures a y-distance.' }]
      check: { id: c2, type: multipleChoice, prompt: 'If $f$ is above $g$ on $[a,b]$, what is the slice height?', choices: [{ id: a, text: '$f(x)-g(x)$' }, { id: b, text: '$g(x)-f(x)$' }, { id: c, text: '$f(x)g(x)$' }, { id: d, text: '$f(x)+g(x)$' }], answer: { choiceId: a }, explanation: 'Solution: The positive y-distance from g to f is $f(x)-g(x)$. Why it works: Vertical distance equals upper coordinate minus lower coordinate. Common trap: Reversing the order computes signed area. Why the other choices fail: Product and sum are not distances; b has the wrong sign.' }
    - id: horizontal
      title: 3. Switch when horizontal slices simplify the boundaries
      required: true
      content: 'If solving for y creates multiple pieces but x is naturally expressed in terms of y, use $A=\int_c^d[R(y)-L(y)]\,dy$. Switching orientation requires switching both bounds and boundary expressions.'
      media: [{ type: image, src: /media/calculus/area-between-curves-model.svg, alt: Area model used to contrast horizontal slicing, caption: 'Horizontal slices measure right minus left with dy.' }]
      check: { id: c3, type: multipleChoice, prompt: 'Which expression describes a horizontal slice?', choices: [{ id: a, text: '$[R(y)-L(y)]\,dy$' }, { id: b, text: '$[f(x)-g(x)]\,dy$' }, { id: c, text: '$R(y)L(y)$' }, { id: d, text: '$[L(y)-R(y)]\,dy$' }], answer: { choiceId: a }, explanation: 'Solution: Horizontal length is right minus left and its thickness is dy. Why it works: The slice varies in y. Common trap: Changing dx to dy alone does not convert a model. Why the other choices fail: b keeps vertical boundary notation; c is a product; d reverses the distance.' }
    - id: partition
      title: 4. Partition whenever an expression or order changes
      required: true
      content: 'Split the integral at an intersection, axis crossing, absolute-value corner, or piecewise-rule break whenever it changes which boundary is top/bottom or right/left. One integral is valid only while one formula describes every slice.'
      media: [{ type: image, src: /media/calculus/area-between-curves-model.svg, alt: Area diagram with a representative slice, caption: 'A partition is needed when the slice description changes.' }]
      check: { id: c4, type: multipleChoice, prompt: 'What forces a partition in an area model?', choices: [{ id: a, text: The upper or lower boundary changes identity. }, { id: b, text: The integral has finite bounds. }, { id: c, text: A curve is polynomial. }, { id: d, text: The region is shaded. }], answer: { choiceId: a }, explanation: 'Solution: Partition at every point where the slice formula changes. Why it works: Each integral piece needs one correct nonnegative distance expression. Common trap: Finite bounds do not guarantee a single formula. Why the other choices fail: Polynomial type and shading do not determine partitions.' }
    - id: signed
      title: 5. Keep geometric area nonnegative
      required: true
      content: 'An area between curves is a sum of distances, so it is nonnegative. If a proposed integrand changes sign, either the boundaries were reversed on part of the interval or the region needs a partition.'
      media: [{ type: image, src: /media/calculus/area-between-curves-model.svg, alt: Shaded region showing positive slice height, caption: 'A region’s slice contribution is a distance, never a negative area.' }]
      check: { id: c5, type: freeResponse, prompt: 'State one quick check that a proposed area integrand has the right boundary order.', answer: { gradingMode: selfCheck, keyPoints: [test interior point, integrand nonnegative, upper minus lower] }, explanation: 'Solution: Test an interior value or inspect the graph; the distance integrand should be nonnegative. Why it works: Area accumulates positive slice sizes. Common trap: A negative integral can be algebraically correct but geometrically wrong for area.' }
    - id: units
      title: 6. Confirm the units and magnitude
      required: true
      content: 'If both axes measure length, area has square units. Compare the result with a simple bounding rectangle when possible; an answer far larger or negative often exposes a wrong bound, order, or unit.'
      media: [{ type: image, src: /media/calculus/area-between-curves-model.svg, alt: Shaded bounded region, caption: 'Use a rough rectangle as a scale check after integration.' }]
      check: { id: c6, type: multipleChoice, prompt: 'If x and y are in meters, the area between curves has units of', choices: [{ id: a, text: square meters }, { id: b, text: meters }, { id: c, text: cubic meters }, { id: d, text: meters per square meter }], answer: { choiceId: a }, explanation: 'Solution: Height in meters times width in meters gives square meters. Why it works: An area slice is a length-by-length rectangle. Common trap: Cubic units require an additional thickness dimension. Why the other choices fail: Linear or inverse units omit or invert a length factor.' }
    - id: workflow
      title: 7. Use the full area workflow
      required: true
      content: 'Sketch; solve intersections; choose vertical or horizontal orientation; identify top/bottom or right/left; partition if needed; integrate; then verify sign, bounds, and units. This sequence keeps model decisions visible instead of hiding them inside algebra.'
      media: [{ type: image, src: /media/calculus/area-between-curves-model.svg, alt: Complete area-between-curves model with intersections and vertical slice, caption: 'Bound, order, partition, integrate, then check.' }]
      check: { id: c7, type: freeResponse, prompt: 'List the two boundary-order phrases for vertical and horizontal area slices.', answer: { gradingMode: selfCheck, keyPoints: [top minus bottom, right minus left] }, explanation: 'Solution: Vertical uses top minus bottom; horizontal uses right minus left. Why it works: The phrases name the coordinate distance measured by the slice. Common trap: Pair each phrase with its matching differential, dx or dy.' }
