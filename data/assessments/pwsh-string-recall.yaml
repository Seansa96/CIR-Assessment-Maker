schemaVersion: 1
id: pwsh-string-recall
title: "String Manipulation Recall Drill"
assessmentType: recallDrill
categoryId: scripting
subcategoryIds:
  - pwsh-string-basics
  - pwsh-string-methods
  - pwsh-regex
skills:
- Apply scripting concepts
- Apply String Basics and Quoting
- Apply String Methods and Manipulation
- Apply Regular Expressions in PowerShell
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - scripting
  - pwsh-string-basics
  - pwsh-string-methods
  - pwsh-regex
modeDefault: practice
items:
  - id: item-001
    type: flashcard
    prompt: 'Which type of quotes (single or double) will evaluate variables inside the string?'
    answer:
      expected: |
        **Double quotes** (`" "`)
  - id: item-002
    type: flashcard
    prompt: 'What syntax do you use to evaluate an object property (like `$File.Length`) inside a double-quoted string?'
    answer:
      expected: |
        A sub-expression: **`$()`** (e.g., `"Size: $($File.Length)"`)
  - id: item-003
    type: flashcard
    prompt: 'What character is used to escape special characters in PowerShell strings?'
    answer:
      expected: |
        The **backtick** (`` ` ``)
  - id: item-004
    type: flashcard
    prompt: 'What string method removes whitespace from the beginning and end of a string?'
    answer:
      expected: |
        **`.Trim()`**
  - id: item-005
    type: flashcard
    prompt: 'Is the .NET string method `.Replace()` case-sensitive or case-insensitive?'
    answer:
      expected: |
        It is strictly **case-sensitive**.
  - id: item-006
    type: flashcard
    prompt: 'Which PowerShell operator uses regular expressions to replace text and is case-insensitive by default?'
    answer:
      expected: |
        **`-replace`**
  - id: item-007
    type: flashcard
    prompt: 'When the `-match` operator successfully finds a match, what automatic variable is populated with the matched text?'
    answer:
      expected: |
        **`$Matches`**
  - id: item-008
    type: flashcard
    prompt: 'How do you force a PowerShell comparison operator (like `-match` or `-replace`) to be strictly case-sensitive?'
    answer:
      expected: |
        Prefix the operator with a **c** (e.g., **`-cmatch`** or **`-creplace`**).
