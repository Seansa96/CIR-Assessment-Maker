  type: numericResponse
  prompt: |
    A horizontal rigid beam of length $L = 4.0\text{ m}$ is hinged at the wall. Its far end is supported by a diagonal brass wire that makes a $30^\circ$ angle with the beam. A mass of $500\text{ kg}$ is hung from the far end of the beam. The beam's own mass is negligible.
    
    The brass wire has a cross-sectional area of $2.0 \times 10^{-5}\text{ m}^2$ and a Young's Modulus of $9.0 \times 10^{10}\text{ N/m}^2$. Due to the tension, the brass wire stretches, causing the far end of the beam to drop slightly by a small distance $y$. 
    
    Calculate the vertical drop $y$ of the hanging mass in millimeters. Use $g = 9.8\text{ m/s}^2$ and assume small angle approximation.
  answer:
    value: 50.3
    tolerance: 0.5
  explanation: |
    Solution:
    1. **Static Equilibrium**: Take torques about the hinge to find the tension $T$ in the brass wire.
       The vertical component of tension is $T \sin(30^\circ)$.
       $$ \sum \tau = (T \sin 30^\circ)(L) - (mg)(L) = 0 $$
       $$ T \sin 30^\circ = mg \implies T = \frac{mg}{\sin 30^\circ} = \frac{(500)(9.8)}{0.5} = 9800\text{ N} $$
       
    2. **Wire Stretch**: Calculate the stretch $\Delta s$ of the diagonal wire.
       The length of the wire is $s = L / \cos 30^\circ = 4.0 / (\sqrt{3}/2) \approx 4.6188\text{ m}$.
       $$ \Delta s = \frac{T s}{Y A} = \frac{(9800)(4.6188)}{(9.0 \times 10^{10})(2.0 \times 10^{-5})} \approx 0.02515\text{ m} $$
       
    3. **Geometry of the Drop**: 
       When the wire stretches by $\Delta s$, the end of the beam drops vertically by $y$. Using small-angle approximation, the stretch of the wire $\Delta s$ is related to the vertical drop $y$ by projecting the vertical drop onto the diagonal wire direction:
       $$ \Delta s = y \sin 30^\circ $$
       $$ y = \frac{\Delta s}{\sin 30^\circ} = \frac{0.02515}{0.5} = 0.0503\text{ m} = 50.3\text{ mm} $$
       
       *(Wait, recalculating: $\Delta s = (9800 \times 4.6188) / 1.8 \times 10^6 = 0.025146$ m. Then $y = 0.025146 / 0.5 = 0.05029$ m = 50.3 mm. Let's adjust the answer key to 50.3.)*
       
    Why it works: This problem synthesizes static equilibrium (torques) to find the internal force, elasticity to find the deformation, and geometry to project the deformation into the observed spatial shift.
