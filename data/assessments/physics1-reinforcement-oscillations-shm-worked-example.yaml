- id: reinforcement-shm-we1
  title: Spring oscillator period and speed
  problem: A mass $m=0.50\,\mathrm{kg}$ is attached to a spring with $k=200\,\mathrm{N/m}$ and amplitude $A=0.10\,\mathrm m$.
  steps:
  - id: reinforcement-shm-we1-s1
    title: Find the angular frequency
    instruction: Select the oscillator model and evaluate its angular frequency.
    hint: Use $\omega=\sqrt{k/m}$.
    type: multipleChoice
    prompt: Which value of $\omega$ is correct?
    choices:
    - { id: a, text: '$20\,\mathrm{rad/s}$' }
    - { id: b, text: '$10\,\mathrm{rad/s}$', issueSignals: [{ id: physics1-shm-square-root-evaluation, domains: [physics-1] }] }
    - { id: c, text: '$400\,\mathrm{rad/s}$', issueSignals: [{ id: physics1-shm-ratio-not-root, domains: [physics-1] }] }
    - { id: d, text: '$0.025\,\mathrm{rad/s}$', issueSignals: [{ id: physics1-shm-inverted-ratio, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: $\omega=\sqrt{200/0.50}=20\,\mathrm{rad/s}$. Why it works: The spring equation gives $\omega^2=k/m$. Why the other choices fail: They take the wrong square root, omit the root, or invert the ratio.'
  - id: reinforcement-shm-we1-s2
    title: Find the maximum speed
    instruction: Connect amplitude and angular frequency at equilibrium.
    hint: $v_{\max}=\omega A$.
    type: multipleChoice
    prompt: What is the maximum speed?
    choices:
    - { id: a, text: '$2.0\,\mathrm{m/s}$' }
    - { id: b, text: '$20\,\mathrm{m/s}$', issueSignals: [{ id: physics1-shm-amplitude-omission, domains: [physics-1] }] }
    - { id: c, text: '$0.005\,\mathrm{m/s}$', issueSignals: [{ id: physics1-shm-speed-division, domains: [physics-1] }] }
    - { id: d, text: '$0\,\mathrm{m/s}$', issueSignals: [{ id: physics1-shm-equilibrium-speed, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: $v_{\max}=\omega A=(20)(0.10)=2.0\,\mathrm{m/s}$. Why it works: Speed is largest at equilibrium and scales with both frequency and amplitude. Why the other choices fail: They omit amplitude, divide instead, or confuse equilibrium with a turning point.'
- id: reinforcement-shm-we2
  title: Pendulum phase and energy
  problem: A small-angle pendulum is released from rest at a positive angular displacement.
  steps:
  - id: reinforcement-shm-we2-s1
    title: Identify the initial acceleration
    instruction: Use the small-angle restoring equation.
    hint: $\alpha\approx-(g/L)\theta$.
    type: multipleChoice
    prompt: Immediately after release, which statement is correct?
    choices:
    - { id: a, text: '$\omega=0$ and angular acceleration points toward equilibrium' }
    - { id: b, text: '$\omega$ is maximum and angular acceleration is zero', issueSignals: [{ id: physics1-pendulum-release-speed, domains: [physics-1] }] }
    - { id: c, text: 'Angular acceleration points farther from equilibrium', issueSignals: [{ id: physics1-pendulum-restoring-sign, domains: [physics-1] }] }
    - { id: d, text: 'Both angular speed and acceleration are zero', issueSignals: [{ id: physics1-pendulum-acceleration-zero, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: Release from rest gives $\omega=0$, while positive $\theta$ gives negative restoring acceleration. Why it works: A turning point has zero speed but nonzero restoring torque. Why the other choices fail: Maximum speed occurs at equilibrium, and the torque does not vanish at a displaced release point.'
  - id: reinforcement-shm-we2-s2
    title: Track the energy conversion
    instruction: Compare gravitational potential and kinetic energy at equilibrium.
    hint: Ignore damping and use conservation of mechanical energy.
    type: multipleChoice
    prompt: At the lowest point, what is true for the ideal pendulum?
    choices:
    - { id: a, text: 'Kinetic energy is maximum and gravitational potential energy is minimum' }
    - { id: b, text: 'Both are maximum', issueSignals: [{ id: physics1-pendulum-energy-both-max, domains: [physics-1] }] }
    - { id: c, text: 'Kinetic energy is zero and gravitational potential energy is maximum', issueSignals: [{ id: physics1-pendulum-energy-turning-point, domains: [physics-1] }] }
    - { id: d, text: 'Total mechanical energy is zero', issueSignals: [{ id: physics1-pendulum-energy-total-zero, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: At equilibrium the pendulum moves fastest, so $K$ is maximum and gravitational potential energy is minimum. Why it works: Energy released from the elevated turning point has become kinetic energy. Why the other choices fail: They place turning-point conditions at equilibrium or confuse a reference choice with zero total energy.'
