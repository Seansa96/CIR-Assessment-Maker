lesson:
  introduction: This lesson develops Damped Oscillations from a diagram, a mathematical model, and a calculus-based
    interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      In real-world systems, non-conservative forces like air resistance or internal friction remove mechanical energy from an oscillating system. This physical system introduces a damping force that opposes the motion, causing the amplitude to gradually decrease over time. This is known as a damped oscillation.
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    check: {id: damp-s1-check, type: multipleChoice, prompt: 'What causes damping energy loss?', choices: [{id: a, text: 'A nonconservative force'}, {id: b, text: 'Not this concept'}, {id: c, text: 'A constant value'}, {id: d, text: 'Cannot be determined'}], answer: {choiceId: a}, explanation: 'Nonconservative forces such as drag remove energy.'}
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      The new measurable quantity introduced is the damping constant $b$, which represents the strength of the damping force. The amplitude is no longer a constant $A$, but a time-dependent function $A(t)$ that decays as energy is dissipated.
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    check: {id: damp-s2-check, type: multipleChoice, prompt: 'What does $b$ measure?', choices: [{id: a, text: 'Damping strength'}, {id: b, text: 'Not this concept'}, {id: c, text: 'A constant value'}, {id: d, text: 'Cannot be determined'}], answer: {choiceId: a}, explanation: 'The damping constant sets the velocity-dependent force strength.'}
  - id: s3
    title: Mathematical model
    content: >-
      The mathematical model includes the damping force, typically modeled as proportional to velocity: $F_{\text{damp}} = -bv$. Adding this to the restoring force in Newton's second law gives: $-kx - bv = ma$.
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    check: {id: damp-s3-check, type: multipleChoice, prompt: 'Which force model opposes velocity?', choices: [{id: a, text: '$-bv$'}, {id: b, text: 'Not this concept'}, {id: c, text: 'A constant value'}, {id: d, text: 'Cannot be determined'}], answer: {choiceId: a}, explanation: 'The negative sign makes linear damping oppose motion.'}
  - id: s4
    title: Calculus connection
    content: >-
      In calculus terms, this forms a linear, second-order, homogeneous differential equation: $m\frac{d^2x}{dt^2} + b\frac{dx}{dt} + kx = 0$. The solutions to this equation heavily depend on the relative sizes of $m$, $b$, and $k$.
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    check: {id: damp-s4-check, type: multipleChoice, prompt: 'What order is the equation of motion?', choices: [{id: a, text: 'Second order'}, {id: b, text: 'Not this concept'}, {id: c, text: 'A constant value'}, {id: d, text: 'Cannot be determined'}], answer: {choiceId: a}, explanation: 'Acceleration is a second derivative.'}
  - id: s5
    title: Derivation or justification
    content: >-
      For a weakly damped (underdamped) system where $b$ is small, the solution is $x(t) = A_0 e^{-bt/2m} \cos(\omega' t + \phi)$. The amplitude $A_0 e^{-bt/2m}$ decays exponentially. The new angular frequency is slightly lower than the natural frequency: $\omega' = \sqrt{\frac{k}{m} - (\frac{b}{2m})^2}$.
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    check: {id: damp-s5-check, type: multipleChoice, prompt: 'How does underdamped amplitude change?', choices: [{id: a, text: 'It decays exponentially'}, {id: b, text: 'Not this concept'}, {id: c, text: 'A constant value'}, {id: d, text: 'Cannot be determined'}], answer: {choiceId: a}, explanation: 'The underdamped solution has an exponential envelope.'}
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, an underdamped oscillation looks like a sinusoidal wave bound within an exponentially decaying envelope. The peaks of the wave steadily decrease, approaching zero as $t \to \infty$.
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    check: {id: damp-s6-check, type: multipleChoice, prompt: 'What bounds an underdamped graph?', choices: [{id: a, text: 'A decaying envelope'}, {id: b, text: 'Not this concept'}, {id: c, text: 'A constant value'}, {id: d, text: 'Cannot be determined'}], answer: {choiceId: a}, explanation: 'Successive peaks lie on a decaying envelope.'}
  - id: s7
    title: Quantitative strategy
    content: >-
      A quantitative strategy is evaluating the critical damping condition, where $b^2 - 4mk = 0$. If $b = 2\sqrt{mk}$, the system is critically damped and returns to equilibrium as fast as possible without oscillating. If $b > 2\sqrt{mk}$, it is overdamped and returns sluggishly.
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    check: {id: damp-s7-check, type: multipleChoice, prompt: 'Which regime returns fastest without oscillating?', choices: [{id: a, text: 'Critical damping'}, {id: b, text: 'Not this concept'}, {id: c, text: 'A constant value'}, {id: d, text: 'Cannot be determined'}], answer: {choiceId: a}, explanation: 'Critical damping is the fastest nonoscillatory response.'}
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: if $b \to 0$, the exponential term $e^0 = 1$ and $\omega' \to \sqrt{k/m}$, returning exactly to the ideal simple harmonic motion equations. The SI unit for $b$ is $\text{kg/s}$ to ensure $-bv$ yields Newtons.
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    check: {id: damp-s8-check, type: multipleChoice, prompt: 'What happens when $b$ approaches zero?', choices: [{id: a, text: 'Ideal SHM is recovered'}, {id: b, text: 'Mass vanishes'}, {id: c, text: 'Frequency is zero'}, {id: d, text: 'The spring force reverses'}], answer: {choiceId: a}, explanation: 'With no damping, the exponential factor becomes one and ideal SHM remains.'}
  - id: s9
    title: Viscous damping and the limit of this model
    content: >-
      This source-supported model uses a viscous damping force proportional to velocity, $F_{\text{damp}}=-bv$. It provides a useful bridge to materials that show both restoring and dissipative behavior: their motion can lose mechanical energy while an elastic restoring force remains. It does not, by itself, specify a material-specific viscoelastic constitutive law or a relaxation experiment. Those extensions require additional source material and are intentionally outside this lesson's claims.
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: The dashpot represents the source-supported viscous damping model, not a complete viscoelastic-material model.
    check: {id: damp-s9-check, type: multipleChoice, prompt: 'What model is assumed here?', choices: [{id: a, text: 'Viscous damping proportional to velocity'}, {id: b, text: 'Material-specific viscoelasticity'}, {id: c, text: 'No restoring force'}, {id: d, text: 'Constant acceleration'}], answer: {choiceId: a}, explanation: 'This lesson uses the source-supported linear viscous-damping model.'}
