- id: we-geom-accumulation
  title: Net Signed Area as Accumulation
  problem: 'Adapted from OpenStax Calculus Volume 2.


    Evaluate the integral $\int_{-2}^2 \sqrt{4 - x^2} \, dx$ by interpreting it in
    terms of areas.

    '
  steps:
  - id: step-we-geom-accumulation-1
    title: Identify the Function's Geometry
    instruction: Describe the geometric shape represented by the function.
    type: multipleChoice
    prompt: |
      What geometric shape is described by the graph of $y = \sqrt{4 - x^2}$?
    explanation: |
      Squaring both sides of $y = \sqrt{4 - x^2}$ gives $y^2 = 4 - x^2$, or $x^2 + y^2 = 4$. This is a circle of radius $r=2$. Since $y$ is the principal square root, it represents only the non-negative values ($y \ge 0$), which is the upper semicircle.
    choices:
    - id: c1
      text: A full circle of radius 2 centered at the origin.
    - id: c2
      text: The upper half of a circle of radius 2 centered at the origin.
    - id: c3
      text: A parabola opening downward with vertex at (0, 2).
    - id: c4
      text: The right half of a circle of radius 2 centered at the origin.
    answer:
      choiceId: c2
  - id: step-we-geom-accumulation-2
    title: Calculate the Area
    instruction: Use geometric formulas to compute the area.
    type: symbolicResponse
    prompt: |
      Given that the region is an upper semicircle of radius $r=2$, compute its area.
    answer:
      gradingMode: auto
      acceptedForms:
      - 2 * \pi
      expectedLatex: 2\pi
      equivalenceMode: expression
      tolerance: 0
    explanation: "The area of a full circle is $A = \\pi r^2$. \nThe area of a semicircle\
      \ is $A = \\frac{1}{2} \\pi r^2$.\nSubstituting $r = 2$, we get $A = \\frac{1}{2}\
      \ \\pi (2)^2 = \\frac{1}{2} \\pi (4) = 2\\pi$.\nTherefore, $\\int_{-2}^2 \\\
      sqrt{4 - x^2} \\, dx = 2\\pi$.\n"
- id: we-geom-triangle
  title: Evaluating Integrals of Linear Functions
  problem: 'Adapted from OpenStax Calculus Volume 2.


    Evaluate the integral $\int_0^4 (2x) \, dx$ using geometric formulas rather than
    the Fundamental Theorem of Calculus.

    '
  steps:
  - id: step-we-geom-triangle-1
    title: Sketch the Region
    instruction: Identify the geometric region bounded by the graph.
    type: multipleChoice
    prompt: |
      What is the shape of the region bounded by $y = 2x$, the x-axis, and the vertical line $x = 4$?
    explanation: |
      The line $y = 2x$ passes through the origin. The region bounded by this line, the x-axis, and $x = 4$ forms a right triangle with vertices at $(0,0)$, $(4,0)$, and $(4,8)$.
    choices:
    - id: c1
      text: A rectangle.
    - id: c2
      text: A trapezoid.
    - id: c3
      text: A right triangle.
    - id: c4
      text: A semicircle.
    answer:
      choiceId: c3
  - id: step-we-geom-triangle-2
    title: Compute the Area
    instruction: Use the area formula for a triangle.
    type: numericResponse
    prompt: |
      Compute the area of the triangle to find the value of the integral.
    answer:
      gradingMode: auto
      tolerance: 0
      value: 16
    explanation: |
      The base of the triangle is $b = 4 - 0 = 4$.
      The height of the triangle is $h = 2(4) = 8$.
      The area of a triangle is $A = \frac{1}{2} b h$.
      Substituting the values, we get $A = \frac{1}{2} (4)(8) = 16$.
