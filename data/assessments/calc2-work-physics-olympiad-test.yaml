questions:
- id: q001
  type: freeResponse
  skills:
  - work-physics
  - olympiad-problem-solving
  prompt: A spring has constant $2$ N/m. Find the work required to stretch it from $0$ to $2$ m beyond equilibrium.
  answer:
    gradingMode: selfCheck
    expected: $4$ J.
    keyPoints:
    - 'Matches the reference result: $4$ J.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: Hooke's law gives force $F(x)=2x$. Thus $W=\int_0^22x\,dx=22$ joules.
