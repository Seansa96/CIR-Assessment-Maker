  type: numericResponse
  prompt: |
    In a Cavendish torsion balance experiment, a rigid rod of length $L = 0.50\text{ m}$ is suspended by a thin wire. Two small masses $m = 0.050\text{ kg}$ are attached to the ends of the rod. Two large lead spheres $M = 20.0\text{ kg}$ are brought to a distance $r = 0.10\text{ m}$ from each small mass, perfectly perpendicular to the rod, creating a gravitational torque.
    
    The rod twists until it reaches static equilibrium at an angle of $\theta = 0.0020\text{ rad}$.
    
    Calculate the torsion constant $\kappa$ of the suspension wire in units of $10^{-9} \text{ N}\cdot\text{m/rad}$. Use $G = 6.674 \times 10^{-11}$. (For example, if the answer is $4.5 \times 10^{-9}$, enter 4.5).
  answer:
    value: 1668.5
    tolerance: 0.5
  explanation: |
    Solution:
    The system reaches equilibrium when the gravitational torque equals the restoring torque of the wire.
    
    Why it works:
    1. Find the gravitational force $F$ between one pair of masses ($m$ and $M$):
       $$ F = G \frac{mM}{r^2} = (6.674 \times 10^{-11}) \frac{(0.050)(20.0)}{(0.10)^2} $$
       $$ F = (6.674 \times 10^{-11}) \frac{1.0}{0.01} = 6.674 \times 10^{-9}\text{ N} $$
    
    2. Calculate the total gravitational torque. Since there are two pairs of masses acting at a distance $L/2$ from the pivot:
       $$ \tau_{\text{grav}} = 2 \times F \times \frac{L}{2} = F L $$
       $$ \tau_{\text{grav}} = (6.674 \times 10^{-9})(0.50) = 3.337 \times 10^{-9}\text{ N}\cdot\text{m} $$
       
    3. Equate to the restoring torque to find the torsion constant $\kappa$:
       $$ \tau_{\text{wire}} = \kappa \theta $$
       $$ \kappa = \frac{\tau_{\text{grav}}}{\theta} = \frac{3.337 \times 10^{-9}}{0.0020} = 1.6685 \times 10^{-6}\text{ N}\cdot\text{m/rad} $$
       
    Wait, my unit request asks for units of $10^{-9}$. $1.6685 \times 10^{-6}$ is $1668.5 \times 10^{-9}$. 
    Let me recalculate.
    $F = 6.674 \times 10^{-9}$. 
    $\tau = 6.674 \times 10^{-9} \times 0.5 = 3.337 \times 10^{-9}$.
    $\kappa = 3.337 \times 10^{-9} / 0.002 = 1.6685 \times 10^{-6}$.
    In units of $10^{-9}$, this is $1668.5$.
    
    Let's adjust the answer key to $1668.5$.
