lesson:
  introduction: Learn to solve Shifts, Turns, Flips, Stretches, and Squeezes problems by recognizing translation, rotation, reflection, distortion, dilation, transformation proofs and justifying each theorem or transformation.
  sections:
  - id: aops-transformations-motivation
    title: What the topic helps you notice
    required: true
    content: Shifts, Turns, Flips, Stretches, and Squeezes is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are translation, rotation, reflection, distortion, dilation, transformation proofs.
    check:
      id: aops-transformations-motivation-check
      type: multipleChoice
      prompt: In Shifts, Turns, Flips, Stretches, and Squeezes, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-transformations-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-transformations-definitions-check
      type: multipleChoice
      prompt: In Shifts, Turns, Flips, Stretches, and Squeezes, what should be checked before applying a method?
      choices:
