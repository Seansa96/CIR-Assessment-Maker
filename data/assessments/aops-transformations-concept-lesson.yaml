      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-transformations-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: track invariant quantities, map coordinates under a rule, use transformations to prove congruence. Record the givens, unknown, and any restriction before selecting a method.'
    check:
      id: aops-transformations-recognition-check
      type: multipleChoice
      prompt: In Shifts, Turns, Flips, Stretches, and Squeezes, what should be checked before applying a method?
      choices:
