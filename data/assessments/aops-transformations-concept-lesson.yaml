skills:
- Apply translations, rotations, reflections, and dilations to points and shapes.
- Identify isometries (rigid motions) and distinguish them from similarities.
- Use compositions of transformations to simplify geometric proofs.
lesson:
  sections:
  - id: section-isometries
    title: Isometries (Rigid Motions)
    content: 'An **isometry** (or rigid motion) is a transformation that preserves the exact distances
      between every pair of points. Because distances are preserved, angle measures, collinearity (points
      on a line), and areas are also strictly preserved.


      If you apply an isometry to a triangle, the resulting image is perfectly **congruent** to the original
      triangle.


      There are exactly four types of isometries in 2D geometry:

      1. Translations (slides)

      2. Rotations (turns)

      3. Reflections (flips)

      4. Glide Reflections (a flip followed by a slide)

      '
    check:
      type: multipleChoice
      prompt: Which of the following transformations is NOT an isometry?
      choices:
      - id: a
        text: A dilation with a scale factor of 2.
      - id: b
        text: A reflection across the $y$-axis.
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: c
        text: A rotation of $45^\circ$ around the origin.
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: d
        text: A translation shifting the figure 3 units right.
        issueSignals:
        - id: wrong-concept
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - Recall the definition of an isometry (preserves distance).
      - Identify that a dilation changes distances (scale factor $\neq 1$).
      explanation: 'Solution:

        An isometry must preserve the exact size and shape of a figure.

        A dilation with a scale factor of 2 doubles all distances, meaning the image is larger than the
        original. Since distance is not preserved, it is not an isometry.

        Reflections, rotations, and translations all preserve exact distances.


        Why it works:

        Dilations produce *similar* figures, not congruent figures. Isometries must produce congruent
        figures.

        '
      id: section-isometries-check
    required: true
  - id: section-translations
    title: Translations
    content: 'A **translation** shifts every point in the plane by the exact same distance and in the
      exact same direction.

      We often represent a translation by a vector $\vec{v} = \langle a, b \rangle$.


      If you translate a point $P(x, y)$ by vector $\vec{v}$, the new point $P''$ is:

      $P'' = (x + a, y + b)$


      A key property of a translation is that it maps every line to a parallel line. If you translate
      a line segment $AB$ to form $A''B''$, then $AB$ is parallel to $A''B''$, and the quadrilateral $ABB''A''$
      is a parallelogram.

      '
    check:
      type: multipleChoice
      prompt: A point $A(-2, 5)$ is translated by vector $\vec{v} = \langle 4, -7 \rangle$ to form point
        $A'$. What are the coordinates of $A'$?
      choices:
      - id: a
        text: $(2, -2)$
      - id: b
        text: $(-6, 12)$
        issueSignals:
        - id: algebra-error
          domains: []
      - id: c
        text: $(2, 12)$
        issueSignals:
        - id: algebra-error
          domains: []
      - id: d
        text: $(6, -2)$
        issueSignals:
        - id: wrong-concept
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - Add the vector components to the point's coordinates.
      - Calculate $-2 + 4$ and $5 - 7$.
      explanation: 'Solution:

        To translate a point by a vector, add the vector''s components to the point''s coordinates.

        $x_{\text{new}} = -2 + 4 = 2$

        $y_{\text{new}} = 5 - 7 = -2$

        The translated point is $A''(2, -2)$.


        Why it works:

        A vector dictates exactly how many units to move horizontally (the $x$-component) and vertically
        (the $y$-component).

        '
      id: section-translations-check
    required: true
  - id: section-reflections
    title: Reflections
    content: 'A **reflection** flips a figure across a specific line called the line of reflection.


      For every point $P$ and its reflection $P''$, the line of reflection is exactly the **perpendicular
      bisector** of the segment connecting $P$ and $P''$.


      Common algebraic reflections on the coordinate plane:

      - Across the $x$-axis: $(x, y) \to (x, -y)$

      - Across the $y$-axis: $(x, y) \to (-x, y)$

      - Across the line $y = x$: $(x, y) \to (y, x)$

      - Across the origin (point reflection): $(x, y) \to (-x, -y)$ (This is actually equivalent to a
      $180^\circ$ rotation).

      '
    check:
      type: multipleChoice
      prompt: If point $P(3, 8)$ is reflected across the line $y = x$, what is the resulting point $P'$?
      choices:
      - id: a
        text: $(8, 3)$
      - id: b
        text: $(-3, -8)$
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: c
        text: $(3, -8)$
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: d
        text: $(-8, -3)$
        issueSignals:
        - id: wrong-concept
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - Recall the rule for reflecting across $y=x$.
      - Swap the $x$ and $y$ coordinates.
      explanation: 'Solution:

        Reflecting across the line $y = x$ perfectly swaps the $x$ and $y$ coordinates of any point.

        The initial point is $(3, 8)$.

        The reflected point is $P''(8, 3)$.


        Why it works:

        Graphically, the line $y=x$ is a $45^\circ$ diagonal. The point $(3,8)$ is 3 units right and 8
        units up. Flipping across the diagonal mirrors this to 8 units right and 3 units up. This is also
        how we find the inverse of a function graphically!

        '
      id: section-reflections-check
    required: true
  - id: section-rotations
    title: Rotations
    content: 'A **rotation** turns every point in the plane by a specific angle around a fixed center
      point. By standard convention, positive angles denote **counter-clockwise** rotations.


      If you rotate a point around the origin $(0,0)$ by standard $90^\circ$ increments, you swap the
      coordinates and change one sign:

      - $90^\circ$ (Counter-clockwise): $(x, y) \to (-y, x)$

      - $180^\circ$: $(x, y) \to (-x, -y)$

      - $270^\circ$ (or $90^\circ$ Clockwise): $(x, y) \to (y, -x)$


      If the center of rotation is not the origin, you must first translate the center to the origin,
      perform the rotation, and translate back.

      '
    check:
      type: multipleChoice
      prompt: Point $B(-4, 7)$ is rotated $90^\circ$ counter-clockwise around the origin. What are its
        new coordinates?
      choices:
      - id: a
        text: $(-7, -4)$
      - id: b
        text: $(7, 4)$
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: c
        text: $(4, -7)$
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: d
        text: $(7, -4)$
        issueSignals:
        - id: algebra-error
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - 'Recall the rule for a $90^\circ$ CCW rotation: $(x,y) \to (-y, x)$.'
      - Apply the rule to $(-4, 7)$.
      explanation: 'Solution:

        The rule for a $90^\circ$ counter-clockwise rotation around the origin is $(x, y) \to (-y, x)$.

        Our initial coordinates are $x = -4$ and $y = 7$.

        The new $x$-coordinate becomes $-y$, which is $-7$.

        The new $y$-coordinate becomes the old $x$, which is $-4$.

        The final point is $(-7, -4)$.


        Why it works:

        Point $(-4, 7)$ is in Quadrant II. Rotating $90^\circ$ counter-clockwise pushes it into Quadrant
        III, where both coordinates must be negative.

        '
      id: section-rotations-check
    required: true
  - id: section-dilations
    title: Dilations (Similarities)
    content: "A **dilation** is a transformation that scales an object from a fixed center point by a\
      \ scale factor $k$. \n- If $k > 1$, the object expands.\n- If $0 < k < 1$, the object shrinks.\n\
      - If $k < 0$, the object scales and also undergoes a $180^\\circ$ point reflection across the center.\n\
      \nA dilation centered at the origin by scale factor $k$ maps $(x,y) \\to (kx, ky)$.\n\nUnlike isometries,\
      \ dilations do *not* preserve distance. They preserve angles and map lines to parallel lines. They\
      \ are the transformation that generates **similar** figures.\n"
    check:
      type: multipleChoice
      prompt: A triangle with an area of 10 is dilated by a scale factor of $k = 3$. What is the area
        of the resulting triangle?
      choices:
      - id: a
        text: '90'
      - id: b
        text: '30'
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: c
        text: '10'
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: d
        text: '100'
        issueSignals:
        - id: algebra-error
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - Recognize that area scales by the square of the linear scale factor.
      - Calculate $k^2 = 3^2 = 9$.
      - Multiply the original area by 9.
      explanation: 'Solution:

        The linear scale factor is $k = 3$.

        When a 2D figure is dilated, its side lengths multiply by $k$, but its area multiplies by $k^2$.

        The area scale factor is $3^2 = 9$.

        The new area is $10 \times 9 = 90$.


        Why it works:

        Area is a 2-dimensional measurement (base $\times$ height). Because both the base and the height
        are tripled, the total area increases by $3 \times 3 = 9$.

        '
      id: section-dilations-check
    required: true
  - id: section-compositions
    title: Composition of Transformations
    content: 'Applying two or more transformations in sequence is called a composition. The order of operations
      often matters.


      Fascinating properties emerge when composing reflections:

      1. **Two reflections across parallel lines** result in a pure translation. The distance of the translation
      is exactly twice the distance between the lines.

      2. **Two reflections across intersecting lines** result in a pure rotation. The center of rotation
      is the intersection point, and the angle of rotation is exactly twice the angle between the lines.


      This reveals that every isometry can actually be built entirely out of a sequence of simple reflections!

      '
    check:
      type: multipleChoice
      prompt: You reflect a triangle across the line $x = 2$, and then immediately reflect the result
        across the parallel line $x = 7$. What single transformation achieves this identical result?
      choices:
      - id: a
        text: A translation 10 units to the right.
      - id: b
        text: A translation 5 units to the right.
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: c
        text: A reflection across $x = 4.5$.
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: d
        text: A translation 14 units to the right.
        issueSignals:
        - id: algebra-error
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - Identify the distance between the parallel lines.
      - Apply the theorem that the translation distance is twice the line distance.
      - Determine the direction based on the order of lines.
      explanation: 'Solution:

        The two lines of reflection are $x = 2$ and $x = 7$.

        The distance between these lines is $7 - 2 = 5$.

        Reflecting across two parallel lines results in a single translation.

        The magnitude of the translation is twice the distance between the lines: $2 \times 5 = 10$.

        Because we reflected across $x=2$ first, and then the line further to the right ($x=7$), the translation
        is to the right.

        The equivalent transformation is a translation 10 units to the right.


        Why it works:

        Pick a point, say $x=0$. Reflecting across $x=2$ moves it 4 units to $x=4$. Reflecting $x=4$ across
        $x=7$ moves it 6 units to $x=10$. The net movement is from 0 to 10. The sum of the two reflections
        perfectly translates the point by $2 \times 5 = 10$.

        '
      id: section-compositions-check
    required: true
  introduction: This lesson develops the key ideas in Transformations.
