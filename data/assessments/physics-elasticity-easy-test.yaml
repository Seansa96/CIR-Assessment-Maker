questions:
- id: q001
  difficultyDimensions:
  - ModelOrDerivation
  - Simplification
  type: numericResponse
  prompt: |
    A steel wire of length $L = 2.0\text{ m}$ and cross-sectional area $A = 1.5 \times 10^{-6}\text{ m}^2$ is suspended vertically from the ceiling. A mass is hung from the bottom end, exerting a downward force of $F = 300\text{ N}$. 
    
    If the wire stretches by $\Delta L = 0.002\text{ m}$, calculate the Young's Modulus of the steel wire in $10^{11} \text{ N/m}^2$. (e.g. if the answer is $2.0 \times 10^{11}$, enter $2.0$)
  answer:
    value: 2.0
    tolerance: 0.1
  explanation: |
    Solution:
    Young's Modulus is defined as:
    $$ Y = \frac{F L}{A \Delta L} $$
    
    Plug in the givens:
    $$ Y = \frac{(300)(2.0)}{(1.5 \times 10^{-6})(0.002)} $$
    $$ Y = \frac{600}{3.0 \times 10^{-9}} = 2.0 \times 10^{11} \text{ N/m}^2 $$
    
    So the value to enter is $2.0$.
    
    Why it works: This is a direct application of the definition of Young's Modulus in a static, one-dimensional stretching scenario.
