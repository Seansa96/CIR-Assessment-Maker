topicId: chemistry-nuclear
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 10
navigation: { learningGoal: practice, activityType: focusedPractice, tags: [chemistry, nuclear-chemistry, easy] }
authoring: { visualRequirement: required, visualRationale: 'The penetration diagram supports a shielding decision rather than decorative recall.', difficultyTier: easy, sourceId: src-20260720035703-91ea51b0d8 }
questions:
  - id: q1
    type: multipleChoice
    prompt: 'Polonium-210 emits an alpha particle. Which daughter nuclide completes $^{210}_{84}Po\rightarrow ?+{}^4_2He$?'
    choices:
      - { id: a, text: '$^{206}_{82}Pb$', issueSignals: [] }
      - { id: b, text: '$^{210}_{82}Pb$', issueSignals: [{ id: chemistry-nuclear-conservation-error }] }
      - { id: c, text: '$^{206}_{84}Po$', issueSignals: [{ id: chemistry-nuclear-decay-daughter-error }] }
    answer: { choiceId: a }
    explanation: 'Solution: $^{206}_{82}Pb$. Why it works: Alpha emission subtracts 4 from mass number and 2 from atomic number, giving $A=206$ and $Z=82$. Why the other choices fail: b does not conserve mass number; c does not conserve atomic number or change element identity.'
    difficultyDimensions: [nuclearConservation, elementIdentification]
    difficultyEvidence: 'Coordinates both conserved numbers and maps the resulting atomic number to lead.'
    issueSignals: [{ id: chemistry-nuclear-conservation-error }, { id: chemistry-nuclear-decay-daughter-error }]
  - id: q2
    type: multipleChoice
    prompt: 'Phosphorus-32 undergoes beta-minus decay. Which daughter is formed?'
    choices:
      - { id: a, text: '$^{32}_{16}S$', issueSignals: [] }
      - { id: b, text: '$^{32}_{14}Si$', issueSignals: [{ id: chemistry-nuclear-decay-daughter-error }] }
      - { id: c, text: '$^{28}_{13}Al$', issueSignals: [{ id: chemistry-nuclear-decay-daughter-error }] }
    answer: { choiceId: a }
    explanation: 'Solution: $^{32}_{16}S$. Why it works: Beta-minus decay converts a neutron into a proton, leaving $A=32$ while increasing $Z$ from 15 to 16. Why the other choices fail: b applies the atomic-number shift backward; c incorrectly applies an alpha-like mass change.'
    difficultyDimensions: [decayMode, daughterPrediction]
    difficultyEvidence: 'Uses the beta-minus conversion rule and then identifies the daughter element.'
    issueSignals: [{ id: chemistry-nuclear-decay-daughter-error }]
  - id: q3
    type: selectAll
    prompt: 'Select every decay process that leaves the daughter mass number $A$ unchanged.'
    choices:
      - { id: a, text: beta-minus emission, issueSignals: [] }
      - { id: b, text: positron emission, issueSignals: [] }
      - { id: c, text: electron capture, issueSignals: [] }
      - { id: d, text: gamma emission, issueSignals: [] }
      - { id: e, text: alpha emission, issueSignals: [{ id: chemistry-nuclear-decay-daughter-error }] }
    answer: { choiceIds: [a, b, c, d] }
    explanation: 'Solution: Select a, b, c, and d. Why it works: Beta-minus, positron, and electron capture rearrange a proton-neutron identity, while gamma changes only nuclear energy; none changes the nucleon total. Why the other choices fail: Alpha emission removes two protons and two neutrons, so $A$ decreases by 4.'
    difficultyDimensions: [multiConditionClassification, conservationPattern]
    difficultyEvidence: 'Classifies five processes by whether their emitted or captured particle changes nucleon count.'
    issueSignals: [{ id: chemistry-nuclear-decay-daughter-error }]
  - id: q4
    type: numericResponse
    prompt: 'A radioactive sample begins at $96.0\ \mathrm{mg}$. How many milligrams remain after four half-lives?'
    answer: { value: 6.00, tolerance: 0.01 }
    explanation: 'Solution: $m=96.0(1/2)^4=96.0/16=6.00\ \mathrm{mg}$. Why it works: Four equal half-life intervals multiply the current amount by one-half four times.'
    difficultyDimensions: [halfLifeCount, fractionalChange]
    difficultyEvidence: 'Translates a stated interval count into a power and a remaining mass.'
    issueSignals: [{ id: chemistry-nuclear-half-life-fraction-error }]
  - id: q5
    type: numericResponse
    prompt: 'A $40.0\ \mathrm{g}$ radionuclide has a half-life of $6.0\ \mathrm{h}$. What mass remains after $18.0\ \mathrm{h}$?'
    answer: { value: 5.00, tolerance: 0.02 }
    explanation: 'Solution: $18.0/6.0=3$ half-lives, so $m=40.0(1/2)^3=5.00\ \mathrm{g}$. Why it works: Elapsed time must first be converted into three half-life intervals before repeated halving.'
    difficultyDimensions: [timeToIntervals, quantitativeDecay]
    difficultyEvidence: 'Derives the interval count from two times and then evaluates the decay fraction.'
    issueSignals: [{ id: chemistry-nuclear-half-life-fraction-error }]
  - id: q6
    type: multipleChoice
    prompt: 'A light nuclide has substantially more neutrons than stable nuclides of similar mass. Which decay commonly moves it toward stability?'
    choices:
      - { id: a, text: beta-minus emission, issueSignals: [] }
      - { id: b, text: positron emission, issueSignals: [{ id: chemistry-nuclear-stability-pattern-error }] }
      - { id: c, text: gamma emission alone, issueSignals: [{ id: chemistry-nuclear-stability-pattern-error }] }
    answer: { choiceId: a }
    explanation: 'Solution: Beta-minus emission. Why it works: It converts a neutron into a proton, reducing neutron excess without changing mass number. Why the other choices fail: Positron emission converts in the opposite direction; gamma emission changes energy but not the neutron-to-proton ratio.'
    difficultyDimensions: [stabilityPattern, particleConversion]
    difficultyEvidence: 'Connects a neutron-to-proton imbalance to the conversion performed by a decay mode.'
    issueSignals: [{ id: chemistry-nuclear-stability-pattern-error }]
  - id: q7
    type: numericResponse
    prompt: 'A detector records 4800 nuclear decays during exactly $2.00\ \mathrm{min}$. Calculate the activity in becquerels, where $1\ \mathrm{Bq}=1\ \mathrm{decay\,s^{-1}}$.'
    answer: { value: 40.0, tolerance: 0.1 }
    explanation: 'Solution: $2.00\ \mathrm{min}=120\ \mathrm{s}$, so activity is $4800/120=40.0\ \mathrm{Bq}$. Why it works: Activity is the number of decays per unit time, and the becquerel uses seconds.'
    difficultyDimensions: [rateDefinition, unitConversion]
    difficultyEvidence: 'Combines a count-rate definition with conversion from minutes to seconds.'
    issueSignals: [{ id: chemistry-nuclear-detection-dose-confusion }]
  - id: q8
    type: numericResponse
    prompt: 'Separated nucleons have total mass $10.0826\ \mathrm{u}$, while their bound nucleus has mass $10.0522\ \mathrm{u}$. Calculate the mass defect in atomic mass units.'
    answer: { value: 0.0304, tolerance: 0.0001 }
    explanation: 'Solution: $\Delta m=10.0826-10.0522=0.0304\ \mathrm{u}$. Why it works: Mass defect is the separated-constituent mass minus the smaller bound-nucleus mass.'
    difficultyDimensions: [massInventory, subtractionDirection]
    difficultyEvidence: 'Distinguishes the two physical masses and subtracts them in the sign-consistent order.'
    issueSignals: [{ id: chemistry-nuclear-mass-energy-error }]
  - id: q9
    type: multipleChoice
    prompt: 'Which statement correctly distinguishes fission from fusion?'
    choices:
      - { id: a, text: 'Fission splits a heavy nucleus; fusion joins light nuclei.', issueSignals: [] }
      - { id: b, text: 'Fission joins light nuclei; fusion splits a heavy nucleus.', issueSignals: [{ id: chemistry-nuclear-fission-fusion-confusion }] }
      - { id: c, text: 'Both terms describe gamma emission from an unchanged nucleus.', issueSignals: [{ id: chemistry-nuclear-fission-fusion-confusion }] }
    answer: { choiceId: a }
    explanation: 'Solution: Fission splits a heavy nucleus, while fusion joins light nuclei. Why it works: The two processes begin in different nuclear mass regions and can form products with greater binding energy per nucleon. Why the other choices fail: b reverses the definitions; c describes neither change in nuclear composition.'
    difficultyDimensions: [processClassification, nuclearScale]
    difficultyEvidence: 'Classifies each process using both its direction of composition change and starting mass region.'
    issueSignals: [{ id: chemistry-nuclear-fission-fusion-confusion }]
  - id: q10
    type: multipleChoice
    prompt: 'Which material choice is most appropriate for substantially reducing an external gamma field?'
    media: [{ type: image, src: /media/chemistry/nuclear-radiation-penetration.svg, alt: Diagram showing alpha stopped by paper, beta by thin metal, and gamma reduced by thick dense shielding., caption: Compare how deeply each radiation type penetrates matter. }]
    choices:
      - { id: a, text: 'a thick layer of dense concrete or lead', issueSignals: [] }
      - { id: b, text: 'one sheet of paper', issueSignals: [{ id: chemistry-nuclear-penetration-hazard-confusion }] }
      - { id: c, text: 'a thin plastic film selected only for alpha particles', issueSignals: [{ id: chemistry-nuclear-penetration-hazard-confusion }] }
    answer: { choiceId: a }
    explanation: 'Solution: Use thick dense shielding such as concrete or lead. Why it works: Gamma radiation is highly penetrating, so substantial material thickness and density are needed to attenuate it. Why the other choices fail: Paper and thin film can stop short-range charged particles but provide little gamma attenuation.'
    difficultyDimensions: [penetrationComparison, materialSelection]
    difficultyEvidence: 'Interprets a penetration representation to select shielding for a specified radiation field.'
    issueSignals: [{ id: chemistry-nuclear-penetration-hazard-confusion }]
