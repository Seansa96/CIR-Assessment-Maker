- id: we-ang-trans-1
  title: Bicycle Wheel Geometry
  problem: A bicycle with $0.35\text{ m}$ radius wheels is traveling at $8.0\text{
    m/s}$. Find the angular velocity of the wheels and the centripetal acceleration
    of a point on the rim.
  steps:
  - id: we-ang-trans-1-step1
    title: 'Step 1: Angular Velocity'
    instruction: Use the relationship $v = r\omega$ to find $\omega$.
    prompt: What is $\omega$ in rad/s?
    type: numericResponse
    answer:
      value: 22.86
      tolerance: 0.1
    explanation: |
      Solution:

      $$
      \omega=\frac{v}{r}=\frac{8.0}{0.35}=22.86\ \text{rad/s}.
      $$

      Why it works: For rolling without slipping, the wheel's center-of-mass speed and rim angular speed are related by $v=r\omega$.
  - id: we-ang-trans-1-step2
    title: 'Step 2: Centripetal Acceleration'
    instruction: Calculate $a_c$ using either $v^2/r$ or $r\omega^2$.
    prompt: What is $a_c$ in $\text{m/s}^2$?
    type: numericResponse
    answer:
      value: 182.86
      tolerance: 1.0
    explanation: |
      Solution:

      $$
      a_c=\frac{v^2}{r}=\frac{(8.0)^2}{0.35}=182.86\ \text{m/s}^2.
      $$

      Why it works: A point on the rim continuously changes direction, so it has inward centripetal acceleration with magnitude $v^2/r$.

- id: angular-translational-we002
  title: Belt-Driven Pulleys
  problem: 'A 0.10 m driver pulley turns at 30 rad/s and drives a 0.30 m pulley without slipping. Find the driven pulley angular speed and rim speed.'
  steps:
  - id: atwe3
    title: Find driven angular speed
    instruction: Equate the no-slip rim speeds.
    prompt: 'What is the angular speed of the 0.30 m pulley in rad/s?'
    type: numericResponse
    answer: { value: 10, tolerance: 0.01 }
    explanation: 'Solution: $(0.10)(30)=(0.30)\omega_2$, so $\omega_2=10$ rad/s.\n\nWhy it works: Both pulleys share the belt tangential speed.'
  - id: atwe4
    title: Find belt speed
    instruction: Use either pulley radius and angular speed.
    prompt: 'What is the belt speed in m/s?'
    type: numericResponse
    answer: { value: 3, tolerance: 0.01 }
    explanation: 'Solution: $v=R\omega=(0.10)(30)=3.0$ m/s.\n\nWhy it works: Tangential rim speed equals belt speed without slipping.'
