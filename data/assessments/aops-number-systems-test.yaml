questions:
- id: q001
  type: multipleChoice
  prompt: Under $\mathbb N=\{1,2,3,\ldots\}$, what is the smallest standard set containing $\sqrt{36}$?
  choices:
  - {id: a, text: '$\mathbb N$'}
  - {id: b, text: '$\mathbb Z\setminus\mathbb N$'}
  - {id: c, text: '$\mathbb Q\setminus\mathbb Z$'}
  - {id: d, text: '$\mathbb R\setminus\mathbb Q$'}
  answer: {choiceId: a}
  explanation: $\sqrt{36}=6$.
  skills: [simplify-before-classifying]
- id: q002
  type: multipleChoice
  prompt: What is the smallest standard set containing $\sqrt{18}/3$?
  choices:
  - {id: a, text: '$\mathbb Z$'}
  - {id: b, text: '$\mathbb Q$'}
  - {id: c, text: '$\mathbb R$'}
  - {id: d, text: '$\mathbb C\setminus\mathbb R$'}
  answer: {choiceId: c}
  explanation: $\sqrt{18}/3=3\sqrt2/3=\sqrt2$, an irrational real number.
  skills: [classify-simplified-radicals]
- id: q003
  type: multipleChoice
  prompt: Convert $0.1\overline6=0.1666\ldots$ to a fraction.
  choices:
  - {id: a, text: '$1/5$'}
  - {id: b, text: '$1/6$'}
  - {id: c, text: '$1/7$'}
  - {id: d, text: '$1/9$'}
  answer: {choiceId: b}
  explanation: If $x=0.1666\ldots$, then $100x-10x=16.666\ldots-1.666\ldots=15$, so $90x=15$.
  skills: [convert-eventually-repeating-decimals]
- id: q004
  type: multipleChoice
  prompt: Convert $0.\overline{142857}$ to a fraction.
  choices:
  - {id: a, text: '$1/6$'}
  - {id: b, text: '$1/7$'}
  - {id: c, text: '$1/8$'}
  - {id: d, text: '$1/9$'}
  answer: {choiceId: b}
  explanation: With $x=0.\overline{142857}$, $999999x=142857$, and $142857/999999=1/7$.
  skills: [convert-repeating-decimals]
- id: q005
  type: multipleChoice
  prompt: A reduced fraction has denominator $2^3\cdot5^2$. What is the maximum number of decimal places needed before its decimal terminates?
  choices:
  - {id: a, text: '$2$'}
  - {id: b, text: '$3$'}
  - {id: c, text: '$5$'}
  - {id: d, text: It cannot terminate.}
  answer: {choiceId: b}
  explanation: Multiply by one factor of $5$ to make the denominator $2^3\cdot5^3=10^3$.
  skills: [analyze-terminating-denominators]
- id: q006
  type: multipleChoice
  prompt: |-
    A proof begins by assuming $\sqrt3=p/q$ for integers $p,q$. Which missing condition is needed for a common-factor contradiction?
  choices:
  - {id: a, text: '$p>q$'}
  - {id: b, text: '$p$ and $q$ are both odd.'}
  - {id: c, text: '$q\ne0$ and $\gcd(p,q)=1$.'}
  - {id: d, text: '$p/q$ is a terminating decimal.'}
  answer: {choiceId: c}
  explanation: The fraction must be defined and chosen in lowest terms before a common factor is contradictory.
  skills: [diagnose-irrationality-proofs]
- id: q007
  type: multipleChoice
  prompt: Which argument correctly classifies $\sqrt{12}$?
  choices:
  - {id: a, text: '$\sqrt{12}=6$, so it is natural.'}
  - {id: b, text: '$\sqrt{12}=2\sqrt3$, so it is irrational real.'}
  - {id: c, text: It uses a radical symbol, so it is nonreal.}
  - {id: d, text: '$12$ is rational, so its square root must be rational.'}
  answer: {choiceId: b}
  explanation: Multiplying nonzero rational $2$ by irrational $\sqrt3$ remains irrational.
  skills: [classify-radicals]
- id: q008
  type: multipleChoice
  prompt: Which pair of irrational numbers has a rational sum?
  choices:
  - {id: a, text: '$\sqrt2$ and $-\sqrt2$'}
  - {id: b, text: '$\sqrt2$ and $1$'}
  - {id: c, text: '$2$ and $-2$'}
  - {id: d, text: '$1/2$ and $1/2$'}
  answer: {choiceId: a}
  explanation: Both are irrational and their sum is zero.
  skills: [construct-closure-counterexamples]
- id: q009
  type: multipleChoice
  prompt: Which pair of irrational numbers has a rational product?
  choices:
  - {id: a, text: '$\sqrt2$ and $\sqrt2$'}
  - {id: b, text: '$\sqrt2$ and $2$'}
  - {id: c, text: '$\sqrt2$ and $1/2$'}
  - {id: d, text: '$2$ and $3$'}
  answer: {choiceId: a}
  explanation: Their product is $2$.
  skills: [construct-closure-counterexamples]
- id: q010
  type: multipleChoice
  prompt: Solve $x^2+6x+13=0$ in $\mathbb C$.
  choices:
  - {id: a, text: '$x=-3\pm2i$'}
  - {id: b, text: '$x=3\pm2i$'}
  - {id: c, text: '$x=-6\pm13i$'}
  - {id: d, text: No solutions}
  answer: {choiceId: a}
  explanation: $(x+3)^2=-4$, so $x+3=\pm2i$.
  skills: [solve-complex-quadratics]
- id: q011
  type: multipleChoice
  prompt: Evaluate $(3+4i)(3-4i)$.
  choices:
  - {id: a, text: '$-7$'}
  - {id: b, text: '$7$'}
  - {id: c, text: '$25$'}
  - {id: d, text: '$9-16i$'}
  answer: {choiceId: c}
  explanation: The conjugate product is $3^2+4^2=25$.
  skills: [multiply-complex-conjugates]
- id: q012
  type: multipleChoice
  prompt: If $r$ is rational and $y$ is irrational, which statement must be true?
  choices:
  - {id: a, text: '$r+y$ is irrational.'}
  - {id: b, text: '$ry$ is irrational even when $r=0$.'}
  - {id: c, text: '$r-y$ is rational.'}
  - {id: d, text: '$y/r$ is defined for every rational $r$.'}
  answer: {choiceId: a}
  explanation: If $r+y$ were rational, subtracting rational $r$ would make $y$ rational. The other claims fail at zero or contradict the same reasoning.
  skills: [reason-about-rational-irrational-operations]
- id: q013
  type: selectAll
  prompt: Which statements are true?
  choices:
  - {id: a, text: Every integer is rational.}
  - {id: b, text: Every rational number is an integer.}
  - {id: c, text: Every real number is complex.}
  - {id: d, text: Every complex number is real.}
  answer:
    choiceIds: [a, c]
  explanation: The number sets are nested in one direction; the reverse containments are false.
  skills: [reason-about-number-set-containment]
- id: q014
  type: selectAll
  prompt: Which numbers are irrational?
  choices:
  - {id: a, text: '$\sqrt8/2$'}
  - {id: b, text: '$0.\overline7$'}
  - {id: c, text: '$\sqrt{121}$'}
  - {id: d, text: '$\sqrt3+1$'}
  answer:
    choiceIds: [a, d]
  explanation: $\sqrt8/2=\sqrt2$ and $\sqrt3+1$ are irrational; repeating decimals and $\sqrt{121}=11$ are rational.
  skills: [classify-exact-numbers]
- id: q015
  type: freeResponse
  prompt: Prove that the sum of a rational number and an irrational number is irrational.
  answer:
    gradingMode: selfCheck
    expected: |-
      Let $r$ be rational and $y$ irrational. Suppose for contradiction that $r+y=s$ is rational. Rational numbers are closed under subtraction, so $y=s-r$ would be rational. This contradicts the hypothesis that $y$ is irrational. Therefore $r+y$ is irrational.
    keyPoints:
    - Names a rational number and an irrational number.
    - Assumes their sum is rational.
    - Uses closure of rationals under subtraction.
    - Reaches a contradiction with the irrational hypothesis.
  explanation: The proof uses the exact definition of irrationality and a closure property of rational numbers.
  skills: [prove-rational-irrational-operation-results]
