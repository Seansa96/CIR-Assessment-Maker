workedExamples:
- id: we01
  title: An epidemic mechanism
  problem: A closed susceptible group has size $S$. Infections occur at a rate proportional to infected-susceptible
    encounters.
  steps:
  - id: we01-s1
    title: Define the state
    instruction: Identify infected and susceptible counts.
    type: freeResponse
    prompt: Name the unknown and remaining susceptible population.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Defines state
      - Uses closed population
    explanation: |-
      Solution: Let $I(t)$ be infected people; then $S-I(t)$ are still susceptible.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s2
    title: Translate the mechanism
    instruction: Use the proportional encounter assumption.
    type: freeResponse
    prompt: Write the differential equation.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Writes product law
      - States units
    explanation: |-
      Solution: $I'=rI(S-I)$, where $r>0$ has units person$^{-1}$time$^{-1}$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s3
    title: Interpret limiting states
    instruction: Set the rate to zero and discuss assumptions.
    type: freeResponse
    prompt: Find equilibria and state one limitation.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Finds equilibria
      - States limitation
    explanation: |-
      Solution: $I=0$ and $I=S$ are equilibria; the model omits recovery and population exchange.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we02
  title: Cooling as an IVP
  problem: A sample at $72^\circ$C is placed in a constant $18^\circ$C room and follows Newton cooling with $k>0$.
  steps:
  - id: we02-s1
    title: Choose sign and state
    instruction: Temperature should move toward ambient.
    type: freeResponse
    prompt: Define $T$ and write its rate law.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Defines state
      - Uses negative feedback
    explanation: |-
      Solution: $T(t)$ is sample temperature and $T'=-k(T-18)$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s2
    title: Attach data
    instruction: Combine rate law and measurement.
    type: freeResponse
    prompt: Write the IVP.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - States ODE
      - States initial value
    explanation: |-
      Solution: $T'=-k(T-18),\quad T(0)=72$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s3
    title: Interpret before solving
    instruction: Use signs and equilibrium.
    type: freeResponse
    prompt: Find the equilibrium and initial direction.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Finds equilibrium
      - Finds sign
    explanation: |-
      Solution: $T=18$ is equilibrium, and $T'(0)=-54k<0$, so the sample initially cools.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we03
  title: Order and model architecture
  problem: Compare free fall $y''=-g$ with a two-species model $P'=F(P,Q)$, $Q'=G(P,Q)$.
  steps:
  - id: we03-s1
    title: Classify free fall
    instruction: Use the highest derivative.
    type: freeResponse
    prompt: Give its order and state dimension after first-order conversion.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Second order
      - Two state variables
    explanation: |-
      Solution: It is one second-order ODE, equivalent to two first-order state equations for position and velocity.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s2
    title: Classify competition
    instruction: Count unknown functions and equation orders.
    type: freeResponse
    prompt: Classify the species model.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Two unknowns
      - First-order system
    explanation: |-
      Solution: It is a coupled system of two first-order ODEs.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s3
    title: Specify initial data
    instruction: Match data count to evolving states.
    type: freeResponse
    prompt: State typical initial conditions for both models.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Two conditions each
      - Matches states
    explanation: |-
      Solution: Free fall needs $y(0)=y_0,y'(0)=v_0$; competition needs $P(0)=P_0,Q(0)=Q_0$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
