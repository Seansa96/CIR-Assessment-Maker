lesson:
  introduction: 'The periodic table is chemistry''s most powerful organizational tool.
    Elements are arranged in order of increasing atomic number, and this arrangement
    reveals deep patterns in electron configuration, reactivity, and physical properties.
    Understanding\rhow to read the table is the first step in predicting chemical behavior.

    '
  sections:
  - id: periods-and-groups
    title: Periods and Groups
    required: true
    content: 'The periodic table is organized into:


      - **Periods (rows)**: Horizontal rows, numbered 1–7. Elements in the same period
      have the same number of **electron shells** (principal energy levels).

      - **Groups (columns)**: Vertical columns, numbered 1–18 (or 1A–8A in the American
      system). Elements in the same group have the same number of **valence electrons**
      and therefore similar chemical properties.


      **Key group names:**


      | Group | Common Name | Examples |

      |---|---|---|

      | Group 1 (1A) | Alkali Metals | Li, Na, K, Rb, Cs |

      | Group 2 (2A) | Alkaline Earth Metals | Be, Mg, Ca, Sr, Ba |

      | Groups 3–12 | Transition Metals | Fe, Cu, Zn, Cr |

      | Group 17 (7A) | Halogens | F, Cl, Br, I |

      | Group 18 (8A) | Noble Gases | He, Ne, Ar, Kr |

      '
    check:
      id: periods-groups-check
      type: multipleChoice
      prompt: 'Sodium (Na) and potassium (K) are in the same group. What does this
        tell you about their chemistry?

        '
      choices:
      - id: a
        text: They have the same number of valence electrons and similar chemical
          behavior.
      - id: b
        text: They have the same atomic mass.
      - id: c
        text: They are both nonmetals.
      - id: d
        text: They have the same number of electron shells.
      answer:

        choiceId: a
      explanation: 'Elements in the same group (family) have the same number of valence
        electrons, which drives similar reactivity. Both Na and K are alkali metals
        with one valence electron, so they both readily form 1+ cations and react
        vigorously with water.

        '
  - id: metals-nonmetals-metalloids
    title: Metals, Nonmetals, and Metalloids
    required: true
    content: 'The staircase line on the periodic table separates three broad categories:


      **Metals** (left of the staircase — the majority of elements):

      - Shiny, malleable, ductile

      - Good conductors of heat and electricity

      - Form cations (lose electrons) in reactions

      - Examples: iron (Fe), copper (Cu), sodium (Na), calcium (Ca)


      **Nonmetals** (right of the staircase):

      - Dull, brittle as solids (many are gases at room temperature)

      - Poor conductors

      - Form anions (gain electrons) in reactions with metals

      - Examples: oxygen (O), nitrogen (N), chlorine (Cl), carbon (C)


      **Metalloids** (along the staircase):

      - Intermediate properties — semiconductors

      - Examples: silicon (Si), germanium (Ge), arsenic (As), boron (B)


      **Hydrogen** is unique — it is placed in Group 1 but is a nonmetal gas.

      '
    check:
      id: metals-check
      type: selectAll
      prompt: 'Which of the following elements are metals? Select all that apply.

        '
      choices:
      - id: a
        text: Aluminum (Al)
      - id: b
        text: Sulfur (S)
      - id: c
        text: Iron (Fe)
      - id: d
        text: Bromine (Br)
      - id: e
        text: Barium (Ba)
      answer:

        choiceIds:
        - a
        - c
        - e
      explanation: 'Al, Fe, and Ba are all metals. Sulfur (S) is a solid nonmetal;
        bromine (Br) is a liquid halogen (nonmetal).

        '
  - id: periodic-trends
    title: Periodic Trends
    required: true
    content: 'Because electrons are added in a predictable pattern, element properties
      change predictably across and down the table.


      **Atomic Radius** (size of the atom):

      - **Increases going DOWN a group** (more electron shells)

      - **Decreases going RIGHT across a period** (more protons pull electrons closer)

      - Largest atoms: lower-left (Cs, Fr). Smallest atoms: upper-right (F, O).


      **Ionization Energy** (energy needed to remove an electron from a neutral gas-phase
      atom):

      - **Increases going UP a group** (electrons held more tightly, closer to nucleus)

      - **Increases going RIGHT across a period** (more protons, stronger pull)

      - Highest IE: noble gases (upper-right). Lowest IE: alkali metals (lower-left).


      **Electronegativity** (ability to attract bonding electrons in a molecule):

      - **Increases going UP a group** and **RIGHT across a period**

      - Highest: fluorine (F). Lowest among reactive elements: cesium (Cs) and francium
      (Fr).


      **Memory trick:** Ionization energy and electronegativity are highest at the
      same corner (upper-right). Atomic radius is the opposite (largest at lower-left).

      '
    check:
      id: trends-check
      type: multipleChoice
      prompt: 'Which element has the largest atomic radius among Na, Mg, K, and Ca?

        '
      choices:
      - id: a
        text: K (potassium)
      - id: b
        text: Na (sodium)
      - id: c
        text: Ca (calcium)
      - id: d
        text: Mg (magnesium)
      answer:

        choiceId: a
      explanation: 'Atomic radius increases going down a group and decreases going
        right across a period. K is below Na in Group 1. Ca is below Mg in Group 2,
        but Group 1 elements are larger than Group 2 elements in the same period.
        K (Period 4, Group 1) has the largest radius of the four.

        '
