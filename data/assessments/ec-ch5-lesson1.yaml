- id: l1-sec1
  title: Op-Amp Terminals
  media:
  - type: image
    src: /assessments/electronics-and-circuits/opamp-ideal.svg
    alt: An ideal operational amplifier symbol showing inverting, non-inverting, and
      output terminals.
  problem: 'Review the following concept:'
  steps:
  - id: step1
    title: Op-Amp Terminals
    instruction: 'An operational amplifier is a multi-terminal device. The standard
      symbol has 5 active terminals: Inverting input (-), Non-inverting input (+),
      Output, Positive power supply ($V_{CC}$), and Negative power supply ($-V_{CC}$
      or ground).'
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l1-sec2
  title: Ideal Op-Amp Assumptions
  problem: 'Review the following concept:'
  steps:
  - id: step2
    title: Ideal Op-Amp Assumptions
    instruction: 'For an ideal op-amp operating in its linear region with negative
      feedback: 1) Infinite input resistance ($i_+ = i_- = 0$), meaning no current
      enters the input terminals. 2) Infinite open-loop gain ($A \to \infty$), meaning
      the voltage difference between inputs is zero ($v_+ = v_-$).'
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
