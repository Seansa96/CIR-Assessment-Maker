schemaVersion: 1
id: aops-linear-equations-quiz
title: Linear Equations Practice Quiz
assessmentType: quiz
categoryId: art-of-problem-solving
topicId: aops-linear-equations
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - art-of-problem-solving
  - aops-linear-equations
  - linear-systems
  - equation-classification
  - modeling
skills:
- Solve and verify one-variable linear equations
- Classify identities, contradictions, and parameter cases
- Solve two-variable systems efficiently
- Translate contextual relationships into linear models
questions:
- id: q001
  type: multipleChoice
  prompt: 'Solve $3x-7=14$.'
  choices:
  - id: a
    text: '$x=\frac73$'
  - id: b
    text: '$x=7$'
  - id: c
    text: '$x=21$'
  - id: d
    text: '$x=-7$'
  answer:
    choiceId: b
  explanation: Add 7 to both sides and divide by 3.
- id: q002
  type: multipleChoice
  prompt: 'Solve $5-2x=17$.'
  choices:
  - id: a
    text: '$x=-6$'
  - id: b
    text: '$x=6$'
  - id: c
    text: '$x=-11$'
  - id: d
    text: '$x=11$'
  answer:
    choiceId: a
  explanation: Subtract 5 to get $-2x=12$, then divide by $-2$.
- id: q003
  type: multipleChoice
  prompt: 'Solve $\dfrac{x}{2}+\dfrac{x-1}{3}=4$.'
  choices:
  - id: a
    text: '$x=5$'
  - id: b
    text: '$x=\frac{26}{5}$'
  - id: c
    text: '$x=\frac{24}{5}$'
  - id: d
    text: '$x=6$'
  answer:
    choiceId: b
  explanation: Multiplication by 6 gives $3x+2(x-1)=24$, so $5x=26$.
- id: q004
  type: multipleChoice
  prompt: 'Classify $4x+2=4x+2$.'
  choices:
  - id: a
    text: One solution, $x=0$
  - id: b
    text: No solution
  - id: c
    text: Infinitely many real solutions
  - id: d
    text: One solution, $x=2$
  answer:
    choiceId: c
  explanation: Subtracting $4x+2$ from both sides leaves the identity $0=0$.
- id: q005
  type: multipleChoice
  prompt: 'Classify $3x-5=3x+1$.'
  choices:
  - id: a
    text: One solution, $x=2$
  - id: b
    text: No solution
  - id: c
    text: Infinitely many solutions
  - id: d
    text: One solution, $x=-2$
  answer:
    choiceId: b
  explanation: The variable cancels and leaves the contradiction $-5=1$.
- id: q006
  type: multipleChoice
  prompt: 'Solve $x+y=9$ and $x-y=1$.'
  choices:
  - id: a
    text: '$(x,y)=(4,5)$'
  - id: b
    text: '$(x,y)=(5,4)$'
  - id: c
    text: '$(x,y)=(8,1)$'
  - id: d
    text: '$(x,y)=(9,1)$'
  answer:
    choiceId: b
  explanation: Adding equations gives $2x=10$, then $y=4$.
- id: q007
  type: multipleChoice
  prompt: 'Which method is most direct for $y=3x-2$ and $4x+y=12$?'
  choices:
  - id: a
    text: Substitute $3x-2$ for $y$ in the second equation.
  - id: b
    text: Multiply both equations by zero.
  - id: c
    text: Divide by $y$ before solving.
  - id: d
    text: Treat $y$ as a constant that can be ignored.
  answer:
    choiceId: a
  explanation: Substitution is efficient because $y$ is already isolated.
- id: q008
  type: multipleChoice
  prompt: 'A taxi charges $4 plus $2.50 per mile. How many miles produce a $19 fare?'
  choices:
  - id: a
    text: '5 miles'
  - id: b
    text: '6 miles'
  - id: c
    text: '7.6 miles'
  - id: d
    text: '9.2 miles'
  answer:
    choiceId: b
  explanation: Solve $4+2.5m=19$, giving $2.5m=15$ and $m=6$.
- id: q009
  type: multipleChoice
  prompt: 'A rectangle has perimeter 34 and length 3 more than width. What are its dimensions?'
  choices:
  - id: a
    text: Width 7 and length 10
  - id: b
    text: Width 8 and length 11
  - id: c
    text: Width 5 and length 12
  - id: d
    text: Width 14 and length 17
  answer:
    choiceId: a
  explanation: $2w+2(w+3)=34$ gives $w=7$ and length 10.
- id: q010
  type: multipleChoice
  prompt: 'A 120-mile trip takes 2 hours, partly at 50 mph and partly at 70 mph. How long is spent at each speed?'
  choices:
  - id: a
    text: 1 hour at each speed
  - id: b
    text: 2 hours at 50 mph and none at 70 mph
  - id: c
    text: 30 minutes at 50 mph and 90 minutes at 70 mph
  - id: d
    text: The information is inconsistent.
  answer:
    choiceId: a
  explanation: The time and distance equations are $t_{50}+t_{70}=2$ and $50t_{50}+70t_{70}=120$.
- id: q011
  type: multipleChoice
  prompt: 'For which $k$ does $(k-4)x=8$ have no solution?'
  choices:
  - id: a
    text: '$k=0$'
  - id: b
    text: '$k=4$'
  - id: c
    text: '$k=8$'
  - id: d
    text: It always has one solution.
  answer:
    choiceId: b
  explanation: At $k=4$ the equation becomes the contradiction $0=8$.
- id: q012
  type: multipleChoice
  prompt: 'A solution divides $x(x-5)=2x$ by $x$. Which case could this discard?'
  choices:
  - id: a
    text: '$x=0$'
  - id: b
    text: '$x=2$'
  - id: c
    text: '$x=5$'
  - id: d
    text: No case can be discarded.
  answer:
    choiceId: a
  explanation: Division by $x$ assumes $x\ne0$, so the zero case must be checked before dividing.
- id: q013
  type: selectAll
  prompt: 'Select every operation that preserves the solution set of an equation under the stated condition.'
  choices:
  - id: a
    text: Add the same expression to both sides.
  - id: b
    text: Multiply both sides by the same known nonzero number.
  - id: c
    text: Multiply both sides by zero.
  - id: d
    text: Divide both sides by the same known nonzero number.
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: Multiplication by zero destroys the original information and is not reversible.
- id: q014
  type: selectAll
  prompt: 'Which checks belong in a complete solution to a linear word problem?'
  choices:
  - id: a
    text: Confirm the variables and equations use compatible units.
  - id: b
    text: Substitute the result into the original relationships.
  - id: c
    text: Accept a negative count whenever the algebra produces one.
  - id: d
    text: Confirm the result answers the quantity actually requested.
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: Algebraic candidates must also satisfy units, context, and the original question.
- id: q015
  type: freeResponse
  prompt: |-
    Classify the system $3x+2y=12$ and $6x+4y=24$. Explain why giving one point is not a complete answer.
  answer:
    gradingMode: selfCheck
    expected: |-
      The second equation is exactly twice the first, so both equations describe the same line. Every point satisfying $3x+2y=12$ satisfies both equations, giving infinitely many solutions. One point would be an example, not the entire solution set.
    keyPoints:
    - Recognizes one equation as a multiple of the other.
    - Classifies the system as infinitely many solutions.
    - Explains that the full line, not one point, is the solution set.
  explanation: Equivalent equations impose only one independent constraint.
