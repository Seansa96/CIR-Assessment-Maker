lesson:
  introduction: Use local connectivity to recognize functional groups, then connect the same structure to polarity, hydrogen
    bonding, and qualitative solubility.
  sections:
  - id: sec-1
    title: Representations and R notation
    required: true
    content: Read expanded, condensed, and simple skeletal structures by following bonds and treating R as a carbon-containing
      remainder.
    media:
    - type: image
      src: /media/chemistry/chem-functional-groups-rnotation.svg
      alt: Representations and R notation diagram with visible bonds.
      caption: null
    check:
      id: chk-1
      type: multipleChoice
      prompt: Which shorthand preserves the same alcohol connectivity as CH₃CH₂OH?
      choices:
      - id: a
        text: CH₃CH₂OH and R—OH when R is CH₃CH₂
        media: []
        issueSignals: []
      - id: b
        text: Count only the total atoms
        media: []
        issueSignals:
        - id: fg-connectivity-misread
          domains:
          - chemistry
      - id: c
        text: Use the molecular formula alone
        media: []
        issueSignals:
        - id: fg-connectivity-misread
          domains:
          - chemistry
      - id: d
        text: Name the largest fragment
        media: []
        issueSignals:
        - id: fg-boundary-confusion
          domains:
          - chemistry
      answer:
        choiceId: a
        choiceIds: []
      explanation: 'Solution: Choice A (CH₃CH₂OH and R—OH when R is CH₃CH₂).


        Why it works: The check uses the fg-read-structures objective by tracing the local connectivity and then applying
        the defining pattern.


        Why the other choices fail: Choice B ignores the representation; choice C discards a bond or attached atom; choice
        D substitutes an unrelated shortcut.'
    difficultyDimensions:
    - connectivityAnalysis
    - representationTranslation
    subjectDifficultyTags:
    - fg-read-structures
    difficultyEvidence: The learner must translate a displayed or described structure and check a local bonding pattern.
    prerequisiteObjectiveIds:
    - fg-read-structures
    extensionObjectiveIds:
    - fg-property-reasoning
    parts: []
    issueSignals: []
  - id: sec-2
    title: Hydrocarbon and halogen groups
    required: true
    content: Recognize C=C, C≡C, and C—X neighborhoods as alkene, alkyne, and haloalkane.
    media:
    - type: image
      src: /media/chemistry/chem-functional-groups-map.svg
      alt: Hydrocarbon and halogen groups diagram with visible bonds.
      caption: null
    check:
      id: chk-2
      type: multipleChoice
      prompt: Which local pattern is an alkyne?
      choices:
      - id: a
        text: R—C≡C—R
        media: []
        issueSignals: []
      - id: b
        text: Ignore the C—X bond and use formula mass
        media: []
        issueSignals:
        - id: fg-connectivity-misread
          domains:
          - chemistry
      - id: c
        text: Treat every nitrogen as an amide
        media: []
        issueSignals:
        - id: fg-connectivity-misread
          domains:
          - chemistry
      - id: d
        text: Count the acid OH as another group
        media: []
        issueSignals:
        - id: fg-boundary-confusion
          domains:
          - chemistry
      answer:
        choiceId: a
        choiceIds: []
      explanation: 'Solution: Choice A (R—C≡C—R).


        Why it works: The check uses the fg-recognize-hydrocarbon-halogen objective by tracing the local connectivity and
        then applying the defining pattern.


        Why the other choices fail: Choice B ignores the representation; choice C discards a bond or attached atom; choice
        D substitutes an unrelated shortcut.'
    difficultyDimensions:
    - connectivityAnalysis
    - representationTranslation
    subjectDifficultyTags:
    - fg-recognize-hydrocarbon-halogen
    difficultyEvidence: The learner must translate a displayed or described structure and check a local bonding pattern.
    prerequisiteObjectiveIds:
    - fg-read-structures
    extensionObjectiveIds:
    - fg-property-reasoning
    parts: []
    issueSignals: []
  - id: sec-3
    title: Oxygen and nitrogen groups
    required: true
    content: Recognize alcohol, ether, aldehyde, ketone, carboxylic acid, ester, amine, and amide from connectivity.
    media:
    - type: image
      src: /media/chemistry/chem-functional-groups-boundaries.svg
      alt: Oxygen and nitrogen groups diagram with visible bonds.
      caption: null
    check:
      id: chk-3
      type: multipleChoice
      prompt: Which pattern is an ester rather than an ether?
      choices:
      - id: a
        text: R—C(=O)—O—R
        media: []
        issueSignals: []
      - id: b
        text: Assume every oxygen is an alcohol
        media: []
        issueSignals:
        - id: fg-connectivity-misread
          domains:
          - chemistry
      - id: c
        text: Ignore attached carbonyls
        media: []
        issueSignals:
        - id: fg-connectivity-misread
          domains:
          - chemistry
      - id: d
        text: Use polarity without connectivity
        media: []
        issueSignals:
        - id: fg-boundary-confusion
          domains:
          - chemistry
      answer:
        choiceId: a
        choiceIds: []
      explanation: 'Solution: Choice A (R—C(=O)—O—R).


        Why it works: The check uses the fg-recognize-oxygen-nitrogen objective by tracing the local connectivity and then
        applying the defining pattern.


        Why the other choices fail: Choice B ignores the representation; choice C discards a bond or attached atom; choice
        D substitutes an unrelated shortcut.'
    difficultyDimensions:
    - connectivityAnalysis
    - representationTranslation
    subjectDifficultyTags:
    - fg-recognize-oxygen-nitrogen
    difficultyEvidence: The learner must translate a displayed or described structure and check a local bonding pattern.
    prerequisiteObjectiveIds:
    - fg-read-structures
    extensionObjectiveIds:
    - fg-property-reasoning
    parts: []
    issueSignals: []
  - id: sec-4
    title: Boundary checks
    required: true
    content: Distinguish look-alike groups and do not count a carboxylic-acid OH as a separate alcohol.
    media:
    - type: image
      src: /media/chemistry/chem-functional-groups-molecule.svg
      alt: Boundary checks diagram with visible bonds.
      caption: null
    check:
      id: chk-4
      type: multipleChoice
      prompt: Why is R—C(=O)—OH classified as a carboxylic acid rather than acid plus alcohol?
      choices:
      - id: a
        text: The OH is directly attached to the carbonyl carbon as part of one group.
        media: []
        issueSignals: []
      - id: b
        text: Treat every oxygen as an alcohol
        media: []
        issueSignals:
        - id: fg-connectivity-misread
          domains:
          - chemistry
      - id: c
        text: Call every carbonyl a ketone
        media: []
        issueSignals:
        - id: fg-connectivity-misread
          domains:
          - chemistry
      - id: d
        text: Count every heteroatom as a group
        media: []
        issueSignals:
        - id: fg-boundary-confusion
          domains:
          - chemistry
      answer:
        choiceId: a
        choiceIds: []
      explanation: 'Solution: Choice A (The OH is directly attached to the carbonyl carbon as part of one group.).


        Why it works: The check uses the fg-distinguish-boundaries objective by tracing the local connectivity and then applying
        the defining pattern.


        Why the other choices fail: Choice B ignores the representation; choice C discards a bond or attached atom; choice
        D substitutes an unrelated shortcut.'
    difficultyDimensions:
    - connectivityAnalysis
    - representationTranslation
    subjectDifficultyTags:
    - fg-distinguish-boundaries
    difficultyEvidence: The learner must translate a displayed or described structure and check a local bonding pattern.
    prerequisiteObjectiveIds:
    - fg-read-structures
    extensionObjectiveIds:
    - fg-property-reasoning
    parts: []
    issueSignals: []
  - id: sec-5
    title: Properties and size
    required: true
    content: Use polar bonds, hydrogen-bond donors/acceptors, and hydrocarbon size to make qualitative property predictions.
    media:
    - type: image
      src: /media/chemistry/chem-functional-groups-properties.svg
      alt: Properties and size diagram with visible bonds.
      caption: null
    check:
      id: chk-5
      type: multipleChoice
      prompt: Which change generally lowers water solubility for a homologous alcohol series?
      choices:
      - id: a
        text: Increasing the hydrocarbon portion while retaining one OH
        media: []
        issueSignals: []
      - id: b
        text: Compare only hydrocarbon size
        media: []
        issueSignals:
        - id: fg-connectivity-misread
          domains:
          - chemistry
      - id: c
        text: Assume polarity replaces connectivity
        media: []
        issueSignals:
        - id: fg-connectivity-misread
          domains:
          - chemistry
      - id: d
        text: Ignore the hydrocarbon remainder
        media: []
        issueSignals:
        - id: fg-boundary-confusion
          domains:
          - chemistry
      answer:
        choiceId: a
        choiceIds: []
      explanation: 'Solution: Choice A (Increasing the hydrocarbon portion while retaining one OH).


        Why it works: The check uses the fg-property-reasoning objective by tracing the local connectivity and then applying
        the defining pattern.


        Why the other choices fail: Choice B ignores the representation; choice C discards a bond or attached atom; choice
        D substitutes an unrelated shortcut.'
    difficultyDimensions:
    - connectivityAnalysis
    - representationTranslation
    subjectDifficultyTags:
    - fg-property-reasoning
    difficultyEvidence: The learner must translate a displayed or described structure and check a local bonding pattern.
    prerequisiteObjectiveIds:
    - fg-read-structures
    extensionObjectiveIds:
    - fg-property-reasoning
    parts: []
    issueSignals: []
