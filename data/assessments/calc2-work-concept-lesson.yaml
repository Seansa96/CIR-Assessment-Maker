lesson:
  introduction: 'In physics, **Work** is done when a force moves an object over a
    distance.

    If the force $F$ is constant, Work is simply $W = F \times d$.

    However, if the force changes as the object moves (e.g., stretching a spring,
    pumping water out of a tank), we must use integration.

    '
  sections:
  - id: variable-force
    title: Work done by a Variable Force
    required: true
    content: 'If an object is moved along the x-axis from $x=a$ to $x=b$ by a continuously
      varying force $F(x)$, the total work done is:


      $$

      W = \int_a^b F(x)\,dx

      $$


      The unit of work in the metric system is the **Joule (J)** (Newtons $\times$
      meters). In the US customary system, it is the **foot-pound (ft-lb)**.

      '
    check:
      id: variable-force-check
      type: multipleChoice
      skills:
      - work
      prompt: If a force of $F(x) = x^2$ Newtons acts on an object, moving it from
        $x=0$ to $x=3$ meters, what is the work done?
      choices:
      - id: a
        text: 9 Joules
      - id: b
        text: 27 Joules
      - id: c
        text: 3 Joules
      - id: d
        text: 6 Joules
      answer:
        choiceId: a
      explanation: '$W = \int_0^3 x^2\,dx = \left[ \frac{x^3}{3} ight]_0^3 = \frac{27}{3}
        = 9$ Joules.

        '
  - id: hookes-law
    title: Hooke's Law (Springs)
    required: true
    content: 'Hooke''s Law states that the force required to maintain a spring stretched
      (or compressed) $x$ units from its natural length is proportional to $x$:


      $$

      F(x) = kx

      $$


      where $k$ is the **spring constant** (a property of the specific spring).


      To find the work done stretching a spring from $x=a$ to $x=b$ (where $x=0$ is
      the natural length):


      $$

      W = \int_a^b kx\,dx

      $$

      '
    check:
      id: hookes-law-check
      type: multipleChoice
      skills:
      - work
      prompt: A spring has a natural length of 20 cm. If a force of 40 N is required
        tohold it stretched to a length of 30 cm, what is the spring constant $k$
        in N/m?
      choices:
      - id: a
        text: 400 N/m
      - id: b
        text: 40 N/m
      - id: c
        text: 4 N/m
      - id: d
        text: 0.25 N/m
      answer:
        choiceId: a
      explanation: 'First, convert cm to meters! Natural length = 0.2 m. Stretched
        length = 0.3 m.

        The stretch distance $x = 0.3 - 0.2 = 0.1$ m.

        $F = kx \implies 40 = k(0.1) \implies k = 400$ N/m.

        '
  - id: pumping-problems
    title: Pumping Liquids
    required: true
    content: 'Pumping liquid out of a tank requires calculating the work to lift thin
     horizontal "slices" of the liquid to the top of the tank.


      Let $y$ be the vertical coordinate. The work to lift a slice of thickness $dy$
      is:

      $dW = (\text{Weight of slice}) \times (\text{Distance lifted})$


      Weight of slice = $(\text{Density}) \times g \times (\text{Volume of slice})$

      Volume of slice = $(\text{Area of cross-section } A(y)) \times dy$

      Distance lifted = $D(y)$ (from the slice at $y$ to the top of the tank).


      $$

      W = \int_a^b ho g \cdot A(y) \cdot D(y)\,dy

      $$


      *Note: In US customary units, weight density $\gamma$ (like 62.4 lb/ft$^3$ for
      water) is given directly, so you don''t multiply by $g$.*

      '
    check:
      id: pumping-problems-check
      type: multipleChoice
      skills:
      - work
      prompt: For a tank of height $H$ sitting on the ground (where $y=0$ is the bottom
        and $y=H$ is the top), what is the distance $D(y)$ that a slice of water at
        height $y$ must be lifted to reach the top?
      choices:
      - id: a
        text: $H - y$
      - id: b
        text: $y$
      - id: c
        text: $y - H$
      - id: d
        text: $H + y$
      answer:
        choiceId: a
      explanation: 'If the top of the tank is at $H$ and the slice is at $y$, it must
        travel upward a distance of $H - y$ to reach the top.

        '

