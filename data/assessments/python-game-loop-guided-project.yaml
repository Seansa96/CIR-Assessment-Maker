    - path: run_checks.py
      readOnly: true
      content: |
        import unittest
        from unittest.mock import patch
        from game import battle_loop
        import sys

        class TestBattleLoop(unittest.TestCase):
            @patch('builtins.input', side_effect=["attack", "attack", "attack"])
            def test_victory(self, mock_input):
                result = battle_loop()
                self.assertEqual(result, "Victory")

            @patch('builtins.input', side_effect=["heal", "heal", "heal", "heal", "heal", "heal", "heal"])
            def test_defeat(self, mock_input):
                # If they keep healing (gaining 30) but the enemy keeps hitting (losing 15),
                # wait, actually they out-heal the enemy. Let's provide invalid inputs so they just get hit.
                pass

            @patch('builtins.input', side_effect=["nothing", "nothing", "nothing", "nothing", "nothing", "nothing", "nothing"])
            def test_defeat_by_inaction(self, mock_input):
                result = battle_loop()
                self.assertEqual(result, "Defeat")
                
            @patch('builtins.input', side_effect=["attack", "heal", "attack", "attack"])
            def test_mixed_actions(self, mock_input):
                result = battle_loop()
                self.assertEqual(result, "Victory")

        if __name__ == '__main__':
            unittest.main(verbosity=2)
