    readOnly: false
    content: "def battle_loop():\n    # TODO: Initialize player_hp and enemy_hp\n\
      \    \n    # TODO: Create the while loop\n    \n        # TODO: Ask for input\n\
      \        \n        # TODO: Process player action using if/elif\n        \n \
      \       # TODO: Process enemy counter-attack\n        \n    # TODO: Return \"\
      Victory\" or \"Defeat\"\n    pass\n"
  - path: run_checks.py
    readOnly: true
    content: "import unittest\nfrom unittest.mock import patch\nfrom game import battle_loop\n\
      import sys\n\nclass TestBattleLoop(unittest.TestCase):\n    @patch('builtins.input',\
      \ side_effect=[\"attack\", \"attack\", \"attack\"])\n    def test_victory(self,\
      \ mock_input):\n        result = battle_loop()\n        self.assertEqual(result,\
      \ \"Victory\")\n\n    @patch('builtins.input', side_effect=[\"heal\", \"heal\"\
      , \"heal\", \"heal\", \"heal\", \"heal\", \"heal\"])\n    def test_defeat(self,\
      \ mock_input):\n        # If they keep healing (gaining 30) but the enemy keeps\
      \ hitting (losing 15),\n        # wait, actually they out-heal the enemy. Let's\
      \ provide invalid inputs so they just get hit.\n        pass\n\n    @patch('builtins.input',\
      \ side_effect=[\"nothing\", \"nothing\", \"nothing\", \"nothing\", \"nothing\"\
      , \"nothing\", \"nothing\"])\n    def test_defeat_by_inaction(self, mock_input):\n\
      \        result = battle_loop()\n        self.assertEqual(result, \"Defeat\"\
      )\n        \n    @patch('builtins.input', side_effect=[\"attack\", \"heal\"\
      , \"attack\", \"attack\"])\n    def test_mixed_actions(self, mock_input):\n\
      \        result = battle_loop()\n        self.assertEqual(result, \"Victory\"\
      )\n\nif __name__ == '__main__':\n    unittest.main(verbosity=2)\n"
