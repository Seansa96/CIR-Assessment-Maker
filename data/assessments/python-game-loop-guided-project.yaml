modeDefault: practice
randomizeQuestions: false
guidedProject:
  language: python
  instructions: 'Build a simple text-based battle loop.


    You will implement a function that runs a loop until either the player or the
    enemy runs out of health.


    Required project behavior:


    - Implement the `battle_loop()` function in `game.py`.

    - Set `player_hp = 100` and `enemy_hp = 50`.

    - Create a `while` loop that continues as long as BOTH `player_hp > 0` and `enemy_hp
    > 0`.

    - Inside the loop, prompt the user with: `Action (attack/heal): ` using `input()`.

    - If the user types `"attack"`, subtract 20 from `enemy_hp`.

    - If the user types `"heal"`, add 30 to `player_hp`.

    - For any other input, do nothing.

    - After the player''s action, if the enemy is still alive (`enemy_hp > 0`), subtract
    15 from `player_hp` (enemy attacks back).

    - Return a string at the end: If the player survived (`player_hp > 0`), return
    `"Victory"`. Otherwise, return `"Defeat"`.


    The automated tests will simulate inputs to check your logic.

    '
  requiredChecks:
  - id: compile-check
    title: Compile
    description: Compiles correctly.
    expectedOutputContains:
    - OK
