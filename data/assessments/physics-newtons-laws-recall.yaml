schemaVersion: 1
id: physics-newtons-laws-recall
title: Newton's Laws of Motion Recall Drill
assessmentType: recallDrill
categoryId: physics-1
subcategoryId: physics-newton-laws
subcategoryIds:
  - physics-newton-laws
modeDefault: practice
randomizeQuestions: true
items:
  - id: r001
    type: flashcard
    prompt: What is Newton's First Law of Motion?
    answer:
      expected: An object at rest stays at rest and an object in motion stays in motion with the same speed and in the same direction unless acted upon by an unbalanced force. (Law of Inertia)
  - id: r002
    type: flashcard
    prompt: What is Newton's Second Law of Motion?
    answer:
      expected: The net force acting on an object is equal to the mass of the object multiplied by its acceleration ($\sum \vec{F} = m\vec{a}$).
  - id: r003
    type: flashcard
    prompt: What is Newton's Third Law of Motion?
    answer:
      expected: For every action, there is an equal and opposite reaction. (Forces always occur in action-reaction pairs between two interacting bodies).
  - id: r004
    type: typed
    prompt: What intrinsic property of an object is a measure of its inertia?
    answer:
      expected: mass
  - id: r005
    type: typed
    prompt: What is the SI unit of force?
    answer:
      expected: Newton
      aliases:
        - N
        - newtons
        - newton
  - id: r006
    type: flashcard
    prompt: Describe the difference between mass and weight.
    answer:
      expected: Mass is the amount of matter (inertia) in an object and is constant regardless of location. Weight is the gravitational force acting on that mass ($W=mg$) and depends on the local gravitational field.
  - id: r007
    type: typed
    prompt: In a free-body diagram, do you draw forces acting ON the object, or forces exerted BY the object?
    answer:
      expected: ON
      aliases:
        - on the object
        - forces acting on the object


