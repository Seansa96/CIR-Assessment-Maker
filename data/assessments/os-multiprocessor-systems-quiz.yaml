- id: q004
  title: Explain Multiprocessor scheduling
  type: freeResponse
  prompt: 'In a short answer, explain why **Multiprocessor scheduling** matters in Multiple Processor Systems.

    '
  answer:
    expected: 'The scheduler must consider processor affinity, load balancing, and cache effects. A complete answer should
      also note that moving a task can balance load but disrupt cache locality.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Multiprocessor scheduling
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: Multiple Processor Systems. The key is to connect the term to what the OS controls or protects.

    '
