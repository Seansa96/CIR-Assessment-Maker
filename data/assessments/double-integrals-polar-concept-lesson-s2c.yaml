  - id: s02
    title: Area scales with radius
    required: true
    content: The polar area element is $r\,dr\,d\theta$, not merely $dr\,d\theta$. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
