          domains: []
      - id: c
        text: angle (answers 'What does theta measure?', not 'What is dA in polar coordinates?')
        media: []
        issueSignals:
        - id: polar-rectangular-conversion-error
          domains: []
      - id: d
        text: r cos theta (answers 'What is x in polar form?', not 'What is dA in polar coordinates?')
        media: []
        issueSignals:
        - id: polar-rectangular-conversion-error
