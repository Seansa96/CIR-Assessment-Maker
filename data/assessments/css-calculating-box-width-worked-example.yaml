schemaVersion: 1
id: css-calculating-box-width-worked-example
title: Calculating Element Width
assessmentType: workedExample
categoryId: css
subcategoryIds:
  - css-box-model
modeDefault: study
workedExamples:
  - id: we-width-1
    title: Calculating Physical Width
    problem: |
      Consider an element with the following CSS applied:
      ```css
      .box {
        width: 300px;
        padding-left: 20px;
        padding-right: 20px;
        border: 5px solid black;
        margin-left: 10px;
      }
      ```
    steps:
      - id: step-1
        title: Under content-box
        instruction: Calculate the total physical width assuming default `box-sizing: content-box`.
        type: freeResponse
        prompt: What is the total horizontal footprint (width + padding + borders) of this element? (Exclude margins).
        check:
          id: check-1
          type: exactMatch
          answer: "350px"
          explanation: |
            Content (300) + Left Padding (20) + Right Padding (20) + Left Border (5) + Right Border (5) = 350px.
      - id: step-2
        title: Under border-box
        instruction: Calculate the total physical width assuming `box-sizing: border-box`.
        type: freeResponse
        prompt: What is the total horizontal footprint (width + padding + borders) of this element now?
        check:
          id: check-2
          type: exactMatch
          answer: "300px"
          explanation: |
            Under `border-box`, the padding and border are absorbed into the width. The total physical width remains exactly the stated width: 300px.
