- id: emr-we1
  title: Use energy for a frictionless descent
  problem: A 2.0 kg sled starts from rest 5.0 m above the bottom of a frictionless hill. Find its speed at the bottom using $g=9.8$ m/s$^2$.
  steps:
  - id: emr-we1-s1
    title: Choose the model
    instruction: Identify the appropriate conservation law.
    hint: 
    type: multipleChoice
    prompt: Which relation applies?
    choices:
    - id: a
      text: $K_i+U_i=K_f+U_f$
      media: []
      issueSignals: []
    - id: b
      text: $P_i=P_f$
      media: []
      issueSignals:
      - id: concept-misunderstood
        domains:
        - physics-1
    answer:
      choiceId: a
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: Use mechanical-energy conservation.\n\nWhy it works: The hill is frictionless and gravity is conservative.\n\nWhy the other choices fail: Momentum is not conserved for the sled alone because gravity exerts an external impulse.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: emr-we1-s2
    title: Solve for speed
    instruction: Set $mgh=\tfrac12mv^2$.
    hint: 
    type: numericResponse
    prompt: What is the speed in m/s?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 9.89949
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: "Solution: $v=\\sqrt{2gh}=\\sqrt{98}=9.90$ m/s.\\n\\nWhy it works: The sled's lost gravitational potential energy becomes kinetic energy."
