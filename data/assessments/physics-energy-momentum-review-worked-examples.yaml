workedExamples:
- id: emr-we1
  title: Use energy for a frictionless descent
  problem: A 2.0 kg sled starts from rest 5.0 m above the bottom of a frictionless hill. Find its speed at the bottom using $g=9.8$ m/s$^2$.
  steps:
  - { id: emr-we1-s1, title: Choose the model, instruction: 'Identify the appropriate conservation law.', type: multipleChoice, prompt: 'Which relation applies?', choices: [{ id: a, text: '$K_i+U_i=K_f+U_f$', issueSignals: [] }, { id: b, text: '$P_i=P_f$', issueSignals: [{ id: wrong-model, domains: [physics-1] }] }], answer: { choiceId: a }, explanation: 'Solution: Use mechanical-energy conservation.\n\nWhy it works: The hill is frictionless and gravity is conservative.\n\nWhy the other choices fail: Momentum is not conserved for the sled alone because gravity exerts an external impulse.' }
  - { id: emr-we1-s2, title: Solve for speed, instruction: 'Set $mgh=\tfrac12mv^2$.', type: numericResponse, prompt: 'What is the speed in m/s?', choices: [], answer: { value: 9.89949, tolerance: 0.001 }, explanation: 'Solution: $v=\sqrt{2gh}=\sqrt{98}=9.90$ m/s.\n\nWhy it works: The sled''s lost gravitational potential energy becomes kinetic energy.' }
- id: emr-we2
  title: Use momentum for a sticking collision
  problem: A 1.0 kg cart moving right at 6.0 m/s sticks to a 2.0 kg cart at rest on a low-friction track. Find their final velocity.
  steps:
  - { id: emr-we2-s1, title: Write total initial momentum, instruction: 'Choose right as positive.', type: numericResponse, prompt: 'What is initial total momentum in kg m/s?', choices: [], answer: { value: 6.0, tolerance: 0.001 }, explanation: 'Solution: $P_i=(1.0)(6.0)+(2.0)(0)=6.0$ kg m/s.\n\nWhy it works: Both carts are included in the system.' }
  - { id: emr-we2-s2, title: Divide by combined mass, instruction: 'The carts stick and share a final velocity.', type: numericResponse, prompt: 'What is final velocity in m/s?', choices: [], answer: { value: 2.0, tolerance: 0.001 }, explanation: 'Solution: $6.0=(1.0+2.0)v_f$, giving $v_f=2.0$ m/s.\n\nWhy it works: The short collision has negligible external impulse, so total momentum is conserved.' }
