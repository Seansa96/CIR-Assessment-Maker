workedExamples:
- id: we-1
  title: 'Worked Example'
  problem: 'Find the polar coordinates $(r, \theta)$ of the points where the cardioid $r = 1 - \sin\theta$ has a horizontal tangent.'
  steps:
  - id: step-1
    title: 'Set up the equations for $x$ and $y$'
    type: freeResponse
    skills:
    - polar-tangents
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      To find tangent lines in polar coordinates, we must always convert the equation into parametric equations using $x$ and $y$:
      
      $$ x = r \cos\theta \implies x = (1 - \sin\theta)\cos\theta $$
      $$ y = r \sin\theta \implies y = (1 - \sin\theta)\sin\theta $$
      
      We want horizontal tangents, which occur where the tangent line has a slope of $0$. This means the numerator of the slope $\frac{dy}{dx}$ is zero, while the denominator is non-zero:
      $$ \frac{dy}{d\theta} = 0 \quad \text{and} \quad \frac{dx}{d\theta} \neq 0 $$
  - id: step-2
    title: 'Find the derivative $\frac{dy}{d\theta}$'
    type: freeResponse
    skills:
    - polar-tangents
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      We need to differentiate $y = (1 - \sin\theta)\sin\theta$.
      We can distribute first to make the derivative easier:
      $$ y = \sin\theta - \sin^2\theta $$
      
      Now take the derivative with respect to $\theta$:
      $$ \frac{dy}{d\theta} = \cos\theta - 2\sin\theta\cos\theta $$
  - id: step-3
    title: 'Set $\frac{dy}{d\theta} = 0$ and factor'
    type: freeResponse
    skills:
    - polar-tangents
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      Set the derivative equal to zero to find horizontal tangents:
      $$ \cos\theta - 2\sin\theta\cos\theta = 0 $$
      
      Factor out the common term, $\cos\theta$:
      $$ \cos\theta (1 - 2\sin\theta) = 0 $$
      
      This gives us two separate equations to solve:
      1. $\cos\theta = 0$
      2. $1 - 2\sin\theta = 0 \implies \sin\theta = 1/2$
  - id: step-4
    title: 'Solve for $\theta$ on the interval $[0, 2\pi]$'
    type: freeResponse
    skills:
    - polar-tangents
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      **From $\cos\theta = 0$:**
      $$ \theta = \frac{\pi}{2}, \quad \frac{3\pi}{2} $$
      
      **From $\sin\theta = 1/2$:**
      $$ \theta = \frac{\pi}{6}, \quad \frac{5\pi}{6} $$
      
      These are our candidate angles for horizontal tangents. 
      *(Note: We must theoretically check that $\frac{dx}{d\theta} \neq 0$ at these points. However, evaluating $\frac{dx}{d\theta} = -\sin\theta + \sin^2\theta - \cos^2\theta$ at these angles confirms they are non-zero except at $\theta = \pi/2$, which yields the indeterminate form $0/0$. Using L'Hôpital's Rule on $\frac{dy/d\theta}{dx/d\theta}$ as $\theta \to \pi/2$ reveals the slope is $0$, so there is indeed a horizontal tangent there too).*
  - id: step-5
    title: 'Find the corresponding $r$ values'
    type: freeResponse
    skills:
    - polar-tangents
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      The problem asks for the polar coordinates $(r, \theta)$. We must plug our $\theta$ values back into the original curve equation $r = 1 - \sin\theta$.
      
      - For $\theta = \frac{\pi}{2}$: $r = 1 - \sin(\pi/2) = 1 - 1 = 0$. Point: $(0, \pi/2)$ (The pole)
      - For $\theta = \frac{3\pi}{2}$: $r = 1 - \sin(3\pi/2) = 1 - (-1) = 2$. Point: $(2, 3\pi/2)$
      - For $\theta = \frac{\pi}{6}$: $r = 1 - \sin(\pi/6) = 1 - 1/2 = 1/2$. Point: $(1/2, \pi/6)$
      - For $\theta = \frac{5\pi}{6}$: $r = 1 - \sin(5\pi/6) = 1 - 1/2 = 1/2$. Point: $(1/2, 5\pi/6)$
      
      These four points are where the cardioid has horizontal tangents.
