lesson:
  introduction: |
    In the previous lesson, we learned how to find the area between two curves. But what happens when a region is bounded by three or more curves? In this lesson, we will explore how to set up integrals for these more complex regions and when to switch the variable of integration.
  sections:
  - id: sec-identifying-boundaries
    title: Identifying the True Boundaries
    required: true
    content: |
      When dealing with more than two curves, the most critical step is drawing an accurate sketch and identifying the exact boundary of the enclosed region.

      For instance, consider the region bounded by $y = x$, $y = 2-x$, and the x-axis ($y = 0$). 
      
      This region forms a triangle. If we try to integrate with respect to $x$ (using vertical slices), we notice a problem: the "top" curve changes! 
      - From $x=0$ to $x=1$, the top curve is $y = x$.
      - From $x=1$ to $x=2$, the top curve is $y = 2-x$.

      To find the area using vertical slices, we MUST split the integral into two separate parts:
      $$ A = \int_0^1 (x - 0)\,dx + \int_1^2 ((2-x) - 0)\,dx $$

  - id: sec-finding-intersections
    title: Finding Intersection Points
    required: true
    content: |
      When there are three or more curves, you must find all pairs of intersection points to determine the vertices of your region. Do not assume bounds are obvious from a quick sketch.
      
      **Common Pitfall:** A student might see a region bounded by multiple lines and guess the integration bounds. Always set the pairs of equations equal to each other algebraically to confirm the exact coordinates of the intersections.
      
      For $y = x$ and $y = 2-x$, setting them equal gives:
      $$ x = 2-x \implies 2x = 2 \implies x = 1 $$
      The corresponding $y$-value is $1$. The vertices of the region bounded by these two curves and $y=0$ are $(0,0)$, $(1,1)$, and $(2,0)$.

  - id: sec-horizontal-alternative
    title: The Horizontal Alternative
    required: true
    content: |
      Let's look at the same region bounded by $y = x$, $y = 2-x$, and $y = 0$, but this time we'll use horizontal slices (integrating with respect to $y$).

      First, rewrite the equations in terms of $y$:
      - $x = y$ (the left curve)
      - $x = 2-y$ (the right curve)

      Looking horizontally from $y=0$ to the intersection point at $y=1$, the "right" curve is ALWAYS $x = 2-y$ and the "left" curve is ALWAYS $x = y$.
      Because the right and left boundaries never change, we only need ONE integral:
      $$ A = \int_0^1 ((2-y) - y)\,dy = \int_0^1 (2 - 2y)\,dy $$

      This evaluates to $2(1) - (1)^2 = 1$. This matches the area of the triangle calculated geometrically.
      
      **Key Takeaway**: When faced with multiple curves, check if switching the variable of integration allows you to use a single integral instead of multiple!

  - id: sec-complex-regions
    title: Complex Regions Requiring Both
    required: true
    content: |
      Sometimes a region is so complex that it requires splitting the integral regardless of whether you integrate with respect to $x$ or $y$. In these cases, your choice should be based on which functions are easier to integrate.
      
      If rewriting the curves as $x=f(y)$ introduces difficult inverse functions (like inverse trigonometric functions or complicated radicals), it may be better to stick with vertical slices and split the domain, even if it means evaluating two integrals instead of one.

questions:
- id: q-area-multi-1
  title: Concept Check - Splitting Integrals
  prompt: |
    Suppose a region is bounded above by $y = 4$ and bounded below by $y = x^2$ for $x < 0$ and $y = 2x$ for $x \ge 0$. If integrating with respect to $x$, how many integrals are needed?
  type: multipleChoice
  choices:
  - id: c1
    text: 'One integral'
  - id: c2
    text: 'Two integrals'
  - id: c3
    text: 'Three integrals'
  answer:
    choiceId: c2
  explanation: |
    Because the bottom boundary changes definition at $x=0$, you must split the area into two integrals: one from the left intersection to $x=0$, and another from $x=0$ to the right intersection.
  skills:
  - area-between-curves

- id: q-area-multi-2
  title: Concept Check - Variable Switch
  prompt: |
    For the same region bounded above by $y = 4$ and below by $y = x^2$ (for $x < 0$) and $y = 2x$ (for $x \ge 0$), would integrating with respect to $y$ require splitting the integral?
  type: multipleChoice
  choices:
  - id: c1
    text: 'Yes, it would still require two integrals.'
  - id: c2
    text: 'No, it would only require one integral.'
  answer:
    choiceId: c2
  explanation: |
    If you integrate with respect to $y$, the left boundary is ALWAYS the left half of the parabola ($x = -\sqrt{y}$), and the right boundary is ALWAYS the line ($x = y/2$). Therefore, only **one** integral is needed!
  skills:
  - area-between-curves

- id: q-area-multi-3
  title: Intersection Points Check
  prompt: |
    Find the positive $y$-coordinate of the intersection point between the curves $x = y^2 - 4$ and $x = 2y - 1$.
  type: symbolicResponse
  answer:
    expectedLatex: '3'
    gradingMode: auto
  explanation: |
    Set the two equations equal to each other:
    $$ y^2 - 4 = 2y - 1 $$
    $$ y^2 - 2y - 3 = 0 $$
    $$ (y - 3)(y + 1) = 0 $$
    The intersection points occur at $y = 3$ and $y = -1$. The positive coordinate is $3$.
  skills:
  - area-between-curves
