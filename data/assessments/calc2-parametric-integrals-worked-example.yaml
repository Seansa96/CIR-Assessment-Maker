workedExamples:
  - id: we-param-int-1
    title: Area Under a Parametric Curve
    problem: |
      ![One cycloid arch with the region between the curve and x-axis shaded](/assessments/calc2-parametric-polar/parametric-cycloid-area.svg)

      Find the area under one arch of the cycloid:

      $$
      x = t-\sin t, \quad y = 1-\cos t,
      \qquad 0\leq t\leq 2\pi
      $$

      The interval already traces one complete arch, beginning and ending on the $x$-axis.
    steps:
      - id: step-we-param-int-1a
        title: Find the points where the curve intersects the x-axis
        instruction: |
          The curve intersects the $x$-axis when $y=1-\cos t=0$. On the stated interval this occurs at $t=0$ and $t=2\pi$, confirming that the interval encloses one arch with the $x$-axis.
          
          The area under a parametric curve from $t=\alpha$ to $t=\beta$ is given by:

          $$
          A = \int_{\alpha}^{\beta} y(t) x'(t) \, dt
          $$

          Let's find $x'(t)$ for the cycloid.
        type: symbolicResponse
        prompt: 'What is $x''(t)$?'
        answer:
          expectedLatex: '1 - \cos t'
          equivalenceMode: expression
          variables:
            - t
          tolerance: 0.000001
        explanation: |
          The derivative of $x = t - \sin t$ is $x'(t) = 1 - \cos t$.
        skills:
          - parametric-integrals

      - id: step-we-param-int-1b
        title: Set up and evaluate the integral
        instruction: |
          We integrate from $t=0$ to $t=2\pi$.
          
          $$
          A = \int_{0}^{2\pi} (1 - \cos t)(1 - \cos t) \, dt = \int_{0}^{2\pi} (1 - 2\cos t + \cos^2 t) \, dt
          $$
          
          To integrate $\cos^2 t$, we use the half-angle identity: $\cos^2 t = \frac{1 + \cos(2t)}{2}$.
          
          $$
          \int_{0}^{2\pi} \left(1 - 2\cos t + \frac{1}{2} + \frac{1}{2}\cos(2t)\right) \, dt
          $$
          
          $$
          = \int_{0}^{2\pi} \left(\frac{3}{2} - 2\cos t + \frac{1}{2}\cos(2t)\right) \, dt
          $$
        type: numericResponse
        prompt: 'Evaluate this definite integral from $0$ to $2\pi$. What is the area in terms of $\pi$?'
        answer:
          value: 9.42477796
          tolerance: 0.001
        explanation: |
          Integrating term by term:
          $\left[ \frac{3}{2}t - 2\sin t + \frac{1}{4}\sin(2t) \right]_0^{2\pi}$
          
          At $t=2\pi$: $\frac{3}{2}(2\pi) - 0 + 0 = 3\pi$.
          At $t=0$: $0 - 0 + 0 = 0$.
          
          The total area is $3\pi$, which is approximately 9.425.
        skills:
          - parametric-integrals

  - id: we-param-int-2
    title: Arc Length of a Parametric Curve
    problem: |
      ![The involute curve traced from t equals zero to t equals pi with its curved path highlighted](/assessments/calc2-parametric-polar/parametric-involute-arc-length.svg)

      Find the arc length of the curve defined by:
      
      $$
      x = \cos t + t\sin t, \quad y = \sin t - t\cos t
      $$
      
      for $0 \le t \le \pi$.
    steps:
      - id: step-we-param-int-2a
        title: Find the derivatives
        instruction: |
          The arc length formula for parametric curves is:
          
          $$
          L = \int_{\alpha}^{\beta} \sqrt{\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2} \, dt
          $$
          
          First, find $\frac{dx}{dt}$ using the product rule:
          $\frac{dx}{dt} = -\sin t + (\sin t + t\cos t) = t\cos t$.
          
          Now find $\frac{dy}{dt}$.
        type: symbolicResponse
        prompt: 'What is $\frac{dy}{dt}$?'
        answer:
          expectedLatex: 't\sin t'
          equivalenceMode: expression
          variables:
            - t
          tolerance: 0.000001
        explanation: |
          $\frac{dy}{dt} = \cos t - (\cos t - t\sin t) = t\sin t$.
        skills:
          - parametric-integrals

      - id: step-we-param-int-2b
        title: Set up and evaluate the arc length integral
        instruction: |
          Now, square the derivatives and add them:
          $\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2 = (t\cos t)^2 + (t\sin t)^2 = t^2\cos^2 t + t^2\sin^2 t = t^2(\cos^2 t + \sin^2 t) = t^2$.
          
          The arc length integral is:
          $$
          L = \int_{0}^{\pi} \sqrt{t^2} \, dt = \int_{0}^{\pi} t \, dt
          $$
        type: symbolicResponse
        prompt: 'Evaluate the integral. What is the exact arc length?'
        answer:
          expectedLatex: '\frac{\pi^2}{2}'
          equivalenceMode: expression
          variables: []
          tolerance: 0.000001
        explanation: |
          $\int_{0}^{\pi} t \, dt = \left[ \frac{t^2}{2} \right]_0^{\pi} = \frac{\pi^2}{2}$.
        skills:
          - parametric-integrals
