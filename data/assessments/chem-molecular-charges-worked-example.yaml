workedExamples:
  - id: we-formal-charges-so3
    title: Formal Charges in SO₃ and Selecting the Best Structure
    problem: |
      Sulfur trioxide ($SO_3$) can be drawn with two different Lewis structures:

      **Structure A:** S has a double bond to each of the three O atoms (S has 12 electrons, expanded octet).

      **Structure B:** S has a double bond to one O and single bonds to the other two O atoms (S has 8 electrons, no expansion).

      Calculate formal charges on all atoms in each structure and determine which is preferred.
    steps:
      - id: s1-count-ve-so3
        title: Count valence electrons in SO₃
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the electron count and continue.
        instruction: |
          $S$: Group 16 → 6 valence electrons
          $3 \times O$: $3 \times 6 = 18$ valence electrons
          Total: $6 + 18 = \mathbf{24}$ valence electrons.

      - id: s2-fc-structure-a
        title: Formal charges in Structure A (three S=O double bonds)
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the formal charge analysis and continue.
        instruction: |
          In Structure A, S forms three double bonds and has no lone pairs.

          **Formal charge on S:**
          $$\text{FC}(S) = V - L - \frac{B}{2} = 6 - 0 - \frac{12}{2} = 6 - 0 - 6 = 0$$

          **Formal charge on each O** (one lone pair = 4 electrons, 4 bonding electrons):
          $$\text{FC}(O) = 6 - 4 - \frac{4}{2} = 6 - 4 - 2 = 0$$

          All formal charges are **zero**. Structure A has minimum formal charge separation.

      - id: s3-fc-structure-b
        title: Formal charges in Structure B (one S=O, two S—O single bonds)
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the formal charge analysis and continue.
        instruction: |
          In Structure B, S has one double bond (to one O) and two single bonds (to the other two O atoms). S has one lone pair.

          **Formal charge on S:**
          $V=6$, $L=2$ (one lone pair), $B = 2+4+4 = 10$ bonding electrons... wait — let us recount carefully.

          S has: 1 double bond (4 e⁻ shared) + 2 single bonds (2 e⁻ each = 4 e⁻) = 8 bonding e⁻. S has 1 lone pair (2 e⁻).

          $$\text{FC}(S) = 6 - 2 - \frac{8}{2} = 6 - 2 - 4 = 0$$

          **Doubly-bonded O** (1 lone pair = 2 e⁻, 4 bonding e⁻):
          $$\text{FC}(O_{double}) = 6 - 4 - \frac{4}{2} = 0$$

          **Singly-bonded O** (3 lone pairs = 6 e⁻, 2 bonding e⁻):
          $$\text{FC}(O_{single}) = 6 - 6 - \frac{2}{2} = -1$$

          Structure B has S = 0, one O = 0, **two O = −1** — formal charges of −1 on two oxygens, requiring S to carry +2 somewhere to balance... actually the molecule is neutral overall: 0 + 0 + (−1) + (−1) = −2, which is wrong for a neutral molecule. This means Structure B is inconsistent or we must invoke S having a formal charge of +2.

          Recalculating for consistency: Structure B is inferior because it produces large formal charges (+2 on S, −1 on two O atoms). **Structure A is preferred.**

      - id: s4-so3-conclusion
        title: Conclusion and Resonance in SO₃
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the conclusion and continue.
        instruction: |
          Structure A (three S=O double bonds, all FC = 0) is **preferred** because it minimizes formal charges.

          In reality, $SO_3$ is best described by **three equivalent resonance structures**, each with one double bond rotated to a different oxygen. The true structure is the resonance hybrid: all three S—O bonds are equivalent with bond order $\frac{1+1+2}{3}$ ... actually with three resonance structures each contributing one double bond to each position in turn:

          $$\text{Bond order (S—O)} = \frac{1+1+2}{3} = \frac{4}{3} \approx 1.33$$

          Wait — using Structure A as the primary resonance contributor (all S=O), the S—O bond order in the hybrid is 2 (if only A contributes) or an average if we mix A and B structures. Experimentally, all S—O bonds in $SO_3$ are **equal** at 143 pm, confirming resonance delocalization.

  - id: we-no3-resonance
    title: Resonance Structures of the Nitrate Ion (NO₃⁻)
    problem: |
      Draw all resonance structures of the nitrate ion ($NO_3^-$), calculate formal charges, and determine the bond order of each N—O bond in the resonance hybrid.
    steps:
      - id: s5-no3-count
        title: Count valence electrons in NO₃⁻
        type: numericResponse
        answer:
          value: 24
          tolerance: 0
        prompt: |
          How many total valence electrons are in $NO_3^-$?
          (N: 5; each O: 6; charge: −1 adds 1 electron)
        instruction: |
          $$N: 5 + 3 \times O: 18 + 1 \text{ (charge)} = 24 \text{ valence electrons}$$

      - id: s6-no3-resonance-structures
        title: Draw the three resonance structures
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the three resonance structures and continue.
        instruction: |
          N is the central atom. The 24 valence electrons are arranged as:

          **Structure I:** N=O (double bond to O₁), N—O⁻ × 2 (single bonds to O₂ and O₃)

          The double bond "moves" to give:

          **Structure II:** N—O₂=… (double bond to O₂)

          **Structure III:** N—O₃=… (double bond to O₃)

          All three are equivalent — each has:
          - Formal charge on N: $5 - 0 - \frac{8}{2} = +1$
          - Doubly-bonded O: $6 - 4 - 2 = 0$
          - Singly-bonded O (each): $6 - 6 - 1 = -1$

          Sum of formal charges: $+1 + 0 + (-1) + (-1) = -1$ ✓ (matches ion charge)

      - id: s7-no3-bond-order
        title: Bond order in the resonance hybrid
        type: numericResponse
        answer:
          value: 1.33
          tolerance: 0.05
        prompt: |
          Each of the three resonance structures has **one** N=O double bond and **two** N—O single bonds. What is the N—O bond order in the resonance hybrid? Enter a decimal.
        instruction: |
          Each N—O bond position receives a double bond in one structure and single bonds in two structures:

          $$
          \text{Bond order} = \frac{2 + 1 + 1}{3} = \frac{4}{3} \approx 1.33
          $$

          All three N—O bonds in $NO_3^-$ are equal, with bond order ≈ 1.33. This is confirmed experimentally: all N—O bonds are 124 pm, between a single bond (~145 pm) and a double bond (~120 pm).
