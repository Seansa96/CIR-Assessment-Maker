- id: q-6817d6
  type: symbolicResponse
  title: Arc Length Integrand (1)
  prompt: Write the integrand for the arc length of $r = \theta^3$.
  answer:
    expectedLatex: \sqrt{\theta^{6} + (3\theta^{2})^2}
    equivalenceMode: expression
    variables:
    - \theta
    tolerance: 0.0001
  explanation: Arc length integrand is $\sqrt{r^2 + (dr/d\theta)^2}$.
  skills:
  - polar-calculus
