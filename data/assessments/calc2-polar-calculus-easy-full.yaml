- id: q-38cfa5
  type: numericResponse
  title: Polar Area Setup (8)
  prompt: What is the total area enclosed by the circle $r = 3\cos\theta$?
  answer:
    value: 7.0685834625
    tolerance: 0.05
  explanation: The circle has radius $r=3/2$. Area is $\pi r^2 = \pi(3/2)^2 = \frac{9\pi}{4}$.
  skills:
  - polar-calculus
