schemaVersion: 1
id: chemistry-stoichiometry-recall
title: Stoichiometry Recall Drill
assessmentType: recallDrill
categoryId: chemistry
subcategoryIds:
- chemistry-stoichiometry
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  prompt: 'In the equation N2 + 3H2 → 2NH3, what is the mole ratio of H2 to NH3?

    '
  answer:
    expected: '3:2'
    aliases:
    - 3 to 2
- id: r002
  type: typed
  prompt: 'The reactant that is completely consumed in a reaction and determines the
    maximum amount of product is called the what?

    '
  answer:
    expected: limiting reactant
    aliases:
    - limiting reagent
- id: r003
  type: typed
  prompt: What is the formula for percent yield?
  answer:
    expected: (actual yield / theoretical yield) × 100%
    aliases:
    - actual/theoretical x 100
    - actual divided by theoretical times 100
- id: r004
  type: typed
  prompt: 'What is the first step in a mass-to-mass stoichiometry problem?

    '
  answer:
    expected: convert grams to moles
    aliases:
    - find moles
    - divide by molar mass
- id: r005
  type: flashcard
  prompt: Describe the three-step roadmap for mass-to-mass stoichiometry.
  answer:
    expected: 'Step 1: Convert grams of A to moles of A (divide by molar mass of A).
      Step 2: Convert moles of A to moles of B (multiply by the mole ratio from the
      balanced equation). Step 3: Convert moles of B to grams of B (multiply by molar
      mass of B).

      '
- id: r006
  type: typed
  prompt: 'The maximum amount of product that can form based on the limiting reactant
    is called the what?

    '
  answer:
    expected: theoretical yield
    aliases:
    - maximum yield
- id: r007
  type: typed
  prompt: 'Which type of yield is always less than or equal to the theoretical yield?

    '
  answer:
    expected: actual yield
- id: r008
  type: typed
  prompt: 'In the reaction 2Al + 3Cl2 → 2AlCl3,\rhow many moles of AlCl3 are produced
    from 6 mol of Al?

    '
  answer:
    expected: '6'
    aliases:
    - 6 mol
    - 6 moles
- id: r009
  type: flashcard
  prompt: 'How do you identify the limiting reactant when two reactant masses are
    given?

    '
  answer:
    expected: 'Calculate the moles of product that can be produced from each reactant
      separately using the appropriate mole ratio. The reactant that produces the
      smaller amount of product is the limiting reactant.

      '
- id: r010
  type: typed
  prompt: 'A reaction has a theoretical yield of 50.0 g and an actual yield of 42.5
    g. What is the percent yield?

    '
  answer:
    expected: 85.0%
    aliases:
    - 85%
    - 85
