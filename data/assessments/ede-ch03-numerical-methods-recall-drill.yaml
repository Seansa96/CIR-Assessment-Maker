items:
- id: r01
  type: typed
  prompt: Write Euler’s update formula.
  answer:
    expected: $y_{n+1}=y_n+h f(x_n,y_n)$.
  explanation: |-
    Solution: $y_{n+1}=y_n+h f(x_n,y_n)$.

    Why it works: Euler advances from the known current mesh state by multiplying its right-hand-side slope by the step size.
  tags:
  - ede-ch03-numerical-methods
  - recall
  skills:
  - ede-ch03-numerical-methods-euler-updates
  subjectDifficultyTags: []
- id: r02
  type: typed
  prompt: What two quantities locate the slope used by Euler’s method?
  answer:
    expected: The current mesh point $(x_n,y_n)$.
  explanation: |-
    Solution: The current mesh point $(x_n,y_n)$.

    Why it works: Euler advances from the known current mesh state by multiplying its right-hand-side slope by the step size.
