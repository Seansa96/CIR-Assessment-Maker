  subjectDifficultyTags: []
- id: r03
  type: typed
  prompt: Distinguish local from global error.
  answer:
    expected: Local error is one-step error; global error accumulates across steps.
  explanation: |-
    Solution: Local error is one-step error; global error accumulates across steps.

    Why it works: The claim compares an approximation and reference at the same point while distinguishing one-step error from accumulated error.
  tags:
  - ede-ch03-numerical-methods
  - recall
  skills:
  - ede-ch03-numerical-methods-error-step-size
  subjectDifficultyTags: []
- id: r04
  type: typed
  prompt: What is the first action in improved Euler?
  answer:
    expected: Compute an Euler predictor.
  explanation: |-
    Solution: Compute an Euler predictor.

    Why it works: The corrected update uses a predictor or midpoint stage to represent how the slope changes across the step.
  tags:
  - ede-ch03-numerical-methods
  - recall
  skills:
  - ede-ch03-numerical-methods-improved-euler
  subjectDifficultyTags: []
