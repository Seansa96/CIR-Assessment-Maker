- id: r07
  type: typed
  prompt: How many stage slopes does classical RK4 use?
  answer:
    expected: Four.
  explanation: |-
    Solution: Four.

    Why it works: RK4 evaluates four prescribed stage states and combines their slopes with weights $1,2,2,1$.
