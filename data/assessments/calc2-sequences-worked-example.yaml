- id: lhopitals
  title: Using L'Hôpital's Rule on a Sequence
  problem: |
    Determine if the sequence $a_n = \frac{\ln n}{n}$ converges or diverges. If it converges, find the limit.
  steps:
  - id: step-lhopitals-1
    title: Set up the limit
    type: freeResponse
    skills:
    - sequences
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      We want to evaluate $\lim_{n \to \infty} \frac{\ln n}{n}$.
      As $n \to \infty$, both $\ln n \to \infty$ and $n \to \infty$, so we have the indeterminate form $\frac{\infty}{\infty}$.
    explanation: 'Solution:


      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.'
  - id: step-lhopitals-2
    title: Apply L'Hôpital's Rule
    type: freeResponse
    skills:
    - sequences
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      To use L'Hôpital's rule, we technically consider the continuous function $f(x) = \frac{\ln x}{x}$.

      $$ \lim_{x \to \infty} \frac{\ln x}{x} = \lim_{x \to \infty} \frac{\frac{d}{dx}(\ln x)}{\frac{d}{dx}(x)} = \lim_{x \to \infty} \frac{1/x}{1} $$
    explanation: 'Solution:


      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.'
  - id: step-lhopitals-3
    title: Evaluate the new limit
    type: freeResponse
    skills:
    - sequences
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $$ \lim_{x \to \infty} \frac{1}{x} = 0 $$

      Since the continuous function goes to 0, the sequence also goes to 0.
      The sequence converges to 0.
    explanation: 'Solution:


      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.'
  check:
    id: lhopitals-check
    type: multipleChoice
    skills:
    - sequences
    prompt: |-
      What does the result $a_n \to 0$ tell us about the growth rates of $\ln n$ versus $n$?
    choices:
    - id: a
      text: |-
        The denominator $n$ grows much faster than the numerator $\ln n$.
    - id: b
      text: |-
        The numerator $\ln n$ grows much faster than the denominator $n$.
    - id: c
      text: They grow at the same rate.
    answer:
      choiceId: a
    explanation: |
      When a fraction with $\infty/\infty$ goes to 0, it means the denominator overpowered the numerator. Linear functions grow faster than logarithmic functions.
- id: factorial-sequence
  title: Limits with Factorials
  problem: |
    Determine if $a_n = \frac{n!}{(n+2)!}$ converges or diverges.
  steps:
  - id: step-factorial-sequence-1
    title: Expand the factorials
    type: freeResponse
    skills:
    - sequences
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      Recall that $n! = n \cdot (n-1) \cdot (n-2) \dots 1$.
      And $(n+2)! = (n+2) \cdot (n+1) \cdot n \cdot (n-1) \dots 1$.

      We can rewrite the denominator as:
      $$ (n+2)! = (n+2)(n+1)n! $$
    explanation: 'Solution:


      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.'
  - id: step-factorial-sequence-2
    title: Cancel common terms
    type: freeResponse
    skills:
    - sequences
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      Substitute this into the sequence:
      $$ a_n = \frac{n!}{(n+2)(n+1)n!} $$

      The $n!$ cancels out entirely!
      $$ a_n = \frac{1}{(n+2)(n+1)} = \frac{1}{n^2 + 3n + 2} $$
    explanation: 'Solution:


      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.'
  - id: step-factorial-sequence-3
    title: Take the limit
    type: freeResponse
    skills:
    - sequences
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      Now, evaluate as $n \to \infty$:
      $$ \lim_{n \to \infty} \frac{1}{n^2 + 3n + 2} = 0 $$

      The sequence converges to 0.
    explanation: 'Solution:


      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.'
  check:
    id: factorial-sequence-check
    type: numericResponse
    skills:
    - sequences
    prompt: |-
      What does $a_n = \frac{(n+1)!}{n!}$ converge/diverge to as $n \to \infty$? (Enter 9999 for infinity).
    answer:
      value: 9999
      tolerance: 0.1
    explanation: |
      $(n+1)! / n! = (n+1)n! / n! = n+1$. As $n \to \infty$, $n+1 \to \infty$. It diverges.
