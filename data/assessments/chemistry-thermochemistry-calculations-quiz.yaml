questions:
  - id: q001
    type: numericResponse
    prompt: |
      How much heat, in J, is absorbed by 50.0 g of water as it warms from $20.0^\circ\text{C}$ to $30.0^\circ\text{C}$?

      Use $c=4.184\ \text{J/(g}\cdot{}^\circ\text{C)}$.
    answer:
      value: 2092
      tolerance: 3
    explanation: |
      $$q=mc\Delta T=(50.0)(4.184)(10.0)=+2092\ \text{J}$$
  - id: q002
    type: numericResponse
    prompt: |
      A 200.0 g sample with $c=0.900\ \text{J/(g}\cdot{}^\circ\text{C)}$ absorbs 540 J.
      What is its temperature change in $^\circ$C?
    answer:
      value: 3
      tolerance: 0.05
    explanation: |
      $$\Delta T=\frac{q}{mc}=\frac{540}{(200.0)(0.900)}=3.00^\circ\text{C}$$
  - id: q003
    type: numericResponse
    prompt: |
      A 100.0 g sample absorbs 4184 J and warms by $10.0^\circ\text{C}$.
      What is its specific heat in J/(g$\cdot{}^\circ$C)?
    answer:
      value: 4.184
      tolerance: 0.01
    explanation: |
      $$c=\frac{q}{m\Delta T}=\frac{4184}{(100.0)(10.0)}=4.184\ \text{J/(g}\cdot{}^\circ\text{C)}$$
  - id: q004
    type: numericResponse
    prompt: 'A metal block absorbs 2.40 kJ and warms by $15.0^\circ\text{C}$. What is its heat capacity in J/$^\circ$C?'
    answer:
      value: 160
      tolerance: 0.5
    explanation: 'Convert to 2400 J, then use $C=q/\Delta T=2400/15.0=160\ \text{J}/^\circ\text{C}$.'
  - id: q005
    type: multipleChoice
    prompt: 'A system has $q=-85\ \text{kJ}$. Which statement is correct?'
    choices:
      - id: a
        text: The system absorbed 85 kJ from the surroundings.
      - id: b
        text: The system released 85 kJ to the surroundings.
      - id: c
        text: The surroundings released 85 kJ to the system.
      - id: d
        text: No energy was transferred.
    answer:
      choiceId: b
    explanation: 'A negative value of $q$ for the system means heat leaves the system and enters the surroundings.'
  - id: q006
    type: multipleChoice
    prompt: 'Which statement best distinguishes heat capacity from specific heat capacity?'
    choices:
      - id: a
        text: Heat capacity is per gram; specific heat is for an entire object.
      - id: b
        text: Heat capacity applies only to gases.
      - id: c
        text: Specific heat is per unit mass; heat capacity is for the entire object.
      - id: d
        text: They always have identical numerical values.
    answer:
      choiceId: c
    explanation: 'Specific heat is per unit mass, while heat capacity depends on the amount of material in the object.'
  - id: q007
    type: numericResponse
    prompt: 'Combustion of 1.00 mol of methane has $\Delta H=-890\ \text{kJ/mol}$. What is $q_{\text{rxn}}$ in kJ when 0.250 mol burns?'
    answer:
      value: -222.5
      tolerance: 0.5
    explanation: '$q_{\text{rxn}}=(0.250\ \text{mol})(-890\ \text{kJ/mol})=-222.5\ \text{kJ}$.'
  - id: q008
    type: numericResponse
    prompt: |
      $$\text{N}_2(g)+3\text{H}_2(g)\rightarrow2\text{NH}_3(g)\qquad\Delta H=-92.4\ \text{kJ}$$

      How much heat, in kJ, is released when 6.00 mol of $\text{NH}_3$ forms?
    answer:
      value: -277.2
      tolerance: 0.5
    explanation: 'The equation produces 2 mol of ammonia per $-92.4$ kJ, so $6.00(-92.4/2)=-277.2\ \text{kJ}$.'
  - id: q009
    type: numericResponse
    prompt: 'A 45.0 g sample with $c=0.900\ \text{J/(g}\cdot{}^\circ\text{C)}$ cools from $80.0^\circ\text{C}$ to $60.0^\circ\text{C}$. What is $q$ in J?'
    answer:
      value: -810
      tolerance: 2
    explanation: '$q=(45.0)(0.900)(60.0-80.0)=-810\ \text{J}$.'
  - id: q010
    type: multipleChoice
    prompt: 'For an endothermic reaction at constant pressure, which statement is true?'
    choices:
      - id: a
        text: '$\Delta H$ is negative and heat flows to the surroundings.'
      - id: b
        text: '$\Delta H$ is positive and heat flows into the system.'
      - id: c
        text: '$\Delta H$ is zero and temperature must not change.'
      - id: d
        text: Products always have lower enthalpy than reactants.
    answer:
      choiceId: b
    explanation: 'Endothermic processes absorb heat, so their enthalpy changes are positive.'
  - id: q011
    type: numericResponse
    prompt: 'A container has heat capacity $125\ \text{J}/^\circ\text{C}$. If it absorbs 500 J, by how many $^\circ$C does its temperature rise?'
    answer:
      value: 4
      tolerance: 0.05
    explanation: '$\Delta T=q/C=500/125=4.00^\circ\text{C}$.'
  - id: q012
    type: numericResponse
    prompt: 'A 250.0 g sample of water cools by $5.00^\circ\text{C}$. How much heat in kJ does it release? Use $c=4.184\ \text{J/(g}\cdot{}^\circ\text{C)}$.'
    answer:
      value: -5.23
      tolerance: 0.03
    explanation: '$q=(250.0)(4.184)(-5.00)=-5230\ \text{J}=-5.23\ \text{kJ}$.'
