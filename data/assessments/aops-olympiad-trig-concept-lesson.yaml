sections:
- id: sec-1
  title: Complex Numbers and Euler's Formula
  content: Euler's formula provides a powerful link between trigonometry and algebra,
    allowing us to convert complicated trigonometric sums into geometric series.
  check:
    id: check-1
    type: multipleChoice
    prompt: What is e^{i\theta}?
    options:
    - id: a
      text: cos(\theta) + i*sin(\theta)
    - id: b
      text: sin(\theta) + i*cos(\theta)
    answer:
      choiceId: a
- id: sec-2
  title: Chebyshev Polynomials
  content: Chebyshev polynomials express cos(nx) as a polynomial in cos(x).
  check:
    id: check-2
    type: multipleChoice
    prompt: What is cos(2x) in terms of cos(x)?
    options:
    - id: a
      text: 2cos^2(x) - 1
    - id: b
      text: cos^2(x) - 2
    answer:
      choiceId: a
