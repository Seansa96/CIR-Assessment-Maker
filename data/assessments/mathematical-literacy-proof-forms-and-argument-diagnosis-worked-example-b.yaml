workedExamples:
- id: mathematical-literacy-proof-forms-and-argument-diagnosis-worked-example-b-example
  title: Diagnose a converse error
  problem: A student reads “If a number is divisible by 4, then it is even” and concludes “Every even number is
    divisible by 4.” Diagnose the argument.
  steps:
  - id: step-1
    title: Mark the original direction
    type: freeResponse
    prompt: What is the original hypothesis and conclusion?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Divisible by 4 is the hypothesis; even is the conclusion.
    explanation: |-
      Solution: Divisible by 4 is the hypothesis; even is the conclusion.
      Why it works: A conditional has a directed hypothesis-to-conclusion structure.
  - id: step-2
    title: Name the changed statement
    type: freeResponse
    prompt: What statement did the student make instead?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - 'The student stated the converse: if a number is even, then it is divisible by 4.'
    explanation: |-
      Solution: The student stated the converse: if a number is even, then it is divisible by 4.
      Why it works: Swapping the hypothesis and conclusion forms the converse.
  - id: step-3
    title: Test the converse
    type: freeResponse
    prompt: Give a counterexample to the converse.
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - 2 is even but is not divisible by 4.
    explanation: |-
      Solution: 2 is even but is not divisible by 4.
      Why it works: One allowed counterexample shows the reversed implication is false.
