lesson:
  introduction: Build a reliable model of lewis structures, molecular shape, and polarity review by separating electron accounting,
    particle representation, and observable evidence.
  sections:
  - id: electron-inventory
    title: Establish the complete electron inventory
    required: true
    content: Count all valence electrons and adjust for charge before drawing any bonds or assigning geometry.
    check:
      id: chk-electron-inventory
      type: multipleChoice
      prompt: Which statement correctly applies the idea of establish the complete electron inventory?
      choices:
      - id: a
        text: Acetate has one extra electron because of its 1- charge.
        issueSignals: []
      - id: b
        text: A negative ion has one fewer electron than its neutral atom total.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      - id: c
        text: The response uses a valid rule from a different stage of the analysis and therefore does not answer the stated
          question.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      answer:
        choiceId: a
      explanation: 'Solution: Acetate has one extra electron because of its 1- charge. Why it works: Count all valence electrons
        and adjust for charge before drawing any bonds or assigning geometry. Why the other choices fail: The other statements
        either reverse the relevant electron or charge accounting or apply a structural model outside its stated scope.'
    media:
    - type: image
      src: /media/chemistry/bonding-multicenter-review-map.svg
      alt: Instructional workflow for lewis structures, molecular shape, and polarity review showing the central particle-level
        decisions.
      caption: Use the representation to connect observable evidence with electron and particle accounting.
  - id: connectivity-charge
    title: Choose connectivity and check formal charge
    required: true
    content: A chemically defensible skeleton and formal-charge accounting must precede geometry analysis; geometry cannot
      repair a wrong electron count.
    check:
      id: chk-connectivity-charge
      type: multipleChoice
      prompt: Which statement correctly applies the idea of choose connectivity and check formal charge?
      choices:
      - id: a
        text: Formal charges must sum to the molecular or ionic charge.
        issueSignals: []
      - id: b
        text: Choose the structure with the most formal charges to make charge visible.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      - id: c
        text: The response uses a valid rule from a different stage of the analysis and therefore does not answer the stated
          question.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      answer:
        choiceId: a
      explanation: 'Solution: Formal charges must sum to the molecular or ionic charge. Why it works: A chemically defensible
        skeleton and formal-charge accounting must precede geometry analysis; geometry cannot repair a wrong electron count.
        Why the other choices fail: The other statements either reverse the relevant electron or charge accounting or apply
        a structural model outside its stated scope.'
  - id: resonance
    title: Separate resonance from isomerism
    required: true
    content: Resonance changes electron placement while preserving atom connectivity. Equivalent contributors imply delocalized
      charge and equivalent bonds.
    check:
      id: chk-resonance
      type: multipleChoice
      prompt: Which statement correctly applies the idea of separate resonance from isomerism?
      choices:
      - id: a
        text: Acetate resonance moves the C=O bond, not an oxygen atom.
        issueSignals: []
      - id: b
        text: Resonance contributors are different compounds rapidly interconverting.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      - id: c
        text: The response uses a valid rule from a different stage of the analysis and therefore does not answer the stated
          question.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      answer:
        choiceId: a
      explanation: 'Solution: Acetate resonance moves the C=O bond, not an oxygen atom. Why it works: Resonance changes electron
        placement while preserving atom connectivity. Equivalent contributors imply delocalized charge and equivalent bonds.
        Why the other choices fail: The other statements either reverse the relevant electron or charge accounting or apply
        a structural model outside its stated scope.'
  - id: local-centers
    title: Analyze one local center at a time
    required: true
    content: A multicenter molecule has separate electron-domain and molecular geometries at different atoms.
    check:
      id: chk-local-centers
      type: multipleChoice
      prompt: Which statement correctly applies the idea of analyze one local center at a time?
      choices:
      - id: a
        text: Acetic acid contains tetrahedral and trigonal-planar carbon centers.
        issueSignals: []
      - id: b
        text: Every atom in acetic acid shares one global VSEPR geometry.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      - id: c
        text: The response uses a valid rule from a different stage of the analysis and therefore does not answer the stated
          question.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      answer:
        choiceId: a
      explanation: 'Solution: Acetic acid contains tetrahedral and trigonal-planar carbon centers. Why it works: A multicenter
        molecule has separate electron-domain and molecular geometries at different atoms. Why the other choices fail: The
        other statements either reverse the relevant electron or charge accounting or apply a structural model outside its
        stated scope.'
  - id: vector-addition
    title: Build the molecular dipole
    required: true
    content: Orient bond dipoles using each local geometry, then add them across the complete molecule.
    check:
      id: chk-vector-addition
      type: multipleChoice
      prompt: Which statement correctly applies the idea of build the molecular dipole?
      choices:
      - id: a
        text: Asymmetric carbonyl and hydroxyl dipoles give acetic acid a nonzero net dipole.
        issueSignals: []
      - id: b
        text: Counting polar bonds without their directions determines the dipole exactly.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      - id: c
        text: The response uses a valid rule from a different stage of the analysis and therefore does not answer the stated
          question.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      answer:
        choiceId: a
      explanation: 'Solution: Asymmetric carbonyl and hydroxyl dipoles give acetic acid a nonzero net dipole. Why it works:
        Orient bond dipoles using each local geometry, then add them across the complete molecule. Why the other choices fail:
        The other statements either reverse the relevant electron or charge accounting or apply a structural model outside
        its stated scope.'
  - id: structure-property
    title: Connect structure to behavior
    required: true
    content: Use polarity and accessible interaction sites to support a property prediction while keeping intermolecular-force
      claims distinct from the intramolecular structure.
    check:
      id: chk-structure-property
      type: multipleChoice
      prompt: Which statement correctly applies the idea of connect structure to behavior?
      choices:
      - id: a
        text: A polar O-H region can support strong attraction to polar surroundings.
        issueSignals: []
      - id: b
        text: An O-H bond means the oxygen and hydrogen are separate ions in the molecule.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      - id: c
        text: The response uses a valid rule from a different stage of the analysis and therefore does not answer the stated
          question.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      answer:
        choiceId: a
      explanation: 'Solution: A polar O-H region can support strong attraction to polar surroundings. Why it works: Use polarity
        and accessible interaction sites to support a property prediction while keeping intermolecular-force claims distinct
        from the intramolecular structure. Why the other choices fail: The other statements either reverse the relevant electron
        or charge accounting or apply a structural model outside its stated scope.'
