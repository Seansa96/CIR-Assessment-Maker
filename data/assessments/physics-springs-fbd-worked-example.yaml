workedExamples:
  - id: we-fbd-hanging
    title: Hanging spring mass
    problem: 'A mass hangs at rest from a vertical spring. Identify its forces and write the equilibrium equation.'
    steps:
      - id: fbh-1
        title: Identify forces
        instruction: 'Include only forces exerted on the mass.'
        type: multipleChoice
        prompt: 'Which forces act on the mass?'
        choices: [{ id: a, text: 'Weight downward and spring force upward' }, { id: b, text: 'Weight downward and normal force upward' }]
        answer: { choiceId: a }
        explanation: 'Solution: Weight acts downward and the stretched spring pulls upward.\n\nWhy it works: There is no surface, so there is no normal force.\n\nWhy the other choices fail: A normal force requires contact with a solid surface.'
      - id: fbh-2
        title: Write force sum
        instruction: 'Take upward as positive and use static equilibrium.'
        type: symbolicResponse
        prompt: 'What is the value of $F_s-mg$?'
        answer: { gradingMode: auto, expectedLatex: '0', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $F_s-mg=0$.\n\nWhy it works: At rest, acceleration and hence net force are zero.'
  - id: we-fbd-horizontal
    title: Horizontal spring block
    problem: 'A block is attached to a compressed horizontal spring on a frictionless table immediately after release. Identify the horizontal force and its direction.'
    steps:
      - id: fbx-1
        title: Determine spring-force direction
        instruction: 'A compressed spring pushes to restore its natural length.'
        type: multipleChoice
        prompt: 'If the spring is compressed from the left, its force on the block points:'
        choices: [{ id: a, text: 'to the right' }, { id: b, text: 'to the left' }]
        answer: { choiceId: a }
        explanation: 'Solution: The spring pushes the block to the right.\n\nWhy it works: A restoring force points opposite the compression displacement.\n\nWhy the other choices fail: Leftward force would increase the compression.'
      - id: fbx-2
        title: Write Hooke''s law
        instruction: 'Let $x<0$ denote compression measured from equilibrium.'
        type: symbolicResponse
        prompt: 'Write the horizontal spring force $F_x$.'
        answer: { gradingMode: auto, expectedLatex: '-k x', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $F_x=-kx$.\n\nWhy it works: The minus sign makes the force point toward equilibrium for either sign of $x$.'
