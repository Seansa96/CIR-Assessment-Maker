workedExamples:
- id: we-fbd
  title: Drawing the Forces
  problem: |
    Let's break down the free-body diagram of a mass hanging from a spring in static equilibrium.

    ![Hanging Spring FBD](/C:/Users/SeanS/.gemini/antigravity-ide/brain/0c2da531-34dd-4854-a79c-4be0015d19b7/spring_mass_fbd_1782498992781.png)
  steps:
  - id: step-1
    title: Step 1 — Identifying Forces
    instruction: |
      Consider the mass $m$ hanging at rest. We must identify all forces acting *on the mass*.
    type: multipleChoice
    prompt: |
      Which forces act on the hanging mass?
    choices:
    - id: a
      text: Gravity downwards, normal force upwards
    - id: b
      text: Gravity downwards, spring force upwards
    - id: c
      text: Gravity downwards, tension upwards, spring force upwards
    answer:
      choiceId: b
    explanation: The earth pulls down (gravity) and the stretched spring pulls up (spring force). There is no string (so no tension) and no surface (so no normal force).
  - id: step-2
    title: Step 2 — Constructing the Equation
    instruction: |
      Since the system is in static equilibrium, the acceleration is zero.
    type: symbolicResponse
    prompt: |
      Using Newton's Second Law ($\sum F_y = ma_y$), write the equation for the vertical forces. Take upwards as positive. What does $F_s - mg$ equal?
    answer:
      gradingMode: auto
      expectedLatex: 0
      equivalenceMode: expression
      tolerance: 0
    explanation: Because it is not accelerating, the net force is zero. Thus $F_s - mg = 0$, meaning the spring force perfectly balances gravity ($F_s = mg$).
