schemaVersion: 1
id: calc2-improper-integrals-types-recall
title: Improper Integral Recall Drill
assessmentType: recallDrill
categoryId: calculus-2
topicId: improper-integrals
modeDefault: practice
randomizeQuestions: true
skills: [improper-integral-limits, p-test, comparison-test]
navigation: { learningGoal: recall, activityType: mixedRecallSet, tags: [calculus-2, improper-integrals, recall] }
authoring: { visualRequirement: required, visualRationale: The limit map tests recognition of tail, endpoint, and interior defects. }
items:
- { id: tail-definition, type: typed, prompt: 'State the limit definition of $\int_a^\infty f(x)\,dx$.', answer: { expected: 'lim t to infinity integral a to t f(x) dx', aliases: ['lim_{t to infinity} integral_a^t f(x) dx', 'limit of integral from a to t as t goes to infinity'] }, explanation: 'Truncate the tail at t, then send t to infinity.', tags: [tail, definition] }
- { id: endpoint-direction, type: cloze, prompt: 'For a singularity at the left endpoint $a$, the cutoff approaches $a$ from the ____ .', answer: { expected: right, aliases: ['right side', 'inside', 'positive side'] }, explanation: 'The interval supplies points only to the right of its left endpoint.', tags: [endpoint] }
- { id: interior-rule, type: typed, prompt: 'What must you do before evaluating an integral with a vertical asymptote at an interior point c?', answer: { expected: 'split it into two one-sided improper integrals', aliases: ['split at c and use two limits', 'split the integral'] }, explanation: 'Each side must converge independently.', tags: [interior, setup] }
- { id: tail-p, type: cloze, prompt: 'At infinity, $\int_1^\infty x^{-p}\,dx$ converges for $p ____ 1$.', answer: { expected: '>', aliases: ['greater than', 'greater than 1'] }, explanation: 'A tail needs decay faster than 1/x.', tags: [p-test, tail] }
- { id: endpoint-p, type: cloze, prompt: 'Near zero, $\int_0^1x^{-p}\,dx$ converges for $p ____ 1$.', answer: { expected: '<', aliases: ['less than', 'less than 1'] }, explanation: 'The finite-endpoint threshold reverses.', tags: [p-test, endpoint] }
- { id: p-boundary, type: typed, prompt: 'Classify both p-test integrals when p equals 1.', answer: { expected: 'both diverge', aliases: ['diverge', 'they both diverge'] }, explanation: 'The logarithmic antiderivative is unbounded at either defective boundary.', tags: [p-test, boundary] }
- { id: positive-comparison, type: cloze, prompt: 'For nonnegative integrands, being smaller than a convergent benchmark proves ____ .', answer: { expected: convergence, aliases: ['the integral converges', 'convergent'] }, explanation: 'Direct comparison bounds the unknown finite area above.', tags: [comparison] }
- { id: divergence-comparison, type: cloze, prompt: 'For nonnegative integrands, being larger than a divergent benchmark proves ____ .', answer: { expected: divergence, aliases: ['the integral diverges', 'divergent'] }, explanation: 'The unknown area is at least as large as an infinite area.', tags: [comparison] }
- id: defect-map
  type: recognition
  prompt: 'An interval is finite, but its integrand has a vertical asymptote in the middle. Which setup is required?'
  choices: [{ id: a, text: Two one-sided limits after splitting at the asymptote }, { id: b, text: One limit at infinity }, { id: c, text: Substitute the asymptote into an antiderivative }, { id: d, text: Use symmetry to cancel the infinities }]
  answer: { choiceId: a, expected: Two one-sided limits after splitting at the asymptote }
  explanation: 'Interior singularities create two independent improper integrals.'
  tags: [interior, recognition]
