workedExamples:
- id: basic-shells
  title: Shell Method around the y-axis
  problem: 'Find the volume of the solid generated by revolving the region bounded
    by $y = 2x^2 - x^3$ and $y = 0$ around the y-axis.

    '
  steps:
  - id: step-basic-shells-1
    title: Find the bounds of the region
    type: freeResponse
    skills:
    - cylindrical-shells
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Set $y = 0$ to find where the curve intersects the x-axis.


      $$

      2x^2 - x^3 = 0 \implies x^2(2 - x) = 0

      $$


      The region is bounded between $x = 0$ and $x = 2$.

      '
  - id: step-basic-shells-2
    title: Why use shells?
    type: freeResponse
    skills:
    - cylindrical-shells
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'If we revolve around the y-axis, the Washer method would require
      solving $y = 2x^2 - x^3$ for $x$. This is very difficult!

      Instead, we use vertical slices ($dx$), which are parallel to the y-axis, meaning
      we must use the Shell method.

      '
  - id: step-basic-shells-3
    title: Set up and evaluate the integral
    type: freeResponse
    skills:
    - cylindrical-shells
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Radius $r = x$.

      Height $h = 2x^2 - x^3$.


      $$

      V = 2\pi \int_0^2 x (2x^2 - x^3)\,dx = 2\pi \int_0^2 (2x^3 - x^4)\,dx

      $$


      Evaluate:


      $$

      2\pi \left[ \frac{2x^4}{4} - \frac{x^5}{5} \right]_0^2 = 2\pi \left( \frac{32}{4}
      - \frac{32}{5} \right) = 2\pi \left( 8 - 6.4 \right) = 2\pi (1.6) = 3.2\pi =
      \frac{16\pi}{5}

      $$

      '
  check:
    id: basic-shells-check
    type: numericResponse
    skills:
    - cylindrical-shells
    prompt: What is the decimal value of the volume? (Use $\pi \a\approx 3.14159$, 2
      decimal places)
    answer:
      value: 10.05
      tolerance: 0.1
    explanation: '$\frac{16(3.14159)}{5} \a\approx 10.053$.

      '
- id: shells-x-axis
  title: Shell Method around the x-axis
  problem: 'Find the volume of the solid generated by revolving the region bounded
    by $x = e^y$, $x = 0$, $y = 0$, and $y = 1$ around the x-axis.

    '
  steps:
  - id: step-shells-x-axis-1
    title: Setup\rhorizontal slices
    type: freeResponse
    skills:
    - cylindrical-shells
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Because the equation is given as $x = f(y)$, it''s natural to use
     \rhorizontal slices ($dy$).

      Revolving\rhorizontal slices around the x-axis (a\rhorizontal line) means the
      slices are parallel to the axis of revolution.

      Parallel slices = Shell method!

      '
  - id: step-shells-x-axis-2
    title: Identify radius and height
    type: freeResponse
    skills:
    - cylindrical-shells
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Since we are using $dy$ and revolving around the x-axis:

      Radius $r = y$.

      Height $h$ is the\rhorizontal distance from the y-axis to the curve: $h = e^y$.


      $$

      V = 2\pi \int_0^1 y e^y\,dy

      $$

      '
  - id: step-shells-x-axis-3
    title: Evaluate using Integration by Parts
    type: freeResponse
    skills:
    - cylindrical-shells
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'To evaluate $\int y e^y\,dy$, use integration by parts:

      Let $u = y$, $dv = e^y dy$.

      Then $du = dy$, $v = e^y$.


      $$

      \int y e^y\,dy = y e^y - \int e^y\,dy = y e^y - e^y = e^y(y - 1)

      $$


      Evaluate from 0 to 1:

      $$

      V = 2\pi \left[ e^y(y - 1) \right]_0^1 = 2\pi \left( (e^1(0)) - (e^0(-1)) \right)
      = 2\pi (0 - (-1)) = 2\pi

      $$

      '
  check:
    id: shells-x-axis-check
    type: multipleChoice
    skills:
    - cylindrical-shells
    prompt: If we had used vertical slices ($dx$) for this same problem, what method
      would we use and what would the height be?
    choices:
    - id: a
      text: Disk method. Height $y = \ln x$.
    - id: b
      text: Shell method. Height $y = \ln x$.
    - id: c
      text: Washer method. Outer radius $1$, inner radius $\ln x$.
    - id: d
      text: We cannot use vertical slices.
    answer:
      choiceId: a
    explanation: 'If we use $dx$, revolving around the x-axis uses Disks. The curve
      $x=e^y$ becomes $y=\ln x$. But note that on $x \in (0, 1)$, $y$ goes from $-\infty$
      to $0$, which makes it an improper integral and very messy. Shells with $dy$
      is much cleaner!

      '

