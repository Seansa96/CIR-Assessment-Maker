questions:
  - id: q001
    type: multipleChoice
    prompt: |
      **Angular Position and Displacement**

      In linear kinematics, we describe position using $x$ (meters). For an object rotating around a fixed axis, we use **angular position** $\theta$, measured in **radians**.

      To convert from degrees to radians, remember that one full circle ($360^\circ$) is $2\pi$ radians.

      Angular displacement is the change in angular position: $\Delta\theta = \theta_f - \theta_i$. 

      A wheel rotates $1.5$ full revolutions clockwise. What is its angular displacement? (Convention: counterclockwise is positive).
    choices:
      - id: c1
        text: '$+3\pi\ \text{rad}$'
      - id: c2
        text: '$-3\pi\ \text{rad}$'
      - id: c3
        text: '$+1.5\pi\ \text{rad}$'
      - id: c4
        text: '$-1.5\pi\ \text{rad}$'
    answer:
      choiceId: c2
      gradingMode: auto
    explanation: |
      One revolution is $2\pi$ radians. $1.5$ revolutions is $1.5 \times 2\pi = 3\pi$ radians. Since it rotates clockwise, the displacement is negative, so $\Delta\theta = -3\pi\ \text{rad}$.

  - id: q002
    type: multipleChoice
    prompt: |
      **Angular Velocity**

      Average angular velocity $\omega$ (omega) is the rate of change of angular position:

      $$
      \omega = \frac{\Delta \theta}{\Delta t}
      $$
      
      Instantaneous angular velocity is the derivative: $\omega = \frac{d\theta}{dt}$. The units are $\text{rad/s}$.

      If a ceiling fan spins at $120\ \text{revolutions per minute (rpm)}$, what is its angular velocity in $\text{rad/s}$?
    choices:
      - id: c1
        text: '$2\pi\ \text{rad/s}$'
      - id: c2
        text: '$4\pi\ \text{rad/s}$'
      - id: c3
        text: '$120\pi\ \text{rad/s}$'
      - id: c4
        text: '$120\ \text{rad/s}$'
    answer:
      choiceId: c2
      gradingMode: auto
    explanation: |
      First, convert revolutions to radians: $120\ \text{rev} = 120 \times 2\pi = 240\pi\ \text{rad}$.
      Next, convert minutes to seconds: $1\ \text{minute} = 60\ \text{s}$.
      $\omega = \frac{240\pi\ \text{rad}}{60\ \text{s}} = 4\pi\ \text{rad/s}$.

  - id: q003
    type: multipleChoice
    prompt: |
      **Angular Acceleration**

      Angular acceleration $\alpha$ (alpha) is the rate of change of angular velocity:

      $$
      \alpha = \frac{\Delta \omega}{\Delta t} = \frac{d\omega}{dt}
      $$
      
      The units are $\text{rad/s}^2$. 
      
      If a centrifuge accelerates from rest to $100\ \text{rad/s}$ in $10\ \text{s}$ at a constant rate, what is its angular acceleration?
    choices:
      - id: c1
        text: '$10\ \text{rad/s}^2$'
      - id: c2
        text: '$100\ \text{rad/s}^2$'
      - id: c3
        text: '$50\ \text{rad/s}^2$'
      - id: c4
        text: '$1000\ \text{rad/s}^2$'
    answer:
      choiceId: c1
      gradingMode: auto
    explanation: |
      $\alpha = \frac{\omega_f - \omega_i}{\Delta t} = \frac{100 - 0}{10} = 10\ \text{rad/s}^2$.

  - id: q004
    type: multipleChoice
    prompt: |
      **Rotational Kinematic Equations**

      Because the relationships between $(\theta, \omega, \alpha)$ are mathematically identical to the relationships between $(x, v, a)$, the linear kinematic equations for constant acceleration translate perfectly into rotational equivalents!

      | Linear (constant $a$) | Rotational (constant $\alpha$) |
      |---|---|
      | $v = v_0 + at$ | $\omega = \omega_0 + \alpha t$ |
      | $\Delta x = v_0 t + \frac{1}{2}at^2$ | $\Delta \theta = \omega_0 t + \frac{1}{2}\alpha t^2$ |
      | $v^2 = v_0^2 + 2a\Delta x$ | $\omega^2 = \omega_0^2 + 2\alpha\Delta\theta$ |

      A grinding wheel starting from rest is given a constant angular acceleration of $2.0\ \text{rad/s}^2$. Through what angle does it turn in $5.0\ \text{s}$?
    choices:
      - id: c1
        text: '$5.0\ \text{rad}$'
      - id: c2
        text: '$10.0\ \text{rad}$'
      - id: c3
        text: '$25.0\ \text{rad}$'
      - id: c4
        text: '$50.0\ \text{rad}$'
    answer:
      choiceId: c3
      gradingMode: auto
    explanation: |
      Use the angular equivalent of $\Delta x = v_0 t + \frac{1}{2}at^2$:
      $\Delta \theta = \omega_0 t + \frac{1}{2}\alpha t^2$
      $\Delta \theta = (0)(5.0) + \frac{1}{2}(2.0)(5.0)^2$
      $\Delta \theta = 0 + (1.0)(25) = 25.0\ \text{rad}$.


