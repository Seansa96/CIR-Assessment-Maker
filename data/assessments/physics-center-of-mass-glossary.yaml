glossary:
  introduction: These terms connect a system boundary to the mass-weighted position and motion of its center of mass.
  sections:
  - id: center-of-mass-terms
    title: Center-of-mass terms and relations
    required: true
    content: Keep masses, coordinates, and force classifications explicit before substituting numerical values.
    entries:
    - id: center-of-mass
      term: Center of mass
      definition: The mass-weighted average position of all particles in a chosen system.
      notation: $\vec r_{\mathrm{com}}=\sum_i m_i\vec r_i/M$
      examples:
      - A uniform ring has its center of mass at its geometric center.
      aliases:
      - COM
      media: []
      tags:
      - weighted-average
      drills:
      - id: center-of-mass-cloze
        type: cloze
        prompt: The center of mass is a mass-____ average of position.
        answer:
          expected: weighted
          expectedLatex: ''
          aliases: []
          media: []
          choiceId: 
        explanation: 'Solution: The missing word is "weighted."\n\nWhy it works: Each position contributes in proportion to its mass.'
        tags:
        - weighted-average
        skills: []
        choices: []
    - id: total-mass
      term: Total mass
      definition: The sum of every particle mass included in the chosen system.
      notation: $M=\sum_i m_i$
      examples:
      - A 2 kg cart and 4 kg cart have total mass 6 kg.
      aliases:
      - system mass
      media: []
      tags:
      - system
      drills:
      - id: total-mass-cloze
        type: cloze
        prompt: In $\vec r_{\mathrm{com}}=\sum_i m_i\vec r_i/M$, $M$ is the ____ mass.
        answer:
          expected: total
          expectedLatex: ''
          aliases:
          - system
          media: []
          choiceId: 
        explanation: 'Solution: $M$ is the total mass.\n\nWhy it works: The denominator must include every mass that appears in the selected system.'
        tags:
        - system
        skills: []
        choices: []
    - id: internal-force
      term: Internal force
      definition: A force exerted by one part of a chosen system on another part of the same system.
      notation: $\sum\vec F_{\mathrm{internal}}=\vec0$ for the whole system
      examples:
      - The contact force between two carts is internal if both carts are in the system.
      aliases: []
      media: []
      tags:
      - system-boundary
      drills:
      - id: internal-force-cloze
        type: cloze
        prompt: A force between two objects both included in the system is ____.
        answer:
          expected: internal
          expectedLatex: ''
          aliases: []
          media: []
          choiceId: 
        explanation: 'Solution: It is internal.\n\nWhy it works: Both the source and recipient of the force lie inside the chosen system boundary.'
        tags:
        - system-boundary
        skills: []
        choices: []
    - id: external-force
      term: Net external force
      definition: The vector sum of forces on the system exerted by agents outside its boundary.
      notation: $\sum\vec F_{\mathrm{ext}}=M\vec a_{\mathrm{com}}$
      examples:
      - Gravity is external for a projectile-only system.
      aliases:
      - net force on system
      media: []
      tags:
      - center-of-mass-motion
      drills:
      - id: external-force-cloze
        type: cloze
        prompt: The acceleration of a system's center of mass is determined by the net ____ force.
        answer:
          expected: external
          expectedLatex: ''
          aliases: []
          media: []
          choiceId: 
        explanation: 'Solution: The missing word is "external."\n\nWhy it works: Internal force pairs cancel in the whole-system force sum.'
        tags:
        - center-of-mass-motion
        skills: []
        choices: []
