schemaVersion: 1
id: chem-lewis-dot-structures-recall
title: Lewis Dot Structures Recall Drill
assessmentType: recallDrill
categoryId: chemistry
subcategoryIds:
  - chem-lewis-dot-structures
skills:
  - chem-lewis-dot-structures
  - chem-lewis-symbols
modeDefault: practice
items:
  - id: item-001
    type: flashcard
    prompt: What are the five steps for drawing a Lewis structure?
    answer:
      expected: |
      1. **Count total valence electrons** (add for anions; subtract for cations)
      2. **Choose the central atom** (least electronegative non-H atom)
      3. **Draw skeleton** with single bonds and subtract bonding electrons
      4. **Complete octets on terminal atoms** (except H: needs only 2)
      5. **Place remaining electrons on central atom; use multiple bonds** if central atom lacks an octet
  - id: item-002
    type: flashcard
    prompt: How do you adjust valence electron count for charged species?
    answer:
      expected: |
      - **Anion** (negative charge): **add** one electron per unit of negative charge
      - **Cation** (positive charge): **subtract** one electron per unit of positive charge

      Example: $SO_4^{2-}$ → $S(6) + 4O(24) + 2 = 32$ valence electrons.
  - id: item-003
    type: flashcard
    prompt: Which elements can never be the central atom in a Lewis structure?
    answer:
      expected: |
      **Hydrogen (H)** — can only form 1 bond (needs only 2 electrons).

      **Fluorine (F)** — most electronegative, always terminal; forms only 1 bond.

      (H and F are always terminal atoms in Lewis structures.)
  - id: item-004
    type: flashcard
    prompt: 'What is an incomplete octet? Give examples.'
    answer:
      expected: |
      An incomplete octet occurs when a central atom has **fewer than 8 valence electrons** in its Lewis structure.

      Main examples:
      - **Be** (typically 4 electrons, 2 bonds): $BeCl_2$
      - **B** and **Al** (typically 6 electrons, 3 bonds): $BF_3$, $AlCl_3$

      These atoms are Lewis acids (electron acceptors).
  - id: item-005
    type: flashcard
    prompt: 'What is an expanded octet? Which elements can have one?'
    answer:
      expected: |
      An expanded octet occurs when a central atom has **more than 8 valence electrons** — possible only for elements in **Period 3 or higher** (using available $d$ orbitals).

      Examples: $PCl_5$ (10 e⁻ on P); $SF_6$ (12 e⁻ on S); $XeF_4$ (12 e⁻ on Xe); $ClF_3$ (10 e⁻ on Cl).
  - id: item-006
    type: flashcard
    prompt: 'What is a radical?'
    answer:
      expected: |
      A molecule or ion with an **odd number of valence electrons**, resulting in at least one **unpaired electron**. The unpaired electron cannot be accommodated in a standard Lewis structure with all electrons paired.

      Examples: $NO$ (11 e⁻), $NO_2$ (17 e⁻), $ClO_2$ (19 e⁻).

      Radicals are highly reactive because the unpaired electron seeks to pair with electrons in other molecules.
  - id: item-007
    type: flashcard
    prompt: 'How many lone pairs are on N in NH₃?'
    answer:
      expected: |
      **1 lone pair** on nitrogen.

      $NH_3$: $N(5) + 3H(3) = 8$ valence e⁻. Three N—H bonds use 6 e⁻; remaining 2 e⁻ = 1 lone pair on N.
  - id: item-008
    type: flashcard
    prompt: 'How many lone pairs are on the central S in SF₄, and what is its geometry type?'
    answer:
      expected: |
      **1 lone pair** on S in $SF_4$.

      Total e⁻: 34. Four S—F bonds (8 e⁻) + each F with 3 lone pairs (24 e⁻) = 32 used. Remaining 2 e⁻ = 1 lone pair on S.

      AX₄E₁ → seesaw molecular geometry.
  - id: item-009
    type: flashcard
    prompt: 'How many valence electrons are in XeF₂, and how many lone pairs does Xe carry?'
    answer:
      expected: |
      Valence electrons: $Xe(8) + 2F(14) = 22$.

      Skeleton: 2 bonds (4 e⁻). Each F: 3 lone pairs (12 e⁻). Remaining: $22 - 4 - 12 = 6$ → **3 lone pairs on Xe**.

      AX₂E₃ → linear geometry.
  - id: item-010
    type: flashcard
    prompt: Why does step 5 of the Lewis structure procedure use lone pairs from adjacent atoms to form multiple bonds (rather than adding new electrons)?
    answer:
      expected: |
      Because the **total valence electron count is fixed**. You cannot add more electrons than the formula specifies. Converting a lone pair from a terminal atom into a bonding pair (double or triple bond) gives the central atom more electrons to count toward its octet without changing the total electron count.

