schemaVersion: 1
id: physics-static-kinetic-friction-concept-lesson
title: Static and Kinetic Friction Concept Lesson
assessmentType: conceptLesson
categoryId: physics-1
subcategoryIds:
  - physics-friction
modeDefault: practice
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags:
    - static-friction
    - kinetic-friction
    - force-models
lesson:
  introduction: |
    Friction opposes relative slipping at a contact. Static friction adjusts as needed up
    to a maximum, while kinetic friction models sliding contact. This lesson derives the
    common equations from the contact-force model and applies them to horizontal and
    inclined surfaces.
  sections:
    - id: contact-model
      title: Friction comes from contact
      required: true
      content: |
        Real surfaces touch at microscopic high points. Electromagnetic interactions and
        deformation at those contacts resist relative sliding. The normal force measures
        how strongly the surfaces press together, which is why friction scales with $N$.

        Friction acts parallel to the contact surface and opposes actual or impending
        relative slipping.
      media:
        - type: image
          src: /assessments/physics-dynamics/free-body-force-model.svg
          alt: Block free-body diagram with normal force, weight, applied force, and friction.
          caption: Friction is tangential to the surface; the normal force is perpendicular.
      check:
        id: contact-model-check
        type: multipleChoice
        prompt: Which direction does friction act?
        choices:
          - id: a
            text: Parallel to the contact surface, opposing relative slipping
          - id: b
            text: Always opposite the object's velocity
          - id: c
            text: Perpendicular to the contact surface
          - id: d
            text: Always in the negative coordinate direction
        answer:
          choiceId: a
        explanation: |
          Friction opposes relative slipping or the tendency to slip. Its direction is
          determined from the contact interaction, not from a memorized coordinate sign.

          Related topic: contact-force decomposition.

    - id: static-friction-response
      title: Static friction is not always $\mu_sN$
      required: true
      content: |
        While surfaces do not slip,

        $$
        0\le f_s\le f_{s,\max}.
        $$

        Static friction takes the value required by the other forces and constraints. If a
        horizontal push is $10\ \text{N}$ and the object remains at rest, then static
        friction is $10\ \text{N}$ in the opposite direction, provided the maximum has not
        been exceeded.
      check:
        id: static-friction-response-check
        type: multipleChoice
        prompt: A box remains at rest while pushed right with 8 N. What is the static-friction magnitude?
        choices:
          - id: a
            text: 8 N, if that is below the maximum static friction
          - id: b
            text: Always $\mu_sN$
          - id: c
            text: 0 N because the box is at rest
          - id: d
            text: Greater than the applied force
        answer:
          choiceId: a
        explanation: |
          Horizontal equilibrium requires $f_s=8\ \text{N}$. The coefficient determines
          whether that required value is available.

          Related topic: responsive static friction.

    - id: maximum-static-friction
      title: Derive the limiting static-friction equation
      required: true
      content: |
        Experiments show that the largest sustainable static friction is approximately
        proportional to the normal force:

        $$
        f_{s,\max}=\mu_sN.
        $$

        The dimensionless coefficient $\mu_s$ depends on the material pair and surface
        condition. Sliding begins when the friction required for equilibrium would exceed
        this limit.
      media:
        - type: image
          src: /assessments/physics-dynamics/static-kinetic-friction-curve.svg
          alt: Graph showing static friction increasing with applied force to a maximum and dropping to kinetic friction.
          caption: Static friction matches the applied demand until its maximum is reached.
      check:
        id: maximum-static-friction-check
        type: multipleChoice
        prompt: Which condition signals impending slip?
        choices:
          - id: a
            text: The required static friction reaches $\mu_sN$.
          - id: b
            text: Static friction becomes zero.
          - id: c
            text: The normal force becomes the object's mass.
          - id: d
            text: The applied force equals $\mu_kN$ in every case.
        answer:
          choiceId: a
        explanation: |
          At impending motion, static friction has reached its limiting magnitude.

          Related topic: threshold of motion.

    - id: kinetic-friction
      title: Model sliding friction
      required: true
      content: |
        Once the surfaces slide, the common introductory model is

        $$
        f_k=\mu_kN.
        $$

        Usually $\mu_k<\mu_s$, so the force needed to keep an object sliding is less than
        the maximum force needed to start it moving. In this model, $f_k$ is approximately
        independent of apparent contact area and speed over a limited range.
      check:
        id: kinetic-friction-check
        type: selectAll
        prompt: Which statements belong to the introductory kinetic-friction model?
        choices:
          - id: a
            text: '$f_k=\mu_kN$'
          - id: b
            text: Kinetic friction opposes relative sliding.
          - id: c
            text: Typically $\mu_k<\mu_s$.
          - id: d
            text: Kinetic friction adjusts from zero to any value needed for equilibrium.
        answer:
          choiceIds:
            - a
            - b
            - c
        explanation: |
          Adjustable friction describes the static regime. The kinetic model uses an
          approximately fixed magnitude for a given normal force.

          Related topic: static-to-kinetic transition.

    - id: horizontal-derivation
      title: Derive horizontal acceleration with kinetic friction
      required: true
      content: |
        For a horizontal pull with no vertical component,

        $$
        \sum F_y=N-mg=0\quad\Rightarrow\quad N=mg.
        $$

        Then

        $$
        f_k=\mu_kmg.
        $$

        If an applied force $F$ pulls horizontally,

        $$
        F-\mu_kmg=ma,
        $$

        so

        $$
        a=\frac{F}{m}-\mu_kg.
        $$
      check:
        id: horizontal-derivation-check
        type: symbolicResponse
        prompt: |
          A block slides on a horizontal surface under a horizontal applied force $F$.
          Enter the acceleration in terms of $F$, $m$, $\mu_k$, and $g$.
        answer:
          expectedLatex: '\frac{F}{m}-\mu_k g'
          equivalenceMode: expression
          variables:
            - F
            - m
            - mu_k
            - g
          tolerance: 0.000001
        explanation: |
          Use $N=mg$, then $f_k=\mu_kmg$, and solve
          $F-f_k=ma$ for $a$.

          Related topic: horizontal friction dynamics.

    - id: incline-derivation
      title: Derive friction on an incline
      required: true
      content: |
        For an incline angle $\theta$, resolve weight:

        $$
        mg\sin\theta
        $$

        parallel down the slope and

        $$
        mg\cos\theta
        $$

        perpendicular into the slope. With no perpendicular acceleration,

        $$
        N=mg\cos\theta.
        $$

        Thus the maximum static friction is

        $$
        f_{s,\max}=\mu_smg\cos\theta.
        $$

        The block can remain at rest if

        $$
        mg\sin\theta\le\mu_smg\cos\theta,
        $$

        which simplifies to

        $$
        \tan\theta\le\mu_s.
        $$
      check:
        id: incline-derivation-check
        type: multipleChoice
        prompt: At the angle where a block is just about to slide, which relation holds?
        choices:
          - id: a
            text: '$\tan\theta=\mu_s$'
          - id: b
            text: '$\sin\theta=\mu_k$'
          - id: c
            text: '$N=mg$'
          - id: d
            text: '$f_s=0$'
        answer:
          choiceId: a
        explanation: |
          At impending slip, $mg\sin\theta=\mu_smg\cos\theta$. Cancel $mg\cos\theta$
          to obtain $\tan\theta=\mu_s$.

          Related topic: angle of repose.

    - id: angled-applied-force
      title: Applied-force angle changes friction through $N$
      required: true
      content: |
        If a force pulls upward at angle $\phi$ while the object stays on a horizontal
        surface,

        $$
        N+F\sin\phi-mg=0,
        $$

        so

        $$
        N=mg-F\sin\phi.
        $$

        The upward component reduces $N$ and therefore reduces both $\mu_sN$ and $\mu_kN$.
        A downward-angled push does the opposite.
      check:
        id: angled-applied-force-check
        type: multipleChoice
        prompt: Why can pulling upward at an angle make a crate easier to slide?
        choices:
          - id: a
            text: It reduces the normal force and therefore the friction magnitude.
          - id: b
            text: It increases the coefficient of friction.
          - id: c
            text: It removes the crate's mass.
          - id: d
            text: Friction always points upward.
        answer:
          choiceId: a
        explanation: |
          The vertical pull supports part of the weight, reducing $N$. Since friction
          scales with $N$, less horizontal force is lost to friction.

          Related topic: coupled force components.

    - id: friction-synthesis
      title: Choose the correct friction equation
      required: true
      content: |
        Use this decision path:

        1. Determine whether the surfaces are slipping.
        2. If not slipping, solve for the required $f_s$ from Newton's laws.
        3. Check whether $|f_s|\le\mu_sN$.
        4. If sliding, use $f_k=\mu_kN$ with direction opposite relative sliding.
      check:
        id: friction-synthesis-check
        type: multipleChoice
        prompt: A force model requires 18 N of static friction, but $\mu_sN=14$ N. What happens?
        choices:
          - id: a
            text: Static equilibrium is impossible and the surfaces begin to slip.
          - id: b
            text: Static friction becomes 18 N anyway.
          - id: c
            text: Static friction remains zero.
          - id: d
            text: The normal force automatically becomes 18 N.
        answer:
          choiceId: a
        explanation: |
          The required friction exceeds the available maximum. The static model fails,
          motion begins, and the kinetic-friction model becomes appropriate.

          Related topic: friction-regime selection.
