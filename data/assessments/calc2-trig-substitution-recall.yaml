schemaVersion: 1
id: calc2-trig-substitution-recall
title: Trigonometric Substitution Pattern Recall
assessmentType: recallDrill
categoryId: calculus-2
subcategoryId: u-sub-integration
subcategoryIds:
  - integration-techniques
modeDefault: practice
randomizeQuestions: false
items:
  - id: trig-sub-a2-minus-x2
    type: symbolic
    prompt: |
      Recall the standard trig substitution for this radical pattern:

      $$
      \sqrt{a^2-x^2}
      $$
    answer:
      expectedLatex: 'x=a\sin\theta'
      aliases:
        - x = a sin theta
        - sine substitution
    explanation: |
      Use $x=a\sin\theta$ because the inside becomes

      $$
      a^2-a^2\sin^2\theta=a^2(1-\sin^2\theta)=a^2\cos^2\theta.
      $$

      The actionable lookup path is: review the identity $1-\sin^2\theta=\cos^2\theta$ and the derivative $dx=a\cos\theta\,d\theta$.
    tags:
      - trig-substitution
      - a2-minus-x2
      - sine-substitution

  - id: trig-sub-x2-plus-a2
    type: symbolic
    prompt: |
      Recall the standard trig substitution for this radical pattern:

      $$
      \sqrt{x^2+a^2}
      $$
    answer:
      expectedLatex: 'x=a\tan\theta'
      aliases:
        - x = a tan theta
        - tangent substitution
    explanation: |
      Use $x=a\tan\theta$ because the inside becomes

      $$
      a^2\tan^2\theta+a^2=a^2(\tan^2\theta+1)=a^2\sec^2\theta.
      $$

      The actionable lookup path is: review $1+\tan^2\theta=\sec^2\theta$ and $dx=a\sec^2\theta\,d\theta$.
    tags:
      - trig-substitution
      - x2-plus-a2
      - tangent-substitution

  - id: trig-sub-x2-minus-a2
    type: symbolic
    prompt: |
      Recall the standard trig substitution for this radical pattern:

      $$
      \sqrt{x^2-a^2}
      $$
    answer:
      expectedLatex: 'x=a\sec\theta'
      aliases:
        - x = a sec theta
        - secant substitution
    explanation: |
      Use $x=a\sec\theta$ because the inside becomes

      $$
      a^2\sec^2\theta-a^2=a^2(\sec^2\theta-1)=a^2\tan^2\theta.
      $$

      The actionable lookup path is: review $\sec^2\theta-1=\tan^2\theta$ and $dx=a\sec\theta\tan\theta\,d\theta$.
    tags:
      - trig-substitution
      - x2-minus-a2
      - secant-substitution

  - id: trig-sub-cloze-sine-identity
    type: cloze
    prompt: |
      Complete the identity that makes $x=a\sin\theta$ useful:

      $$
      1-\sin^2\theta = \_\_\_\_
      $$
    answer:
      expected: 'cos^2(theta)'
      aliases:
        - cos^2 theta
        - cosine squared
    explanation: |
      The missing expression is $\cos^2\theta$. This turns $a^2-x^2$ into a perfect square after substituting $x=a\sin\theta$.
    tags:
      - trig-substitution
      - pythagorean-identities

  - id: trig-sub-flashcard-back-substitution
    type: flashcard
    prompt: |
      After trig substitution, what is the final structural step before writing the answer in terms of the original variable?
    answer:
      expected: Build a right triangle or use the substitution equation to back-substitute trig functions into expressions involving the original variable.
    explanation: |
      Trig substitution temporarily changes variables. Before the final answer, convert expressions like $\sin\theta$, $\cos\theta$, $\tan\theta$, or $\sec\theta$ back into expressions involving $x$ and $a$.
    tags:
      - trig-substitution
      - back-substitution

  - id: trig-sub-cloze-sec-right-triangle
    type: cloze
    prompt: |
      If $x=a\sec\theta$, complete the back-substitution relationship:

      $$
      \sec\theta = \_\_\_\_
      $$
    answer:
      expected: x/a
      aliases:
        - x over a
        - x divided by a
    explanation: |
      From $x=a\sec\theta$, divide by $a$ to get $\sec\theta=\frac{x}{a}$. This means the right triangle can use hypotenuse $x$ and adjacent side $a$.
    tags:
      - trig-substitution
      - back-substitution
