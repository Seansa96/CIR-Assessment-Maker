questions:
- id: q001
  type: numericResponse
  prompt: A 0.50 kg mass is attached to a spring with $k=72$ N/m. What natural angular frequency in rad/s follows from $\omega_0=\sqrt{k/m}$?
  answer: { value: 12, tolerance: 0.1 }
  explanation: |
    Solution: $\omega_0=\sqrt{72/0.50}=\sqrt{144}=12$ rad/s.

    Why it works: The mass-spring natural frequency follows from the balance of inertia and restoring stiffness.
  difficultyDimensions: [modelOrDerivation, unitAnalysis, simplification]
  extensionObjectiveIds: [phys1-obj-forced-oscillations]
- id: q002
  type: multipleChoice
  prompt: A driver supplies a sinusoidal force at 5.0 Hz to an oscillator whose natural frequency is 5.0 Hz. What condition is being modeled?
  choices:
  - { id: a, text: Resonance }
  - { id: b, text: Critical damping }
  - { id: c, text: No driving force }
  - { id: d, text: Static equilibrium }
  answer: { choiceId: a }
  explanation: |
    Solution: Resonance.

    Why it works: Resonance occurs when the driving frequency matches the system's natural frequency.
    
    Why the other choices fail: Matching frequencies identify resonance; the other conditions do not follow from the given periodic driver and frequency match.
  difficultyDimensions: [modelComparison, qualitativeCheck, representationTransfer]
  extensionObjectiveIds: [phys1-obj-forced-oscillations]
- id: q003
  type: multipleChoice
  prompt: Two otherwise identical driven oscillators are driven at their natural frequency. One has stronger damping. Which response is expected?
  choices:
  - { id: a, text: The more strongly damped oscillator has a lower resonance amplitude. }
  - { id: b, text: The more strongly damped oscillator has an infinite amplitude. }
  - { id: c, text: Damping changes neither amplitude nor energy loss. }
  - { id: d, text: The more strongly damped oscillator must have a higher amplitude. }
  answer: { choiceId: a }
  explanation: |
    Solution: The more strongly damped oscillator has a lower resonance amplitude.

    Why it works: Damping removes mechanical energy, limiting the amplitude that a periodic driver can sustain.

    Why the other choices fail: Damping prevents rather than causes divergence, and it affects both energy loss and amplitude response.
  difficultyDimensions: [modelComparison, errorDiagnosis, causalReasoning]
  extensionObjectiveIds: [phys1-obj-forced-oscillations]
- id: q004
  type: numericResponse
  prompt: A driven oscillator is observed to have its largest steady-state amplitude at 8.0 rad/s. What natural angular frequency in rad/s is inferred when damping is light?
  answer: { value: 8, tolerance: 0.2 }
  explanation: |
    Solution: The inferred natural frequency is approximately 8.0 rad/s.

    Why it works: With light damping, the resonance peak lies near the natural frequency, so a response observation can be used to infer a system property.
  difficultyDimensions: [reverseReasoning, domainCondition, representationTransfer]
  extensionObjectiveIds: [phys1-obj-forced-oscillations]
- id: q005
  type: multipleChoice
  prompt: A driver transfers energy to an oscillator on every cycle. Before steady state is reached, why can the amplitude grow?
  choices:
  - { id: a, text: The driver's energy input exceeds the energy lost to damping. }
  - { id: b, text: The restoring force has disappeared. }
  - { id: c, text: The oscillator no longer has inertia. }
  - { id: d, text: The driving force must be constant rather than periodic. }
  answer: { choiceId: a }
  explanation: |
    Solution: The driver's energy input exceeds the energy lost to damping.

    Why it works: Net positive energy transfer raises the oscillator's stored energy and therefore its amplitude.

    Why the other choices fail: Restoring force and inertia remain present, and periodic driving is precisely what defines forced oscillation.
  difficultyDimensions: [causalReasoning, energyTransfer, errorDiagnosis]
  extensionObjectiveIds: [phys1-obj-forced-oscillations]
- id: q006
  type: symbolicResponse
  prompt: Starting from $\omega_0=\sqrt{k/m}$, enter the spring constant $k$ in terms of mass $m$ and natural angular frequency $\omega_0$.
  answer: { expectedLatex: 'm*omega_0^2', equivalenceMode: expression, variables: [m, omega_0], tolerance: 0.000001 }
  explanation: |
    Solution: Square both sides to get $\omega_0^2=k/m$, then multiply by $m$: $k=m\omega_0^2$.

    Why it works: Algebraic inversion of the natural-frequency model isolates the spring stiffness.
  difficultyDimensions: [symbolicManipulation, reverseReasoning, modelOrDerivation]
  extensionObjectiveIds: [phys1-obj-forced-oscillations]
