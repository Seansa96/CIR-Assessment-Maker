questions:
- id: q001
  type: multipleChoice
  prompt: 'A particle moves such that its position is $x(t) = 2t^3 - 9t^2 + 12t$.
    At what time(s) is the particle momentarily at rest?

    '
  choices:
  - id: a
    text: $t = 1$ s and $t = 2$ s
  - id: b
    text: $t = 0$ s and $t = 3$ s
  - id: c
    text: $t = 1.5$ s only
  - id: d
    text: $t = 2$ s and $t = 4$ s
  answer:
    choiceId: a
  explanation: 'The particle is at rest when $v(t) = 0$. $v(t) = \frac{dx}{dt} = 6t^2
    - 18t + 12 = 6(t^2 - 3t + 2) = 6(t-1)(t-2)$. Setting this to zero gives $t = 1$
    and $t = 2$.

    '
- id: q002
  type: multipleChoice
  prompt: 'The acceleration of a particle is given by $a(t) = 6t - 4$. If its initial
    velocity is $v(0) = -3$ m/s, what is its velocity at $t = 2$ s?

    '
  choices:
  - id: a
    text: 1 m/s
  - id: b
    text: 5 m/s
  - id: c
    text: -1 m/s
  - id: d
    text: 9 m/s
  answer:
    choiceId: a
  explanation: '$v(t) = \int (6t - 4) dt = 3t^2 - 4t + C$. Using $v(0) = -3$, we get
    $C = -3$. So $v(t) = 3t^2 - 4t - 3$. At $t=2$, $v(2) = 3(4) - 4(2) - 3 = 12 -
    8 - 3 = 1$ m/s.

    '
- id: q003
  type: multipleChoice
  prompt: 'A ball is thrown with an initial velocity $\vec{v}_0 = 30\hat{i} + 40\hat{j}$
    m/s. Taking $g = 10$ m/s², what is the speed of the ball at the highest point
    of its trajectory?

    '
  choices:
  - id: a
    text: 0 m/s
  - id: b
    text: 30 m/s
  - id: c
    text: 40 m/s
  - id: d
    text: 50 m/s
  answer:
    choiceId: b
  explanation: 'At the highest point, the vertical component of velocity $v_y = 0$.
    The\rhorizontal component remains constant (assuming no air resistance), so $v_x
    = 30$ m/s. Thus, the speed is 30 m/s.

    '
- id: q004
  type: multipleChoice
  prompt: 'A particle moves in a circle of radius 2.0 m. Its speed is given by $v(t)
    = 3t$. What is the magnitude of its total acceleration at $t = 2.0$ s?

    '
  choices:
  - id: a
    text: 18 m/s²
  - id: b
    text: 3 m/s²
  - id: c
    text: 18.2 m/s²
  - id: d
    text: 21 m/s²
  answer:
    choiceId: c
  explanation: 'Tangential acceleration $a_t = \frac{dv}{dt} = 3$ m/s². At $t=2$,
    speed $v = 3(2) = 6$ m/s. Radial acceleration $a_r = \frac{v^2}{r} = \frac{6^2}{2.0}
    = 18$ m/s². Total acceleration $a = \sqrt{a_t^2 + a_r^2} = \sqrt{3^2 + 18^2} =
    \sqrt{9 + 324} = \sqrt{333} \a\approx 18.2$ m/s².

    '
- id: q005
  type: freeResponse
  prompt: 'If the area under a velocity-time graph from $t=0$ to $t=5$ is 25 meters,
    what does this value represent physically?

    '
  answer:
    expected: 'The displacement of the object over the 5 second interval.

      '
    gradingMode: selfCheck
  explanation: 'The integral (area under the curve) of velocity with respect to time
    gives the change in position, or displacement ($\Delta x = \int v dt$).

    '
