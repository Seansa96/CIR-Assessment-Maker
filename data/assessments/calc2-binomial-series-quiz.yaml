- id: q002
  type: multipleChoice
  prompt: Which series represents $1/(2+x)$ near $x=0$?
  choices:
  - id: a
    text: $\frac12\left(1-\frac{x}{2}+\frac{x^2}{4}-\cdots\right)$ for $|x|<2$
    media: []
    issueSignals: []
  - id: b
    text: $1-x+x^2-\cdots$ for $|x|<1$
    media: []
    issueSignals:
    - id: function-composition-error
      domains: []
  - id: c
    text: $\frac12\left(1+\frac{x}{2}+\frac{x^2}{4}+\cdots\right)$ for $|x|<2$
    media: []
