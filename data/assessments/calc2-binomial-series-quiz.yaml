  explanation: >
    Solution: Factor $2+x=2(1+x/2)$ and use $(1+u)^{-1}=1-u+u^2-\cdots$ with $u=x/2$.


    Why it works: The substituted input must satisfy $|x/2|<1$.


    Why the other choices fail: They omit the factor, use the wrong sign, or fail to scale every power.
