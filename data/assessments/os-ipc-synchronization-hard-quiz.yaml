questions:
- id: q001
  title: Apply Race conditions
  type: multipleChoice
  prompt: A system design discussion mentions **Race conditions**. Which conclusion is most defensible?
  choices:
  - id: a
    text: The bug is the uncontrolled interleaving.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: The bug is the uncontrolled interleaving. This is why Race conditions matters in IPC and Synchronization.
