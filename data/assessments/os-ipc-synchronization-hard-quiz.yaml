- id: q005
  title: Apply Message passing
  type: multipleChoice
  prompt: A system design discussion mentions **Message passing**. Which conclusion is most defensible?
  choices:
  - id: a
    text: Message passing avoids shared memory races but can still deadlock or block.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: Message passing avoids shared memory races but can still deadlock or block. This is why Message passing matters in IPC and Synchronization.
- id: q006
  title: Select Valid OS Reasoning
  type: selectAll
  prompt: Which reasoning habits are valid when analyzing IPC and Synchronization?
  choices:
  - id: a
    text: Name the protected resource or shared state.
  - id: b
    text: Separate mechanism from policy when possible.
  - id: c
    text: Check blocking, failure, permission, or boundary cases.
  - id: d
    text: Assume faster hardware removes all OS design tradeoffs.
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: OS design questions usually involve resources, mechanisms, policies, and boundary cases.
- id: q007
  title: Scenario Explanation
  type: freeResponse
  prompt: 'Explain how you would analyze this scenario: Two worker threads update a shared queue while a consumer waits for items. Identify the race, choose a synchronization primitive, and explain the waiting condition.'
  answer:
    expected: A strong answer identifies the OS-managed resource, names the relevant IPC and Synchronization mechanism, describes the tradeoff, and checks a boundary or failure case.
    gradingMode: selfCheck
    keyPoints:
    - Identifies resource
    - Names mechanism
    - Mentions tradeoff
    - Checks boundary or failure case
  explanation: 'Related topic: IPC and Synchronization.'
- id: q008
  title: 'Misconception: Race conditions'
  type: multipleChoice
  prompt: Which misconception is most dangerous when reasoning about **Race conditions**?
  choices:
  - id: a
    text: Treating the concept as a label instead of an OS mechanism with costs and boundaries.
  - id: b
    text: Asking what resource is controlled.
  - id: c
    text: Checking whether the mechanism can fail or block.
  - id: d
    text: Separating user-visible behavior from kernel-mediated work.
  answer:
    choiceId: a
  explanation: The correct reasoning must connect Race conditions to mechanism and tradeoff.
