lesson:
  introduction: >-
    Orthogonality generalizes the notion of perpendicularity to higher
    dimensions. When vectors are orthogonal, their geometric relationship
    simplifies many computations enormously — from projections and
    decompositions to solving least-squares problems. In this lesson, we
    introduce the dot product, orthogonal complements, and orthogonal
    projections.
  sections:
    - id: dot-product-orthogonality
      title: The Dot Product and Orthogonality
      content: |
        The **dot product** (or inner product) of two vectors in $\mathbb{R}^n$ is:
        $$\vec{u} \cdot \vec{v} = u_1 v_1 + u_2 v_2 + \dots + u_n v_n = \vec{u}^T \vec{v}$$

        Key properties:
        - $\vec{u} \cdot \vec{u} = \|\vec{u}\|^2$ (the square of the vector's length)
        - $\|\vec{u}\| = \sqrt{\vec{u} \cdot \vec{u}}$ (**Euclidean norm**)
        - $\vec{u} \cdot \vec{v} = \|\vec{u}\|\|\vec{v}\|\cos\theta$ where $\theta$ is the angle between them

        Two vectors are **orthogonal** if $\vec{u} \cdot \vec{v} = 0$.

        A set of vectors $\{\vec{u}_1, \dots, \vec{u}_p\}$ is an **orthogonal set** if every pair is orthogonal: $\vec{u}_i \cdot \vec{u}_j = 0$ for all $i \neq j$.

        An **orthonormal set** additionally requires each vector to be a unit vector ($\|\vec{u}_i\| = 1$).
      check:
        id: check-orthogonal
        type: multipleChoice
        prompt: |
          Which of the following pairs of vectors is orthogonal?
        choices:
          - id: c1
            text: '$\vec{u} = \begin{bmatrix}1\\2\\3\end{bmatrix}$, $\vec{v} = \begin{bmatrix}2\\1\\0\end{bmatrix}$'
          - id: c2
            text: '$\vec{u} = \begin{bmatrix}1\\2\\3\end{bmatrix}$, $\vec{v} = \begin{bmatrix}-1\\2\\-1\end{bmatrix}$'
          - id: c3
            text: '$\vec{u} = \begin{bmatrix}3\\1\\-2\end{bmatrix}$, $\vec{v} = \begin{bmatrix}1\\1\\1\end{bmatrix}$'
          - id: c4
            text: '$\vec{u} = \begin{bmatrix}2\\-1\\3\end{bmatrix}$, $\vec{v} = \begin{bmatrix}1\\4\\1\end{bmatrix}$'
        answer:
          choiceId: c2
        explanation: |
          Check $\vec{u}\cdot\vec{v}$ for each option:
          - A: $(1)(2)+(2)(1)+(3)(0) = 2+2+0 = 4 \neq 0$.
          - **B**: $(1)(-1)+(2)(2)+(3)(-1) = -1+4-3 = 0$. ✓ Orthogonal!
          - C: $(3)(1)+(1)(1)+(-2)(1) = 3+1-2 = 2 \neq 0$.
          - D: $(2)(1)+(-1)(4)+(3)(1) = 2-4+3 = 1 \neq 0$.

    - id: orthogonal-complement
      title: Orthogonal Complement
      content: |
        The **orthogonal complement** of a subspace $W$ in $\mathbb{R}^n$, denoted $W^\perp$ (read "$W$ perp"), is the set of all vectors orthogonal to every vector in $W$:
        $$W^\perp = \{ \vec{v} \in \mathbb{R}^n : \vec{v} \cdot \vec{w} = 0 \text{ for all } \vec{w} \in W \}$$

        Key properties:
        - $W^\perp$ is itself a subspace of $\mathbb{R}^n$.
        - $\dim(W) + \dim(W^\perp) = n$.
        - $(W^\perp)^\perp = W$.
        - Every vector $\vec{v}$ in $\mathbb{R}^n$ can be written uniquely as $\vec{v} = \vec{w} + \vec{z}$ where $\vec{w} \in W$ and $\vec{z} \in W^\perp$.

        **Important connection**: For a matrix $A$:
        - $\text{Nul}(A) = [\text{Row}(A)]^\perp$
        - $\text{Nul}(A^T) = [\text{Col}(A)]^\perp$
      check:
        id: check-complement-dim
        type: numericResponse
        prompt: |
          Let $W$ be a 3-dimensional subspace of $\mathbb{R}^7$. What is $\dim(W^\perp)$?
        answer:
          value: 4
          tolerance: 0
        explanation: |
          Since $\dim(W) + \dim(W^\perp) = n = 7$, we get $\dim(W^\perp) = 7 - 3 = 4$.

    - id: orthogonal-projection
      title: Orthogonal Projections
      content: |
        The **orthogonal projection** of a vector $\vec{y}$ onto a vector $\vec{u}$ is the unique vector in $\text{Span}\{\vec{u}\}$ that is closest to $\vec{y}$:
        $$\text{proj}_{\vec{u}}\vec{y} = \frac{\vec{y} \cdot \vec{u}}{\vec{u} \cdot \vec{u}} \vec{u}$$

        The **error** (or residual) $\vec{z} = \vec{y} - \text{proj}_{\vec{u}}\vec{y}$ is orthogonal to $\vec{u}$.

        **Projecting onto a subspace $W$** with an orthogonal basis $\{\vec{u}_1, \dots, \vec{u}_p\}$:
        $$\hat{\vec{y}} = \text{proj}_{W}\vec{y} = \frac{\vec{y} \cdot \vec{u}_1}{\vec{u}_1 \cdot \vec{u}_1}\vec{u}_1 + \dots + \frac{\vec{y} \cdot \vec{u}_p}{\vec{u}_p \cdot \vec{u}_p}\vec{u}_p$$

        This formula requires the basis to be **orthogonal**. If the basis is **orthonormal** ($\|\vec{u}_i\| = 1$), it simplifies to:
        $$\hat{\vec{y}} = (\vec{y} \cdot \vec{u}_1)\vec{u}_1 + \dots + (\vec{y} \cdot \vec{u}_p)\vec{u}_p$$
      check:
        id: check-projection
        type: multipleChoice
        prompt: |
          What is the orthogonal projection of $\vec{y} = \begin{bmatrix}3\\4\end{bmatrix}$ onto $\vec{u} = \begin{bmatrix}1\\0\end{bmatrix}$?
        choices:
          - id: c1
            text: '$\begin{bmatrix}3\\4\end{bmatrix}$'
          - id: c2
            text: '$\begin{bmatrix}3\\0\end{bmatrix}$'
          - id: c3
            text: '$\begin{bmatrix}4\\0\end{bmatrix}$'
          - id: c4
            text: '$\begin{bmatrix}0\\4\end{bmatrix}$'
        answer:
          choiceId: c2
        explanation: |
          $\text{proj}_{\vec{u}}\vec{y} = \frac{\vec{y}\cdot\vec{u}}{\vec{u}\cdot\vec{u}}\vec{u} = \frac{3\cdot1+4\cdot0}{1^2+0^2}\begin{bmatrix}1\\0\end{bmatrix} = 3\begin{bmatrix}1\\0\end{bmatrix} = \begin{bmatrix}3\\0\end{bmatrix}$.
          Geometrically, projecting $(3,4)$ onto the $x$-axis simply "drops" the $y$ component.
