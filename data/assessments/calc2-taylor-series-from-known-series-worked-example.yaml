  - id: taylor-known-step-011
    title: Write the transformed series
    instruction: |
      Using $u=2x$:

      $$
      \ln(1+2x)=\sum_{n=1}^{\infty}(-1)^{n+1}\frac{(2x)^n}{n}.
      $$
    type: selectAll
    prompt: Which features are correct for this transformed logarithm series?
    choices:
    - id: a
      text: Powers are $(2x)^n$.
    - id: b
      text: Signs alternate.
    - id: c
      text: The denominator is $n$.
    - id: d
      text: The series starts at $n=0$ with a constant $1$.
    answer:
      choiceIds:
      - a
      - b
      - c
    explanation: 'Solution: The logarithm series starts at $n=1$ and has no constant term. Therefore the answer is Powers are $(2x)^n$., Signs alternate., The denominator is $n$.. Therefore the answer is Powers are $(2x)^n$., Signs alternate., The denominator is $n$.. Therefore the answer is Powers are $(2x)^n$., Signs alternate., The denominator is $n$..


