  - id: taylor-known-step-010
    title: Change the input
    instruction: |
      Now build a series for:

      $$
      \ln(1+2x).
      $$

      Substitute $2x$ wherever $x$ appears in the known logarithm series.
    type: multipleChoice
    prompt: |-
      What is the first nonzero term of $\ln(1+2x)$?
    choices:
