  - id: taylor-known-step-009
    title: Test the endpoints
    instruction: |
      At $x=1$:

      $$
      1-\frac12+\frac13-\frac14+\cdots
      $$

      converges by the Alternating Series Test.

      At $x=-1$:

      $$
      -1-\frac12-\frac13-\frac14-\cdots
      $$

      diverges.
    type: multipleChoice
    prompt: |-
      What is the interval of convergence for $\ln(1+x)$?
    choices:
    - id: a
      text: $(-1,1]$
    - id: b
      text: $[-1,1]$
    - id: c
      text: $(-1,1)$
    - id: d
      text: $[-1,1)$
    answer:
      choiceId: a
    explanation: 'Solution: The right endpoint gives the alternating harmonic series, which converges. The left endpoint gives the negative harmonic series, which diverges. Therefore the answer is $(-1,1]$.


      Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.


