questions:
  - id: q001
    type: multipleChoice
    skills:
      - chem-gas-laws
    prompt: |
      Boyle's Law states that at constant temperature, the pressure of a fixed amount of gas is:
    choices:
      - id: a
        text: Directly proportional to its volume
      - id: b
        text: Inversely proportional to its volume
      - id: c
        text: Directly proportional to the number of moles
      - id: d
        text: Independent of its volume
    answer:
      choiceId: b
    explanation: |
      Boyle's law ($P_1 V_1 = P_2 V_2$) describes an inverse relationship: as volume decreases, pressure increases (and vice versa).

  - id: q002
    type: numericResponse
    skills:
      - chem-gas-laws
    prompt: |
      A sample of oxygen gas occupies a volume of 2.50 L at a pressure of 1.20 atm. If the volume is decreased to 1.00 L at constant temperature, what is the new pressure in **atm**?
    answer:
      value: 3.00
      tolerance: 0.05
    explanation: |
      Using Boyle's law ($P_1 V_1 = P_2 V_2$):
      $$1.20 \text{ atm} \times 2.50 \text{ L} = P_2 \times 1.00 \text{ L}$$
      $$P_2 = \frac{3.00}{1.00} = 3.00 \text{ atm}$$

  - id: q003
    type: multipleChoice
    skills:
      - chem-gas-laws
    prompt: |
      Charles's Law establishes a direct proportional relationship between which two variables (assuming constant pressure and amount of gas)?
    choices:
      - id: a
        text: Pressure and Volume
      - id: b
        text: Volume and Temperature (in Celsius)
      - id: c
        text: Volume and Temperature (in Kelvin)
      - id: d
        text: Pressure and Temperature (in Kelvin)
    answer:
      choiceId: c
    explanation: |
      Charles's law ($\frac{V_1}{T_1} = \frac{V_2}{T_2}$) requires temperature to be in **Kelvin** (absolute temperature). Volume is directly proportional to absolute temperature.

  - id: q004
    type: numericResponse
    skills:
      - chem-gas-laws
    prompt: |
      A balloon has a volume of 4.0 L at 300 K. If it is heated to 600 K at constant pressure, what is the new volume (in L)?
    answer:
      value: 8.0
      tolerance: 0.1
    explanation: |
      Since the absolute temperature doubles (300 K to 600 K), the volume must also double (from 4.0 L to 8.0 L) according to Charles's law.

  - id: q005
    type: multipleChoice
    skills:
      - chem-gas-laws
    prompt: |
      Avogadro's law states that equal volumes of gases at the same temperature and pressure contain:
    choices:
      - id: a
        text: Equal masses
      - id: b
        text: Equal numbers of molecules (or moles)
      - id: c
        text: Equal densities
      - id: d
        text: Equal kinetic energies
    answer:
      choiceId: b
    explanation: |
      Avogadro's law states that volume is directly proportional to the number of moles ($n$). Therefore, equal volumes under identical conditions must contain equal numbers of moles (and therefore molecules).

  - id: q006
    type: multipleChoice
    skills:
      - chem-gas-laws
    prompt: |
      Which of the following is the correct mathematical representation of the Combined Gas Law?
    choices:
      - id: a
        text: '$P_1 V_1 T_1 = P_2 V_2 T_2$'
      - id: b
        text: '$\frac{P_1 V_1}{T_1} = \frac{P_2 V_2}{T_2}$'
      - id: c
        text: '$\frac{P_1 T_1}{V_1} = \frac{P_2 T_2}{V_2}$'
      - id: d
        text: '$PV = nRT$'
    answer:
      choiceId: b
    explanation: |
      The combined gas law merges Boyle's ($PV = k$), Charles's ($V/T = k$), and Gay-Lussac's ($P/T = k$) into one expression for a constant amount of gas: $\frac{PV}{T} = k$.

  - id: q007
    type: numericResponse
    skills:
      - chem-gas-laws
    prompt: |
      Calculate the pressure (in **atm**) exerted by 0.500 moles of $N_2$ gas in a 10.0 L container at 300 K.
      *(Use R = 0.0821 L·atm/mol·K)*
    answer:
      value: 1.23
      tolerance: 0.05
    explanation: |
      Using the Ideal Gas Law ($PV = nRT$):
      $$P = \frac{nRT}{V} = \frac{0.500 \times 0.0821 \times 300}{10.0} = \frac{12.315}{10.0} = 1.23 \text{ atm}$$

  - id: q008
    type: multipleChoice
    skills:
      - chem-gas-laws
    prompt: |
      When using the Ideal Gas Law ($PV = nRT$), which unit must temperature ALWAYS be in?
    choices:
      - id: a
        text: Celsius
      - id: b
        text: Fahrenheit
      - id: c
        text: Kelvin
      - id: d
        text: It depends on the units of R
    answer:
      choiceId: c
    explanation: |
      Temperature must **always** be in Kelvin in all gas laws to avoid dividing by zero or getting negative volumes/pressures (which are physically impossible).

  - id: q009
    type: numericResponse
    skills:
      - chem-gas-laws
    prompt: |
      A mixture contains 1.0 mol of $O_2$, 2.0 mol of $N_2$, and 1.0 mol of $Ar$. If the total pressure is 8.0 atm, what is the partial pressure of $N_2$ (in atm)?
    answer:
      value: 4.0
      tolerance: 0.1
    explanation: |
      Total moles = $1.0 + 2.0 + 1.0 = 4.0$ moles.
      Mole fraction of $N_2$ ($\chi_{N_2}$) = $2.0 / 4.0 = 0.50$.
      Partial pressure = $0.50 \times 8.0 \text{ atm} = 4.0 \text{ atm}$.

  - id: q010
    type: multipleChoice
    skills:
      - chem-gas-laws
    prompt: |
      A gas is collected over water at a given temperature. To find the pressure of the dry gas alone, you must:
    choices:
      - id: a
        text: Add the vapor pressure of water to the total pressure
      - id: b
        text: Subtract the vapor pressure of water from the total pressure
      - id: c
        text: Multiply the total pressure by the vapor pressure of water
      - id: d
        text: Ignore the water vapor; it behaves ideally
    answer:
      choiceId: b
    explanation: |
      By Dalton's Law, $P_{total} = P_{gas} + P_{H_2O}$. Therefore, $P_{gas} = P_{total} - P_{H_2O}$.

  - id: q011
    type: numericResponse
    skills:
      - chem-gas-laws
    prompt: |
      What volume (in L) does 1.00 mole of an ideal gas occupy at STP (Standard Temperature and Pressure: 273.15 K and 1.00 atm)?
      *(Use R = 0.08206 L·atm/mol·K)*
    answer:
      value: 22.4
      tolerance: 0.1
    explanation: |
      $V = \frac{nRT}{P} = \frac{1.00 \times 0.08206 \times 273.15}{1.00} = 22.414 \text{ L}$.
      The standard molar volume of an ideal gas at STP is **22.4 L**.

  - id: q012
    type: multipleChoice
    skills:
      - chem-gas-laws
    prompt: |
      If the volume of a container of gas is halved while the absolute temperature is simultaneously doubled, what happens to the pressure?
    choices:
      - id: a
        text: It increases by a factor of 4.
      - id: b
        text: It doubles.
      - id: c
        text: It remains constant.
      - id: d
        text: It halves.
    answer:
      choiceId: a
    explanation: |
      From the combined gas law ($\frac{P_1 V_1}{T_1} = \frac{P_2 V_2}{T_2}$):
      Halving $V$ doubles $P$. Doubling $T$ also doubles $P$. The net effect is $2 \times 2 = 4$. The pressure quadruples.
