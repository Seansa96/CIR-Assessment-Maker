workedExamples:
- id: we001
  title: Escape Velocity
  problem: |
    A spacecraft is launched from the surface of a planet with mass $M$ and radius $R$. Derive the expression for the minimum launch speed $v_{esc}$ required for the spacecraft to completely escape the planet's gravitational pull and reach deep space (infinity).
  steps:
  - id: step-1
    title: 1. Identify the energy state at infinity
    instruction: |
      The spacecraft escapes when it reaches an infinite distance ($r \to \infty$). To find the *minimum* escape velocity, assume the spacecraft arrives at infinity with exactly zero kinetic energy remaining. What is the total mechanical energy of the spacecraft at infinity?
    type: multipleChoice
    prompt: |
      What is the total mechanical energy $E_{final}$ of the spacecraft at infinity?
    choices:
    - id: a
      text: '$E_{final} = 0$'
    - id: b
      text: '$E_{final} > 0$'
    - id: c
      text: '$E_{final} < 0$'
    answer:
      choiceId: a
    explanation: |
      Solution:
      The total energy is $E_{final} = 0$.
      
      Why it works:
      Potential energy $U = -GMm/r \to 0$ as $r \to \infty$. The minimum kinetic energy needed is just enough to arrive, so $K_{final} = 0$. Thus, $E_{final} = K_{final} + U_{final} = 0$.
      
      Why the other choices fail:
      If $E_{final} > 0$, the spacecraft was launched faster than the minimum required escape velocity. It cannot be $< 0$ because it would never reach infinity.

  - id: step-2
    title: 2. Set up the conservation of energy equation
    instruction: |
      Apply the principle of conservation of energy between the launch point on the surface and infinity. Since no non-conservative forces do work (ignoring air resistance), $E_{initial} = E_{final}$.
    type: freeResponse
    prompt: |
      Write the equation for the initial total energy $E_{initial}$ at the surface of the planet in terms of $M, R, m, G$, and $v_{esc}$, and set it equal to $E_{final}$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Kinetic energy is 1/2 m v^2
      - Potential energy is -GMm/R
      - Sum is equal to 0
    explanation: |
      Solution:
      $\frac{1}{2}mv_{esc}^2 - G\frac{Mm}{R} = 0$
      
      Why it works:
      The total energy at the launch point is the sum of kinetic and gravitational potential energy. Since $E_{final} = 0$, the initial energy must also sum to zero.

  - id: step-3
    title: 3. Solve for escape velocity
    instruction: |
      Algebraically manipulate the energy equation to solve for $v_{esc}$.
    type: freeResponse
    prompt: |
      Isolate $v_{esc}$ in the equation $\frac{1}{2}mv_{esc}^2 - G\frac{Mm}{R} = 0$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Mass m cancels out
      - Isolate v squared to get 2GM/R
      - Take square root
    explanation: |
      Solution:
      $v_{esc} = \sqrt{\frac{2GM}{R}}$
      
      Why it works:
      Move the potential energy term to the right side, divide both sides by the spacecraft's mass $m$ (which cancels), multiply by 2, and take the square root. The result is a velocity dependent only on the mass and radius of the planet.
