questions:
  - { id: q001, type: multipleChoice, prompt: 'Which solution is expected to conduct electricity most strongly?', choices: [{ id: a, text: '0.10 M NaCl' }, { id: b, text: '0.10 M glucose' }, { id: c, text: 'pure water' }, { id: d, text: '0.10 M sucrose' }], answer: { choiceId: a }, explanation: 'Solution: 0.10 M NaCl conducts most strongly because it dissociates into mobile Na+ and Cl− ions. Why it works: Strong electrolytes provide many charge carriers. Why the other choices fail: Glucose and sucrose remain neutral molecules; pure water contains very few ions.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Relates formula type to particle model and conductivity.', prerequisiteObjectiveIds: [electrolyte-classification], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: electrolyte-conductivity, variationAxes: { scenario: conductivity comparison, representation: particle model } }
  - { id: q002, type: multipleChoice, prompt: 'Which substance is a weak electrolyte in water?', choices: [{ id: a, text: 'CH3COOH' }, { id: b, text: 'KBr' }, { id: c, text: 'NaOH' }, { id: d, text: 'C12H22O11' }], answer: { choiceId: a }, explanation: 'Solution: CH3COOH is a weak acid and therefore a weak electrolyte. Why it works: It partially ionizes, producing both molecules and ions. Why the other choices fail: KBr and NaOH are strong electrolytes; sucrose is a nonelectrolyte.', difficultyDimensions: [representationTransfer, casePartition], difficultyEvidence: 'Classifies solute by dissociation behavior and distinguishes three categories.', prerequisiteObjectiveIds: [electrolyte-classification], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: weak-electrolyte-identification, variationAxes: { scenario: solute classification, unknown: electrolyte class } }
  - { id: q003, type: multipleChoice, prompt: 'In 0.200 M MgCl2, what is [Cl−] assuming complete dissociation?', choices: [{ id: a, text: '0.400 M' }, { id: b, text: '0.200 M' }, { id: c, text: '0.600 M' }, { id: d, text: '0.100 M' }], answer: { choiceId: a }, explanation: 'Solution: MgCl2 gives two chloride ions per formula unit, so $[Cl^-]=2(0.200)=0.400\ \mathrm M$. Why it works: A formula subscript is an ion multiplier on complete dissociation. Why the other choices fail: b omits the multiplier; c counts total ions; d divides instead.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Transfers formula stoichiometry into an ion-concentration calculation.', prerequisiteObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: ion-molarity-subscript, variationAxes: { givens: formula-unit molarity, unknown: individual ion concentration } }
  - { id: q004, type: multipleChoice, prompt: 'At equal concentration, which solution has the lowest freezing point under ideal behavior?', choices: [{ id: a, text: 'Al2(SO4)3' }, { id: b, text: 'CaCl2' }, { id: c, text: 'NaCl' }, { id: d, text: 'glucose' }], answer: { choiceId: a }, explanation: 'Solution: Al2(SO4)3 yields five ions per formula unit, the most listed particles, so it has the largest freezing-point depression. Why it works: Colligative effects increase with dissolved-particle count. Why the other choices fail: CaCl2 yields three, NaCl two, and glucose one particle.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Counts ideal particles and transfers count to freezing-point direction.', prerequisiteObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: particle-count-freezing, variationAxes: { scenario: equal-molar solutions, unknown: largest colligative effect } }
  - { id: q005, type: multipleChoice, prompt: 'What happens to the boiling point of water when a nonvolatile solute is dissolved?', choices: [{ id: a, text: 'It increases.' }, { id: b, text: 'It decreases.' }, { id: c, text: 'It becomes independent of pressure.' }, { id: d, text: 'It equals zero.' }], answer: { choiceId: a }, explanation: 'Solution: The boiling point increases. Why it works: Dissolved particles lower solvent vapor pressure, requiring a higher temperature for boiling. Why the other choices fail: b reverses boiling-point elevation; c and d are unrelated claims.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Connects a particle-level solution change to a macroscopic phase-property trend.', prerequisiteObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: boiling-elevation-direction, variationAxes: { scenario: nonvolatile solute, unknown: property direction } }
  - { id: q006, type: multipleChoice, prompt: '![Particle models](/media/chemistry/electrolyte-particle-model.svg) Which panel represents a nonelectrolyte?', choices: [{ id: a, text: 'The panel with neutral molecules only.' }, { id: b, text: 'The panel with separated plus and minus ions only.' }, { id: c, text: 'The panel with ions and molecules together.' }, { id: d, text: 'All panels represent strong electrolytes.' }], answer: { choiceId: a }, explanation: 'Solution: The neutral-molecule-only panel is a nonelectrolyte. Why it works: Nonelectrolytes do not make ions. Why the other choices fail: b is strong dissociation; c is partial ionization; d ignores the diagram differences.', difficultyDimensions: [representationTransfer, casePartition], difficultyEvidence: 'Interprets a particle representation and classifies electrolyte behavior.', prerequisiteObjectiveIds: [electrolyte-classification], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0396], reasoningSignature: visual-nonelectrolyte, variationAxes: { representation: diagram, unknown: class } }
  - { id: q007, type: multipleChoice, prompt: 'Which statement correctly distinguishes a weak electrolyte from a nonelectrolyte?', choices: [{ id: a, text: 'A weak electrolyte has some ions; a nonelectrolyte has no ions.' }, { id: b, text: 'A weak electrolyte is always insoluble.' }, { id: c, text: 'A nonelectrolyte has more ions.' }, { id: d, text: 'They conduct equally well.' }], answer: { choiceId: a }, explanation: 'Solution: Weak electrolytes partially form ions, whereas nonelectrolytes remain neutral. Why it works: The number of mobile ions controls conductivity. Why the other choices fail: Weak does not mean insoluble; c reverses the definitions; d ignores differing charge carriers.', difficultyDimensions: [casePartition, representationTransfer], difficultyEvidence: 'Separates two related particle models by ion presence.', prerequisiteObjectiveIds: [electrolyte-classification], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: weak-versus-nonelectrolyte, variationAxes: { scenario: definition comparison, methodBranch: particle classification } }
  - { id: q008, type: multipleChoice, prompt: 'In 0.0500 M Na3PO4, what is [Na+] assuming complete dissociation?', choices: [{ id: a, text: '0.150 M' }, { id: b, text: '0.0500 M' }, { id: c, text: '0.200 M' }, { id: d, text: '0.0167 M' }], answer: { choiceId: a }, explanation: 'Solution: Three Na+ ions form per Na3PO4, so $[Na^+]=3(0.0500)=0.150\ \mathrm M$. Why it works: The sodium subscript supplies the stoichiometric multiplier. Why the other choices fail: b ignores it; c counts four total ions; d divides by three.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Uses formula stoichiometry to calculate cation molarity.', prerequisiteObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: cation-molarity-subscript, variationAxes: { givens: ionic solution molarity, unknown: cation concentration } }
  - { id: q009, type: numericResponse, prompt: 'Find total ideal dissolved-ion concentration in 0.125 M K2SO4.', answer: { value: 0.375, tolerance: 0.001 }, explanation: 'Solution: K2SO4 gives two K+ and one SO4 2−, three ions total. Thus $3(0.125)=0.375\ \mathrm M$ total ions. Why it works: Complete dissociation particle count multiplies formula-unit concentration. Common trap: Multiplying by ionic charges instead of ion count.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Counts ions per formula unit and applies the multiplier to molarity.', prerequisiteObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: total-ion-concentration, variationAxes: { unknown: total ion concentration, representation: dissociation equation } }
  - { id: q010, type: numericResponse, prompt: 'A 0.250 M glucose solution behaves ideally. How many dissolved particles per formula unit does glucose contribute?', answer: { value: 1, tolerance: 0 }, explanation: 'Solution: Glucose remains one neutral molecule per formula unit, so it contributes one particle. Why it works: Nonelectrolytes dissolve without dissociating. Common trap: Counting atoms in the glucose formula as separate particles.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Uses molecular particle model rather than formula atom count.', prerequisiteObjectiveIds: [electrolyte-classification], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0398], reasoningSignature: nonelectrolyte-particle-count, variationAxes: { scenario: molecular solute, unknown: particle count } }
