  - id: s05
    title: Read grouped products
    required: true
    content: $\mathbb R\times(\mathbb N\times\mathbb Z)$ has a real first 
      coordinate and an ordered pair as its second coordinate.
    media: []
    check:
      id: check-005
      type: multipleChoice
      prompt: What shape has an element of $\mathbb R\times(\mathbb 
        N\times\mathbb Z)$?
      choices:
      - id: a
        text: (real number, (natural number, integer))
        media: []
        issueSignals: []
      - id: b
        text: (real number, natural number, integer)
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: c
        text: ((real number, natural number), integer)
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: d
        text: '{real number, natural number, integer}'
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected:
        gradingMode:
        expectedLatex:
        equivalenceMode:
        variables: []
        value:
        tolerance:
        media: []
        keyPoints: []
        circuitAnswer:
        graphingAnswer:
      explanation: >-
        Solution: (real number, (natural number, integer)).

        Why it works: The section on read grouped products supplies the exact definition,
        condition, or proof structure needed here.

        Why the other choices fail: Dropping the inner parentheses makes it a flat
        triple. Grouping the first two incorrectly changes the structure. Curly braces
        denote a set, not a tuple.
