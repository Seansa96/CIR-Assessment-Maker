  - id: s07
    title: Use the empty-set rule
    required: true
    content: Because it has no counterexample element, $\varnothing$ is a subset
      of every set.
    media: []
    check:
      id: check-007
      type: multipleChoice
      prompt: Is $\varnothing\subseteq A$ true for every set A?
      choices:
      - id: a
        text: Yes, because it has no elements to contradict the subset 
          condition.
        media: []
        issueSignals: []
      - id: b
        text: No, because it is empty.
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: c
        text: Yes, because the empty set contains A.
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: d
        text: No, it only applies to other empty sets.
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected:
        gradingMode:
        expectedLatex:
        equivalenceMode:
        variables: []
        value:
        tolerance:
        media: []
        keyPoints: []
        circuitAnswer:
        graphingAnswer:
      explanation: >-
        Solution: Yes, because it has no elements to contradict the subset condition.

        Why it works: The section on use the empty-set rule supplies the exact definition,
        condition, or proof structure needed here.

        Why the other choices fail: The empty set is a subset of every set. It does
        not contain A, and being empty is exactly why it is vacuously a subset.
