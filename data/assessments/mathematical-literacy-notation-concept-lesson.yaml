  - id: s03
    title: Use context for vertical bars
    required: true
    content: $|X|$ means cardinality when $X$ is a set and absolute value when 
      $X$ is a number.
    media: []
    check:
      id: check-003
      type: multipleChoice
      prompt: When $X$ is a set, what does $|X|$ mean?
      choices:
      - id: a
        text: the number of elements in X
        media: []
        issueSignals: []
      - id: b
        text: the absolute value of X
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: c
        text: the set containing X
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: d
        text: X is a positive set
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected:
        gradingMode:
        expectedLatex:
        equivalenceMode:
        variables: []
        value:
        tolerance:
        media: []
        keyPoints: []
        circuitAnswer:
        graphingAnswer:
      explanation: >-
        Solution: the number of elements in X.

        Why it works: The section on use context for vertical bars supplies the exact
        definition, condition, or proof structure needed here.

        Why the other choices fail: Absolute value applies to numbers, not sets. It
        does not mean the set containing X or that X is positive.
      media: []
      language:
      functionName:
