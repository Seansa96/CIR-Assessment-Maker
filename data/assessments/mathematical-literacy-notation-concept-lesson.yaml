lesson:
  introduction: |
    Mathematical notation compresses a sentence into a structure. Read it slowly: name the object, identify what varies, and then identify the condition that limits it.
  sections:
    - id: s01
      title: Ask what kind of object you are seeing
      content: |
        Braces usually describe a set, parentheses often group an expression or form an ordered pair, and an arrow describes a function's input-to-output direction. Before calculating, say what sort of object the notation names.
    - id: s02
      title: Bind variables before interpreting them
      content: |
        In $\{x\in\mathbb Z:x>0\}$, the phrase $x\in\mathbb Z$ tells you which values x may take, and $x>0$ narrows that collection. A symbol may change roles in another sentence, so use the surrounding declaration rather than memory alone.
    - id: s03
      title: Read set-builder notation in two passes
      content: |
        Read $\{2n:n\in\mathbb Z\}$ as “all outputs of the expression $2n$, where n is an integer.” The expression before the colon says what is collected; the condition after it says which choices are allowed.
    - id: s04
      title: Keep membership distinct from containment
      content: |
        $a\in A$ says that a is one element of A. $B\subseteq A$ says every element of B is also an element of A. They answer different questions, even when the symbols look similar.
