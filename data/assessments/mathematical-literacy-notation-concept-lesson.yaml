  sections:
  - id: s01
    title: Read set-builder notation
    required: true
    content: $E=\{2n:n\in\mathbb Z\}$ collects outputs $2n$ as $n$ ranges over 
      integers; it is the set of even integers.
    media: []
    check:
      id: check-001
      type: multipleChoice
      prompt: Which value belongs to $E=\{2n:n\in\mathbb Z\}$?
      choices:
      - id: a
        text: 14
        media: []
        issueSignals: []
      - id: b
        text: '{14}'
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: c
        text: '2.5'
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: d
        text: n
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected:
        gradingMode:
        expectedLatex:
        equivalenceMode:
        variables: []
        value:
        tolerance:
        media: []
        keyPoints: []
        circuitAnswer:
        graphingAnswer:
      explanation: >-
        Solution: 14.

        Why it works: The section on read set-builder notation supplies the exact
        definition, condition, or proof structure needed here.

        Why the other choices fail: {14} is a set, not an element. 2.5 cannot be formed
        by 2n for integer n. n is the variable, not the output value.
