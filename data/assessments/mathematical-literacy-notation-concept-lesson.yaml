  - id: s02
    title: Separate rule from output
    required: true
    content: In $\{2n:n\in\mathbb Z\}$, $2n$ is the output expression and 
      $n\in\mathbb Z$ is the domain rule.
    media: []
    check:
      id: check-002
      type: multipleChoice
      prompt: What role does $n\in\mathbb Z$ play in $\{2n:n\in\mathbb Z\}$?
      choices:
      - id: a
        text: It restricts n to integers
        media: []
        issueSignals: []
      - id: b
        text: It restricts the final outputs to be any integer
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: c
        text: It means n can be any real number
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: d
        text: It is the output expression
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected:
        gradingMode:
        expectedLatex:
        equivalenceMode:
        variables: []
        value:
        tolerance:
        media: []
        keyPoints: []
        circuitAnswer:
        graphingAnswer:
      explanation: >-
        Solution: It restricts n to integers.

        Why it works: The section on separate rule from output supplies the exact
        definition, condition, or proof structure needed here.

        Why the other choices fail: It restricts the parameter, not the final output
        set directly. It does not allow any real number, nor is it the output expression
        itself.
