          domains: []
      - id: c
        text: A and B have the same elements
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: d
        text: A is an element of B
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected:
        gradingMode:
        expectedLatex:
        equivalenceMode:
        variables: []
        value:
        tolerance:
        media: []
        keyPoints: []
        circuitAnswer:
        graphingAnswer:
      explanation: >-
        Solution: Every element of B is an element of A.

        Why it works: The section on distinguish membership from subset supplies the
        exact definition, condition, or proof structure needed here.

        Why the other choices fail: It does not mean B is an element of A (membership),
        nor does it guarantee they are equal. A is not an element of B.
