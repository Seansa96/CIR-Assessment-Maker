schemaVersion: 1
id: physics-rotational-work-power-recall
title: 'Recall: Work and Power for Rotational Motion'
description: Flashcards and definitions.
assessmentType: glossary
categoryId: physics-1
subcategoryIds:
- physics-rotational-work-power
glossary:
  introduction: Review the essential terms below. Once you understand them, test your
    knowledge using the recall drills.
  sections:
  - id: sec-physics-rotational-work-power-recall
    title: Core Terminology
    entries:
    - id: entry-rot-work
      term: Rotational Work
      definition: Work done by a torque as an object rotates through an angle. $W
        = \int \tau \, d\theta$.
      drills:
      - id: drill-rot-work
        prompt: For constant torque, the work done is the product of torque and angular
          ________.
        type: typed
        answer:
          expected: displacement
    - id: entry-rot-power
      term: Rotational Power
      definition: The rate at which work is done by a torque. $P = \tau\omega$.
      drills:
      - id: drill-rot-power
        prompt: Rotational power is the product of torque and angular ________.
        type: typed
        answer:
          expected: velocity
