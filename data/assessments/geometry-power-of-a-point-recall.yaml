items:
- id: item-secant-secant-theorem
  type: symbolic
  prompt: 'Write the Power of a Point formula for two secants intersecting outside a circle, where the external segments are $a$ and $c$, and the internal segments are $b$ and $d$.'
  answer:
    expectedLatex: 'a(a+b)=c(c+d)'
    equivalenceMode: equation
    variables:
    - a
    - b
    - c
    - d
  skills:
  - geometry-power-of-a-point
- id: item-tangent-secant-theorem
  type: symbolic
  prompt: 'Write the Power of a Point formula for a tangent and a secant intersecting outside a circle, where the tangent segment is $t$, the external secant segment is $a$, and the internal secant segment is $b$.'
  answer:
    expectedLatex: 't^2=a(a+b)'
    equivalenceMode: equation
    variables:
    - t
    - a
    - b
  skills:
  - geometry-power-of-a-point
