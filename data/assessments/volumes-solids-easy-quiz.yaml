questions:
- id: vol-easy-1
  title: Disk Method
  type: symbolicResponse
  prompt: 'Adapted from OpenStax Calculus Volume 2.


    Find the volume of the solid generated by rotating $y = 3\sqrt{x}$ around the
    x-axis from $x=0$ to $x=2$.'
  answer:
    gradingMode: auto
    expectedLatex: 2*9\pi
    equivalenceMode: expression
    tolerance: 0
  explanation: $\pi \int_0^2 (3\sqrt{x})^2 \, dx = \pi \int_0^2 9x \, dx = 9\pi [x^2/2]_0^2
    = 2(9)\pi$.
