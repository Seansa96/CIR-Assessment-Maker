glossary:
  introduction: Key terms for a damped oscillator driven by an external periodic force.
  sections:
  - id: forced-terms
    title: Core terms
    entries:
    - {id: driving-force, term: driving force, definition: 'An external periodic force such as $F_0\sin(\omega t)$.', drills: [{id: driving-force-drill, type: typed, prompt: 'What is the external periodic input to an oscillator called?', answer: driving force}]}
    - {id: driving-frequency, term: driving frequency, definition: 'The angular frequency $\omega$ of the external driver.', drills: [{id: driving-frequency-drill, type: cloze, prompt: 'Steady-state motion occurs at the {{driving frequency}}.', answer: driving frequency}]}
    - {id: resonance, term: resonance, definition: 'A large forced response when driving frequency is near natural frequency.', drills: [{id: resonance-drill, type: typed, prompt: 'What is the name for a large response near natural frequency?', answer: resonance}]}
    - {id: steady-state, term: steady state, definition: 'The long-time forced response after transient motion has decayed.', drills: [{id: steady-state-drill, type: cloze, prompt: 'The long-time response after transients disappear is the {{steady state}}.', answer: steady state}]}
