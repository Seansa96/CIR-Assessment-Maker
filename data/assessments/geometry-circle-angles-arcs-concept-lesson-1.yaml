lesson:
  introduction: |-
    Angles inside a circle interact with the arcs they "intercept" (cut off) on the edge of the circle. Understanding these relationships is the core of circle geometry.
  sections:
  - id: sec-central
    title: Central Angles
    required: true
    content: |-
      A **central angle** is an angle whose vertex is exactly at the center of the circle.
      
      The rule for central angles is the simplest of all: **The measure of a central angle is exactly equal to the measure of its intercepted arc.**
      
      For example, if central angle $\angle AOB$ intercepts arc $\overparen{AB}$, and $m\angle AOB = 75^\circ$, then $m\overparen{AB} = 75^\circ$.

  - id: sec-inscribed
    title: Inscribed Angles
    required: true
    content: |-
      An **inscribed angle** is an angle whose vertex lies *on the edge* of the circle, and whose sides are chords of the circle.
      
      Because the vertex has been pulled all the way to the other side of the circle, the angle becomes much narrower than a central angle cutting off the same arc.
      
      **The Inscribed Angle Theorem**: The measure of an inscribed angle is exactly **half** the measure of its intercepted arc.
      $$m(\text{inscribed angle}) = \frac{1}{2} m(\text{intercepted arc})$$
      
      *Corollary*: If two inscribed angles intercept the exact same arc, the two angles must be congruent!

questions:
- id: q-geom-arcs-1
  title: Concept Check - Inscribed Angle
  prompt: |-
    An inscribed angle intercepts an arc that measures $100^\circ$. What is the measure of the inscribed angle?
  type: numericResponse
  answer:
    numericValue: 50
    tolerance: 0
  explanation: |-
    The inscribed angle is exactly half the measure of the intercepted arc.
    $$100^\circ \div 2 = 50^\circ$$
  skills:
  - geometry-circle-angles-arcs

- id: q-geom-arcs-2
  title: Concept Check - Comparing Angles
  prompt: |-
    A central angle and an inscribed angle both intercept the exact same arc. If the inscribed angle measures $40^\circ$, what does the central angle measure?
  type: numericResponse
  answer:
    numericValue: 80
    tolerance: 0
  explanation: |-
    If the inscribed angle is $40^\circ$, then the intercepted arc must be twice as large: $80^\circ$.
    The central angle is always exactly equal to the intercepted arc, so it must also be $80^\circ$.
    (A central angle is always twice the size of an inscribed angle that shares the same arc!)
  skills:
  - geometry-circle-angles-arcs
