questions:
  - { id: q001, type: freeResponse, prompt: 'For $x=\cos t,y=\sin t$, explain why $0\le t\le4\pi$ is invalid for one-circle area without a correction.', answer: { gradingMode: selfCheck, keyPoints: ['two traversals', 'directed integral doubles', 'use zero to two pi or divide after justification'] }, explanation: 'Solution: The interval advances the angle by four pi and traces the circle twice, doubling a boundary integral. Use a one-trace interval such as zero to two pi. Why it works: Area formulas follow directed traversals. Common trap: Doubling for symmetry after already double tracing.', difficultyDimensions: [globalLocalReasoning, modelOrDerivation, errorDiagnosis], difficultyEvidence: 'Relates period, traversal multiplicity, and directed area accumulation.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-area-length] , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q002, type: freeResponse, prompt: 'Find the exact arc length of $x=t^2/2,y=t^3/3$ on $0\le t\le1$.', answer: { gradingMode: selfCheck, keyPoints: ['speed t sqrt one plus t squared', 'substitute one plus t squared', 'two sqrt two minus one over three'] }, explanation: 'Solution: Speed is $\sqrt{t^2+t^4}=t\sqrt{1+t^2}$ on the nonnegative interval. Integrating gives $(2\sqrt2-1)/3$. Why it works: The interval justifies removing the absolute value and a substitution completes the integral. Common trap: Writing $\sqrt{t^2}=t$ without the interval check.', difficultyDimensions: [simplification, domainCondition, auxiliaryTechnique], difficultyEvidence: 'Simplifies a speed radical with a sign condition and uses substitution.', prerequisiteObjectiveIds: [u-sub-integration], extensionObjectiveIds: [parametric-review-area-length] , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q003, type: freeResponse, prompt: 'Set up the area of one arch of $x=t-\sin t,y=1-\cos t$ and justify the bounds.', answer: { gradingMode: selfCheck, keyPoints: ['zero to two pi', 'integrand one minus cosine squared', 'consecutive x-axis endpoints'] }, explanation: 'Solution: $A=\int_0^{2\pi}(1-\cos t)^2dt$. The curve starts and ends on the x-axis at consecutive cusps over this interval, so it is one arch. Why it works: Area under a parametric curve uses y times x-prime. Common trap: Stopping at pi, which reaches a top point rather than the next endpoint.', difficultyDimensions: [modelOrDerivation, domainCondition, representationTransfer], difficultyEvidence: 'Derives a parametric area differential and uses geometric endpoint conditions.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-area-length] , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q004, type: freeResponse, prompt: 'Explain why $\int y(t)x prime(t)dt$ can be negative even when geometric area is positive.', answer: { gradingMode: selfCheck, keyPoints: ['orientation', 'signed dx', 'reverse bounds or use appropriate sign convention'] }, explanation: 'Solution: x-prime dt is directed dx, so clockwise or right-to-left traversal can make the signed integral negative. Correct with orientation-aware bounds or formula. Why it works: The line integral is signed, whereas geometric area is nonnegative. Common trap: Taking an absolute value before checking retracing.', difficultyDimensions: [representationTransfer, errorDiagnosis, modelOrDerivation], difficultyEvidence: 'Separates signed boundary accumulation from geometric magnitude.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-area-length] , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q005, type: freeResponse, prompt: 'For $x=\cos^3t,y=\sin^3t$ on $0\le t\le\pi/2$, explain why parametric arc length is preferable to eliminating t first.', answer: { gradingMode: selfCheck, keyPoints: ['speed simplifies to three sine cosine', 'Cartesian fractional powers awkward', 'first quadrant sign conditions'] }, explanation: 'Solution: Component derivatives give speed $3\sin t\cos t$ on the first quadrant, directly integrable. Cartesian elimination introduces fractional powers and a harder derivative. Why it works: Prefer the representation that simplifies the differential element. Common trap: Assuming Cartesian form is always simpler.', difficultyDimensions: [representationTransfer, reverseReasoning, auxiliaryTechnique], difficultyEvidence: 'Compares two representations and selects one based on derivative complexity.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-area-length] , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q006, type: freeResponse, prompt: 'A path has $x prime<0$ for part of an area-under-curve interval. Describe the required model check.', answer: { gradingMode: selfCheck, keyPoints: ['x decreases', 'signed contribution', 'partition or orient bounds', 'check desired geometric region'] }, explanation: 'Solution: Check that the interval’s direction matches the intended area model; partition or reverse as needed because y x-prime dt is signed. Why it works: Negative x-prime means the path moves left. Common trap: Treating all parameter intervals as left-to-right.', difficultyDimensions: [domainCondition, casePartition, modelOrDerivation], difficultyEvidence: 'Uses a rate sign change to revise an area model.', prerequisiteObjectiveIds: [parametric-integrals], extensionObjectiveIds: [parametric-review-area-length] , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q007, type: freeResponse, prompt: 'Explain why a derivative singularity in an arc-length problem should be analyzed after forming the full speed expression.', answer: { gradingMode: selfCheck, keyPoints: ['speed may simplify', 'removable singularity', 'check integrability and endpoint'] }, explanation: 'Solution: Combine both component-rate terms first; apparent singular pieces can cancel in the speed. Then check the resulting integrand and endpoint. Why it works: Arc length depends on the full magnitude, not an isolated derivative. Common trap: Discarding an endpoint just because one component derivative is undefined.', difficultyDimensions: [simplification, domainCondition, errorDiagnosis], difficultyEvidence: 'Analyzes a singular-looking rate only after constructing the governing magnitude.', prerequisiteObjectiveIds: [parametric-integrals], extensionObjectiveIds: [parametric-review-area-length] , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q008, type: freeResponse, prompt: 'Give a reliable procedure for selecting one loop of a self-intersecting parametric curve before area calculation.', answer: { gradingMode: selfCheck, keyPoints: ['find repeated positions or crossings', 'sample ordered trace', 'choose consecutive loop bounds', 'avoid retracing'] }, explanation: 'Solution: Solve or identify repeated positions, inspect the ordered trace between consecutive crossings, and choose the interval enclosing only the target loop. Why it works: A self-intersecting locus contains several possible regions. Common trap: Using an entire period without examining loops.', difficultyDimensions: [casePartition, globalLocalReasoning, modelOrDerivation], difficultyEvidence: 'Uses local crossings and global trace order to isolate one region.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-area-length] , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q009, type: freeResponse, prompt: 'Use units to distinguish $\int y\,dx$ from $\int ds$ when x and y are measured in meters.', answer: { gradingMode: selfCheck, keyPoints: ['y dx square meters area', 'ds meters length', 'different quantities'] }, explanation: 'Solution: y dx has meter times meter, so square meters; ds has meters, so length. Why it works: Units expose which geometric quantity is accumulated. Common trap: Treating every integral over a curve as area.', difficultyDimensions: [representationTransfer, proofJustification, modelOrDerivation], difficultyEvidence: 'Uses dimensional analysis to select and justify a geometric model.', prerequisiteObjectiveIds: [parametric-integrals], extensionObjectiveIds: [parametric-review-area-length] , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q010, type: freeResponse, prompt: 'Write a validation checklist for a parametric area or arc-length solution.', answer: { gradingMode: selfCheck, keyPoints: ['trace once', 'correct differential model', 'sign or speed check', 'bounds and endpoints', 'units'] }, explanation: 'Solution: Verify the intended one-trace interval; derive y dx or speed ds correctly; check orientation/sign or nonnegative speed; validate bounds/endpoints; and check units. Why it works: These checks validate the model before integration. Common trap: Treating an antiderivative as proof of a correct setup.', difficultyDimensions: [errorDiagnosis, proofJustification, modelOrDerivation], difficultyEvidence: 'Audits path multiplicity, differential selection, and result interpretation.', prerequisiteObjectiveIds: [parametric-integrals], extensionObjectiveIds: [parametric-review-area-length] , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
