- id: sm-we002
  title: Solve a sticking-cart collision
  problem: A 1.0 kg cart moves right at 4.0 m/s and sticks to a 3.0 kg cart initially at rest on a low-friction track. Find their shared final velocity.
  steps:
  - id: sm2-s1
    title: Write initial system momentum
    instruction: Use right as positive and include both carts.
    hint:
    type: numericResponse
    prompt: What is initial total momentum in kg m/s?
    choices: []
    answer:
      choiceId:
      choiceIds: []
      expected:
      gradingMode:
      expectedLatex:
      equivalenceMode:
      variables: []
      value: 4.0
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer:
      graphingAnswer:
    explanation: 'Solution: $P_i=(1.0)(4.0)+(3.0)(0)=4.0$ kg m/s.\n\nWhy it works: Both carts belong to the chosen collision system.'
    media: []
    language:
    functionName:
    executionMode: unspecified
    starterCode:
    tests:
    issueSignals: []
  - id: sm2-s2
    title: Apply conservation to the combined mass
    instruction: After sticking, both carts share one final velocity.
    hint:
    type: numericResponse
    prompt: What is the final velocity in m/s?
    choices: []
    answer:
      choiceId:
      choiceIds: []
      expected:
      gradingMode:
      expectedLatex:
      equivalenceMode:
      variables: []
      value: 1.0
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer:
      graphingAnswer:
    explanation: 'Solution: $4.0=(1.0+3.0)v_f$, so $v_f=1.0$ m/s.\n\nWhy it works: The collision forces are internal to the two-cart system and the combined mass is 4.0 kg.'
    media: []
    language:
    functionName:
    executionMode: unspecified
    starterCode:
    tests:
    issueSignals: []
