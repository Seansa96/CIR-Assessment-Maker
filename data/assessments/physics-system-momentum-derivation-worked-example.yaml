workedExamples:
- id: ex-system-momentum
  title: Newton's Third Law to System Momentum
  problem: |
    Let's prove that if no net external force acts on a system, its total momentum is conserved ($d\vec P_{\text{system}}/dt = \vec F_{\text{ext}}$).
  steps:
  - id: step-1
    title: Step 1 — Define System Momentum
    instruction: |
      First, we define the total momentum of a multi-particle system as the sum of the individual momenta: $\vec P_{\text{system}} = \sum \vec p_i$.
      We take the time derivative of both sides: $d\vec P_{\text{system}}/dt = \sum d\vec p_i / dt$.
    type: multipleChoice
    prompt: According to Newton's Second Law, what can we substitute for $d\vec p_i / dt$?
    choices:
    - id: a
      text: The mass $m_i$
    - id: b
      text: The net force on particle $i$, $\vec F_{\text{net, } i}$
    - id: c
      text: The velocity $\vec v_i$
    answer:
      choiceId: b
    explanation: $d\vec p/dt$ is the net force acting on a particle. So $d\vec P_{\text{system}}/dt = \sum \vec F_{\text{net, } i}$.
  - id: step-2
    title: Step 2 — Separate Internal and External Forces
    instruction: |
      We can split every force acting on a particle into two categories: external forces (from outside the system) and internal forces (from other particles inside the system).
      $\sum \vec F_{\text{net, } i} = \sum \vec F_{\text{ext}} + \sum \vec F_{\text{int}}$.
    type: multipleChoice
    prompt: According to Newton's Third Law ($\vec F_{ij} = -\vec F_{ji}$), what happens when we sum all the internal forces ($\sum \vec F_{\text{int}}$)?
    choices:
    - id: a
      text: They add up to the total mass of the system.
    - id: b
      text: They cancel out perfectly in pairs, summing to zero.
    - id: c
      text: They equal the external forces.
    answer:
      choiceId: b
    explanation: Every internal pull has an equal and opposite pull on another part of the system. Thus, they sum to $0$.
  - id: step-3
    title: Step 3 — Final Conclusion
    instruction: "Since $\\sum \\vec F_{\\text{int}} = 0$, our equation simplifies to $d\\vec P_{\\text{system}}/dt = \\sum \\vec F_{\\text{ext}}$. \n"
    type: symbolicResponse
    prompt: If the net external force $\sum \vec F_{\text{ext}}$ is exactly zero, what is the value of $d\vec P_{\text{system}}/dt$?
    answer:
      gradingMode: auto
      expectedLatex: 0
      equivalenceMode: expression
      tolerance: 0
    explanation: If the derivative of total momentum is $0$, then total momentum is constant (conserved).
