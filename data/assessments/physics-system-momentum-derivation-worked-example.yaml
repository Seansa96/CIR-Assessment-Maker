- id: sm-we001
  title: Derive system momentum conservation
  problem: Show why the total momentum of a system is constant when its net external force is zero.
  steps:
  - id: sm1-s1
    title: Sum particle momentum changes
    instruction: Differentiate $\vec P=\sum_i\vec p_i$.
    hint:
    type: freeResponse
    prompt: What is $d\vec P/dt$ in terms of forces on all particles?
    choices: []
    answer:
      choiceId:
      choiceIds: []
      expected:
      gradingMode: selfCheck
      expectedLatex:
      equivalenceMode:
      variables: []
      value:
      tolerance:
      media: []
      keyPoints:
      - $d\vec P/dt=\sum_i\vec F_i$
      circuitAnswer:
      graphingAnswer:
    explanation: "Solution: $d\\vec P/dt=\\sum_i\\vec F_i$.\\n\\nWhy it works: Newton's second law gives $d\\vec p_i/dt=\\vec F_i$ for every particle."
    media: []
    language:
    functionName:
    executionMode: unspecified
    starterCode:
    tests:
    issueSignals: []
  - id: sm1-s2
    title: Cancel internal force pairs
    instruction: Separate force sums by system boundary.
    hint:
    type: freeResponse
    prompt: What remains after internal force pairs are summed?
    choices: []
    answer:
      choiceId:
      choiceIds: []
      expected:
      gradingMode: selfCheck
      expectedLatex:
      equivalenceMode:
      variables: []
      value:
      tolerance:
      media: []
      keyPoints:
      - $d\vec P/dt=\sum\vec F_{ext}$
      - net external force
      circuitAnswer:
      graphingAnswer:
    explanation: 'Solution: $d\vec P/dt=\sum\vec F_{\mathrm{ext}}$ because internal action-reaction pairs cancel.\n\nWhy it works: Every internal force has an equal-and-opposite partner within the complete system.'
