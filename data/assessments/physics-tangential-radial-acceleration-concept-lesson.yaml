sections:
- id: introducing-components
  title: Components of Acceleration in 2D Motion
  content: 'When an object moves along a curved path in two dimensions, its velocity
    vector $\vec{v}$ is always tangent to the path. Since acceleration is the rate
    of change of velocity ($\vec{a} = \frac{d\vec{v}}{dt}$), and velocity has both
    **magnitude** (speed) and **direction**, acceleration can change either one (or
    both).


    We often decompose the total acceleration vector $\vec{a}$ into two orthogonal
    (perpendicular) components relative to the path:

    1. **Tangential Acceleration ($a_t$)**

    2. **Radial (Centripetal) Acceleration ($a_r$)**

    '
- id: tangential-acceleration
  title: Tangential Acceleration
  content: '**Tangential acceleration ($a_t$)** is the component of acceleration parallel
    to the velocity vector (tangent to the path). It is responsible for changing the
    **speed** (magnitude of velocity) of the object.


    $$ a_t = \frac{d|\vec{v}|}{dt} = \frac{dv}{dt} $$


    If $a_t$ is in the same direction as velocity, the object speeds up. If it is
    in the opposite direction, the object slows down.

    '
- id: radial-acceleration
  title: Radial (Centripetal) Acceleration
  content: '**Radial acceleration ($a_r$)**, also called centripetal acceleration,
    is the component of acceleration perpendicular to the velocity vector (pointing
    toward the center of curvature). It is responsible for changing the **direction**
    of the object.


    $$ a_r = \frac{v^2}{r} $$

    where $v$ is the current speed and $r$ is the radius of curvature at that point.


    The total acceleration is the vector sum of these two components:

    $$ |\vec{a}| = \sqrt{a_t^2 + a_r^2} $$

    '
lesson:
  introduction: Tangential and Radial Acceleration
  sections:
  - id: sec-q001
    title: A car is driving along a circular track at a **constant** speed of 25 m/s.
      Which of the following statements is true about the car's acceleration?
    content: |
      A car is driving along a circular track at a **constant** speed of 25 m/s. Which of the following statements is true about the car's acceleration?
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: The tangential acceleration is zero, but the radial acceleration is
          non-zero.
      - id: b
        text: Both the tangential and radial accelerations are zero.
      - id: c
        text: The radial acceleration is zero, but the tangential acceleration is
          non-zero.
      - id: d
        text: Both the tangential and radial accelerations are non-zero.
      answer:
        choiceId: a
      explanation: |
        Because the speed is constant, the tangential acceleration ($a_t = dv/dt$) is zero. However, because the car is moving in a circle (changing direction), there must be a radial (centripetal) acceleration ($a_r = v^2/r$) pointing toward the center of the track.
