sections:
- id: introducing-components
  title: Components of Acceleration in 2D Motion
  content: 'When an object moves along a curved path in two dimensions, its velocity
    vector $\vec{v}$ is always tangent to the path. Since acceleration is the rate
    of change of velocity ($\vec{a} = \frac{d\vec{v}}{dt}$), and velocity has both
    **magnitude** (speed) and **direction**, acceleration can change either one (or
    both).


    We often decompose the total acceleration vector $\vec{a}$ into two orthogonal
    (perpendicular) components relative to the path:

    1. **Tangential Acceleration ($a_t$)**

    2. **Radial (Centripetal) Acceleration ($a_r$)**

    '
- id: tangential-acceleration
  title: Tangential Acceleration
  content: '**Tangential acceleration ($a_t$)** is the component of acceleration parallel
    to the velocity vector (tangent to the path). It is responsible for changing the
    **speed** (magnitude of velocity) of the object.


    $$ a_t = \frac{d|\vec{v}|}{dt} = \frac{dv}{dt} $$


    If $a_t$ is in the same direction as velocity, the object speeds up. If it is
    in the opposite direction, the object slows down.

    '
- id: radial-acceleration
  title: Radial (Centripetal) Acceleration
  content: '**Radial acceleration ($a_r$)**, also called centripetal acceleration,
    is the component of acceleration perpendicular to the velocity vector (pointing
    toward the center of curvature). It is responsible for changing the **direction**
    of the object.


    $$ a_r = \frac{v^2}{r} $$

    where $v$ is the current speed and $r$ is the radius of curvature at that point.


    The total acceleration is the vector sum of these two components:

    $$ |\vec{a}| = \sqrt{a_t^2 + a_r^2} $$

    '
lesson:
  introduction: Tangential and Radial Acceleration
  sections:
  - id: sec-q001
    title: A car is driving along a circular track at a **constant** speed of 25 m/s.
      Which of the following statements is true about the car's acceleration?
    content: |
      A car is driving along a circular track at a **constant** speed of 25 m/s. Which of the following statements is true about the car's acceleration?
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: The tangential acceleration is zero, but the radial acceleration is
          non-zero.
      - id: b
        text: Both the tangential and radial accelerations are zero.
      - id: c
        text: The radial acceleration is zero, but the tangential acceleration is
          non-zero.
      - id: d
        text: Both the tangential and radial accelerations are non-zero.
      answer:
        choiceId: a
      explanation: |
        Because the speed is constant, the tangential acceleration ($a_t = dv/dt$) is zero. However, because the car is moving in a circle (changing direction), there must be a radial (centripetal) acceleration ($a_r = v^2/r$) pointing toward the center of the track.
  - id: tra2
    title: Tangential Direction
    content: 'Tangential acceleration lies along or opposite velocity and changes speed.'
    media: []
    check: { id: trac2, type: multipleChoice, prompt: 'If tangential acceleration opposes velocity, an object:', choices: [{ id: a, text: slows down }, { id: b, text: speeds up }, { id: c, text: only turns }, { id: d, text: has no acceleration }], answer: { choiceId: a }, explanation: 'Solution: It slows down.\n\nWhy it works: Opposing tangential acceleration reduces speed.\n\nWhy the other choices fail: Radial, not tangential, acceleration only changes direction.' }
  - id: tra3
    title: Radial Direction
    content: 'Radial acceleration points toward the instantaneous center of curvature and changes direction.'
    media: []
    check: { id: trac3, type: multipleChoice, prompt: 'Radial acceleration is perpendicular to:', choices: [{ id: a, text: velocity }, { id: b, text: radius only }, { id: c, text: mass }, { id: d, text: time }], answer: { choiceId: a }, explanation: 'Solution: Velocity.\n\nWhy it works: Velocity is tangential while radial acceleration points inward.\n\nWhy the other choices fail: The two directions are orthogonal in circular motion.' }
  - id: tra4
    title: Combining Components
    content: 'Because radial and tangential components are perpendicular, total magnitude is $\sqrt{a_t^2+a_r^2}$.'
    media: []
    check: { id: trac4, type: multipleChoice, prompt: 'If $a_t=3$ and $a_r=4$ m/s$^2$, total acceleration is:', choices: [{ id: a, text: '$5$' }, { id: b, text: '$7$' }, { id: c, text: '$1$' }, { id: d, text: '$12$' }], answer: { choiceId: a }, explanation: 'Solution: $\sqrt{3^2+4^2}=5$ m/s$^2$.\n\nWhy it works: Components are perpendicular.\n\nWhy the other choices fail: Do not add or multiply perpendicular components directly.' }
  - id: tra5
    title: Uniform Circular Motion
    content: 'Uniform circular motion has constant speed, so tangential acceleration is zero but radial acceleration remains.'
    media: []
    check: { id: trac5, type: multipleChoice, prompt: 'In uniform circular motion, which component is zero?', choices: [{ id: a, text: tangential acceleration }, { id: b, text: radial acceleration }, { id: c, text: velocity }, { id: d, text: centripetal force }], answer: { choiceId: a }, explanation: 'Solution: Tangential acceleration.\n\nWhy it works: Speed is constant.\n\nWhy the other choices fail: Direction changes, requiring radial acceleration.' }
  - id: tra6
    title: Changing Circular Speed
    content: 'When an object speeds up around a circle, both tangential and radial acceleration can be nonzero.'
    media: []
    check: { id: trac6, type: multipleChoice, prompt: 'A car speeds up around a circular track. Its acceleration has:', choices: [{ id: a, text: radial and tangential components }, { id: b, text: radial only }, { id: c, text: tangential only }, { id: d, text: no components }], answer: { choiceId: a }, explanation: 'Solution: Both components.\n\nWhy it works: It changes both speed and direction.\n\nWhy the other choices fail: Each component accounts for one kind of velocity change.' }
  - id: tra7
    title: Circular-Motion Check
    content: 'Check units and directions: both components use m/s$^2$, but point in different directions.'
    media: []
    check: { id: trac7, type: multipleChoice, prompt: 'What are the units of radial acceleration?', choices: [{ id: a, text: m/s$^2$ }, { id: b, text: m/s }, { id: c, text: N }, { id: d, text: rad }], answer: { choiceId: a }, explanation: 'Solution: m/s$^2$.\n\nWhy it works: It is an acceleration.\n\nWhy the other choices fail: They are speed, force, or angle units.' }
