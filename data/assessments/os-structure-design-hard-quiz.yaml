questions:
- id: q001
  title: Apply Monolithic kernel tradeoff
  type: multipleChoice
  prompt: A system design discussion mentions **Monolithic kernel tradeoff**. Which conclusion is most defensible?
  choices:
  - id: a
    text: Fast internal calls trade against fault isolation.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: Fast internal calls trade against fault isolation. This is why Monolithic kernel tradeoff matters in Operating System Structure and Design.
