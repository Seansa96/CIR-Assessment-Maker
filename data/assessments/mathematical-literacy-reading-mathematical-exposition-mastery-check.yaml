questions:
- id: q001
  type: multipleChoice
  prompt: A passage says “Definition. An integer is even if it equals $2k$ for some integer k.” What is the passage
    doing?
  choices:
  - id: a
    text: Fixing the exact meaning of “even.”
  - id: b
    text: Proving every integer is even.
    issueSignals:
    - id: mathematical-role-confusion
  - id: c
    text: Giving a counterexample.
    issueSignals:
    - id: mathematical-role-confusion
  - id: d
    text: Stating a converse theorem.
    issueSignals:
    - id: mathematical-role-confusion
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-role-confusion
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - proofJustification
  difficultyEvidence: Requires preserving the stated logical direction and evaluating a concrete mathematical-reading
    claim.
  explanation: |-
    Solution: Fixing the exact meaning of “even.”
    Why it works: A definition fixes terminology; it does not by itself assert that every object has the property.
    Why the other choices fail: Each alternative changes the claim’s direction, role, or required evidence.
- id: q002
  type: multipleChoice
  prompt: A theorem has hypotheses H and conclusion C. Which reading is justified before citing the theorem?
  choices:
  - id: a
    text: Verify H in the current situation, then infer C.
  - id: b
    text: Assume C and declare H true.
    issueSignals:
    - id: applicationStrategy-error
  - id: c
    text: Use C whenever a related example appears.
    issueSignals:
    - id: applicationStrategy-error
  - id: d
    text: Replace H with the converse of C.
    issueSignals:
    - id: applicationStrategy-error
  answer:
    choiceId: a
  issueSignals:
  - id: applicationStrategy-error
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - proofJustification
  difficultyEvidence: Requires preserving the stated logical direction and evaluating a concrete mathematical-reading
    claim.
  explanation: |-
    Solution: Verify H in the current situation, then infer C.
    Why it works: Theorem application is conditional: its stated hypotheses must be established before its conclusion is used.
    Why the other choices fail: Each alternative changes the claim’s direction, role, or required evidence.
- id: q003
  type: multipleChoice
  prompt: What is the role of a single example following a definition?
  choices:
  - id: a
    text: It illustrates how the definition applies to one permitted case.
  - id: b
    text: It proves all later theorems.
    issueSignals:
    - id: example-as-proof
  - id: c
    text: It changes the definition.
    issueSignals:
    - id: example-as-proof
  - id: d
    text: It automatically supplies a counterexample.
    issueSignals:
    - id: example-as-proof
  answer:
    choiceId: a
  issueSignals:
  - id: example-as-proof
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - proofJustification
  difficultyEvidence: Requires preserving the stated logical direction and evaluating a concrete mathematical-reading
    claim.
  explanation: |-
    Solution: It illustrates how the definition applies to one permitted case.
    Why it works: An example clarifies a definition locally but cannot establish a universal conclusion by itself.
    Why the other choices fail: Each alternative changes the claim’s direction, role, or required evidence.
- id: q004
  type: multipleChoice
  prompt: A proof cites a theorem but has not checked one of its hypotheses. What should a reader conclude?
  choices:
  - id: a
    text: The conclusion is not yet licensed; the missing hypothesis must be checked.
  - id: b
    text: The theorem becomes a definition.
    issueSignals:
    - id: unjustified-inference
  - id: c
    text: The conclusion is true because it appears after “therefore.”
    issueSignals:
    - id: unjustified-inference
  - id: d
    text: The missing hypothesis can be replaced by an example.
    issueSignals:
    - id: unjustified-inference
  answer:
    choiceId: a
  issueSignals:
  - id: unjustified-inference
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - proofJustification
  difficultyEvidence: Requires preserving the stated logical direction and evaluating a concrete mathematical-reading
    claim.
  explanation: |-
    Solution: The conclusion is not yet licensed; the missing hypothesis must be checked.
    Why it works: A cited theorem supplies a valid step only when all of its conditions hold in the current argument.
    Why the other choices fail: Each alternative changes the claim’s direction, role, or required evidence.
