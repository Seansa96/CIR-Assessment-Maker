lesson:
  introduction: A directional derivative measures change per unit distance in a chosen direction. These checks require
    computing gradients, unit directions, dot products, and geometric consequences.
  sections:
  - id: s01
    title: Build the gradient from partial derivatives
    required: true
    content: The gradient packages all coordinate rates into a vector. For f=x^2+xy at (1,2), first compute f_x=2x+y
      and f_y=x, then evaluate both at the point.
    media:
    - type: image
      src: /media/calculus-3/gradients.svg
      alt: Level curves with a gradient vector normal to the curve and a unit direction vector used for the directional
        derivative.
      caption: The directional rate is the projection of the gradient onto a unit direction.
    check:
      id: check-01
      type: multipleChoice
      prompt: What is grad f(1,2)?
      choices:
      - id: a
        text: <4,1>
        issueSignals: []
      - id: b
        text: <2,1>
        issueSignals:
        - id: vector-component-resolution-error
      - id: c
        text: <4,2>
        issueSignals:
        - id: vector-component-resolution-error
      - id: d
        text: <3,1>
        issueSignals:
        - id: vector-component-resolution-error
      answer:
        choiceId: a
      explanation: 'Solution: <4,1>


        Why it works: The gradient is <f_x,f_y>; at (1,2) the components are 4 and 1.


        Why the other choices fail:

        Choice b: This evaluates f_x but omits the y term in 2x+y.

        Choice c: This uses y=2 for f_y instead of f_y=x=1.

        Choice d: This substitutes 1 for 2x in f_x=2x+y.'
      issueSignals:
      - id: vector-component-resolution-error
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
  - id: s02
    title: Normalize the requested direction
    required: true
    content: A direction vector's length changes the rate scale. For v=<6,8>, its magnitude is 10, so its unit vector
      is v/|v|.
    media: []
    check:
      id: check-02
      type: multipleChoice
      prompt: What unit vector points in the direction <6,8>?
      choices:
      - id: a
        text: <3/5,4/5>
        issueSignals: []
      - id: b
        text: <3/5,8>
        issueSignals:
        - id: vector-component-resolution-error
      - id: c
        text: <3/4,4/5>
        issueSignals:
        - id: vector-component-resolution-error
      - id: d
        text: <6,8>
        issueSignals:
        - id: vector-component-resolution-error
      answer:
        choiceId: a
      explanation: 'Solution: <3/5,4/5>


        Why it works: Dividing both components by sqrt(6^2+8^2)=10 gives <3/5,4/5>.


        Why the other choices fail:

        Choice b: This divides the x component but leaves the y component unchanged.

        Choice c: This divides x by 8 instead of by the vector length 10.

        Choice d: This leaves the vector at length 10 rather than unit length.'
      issueSignals:
      - id: vector-component-resolution-error
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
  - id: s03
    title: Compute a directional derivative
    required: true
    content: For a unit vector u, D_u f=grad f dot u. With grad f(1,2)=<4,1> and u=<3/5,4/5>, multiply matching
      components and add.
    media: []
    check:
      id: check-03
      type: multipleChoice
      prompt: What is D_u f at this point?
      choices:
      - id: a
        text: 16/5
        issueSignals: []
      - id: b
        text: 13/5
        issueSignals:
        - id: vector-component-resolution-error
      - id: c
        text: '5'
        issueSignals:
        - id: vector-component-resolution-error
      - id: d
        text: 4/5
        issueSignals:
        - id: vector-component-resolution-error
      answer:
        choiceId: a
      explanation: 'Solution: 16/5


        Why it works: The dot product is 4(3/5)+1(4/5)=16/5.


        Why the other choices fail:

        Choice b: This subtracts the second path contribution instead of adding it.

        Choice c: This adds the gradient components without using u.

        Choice d: This uses only the y contribution.'
      issueSignals:
      - id: vector-component-resolution-error
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
  - id: s04
    title: Find the greatest rate and its direction
    required: true
    content: The Cauchy-Schwarz inequality bounds grad f dot u by |grad f| for every unit u. Equality occurs when
      u points in the gradient direction.
    media: []
    check:
      id: check-04
      type: multipleChoice
      prompt: For grad f=<6,8>, what is the maximum directional derivative?
      choices:
      - id: a
        text: '10'
        issueSignals: []
      - id: b
        text: '14'
        issueSignals:
        - id: vector-component-resolution-error
      - id: c
        text: '2'
        issueSignals:
        - id: vector-component-resolution-error
      - id: d
        text: '100'
        issueSignals:
        - id: vector-component-resolution-error
      answer:
        choiceId: a
      explanation: 'Solution: 10


        Why it works: The maximum is |grad f|=sqrt(6^2+8^2)=10.


        Why the other choices fail:

        Choice b: This adds the component magnitudes instead of taking the Euclidean norm.

        Choice c: This subtracts the components.

        Choice d: This reports the squared magnitude.'
      issueSignals:
      - id: vector-component-resolution-error
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
  - id: s05
    title: Relate the gradient to a level curve
    required: true
    content: Along a level curve f(x,y)=c, the function does not change. A tangent vector is therefore perpendicular
      to the gradient where the gradient is nonzero.
    media: []
    check:
      id: check-05
      type: multipleChoice
      prompt: If grad f(1,2)=<3,4>, which vector is tangent to the level curve at that point?
      choices:
      - id: a
        text: <4,-3>
        issueSignals: []
      - id: b
        text: <3,4>
        issueSignals:
        - id: vector-component-resolution-error
      - id: c
        text: <3,-4>
        issueSignals:
        - id: vector-component-resolution-error
      - id: d
        text: <-4,-3>
        issueSignals:
        - id: vector-component-resolution-error
      answer:
        choiceId: a
      explanation: 'Solution: <4,-3>


        Why it works: The dot product <3,4>·<4,-3>=12-12=0.


        Why the other choices fail:

        Choice b: This is the normal gradient itself, not a tangent vector.

        Choice c: Its dot product with <3,4> is -7, not zero.

        Choice d: Its dot product with <3,4> is -24, not zero.'
      issueSignals:
      - id: vector-component-resolution-error
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
  - id: s06
    title: Use the sign to interpret motion
    required: true
    content: The sign of D_u f tells whether f increases or decreases as you move in direction u. A negative value
      means the directional component points partly against the gradient.
    media: []
    check:
      id: check-06
      type: multipleChoice
      prompt: If grad f=<2,-1> and u=<0,1>, what is D_u f?
      choices:
      - id: a
        text: '-1'
        issueSignals: []
      - id: b
        text: '1'
        issueSignals:
        - id: vector-component-resolution-error
      - id: c
        text: sqrt(5)
        issueSignals:
        - id: vector-component-resolution-error
      - id: d
        text: '0'
        issueSignals:
        - id: vector-component-resolution-error
      answer:
        choiceId: a
      explanation: 'Solution: -1


        Why it works: The dot product is 2(0)+(-1)(1)=-1, so f decreases in that direction.


        Why the other choices fail:

        Choice b: This reverses the y component''s sign.

        Choice c: This gives the maximum rate magnitude, not the rate in the stated direction.

        Choice d: This treats the perpendicular x component as the only contribution.'
      issueSignals:
      - id: vector-component-resolution-error
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
  - id: s07
    title: Read contour spacing and gradient direction
    required: true
    content: The gradient is normal to a level curve, and closer contour spacing indicates a larger rate of change
      per unit distance. Its arrow points toward increasing function values.
    media: []
    check:
      id: check-07
      type: multipleChoice
      prompt: At a point, grad f=<0,5>. Which direction gives the greatest increase?
      choices:
      - id: a
        text: <0,1>
        issueSignals: []
      - id: b
        text: <1,0>
        issueSignals:
        - id: vector-component-resolution-error
      - id: c
        text: <0,-1>
        issueSignals:
        - id: vector-component-resolution-error
      - id: d
        text: <5,0>
        issueSignals:
        - id: vector-component-resolution-error
      answer:
        choiceId: a
      explanation: 'Solution: <0,1>


        Why it works: The greatest increase follows the positive gradient direction; its unit direction is <0,1>.


        Why the other choices fail:

        Choice b: This is perpendicular to the gradient and gives zero first-order change.

        Choice c: This points opposite the gradient and gives the greatest decrease.

        Choice d: This is not parallel to the gradient <0,5>.'
      issueSignals:
      - id: vector-component-resolution-error
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
  - id: s08
    title: Extend the gradient calculation to three variables
    required: true
    content: For f(x,y,z), the gradient contains all three partial derivatives. Compute each while holding the other
      two inputs fixed, then evaluate at the requested point.
    media: []
    check:
      id: check-08
      type: multipleChoice
      prompt: For f=x^2+yz+3z^2 at (1,2,-1), what is grad f?
      choices:
      - id: a
        text: <2,-1,-4>
        issueSignals: []
      - id: b
        text: <2,-1,2>
        issueSignals:
        - id: vector-component-resolution-error
      - id: c
        text: <2,2,-4>
        issueSignals:
        - id: vector-component-resolution-error
      - id: d
        text: <2,-1,1>
        issueSignals:
        - id: vector-component-resolution-error
      answer:
        choiceId: a
      explanation: 'Solution: <2,-1,-4>


        Why it works: The partials are 2x, z, y+6z, which evaluate to 2,-1,-4.


        Why the other choices fail:

        Choice b: This evaluates 6z at z=0 instead of -1.

        Choice c: This substitutes y=2 for z in f_y=z.

        Choice d: This uses y+z instead of y+6z for the z partial.'
      issueSignals:
      - id: vector-component-resolution-error
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
