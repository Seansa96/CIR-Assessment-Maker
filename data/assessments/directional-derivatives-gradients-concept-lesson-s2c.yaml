    - type: image
      src: /media/calculus-3/gradients.svg
      alt: Original directional derivatives and gradients reference visual.
      caption: 
    check:
      id: check-01
      type: multipleChoice
      prompt: What is $\nabla f$ in two variables?
      choices:
      - id: a
        text: (fx,fy)
        media: []
