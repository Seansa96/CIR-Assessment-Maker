          domains: []
      - id: c
        text: the gradient direction (answers 'What direction maximizes increase?', not 'What is $\nabla f$ in two variables?')
        media: []
        issueSignals:
        - id: vector-component-resolution-error
          domains: []
      - id: d
        text: magnitude of gradient (answers 'What is the maximum rate?', not 'What is $\nabla f$ in two variables?')
        media: []
        issueSignals:
        - id: vector-component-resolution-error
          domains: []
