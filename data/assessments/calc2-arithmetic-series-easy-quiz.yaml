- id: q001
  type: multipleChoice
  skills:
  - find-arithmetic-sequence-terms
  prompt: 'An arithmetic sequence has $a_1=7$ and common difference $4$. What is

    $a_{12}$?

    '
  choices:
  - id: a
    text: $51$
  - id: b
    text: $55$
  - id: c
    text: $48$
  - id: d
    text: $44$
  answer:
    choiceId: a
  explanation: 'Solution: The twelfth term is $7+11(4)=51$ because there are eleven differences after the first term. Therefore the answer is $51$.


    Why it works: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$. For a finite sum, use $S_n=n(a_1+a_n)/2$ after identifying the correct first and last terms.


    Common trap: The $n$th term has $(n-1)d$, not $nd$; distinguish the number of terms from the index of the final term.


    Why the other choices fail: $55$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; $48$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; $44$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$.'
