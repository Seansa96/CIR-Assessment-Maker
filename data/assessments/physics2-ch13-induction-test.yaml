questions:
- id: q001
  type: numericResponse
  difficultyDimensions:
  - calculation-complexity
  - multi-step
  prompt: A square coil of wire with 50 turns and side length $0.20\text{ m}$ is in a uniform magnetic
    field that is perpendicular to the plane of the coil. The magnetic field decreases from $1.0\text{
    T}$ to $0.2\text{ T}$ in $0.4\text{ s}$. What is the magnitude of the average induced EMF in the coil
    (in Volts)?
  answer:
    tolerance: 0.1
    value: 4.0
  explanation: 'Solution:

    1) Calculate area: $A = 0.20 \times 0.20 = 0.04\text{ m}^2$.

    2) Calculate change in flux for one turn: $\Delta\Phi_B = A \Delta B = 0.04 \times (0.2 - 1.0) = -0.032\text{
    Wb}$.

    3) Apply Faraday''s Law: $|\mathcal{E}| = N \frac{|\Delta\Phi_B|}{\Delta t} = 50 \frac{0.032}{0.4}
    = 50 \times 0.08 = 4.0\text{ V}$.


    Why it works:

    The total induced EMF is proportional to the number of turns and the rate of change of the magnetic
    flux through each turn.'
