items:
  - id: direct-zero-zero
    type: flashcard
    prompt: What does the form $\frac{0}{0}$ usually tell you?
    answer:
      expected: It is an indeterminate quotient form; L'Hopital's Rule may apply if the hypotheses are met.
    explanation: |
      The numerator and denominator both vanish, so direct substitution does not determine the limit.
    tags:
      - indeterminate-forms
      - zero-over-zero
  - id: direct-infinity-infinity
    type: flashcard
    prompt: What does the form $\frac{\infty}{\infty}$ usually tell you?
    answer:
      expected: It is an indeterminate quotient form; compare growth rates, often by L'Hopital's Rule.
    explanation: |
      The numerator and denominator both grow without bound, so the quotient could approach $0$, a finite nonzero number, infinity, or fail to exist.
    tags:
      - indeterminate-forms
      - infinity-over-infinity
  - id: product-zero-infinity
    type: cloze
    prompt: |
      Complete the conversion idea:

      A $0\cdot\infty$ product should often be rewritten as a ______ before using L'Hopital's Rule.
    answer:
      expected: quotient
      aliases:
        - fraction
        - ratio
    explanation: |
      Move one factor into the denominator, such as $fg=\frac{f}{1/g}$ or $fg=\frac{g}{1/f}$.
    tags:
      - product-form
      - conversion
  - id: infinity-minus-infinity
    type: typed
    prompt: What are two common moves for an $\infty-\infty$ form?
    answer:
      expected: Combine over a common denominator, rationalize, factor dominant terms, or combine logarithms.
      aliases:
        - common denominator and rationalize
        - combine fractions and rationalize
        - factor dominant terms
    explanation: |
      The goal is to expose cancellation and convert the expression into a quotient or simpler equivalent form.
    tags:
      - difference-form
      - conversion
  - id: power-forms-list
    type: flashcard
    prompt: Which power forms are indeterminate?
    answer:
      expected: $0^0$, $1^\infty$, and $\infty^0$.
    explanation: |
      These forms are handled by setting $y=f(x)^{g(x)}$, taking $\ln y=g(x)\ln f(x)$, evaluating that limit, then exponentiating.
    tags:
      - power-forms
      - logarithmic-rewriting
  - id: one-to-infinity-move
    type: cloze
    prompt: For a $1^\infty$ form, set $y$ equal to the expression and analyze ______.
    answer:
      expected: ln y
      aliases:
        - \ln y
        - the logarithm
        - natural log of y
    explanation: |
      Logarithms bring the exponent down so the form can become a product or quotient limit.
    tags:
      - power-forms
      - logarithmic-rewriting
  - id: not-indeterminate-zero-over-infinity
    type: flashcard
    prompt: Is $\frac{0}{\infty}$ indeterminate?
    answer:
      expected: No. It tends to $0$.
    explanation: |
      A numerator tending to zero divided by an unbounded denominator tends to zero under ordinary limit interpretation.
    tags:
      - determinate-forms
  - id: not-indeterminate-finite-over-zero
    type: flashcard
    prompt: Is $\frac{5}{0}$ an indeterminate L'Hopital form?
    answer:
      expected: No. It indicates unbounded or one-sided divergent behavior, depending on signs.
    explanation: |
      L'Hopital's Rule is not for finite nonzero over zero.
    tags:
      - determinate-forms
  - id: repeated-application
    type: typed
    prompt: When may L'Hopital's Rule be applied a second time?
    answer:
      expected: When the derivative quotient still has an indeterminate form such as $0/0$ or $\infty/\infty$.
      aliases:
        - if it is still 0/0 or infinity/infinity
        - when the new quotient is still indeterminate
    explanation: |
      Each application needs its own valid diagnosis.
    tags:
      - repeated-lhopital
  - id: quotient-rule-warning
    type: cloze
    prompt: L'Hopital's Rule differentiates numerator and denominator separately; it does not use the ______ rule.
    answer:
      expected: quotient
    explanation: |
      $\frac{f}{g}$ becomes $\frac{f'}{g'}$, not $\frac{f'g-fg'}{g^2}$.
    tags:
      - quotient-rule-warning
  - id: improper-integral-connection
    type: flashcard
    prompt: Why does L'Hopital's Rule show up in improper integral problems?
    answer:
      expected: Improper integrals are evaluated with endpoint limits, and those endpoint limits may be indeterminate.
    explanation: |
      After finding an antiderivative, the remaining endpoint expression may involve forms like $\infty e^{-\infty}$, $0\cdot\infty$, or $\frac{\infty}{\infty}$.
    tags:
      - calc1-differentiation-theorems
      - endpoint-limits
  - id: diagnosis-first
    type: cloze
    prompt: Before using L'Hopital's Rule, first diagnose the limiting ______.
    answer:
      expected: form
    explanation: |
      The form tells you whether L'Hopital applies directly, requires rewriting, or should not be used.
    tags:
      - limit-diagnosis
