questions:
- id: q001
  type: numericResponse
  prompt: |
    Planet A and Planet B orbit the same star. Planet A has an orbital radius exactly 4 times the orbital radius of Planet B ($r_A = 4 r_B$). 
    What is the ratio of their orbital periods ($T_A / T_B$)?
  answer:
    value: 8
    tolerance: 0.1
  explanation: |
    Solution:
    By Kepler's Third Law, $T^2 \propto r^3$.
    Therefore, $(T_A / T_B)^2 = (r_A / r_B)^3$.
    $(T_A / T_B)^2 = (4)^3 = 64$.
    $T_A / T_B = \sqrt{64} = 8$.
    
    Why it works:
    Because $T$ scales with $r^{3/2}$, multiplying the radius by 4 multiplies the period by $4^{3/2} = 8$.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
- id: q002
  type: multipleChoice
  prompt: |
    If a satellite uses its thrusters to decelerate and move from a higher circular orbit to a lower circular orbit, what happens to its constant orbital speed in the new orbit?
  choices:
  - id: a
    text: 'Its orbital speed decreases.'
  - id: b
    text: 'Its orbital speed increases.'
  - id: c
    text: 'Its orbital speed remains the same.'
  - id: d
    text: 'It depends on the mass of the satellite.'
  answer:
    choiceId: b
  explanation: |
    Solution:
    Its orbital speed increases.
    
    Why it works:
    Orbital speed is given by $v = \sqrt{GM/r}$. Since $r$ is in the denominator, a smaller orbital radius (a lower orbit) requires a higher orbital speed. This leads to the counter-intuitive "orbital paradox": to speed up, a satellite must decelerate to drop to a lower orbit, where gravity then pulls it into a faster trajectory.
    
    Why the other choices fail:
    While it takes a deceleration burn to drop altitude, the resulting stable circular orbit at the lower altitude mandates a higher constant velocity.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
