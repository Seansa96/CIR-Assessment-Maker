authoring: { visualRequirement: required, visualRationale: 'Cell diagrams make electrode roles and charge flow explicit.', sourceId: src-20260720035703-91ea51b0d8 }
lesson:
  introduction: 'Electrochemistry connects conserved electron transfer to measurable voltage and practical electrical work.'
  sections:
    - { id: redox, title: Oxidation and reduction are paired, required: true, content: 'Oxidation loses electrons; reduction gains them. The oxidizing agent is reduced and the reducing agent is oxidized.', check: { id: c1, type: multipleChoice, prompt: 'In $Zn+Cu^{2+}\rightarrow Zn^{2+}+Cu$, which species is oxidized?', choices: [{ id: a, text: Zn }, { id: b, text: '$Cu^{2+}$' }, { id: c, text: Cu }], answer: { choiceId: a }, explanation: 'Solution: Zn is oxidized. Why it works: Its oxidation number rises from 0 to +2 as it loses electrons. Why the other choices fail: $Cu^{2+}$ is reduced; Cu is its product.' } }
    - { id: balance, title: Half-reactions conserve mass and charge, required: true, content: 'In acidic solution, balance non-H/O atoms, O with water, H with $H^+$, charge with electrons, then cancel electrons.', check: { id: c2, type: multipleChoice, prompt: 'What balances charge in a half-reaction?', choices: [{ id: a, text: electrons }, { id: b, text: coefficients on only neutral species }, { id: c, text: changing subscripts }], answer: { choiceId: a }, explanation: 'Solution: Electrons balance charge. Why it works: Electron coefficients conserve transferred charge. Why the other choices fail: b cannot generally balance charge; c changes chemical identities.' } }
    - id: galvanic
      title: A galvanic cell separates a spontaneous redox reaction
      required: true
      content: 'Oxidation occurs at the negative anode and reduction at the positive cathode; electrons flow externally from anode to cathode.'
      media: [{ type: image, src: /media/chemistry/electrochemistry-galvanic-cell.svg, alt: Zinc-copper galvanic cell showing electrodes, electron direction, and salt bridge., caption: Electrons leave the zinc anode and enter the copper cathode. }]
      check: { id: c3, type: multipleChoice, prompt: 'Where does reduction occur in a galvanic cell?', choices: [{ id: a, text: cathode }, { id: b, text: anode }, { id: c, text: salt bridge }], answer: { choiceId: a }, explanation: 'Solution: At the cathode. Why it works: Cathode is defined by reduction. Why the other choices fail: anode is oxidation; the salt bridge carries ions.' }
    - { id: circuit, title: Electrons and ions complete different parts of the circuit, required: true, content: 'Electrons travel through the wire. Salt-bridge ions migrate to prevent charge buildup in each half-cell.', check: { id: c4, type: multipleChoice, prompt: 'What is the salt bridge’s essential role?', choices: [{ id: a, text: maintain electrical neutrality by ion migration }, { id: b, text: carry electrons between electrodes }, { id: c, text: supply the cell’s voltage }], answer: { choiceId: a }, explanation: 'Solution: It maintains electrical neutrality. Why it works: Ion migration offsets solution charge changes. Why the other choices fail: b assigns wire behavior to ions; c confuses circuit completion with driving force.' } }
    - { id: potential, title: Potential links composition to driving force, required: true, content: 'Use $E^\circ_{cell}=E^\circ_{red,cathode}-E^\circ_{red,anode}$. At 25 C, $E=E^\circ-(0.05916/n)\log Q$.', check: { id: c5, type: multipleChoice, prompt: 'For a cell with positive $E^\circ$, increasing Q above 1 does what to E at 25 C?', choices: [{ id: a, text: decreases E }, { id: b, text: increases E }, { id: c, text: leaves E unchanged }], answer: { choiceId: a }, explanation: 'Solution: It decreases E. Why it works: A positive logarithm is subtracted in the Nernst equation. Why the other choices fail: b reverses the correction; c ignores composition.' } }
    - id: electrolysis
      title: Electrolysis uses electrical energy to drive chemistry
      required: true
      content: 'An external source drives a nonspontaneous reaction. Oxidation still occurs at the anode and reduction at the cathode; $q=It$ connects operation to amount reacted.'
      media: [{ type: image, src: /media/chemistry/electrochemistry-electrolytic-cell.svg, alt: Electrolytic cell with external power supply and labeled electrode reactions., caption: Electrode reaction names persist even though electrode signs reverse. }]
      check: { id: c6, type: multipleChoice, prompt: 'Which statement remains true in an electrolytic cell?', choices: [{ id: a, text: oxidation occurs at the anode }, { id: b, text: the anode is always negative }, { id: c, text: the reaction is spontaneous without power }], answer: { choiceId: a }, explanation: 'Solution: Oxidation occurs at the anode. Why it works: Electrode names are defined by reaction type. Why the other choices fail: b imports galvanic signs; c contradicts the need for external energy.' }
