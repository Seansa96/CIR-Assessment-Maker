questions:
  - { id: q001, type: symbolicResponse, prompt: 'Use disks to find the volume from rotating $y=x$ on $0\le x\le2$ about the x-axis.', answer: { expectedLatex: '8\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $R=x$, so $V=\pi\int_0^2x^2dx=\pi[x^3/3]_0^2=8\pi/3$. Why it works: Perpendicular slices form disks. Common trap: A disk area is $\pi R^2$, not $\pi R$.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Forms a disk area from a graph radius and evaluates a definite integral.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q002, type: symbolicResponse, prompt: 'Rotate the rectangle $0\le x\le2$, $1\le y\le3$ about the x-axis. Find its volume.', answer: { expectedLatex: '16\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $R=3$ and $r=1$, so $V=\pi\int_0^2(9-1)dx=16\pi$. Why it works: The rectangle leaves a cylindrical hole, so every slice is a washer. Common trap: A disk would ignore the inner radius 1.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Identifies a hole and transfers rectangle boundaries into washer radii.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q003, type: symbolicResponse, prompt: 'Use shells to rotate the region under $y=4-x$ on $0\le x\le4$ about the y-axis.', answer: { expectedLatex: '64\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Shell radius is x and height is $4-x$, so $V=2\pi\int_0^4x(4-x)dx=2\pi[2x^2-x^3/3]_0^4=64\pi/3$. Why it works: Vertical strips are parallel to the y-axis and roll into shells. Common trap: The shell height is the y-value, not the radius.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Builds circumference-times-height and integrates its product.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q004, type: symbolicResponse, prompt: 'The base has width $2x$ on $0\le x\le2$. Cross sections are squares. Find the volume.', answer: { expectedLatex: '32/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Square area is $(2x)^2=4x^2$, so $V=\int_0^24x^2dx=32/3$. Why it works: The cross-sectional area, not the width, is accumulated. Common trap: $\int2x\,dx$ has area units, not volume units.', difficultyDimensions: [modelOrDerivation, simplification], difficultyEvidence: 'Converts a changing width into an area and simplifies before integrating.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q005, type: symbolicResponse, prompt: 'Use horizontal washers to rotate the region under $y=\sqrt{x}$ on $0\le x\le4$ about the y-axis.', answer: { expectedLatex: '128\pi/5', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Write $x=y^2$, $0\le y\le2$. A washer has $R=4$, $r=y^2$, so $V=\pi\int_0^2(16-y^4)dy=128\pi/5$. Why it works: Horizontal slices are perpendicular to the y-axis. Common trap: Vertical slices would form shells, not washers.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Inverts the curve and changes slice orientation to form washers.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q006, type: symbolicResponse, prompt: 'Use shells to rotate the region under $y=x$ on $0\le x\le2$ about $x=3$.', answer: { expectedLatex: '20\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Radius is $3-x$ and height is x. Thus $V=2\pi\int_0^2(3-x)x\,dx=2\pi[3x^2/2-x^3/3]_0^2=20\pi/3$. Why it works: Radius is distance to the shifted axis. Common trap: Using x as radius assumes the axis is x=0.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Measures to an offset axis and integrates a shell product.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q007, type: symbolicResponse, prompt: 'A solid has equilateral-triangle cross sections of constant side 2 for $0\le x\le3$. Find its volume.', answer: { expectedLatex: '3\sqrt{3}', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: One cross-sectional area is $\sqrt3(2)^2/4=\sqrt3$, so $V=\int_0^3\sqrt3\,dx=3\sqrt3$. Why it works: Volume is area times accumulated thickness. Common trap: The triangle area is not its side squared without the $\sqrt3/4$ factor.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Applies a geometric area formula then accumulates a constant cross section.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q008, type: symbolicResponse, prompt: 'Rotate the region between $y=x$ and $y=2$ on $0\le x\le2$ about the x-axis. Find the volume.', answer: { expectedLatex: '16\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $R=2$ and $r=x$, so $V=\pi\int_0^2(4-x^2)dx=\pi[4x-x^3/3]_0^2=16\pi/3$. Why it works: The region is away from the axis except at x=0, so its slices are washers. Common trap: $(2-x)^2$ is not the washer area.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Separates outer and inner radii and integrates a squared-radius difference.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q009, type: symbolicResponse, prompt: 'Rotate $0\le x\le3$, $0\le y\le4$ about $y=2$. Find the volume.', answer: { expectedLatex: '12\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: The axis lies midway in the rectangle, so each vertical slice makes a disk of radius 2. $V=\pi(2)^2(3)=12\pi$. Why it works: Both sides of the axis fill the same disk, not two separate disks. Common trap: Adding two radius-2 disks double-counts the rotated solid.', difficultyDimensions: [representationTransfer, globalLocalReasoning], difficultyEvidence: 'Recognizes an interior axis and avoids double-counting overlapping rotation.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q010, type: symbolicResponse, prompt: 'Use shells to rotate the region under $y=x^2$ on $0\le x\le2$ about the y-axis.', answer: { expectedLatex: '8\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $V=2\pi\int_0^2x(x^2)dx=2\pi[x^4/4]_0^2=8\pi$. Why it works: Radius x times height $x^2$ gives a shell volume density. Common trap: Do not include $\pi x^2$; that is disk area, not shell circumference.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Forms a cubic shell integrand and applies the power rule.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q011, type: symbolicResponse, prompt: 'Give a washer setup, without evaluating, for rotating the region between $y=x^2$ and $y=4$ on $0\le x\le2$ about the x-axis.', answer: { expectedLatex: '\pi\int_0^2(16-x^4)dx', equivalenceMode: expression, variables: [x], tolerance: 0.000001 }, explanation: 'Solution: $R=4$ and $r=x^2$, hence $V=\pi\int_0^2(16-x^4)dx$. Why it works: Washer area is $\pi(R^2-r^2)$. Common trap: Bounds are x-values 0 and 2, not y-values 0 and 4.', difficultyDimensions: [modelOrDerivation, domainCondition], difficultyEvidence: 'Finds the intersection bound and builds an annular cross-sectional formula.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q012, type: symbolicResponse, prompt: 'A solid has semicircular cross sections with constant diameter 2 along an interval of length 4. Find its volume.', answer: { expectedLatex: '2\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Radius is 1, so a semicircle area is $\pi(1)^2/2=\pi/2$. Multiply by length 4: $V=2\pi$. Why it works: Constant cross sections make the integral area times interval length. Common trap: Diameter 2 means radius 1.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Converts a diameter to radius and applies a semicircle area formula.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q013, type: symbolicResponse, prompt: 'Use shells to rotate $y=x$ on $0\le x\le1$ about the y-axis.', answer: { expectedLatex: '2\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $V=2\pi\int_0^1x^2dx=2\pi/3$. Why it works: Radius and height both equal x. Common trap: The shell integrand is $2\pi rh$, not $\pi r^2$.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Builds a shell product and evaluates an elementary definite integral.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q014, type: symbolicResponse, prompt: 'The base is a rectangle of width 4 and length 5. Cross sections perpendicular to the length are circles with diameter 4. Find the volume.', answer: { expectedLatex: '20\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Radius is 2, so each circle area is $4\pi$. Over length 5, $V=20\pi$. Why it works: Every perpendicular section is the same circle. Common trap: Diameter 4 does not give area $16\pi$; circle area uses the radius.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Identifies a constant cross-section family and converts diameter to radius.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q015, type: freeResponse, prompt: 'Explain why shells are usually more direct than washers for rotating a region given as $y=f(x)$ about the y-axis, and state the shell formula.', answer: { gradingMode: selfCheck, keyPoints: ['vertical slices are parallel to y axis', 'radius x or distance to axis', 'two pi integral radius height dx'] }, explanation: 'Solution: Vertical $dx$ strips are parallel to the y-axis and become shells, so $V=2\pi\int r(x)h(x)dx$. Why it works: The given function already supplies vertical height without solving for x in terms of y. Common trap: This is a convenience rule, not a prohibition against horizontal washers.', difficultyDimensions: [representationTransfer, reverseReasoning], difficultyEvidence: 'Compares representations and justifies method selection from the given function form.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q016, type: freeResponse, prompt: 'A student uses $A(x)=2x$ as the area of square cross sections whose side is $2x$. Diagnose and correct the area model.', answer: { gradingMode: selfCheck, keyPoints: ['two x is side not area', 'area is four x squared', 'square area side squared'] }, explanation: 'Solution: $2x$ is a length. A square area is $(2x)^2=4x^2$. Why it works: Cross-sectional area must have squared length units before multiplication by $dx$. Common trap: Integrating a width directly produces an area-like quantity, not volume.', difficultyDimensions: [errorDiagnosis, modelOrDerivation], difficultyEvidence: 'Uses units and a geometric formula to repair a flawed cross-section model.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q017, type: symbolicResponse, prompt: 'Use disks to rotate $y=\sqrt{x}$ on $0\le x\le4$ about the x-axis.', answer: { expectedLatex: '8\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $R=\sqrt{x}$, so $V=\pi\int_0^4x\,dx=8\pi$. Why it works: Squaring the disk radius cancels the radical. Common trap: Do not integrate $\sqrt{x}$ itself; that is radius, not area.', difficultyDimensions: [simplification, modelOrDerivation], difficultyEvidence: 'Transforms a radical radius into a simple disk-area integrand.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q018, type: symbolicResponse, prompt: 'Use shells to rotate $y=2x$ on $0\le x\le2$ about the y-axis.', answer: { expectedLatex: '32\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $V=2\pi\int_0^2x(2x)dx=4\pi[x^3/3]_0^2=32\pi/3$. Why it works: The height comes from the linear graph and the radius is x. Common trap: The factor 2 in height remains outside the integral only after the shell model is formed.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Builds and integrates a scaled shell product.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q019, type: symbolicResponse, prompt: 'Rotate the region under $y=\sqrt{x}$ on $0\le x\le1$ about the x-axis. Find the volume.', answer: { expectedLatex: '\pi/2', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $V=\pi\int_0^1(\sqrt{x})^2dx=\pi\int_0^1x\,dx=\pi/2$. Why it works: The disk radius is $\sqrt{x}$, so its squared radius is x. Common trap: The answer is volume, so retain the factor $\pi$.', difficultyDimensions: [simplification, modelOrDerivation], difficultyEvidence: 'Squares a radical radius and accumulates disk areas.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q020, type: symbolicResponse, prompt: 'Set up the shell integral for rotating the region between $y=x$ and $y=2x$ on $0\le x\le1$ about the y-axis.', answer: { expectedLatex: '2\pi\int_0^1x^2dx', equivalenceMode: expression, variables: [x], tolerance: 0.000001 }, explanation: 'Solution: Radius is x and height is $2x-x=x$, hence $V=2\pi\int_0^1x^2dx$. Why it works: Shell height is top minus bottom. Common trap: $2x$ alone ignores the lower boundary.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Determines curve order and transfers vertical height to a shell formula.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
