glossary:
  introduction: |-
    Complex-number vocabulary describes a precise component system. Each term below is paired with the algebraic consequence that makes it useful in a solution.
  sections:
  - id: representation-and-operations
    title: Representation and Operations
    required: true
    content: Complex standard form makes equality and arithmetic componentwise.
    entries:
    - id: imaginary-unit
      term: Imaginary Unit
      definition: The number $i$ defined by $i^2=-1$.
      notation: '$i$'
      examples: ['$i^3=-i$.']
      aliases: []
      media: []
      tags: [imaginary-unit]
      drills:
      - id: imaginary-unit-drill
        type: typed
        prompt: What defining equation does the imaginary unit satisfy?
        answer:
          expected: i^2=-1
          aliases: ['$i^2=-1$']
        explanation: This relation reduces every higher power of $i$.
        tags: [imaginary-unit]
    - id: complex-number
      term: Complex Number
      definition: A number expressible uniquely as $a+bi$, where $a,b$ are real.
      notation: '$a+bi$'
      examples: ['$-3+7i$ is a complex number with two nonzero components.']
      aliases: []
      media: []
      tags: [complex-number]
      drills:
      - id: complex-number-drill
        type: typed
        prompt: What is the standard algebraic form of a complex number?
        answer:
          expected: a+bi
          aliases: ['$a+bi$']
        explanation: The coefficients $a,b$ are real.
        tags: [complex-number]
    - id: real-part
      term: Real Part
      definition: The real coefficient $a$ in $z=a+bi$.
      notation: '$\operatorname{Re}(z)=a$'
      examples: ['The real part of $-8+3i$ is $-8$.']
      aliases: [real component]
      media: []
      tags: [real-part]
      drills:
      - id: real-part-drill
        type: typed
        prompt: Give the real part of $4-9i$.
        answer:
          expected: '4'
          aliases: [four]
        explanation: The real part is the coefficient without $i$.
        tags: [real-part]
    - id: imaginary-part
      term: Imaginary Part
      definition: The real coefficient $b$ in $z=a+bi$, not the entire term $bi$.
      notation: '$\operatorname{Im}(z)=b$'
      examples: ['The imaginary part of $-8+3i$ is 3.']
      aliases: [imaginary component]
      media: []
      tags: [imaginary-part]
      drills:
      - id: imaginary-part-drill
        type: typed
        prompt: Give the imaginary part of $4-9i$.
        answer:
          expected: '-9'
          aliases: [negative nine]
        explanation: The imaginary part is the real coefficient multiplying $i$.
        tags: [imaginary-part]
    - id: componentwise-equality
      term: Componentwise Equality
      definition: The rule that $a+bi=c+di$ if and only if $a=c$ and $b=d$.
      notation: '$a+bi=c+di\iff a=c,\ b=d$'
      examples: ['From $x+yi=2-5i$, conclude $x=2$ and $y=-5$.']
      aliases: [equality of complex numbers]
      media: []
      tags: [complex-equality]
      drills:
      - id: componentwise-equality-drill
        type: flashcard
        prompt: When are two complex numbers in standard form equal?
        answer:
          expected: Their real parts are equal and their imaginary parts are equal.
        explanation: Standard form is unique.
        tags: [complex-equality]
    - id: power-cycle
      term: Power Cycle of i
      definition: The period-four repetition $1,i,-1,-i$ in successive integer powers of $i$.
      notation: '$i^{n+4}=i^n$'
      examples: ['$i^{2026}=i^2=-1$.']
      aliases: [period-four cycle]
      media: []
      tags: [powers-of-i]
      drills:
      - id: power-cycle-drill
        type: typed
        prompt: By what modulus should an exponent be reduced to evaluate $i^n$?
        answer:
          expected: '4'
          aliases: [modulo 4, four]
        explanation: Since $i^4=1$, powers repeat every four exponents.
        tags: [powers-of-i]
  - id: conjugates-modulus-and-roots
    title: Conjugates, Modulus, and Roots
    required: true
    content: Conjugates connect algebraic division with geometric magnitude.
    entries:
    - id: complex-conjugate
      term: Complex Conjugate
      definition: |-
        The number obtained by reversing the sign of the imaginary component: the conjugate of $a+bi$ is $a-bi$.
      notation: '$\overline z$'
      examples: ['The conjugate of $-2+7i$ is $-2-7i$.']
      aliases: [conjugate]
      media: []
      tags: [conjugate]
      drills:
      - id: complex-conjugate-drill
        type: typed
        prompt: Give the conjugate of $5-3i$.
        answer:
          expected: 5+3i
          aliases: ['$5+3i$']
        explanation: Preserve the real part and reverse the imaginary sign.
        tags: [conjugate]
    - id: modulus
      term: Modulus
      definition: The nonnegative magnitude $|a+bi|=\sqrt{a^2+b^2}$, equal to the distance from $(a,b)$ to the origin.
      notation: '$|z|$'
      examples: ['$|3+4i|=5$.']
      aliases: [absolute value of a complex number, magnitude]
      media: []
      tags: [modulus]
      drills:
      - id: modulus-drill
        type: typed
        prompt: Find $|5-12i|$.
        answer:
          expected: '13'
          aliases: [thirteen]
        explanation: Compute $\sqrt{5^2+(-12)^2}=13$.
        tags: [modulus]
    - id: squared-modulus
      term: Squared Modulus
      definition: The real product $z\overline z=a^2+b^2=|z|^2$.
      notation: '$z\overline z=|z|^2$'
      examples: ['$(2+3i)(2-3i)=13$.']
      aliases: [norm squared]
      media: []
      tags: [squared-modulus, conjugate]
      drills:
      - id: squared-modulus-drill
        type: typed
        prompt: What real value is $(4+i)(4-i)$?
        answer:
          expected: '17'
          aliases: [seventeen]
        explanation: A conjugate product is the sum of the component squares.
        tags: [squared-modulus]
    - id: principal-complex-square-root
      term: Principal Complex Square Root
      definition: A convention selecting one of the two square roots of a nonzero complex number. For $r>0$, $\sqrt{-r}=i\sqrt r$, but the equation $z^2=-r$ has both signs.
      notation: '$\sqrt{-r}=i\sqrt r$'
      examples: ['$\sqrt{-25}=5i$, while $z^2=-25$ has $z=\pm5i$.']
      aliases: [principal square root]
      media: []
      tags: [complex-square-root]
      drills:
      - id: principal-complex-square-root-drill
        type: flashcard
        prompt: Why does solving $z^2=-r$ require more than writing the principal square root?
        answer:
          expected: A nonzero square has two opposite roots, so both signs must be included.
        explanation: The radical symbol selects one value; an equation asks for every value.
        tags: [complex-square-root]
