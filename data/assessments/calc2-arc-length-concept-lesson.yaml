lesson:
  introduction: 'If you were to take a piece of string and trace a curve on a graph,
    then pull the string straight and measure it, you would have found the **arc length**
    of the curve.

    Calculus allows us to compute this exact length using integrals.

    '
  sections:
  - id: derivation
    title: Derivation from the Distance Formula
    required: true
    content: 'We can a\approximate the length of a curve by connecting points along
      the curve with straight line segments. The length of each segment is given by
      the distance formula (or Pythagorean theorem):


      $$ \Delta s = \sqrt{(\Delta x)^2 + (\Delta y)^2} $$


      By factoring out $(\Delta x)^2$, we get:


      $$ \Delta s = \sqrt{1 + \left(\frac{\Delta y}{\Delta x}\right)^2} \Delta x $$


      As $\Delta x \to 0$, the sum of these segments becomes an integral, and $\frac{\Delta
      y}{\Delta x}$ becomes the derivative $f''(x)$.

      '
    check:
      id: derivation-check
      type: multipleChoice
      skills:
      - arc-length
      prompt: What geometric principle is the foundational basis for the arc length
        formula?
      choices:
      - id: a
        text: The Pythagorean Theorem (Distance Formula)
      - id: b
        text: The Area of a Circle
      - id: c
        text: The Volume of a Cylinder
      - id: d
        text: The Quotient Rule
      answer:
        choiceId: a
      explanation: 'The formula is derived by adding up infinitely many infinitesimally
        small hypotenuses.

        '
  - id: formula
    title: The Arc Length Formula
    required: true
    content: 'If $f''(x)$ is continuous on $[a, b]$, the arc length $L$ of the curve
      $y = f(x)$ from $x=a$ to $x=b$ is:


      $$

      L = \int_a^b \sqrt{1 + [f''(x)]^2}\,dx

      $$


      Similarly, if the curve is given as $x = g(y)$, we can integrate with respect
      to $y$:


      $$

      L = \int_c^d \sqrt{1 + [g''(y)]^2}\,dy

      $$


      **Note:** These integrals are notoriously difficult to evaluate by hand because
      of the square root. They often require trigonometric substitution, or they are
      set up to evaluate perfectly via a perfect square algebraic trick. Many are
      evaluated using calculators or a\approximation methods.

      '
    check:
      id: formula-check
      type: multipleChoice
      skills:
      - arc-length
      prompt: Setup the integral for the arc length of $y = x^3$ from $x=0$ to $x=2$.
      choices:
      - id: a
        text: $\int_0^2 \sqrt{1 + 9x^4}\,dx$
      - id: b
        text: $\int_0^2 \sqrt{1 + x^3}\,dx$
      - id: c
        text: $\int_0^2 \sqrt{1 + 3x^2}\,dx$
      - id: d
        text: $\int_0^2 \sqrt{1 + x^6}\,dx$
      answer:
        choiceId: a
      explanation: '$f(x) = x^3$. $f''(x) = 3x^2$. $[f''(x)]^2 = (3x^2)^2 = 9x^4$.
        The integral is $\int \sqrt{1 + 9x^4}\,dx$.

        '
