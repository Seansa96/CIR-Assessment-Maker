items:
  - { id: er1, type: cloze, prompt: 'Complete: $\sigma=F/\underline{\hspace{0.7cm}}$.', answer: { expected: A, expectedLatex: 'A', aliases: [area], media: [] }, explanation: 'Solution: Insert $A$.\n\nWhy it works: Stress is force per area.', tags: [stress] }
  - { id: er2, type: cloze, prompt: 'Complete: $\epsilon=\Delta L/\underline{\hspace{0.7cm}}$.', answer: { expected: L, expectedLatex: 'L', aliases: [length], media: [] }, explanation: 'Solution: Insert $L$.\n\nWhy it works: Strain is fractional length change.', tags: [strain] }
  - { id: er3, type: typed, prompt: 'Which modulus describes axial stretching?', answer: { expected: 'Young''s modulus', expectedLatex: '', aliases: [Youngs modulus, Young modulus], media: [] }, explanation: 'Solution: The answer is Young''s modulus.\n\nWhy it works: It relates normal stress to axial strain.', tags: [young] }
  - { id: er4, type: typed, prompt: 'Which modulus describes uniform volume compression?', answer: { expected: 'bulk modulus', expectedLatex: '', aliases: [bulk], media: [] }, explanation: 'Solution: The answer is bulk modulus.\n\nWhy it works: It relates pressure to fractional volume change.', tags: [bulk] }
  - { id: er5, type: cloze, prompt: 'A force parallel to a face produces ____ deformation.', answer: { expected: shear, expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: Insert shear.\n\nWhy it works: Shear changes shape through parallel loading.', tags: [shear] }
  - { id: er6, type: typed, prompt: 'What is the SI unit of stress?', answer: { expected: pascal, expectedLatex: '', aliases: [Pa, pascals, N/m^2], media: [] }, explanation: 'Solution: The unit is pascal.\n\nWhy it works: One pascal equals one newton per square meter.', tags: [units] }
