    check:
      id: check-001
      type: multipleChoice
      prompt: Which reading move comes first? (Locate the mathematical object)
      choices:
      - id: a
        text: Identify the mathematical object being named.
        media: []
        issueSignals: []
      - id: b
        text: Treat every symbol as a numerical answer.
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: c
        text: Discard the declared domain.
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: d
        text: Use the title as a proof.
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
