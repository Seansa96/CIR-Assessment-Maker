  introduction: 'This lesson practices one reading action: integrate all reading actions.'
  sections:
  - id: s01
    title: Locate the mathematical object
    required: true
    content: First identify whether the passage defines an object, states a claim, or justifies a claim. This prevents symbols from being read as detached calculations.
