schemaVersion: 1
id: linear-algebra-orthogonality-recall
title: Orthogonality and Projections Recall Drill
assessmentType: recallDrill
categoryId: linear-algebra
subcategoryIds:
  - linear-algebra-orthogonality-projections
modeDefault: practice
randomizeQuestions: true
skills:
  - dot-product
  - orthogonality
  - orthogonal-complement
  - projection
  - gram-schmidt
items:
  - id: r-dot-product
    type: flashcard
    prompt: |
      State the formula for the dot product of $\vec{u}, \vec{v} \in \mathbb{R}^n$.
    answer:
      expected: '$\vec{u} \cdot \vec{v} = u_1 v_1 + u_2 v_2 + \dots + u_n v_n = \vec{u}^T \vec{v}$'

  - id: r-orthogonal-condition
    type: cloze
    prompt: |
      Two vectors $\vec{u}$ and $\vec{v}$ are orthogonal if and only if $\vec{u} \cdot \vec{v} = {{0}}$.
    answer:
      expected: '0'

  - id: r-norm
    type: flashcard
    prompt: |
      How is the Euclidean norm (length) $\|\vec{v}\|$ related to the dot product?
    answer:
      expected: '$\|\vec{v}\| = \sqrt{\vec{v} \cdot \vec{v}}$'

  - id: r-unit-vector
    type: cloze
    prompt: |
      A unit vector in the direction of $\vec{v}$ is $\hat{v} = \dfrac{\vec{v}}{{\|\vec{v}\|}}$.
    answer:
      expected: '\|\vec{v}\|'

  - id: r-orthonormal
    type: flashcard
    prompt: |
      What is the difference between an orthogonal set and an orthonormal set?
    answer:
      expected: |
        An orthogonal set has all pairs of vectors mutually perpendicular ($\vec{u}_i \cdot \vec{u}_j = 0$ for $i \neq j$). An orthonormal set additionally requires each vector to have unit length ($\|\vec{u}_i\| = 1$).

  - id: r-orth-complement-dim
    type: cloze
    prompt: |
      If $W$ is a subspace of $\mathbb{R}^n$, then $\dim(W) + \dim(W^\perp) = {{n}}$.
    answer:
      expected: 'n'

  - id: r-nul-row-perp
    type: flashcard
    prompt: |
      State the relationship between $\text{Nul}(A)$ and $\text{Row}(A)$.
    answer:
      expected: '$\text{Nul}(A) = [\text{Row}(A)]^\perp$. The null space and the row space are orthogonal complements.'

  - id: r-projection-formula
    type: flashcard
    prompt: |
      State the formula for the orthogonal projection of $\vec{y}$ onto a nonzero vector $\vec{u}$.
    answer:
      expected: '$\text{proj}_{\vec{u}}\vec{y} = \dfrac{\vec{y} \cdot \vec{u}}{\vec{u} \cdot \vec{u}} \vec{u}$'

  - id: r-gram-schmidt-step
    type: flashcard
    prompt: |
      In the Gram-Schmidt process, how is the $k$-th orthogonal vector $\vec{v}_k$ computed from $\vec{x}_k$ and the prior orthogonal vectors $\vec{v}_1, \dots, \vec{v}_{k-1}$?
    answer:
      expected: |
        $\vec{v}_k = \vec{x}_k - \text{proj}_{\vec{v}_1}\vec{x}_k - \text{proj}_{\vec{v}_2}\vec{x}_k - \dots - \text{proj}_{\vec{v}_{k-1}}\vec{x}_k$

        That is, subtract all projections of $\vec{x}_k$ onto the already-orthogonalized vectors.
