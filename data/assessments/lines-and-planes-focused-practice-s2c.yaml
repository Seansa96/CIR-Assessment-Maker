questions:
- id: q001
  type: multipleChoice
  prompt: 'Which vector equation is the line through $(1,0,-2)$ parallel to $\langle3,1,4\rangle$?'
  choices:
  - id: a
    text: '$\mathbf r=\langle1,0,-2\rangle+t\langle3,1,4\rangle$'
  - id: b
    text: '$\mathbf r=\langle3,1,4\rangle+t\langle1,0,-2\rangle$'
    issueSignals:
    - id: mathematical-translation-error
  - id: c
    text: '$\mathbf r=\langle1,0,-2\rangle+\langle3,1,4\rangle$'
    issueSignals:
    - id: mathematical-translation-error
  - id: d
    text: '$\mathbf r=\langle1,0,-2\rangle+t$'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-translation-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Use a position vector plus parameter times direction.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 2 → Parametric Curves.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q002
  type: multipleChoice
  prompt: Which vector is normal to $2x-y+3z=7$?
  choices:
  - id: a
    text: '$\langle2,-1,3\rangle$'
  - id: b
    text: '$\langle7,0,0\rangle$'
    issueSignals:
    - id: mathematical-translation-error
  - id: c
    text: '$\langle1,2,-1\rangle$'
    issueSignals:
    - id: mathematical-translation-error
  - id: d
    text: '$\langle2,1,3\rangle$'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-translation-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Plane coefficients form a normal vector.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 2 → Parametric Curves.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q003
  type: multipleChoice
  prompt: 'When are planes with normals $\mathbf n_1$ and $\mathbf n_2$ parallel?'
  choices:
  - id: a
    text: 'When $\mathbf n_1$ is a scalar multiple of $\mathbf n_2$'
  - id: b
    text: 'When $\mathbf n_1\cdot\mathbf n_2=0$'
    issueSignals:
    - id: mathematical-translation-error
  - id: c
    text: When both normals have magnitude one
    issueSignals:
    - id: mathematical-translation-error
  - id: d
    text: When the constants match
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-translation-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Parallel planes have parallel normals.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 2 → Parametric Curves.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q004
  type: multipleChoice
  prompt: 'What point is on $\mathbf r=\langle2,1,0\rangle+t\langle1,-1,3\rangle$ at $t=2$?'
  choices:
  - id: a
    text: $(4,-1,6)$
  - id: b
    text: $(3,0,3)$
    issueSignals:
    - id: mathematical-translation-error
  - id: c
    text: $(2,1,0)$
    issueSignals:
    - id: mathematical-translation-error
  - id: d
    text: $(0,2,-1)$
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-translation-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Substitute t into every component.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 2 → Parametric Curves.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
