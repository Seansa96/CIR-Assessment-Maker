lesson:
  introduction: 'This lesson introduces Introduction and System Calls through the mental models emphasized by 1 Introduction.
    Focus on what the OS is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: operating-system-roles
    title: Operating system roles
    required: true
    content: 'An operating system presents useful abstractions while allocating shared hardware resources fairly and safely.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Treating the OS as only a user interface misses its resource-management role.

      '
    check:
      id: operating-system-roles-check
      title: 'Check: Operating system roles'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Operating system roles**?

        '
      choices:
      - id: a
        text: An operating system presents useful abstractions while allocating shared hardware resources fairly and safely.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'An operating system presents useful abstractions while allocating shared hardware resources fairly and
        safely. Related topic: Introduction and System Calls.

        '
  - id: kernel-and-user-mode
    title: Kernel and user mode
    required: true
    content: 'Privileged operations run in kernel mode so ordinary programs cannot directly damage devices, memory, or other
      processes.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      If user code could execute privileged instructions directly, protection would collapse.

      '
    check:
      id: kernel-and-user-mode-check
      title: 'Check: Kernel and user mode'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Kernel and user mode**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Privileged operations run in kernel mode so ordinary programs cannot directly damage devices, memory, or other
          processes.
      answer:
        choiceId: d
      explanation: 'Privileged operations run in kernel mode so ordinary programs cannot directly damage devices, memory,
        or other processes. Related topic: Introduction and System Calls.

        '
  - id: system-call-boundary
    title: System call boundary
    required: true
    content: 'A system call is the controlled transition where user code asks the kernel to perform protected work.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A library API may wrap a system call, but the two are not identical.

      '
    check:
      id: system-call-boundary-check
      title: 'Check: System call boundary'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **System call boundary**?

        '
      choices:
      - id: a
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: A system call is the controlled transition where user code asks the kernel to perform protected work.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: c
      explanation: 'A system call is the controlled transition where user code asks the kernel to perform protected work.
        Related topic: Introduction and System Calls.

        '
  - id: hardware-context
    title: Hardware context
    required: true
    content: 'CPUs, memory, disks, buses, and interrupts shape what the OS can abstract and what it must protect.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Ignoring hardware leads to wrong mental models for performance and protection.

      '
    check:
      id: hardware-context-check
      title: 'Check: Hardware context'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Hardware context**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: CPUs, memory, disks, buses, and interrupts shape what the OS can abstract and what it must protect.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      answer:
        choiceId: b
      explanation: 'CPUs, memory, disks, buses, and interrupts shape what the OS can abstract and what it must protect. Related
        topic: Introduction and System Calls.

        '
  - id: process-address-space-file
    title: Process, address space, file
    required: true
    content: 'Processes, address spaces, and files are foundational abstractions used to organize execution, memory, and persistent
      data.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      These are not just names; they define protection and sharing boundaries.

      '
    check:
      id: process-address-space-file-check
      title: 'Check: Process, address space, file'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Process, address space, file**?

        '
      choices:
      - id: a
        text: Processes, address spaces, and files are foundational abstractions used to organize execution, memory, and persistent
          data.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'Processes, address spaces, and files are foundational abstractions used to organize execution, memory,
        and persistent data. Related topic: Introduction and System Calls.

        '
  - id: os-families
    title: OS families
    required: true
    content: 'Different OS types prioritize different constraints, such as throughput, responsiveness, real-time deadlines,
      embedded size, or server reliability.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A design that works for a desktop may fail for a real-time controller.

      '
    check:
      id: os-families-check
      title: 'Check: OS families'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **OS families**?

