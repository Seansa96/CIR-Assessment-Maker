      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Different OS types prioritize different constraints, such as throughput, responsiveness, real-time deadlines,
          embedded size, or server reliability.
      answer:
        choiceId: d
      explanation: 'Different OS types prioritize different constraints, such as throughput, responsiveness, real-time deadlines,
        embedded size, or server reliability. Related topic: Introduction and System Calls.

        '
