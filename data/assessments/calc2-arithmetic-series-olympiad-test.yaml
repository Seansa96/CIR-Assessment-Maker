- id: q003
  type: multipleChoice
  skills:
  - recover-sequences-from-global-sum-identities
  prompt: |
    A sequence satisfies $a_1+\cdots+a_n=n^2$ for every positive integer
    n. Which formula is forced?
  choices:
  - id: a
    text: $a_n=2n-1$
  - id: b
    text: $a_n=n$
  - id: c
    text: $a_n=n^2$
  - id: d
    text: $a_n=2n+1$
  answer:
    choiceId: a
  explanation: |-
    Solution: Consecutive square partial sums differ by $n^2-(n-1)^2=2n-1$. Therefore the answer is $a_n=2n-1$.

    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

    Why the other choices fail: $a_n=n$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $a_n=n^2$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $a_n=2n+1$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
