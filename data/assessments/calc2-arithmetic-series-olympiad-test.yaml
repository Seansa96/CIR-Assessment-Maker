questions:
- id: q001
  type: multipleChoice
  skills:
  - solve-centered-four-term-progressions
  prompt: |
    Four increasing terms in arithmetic progression have sum $40$ and sum
    of squares $580$. What is their common difference?
  choices:
  - id: a
    text: $6$
  - id: b
    text: $3$
  - id: c
    text: $4$
  - id: d
    text: $8$
  answer:
    choiceId: a
  explanation: Write the terms as $10-3r,10-r,10+r,10+3r$; their square sum is $400+20r^2=580$, so r equals
    three and the actual adjacent difference is $2r=6$.
- id: q002
  type: multipleChoice
  skills:
  - evaluate-absolute-distance-sums
  prompt: |
    Evaluate $\displaystyle\sum_{k=1}^{50}|k-25|$.
  choices:
  - id: a
    text: $625$
  - id: b
    text: $600$
  - id: c
    text: $650$
  - id: d
    text: $1275$
  answer:
    choiceId: a
  explanation: |-
    Distances on the left sum $1+\cdots+24=300$, and those on the right sum $1+\cdots+25=325$.
- id: q003
  type: multipleChoice
  skills:
  - recover-sequences-from-global-sum-identities
  prompt: |
    A sequence satisfies $a_1+\cdots+a_n=n^2$ for every positive integer
    n. Which formula is forced?
  choices:
  - id: a
    text: $a_n=2n-1$
  - id: b
    text: $a_n=n$
  - id: c
    text: $a_n=n^2$
  - id: d
    text: $a_n=2n+1$
  answer:
    choiceId: a
  explanation: Consecutive square partial sums differ by $n^2-(n-1)^2=2n-1$.
- id: q004
  type: multipleChoice
  skills:
  - derive-zero-sum-conditions
  prompt: |
    An arithmetic progression has nonzero difference d and first n terms
    summing to zero. What is $a_1$?
  choices:
  - id: a
    text: $-(n-1)d/2$
  - id: b
    text: $-nd/2$
  - id: c
    text: $(n-1)d/2$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: Setting $n[2a_1+(n-1)d]/2=0$ forces the bracket to vanish.
- id: q005
  type: multipleChoice
  skills:
  - use-average-index-symmetry
  prompt: |
    Ten terms of an arithmetic sequence have sum $100$. What is
    $a_3+a_8$?
  choices:
  - id: a
    text: $20$
  - id: b
    text: $10$
  - id: c
    text: $100$
  - id: d
    text: Cannot be determined
  answer:
    choiceId: a
  explanation: The average is ten, so every complementary pair whose indices sum to eleven has sum twenty.
- id: q006
  type: multipleChoice
  skills:
  - optimize-products-under-arithmetic-symmetry
  prompt: |
    Four nonnegative terms in arithmetic progression have sum $40$. What is
    the greatest possible product?
  choices:
  - id: a
    text: $10{,}000$
  - id: b
    text: $9{,}801$
  - id: c
    text: $6{,}400$
  - id: d
    text: $40^4$
  answer:
    choiceId: a
  explanation: AM–GM bounds the product by $(40/4)^4$, and equality occurs at the valid constant progression
    $10,10,10,10$.
- id: q007
  type: multipleChoice
  skills:
  - compare-consecutive-block-sums
  prompt: |
    In an arithmetic sequence, the sum of terms $a_1$ through $a_n$ equals
    the sum of $a_{n+1}$ through $a_{2n}$. What must hold?
  choices:
  - id: a
    text: $d=0$
  - id: b
    text: $a_1=0$
  - id: c
    text: $d=1$
  - id: d
    text: $a_n=0$
  answer:
    choiceId: a
  explanation: Each term in the second block exceeds its paired first-block term by nd, so the block-sum
    difference is $n^2d$.
- id: q008
  type: multipleChoice
  skills:
  - classify-palindromic-digit-progressions
  prompt: |
    The four digits of a four-digit palindrome are in arithmetic
    progression from left to right. Which conclusion is necessary?
  choices:
  - id: a
    text: All four digits are equal.
  - id: b
    text: The common difference is one.
  - id: c
    text: The number is divisible by $1001$ only.
  - id: d
    text: The middle digits are zero.
  answer:
    choiceId: a
  explanation: In a four-term arithmetic progression, equality of the first and fourth terms gives three
    d equal to zero.
- id: q009
  type: multipleChoice
  skills:
  - sum-quadratic-functions-of-arithmetic-terms
  prompt: |
    Evaluate $\sum_{k=1}^{10}(2k-1)^2$.
  choices:
  - id: a
    text: $1330$
  - id: b
    text: $1335$
  - id: c
    text: $670$
  - id: d
    text: $1000$
  answer:
    choiceId: a
  explanation: |-
    Expand to $4\sum k^2-4\sum k+10=4(385)-4(55)+10=1330$.
- id: q010
  type: multipleChoice
  skills:
  - distinguish-polynomial-difference-orders
  prompt: |
    If partial sums $S_n$ are given by a cubic polynomial in n with nonzero
    leading coefficient, what kind of sequence is $a_n=S_n-S_{n-1}$?
  choices:
  - id: a
    text: Quadratic, so not arithmetic in general
  - id: b
    text: Linear and always arithmetic
  - id: c
    text: Constant
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: One discrete difference lowers polynomial degree from three to two; arithmetic sequences
    are degree one.
- id: q011
  type: multipleChoice
  skills:
  - prove-divisibility-of-odd-length-sums
  prompt: |
    An arithmetic progression contains an odd number $2m+1$ of integer
    terms. Why is its sum divisible by $2m+1$?
  choices:
  - id: a
    text: Its average is the integer middle term.
  - id: b
    text: Every term is divisible by $2m+1$.
  - id: c
    text: Its common difference is divisible by $2m+1$.
  - id: d
    text: The claim is false.
  answer:
    choiceId: a
  explanation: Symmetric pairs average to the middle term, so the total equals the number of terms times
    that integer.
- id: q012
  type: multipleChoice
  skills:
  - solve-term-count-from-sum
  prompt: |
    How many terms of $7+12+17+\cdots$ have sum $799$?
  choices:
  - id: a
    text: $17$
  - id: b
    text: $16$
  - id: c
    text: $18$
  - id: d
    text: $19$
  answer:
    choiceId: a
  explanation: $S_n=n[14+5(n-1)]/2=n(5n+9)/2$; substituting n equals seventeen gives 799 and the quadratic
    has no other positive root.
- id: q013
  type: multipleChoice
  skills:
  - combine-arithmetic-sequences
  prompt: |
    Arithmetic sequences $(a_n)$ and $(b_n)$ have common differences p and
    q. What is the common difference of $c_n=3a_n-2b_n$?
  choices:
  - id: a
    text: $3p-2q$
  - id: b
    text: $p+q$
  - id: c
    text: $3p+2q$
  - id: d
    text: $pq$
  answer:
    choiceId: a
  explanation: $c_{n+1}-c_n=3(a_{n+1}-a_n)-2(b_{n+1}-b_n)=3p-2q$.
- id: q014
  type: multipleChoice
  skills:
  - use-prime-sum-divisibility
  prompt: |
    An arithmetic progression of $15$ positive integer terms has a prime
    sum. Which statement is correct?
  choices:
  - id: a
    text: No such progression exists.
  - id: b
    text: Its middle term must be $1$.
  - id: c
    text: Its common difference must be prime.
  - id: d
    text: Its sum must be $15$.
  answer:
    choiceId: a
  explanation: The sum equals fifteen times the positive integer middle term, so it is composite.
- id: q015
  type: multipleChoice
  skills:
  - count-solutions-to-arithmetic-sum-forms
  prompt: |
    Can $100$ be written as the sum of an odd number greater than one of
    positive consecutive integers?
  choices:
  - id: a
    text: No, because any odd-length sum is the length times its integer middle term.
  - id: b
    text: Yes, as five consecutive integers.
  - id: c
    text: Yes, as twenty-five consecutive integers.
  - id: d
    text: Yes, for every odd length.
  answer:
    choiceId: b
  explanation: |
    Five divides one hundred, so a five-term block centered at twenty works:
    $18+19+20+21+22=100$.
