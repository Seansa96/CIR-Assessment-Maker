- id: q001
  type: multipleChoice
  skills:
  - solve-centered-four-term-progressions
  prompt: 'Four increasing terms in arithmetic progression have sum $40$ and sum

    of squares $580$. What is their common difference?

    '
  choices:
  - id: a
    text: $6$
  - id: b
    text: $3$
  - id: c
    text: $4$
  - id: d
    text: $8$
  answer:
    choiceId: a
  explanation: 'Solution: Write the terms as $10-3r,10-r,10+r,10+3r$; their square sum is $400+20r^2=580$, so r equals three and the actual adjacent difference is $2r=6$. Therefore the answer is $6$.


    Why it works: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$. For a finite sum, use $S_n=n(a_1+a_n)/2$ after identifying the correct first and last terms.


    Common trap: The $n$th term has $(n-1)d$, not $nd$; distinguish the number of terms from the index of the final term.


    Why the other choices fail: $3$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; $4$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; $8$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$.'
