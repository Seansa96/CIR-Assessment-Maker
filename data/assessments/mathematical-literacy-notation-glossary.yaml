glossary:
  introduction: Vocabulary for naming the objects and relationships in mathematical notation.
  sections:
  - id: core-symbols
    title: Core symbols
    required: true
    content: Use the surrounding sentence to decide which objects a symbol relates.
    entries:
    - id: t01
      term: 'Membership ($\in$)'
      definition: 'A relation saying that one object is an element of a set; $a\in A$ reads “a is in A.”'
      drills:
      - id: t01-drill
        type: flashcard
        prompt: What does membership mean?
        answer:
          expected: An object is an element of a set.
        explanation: 'Solution: An object is an element of a set. Why it works: Membership relates an object to
          a set.'
        tags: []
    - id: t02
      term: 'Subset ($\subseteq$)'
      definition: A relation saying that every element of one set belongs to another set.
      drills:
      - id: t02-drill
        type: flashcard
        prompt: What does subset mean?
        answer:
          expected: Every element of one set belongs to another set.
        explanation: 'Solution: Every element of one set belongs to another set. Why it works: Containment compares
          sets.'
        tags: []
    - id: t03
      term: Set-builder notation
      definition: A way to describe a set by giving an expression or object together with the condition it must
        satisfy.
      drills:
      - id: t03-drill
        type: flashcard
        prompt: What does set-builder notation do?
        answer:
          expected: Describes a set with a condition.
        explanation: 'Solution: It describes a set with a condition. Why it works: The condition filters allowed
          objects.'
        tags: []
    - id: t04
      term: Function
      definition: 'A rule that assigns one output to each permitted input; $f:A\to B$ names its domain A and codomain
        B.'
      drills:
      - id: t04-drill
        type: flashcard
        prompt: What does a function assign?
        answer:
          expected: One output to each permitted input.
        explanation: 'Solution: One output to each permitted input. Why it works: This is the defining function
          rule.'
        tags: []
