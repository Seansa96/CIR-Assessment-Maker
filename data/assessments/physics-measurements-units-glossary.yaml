glossary:
  introduction: Use unit language and dimensional structure to make every reported physical quantity interpretable and checkable.
  sections:
  - id: unit-language
    title: Units and dimensions
    required: true
    content: A unit specifies a measurement scale; a dimension specifies the physical type. Conversion factors preserve the physical quantity while changing its unit representation.
    entries:
    - id: si-base-unit
      term: SI base unit
      definition: A foundational unit in the International System, such as meter, kilogram, or second.
      notation: ''
      examples:
      - The second is the SI base unit for time.
      aliases: []
      media: []
      tags:
      - si
      drills:
      - id: si-drill
        type: cloze
        prompt: The SI base unit for time is the ____.
        answer:
          expected: second
          expectedLatex: ''
          aliases:
          - s
          media: []
          choiceId: 
        explanation: 'Solution: The answer is second.\n\nWhy it works: The second is defined as an SI base unit for time.'
        tags:
        - si
        skills: []
        choices: []
    - id: derived-unit
      term: Derived unit
      definition: A unit formed by combining SI base units through multiplication or division.
      notation: $\text{m/s}$
      examples:
      - Velocity has derived unit meters per second.
      aliases: []
      media: []
      tags:
      - units
      drills:
      - id: derived-drill
        type: cloze
        prompt: Meters per second is a ____ unit.
        answer:
          expected: derived
          expectedLatex: ''
          aliases: []
          media: []
          choiceId: 
        explanation: 'Solution: It is a derived unit.\n\nWhy it works: m/s combines the base units meter and second.'
        tags:
        - units
        skills: []
        choices: []
    - id: dimension
      term: Dimension
      definition: The physical type of a quantity expressed through base quantities such as length L and time T.
      notation: $[v]=LT^{-1}$
      examples:
      - Velocity has dimension length per time.
      aliases: []
      media: []
      tags:
      - dimensions
      drills:
      - id: dimension-drill
        type: cloze
        prompt: The dimension of velocity is ____.
        answer:
          expected: LT^-1
          expectedLatex: LT^{-1}
          aliases:
          - length per time
          media: []
          choiceId: 
        explanation: 'Solution: $[v]=LT^{-1}$.\n\nWhy it works: Velocity is displacement divided by time.'
        tags:
        - dimensions
        skills: []
        choices: []
    - id: conversion-factor
      term: Conversion factor
      definition: A ratio of equivalent quantities that equals one and changes units without changing the physical quantity.
      notation: $1\text{ m}/100\text{ cm}$
      examples:
      - Multiply centimeters by 1 m/100 cm to convert to meters.
      aliases: []
      media: []
      tags:
      - conversion
      drills:
      - id: conversion-drill
        type: cloze
        prompt: A valid conversion factor is equal to ____.
        answer:
          expected: 1
          expectedLatex: 1
          aliases:
          - one
          media: []
          choiceId: 
        explanation: 'Solution: It equals 1.\n\nWhy it works: Its numerator and denominator name equivalent amounts in different units.'
        tags:
        - conversion
        skills: []
        choices: []
