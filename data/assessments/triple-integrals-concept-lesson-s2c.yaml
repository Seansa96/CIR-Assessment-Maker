          domains: []
      - id: c
        text: dV (answers 'What differential represents volume?', not 'What does $\iiint_E1dV$ give?')
        media: []
        issueSignals:
        - id: integration-bounds-error
          domains: []
      - id: d
        text: three (answers 'How many variables occur in a triple integral?', not 'What does $\iiint_E1dV$ give?')
        media: []
        issueSignals:
        - id: integration-bounds-error
