  - id: s02
    title: Nested bounds describe solids
    required: true
    content: Three bound pairs encode slices, sheets, and the full solid. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
