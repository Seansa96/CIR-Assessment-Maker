      src: /media/calculus-3/triple-integrals.svg
      alt: Original triple integrals reference visual.
      caption: 
    check:
      id: check-01
      type: multipleChoice
      prompt: What does $\iiint_E1dV$ give?
      choices:
      - id: a
        text: volume of E
