    choiceId: a
  explanation: |-
    Solution: The limit of the terms as $n \to \infty$ is $1/3$. Since the terms do not go to 0, the series diverges by the Test for Divergence. (Note: the *limit* is 1/3, but the *sum* diverges to $\infty$). Therefore the answer is Diverges by the Test for Divergence.. Therefore the answer is Diverges by the Test for Divergence.. Therefore the answer is Diverges by the Test for Divergence..

    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

