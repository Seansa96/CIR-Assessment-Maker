          "title": "Check",
          "instruction": "Carry out the indicated model or numerical-method step.",
          "type": "freeResponse",
          "prompt": "Check: explain the calculation.",
          "choices": [],
          "answer": {
            "gradingMode": "selfCheck"
          },
          "explanation": "Solution: The amount decays to zero and units are kg.\n\nWhy it works: The relation is applied with the stated value, step, or condition.",
          "media": []
        }
      ]
