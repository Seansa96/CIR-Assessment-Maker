workedExamples:
- id: we01
  title: Cooling a sensor
  problem: 'A sensor begins at $90^\circ$C in a $20^\circ$C room and follows $T''=-0.1(T-20)$. Find $T(t)$.'
  steps:
  - id: we1-s1
    title: Shift by the ambient temperature
    instruction: Define the temperature excess and translate the initial data.
    type: freeResponse
    prompt: Set $u=T-20$ and write its IVP.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - u=T-20
      - u'=-0.1u
      - u(0)=70
    explanation: |-
      Solution: $u'=T'=-0.1u$ and $u(0)=90-20=70$.

      Why it works: The ambient shift converts the model into pure exponential decay.
    media: []
  - id: we1-s2
    title: Solve the shifted IVP
    instruction: Apply the initial condition before shifting back.
    type: freeResponse
    prompt: Find $u(t)$ and then $T(t)$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - u solution
      - T solution
    explanation: |-
      Solution: $u=70e^{-0.1t}$, so $T(t)=20+70e^{-0.1t}$.

      Why it works: The initial excess is the multiplicative constant.
    media: []
  - id: we1-s3
    title: Verify and interpret
    instruction: Check the initial value, rate law, and long-term limit.
    type: freeResponse
    prompt: Verify the solution and interpret its limit.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - initial check
      - ODE check
      - limit 20
    explanation: |-
      Solution: $T(0)=90$, $T'=-7e^{-0.1t}=-0.1(T-20)$, and $T(t)\to20^\circ$C.

      Why it works: All mathematical checks agree with cooling toward the ambient temperature.
    media: []
- id: we02
  title: A salt tank
  problem: A 100-L tank contains 10 kg salt. Pure water enters and leaves at 5 L/min. Set up and solve for salt
    amount $Q(t)$.
  steps:
  - id: we2-s1
    title: Construct the balance
    instruction: Use the well-mixed concentration and verify units.
    type: freeResponse
    prompt: Compute the salt-in and salt-out rates.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - input zero
      - output Q/20
      - balance equation
    explanation: |-
      Solution: Salt input is $0$; concentration is $Q/100$ kg/L, so salt output is $5(Q/100)=Q/20$ kg/min and $Q'=-Q/20$.

      Why it works: Volumetric flow times concentration produces the required mass-per-time rate.
    media: []
  - id: we2-s2
    title: Solve the IVP
    instruction: Use the initial salt amount to determine the constant.
    type: freeResponse
    prompt: Solve $Q'=-Q/20$, $Q(0)=10$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - exponential solution
      - constant 10
      - units kg
    explanation: |-
      Solution: $Q(t)=Ce^{-t/20}$ and $Q(0)=10$ gives $Q(t)=10e^{-t/20}$ kg.

      Why it works: A constant-volume pure-water flush removes a fixed fraction of the current salt per minute.
    media: []
  - id: we2-s3
    title: Check physical behavior
    instruction: Verify nonnegativity, the derivative, and the limit.
    type: freeResponse
    prompt: Audit the solution against the model.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - nonnegative
      - ODE check
      - limit zero
    explanation: |-
      Solution: $Q(t)>0$, $Q'=-\frac12e^{-t/20}=-Q/20$, and $Q(t)\to0$ as $t\to\infty$.

      Why it works: The solution never predicts negative salt and approaches the physically expected empty-salt state.
    media: []
- id: we03
  title: Orthogonal curves
  problem: Find the slope field for curves $y=cx^2$ and state the orthogonal-trajectory equation.
  steps:
  - id: we3-s1
    title: Eliminate the parameter
    instruction: Differentiate the family and replace $c$ using the original relation.
    type: freeResponse
    prompt: Find the family slope in terms of $x$ and $y$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - differentiate
      - eliminate c
      - slope 2y/x
    explanation: |-
      Solution: Differentiating gives $y'=2cx$; since $c=y/x^2$, the slope is $y'=2y/x$ where $x\ne0$.

      Why it works: A differential equation for the family cannot retain the arbitrary parameter.
    media: []
  - id: we3-s2
    title: Take the perpendicular slope
    instruction: Use the negative reciprocal where the original slope is finite and nonzero.
    type: freeResponse
    prompt: Find the orthogonal slope.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - negative reciprocal
      - slope -x/(2y)
    explanation: |-
      Solution: $m_\perp=-1/(2y/x)=-x/(2y)$.

      Why it works: Perpendicular tangent slopes multiply to $-1$.
    media: []
  - id: we3-s3
    title: State and integrate the ODE
    instruction: Separate the orthogonal equation to identify its family.
    type: freeResponse
    prompt: Give the orthogonal ODE and its integrated family.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - orthogonal ODE
      - separation
      - family x²+2y²=C
    explanation: |-
      Solution: The ODE is $y'=-x/(2y)$. Thus $2y\,dy=-x\,dx$, so $x^2+2y^2=C$.

      Why it works: Integrating turns the local perpendicular slope condition into the full trajectory family.
    media: []
