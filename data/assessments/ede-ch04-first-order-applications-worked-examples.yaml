      "id": "we01",
      "title": "Cooling a sensor",
      "problem": "A sensor begins at $90^\\circ$C in a $20^\\circ$C room and follows $T'=-0.1(T-20)$. Find $T(t)$.",
      "steps": [
        {
          "id": "we1-s1",
          "title": "Shift",
          "instruction": "Carry out the indicated model or numerical-method step.",
          "type": "freeResponse",
          "prompt": "Shift: explain the calculation.",
          "choices": [],
          "answer": {
            "gradingMode": "selfCheck"
          },
          "explanation": "Solution: Let $u=T-20$ so $u'=-0.1u$.\n\nWhy it works: The relation is applied with the stated value, step, or condition.",
          "media": []
        },
        {
          "id": "we1-s2",
          "title": "Solve",
          "instruction": "Carry out the indicated model or numerical-method step.",
          "type": "freeResponse",
          "prompt": "Solve: explain the calculation.",
          "choices": [],
          "answer": {
            "gradingMode": "selfCheck"
          },
          "explanation": "Solution: $u=70e^{-0.1t}$ from $T(0)=90$.\n\nWhy it works: The relation is applied with the stated value, step, or condition.",
          "media": []
        },
        {
          "id": "we1-s3",
          "title": "Interpret",
          "instruction": "Carry out the indicated model or numerical-method step.",
          "type": "freeResponse",
          "prompt": "Interpret: explain the calculation.",
          "choices": [],
          "answer": {
            "gradingMode": "selfCheck"
          },
          "explanation": "Solution: $T=20+70e^{-0.1t}$ approaches the room temperature.\n\nWhy it works: The relation is applied with the stated value, step, or condition.",
          "media": []
        }
      ]
    },
    {
      "id": "we02",
      "title": "A salt tank",
      "problem": "A 100-L tank contains 10 kg salt. Pure water enters and leaves at 5 L/min. Set up and solve for salt amount $Q(t)$.",
      "steps": [
        {
          "id": "we2-s1",
          "title": "Balance",
          "instruction": "Carry out the indicated model or numerical-method step.",
          "type": "freeResponse",
          "prompt": "Balance: explain the calculation.",
          "choices": [],
          "answer": {
            "gradingMode": "selfCheck"
          },
          "explanation": "Solution: Inflow is $0$; outflow is $(Q/100)5$, so $Q'=-Q/20$.\n\nWhy it works: The relation is applied with the stated value, step, or condition.",
          "media": []
        },
        {
          "id": "we2-s2",
          "title": "Solve",
          "instruction": "Carry out the indicated model or numerical-method step.",
          "type": "freeResponse",
          "prompt": "Solve: explain the calculation.",
          "choices": [],
          "answer": {
            "gradingMode": "selfCheck"
          },
          "explanation": "Solution: $Q=10e^{-t/20}$ using $Q(0)=10$.\n\nWhy it works: The relation is applied with the stated value, step, or condition.",
