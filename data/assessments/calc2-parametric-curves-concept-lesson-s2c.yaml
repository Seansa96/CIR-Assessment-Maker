id: calc2-parametric-curves-concept-lesson-s2c
title: "Parametric Curves: Locus, Trace, and Orientation"
assessmentType: conceptLesson
categoryId: calculus-2
topicId: parametric-curves
modeDefault: practice
randomizeQuestions: false
skills: [parametric-equations, elimination, orientation, curve-tracing]
navigation: { learningGoal: learn, activityType: conceptLesson, tags: [calculus-2, parametric-curves] }
authoring: { visualRequirement: required, visualRationale: 'A parameterized curve includes a locus and a directed trace, so a spatial diagram is essential.', sourceId: src-20260719182540-a40fdcd443 }
lesson:
  introduction: 'Parametric equations describe a moving point: $x=x(t)$ and $y=y(t)$. The parameter tells both which points occur and the order in which they occur.'
  sections:
    - { id: pc-01, title: '1. Read a point at one parameter value', required: true, content: 'Substitute the same value of $t$ into both coordinate rules. This produces one location, not two independent answers.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Directed parametric trace, caption: A parameter value selects one point on a directed path. }], check: { id: pc-01-check, type: multipleChoice, prompt: 'For $x=t+1,y=t^2$, what point occurs at $t=2$?', choices: [{ id: a, text: '$(3,4)$' }, { id: b, text: '$(2,3)$' }, { id: c, text: '$(1,4)$' }, { id: d, text: '$(3,2)$' }], answer: { choiceId: a }, explanation: 'Solution: $x=2+1=3$ and $y=2^2=4$. Why it works: Both coordinates must use the same parameter value. Common trap: Treating the two equations as separate graphs. Why the other choices fail: Each substitutes into only one coordinate correctly or reverses coordinates.' } }
    - { id: pc-02, title: '2. Separate locus from trace', required: true, content: 'Eliminating $t$ finds the Cartesian locus, but it can lose start point, direction, repetitions, and restrictions. Record those separately.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: A directed curve with start and end marked, caption: The Cartesian equation alone cannot show direction. }], check: { id: pc-02-check, type: multipleChoice, prompt: 'What information is usually lost when $t$ is eliminated?', choices: [{ id: a, text: 'Orientation of the trace' }, { id: b, text: 'Every Cartesian point' }, { id: c, text: 'The x-coordinate' }, { id: d, text: 'The y-coordinate' }], answer: { choiceId: a }, explanation: 'Solution: The Cartesian equation gives the set of points, not their time order. Why it works: Direction belongs to the parameterization. Common trap: Assuming two parameterizations of one locus have the same traversal. Why the other choices fail: Elimination preserves the coordinate relation, not orientation.' } }
    - { id: pc-03, title: '3. Eliminate a linear parameter', required: true, content: 'Solve one equation for $t$ and substitute into the other. Keep any resulting restriction such as $x\ge0$.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Directed parametric trace, caption: Algebra identifies the locus; the trace supplies restrictions. }], check: { id: pc-03-check, type: multipleChoice, prompt: 'Eliminate $t$ from $x=t-2,y=3t+1$.', choices: [{ id: a, text: '$y=3x+7$' }, { id: b, text: '$y=3x+1$' }, { id: c, text: '$y=x+7$' }, { id: d, text: '$y=3x-7$' }], answer: { choiceId: a }, explanation: 'Solution: $t=x+2$, so $y=3(x+2)+1=3x+7$. Why it works: The same parameter is replaced in the second equation. Common trap: Solving $x=t-2$ as $t=x-2$. Why the other choices fail: They use an incorrect inverse or coefficient.' } }
    - { id: pc-04, title: '4. Use a table to trace direction', required: true, content: 'Evaluate several increasing parameter values, plot the resulting ordered points, and connect them in that order. The order is part of the model.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Arch with direction arrows, caption: Arrows come from increasing parameter values. }], check: { id: pc-04-check, type: multipleChoice, prompt: 'For $x=\cos t,y=\sin t$, what is the direction near $t=0$?', choices: [{ id: a, text: 'Upward from $(1,0)$' }, { id: b, text: 'Downward from $(1,0)$' }, { id: c, text: 'Leftward from $(0,1)$' }, { id: d, text: 'Rightward from $(-1,0)$' }], answer: { choiceId: a }, explanation: 'Solution: At $0$ the point is $(1,0)$; for small positive $t$, sine is positive, so the trace moves upward. Why it works: Nearby parameter values reveal local direction. Common trap: Reading clockwise from a sketch without checking points. Why the other choices fail: They use another starting point or the reverse direction.' } }
    - { id: pc-05, title: '5. Preserve parameter restrictions', required: true, content: 'A parameter interval can trace only part of a locus. For $x=t^2,y=t^2-4$, the relation is $y=x-4$ but only where $x\ge0$.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Trace restricted to one side of a coordinate plane, caption: Restrictions select part of a Cartesian locus. }], check: { id: pc-05-check, type: multipleChoice, prompt: 'If $x=t^2$, which x-values are reachable for real t?', choices: [{ id: a, text: '$x\ge0$' }, { id: b, text: '$x\le0$' }, { id: c, text: 'all real x' }, { id: d, text: '$x\ne0$' }], answer: { choiceId: a }, explanation: 'Solution: A real square is nonnegative. Why it works: The parameter domain imposes a domain on the locus. Common trap: Drawing the full Cartesian line or parabola without the restriction. Why the other choices fail: Squares can be zero and never negative.' } }
    - { id: pc-06, title: '6. Recognize repeated paths', required: true, content: 'A closed locus can be traced once, twice, or not at all depending on the interval and angular rate. Find the shortest interval that completes the requested trace.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Directed path demonstrating traversal, caption: A repeated traversal repeats points but changes accumulated quantities. }], check: { id: pc-06-check, type: freeResponse, prompt: 'For $x=\cos(2u),y=\sin(2u)$, give an interval that traces the unit circle once.', answer: { gradingMode: selfCheck, keyPoints: ['zero to pi', 'angular argument advances two pi'] }, explanation: 'Solution: Use $0\le u\le\pi$, because $2u$ advances from $0$ to $2\pi$. Why it works: One circle trace requires one full angular revolution. Common trap: Using $0$ to $2\pi$ and tracing twice.' } }
    - { id: pc-07, title: '7. Validate with position, direction, and domain', required: true, content: 'Before using a parameterization, check a known point, a nearby direction, the intended interval, and any Cartesian restriction. These four checks catch most graphing errors.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Directed trace with endpoints and tangent marker, caption: Validate the path before calculating with it. }], check: { id: pc-07-check, type: freeResponse, prompt: 'Name two facts besides the Cartesian equation that a complete parametric-curve description should report.', answer: { gradingMode: selfCheck, keyPoints: [orientation, start or endpoint, parameter interval, restriction, repetition] }, explanation: 'Solution: Report an interval and orientation, and when relevant the starting point, endpoint, restriction, or repetition count. Why it works: These facts distinguish different parameterizations of the same locus. Common trap: Treating the eliminated equation as the complete answer.' } }
