questions:
- id: q001
  type: freeResponse
  skills:
  - power-series
  blueprintId: calc2-power-series-radius-interval
  prompt: |-
    Find the radius of convergence for the series $\sum_{n=1}^{\infty} \frac{(x-2)^n}{n \cdot 3^n}$.
  answer:
    value: !!float '3'
    tolerance: 0.01
    gradingMode: selfCheck
  explanation: |-
    Solution: Apply the Ratio Test: $\lim_{n\to\infty} |\frac{(x-2)^{n+1}}{(n+1)3^{n+1}} \frac{n3^n}{(x-2)^n}| = \frac{|x-2|}{3}$. For convergence, $\frac{|x-2|}{3} < 1$, meaning $|x-2| < 3$. The radius is 3.

    Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.

    Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  difficultyEvidence: The solution translates the series into a convergence or representation condition and applies that condition to the requested quantity.
- id: q002
  type: freeResponse
  skills:
  - power-series
  blueprintId: calc2-power-series-radius-interval
  prompt: |-
    Find the radius of convergence for $\sum_{n=0}^{\infty} \frac{n!(x+1)^n}{2^n}$.
  answer:
    value: !!float '0'
    tolerance: 0.01
    gradingMode: selfCheck
  explanation: |-
    Solution: Apply the Ratio Test: $\lim_{n\to\infty} \frac{(n+1)!|x+1|^{n+1}}{2^{n+1}} \frac{2^n}{n!|x+1|^n} = \lim_{n\to\infty} \frac{(n+1)|x+1|}{2}$. This goes to infinity for any $x \neq -1$, so radius is 0.

    Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.

    Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  difficultyEvidence: The solution translates the series into a convergence or representation condition and applies that condition to the requested quantity.
- id: q003
  type: freeResponse
  skills:
  - power-series
  blueprintId: calc2-power-series-endpoints
  prompt: |-
    What is the interval of convergence for $\sum_{n=1}^{\infty} \frac{(x-5)^n}{n^2 4^n}$?
  choices:
  - id: a
    text: '[1, 9]'
  - id: b
    text: (1, 9]
  - id: c
    text: '[1, 9)'
  - id: d
    text: (1, 9)
  answer:
    choiceId: a
    gradingMode: selfCheck
  explanation: |-
    Solution: Radius is 4, center is 5. Endpoints are 1 and 9. At x=9, we have $\sum \frac{1}{n^2}$ (convergent p-series). At x=1, $\sum \frac{(-1)^n}{n^2}$ (absolutely convergent). Both endpoints converge. Therefore the answer is [1, 9].

    Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.

    Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  difficultyEvidence: The solution translates the series into a convergence or representation condition and applies that condition to the requested quantity.
