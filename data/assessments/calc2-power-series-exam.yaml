- id: img-powerser-028
  concept: Integration of Series
  source: Power and Taylor Series/pset_6.png
  prompt: |-
    Use a series to estimate $\int_0^1 \cos(\sqrt{x}) dx$ to 3 decimal places.
  explanation: |
    $\cos(\sqrt{x})=\sum\frac{(-1)^n x^n}{(2n)!}$.
