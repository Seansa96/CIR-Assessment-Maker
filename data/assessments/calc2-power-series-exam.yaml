- id: img-powerser-028-v3
  concept: Integration of Series
  source: Power and Taylor Series/pset_6.png
  prompt: |-
    Use a series to estimate $\int_0^1 e^{\sqrt{x}} dx$ to 2 decimal places.
  explanation: |
    $e^{\sqrt{x}} = 1 + x^{1/2} + x/2 + x^{3/2}/6$. The estimate is $1.98$.
  type: numericResponse
  answer:
    value: 1.98
    tolerance: 0.01
- id: img-powerser-022
  concept: Taylor Polynomials
  source: Power and Taylor Series/pset_5.png
  prompt: |-
    Find $T_3(x)$ for $\ln x$ at $a=1$.
  explanation: |-
    $f=0, f'=1, f''=-1, f'''=2$. $T_3 = (x-1) - \frac{(x-1)^2}{2} + \frac{(x-1)^3}{3}$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $f=0, f'=1, f''=-1, f'''=2$. $T_3 = (x-1) - \frac{(x-1)^2}{2} + \frac{(x-1)^3}{3}$.
- id: img-powerser-044-v3
  concept: Taylor Polynomials
  source: Power and Taylor Series/pset_9.png
  prompt: |-
    Find $T_2(x)$ for $f(x) = (1+x)^{1/x}$ at $a=0$.
  explanation: |
    $\lim_{x \to 0} f(x) = e$. The polynomial is
    $$T_2(x)=e-\frac{e}{2}x+\frac{11e}{24}x^2.$$
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |
      $\lim_{x \to 0} f(x) = e$. The polynomial is
      $$T_2(x)=e-\frac{e}{2}x+\frac{11e}{24}x^2.$$
- id: img-powerser-009-v1
  concept: Power Series
  source: Power and Taylor Series/pset_2.png
  prompt: |-
    Find the power series for $\frac{1}{1-x^2}$ and state its radius.
  explanation: |-
    $= \sum (x^2)^n = \sum x^{2n}$. $R=1$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $= \sum (x^2)^n = \sum x^{2n}$. $R=1$.
- id: img-powerser-047-v3
  concept: Series Evaluation of Limits
  source: Power and Taylor Series/pset_9.png
  prompt: |-
    Use series to evaluate $\lim_{n \to \infty} n^2(\cos(1/n)-1)$.
  explanation: |-
    $\cos(1/n) = 1 - 1/(2n^2) + O(1/n^4)$. $n^2(-1/(2n^2)) = -1/2$.
  type: numericResponse
  answer:
    value: -0.5
    tolerance: 0.0001
- id: img-powerser-006-v3
  concept: Recognizing Series Sums
  source: Power and Taylor Series/pset_2.png
  prompt: |-
    Find the sum $\sum_{n=0}^\infty \frac{1}{(2n+1)!}$.
  explanation: |-
    $= \sinh(1) = (e - 1/e)/2$.
  type: symbolicResponse
  answer:
    expectedLatex: (e-e^(-1))/2
    equivalenceMode: expression
    variables: []
    tolerance: 0.000001
- id: img-powerser-005-v1
  concept: Maclaurin Series Substitution
  source: Power and Taylor Series/pset_2.png
  prompt: |-
    Find the Maclaurin series for $\cos(x^3)$.
  explanation: |-
    $\cos(x^3) = \sum \frac{(-1)^n (x^3)^{2n}}{(2n)!} = \sum \frac{(-1)^n x^{6n}}{(2n)!}$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $\cos(x^3) = \sum \frac{(-1)^n (x^3)^{2n}}{(2n)!} = \sum \frac{(-1)^n x^{6n}}{(2n)!}$.
- id: img-powerser-039
  concept: Interval of Convergence
  source: Power and Taylor Series/pset_8.png
  prompt: |-
    Find the interval of convergence of $\sum \frac{(2x)^n}{n^2}$.
  explanation: |-
    $R=1/2$. At $x=1/2$: $\sum 1/n^2$ converges. At $x=-1/2$: $\sum (-1)^n/n^2$ converges. IOC: $[-1/2, 1/2]$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $R=1/2$. At $x=1/2$: $\sum 1/n^2$ converges. At $x=-1/2$: $\sum (-1)^n/n^2$ converges. IOC: $[-1/2, 1/2]$.
- id: img-powerser-038
  concept: Euler's Formula
  source: Power and Taylor Series/pset_8.png
  prompt: |-
    Derive Euler's formula $e^{i\theta} = \cos\theta + i\sin\theta$ from Maclaurin series.
  explanation: |-
    $e^{i\theta} = \sum \frac{(i\theta)^n}{n!} = \sum \frac{i^n\theta^n}{n!}$. Separate even/odd: $= \sum \frac{(-1)^n \theta^{2n}}{(2n)!} + i \sum \frac{(-1)^n \theta^{2n+1}}{(2n+1)!} = \cos\theta + i\sin\theta$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $e^{i\theta} = \sum \frac{(i\theta)^n}{n!} = \sum \frac{i^n\theta^n}{n!}$. Separate even/odd: $= \sum \frac{(-1)^n \theta^{2n}}{(2n)!} + i \sum \frac{(-1)^n \theta^{2n+1}}{(2n+1)!} = \cos\theta + i\sin\theta$.
