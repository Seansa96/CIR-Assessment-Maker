  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $= 2x \sum (-3x)^n = \sum (-1)^n 2 \cdot 3^n x^{n+1}$. $R=1/3$.
- id: img-powerser-025-v3
  concept: Multiplication of Series
  source: Power and Taylor Series/pset_5.png
  prompt: |-
    Find the power series for $e^x \ln(1+x)$ up to $x^3$.
  explanation: |-
    $(1+x+x^2/2)(x-x^2/2+x^3/3) = x - x^2/2 + x^3/3 + x^2 - x^3/2 + x^3/2 = x + x^2/2 + x^3/3$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $(1+x+x^2/2)(x-x^2/2+x^3/3) = x - x^2/2 + x^3/3 + x^2 - x^3/2 + x^3/2 = x + x^2/2 + x^3/3$.
