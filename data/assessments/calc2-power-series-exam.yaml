- id: img-powerser-041
  concept: Integration of Series
  source: Power and Taylor Series/pset_8.png
  prompt: |-
    Find the Maclaurin series for $\arcsin x$.
  explanation: |-
    $\frac{1}{\sqrt{1-x^2}} = \sum \binom{-1/2}{n} (-x^2)^n = \sum \frac{(2n)!}{4^n (n!)^2} x^{2n}$. Integrate: $\arcsin x = \sum \frac{(2n)!}{4^n (n!)^2} \frac{x^{2n+1}}{2n+1} = x + \frac{x^3}{6} + \frac{3x^5}{40} + \cdots$
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $\frac{1}{\sqrt{1-x^2}} = \sum \binom{-1/2}{n} (-x^2)^n = \sum \frac{(2n)!}{4^n (n!)^2} x^{2n}$. Integrate: $\arcsin x = \sum \frac{(2n)!}{4^n (n!)^2} \frac{x^{2n+1}}{2n+1} = x + \frac{x^3}{6} + \frac{3x^5}{40} + \cdots$
- id: img-powerser-037-v3
  concept: Power Series
  source: Power and Taylor Series/pset_8.png
