- id: img-powerser-007-v2
  concept: Radius of Convergence
  source: Power and Taylor Series/pset_2.png
  prompt: |-
    Find the radius of convergence of $\sum \frac{n^2 x^n}{2^n}$.
  explanation: |-
    Ratio: $\frac{(n+1)^2}{2^{n+1}} \frac{2^n}{n^2} |x| = \frac{1}{2} |x| < 1$. $R=2$.
  type: numericResponse
  answer:
    value: 2
    tolerance: 0.0001
- id: img-powerser-019-v3
  concept: Integration of Series
  source: Power and Taylor Series/pset_4.png
  prompt: |-
    Find the power series for $\int_0^x e^{-t^3} dt$.
  explanation: |-
    $e^{-t^3} = \sum (-1)^n t^{3n}/n!$. $\int = \sum \frac{(-1)^n x^{3n+1}}{n!(3n+1)}$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $e^{-t^3} = \sum (-1)^n t^{3n}/n!$. $\int = \sum \frac{(-1)^n x^{3n+1}}{n!(3n+1)}$.
