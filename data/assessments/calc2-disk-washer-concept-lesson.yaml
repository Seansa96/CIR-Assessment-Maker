lesson:
  introduction: |
    When a planar region is revolved around an axis, it sweeps out a 3D solid called a **solid of revolution**.
    If we slice this solid perpendicular to the axis of revolution, the cross-sections are circular.
  sections:
    - id: disk-method
      title: The Disk Method
      required: true
      content: |
        If the region being revolved rests perfectly flush against the axis of revolution, the solid is completely "solid" (no hole in the middle).
        Slicing perpendicular to the axis produces solid circular **disks**.

        The area of a circle is $A = \pi r^2$. 
        If we revolve around the x-axis, the radius $r$ at any point $x$ is just the function value $f(x)$.

        The volume is:
        
        $$
        V = \pi \int_a^b [f(x)]^2\,dx
        $$

        If revolving around the y-axis, the radius is $g(y)$, and we integrate with respect to $y$:
        
        $$
        V = \pi \int_c^d [g(y)]^2\,dy
        $$
      check:
        id: disk-method-check
        type: multipleChoice
        prompt: If you revolve the region bounded by $y = \sqrt{x}$, $y=0$, and $x=4$ around the x-axis, what is the correct integral?
        choices:
          - id: a
            text: $\pi \int_0^4 (\sqrt{x})^2\,dx$
          - id: b
            text: $\int_0^4 (\sqrt{x})^2\,dx$
          - id: c
            text: $\pi \int_0^4 \sqrt{x}\,dx$
          - id: d
            text: $\pi \int_0^2 (y^2)^2\,dy$
        answer:
          choiceId: a
        explanation: |
          The radius is the height of the curve $r = \sqrt{x}$. The area of the disk is $\pi r^2 = \pi (\sqrt{x})^2$.

    - id: washer-method
      title: The Washer Method
      required: true
      content: |
        If the region being revolved has a gap between it and the axis of revolution, the resulting solid will have a hole through its center.
        Slicing perpendicular to the axis produces a disk with a hole in it—a **washer**.

        The area of a washer is the area of the outer circle minus the area of the inner circle:
        $A = \pi R^2 - \pi r^2$

        The volume is:

        $$
        V = \pi \int_a^b \left( [R(x)]^2 - [r(x)]^2 \right)\,dx
        $$

        - $R(x)$ is the **outer radius** (distance from the axis to the furthest curve).
        - $r(x)$ is the **inner radius** (distance from the axis to the closest curve).
      check:
        id: washer-method-check
        type: multipleChoice
        prompt: Which of the following is a common mistake when setting up the washer method?
        choices:
          - id: a
            text: 'Squaring the difference of the radii: $\pi \int [R(x) - r(x)]^2\,dx$'
          - id: b
            text: Subtracting the inner radius squared from the outer radius squared.
          - id: c
            text: Pulling $\pi$ out to the front of the integral.
          - id: d
            text: Integrating with respect to x when revolving around the x-axis.
        answer:
          choiceId: a
        explanation: |
          A very common mistake! The area is $\pi R^2 - \pi r^2$, NOT $\pi(R-r)^2$. You must square the radii individually before subtracting.

    - id: shifted-axes
      title: Revolving Around Shifted Axes
      required: true
      content: |
        You don't have to revolve around the x-axis or y-axis. You can revolve around any horizontal or vertical line, like $y = -2$ or $x = 5$.
        
        The only thing that changes is how you compute the radius. The radius is always the distance between the curve and the axis of revolution.
        
        - If the curve is $y = f(x)$ and the axis is $y = k$ (where $k$ is below the curve), the radius is $f(x) - k$.
        - If the axis is $y = k$ (where $k$ is above the curve), the radius is $k - f(x)$.
      check:
        id: shifted-axes-check
        type: multipleChoice
        prompt: Let a region be bounded by $y = x^2$ and $y = x$. If we revolve this region around the horizontal line $y = -1$, what is the outer radius $R(x)$?
        choices:
          - id: a
            text: $R(x) = x - (-1) = x + 1$
          - id: b
            text: $R(x) = x^2 - (-1) = x^2 + 1$
          - id: c
            text: $R(x) = x$
          - id: d
            text: $R(x) = x^2$
        answer:
          choiceId: a
        explanation: |
          The upper curve is $y = x$, which is further away from $y = -1$ than $y = x^2$. So the outer radius is $x - (-1) = x + 1$.


