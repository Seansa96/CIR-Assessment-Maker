items:
- id: r001
  type: typed
  prompt: Define Lewis structure and name the representation in which it is used.
  answer:
    expected: An electron-bookkeeping drawing showing bonds, lone pairs, and sometimes formal charges.
    aliases:
    - Lewis structure
  explanation: 'Solution: An electron-bookkeeping drawing showing bonds, lone pairs, and sometimes formal charges. Why it
    works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r002
  type: typed
  prompt: What does valence electron tell you to count or distinguish?
  answer:
    expected: An electron in the occupied outer shell that can participate in bonding or ion formation.
    aliases:
    - valence electron
  explanation: 'Solution: An electron in the occupied outer shell that can participate in bonding or ion formation. Why it
    works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r003
  type: typed
  prompt: State one condition that must be checked when using skeletal arrangement.
  answer:
    expected: The atom connectivity selected before distributing remaining valence electrons.
    aliases:
    - skeletal arrangement
  explanation: 'Solution: The atom connectivity selected before distributing remaining valence electrons. Why it works: The
    definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r004
  type: typed
  prompt: Connect central atom to an observable or particle-level consequence.
  answer:
    expected: The atom connected to multiple surrounding atoms in a Lewis or geometry analysis.
    aliases:
    - central atom
  explanation: 'Solution: The atom connected to multiple surrounding atoms in a Lewis or geometry analysis. Why it works:
    The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r005
  type: typed
  prompt: Define terminal atom and name the representation in which it is used.
  answer:
    expected: An atom attached to only one other atom in the selected skeletal arrangement.
    aliases:
    - terminal atom
  explanation: 'Solution: An atom attached to only one other atom in the selected skeletal arrangement. Why it works: The
    definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r006
  type: typed
  prompt: What does bonding pair tell you to count or distinguish?
  answer:
    expected: A pair of electrons shared between two bonded atoms.
    aliases:
    - bonding pair
  explanation: 'Solution: A pair of electrons shared between two bonded atoms. Why it works: The definition identifies the
    exact model feature needed before applying a rule or drawing a conclusion.'
- id: r007
  type: typed
  prompt: State one condition that must be checked when using lone pair.
  answer:
    expected: A localized pair of valence electrons not shared between two atoms.
    aliases:
    - lone pair
  explanation: 'Solution: A localized pair of valence electrons not shared between two atoms. Why it works: The definition
    identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r008
  type: typed
  prompt: Connect single bond to an observable or particle-level consequence.
  answer:
    expected: One shared electron pair with bond order one.
    aliases:
    - single bond
  explanation: 'Solution: One shared electron pair with bond order one. Why it works: The definition identifies the exact
    model feature needed before applying a rule or drawing a conclusion.'
- id: r009
  type: typed
  prompt: Define multiple bond and name the representation in which it is used.
  answer:
    expected: A double or triple bond created by sharing more than one electron pair.
    aliases:
    - multiple bond
  explanation: 'Solution: A double or triple bond created by sharing more than one electron pair. Why it works: The definition
    identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r010
  type: typed
  prompt: What does formal charge tell you to count or distinguish?
  answer:
    expected: The bookkeeping charge obtained by assigning each atom all nonbonding electrons and half the bonding electrons.
    aliases:
    - formal charge
  explanation: 'Solution: The bookkeeping charge obtained by assigning each atom all nonbonding electrons and half the bonding
    electrons. Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a
    conclusion.'
- id: r011
  type: typed
  prompt: State one condition that must be checked when using electron-count check.
  answer:
    expected: Verification that every valence electron supplied by the formula and charge appears exactly once.
    aliases:
    - electron-count check
  explanation: 'Solution: Verification that every valence electron supplied by the formula and charge appears exactly once.
    Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r012
  type: typed
  prompt: Connect incomplete octet to an observable or particle-level consequence.
  answer:
    expected: A valid electron-deficient arrangement with fewer than eight electrons around an atom such as boron.
    aliases:
    - incomplete octet
  explanation: 'Solution: A valid electron-deficient arrangement with fewer than eight electrons around an atom such as boron.
    Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
