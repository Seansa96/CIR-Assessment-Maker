workedExamples:
- id: we001
  title: Hydraulic Lift System
  problem: |
    A mechanic uses a hydraulic lift to raise a car with a mass of $1500 \text{ kg}$. The lift consists of two circular pistons connected by a fluid. The small input piston has a radius of $0.05 \text{ m}$, and the large output piston holding the car has a radius of $0.25 \text{ m}$.
    Using $g = 9.8 \text{ m/s}^2$, calculate the minimum downward force that must be applied to the small piston to support the car.
  steps:
  - id: step-1
    title: 1. Calculate the weight of the car
    instruction: |
      Find the downward force exerted by the car on the large piston (the output force $F_2$).
    type: numericResponse
    prompt: |
      What is the weight of the car in Newtons?
    answer:
      value: 14700
      tolerance: 10
    explanation: |
      Solution:
      $W = mg = 1500 \times 9.8 = 14700 \text{ N}$.
      
      Why it works:
      The lift must exert an upward force at least equal to the gravitational force acting on the car.

  - id: step-2
    title: 2. Calculate the ratio of the areas
    instruction: |
      Instead of calculating the exact areas, it is often easier to calculate the ratio $A_2 / A_1$. For circular pistons, $A = \pi r^2$.
    type: numericResponse
    prompt: |
      What is the area ratio $A_2 / A_1$?
    answer:
      value: 25
      tolerance: 0.1
    explanation: |
      Solution:
      $\frac{A_2}{A_1} = \frac{\pi r_2^2}{\pi r_1^2} = \left(\frac{r_2}{r_1}\right)^2 = \left(\frac{0.25}{0.05}\right)^2 = 5^2 = 25$.
      
      Why it works:
      Since area scales with the square of the radius, a piston with 5 times the radius has 25 times the area.

  - id: step-3
    title: 3. Apply Pascal's Principle
    instruction: |
      Use Pascal's Principle ($F_1 / A_1 = F_2 / A_2$) to solve for the required input force $F_1$.
    type: numericResponse
    prompt: |
      What is the required input force $F_1$ in Newtons?
    answer:
      value: 588
      tolerance: 5
    explanation: |
      Solution:
      Rearranging Pascal's Principle gives $F_1 = F_2 \frac{A_1}{A_2}$.
      $F_1 = \frac{14700}{25} = 588 \text{ N}$.
      
      Why it works:
      Because the large piston has 25 times the area, it multiplies the input force by a factor of 25. Therefore, you only need to apply $1/25$th of the car's weight to lift it.
