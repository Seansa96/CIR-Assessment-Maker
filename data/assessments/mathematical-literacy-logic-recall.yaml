items:
- id: r001
  type: typed
  prompt: What must a sentence have to count as a mathematical statement?
  answer:
    expected: a definite truth value
    aliases:
    - it must be true or false
    - true or false
  explanation: |-
    Solution: It must have a definite truth value.
    Why it works: Statements are the sentences to which logic can assign true or false.
- id: r002
  type: typed
  prompt: In “if P, then Q,” what is P called?
  answer:
    expected: hypothesis
    aliases:
    - the hypothesis
    - antecedent
  explanation: |-
    Solution: P is the hypothesis.
    Why it works: The hypothesis is the condition assumed before the conclusion Q is asserted.
- id: r003
  type: typed
  prompt: 'What English phrase does $\forall$ mean?'
  answer:
    expected: for every
    aliases:
    - for all
    - every
  explanation: |-
    Solution: It means “for every.”
    Why it works: The universal quantifier requires the claim to hold for each object in its stated domain.
- id: r004
  type: typed
  prompt: To negate “there exists an x with property P,” what quantifier begins the negation?
  answer:
    expected: for every
    aliases:
    - for all
    - universal quantifier
  explanation: |-
    Solution: Begin with “for every.”
    Why it works: Negating an existence claim says that every permitted object fails to have the property.
- id: r005
  type: typed
  prompt: Before evaluating “if P, then Q,” what two parts should you identify?
  answer:
    expected: the hypothesis and conclusion
    aliases:
    - hypothesis and conclusion
    - P and Q as hypothesis and conclusion
  explanation: |-
    Solution: Identify the hypothesis and conclusion.
    Why it works: A conditional has a directed form: P is the hypothesis and Q is the conclusion asserted when P holds.
- id: r006
  type: typed
  prompt: Why translate a symbolic conditional into a full sentence?
  answer:
    expected: to check its direction and conditions
    aliases:
    - to preserve its direction and conditions
    - to check the hypothesis and conclusion
  explanation: |-
    Solution: Translate it to check its direction and conditions.
    Why it works: Reading the hypothesis, conclusion, and domain aloud prevents an unjustified reversal of the implication.
