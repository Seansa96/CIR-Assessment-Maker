- id: we1
  title: Changing Magnetic Field
  steps:
  - id: s1
    prompt: Use Faraday's Law.
    explanation: 'Solution:

      1) $\Phi_B = BA$. The area $A = \pi r^2 = \pi (0.1)^2 = 0.01\pi\text{ m}^2$.

      2) $\frac{d\Phi_B}{dt} = A \frac{dB}{dt} = (0.01\pi)(0.5) = 0.005\pi\text{ Wb/s}$.

      3) Magnitude of EMF: $|\mathcal{E}| = \frac{d\Phi_B}{dt} = 0.005\pi \approx 0.0157\text{ V}$.


      Why it works:

      The area is constant, so the change in flux is driven entirely by the rate of change of the magnetic
      field.'
    title: Use Faraday's Law.
    instruction: 'Work through this step: Use Faraday''s Law.'
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: A circular loop of radius $0.1\text{ m}$ is placed in a uniform magnetic field perpendicular
    to the plane of the loop. The magnetic field increases at a constant rate of $0.5\text{ T/s}$. Find
    the induced EMF in the loop.
