questions:
- id: q001
  type: multipleChoice
  prompt: |
    Which of the following best describes the universal gravitational potential energy $U$ of a two-body system?
  choices:
  - id: a
    text: 'It is always positive and decreases as the masses get closer.'
  - id: b
    text: 'It is always negative and approaches zero as the masses move infinitely far apart.'
  - id: c
    text: 'It is always zero regardless of the distance between the masses.'
  - id: d
    text: 'It is positive and approaches infinity as the masses move infinitely far apart.'
  answer:
    choiceId: b
  explanation: |
    Solution:
    The potential energy is always negative and approaches zero at infinity.
    
    Why it works:
    By convention, $U = -G\frac{m_1 m_2}{r}$. As $r \to \infty$, $U \to 0$. Because gravity is attractive, moving the masses closer from infinity (a lower energy state) makes the potential energy increasingly negative.
    
    Why the other choices fail:
    Gravity does not produce positive potential energy when the zero point is at infinity.
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
- id: q002
  type: numericResponse
  prompt: |
    Given $G = 6.67 \times 10^{-11} \text{ N m}^2/\text{kg}^2$, calculate the gravitational potential energy of a system consisting of a $1000 \text{ kg}$ mass and a $2000 \text{ kg}$ mass separated by a distance of $10 \text{ m}$.
    Enter your answer in Joules (it should be a negative number).
  answer:
    value: -0.000013
    tolerance: 0
  explanation: |
    Solution:
    $U = -G\frac{m_1 m_2}{r} = -(6.67 \times 10^{-11})\frac{(1000)(2000)}{10} = -1.334 \times 10^{-5} \text{ J}$.
    
    Why it works:
    This is a direct application of the universal formula for potential energy.
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
