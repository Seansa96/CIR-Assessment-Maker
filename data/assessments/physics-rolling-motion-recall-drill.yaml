items:
  - { id: rr1, type: cloze, prompt: 'For rolling without slipping, $v_{cm}=____\omega$.', answer: { expected: R, expectedLatex: 'R', aliases: [radius], media: [] }, explanation: 'Solution: Insert $R$.\n\nWhy it works: Arc length gives the no-slip speed relation.', tags: [constraint] }
  - { id: rr2, type: typed, prompt: 'What is the instantaneous ground-frame velocity of the contact point in pure rolling?', answer: { expected: zero, expectedLatex: '0', aliases: ['zero velocity', '0'], media: [] }, explanation: 'Solution: It is zero.\n\nWhy it works: Translation and rotation cancel at contact.', tags: [velocity] }
  - { id: rr3, type: cloze, prompt: 'For a wheel rolling without slipping, the top point moves at ____ times $v_{cm}$ in the ground frame.', answer: { expected: '2', expectedLatex: '2', aliases: [two], media: [] }, explanation: 'Solution: Insert 2.\n\nWhy it works: Both velocity contributions point forward at the top.', tags: [velocity] }
  - { id: rr4, type: typed, prompt: 'Which friction type supplies torque in ideal no-slip rolling?', answer: { expected: 'static friction', expectedLatex: '', aliases: [static], media: [] }, explanation: 'Solution: It is static friction.\n\nWhy it works: The surfaces do not slide at contact.', tags: [friction] }
  - { id: rr5, type: cloze, prompt: 'Rolling kinetic energy is the sum of translational and ____ kinetic energy.', answer: { expected: rotational, expectedLatex: '', aliases: [rotation], media: [] }, explanation: 'Solution: Insert rotational.\n\nWhy it works: A rolling body translates and rotates.', tags: [energy] }
  - { id: rr6, type: typed, prompt: 'What inertia quantity affects rolling acceleration down a slope?', answer: { expected: 'moment of inertia', expectedLatex: 'I', aliases: [inertia], media: [] }, explanation: 'Solution: It is moment of inertia.\n\nWhy it works: Rotational inertia resists angular acceleration.', tags: [dynamics] }
