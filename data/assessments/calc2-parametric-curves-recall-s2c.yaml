authoring: { visualRequirement: required, visualRationale: 'The drill includes directed-trace recognition.', sourceId: src-20260719182540-a40fdcd443 }
items:
  - { id: q001, type: cloze, prompt: 'For $x=x(t)$ and $y=y(t)$, both coordinates must use the same ____ value.', answer: { expected: parameter, aliases: [t] }, explanation: 'Solution: The missing word is parameter. Why it works: One parameter value selects one point. Common trap: Pairing x and y evaluated at different times.' }
  - { id: q002, type: typed, prompt: 'What information is lost when you eliminate t but keep only a Cartesian equation?', answer: { expected: orientation, aliases: ['trace direction', 'direction of travel'] }, explanation: 'Solution: Orientation is lost. Why it works: A locus is an unordered set of points. Common trap: Assuming an equation reports the start point.' }
  - { id: q003, type: cloze, prompt: 'For a counterclockwise unit-circle trace, $(\cos t,\sin t)$ starts at ____ when t is zero.', answer: { expected: '(1,0)', aliases: ['1,0'] }, explanation: 'Solution: The point is $(1,0)$. Why it works: cosine zero is one and sine zero is zero. Common trap: Starting at $(0,1)$.' }
  - { id: q004, type: recognition, prompt: 'The arrows in this image show what parametric feature?', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Directed parametric arch }], choices: [{ id: a, text: orientation }, { id: b, text: elimination }], answer: { choiceId: a, expected: orientation, aliases: [direction] }, explanation: 'Solution: The arrows show orientation. Why it works: They indicate increasing-parameter order. Common trap: The Cartesian locus itself has no direction.' }
  - { id: q005, type: typed, prompt: 'If $x=t^2$, state the necessary Cartesian restriction on x for real t.', answer: { expected: 'x greater than or equal to zero', aliases: ['x>=0', 'x ≥ 0'] }, explanation: 'Solution: x is greater than or equal to zero. Why it works: t squared is nonnegative. Common trap: Omitting the restriction after elimination.' }
