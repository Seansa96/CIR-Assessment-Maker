workedExamples:
  - id: signed-area-orientation
    title: Signed Area and Orientation
    problem: |
      ![Parametric area and surface intuition](/assessments/calc2-parametric-polar/parametric-integrals-area-surface-intuition.svg)

      For the parametric curve

      $$
      x=t^2-2t,\qquad y=t+1,\qquad 0\le t\le2,
      $$

      compute the signed area integral and the geometric area accumulated against the $x$-axis.
    steps:
      - id: signed-area-step-1
        title: Identify the correct area formula
        instruction: |
          Parametric area comes from the ordinary idea:

          $$
          A=\int y\,dx.
          $$

          Since $x=x(t)$, we use:

          $$
          dx=x'(t)\,dt.
          $$
        type: multipleChoice
        prompt: Which formula should be used for signed area?
        choices:
          - id: a
            text: '$\int_{\alpha}^{\beta} y(t)\frac{dx}{dt}\,dt$'
          - id: b
            text: '$\int_{\alpha}^{\beta} x(t)\frac{dy}{dt}\,dt$'
          - id: c
            text: '$\int_{\alpha}^{\beta}\sqrt{\left(\frac{dx}{dt}\right)^2+\left(\frac{dy}{dt}\right)^2}\,dt$'
          - id: d
            text: '$\int_{\alpha}^{\beta} x(t)y(t)\,dt$'
        answer:
          choiceId: a
        explanation: |
          The expression $y\,dx$ becomes $y(t)x'(t)\,dt$.
      - id: signed-area-step-2
        title: Compute $x'(t)$ and build the integrand
        instruction: |
          The curve is:

          $$
          x=t^2-2t,\qquad y=t+1.
          $$

          Differentiate $x$:

          $$
          x'(t)=2t-2.
          $$

          Then:

          $$
          y(t)x'(t)=(t+1)(2t-2)=2t^2-2.
          $$
        type: symbolicResponse
        prompt: Write the signed-area integrand.
        answer:
          expectedLatex: '2t^2-2'
          equivalenceMode: expression
          variables:
            - t
          tolerance: 0.000001
        explanation: |
          Multiplying $y(t)=t+1$ by $x'(t)=2t-2$ gives $2t^2-2$.
      - id: signed-area-step-3
        title: Evaluate the signed area
        instruction: |
          The signed area is:

          $$
          \int_0^2(2t^2-2)\,dt.
          $$

          An antiderivative is:

          $$
          \frac{2}{3}t^3-2t.
          $$
        type: numericResponse
        prompt: What is the signed area from $t=0$ to $t=2$?
        answer:
          value: 1.3333333333
          tolerance: 0.001
        explanation: |
          Evaluate:

          $$
          \left[\frac{2}{3}t^3-2t\right]_0^2
          =
          \frac{16}{3}-4
          =
          \frac{4}{3}.
          $$

          This is signed area, not necessarily total geometric area.
      - id: signed-area-step-4
        title: Detect orientation change
        instruction: |
          The sign of $x'(t)$ controls orientation in $x$:

          $$
          x'(t)=2t-2.
          $$

          This changes sign at $t=1$. From $0<t<1$, the curve moves left. From $1<t<2$, the curve moves right.
        type: multipleChoice
        prompt: Where should the area integral be split to find geometric area?
        choices:
          - id: a
            text: '$t=1$'
          - id: b
            text: '$t=0$ only'
          - id: c
            text: '$t=2$ only'
          - id: d
            text: No split is ever needed.
        answer:
          choiceId: a
        explanation: |
          Splitting at $t=1$ separates the negative signed contribution from the positive signed contribution.
      - id: signed-area-step-5
        title: Compute geometric area
        instruction: |
          The signed contribution on $[0,1]$ is:

          $$
          \int_0^1(2t^2-2)\,dt=-\frac{4}{3}.
          $$

          The signed contribution on $[1,2]$ is:

          $$
          \int_1^2(2t^2-2)\,dt=\frac{8}{3}.
          $$

          Total geometric area uses absolute contributions:

          $$
          \left|-\frac{4}{3}\right|+\left|\frac{8}{3}\right|.
          $$
        type: numericResponse
        prompt: What is the total geometric area?
        answer:
          value: 4
          tolerance: 0
        explanation: |
          The geometric area is:

          $$
          \frac{4}{3}+\frac{8}{3}=4.
          $$

          Related topic: signed area versus total accumulated area.

  - id: arc-length-and-surface-area
    title: Arc Length and Surface Area from One Parametric Curve
    problem: |
      Consider the upper-right quarter of the unit circle written parametrically as

      $$
      x=t,\qquad y=\sqrt{1-t^2},\qquad 0\le t\le1.
      $$

      Find the arc length and the surface area generated by rotating the curve about the $x$-axis.
    steps:
      - id: arc-surface-step-1
        title: Identify the curve and interval
        instruction: |
          Since

          $$
          x=t,\qquad y=\sqrt{1-t^2},
          $$

          the curve satisfies:

          $$
          x^2+y^2=t^2+(1-t^2)=1.
          $$

          The interval $0\le t\le1$ traces the upper-right quarter of the unit circle.
        type: multipleChoice
        prompt: What part of the circle is traced?
        choices:
          - id: a
            text: The upper-right quarter of the unit circle.
          - id: b
            text: The entire unit circle.
          - id: c
            text: The lower-left quarter of the unit circle.
          - id: d
            text: A straight line.
        answer:
          choiceId: a
        explanation: |
          Here $x=t$ moves from $0$ to $1$, and $y=\sqrt{1-t^2}$ stays nonnegative.
      - id: arc-surface-step-2
        title: Compute derivatives
        instruction: |
          Differentiate:

          $$
          x=t,\qquad y=\sqrt{1-t^2}.
          $$

          We get:

          $$
          x'(t)=1.
          $$
        type: symbolicResponse
        prompt: 'What is $y''(t)$?'
        answer:
          expectedLatex: '-\frac{t}{\sqrt{1-t^2}}'
          equivalenceMode: expression
          variables:
            - t
          tolerance: 0.000001
        explanation: |
          Use the chain rule:

          $$
          \frac{d}{dt}(1-t^2)^{1/2}
          =
          \frac12(1-t^2)^{-1/2}(-2t)
          =
          -\frac{t}{\sqrt{1-t^2}}.
          $$
      - id: arc-surface-step-3
        title: Simplify the arc-length integrand
        instruction: |
          The arc-length integrand is:

          $$
          \sqrt{(x'(t))^2+(y'(t))^2}.
          $$

          Substitute:

          $$
          \sqrt{1+\frac{t^2}{1-t^2}}
          =
          \sqrt{\frac{1}{1-t^2}}
          =
          \frac{1}{\sqrt{1-t^2}}.
          $$
        type: symbolicResponse
        prompt: Write the simplified arc-length integrand.
        answer:
          expectedLatex: '\frac{1}{\sqrt{1-t^2}}'
          equivalenceMode: expression
          variables:
            - t
          tolerance: 0.000001
        explanation: |
          The unit-circle structure makes the expression simplify to a familiar inverse-sine derivative.
      - id: arc-surface-step-4
        title: Evaluate the arc length
        instruction: |
          The arc length is:

          $$
          L=\int_0^1\frac{1}{\sqrt{1-t^2}}\,dt.
          $$

          This is:

          $$
          \left[\arcsin t\right]_0^1.
          $$
        type: symbolicResponse
        prompt: What is the exact arc length?
        answer:
          expectedLatex: '\frac{\pi}{2}'
          equivalenceMode: expression
          variables: []
          tolerance: 0.000001
        explanation: |
          Since $\arcsin(1)=\frac{\pi}{2}$ and $\arcsin(0)=0$, the arc length is $\frac{\pi}{2}$, matching one quarter of a unit circle's circumference.
      - id: arc-surface-step-5
        title: Set up surface area about the $x$-axis
        instruction: |
          Rotating about the $x$-axis uses radius $y(t)$:

          $$
          S=2\pi\int_0^1 y(t)\,ds.
          $$

          Since

          $$
          y(t)=\sqrt{1-t^2}
          $$

          and

          $$
          ds=\frac{1}{\sqrt{1-t^2}}\,dt,
          $$

          the product $y(t)\,ds$ simplifies dramatically.
        type: multipleChoice
        prompt: What does $y(t)\sqrt{(x')^2+(y')^2}$ simplify to?
        choices:
          - id: a
            text: '$1$'
          - id: b
            text: '$t$'
          - id: c
            text: '$\sqrt{1-t^2}$'
          - id: d
            text: '$\frac{1}{1-t^2}$'
        answer:
          choiceId: a
        explanation: |
          The product is:

          $$
          \sqrt{1-t^2}\cdot\frac{1}{\sqrt{1-t^2}}=1.
          $$
      - id: arc-surface-step-6
        title: Evaluate the surface area
        instruction: |
          The surface area is:

          $$
          S=2\pi\int_0^1 1\,dt.
          $$
        type: symbolicResponse
        prompt: What is the exact surface area?
        answer:
          expectedLatex: '2\pi'
          equivalenceMode: expression
          variables: []
          tolerance: 0.000001
        explanation: |
          Evaluate:

          $$
          2\pi\int_0^1 1\,dt=2\pi.
          $$

          This matches the surface area of a hemisphere of radius $1$.
