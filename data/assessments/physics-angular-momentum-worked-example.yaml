schemaVersion: 1
id: physics-angular-momentum-worked-example
title: 'Worked Example: Angular Momentum'
description: Calculating angular momentum of a moving particle.
assessmentType: workedExample
categoryId: physics-1
subcategoryIds:
- physics-angular-momentum
workedExamples:
- id: we-ang-mom-1
  title: Particle Moving in a Straight Line
  problem: A particle of mass $m = 3.0 \text{ kg}$ is moving with a constant velocity
    $\vec{v} = 4.0\hat{i} \text{ m/s}$. At $t=0$, it is at position $\vec{r} = (2.0\hat{i}
    + 5.0\hat{j}) \text{ m}$. Calculate its angular momentum with respect to the origin.
  steps:
  - id: we-ang-mom-1-step1
    title: 'Step 1: Identify Vectors'
    instruction: Write down the position and linear momentum vectors.
    prompt: What are $\vec{r}$ and $\vec{p}$?
    type: freeResponse
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $\vec{r} = 2.0\hat{i} + 5.0\hat{j}$
      - $\vec{p} = m\vec{v} = 3.0(4.0\hat{i}) = 12.0\hat{i} \text{ kg}\cdot\text{m/s}$
  - id: we-ang-mom-1-step2
    title: 'Step 2: Cross Product'
    instruction: Use $\vec{L} = \vec{r} \times \vec{p}$.
    prompt: What is the angular momentum vector?
    type: freeResponse
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $\vec{L} = (2.0\hat{i} + 5.0\hat{j}) \times (12.0\hat{i})$
      - $\hat{i} \times \hat{i} = 0$, and $\hat{j} \times \hat{i} = -\hat{k}$
      - $\vec{L} = 5.0(12.0)(\hat{j} \times \hat{i}) = -60.0\hat{k} \text{ kg}\cdot\text{m}^2/\text{s}$
