questions:
- id: lewis-1
  title: Lewis Dot Concept
  type: multipleChoice
  prompt: 'Adapted from OpenStax College Chemistry 2e.


    Which of the following is the defining feature of a Lewis symbol for a main-group
    element?'
  choices:
  - id: c1
    text: It represents the element's valence electrons as dots around the atomic
      symbol.
  - id: c2
    text: It represents all electrons in the atom as dots.
  - id: c3
    text: It represents the protons in the nucleus.
  - id: c4
    text: It shows the number of neutrons as dots.
  answer:
    gradingMode: auto
    choiceId: c1
  explanation: Lewis symbols specifically illustrate the valence electrons, which
    are the electrons involved in bonding.
