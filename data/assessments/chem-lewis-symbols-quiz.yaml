questions:
  - id: lewis-q01
    title: Purpose of Lewis Symbols
    type: multipleChoice
    prompt: |
      What do the dots in a Lewis electron-dot symbol represent?
    choices:
      - id: a
        text: Only the valence electrons of the atom.
      - id: b
        text: All the electrons in the atom.
      - id: c
        text: The protons and neutrons in the nucleus.
      - id: d
        text: The number of bonds the atom will form.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Lewis symbols (or dot diagrams) only show the valence (outermost) electrons, because these are the only electrons involved in chemical bonding. The element's symbol represents the nucleus and inner core electrons.

  - id: lewis-q02
    title: Determining Valence Electrons
    type: multipleChoice
    prompt: |
      How many dots should be drawn around the chemical symbol for a neutral Phosphorus (P) atom?
    choices:
      - id: a
        text: 5
      - id: b
        text: 15
      - id: c
        text: 3
      - id: d
        text: 8
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Phosphorus is in Group 15 (or Group VA) of the periodic table. Elements in this group have 5 valence electrons, so a neutral P atom is drawn with 5 dots.

  - id: lewis-q03
    title: Drawing the Dots
    type: multipleChoice
    prompt: |
      When drawing the 6 valence electrons around an Oxygen (O) atom, what is the correct placement according to Hund's rule?
    choices:
      - id: a
        text: Place one dot on each of the four sides, then pair up the remaining two.
      - id: b
        text: Place three pairs of dots on three sides, leaving one side completely empty.
      - id: c
        text: Place all 6 dots on one side of the symbol.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Following Hund's rule, electrons spread out before they pair up. You place one electron on the top, bottom, left, and right, before adding the 5th and 6th electrons to create two pairs and two single unpaired electrons.

  - id: lewis-q04
    title: The Octet Rule
    type: multipleChoice
    prompt: |
      What is the primary driving force behind the formation of chemical bonds according to the Lewis model?
    choices:
      - id: a
        text: Atoms transfer or share electrons to achieve a full valence shell (an octet), mimicking the stable electron configuration of a noble gas.
      - id: b
        text: Atoms bond to neutralize their protons.
      - id: c
        text: Atoms bond to increase their total atomic mass.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** The octet rule states that atoms are most stable when their valence shell is full (usually 8 electrons, like the noble gases). They will form ionic or covalent bonds to achieve this state.

  - id: lewis-q05
    title: Exceptions to the Octet Rule (Incomplete)
    type: multipleChoice
    prompt: |
      Which of the following elements frequently forms stable compounds with an *incomplete* octet (fewer than 8 valence electrons)?
    choices:
      - id: a
        text: Boron (B)
      - id: b
        text: Carbon (C)
      - id: c
        text: Nitrogen (N)
      - id: d
        text: Fluorine (F)
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Boron has only 3 valence electrons. In compounds like $\text{BF}_3$, it forms 3 covalent bonds, ending up with only 6 shared electrons. It is surprisingly stable in this electron-deficient state. (Hydrogen and Helium are also exceptions, satisfying the "duet" rule).

  - id: lewis-q06
    title: Exceptions to the Octet Rule (Expanded)
    type: multipleChoice
    prompt: |
      Why can Sulfur form a molecule like $\text{SF}_6$, which has 12 valence electrons around the central Sulfur atom (an expanded octet), while Oxygen cannot form $\text{OF}_6$?
    choices:
      - id: a
        text: Sulfur is in Period 3 and has empty d-orbitals available to participate in bonding and hold extra electrons. Oxygen is in Period 2 and has no d-orbitals.
      - id: b
        text: Sulfur is heavier and has stronger gravity.
      - id: c
        text: Oxygen is too electronegative to share electrons.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Elements in Period 3 or higher (like P, S, Cl, Xe) have access to $3d$ (or higher) empty orbitals. These can be used to hold more than 8 valence electrons, creating an "expanded octet". Period 2 elements (C, N, O, F) only have $s$ and $p$ orbitals and can *never* exceed 8 electrons.

  - id: lewis-q07
    title: Counting Electrons in Lewis Structures
    type: numericResponse
    prompt: |
      When drawing the Lewis structure for the polyatomic Carbonate ion ($\text{CO}_3^{2-}$), what is the **total** number of valence electrons that must be placed in the diagram?
    answer:
      value: 24
      tolerance: 0
    explanation: |
      Carbon brings 4.
      Three Oxygens bring $3 \times 6 = 18$.
      The $-2$ charge means there are 2 extra electrons.
      Total $= 4 + 18 + 2 = 24$ valence electrons.

  - id: lewis-q08
    title: Formal Charge Calculation
    type: numericResponse
    prompt: |
      In a Lewis structure, a central Nitrogen atom has 4 single bonds and no lone pairs. What is the formal charge on this Nitrogen atom?
    answer:
      value: 1
      tolerance: 0
    explanation: |
      $\text{Formal Charge} = (\text{Valence } e^-) - (\text{Nonbonding } e^-) - \frac{1}{2}(\text{Bonding } e^-)$.
      Nitrogen normally has 5 valence electrons.
      It has 0 nonbonding electrons.
      It has 8 bonding electrons (4 single bonds), half of which is 4.
      $FC = 5 - 0 - 4 = +1$. (This is the case in the Ammonium ion, $\text{NH}_4^+$).

  - id: lewis-q09
    title: Using Formal Charge
    type: multipleChoice
    prompt: |
      When there are multiple valid Lewis structures for a molecule, how is formal charge used to determine the most favored (stable) structure?
    choices:
      - id: a
        text: The most stable structure minimizes the magnitude of formal charges, and places any negative formal charge on the most electronegative atom.
      - id: b
        text: The most stable structure maximizes the formal charges on all atoms.
      - id: c
        text: The most stable structure places positive formal charges on the most electronegative atoms.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** A structure with formal charges of 0 is preferred. If charges are unavoidable, they should be as small as possible ($\pm 1$), and negative charges should sit on the atoms that pull electrons most strongly (like O or F).

  - id: lewis-q10
    title: Resonance Structures
    type: multipleChoice
    prompt: |
      What does it mean when a molecule is represented by two or more resonance Lewis structures?
    choices:
      - id: a
        text: The true structure of the molecule is a permanent, stable hybrid (average) of all the resonance structures.
      - id: b
        text: The molecule is constantly and rapidly flipping back and forth between the different structures.
      - id: c
        text: Some molecules in the sample exist as one structure, and the rest exist as the other.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Resonance is a limitation of the Lewis drawing system. Electrons are delocalized (spread out). The molecule doesn't flip back and forth; it exists as a single, static blend of the possibilities. Just as a mule is a hybrid of a horse and a donkey, it doesn't rapidly flip between being a horse and a donkey.
