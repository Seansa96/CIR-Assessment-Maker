items:
- id: r001
  type: typed
  prompt: Which keyword is used to provide an alternative condition if the first `if`
    statement is false?
  answer:
    expected: elif
    aliases:
    - else if
- id: r002
  type: typed
  prompt: Which logical operator requires BOTH conditions to be true?
  answer:
    expected: and
- id: r003
  type: typed
  prompt: Which logical operator requires AT LEAST ONE condition to be true?
  answer:
    expected: or
- id: r004
  type: typed
  prompt: Which logical operator flips a boolean value?
  answer:
    expected: not
- id: r005
  type: typed
  prompt: Which keyword is used in Python 3.10+ to compare a single variable against
    multiple exact values (similar to a switch statement)?
  answer:
    expected: match
- id: r006
  type: typed
  prompt: Inside a `match` block, what keyword precedes the value you are checking
    against?
  answer:
    expected: case
- id: r007
  type: typed
  prompt: Which character acts as the wildcard or "default" in a `match/case` statement?
  answer:
    expected: _
    aliases:
    - underscore
- id: r008
  type: typed
  prompt: What keyword acts as a placeholder that does absolutely nothing, useful
    when you need an empty `if` block?
  answer:
    expected: pass
