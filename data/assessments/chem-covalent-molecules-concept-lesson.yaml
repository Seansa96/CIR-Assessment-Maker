lesson:
  introduction: Build a reliable model of covalent molecules and bonding by separating electron accounting, particle representation,
    and observable evidence.
  sections:
  - id: sec-what-is-covalent
    title: Connect overlap to a bond
    required: true
    content: Covalent bonding lowers energy when attractive electron-nucleus interactions outweigh repulsions at an equilibrium
      separation.
    check:
      id: chk-sec-what-is-covalent
      type: multipleChoice
      prompt: Which statement correctly applies the idea of connect overlap to a bond?
      choices:
      - id: a
        text: The bond-length minimum marks a stable separation.
        issueSignals: []
      - id: b
        text: The nuclei collapse together because attraction has no repulsive limit.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      answer:
        choiceId: a
      explanation: 'Solution: The bond-length minimum marks a stable separation. Why it works: Covalent bonding lowers energy
        when attractive electron-nucleus interactions outweigh repulsions at an equilibrium separation. Why the other choices
        fail: The other statements either reverse the relevant electron or charge accounting or apply a structural model outside
        its stated scope.'
    media:
    - type: image
      src: /media/chemistry/bonding-sigma-pi-map.svg
      alt: Instructional workflow for covalent molecules and bonding showing the central particle-level decisions.
      caption: Use the representation to connect observable evidence with electron and particle accounting.
  - id: sec-bond-order
    title: Relate order, length, and strength
    required: true
    content: For the same atom pair, higher bond order generally means shorter, stronger bonding.
    check:
      id: chk-sec-bond-order
      type: multipleChoice
      prompt: Which statement correctly applies the idea of relate order, length, and strength?
      choices:
      - id: a
        text: A carbon triple bond is shorter than a carbon single bond.
        issueSignals: []
      - id: b
        text: A carbon triple bond is longer because it contains more electrons.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      answer:
        choiceId: a
      explanation: 'Solution: A carbon triple bond is shorter than a carbon single bond. Why it works: For the same atom pair,
        higher bond order generally means shorter, stronger bonding. Why the other choices fail: The other statements either
        reverse the relevant electron or charge accounting or apply a structural model outside its stated scope.'
  - id: sec-sigma-pi
    title: Count sigma and pi bonds
    required: true
    content: Every localized single bond is sigma; a double bond adds one pi and a triple bond adds two pi bonds.
    check:
      id: chk-sec-sigma-pi
      type: multipleChoice
      prompt: Which statement correctly applies the idea of count sigma and pi bonds?
      choices:
      - id: a
        text: A C triple C bond contains one sigma and two pi bonds.
        issueSignals: []
      - id: b
        text: A C triple C bond contains three sigma bonds.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      answer:
        choiceId: a
      explanation: 'Solution: A C triple C bond contains one sigma and two pi bonds. Why it works: Every localized single
        bond is sigma; a double bond adds one pi and a triple bond adds two pi bonds. Why the other choices fail: The other
        statements either reverse the relevant electron or charge accounting or apply a structural model outside its stated
        scope.'
  - id: sec-rotation
    title: Explain restricted rotation
    required: true
    content: Rotating a double bond would disrupt side-by-side pi overlap, so rotation is restricted unless the pi interaction
      is broken.
    check:
      id: chk-sec-rotation
      type: multipleChoice
      prompt: Which statement correctly applies the idea of explain restricted rotation?
      choices:
      - id: a
        text: A carbon-carbon double bond resists free rotation.
        issueSignals: []
      - id: b
        text: A sigma bond prevents all rotation because its density is cylindrical.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      answer:
        choiceId: a
      explanation: 'Solution: A carbon-carbon double bond resists free rotation. Why it works: Rotating a double bond would
        disrupt side-by-side pi overlap, so rotation is restricted unless the pi interaction is broken. Why the other choices
        fail: The other statements either reverse the relevant electron or charge accounting or apply a structural model outside
        its stated scope.'
  - id: sec-bond-energy-enthalpy
    title: Estimate reaction enthalpy
    required: true
    content: An average-bond-enthalpy estimate subtracts energy released by formed bonds from energy required for broken bonds.
    check:
      id: chk-sec-bond-energy-enthalpy
      type: multipleChoice
      prompt: Which statement correctly applies the idea of estimate reaction enthalpy?
      choices:
      - id: a
        text: Delta H is approximately bonds broken minus bonds formed.
        issueSignals: []
      - id: b
        text: Delta H is bonds formed minus bonds broken regardless of sign convention.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      answer:
        choiceId: a
      explanation: 'Solution: Delta H is approximately bonds broken minus bonds formed. Why it works: An average-bond-enthalpy
        estimate subtracts energy released by formed bonds from energy required for broken bonds. Why the other choices fail:
        The other statements either reverse the relevant electron or charge accounting or apply a structural model outside
        its stated scope.'
  - id: sec-model-limits
    title: Use average data cautiously
    required: true
    content: Average bond enthalpies depend on molecular environment, so they estimate rather than exactly reproduce a reaction
      enthalpy.
    check:
      id: chk-sec-model-limits
      type: multipleChoice
      prompt: Which statement correctly applies the idea of use average data cautiously?
      choices:
      - id: a
        text: A bond-enthalpy result should be labeled an estimate.
        issueSignals: []
      - id: b
        text: One tabulated C-H value is exact in every molecule.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      answer:
        choiceId: a
      explanation: 'Solution: A bond-enthalpy result should be labeled an estimate. Why it works: Average bond enthalpies
        depend on molecular environment, so they estimate rather than exactly reproduce a reaction enthalpy. Why the other
        choices fail: The other statements either reverse the relevant electron or charge accounting or apply a structural
        model outside its stated scope.'
