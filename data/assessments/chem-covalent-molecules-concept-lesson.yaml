lesson:
  introduction: |
    Covalent bonds are the foundation of molecular chemistry. When two nonmetal atoms share one or more pairs of electrons, they form a covalent bond that holds them together. The strength, length, and type of that bond determine much of a molecule's physical and chemical behavior — from how drugs bind receptors to how fuels release energy.
  sections:
    - id: sec-what-is-covalent
      title: What Makes a Covalent Bond?
      required: true
      content: |
        A **covalent bond** forms when two atoms share one or more pairs of electrons. Unlike ionic bonding, where one atom transfers electrons to another, covalent bonding is cooperative — both nuclei attract the shared electrons, and those shared electrons act as the "glue" between the atoms.

        Covalent bonding occurs primarily between **nonmetals**. The driving force is stability: by sharing electrons, each atom can achieve a filled outer shell (usually an octet).

        The simplest example is $H_2$: each H atom has 1 valence electron and needs 1 more to fill its shell. By sharing one pair:

        $$
        H \text{—} H \quad \text{(single bond, 2 shared electrons)}
        $$

        The shared pair is counted toward the "quota" of both atoms. This is the essence of covalent bonding.
      check:
        id: chk-cov-mol-1
        type: multipleChoice
        prompt: |
          In a covalent bond, the shared electrons are attracted by:
        choices:
          - id: a
            text: Only the more electronegative atom
          - id: b
            text: Both nuclei of the bonded atoms
          - id: c
            text: Neither nucleus — they float freely between atoms
          - id: d
            text: The core (inner-shell) electrons of each atom
        answer:
          choiceId: b
        explanation: |
          Covalent bonds form because **both nuclei** attract the shared electron pair. The electrostatic attraction between two positive nuclei and the shared negative electron density is what holds the atoms together. This is distinct from ionic bonding, where electron transfer creates oppositely charged ions.

    - id: sec-bond-order
      title: Bond Order, Bond Length, and Bond Energy
      required: true
      content: |
        **Bond order** is the number of shared electron *pairs* between two atoms:

        | Bond Type | Shared Pairs | Electrons | Example |
        |---|---|---|---|
        | Single bond | 1 | 2 | $F_2$, $H_2O$ |
        | Double bond | 2 | 4 | $O_2$, $CO_2$ |
        | Triple bond | 3 | 6 | $N_2$, $CO$ |

        These bond types differ dramatically in their physical properties:

        **Bond length** decreases with higher bond order. More shared electrons pull the nuclei closer together:

        $$
        \text{C—C} = 154 \text{ pm} > \text{C=C} = 134 \text{ pm} > \text{C≡C} = 120 \text{ pm}
        $$

        **Bond energy** (enthalpy required to break 1 mol of bonds in the gas phase) increases with higher bond order:

        $$
        D(\text{C—C}) \approx 347 \text{ kJ/mol} < D(\text{C=C}) \approx 614 \text{ kJ/mol} < D(\text{C≡C}) \approx 839 \text{ kJ/mol}
        $$

        **Key trend:** Higher bond order → shorter bond → stronger bond.
      media:
        - type: image
          src: /media/chemistry/covalent-bonding/chem-covalent-sigma-pi-bonds.png
          alt: Diagram showing end-to-end sigma bond overlap and side-to-side pi bond overlap for a carbon-carbon double bond.
          caption: "Sigma bonds form by end-to-end overlap; pi bonds form by side-to-side overlap. Every double bond is 1 σ + 1 π."
      check:
        id: chk-cov-mol-2
        type: multipleChoice
        prompt: |
          Rank the following bonds from **shortest** to **longest**: N—N, N=N, N≡N.
        choices:
          - id: a
            text: 'N—N < N=N < N≡N'
          - id: b
            text: 'N≡N < N=N < N—N'
          - id: c
            text: 'N=N < N—N < N≡N'
          - id: d
            text: All three bonds are the same length
        answer:
          choiceId: b
        explanation: |
          Bond length **decreases** as bond order increases. N≡N (triple bond, order 3) is the shortest; N—N (single bond, order 1) is the longest. The greater the number of shared electron pairs, the closer the nuclei are drawn together.

    - id: sec-sigma-pi
      title: Sigma and Pi Bonds
      required: true
      content: |
        Covalent bonds are classified by the *geometry* of orbital overlap:

        **Sigma (σ) bond** — overlap occurs directly *along* the bond axis (end-to-end). Every single bond is a σ bond. Atoms can rotate freely around a σ bond.

        **Pi (π) bond** — overlap occurs *above and below* the bond axis (side-to-side). Pi bonds exist only in multiple bonds and resist rotation (rotating breaks the π bond).

        The counting rule:
        - **Single bond** = 1 σ
        - **Double bond** = 1 σ + 1 π
        - **Triple bond** = 1 σ + 2 π

        Examples:
        - $CO_2$ (O=C=O): **2 σ, 2 π** (each C=O has 1σ + 1π)
        - $N_2$ (N≡N): **1 σ, 2 π**
        - $H_2O$ (H—O—H): **2 σ, 0 π**
        - Acetylene $HC \equiv CH$: **3 σ, 2 π** (H−C: 1σ, C≡C: 1σ+2π, C−H: 1σ)
      check:
        id: chk-cov-mol-3
        type: multipleChoice
        prompt: |
          In a molecule of formaldehyde ($H_2C=O$), how many total sigma ($\sigma$) and pi ($\pi$) bonds are present?
        choices:
          - id: a
            text: '2 σ, 1 π'
          - id: b
            text: '3 σ, 1 π'
          - id: c
            text: '2 σ, 2 π'
          - id: d
            text: '3 σ, 2 π'
        answer:
          choiceId: b
        explanation: |
          In $H_2C=O$: two C−H single bonds (1σ each = 2σ) plus one C=O double bond (1σ + 1π). Total: **3 σ bonds and 1 π bond**.

    - id: sec-bond-energy-enthalpy
      title: Using Bond Energies to Estimate Reaction Enthalpy
      required: true
      content: |
        Average bond energies allow us to estimate the enthalpy change for a gas-phase reaction:

        $$
        \Delta H_{rxn} \approx \sum D(\text{bonds broken}) - \sum D(\text{bonds formed})
        $$

        Breaking bonds **requires** energy (endothermic contribution). Forming bonds **releases** energy (exothermic contribution). When more energy is released forming bonds than absorbed breaking them, the reaction is **exothermic** ($\Delta H < 0$).

        **Worked estimate:** $H_2(g) + F_2(g) \to 2\,HF(g)$

        | Step | Bond | $D$ (kJ/mol) |
        |---|---|---|
        | Break 1 H—H | 436 | +436 |
        | Break 1 F—F | 155 | +155 |
        | Form 2 H—F | 567 each | −1134 |

        $$
        \Delta H \approx 436 + 155 - 1134 = -543 \text{ kJ/mol}
        $$

        This is an *estimate* because tabulated bond energies are averages over many molecules, not exact values for this specific reaction.
      check:
        id: chk-cov-mol-4
        type: multipleChoice
        prompt: |
          Using the bond energy approach, if $\sum D(\text{broken}) = 820$ kJ and $\sum D(\text{formed}) = 1050$ kJ, the reaction is:
        choices:
          - id: a
            text: Endothermic; $\Delta H \approx +230$ kJ
          - id: b
            text: Exothermic; $\Delta H \approx -230$ kJ
          - id: c
            text: Exothermic; $\Delta H \approx +230$ kJ
          - id: d
            text: Endothermic; $\Delta H \approx -230$ kJ
        answer:
          choiceId: b
        explanation: |
          $\Delta H \approx 820 - 1050 = -230$ kJ. The negative sign indicates more energy is released forming bonds than consumed breaking them, so the reaction is **exothermic**. The surroundings absorb 230 kJ per mole of reaction.
