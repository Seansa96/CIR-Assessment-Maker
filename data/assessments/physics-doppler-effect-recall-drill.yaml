items:
- {id: dop-r1, type: cloze, prompt: 'For a source and observer moving toward each other, $f_o=f_s{{(v+v_o)/(v-v_s)}}$.', answer: '(v+v_o)/(v-v_s)', explanation: 'Solution: Use plus in the observer numerator and minus in the source denominator. Why it works: both motions increase wavefront arrival rate.'}
- {id: dop-r2, type: typed, prompt: 'Does an approaching source raise or lower observed frequency?', answer: raise, explanation: 'Solution: It raises observed frequency. Why it works: the source compresses wavefronts in front of it.'}
- {id: dop-r3, type: cloze, prompt: 'If source and observer are stationary, $f_o={{f_s}}$.', answer: f_s, explanation: 'Solution: Set both velocities to zero. Why it works: the Doppler ratio becomes $v/v=1$.'}
- {id: dop-r4, type: typed, prompt: 'Which speed is normally the reference-frame speed for sound Doppler problems?', answer: 'speed of sound in the medium', explanation: 'Solution: Use the sound speed in the medium. Why it works: source and observer velocities are measured relative to the medium.'}
- {id: dop-r5, type: cloze, prompt: 'A source moving away produces a {{lower}} observed frequency behind it.', answer: lower, explanation: 'Solution: Identify a lower frequency. Why it works: moving away stretches the wavelength.'}
- {id: dop-r6, type: typed, prompt: 'Is the Doppler velocity ratio dimensionless?', answer: yes, explanation: 'Solution: Yes. Why it works: it is a ratio of speeds, so observed frequency retains hertz units.'}
