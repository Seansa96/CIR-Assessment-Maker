lesson:
  introduction: Rolling without slipping is a special type of motion that perfectly
    links the translational motion of an object's center of mass with its rotational
    motion.
  sections:
  - id: sec-1
    title: Rolling Without Slipping
    content: "When a symmetric object (like a wheel or sphere) rolls without slipping\
      \ across a surface, its center of mass moves forward a distance equal to the\
      \ arc length rolled along its rim. \n\nThis exact 1-to-1 mapping means that\
      \ the translational velocity of the center of mass ($v_{cm}$) is strictly tied\
      \ to the angular velocity ($\\omega$) by the relation: $$v_{cm} = R\\omega$$\n\
      Similarly, the translational acceleration is tied to the angular acceleration:\
      \ $$a_{cm} = R\\alpha$$"
    media:
    - type: image
      src: /media/physics/animations/rolling-motion.gif
      alt: Animation of a wheel rolling without slipping, demonstrating the superposition
        of translational and rotational velocities.
      caption: 'Figure 1: Rolling motion is the superposition of pure translation
        and pure rotation.'
    check:
      id: chk-rm-1
      type: multipleChoice
      prompt: If a tire of radius 0.5 m is rolling without slipping with an angular
        velocity of 10 rad/s, what is the speed of its center of mass?
      choices:
      - id: a
        text: 5 m/s
      - id: b
        text: 10 m/s
      - id: c
        text: 20 m/s
      - id: d
        text: 0 m/s
      answer:
        choiceId: a
      explanation: For rolling without slipping, $v_{cm} = R\omega = (0.5\text{ m})(10\text{
        rad/s}) = 5\text{ m/s}$.
  - id: sec-2
    title: Velocities of Different Points
    content: "Rolling can be viewed as pure translation of the center of mass PLUS\
      \ pure rotation about the center of mass. \n\nBecause of this superposition:\n\
      - The center of mass moves at $v_{cm}$.\n- The top of the wheel has a translational\
      \ velocity $v_{cm}$ *plus* a tangential rotational velocity $R\\omega$ pointing\
      \ forward. Since $v_{cm} = R\\omega$, the top moves at $2v_{cm}$ relative to\
      \ the ground.\n- The point in contact with the ground has a translational velocity\
      \ $v_{cm}$ forward, but a tangential rotational velocity $R\\omega$ pointing\
      \ *backward*. Thus, its net velocity relative to the ground is $v_{cm} - R\\\
      omega = 0$. The contact point is momentarily at rest!"
    media: []
    check:
      id: chk-rm-2
      type: multipleChoice
      prompt: For a car wheel rolling without slipping forward at a highway speed
        of 30 m/s, what is the instantaneous speed of the exact piece of rubber touching
        the pavement?
      choices:
      - id: a
        text: 30 m/s backwards
      - id: b
        text: 0 m/s
      - id: c
        text: 30 m/s forwards
      - id: d
        text: 60 m/s forwards
      answer:
        choiceId: b
      explanation: In rolling without slipping, the point of contact with the ground
        is momentarily at rest ($0\text{ m/s}$). This static contact is why static
        friction drives the car, not kinetic friction.
