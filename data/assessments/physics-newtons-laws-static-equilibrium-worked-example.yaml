- id: we-static-equilibrium-sign
  title: Tensions in Angled Cables
  problem: |
    A shop sign of mass $m = 20.0 \text{ kg}$ hangs in static equilibrium, supported by two cables. Cable 1 attaches to the left wall at an angle $\theta_1 = 30^\circ$ above the horizontal. Cable 2 attaches to the right wall at an angle $\theta_2 = 60^\circ$ above the horizontal.

    First, carefully establish the symbolic equations for static equilibrium and find the general expression for the tension $T_1$ in Cable 1.

    Then, calculate the numerical value of $T_1$. Assume $g = 9.8 \text{ m/s}^2$.
  steps:
  - id: step-we-static-equilibrium-sign-1
    title: Set up the Free Body Diagram and Axes
    type: freeResponse
    prompt: Did you understand this step?
    answer:
      gradingMode: selfCheck
    instruction: 'The system is in **static equilibrium**, which means the sign is not accelerating in any direction. The knot where the three cables (two angled cables and the vertical cable holding the sign) meet is our object of interest.


      Forces acting on the knot:

      1.  **$T_1$:** Tension from the left cable, pointing up and to the left at angle $\theta_1 = 30^\circ$.

      2.  **$T_2$:** Tension from the right cable, pointing up and to the right at angle $\theta_2 = 60^\circ$.

      3.  **$W$:** The weight of the sign pulling straight down, $W = mg$.


      We define a standard coordinate system with $+x$ to the right and $+y$ pointing up.'
    explanation: 'Solution: Use the quantities and governing relation stated in this step to obtain the displayed result.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step-we-static-equilibrium-sign-2
    title: Decompose the Forces into Components
    type: freeResponse
    prompt: Did you understand this step?
    answer:
      gradingMode: selfCheck
    instruction: 'Because the forces act in two dimensions, we must break $T_1$ and $T_2$ into their $x$ and $y$ components.


      **For $T_1$ (pointing Quadrant II):**

      *   $x$-component: $-T_1 \cos(\theta_1)$

      *   $y$-component: $+T_1 \sin(\theta_1)$


      **For $T_2$ (pointing Quadrant I):**

      *   $x$-component: $+T_2 \cos(\theta_2)$

      *   $y$-component: $+T_2 \sin(\theta_2)$


      **For $W$ (pointing straight down):**

      *   $x$-component: $0$

      *   $y$-component: $-mg$'
    explanation: 'Solution: Use the quantities and governing relation stated in this step to obtain the displayed result.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step-we-static-equilibrium-sign-3
    title: Apply the Conditions for Static Equilibrium Symbolically
    type: freeResponse
    prompt: Did you understand this step?
    answer:
      gradingMode: selfCheck
    instruction: 'In static equilibrium, the net force in both the $x$ and $y$ directions must be exactly zero.


      **1. Horizontal Equilibrium ($\sum F_x = 0$):**

      $$T_2 \cos(\theta_2) - T_1 \cos(\theta_1) = 0$$

      This implies the horizontal pulls from the two cables perfectly balance each other:

      $$T_2 \cos(\theta_2) = T_1 \cos(\theta_1)$$

      From this, we can express $T_2$ in terms of $T_1$:

      $$T_2 = T_1 \frac{\cos(\theta_1)}{\cos(\theta_2)}$$


      **2. Vertical Equilibrium ($\sum F_y = 0$):**

      $$T_1 \sin(\theta_1) + T_2 \sin(\theta_2) - mg = 0$$

      This implies the combined upward vertical pull of the two cables perfectly balances the downward weight of the sign:

      $$T_1 \sin(\theta_1) + T_2 \sin(\theta_2) = mg$$'
    explanation: 'Solution: Use the quantities and governing relation stated in this step to obtain the displayed result.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step-we-static-equilibrium-sign-4
    title: Solve the System for Tension T1
    type: freeResponse
    prompt: Did you understand this step?
    answer:
      gradingMode: selfCheck
    instruction: 'We now substitute our expression for $T_2$ from the horizontal equation into the vertical equation to solve for $T_1$:


      $$T_1 \sin(\theta_1) + \left( T_1 \frac{\cos(\theta_1)}{\cos(\theta_2)} \right) \sin(\theta_2) = mg$$


      Factor out $T_1$:

      $$T_1 \left[ \sin(\theta_1) + \frac{\cos(\theta_1)\sin(\theta_2)}{\cos(\theta_2)} \right] = mg$$


      Recognizing that $\frac{\sin(\theta_2)}{\cos(\theta_2)} = \tan(\theta_2)$, we can simplify the expression:

      $$T_1 \left[ \sin(\theta_1) + \cos(\theta_1)\tan(\theta_2) \right] = mg$$


      Isolate $T_1$:

      $$T_1 = \frac{mg}{\sin(\theta_1) + \cos(\theta_1)\tan(\theta_2)}$$'
    explanation: 'Solution: Use the quantities and governing relation stated in this step to obtain the displayed result.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step-we-static-equilibrium-sign-5
    title: Substitute Numerical Values
    type: freeResponse
    prompt: Did you understand this step?
    answer:
      gradingMode: selfCheck
    instruction: 'Now we use our derived symbolic formula to compute the tension.


      Given values:

      $m = 20.0 \text{ kg}$

      $g = 9.8 \text{ m/s}^2$

      $\theta_1 = 30^\circ$

      $\theta_2 = 60^\circ$


      First, calculate the trigonometric components:

      $\sin(30^\circ) = 0.5$

      $\cos(30^\circ) \approx 0.866$

      $\tan(60^\circ) \approx 1.732$


      Substitute these into the equation:

      $$T_1 = \frac{(20.0)(9.8)}{0.5 + (0.866)(1.732)}$$

      $$T_1 = \frac{196}{0.5 + 1.5}$$

      $$T_1 = \frac{196}{2.0}$$

      $$T_1 = 98.0 \text{ N}$$


      The tension in the left cable ($T_1$) is exactly $98.0 \text{ N}$.'
    explanation: 'Solution: Use the quantities and governing relation stated in this step to obtain the displayed result.


      Why it works: This step applies the stated physical model and carries its result into the next step.'

- id: static-equilibrium-we002
  title: Balanced Seesaw
  problem: 'A 300 N child sits 2.0 m left of a pivot. Where must a 200 N child sit to the right for equilibrium?'
  steps:
  - id: sewe6
    title: Write torque balance
    instruction: Equate clockwise and counterclockwise torque magnitudes.
    type: numericResponse
    prompt: 'What distance right of the pivot is required in meters?'
    answer: { value: 3, tolerance: 0.01 }
    explanation: 'Solution: $(300)(2.0)=(200)d$, so $d=3.0$ m.\n\nWhy it works: Static equilibrium requires net torque to be zero.'
  - id: sewe7
    title: Explain the comparison
    instruction: Compare the two lever arms.
    type: freeResponse
    prompt: 'Why does the lighter child sit farther from the pivot?'
    answer: { gradingMode: selfCheck, keyPoints: ['smaller force needs larger lever arm'] }
    explanation: 'Solution: The lighter child uses a larger lever arm.\n\nWhy it works: Equal torque requires force times distance to match.'
