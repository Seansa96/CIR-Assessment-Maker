workedExamples:
- id: we1
  title: Inverting Amplifier Analysis
  steps:
  - id: step1
    prompt: State the ideal op-amp conditions.
    instruction: Since the non-inverting input is grounded, $v_+ = 0$. By ideal assumptions,
      $v_- = v_+ = 0$. Also, $i_- = 0$.
    title: State the ideal op-amp conditions.
    type: freeResponse
    answer:
      gradingMode: selfCheck
  - id: step2
    prompt: Apply KCL at the inverting node.
    instruction: $(0 - v_s)/10\text{k} + (0 - v_o)/50\text{k} = 0$
    title: Apply KCL at the inverting node.
    type: freeResponse
    answer:
      gradingMode: selfCheck
  - id: step3
    prompt: Solve for $v_o$.
    instruction: $-v_o/50\text{k} = v_s/10\text{k} \implies v_o = -v_s(50\text{k}/10\text{k})
      = -5v_s$. Since $v_s = 2\text{V}$, $v_o = -10\text{ V}$.
    title: Solve for $v_o$.
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: An ideal op-amp is configured as an inverting amplifier with $R_s = 10\text{
    k}\Omega$ and $R_f = 50\text{ k}\Omega$. If $v_s = 2\text{ V}$, what is the output
    voltage $v_o$?
