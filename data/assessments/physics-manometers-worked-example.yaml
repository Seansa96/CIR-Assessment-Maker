- id: low-pressure-gas-example
  title: Gas pressure below atmosphere
  problem: In an open mercury manometer, the gas-side liquid surface is $0.020$ m higher than the atmospheric side. Use $\rho=13600\ \mathrm{kg/m^3}$ and $g=9.8\ \mathrm{m/s^2}$ to find the gauge pressure.
  steps:
  - id: man-step-6
    title: Determine sign
    instruction: The higher gas-side surface indicates the gas pressure is lower than atmospheric pressure.
    hint: 
    type: multipleChoice
    prompt: Is gauge pressure positive or negative?
    choices:
    - id: a
      text: negative
      media: []
      issueSignals: []
    - id: b
      text: positive
      media: []
      issueSignals: []
    answer:
      choiceId: a
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: Gauge pressure is negative.\n\nWhy it works: Atmospheric pressure pushes the liquid lower on its own side.\n\nWhy the other choices fail: Positive gauge pressure would lower the gas side.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: man-step-7
    title: Calculate gauge pressure
    instruction: Use $p_g=-\rho gh$.
    hint: 
    type: numericResponse
    prompt: What is gauge pressure in Pa?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: -2665.6
      tolerance: 1
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: $p_g=-(13600)(9.8)(0.020)=-2666$ Pa.\n\nWhy it works: The sign records that gas pressure is below atmosphere.'
