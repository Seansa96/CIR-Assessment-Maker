lesson:
  introduction: |
    Gases are unique among the states of matter because their physical behavior is largely independent of their chemical identity. Whether you have oxygen, nitrogen, or carbon dioxide, they all behave predictably in response to changes in pressure, temperature, and volume. This uniform behavior is explained by the **Kinetic-Molecular Theory (KMT)**.
  sections:
    - id: sec-kmt-postulates
      title: The Kinetic-Molecular Theory (KMT)
      required: true
      content: |
        The KMT models an "ideal gas" using five basic postulates:

        1. **Continuous, random motion:** Gas particles are in constant, random, straight-line motion.
        2. **Negligible volume:** The combined volume of the gas particles themselves is negligible compared to the total volume of the container. Most of a gas is empty space.
        3. **Negligible forces:** Attractive and repulsive forces between gas particles are negligible. (No IMFs).
        4. **Elastic collisions:** Collisions between particles and with the container walls are perfectly elastic (no net loss of kinetic energy).
        5. **Average Kinetic Energy:** The average kinetic energy of the gas particles is directly proportional to the **absolute temperature (Kelvin)**.

        These assumptions work extremely well for most gases at standard temperatures and pressures.
      check:
        id: chk-gas-1
        type: multipleChoice
        prompt: |
          According to the Kinetic-Molecular Theory, what happens to the average kinetic energy of gas molecules if the temperature (in Kelvin) is doubled?
        choices:
          - id: a
            text: It remains constant.
          - id: b
            text: It increases by a factor of 4.
          - id: c
            text: It doubles.
          - id: d
            text: It halves.
        answer:
          choiceId: c
        explanation: |
          Postulate 5 states that average kinetic energy is **directly proportional** to absolute temperature ($KE \propto T$). If the Kelvin temperature doubles, the average kinetic energy also doubles.

    - id: sec-maxwell-boltzmann
      title: Temperature and Molecular Speed
      required: true
      content: |
        Because temperature is proportional to *average* kinetic energy, not all molecules in a gas sample move at the same speed. The speeds are distributed across a wide range, described by the **Maxwell-Boltzmann distribution**.

        - At a **lower temperature**, the curve is tall and narrow. Most molecules have speeds close to the average, which is relatively low.
        - At a **higher temperature**, the curve flattens and stretches to the right. The average speed increases, and the distribution of speeds becomes much broader (more molecules are moving very fast).

        Importantly, even at a low temperature, a small fraction of molecules may be moving fast enough to escape a liquid (evaporation) or overcome an activation energy barrier.
      media:
        - type: image
          src: /media/chemistry/solids-liquids-gases/chem-maxwell-boltzmann-distribution.png
          alt: Maxwell-Boltzmann distribution graph showing a tall narrow peak for lower temperature T1, and a short broad peak shifted right for higher temperature T2.
          caption: "As temperature increases from T1 to T2, the average molecular speed increases, and the distribution of speeds becomes much broader."
      check:
        id: chk-gas-2
        type: multipleChoice
        prompt: |
          Looking at a Maxwell-Boltzmann distribution curve, what happens to the shape of the curve as the gas is heated?
        choices:
          - id: a
            text: The peak shifts to the left and becomes taller.
          - id: b
            text: The peak shifts to the right and becomes taller.
          - id: c
            text: The peak shifts to the left and becomes broader.
          - id: d
            text: The peak shifts to the right and becomes broader.
        answer:
          choiceId: d
        explanation: |
          As temperature increases, the average speed increases, shifting the peak to the **right**. Because the total area under the curve (total number of molecules) must remain constant, the peak must also flatten out and become **broader**, indicating a wider range of molecular speeds.

    - id: sec-pressure
      title: Gas Pressure
      required: true
      content: |
        **Pressure** is defined as the force exerted per unit area ($P = F / A$).

        According to the KMT, gas pressure is caused by the **collisions of gas molecules with the walls** of their container. The magnitude of the pressure depends on two factors:
        1. The *frequency* of collisions
        2. The *force* (momentum transfer) of each collision

        **Common Units of Pressure:**
        - **1 atm** (standard atmospheric pressure at sea level)
        - **760 mm Hg** or **760 torr** (1 atm = 760 torr)
        - **101.325 kPa** (kilopascals; the SI unit is the Pascal)
        - **14.7 psi** (pounds per square inch)

        You must be able to convert between these freely. For example, to convert 380 torr to atm:
        $$380 \text{ torr} \times \frac{1 \text{ atm}}{760 \text{ torr}} = 0.50 \text{ atm}$$
      check:
        id: chk-gas-3
        type: numericResponse
        prompt: |
          A bicycle tire is inflated to a pressure of 3.0 atm. What is this pressure in **torr**?
        answer:
          value: 2280
          tolerance: 0
        explanation: |
          $$3.0 \text{ atm} \times \frac{760 \text{ torr}}{1 \text{ atm}} = 2280 \text{ torr}$$

    - id: sec-real-vs-ideal
      title: Real vs. Ideal Gases
      required: true
      content: |
        The KMT assumes gases are **ideal**: they have zero volume and zero intermolecular forces. In reality, all gases are **real**: molecules *do* take up space, and they *do* attract each other (via IMFs like dispersion forces).

        Under most conditions, real gases behave ideally. However, real gases deviate from ideal behavior under two conditions:
        1. **High Pressure:** The gas is compressed so much that the volume of the molecules themselves becomes a significant fraction of the container volume. (Violates Postulate 2).
        2. **Low Temperature:** The molecules are moving so slowly that their weak intermolecular attractions pull them together, reducing the pressure they exert on the walls. (Violates Postulate 3).

        A gas behaves most ideally at **high temperature** and **low pressure**.
      check:
        id: chk-gas-4
        type: multipleChoice
        prompt: |
          Under which conditions would a sample of nitrogen gas ($N_2$) behave most like an ideal gas?
        choices:
          - id: a
            text: High temperature and high pressure
          - id: b
            text: High temperature and low pressure
          - id: c
            text: Low temperature and high pressure
          - id: d
            text: Low temperature and low pressure
        answer:
          choiceId: b
        explanation: |
          Ideal behavior requires molecules to be far apart (so their volume is negligible) and moving fast (so they overcome weak attractive forces). This corresponds to **low pressure** (large volume) and **high temperature** (high kinetic energy).
