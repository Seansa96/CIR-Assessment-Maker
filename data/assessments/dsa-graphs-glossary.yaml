glossary:
  sections:
    - title: "Graph Structure"
      entries:
        - term: "Vertex"
          definition: "A node in a graph."
        - term: "Edge"
          definition: "A connection between two vertices in a graph."
        - term: "Directed Graph"
          definition: "A graph where edges have a direction, meaning you can only travel from the source vertex to the destination vertex."
        - term: "Adjacency List"
          definition: "A representation of a graph where each vertex stores a list of its adjacent (neighboring) vertices."
    - title: "Graph Traversal"
      entries:
        - term: "Breadth-First Search (BFS)"
          definition: "A traversal algorithm that explores all the neighbors of a node before moving on to the next level of neighbors. Uses a Queue."
        - term: "Depth-First Search (DFS)"
          definition: "A traversal algorithm that explores as deep as possible along a branch before backtracking. Uses a Stack (or recursion)."
