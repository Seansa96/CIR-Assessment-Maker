  sections:
  - id: sec-physics-moment-of-inertia-ke-recall
    title: Core Terminology
    entries:
    - id: entry-moment-of-inertia
      term: Moment of Inertia ($I$)
      definition: A measure of an object's resistance to changes in its rotational
        motion. For a system of discrete particles, $I = \sum m_i r_i^2$.
      drills:
      - id: drill-moi-1
        prompt: The rotational analog of mass is called the ________ of inertia.
        type: typed
        answer:
          expected: moment
    - id: entry-rotational-ke
      term: Rotational Kinetic Energy ($K$)
      definition: The kinetic energy associated with the rotation of a body about
        an axis. $K = \frac{1}{2}I\omega^2$.
      drills:
      - id: drill-rot-ke-1
        prompt: The rotational kinetic energy of a body is proportional to the square
          of its angular ________.
        type: typed
        answer:
          expected: velocity
