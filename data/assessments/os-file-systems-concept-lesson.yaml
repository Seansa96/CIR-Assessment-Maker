lesson:
  introduction: 'This lesson introduces File Systems through the mental models emphasized by 4 File Systems. Focus on what
    the OS is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: file-abstraction
    title: File abstraction
    required: true
    content: 'A file abstracts persistent data behind names, attributes, operations, and access rules.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A file is not only bytes; metadata and operations matter.

      '
    check:
      id: file-abstraction-check
      title: 'Check: File abstraction'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **File abstraction**?

        '
      choices:
      - id: a
        text: A file abstracts persistent data behind names, attributes, operations, and access rules.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'A file abstracts persistent data behind names, attributes, operations, and access rules. Related topic:
        File Systems.

        '
  - id: directory-hierarchy
    title: Directory hierarchy
    required: true
    content: 'Directories organize file names into a navigable namespace.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Path names describe traversal through the namespace, not physical disk layout directly.

      '
    check:
      id: directory-hierarchy-check
      title: 'Check: Directory hierarchy'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Directory hierarchy**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Directories organize file names into a navigable namespace.
      answer:
        choiceId: d
      explanation: 'Directories organize file names into a navigable namespace. Related topic: File Systems.

        '
  - id: file-allocation
    title: File allocation
    required: true
    content: 'File systems must map logical file blocks onto disk blocks.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Contiguous, linked, and indexed allocation have different tradeoffs.

      '
    check:
      id: file-allocation-check
      title: 'Check: File allocation'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **File allocation**?

        '
      choices:
      - id: a
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: File systems must map logical file blocks onto disk blocks.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: c
      explanation: 'File systems must map logical file blocks onto disk blocks. Related topic: File Systems.

        '
  - id: directory-implementation
    title: Directory implementation
    required: true
    content: 'Directories are data structures mapping names to file metadata references.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A directory entry is not necessarily the entire file metadata.

      '
    check:
      id: directory-implementation-check
      title: 'Check: Directory implementation'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Directory implementation**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: Directories are data structures mapping names to file metadata references.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      answer:
        choiceId: b
      explanation: 'Directories are data structures mapping names to file metadata references. Related topic: File Systems.

        '
  - id: journaling
    title: Journaling
    required: true
    content: 'A journal records intended metadata operations to support recovery after crashes.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Journaling improves consistency, not necessarily every performance metric.

      '
    check:
      id: journaling-check
      title: 'Check: Journaling'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Journaling**?

        '
      choices:
      - id: a
        text: A journal records intended metadata operations to support recovery after crashes.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'A journal records intended metadata operations to support recovery after crashes. Related topic: File
        Systems.

        '
  - id: virtual-file-system
    title: Virtual file system
    required: true
    content: 'A VFS layer lets different file-system implementations present a common interface.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      The VFS is an abstraction layer, not a particular disk format.

      '
    check:
      id: virtual-file-system-check
      title: 'Check: Virtual file system'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Virtual file system**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: A VFS layer lets different file-system implementations present a common interface.
      answer:
        choiceId: d
      explanation: 'A VFS layer lets different file-system implementations present a common interface. Related topic: File
        Systems.

        '
