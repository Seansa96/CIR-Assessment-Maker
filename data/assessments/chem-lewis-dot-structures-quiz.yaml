questions:
  - id: q001
    type: numericResponse
    skills:
      - chem-lewis-dot-structures
    prompt: |
      How many total valence electrons must be shown in the Lewis structure of **chlorine gas** ($Cl_2$)?

      (Cl: Group 17, 7 valence electrons)
    answer:
      value: 14
      tolerance: 0
    explanation: |
      $2 \times Cl: 2 \times 7 = 14$ valence electrons. The Lewis structure has one Cl—Cl bond (2 e⁻) and 3 lone pairs on each Cl (6 e⁻ each), totaling $2 + 6 + 6 = 14$ electrons. ✓

  - id: q002
    type: numericResponse
    skills:
      - chem-lewis-dot-structures
    prompt: |
      How many total valence electrons are in the Lewis structure of the **phosphate ion** ($PO_4^{3-}$)?

      (P: 5 valence e⁻; O: 6 each; charge: 3−)
    answer:
      value: 32
      tolerance: 0
    explanation: |
      $P: 5 + 4 \times O: 24 + 3 \text{ (charge)} = 32$ valence electrons.

  - id: q003
    type: multipleChoice
    skills:
      - chem-lewis-dot-structures
    prompt: |
      Which element is **never** the central atom in a Lewis structure?
    choices:
      - id: a
        text: Carbon (C)
      - id: b
        text: Hydrogen (H)
      - id: c
        text: Sulfur (S)
      - id: d
        text: Phosphorus (P)
    answer:
      choiceId: b
    explanation: |
      **Hydrogen** can only form 1 bond (needs only 2 electrons for a filled 1s shell), so it is always a terminal atom. Fluorine (F) is also never a central atom. All the other choices (C, S, P) commonly appear as central atoms.

  - id: q004
    type: multipleChoice
    skills:
      - chem-lewis-dot-structures
    prompt: |
      In the Lewis structure of **boron trifluoride** ($BF_3$), how many electrons surround the boron atom, and is this an example of an incomplete or expanded octet?
    choices:
      - id: a
        text: 8 electrons; no exception — boron follows the octet rule
      - id: b
        text: 6 electrons; **incomplete octet** — boron is stable with only 6 electrons
      - id: c
        text: 10 electrons; **expanded octet** — boron uses d orbitals
      - id: d
        text: 6 electrons; **expanded octet** — boron prefers fewer electrons
    answer:
      choiceId: b
    explanation: |
      B in $BF_3$ forms 3 B—F bonds with 6 bonding electrons and no lone pairs. This gives B only **6 electrons** — an **incomplete octet**. Boron (Period 2) cannot expand beyond 8 electrons, but it is satisfied with only 6. This makes $BF_3$ a Lewis acid.

  - id: q005
    type: multipleChoice
    skills:
      - chem-lewis-dot-structures
    prompt: |
      Which of the following molecules has an **expanded octet** on its central atom?
    choices:
      - id: a
        text: '$NH_3$'
      - id: b
        text: '$CF_4$'
      - id: c
        text: '$XeF_4$'
      - id: d
        text: '$BeCl_2$'
    answer:
      choiceId: c
    explanation: |
      $XeF_4$ has Xe as the central atom (Period 5). Xe forms 4 bonds + has 2 lone pairs = 12 electrons on Xe — an **expanded octet**. $NH_3$ (N = Period 2, 8 e⁻ on N), $CF_4$ (C = Period 2, 8 e⁻ on C), and $BeCl_2$ (Be = Period 2, only 4 e⁻ on Be — incomplete, not expanded) do not have expanded octets.

  - id: q006
    type: multipleChoice
    skills:
      - chem-lewis-dot-structures
    prompt: |
      When drawing the Lewis structure of a **cation** like $H_3O^+$ (hydronium), how do you account for the charge?
    choices:
      - id: a
        text: Add one electron to the total valence electron count for the +1 charge
      - id: b
        text: Subtract one electron from the total valence electron count for the +1 charge
      - id: c
        text: The charge has no effect on the electron count
      - id: d
        text: Place a +1 formal charge on oxygen and add 1 electron
    answer:
      choiceId: b
    explanation: |
      Cations have lost electrons. A +1 charge means **1 fewer electron** than the neutral atoms would provide. For $H_3O^+$: $O(6) + 3 \times H(1) - 1 = 8$ valence electrons. (The neutral molecule $H_3O$ would have 9 valence electrons, but the ion $H_3O^+$ has 8.)

  - id: q007
    type: multipleChoice
    skills:
      - chem-lewis-dot-structures
    prompt: |
      **Nitric oxide (NO)** is a radical. Which of the following is the most accurate description of its Lewis structure?
    choices:
      - id: a
        text: N=O with all atoms having complete octets and no unpaired electrons
      - id: b
        text: N≡O with a triple bond and one lone pair on each atom
      - id: c
        text: A structure with an odd number of total valence electrons, leaving one atom with an unpaired electron
      - id: d
        text: Two separate atoms that cannot be bonded covalently
    answer:
      choiceId: c
    explanation: |
      $NO$ has $N(5) + O(6) = 11$ valence electrons — an **odd** number. No arrangement of 11 electrons can pair all electrons, so NO has one unpaired electron. The best Lewis structure has a double bond (N=O), a lone pair on each atom, and one unpaired electron on N. This is the definition of a radical.

  - id: q008
    type: selectAll
    skills:
      - chem-lewis-dot-structures
    prompt: |
      Which of the following can act as the **central atom** in a molecule with an expanded octet? Select all that apply.
    choices:
      - id: a
        text: 'S (sulfur, Period 3)'
      - id: b
        text: 'C (carbon, Period 2)'
      - id: c
        text: 'P (phosphorus, Period 3)'
      - id: d
        text: 'Xe (xenon, Period 5)'
    answer:
      choiceIds:
        - a
        - c
        - d
    explanation: |
      Expanded octets require access to $d$ orbitals, which are available starting in **Period 3**. S (Period 3, e.g., $SF_6$, $SF_4$), P (Period 3, e.g., $PCl_5$), and Xe (Period 5, e.g., $XeF_4$) can all have expanded octets. Carbon (Period 2) has no available $d$ orbitals and cannot exceed 8 electrons.

  - id: q009
    type: numericResponse
    skills:
      - chem-lewis-dot-structures
    prompt: |
      In the correct Lewis structure of $SF_6$ (sulfur hexafluoride), how many electrons surround the central sulfur atom?
    answer:
      value: 12
      tolerance: 0
    explanation: |
      S in $SF_6$ forms 6 S—F bonds = 12 bonding electrons shared with S, and has 0 lone pairs. Expanded octet: **12 electrons** on S. ($S$ is in Period 3 and can use $d$ orbitals.)

  - id: q010
    type: multipleChoice
    skills:
      - chem-lewis-dot-structures
    prompt: |
      Why must you convert lone pairs to multiple bonds (step 5 of the Lewis structure procedure) when the central atom still lacks an octet after distributing all electrons?
    choices:
      - id: a
        text: To reduce the total number of electrons in the structure
      - id: b
        text: To give the central atom more electrons without exceeding the total valence electron count
      - id: c
        text: To remove lone pairs from terminal atoms so they become more reactive
      - id: d
        text: To balance the formal charges by moving electrons to the most electronegative atom
    answer:
      choiceId: b
    explanation: |
      When all electrons have been placed and the central atom still has fewer than 8, you cannot simply add more electrons — that would exceed the total valence electron count. Instead, you **convert lone pairs from adjacent atoms into bonding pairs**, creating double or triple bonds. This gives the central atom more electrons (from the new bond) without adding any new electrons to the structure.

  - id: q011
    type: numericResponse
    skills:
      - chem-lewis-dot-structures
    prompt: |
      How many lone pairs are on the central **sulfur atom** in $SF_4$?

      (Total valence electrons in $SF_4$ = 34; S forms 4 S—F bonds = 8 bonding electrons used; each F has 3 lone pairs = 24 electrons used; remaining electrons go on S.)
    answer:
      value: 1
      tolerance: 0
    explanation: |
      Total valence e⁻: $S(6) + 4 \times F(7) = 34$.

      4 S—F bonds: 8 e⁻. Each F gets 3 lone pairs: $4 \times 6 = 24$ e⁻. Used so far: $8 + 24 = 32$. Remaining: $34 - 32 = 2$ → **1 lone pair on S**.

      S has 10 electrons total (expanded octet). Geometry: AX₄E₁ → seesaw.

  - id: q012
    type: multipleChoice
    skills:
      - chem-lewis-dot-structures
    prompt: |
      In the step-by-step Lewis structure procedure, why are terminal atoms assigned lone pairs **before** the central atom?
    choices:
      - id: a
        text: Terminal atoms are always more electronegative and need electrons more
      - id: b
        text: Terminal atoms typically need electrons to complete their octets before considering the central atom, which may then form multiple bonds if needed
      - id: c
        text: Lone pairs on terminal atoms are more stable than lone pairs on central atoms
      - id: d
        text: The procedure places electrons in alphabetical order of element symbol
    answer:
      choiceId: b
    explanation: |
      The procedure assigns electrons to terminal atoms first because they often need lone pairs to complete their octets. Once they are satisfied, any deficit on the central atom is resolved by pulling lone pairs from terminal atoms to form multiple bonds — this systematic approach guarantees the final structure obeys the octet rule for all atoms.
