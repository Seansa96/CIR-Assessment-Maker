schemaVersion: 1
id: aops-triangles-hard-quiz
title: Triangles Hard Quiz
description: Multi-step triangle problems requiring theorem selection, scale conversion, center structure, and independent checks.
assessmentType: quiz
categoryId: art-of-problem-solving
topicId: aops-triangles
skills:
- Combine triangle existence and classification constraints
- Convert between linear and area similarity data
- Use right-triangle altitude and center relations
- Derive rather than merely recall triangle formulas
navigation:
  learningGoal: practice
  activityType: mixedPractice
  tags: [art-of-problem-solving, aops-triangles, geometry, hard, similarity, right-triangle-altitude, triangle-centers, triangle-area]
questions:
- id: hard-quiz-q001
  type: multipleChoice
  prompt: A primitive integer right triangle has perimeter 30. What is its hypotenuse?
  choices: [{id: a, text: '$10$'}, {id: b, text: '$12$'}, {id: c, text: '$13$'}, {id: d, text: '$15$'}]
  answer: {choiceId: c}
  explanation: The primitive 5-12-13 triangle has perimeter 30, so its hypotenuse is 13.
- id: hard-quiz-q002
  type: multipleChoice
  prompt: A triangle has integer side lengths $x$, $x+2$, and 15. What is the least possible $x$?
  choices: [{id: a, text: '$6$'}, {id: b, text: '$7$'}, {id: c, text: '$8$'}, {id: d, text: '$13$'}]
  answer: {choiceId: b}
  explanation: The binding inequality is $x+(x+2)>15$, so $x>6.5$ and the least integer is 7.
- id: hard-quiz-q003
  type: multipleChoice
  prompt: A triangle has side lengths 8, 15, and 17. Which conclusion is justified?
  choices: [{id: a, text: It is acute.}, {id: b, text: It is right.}, {id: c, text: It is obtuse.}, {id: d, text: It is degenerate.}]
  answer: {choiceId: b}
  explanation: $8^2+15^2=64+225=289=17^2$, so the Pythagorean converse applies.
- id: hard-quiz-q004
  type: multipleChoice
  prompt: Two triangles share a side. Their other two corresponding side pairs are marked equal. Which proof route is complete?
  choices:
  - {id: a, text: Use the shared side reflexively, then SSS congruence.}
  - {id: b, text: Use SSA because any three facts prove congruence.}
  - {id: c, text: Use AAA congruence.}
  - {id: d, text: Assume the unmarked angles are equal.}
  answer: {choiceId: a}
  explanation: The common side supplies the third corresponding side equality required by SSS.
- id: hard-quiz-q005
  type: multipleChoice
  prompt: Similar triangles have area ratio $49:64$. If the smaller perimeter is 42, find the larger perimeter.
  choices: [{id: a, text: '$48$'}, {id: b, text: '$54$'}, {id: c, text: '$56$'}, {id: d, text: '$384/7$'}]
  answer: {choiceId: a}
  explanation: The length ratio is $7:8$, so the larger perimeter is $42(8/7)=48$.
- id: hard-quiz-q006
  type: multipleChoice
  prompt: 'A line through $D$ on $AB$ is parallel to $BC$, with $AD:DB=2:1$. Find $[ADE]:[ABC]$.'
  media:
  - type: image
    src: /assessments/aops/aops-triangles-similarity.svg
    alt: Triangle ABC with DE parallel to BC and smaller triangle ADE at the top.
  choices: [{id: a, text: '$2:3$'}, {id: b, text: '$4:9$'}, {id: c, text: '$4:5$'}, {id: d, text: '$8:27$'}]
  answer: {choiceId: b}
  explanation: $AD/AB=2/(2+1)=2/3$, so the area ratio is $(2/3)^2=4/9$.
- id: hard-quiz-q007
  type: multipleChoice
  prompt: An altitude to a right triangle's hypotenuse has length 12, and the two hypotenuse segments have ratio $4:9$. Find the hypotenuse.
  media:
  - type: image
    src: /assessments/aops/aops-triangles-altitude-hypotenuse.svg
    alt: Right triangle with altitude h to the hypotenuse, splitting it into p and q.
  choices: [{id: a, text: '$13$'}, {id: b, text: '$20$'}, {id: c, text: '$26$'}, {id: d, text: '$52$'}]
  answer: {choiceId: c}
  explanation: Let the pieces be $4k,9k$. Then $144=h^2=36k^2$, so $k=2$ and the hypotenuse is $8+18=26$.
- id: hard-quiz-q008
  type: multipleChoice
  prompt: A right triangle has legs 9 and 40. Find its inradius.
  choices: [{id: a, text: '$4$'}, {id: b, text: '$5$'}, {id: c, text: '$9$'}, {id: d, text: '$20$'}]
  answer: {choiceId: a}
  explanation: The hypotenuse is 41, area is 180, and semiperimeter is 45, so $r=180/45=4$.
- id: hard-quiz-q009
  type: multipleChoice
  prompt: In $\triangle ABC$, the angle bisector from $A$ meets $BC$ at $D$. If $AB:AC=5:7$ and $BD=15$, find $DC$.
  choices: [{id: a, text: '$18$'}, {id: b, text: '$20$'}, {id: c, text: '$21$'}, {id: d, text: '$25$'}]
  answer: {choiceId: c}
  explanation: The angle-bisector theorem gives $BD:DC=5:7$, so $DC=15(7/5)=21$.
- id: hard-quiz-q010
  type: multipleChoice
  prompt: A median divides a triangle of area 72 into two subtriangles. What is the area of either subtriangle?
  choices: [{id: a, text: '$24$'}, {id: b, text: '$32$'}, {id: c, text: '$36$'}, {id: d, text: '$48$'}]
  answer: {choiceId: c}
  explanation: The two subtriangles have equal bases and a common altitude, so they have equal area 36.
- id: hard-quiz-q011
  type: multipleChoice
  prompt: A ladder makes a $60^\circ$ angle with the ground and reaches $8\sqrt3$ feet high. Find its length.
  choices: [{id: a, text: '$8$'}, {id: b, text: '$12$'}, {id: c, text: '$16$'}, {id: d, text: '$24$'}]
  answer: {choiceId: c}
  explanation: $L\sin60^\circ=8\sqrt3$ gives $L(\sqrt3/2)=8\sqrt3$, so $L=16$.
- id: hard-quiz-q012
  type: multipleChoice
  prompt: A triangle has area 48 and two sides 12 and 10 surrounding angle $C$. Find $\sin C$.
  choices: [{id: a, text: '$2/5$'}, {id: b, text: '$3/5$'}, {id: c, text: '$4/5$'}, {id: d, text: '$5/4$'}]
  answer: {choiceId: c}
  explanation: $48=\tfrac12(12)(10)\sin C=60\sin C$, so $\sin C=4/5$.
- id: hard-quiz-q013
  type: selectAll
  prompt: Which center-location statements are valid?
  choices:
  - {id: a, text: The incenter lies inside every nondegenerate triangle.}
  - {id: b, text: The circumcenter of an obtuse triangle lies outside.}
  - {id: c, text: The orthocenter of a right triangle is the right-angle vertex.}
  - {id: d, text: The centroid of an obtuse triangle lies outside.}
  answer: {choiceIds: [a, b, c]}
  explanation: The centroid lies inside every nondegenerate triangle.
- id: hard-quiz-q014
  type: selectAll
  prompt: Which conclusions are justified by valid theorem hypotheses?
  choices:
  - {id: a, text: Two matching angle pairs prove AA similarity.}
  - {id: b, text: Three proportional side pairs prove SSS similarity.}
  - {id: c, text: Two sides and any angle prove SAS congruence.}
  - {id: d, text: Equal hypotenuse and one leg prove congruence for right triangles.}
  answer: {choiceIds: [a, b, d]}
  explanation: SAS requires the included angle; an arbitrary angle produces SSA data.
- id: hard-quiz-q015
  type: freeResponse
  prompt: Prove that the altitude $h$ to a right triangle's hypotenuse satisfies $h^2=pq$, where $p$ and $q$ are the two hypotenuse segments.
  media:
  - type: image
    src: /assessments/aops/aops-triangles-altitude-hypotenuse.svg
    alt: Right triangle with altitude h to the hypotenuse and segments p and q.
  answer:
    gradingMode: selfCheck
    expected: 'The altitude creates two smaller right triangles. Each has a right angle at the altitude foot, and their remaining acute angles match because both come from the original right triangle. Thus the two small triangles are similar by AA. Matching the altitude as one leg in opposite positions gives $h/p=q/h$, so $h^2=pq$. Since $h$ is a length, $h=\sqrt{pq}$.'
    keyPoints:
    - Establishes AA similarity of the two smaller triangles.
    - Writes a correctly oriented proportion.
    - Cross-multiplies to $h^2=pq$.
    - Uses the positive root for a length.
  explanation: The geometric-mean identity is a consequence of similarity created by the perpendicular altitude.
