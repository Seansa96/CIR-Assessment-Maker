questions:
- id: surf-hard-1
  title: Surface Area of Revolution
  type: symbolicResponse
  prompt: 'Adapted from OpenStax Calculus Volume 2.


    Find the surface area of the solid generated by rotating $y = \sqrt{x}$ from $x=0$
    to $x=1$ about the x-axis.'
  answer:
    gradingMode: auto
    expected: (\pi/6)*((4*1+1)^{3/2} - 1)
  explanation: $S = \int 2\pi y \sqrt{1+(y')^2} \, dx$.
