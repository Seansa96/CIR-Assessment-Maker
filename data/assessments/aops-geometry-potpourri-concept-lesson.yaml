lesson:
  sections:
  - id: section-angle-bisector-theorem
    title: 'The Angle Bisector Theorem'
    content: |
      An angle bisector divides the opposite side of a triangle into segments that are proportional to the adjacent sides.
      
      If $AD$ bisects $\angle A$ in $\triangle ABC$, with $D$ on $BC$, then:
      $$\frac{BD}{DC} = \frac{AB}{AC}$$

      This theorem is a direct consequence of the Law of Sines (or the same-base area ratio principle). It is often the very first tool you should reach for when you see the word "bisector" in a geometry problem.
    check:
      type: multipleChoice
      prompt: 'In $\triangle ABC$, $AB = 10$, $AC = 15$, and $BC = 20$. If $AD$ is the angle bisector of $\angle A$, what is the length of $BD$?'
      choices:
      - id: a
        text: '8'
      - id: b
        text: '12'
        issueSignals: [ratio-error]
      - id: c
        text: '10'
        issueSignals: [wrong-concept]
      - id: d
        text: '6'
        issueSignals: [algebra-error]
      answer: {choiceId: a}
      difficultyDimensions:
      - Set up the proportion $\frac{BD}{DC} = \frac{AB}{AC}$.
      - Substitute $DC = 20 - BD$ and solve.
      explanation: |
        Solution:
        By the Angle Bisector Theorem:
        $\frac{BD}{DC} = \frac{10}{15} = \frac{2}{3}$.
        Let $BD = 2x$ and $DC = 3x$.
        The total base is $BC = 2x + 3x = 5x = 20$.
        Solving for $x$, we get $x = 4$.
        Thus, $BD = 2(4) = 8$.

        Why it works:
        The bisector pulls the side lengths into a strict ratio on the opposite base, forcing $D$ to be closer to the shorter side $AB$.

  - id: section-stewarts-theorem
    title: 'Stewart''s Theorem'
    content: |
      Stewart's Theorem relates the length of any cevian (a line segment from a vertex to the opposite side) to the lengths of the triangle's sides. 

      Let a triangle have sides $a, b, c$. Let a cevian of length $d$ be drawn to side $a$, dividing $a$ into segments of length $m$ and $n$ (so $m+n=a$). The theorem states:
      $$man + dad = bmb + cnc$$
      (Often memorized as "A man and his dad put a bomb in the sink.")

      This is immensely powerful because it works for *any* line drawn inside a triangle, provided you know where it lands on the opposite side. It is a direct algebraic generalization of the Law of Cosines.
    check:
      type: multipleChoice
      prompt: 'In $\triangle ABC$, $AB=5$, $AC=7$, and $BC=6$. Point $D$ lies on $BC$ such that $BD=2$ and $DC=4$. What is the square of the length of the cevian $AD$?'
      choices:
      - id: a
        text: '17'
      - id: b
        text: '14'
        issueSignals: [algebra-error]
      - id: c
        text: '21'
        issueSignals: [formula-error]
      - id: d
        text: '25'
        issueSignals: [wrong-concept]
      answer: {choiceId: a}
      difficultyDimensions:
      - Identify the variables for Stewart's theorem ($a,b,c,m,n,d$).
      - Substitute and solve for $d^2$.
      explanation: |
        Solution:
        Using the notation of the theorem:
        Side $a = BC = 6$.
        Segments $m = 2$ and $n = 4$. (Note: $m$ is adjacent to $c$, $n$ is adjacent to $b$).
        Side $c = AB = 5$.
        Side $b = AC = 7$.
        Cevian $d = AD$.
        $$man + dad = bmb + cnc$$
        $$(2)(6)(4) + d(6)d = (7)(2)(7) + (5)(4)(5)$$
        $$48 + 6d^2 = 98 + 100$$
        $$48 + 6d^2 = 198$$
        $$6d^2 = 150 \implies d^2 = 25$$
        Wait, I made an error in variable alignment.
        Let's re-verify: $b$ must multiply $m$ or $n$?
        The formula is $man + dad = bmb + cnc$. The segment $m$ must be on the same side as $b$? No, $m$ is adjacent to $c$.
        If $BD=2$, then $c=5$ is adjacent to $BD$. So $m=2, c=5$.
        If $DC=4$, then $b=7$ is adjacent to $DC$. So $n=4, b=7$.
        The theorem is $a(d^2 + mn) = b^2m + c^2n$.
        Let's test this: $6(d^2 + 8) = 7^2(2) + 5^2(4)$
        $6(d^2 + 8) = 98 + 100 = 198$
        $d^2 + 8 = 33 \implies d^2 = 25$.
        Ah, the answer is 25! I put 17 in the choices. Let me fix the choice text.
      choices:
      - id: a
        text: '25'
      - id: b
        text: '17'
        issueSignals: [formula-error]
      - id: c
        text: '33'
        issueSignals: [algebra-error]
      - id: d
        text: '150'
        issueSignals: [algebra-error]
      answer: {choiceId: a}
      difficultyDimensions:
      - Match the segments to their adjacent sides correctly.
      - Substitute into $a(d^2 + mn) = b^2m + c^2n$.
      explanation: |
        Solution:
        Let side $a = BC = 6$, $c = AB = 5$, and $b = AC = 7$.
        The cevian $AD$ divides $a$ into $m = BD = 2$ and $n = DC = 4$.
        Stewart's Theorem is $a(d^2 + mn) = b^2m + c^2n$.
        $$6(d^2 + (2)(4)) = (7^2)(2) + (5^2)(4)$$
        $$6(d^2 + 8) = 98 + 100 = 198$$
        $$d^2 + 8 = 33 \implies d^2 = 25$$

        Why it works:
        Stewart's Theorem is derived by applying the Law of Cosines twice to the two smaller triangles formed by the cevian, then eliminating the cosine of the supplementary angles.

  - id: section-cevas-theorem
    title: 'Ceva''s Theorem'
    content: |
      Ceva's Theorem determines when three cevians (lines from vertices to opposite sides) intersect at a single common point (are concurrent).

      Let $D, E, F$ be points on sides $BC, CA, AB$ respectively. The cevians $AD, BE, CF$ are concurrent if and only if:
      $$\frac{AF}{FB} \cdot \frac{BD}{DC} \cdot \frac{CE}{EA} = 1$$

      When using Ceva's, always travel around the perimeter of the triangle in one direction. The ratio is the product of (segment 1 / segment 2) for all three sides. This theorem trivially proves that the medians, angle bisectors, and altitudes of any triangle are concurrent.
    check:
      type: multipleChoice
      prompt: 'In $\triangle ABC$, cevians $AD, BE, CF$ are concurrent. If $AF = 3$, $FB = 4$, $BD = 2$, and $DC = 5$, what is the ratio $\frac{CE}{EA}$?'
      choices:
      - id: a
        text: '$\frac{10}{3}$'
      - id: b
        text: '$\frac{3}{10}$'
        issueSignals: [ratio-error]
      - id: c
        text: '$\frac{5}{6}$'
        issueSignals: [algebra-error]
      - id: d
        text: '$\frac{15}{8}$'
        issueSignals: [algebra-error]
      answer: {choiceId: a}
      difficultyDimensions:
      - Substitute the known lengths into Ceva's equation.
      - Solve for the unknown ratio.
      explanation: |
        Solution:
        By Ceva's Theorem, for concurrent cevians:
        $$\frac{AF}{FB} \cdot \frac{BD}{DC} \cdot \frac{CE}{EA} = 1$$
        Substitute the given values:
        $$\frac{3}{4} \cdot \frac{2}{5} \cdot \frac{CE}{EA} = 1$$
        $$\frac{6}{20} \cdot \frac{CE}{EA} = 1 \implies \frac{3}{10} \cdot \frac{CE}{EA} = 1$$
        $$\frac{CE}{EA} = \frac{10}{3}$$

        Why it works:
        Ceva's relies on the "same base, same altitude" area principle. The ratios of the segments dictate the ratios of the areas of the sub-triangles. For them to meet at one point, the cyclical product of these area ratios must perfectly balance to 1.

  - id: section-menelaus-theorem
    title: 'Menelaus''s Theorem'
    content: |
      While Ceva's deals with concurrency (lines meeting at a point), Menelaus's Theorem deals with **collinearity** (points lying on a line).

      If a line intersects the extended sides $BC, CA, AB$ of $\triangle ABC$ at points $D, E, F$ respectively, then:
      $$\frac{AF}{FB} \cdot \frac{BD}{DC} \cdot \frac{CE}{EA} = -1$$
      *(Using directed line segments, the product is -1 because a line must cross the extended sides of a triangle such that either 1 or 3 points lie outside the triangle. If we only care about absolute lengths, the product is 1).*

      The formula looks identical to Ceva's, but notice that $D$ is typically *outside* the segment $BC$.
    check:
      type: multipleChoice
      prompt: 'A line intersects side $AB$ at $F$, side $AC$ at $E$, and the extension of side $BC$ at $D$ (so $C$ is between $B$ and $D$). If $AF=2, FB=3, CE=4, EA=5$, find $\frac{BD}{CD}$.'
      choices:
      - id: a
        text: '$\frac{15}{8}$'
      - id: b
        text: '$\frac{8}{15}$'
        issueSignals: [ratio-error]
      - id: c
        text: '$\frac{10}{12}$'
        issueSignals: [algebra-error]
      - id: d
        text: '$\frac{3}{2}$'
        issueSignals: [wrong-concept]
      answer: {choiceId: a}
      difficultyDimensions:
      - Set up Menelaus's equation using absolute lengths.
      - Substitute the known segments.
      - Solve for the external ratio.
      explanation: |
        Solution:
        Using absolute lengths, Menelaus's Theorem states:
        $$\frac{AF}{FB} \cdot \frac{BD}{DC} \cdot \frac{CE}{EA} = 1$$
        Substitute the given values:
        $$\left(\frac{2}{3}\right) \cdot \left(\frac{BD}{CD}\right) \cdot \left(\frac{4}{5}\right) = 1$$
        $$\frac{8}{15} \cdot \frac{BD}{CD} = 1$$
        $$\frac{BD}{CD} = \frac{15}{8}$$

        Why it works:
        Menelaus drops perpendiculars from the three vertices to the transversal line, creating three pairs of similar right triangles. The product of their scaling ratios forces a perfect cycle of 1.

  - id: section-ptolemys-theorem
    title: 'Ptolemy''s Theorem'
    content: |
      Ptolemy's Theorem is a beautiful relation for **cyclic quadrilaterals** (quadrilaterals inscribed in a circle).

      For a cyclic quadrilateral $ABCD$, the sum of the products of the opposite sides equals the product of the diagonals:
      $$(AB \cdot CD) + (BC \cdot DA) = AC \cdot BD$$

      This theorem is uniquely powerful because it turns angle constraints (cyclic quadrilaterals) into pure length constraints. If you have an equilateral triangle inscribed in a circle and pick a point on the arc, Ptolemy immediately proves that the distance to the far vertex equals the sum of the distances to the near vertices.
    check:
      type: multipleChoice
      prompt: 'A cyclic quadrilateral $ABCD$ has side lengths $AB=3, BC=4, CD=5, DA=6$. If diagonal $AC=7$, what is the length of diagonal $BD$?'
      choices:
      - id: a
        text: '$\frac{39}{7}$'
      - id: b
        text: '39'
        issueSignals: [algebra-error]
      - id: c
        text: '$\frac{27}{7}$'
        issueSignals: [formula-error]
      - id: d
        text: '$\frac{33}{7}$'
        issueSignals: [formula-error]
      answer: {choiceId: a}
      difficultyDimensions:
      - Apply Ptolemy's equation: $(AB \cdot CD) + (BC \cdot DA) = AC \cdot BD$.
      - Isolate the unknown diagonal $BD$.
      explanation: |
        Solution:
        By Ptolemy's Theorem:
        $$(AB \cdot CD) + (BC \cdot DA) = AC \cdot BD$$
        $$(3 \cdot 5) + (4 \cdot 6) = 7 \cdot BD$$
        $$15 + 24 = 7 \cdot BD$$
        $$39 = 7 \cdot BD \implies BD = \frac{39}{7}$$

        Why it works:
        Ptolemy's is proven by constructing a specific point on one of the diagonals that creates two pairs of similar triangles, effectively partitioning the diagonal product into the two opposite-side products.

  - id: section-mass-point-geometry
    title: 'Mass Point Geometry'
    content: |
      Mass Point Geometry is a physics-inspired technique for solving ratio problems involving intersecting lines inside a triangle. It is often much faster than Menelaus's Theorem.

      Imagine placing weights (masses) at the vertices of a triangle. The intersection point of the cevians acts as the center of mass (fulcrum). 
      The core rule is the **seesaw principle**: $m_1 \cdot d_1 = m_2 \cdot d_2$.
      If $D$ is on $BC$ and $BD=2, DC=3$, we assign a mass of 3 to $B$ and 2 to $C$. Their "center of mass" is $D$, which gets a combined mass of $3+2=5$.

      By assigning masses to all three vertices, you can instantly read off the ratios of the internal cevian segments just by looking at the balanced masses at the nodes.
    check:
      type: multipleChoice
      prompt: 'In $\triangle ABC$, point $D$ is on $BC$ such that $BD=2$ and $DC=3$. We assign mass 3 to $B$ and mass 2 to $C$. If point $E$ is on $AC$ and we want the center of mass of $A,B,C$ to lie on $AD$, what mass must we place at $A$ if $CE:EA = 1:4$?'
      choices:
      - id: a
        text: '8'
      - id: b
        text: '0.5'
        issueSignals: [ratio-error]
      - id: c
        text: '2'
        issueSignals: [ratio-error]
      - id: d
        text: '5'
        issueSignals: [wrong-concept]
      answer: {choiceId: a}
      difficultyDimensions:
      - Balance the seesaw on side $AC$ using the known mass at $C$.
      - Apply $m_C \cdot CE = m_A \cdot EA$.
      explanation: |
        Solution:
        We placed mass 2 at $C$.
        The seesaw on side $AC$ has fulcrum $E$. The lengths are $CE=1$ and $EA=4$.
        The balance equation is $m_C \cdot CE = m_A \cdot EA$.
        $2 \cdot 1 = m_A \cdot 4$
        $2 = 4 m_A \implies m_A = 0.5$.
        Wait, I set the answer to 8, let me re-check my ratio.
        If $CE:EA = 1:4$, then the distance from $C$ to $E$ is 1, and $E$ to $A$ is 4.
        $m_C \times 1 = m_A \times 4$. If $m_C=2$, then $2=4 m_A \implies m_A=0.5$.
        Let me flip the ratio to make the answer 8, which is cleaner. Let $CE:EA = 4:1$.
        If $CE:EA = 4:1$, then $m_C \times 4 = m_A \times 1$. $2 \times 4 = m_A \times 1 \implies m_A = 8$.
      prompt: 'In $\triangle ABC$, point $D$ is on $BC$ such that $BD=2$ and $DC=3$. We assign mass 3 to $B$ and mass 2 to $C$. If point $E$ is on $AC$ and $CE:EA = 4:1$, what mass must we place at $A$ to balance side $AC$?'
      choices:
      - id: a
        text: '8'
      - id: b
        text: '0.5'
        issueSignals: [ratio-error]
      - id: c
        text: '2'
        issueSignals: [wrong-concept]
      - id: d
        text: '4'
        issueSignals: [algebra-error]
      answer: {choiceId: a}
      difficultyDimensions:
      - Use the seesaw principle $m_C \cdot d_{CE} = m_A \cdot d_{EA}$.
      - Substitute the known mass and distances.
      explanation: |
        Solution:
        The mass at $C$ is 2. The distances from the fulcrum $E$ are $CE=4$ and $EA=1$.
        To balance the seesaw $AC$:
        $$m_C \times CE = m_A \times EA$$
        $$2 \times 4 = m_A \times 1$$
        $$m_A = 8$$

        Why it works:
        Mass point geometry works because it is a physical manifestation of barycentric coordinates. The "masses" simply encode the area ratios of the sub-triangles.

  - id: section-geometric-inequalities
    title: 'Geometric Inequalities'
    content: |
      Not all geometry problems are about finding an exact value; many require finding bounds. The foundational rule is the **Triangle Inequality**:
      For any three points $A, B, C$, $AB + BC \geq AC$.

      This extends to **Ptolemy's Inequality** for non-cyclic quadrilaterals:
      $AB \cdot CD + BC \cdot DA \geq AC \cdot BD$. (Equality holds if and only if $ABCD$ is cyclic).

      When asked to maximize or minimize a geometric quantity, always look to force a straight line. If you need to minimize $PA + PB$ where $P$ lies on a line, reflect $B$ across the line to $B'$ and draw the straight line $AB'$; the intersection is the optimal $P$.
    check:
      type: multipleChoice
      prompt: 'Points $A$ and $B$ lie on the same side of a line $L$. To find a point $P$ on $L$ that minimizes the distance $PA + PB$, what geometric transformation should you apply?'
      choices:
      - id: a
        text: 'Reflect one of the points across line $L$.'
      - id: b
        text: 'Dilate the line $L$ by a factor of 2.'
        issueSignals: [wrong-concept]
      - id: c
        text: 'Rotate $A$ by $90^\circ$ around $B$.'
        issueSignals: [wrong-concept]
      - id: d
        text: 'Construct the perpendicular bisector of $AB$.'
        issueSignals: [wrong-concept]
      answer: {choiceId: a}
      difficultyDimensions:
      - Recognize the "shortest path" problem constraint.
      - Apply a reflection to create a straight-line path crossing the boundary.
      explanation: |
        Solution:
        To minimize $PA + PB$, you reflect $B$ across line $L$ to create $B'$.
        Because of the reflection, $PB = PB'$ for any point $P$ on $L$.
        The problem becomes minimizing $PA + PB'$. 
        The shortest distance between $A$ and $B'$ is a straight line. The intersection of line segment $AB'$ and line $L$ is the optimal point $P$.
        
        Why it works:
        This is Heron's shortest path problem, which elegantly uses reflection to un-bend a path so the Triangle Inequality can be applied directly.
