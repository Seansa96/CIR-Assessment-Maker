lesson:
  introduction: Learn to solve A Potpourri of Geometry problems by recognizing mixed geometry, auxiliary lines, diagram strategy, combined theorems and justifying each theorem or transformation.
  sections:
  - id: aops-geometry-potpourri-motivation
    title: What the topic helps you notice
    required: true
    content: A Potpourri of Geometry is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are mixed geometry, auxiliary lines, diagram strategy, combined theorems.
    check:
      id: aops-geometry-potpourri-motivation-check
      type: multipleChoice
      prompt: In A Potpourri of Geometry, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-geometry-potpourri-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-geometry-potpourri-definitions-check
      type: multipleChoice
      prompt: In A Potpourri of Geometry, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-geometry-potpourri-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: select a useful construction, combine angle and length facts, review theorem triggers. Record the givens, unknown, and any restriction before selecting a method.'
    check:
      id: aops-geometry-potpourri-recognition-check
      type: multipleChoice
      prompt: In A Potpourri of Geometry, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
