glossary:
  introduction: Vocabulary for how vibrating sources and resonators create musical sound.
  sections:
  - id: music-terms
    title: Core terms
    entries:
    - {id: fundamental, term: fundamental frequency, definition: 'The lowest allowed frequency and the main determinant of pitch.', drills: [{id: fundamental-drill, type: typed, prompt: 'Which frequency primarily determines pitch?', answer: fundamental frequency}]}
    - {id: harmonic, term: harmonic, definition: 'A frequency component at an integer multiple of the fundamental in an allowed mode.', drills: [{id: harmonic-drill, type: cloze, prompt: 'A component at an integer multiple of the fundamental is a {{harmonic}}.', answer: harmonic}]}
    - {id: timbre, term: timbre, definition: 'Tone quality determined by the relative amplitudes of harmonic components.', drills: [{id: timbre-drill, type: typed, prompt: 'What property distinguishes instruments playing the same pitch?', answer: timbre}]}
    - {id: resonator, term: resonator, definition: 'A cavity or body that selectively amplifies allowed vibration frequencies.', drills: [{id: resonator-drill, type: cloze, prompt: 'A guitar body acts as a {{resonator}}.', answer: resonator}]}
