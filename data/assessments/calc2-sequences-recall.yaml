schemaVersion: 1
id: calc2-sequences-recall
title: Sequences Recall Drill
assessmentType: recallDrill
categoryId: calculus-2
subcategoryId: sequences-series
subcategoryIds:
  - sequences-series
modeDefault: practice
randomizeQuestions: true
items:
  - id: r001
    type: typed
    prompt: "A sequence approaches a specific finite number as n approaches infinity. Does it converge or diverge?"
    answer:
      expected: converge
      aliases:
        - converges
  - id: r002
    type: typed
    prompt: "If a sequence bounces between -1 and 1 forever, does it converge or diverge?"
    answer:
      expected: diverge
      aliases:
        - diverges
  - id: r003
    type: flashcard
    prompt: "What mathematical theorem allows us to prove that sin(n)/n goes to 0?"
    answer:
      expected: "The Squeeze Theorem"
  - id: r004
    type: typed
    prompt: "What is 0! (zero factorial) defined to equal?"
    answer:
      expected: "1"
      aliases:
        - one
  - id: r005
    type: typed
    prompt: "The term (-1)^n causes a sequence to do what?"
    answer:
      expected: alternate
      aliases:
        - oscillate
        - "alternate signs"
