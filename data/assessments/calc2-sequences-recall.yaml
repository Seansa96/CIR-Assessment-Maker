items:
- id: r001
  type: typed
  skills:
  - sequences
  prompt: A sequence approaches a specific finite number as n approaches infinity.
    Does it converge or diverge?
  answer:
    expected: converge
    aliases:
    - converges
- id: r002
  type: typed
  skills:
  - sequences
  prompt: If a sequence bounces between -1 and 1 forever, does it converge or diverge?
  answer:
    expected: diverge
    aliases:
    - diverges
- id: r003
  type: flashcard
  skills:
  - sequences
  prompt: What mathematical theorem allows us to prove that sin(n)/n goes to 0?
  answer:
    expected: The Squeeze Theorem
- id: r004
  type: typed
  skills:
  - sequences
  prompt: What is 0! (zero factorial) defined to equal?
  answer:
    expected: '1'
    aliases:
    - one
- id: r005
  type: typed
  skills:
  - sequences
  prompt: The term (-1)^n causes a sequence to do what?
  answer:
    expected: alternate
    aliases:
    - oscillate
    - alternate signs
- id: r006
  type: typed
  skills:
  - sequence-limits
  prompt: What is the limit of $1/n$ as $n\to\infty$?
  answer:
    expected: '0'
    aliases:
    - zero
- id: r007
  type: flashcard
  skills:
  - monotone-convergence
  prompt: What two properties guarantee that a real sequence converges by the Monotone Convergence Theorem?
  answer:
    expected: It is monotone and bounded.
    aliases:
    - monotonic and bounded
- id: r008
  type: typed
  skills:
  - sequence-bounds
  prompt: A sequence satisfies $-2\le a_n\le5$ for every n. What property does it have?
  answer:
    expected: bounded
    aliases:
    - bounded sequence
- id: r009
  type: flashcard
  skills:
  - recursive-sequences
  prompt: Before solving a fixed-point equation for the limit of a recursive sequence, what must be established?
  answer:
    expected: That the sequence converges.
    aliases:
    - convergence
    - prove it converges
- id: r010
  type: typed
  skills:
  - growth-rates
  prompt: For fixed $c>1$, which eventually grows faster, $n!$ or $c^n$?
  answer:
    expected: $n!$
    aliases:
    - factorial
    - n factorial
- id: r011
  type: typed
  skills:
  - geometric-sequences
  prompt: For which condition on r does the sequence $r^n$ approach zero?
  answer:
    expected: $|r|<1$
    aliases:
    - absolute value of r is less than 1
- id: r012
  type: flashcard
  skills:
  - subsequences
  prompt: What does finding two subsequences with different limits prove about the original sequence?
  answer:
    expected: The original sequence diverges.
    aliases:
    - it diverges
    - nonconvergence
- id: r013
  type: typed
  skills:
  - rational-sequence-limits
  prompt: If two polynomials in n have the same degree, what determines the limit of their ratio as $n\to\infty$?
  answer:
    expected: the ratio of their leading coefficients
    aliases:
    - ratio of leading coefficients
- id: r014
  type: flashcard
  skills:
  - squeeze-theorem
  prompt: If $0\le a_n\le b_n$ and $b_n\to0$, what theorem gives $a_n\to0$?
  answer:
    expected: Squeeze Theorem
    aliases:
    - squeeze theorem for sequences
- id: r015
  type: typed
  skills:
  - sequence-convergence
  prompt: Does every convergent real sequence have to be bounded?
  answer:
    expected: yes
    aliases:
    - 'true'
