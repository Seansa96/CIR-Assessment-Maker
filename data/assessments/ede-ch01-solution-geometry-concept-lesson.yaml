lesson:
  introduction: Solutions are curves constrained simultaneously by local slopes, initial data, and the domain of
    the differential equation.
  sections:
  - id: s1
    title: Solution curves and integral curves
    required: true
    content: A solution curve is the graph of one differentiable function on an interval. An integral curve may
      be assembled from local function branches when the geometric curve is not globally a graph $y(x)$.
    media: []
    check:
      id: q001
      type: multipleChoice
      prompt: Why is a full circle not the graph of one solution $y(x)$?
      skills:
      - ede-ch01-introduction-classify-solutions
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch01-introduction-classify-solutions
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: A function of $x$ can assign only one $y$ to each input, although each semicircle is a local graph.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: Most vertical lines meet it twice
      - id: b
        text: Its radius is constant
        issueSignals:
        - id: ede-implicit-branch-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: It contains no differentiable arcs
        issueSignals:
        - id: ede-implicit-branch-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: It has no tangent slopes
        issueSignals:
        - id: ede-implicit-branch-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s2
    title: Implicit branches
    required: true
    content: From $x^2+y^2=a^2$, the branches are $y=\pm\sqrt{a^2-x^2}$. Initial data determine the sign, while
      implicit differentiation gives $y'=-x/y$ wherever $y\ne0$.
    media:
    - type: image
      src: /media/ede/ch01-implicit-branch-domain.svg
      alt: Upper and lower implicit branches selected by initial data with singular endpoints marked.
      caption: Use the relationships in the diagram to select and verify the next step.
    check:
      id: q002
      type: multipleChoice
      prompt: Which branch of $x^2+y^2=9$ contains $(0,-3)$?
      skills:
      - ede-ch01-introduction-classify-solutions
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch01-introduction-classify-solutions
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The initial point has negative $y$, selecting the lower semicircle.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $y=-\sqrt{9-x^2}$
      - id: b
        text: $y=\sqrt{9-x^2}$
        issueSignals:
        - id: ede-implicit-branch-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $x=\sqrt{9-y^2}$
        issueSignals:
        - id: ede-implicit-branch-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $y=9-x^2$
        issueSignals:
        - id: ede-implicit-branch-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s3
    title: Maximal intervals and singular loci
    required: true
    content: A solution branch stops being a valid $y(x)$ solution when its formula or the original ODE ceases to
      be defined. For $y'=-x/y$, the line $y=0$ is a singular locus.
    media: []
    check:
      id: q003
      type: multipleChoice
      prompt: What is the maximal open interval for the upper branch $y=\sqrt{25-x^2}$?
      skills:
      - ede-ch01-introduction-initial-value-validity
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch01-introduction-initial-value-validity
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: At $x=\pm5$ the branch reaches $y=0$, where the original right side is undefined.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $(-5,5)$
      - id: b
        text: $[-5,5]$
        issueSignals:
        - id: ede-validity-interval-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $(0,5)$
        issueSignals:
        - id: ede-validity-interval-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $(-\infty,\infty)$
        issueSignals:
        - id: ede-validity-interval-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s4
    title: Constructing a direction field
    required: true
    content: At each selected point $(x,y)$, evaluate $f(x,y)$ and draw a short segment with that slope. The segment
      records local direction, not a finite numerical step.
    media:
    - type: image
      src: /media/ede/ch01-direction-field-construction.svg
      alt: Workflow from sampled slopes to short field segments and tangent integral curves with undefined loci
        marked.
      caption: Use the relationships in the diagram to select and verify the next step.
    check:
      id: q004
      type: numericResponse
      prompt: For $y'=x-y$, what slope is drawn at $(2,-1)$?
      skills:
      - ede-ch01-introduction-direction-fields
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch01-introduction-direction-fields
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $f(2,-1)=2-(-1)=3$.

        Why it works: Direct substitution verifies the numerical result and its units or sign.
      answer:
        value: 3.0
        tolerance: 0.0001
  - id: s5
    title: Tracing plausible integral curves
    required: true
    content: A traced curve should remain tangent to nearby field segments. Steepness, sign changes, and zero-slope
      curves guide the sketch, but a field alone does not supply an exact formula.
    media: []
    check:
      id: q005
      type: multipleChoice
      prompt: For $y'=x-y$, where are field segments horizontal?
      skills:
      - ede-ch01-introduction-direction-fields
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch01-introduction-direction-fields
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Horizontal segments satisfy $x-y=0$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: On $y=x$
      - id: b
        text: On the $x$-axis
        issueSignals:
        - id: ede-direction-field-construction-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: On the $y$-axis
        issueSignals:
        - id: ede-direction-field-construction-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: Nowhere
        issueSignals:
        - id: ede-direction-field-construction-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s6
    title: Parametric motion through a singular slope
    required: true
    content: For $y'=A(x,y)/B(x,y)$, the parametric system $dx/dt=B$, $dy/dt=A$ can describe a curve even where
      the quotient slope is vertical because $B=0$.
    media: []
    check:
      id: q006
      type: multipleChoice
      prompt: Which parametric system corresponds to $y'=x/y$?
      skills:
      - ede-ch01-introduction-direction-fields
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch01-introduction-direction-fields
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The quotient $(dy/dt)/(dx/dt)$ is $x/y$ wherever $y\ne0$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $dx/dt=y,\ dy/dt=x$
      - id: b
        text: $dx/dt=x,\ dy/dt=y$
        issueSignals:
        - id: ede-direction-field-construction-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $dx/dt=1/y,\ dy/dt=1/x$
        issueSignals:
        - id: ede-direction-field-construction-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $dx/dt=-y,\ dy/dt=x$
        issueSignals:
        - id: ede-direction-field-construction-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
