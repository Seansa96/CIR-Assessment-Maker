schemaVersion: 1
id: trigonometric-substitution-patterns-worked-example
title: Trigonometric Substitution Pattern Selection Worked Example
assessmentType: workedExample
categoryId: calculus-2
subcategoryIds:
  - integration-techniques
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Choosing the trig substitution from the radical pattern
    problem: "Match radical structures to the trig substitution that turns the expression into a Pythagorean identity."
    steps:
      - id: s001
        title: Identify the square pattern
        instruction: "Trig substitution is usually triggered by a square root involving a constant square and a variable square."
        type: multipleChoice
        prompt: "Which expression has the classic $a^2-x^2$ pattern?"
        choices:
          - id: a
            text: "$\\sqrt{9-x^2}$"
          - id: b
            text: "$\\sqrt{x^2+9}$"
          - id: c
            text: "$\\sqrt{x^2-9}$"
          - id: d
            text: "$\\sqrt{x+9}$"
        answer:
          choiceId: a
        hint: "Look for constant square minus variable square."
        explanation: |
          $\\sqrt{9-x^2}$ is $\\sqrt{3^2-x^2}$, the $a^2-x^2$ pattern.

          Related topic: Radical pattern recognition; rewrite constants as squares before choosing the substitution.
      - id: s002
        title: Choose substitution for a2 minus x2
        instruction: "Use the identity $1-\\sin^2\\theta=\\cos^2\\theta$."
        type: multipleChoice
        prompt: "For $\\sqrt{a^2-x^2}$, which substitution is usually best?"
        choices:
          - id: a
            text: "$x=a\\sin\\theta$"
          - id: b
            text: "$x=a\\tan\\theta$"
          - id: c
            text: "$x=a\\sec\\theta$"
          - id: d
            text: "$x=\\theta^2$"
        answer:
          choiceId: a
        hint: "You want $a^2-a^2\\sin^2\\theta$."
        explanation: |
          If $x=a\\sin\\theta$, then $a^2-x^2=a^2(1-\\sin^2\\theta)=a^2\\cos^2\\theta$.

          Related topic: Sine substitution; use it when the radical is $a^2-x^2$.
      - id: s003
        title: Choose substitution for x2 plus a2
        instruction: "Use the identity $1+\\tan^2\\theta=\\sec^2\\theta$."
        type: multipleChoice
        prompt: "For $\\sqrt{x^2+a^2}$, which substitution is usually best?"
        choices:
          - id: a
            text: "$x=a\\tan\\theta$"
          - id: b
            text: "$x=a\\sin\\theta$"
          - id: c
            text: "$x=a\\cos\\theta$"
          - id: d
            text: "$x=a^2\\theta$"
        answer:
          choiceId: a
        hint: "You want $a^2\\tan^2\\theta+a^2$."
        explanation: |
          If $x=a\\tan\\theta$, then $x^2+a^2=a^2(\\tan^2\\theta+1)=a^2\\sec^2\\theta$.

          Related topic: Tangent substitution; use it for $x^2+a^2$.
      - id: s004
        title: Choose substitution for x2 minus a2
        instruction: "Use the identity $\\sec^2\\theta-1=\\tan^2\\theta$."
        type: multipleChoice
        prompt: "For $\\sqrt{x^2-a^2}$, which substitution is usually best?"
        choices:
          - id: a
            text: "$x=a\\sec\\theta$"
          - id: b
            text: "$x=a\\sin\\theta$"
          - id: c
            text: "$x=a\\tan\\theta$"
          - id: d
            text: "$x=\\ln \\theta$"
        answer:
          choiceId: a
        hint: "You want $a^2\\sec^2\\theta-a^2$."
        explanation: |
          If $x=a\\sec\\theta$, then $x^2-a^2=a^2(\\sec^2\\theta-1)=a^2\\tan^2\\theta$.

          Related topic: Secant substitution; use it for $x^2-a^2$.
      - id: s005
        title: Account for dx
        instruction: "After choosing the substitution, differentiate it so every $dx$ is replaced."
        type: multipleChoice
        prompt: "If $x=3\\tan\\theta$, what is $dx$?"
        choices:
          - id: a
            text: "$3\\sec^2\\theta\\,d\\theta$"
          - id: b
            text: "$3\\sin\\theta\\,d\\theta$"
          - id: c
            text: "$\\sec\\theta\\tan\\theta\\,d\\theta$"
          - id: d
            text: "$3\\theta\\,d\\theta$"
        answer:
          choiceId: a
        hint: "Differentiate tangent."
        explanation: |
          Since $\\frac{d}{d\\theta}\\tan\\theta=\\sec^2\\theta$, $dx=3\\sec^2\\theta\\,d\\theta$.

          Related topic: Differential substitution; after choosing $x=...$, immediately compute $dx$.
      - id: s006
        title: Convert back
        instruction: "After integrating in theta, return to x using the substitution triangle or algebraic identities."
        type: multipleChoice
        prompt: "If $x=3\\tan\\theta$, which triangle relationship helps convert back to $x$?"
        choices:
          - id: a
            text: "$\\tan\\theta=\\frac{x}{3}$"
          - id: b
            text: "$\\sin\\theta=\\frac{3}{x}$"
          - id: c
            text: "$\\cos\\theta=x+3$"
          - id: d
            text: "$\\theta=3x$"
        answer:
          choiceId: a
        hint: "Solve the substitution for the trig ratio."
        explanation: |
          From $x=3\\tan\\theta$, we get $\\tan\\theta=x/3$. Draw a right triangle with opposite $x$ and adjacent $3$ to express remaining trig functions in $x$.

          Related topic: Back-substitution triangle; translate the trig ratio into side lengths, then rewrite trig expressions in terms of $x$.
      - id: s007
        title: Summarize the lookup table
        instruction: "State the structural matching rule."
        type: freeResponse
        prompt: "Summarize the three main trig substitution patterns and what to do after choosing one."
        answer:
          expected: |
            For $a^2-x^2$, use $x=a\\sin\\theta$; for $x^2+a^2$, use $x=a\\tan\\theta$; for $x^2-a^2$, use $x=a\\sec\\theta$. Then compute $dx$, simplify using the matching Pythagorean identity, integrate in theta, and convert back to x with a triangle or algebra.
          gradingMode: selfCheck
          keyPoints:
            - "$a^2-x^2$ uses sine."
            - "$x^2+a^2$ uses tangent."
            - "$x^2-a^2$ uses secant."
            - "Compute $dx$."
            - "Use the matching Pythagorean identity."
            - "Convert back to $x$."
        hint: "Name sine, tangent, secant, then mention dx, identity, and back-substitution."
        explanation: |
          The fast lookup path is: review Pythagorean identities, trig substitution table, derivatives of $\\sin$, $\\tan$, and $\\sec$, and right-triangle back-substitution.

          Related topic: Trig substitution structure; match the radical form to the identity that turns the square root into one trig factor.
