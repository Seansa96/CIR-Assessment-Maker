items:
  - { id: q001, type: cloze, prompt: 'Polar area is one half times the integral of ____ squared d theta.', answer: { expected: r, aliases: [radius] }, explanation: 'Solution: The missing quantity is r. Why it works: Each differential sector has area one half r squared d theta. Common trap: Forgetting the square.' }
  - { id: q002, type: typed, prompt: 'State the area-between-curves polar integrand before the one-half factor.', answer: { expected: 'outer radius squared minus inner radius squared', aliases: ['ro squared minus ri squared'] }, explanation: 'Solution: Use outer radius squared minus inner radius squared. Why it works: You subtract sector areas. Common trap: Squaring the radius difference.' }
  - { id: q003, type: cloze, prompt: 'Polar arc length includes $r^2$ plus ____ squared under the radical.', answer: { expected: 'dr dtheta', aliases: ['dr/dtheta', 'r prime'] }, explanation: 'Solution: The missing rate is dr/dtheta. Why it works: Radius change contributes to the path length. Common trap: Using slope instead.' }
  - { id: q004, type: typed, prompt: 'What additional point must be checked when finding polar-curve intersections?', answer: { expected: pole, aliases: [origin] }, explanation: 'Solution: Check the pole separately. Why it works: It has many polar coordinate representations. Common trap: Only equating radii at one theta.' }
  - { id: q005, type: recognition, prompt: '![Polar region](/media/calculus/polar-review-loop-sector.svg) For the region inside both curves, which radius bounds it?', choices: [{ id: a, text: smaller radius }, { id: b, text: larger radius }], answer: { choiceId: a, expected: 'smaller radius', aliases: [minimum] }, explanation: 'Solution: Use the smaller radius. Why it works: Points must satisfy both inside inequalities. Common trap: Using outer-minus-inner, which describes a between-region.' }
