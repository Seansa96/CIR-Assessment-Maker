schemaVersion: 1
id: phys-n2-force-id-drill
title: Newton's Laws - Force Identification
assessmentType: quiz
categoryId: physics-1
subcategoryIds:
- physics-newton-laws
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - translation-only
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 15
questions:
- id: n2-frame-3rd-1
  type: multipleChoice
  prompt: '[Force Identification] A\rhorse pulls a cart. What is the Newton''s Third
    Law reaction pair to the force of the\rhorse pulling the cart?'
  choices:
  - id: a
    text: The cart pulling back on the\rhorse.
  - id: b
    text: The friction of the ground on the cart.
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** Third Law pairs ALWAYS act on different objects
    and involve the exact same interaction type.'
- id: n2-frame-norm-1
  type: multipleChoice
  prompt: '[Force Identification] You are standing in an elevator accelerating upward.
    Which force is strictly larger in magnitude than gravity?'
  choices:
  - id: a
    text: The normal force from the floor.
  - id: b
    text: The tension in the elevator cable.
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** FBD on the PERSON: N (up) and mg (down). Since
    a is UP, N > mg. FBD on the ELEVATOR involves tension, but tension doesn''t directly
    act on the person.'
