modeDefault: recall
randomizeQuestions: true
attemptQuestionCount: 15
items:
  - id: n2-id-q01
    title: Net Force vs Individual Force
    type: multipleChoice
    prompt: |
      In Newton's Second Law ($\Sigma F = ma$), what does $\Sigma F$ represent?
    choices:
      - id: a
        text: The single strongest force acting on the object.
      - id: b
        text: The vector sum of all external forces acting on the object.
      - id: c
        text: The sum of all forces acting both on and by the object.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** $\Sigma F$ (or $F_\text{net}$) is the vector addition of all *external* forces acting *on* the object of interest.

  - id: n2-id-q02
    title: Internal Forces in a System
    type: multipleChoice
    prompt: |
      Two blocks are glued together and pushed across a floor. If you define your "system" as both blocks together, what is the force of the glue holding them together considered?
    choices:
      - id: a
        text: An internal force, which does not appear in the $\Sigma F = ma$ equation for the system.
      - id: b
        text: An external force, which must be added to $\Sigma F$.
      - id: c
        text: A frictional force.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Internal forces act between objects within the defined system. By Newton's Third Law, they come in equal and opposite pairs that cancel each other out when summing forces for the whole system.

  - id: n2-id-q03
    title: Identification of Weight
    type: multipleChoice
    prompt: |
      What physical interaction is responsible for the force commonly called "weight"?
    choices:
      - id: a
        text: The electromagnetic repulsion from the floor.
      - id: b
        text: The gravitational attraction between the object and the Earth.
      - id: c
        text: The pressure of the atmosphere pushing down on the object.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** Weight ($W = mg$) is simply the local force of gravity exerted by a massive body (like Earth) on the object.

  - id: n2-id-q04
    title: Identification of Normal Force
    type: multipleChoice
    prompt: |
      What defines a "Normal" force in physics?
    choices:
      - id: a
        text: A force that acts perpendicular (normal) to the contact surface between two objects.
      - id: b
        text: A force that is typical or expected in a given situation.
      - id: c
        text: A force that opposes motion.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** In mathematics and physics, "normal" means perpendicular. The normal force always pushes directly away from the surface of contact.

  - id: n2-id-q05
    title: Identifying Tension
    type: multipleChoice
    prompt: |
      Which of the following best describes "Tension"?
    choices:
      - id: a
        text: A pushing force transmitted through a rigid rod.
      - id: b
        text: A pulling force transmitted axially by means of a string, cable, or chain.
      - id: c
        text: The force that opposes gravity.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** Tension is a pulling force. Strings and ropes can only pull; they cannot push. The tension force acts along the direction of the string.

  - id: n2-id-q06
    title: "Centripetal Force" - Is it a new force?
    type: multipleChoice
    prompt: |
      Is "centripetal force" a unique, fundamental type of force like gravity or electromagnetism?
    choices:
      - id: a
        text: Yes, it is a special force generated by circular motion.
      - id: b
        text: No, it is simply a label for whichever physical force (or sum of forces) happens to be pointing towards the center of a circular path.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** Centripetal means "center-seeking". It describes the *role* a force is playing. Gravity, tension, friction, or normal force can all act as a centripetal force. You never add a separate "centripetal force" to a free body diagram.

  - id: n2-id-q07
    title: Atwood Machine forces
    type: multipleChoice
    prompt: |
      In a simple Atwood machine (two masses hanging over a pulley), what are the ONLY two forces acting on each individual mass?
    choices:
      - id: a
        text: Gravity and Normal force
      - id: b
        text: Tension and Normal force
      - id: c
        text: Gravity and Tension
    answer:
      choiceId: c
    explanation: |
      **Instructor Notes:** Hanging masses do not touch any surfaces, so there is no normal force or friction. The only forces are the pull of the Earth (gravity) and the pull of the string (tension).

  - id: n2-id-q08
    title: What is Mass?
    type: multipleChoice
    prompt: |
      In the equation $F = ma$, what does the mass $m$ fundamentally represent?
    choices:
      - id: a
        text: The volume of the object.
      - id: b
        text: The amount of downward force the object exerts.
      - id: c
        text: A measure of the object's inertia (resistance to changes in velocity).
    answer:
      choiceId: c
    explanation: |
      **Instructor Notes:** Mass is the quantitative measure of inertia. A larger mass requires a larger net force to achieve the same acceleration.

  - id: n2-id-q09
    title: Fictitious Forces
    type: multipleChoice
    prompt: |
      When riding in a car that abruptly brakes, you feel pushed forward. Is this "forward push" a real physical force acting on your body?
    choices:
      - id: a
        text: Yes, it is the force of momentum pushing you.
      - id: b
        text: No, it is a "fictitious force" caused by observing the world from an accelerating reference frame. Your body simply wants to keep moving at constant velocity due to inertia.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** There is no physical agent (string, gravity, hand) pushing you forward. The car is accelerating backwards around you. Newton's laws only strictly hold in non-accelerating (inertial) frames.

  - id: n2-id-q10
    title: Reading a Scale
    type: multipleChoice
    prompt: |
      When you stand on a bathroom scale, what force is the scale ACTUALLY measuring and displaying?
    choices:
      - id: a
        text: The true force of gravity on your body (your weight).
      - id: b
        text: The upward normal force the scale exerts on your feet to support you.
      - id: c
        text: Your mass.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** A scale measures the contact force squeezing it. This is the normal force. If you accelerate (e.g., in an elevator), the normal force changes, and the scale reading ("apparent weight") changes, even though your true gravity weight ($mg$) is constant.

  - id: n2-id-q11
    title: Action-Reaction Pairs
    type: multipleChoice
    prompt: |
      A book rests on a table. Downward gravity acts on the book. According to Newton's Third Law, what is the "reaction" force to this gravity?
    choices:
      - id: a
        text: The upward normal force of the table on the book.
      - id: b
        text: The upward gravitational pull of the book on the Earth.
      - id: c
        text: The downward push of the book on the table.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** Third Law pairs always involve the same two objects and the same type of force. Earth pulls book down (gravity), so book pulls Earth up (gravity). The normal force is NOT the reaction to gravity; it is the reaction to the book pushing on the table.

  - id: n2-id-q12
    title: Air Resistance type
    type: multipleChoice
    prompt: |
      Air resistance (drag) is a specific example of which broader category of forces?
    choices:
      - id: a
        text: Gravitational forces
      - id: b
        text: Fluid friction forces
      - id: c
        text: Tension forces
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** Air is a fluid. When an object moves through it, the collisions with air molecules create a resistive force known as fluid friction or drag.

  - id: n2-id-q13
    title: Buoyancy
    type: multipleChoice
    prompt: |
      A balloon floats upwards. What force opposes gravity to cause this upward acceleration?
    choices:
      - id: a
        text: Tension
      - id: b
        text: Normal force
      - id: c
        text: Buoyant force
    answer:
      choiceId: c
    explanation: |
      **Instructor Notes:** The upward force exerted by a fluid (like air or water) on an object immersed in it is the buoyant force. It arises from pressure differences in the fluid.

  - id: n2-id-q14
    title: Applied Force
    type: multipleChoice
    prompt: |
      In a problem, "a worker pushes a crate." What generic label is often given to this specific push in a free body diagram?
    choices:
      - id: a
        text: Normal Force ($N$)
      - id: b
        text: Applied Force ($F_A$ or $F_\text{push}$)
      - id: c
        text: Tension ($T$)
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** Pushes or pulls by people, motors, or un-specified external agents are usually just labeled as a generic Applied Force ($F_A$ or $F_\text{app}$).

  - id: n2-id-q15
    title: Forces on a Projectile
    type: multipleChoice
    prompt: |
      A baseball is in mid-air after being hit. Ignoring air resistance, what are the forces acting on the baseball?
    choices:
      - id: a
        text: Gravity pointing down, and a forward "force of the hit".
      - id: b
        text: Only gravity pointing down.
      - id: c
        text: Gravity pointing down, and normal force pointing up.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** Once the bat loses contact with the ball, the "force of the hit" ceases to exist. The only force acting on a projectile in free fall is gravity.
