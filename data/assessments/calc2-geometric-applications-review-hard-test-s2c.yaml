questions:
  - { id: q001, type: symbolicResponse, prompt: 'Find the area between $y=x^3$ and $y=x$ on $[-1,1]$.', answer: { expectedLatex: '1/2', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: The curve order switches at 0. By symmetry, $A=2\int_0^1(x-x^3)dx=2(1/2-1/4)=1/2$. Why it works: Geometric area requires a nonnegative top-minus-bottom model on each order interval. Common trap: One integral from -1 to 1 cancels because the signed difference changes sign.', difficultyDimensions: [casePartition, modelOrDerivation, simplification], difficultyEvidence: 'Requires a curve-order partition, geometric area model, and justified symmetry reduction.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q002, type: symbolicResponse, prompt: 'Use horizontal slices to find the area enclosed by $y=x^2$ and $y=2x$.', answer: { expectedLatex: '4/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Intersections give y from 0 to 4. Solve for x: $x=y/2$ and $x=\sqrt y$, so $A=\int_0^4(\sqrt y-y/2)dy=16/3-4=4/3$. Why it works: A horizontal slice has right boundary $\sqrt y$ and left boundary $y/2$. Common trap: The y-bounds are 0 and 4, not the original x intersections 0 and 2.', difficultyDimensions: [representationTransfer, auxiliaryTechnique, modelOrDerivation], difficultyEvidence: 'Finds intersections, inverts both curves, and constructs right-minus-left in y.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q003, type: freeResponse, prompt: 'For the region between $y=\sin x$ and the x-axis on $0\le x\le2\pi$, explain why $\int_0^{2\pi}\sin x\,dx$ is not geometric area. Give a correct area setup.', answer: { gradingMode: selfCheck, keyPoints: ['sine changes sign at pi', 'split at pi or use absolute value', 'integral zero to pi sine minus integral pi to two pi sine'] }, explanation: 'Solution: The signed integral is zero because the negative lobe cancels the positive lobe. Geometric area is $\int_0^\pi\sin x\,dx-\int_\pi^{2\pi}\sin x\,dx=4$. Why it works: Area measures magnitude, so intervals below the axis must be sign-corrected. Common trap: A zero net integral does not imply zero area.', difficultyDimensions: [casePartition, errorDiagnosis, modelOrDerivation], difficultyEvidence: 'Separates signed accumulation from geometric area and partitions at a sign change.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q004, type: symbolicResponse, prompt: 'Rotate the region between $y=x^2$ and $y=4$ for $0\le x\le2$ about $y=5$. Find the volume.', answer: { expectedLatex: '416\pi/15', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $R=5-x^2$ and $r=1$, so $V=\pi\int_0^2[(5-x^2)^2-1]dx=\pi\int_0^2(24-10x^2+x^4)dx=416\pi/15$. Why it works: The axis lies above the region, so distance to the lower curve is the outer radius. Common trap: Function order does not automatically determine radius order after an axis shift.', difficultyDimensions: [representationTransfer, reverseReasoning, auxiliaryTechnique], difficultyEvidence: 'Compares offset distances, reverses curve-order intuition, and expands a squared radius.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q005, type: symbolicResponse, prompt: 'Use shells to rotate the region under $y=x$ on $0\le x\le3$ about $x=1$.', answer: { expectedLatex: '29\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Radius is $|x-1|$, so $V=2\pi[\int_0^1(1-x)x\,dx+\int_1^3(x-1)x\,dx]=29\pi/3$. Why it works: A shell radius is nonnegative distance to the axis. Common trap: A single signed radius integral lets negative and positive contributions cancel.', difficultyDimensions: [casePartition, modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Partitions an absolute-distance radius at the internal axis and integrates two models.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q006, type: symbolicResponse, prompt: 'The base is the upper semicircle $x^2+y^2\le4$. Cross sections perpendicular to the x-axis are equilateral triangles. Find the volume.', answer: { expectedLatex: '8\sqrt{3}/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: The full vertical chord is $s=\sqrt{4-x^2}$. Thus $A=\sqrt3s^2/4=\sqrt3(4-x^2)/4$, and $V=\int_{-2}^2A\,dx=8\sqrt3/3$. Why it works: The graph height is half the chord, while the triangle side is the full chord. Common trap: Using the visible semicircle height as side underestimates every cross section.', difficultyDimensions: [representationTransfer, modelOrDerivation, simplification], difficultyEvidence: 'Converts a curved base into a chord, applies a nonrectangular shape formula, and removes a radical.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q007, type: freeResponse, prompt: 'Compare shells and washers for rotating the region bounded by $y=x$ and $y=4$ about the y-axis. Give one valid setup for each and identify the more direct method.', answer: { gradingMode: selfCheck, keyPoints: ['shells two pi integral x times four minus x', 'washers pi integral y squared dy', 'shells more direct from given y functions'] }, explanation: 'Solution: Shells: $2\pi\int_0^4x(4-x)dx$. Washers: $\pi\int_0^4y^2dy$. Shells are more direct because vertical height is already supplied. Why it works: Parallel and perpendicular strips can model the same solid in different variables. Common trap: Method choice is about representation efficiency, not an absolute axis rule.', difficultyDimensions: [representationTransfer, reverseReasoning, modelOrDerivation], difficultyEvidence: 'Builds two equivalent models and compares their required transformations.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q008, type: freeResponse, prompt: 'A student proposes $\pi\int_0^2(2-x)^2dx$ for rotating the region between $y=x$ and $y=2$ about the x-axis. Diagnose the error and give the correct volume integral.', answer: { gradingMode: selfCheck, keyPoints: ['two minus x is vertical height not washer area', 'outer radius two inner radius x', 'pi integral zero to two four minus x squared'] }, explanation: 'Solution: $(2-x)^2$ squares a vertical height rather than subtracting circular areas. The correct model is $V=\pi\int_0^2[2^2-x^2]dx$. Why it works: A washer uses distances from the axis to its outer and inner boundaries. Common trap: Squaring a difference of graph values is not generally the same as a difference of squared radii.', difficultyDimensions: [errorDiagnosis, reverseReasoning, modelOrDerivation], difficultyEvidence: 'Decodes a flawed formula and rebuilds the annular cross-sectional geometry.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q009, type: symbolicResponse, prompt: 'Rotate $y=\sqrt{x}$, $0\le x\le4$, about the x-axis. Find the exact surface area.', answer: { expectedLatex: '\pi(17\sqrt{17}-1)/6', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $y''=1/(2\sqrt x)$, so $S=2\pi\int_0^4\sqrt x\sqrt{1+1/(4x)}dx=\pi\int_0^4\sqrt{4x+1}dx=\pi(17\sqrt{17}-1)/6$. Why it works: The full radius-times-$ds$ product has a removable endpoint singularity. Common trap: Do not discard x=0 merely because the isolated derivative is undefined; simplify the actual integrand first.', difficultyDimensions: [simplification, modelOrDerivation, domainCondition], difficultyEvidence: 'Combines radical factors, analyzes a boundary singularity, and evaluates a transformed radical integral.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q010, type: symbolicResponse, prompt: 'Find the arc length of $y=\ln(\cos x)$ on $0\le x\le\pi/4$.', answer: { expectedLatex: '\ln(1+\sqrt{2})', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $y''=-\tan x$, and $\sqrt{1+\tan^2x}=\sec x$ on this interval. Thus $L=\int_0^{\pi/4}\sec xdx=\ln|\sec x+\tan x|_0^{\pi/4}=\ln(1+\sqrt2)$. Why it works: The identity $1+\tan^2x=\sec^2x$ converts the length radical to an integrable function. Common trap: The square root is $|\sec x|$; the interval sign check makes it $\sec x$.', difficultyDimensions: [identityConstruction, domainCondition, auxiliaryTechnique], difficultyEvidence: 'Uses a trigonometric identity, justifies a sign choice, and integrates secant.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q011, type: freeResponse, prompt: 'State the surface-area integrand for rotating $y=f(x)$ about $y=c$. Then explain what additional check is needed if the curve crosses the axis.', answer: { gradingMode: selfCheck, keyPoints: ['two pi absolute f minus c square root one plus f prime squared', 'check where f minus c changes sign', 'partition or use absolute value'] }, explanation: 'Solution: $S=2\pi\int|f(x)-c|\sqrt{1+[f''(x)]^2}\,dx$. If $f(x)=c$ inside the interval, find that point and partition or retain the absolute value. Why it works: Surface radius is a nonnegative distance to the axis. Common trap: Using $f-c$ without sign analysis can create negative surface contributions.', difficultyDimensions: [representationTransfer, casePartition, modelOrDerivation], difficultyEvidence: 'Generalizes a shifted-axis radius and identifies the threshold that changes its sign.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q012, type: symbolicResponse, prompt: 'Rotate the region between $y=x^2$ and $y=2x$ about the y-axis. Find the volume.', answer: { expectedLatex: '8\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Intersections are x=0 and 2; height is $2x-x^2$. $V=2\pi\int_0^2x(2x-x^2)dx=8\pi/3$. Why it works: The line is above the parabola on the enclosed interval. Common trap: Starting at x=0 and ending at x=1 misses the second intersection.', difficultyDimensions: [auxiliaryTechnique, modelOrDerivation, domainCondition], difficultyEvidence: 'Finds bounds, determines curve order, and forms a cubic shell density.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q013, type: symbolicResponse, prompt: 'Rotate the line segment $y=x$ from $x=0$ to $x=2$ about the y-axis. Find the surface area.', answer: { expectedLatex: '4\pi\sqrt{2}', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Radius is x and $ds=\sqrt2dx$, so $S=2\pi\int_0^2x\sqrt2dx=4\pi\sqrt2$. Why it works: A slanted line creates a conical surface whose band radius changes with x. Common trap: $2\pi\int xdx$ omits slant length and underestimates the surface.', difficultyDimensions: [modelOrDerivation, representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Builds a surface-band model, translates a line into variable radius, and applies a slope correction.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q014, type: symbolicResponse, prompt: 'The base is bounded by $y=0$, $y=x$, and $x=2$. Cross sections perpendicular to the y-axis are squares. Find the volume.', answer: { expectedLatex: '8/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: For $0\le y\le2$, width is $2-y$, so $V=\int_0^2(2-y)^2dy=8/3$. Why it works: The cross-section direction requires horizontal slices and y-based boundaries. Common trap: Keeping dx would describe a different family of square sections.', difficultyDimensions: [representationTransfer, modelOrDerivation, domainCondition], difficultyEvidence: 'Changes variable, solves a boundary for x, and selects matching bounds.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q015, type: freeResponse, prompt: 'Explain why using both halves of the region under $y=1-x^2$ on $[-1,1]$ as shells about the y-axis double-counts volume. Give a correct setup.', answer: { gradingMode: selfCheck, keyPoints: ['symmetric strips make same physical shell', 'restrict to x zero to one', 'two pi integral x times one minus x squared'] }, explanation: 'Solution: The strips at x and -x have the same radius and height after rotation, so they generate the same shell. Use $V=2\pi\int_0^1x(1-x^2)dx$. Why it works: A shell is indexed by nonnegative radial distance, not by signed x-position. Common trap: Symmetry sometimes doubles area, but it does not double overlapping shells.', difficultyDimensions: [globalLocalReasoning, errorDiagnosis, modelOrDerivation], difficultyEvidence: 'Distinguishes a symmetric planar representation from the unique three-dimensional shells it produces.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q016, type: freeResponse, prompt: 'A region between two curves has an area model that is easy with dx but requires two pieces with dy. Explain what information a diagram gives you to justify choosing dx.', answer: { gradingMode: selfCheck, keyPoints: ['vertical slices have one top and one bottom boundary', 'horizontal slices change left or right boundary', 'choose representation with fewer pieces'] }, explanation: 'Solution: Draw a representative vertical and horizontal slice. If each vertical slice runs continuously from one lower curve to one upper curve, dx gives one top-minus-bottom integral; a horizontal boundary switch would force a dy partition. Why it works: Slice direction is selected from boundary continuity, not habit. Common trap: Choosing dx merely because functions are written as y=f(x) without checking for switches.', difficultyDimensions: [representationTransfer, casePartition, reverseReasoning], difficultyEvidence: 'Uses a diagram to predict whether a representation needs a partition and compares method complexity.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q017, type: freeResponse, prompt: 'A parameter a shifts the axis of rotation from $y=0$ to $y=a$ for a region between $y=1$ and $y=3$. Describe the threshold values of a that change the washer/disk geometry.', answer: { gradingMode: selfCheck, keyPoints: ['threshold a equals one or three', 'outside interval washers', 'inside interval axis crosses region and outer radius can change or disk behavior occurs'] }, explanation: 'Solution: The geometry changes when the axis meets either boundary: $a=1$ and $a=3$. For $a<1$ or $a>3$, every slice is a washer; for $1<a<3$, the axis passes through the region and the farthest boundary determines a disk radius, possibly with a radius-switch threshold at $a=2$. Why it works: Radius formulas change only when a distance becomes zero or competing distances become equal. Common trap: Treating all shifted axes as the same washer situation.', difficultyDimensions: [parameterThreshold, casePartition, modelOrDerivation], difficultyEvidence: 'Identifies parameter thresholds from geometric contacts and compares competing distances.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q018, type: symbolicResponse, prompt: 'Find the exact arc length of $y=(2x+1)^{3/2}/3$ from $x=0$ to $x=4$.', answer: { expectedLatex: '(10\sqrt{10}-2\sqrt{2})/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $y''=\sqrt{2x+1}$, so $L=\int_0^4\sqrt{2x+2}dx=[(2x+2)^{3/2}/3]_0^4=(10\sqrt{10}-2\sqrt2)/3$. Why it works: Chain-rule factors simplify the arc-length radical to one shifted power. Common trap: Omitting the inner derivative factor gives the wrong slope and length.', difficultyDimensions: [auxiliaryTechnique, simplification, modelOrDerivation], difficultyEvidence: 'Uses chain rule, radical simplification, and exact endpoint evaluation.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q019, type: symbolicResponse, prompt: 'Rotate $y=2\sqrt{x}$ on $0\le x\le1$ about the x-axis. Find the exact surface area.', answer: { expectedLatex: '(8\pi/3)(2\sqrt{2}-1)', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $y''=1/\sqrt x$ and $y\sqrt{1+(y'')^2}=2\sqrt{x+1}$. Thus $S=4\pi\int_0^1\sqrt{x+1}dx=(8\pi/3)(2\sqrt2-1)$. Why it works: Simplifying the complete radius-times-slope product removes the apparent singularity. Common trap: Radius and slope correction are multiplied, not added.', difficultyDimensions: [simplification, modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Combines radical factors, resolves a singular-looking derivative, and integrates a shifted radical.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q020, type: freeResponse, prompt: 'A complete geometric-application solution gives an antiderivative but no diagram, bounds justification, or units check. List the three model-validation checks that should be added and explain why each matters.', answer: { gradingMode: selfCheck, keyPoints: ['draw and label region axis or slice', 'derive and check bounds intersections or endpoints', 'check units area volume length or surface area', 'verify top bottom or radii'] }, explanation: 'Solution: Add (1) a labeled graph/slice/axis diagram to identify the measured distance or width, (2) a derivation of bounds from intersections/endpoints and a top-bottom or outer-inner check, and (3) a units check: area has length squared, volume length cubed, arc length length, and surface area length squared. Why it works: These checks validate the model before algebra can hide a conceptual error. Common trap: A correct antiderivative cannot rescue an integral built from the wrong geometry.', difficultyDimensions: [errorDiagnosis, proofJustification, modelOrDerivation], difficultyEvidence: 'Requires a global audit of the model rather than procedural integration alone.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
