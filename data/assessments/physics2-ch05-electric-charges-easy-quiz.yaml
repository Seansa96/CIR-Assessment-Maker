questions:
- id: q001
  type: multipleChoice
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  prompt: 'If the distance between two point charges is doubled, the electric force between them:'
  explanation: 'Solution:

    According to Coulomb''s Law, $F \propto 1/r^2$. Therefore, if $r \to 2r$, $F \to F/4$.


    Why it works:

    The inverse-square law dictates that doubling the distance spreads the interaction over four times the area.

    Why the other choices fail: Halving would imply $1/r$, doubling implies proportional to $r$, etc.'
  choices:
  - id: a
    text: Decreases by a factor of 4
  - id: b
    text: Halves
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: Doubles
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: d
    text: Increases by a factor of 4
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  answer:
    choiceId: a
  difficultyEvidence: Apply the topic’s defining relation to a direct case.
  skills:
  - physics2-ch05-electric-charges-fields-electric-charge
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-dipoles
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-electric-charge
- id: q002
  type: multipleChoice
  skills:
  - physics2-ch05-electric-charges-fields-charging-induction
  prompt: Two charges +5.0 nC and -2.0 nC are 0.30 m apart. Find the force magnitude.
  choices:
  - id: a
    text: 1.0e-6 N
  - id: b
    text: 3.0e-7 N
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: 2.0e-6 N
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: 9.0e-8 N
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: a
  explanation: 'Solution: F=k|q1q2|/r^2=1.0e-6 N.


    Why it works: Coulomb’s law uses charge magnitudes for force magnitude and squares separation.


    Why the other choices fail: The distractors represent a length instead of length-squared, a sign used as magnitude,
    and a factor-of-ten arithmetic error.'
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-charging-induction
  difficultyEvidence: Requires applying the topic’s governing relation and interpreting its physical sign, geometry,
    or scaling.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-electric-charge
- id: q003
  type: multipleChoice
  skills:
  - physics2-ch05-electric-charges-fields-coulomb-law
  prompt: 'If separation of fixed point charges triples, the force magnitude becomes:'
  choices:
  - id: a
    text: one third
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: three times
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: nine times
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: one ninth
  answer:
    choiceId: d
  explanation: 'Solution: F scales as 1/r^2, so tripling r divides F by nine.


    Why it works: The inverse-square dependence controls the scaling.


    Why the other choices fail: The alternatives use inverse-linear, direct, or reversed square dependence.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-coulomb-law
  difficultyEvidence: Requires applying the topic’s governing relation and interpreting its physical sign, geometry,
    or scaling.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-charging-induction
- id: q004
  type: multipleChoice
  skills:
  - physics2-ch05-electric-charges-fields-electric-field
  prompt: A positive source is at the origin. What is E direction at x<0?
  choices:
  - id: a
    text: perpendicular to the x-axis at point P
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: zero net field at P
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: toward -x
  - id: d
    text: toward +x
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: c
  explanation: 'Solution: A positive source field points radially outward, hence toward -x on that side.


    Why it works: E is defined in the direction a positive test charge would be pushed.


    Why the other choices fail: The alternatives point inward, invent a transverse component, or ignore the nonzero
    source.'
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-electric-field
  difficultyEvidence: Requires applying the topic’s governing relation and interpreting its physical sign, geometry,
    or scaling.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-coulomb-law
- id: q005
  type: multipleChoice
  skills:
  - physics2-ch05-electric-charges-fields-continuous-charge-fields
  prompt: At P, fields are +E x-hat and -E x-hat. What is the net field?
  choices:
  - id: a
    text: 2E toward -x
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: zero
  - id: c
    text: 2E toward +x
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: E toward -x
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: b
  explanation: 'Solution: The two equal opposite vectors cancel.


    Why it works: Superposition adds signed components, not magnitudes alone.


    Why the other choices fail: The nonzero alternatives discard or mishandle one vector direction.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-continuous-charge-fields
  difficultyEvidence: Requires applying the topic’s governing relation and interpreting its physical sign, geometry,
    or scaling.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-electric-field
- id: q006
  type: multipleChoice
  skills:
  - physics2-ch05-electric-charges-fields-field-lines
  prompt: 'For linear density lambda, charge on a segment dx is:'
  choices:
  - id: a
    text: dq=lambda dx
  - id: b
    text: dq=lambda/dx
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: dq=dx/lambda
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: dq=lambda dx^2
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: a
  explanation: 'Solution: lambda=dq/dx, therefore dq=lambda dx.


    Why it works: The units C/m times m give charge.


    Why the other choices fail: The alternatives invert density or produce incorrect units.'
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-field-lines
  difficultyEvidence: Requires applying the topic’s governing relation and interpreting its physical sign, geometry,
    or scaling.
