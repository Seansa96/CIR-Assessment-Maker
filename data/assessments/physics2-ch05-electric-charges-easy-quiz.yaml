- id: q010
  type: multipleChoice
  skills:
  - physics2-ch05-electric-charges-fields-coulomb-law
  prompt: At what angle is torque on a dipole in a uniform field largest?
  choices:
  - id: a
    text: 90 degrees
  - id: b
    text: 0 degrees
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: 180 degrees
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: same at every angle
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: a
  explanation: 'Solution: |tau|=pE sin(theta) peaks at 90 degrees.


    Why it works: The cross product vanishes for parallel and antiparallel alignment.


    Why the other choices fail: The alternatives ignore the sine dependence.'
  difficultyDimensions:
