- id: q001
  type: multipleChoice
  difficultyDimensions: &id001
  - modelOrDerivation
  - errorDiagnosis
  prompt: 'If the distance between two point charges is doubled, the electric force between them:'
  explanation: 'Solution:

    According to Coulomb''s Law, $F \propto 1/r^2$. Therefore, if $r \to 2r$, $F \to F/4$.


    Why it works:

    The inverse-square law dictates that doubling the distance spreads the interaction over four times the area.

    Why the other choices fail: Halving would imply $1/r$, doubling implies proportional to $r$, etc.'
  choices:
  - id: a
    text: Decreases by a factor of 4
  - id: b
    text: Halves
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: Doubles
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: d
    text: Increases by a factor of 4
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  answer:
    choiceId: a
  difficultyEvidence: Requires selecting the governing physical model and checking an assumption or representation.
