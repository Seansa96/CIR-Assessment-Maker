- id: q009
  type: multipleChoice
  skills:
  - physics2-ch05-electric-charges-fields-charging-induction
  prompt: Dipole charges are -q at x=-a and +q at x=+a. Direction of p?
  choices:
  - id: a
    text: perpendicular to the dipole axis
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: +x
  - id: c
    text: -x
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: zero dipole moment
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: b
  explanation: 'Solution: The dipole moment points from negative to positive charge.


    Why it works: A dipole can have zero net charge and nonzero moment.


    Why the other choices fail: The other choices reverse its definition or confuse net charge with dipole moment.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  subjectDifficultyTags:
