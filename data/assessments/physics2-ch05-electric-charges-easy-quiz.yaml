- id: q008
  type: multipleChoice
  skills:
  - physics2-ch05-electric-charges-fields-electric-charge
  prompt: Which statement about field lines is correct?
  choices:
  - id: a
    text: They run from negative to positive charge.
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: Spacing does not indicate strength.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: They do not cross; tangent gives E direction.
  - id: d
    text: They cross where source fields overlap.
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: c
  explanation: 'Solution: A point has one field vector, so field lines cannot cross there.


    Why it works: Tangent gives direction and density indicates relative field strength.


    Why the other choices fail: Crossing assigns two directions; the other options reverse line direction or discard
    density.'
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-electric-charge
  difficultyEvidence: Requires applying the topic’s governing relation and interpreting its physical sign, geometry,
    or scaling.
  prerequisiteObjectiveIds:
