- id: q007
  type: multipleChoice
  skills:
  - physics2-ch05-electric-charges-fields-dipoles
  prompt: Where is the field of a uniformly charged ring zero on its axis?
  choices:
  - id: a
    text: everywhere on the axis
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: only at infinity
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: at the ring edge
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: at the center
  answer:
    choiceId: d
  explanation: 'Solution: At the center, each charge element is canceled by its opposite partner.


    Why it works: Symmetry cancels the axial components at z=0.


    Why the other choices fail: Away from center the axial components add; the field is not zero along the whole
    axis.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  subjectDifficultyTags:
