questions:
- id: q001
  difficultyDimensions: [modelOrDerivation, simplification]
  title: Perpendicular torque
  type: numericResponse
  prompt: |-
    A $40\text{ N}$ force is applied perpendicular $0.30\text{ m}$ from a pivot. What torque is produced?
  answer:
    value: 12.0
    tolerance: 0.1
  explanation: |-
    Solution: $\tau=rF=0.30(40)=12\text{ N}\cdot\text{m}$.
    Why it works: A perpendicular force produces torque equal to radius times force.
- id: q002
  difficultyDimensions: [modelOrDerivation, representationTransfer]
  title: Angled torque
  type: numericResponse
  prompt: |-
    A $100\text{ N}$ force is applied $0.50\text{ m}$ from a pivot at $30^\circ$. What torque is produced?
  answer:
    value: 25.0
    tolerance: 0.3
  explanation: |-
    Solution: $\tau=rF\sin\theta=0.50(100)\sin30^\circ=25$.
    Why it works: Only the component perpendicular to the radius turns the object.
- id: q003
  difficultyDimensions: [modelOrDerivation, representationTransfer]
  title: Maximum angle
  type: multipleChoice
  prompt: |-
    For fixed $r$ and $F$, what angle gives maximum torque?
  choices:
  - id: a
    text: |-
      $90^\circ$
  - id: b
    text: |-
      $0^\circ$
  - id: c
    text: |-
      $30^\circ$
  - id: d
    text: |-
      $180^\circ$
  answer:
    choiceId: a
  explanation: |-
    Solution: $\sin\theta$ is largest at $90^\circ$.
    Why it works: Torque is proportional to $\sin\theta$ for fixed radius and force.
    Why the other choices fail: Smaller sine values produce less torque, including zero at 0 and 180 degrees.
- id: q004
  difficultyDimensions: [modelOrDerivation, simplification]
  title: Lever arm
  type: numericResponse
  prompt: |-
    A $60\text{ N}$ force has a perpendicular lever arm of $0.25\text{ m}$. What is the torque?
  answer:
    value: 15.0
    tolerance: 0.1
  explanation: |-
    Solution: $\tau=Fr_\perp=60(0.25)=15$.
    Why it works: The stated lever arm is already perpendicular to the force line.
- id: q005
  difficultyDimensions: [representationTransfer, modelOrDerivation]
  title: Zero torque
  type: multipleChoice
  prompt: |-
    Which force produces zero torque about a pivot?
  choices:
  - id: a
    text: |-
      A force whose line of action passes through the pivot.
  - id: b
    text: |-
      A perpendicular force far from the pivot.
  - id: c
    text: |-
      A tangential force.
  - id: d
    text: |-
      A force with a long lever arm.
  answer:
    choiceId: a
  explanation: |-
    Solution: The line of action passes through the pivot.
    Why it works: Its perpendicular lever arm is zero.
    Why the other choices fail: The other choices explicitly describe nonzero lever arms.
- id: q006
  difficultyDimensions: [representationTransfer, simplification]
  title: Net torque sign
  type: numericResponse
  prompt: |-
    A $10\text{ N}\cdot\text{m}$ CCW torque and $4\text{ N}\cdot\text{m}$ CW torque act. Taking CCW positive, what is net torque?
  answer:
    value: 6.0
    tolerance: 0.1
  explanation: |-
    Solution: $\tau_{net}=10-4=6\text{ N}\cdot\text{m}$.
    Why it works: Counterclockwise is positive, so the clockwise torque is negative.
- id: q007
  difficultyDimensions: [reverseReasoning, modelOrDerivation]
  title: Force from torque
  type: numericResponse
  prompt: |-
    A required torque is $18\text{ N}\cdot\text{m}$ from a perpendicular force at $0.60\text{ m}$. What force is needed?
  answer:
    value: 30.0
    tolerance: 0.2
  explanation: |-
    Solution: $F=\tau/r=18/0.60=30\text{ N}$.
    Why it works: Rearranging the perpendicular torque relation isolates force.
- id: q008
  difficultyDimensions: [representationTransfer, modelOrDerivation]
  title: CCW convention
  type: multipleChoice
  prompt: |-
    In many 2D torque problems, counterclockwise torque is chosen as:
  choices:
  - id: a
    text: |-
      positive
  - id: b
    text: |-
      negative
  - id: c
    text: |-
      zero
  - id: d
    text: |-
      undefined
  answer:
    choiceId: a
  explanation: |-
    Solution: Counterclockwise is positive.
    Why it works: A sign convention is selected before torques are summed.
    Why the other choices fail: The convention assigns CCW positive; zero and undefined are not sign choices.
- id: q009
  difficultyDimensions: [modelOrDerivation, simplification]
  title: Seesaw balance
  type: numericResponse
  prompt: |-
    A $200\text{ N}$ child sits $1.5\text{ m}$ left of a pivot. A $300\text{ N}$ child sits right. How far right to balance?
  answer:
    value: 1.0
    tolerance: 0.02
  explanation: |-
    Solution: $200(1.5)=300x$, so $x=1.0\text{ m}$.
    Why it works: Balance requires equal clockwise and counterclockwise torque magnitudes.
- id: q010
  difficultyDimensions: [representationTransfer, modelOrDerivation]
  title: Lever arm definition
  type: multipleChoice
  prompt: |-
    The lever arm is:
  choices:
  - id: a
    text: |-
      perpendicular distance from pivot to force line of action
  - id: b
    text: |-
      total object length
  - id: c
    text: |-
      mass times radius squared
  - id: d
    text: |-
      angle swept out
  answer:
    choiceId: a
  explanation: |-
    Solution: The lever arm is the perpendicular pivot-to-line distance.
    Why it works: Torque is force times that shortest distance.
    Why the other choices fail: Object length, moment of inertia, and angular displacement are different quantities.
