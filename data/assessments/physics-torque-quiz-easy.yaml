randomizeQuestions: true
questions:
- id: q1
  type: numericResponse
  prompt: A force of $50 \text{ N}$ is applied perpendicularly to the end of a $0.2
    \text{ m}$ long wrench. What is the magnitude of the torque?
  answer:
    value: 10.0
    tolerance: 0.5
  explanation: $\tau = rF\sin(90^\circ) = 0.2(50)(1) = 10 \text{ N}\cdot\text{m}$.
