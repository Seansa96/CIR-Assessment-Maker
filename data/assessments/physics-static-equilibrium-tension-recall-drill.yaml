items:
  - { id: sr1, type: cloze, prompt: 'Static equilibrium requires $\sum F=____$.', answer: { expected: '0', expectedLatex: '0', aliases: [zero], media: [] }, explanation: 'Solution: $0$.\n\nWhy it works: There is no translational acceleration.', tags: [force] }
  - { id: sr2, type: cloze, prompt: 'Static equilibrium requires $\sum\tau=____$.', answer: { expected: '0', expectedLatex: '0', aliases: [zero], media: [] }, explanation: 'Solution: $0$.\n\nWhy it works: There is no angular acceleration.', tags: [torque] }
  - { id: sr3, type: typed, prompt: 'What force does a taut cable exert?', answer: { expected: tension, expectedLatex: 'T', aliases: [], media: [] }, explanation: 'Solution: Tension.\n\nWhy it works: A cable pulls along its length.', tags: [tension] }
  - { id: sr4, type: typed, prompt: 'What distance is used in a torque calculation?', answer: { expected: 'perpendicular lever arm', expectedLatex: 'r_\perp', aliases: [], media: [] }, explanation: 'Solution: Perpendicular lever arm.\n\nWhy it works: Torque uses shortest distance to force line of action.', tags: [torque] }
  - { id: sr5, type: cloze, prompt: 'A force through the pivot has ____ torque.', answer: { expected: zero, expectedLatex: '0', aliases: [], media: [] }, explanation: 'Solution: Zero.\n\nWhy it works: Its lever arm is zero.', tags: [pivot] }
