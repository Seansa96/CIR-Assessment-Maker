workedExamples:
- id: we-cd42c9
  title: 'Example Problem: Power of a Point'
  problem: Let's solve a standard problem involving Power of a Point.
  steps:
  - id: step-1
    title: State the Secant-Secant Theorem
    instruction: 'Identify the correct formula for the theorem.'
    type: multipleChoice
    prompt: |
      Which formula represents the correct relationship for two secants intersecting outside a circle?
    media:
    - src: "/media/geometry/circles/secant_secant.svg"
      type: "image"
      alt: "Circle with an external point P and two secants cutting through the circle. PA=4, AB=5, PC=3."
    choices:
    - id: choice-1
      text: '$PA \times PB = PC \times PD$'
    - id: choice-2
      text: '$PA \times AB = PC \times CD$'
    - id: choice-3
      text: '$PA + AB = PC + CD$'
    answer:
      choiceId: choice-1
      explanation: |
        The Power of a Point theorem for two secants states that the product of the external segment and the entire secant segment is constant for any secant drawn from point $P$. Thus, $PA \times PB = PC \times PD$.
