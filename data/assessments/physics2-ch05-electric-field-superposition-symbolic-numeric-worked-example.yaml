workedExamples:
- id: symbolic-three-charge-derivation
  title: Problem 1 — derive the scan's solution symbolically
  problem: |
    Three positive point charges sit at q1 (upper left), q2 (lower left), and q3 (lower right). Point P is directly above q3. The horizontal separation q2-to-q3 is a, the vertical separation q2-to-q1 is b, and q3-to-P is c. Derive the electric field at P, the force on a charge q4 placed at P, and the electric potential at P. Use the diagrams as a translation guide: every checkpoint asks you to make one piece of the derivation yourself.
  media:
    - path: /media/physics2/point-charge-superposition-geometry.svg
      alt: Geometry of q1, q2, q3, and P with distances a, b, and c.
    - path: /media/physics2/point-charge-superposition-angles.svg
      alt: Right triangles defining $\theta_2$ and $\theta_3$ from the positive x-axis.
    - path: /media/physics2/point-charge-superposition-components.svg
      alt: Electric-field vectors resolved into x and y components at P.
  steps:
  - id: symbolic-geometry
    title: Step 1 — translate the geometry into distances and signs
    instruction: 'Identify the quantities in this step: the horizontal and vertical displacements from each charge to P, the source-to-P distances r1, r2, r3, and the signs of the components. Use the geometry visual and the right-triangle relation before choosing.'
    hint: q1 is horizontally aligned with P; q2 has horizontal run a+c and rise b; q3 has horizontal run c and rise b. All source charges are positive.
    type: multipleChoice
    prompt: Which symbolic geometry map is correct?
    choices:
    - {id: a, text: '$r_1=a+c; r_2=\sqrt{(a+c)^2+b^2}; r_3=\sqrt{c^2+b^2}; q_2 and q_3 fields point right and up$', issueSignals: []}
    - {id: b, text: '$r_1=a+c; r_2=\sqrt{a^2+b^2}; r_3=\sqrt{c^2+b^2}; q_2 and q_3 fields point left and up$', issueSignals: [{id: use-a-not-a-plus-c, domains: [physics-2]}]}
    - {id: c, text: '$r_1=b; r_2=a+c+b; r_3=c+b; every field points away from P$', issueSignals: [{id: uses-path-lengths-and-reverses-source-direction, domains: [physics-2]}]}
    - {id: d, text: '$r_1=a+c; r_2=\sqrt{(a+c)^2+b^2}; r_3=\sqrt{c^2+b^2}; q_2 and q_3 fields point right and down$', issueSignals: [{id: vertical-sign-error, domains: [physics-2]}]}
    answer: {choiceId: a}
    media:
    - {type: image, src: /media/physics2/point-charge-superposition-geometry.svg, alt: Charge geometry and labeled distances a, b, and c, caption: Read the horizontal runs and vertical rises before writing field formulas.}
    explanation: |
      How to Solve: Read the displacement from each positive source charge toward P. The runs are a+c, a+c, and c; the rises are 0, b, and b. Therefore $r_1=a+c$, $r_2=\sqrt{(a+c)^2+b^2}$, and $r_3=\sqrt{c^2+b^2}$. The q2 and q3 contributions point right and up.
      Why it works: A distance is the length of the straight source-to-P segment, while the field from a positive charge points away from that charge.
      Why the other choices fail: b incorrectly omits the segment a for q2; c uses path lengths and reverses the direction; d reverses the vertical rise.
  - id: symbolic-q1-field
    title: Step 2 — derive the horizontal field from q1
    instruction: 'Use $r_1=a+c$ and $E_1=\frac{kq_1}{(a+c)^2}\hat{i}$; the positive source charge makes the field point in the positive $x$ direction.'
    hint: There is no right triangle here. q1 and P share a horizontal line, so the entire contribution is an x-component.
    type: multipleChoice
    prompt: Which expression is the complete vector contribution from q1?
    choices:
    - {id: a, text: '$E_1=\frac{kq_1}{(a+c)^2}\hat{i}$', issueSignals: []}
    - {id: b, text: '$E_1=\frac{kq_1}{a+c}\hat{i}$', issueSignals: [{id: inverse-distance-not-inverse-square, domains: [physics-2]}]}
    - {id: c, text: '$E_1=\frac{kq_1}{b^2}\hat{j}$', issueSignals: [{id: wrong-separation-and-axis, domains: [physics-2]}]}
    - {id: d, text: '$E_1=-\frac{kq_1}{(a+c)^2}\hat{i}$', issueSignals: [{id: positive-charge-direction-reversed, domains: [physics-2]}]}
    answer: {choiceId: a}
    media:
    - {type: image, src: /media/physics2/point-charge-superposition-angles.svg, alt: Right triangles defining $\theta_2$ and $\theta_3$, caption: The angle is measured from +x, so cosine gives the horizontal component.}
    explanation: |
      How to Solve: With $r_1=a+c$, E1=kq1/(a+c)^2 and the vector is E1 $\hat{i}$.
      Why it works: The point-charge field law supplies the inverse-square magnitude, and positive q1 sends the field from q1 toward P, which is +x.
      Why the other choices fail: b uses the potential's inverse-distance dependence; c uses the wrong axis and separation; d reverses the direction for a positive source.
  - id: symbolic-q2-components
    title: Step 3 — derive q2's distance, angle, and components
    instruction: 'Use $r_2=\sqrt{(a+c)^2+b^2}$, $\theta_2=\arctan\left(\frac{b}{a+c}\right)$, $E_2=\frac{kq_2}{r_2^2}$, $E_{2x}=E_2\cos\theta_2$, and $E_{2y}=E_2\sin\theta_2$.'
    hint: The angle is measured from +x, so the horizontal leg is adjacent and the vertical leg is opposite.
    type: multipleChoice
    prompt: Which symbolic set correctly resolves q2's contribution?
    choices:
    - {id: a, text: '$r_2=\sqrt{(a+c)^2+b^2}, \theta_2=\arctan\left(\frac{b}{a+c}\right), E_{2x}=E_2 \cos(\theta_2), E_{2y}=E_2 \sin(\theta_2)$', issueSignals: []}
    - {id: b, text: '$r_2=\sqrt{(a+c)^2+b^2}, \theta_2=\arctan\left(\frac{a+c}{b}\right), E_{2x}=E_2 \sin(\theta_2), E_{2y}=E_2 \cos(\theta_2)$', issueSignals: [{id: angle-reference-and-trig-swap, domains: [physics-2]}]}
    - {id: c, text: '$r_2=(a+c)+b, \theta_2=\arctan\left(\frac{b}{a+c}\right), E_{2x}=E_2 \cos(\theta_2), E_{2y}=E_2 \sin(\theta_2)$', issueSignals: [{id: adds-legs-for-distance, domains: [physics-2]}]}
    - {id: d, text: '$r_2=\sqrt{(a+c)^2+b^2}, \theta_2=\arctan\left(\frac{b}{a+c}\right), E_{2x}=-E_2 \cos(\theta_2), E_{2y}=E_2 \sin(\theta_2)$', issueSignals: [{id: horizontal-sign-error, domains: [physics-2]}]}
    answer: {choiceId: a}
    media:
    - {type: image, src: /media/physics2/point-charge-superposition-components.svg, alt: Field vectors resolved into x and y components, caption: Add matching basis components rather than adding vector magnitudes.}
    explanation: |
      How to Solve: The diagonal distance is $r_2=\sqrt{(a+c)^2+b^2}$. From +x, $\theta_2$=$\arctan\left(\frac{b}{a+c}\right)$; then E2x=E2 \cos(\theta_2) and E2y=E2 \sin(\theta_2), with E2=kq2/r2^2.
      Why it works: Cosine uses the adjacent horizontal leg, sine uses the opposite vertical leg, and q2 is positive so both components are positive.
      Why the other choices fail: b measures from the other axis and swaps projections; c adds legs instead of using the Pythagorean theorem; d reverses the positive x-component.
  - id: symbolic-q3-components
    title: Step 4 — derive q3's distance, angle, and components
    instruction: 'Use $r_3=\sqrt{c^2+b^2}$, $\theta_3=\arctan\left(\frac{b}{c}\right)$, $E_3=\frac{kq_3}{r_3^2}$, $E_{3x}=E_3\cos\theta_3$, and $E_{3y}=E_3\sin\theta_3$.'
    hint: q3's triangle is steeper because its horizontal leg is c, not a+c.
    type: multipleChoice
    prompt: Which symbolic set correctly resolves q3's contribution?
    choices:
    - {id: a, text: '$r_3=\sqrt{c^2+b^2}, \theta_3=\arctan\left(\frac{b}{c}\right), E_{3x}=E_3 \cos(\theta_3), E_{3y}=E_3 \sin(\theta_3)$', issueSignals: []}
    - {id: b, text: '$r_3=\sqrt{(a+c)^2+b^2}, \theta_3=\arctan\left(\frac{b}{a+c}\right), E_{3x}=E_3 \cos(\theta_3), E_{3y}=E_3 \sin(\theta_3)$', issueSignals: [{id: reuses-q2-triangle, domains: [physics-2]}]}
    - {id: c, text: '$r_3=\sqrt{c^2+b^2}, \theta_3=\arctan(c/b), E_{3x}=E_3 \sin(\theta_3), E_{3y}=E_3 \cos(\theta_3)$', issueSignals: [{id: angle-reference-and-trig-swap, domains: [physics-2]}]}
    - {id: d, text: '$r_3=\sqrt{c^2+b^2}, \theta_3=\arctan\left(\frac{b}{c}\right), E_{3x}=-E_3 \cos(\theta_3), E_{3y}=E_3 \sin(\theta_3)$', issueSignals: [{id: positive-x-sign-error, domains: [physics-2]}]}
    answer: {choiceId: a}
    media:
    - {type: image, src: /media/physics2/point-charge-superposition-geometry.svg, alt: Numerical charge geometry, caption: Substitute the numerical lengths into the same geometric relationships.}
    explanation: |
      How to Solve: q3 is c horizontally and b vertically from P, so $r_3=\sqrt{c^2+b^2}$ and $\theta_3$=$\arctan\left(\frac{b}{c}\right)$. Thus E3x=E3 \cos(\theta_3), E3y=E3 \sin(\theta_3), where E3=kq3/r3^2.
      Why it works: The shorter horizontal run makes the triangle steeper, but the angle is still measured from +x.
      Why the other choices fail: b imports q2's longer run; c measures from vertical and swaps projections; d gives a negative x-component despite q3 being positive and left of P.
  - id: symbolic-vector-sum
    title: Step 5 — add the field vectors by components
    instruction: 'Add vector components: $\vec E_P=(E_1+E_{2x}+E_{3x})\hat{i}+(E_{2y}+E_{3y})\hat{j}$.'
    hint: E1 contributes only to x. Do not add field magnitudes or angles directly.
    type: multipleChoice
    prompt: Which expression is the electric field vector at P?
    choices:
    - {id: a, text: '$E_P=(E_1+E_2 \cos(\theta_2)+E_3 \cos(\theta_3)) \hat{i} + (E_2 \sin(\theta_2)+E_3 \sin(\theta_3)) \hat{j}$', issueSignals: []}
    - {id: b, text: '$E_P=(E_1+E_2+E_3) \hat{i}$', issueSignals: [{id: adds-magnitudes-only, domains: [physics-2]}]}
    - {id: c, text: '$E_P=(E_1+E_2 \sin(\theta_2)+E_3 \sin(\theta_3)) \hat{i} + (E_2 \cos(\theta_2)+E_3 \cos(\theta_3)) \hat{j}$', issueSignals: [{id: swaps-component-projections, domains: [physics-2]}]}
    - {id: d, text: '$E_P=(E_1-E_2 \cos(\theta_2)-E_3 \cos(\theta_3)) \hat{i} + (E_2 \sin(\theta_2)-E_3 \sin(\theta_3)) \hat{j}$', issueSignals: [{id: subtracts-contributions-without-direction-basis, domains: [physics-2]}]}
    answer: {choiceId: a}
    media:
    - {type: image, src: /media/physics2/point-charge-superposition-components.svg, alt: Numerical resultant component axes, caption: The positive component totals place the field above and to the right.}
    explanation: |
      How to Solve: EP=(E1+E2x+E3x)$\hat{i}$+(E2y+E3y)$\hat{j}$, so EP=(E1+E2 \cos(\theta_2)+E3 \cos(\theta_3))$\hat{i}$+(E2 \sin(\theta_2)+E3 \sin(\theta_3))$\hat{j}$.
      Why it works: Superposition is vector addition, and the basis components can be added independently.
      Why the other choices fail: b discards the y-components; c swaps adjacent and opposite projections; d subtracts positive contributions without a geometric reason.
  - id: symbolic-force-potential
    title: Step 6 — finish with force and potential
    instruction: 'Use $\vec F_4=q_4\vec E_P$ for force and $V_P=\sum_i\frac{kq_i}{r_i}$ for potential; keep the vector and scalar quantities separate.'
    hint: Force inherits the direction of EP only when q4 is positive. Potential has no $\hat{i}$ or $\hat{j}$.
    type: multipleChoice
    prompt: Which pair correctly completes parts (b) and (c)?
    choices:
    - {id: a, text: '$F_4=q_4 E_P; V_P=\frac{kq_1}{a+c}+\frac{kq_2}{\sqrt{(a+c)^2+b^2}}+\frac{kq_3}{\sqrt{c^2+b^2}}$', issueSignals: []}
    - {id: b, text: '$F_4=q_4 E_P; V_P=kq_1/(a+c)^2+kq_2/((a+c)^2+b^2)+kq_3/(c^2+b^2)$', issueSignals: [{id: uses-field-law-for-potential, domains: [physics-2]}]}
    - {id: c, text: '$F_4=q_4 |E_P|; V_P is a vector with \hat{i} and \hat{j} components$', issueSignals: [{id: loses-force-direction-and-vector-scalar-distinction, domains: [physics-2]}]}
    - {id: d, text: '$F_4=E_P/q_4; V_P=k(q_1+q_2+q_3)/(a+c)$', issueSignals: [{id: divides-instead-of-multiplies-and-uses-one-distance, domains: [physics-2]}]}
    answer: {choiceId: a}
    explanation: |
      How to Solve: F4=q4 EP. The scalar potential is $V_P=\frac{kq_1}{a+c}+\frac{kq_2}{\sqrt{(a+c)^2+b^2}}+\frac{kq_3}{\sqrt{c^2+b^2}}$.
      Why it works: Electric force is charge times the vector field, while potential is the scalar sum of kq/r for each source.
      Why the other choices fail: b uses inverse-square field terms for potential; c discards force direction and makes a scalar into a vector; d divides by q4 and assigns one distance to all sources.
- id: numerical-three-charge-follow-up
  title: Problem 2 — apply the derivation with numbers
  problem: |
    Now use $a=0.300\,\mathrm{m}$, $b=0.400\,\mathrm{m}$, $c=0.200\,\mathrm{m}$, $q_1=+2.00\,\mathrm{nC}$, $q_2=+3.00\,\mathrm{nC}$, $q_3=+4.00\,\mathrm{nC}$, $q_4=-5.00\,\mathrm{nC}$, and $k=8.99\times10^9\,\mathrm{N\,m^2/C^2}$. Calculate the distances, field magnitudes, angles, components, resultant field, force, and potential. Keep extra digits until the final step.
  media:
    - path: /media/physics2/point-charge-superposition-geometry.svg
      alt: Geometry used for the numerical substitution.
    - path: /media/physics2/point-charge-superposition-components.svg
      alt: Component axes used for the numerical resultant.
  steps:
  - id: numeric-distances
    title: Step 1 — calculate the source-to-P distances
    instruction: 'Use $r_1=a+c$, $r_2=\sqrt{(a+c)^2+b^2}$, and $r_3=\sqrt{c^2+b^2}$. Substitute the SI lengths and calculate all three source-to-point distances.'
    hint: First find $a+c=0.500\,\mathrm{m}$, then use the Pythagorean theorem for the two diagonal paths.
    type: multipleChoice
    prompt: Which set of distances is correct?
    choices:
    - {id: a, text: '$r_1=0.500\,\mathrm{m},\;r_2=0.640\,\mathrm{m},\;r_3=0.447\,\mathrm{m}$', issueSignals: []}
    - {id: b, text: '$r_1=0.500\,\mathrm{m},\;r_2=0.700\,\mathrm{m},\;r_3=0.600\,\mathrm{m}$', issueSignals: [{id: adds-legs-for-diagonal-distance, domains: [physics-2]}]}
    - {id: c, text: '$r_1=0.300\,\mathrm{m},\;r_2=0.500\,\mathrm{m},\;r_3=0.200\,\mathrm{m}$', issueSignals: [{id: uses-horizontal-legs-as-all-distances, domains: [physics-2]}]}
    - {id: d, text: '$r_1=0.700\,\mathrm{m},\;r_2=0.860\,\mathrm{m},\;r_3=0.600\,\mathrm{m}$', issueSignals: [{id: adds-all-given-lengths, domains: [physics-2]}]}
    answer: {choiceId: a}
    explanation: |
      How to Solve: a+c=0.500 m, r1=0.500 m, r2=$\sqrt{0.500^2+0.400^2}$=0.640 m, and r3=$\sqrt{0.200^2+0.400^2}$=0.447 m.
      Why it works: Diagonal distances come from the Pythagorean theorem.
      Why the other choices fail: b and d add legs instead of taking the square root of squared legs; c treats horizontal projections as full distances.
  - id: numeric-magnitudes
    title: Step 2 — calculate E1, E2, and E3 magnitudes
    instruction: 'Use $E_i=\frac{k|q_i|}{r_i^2}$ for each source, converting each charge from nanocoulombs to coulombs first.'
    hint: Convert nC to C before substituting, and use each source charge with its own distance $r_i$.
    type: multipleChoice
    prompt: Which set of field magnitudes is closest?
    choices:
    - {id: a, text: '$E_1=71.9\,\mathrm{N/C},\;E_2=65.8\,\mathrm{N/C},\;E_3=179.8\,\mathrm{N/C}$', issueSignals: []}
    - {id: b, text: '$E_1=35.9\,\mathrm{N/C},\;E_2=42.1\,\mathrm{N/C},\;E_3=80.4\,\mathrm{N/C}$', issueSignals: [{id: uses-potential-like-inverse-distance, domains: [physics-2]}]}
    - {id: c, text: '$E_1=143.8\,\mathrm{N/C},\;E_2=131.6\,\mathrm{N/C},\;E_3=359.6\,\mathrm{N/C}$', issueSignals: [{id: doubles-field-values, domains: [physics-2]}]}
    - {id: d, text: '$E_1=71.9\,\mathrm{N/C},\;E_2=80.4\,\mathrm{N/C},\;E_3=65.8\,\mathrm{N/C}$', issueSignals: [{id: assigns-magnitudes-to-wrong-charges, domains: [physics-2]}]}
    answer: {choiceId: a}
    explanation: |
      How to Solve: E1=8.99e9(2.00e-9)/(0.500)^2=71.9 N/C; E2=8.99e9(3.00e-9)/(0.640)^2=65.8 N/C; E3=8.99e9(4.00e-9)/(0.447)^2=179.8 N/C.
      Why it works: Each magnitude uses its own source charge and source-to-P distance.
      Why the other choices fail: b uses kq/r, c doubles every result, and d attaches the right numbers to the wrong distances.
  - id: numeric-angles
    title: Step 3 — calculate $\theta_2$ and $\theta_3$
    instruction: 'Use $\theta_2=\arctan\left(\frac{b}{a+c}\right)$ and $\theta_3=\arctan\left(\frac{b}{c}\right)$, with both angles measured from the positive $x$-axis.'
    hint: For $q_3$, $b/c=0.400/0.200=2$, so its triangle is steeper and its angle is larger.
    type: multipleChoice
    prompt: Which angle pair is correct?
    choices:
    - {id: a, text: '$\theta_2=38.7 degrees and \theta_3=63.4 degrees$', issueSignals: []}
    - {id: b, text: '$\theta_2=51.3 degrees and \theta_3=26.6 degrees$', issueSignals: [{id: measures-from-vertical-or-inverts-ratio, domains: [physics-2]}]}
    - {id: c, text: '$\theta_2=38.7 degrees and \theta_3=26.6 degrees$', issueSignals: [{id: uses-a-plus-c-for-q3, domains: [physics-2]}]}
    - {id: d, text: '$\theta_2=63.4 degrees and \theta_3=38.7 degrees$', issueSignals: [{id: swaps-charge-angle-labels, domains: [physics-2]}]}
    answer: {choiceId: a}
    explanation: |
      How to Solve: $\theta_2$=$\arctan(0.400/0.500)$=38.7 degrees and $\theta_3$=$\arctan(0.400/0.200)$=63.4 degrees.
      Why it works: Both angles are measured from +x, and the smaller horizontal run produces the steeper q3 triangle.
      Why the other choices fail: b uses complementary/inverted ratios; c uses q2's run for q3; d swaps the two calculated angles.
  - id: numeric-components
    title: Step 4 — resolve E2 and E3 into components
    instruction: 'Resolve the diagonal fields with $E_{2x}=E_2\cos\theta_2$, $E_{2y}=E_2\sin\theta_2$, $E_{3x}=E_3\cos\theta_3$, and $E_{3y}=E_3\sin\theta_3$.'
    hint: Since both fields point right and up, all four components are positive; each component must be no larger than its parent magnitude.
    type: multipleChoice
    prompt: Which component set is closest?
    choices:
    - {id: a, text: '$E_{2x}=61.1,\;E_{2y}=24.4,\;E_{3x}=80.4,\;E_{3y}=160.8\,\mathrm{N/C}$', issueSignals: []}
    - {id: b, text: '$E_{2x}=24.4,\;E_{2y}=61.1,\;E_{3x}=160.8,\;E_{3y}=80.4\,\mathrm{N/C}$', issueSignals: [{id: swaps-sine-and-cosine-numerically, domains: [physics-2]}]}
    - {id: c, text: '$E_{2x}=65.8,\;E_{2y}=65.8,\;E_{3x}=179.8,\;E_{3y}=179.8\,\mathrm{N/C}$', issueSignals: [{id: copies-magnitude-into-components, domains: [physics-2]}]}
    - {id: d, text: '$E_{2x}=-61.1,\;E_{2y}=24.4,\;E_{3x}=-80.4,\;E_{3y}=160.8\,\mathrm{N/C}$', issueSignals: [{id: reverses-positive-x-components, domains: [physics-2]}]}
    answer: {choiceId: a}
    explanation: |
      How to Solve: E2x=65.8 cos(38.7)=61.1 N/C, E2y=65.8 sin(38.7)=24.4 N/C, E3x=179.8 cos(63.4)=80.4 N/C, and E3y=179.8 sin(63.4)=160.8 N/C.
      Why it works: From +x, cosine gives the adjacent x-component and sine gives the opposite y-component.
      Why the other choices fail: b swaps projections, c ignores the angle, and d reverses x even though both positive sources lie left of P.
  - id: numeric-resultant
    title: Step 5 — find the resultant field and its direction
    instruction: 'Add components to get $E_{P,x}=E_{1}+E_{2x}+E_{3x}$ and $E_{P,y}=E_{2y}+E_{3y}$, then use $|E_P|=\sqrt{E_{P,x}^2+E_{P,y}^2}$ and $\theta_P=\arctan(E_{P,y}/E_{P,x})$.'
    hint: Before rounding, $E_{P,x}=213.4\,\mathrm{N/C}$ and $E_{P,y}=185.2\,\mathrm{N/C}$; both are positive, so the direction is above $+x$.
    type: multipleChoice
    prompt: Which resultant is closest?
    choices:
    - {id: a, text: '$|E_P|=282.6 N/C at 41.0 degrees above +x$', issueSignals: []}
    - {id: b, text: '$|E_P|=398.6 N/C at 49.0 degrees above +x$', issueSignals: [{id: adds-components-as-magnitudes, domains: [physics-2]}]}
    - {id: c, text: '$|E_P|=282.6 N/C at 49.0 degrees below +x$', issueSignals: [{id: uses-complement-or-wrong-quadrant, domains: [physics-2]}]}
    - {id: d, text: '$|E_P|=213.4 N/C at 40.0 degrees above +x$', issueSignals: [{id: reports-x-component-as-magnitude, domains: [physics-2]}]}
    answer: {choiceId: a}
    explanation: |
      How to Solve: EPx=71.9+61.1+80.4=213.4 N/C and EPy=24.4+160.8=185.2 N/C. Therefore $|E_P|=\sqrt{213.4^2+185.2^2}=282.6\,\mathrm{N/C}$ and $\theta_P$=$\arctan(185.2/213.4)$=41.0 degrees above +x.
      Why it works: The resultant is built from perpendicular component totals, then its direction comes from the ratio y/x.
      Why the other choices fail: b adds component magnitudes; c gives the wrong vertical direction; d reports only the x-component as the total magnitude.
