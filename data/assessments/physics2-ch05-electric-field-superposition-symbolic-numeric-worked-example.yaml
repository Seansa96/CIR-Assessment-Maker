workedExamples:
- id: symbolic-three-charge-derivation
  title: Problem 1 — derive the scan's solution symbolically
  problem: |
    Three positive point charges sit at q1 (upper left), q2 (lower left), and q3 (lower right). Point P is directly above q3. The horizontal separation q2-to-q3 is a, the vertical separation q2-to-q1 is b, and q3-to-P is c. Derive the electric field at P, the force on a charge q4 placed at P, and the electric potential at P. Use the diagrams as a translation guide: every checkpoint asks you to make one piece of the derivation yourself.
  media:
    - path: /media/physics2/point-charge-superposition-geometry.svg
      alt: Geometry of q1, q2, q3, and P with distances a, b, and c.
    - path: /media/physics2/point-charge-superposition-angles.svg
      alt: Right triangles defining theta2 and theta3 from the positive x-axis.
    - path: /media/physics2/point-charge-superposition-components.svg
      alt: Electric-field vectors resolved into x and y components at P.
  steps:
  - id: symbolic-geometry
    title: Step 1 — translate the geometry into distances and signs
    instruction: 'Identify the quantities in this step: the horizontal and vertical displacements from each charge to P, the source-to-P distances r1, r2, r3, and the signs of the components. Use the geometry visual and the right-triangle relation before choosing.'
    hint: q1 is horizontally aligned with P; q2 has horizontal run a+c and rise b; q3 has horizontal run c and rise b. All source charges are positive.
    type: multipleChoice
    prompt: Which symbolic geometry map is correct?
    choices:
    - {id: a, text: 'r1=a+c; r2=sqrt((a+c)^2+b^2); r3=sqrt(c^2+b^2); q2 and q3 fields point right and up', issueSignals: []}
    - {id: b, text: 'r1=a+c; r2=sqrt(a^2+b^2); r3=sqrt(c^2+b^2); q2 and q3 fields point left and up', issueSignals: [{id: use-a-not-a-plus-c, domains: [physics-2]}]}
    - {id: c, text: 'r1=b; r2=a+c+b; r3=c+b; every field points away from P', issueSignals: [{id: uses-path-lengths-and-reverses-source-direction, domains: [physics-2]}]}
    - {id: d, text: 'r1=a+c; r2=sqrt((a+c)^2+b^2); r3=sqrt(c^2+b^2); q2 and q3 fields point right and down', issueSignals: [{id: vertical-sign-error, domains: [physics-2]}]}
    answer: {choiceId: a}
    media:
    - {type: image, src: /media/physics2/point-charge-superposition-geometry.svg, alt: Charge geometry and labeled distances a, b, and c, caption: Read the horizontal runs and vertical rises before writing field formulas.}
    explanation: |
      Solution: Read the displacement from each positive source charge toward P. The runs are a+c, a+c, and c; the rises are 0, b, and b. Therefore r1=a+c, r2=sqrt((a+c)^2+b^2), and r3=sqrt(c^2+b^2). The q2 and q3 contributions point right and up.
      Why it works: A distance is the length of the straight source-to-P segment, while the field from a positive charge points away from that charge.
      Why the other choices fail: b incorrectly omits the segment a for q2; c uses path lengths and reverses the direction; d reverses the vertical rise.
  - id: symbolic-q1-field
    title: Step 2 — derive the horizontal field from q1
    instruction: 'Quantities for this step: q1, k, r1=a+c, and the unit direction i-hat. Apply the point-charge field magnitude E=k|q|/r^2, then attach the direction.'
    hint: There is no right triangle here. q1 and P share a horizontal line, so the entire contribution is an x-component.
    type: multipleChoice
    prompt: Which expression is the complete vector contribution from q1?
    choices:
    - {id: a, text: 'E1 = k q1/(a+c)^2 i-hat', issueSignals: []}
    - {id: b, text: 'E1 = k q1/(a+c) i-hat', issueSignals: [{id: inverse-distance-not-inverse-square, domains: [physics-2]}]}
    - {id: c, text: 'E1 = k q1/b^2 j-hat', issueSignals: [{id: wrong-separation-and-axis, domains: [physics-2]}]}
    - {id: d, text: 'E1 = -k q1/(a+c)^2 i-hat', issueSignals: [{id: positive-charge-direction-reversed, domains: [physics-2]}]}
    answer: {choiceId: a}
    media:
    - {type: image, src: /media/physics2/point-charge-superposition-angles.svg, alt: Right triangles defining theta2 and theta3, caption: The angle is measured from +x, so cosine gives the horizontal component.}
    explanation: |
      Solution: With r1=a+c, E1=kq1/(a+c)^2 and the vector is E1 i-hat.
      Why it works: The point-charge field law supplies the inverse-square magnitude, and positive q1 sends the field from q1 toward P, which is +x.
      Why the other choices fail: b uses the potential's inverse-distance dependence; c uses the wrong axis and separation; d reverses the direction for a positive source.
  - id: symbolic-q2-components
    title: Step 3 — derive q2's distance, angle, and components
    instruction: 'Quantities for this step: q2, k, horizontal leg a+c, vertical leg b, r2, theta2, E2, E2x, and E2y. Use tan(theta2)=b/(a+c), E2=kq2/r2^2, E2x=E2 cos(theta2), and E2y=E2 sin(theta2).'
    hint: The angle is measured from +x, so the horizontal leg is adjacent and the vertical leg is opposite.
    type: multipleChoice
    prompt: Which symbolic set correctly resolves q2's contribution?
    choices:
    - {id: a, text: 'r2=sqrt((a+c)^2+b^2), theta2=atan(b/(a+c)), E2x=E2 cos(theta2), E2y=E2 sin(theta2)', issueSignals: []}
    - {id: b, text: 'r2=sqrt((a+c)^2+b^2), theta2=atan((a+c)/b), E2x=E2 sin(theta2), E2y=E2 cos(theta2)', issueSignals: [{id: angle-reference-and-trig-swap, domains: [physics-2]}]}
    - {id: c, text: 'r2=(a+c)+b, theta2=atan(b/(a+c)), E2x=E2 cos(theta2), E2y=E2 sin(theta2)', issueSignals: [{id: adds-legs-for-distance, domains: [physics-2]}]}
    - {id: d, text: 'r2=sqrt((a+c)^2+b^2), theta2=atan(b/(a+c)), E2x=-E2 cos(theta2), E2y=E2 sin(theta2)', issueSignals: [{id: horizontal-sign-error, domains: [physics-2]}]}
    answer: {choiceId: a}
    media:
    - {type: image, src: /media/physics2/point-charge-superposition-components.svg, alt: Field vectors resolved into x and y components, caption: Add matching basis components rather than adding vector magnitudes.}
    explanation: |
      Solution: The diagonal distance is r2=sqrt((a+c)^2+b^2). From +x, theta2=atan(b/(a+c)); then E2x=E2 cos(theta2) and E2y=E2 sin(theta2), with E2=kq2/r2^2.
      Why it works: Cosine uses the adjacent horizontal leg, sine uses the opposite vertical leg, and q2 is positive so both components are positive.
      Why the other choices fail: b measures from the other axis and swaps projections; c adds legs instead of using the Pythagorean theorem; d reverses the positive x-component.
  - id: symbolic-q3-components
    title: Step 4 — derive q3's distance, angle, and components
    instruction: 'Quantities for this step: q3, k, horizontal leg c, vertical leg b, r3, theta3, E3, E3x, and E3y. Use tan(theta3)=b/c and the same projection formulas as Step 3.'
    hint: q3's triangle is steeper because its horizontal leg is c, not a+c.
    type: multipleChoice
    prompt: Which symbolic set correctly resolves q3's contribution?
    choices:
    - {id: a, text: 'r3=sqrt(c^2+b^2), theta3=atan(b/c), E3x=E3 cos(theta3), E3y=E3 sin(theta3)', issueSignals: []}
    - {id: b, text: 'r3=sqrt((a+c)^2+b^2), theta3=atan(b/(a+c)), E3x=E3 cos(theta3), E3y=E3 sin(theta3)', issueSignals: [{id: reuses-q2-triangle, domains: [physics-2]}]}
    - {id: c, text: 'r3=sqrt(c^2+b^2), theta3=atan(c/b), E3x=E3 sin(theta3), E3y=E3 cos(theta3)', issueSignals: [{id: angle-reference-and-trig-swap, domains: [physics-2]}]}
    - {id: d, text: 'r3=sqrt(c^2+b^2), theta3=atan(b/c), E3x=-E3 cos(theta3), E3y=E3 sin(theta3)', issueSignals: [{id: positive-x-sign-error, domains: [physics-2]}]}
    answer: {choiceId: a}
    media:
    - {type: image, src: /media/physics2/point-charge-superposition-geometry.svg, alt: Numerical charge geometry, caption: Substitute the numerical lengths into the same geometric relationships.}
    explanation: |
      Solution: q3 is c horizontally and b vertically from P, so r3=sqrt(c^2+b^2) and theta3=atan(b/c). Thus E3x=E3 cos(theta3), E3y=E3 sin(theta3), where E3=kq3/r3^2.
      Why it works: The shorter horizontal run makes the triangle steeper, but the angle is still measured from +x.
      Why the other choices fail: b imports q2's longer run; c measures from vertical and swaps projections; d gives a negative x-component despite q3 being positive and left of P.
  - id: symbolic-vector-sum
    title: Step 5 — add the field vectors by components
    instruction: 'Quantities for this step: E1, E2x, E2y, E3x, and E3y. Group all i-hat terms into EPx and all j-hat terms into EPy; then substitute the cosine/sine forms.'
    hint: E1 contributes only to x. Do not add field magnitudes or angles directly.
    type: multipleChoice
    prompt: Which expression is the electric field vector at P?
    choices:
    - {id: a, text: 'EP=(E1+E2 cos(theta2)+E3 cos(theta3)) i-hat + (E2 sin(theta2)+E3 sin(theta3)) j-hat', issueSignals: []}
    - {id: b, text: 'EP=(E1+E2+E3) i-hat', issueSignals: [{id: adds-magnitudes-only, domains: [physics-2]}]}
    - {id: c, text: 'EP=(E1+E2 sin(theta2)+E3 sin(theta3)) i-hat + (E2 cos(theta2)+E3 cos(theta3)) j-hat', issueSignals: [{id: swaps-component-projections, domains: [physics-2]}]}
    - {id: d, text: 'EP=(E1-E2 cos(theta2)-E3 cos(theta3)) i-hat + (E2 sin(theta2)-E3 sin(theta3)) j-hat', issueSignals: [{id: subtracts-contributions-without-direction-basis, domains: [physics-2]}]}
    answer: {choiceId: a}
    media:
    - {type: image, src: /media/physics2/point-charge-superposition-components.svg, alt: Numerical resultant component axes, caption: The positive component totals place the field above and to the right.}
    explanation: |
      Solution: EP=(E1+E2x+E3x)i-hat+(E2y+E3y)j-hat, so EP=(E1+E2 cos(theta2)+E3 cos(theta3))i-hat+(E2 sin(theta2)+E3 sin(theta3))j-hat.
      Why it works: Superposition is vector addition, and the basis components can be added independently.
      Why the other choices fail: b discards the y-components; c swaps adjacent and opposite projections; d subtracts positive contributions without a geometric reason.
  - id: symbolic-force-potential
    title: Step 6 — finish with force and potential
    instruction: 'Quantities for this step: q4 and vector EP for force; k, q1, q2, q3, r1, r2, and r3 for potential. Use F4=q4 EP and V_P=sum(kqi/ri). Keep the vector quantity and scalar quantity separate.'
    hint: Force inherits the direction of EP only when q4 is positive. Potential has no i-hat or j-hat.
    type: multipleChoice
    prompt: Which pair correctly completes parts (b) and (c)?
    choices:
    - {id: a, text: 'F4=q4 EP; VP=kq1/(a+c)+kq2/sqrt((a+c)^2+b^2)+kq3/sqrt(c^2+b^2)', issueSignals: []}
    - {id: b, text: 'F4=q4 EP; VP=kq1/(a+c)^2+kq2/((a+c)^2+b^2)+kq3/(c^2+b^2)', issueSignals: [{id: uses-field-law-for-potential, domains: [physics-2]}]}
    - {id: c, text: 'F4=q4 |EP|; VP is a vector with i-hat and j-hat components', issueSignals: [{id: loses-force-direction-and-vector-scalar-distinction, domains: [physics-2]}]}
    - {id: d, text: 'F4=EP/q4; VP=k(q1+q2+q3)/(a+c)', issueSignals: [{id: divides-instead-of-multiplies-and-uses-one-distance, domains: [physics-2]}]}
    answer: {choiceId: a}
    explanation: |
      Solution: F4=q4 EP. The scalar potential is VP=kq1/(a+c)+kq2/sqrt((a+c)^2+b^2)+kq3/sqrt(c^2+b^2).
      Why it works: Electric force is charge times the vector field, while potential is the scalar sum of kq/r for each source.
      Why the other choices fail: b uses inverse-square field terms for potential; c discards force direction and makes a scalar into a vector; d divides by q4 and assigns one distance to all sources.
- id: numerical-three-charge-follow-up
  title: Problem 2 — apply the derivation with numbers
  problem: |
    Now use a=0.300 m, b=0.400 m, c=0.200 m, q1=+2.00 nC, q2=+3.00 nC, q3=+4.00 nC, q4=-5.00 nC, and k=8.99e9 N m^2/C^2. Calculate the distances, field magnitudes, angles, components, resultant field, force, and potential. Keep extra digits until the final step.
  media:
    - path: /media/physics2/point-charge-superposition-geometry.svg
      alt: Geometry used for the numerical substitution.
    - path: /media/physics2/point-charge-superposition-components.svg
      alt: Component axes used for the numerical resultant.
  steps:
  - id: numeric-distances
    title: Step 1 — calculate the source-to-P distances
    instruction: 'Quantities: a, b, c, r1=a+c, r2=sqrt((a+c)^2+b^2), and r3=sqrt(c^2+b^2). Substitute SI lengths and calculate the three distances.'
    hint: First find a+c=0.500 m, then use the square root only for the diagonal paths.
    type: multipleChoice
    prompt: Which set of distances is correct?
    choices:
    - {id: a, text: 'r1=0.500 m, r2=0.640 m, r3=0.447 m', issueSignals: []}
    - {id: b, text: 'r1=0.500 m, r2=0.700 m, r3=0.600 m', issueSignals: [{id: adds-legs-for-diagonal-distance, domains: [physics-2]}]}
    - {id: c, text: 'r1=0.300 m, r2=0.500 m, r3=0.200 m', issueSignals: [{id: uses-horizontal-legs-as-all-distances, domains: [physics-2]}]}
    - {id: d, text: 'r1=0.700 m, r2=0.860 m, r3=0.600 m', issueSignals: [{id: adds-all-given-lengths, domains: [physics-2]}]}
    answer: {choiceId: a}
    explanation: |
      Solution: a+c=0.500 m, r1=0.500 m, r2=sqrt(0.500^2+0.400^2)=0.640 m, and r3=sqrt(0.200^2+0.400^2)=0.447 m.
      Why it works: Diagonal distances come from the Pythagorean theorem.
      Why the other choices fail: b and d add legs instead of taking the square root of squared legs; c treats horizontal projections as full distances.
  - id: numeric-magnitudes
    title: Step 2 — calculate E1, E2, and E3 magnitudes
    instruction: 'Quantities: k, q1=2.00e-9 C, q2=3.00e-9 C, q3=4.00e-9 C, and the three distances. Use E=k|q|/r^2 for each source.'
    hint: Convert nC to C before substituting; use each charge's own r.
    type: multipleChoice
    prompt: Which set of field magnitudes is closest?
    choices:
    - {id: a, text: 'E1=71.9 N/C, E2=65.8 N/C, E3=179.8 N/C', issueSignals: []}
    - {id: b, text: 'E1=35.9 N/C, E2=42.1 N/C, E3=80.4 N/C', issueSignals: [{id: uses-potential-like-inverse-distance, domains: [physics-2]}]}
    - {id: c, text: 'E1=143.8 N/C, E2=131.6 N/C, E3=359.6 N/C', issueSignals: [{id: doubles-field-values, domains: [physics-2]}]}
    - {id: d, text: 'E1=71.9 N/C, E2=80.4 N/C, E3=65.8 N/C', issueSignals: [{id: assigns-magnitudes-to-wrong-charges, domains: [physics-2]}]}
    answer: {choiceId: a}
    explanation: |
      Solution: E1=8.99e9(2.00e-9)/(0.500)^2=71.9 N/C; E2=8.99e9(3.00e-9)/(0.640)^2=65.8 N/C; E3=8.99e9(4.00e-9)/(0.447)^2=179.8 N/C.
      Why it works: Each magnitude uses its own source charge and source-to-P distance.
      Why the other choices fail: b uses kq/r, c doubles every result, and d attaches the right numbers to the wrong distances.
  - id: numeric-angles
    title: Step 3 — calculate theta2 and theta3
    instruction: 'Quantities: b=0.400 m, a+c=0.500 m, c=0.200 m, and the angles measured from +x. Use theta2=atan(b/(a+c)) and theta3=atan(b/c).'
    hint: The q3 triangle has ratio 0.400/0.200=2, so it must be steeper and have the larger angle.
    type: multipleChoice
    prompt: Which angle pair is correct?
    choices:
    - {id: a, text: 'theta2=38.7 degrees and theta3=63.4 degrees', issueSignals: []}
    - {id: b, text: 'theta2=51.3 degrees and theta3=26.6 degrees', issueSignals: [{id: measures-from-vertical-or-inverts-ratio, domains: [physics-2]}]}
    - {id: c, text: 'theta2=38.7 degrees and theta3=26.6 degrees', issueSignals: [{id: uses-a-plus-c-for-q3, domains: [physics-2]}]}
    - {id: d, text: 'theta2=63.4 degrees and theta3=38.7 degrees', issueSignals: [{id: swaps-charge-angle-labels, domains: [physics-2]}]}
    answer: {choiceId: a}
    explanation: |
      Solution: theta2=atan(0.400/0.500)=38.7 degrees and theta3=atan(0.400/0.200)=63.4 degrees.
      Why it works: Both angles are measured from +x, and the smaller horizontal run produces the steeper q3 triangle.
      Why the other choices fail: b uses complementary/inverted ratios; c uses q2's run for q3; d swaps the two calculated angles.
  - id: numeric-components
    title: Step 4 — resolve E2 and E3 into components
    instruction: 'Quantities: E2=65.8 N/C, E3=179.8 N/C, theta2=38.7 degrees, and theta3=63.4 degrees. Calculate E2x=E2 cos(theta2), E2y=E2 sin(theta2), E3x=E3 cos(theta3), and E3y=E3 sin(theta3).'
    hint: Since both fields point right and up, all four components are positive; each component must be no larger than its parent magnitude.
    type: multipleChoice
    prompt: Which component set is closest?
    choices:
    - {id: a, text: 'E2x=61.1, E2y=24.4, E3x=80.4, E3y=160.8 N/C', issueSignals: []}
    - {id: b, text: 'E2x=24.4, E2y=61.1, E3x=160.8, E3y=80.4 N/C', issueSignals: [{id: swaps-sine-and-cosine-numerically, domains: [physics-2]}]}
    - {id: c, text: 'E2x=65.8, E2y=65.8, E3x=179.8, E3y=179.8 N/C', issueSignals: [{id: copies-magnitude-into-components, domains: [physics-2]}]}
    - {id: d, text: 'E2x=-61.1, E2y=24.4, E3x=-80.4, E3y=160.8 N/C', issueSignals: [{id: reverses-positive-x-components, domains: [physics-2]}]}
    answer: {choiceId: a}
    explanation: |
      Solution: E2x=65.8 cos(38.7)=61.1 N/C, E2y=65.8 sin(38.7)=24.4 N/C, E3x=179.8 cos(63.4)=80.4 N/C, and E3y=179.8 sin(63.4)=160.8 N/C.
      Why it works: From +x, cosine gives the adjacent x-component and sine gives the opposite y-component.
      Why the other choices fail: b swaps projections, c ignores the angle, and d reverses x even though both positive sources lie left of P.
  - id: numeric-resultant
    title: Step 5 — find the resultant field and its direction
    instruction: 'Quantities: E1=71.9 N/C, E2x=61.1 N/C, E3x=80.4 N/C, E2y=24.4 N/C, and E3y=160.8 N/C. First calculate EPx and EPy, then |EP|=sqrt(EPx^2+EPy^2) and thetaP=atan(EPy/EPx).'
    hint: EPx=213.4 N/C and EPy=185.2 N/C before rounding. Both are positive, so the angle is above +x.
    type: multipleChoice
    prompt: Which resultant is closest?
    choices:
    - {id: a, text: '|EP|=282.6 N/C at 41.0 degrees above +x', issueSignals: []}
    - {id: b, text: '|EP|=398.6 N/C at 49.0 degrees above +x', issueSignals: [{id: adds-components-as-magnitudes, domains: [physics-2]}]}
    - {id: c, text: '|EP|=282.6 N/C at 49.0 degrees below +x', issueSignals: [{id: uses-complement-or-wrong-quadrant, domains: [physics-2]}]}
    - {id: d, text: '|EP|=213.4 N/C at 40.0 degrees above +x', issueSignals: [{id: reports-x-component-as-magnitude, domains: [physics-2]}]}
    answer: {choiceId: a}
    explanation: |
      Solution: EPx=71.9+61.1+80.4=213.4 N/C and EPy=24.4+160.8=185.2 N/C. Therefore |EP|=sqrt(213.4^2+185.2^2)=282.6 N/C and thetaP=atan(185.2/213.4)=41.0 degrees above +x.
      Why it works: The resultant is built from perpendicular component totals, then its direction comes from the ratio y/x.
      Why the other choices fail: b adds component magnitudes; c gives the wrong vertical direction; d reports only the x-component as the total magnitude.
  - id: numeric-force-potential
    title: Step 6 — calculate the force on q4 and the potential
    instruction: 'Quantities: q4=-5.00e-9 C, EP=(213.4 i-hat+185.2 j-hat) N/C, k, q1, q2, q3, and r1, r2, r3. Use F4=q4 EP and VP=sum(kqi/ri). Calculate both, including force direction and units.'
    hint: A negative q4 reverses the field direction. For potential, use unsquared distances and add the three scalar terms.
    type: multipleChoice
    prompt: Which final pair is closest?
    choices:
    - {id: a, text: 'F4=(-1.067 i-hat-0.926 j-hat)e-6 N (magnitude 1.41e-6 N, about 41 degrees below -x); VP=158.5 V', issueSignals: []}
    - {id: b, text: 'F4=(+1.067 i-hat+0.926 j-hat)e-6 N; VP=79.3 V', issueSignals: [{id: fails-negative-charge-force-reversal-and-halves-potential, domains: [physics-2]}]}
    - {id: c, text: 'F4=(-1.067 i-hat-0.926 j-hat)e-6 N; VP=282.6 V', issueSignals: [{id: uses-field-magnitude-as-potential, domains: [physics-2]}]}
    - {id: d, text: 'F4=(-4.27 i-hat-3.70 j-hat)e-8 N; VP=158.5 V', issueSignals: [{id: multiplies-by-field-in-wrong-units-or-scale, domains: [physics-2]}]}
    answer: {choiceId: a}
    explanation: |
      Solution: F4=(-5.00e-9)(213.4 i-hat+185.2 j-hat)=(-1.067 i-hat-0.926 j-hat)e-6 N, so the force points opposite EP. Its magnitude is about 1.41e-6 N. The potential is VP=(8.99e9)(2.00e-9)/0.500+(8.99e9)(3.00e-9)/0.640+(8.99e9)(4.00e-9)/0.447=158.5 V.
      Why it works: Force is a vector obtained by multiplying the field by q4; potential is a scalar sum using kq/r, not kq/r^2.
      Why the other choices fail: b keeps the force direction and mishandles the potential; c confuses field magnitude with potential; d has the wrong force scale while its potential happens to be retained.
