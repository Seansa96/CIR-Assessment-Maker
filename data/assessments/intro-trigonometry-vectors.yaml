schemaVersion: 1
id: intro-trigonometry-vectors
title: Intro to Trigonometric Vectors
assessmentType: quiz
categoryId: trigonometry
subcategoryId: trig-vectors
subcategoryIds:
  - trig-vectors
modeDefault: practice
randomizeQuestions: true
questionTimerSeconds:
assessmentTimerSeconds:
questions:
  - id: q001
    type: multipleChoice
    prompt: "A vector has magnitude 10 and direction $0^\\circ$. What are its components?"
    choices:
      - id: a
        text: "(10, 0)"
      - id: b
        text: "(0, 10)"
      - id: c
        text: "(-10, 0)"
      - id: d
        text: "(0, -10)"
    answer:
      choiceId: a
    explanation: |
      A $0^\circ$ direction points along the positive x-axis, so all the magnitude is horizontal.

      Related topic: Vector Components from Direction Angles

  - id: q002
    type: multipleChoice
    prompt: "Which formulas convert magnitude $M$ and direction $\\theta$ into components?"
    choices:
      - id: a
        text: '$x=M\cos\theta,\ y=M\sin\theta$'
      - id: b
        text: '$x=M\sin\theta,\ y=M\cos\theta$'
      - id: c
        text: '$x=M+\cos\theta,\ y=M+\sin\theta$'
      - id: d
        text: '$x=\frac{M}{\cos\theta},\ y=\frac{M}{\sin\theta}$'
    answer:
      choiceId: a
    explanation: |
      Cosine gives the horizontal component and sine gives the vertical component.

      Related topic: Resolving Vectors into Components

  - id: q003
    type: multipleChoice
    prompt: "A vector has components $(3,4)$. What is its magnitude?"
    choices:
      - id: a
        text: "5"
      - id: b
        text: "7"
      - id: c
        text: "12"
      - id: d
        text: "25"
    answer:
      choiceId: a
    explanation: |
      Magnitude is $\sqrt{3^2+4^2}=5$.

      Related topic: Vector Magnitude from Components

  - id: q004
    type: multipleChoice
    prompt: "Which operation adds vectors component-by-component?"
    choices:
      - id: a
        text: '$(a,b)+(c,d)=(a+c,b+d)$'
      - id: b
        text: '$(a,b)+(c,d)=(ac,bd)$'
      - id: c
        text: '$(a,b)+(c,d)=(a-c,b-d)$'
      - id: d
        text: '$(a,b)+(c,d)=(a+d,b+c)$'
    answer:
      choiceId: a
    explanation: |
      Vector addition combines horizontal components and vertical components separately.

      Related topic: Vector Addition by Components

  - id: q005
    type: multipleChoice
    prompt: "What is $(2,5)+(4,-1)$?"
    choices:
      - id: a
        text: "(6, 4)"
      - id: b
        text: "(-2, 6)"
      - id: c
        text: "(8, -5)"
      - id: d
        text: "(4, 6)"
    answer:
      choiceId: a
    explanation: |
      Add corresponding components: $2+4=6$ and $5+(-1)=4$.

      Related topic: Component Form Vector Addition

  - id: q006
    type: multipleChoice
    prompt: "A vector with components $(-3,0)$ points in which direction?"
    choices:
      - id: a
        text: "Left"
      - id: b
        text: "Right"
      - id: c
        text: "Up"
      - id: d
        text: "Down"
    answer:
      choiceId: a
    explanation: |
      A negative x-component and zero y-component points directly left.

      Related topic: Interpreting Vector Components

  - id: q007
    type: multipleChoice
    prompt: "A unit vector has what magnitude?"
    choices:
      - id: a
        text: "1"
      - id: b
        text: "0"
      - id: c
        text: "10"
      - id: d
        text: "It depends on direction"
    answer:
      choiceId: a
    explanation: |
      By definition, a unit vector has length 1.

      Related topic: Unit Vectors

  - id: q008
    type: multipleChoice
    prompt: "If a vector points at $90^\\circ$, which component is zero?"
    choices:
      - id: a
        text: "x-component"
      - id: b
        text: "y-component"
      - id: c
        text: "both components"
      - id: d
        text: "neither component"
    answer:
      choiceId: a
    explanation: |
      At $90^\circ$, $\cos90^\circ=0$, so the x-component is zero.

      Related topic: Special-Angle Vector Components

  - id: q009
    type: multipleChoice
    prompt: "Which expression gives the direction angle of a vector $(x,y)$ in Quadrant I?"
    choices:
      - id: a
        text: '$\theta=\tan^{-1}(y/x)$'
      - id: b
        text: '$\theta=\tan^{-1}(x/y)$'
      - id: c
        text: '$\theta=x^2+y^2$'
      - id: d
        text: '$\theta=\sqrt{x^2+y^2}$'
    answer:
      choiceId: a
    explanation: |
      In Quadrant I, $\tan\theta=y/x$, so $\theta=\tan^{-1}(y/x)$.

      Related topic: Direction Angle from Components

  - id: q010
    type: multipleChoice
    prompt: "What does multiplying a vector by 3 do?"
    choices:
      - id: a
        text: "Triples its magnitude without changing direction"
      - id: b
        text: "Rotates it by 3 degrees"
      - id: c
        text: "Makes it a unit vector"
      - id: d
        text: "Only changes its x-component"
    answer:
      choiceId: a
    explanation: |
      A positive scalar scales the vector's length and keeps its direction the same.

      Related topic: Scalar Multiplication of Vectors

  - id: q011
    type: numericResponse
    prompt: "Find the magnitude of $(6,8)$."
    answer:
      value: 10
      tolerance: 0.0001
    explanation: |
      $\sqrt{6^2+8^2}=\sqrt{100}=10$.

      Related topic: Vector Magnitude

  - id: q012
    type: numericResponse
    prompt: "A vector has magnitude 12 at $0^\\circ$. What is its x-component?"
    answer:
      value: 12
      tolerance: 0.0001
    explanation: |
      $x=12\cos0^\circ=12$.

      Related topic: Horizontal Vector Components

  - id: q013
    type: numericResponse
    prompt: "A vector has magnitude 8 at $90^\\circ$. What is its y-component?"
    answer:
      value: 8
      tolerance: 0.0001
    explanation: |
      $y=8\sin90^\circ=8$.

      Related topic: Vertical Vector Components

  - id: q014
    type: freeResponse
    prompt: "Explain why vector direction matters even if two vectors have the same magnitude."
    answer:
      expected: |
        Vectors include both magnitude and direction.
        Two vectors with the same length can cause different effects if they point in different directions.
      gradingMode: selfCheck
    explanation: |
      Magnitude alone describes size, but a vector's full meaning also includes direction.

      Related topic: Vector Magnitude and Direction

  - id: q015
    type: numericResponse
    prompt: "What is the y-component of a vector with magnitude 10 at $30^\\circ$?"
    answer:
      value: 5
      tolerance: 0.0001
    explanation: |
      $y=10\sin30^\circ=10(1/2)=5$.

      Related topic: Trigonometric Vector Components


