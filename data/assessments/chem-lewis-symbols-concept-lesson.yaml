lesson:
  introduction: Build a reliable model of lewis symbols and the octet rule by separating electron accounting, particle representation,
    and observable evidence.
  sections:
  - id: valence-count
    title: Count valence electrons
    required: true
    content: For representative elements, the A-group position gives the usual valence-electron count. Core electrons are
      omitted because a Lewis symbol records the outer-shell inventory used in bonding.
    check:
      id: chk-valence-count
      type: multipleChoice
      prompt: Which statement correctly applies the idea of count valence electrons?
      choices:
      - id: a
        text: Sulfur is in group 6A, so its Lewis symbol contains six dots.
        issueSignals: []
      - id: b
        text: Sulfur's atomic number requires sixteen Lewis dots.
        issueSignals:
        - id: chemistry-bonding-valence-count-error
      - id: c
        text: Sulfur receives two dots because it commonly forms a 2- ion.
        issueSignals:
        - id: chemistry-bonding-valence-count-error
      answer:
        choiceId: a
      explanation: 'Solution: Sulfur is in group 6A, so its Lewis symbol contains six dots. Why it works: For representative
        elements, the A-group position gives the usual valence-electron count. Core electrons are omitted because a Lewis
        symbol records the outer-shell inventory used in bonding. Why the other choices fail: The other statements either
        reverse the relevant electron or charge accounting or apply a structural model outside its stated scope.'
    media:
    - type: image
      src: /media/chemistry/bonding-lewis-symbol-workflow.svg
      alt: Instructional workflow for lewis symbols and the octet rule showing the central particle-level decisions.
      caption: Use the representation to connect observable evidence with electron and particle accounting.
  - id: place-dots
    title: Place single dots before pairing
    required: true
    content: Distribute one dot on each of four sides before making pairs. This bookkeeping mirrors the availability of unpaired
      valence electrons without claiming that a flat drawing is an orbital diagram.
    check:
      id: chk-place-dots
      type: multipleChoice
      prompt: Which statement correctly applies the idea of place single dots before pairing?
      choices:
      - id: a
        text: A five-electron symbol has one pair and three single dots.
        issueSignals: []
      - id: b
        text: A five-electron symbol has two pairs and one single dot.
        issueSignals:
        - id: chemistry-bonding-valence-count-error
      - id: c
        text: All five dots belong on one side of the symbol.
        issueSignals:
        - id: chemistry-bonding-valence-count-error
      answer:
        choiceId: a
      explanation: 'Solution: A five-electron symbol has one pair and three single dots. Why it works: Distribute one dot
        on each of four sides before making pairs. This bookkeeping mirrors the availability of unpaired valence electrons
        without claiming that a flat drawing is an orbital diagram. Why the other choices fail: The other statements either
        reverse the relevant electron or charge accounting or apply a structural model outside its stated scope.'
  - id: read-unpaired
    title: Interpret pairs and unpaired electrons
    required: true
    content: The total dots give the valence count; their initial pairing pattern distinguishes lone pairs from unpaired electrons.
      Reorienting the sides does not create a different Lewis symbol.
    check:
      id: chk-read-unpaired
      type: multipleChoice
      prompt: Which statement correctly applies the idea of interpret pairs and unpaired electrons?
      choices:
      - id: a
        text: Nitrogen's five dots can be shown as one pair and three unpaired electrons.
        issueSignals: []
      - id: b
        text: Nitrogen must show three pairs because it often forms three bonds.
        issueSignals:
        - id: chemistry-bonding-valence-count-error
      - id: c
        text: Rotating a Lewis symbol changes its electron count.
        issueSignals:
        - id: chemistry-bonding-valence-count-error
      answer:
        choiceId: a
      explanation: 'Solution: Nitrogen''s five dots can be shown as one pair and three unpaired electrons. Why it works: The
        total dots give the valence count; their initial pairing pattern distinguishes lone pairs from unpaired electrons.
        Reorienting the sides does not create a different Lewis symbol. Why the other choices fail: The other statements either
        reverse the relevant electron or charge accounting or apply a structural model outside its stated scope.'
  - id: ion-symbols
    title: Write Lewis symbols for ions
    required: true
    content: Place an ion symbol in brackets, show the resulting valence shell, and write the charge outside. A main-group
      cation often loses its original valence dots, while a main-group anion commonly displays an octet.
    check:
      id: chk-ion-symbols
      type: multipleChoice
      prompt: Which statement correctly applies the idea of write lewis symbols for ions?
      choices:
      - id: a
        text: The oxide ion is bracketed with eight dots and a 2- charge.
        issueSignals: []
      - id: b
        text: The oxide ion keeps oxygen's six dots because protons determine dots.
        issueSignals:
        - id: chemistry-bonding-valence-count-error
      - id: c
        text: The oxide ion is bracketed with two dots and a 2+ charge.
        issueSignals:
        - id: chemistry-bonding-valence-count-error
      answer:
        choiceId: a
      explanation: 'Solution: The oxide ion is bracketed with eight dots and a 2- charge. Why it works: Place an ion symbol
        in brackets, show the resulting valence shell, and write the charge outside. A main-group cation often loses its original
        valence dots, while a main-group anion commonly displays an octet. Why the other choices fail: The other statements
        either reverse the relevant electron or charge accounting or apply a structural model outside its stated scope.'
  - id: octet-use
    title: Use the octet rule as a pattern
    required: true
    content: The octet rule is a productive main-group model, not a universal law. It helps predict common ions and shared-pair
      structures but requires explicit exceptions for electron-deficient, odd-electron, and expanded-valence species.
    check:
      id: chk-octet-use
      type: multipleChoice
      prompt: Which statement correctly applies the idea of use the octet rule as a pattern?
      choices:
      - id: a
        text: The octet rule is strongest as a main-group stability pattern with known exceptions.
        issueSignals: []
      - id: b
        text: Every stable atom and molecule must contain exactly eight total electrons.
        issueSignals:
        - id: chemistry-bonding-valence-count-error
      - id: c
        text: Transition-metal compounds always follow a simple octet prediction.
        issueSignals:
        - id: chemistry-bonding-valence-count-error
      answer:
        choiceId: a
      explanation: 'Solution: The octet rule is strongest as a main-group stability pattern with known exceptions. Why it
        works: The octet rule is a productive main-group model, not a universal law. It helps predict common ions and shared-pair
        structures but requires explicit exceptions for electron-deficient, odd-electron, and expanded-valence species. Why
        the other choices fail: The other statements either reverse the relevant electron or charge accounting or apply a
        structural model outside its stated scope.'
  - id: verify-symbol
    title: Verify the representation
    required: true
    content: 'Check three things independently: the dot total matches the intended valence count, the pairing convention was
      followed, and any bracketed charge agrees with electron loss or gain.'
    check:
      id: chk-verify-symbol
      type: multipleChoice
      prompt: Which statement correctly applies the idea of verify the representation?
      choices:
      - id: a
        text: A chloride ion check gives eight dots and a 1- charge.
        issueSignals: []
      - id: b
        text: A chloride ion check gives seven dots because chlorine has atomic number 17.
        issueSignals:
        - id: chemistry-bonding-valence-count-error
      - id: c
        text: A chloride ion check gives eight dots and a 1+ charge.
        issueSignals:
        - id: chemistry-bonding-valence-count-error
      answer:
        choiceId: a
      explanation: 'Solution: A chloride ion check gives eight dots and a 1- charge. Why it works: Check three things independently:
        the dot total matches the intended valence count, the pairing convention was followed, and any bracketed charge agrees
        with electron loss or gain. Why the other choices fail: The other statements either reverse the relevant electron
        or charge accounting or apply a structural model outside its stated scope.'
