lesson:
  introduction: |-
    Right triangle trigonometry (SOH CAH TOA) is powerful, but what if a triangle doesn't have a right angle? Triangles without a right angle are called **oblique triangles**. To solve them, we need new tools: The Law of Sines and the Law of Cosines.
  sections:
  - id: sec-law-of-sines
    title: The Law of Sines Formula
    required: true
    content: |-
      The **Law of Sines** establishes a simple, elegant relationship between the sides of a triangle and the sines of their opposite angles.
      
      For any $\triangle ABC$ with side lengths $a$, $b$, and $c$ opposite to angles $A$, $B$, and $C$ respectively:
      $$\frac{\sin(A)}{a} = \frac{\sin(B)}{b} = \frac{\sin(C)}{c}$$
      
      Or equivalently:
      $$\frac{a}{\sin(A)} = \frac{b}{\sin(B)} = \frac{c}{\sin(C)}$$
      
      This means the ratio of the sine of an angle to the length of its opposite side is constant for all three angles of a triangle!

  - id: sec-when-to-use
    title: When to use the Law of Sines
    required: true
    content: |-
      To use the Law of Sines, you must know at least one "complete pair" (an angle and the side directly opposite to it), plus one other piece of information. 
      
      This happens in two main scenarios:
      1. **AAS or ASA**: You know two angles and one side. You can easily find the third angle, giving you a complete pair to set up the proportion.
      2. **SSA**: You know two sides and a non-included angle. *Warning: This is known as the Ambiguous Case, as it can result in 0, 1, or 2 possible triangles!*

questions:
- id: q-geom-obl-1
  title: Concept Check - Setup the Proportion
  prompt: |-
    In $\triangle XYZ$, you know $m\angle X = 40^\circ$, side $x = 10$, and $m\angle Y = 60^\circ$. Which equation correctly sets up the Law of Sines to solve for side $y$?
  type: multipleChoice
  choices:
  - id: c1
    text: $\frac{10}{\sin(40^\circ)} = \frac{y}{\sin(60^\circ)}$
  - id: c2
    text: $\frac{\sin(40^\circ)}{y} = \frac{\sin(60^\circ)}{10}$
  - id: c3
    text: $\frac{10}{40^\circ} = \frac{y}{60^\circ}$
  answer:
    choiceId: c1
  explanation: |-
    The ratio pairs the side with the sine of its opposite angle. So side $x$ goes with $\sin(X)$, and side $y$ goes with $\sin(Y)$. 
    $\frac{x}{\sin(X)} = \frac{y}{\sin(Y)} \implies \frac{10}{\sin(40^\circ)} = \frac{y}{\sin(60^\circ)}$
  skills:
  - geometry-oblique-triangles

- id: q-geom-obl-2
  title: Concept Check - Missing Information
  prompt: |-
    Can you use the Law of Sines to solve a triangle if you only know the three side lengths (SSS)?
  type: multipleChoice
  choices:
  - id: c1
    text: Yes
  - id: c2
    text: No
  answer:
    choiceId: c2
  explanation: |-
    No. To use the Law of Sines, you *must* have at least one known angle and its opposite side (a complete pair). With SSS, you have no angles at all, so the Law of Sines won't work. You need the Law of Cosines!
  skills:
  - geometry-oblique-triangles
