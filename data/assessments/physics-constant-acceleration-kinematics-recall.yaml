modeDefault: practice
randomizeQuestions: false
items:
- id: velocity-time-equation-typed
  type: typed
  prompt: 'Type the constant-acceleration equation that relates final velocity, initial
    velocity, acceleration, and time.

    '
  answer:
    expected: v = v0 + at
    aliases:
    - vf = vi + at
    - final velocity equals initial velocity plus acceleration times time
  explanation: 'This is the velocity-time equation. Use it when time is involved and
    displacement is not the main unknown.

    '
  tags:
  - kinematics
  - constant-acceleration
  - velocity-time
- id: velocity-time-equation-cloze
  type: cloze
  prompt: 'Complete:


    v = v0 + ____

    '
  answer:
    expected: at
    aliases:
    - a t
    - acceleration times time
  explanation: 'The missing term is $at$, the change in velocity caused by constant
    acceleration over time.

    '
  tags:
  - kinematics
  - constant-acceleration
  - velocity-time
- id: position-time-equation-typed
  type: typed
  prompt: 'Type the constant-acceleration position equation that relates position,
    initial position, initial velocity, acceleration, and time.

    '
  answer:
    expected: x = x0 + v0t + 1/2 at^2
    aliases:
    - xf = xi + vi t + 1/2 a t^2
    - position equals initial position plus initial velocity times time plus one half
      acceleration times time squared
  explanation: 'This is the position-time equation. Use it when displacement or position
    is involved and time is known or needed.

    '
  tags:
  - kinematics
  - constant-acceleration
  - position-time
- id: position-time-equation-cloze
  type: cloze
  prompt: 'Complete:


    x = x0 + v0t + ____

    '
  answer:
    expected: 1/2 at^2
    aliases:
    - one half a t squared
    - 0.5at^2
  explanation: 'The missing term is $\frac{1}{2}at^2$. It accounts for the extra displacement
    caused by acceleration.

    '
  tags:
  - kinematics
  - constant-acceleration
  - position-time
- id: no-time-equation-typed
  type: typed
  prompt: 'Type the constant-acceleration equation that relates final velocity, initial
    velocity, acceleration, and displacement without using time.

    '
  answer:
    expected: v^2 = v0^2 + 2a(x - x0)
    aliases:
    - vf^2 = vi^2 + 2a delta x
    - final velocity squared equals initial velocity squared plus two acceleration
      times displacement
  explanation: 'This is the no-time kinematic equation. Use it when time is not given
    and not requested.

    '
  tags:
  - kinematics
  - constant-acceleration
  - no-time
- id: no-time-equation-cloze
  type: cloze
  prompt: 'Complete:


    v^2 = v0^2 + ____

    '
  answer:
    expected: 2a(x - x0)
    aliases:
    - 2a delta x
    - 2 a displacement
  explanation: 'The missing term is $2a(x-x_0)$, or $2a\Delta x$. This equation is
    best when time is absent.

    '
  tags:
  - kinematics
  - constant-acceleration
  - no-time
