glossary:
  introduction: Terms for analyzing objects linked by ideal strings and pulleys.
  sections:
  - id: connected-terms
    title: Connected-System Terms
    entries:
      - { id: tension, term: Tension, definition: 'Pulling force transmitted along a taut string.', drills: [{ id: csg1, type: typed, prompt: 'What force acts along a taut string?', answer: { expected: tension, expectedLatex: 'T', aliases: [], media: [] }, explanation: 'Solution: Tension.\n\nWhy it works: A string pulls along its length.' }] }
      - { id: atwood-machine, term: Atwood machine, definition: 'Two masses connected over a pulley.', drills: [{ id: csg2, type: typed, prompt: 'What machine uses two masses over a pulley?', answer: { expected: 'atwood machine', expectedLatex: '', aliases: [Atwood], media: [] }, explanation: 'Solution: An Atwood machine.\n\nWhy it works: Its masses are connected by a string over a pulley.' }] }
      - { id: constraint, term: String constraint, definition: 'A fixed-length-string condition that relates connected motions.', drills: [{ id: csg3, type: cloze, prompt: 'Ideal connected masses share acceleration ____.', answer: { expected: magnitude, expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: Magnitude.\n\nWhy it works: Fixed string length constrains the motion.' }] }
      - { id: system, term: System approach, definition: 'Treating connected objects together so internal tension cancels.', drills: [{ id: csg4, type: typed, prompt: 'Why analyze connected masses as one system?', answer: { expected: 'tension cancels internally', expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: Internal tension cancels.\n\nWhy it works: It appears as equal and opposite forces within the system.' }] }
