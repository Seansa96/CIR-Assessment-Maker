questions:
- id: q001
  type: multipleChoice
  prompt: |
    If the distance between two massive objects is doubled, what happens to their gravitational potential energy?
  choices:
  - id: a
    text: 'It becomes half as large (closer to zero).'
  - id: b
    text: 'It becomes twice as large (further from zero).'
  - id: c
    text: 'It becomes one-fourth as large.'
  - id: d
    text: 'It remains unchanged.'
  answer:
    choiceId: a
  explanation: |
    Solution:
    It becomes half as large (closer to zero).
    
    Why it works:
    $U$ is inversely proportional to $r$ ($U \propto 1/r$). If $r$ is doubled, the magnitude of $U$ becomes half of its original value. Since $U$ is negative, becoming "half as large in magnitude" means it becomes less negative, moving closer to zero.
    
    Why the other choices fail:
    Unlike the gravitational force which follows an inverse-square law ($1/r^2$), potential energy follows a $1/r$ relationship. Thus it does not become one-fourth.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
- id: q002
  type: numericResponse
  prompt: |
    A $50 \text{ kg}$ object is dropped from rest from a very high altitude (distance $2R$ from the center of a planet of mass $M$ and radius $R$). 
    Given $G = 6.67 \times 10^{-11} \text{ N m}^2/\text{kg}^2$, $M = 5.97 \times 10^{24} \text{ kg}$, and $R = 6.37 \times 10^6 \text{ m}$.
    What is its kinetic energy in Joules just before it strikes the surface?
  answer:
    value: 1562000000
    tolerance: 10000000
  explanation: |
    Solution:
    $E_i = E_f \implies K_i + U_i = K_f + U_f$
    $0 - G\frac{Mm}{2R} = K_f - G\frac{Mm}{R}$
    $K_f = G\frac{Mm}{R} - G\frac{Mm}{2R} = G\frac{Mm}{2R}$
    $K_f = (6.67 \times 10^{-11})\frac{(5.97 \times 10^{24})(50)}{2(6.37 \times 10^6)} \approx 1.562 \times 10^9 \text{ J}$
    
    Why it works:
    By conservation of energy, the gain in kinetic energy equals the loss in potential energy as the object falls from $2R$ to $R$.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
