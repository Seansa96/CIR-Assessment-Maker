questions:
- id: q001
  type: multipleChoice
  prompt: 'In $\triangle ABC$, side $AB$ is extended past $B$ to a point $D$. If $m\angle CBD = 115^\circ$ and $\triangle ABC$ is isosceles with $AC = BC$, what is the measure of the vertex angle $\angle C$?'
  difficultyDimensions:
  - Identify the linear pair: $m\angle ABC = 180 - 115 = 65^\circ$.
  - Identify base angles: Since $AC = BC$, base angles are at $A$ and $B$, so $m\angle A = 65^\circ$.
  - Calculate vertex angle $\angle C = 180 - (65 + 65) = 50^\circ$.
  choices:
  - id: a
    text: '$50^\circ$'
  - id: b
    text: '$65^\circ$'
    issueSignals:
    - vertex-base-confusion
  - id: c
    text: '$115^\circ$'
    issueSignals:
    - exterior-interior-swap
  - id: d
    text: '$25^\circ$'
    issueSignals:
    - subtraction-error
  answer:
    choiceId: a
  explanation: |
    Solution:
    First, find the interior angle at $B$. The exterior angle $\angle CBD$ and the interior angle $\angle ABC$ form a linear pair:
    $m\angle ABC = 180^\circ - 115^\circ = 65^\circ$.
    Since $\triangle ABC$ is isosceles with $AC = BC$, the angles opposite those sides are the base angles. Thus, $m\angle A = m\angle ABC = 65^\circ$.
    The sum of the angles in the triangle is $180^\circ$:
    $m\angle C + 65^\circ + 65^\circ = 180^\circ$
    $m\angle C + 130^\circ = 180^\circ$
    $m\angle C = 50^\circ$.

    Why it works:
    This is a classic two-step angle chase. You must use the linear pair to "get inside" the triangle, and then use the isosceles property to duplicate that angle before applying the $180^\circ$ sum.

    Why the other choices fail:
    - $65^\circ$ is the measure of the base angles ($\angle A$ and $\angle ABC$), not the vertex angle.
    - $115^\circ$ is the given exterior angle.
    - $25^\circ$ comes from incorrectly assuming the exterior angle is split in half or some other arithmetic error ($115 - 90 = 25$).

- id: q002
  type: multipleChoice
  prompt: 'Lines $l$ and $m$ are parallel. A triangle sits between them such that one vertex is on line $l$ and the opposite base lies on line $m$. If the angles of the triangle on line $m$ are $40^\circ$ and $70^\circ$, what is the measure of the vertex angle resting on line $l$?'
  difficultyDimensions:
  - Recognize that the sum of the angles of the triangle is $180^\circ$.
  - Calculate the third angle: $180 - (40 + 70) = 70^\circ$.
  - (Alternatively, see the alternate interior angles forming a straight line on $l$: $40 + x + 70 = 180$).
  choices:
  - id: a
    text: '$110^\circ$'
    issueSignals:
    - complementary-confusion
  - id: b
    text: '$70^\circ$'
  - id: c
    text: '$40^\circ$'
    issueSignals:
    - alternate-interior-error
  - id: d
    text: '$90^\circ$'
    issueSignals:
    - right-angle-assumption
  answer:
    choiceId: b
  explanation: |
    Solution:
    This can be solved purely inside the triangle: the two base angles are $40^\circ$ and $70^\circ$.
    The sum of the angles is $180^\circ$.
    $x + 40^\circ + 70^\circ = 180^\circ$
    $x + 110^\circ = 180^\circ$
    $x = 70^\circ$.

    Why it works:
    The parallel lines are actually a distractor in the first method, but they offer a beautiful second method: The sides of the triangle act as transversals. The alternate interior angle to the $40^\circ$ base angle sits to the left of the vertex angle on line $l$. The alternate interior angle to the $70^\circ$ base angle sits to its right. Together, those three angles ($40$, the vertex angle, and $70$) form a straight line ($180^\circ$) on line $l$. This is actually the formal proof that a triangle's angles sum to $180^\circ$!

    Why the other choices fail:
    - $110^\circ$ is the sum of the two base angles.
    - $40^\circ$ is just one of the base angles.
    - $90^\circ$ assumes the triangle is a right triangle.

- id: q003
  type: multipleChoice
  prompt: 'In right $\triangle PQR$ with right angle at $Q$, a line is drawn from $Q$ to point $S$ on hypotenuse $PR$ such that $QS = PS$. If $m\angle R = 32^\circ$, what is $m\angle SQR$?'
  difficultyDimensions:
  - Find $m\angle P = 90 - 32 = 58^\circ$.
  - In isosceles $\triangle PQS$, $m\angle PQS = m\angle P = 58^\circ$.
  - Find $m\angle SQR = 90 - 58 = 32^\circ$.
  choices:
  - id: a
    text: '$58^\circ$'
    issueSignals:
    - complementary-confusion
  - id: b
    text: '$64^\circ$'
    issueSignals:
    - sum-error
  - id: c
    text: '$32^\circ$'
  - id: d
    text: '$29^\circ$'
    issueSignals:
    - bisection-assumption
  answer:
    choiceId: c
  explanation: |
    Solution:
    First, find the other acute angle of the large right triangle:
    $m\angle P = 90^\circ - 32^\circ = 58^\circ$.
    We are given that $\triangle PQS$ is isosceles with $QS = PS$. The base angles opposite these sides must be equal, so $m\angle PQS = m\angle P = 58^\circ$.
    The full angle at $Q$ is a right angle ($90^\circ$). It is split into $\angle PQS$ and $\angle SQR$.
    $m\angle SQR = 90^\circ - 58^\circ = 32^\circ$.

    Why it works:
    This is a classic "angle chase" where you must move from the large triangle into a smaller sub-triangle. An interesting fact is that if $QS = PS$, then $QS$ actually equals $SR$ as well (making $S$ the circumcenter of the right triangle), which means $\triangle SQR$ is also isosceles! This confirms $m\angle SQR = m\angle R = 32^\circ$ directly.

    Why the other choices fail:
    - $58^\circ$ is the measure of $\angle P$ and $\angle PQS$, not $\angle SQR$.
    - $64^\circ$ is $2 \times 32$.
    - $29^\circ$ assumes $QS$ bisects the $58^\circ$ angle ($58 / 2 = 29$).

- id: q004
  type: multipleChoice
  prompt: 'A five-pointed star is drawn by extending the sides of a regular pentagon until they intersect. What is the measure of one of the points (tips) of the star?'
  difficultyDimensions:
  - Find interior angle of regular pentagon: $108^\circ$.
  - Find exterior angles forming the triangles at the tips: $180 - 108 = 72^\circ$.
  - Calculate tip angle: $180 - (72 + 72) = 36^\circ$.
  choices:
  - id: a
    text: '$72^\circ$'
    issueSignals:
    - exterior-angle-confusion
  - id: b
    text: '$36^\circ$'
  - id: c
    text: '$108^\circ$'
    issueSignals:
    - interior-angle-confusion
  - id: d
    text: '$54^\circ$'
    issueSignals:
    - division-error
  answer:
    choiceId: b
  explanation: |
    Solution:
    First, find the interior angle of the regular pentagon at the center: $\frac{(5-2)180}{5} = \frac{540}{5} = 108^\circ$.
    Each point of the star is the vertex of a small triangle whose base rests on the pentagon.
    The base angles of this small triangle form linear pairs with the pentagon's interior angles.
    Base angle = $180^\circ - 108^\circ = 72^\circ$.
    The small triangle has two base angles of $72^\circ$. The tip angle is:
    $180^\circ - (72^\circ + 72^\circ) = 180^\circ - 144^\circ = 36^\circ$.

    Why it works:
    The "points" of the star are just the third angles of triangles formed by the exterior angles of the inner polygon. You can also solve this by noting that the sum of the points of *any* standard 5-pointed star is $180^\circ$, so one point is $180 / 5 = 36^\circ$.

    Why the other choices fail:
    - $72^\circ$ is the exterior angle of the pentagon (the base angle of the point triangle).
    - $108^\circ$ is the interior angle of the pentagon.
    - $54^\circ$ might come from dividing 108 by 2.

- id: q005
  type: multipleChoice
  prompt: 'In a triangle, the angles are in the ratio 2:3:4. What is the measure of the largest angle?'
  difficultyDimensions:
  - Set up equation: $2x + 3x + 4x = 180$.
  - Solve for $x$: $9x = 180 \implies x = 20$.
  - Calculate the largest angle: $4(20) = 80^\circ$.
  choices:
  - id: a
    text: '$80^\circ$'
  - id: b
    text: '$60^\circ$'
    issueSignals:
    - middle-angle-error
  - id: c
    text: '$40^\circ$'
    issueSignals:
    - smallest-angle-error
  - id: d
    text: '$120^\circ$'
    issueSignals:
    - ratio-sum-error
  answer:
    choiceId: a
  explanation: |
    Solution:
    Let the angles be $2x$, $3x$, and $4x$.
    The sum of the angles in a triangle is $180^\circ$:
    $2x + 3x + 4x = 180^\circ$
    $9x = 180^\circ$
    $x = 20^\circ$.
    The largest angle is $4x$:
    $4(20) = 80^\circ$.

    Why it works:
    This is the standard algebraic technique for handling ratios. By introducing the multiplier $x$, we guarantee the ratio is maintained while solving for the specific scale factor that forces the sum to be 180.

    Why the other choices fail:
    - $60^\circ$ is the middle angle ($3x = 3 \times 20$).
    - $40^\circ$ is the smallest angle ($2x = 2 \times 20$).
    - $120^\circ$ assumes the largest angle is $\frac{4}{6}$ of 180, confusing the sum of the ratio ($2+3+4 = 9$).

- id: q006
  type: multipleChoice
  prompt: 'Two intersecting lines form 4 angles. The sum of three of these angles is $310^\circ$. What is the measure of the acute angle formed by the intersection?'
  difficultyDimensions:
  - Recognize that the sum of all 4 angles is $360^\circ$.
  - Find the missing 4th angle: $360 - 310 = 50^\circ$.
  - Verify that $50^\circ$ is acute (it is).
  choices:
  - id: a
    text: '$130^\circ$'
    issueSignals:
    - obtuse-angle-error
  - id: b
    text: '$40^\circ$'
    issueSignals:
    - complementary-confusion
  - id: c
    text: '$50^\circ$'
  - id: d
    text: '$155^\circ$'
    issueSignals:
    - division-error
  answer:
    choiceId: c
  explanation: |
    Solution:
    Two intersecting lines form a full circle around the intersection point, so the sum of all 4 angles is $360^\circ$.
    If three of the angles sum to $310^\circ$, the fourth angle must be:
    $360^\circ - 310^\circ = 50^\circ$.
    Since the problem asks for the acute angle (less than $90^\circ$), and $50^\circ$ is acute, this is our answer.

    Why it works:
    The four angles consist of two pairs of vertical angles. Let's call the acute pair $x$ and the obtuse pair $y$. The sum of three angles will be either $x+x+y$ or $x+y+y$. Since $310 > 270$, it must be $y+y+x = 310$. The fourth angle $x$ makes up the remainder to 360. 

    Why the other choices fail:
    - $130^\circ$ is the measure of the obtuse angle at the intersection (the supplement: $180 - 50 = 130$).
    - $40^\circ$ is the complement of 50.
    - $155^\circ$ is $310 / 2$.
