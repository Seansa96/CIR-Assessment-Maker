- id: q001
  type: multipleChoice
  difficultyDimensions: &id001
  - modelOrDerivation
  - errorDiagnosis
  prompt: Kirchhoff's loop rule is fundamentally based on which conservation law?
  explanation: 'Solution:

    The loop rule is a statement of the conservation of energy.


    Why it works:

    The work done in moving a charge around a closed path in an electrostatic field is zero. Since potential is
    potential energy per unit charge, the sum of potential differences must be zero.

    Why the other choices fail: Conservation of charge applies to the junction rule. Mass and momentum are not directly
    relevant to circuit loops.'
  choices:
  - id: a
    text: Conservation of Energy
  - id: b
    text: Conservation of Charge
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: Conservation of Momentum
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: d
    text: Conservation of Mass
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  answer:
    choiceId: a
  difficultyEvidence: Requires selecting the governing physical model and checking an assumption or representation.
