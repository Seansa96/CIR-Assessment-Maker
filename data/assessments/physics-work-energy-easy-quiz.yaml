questions:
  - id: we-easy-q01
    title: Work done by a constant force (Horizontal)
    type: numericResponse
    prompt: |
      A student pushes a heavy box across a level floor with a constant horizontal force of $45\text{ N}$. The box moves a distance of $8.0\text{ m}$. How much work (in Joules) does the student do on the box?
    answer:
      value: 360.0
      tolerance: 1.0
    explanation: |
      Work is force times distance when they are in the same direction ($W = Fd$).
      $W = 45\text{ N} \times 8.0\text{ m} = 360\text{ J}$.

  - id: we-easy-q02
    title: Work done at an angle
    type: numericResponse
    prompt: |
      A child pulls a wagon by a handle that makes an angle of $30°$ with the horizontal. The tension in the handle is $50\text{ N}$, and the wagon is pulled a distance of $10\text{ m}$ along the ground. How much work (in Joules) is done by the child? Round to one decimal place.
    answer:
      value: 433.0
      tolerance: 1.0
    explanation: |
      Only the component of force in the direction of motion does work: $W = Fd\cos\theta$.
      $W = 50(10)\cos 30° = 500(0.866) = 433\text{ J}$.

  - id: we-easy-q03
    title: Kinetic Energy Calculation
    type: numericResponse
    prompt: |
      What is the kinetic energy (in Joules) of a $1200\text{ kg}$ car traveling at $15\text{ m/s}$?
    answer:
      value: 135000.0
      tolerance: 100.0
    explanation: |
      $KE = \frac{1}{2}mv^2$.
      $KE = \frac{1}{2}(1200)(15^2) = 600(225) = 135000\text{ J}$ (or $135\text{ kJ}$).

  - id: we-easy-q04
    title: Work-Energy Theorem (Speeding up)
    type: numericResponse
    prompt: |
      A $2.0\text{ kg}$ block is initially sliding at $4.0\text{ m/s}$ on a frictionless horizontal surface. A net force does $48\text{ J}$ of work on the block. What is its final speed in m/s?
    answer:
      value: 8.0
      tolerance: 0.1
    explanation: |
      Work-Energy Theorem: $W_\text{net} = \Delta KE = KE_f - KE_i$.
      Initial $KE = \frac{1}{2}(2.0)(4.0^2) = 16\text{ J}$.
      Final $KE = KE_i + W_\text{net} = 16 + 48 = 64\text{ J}$.
      $64 = \frac{1}{2}(2.0)v_f^2 \implies v_f^2 = 64 \implies v_f = 8.0\text{ m/s}$.

  - id: we-easy-q05
    title: Gravitational Potential Energy
    type: numericResponse
    prompt: |
      A $5.0\text{ kg}$ potted plant is lifted from the floor to a shelf that is $2.0\text{ m}$ high. How much gravitational potential energy (in Joules) does the plant gain? Use $g = 9.8\text{ m/s}^2$.
    answer:
      value: 98.0
      tolerance: 1.0
    explanation: |
      $\Delta PE = mg\Delta h$.
      $PE = 5.0(9.8)(2.0) = 5.0(19.6) = 98\text{ J}$.

  - id: we-easy-q06
    title: Conservation of Energy (Dropping an object)
    type: numericResponse
    prompt: |
      A $0.50\text{ kg}$ apple falls from a tree branch $4.0\text{ m}$ above the ground. Assuming air resistance is negligible, what is its kinetic energy (in Joules) just before it hits the ground? Use $g = 9.8\text{ m/s}^2$.
    answer:
      value: 19.6
      tolerance: 0.5
    explanation: |
      By conservation of energy, the gravitational potential energy lost equals the kinetic energy gained.
      $PE_\text{top} = mgh = 0.50(9.8)(4.0) = 19.6\text{ J}$.
      Since it starts from rest, $KE_\text{bottom} = PE_\text{top} = 19.6\text{ J}$.

  - id: we-easy-q07
    title: Finding Speed from Conservation of Energy
    type: numericResponse
    prompt: |
      A child on a slide starts from rest at the top, which is $3.0\text{ m}$ above the ground. Assuming the slide is perfectly frictionless, what is the child's speed at the bottom in m/s? Use $g = 9.8\text{ m/s}^2$. Round to one decimal place.
    answer:
      value: 7.7
      tolerance: 0.1
    explanation: |
      $mgh = \frac{1}{2}mv^2$ (mass cancels out).
      $v = \sqrt{2gh} = \sqrt{2(9.8)(3.0)} = \sqrt{58.8} \approx 7.67\text{ m/s}$.

  - id: we-easy-q08
    title: Negative Work by Friction
    type: numericResponse
    prompt: |
      A block slides $5.0\text{ m}$ across a rough floor. The force of kinetic friction acting on the block is $15\text{ N}$. How much work (in Joules) does friction do on the block?
      *(Remember that friction opposes motion).*
    answer:
      value: -75.0
      tolerance: 1.0
    explanation: |
      Friction acts in the opposite direction of the displacement, so the angle is $180°$.
      $W = Fd\cos(180°) = 15(5.0)(-1) = -75\text{ J}$.

  - id: we-easy-q09
    title: Power Calculation (Lifting)
    type: numericResponse
    prompt: |
      An electric winch lifts a $200\text{ kg}$ load straight up a distance of $10\text{ m}$ at a constant speed in $8.0\text{ seconds}$. What is the power output of the winch in Watts? Use $g = 9.8\text{ m/s}^2$.
    answer:
      value: 2450.0
      tolerance: 10.0
    explanation: |
      Work done against gravity: $W = mgh = 200(9.8)(10) = 19600\text{ J}$.
      Power $P = \frac{W}{t} = \frac{19600}{8.0} = 2450\text{ W}$.

  - id: we-easy-q10
    title: Power from Force and Velocity
    type: numericResponse
    prompt: |
      A car engine produces a constant forward thrust of $3000\text{ N}$ while the car travels at a steady speed of $25\text{ m/s}$ on a level highway. What is the power delivered by the engine in Watts?
    answer:
      value: 75000.0
      tolerance: 100.0
    explanation: |
      Power can be calculated as $P = Fv$ when force and velocity are in the same direction.
      $P = 3000(25) = 75000\text{ W}$ (or $75\text{ kW}$).

  - id: we-easy-q11
    title: Work done by Normal Force
    type: multipleChoice
    prompt: |
      A person carries a $10\text{ kg}$ box across a horizontal room at a constant velocity. How much work does the normal force (the upward push from the person's hands) do on the box?
    choices:
      - id: a
        text: Positive work, because the force is fighting gravity.
      - id: b
        text: Negative work, because the box is heavy.
      - id: c
        text: Zero work, because the upward force is perpendicular to the horizontal displacement.
      - id: d
        text: It depends on the distance walked.
    answer:
      choiceId: c
    explanation: |
      Work is $W = Fd\cos\theta$. Since the force is completely vertical and the displacement is completely horizontal, the angle $\theta$ is $90°$. Since $\cos(90°) = 0$, the work done by the normal force is zero.

  - id: we-easy-q12
    title: Spring Potential Energy
    type: numericResponse
    prompt: |
      A spring has a spring constant of $k = 400\text{ N/m}$. How much potential energy (in Joules) is stored in the spring when it is compressed by $0.20\text{ m}$ from its equilibrium position?
    answer:
      value: 8.0
      tolerance: 0.1
    explanation: |
      $PE_\text{spring} = \frac{1}{2}kx^2 = \frac{1}{2}(400)(0.20)^2 = 200(0.04) = 8.0\text{ J}$.

  - id: we-easy-q13
    title: Kinetic Energy vs Velocity relation
    type: multipleChoice
    prompt: |
      If a car doubles its speed from $20\text{ mph}$ to $40\text{ mph}$, how does its kinetic energy change?
    choices:
      - id: a
        text: It remains the same.
      - id: b
        text: It doubles.
      - id: c
        text: It triples.
      - id: d
        text: It quadruples (increases by a factor of 4).
    answer:
      choiceId: d
    explanation: |
      Kinetic energy is proportional to the square of the speed ($KE = \frac{1}{2}mv^2$). 
      If speed $v$ is doubled, the new kinetic energy is proportional to $(2v)^2 = 4v^2$, which is $4$ times the original kinetic energy. This is why high-speed crashes are so much more destructive!

  - id: we-easy-q14
    title: Work-Energy with Springs
    type: numericResponse
    prompt: |
      A spring ($k = 500\text{ N/m}$) is compressed by $0.10\text{ m}$ and a $2.0\text{ kg}$ block is placed against it. The spring is released on a frictionless horizontal table. What is the block's speed in m/s as it leaves the spring? Round to one decimal place.
    answer:
      value: 1.6
      tolerance: 0.1
    explanation: |
      By conservation of energy, the spring's potential energy converts entirely into the block's kinetic energy.
      $\frac{1}{2}kx^2 = \frac{1}{2}mv^2 \implies kx^2 = mv^2$
      $500(0.10)^2 = 2.0 v^2 \implies 500(0.01) = 2.0 v^2 \implies 5.0 = 2.0 v^2 \implies v^2 = 2.5$.
      $v = \sqrt{2.5} \approx 1.58\text{ m/s}$.

  - id: we-easy-q15
    title: Conservative vs Non-Conservative Forces
    type: multipleChoice
    prompt: |
      Which of the following is an example of a **non-conservative** force?
    choices:
      - id: a
        text: Gravity
      - id: b
        text: Kinetic Friction
      - id: c
        text: Spring force (elastic force)
      - id: d
        text: Electrostatic force
    answer:
      choiceId: b
    explanation: |
      A conservative force (like gravity or spring force) conserves mechanical energy, and the work it does is independent of the path taken. A non-conservative force (like kinetic friction or air drag) dissipates mechanical energy into thermal energy, and the work done depends on the length of the path taken.
