questions:
- id: work-easy-1
  title: Work calculation
  type: numericResponse
  prompt: 'Adapted from OpenStax University Physics.


    A force of $14$ N pushes a block $18$ m in the direction of the force. What is
    the work done?'
  answer:
    gradingMode: auto
    tolerance: 0.1
    value: 252
  explanation: $W = Fd = 14 \times 18 = 252$ J.
