questions:
- id: q1
  type: numericResponse
  prompt: At STP, what volume does $0.750\ \mathrm{mol}$ of an ideal gas occupy? Use $22.4\ \mathrm{L/mol}$.
  answer:
    value: 16.8
    tolerance: 0.168
  explanation: 'Solution: $0.750\times22.4=16.8\ \mathrm{L}$.


    Why it works: At the stated STP convention, molar volume converts moles directly to volume.'
  difficultyDimensions:
  - stpMolarVolume
  - unitConversion
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q2
  type: numericResponse
  prompt: Find the pressure of $0.500\ \mathrm{mol}$ gas in $10.0\ \mathrm{L}$ at $298\ \mathrm{K}$. Use
    $R=0.08206\ \mathrm{L\,atm\,mol^{-1}K^{-1}}$.
  answer:
    value: 1.22
    tolerance: 0.0122
  explanation: 'Solution: $P=nRT/V=(0.500)(0.08206)(298)/10.0=1.22\ \mathrm{atm}$.


    Why it works: The ideal-gas law links amount, temperature, and volume to pressure.'
  difficultyDimensions:
  - idealGasLaw
  - variableIsolation
  - unitConsistency
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: ideal-gas-law-misapplied
- id: q3
  type: numericResponse
  prompt: A gas is collected over water at $25.0\ ^\circ\mathrm{C}$. Total pressure is $755\ \mathrm{mmHg}$;
    water-vapor pressure is $23.8\ \mathrm{mmHg}$. Find the dry gas pressure.
  answer:
    value: 731.2
    tolerance: 7.312
  explanation: 'Solution: $P_{gas}=755-23.8=731.2\ \mathrm{mmHg}$, or $731\ \mathrm{mmHg}$ to the ones
    place.


    Why it works: Dalton’s law makes total pressure the sum of dry-gas and water-vapor pressures.'
  difficultyDimensions:
  - partialPressure
  - subtractionPrecision
  - dryGasCorrection
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: ideal-gas-law-misapplied
- id: q4
  type: numericResponse
  prompt: Magnesium reacts as $\mathrm{Mg+2HCl\rightarrow MgCl_2+H_2}$. What volume of $\mathrm{H_2}$
    at STP forms from $0.125\ \mathrm{mol}$ Mg?
  answer:
    value: 2.8
    tolerance: 0.027999999999999997
  explanation: 'Solution: The coefficients give $0.125\ \mathrm{mol\ H_2}$; multiply by $22.4\ \mathrm{L/mol}$
    to get $2.80\ \mathrm{L}$.


    Why it works: The balanced equation supplies the mole ratio before the gas-volume conversion.'
  difficultyDimensions:
  - balancedEquation
  - moleRatio
  - stpMolarVolume
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q5
  type: numericResponse
  prompt: For $\mathrm{2KClO_3\rightarrow2KCl+3O_2}$, how many moles of $\mathrm{O_2}$ form from $0.400\
    \mathrm{mol}$ $\mathrm{KClO_3}$?
  answer:
    value: 0.6
    tolerance: 0.01
  explanation: 'Solution: $0.400\times3/2=0.600\ \mathrm{mol\ O_2}$.


    Why it works: Coefficients are mole ratios, not mass ratios.'
  difficultyDimensions:
  - balancedEquation
  - moleRatio
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q6
  type: numericResponse
  prompt: What volume does $0.250\ \mathrm{mol}$ gas occupy at $1.20\ \mathrm{atm}$ and $310\ \mathrm{K}$?
  answer:
    value: 5.3
    tolerance: 0.053
  explanation: 'Solution: $V=nRT/P=(0.250)(0.08206)(310)/1.20=5.30\ \mathrm{L}$.


    Why it works: Solve the ideal-gas law for volume while retaining consistent L-atm units.'
  difficultyDimensions:
  - idealGasLaw
  - variableIsolation
  - unitConsistency
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: ideal-gas-law-misapplied
- id: q7
  type: multipleChoice
  prompt: A mixture contains $0.20\ \mathrm{mol}$ $\mathrm{N_2}$ and $0.80\ \mathrm{mol}$ $\mathrm{O_2}$
    at total pressure 2.00 atm. What is $P_{O_2}$?
  choices:
  - id: a
    text: 1.60 atm
    issueSignals: []
  - id: b
    text: 0.40 atm
    issueSignals:
    - id: ideal-gas-law-misapplied
  - id: c
    text: 2.50 atm
    issueSignals:
    - id: ideal-gas-law-misapplied
  - id: d
    text: 0.80 atm
    issueSignals:
    - id: ideal-gas-law-misapplied
  answer:
    choiceId: a
  explanation: 'Solution: $x_{O_2}=0.80/(0.20+0.80)=0.80$; $P_{O_2}=0.80(2.00)=1.60\ \mathrm{atm}$.


    Why it works: A component’s partial pressure is its mole fraction times total pressure.


    Why the other choices fail: b does not follow the stated relationship or reporting rule; c does not
    follow the stated relationship or reporting rule; d does not follow the stated relationship or reporting
    rule.'
  difficultyDimensions:
  - moleFraction
  - partialPressure
  - mixtureReasoning
  difficultyEvidence: Requires interpreting quantitative evidence and rejecting a specific, plausible
    alternative.
  issueSignals:
  - id: ideal-gas-law-misapplied
- id: q8
  type: numericResponse
  prompt: 'A $0.200\ \mathrm{g}$ sample of $\mathrm{CaCO_3}$ ($100.09\ \mathrm{g/mol}$) decomposes: $\mathrm{CaCO_3\rightarrow
    CaO+CO_2}$. Find $\mathrm{CO_2}$ volume at STP.'
  answer:
    value: 0.0448
    tolerance: 0.01
  explanation: 'Solution: $0.200/100.09=0.001998\ \mathrm{mol}$, the 1:1 equation gives the same moles
    of $\mathrm{CO_2}$, and $\times22.4=0.0448\ \mathrm{L}$.


    Why it works: This is a mass-to-moles-to-equation-to-gas-volume pipeline.'
  difficultyDimensions:
  - molarMass
  - moleRatio
  - stpMolarVolume
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q9
  type: numericResponse
  prompt: 'Hydrogen is collected over water: $V=0.486\ \mathrm{L}$, $T=298\ \mathrm{K}$, $P_{total}=755\
    \mathrm{mmHg}$, $P_{H_2O}=23.8\ \mathrm{mmHg}$. Find moles of dry $\mathrm{H_2}$.'
  answer:
    value: 0.0192
    tolerance: 0.01
  explanation: 'Solution: $P_{H_2}=731.2/760=0.962\ \mathrm{atm}$; $n=PV/RT=(0.962)(0.486)/(0.08206)(298)=0.0192\
    \mathrm{mol}$.


    Why it works: Remove water vapor first, then use the dry-gas pressure in $PV=nRT$.'
  difficultyDimensions:
  - dryGasCorrection
  - idealGasLaw
  - pressureConversion
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: ideal-gas-law-misapplied
- id: q10
  type: multipleChoice
  prompt: Which change makes the volume of a fixed amount of ideal gas increase when temperature is constant?
  choices:
  - id: a
    text: Decrease the pressure
    issueSignals: []
  - id: b
    text: Increase the pressure
    issueSignals:
    - id: stoichiometry-ratio-error
  - id: c
    text: Decrease the amount of gas
    issueSignals:
    - id: stoichiometry-ratio-error
  - id: d
    text: Use a smaller value of R
    issueSignals:
    - id: stoichiometry-ratio-error
  answer:
    choiceId: a
  explanation: 'Solution: With $n$ and $T$ fixed, $V=nRT/P$; lowering $P$ raises $V$.


    Why it works: The other choices either reduce volume or do not represent a physical controllable variable.


    Why the other choices fail: b does not follow the stated relationship or reporting rule; c does not
    follow the stated relationship or reporting rule; d does not follow the stated relationship or reporting
    rule.'
  difficultyDimensions:
  - inverseRelationship
  - idealGasLaw
  difficultyEvidence: Requires interpreting quantitative evidence and rejecting a specific, plausible
    alternative.
  issueSignals:
  - id: stoichiometry-ratio-error
