questions:
- id: q001
  type: numericResponse
  prompt: A source sends 12 W of sound power uniformly through an area of 4.0 m^2. What intensity in W/m^2 results?
  answer: { value: 3, tolerance: 0.05 }
  explanation: |
    Solution: $I=P/A=12/4.0=3.0$ W/m$^2$.

    Why it works: Intensity is power transmitted per area perpendicular to propagation.
  difficultyDimensions: [modelOrDerivation, unitAnalysis]
- id: q002
  type: numericResponse
  prompt: A point source produces intensity 8.0 W/m^2 at 2.0 m. What intensity in W/m^2 is expected at 4.0 m if power spreads uniformly over spherical surfaces?
  answer: { value: 2, tolerance: 0.05 }
  explanation: |
    Solution: Doubling distance multiplies area by four, so intensity becomes $8.0/4=2.0$ W/m$^2$.

    Why it works: For spherical spreading, $I$ follows an inverse-square dependence on distance.
  difficultyDimensions: [proportionalReasoning, modelSelection]
- id: q003
  type: multipleChoice
  prompt: What happens to sound intensity if the same power is spread across a larger area?
  choices:
  - { id: a, text: It decreases. }
  - { id: b, text: It increases. }
  - { id: c, text: It must remain unchanged. }
  - { id: d, text: It becomes frequency. }
  answer: { choiceId: a }
  explanation: |
    Solution: It decreases.

    Why it works: $I=P/A$, so increasing area with fixed power lowers power per unit area.

    Why the other choices fail: Intensity is not frequency, and it does not stay fixed when area changes at constant power.
  difficultyDimensions: [causalReasoning, modelOrDerivation]
- id: q004
  type: numericResponse
  prompt: At a certain location, 0.50 W of sound passes normally through an opening of area 0.20 m^2. What intensity in W/m^2 passes through the opening?
  answer: { value: 2.5, tolerance: 0.05 }
  explanation: |
    Solution: $I=P/A=0.50/0.20=2.5$ W/m$^2$.

    Why it works: The opening area defines the surface over which the stated power is distributed.
  difficultyDimensions: [modelOrDerivation, representationTransfer]
