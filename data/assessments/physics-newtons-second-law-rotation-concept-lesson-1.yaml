lesson:
  introduction: This lesson covers the primary definitions and equations governing
    Newtons Second Law Rotation.
  sections:
  - id: sec-1
    title: Defining Newtons Second Law Rotation
    content: The physics of Newtons Second Law Rotation requires a solid understanding
      of both rotational kinematics and dynamics. The core principles mirror linear
      mechanics but account for radial distribution of mass and rotational axes. For
      example, torque relates to angular acceleration via $\tau = I\alpha$.
    media:
    - type: image
      src: /media/physics/owa/torque-lever.svg
      alt: Lever with a perpendicular force and a labeled lever arm.
      caption: Net torque determines angular acceleration for a chosen axis.
    check:
      id: chk-physics-newtons-second-law-rotation-1
      type: multipleChoice
      prompt: Which of the following best describes a key principle of Newtons Second
        Law Rotation?
      choices:
      - id: a
        text: It depends strictly on linear mass alone.
        issueSignals:
        - id: linear-angular-confusion
        - id: inertia-mass-confusion
      - id: b
        text: It involves the relationship between forces, torques, and mass distribution.
      - id: c
        text: It is independent of the axis of rotation.
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: b
      explanation: 'Solution:

        It involves the relationship between forces, torques, and mass distribution.


        Why it works:

        Rotational mechanics always heavily relies on mass distribution and torques.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-3
    title: Rotational Newton's Law
    content: 'For a fixed axis, net torque produces angular acceleration: $\sum\tau=I\alpha$.'
    media: []
    check: { id: chk-nslr-5, type: multipleChoice, prompt: 'A 12 N m net torque acts on $I=3$ kg m$^2$. What is $\alpha$?', choices: [{ id: a, text: '$4$ rad/s$^2$' }, { id: b, text: '$9$ rad/s$^2$' }, { id: c, text: '$36$ rad/s$^2$' }, { id: d, text: '$0.25$ rad/s$^2$' }], answer: { choiceId: a }, explanation: 'Solution: $\alpha=\tau/I=12/3=4$ rad/s$^2$.\n\nWhy it works: Rotational inertia is the rotational analogue of mass.\n\nWhy the other choices fail: They multiply or invert the required ratio.' }
  - id: sec-4
    title: Inertia Matters
    content: 'For the same net torque, a larger moment of inertia produces a smaller angular acceleration.'
    media: []
    check: { id: chk-nslr-6, type: multipleChoice, prompt: 'Under equal net torque, which object accelerates angularly faster?', choices: [{ id: a, text: larger inertia }, { id: b, text: smaller inertia }, { id: c, text: both always equal }, { id: d, text: neither }], answer: { choiceId: b }, explanation: 'Solution: The smaller-inertia object.\n\nWhy it works: $\alpha=\tau/I$.\n\nWhy the other choices fail: Increasing inertia resists angular acceleration.' }
  - id: sec-5
    title: Net Torque
    content: 'Sum every torque with a sign convention before applying $\sum\tau=I\alpha$.'
    media: []
    check: { id: chk-nslr-7, type: multipleChoice, prompt: 'Equal clockwise and counterclockwise torques give angular acceleration:', choices: [{ id: a, text: positive }, { id: b, text: negative }, { id: c, text: zero }, { id: d, text: infinite }], answer: { choiceId: c }, explanation: 'Solution: It is zero.\n\nWhy it works: Equal opposing torques make $\sum\tau=0$.\n\nWhy the other choices fail: No net torque remains to accelerate rotation.' }
  - id: sec-6
    title: Choosing an Axis
    content: 'Choosing an axis through an unknown support force eliminates that force''s torque.'
    media: []
    check: { id: chk-nslr-8, type: multipleChoice, prompt: 'A force applied at the chosen axis has torque:', choices: [{ id: a, text: zero }, { id: b, text: maximum }, { id: c, text: force squared }, { id: d, text: angular speed }], answer: { choiceId: a }, explanation: 'Solution: It is zero.\n\nWhy it works: Its lever arm is zero.\n\nWhy the other choices fail: Force magnitude alone does not set torque.' }
  - id: sec-7
    title: Linear-Rotational Analogy
    content: 'The parallel is $F_{net}=ma$ and $\tau_{net}=I\alpha$.'
    media: []
    check: { id: chk-nslr-9, type: multipleChoice, prompt: 'Moment of inertia plays the same role in rotation as what in translation?', choices: [{ id: a, text: force }, { id: b, text: mass }, { id: c, text: velocity }, { id: d, text: work }], answer: { choiceId: b }, explanation: 'Solution: It corresponds to mass.\n\nWhy it works: Each resists acceleration.\n\nWhy the other choices fail: Force produces acceleration; it is not the resistance quantity.' }
  - id: sec-2
    title: Mathematical Formulas
    content: The mathematical framework often relies on cross products and integrals.
      Ensuring consistent units (radians for angular measures) is critical. $L = I\omega$
      and $\tau = \vec{r} \times \vec{F}$ are foundational.
    media: []
    check:
      id: chk-physics-newtons-second-law-rotation-2
      type: multipleChoice
      prompt: What unit is essential when using rotational kinematic formulas?
      choices:
      - id: a
        text: Degrees
        issueSignals:
        - id: unit-conversion-error
      - id: b
        text: Radians
      - id: c
        text: Revolutions
        issueSignals:
        - id: unit-conversion-error
      answer:
        choiceId: b
      explanation: 'Solution:

        Radians


        Why it works:

        Radians are the natural mathematical unit tying arc length to radius.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
