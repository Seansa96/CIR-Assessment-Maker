- id: easy-quiz-q012
  type: multipleChoice
  prompt: What should accompany every derived angle in a chase?
  choices:
  - id: a
    text: A stated reason/theorem
  - id: b
    text: A measurement from drawing
  - id: c
    text: The stated facts are insufficient.
  - id: d
    text: Use the diagram scale to estimate the result.
  answer:
    choiceId: a
  explanation: Maintain a reason ledger. A common error is a measurement from drawing.
- id: easy-quiz-q043
