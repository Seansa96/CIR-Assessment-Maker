questions:
- id: easy-quiz-q001
  type: multipleChoice
  prompt: Two lines intersect. One angle is 47 degrees. Find its vertical angle.
  choices:
  - id: a
    text: 133 degrees
  - id: b
    text: 23.5 degrees
  - id: c
    text: 57 degrees
  - id: d
    text: 47 degrees
  answer:
    choiceId: d
  explanation: Vertical angles are equal. A common error is 133 degrees.
- id: easy-quiz-q003
  type: multipleChoice
  prompt: Angles around point are 90,120,80,x. Find x.
  choices:
  - id: a
    text: 35 degrees
  - id: b
    text: 80 degrees
  - id: c
    text: 70 degrees
  - id: d
    text: 110 degrees
  answer:
    choiceId: c
  explanation: They sum to 360. A common error is 110 degrees.
- id: easy-quiz-q049
  type: multipleChoice
  prompt: Inscribed angle is 42. Find arc.
  choices:
  - id: a
    text: 42 degrees
  - id: b
    text: 84 degrees
  - id: c
    text: 21 degrees
  - id: d
    text: 96 degrees
  answer:
    choiceId: b
  explanation: Arc is double angle. A common error is 21 degrees.
- id: easy-quiz-q008
  type: multipleChoice
  prompt: An inscribed angle intercepts arc 100 degrees. Find angle.
  choices:
  - id: a
    text: 50 degrees
  - id: b
    text: 100 degrees
  - id: c
    text: 130 degrees
  - id: d
    text: 25 degrees
  answer:
    choiceId: a
  explanation: Inscribed angle is half arc. A common error is 100 degrees.
- id: easy-quiz-q011
  type: multipleChoice
  prompt: One angle of cyclic quadrilateral is 112. Find opposite angle.
  choices:
  - id: a
    text: 112 degrees
  - id: b
    text: 34 degrees
  - id: c
    text: 78 degrees
  - id: d
    text: 68 degrees
  answer:
    choiceId: d
  explanation: Opposite angles supplement. A common error is 112 degrees.
- id: easy-quiz-q007
  type: multipleChoice
  prompt: Isosceles triangle base angles 38 each. Find vertex angle.
  choices:
  - id: a
    text: 76 degrees
  - id: b
    text: 52 degrees
  - id: c
    text: 104 degrees
  - id: d
    text: 142 degrees
  answer:
    choiceId: c
  explanation: Subtract 76 from 180. A common error is 142 degrees.
- id: easy-quiz-q002
  type: multipleChoice
  prompt: A linear pair has one angle 68 degrees. Find the other.
  choices:
  - id: a
    text: 122 degrees
  - id: b
    text: 112 degrees
  - id: c
    text: 68 degrees
  - id: d
    text: 56 degrees
  answer:
    choiceId: b
  explanation: Linear pair sums to 180. A common error is 68 degrees.
- id: easy-quiz-q005
  type: multipleChoice
  prompt: Parallel lines cut by transversal have corresponding angle 75. Find its mate.
  choices:
  - id: a
    text: 75 degrees
  - id: b
    text: 105 degrees
  - id: c
    text: 37.5 degrees
  - id: d
    text: 85 degrees
  answer:
    choiceId: a
  explanation: Corresponding angles are equal. A common error is 105 degrees.
- id: easy-quiz-q010
  type: multipleChoice
  prompt: A tangent-chord angle intercepts arc 80 degrees. Find angle.
  choices:
  - id: a
    text: 80 degrees
  - id: b
    text: 140 degrees
  - id: c
    text: 20 degrees
  - id: d
    text: 40 degrees
  answer:
    choiceId: d
  explanation: It is half intercepted arc. A common error is 80 degrees.
- id: easy-quiz-q004
