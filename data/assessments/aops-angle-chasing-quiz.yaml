questions:
- id: q001
  type: multipleChoice
  prompt: |-
    An original Angle Chasing problem variant is designed to test **angle chasing**. Which solution strategy is most appropriate?
  choices:
  - id: a
    text: Use propagate known angles after checking the relevant constraints.
  - id: b
    text: Assume the answer from a visually similar problem still applies.
  - id: c
    text: Ignore the distinction between necessary and sufficient conditions.
  - id: d
    text: Try arithmetic first and decide the structure only after the answer appears.
  answer:
    choiceId: a
  explanation: |-
    This mirrors the difficulty of a chapter problem archetype: recognize angle chasing, choose propagate known angles, and verify the constraints before computing.
  skills:
  - aops-angle-chasing
