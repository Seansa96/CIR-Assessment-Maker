questions:
- id: q001
  type: multipleChoice
  prompt: In $\triangle ABC$, $m\angle A = 45^\circ$ and $m\angle B = 75^\circ$. What is the measure of
    $\angle C$?
  difficultyDimensions:
  - Recall the sum of interior angles of a triangle is $180^\circ$.
  - 'Add the two known angles: $45 + 75 = 120$.'
  - 'Subtract from $180$: $180 - 120 = 60$.'
  choices:
  - id: a
    text: $70^\circ$
    issueSignals:
    - id: subtraction-error
      domains: []
  - id: b
    text: $60^\circ$
  - id: c
    text: $120^\circ$
    issueSignals:
    - id: sum-instead-of-difference
      domains: []
  - id: d
    text: $45^\circ$
    issueSignals:
    - id: isosceles-assumption-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The sum of the interior angles of any triangle is $180^\circ$.

    $m\angle A + m\angle B + m\angle C = 180^\circ$

    $45^\circ + 75^\circ + m\angle C = 180^\circ$

    $120^\circ + m\angle C = 180^\circ$

    $m\angle C = 60^\circ$.


    Why it works:

    This is the fundamental property of Euclidean triangles. If you tear off the three corners of a paper
    triangle and lay them side-by-side, they will always form a perfect straight line ($180^\circ$).


    Why the other choices fail:

    - $70^\circ$ is a subtraction error (e.g., $180 - 110$ or similar arithmetic failure).

    - $120^\circ$ is the sum of the other two angles, which is the measure of the *exterior* angle at
    $C$, not the interior angle.

    - $45^\circ$ assumes the triangle is isosceles with base angles of $45^\circ$, which contradicts the
    $180^\circ$ sum.

    '
- id: q002
  type: multipleChoice
  prompt: An exterior angle of a triangle measures $130^\circ$. If one of the remote interior angles measures
    $50^\circ$, what is the measure of the other remote interior angle?
  difficultyDimensions:
  - 'Recall the Exterior Angle Theorem: Ext Angle = Sum of two remote interior angles.'
  - 'Set up equation: $130 = 50 + x$.'
  - 'Solve for $x$: $130 - 50 = 80$.'
  choices:
  - id: a
    text: $50^\circ$
    issueSignals:
    - id: supplementary-confusion
      domains: []
  - id: b
    text: $80^\circ$
  - id: c
    text: $180^\circ$
    issueSignals:
    - id: total-sum-error
      domains: []
  - id: d
    text: $100^\circ$
    issueSignals:
    - id: isosceles-assumption-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The Exterior Angle Theorem states that the measure of an exterior angle of a triangle equals the sum
    of the two remote interior angles.

    $130^\circ = 50^\circ + x$

    $x = 130^\circ - 50^\circ = 80^\circ$.


    Why it works:

    This is a shortcut that skips finding the third interior angle. The interior angle adjacent to the
    exterior $130^\circ$ angle must be $50^\circ$ (linear pair). The sum of all three interior angles
    is $180^\circ$, so $50 + 50 + x = 180$, which also yields $x = 80^\circ$. The theorem just combines
    these steps into one equality.


    Why the other choices fail:

    - $50^\circ$ is the measure of the interior angle adjacent to the $130^\circ$ exterior angle, not
    the other remote one.

    - $180^\circ$ is the total sum of all interior angles.

    - $100^\circ$ assumes the two remote interior angles are equal ($130 / 2$? No, $100+30=130$).

    '
- id: q003
  type: multipleChoice
  prompt: In isosceles $\triangle XYZ$, $XY = XZ$. If $m\angle Y = 40^\circ$, what is the measure of the
    vertex angle $\angle X$?
  difficultyDimensions:
  - Identify that $\angle Y$ and $\angle Z$ are the base angles because $XY = XZ$.
  - 'Apply the Isosceles Triangle Theorem: $m\angle Y = m\angle Z = 40^\circ$.'
  - 'Use triangle sum to find vertex angle $\angle X$: $180 - (40 + 40)$.'
  choices:
  - id: a
    text: $40^\circ$
    issueSignals:
    - id: equilateral-assumption-error
      domains: []
  - id: b
    text: $100^\circ$
  - id: c
    text: $70^\circ$
    issueSignals:
    - id: vertex-base-confusion
      domains: []
  - id: d
    text: $140^\circ$
    issueSignals:
    - id: single-subtraction-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    Because $XY = XZ$, the angles opposite those sides are equal (the base angles).

    Therefore, $m\angle Z = m\angle Y = 40^\circ$.

    The sum of the interior angles is $180^\circ$:

    $m\angle X + 40^\circ + 40^\circ = 180^\circ$

    $m\angle X + 80^\circ = 180^\circ$

    $m\angle X = 100^\circ$.


    Why it works:

    "If sides, then angles." Equal sides opposite equal angles is the defining trait of isosceles triangles.
    Drawing a quick sketch always helps identify which angle is the unique vertex angle.


    Why the other choices fail:

    - $40^\circ$ assumes the triangle is equilateral, or confuses the vertex angle with a base angle.

    - $70^\circ$ is what $\angle Y$ and $\angle Z$ would measure if $\angle X$ was given as $40^\circ$
    ($180-40=140; 140/2=70$). This is the classic "vertex vs base" confusion.

    - $140^\circ$ comes from subtracting only one base angle from $180$ ($180 - 40$).

    '
- id: q004
  type: multipleChoice
  prompt: In isosceles $\triangle DEF$, $DE = DF$. If the vertex angle $\angle D$ measures $70^\circ$,
    what is the measure of base angle $\angle E$?
  difficultyDimensions:
  - Identify that the remaining degrees to be split are $180 - 70 = 110$.
  - Recognize that base angles $\angle E$ and $\angle F$ are equal.
  - 'Divide by 2: $110 / 2 = 55^\circ$.'
  choices:
  - id: a
    text: $70^\circ$
    issueSignals:
    - id: equilateral-assumption-error
      domains: []
  - id: b
    text: $110^\circ$
    issueSignals:
    - id: division-omission
      domains: []
  - id: c
    text: $55^\circ$
  - id: d
    text: $40^\circ$
    issueSignals:
    - id: vertex-base-confusion
      domains: []
  answer:
    choiceId: c
  explanation: 'Solution:

    Because $DE = DF$, the angles opposite those sides ($\angle E$ and $\angle F$) are the base angles
    and are equal.

    The sum of the interior angles is $180^\circ$.

    $m\angle D + m\angle E + m\angle F = 180^\circ$

    $70^\circ + 2(m\angle E) = 180^\circ$

    $2(m\angle E) = 110^\circ$

    $m\angle E = 55^\circ$.


    Why it works:

    The remaining $110^\circ$ after accounting for the vertex angle must be shared equally by the two
    identical base angles.


    Why the other choices fail:

    - $70^\circ$ assumes all three angles are equal, or that $\angle E$ is equal to $\angle D$.

    - $110^\circ$ is the sum of the two base angles, failing to divide by 2.

    - $40^\circ$ would be the vertex angle if one of the base angles was given as $70^\circ$ ($180 - 70
    - 70$).

    '
- id: q005
  type: multipleChoice
  prompt: In $\triangle PQR$, the exterior angle at $R$ measures $110^\circ$. If $m\angle P = 2x$ and
    $m\angle Q = 3x - 15^\circ$, what is the measure of $\angle P$?
  difficultyDimensions:
  - 'Apply Exterior Angle Theorem: $2x + (3x - 15) = 110$.'
  - 'Solve for $x$: $5x - 15 = 110 \implies 5x = 125 \implies x = 25$.'
  - 'Substitute to find $\angle P$: $2(25) = 50^\circ$.'
  choices:
  - id: a
    text: $25^\circ$
    issueSignals:
    - id: variable-instead-of-angle
      domains: []
  - id: b
    text: $60^\circ$
    issueSignals:
    - id: other-angle-error
      domains: []
  - id: c
    text: $70^\circ$
    issueSignals:
    - id: linear-pair-confusion
      domains: []
  - id: d
    text: $50^\circ$
  answer:
    choiceId: d
  explanation: 'Solution:

    The exterior angle at $R$ equals the sum of the remote interior angles $P$ and $Q$.

    $110^\circ = (2x) + (3x - 15^\circ)$

    $110 = 5x - 15$

    $125 = 5x$

    $x = 25$.

    The question asks for $m\angle P$:

    $m\angle P = 2x = 2(25) = 50^\circ$.


    Why it works:

    This is an algebraic application of the Exterior Angle Theorem. If you instead found the interior
    angle at $R$ ($180 - 110 = 70$), you could use the triangle sum theorem: $2x + 3x - 15 + 70 = 180
    \implies 5x + 55 = 180 \implies 5x = 125$, giving the exact same result.


    Why the other choices fail:

    - $25^\circ$ is the value of the variable $x$, not the angle itself.

    - $60^\circ$ is the measure of $\angle Q$ ($3(25) - 15 = 60$).

    - $70^\circ$ is the measure of the interior angle at $R$, adjacent to the $110^\circ$ exterior angle.

    '
