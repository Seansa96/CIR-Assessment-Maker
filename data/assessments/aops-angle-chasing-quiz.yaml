- id: easy-quiz-q041
  type: multipleChoice
  prompt: Two intersecting lines make angle 122. Find vertical angle.
  choices:
  - id: a
    text: 132 degrees
  - id: b
    text: 122 degrees
  - id: c
    text: 58 degrees
  - id: d
    text: 61 degrees
