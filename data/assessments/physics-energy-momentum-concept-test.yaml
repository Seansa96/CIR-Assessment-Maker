id: physics-energy-momentum-concept-test
title: Energy and Momentum Concept Test
assessmentType: test
categoryId: physics-1
topicId: physics-comprehensive-review
modeDefault: evaluate
randomizeQuestions: true
questions:
  - id: em-q01
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Students confuse conservative and non-conservative forces."
    prerequisiteObjectiveIds: [physics-work-energy]
    extensionObjectiveIds: [physics-potential-energy-conservation]
    prompt: |
      Which of the following describes the key characteristic of a conservative force?
    choices:
      - id: a
        text: 'The work it does on an object depends on the path taken between two points.'
      - id: b
        text: 'The work it does on an object moving around a closed path is zero.'
      - id: c
        text: 'It always acts in the direction opposite to motion.'
      - id: d
        text: 'It always increases the kinetic energy of the system.'
    answer:
      choiceId: b
    explanation: |
        Solution: A conservative force is one where the work done is independent of the path taken.
        
        Why it works: Since work is path-independent, any closed loop (ending where you started) yields a net work of zero. Gravity and electrostatic forces are examples.
        
        Why the other choices fail: Path dependence defines non-conservative forces (like friction). Friction opposes motion. Conservative forces can decrease kinetic energy (by converting it to potential energy).

  - id: em-q02
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding when mechanical energy is conserved."
    prerequisiteObjectiveIds: [physics-potential-energy-conservation]
    extensionObjectiveIds: [physics-potential-energy-conservation]
    prompt: |
      Under what condition is the total mechanical energy (kinetic + potential) of a system conserved?
    choices:
      - id: a
        text: 'Only when the object moves at a constant velocity.'
      - id: b
        text: 'Only when no external forces act on the system.'
      - id: c
        text: 'Only when non-conservative forces do zero net work on the system.'
      - id: d
        text: 'Only when the system is in a vacuum.'
    answer:
      choiceId: c
    explanation: |
        Solution: The Work-Energy Theorem states $W_{nc} = \Delta E_{mech}$.
        
        Why it works: Mechanical energy is conserved ($\Delta E = 0$) if and only if the work done by non-conservative forces (like friction or external applied forces) is zero.
        
        Why the other choices fail: Velocity can change (exchanging KE for PE). External forces can exist as long as they do no work (e.g., normal force perpendicular to motion). A vacuum eliminates air resistance, but other non-conservative forces could still exist.

  - id: em-q03
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Zero work by perpendicular forces."
    prerequisiteObjectiveIds: [physics-work-energy]
    extensionObjectiveIds: [physics-work-energy]
    prompt: |
      A person carries a heavy box horizontally at a constant speed across a room. How much work does the person's upward force on the box do on the box?
    choices:
      - id: a
        text: 'Positive work.'
      - id: b
        text: 'Negative work.'
      - id: c
        text: 'Zero work.'
      - id: d
        text: 'It depends on the mass of the box.'
    answer:
      choiceId: c
    explanation: |
        Solution: Work is defined as $W = \vec{F} \cdot \vec{d} = F d \cos\theta$.
        
        Why it works: The upward force is perpendicular to the horizontal displacement ($\theta = 90^\circ$). Since $\cos(90^\circ) = 0$, the work done by this force is zero.
        
        Why the other choices fail: Positive/negative work requires a component of force parallel/antiparallel to displacement.

  - id: em-q04
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Work-Kinetic Energy Theorem intuition."
    prerequisiteObjectiveIds: [physics-work-energy]
    extensionObjectiveIds: [physics-work-energy]
    prompt: |
      If the net work done on an object is negative, what must happen to the object's kinetic energy?
    choices:
      - id: a
        text: 'It must increase.'
      - id: b
        text: 'It must decrease.'
      - id: c
        text: 'It must remain constant.'
      - id: d
        text: 'It must become zero.'
    answer:
      choiceId: b
    explanation: |
        Solution: The Work-Kinetic Energy Theorem states $W_{net} = \Delta K$.
        
        Why it works: If $W_{net} < 0$, then $\Delta K < 0$. This means the final kinetic energy is less than the initial, so the object slows down.
        
        Why the other choices fail: Increasing implies positive net work. Constant implies zero net work. Becoming exactly zero only happens if the negative work perfectly drains all initial kinetic energy, but it decreases in all cases.

  - id: em-q05
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "System definition for potential energy."
    prerequisiteObjectiveIds: [physics-potential-energy-conservation]
    extensionObjectiveIds: [physics-potential-energy-conservation]
    prompt: |
      A ball is thrown upward. If we define our system to be the ball ONLY (not including the Earth), what type of energy change occurs as it rises?
    choices:
      - id: a
        text: 'The system gains gravitational potential energy.'
      - id: b
        text: 'The system''s total mechanical energy is conserved.'
      - id: c
        text: 'Gravity does negative work on the system, decreasing its kinetic energy.'
      - id: d
        text: 'Gravity does positive work on the system, increasing its kinetic energy.'
    answer:
      choiceId: c
    explanation: |
        Solution: Potential energy is a property of a *system of interacting objects* (e.g., Earth-ball system). 
        
        Why it works: If the Earth is excluded from the system, gravity is an *external* force. As the ball rises, this external downward force opposes motion, doing negative work and reducing the ball's kinetic energy.
        
        Why the other choices fail: A single particle cannot have gravitational potential energy on its own. Because an external force (gravity) does work, mechanical energy is not conserved for the ball-only system.

  - id: em-q06
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Power conceptualization."
    prerequisiteObjectiveIds: [physics-work-energy]
    extensionObjectiveIds: [physics-work-energy]
    prompt: |
      Engine A lifts a 100 kg mass by 10 meters in 5 seconds. Engine B lifts a 100 kg mass by 10 meters in 10 seconds. How do the work and power of the two engines compare?
    choices:
      - id: a
        text: 'Engine A does more work and has more power.'
      - id: b
        text: 'They do the same work, but Engine A has more power.'
      - id: c
        text: 'They do the same work, but Engine B has more power.'
      - id: d
        text: 'Engine B does more work and has more power.'
    answer:
      choiceId: b
    explanation: |
        Solution: Work is force times distance. Power is work divided by time ($P = W/t$).
        
        Why it works: Both lift the same weight the same distance, so $W_A = W_B = mgh$. Engine A does it in half the time, meaning it delivers energy twice as fast, so $P_A > P_B$.
        
        Why the other choices fail: Work depends only on mass and height, not time. Power is inversely proportional to time.

  - id: em-q07
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Momentum vs Kinetic Energy."
    prerequisiteObjectiveIds: [physics-momentum-collisions]
    extensionObjectiveIds: [physics-momentum-collisions]
    prompt: |
      Two objects have the same momentum. Object X has mass $m$, and Object Y has mass $2m$. Which object has the greater kinetic energy?
    choices:
      - id: a
        text: 'Object X'
      - id: b
        text: 'Object Y'
      - id: c
        text: 'They have the same kinetic energy.'
      - id: d
        text: 'It cannot be determined.'
    answer:
      choiceId: a
    explanation: |
        Solution: Kinetic energy can be expressed in terms of momentum: $K = p^2 / (2m)$.
        
        Why it works: Since $p$ is the same for both, $K$ is inversely proportional to mass. The lighter object (X) must be moving twice as fast to have the same momentum, giving it proportionally more kinetic energy.
        
        Why the other choices fail: The heavier object (Y) has half the kinetic energy. They are not equal because velocity is squared in KE but linear in momentum.

  - id: em-q08
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding when momentum is conserved."
    prerequisiteObjectiveIds: [physics-momentum-collisions]
    extensionObjectiveIds: [physics-momentum-collisions]
    prompt: |
      Under what condition is the total linear momentum of a system of particles conserved?
    choices:
      - id: a
        text: 'Only if the collisions between particles are perfectly elastic.'
      - id: b
        text: 'Only if there is no friction within the system.'
      - id: c
        text: 'Only if the net external force acting on the system is zero.'
      - id: d
        text: 'Only if the mechanical energy of the system is conserved.'
    answer:
      choiceId: c
    explanation: |
        Solution: Newton's Second Law for a system is $\vec{F}_{net,ext} = d\vec{p}/dt$.
        
        Why it works: If the net external force is zero, then $d\vec{p}/dt = 0$, meaning the total momentum $\vec{p}$ is constant (conserved).
        
        Why the other choices fail: Internal friction or inelastic collisions reduce kinetic energy but do *not* change the total momentum of the system.

  - id: em-q09
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Elastic vs Inelastic definitions."
    prerequisiteObjectiveIds: [physics-momentum-collisions]
    extensionObjectiveIds: [physics-momentum-collisions]
    prompt: |
      What distinguishes a perfectly inelastic collision from other types of collisions?
    choices:
      - id: a
        text: 'Kinetic energy is perfectly conserved.'
      - id: b
        text: 'Momentum is not conserved.'
      - id: c
        text: 'The colliding objects stick together and move with a common final velocity.'
      - id: d
        text: 'The objects bounce off each other without any deformation.'
    answer:
      choiceId: c
    explanation: |
        Solution: "Perfectly inelastic" implies the maximum possible loss of macroscopic kinetic energy, which happens when objects fuse.
        
        Why it works: When objects stick together, they share a single final velocity vector, defining a perfectly inelastic collision. Momentum is still conserved.
        
        Why the other choices fail: Conserved KE defines elastic collisions. Momentum is conserved in all isolated collisions. Bouncing without deformation is elastic.

  - id: em-q10
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Impulse and momentum change."
    prerequisiteObjectiveIds: [physics-momentum-collisions]
    extensionObjectiveIds: [physics-momentum-collisions]
    prompt: |
      A rubber ball and a lump of clay of equal mass are thrown with equal speeds at a wall. The rubber ball bounces back, while the clay sticks to the wall. Which object experiences a greater impulse from the wall?
    choices:
      - id: a
        text: 'The rubber ball.'
      - id: b
        text: 'The lump of clay.'
      - id: c
        text: 'They experience the same impulse.'
      - id: d
        text: 'Neither experiences an impulse.'
    answer:
      choiceId: a
    explanation: |
        Solution: Impulse is the change in momentum: $\vec{J} = \Delta\vec{p} = m\vec{v}_f - m\vec{v}_i$.
        
        Why it works: The clay's velocity goes from $v$ to $0$ (change of $mv$). The rubber ball's velocity goes from $v$ to nearly $-v$ (change of $2mv$). The ball undergoes a larger change in momentum, hence a greater impulse.
        
        Why the other choices fail: The clay only loses its forward momentum, whereas the ball loses its forward momentum *and* gains backward momentum.

  - id: em-q11
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Center of mass for uniform vs non-uniform."
    prerequisiteObjectiveIds: [physics-center-of-mass]
    extensionObjectiveIds: [physics-center-of-mass]
    prompt: |
      Where is the center of mass of a baseball bat located?
    choices:
      - id: a
        text: 'Exactly in the geometric center of the bat.'
      - id: b
        text: 'Closer to the thinner handle.'
      - id: c
        text: 'Closer to the thicker barrel.'
      - id: d
        text: 'At the very end of the handle.'
    answer:
      choiceId: c
    explanation: |
        Solution: The center of mass is the weighted average of mass distribution.
        
        Why it works: A baseball bat is asymmetrical, with more mass concentrated at the thicker barrel end. The center of mass must lie closer to the region with more mass.
        
        Why the other choices fail: It would be at the geometric center only if the bat were a uniform cylinder.

  - id: em-q12
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Center of mass motion in isolated systems."
    prerequisiteObjectiveIds: [physics-center-of-mass]
    extensionObjectiveIds: [physics-center-of-mass]
    prompt: |
      An astronaut floating in space pushes a heavy satellite away from themselves. What happens to the center of mass of the astronaut-satellite system?
    choices:
      - id: a
        text: 'It moves in the direction the satellite moves.'
      - id: b
        text: 'It moves in the direction the astronaut moves.'
      - id: c
        text: 'It remains stationary.'
      - id: d
        text: 'It accelerates.'
    answer:
      choiceId: c
    explanation: |
        Solution: The system (astronaut + satellite) experiences no external net forces.
        
        Why it works: Internal forces (the push) cannot change the velocity of the center of mass. Since they were initially floating (stationary), the center of mass remains stationary at its original location.
        
        Why the other choices fail: The individual pieces move, but their mass-weighted average position does not.

  - id: em-q13
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Elastic collisions and relative velocity."
    prerequisiteObjectiveIds: [physics-momentum-collisions]
    extensionObjectiveIds: [physics-momentum-collisions]
    prompt: |
      In a perfectly elastic head-on collision between two objects, what is true about their relative velocities?
    choices:
      - id: a
        text: 'Their relative velocity before the collision is greater than after.'
      - id: b
        text: 'Their relative velocity before the collision is less than after.'
      - id: c
        text: 'The magnitude of their relative velocity is unchanged.'
      - id: d
        text: 'Their relative velocity becomes zero.'
    answer:
      choiceId: c
    explanation: |
        Solution: A hallmark of perfectly elastic 1D collisions is the conservation of relative speed.
        
        Why it works: $v_{1i} - v_{2i} = -(v_{1f} - v_{2f})$. The speed at which they approach each other equals the speed at which they separate.
        
        Why the other choices fail: This conservation of relative speed is mathematically derived from the simultaneous conservation of momentum and kinetic energy.

  - id: em-q14
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Forces during collision."
    prerequisiteObjectiveIds: [physics-momentum-collisions]
    extensionObjectiveIds: [physics-momentum-collisions]
    prompt: |
      A heavy bowling ball collides with a light ping-pong ball. How do the impulses experienced by each object compare?
    choices:
      - id: a
        text: 'The bowling ball experiences a larger impulse.'
      - id: b
        text: 'The ping-pong ball experiences a larger impulse.'
      - id: c
        text: 'They experience equal and opposite impulses.'
      - id: d
        text: 'Neither experiences an impulse.'
    answer:
      choiceId: c
    explanation: |
        Solution: Impulse is $\vec{J} = \int \vec{F} dt$.
        
        Why it works: By Newton's Third Law, the force $\vec{F}$ they exert on each other is equal and opposite at every instant. The contact time $t$ is exactly the same for both. Thus, the impulses are equal and opposite, leading to equal and opposite momentum changes.
        
        Why the other choices fail: The ping-pong ball experiences a much larger *velocity change* due to its small mass, but the impulse (momentum change) is identical in magnitude.

  - id: em-q15
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Work done by gravity in a closed loop."
    prerequisiteObjectiveIds: [physics-work-energy]
    extensionObjectiveIds: [physics-work-energy]
    prompt: |
      A pendulum swings back and forth. Consider one complete cycle (starting from the highest point, swinging down, up to the other side, and back). What is the total work done by gravity over this cycle?
    choices:
      - id: a
        text: 'Positive work.'
      - id: b
        text: 'Negative work.'
      - id: c
        text: 'Zero work.'
      - id: d
        text: 'It depends on the mass of the bob.'
    answer:
      choiceId: c
    explanation: |
        Solution: Gravity is a conservative force.
        
        Why it works: The work done by a conservative force on a closed path (returning to the exact starting position) is strictly zero.
        
        Why the other choices fail: It does positive work on the way down and negative on the way up, perfectly cancelling out over a full cycle.

  - id: em-q16
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Interpreting potential energy graphs."
    prerequisiteObjectiveIds: [physics-potential-energy-conservation]
    extensionObjectiveIds: [physics-potential-energy-conservation]
    prompt: |
      On a plot of potential energy $U(x)$ versus position $x$, how can the force exerted on the object be determined?
    choices:
      - id: a
        text: 'Force is the area under the curve.'
      - id: b
        text: 'Force is the negative slope of the curve.'
      - id: c
        text: 'Force is the positive slope of the curve.'
      - id: d
        text: 'Force is the y-intercept of the curve.'
    answer:
      choiceId: b
    explanation: |
        Solution: The relationship between conservative force and potential energy is $F = -dU/dx$.
        
        Why it works: The object is pushed "downhill" toward lower potential energy. The derivative (slope) gives the rate of change, and the negative sign indicates the force points toward lower $U$.
        
        Why the other choices fail: Area under $U(x)$ has no standard physical meaning. Positive slope would mean objects are naturally pushed toward higher energy states.

  - id: em-q17
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Spring potential energy non-linearity."
    prerequisiteObjectiveIds: [physics-potential-energy-conservation]
    extensionObjectiveIds: [physics-potential-energy-conservation]
    prompt: |
      If a spring is stretched twice as far from its equilibrium position, what happens to the potential energy stored in it?
    choices:
      - id: a
        text: 'It doubles.'
      - id: b
        text: 'It quadruples.'
      - id: c
        text: 'It halves.'
      - id: d
        text: 'It increases by a factor of 8.'
    answer:
      choiceId: b
    explanation: |
        Solution: The potential energy of an ideal spring is $U = \frac{1}{2}kx^2$.
        
        Why it works: Because $x$ is squared, doubling $x$ leads to a $(2)^2 = 4$ times increase in potential energy.
        
        Why the other choices fail: The force doubles ($F = -kx$), but the energy quadruples.

  - id: em-q18
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Work done by tension in pendulums."
    prerequisiteObjectiveIds: [physics-work-energy]
    extensionObjectiveIds: [physics-work-energy]
    prompt: |
      As a pendulum bob swings through its arc, what is the work done by the tension force in the string?
    choices:
      - id: a
        text: 'Positive work, because it keeps the bob up.'
      - id: b
        text: 'Negative work, because it restricts the motion.'
      - id: c
        text: 'Zero work.'
      - id: d
        text: 'Positive work on the way up, negative on the way down.'
    answer:
      choiceId: c
    explanation: |
        Solution: Work is $\vec{F} \cdot \vec{d}$.
        
        Why it works: The tension force is directed along the string, toward the pivot. The displacement of the bob is along the circular arc, which is tangent to the path. Therefore, tension is always perpendicular to velocity, doing zero work.
        
        Why the other choices fail: A force perpendicular to motion cannot do work or change the object's kinetic energy.

  - id: em-q19
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Explosions and momentum conservation."
    prerequisiteObjectiveIds: [physics-momentum-collisions]
    extensionObjectiveIds: [physics-momentum-collisions]
    prompt: |
      A stationary firework explodes into three pieces. If the momentum vectors of two pieces are known, can the momentum vector of the third piece be determined?
    choices:
      - id: a
        text: 'Yes, it must be equal and opposite to the sum of the other two.'
      - id: b
        text: 'Yes, it must be exactly zero.'
      - id: c
        text: 'No, because explosions don''t conserve momentum.'
      - id: d
        text: 'No, kinetic energy must also be known.'
    answer:
      choiceId: a
    explanation: |
        Solution: The initial momentum of the system is zero.
        
        Why it works: Because internal forces cause the explosion, total momentum is conserved: $\vec{p}_1 + \vec{p}_2 + \vec{p}_3 = 0$. Thus, $\vec{p}_3 = -(\vec{p}_1 + \vec{p}_2)$.
        
        Why the other choices fail: Explosions strictly conserve momentum. Kinetic energy is not conserved (it vastly increases), but we don't need it to find the final momentum vector.

  - id: em-q20
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Identifying isolated systems."
    prerequisiteObjectiveIds: [physics-momentum-collisions]
    extensionObjectiveIds: [physics-momentum-collisions]
    prompt: |
      A block slides across a frictionless floor and hits a spring attached to a wall. If the system is defined as "Block + Spring", is the momentum of this system conserved during the collision?
    choices:
      - id: a
        text: 'Yes, because it is an elastic collision.'
      - id: b
        text: 'Yes, because there is no friction.'
      - id: c
        text: 'No, because the wall exerts an external force on the spring.'
      - id: d
        text: 'No, because potential energy is changing.'
    answer:
      choiceId: c
    explanation: |
        Solution: Momentum is conserved only when net external force is zero.
        
        Why it works: The wall is attached to the Earth (external to the defined system). As the spring compresses, the wall pushes back on the spring. This external force changes the system's momentum.
        
        Why the other choices fail: The collision is elastic (energy is conserved), but the wall provides an external impulse, reversing the block's momentum.
