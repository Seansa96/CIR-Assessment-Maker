schemaVersion: 1
id: linear-algebra-systems-easy-test
title: Systems of Equations and RREF Foundations Test
assessmentType: test
categoryId: linear-algebra
topicId: linear-algebra-systems-rref
modeDefault: formalTest
randomizeQuestions: true
attemptQuestionCount: 5
skills:
- Apply linear-algebra concepts
- Apply Systems of Equations and RREF
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - linear-algebra
  - linear-algebra-systems-rref
  - augmented-matrices
  - row-operations
  - echelon-form
  - reduced-row-echelon-form
  - solution-sets
questions:
  - id: test-easy-augmented-matrix
    type: multipleChoice
    prompt: |
      Convert the following augmented matrix back into a system of equations.
      $\begin{bmatrix} 2 & 0 & | & 8 \\ -1 & 4 & | & 3 \end{bmatrix}$
    choices:
      - id: c1
        text: '$2x_1 = 8$ and $-x_1 + 4x_2 = 3$'
      - id: c2
        text: '$2x_1 + x_2 = 8$ and $4x_2 = 3$'
      - id: c3
        text: '$2x_1 + 8x_2 = 0$ and $-x_1 + 3x_2 = 4$'
      - id: c4
        text: '$2x_1 = 0$ and $8x_1 - x_2 + 4x_3 = 3$'
    answer:
      choiceId: c1

  - id: test-easy-row-op
    type: symbolicResponse
    prompt: |
      Apply $R_2 \leftarrow R_2 + R_1$ to the following matrix:
      $\begin{bmatrix} 1 & -2 & 4 \\ -1 & 3 & 0 \end{bmatrix}$
      
      Format your answer as a $2 \times 3$ matrix.
    answer:
      expectedLatex: '\begin{bmatrix} 1 & -2 & 4 \\ 0 & 1 & 4 \end{bmatrix}'
      equivalenceMode: expression
      tolerance: 0
      aliases:
        - '\begin{pmatrix} 1 & -2 & 4 \\ 0 & 1 & 4 \end{pmatrix}'

  - id: test-easy-rref-check
    type: multipleChoice
    prompt: |
      Is the following matrix in Reduced Row Echelon Form (RREF)?
      $\begin{bmatrix} 1 & 0 & 0 & | & 5 \\ 0 & 1 & 2 & | & -1 \\ 0 & 0 & 0 & | & 0 \end{bmatrix}$
    choices:
      - id: c1
        text: 'Yes, it is in RREF.'
      - id: c2
        text: 'No, because there is a 2 in the second row.'
      - id: c3
        text: 'No, because there is a row of all zeros.'
      - id: c4
        text: 'No, because the leading entries are not 1.'
    answer:
      choiceId: c1

  - id: test-easy-free-var-identify
    type: multipleChoice
    prompt: |
      For the matrix in the previous question, which variables are basic and which are free?
    choices:
      - id: c1
        text: '$x_1$ and $x_2$ are basic, $x_3$ is free.'
      - id: c2
        text: '$x_1$ is basic, $x_2$ and $x_3$ are free.'
      - id: c3
        text: 'All variables are basic.'
      - id: c4
        text: 'All variables are free.'
    answer:
      choiceId: c1

  - id: test-easy-extract-solution
    type: multipleChoice
    prompt: |
      What is the solution to the system represented by this RREF matrix?
      $\begin{bmatrix} 1 & 0 & 0 & | & 4 \\ 0 & 1 & 0 & | & -2 \\ 0 & 0 & 1 & | & 9 \end{bmatrix}$
    choices:
      - id: c1
        text: '$x_1 = 4, x_2 = -2, x_3 = 9$'
      - id: c2
        text: '$x_1 = -4, x_2 = 2, x_3 = -9$'
      - id: c3
        text: 'The system has no solution.'
      - id: c4
        text: 'The system has infinitely many solutions.'
    answer:
      choiceId: c1
