questions:
  - { id: q001, type: freeResponse, prompt: 'For Al2(SO4)3(aq)+3BaCl2(aq), write molecular, complete ionic, and net ionic equations.', answer: { gradingMode: selfCheck, keyPoints: ['Al2(SO4)3+3BaCl2→3BaSO4(s)+2AlCl3', '6Cl− and 2Al3+ spectators', 'Ba2+ + SO4 2−→BaSO4(s)'] }, explanation: 'Solution: Al2(SO4)3(aq)+3BaCl2(aq)→3BaSO4(s)+2AlCl3(aq). Split aqueous salts; cancel Al3+ and Cl− to obtain Ba2+(aq)+SO4 2−(aq)→BaSO4(s). Why it works: Balance formula units before splitting, then retain the ions forming the insoluble solid. Common trap: Canceling sulfate or barium because their charges balance.', difficultyDimensions: [modelOrDerivation, representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Requires balancing, three equation representations, and spectator cancellation.', prerequisiteObjectiveIds: [complete-ionic-equations], extensionObjectiveIds: [spectator-ion-cancellation], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: hard-test-aluminum-barium-three-forms, variationAxes: { scenario: multivalent sulfate reaction, unknown: three equation forms, constraints: coefficient propagation } }
  - { id: q002, type: freeResponse, prompt: 'A clear mixture contains Ca2+, Na+, Cl−, and NO3−. Add one soluble reagent that will form a precipitate, and write the net ionic equation.', answer: { gradingMode: selfCheck, keyPoints: ['Na2CO3 or another soluble carbonate source', 'Ca2+ + CO3 2−→CaCO3(s)'] }, explanation: 'Solution: Add soluble Na2CO3; it supplies CO3 2− and gives Ca2+(aq)+CO3 2−(aq)→CaCO3(s). Why it works: Carbonate is a solubility branch that removes calcium as an insoluble solid. Common trap: Adding NaCl, which only adds a spectator already present.', difficultyDimensions: [counterexampleOrConstruction, modelOrDerivation, representationTransfer], difficultyEvidence: 'Constructs a reagent choice from an ion inventory and predicts the resulting net equation.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: hard-test-design-precipitation-reagent, variationAxes: { scenario: unknown mixture, unknown: reagent and equation, methodBranch: construction } }
  - { id: q003, type: freeResponse, prompt: 'A student labels a cloudy mixture from AgNO3 and NaCl “AgNO3(s).” Diagnose using ions and solubility.', answer: { gradingMode: selfCheck, keyPoints: ['AgCl(s) is precipitate', 'NO3− remains soluble spectator', 'Ag+ + Cl−→AgCl(s)'] }, explanation: 'Solution: The solid is AgCl(s), not AgNO3(s); nitrate remains a soluble spectator. The net ionic equation is Ag++Cl−→AgCl(s). Why it works: The precipitate must be formed from the ion pair with low solubility. Common trap: Naming the reactant containing the visible metal ion.', difficultyDimensions: [errorDiagnosis, representationTransfer, proofJustification], difficultyEvidence: 'Uses ion inventory and solubility evidence to correct a false product identification.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], extensionObjectiveIds: [spectator-ion-cancellation], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: hard-test-incorrect-solid-identification, variationAxes: { scenario: cloudy observation, unknown: identity and rationale, methodBranch: diagnosis } }
  - { id: q004, type: freeResponse, prompt: 'Explain why Na2CO3(aq)+2HCl(aq) has a net reaction even though all initial compounds are soluble. Give the net ionic equation.', answer: { gradingMode: selfCheck, keyPoints: ['CO3 2− + 2H+→CO2(g)+H2O(l)', 'gas and water drive change'] }, explanation: 'Solution: CO3 2−(aq)+2H+(aq)→CO2(g)+H2O(l). Why it works: Acid converts carbonate into a gas and liquid water, so ions do not remain unchanged. Common trap: Applying only the precipitation branch and declaring no reaction.', difficultyDimensions: [casePartition, modelOrDerivation, representationTransfer], difficultyEvidence: 'Selects the gas-forming branch rather than the precipitation-only rule and writes its ionic form.', prerequisiteObjectiveIds: [net-ionic-equations], extensionObjectiveIds: [acid-base-reaction-models], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0410], reasoningSignature: hard-test-carbonate-acid-gas, variationAxes: { scenario: acid-carbonate, methodBranch: gas formation, unknown: net equation } }
  - { id: q005, type: freeResponse, prompt: 'Two possible equations are proposed for NH4Cl(aq)+NaOH(aq): NH4+ + OH−→NH3+H2O or no reaction. Select and justify.', answer: { gradingMode: selfCheck, keyPoints: ['NH4+ + OH−→NH3 + H2O', 'weak base/gas-like ammonia product', 'not all ions spectators'] }, explanation: 'Solution: Use NH4+(aq)+OH−(aq)→NH3(aq)+H2O(l). Why it works: Hydroxide removes a proton from ammonium, producing weak molecular ammonia and water. Common trap: Calling it no reaction solely because sodium and chloride are spectators.', difficultyDimensions: [casePartition, modelOrDerivation, proofJustification], difficultyEvidence: 'Distinguishes a weak-molecular-product branch from a no-change mixture.', prerequisiteObjectiveIds: [net-ionic-equations], extensionObjectiveIds: [acid-base-reaction-models], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0410], reasoningSignature: hard-test-ammonium-hydroxide-branch, variationAxes: { scenario: ammonium base, methodBranch: acid-base transfer, unknown: net reaction } }
  - { id: q006, type: freeResponse, prompt: 'Given Fe3+(aq), K+(aq), NO3−(aq), and OH−(aq), identify the precipitate and the spectators after precipitation.', answer: { gradingMode: selfCheck, keyPoints: ['Fe(OH)3(s)', 'K+ and NO3− spectators', 'Fe3+ + 3OH−→Fe(OH)3(s)'] }, explanation: 'Solution: Fe3+(aq)+3OH−(aq)→Fe(OH)3(s); K+ and NO3− remain spectators. Why it works: Three hydroxides are required to neutralize Fe3+, and the hydroxide is insoluble. Common trap: Writing FeOH3 without parentheses or canceling hydroxide.', difficultyDimensions: [identityConstruction, representationTransfer, casePartition], difficultyEvidence: 'Builds formula from charge, identifies phase, and partitions spectators.', prerequisiteObjectiveIds: [net-ionic-equations], extensionObjectiveIds: [spectator-ion-cancellation], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: hard-test-ferric-hydroxide-spectators, variationAxes: { scenario: multivalent hydroxide, unknown: precipitate and spectators, governingRelation: charge balance } }
  - { id: q007, type: freeResponse, prompt: 'Why is it invalid to cancel 2Cl− on one side against Cl2(g) on the other?', answer: { gradingMode: selfCheck, keyPoints: ['not identical species', 'different chemical identity and phase', 'only unchanged identical terms cancel'] }, explanation: 'Solution: Do not cancel them: Cl−(aq) and Cl2(g) differ in charge, bonding, and phase. Why it works: Spectator cancellation requires exactly the same species on both sides. Common trap: Canceling based on an element symbol alone.', difficultyDimensions: [errorDiagnosis, domainCondition, proofJustification], difficultyEvidence: 'Applies the strict identity condition for algebra-like cancellation to chemical species.', prerequisiteObjectiveIds: [spectator-ion-cancellation], extensionObjectiveIds: [complete-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: hard-test-invalid-species-cancellation, variationAxes: { scenario: cancellation error, unknown: validity rationale, constraints: charge and phase } }
  - { id: q008, type: freeResponse, prompt: 'A mixture is known to leave every ion aqueous, yet its molecular equation has different product pairings. Explain why the complete ionic equation exposes no reaction.', answer: { gradingMode: selfCheck, keyPoints: ['same ions on both sides', 'all cancel', 'molecular partner exchange is bookkeeping'] }, explanation: 'Solution: Splitting all soluble electrolytes yields the identical set of aqueous ions on both sides, so all terms cancel and no net reaction remains. Why it works: Complete ionic notation tests for actual particle-level change. Common trap: Treating changed compound names as changed particles.', difficultyDimensions: [representationTransfer, globalLocalReasoning, proofJustification], difficultyEvidence: 'Transfers molecular bookkeeping to particle inventory and justifies all-cancellation conclusion.', prerequisiteObjectiveIds: [complete-ionic-equations], extensionObjectiveIds: [spectator-ion-cancellation], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: hard-test-partner-exchange-no-change, variationAxes: { representation: molecular to particle inventory, unknown: no-reaction justification, methodBranch: cancellation } }
  - { id: q009, type: freeResponse, prompt: 'Write and balance the net ionic equation for phosphoric acid reacting with enough hydroxide to remove all three acidic protons.', answer: { gradingMode: selfCheck, keyPoints: ['H3PO4 + 3OH−→PO4 3− + 3H2O', 'weak acid retained intact on reactant side'] }, explanation: 'Solution: H3PO4(aq)+3OH−(aq)→PO4 3−(aq)+3H2O(l). Why it works: Each hydroxide removes one acidic proton; weak phosphoric acid is retained as a molecular reactant in the ionic representation. Common trap: Writing three separate unbalanced H+ ions for a weak acid.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, domainCondition], difficultyEvidence: 'Models stepwise neutralization, balances a polyprotic transfer, and applies weak-acid notation condition.', prerequisiteObjectiveIds: [net-ionic-equations], extensionObjectiveIds: [acid-base-reaction-models], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0410], reasoningSignature: hard-test-polyprotic-neutralization, variationAxes: { scenario: polyprotic acid, methodBranch: complete neutralization, unknown: balanced net ionic } }
  - { id: q010, type: freeResponse, prompt: 'Construct a counterexample to “all chlorides precipitate” using a soluble chloride and explain the exception pattern.', answer: { gradingMode: selfCheck, keyPoints: ['NaCl or KCl stays aqueous', 'most chlorides soluble', 'exceptions include Ag+ Pb2+ Hg2 2+'] }, explanation: 'Solution: NaCl(aq) is a counterexample because it remains soluble. Why it works: Most chlorides are soluble; Ag+, Pb2+, and Hg2 2+ are familiar exceptions. Common trap: Generalizing from AgCl to every chloride.', difficultyDimensions: [counterexampleOrConstruction, proofJustification, casePartition], difficultyEvidence: 'Refutes an absolute solubility claim using a constructed example and exception classification.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: hard-test-chloride-rule-counterexample, variationAxes: { scenario: false generalization, unknown: counterexample and rule, methodBranch: construction } }
  - { id: q011, type: freeResponse, prompt: 'Predict products and write the net ionic equation for 2HCl(aq)+Na2S(aq).', answer: { gradingMode: selfCheck, keyPoints: ['H2S(g)+2NaCl(aq)', 'S2−+2H+→H2S(g)'] }, explanation: 'Solution: 2HCl(aq)+Na2S(aq)→H2S(g)+2NaCl(aq); net ionic: S2−(aq)+2H+(aq)→H2S(g). Why it works: Acid protonates sulfide to a molecular gas, while sodium and chloride remain spectators. Common trap: Predicting a sulfide precipitate instead of gas-forming acid reaction.', difficultyDimensions: [casePartition, representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Selects gas formation, balances proton transfer, and removes spectators.', prerequisiteObjectiveIds: [net-ionic-equations], extensionObjectiveIds: [acid-base-reaction-models], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0410], reasoningSignature: hard-test-sulfide-acid-gas, variationAxes: { scenario: acid-sulfide, methodBranch: gas evolution, unknown: molecular and net equation } }
  - { id: q012, type: freeResponse, prompt: 'A precipitate is filtered from a mixture of AgNO3 and NaCl. Which ions should be detected in the filtrate if Ag+ was in excess? Explain.', answer: { gradingMode: selfCheck, keyPoints: ['excess Ag+', 'Na+', 'NO3−', 'little or no Cl− ideally'] }, explanation: 'Solution: The filtrate contains Na+, NO3−, and excess Ag+; chloride was limiting and incorporated into AgCl(s). Why it works: Spectators remain dissolved and an excess reactive ion remains after limiting chloride is consumed. Common trap: Saying every initial ion must be in the filtrate.', difficultyDimensions: [modelOrDerivation, casePartition, globalLocalReasoning], difficultyEvidence: 'Uses limiting-reagent logic and phase separation to infer post-reaction composition.', prerequisiteObjectiveIds: [spectator-ion-cancellation], extensionObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: hard-test-filtrate-after-precipitation, variationAxes: { scenario: filtration after reaction, unknown: remaining ion inventory, constraints: excess reactant } }
  - { id: q013, type: freeResponse, prompt: 'Explain why charge balance alone cannot decide whether CaSO4 forms a precipitate from Ca2+ and SO4 2−.', answer: { gradingMode: selfCheck, keyPoints: ['charge balance gives formula only', 'solubility rule or Ksp information decides phase', 'CaSO4 solubility is conditional'] }, explanation: 'Solution: Charge balance identifies the neutral formula CaSO4, but solubility information is needed to decide whether it precipitates under the stated concentrations. Why it works: Formula construction and phase prediction are separate steps. Common trap: Treating a neutral formula as automatic evidence for a solid.', difficultyDimensions: [modelOrDerivation, domainCondition, proofJustification], difficultyEvidence: 'Separates chemical formula logic from solubility-model conditions.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], extensionObjectiveIds: [equilibrium-solubility], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: hard-test-formula-versus-phase-decision, variationAxes: { scenario: borderline sulfate, unknown: required decision information, constraints: conditional solubility } }
  - { id: q014, type: freeResponse, prompt: 'A complete ionic equation has equal numbers of Na+ and NO3− on both sides. Why may they be canceled as separate ions rather than as NaNO3?', answer: { gradingMode: selfCheck, keyPoints: ['they exist as independent aqueous ions', 'each identical ion cancels', 'NaNO3 formula unit is not present intact'] }, explanation: 'Solution: Cancel Na+(aq) and NO3−(aq) separately because aqueous NaNO3 is represented as independent ions. Why it works: The complete ionic equation describes actual dissolved particles, not arbitrary formula pairings. Common trap: Recombining spectators before cancellation.', difficultyDimensions: [representationTransfer, errorDiagnosis, proofJustification], difficultyEvidence: 'Uses particle representation to justify the permitted cancellation operation.', prerequisiteObjectiveIds: [complete-ionic-equations], extensionObjectiveIds: [spectator-ion-cancellation], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: hard-test-separate-spectator-cancellation, variationAxes: { representation: formula versus ions, unknown: cancellation rationale, methodBranch: particle model } }
  - { id: q015, type: freeResponse, prompt: 'Write the net ionic equation for Fe2+(aq) reacting with OH−(aq), including the necessary coefficient and product phase.', answer: { gradingMode: selfCheck, keyPoints: ['Fe2+ + 2OH−→Fe(OH)2(s)'] }, explanation: 'Solution: Fe2+(aq)+2OH−(aq)→Fe(OH)2(s). Why it works: Two hydroxides balance Fe2+ and iron(II) hydroxide is insoluble. Common trap: Writing FeOH2 or omitting the coefficient.', difficultyDimensions: [identityConstruction, representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Constructs correct polyatomic-ion formula, balances charge, and assigns precipitate phase.', prerequisiteObjectiveIds: [net-ionic-equations], extensionObjectiveIds: [aqueous-reaction-prediction], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: hard-test-ferrous-hydroxide-net, variationAxes: { scenario: divalent hydroxide, unknown: balanced net equation, governingRelation: charge balance } }
  - { id: q016, type: freeResponse, prompt: 'A reaction mixture becomes cloudy only after adding a second reagent. Explain why the first solution can contain both ions needed for a solid without precipitating.', answer: { gradingMode: selfCheck, keyPoints: ['ions may be below solubility threshold or missing counterion', 'concentration/ion product condition', 'second reagent changes conditions'] }, explanation: 'Solution: A solid forms only when the solution’s conditions favor precipitation; adding the second reagent can raise the relevant ion concentrations or supply the missing partner. Why it works: Solubility is conditional on the mixture, not on a formula name alone. Common trap: Assuming any ion pair instantly makes a solid at every concentration.', difficultyDimensions: [domainCondition, modelOrDerivation, globalLocalReasoning], difficultyEvidence: 'Explains a concentration-dependent phase change from system conditions.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], extensionObjectiveIds: [equilibrium-solubility], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: hard-test-conditional-precipitation, variationAxes: { scenario: delayed cloudiness, unknown: causal model, constraints: concentration condition } }
  - { id: q017, type: freeResponse, prompt: 'For Na2CO3(aq)+CaCl2(aq), explain why Na+ and Cl− cannot appear in the final net ionic equation even though their atom counts are conserved.', answer: { gradingMode: selfCheck, keyPoints: ['spectators unchanged', 'net ionic displays chemical change', 'Ca2+ and carbonate form solid'] }, explanation: 'Solution: Na+ and Cl− are conserved but unchanged, so they cancel; the net ionic equation is Ca2++CO3 2−→CaCO3(s). Why it works: Net ionic equations omit conserved spectator particles to isolate the reaction. Common trap: Keeping all conserved atoms in a net equation.', difficultyDimensions: [representationTransfer, proofJustification, errorDiagnosis], difficultyEvidence: 'Distinguishes atom conservation from chemical-change representation.', prerequisiteObjectiveIds: [spectator-ion-cancellation], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: hard-test-conservation-versus-net-equation, variationAxes: { scenario: calcium carbonate, unknown: rationale for omission, representation: molecular versus net } }
  - { id: q018, type: freeResponse, prompt: 'Given a molecular equation with a precipitate, outline the ordered procedure for obtaining a net ionic equation.', answer: { gradingMode: selfCheck, keyPoints: ['balance molecular and phases', 'split strong aqueous electrolytes', 'keep solids/liquids/gases/weak species intact', 'cancel identical spectators'] }, explanation: 'Solution: Balance and assign phases; split strong aqueous electrolytes; retain solids, liquids, gases, and weak electrolytes; cancel identical aqueous spectators. Why it works: Each step preserves conservation while progressively removes unchanged particles. Common trap: Splitting a solid or canceling before balancing.', difficultyDimensions: [modelOrDerivation, proofJustification, errorDiagnosis], difficultyEvidence: 'Organizes the full procedure, its conditions, and common ordering failures.', prerequisiteObjectiveIds: [complete-ionic-equations], extensionObjectiveIds: [spectator-ion-cancellation], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: hard-test-net-ionic-procedure, variationAxes: { scenario: general algorithm, unknown: ordered method, methodBranch: procedure synthesis } }
  - { id: q019, type: freeResponse, prompt: 'Why does H+(aq)+OH−(aq)→H2O(l) contain no spectator ions even if it originated from HNO3 and KOH?', answer: { gradingMode: selfCheck, keyPoints: ['H+ and OH− change to water', 'K+ and NO3− were canceled', 'net equation retains only reacting species'] }, explanation: 'Solution: H+ and OH− are retained because they become H2O(l); K+ and NO3− are the spectators removed from the complete ionic equation. Why it works: Spectator status depends on remaining unchanged, not on being an ion. Common trap: Calling H+ a spectator because it began as an ion.', difficultyDimensions: [representationTransfer, casePartition, proofJustification], difficultyEvidence: 'Classifies ions based on transformation and explains reduction from molecular to net form.', prerequisiteObjectiveIds: [spectator-ion-cancellation], extensionObjectiveIds: [acid-base-reaction-models], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0410], reasoningSignature: hard-test-neutralization-spectator-classification, variationAxes: { scenario: acid-base origin, unknown: retained-versus-canceled ions, representation: molecular to net } }
  - { id: q020, type: freeResponse, prompt: 'Construct two aqueous reactant salts whose mixing produces CaCO3(s), then write the net ionic equation and name a pair of spectator ions.', answer: { gradingMode: selfCheck, keyPoints: ['example CaCl2 and Na2CO3', 'Ca2+ + CO3 2−→CaCO3(s)', 'Na+ and Cl− spectators'] }, explanation: 'Solution: One example is CaCl2(aq)+Na2CO3(aq). Its net ionic equation is Ca2+(aq)+CO3 2−(aq)→CaCO3(s), with Na+ and Cl− as spectators. Why it works: The chosen soluble sources deliver the ions that form insoluble calcium carbonate. Common trap: Choosing CaCO3 itself as a soluble reactant.', difficultyDimensions: [counterexampleOrConstruction, representationTransfer, modelOrDerivation], difficultyEvidence: 'Constructs a valid source pair then derives net chemistry and spectator identities.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], extensionObjectiveIds: [spectator-ion-cancellation], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: hard-test-construct-carbonate-precipitation, variationAxes: { scenario: construct reaction, unknown: sources net equation spectators, methodBranch: construction } }
