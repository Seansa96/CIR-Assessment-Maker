    - id: t1
      term: Electric Potential
      definition: The electric potential energy per unit charge at a given point.
      drills:
      - id: t1-drill
        type: flashcard
        prompt: What does Electric Potential mean?
        answer:
          expected: The electric potential energy per unit charge at a given point.
        explanation: 'Solution:


          The electric potential energy per unit charge at a given point.


          Why it works:


          This definition identifies the essential meaning of Electric Potential.'
        tags: []
    - id: t2
      term: Equipotential Surface
      definition: A surface over which the electric potential is completely constant.
      drills:
      - id: t2-drill
        type: flashcard
        prompt: What does Equipotential Surface mean?
        answer:
          expected: A surface over which the electric potential is completely constant.
        explanation: 'Solution:


          A surface over which the electric potential is completely constant.


          Why it works:


          This definition identifies the essential meaning of Equipotential Surface.'
        tags: []
    - id: t3
      term: Electron-Volt
      definition: A unit of energy equal to the work done on an electron in accelerating it through a
        potential difference of one volt ($1\text{ eV} = 1.6 \times 10^{-19}\text{ J}$).
      drills:
