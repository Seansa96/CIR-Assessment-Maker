navigation: { learningGoal: practice, activityType: focusedPractice, tags: [calculus-2, separable-equations, differential-equations] }
questions:
- id: q001
  type: symbolicResponse
  skills: [solve separable IVPs]
  prompt: Solve $y'=x/y$ subject to $y(0)=2$, choosing the positive branch.
  answer: { expectedLatex: 'sqrt(x^2+4)', equivalenceMode: expression, tolerance: 0.000001, variables: [x], explanation: Integrating $y\,dy=x\,dx$ gives $y^2=x^2+4$, and the initial value selects the positive root. }
- id: q002
  type: numericResponse
  skills: [preserve equilibrium solutions]
  prompt: How many constant solutions does $y'=y(y-2)(y+1)$ have?
  answer: { value: 3, tolerance: 0.001 }
  explanation: Each distinct root of the right side gives an equilibrium.
- id: q003
  type: symbolicResponse
  skills: [model mixtures]
  prompt: A constant-volume 60-gal tank receives pure water while well-stirred solution leaves at 3 gal/min. Enter $dS/dt$ in terms of salt amount $S$.
  answer: { expectedLatex: '-S/20', equivalenceMode: expression, tolerance: 0.000001, variables: [S], explanation: $S'=-(S/60)(3)=-S/20$. }
- id: q004
  type: numericResponse
  skills: [model mixtures]
  prompt: In the preceding tank, $S(0)=30$ lb. What is $S(20)$ in pounds?
  answer: { value: 11.036383, tolerance: 0.111 }
  explanation: $S=30e^{-t/20}$, hence $S(20)=30/e$.
- id: q005
  type: numericResponse
  skills: [solve separable IVPs]
  prompt: For $y'=y(4-y)$, is $y'=y(4-y)$ positive or negative at $y=6$? Enter 1 for positive and -1 for negative.
  answer: { value: -1, tolerance: 0.001 }
  explanation: $6(4-6)$ is negative, so solutions decrease there.
