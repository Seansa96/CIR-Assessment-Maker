questions:
- id: q001
  type: multipleChoice
  prompt: What is the correct negation of the statement 'All continuous functions are differentiable'?
  choices:
  - id: a
    text: There exists a continuous function that is not differentiable.
  - id: b
    text: No continuous functions are differentiable.
    issueSignals:
    - id: logical-negation-error
  - id: c
    text: All continuous functions are not differentiable.
    issueSignals:
    - id: logical-negation-error
  - id: d
    text: There exists a differentiable function that is not continuous.
    issueSignals:
    - id: mathematical-translation-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-negation-error
  difficultyDimensions:
  - representationTransfer
  - logicalNegation
  difficultyEvidence: Negates a universal affirmative statement into an existential negative statement.
  explanation: |-
    Solution: There exists a continuous function that is not differentiable.
    Why it works: The negation of 'For all $x$, $P(x)$' is 'There exists an $x$ such that not $P(x)$'. To disprove that *all* of them have the property, you only need to find *one* that doesn't.
    Why the other choices fail: B and C over-negate by claiming that *none* of the functions have the property, which is a much stronger claim than necessary. D swaps the roles of the properties.
- id: q002
  type: multipleChoice
  prompt: How would you translate 'There is an even prime number' into formal logic, where $E(x)$ means '$x$ is
    even' and $P(x)$ means '$x$ is prime'?
  choices:
  - id: a
    text: '$\exists x \ (E(x) \land P(x))$'
  - id: b
    text: '$\exists x \ (E(x) \implies P(x))$'
    issueSignals:
    - id: logical-translation-error
  - id: c
    text: '$\forall x \ (E(x) \implies P(x))$'
    issueSignals:
    - id: quantifier-scope-error
  - id: d
    text: '$\exists x \ E(x) \land \exists y \ P(y)$'
    issueSignals:
    - id: logical-translation-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-translation-error
  difficultyDimensions:
  - representationTransfer
  - variableBinding
  difficultyEvidence: Translates an existential claim with two intersecting properties into a conjunction.
  explanation: |-
    Solution: $\\exists x \\ (E(x) \\land P(x))$
    Why it works: 'There is' translates to the existential quantifier $\\exists$. For a single number to be both even and prime, we use the logical AND ($\\land$) to connect the two properties applied to the same variable.
    Why the other choices fail: B creates a vacuous truth if you pick an odd number (since $E(x)$ would be false). C makes a universal claim. D asserts that an even number exists and a prime number exists, but they don't have to be the same number.
- id: q003
  type: multipleChoice
  prompt: 'What is the correct negation of ''$\exists x \in \mathbb{R}, f(x) = 0$''?'
  choices:
  - id: a
    text: '$\forall x \in \mathbb{R}, f(x) \neq 0$'
  - id: b
    text: '$\exists x \in \mathbb{R}, f(x) \neq 0$'
    issueSignals:
    - id: logical-negation-error
  - id: c
    text: '$\forall x \notin \mathbb{R}, f(x) = 0$'
    issueSignals:
    - id: logical-negation-error
  - id: d
    text: '$\forall x \in \mathbb{R}, f(x) = 0$'
    issueSignals:
    - id: logical-negation-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-negation-error
  difficultyDimensions:
  - representationTransfer
  - logicalNegation
  difficultyEvidence: Applies De Morgan's laws for quantifiers to negate an existential statement.
  explanation: |-
    Solution: $\\forall x \\in \\mathbb{R}, f(x) \\neq 0$
    Why it works: The negation of 'there exists an $x$ such that $P(x)$' is 'for all $x$, not $P(x)$'. The domain ($\\in \\mathbb{R}$) remains unchanged when negating.
    Why the other choices fail: B fails to change the quantifier. C incorrectly negates the domain condition. D changes the quantifier but fails to negate the predicate.
- id: q004
  type: multipleChoice
  prompt: Which statement makes the strongest claim?
  choices:
  - id: a
    text: There is a single key that opens every door.
  - id: b
    text: Every door has a key that opens it.
    issueSignals:
    - id: quantifier-scope-error
  - id: c
    text: Both statements make exactly the same claim.
    issueSignals:
    - id: quantifier-scope-error
  - id: d
    text: Neither statement implies the other.
    issueSignals:
    - id: quantifier-scope-error
  answer:
    choiceId: a
  issueSignals:
  - id: quantifier-scope-error
  difficultyDimensions:
  - representationTransfer
  - quantifierScope
  difficultyEvidence: 'Distinguishes between $\exists x \forall y$ and $\forall y \exists x$ quantifier orderings.'
  explanation: |-
    Solution: There is a single key that opens every door.
    Why it works: 'There is a single key that opens every door' ($\\exists k \\forall d$) means one universal master key exists. 'Every door has a key' ($\\forall d \\exists k$) allows each door to have a different, unique key. The first claim is much stronger.
    Why the other choices fail: B is the weaker claim, allowing multiple different keys. C and D fail to recognize that the first statement strictly implies the second, but not vice-versa.
