- id: r001
  type: typed
  prompt: Define electronegativity and name the representation in which it is used.
  answer:
    expected: An atom's tendency to attract shared electron density in a bond.
    aliases:
    - electronegativity
  explanation: 'Solution: An atom''s tendency to attract shared electron density in a bond. Why it works: The definition identifies
    the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r002
  type: typed
  prompt: What does bond dipole tell you to count or distinguish?
  answer:
    expected: A vector pointing toward the more electronegative end of a polar bond.
    aliases:
    - bond dipole
  explanation: 'Solution: A vector pointing toward the more electronegative end of a polar bond. Why it works: The definition
    identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r003
  type: typed
  prompt: State one condition that must be checked when using partial charge.
  answer:
    expected: A nonintegral charge label indicating unequal sharing rather than complete electron transfer.
    aliases:
    - partial charge
  explanation: 'Solution: A nonintegral charge label indicating unequal sharing rather than complete electron transfer. Why
    it works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r004
  type: typed
  prompt: Connect dipole moment to an observable or particle-level consequence.
  answer:
    expected: A quantitative measure of charge separation with both magnitude and direction.
    aliases:
    - dipole moment
  explanation: 'Solution: A quantitative measure of charge separation with both magnitude and direction. Why it works: The
    definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r005
  type: typed
  prompt: Define molecular dipole and name the representation in which it is used.
  answer:
    expected: The vector sum of all bond dipoles and relevant lone-pair contributions in a molecule.
    aliases:
    - molecular dipole
  explanation: 'Solution: The vector sum of all bond dipoles and relevant lone-pair contributions in a molecule. Why it works:
    The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r006
  type: typed
  prompt: What does molecular polarity tell you to count or distinguish?
  answer:
    expected: A nonzero separation of charge across an entire molecule.
    aliases:
    - molecular polarity
  explanation: 'Solution: A nonzero separation of charge across an entire molecule. Why it works: The definition identifies
    the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r007
  type: typed
  prompt: State one condition that must be checked when using dipole cancellation.
  answer:
    expected: A zero vector sum produced by equal bond dipoles arranged symmetrically.
    aliases:
    - dipole cancellation
  explanation: 'Solution: A zero vector sum produced by equal bond dipoles arranged symmetrically. Why it works: The definition
    identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r008
  type: typed
  prompt: Connect symmetry to an observable or particle-level consequence.
  answer:
    expected: A spatial relationship that can make equal bond-dipole vectors cancel.
    aliases:
    - symmetry
  explanation: 'Solution: A spatial relationship that can make equal bond-dipole vectors cancel. Why it works: The definition
    identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r009
  type: typed
  prompt: Define local polarity and name the representation in which it is used.
  answer:
    expected: Unequal electron sharing in a particular bond or local structural region.
    aliases:
    - local polarity
  explanation: 'Solution: Unequal electron sharing in a particular bond or local structural region. Why it works: The definition
    identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r010
  type: typed
  prompt: What does bonding continuum tell you to count or distinguish?
  answer:
    expected: The recognition that real bonds can have intermediate ionic and covalent character.
    aliases:
    - bonding continuum
  explanation: 'Solution: The recognition that real bonds can have intermediate ionic and covalent character. Why it works:
    The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r011
  type: typed
  prompt: State one condition that must be checked when using polar covalent bond.
  answer:
    expected: A covalent bond in which unequal sharing creates partial positive and partial negative ends.
    aliases:
    - polar covalent bond
  explanation: 'Solution: A covalent bond in which unequal sharing creates partial positive and partial negative ends. Why
    it works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r012
  type: typed
  prompt: Connect nonpolar covalent bond to an observable or particle-level consequence.
  answer:
    expected: A covalent bond with equal or nearly equal sharing and no meaningful bond dipole.
    aliases:
    - nonpolar covalent bond
  explanation: 'Solution: A covalent bond with equal or nearly equal sharing and no meaningful bond dipole. Why it works:
    The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
