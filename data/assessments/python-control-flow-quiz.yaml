questions:
- id: q001
  type: multipleChoice
  prompt: "Examine the following code:\n\n```python\nplayer_health = 40\n\nif player_health\
    \ < 50:\n    print(\"Drink a potion!\")\nelif player_health < 100:\n    print(\"\
    You are healthy enough.\")\nelse:\n    print(\"You are at max health.\")\n```\n\
    \nWhat is the output?\n"
  choices:
  - id: a
    text: '`Drink a potion!`'
  - id: b
    text: '`You are healthy enough.`'
  - id: c
    text: '`Drink a potion!`

      `You are healthy enough.`

      '
  - id: d
    text: '`You are at max health.`'
  answer:
    choiceId: a
  explanation: '`40 < 50` is True, so the first block runs. Once an `if` block executes,
    Python skips all the subsequent `elif` blocks attached to it.

    '
- id: q002
  type: multipleChoice
  prompt: 'Which of the following conditions correctly checks if a player is level
    10 or higher, AND has the "boss_key"?

    '
  choices:
  - id: a
    text: '`if level >= 10 and has_boss_key:`'
  - id: b
    text: '`if level > 10 or has_boss_key == True:`'
  - id: c
    text: '`if level >= 10 or has_boss_key:`'
  - id: d
    text: '`if level > 10 and has_boss_key == False:`'
  answer:
    choiceId: a
  explanation: '`>=` is "greater than or equal to". The `and` operator ensures both
    conditions must be true. Checking `has_boss_key` directly is the same as `has_boss_key
    == True`.

    '
- id: q003
  type: multipleChoice
  prompt: "What will be printed by this code?\n\n```python\naction = \"defend\"\n\n\
    match action:\n    case \"attack\":\n        print(\"Attacking!\")\n    case \"\
    run\":\n        print(\"Running away!\")\n    case _:\n        print(\"Doing nothing.\"\
    )\n```\n"
  choices:
  - id: a
    text: '`Doing nothing.`'
  - id: b
    text: '`Attacking!`'
  - id: c
    text: '`Running away!`'
  - id: d
    text: An error occurs because "defend" is not a case.
  answer:
    choiceId: a
  explanation: 'Because `"defend"` does not match `"attack"` or `"run"`, it falls
    through to the default wildcard case `_`, printing `"Doing nothing."`.

    '
- id: q004
  type: numericResponse
  prompt: "Trace the code below.\n\n```python\ncombo_points = 2\nhas_buff = True\n\
    \nif combo_points > 1 or not has_buff:\n    combo_points = combo_points + 3\n\n\
    if combo_points > 4 and has_buff:\n    combo_points = combo_points * 2\n```\n\n\
    What is the final value of `combo_points`?\n"
  answer:
    value: 10
    tolerance: 0
  explanation: 'The first `if` is True because `combo_points > 1` (2 > 1) is True.
    (Since it''s an `or`, it doesn''t matter that `not has_buff` is False). `combo_points`
    becomes `5`.

    The second `if` is True because `combo_points > 4` (5 > 4) is True, AND `has_buff`
    is True. `combo_points` becomes `10`.

    '
