- id: we2
  title: Field of a Thick Wire
  steps:
  - id: s1
    prompt: Apply Ampere's Law.
    explanation: 'Solution:

      1) Choose a circular Amperian loop of radius $r$. $\oint \vec{B} \cdot d\vec{l} = B(2\pi r)$.

      2) Enclosed current $I_{enc} = I \frac{\pi r^2}{\pi R^2} = I \frac{r^2}{R^2}$.

      3) Apply Ampere''s law: $B(2\pi r) = \mu_0 I \frac{r^2}{R^2}$.

      4) Solve for B: $B = \frac{\mu_0 I r}{2\pi R^2}$.


      Why it works:

      The cylindrical symmetry allows $B$ to be pulled out of the integral, leaving only the circumference
      and the fraction of the total current enclosed.'
    title: Apply Ampere's Law.
    instruction: 'Work through this step: Apply Ampere''s Law.'
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: A solid cylindrical conductor of radius $R$ carries a uniform current $I$ distributed evenly
    across its cross section. Find the magnetic field inside the wire at a distance $r < R$ from the center.
