questions:
  - { id: q001, type: freeResponse, prompt: '75.0 mL 0.150 M AgNO3 reacts with 40.0 mL 0.400 M NaCl. Find limiting ion, moles AgCl, and mass AgCl (143.32 g/mol).', answer: { gradingMode: selfCheck, keyPoints: ['Ag+ 0.01125 mol limiting', '0.01125 mol AgCl', '1.61 g'] }, explanation: 'Solution: Ag+=0.0750×0.150=0.01125 mol; Cl−=0.0400×0.400=0.0160 mol. Ag+ limits 1:1, so AgCl mass=0.01125×143.32=1.61 g. Why it works: Convert both solution quantities to reactive moles, identify the limiting branch, then use product molar mass. Common trap: Choosing chloride because its solution volume is smaller.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, casePartition], difficultyEvidence: 'Uses two M×V paths, limiting comparison, and product mass conversion.', prerequisiteObjectiveIds: [limiting-solution-reagent], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: hard-test-stoich-agcl-full-yield, variationAxes: { scenario: unequal solution mixing, unknown: limit moles mass, methodBranch: limiting yield } }
  - { id: q002, type: freeResponse, prompt: 'Mix 120.0 mL 0.200 M CaCl2 with 50.0 mL 0.300 M Na2CO3. Determine limiting ion and grams CaCO3 (100.09 g/mol).', answer: { gradingMode: selfCheck, keyPoints: ['carbonate 0.0150 mol limiting', '1.50 g CaCO3'] }, explanation: 'Solution: Ca2+=0.1200×0.200=0.0240 mol; CO3 2−=0.0500×0.300=0.0150 mol. Carbonate limits 1:1, producing 0.0150 mol or 1.50 g CaCO3. Why it works: Dissociated reactive ions, not spectator ions, are compared. Common trap: Using chloride moles as the calcium amount.', difficultyDimensions: [representationTransfer, modelOrDerivation, casePartition], difficultyEvidence: 'Extracts ion quantities from salt solutions, selects the limiting branch, and converts yield to mass.', prerequisiteObjectiveIds: [limiting-solution-reagent], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: hard-test-stoich-caco3-full-yield, variationAxes: { scenario: carbonate precipitation, unknown: limit and mass, representation: salts to ions } }
  - { id: q003, type: freeResponse, prompt: 'A technician has 0.0180 mol Ba2+ and wants 5.00 g BaSO4 (233.39 g/mol). Is there enough barium? Explain.', answer: { gradingMode: selfCheck, keyPoints: ['need 0.0214 mol BaSO4', 'not enough Ba2+', 'short by 0.0034 mol'] }, explanation: 'Solution: Required BaSO4 moles=5.00/233.39=0.0214 mol. The 1:1 ratio requires 0.0214 mol Ba2+, more than 0.0180 mol, so it is insufficient by 0.0034 mol. Why it works: Work backward from desired mass through molar mass and the net ionic ratio. Common trap: Comparing grams directly to moles.', difficultyDimensions: [reverseReasoning, auxiliaryTechnique, parameterThreshold], difficultyEvidence: 'Reverses mass-to-moles path and tests inventory against target threshold.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [quantitative-analysis], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: hard-test-stoich-target-baso4-feasibility, variationAxes: { scenario: production target, unknown: feasibility and shortage, methodBranch: reverse design } }
  - { id: q004, type: freeResponse, prompt: 'Find the volume of 0.250 M KI required to precipitate all Pb2+ in 35.0 mL 0.180 M Pb(NO3)2.', answer: { gradingMode: selfCheck, keyPoints: ['0.00630 mol Pb2+', '0.0126 mol I−', '0.0504 L or 50.4 mL KI'] }, explanation: 'Solution: Pb2+=0.0350×0.180=0.00630 mol. Pb2++2I−→PbI2 requires 0.0126 mol I−. V=0.0126/0.250=0.0504 L=50.4 mL. Why it works: The 2:1 coefficient is applied before solving the needed solution volume. Common trap: Using 35.0 mL as though it were moles.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Chains solution moles, non-1:1 ratio, and reverse molarity calculation.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: hard-test-stoich-required-KI-volume, variationAxes: { scenario: reagent design, unknown: required volume, governingRelation: 2:1 ratio } }
  - { id: q005, type: freeResponse, prompt: 'A student uses 0.100 mol Ca2+ and 0.100 mol CO3 2− to predict 20.0 g CaCO3. Diagnose the result using 100.09 g/mol.', answer: { gradingMode: selfCheck, keyPoints: ['10.0 g theoretical', '0.100 mol×100.09', 'student likely mishandled molar mass'] }, explanation: 'Solution: The 1:1 reaction makes 0.100 mol CaCO3, whose mass is 0.100×100.09=10.0 g, not 20.0 g. Why it works: Stoichiometry sets product moles and molar mass sets grams. Common trap: Adding reactant mole amounts or masses to make product mass.', difficultyDimensions: [errorDiagnosis, representationTransfer, proofJustification], difficultyEvidence: 'Audits a claimed yield by independently reconstructing mole and mass conversions.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [quantitative-analysis], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: hard-test-stoich-mass-claim-audit, variationAxes: { scenario: student calculation, unknown: corrected mass and error, methodBranch: diagnosis } }
  - { id: q006, type: freeResponse, prompt: '50.0 mL 0.300 M Fe(NO3)3 and 100.0 mL 0.300 M NaOH react. Find limiting reactant and moles Fe(OH)3.', answer: { gradingMode: selfCheck, keyPoints: ['Fe3+ 0.0150 mol', 'OH− 0.0300 mol', 'OH− limiting', '0.0100 mol Fe(OH)3'] }, explanation: 'Solution: Fe3+=0.0500×0.300=0.0150 mol and OH−=0.1000×0.300=0.0300 mol. Three OH− per Fe3+ are required, so OH− limits; product=0.0300/3=0.0100 mol. Why it works: Compare quantities after applying the 3:1 reaction demand. Common trap: Calling Fe3+ limiting because it has fewer moles.', difficultyDimensions: [modelOrDerivation, casePartition, auxiliaryTechnique], difficultyEvidence: 'Uses non-1:1 limiting analysis and product conversion.', prerequisiteObjectiveIds: [limiting-solution-reagent], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: hard-test-stoich-ferric-hydroxide-limit, variationAxes: { scenario: multivalent hydroxide, unknown: limit and product, methodBranch: coefficient comparison } }
  - { id: q007, type: freeResponse, prompt: 'A filtered AgCl sample has mass 1.60 g from a theoretical 1.45 g. Calculate percent yield and interpret it.', answer: { gradingMode: selfCheck, keyPoints: ['110 percent', 'greater than 100%', 'wet/contaminated sample or error'] }, explanation: 'Solution: Percent yield=(1.60/1.45)×100=110%. A pure dry product cannot exceed theoretical yield, so contamination, retained water, or measurement error is likely. Why it works: Theoretical yield is the stoichiometric upper bound under the model. Common trap: Calling 110% excellent efficiency.', difficultyDimensions: [auxiliaryTechnique, domainCondition, errorDiagnosis], difficultyEvidence: 'Calculates a ratio, applies physical bound condition, and diagnoses anomalous result.', prerequisiteObjectiveIds: [quantitative-analysis], extensionObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: hard-test-stoich-over-100-yield, variationAxes: { scenario: laboratory mass, unknown: percent and interpretation, constraints: physical maximum } }
  - { id: q008, type: freeResponse, prompt: 'Two runs use the same 0.0200 mol Ag+ but different chloride amounts: 0.0150 mol and 0.0400 mol. Compare AgCl yield and remaining chloride.', answer: { gradingMode: selfCheck, keyPoints: ['run 1: 0.0150 mol AgCl, no chloride left', 'run 2: 0.0200 mol AgCl, 0.0200 mol chloride left'] }, explanation: 'Solution: Run 1 has chloride limiting, so it yields 0.0150 mol AgCl. Run 2 has Ag+ limiting, yielding 0.0200 mol AgCl and leaving 0.0200 mol chloride. Why it works: Same reactant amount can occupy different limiting branches when the other reactant changes. Common trap: Assuming equal Ag+ always means equal product.', difficultyDimensions: [casePartition, parameterThreshold, modelOrDerivation], difficultyEvidence: 'Compares two regimes around a limiting threshold and tracks product and residue.', prerequisiteObjectiveIds: [limiting-solution-reagent], extensionObjectiveIds: [quantitative-analysis], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: hard-test-stoich-regime-comparison, variationAxes: { scenario: two experimental runs, unknown: yield and residue, constraints: shifting limiting reagent } }
  - { id: q009, type: freeResponse, prompt: 'Explain why the balanced molecular equation alone is insufficient for determining which volume of Na2CO3 reacts with CaCl2 solution.', answer: { gradingMode: selfCheck, keyPoints: ['coefficients give mole ratio only', 'need molarity/volume to know moles', 'need concentration of Na2CO3'] }, explanation: 'Solution: Coefficients supply the 1:1 mole ratio, but solution volume is found only after relating moles to concentration through V=n/M. Why it works: A stoichiometric equation has no inherent volume scale. Common trap: Applying coefficients directly to milliliters of solutions with different molarities.', difficultyDimensions: [domainCondition, representationTransfer, proofJustification], difficultyEvidence: 'Distinguishes equation mole ratios from concentration-dependent volume calculation.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [limiting-solution-reagent], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: hard-test-stoich-why-concentration-needed, variationAxes: { scenario: volume planning, unknown: information requirement, constraints: different concentrations } }
  - { id: q010, type: freeResponse, prompt: '30.0 mL 0.500 M BaCl2 is mixed with excess sulfate. How many grams BaSO4 form, and what single ion quantity directly controls it?', answer: { gradingMode: selfCheck, keyPoints: ['0.0150 mol Ba2+', '3.50 g BaSO4', 'Ba2+ moles'] }, explanation: 'Solution: Ba2+ moles=(0.0300)(0.500)=0.0150 mol, so BaSO4 mass=0.0150×233.39=3.50 g. Why it works: Excess sulfate makes barium ion moles the controlling limiting amount. Common trap: Using moles of chloride, which is spectator material.', difficultyDimensions: [representationTransfer, modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Identifies reactive ion, maps it through 1:1 precipitation, and converts to mass.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: hard-test-stoich-barium-control-ion, variationAxes: { scenario: excess sulfate yield, unknown: mass and controlling ion, representation: salt to reacting ion } }
  - { id: q011, type: freeResponse, prompt: 'A sample contains enough Na2CO3 to supply 0.0250 mol CO3 2−. What minimum mass CaCl2 (110.98 g/mol) is needed to consume it fully?', answer: { gradingMode: selfCheck, keyPoints: ['0.0250 mol CaCl2', '2.77 g'] }, explanation: 'Solution: Ca2+ and CO3 2− react 1:1, so 0.0250 mol CaCl2 is needed. Mass=0.0250×110.98=2.77 g. Why it works: One CaCl2 formula unit supplies one Ca2+. Common trap: Multiplying needed CaCl2 by two because it contains two chlorides.', difficultyDimensions: [reverseReasoning, representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Works backward from reactive anion amount to salt mass through formula and equation ratios.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: hard-test-stoich-required-salt-mass, variationAxes: { scenario: reagent preparation, unknown: salt mass, methodBranch: reverse mole map } }
  - { id: q012, type: freeResponse, prompt: 'What data would you need to distinguish whether low precipitate mass came from incomplete reaction or product loss?', answer: { gradingMode: selfCheck, keyPoints: ['remaining reactant analysis or filtrate test', 'recovery/transfer records', 'theoretical yield inputs'] }, explanation: 'Solution: Test the filtrate for unreacted limiting species and review transfer/filtration recovery, while checking the theoretical-yield inputs. Why it works: Incomplete reaction leaves reactants; product loss changes recovery after formation. Common trap: Concluding the cause from low mass alone.', difficultyDimensions: [casePartition, errorDiagnosis, modelOrDerivation], difficultyEvidence: 'Separates competing causes and specifies evidence that discriminates them.', prerequisiteObjectiveIds: [quantitative-analysis], extensionObjectiveIds: [limiting-solution-reagent], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: hard-test-stoich-low-yield-diagnosis-plan, variationAxes: { scenario: experimental anomaly, unknown: diagnostic evidence, methodBranch: competing-cause analysis } }
  - { id: q013, type: freeResponse, prompt: 'A student calculates 0.0100 mol PbI2 from 0.0100 mol Pb2+ and 0.0100 mol I−. Correct the yield.', answer: { gradingMode: selfCheck, keyPoints: ['I− limiting', '0.00500 mol PbI2', 'two iodides per product'] }, explanation: 'Solution: I− limits because 0.0100 mol Pb2+ needs 0.0200 mol I−. Product moles are 0.0100/2=0.00500 mol PbI2. Why it works: The coefficient of iodide creates a 2:1 demand. Common trap: Treating every ionic precipitate as 1:1.', difficultyDimensions: [errorDiagnosis, casePartition, auxiliaryTechnique], difficultyEvidence: 'Audits an assumed 1:1 ratio, selects actual limiting branch, and corrects product amount.', prerequisiteObjectiveIds: [limiting-solution-reagent], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: hard-test-stoich-pbi2-ratio-error, variationAxes: { scenario: student yield claim, unknown: corrected yield and limit, methodBranch: error diagnosis } }
  - { id: q014, type: freeResponse, prompt: 'Design a 100.0 mL 0.150 M Na2CO3 aliquot’s calcium source so carbonate is just exhausted. Give required moles CaCl2 and one suitable CaCl2 molarity-volume pair.', answer: { gradingMode: selfCheck, keyPoints: ['0.0150 mol CaCl2', 'example 75.0 mL 0.200 M', '1:1 Ca2+ to carbonate'] }, explanation: 'Solution: Carbonate moles=(0.1000)(0.150)=0.0150 mol, so require 0.0150 mol CaCl2. One suitable source is 75.0 mL of 0.200 M CaCl2 because 0.0750×0.200=0.0150 mol. Why it works: The 1:1 net ionic ratio sets moles, while many M–V pairs can supply them. Common trap: Treating 100.0 mL as the required calcium volume.', difficultyDimensions: [modelOrDerivation, reverseReasoning, counterexampleOrConstruction], difficultyEvidence: 'Computes target moles then constructs a valid concentration-volume implementation.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [limiting-solution-reagent], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: hard-test-stoich-design-equivalence, variationAxes: { scenario: solution design, unknown: moles and valid formulation, methodBranch: construction } }
  - { id: q015, type: freeResponse, prompt: 'Why does filtration after precipitation not change theoretical yield but can lower recovered yield?', answer: { gradingMode: selfCheck, keyPoints: ['theoretical set by limiting stoichiometry', 'filter transfer can lose product', 'recovered mass is experimental'] }, explanation: 'Solution: Theoretical yield is fixed by initial limiting-reactant moles; filtration can lose solid on glassware or filter, lowering recovered mass. Why it works: Stoichiometric production and physical recovery are separate stages. Common trap: Recomputing theoretical yield from filtered mass.', difficultyDimensions: [globalLocalReasoning, casePartition, proofJustification], difficultyEvidence: 'Separates chemical-production model from physical-recovery process and justifies each role.', prerequisiteObjectiveIds: [quantitative-analysis], extensionObjectiveIds: [limiting-solution-reagent], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: hard-test-stoich-theoretical-vs-recovered, variationAxes: { scenario: filtration, unknown: yield distinction, representation: process stages } }
  - { id: q016, type: freeResponse, prompt: 'An unknown concentration sample is reacted with excess AgNO3 and gives 0.287 g AgCl. Explain why this is quantitative analysis and state the first reverse calculation.', answer: { gradingMode: selfCheck, keyPoints: ['use precipitate mass to find mol AgCl', 'then 1:1 mol Cl−', 'infer original concentration only with sample volume'] }, explanation: 'Solution: It is quantitative analysis because a measured product amount is used to infer an original analyte amount. First calculate mol AgCl=0.287 g/143.32 g/mol, then use 1:1 moles Cl−; sample volume is needed for molarity. Why it works: The mole map is followed backward from measured product. Common trap: Reporting chloride molarity without a sample volume.', difficultyDimensions: [reverseReasoning, representationTransfer, domainCondition], difficultyEvidence: 'Reverses product-mass path and identifies missing information for concentration inference.', prerequisiteObjectiveIds: [quantitative-analysis], extensionObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: hard-test-stoich-gravimetric-reverse, variationAxes: { scenario: unknown analyte, unknown: reverse method and data need, methodBranch: quantitative analysis } }
  - { id: q017, type: freeResponse, prompt: '50.0 mL 0.100 M CaCl2 is mixed with 50.0 mL 0.100 M Na2CO3. State moles precipitated and final mixture volume, then explain why volume is irrelevant to precipitate mass here but relevant to leftover-ion concentration.', answer: { gradingMode: selfCheck, keyPoints: ['0.00500 mol CaCO3', '0.1000 L final', 'mass depends on moles; concentrations divide by final volume'] }, explanation: 'Solution: Each provides 0.00500 mol reactive ion, so 0.00500 mol CaCO3 forms; final volume is 0.1000 L. Product mass depends on product moles, whereas any leftover-ion concentration requires dividing remaining moles by final volume. Why it works: Mole-based stoichiometry and concentration normalization answer different questions. Common trap: Dividing product moles by total volume before calculating mass.', difficultyDimensions: [representationTransfer, globalLocalReasoning, casePartition], difficultyEvidence: 'Separates amount and concentration representations in a mixed-solution process.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: hard-test-stoich-moles-vs-final-concentration, variationAxes: { scenario: equal-volume precipitation, unknown: product and representation distinction, constraints: final volume } }
  - { id: q018, type: freeResponse, prompt: 'Explain why a 2:1 equation coefficient is a difficulty dimension beyond merely “more arithmetic” in solution stoichiometry.', answer: { gradingMode: selfCheck, keyPoints: ['changes relation between reactant/product amounts', 'requires selecting correct mole ratio', 'can change limiting reagent'] }, explanation: 'Solution: A 2:1 coefficient changes the governing mole relationship, so it requires an explicit ratio conversion and can change which reagent limits. Why it works: It is a different chemical constraint, not simply a larger number. Common trap: Treating coefficient changes as decorative formatting.', difficultyDimensions: [proofJustification, modelOrDerivation, casePartition], difficultyEvidence: 'Explains how stoichiometric structure changes model selection and limiting outcomes.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [limiting-solution-reagent], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: hard-test-stoich-coefficient-concept, variationAxes: { scenario: reasoning about method, unknown: significance explanation, governingRelation: stoichiometric coefficient } }
  - { id: q019, type: freeResponse, prompt: 'A reaction has excess sulfate but a measured BaSO4 mass below theory. Name one chemical and one procedural explanation.', answer: { gradingMode: selfCheck, keyPoints: ['chemical: incomplete precipitation/reaction', 'procedural: transfer or filtration loss'] }, explanation: 'Solution: Chemically, precipitation may be incomplete; procedurally, solid can be lost during transfer or filtration. Why it works: Both mechanisms lower recovered product but leave different evidence. Common trap: Assuming excess sulfate guarantees perfect recovery.', difficultyDimensions: [casePartition, errorDiagnosis, globalLocalReasoning], difficultyEvidence: 'Separates chemical conversion from procedural recovery and evaluates both causal branches.', prerequisiteObjectiveIds: [quantitative-analysis], extensionObjectiveIds: [limiting-solution-reagent], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: hard-test-stoich-two-cause-low-mass, variationAxes: { scenario: low barium sulfate yield, unknown: two causes, methodBranch: causal partition } }
  - { id: q020, type: freeResponse, prompt: 'State why a titration calculation should not be substituted for a precipitation-yield calculation merely because both start with M×V.', answer: { gradingMode: selfCheck, keyPoints: ['different observable/goal', 'titration needs equivalence/endpoint model', 'precipitation yield uses limiting product/recovery path'] }, explanation: 'Solution: Both begin with moles from M×V, but titration interprets equivalence/endpoint to determine an unknown concentration, whereas precipitation yield follows reactants to a solid amount and recovery. Why it works: A shared algebraic entry step does not erase different governing models and conclusions. Common trap: Calling any acid-base or solution calculation a titration.', difficultyDimensions: [casePartition, modelOrDerivation, proofJustification], difficultyEvidence: 'Distinguishes two procedural models that share a preliminary conversion but have different conditions and outputs.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [titration-stoichiometry], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0464], reasoningSignature: hard-test-stoich-vs-titration-model, variationAxes: { scenario: method selection, unknown: model distinction, constraints: endpoint versus yield } }
