  instructions: |
    This is the first Directed Project in the Personal Portfolio Capstone Series!
    
    In this step, we will establish the base CSS architecture for your portfolio. Following best practices, we will use flat class selectors rather than IDs or deep nesting.
    
    ![Portfolio Header Mockup](/media/css/portfolio_header_mockup.png)
    
    Define empty CSS rules (e.g. `.classname {}`) for the following structural elements you'll be building:
    1. The main site header (`.site-header`)
    2. The primary navigation (`.main-nav`)
    3. A navigation link (`.nav-link`)
    4. A modifier for an active navigation link (`.nav-link--active`)
    
    Notice how we use BEM-style modifiers (`--active`) instead of chaining pseudo-classes or relying on nested context. This keeps our specificity flat!
