workedExamples:
- id: linear-ivp-integrating-factor
  title: Solve a Linear IVP with an Integrating Factor
  problem: |
    Solve $y'+3y=6$ with $y(0)=1$.
  steps:
  - id: identify-coefficients
    title: Step 1 — Identify standard form
    instruction: The equation is already $y'+P(x)y=Q(x)$.
    type: numericResponse
    prompt: What is the constant value of $P(x)$?
    answer: { value: 3, tolerance: 0.0001, explanation: The coefficient multiplying $y$ is 3. }
  - id: integrating-factor
    title: Step 2 — Construct the integrating factor
    instruction: Use $\mu=e^{\int P(x)\,dx}$.
    type: symbolicResponse
    prompt: Enter $\mu(x)$.
    answer:
      expectedLatex: 'e^(3x)'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: [x]
      explanation: '$\int3\,dx=3x$.'
  - id: product-derivative
    title: Step 3 — Integrate the product derivative
    instruction: Multiply by $e^{3x}$ and integrate $(e^{3x}y)'=6e^{3x}$.
    type: symbolicResponse
    prompt: Enter $e^{3x}y$ after integration, using $C$.
    answer:
      expectedLatex: '2e^(3x)+C'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: [x, C]
      explanation: 'The antiderivative of $6e^{3x}$ is $2e^{3x}$.'
  - id: initial-condition
    title: Step 4 — Apply the initial value
    instruction: Divide by $e^{3x}$ and use $y(0)=1$.
    type: symbolicResponse
    prompt: Enter the particular solution.
    answer:
      expectedLatex: '2-e^(-3x)'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: [x]
      explanation: 'At $x=0$, $1=2+C$, so $C=-1$ and $y=2-e^{-3x}$.'
