questions:
  - id: q001
    type: numericResponse
    skills:
      - chem-molecular-charges
    prompt: |
      Calculate the formal charge on the **oxygen atom** in the hydroxide ion ($OH^-$).

      O in OH⁻ has 3 lone pairs (6 electrons) and is involved in 1 O—H bond (2 electrons).

      Use: FC = V − L − B/2 (V = 6 for oxygen)
    answer:
      value: -1
      tolerance: 0
    explanation: |
      $$\text{FC}(O) = 6 - 6 - \frac{2}{2} = 6 - 6 - 1 = -1$$

      The formal charge of −1 on O matches the overall −1 charge of $OH^-$, confirming this is a correct Lewis structure.

  - id: q002
    type: numericResponse
    skills:
      - chem-molecular-charges
    prompt: |
      Calculate the formal charge on **nitrogen** in the nitrite ion ($NO_2^-$).

      In the Lewis structure, N has 1 lone pair (2 electrons) and forms one N—O single bond and one N=O double bond.

      Total bonding electrons around N = 2 + 4 = 6. Lone pair electrons on N = 2.
    answer:
      value: 0
      tolerance: 0
    explanation: |
      $$\text{FC}(N) = 5 - 2 - \frac{6}{2} = 5 - 2 - 3 = 0$$

      Nitrogen in $NO_2^-$ has a formal charge of zero. The −1 overall charge is carried by one of the oxygen atoms (the singly bonded one has FC = −1).

  - id: q003
    type: multipleChoice
    skills:
      - chem-molecular-charges
    prompt: |
      Two Lewis structures of $N_2O$ are possible. In Structure A (N—N=O), N on the left has FC = −1 and N in the middle has FC = +1. In Structure B (N=N=O), N on the left has FC = 0 and N in the middle has FC = +1.

      Which structure is preferred, and why?
    choices:
      - id: a
        text: Structure A, because the negative charge should be on the less electronegative nitrogen
      - id: b
        text: Structure B, because it has fewer overall formal charges (the terminal N has FC = 0 rather than −1)
      - id: c
        text: Structure A, because double bonds are always preferred over triple bonds
      - id: d
        text: Neither; both structures are equivalent resonance structures
    answer:
      choiceId: b
    explanation: |
      When formal charges cannot all be zero, the structure with the **fewest and smallest formal charges** is preferred. Structure B (with terminal N at FC = 0) minimizes formal charge separation compared to Structure A.

  - id: q004
    type: multipleChoice
    skills:
      - chem-molecular-charges
    prompt: |
      The two resonance structures of ozone ($O_3$) are drawn. In both structures, the bond between the central O and one terminal O is a double bond, and the bond to the other terminal O is a single bond (plus the lone pairs). What is the O—O bond order in the **resonance hybrid** of ozone?
    choices:
      - id: a
        text: '1.0'
      - id: b
        text: '1.5'
      - id: c
        text: '2.0'
      - id: d
        text: '2.5'
    answer:
      choiceId: b
    explanation: |
      Each O—O bond position receives a double bond (order 2) in one resonance structure and a single bond (order 1) in the other:
      $$\text{Bond order} = \frac{2+1}{2} = 1.5$$
      Both O—O bonds in ozone are identical at bond order 1.5, which is confirmed experimentally (both bonds = 128 pm, between O—O single bond ~148 pm and O=O double bond ~121 pm).

  - id: q005
    type: multipleChoice
    skills:
      - chem-molecular-charges
    prompt: |
      Which statement about resonance structures is **correct**?
    choices:
      - id: a
        text: A molecule rapidly oscillates between its resonance structures
      - id: b
        text: Resonance structures differ in the arrangement of atoms
      - id: c
        text: The actual molecule is a hybrid of all contributing resonance structures, with intermediate bond properties
      - id: d
        text: More resonance structures always means a less stable molecule
    answer:
      choiceId: c
    explanation: |
      Resonance structures differ in **electron** positions, not atom positions. The molecule does not oscillate — it permanently exists as the resonance hybrid, a blend of all contributors. More equivalent resonance structures generally mean greater **resonance stabilization** (e.g., benzene with 6 equivalent structures is highly stable).

  - id: q006
    type: numericResponse
    skills:
      - chem-molecular-charges
    prompt: |
      The formate ion ($HCO_2^-$) has two equivalent resonance structures, each containing one C—O single bond (bond order 1) and one C=O double bond (bond order 2). What is the C—O **bond order** in the resonance hybrid? Enter a decimal.
    answer:
      value: 1.5
      tolerance: 0.01
    explanation: |
      $$\text{Bond order} = \frac{1 + 2}{2} = 1.5$$
      Both C—O bonds in the formate hybrid have order 1.5 — equal in length and strength, intermediate between single and double.

  - id: q007
    type: selectAll
    skills:
      - chem-molecular-charges
    prompt: |
      Select all statements that correctly describe how to choose the **best** Lewis structure when formal charges are present.
    choices:
      - id: a
        text: Prefer structures where formal charges are as close to zero as possible
      - id: b
        text: If negative formal charges must exist, place them on more electronegative atoms
      - id: c
        text: Adjacent atoms should not both carry the same sign of formal charge
      - id: d
        text: Always expand the octet of the central atom to eliminate all formal charges
    answer:
      choiceIds:
        - a
        - b
        - c
    explanation: |
      Rules A, B, and C are all correct criteria for selecting the best Lewis structure. Rule D is incorrect — octet expansion is only available for Period 3+ atoms, and it is not always necessary or beneficial to eliminate all formal charges this way.

  - id: q008
    type: multipleChoice
    skills:
      - chem-molecular-charges
    prompt: |
      In the carbonate ion ($CO_3^{2-}$), there are three equivalent resonance structures. What is the C—O bond order?
    choices:
      - id: a
        text: '1.0'
      - id: b
        text: '1.33'
      - id: c
        text: '1.5'
      - id: d
        text: '2.0'
    answer:
      choiceId: b
    explanation: |
      Each C—O position has a double bond in one structure and a single bond in the other two:
      $$\text{Bond order} = \frac{2+1+1}{3} = \frac{4}{3} \approx 1.33$$
      All three C—O bonds are equal in $CO_3^{2-}$, confirming resonance delocalization.

  - id: q009
    type: numericResponse
    skills:
      - chem-molecular-charges
    prompt: |
      Calculate the formal charge on the **central oxygen** atom in ozone ($O_3$).

      In the Lewis structure: the central O forms one O=O double bond and one O—O single bond, and has **one lone pair** (2 electrons).

      Bonding electrons on central O = 4 (double bond) + 2 (single bond) = 6.
    answer:
      value: 1
      tolerance: 0
    explanation: |
      $$\text{FC}(\text{central O}) = 6 - 2 - \frac{6}{2} = 6 - 2 - 3 = +1$$

      The central oxygen in $O_3$ carries a formal charge of +1. One terminal O (the doubly-bonded one) has FC = 0; the singly-bonded terminal O has FC = −1. The sum: +1 + 0 + (−1) = 0, consistent with $O_3$ being a neutral molecule.

  - id: q010
    type: multipleChoice
    skills:
      - chem-molecular-charges
    prompt: |
      Benzene ($C_6H_6$) has two Kekulé resonance structures (alternating single and double bonds). Compared to a hypothetical molecule with fixed alternating C—C and C=C bonds, how does resonance stabilization affect the real benzene molecule?
    choices:
      - id: a
        text: Benzene is less stable than predicted because resonance weakens all the bonds
      - id: b
        text: Benzene is more stable than predicted because the delocalized electrons lower the overall energy
      - id: c
        text: Benzene has the same stability — resonance is just a drawing convention with no energy consequences
      - id: d
        text: Benzene is unstable because the resonance structures disagree with each other
    answer:
      choiceId: b
    explanation: |
      Resonance **stabilizes** molecules by delocalizing electron density across multiple atoms, lowering the total energy of the system below what either individual resonance structure would predict. This "resonance energy" or "delocalization energy" makes benzene significantly more stable than a hypothetical cyclohexatriene with fixed alternating bonds — which is why benzene undergoes substitution (not addition) reactions.
