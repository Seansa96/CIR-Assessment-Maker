  prompt: |
    Determine the behavior of the sequence.

    $$
    a_n=n\sin\left(\frac1n\right)
    $$
  choices:
  - id: a
    text: Converges to 1
  - id: b
    text: Converges to 0
  - id: c
    text: Diverges to infinity
  - id: d
    text: Diverges by oscillation
  answer:
    choiceId: a
  explanation: |-
    Solution: Rewrite as $\frac{\sin(1/n)}{1/n}$. Since $\frac{\sin x}{x}\to 1$ as $x\to 0$, the sequence converges to $1$. Therefore the answer is Converges to 1.

    Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.

    Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.

    Why the other choices fail: Converges to 0 conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; Diverges to infinity conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; Diverges by oscillation conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.
