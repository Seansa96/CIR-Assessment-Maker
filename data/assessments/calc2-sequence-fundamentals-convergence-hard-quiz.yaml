questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Determine the behavior of the sequence.

      $$
      a_n=n\sin\left(\frac1n\right)
      $$
    choices:
      - id: a
        text: Converges to 1
      - id: b
        text: Converges to 0
      - id: c
        text: Diverges to infinity
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      Rewrite as $\frac{\sin(1/n)}{1/n}$. Since $\frac{\sin x}{x}\to 1$ as $x\to 0$, the sequence converges to $1$.
  - id: q002
    type: multipleChoice
    prompt: |
      Determine the behavior of the sequence.

      $$
      a_n=\left(1+\frac3n\right)^n
      $$
    choices:
      - id: a
        text: '$\text{Converges to }e^3$'
      - id: b
        text: Converges to 3
      - id: c
        text: Diverges to infinity
      - id: d
        text: Converges to 1
    answer:
      choiceId: a
    explanation: |
      This matches the standard exponential limit $\left(1+\frac{c}{n}\right)^n\to e^c$. Here $c=3$.
  - id: q003
    type: multipleChoice
    prompt: |
      Determine the behavior of the sequence.

      $$
      a_n=n\left(\sqrt{n^2+1}-n\right)
      $$
    choices:
      - id: a
        text: '$\text{Converges to }\frac12$'
      - id: b
        text: Converges to 0
      - id: c
        text: Diverges to infinity
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      Rationalize:

      $$
      n(\sqrt{n^2+1}-n)=\frac{n}{\sqrt{n^2+1}+n}
      =\frac{1}{\sqrt{1+1/n^2}+1}\to \frac12.
      $$
  - id: q004
    type: multipleChoice
    prompt: |
      Determine the behavior of the sequence.

      $$
      a_n=(-1)^n\frac{n}{n+1}
      $$
    choices:
      - id: a
        text: Diverges by oscillation
      - id: b
        text: Converges to 0
      - id: c
        text: Converges to 1
      - id: d
        text: Diverges to infinity
    answer:
      choiceId: a
    explanation: |
      The magnitude approaches $1$, while the sign alternates. The even and odd subsequences approach different values, so no limit exists.
  - id: q005
    type: multipleChoice
    prompt: |
      Determine the behavior of the sequence.

      $$
      a_n=\frac{\ln n}{n^{1/3}}
      $$
    choices:
      - id: a
        text: Converges to 0
      - id: b
        text: Diverges to infinity
      - id: c
        text: Converges to 1
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      Any positive power of $n$ eventually outgrows $\ln n$, so $\frac{\ln n}{n^{1/3}}\to 0$.
  - id: q006
    type: multipleChoice
    prompt: |
      Determine the behavior of the sequence.

      $$
      a_n=n^{1/n}
      $$
    choices:
      - id: a
        text: Converges to 1
      - id: b
        text: Converges to 0
      - id: c
        text: Diverges to infinity
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      Take logs: $\ln(a_n)=\frac{\ln n}{n}\to 0$. Therefore $a_n\to e^0=1$.
  - id: q007
    type: multipleChoice
    prompt: |
      Determine the behavior of the sequence.

      $$
      a_n=\frac{2^n+3^n}{4^n}
      $$
    choices:
      - id: a
        text: Converges to 0
      - id: b
        text: Converges to 1
      - id: c
        text: Diverges to infinity
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      Rewrite as $\left(\frac12\right)^n+\left(\frac34\right)^n$. Both terms go to $0$.
  - id: q008
    type: multipleChoice
    prompt: |
      Determine the behavior of the sequence.

      $$
      a_n=\frac{3^n+4^n}{4^n}
      $$
    choices:
      - id: a
        text: Converges to 1
      - id: b
        text: Converges to 0
      - id: c
        text: Diverges to infinity
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      Rewrite as $\left(\frac34\right)^n+1$. The exponential fraction vanishes, leaving $1$.
  - id: q009
    type: multipleChoice
    prompt: |
      Determine the behavior of the sequence.

      $$
      a_n=\sin\left(\frac{\pi n}{2}\right)
      $$
    choices:
      - id: a
        text: Diverges by oscillation
      - id: b
        text: Converges to 0
      - id: c
        text: Converges to 1
      - id: d
        text: Diverges to infinity
    answer:
      choiceId: a
    explanation: |
      The values cycle through $1,0,-1,0,\ldots$, so the sequence never settles to one value.
  - id: q010
    type: multipleChoice
    prompt: |
      Determine the behavior of the sequence.

      $$
      a_n=(-1)^n+\frac1n
      $$
    choices:
      - id: a
        text: Diverges by oscillation
      - id: b
        text: Converges to 0
      - id: c
        text: Converges to 1
      - id: d
        text: Diverges to infinity
    answer:
      choiceId: a
    explanation: |
      The small term $\frac1n$ disappears, but $(-1)^n$ still alternates between two limiting behaviors.
  - id: q011
    type: multipleChoice
    prompt: |
      Determine the behavior of the sequence.

      $$
      a_n=\frac{n!}{n^n}
      $$
    choices:
      - id: a
        text: Converges to 0
      - id: b
        text: Converges to 1
      - id: c
        text: Diverges to infinity
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      Each factor in $\frac{n!}{n^n}=\frac1n\cdot\frac2n\cdots\frac nn$ is at most $1$, and most are much smaller than $1$. The product goes to $0$.
  - id: q012
    type: multipleChoice
    prompt: |
      Determine the behavior of the sequence.

      $$
      a_n=\arctan(n)
      $$
    choices:
      - id: a
        text: '$\text{Converges to }\frac{\pi}{2}$'
      - id: b
        text: Converges to 0
      - id: c
        text: Diverges to infinity
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      The horizontal asymptote of $\arctan x$ as $x\to\infty$ is $\frac{\pi}{2}$.
  - id: q013
    type: multipleChoice
    prompt: |
      Determine the behavior of the sequence.

      $$
      a_n=\frac{n}{\ln n}
      $$
    choices:
      - id: a
        text: Diverges to infinity
      - id: b
        text: Converges to 0
      - id: c
        text: Converges to 1
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      Linear growth outpaces logarithmic growth, so $\frac{n}{\ln n}$ grows without bound.
  - id: q014
    type: multipleChoice
    prompt: |
      Determine the behavior of the sequence.

      $$
      a_n=\sqrt{n^2+n}-n
      $$
    choices:
      - id: a
        text: '$\text{Converges to }\frac12$'
      - id: b
        text: Converges to 0
      - id: c
        text: Diverges to infinity
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      Rationalize:

      $$
      \sqrt{n^2+n}-n=\frac{n}{\sqrt{n^2+n}+n}
      =\frac{1}{\sqrt{1+1/n}+1}\to\frac12.
      $$
  - id: q015
    type: multipleChoice
    prompt: |
      Determine the behavior of the sequence.

      $$
      a_n=\frac{(1+(-1)^n)n}{n+1}
      $$
    choices:
      - id: a
        text: Diverges by oscillation
      - id: b
        text: Converges to 0
      - id: c
        text: Converges to 1
      - id: d
        text: Diverges to infinity
    answer:
      choiceId: a
    explanation: |
      For odd $n$, the numerator is $0$. For even $n$, the sequence approaches $2$. The subsequences disagree, so the sequence diverges.
