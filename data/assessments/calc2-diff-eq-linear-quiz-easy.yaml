schemaVersion: 1
id: calc2-diff-eq-linear-quiz-easy
title: First-Order Linear Equations Quiz — Easy
assessmentType: quiz
categoryId: calculus-2
topicId: diff-eq-linear
modeDefault: practice
randomizeQuestions: true
skills: [write standard form, find integrating factors, solve linear IVPs]
navigation: { learningGoal: practice, activityType: focusedPractice, tags: [calculus-2, first-order-linear, differential-equations] }
questions:
- id: q001
  type: numericResponse
  skills: [write standard form]
  prompt: Write $2y'+6y=8$ in standard form. What is the constant coefficient $P$ of $y$?
  answer: { value: 3, tolerance: 0.001 }
  explanation: Divide every term by 2 to obtain $y'+3y=4$.
- id: q002
  type: symbolicResponse
  skills: [find integrating factors]
  prompt: Enter the integrating factor for $y'+2y=x$.
  answer: { expectedLatex: 'e^(2x)', equivalenceMode: expression, tolerance: 0.000001, variables: [x], explanation: 'Integrating the constant coefficient 2 gives exponent 2x.' }
- id: q003
  type: numericResponse
  skills: [solve linear IVPs]
  prompt: For $y'+y=0$ with $y(0)=5$, what is $y(\ln 5)$?
  answer: { value: 1, tolerance: 0.001 }
  explanation: The solution is $y=5e^{-x}$.
- id: q004
  type: symbolicResponse
  skills: [write standard form]
  prompt: Divide $xy'+4y=x^2$ by $x$. Enter $P(x)$.
  answer: { expectedLatex: '4/x', equivalenceMode: expression, tolerance: 0.000001, variables: [x], explanation: Standard form is $y'+(4/x)y=x$. }
- id: q005
  type: numericResponse
  skills: [construct mixing models]
  prompt: A tank volume changes from 100 gal by net loss of 1 gal/min. What is its volume after 30 min?
  answer: { value: 70, tolerance: 0.001 }
  explanation: $V(t)=100-t$.
