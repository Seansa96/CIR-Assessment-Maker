    - Names mechanism
    - Mentions tradeoff
    - Checks boundary or failure case
  explanation: 'Related topic: UNIX, Linux, and Android.'
- id: q008
  title: 'Misconception: UNIX organizing ideas'
  type: multipleChoice
  prompt: Which misconception is most dangerous when reasoning about **UNIX organizing ideas**?
  choices:
  - id: a
    text: Treating the concept as a label instead of an OS mechanism with costs and boundaries.
  - id: b
    text: Asking what resource is controlled.
  - id: c
    text: Checking whether the mechanism can fail or block.
  - id: d
    text: Separating user-visible behavior from kernel-mediated work.
  answer:
    choiceId: a
  explanation: The correct reasoning must connect UNIX organizing ideas to mechanism and tradeoff.
