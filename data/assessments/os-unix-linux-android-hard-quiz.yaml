- id: q001
  title: Apply UNIX organizing ideas
  type: multipleChoice
  prompt: A system design discussion mentions **UNIX organizing ideas**. Which conclusion is most defensible?
  choices:
  - id: a
    text: The design style matters more than command memorization.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: The design style matters more than command memorization. This is why UNIX organizing ideas matters in UNIX, Linux, and Android.
