schemaVersion: 1
id: csharp-functions-recall
title: C# Methods Recall
assessmentType: recallDrill
categoryId: csharp
subcategoryId: csharp-functions
subcategoryIds:
  - csharp-functions
modeDefault: practice
randomizeQuestions: true
items:
  - id: r001
    type: typed
    prompt: 'What return type is used when a method does not return a value?'
    answer:
      expected: void
  - id: r002
    type: flashcard
    prompt: 'What is the term for having multiple methods with the exact same name, but different parameter lists?'
    answer:
      expected: Method Overloading
      aliases:
        - Overloading
  - id: r003
    type: typed
    prompt: 'Which keyword passes an argument by reference, requiring the variable to be initialized BEFORE the method is called?'
    answer:
      expected: ref
  - id: r004
    type: typed
    prompt: 'Which keyword passes an argument by reference, requiring the method to assign a value to it BEFORE returning?'
    answer:
      expected: out
  - id: r005
    type: typed
    prompt: 'What built-in method safely attempts to convert a string to an integer, returning a `bool` for success and using an `out` parameter for the result?'
    answer:
      expected: int.TryParse
      aliases:
        - TryParse
        - int.TryParse()
  - id: r006
    type: typed
    prompt: 'What keyword immediately exits the method and passes a value back to the caller?'
    answer:
      expected: return
