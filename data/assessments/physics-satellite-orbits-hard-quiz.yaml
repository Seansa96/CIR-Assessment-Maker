questions:
- id: q001
  type: numericResponse
  prompt: |
    A comet is in a highly elliptical orbit around the Sun. At aphelion (farthest point), its distance from the Sun is $r_a = 5.0 \times 10^{12} \text{ m}$ and its speed is $v_a = 1.0 \times 10^3 \text{ m/s}$. 
    At perihelion (closest point), its distance is $r_p = 5.0 \times 10^{10} \text{ m}$.
    Using conservation of angular momentum, calculate its speed $v_p$ at perihelion in m/s.
  answer:
    value: 100000
    tolerance: 10
  explanation: |
    Solution:
    By conservation of angular momentum: $L_a = L_p$.
    $m v_a r_a = m v_p r_p$
    $v_p = v_a \frac{r_a}{r_p} = (1000) \frac{5.0 \times 10^{12}}{5.0 \times 10^{10}} = 1000 \times 100 = 100,000 \text{ m/s}$.
    
    Why it works:
    In an orbit, the gravitational force is purely central, meaning it exerts no torque. Therefore, angular momentum ($L = mvr$ for velocity perpendicular to radius at apsides) is conserved. Since the radius at perihelion is 100 times smaller, the velocity must be 100 times larger.
  difficultyDimensions:
  - RepresentationTransfer
  - AuxiliaryTechnique
  - Simplification
  - ModelOrDerivation
- id: q002
  type: symbolicResponse
  prompt: |
    For a satellite of mass $m$ in an elliptical orbit around a planet of mass $M$ with semi-major axis $a$, the total mechanical energy $E$ can be shown to depend only on $a$.
    Write the expression for the total energy $E$. Use `G`, `M`, `m`, and `a`.
  answer:
    expectedLatex: -\frac{GMm}{2a}
    equivalenceMode: expression
    variables: [G, M, m, a]
    tolerance: 0.00001
    keyPoints:
    - -GMm / (2a)
  explanation: |
    Solution:
    $E = -\frac{GMm}{2a}$
    
    Why it works:
    This is known as the vis-viva equation's energy constant. In a circular orbit, $r = a$, giving the familiar $-GMm/2r$. For ellipses, the total energy is determined strictly by the semi-major axis, not the eccentricity.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
