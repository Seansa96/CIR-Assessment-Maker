lesson:
  introduction: |
    The advanced-calculus habit is to treat inequalities as controlled information. This lesson builds the order and absolute-value language needed for limits, estimates, comparison tests, and error bounds.
  sections:
  - id: order-properties
    title: Order properties
    required: true
    content: |
      If $a<b$, adding the same number preserves order. Multiplying by a positive number preserves order. Multiplying by a negative number reverses order. Many invalid calculus proofs fail at exactly this point.
    check:
      id: order-properties-check
      type: multipleChoice
      prompt: |
        If $a<b$ and $c<0$, which statement must be true?
      choices:
      - id: a
        text: $ac<bc$
      - id: b
        text: $ac>bc$
      - id: c
        text: $a+c>b+c$
      - id: d
        text: $a-c<b-c$
      answer:
        choiceId: b
      explanation: |
        Multiplication by a negative number reverses the inequality.
  - id: absolute-value-distance
    title: Absolute value as distance
    required: true
    content: |
      $|x-a|<r$ means that $x$ lies within distance $r$ of $a$. Limit arguments use this to turn input closeness into output closeness.
    check:
      id: absolute-value-distance-check
      type: multipleChoice
      prompt: |
        What interval is represented by $|x-3|<0.2$?
      choices:
      - id: a
        text: $(2.8,3.2)$
      - id: b
        text: $(3,3.2)$
      - id: c
        text: $(-0.2,0.2)$
      - id: d
        text: $(2.8,3)$
      answer:
        choiceId: a
      explanation: |
        The center is $3$ and the radius is $0.2$.
  - id: estimate-chains
    title: Estimate chains
    required: true
    content: |
      A chain estimate traps a complicated expression under simpler terms. The goal is usually to isolate a factor that can be made small while bounding the remaining factors.
    check:
      id: estimate-chains-check
      type: selectAll
      prompt: |
        Which moves are valid when building an estimate?
      choices:
      - id: a
        text: Replace a positive factor by a known upper bound.
      - id: b
        text: Reverse an inequality without multiplying by a negative.
      - id: c
        text: Use $|uv|=|u||v|$ to split a product.
      - id: d
        text: Ignore denominator sign without checking it.
      answer:
        choiceIds:
        - a
        - c
      explanation: |
        Bounding positive factors and splitting absolute values are standard safe moves.
