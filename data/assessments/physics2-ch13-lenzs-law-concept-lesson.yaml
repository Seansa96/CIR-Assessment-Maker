schemaVersion: 1
id: physics2-ch13-lenzs-law-concept-lesson
title: Lenz's Law
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-electromagnetic-induction
lesson:
  introduction: This lesson develops the main ideas behind Lenz's Law and connects them to the governing
    physical relationships.
  sections:
  - id: l2-sec1
    title: Direction of Induced Current
    required: true
    content: Lenz's Law explains the negative sign in Faraday's Law. It states that the direction of the
      induced current is such that it produces a magnetic field that opposes the change in the original
      magnetic flux.
  - id: l2-sec2
    title: Conservation of Energy
    required: true
    content: Lenz's Law is a direct consequence of the conservation of energy. If the induced current
      were to aid the change in flux, it would create a runaway effect, generating infinite energy.
