workedExamples:
  - id: tangent-classification-and-concavity
    title: Tangent Classification and Concavity
    problem: |
      ![A parametric curve with horizontal and vertical tangents marked](/assessments/calc2-parametric-polar/parametric-derivatives-tangent-types.svg)

      For the parametric curve

      $$
      x=t^3-3t,\qquad y=t^2-1,
      $$

      find $\frac{dy}{dx}$, identify horizontal and vertical tangents, and determine where the curve is concave up or concave down.
    steps:
      - id: tangent-classification-step-1
        title: Compute component derivatives
        instruction: |
          Start by differentiating both coordinate functions with respect to $t$:

          $$
          x=t^3-3t,\qquad y=t^2-1.
          $$

          The component derivatives tell us how the point moves horizontally and vertically.
        type: symbolicResponse
        prompt: 'What is $\frac{dx}{dt}$?'
        answer:
          expectedLatex: '3t^2-3'
          equivalenceMode: expression
          variables:
            - t
          tolerance: 0.000001
        explanation: |
          Differentiate $x=t^3-3t$ term by term:

          $$
          \frac{dx}{dt}=3t^2-3.
          $$

          Related topic: component derivatives for parametric curves.
      - id: tangent-classification-step-2
        title: Form the first derivative
        instruction: |
          The vertical component derivative is:

          $$
          \frac{dy}{dt}=2t.
          $$

          Therefore:

          $$
          \frac{dy}{dx}=\frac{dy/dt}{dx/dt}.
          $$
        type: symbolicResponse
        prompt: 'Write $\frac{dy}{dx}$ in terms of $t$.'
        answer:
          expectedLatex: '\frac{2t}{3t^2-3}'
          equivalenceMode: expression
          variables:
            - t
          tolerance: 0.000001
        explanation: |
          Substitute both component derivatives:

          $$
          \frac{dy}{dx}=\frac{2t}{3t^2-3}.
          $$

      - id: tangent-classification-step-3
        title: Find horizontal tangents
        instruction: |
          Horizontal tangents occur where

          $$
          \frac{dy}{dt}=0
          $$

          and

          $$
          \frac{dx}{dt}\ne0.
          $$

          Here, $\frac{dy}{dt}=2t$, so the candidate is $t=0$. At $t=0$, $\frac{dx}{dt}=-3$, so the tangent really is horizontal.
        type: multipleChoice
        prompt: What point has the horizontal tangent?
        choices:
          - id: a
            text: '$(0,-1)$'
          - id: b
            text: '$(-2,0)$'
          - id: c
            text: '$(2,0)$'
          - id: d
            text: '$(0,0)$'
        answer:
          choiceId: a
        explanation: |
          Substitute $t=0$:

          $$
          x(0)=0,\qquad y(0)=-1.
          $$

          The horizontal tangent occurs at $(0,-1)$.
      - id: tangent-classification-step-4
        title: Find vertical tangents
        instruction: |
          Vertical tangents occur where

          $$
          \frac{dx}{dt}=0
          $$

          and

          $$
          \frac{dy}{dt}\ne0.
          $$

          Solve:

          $$
          3t^2-3=0\implies t=\pm1.
          $$

          At $t=\pm1$, $\frac{dy}{dt}=2t$ is not zero.
        type: selectAll
        prompt: Which points have vertical tangents?
        choices:
          - id: a
            text: '$(0,-1)$'
          - id: b
            text: '$(-2,0)$'
          - id: c
            text: '$(2,0)$'
          - id: d
            text: '$(0,0)$'
        answer:
          choiceIds: [b, c]
        explanation: |
          At $t=1$, the point is $(-2,0)$. At $t=-1$, the point is $(2,0)$. Both have vertical tangents.
      - id: tangent-classification-step-5
        title: Compute the second derivative
        instruction: |
          Start from

          $$
          \frac{dy}{dx}=\frac{2t}{3t^2-3}.
          $$

          Differentiate with respect to $t$:

          $$
          \frac{d}{dt}\left(\frac{dy}{dx}\right)
          =
          -\frac{2(t^2+1)}{3(t^2-1)^2}.
          $$

          Then divide by $\frac{dx}{dt}=3(t^2-1)$.
        type: symbolicResponse
        prompt: 'What is $\frac{d^2y}{dx^2}$?'
        answer:
          expectedLatex: '-\frac{2(t^2+1)}{9(t^2-1)^3}'
          equivalenceMode: expression
          variables:
            - t
          tolerance: 0.000001
        explanation: |
          The extra division by $\frac{dx}{dt}$ is essential:

          $$
          \frac{d^2y}{dx^2}
          =
          \frac{-\frac{2(t^2+1)}{3(t^2-1)^2}}{3(t^2-1)}
          =
          -\frac{2(t^2+1)}{9(t^2-1)^3}.
          $$
      - id: tangent-classification-step-6
        title: Determine concavity
        instruction: |
          In

          $$
          \frac{d^2y}{dx^2}
          =
          -\frac{2(t^2+1)}{9(t^2-1)^3},
          $$

          the numerator is always negative. The sign depends on $(t^2-1)^3$.

          - If $|t|<1$, then $t^2-1<0$, so the second derivative is positive.
          - If $|t|>1$, then $t^2-1>0$, so the second derivative is negative.
        type: multipleChoice
        prompt: Where is the curve concave up?
        choices:
          - id: a
            text: '$-1<t<1$'
          - id: b
            text: '$t<-1$ and $t>1$'
          - id: c
            text: All real $t$
          - id: d
            text: No real $t$
        answer:
          choiceId: a
        explanation: |
          The curve is concave up on $-1<t<1$ and concave down on $t<-1$ and $t>1$. The values $t=\pm1$ are vertical tangent locations where this formula is undefined.

  - id: cusp-and-singular-point
    title: Cusp Behavior When Both Component Derivatives Vanish
    problem: |
      Analyze the parametric curve

      $$
      x=t^2,\qquad y=t^3.
      $$

      The goal is to understand why $t=0$ cannot be classified by the ordinary horizontal/vertical tangent rules alone.
    steps:
      - id: cusp-singular-step-1
        title: Compute the component derivatives
        instruction: |
          Differentiate both coordinate functions:

          $$
          x=t^2,\qquad y=t^3.
          $$
        type: selectAll
        prompt: Which derivative statements are correct?
        choices:
          - id: a
            text: '$\frac{dx}{dt}=2t$'
          - id: b
            text: '$\frac{dy}{dt}=3t^2$'
          - id: c
            text: '$\frac{dx}{dt}=t^3$'
          - id: d
            text: '$\frac{dy}{dt}=2t$'
        answer:
          choiceIds: [a, b]
        explanation: |
          Differentiating term by term gives $\frac{dx}{dt}=2t$ and $\frac{dy}{dt}=3t^2$.
      - id: cusp-singular-step-2
        title: Identify the singular parameter
        instruction: |
          At $t=0$:

          $$
          \frac{dx}{dt}=0,\qquad \frac{dy}{dt}=0.
          $$

          This makes the usual slope formula become $\frac{0}{0}$.
        media:
          - type: image
            src: /assessments/calc2-parametric-polar/parametric-derivatives-semicubical-cusp.svg
            alt: Semicubical cusp for x equals t squared and y equals t cubed, with the singular point at the origin and the limiting tangent y equals zero marked.
            caption: At the cusp, both component derivatives vanish, so the ordinary slope formula is inconclusive. The nearby branches still reveal a limiting horizontal tangent.
        type: multipleChoice
        prompt: What should you conclude immediately at $t=0$?
        choices:
          - id: a
            text: The ordinary slope formula is inconclusive.
          - id: b
            text: The tangent is automatically vertical.
          - id: c
            text: The tangent is automatically horizontal.
          - id: d
            text: The curve has no point there.
        answer:
          choiceId: a
        explanation: |
          When both component derivatives vanish, the standard horizontal/vertical tests do not apply directly.
      - id: cusp-singular-step-3
        title: Simplify the slope away from the singular point
        instruction: |
          For $t\ne0$:

          $$
          \frac{dy}{dx}
          =
          \frac{3t^2}{2t}
          =
          \frac{3t}{2}.
          $$

          Now take the limit as $t\to0$.
        type: numericResponse
        prompt: What is $\lim_{t\to0}\frac{3t}{2}$?
        answer:
          value: 0
          tolerance: 0
        explanation: |
          Although the original formula is $\frac{0}{0}$ at $t=0$, nearby slopes approach $0$.
      - id: cusp-singular-step-4
        title: Find the point and tangent line
        instruction: |
          At $t=0$:

          $$
          x(0)=0,\qquad y(0)=0.
          $$

          Since nearby slopes approach $0$, the limiting tangent line is horizontal through the origin.
        type: symbolicResponse
        prompt: Write the tangent line at the cusp.
        answer:
          expectedLatex: 'y=0'
          equivalenceMode: expression
          variables:
            - x
            - y
          tolerance: 0.000001
        explanation: |
          The limiting slope is $0$ and the point is $(0,0)$, so the tangent line is $y=0$.
      - id: cusp-singular-step-5
        title: Confirm the cusp algebraically
        instruction: |
          Eliminate the parameter:

          $$
          x=t^2,\qquad y=t^3.
          $$

          Squaring $y$ and cubing $x$ gives:

          $$
          y^2=t^6,\qquad x^3=t^6.
          $$

          Therefore:

          $$
          y^2=x^3.
          $$
        type: multipleChoice
        prompt: What Cartesian relation describes the curve?
        choices:
          - id: a
            text: '$y^2=x^3$'
          - id: b
            text: '$x^2=y^3$'
          - id: c
            text: '$y=x^2$'
          - id: d
            text: '$x+y=0$'
        answer:
          choiceId: a
        explanation: |
          This relation is the standard semicubical cusp. The graph approaches the origin and turns sharply there.
      - id: cusp-singular-step-6
        title: Interpret concavity around the cusp
        instruction: |
          Since

          $$
          \frac{dy}{dx}=\frac{3t}{2},
          $$

          for $t\ne0$:

          $$
          \frac{d^2y}{dx^2}
          =
          \frac{\frac{d}{dt}\left(\frac{3t}{2}\right)}{2t}
          =
          \frac{3}{4t}.
          $$

          The sign changes at the cusp: negative for $t<0$ and positive for $t>0$.
        media:
          - type: image
            src: /assessments/calc2-parametric-polar/parametric-derivatives-cusp-concavity.svg
            alt: Semicubical cusp with separate branches labeled t less than zero and t greater than zero, showing concavity changing sign across the cusp.
            caption: The second derivative formula changes sign across $t=0$, so the two branches bend differently as they meet at the cusp.
        type: multipleChoice
        prompt: What happens to concavity as the curve passes through the cusp?
        choices:
          - id: a
            text: It changes from concave down to concave up.
          - id: b
            text: It remains concave down.
          - id: c
            text: It remains concave up.
          - id: d
            text: Concavity is controlled by $x+y$ only.
        answer:
          choiceId: a
        explanation: |
          For $t<0$, $\frac{3}{4t}<0$; for $t>0$, $\frac{3}{4t}>0$. The cusp is exactly where the ordinary formula breaks down.
