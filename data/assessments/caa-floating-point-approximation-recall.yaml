schemaVersion: 1
id: caa-floating-point-approximation-recall
title: Floating-Point and Approximation Recall Drill
assessmentType: recallDrill
categoryId: computer-arithmetic-algorithms
subcategoryIds:
- caa-floating-point-approximation
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - floating-point
  - ieee-layout
  - approximation
items:
- id: float-fields
  type: flashcard
  prompt: Name the three conceptual fields of a typical binary floating-point value.
  answer:
    expected: Sign, exponent, and fraction or significand.
  explanation: The sign gives direction, the exponent gives scale, and the significand gives precision.
  tags:
  - floating-point
- id: ulp
  type: typed
  prompt: What does ULP mean?
  answer:
    expected: Unit in the last place.
  explanation: It describes spacing between representable floating-point values near a magnitude.
  tags:
  - ulp
- id: rounding-error
  type: cloze
  prompt: 'Complete: floating-point arithmetic usually rounds results to the nearest ____ value.'
  answer:
    expected: representable
  explanation: Most real numbers are not exactly representable.
  tags:
  - rounding
- id: approximation-warning
  type: flashcard
  prompt: Why are bit-level floating tricks dangerous without context?
  answer:
    expected: They rely on a specific representation and often produce approximations with limited accuracy.
  explanation: The speed/accuracy tradeoff must be explicit.
  tags:
  - approximation
- id: scale-field
  type: typed
  prompt: Which field mainly controls the scale of a floating-point value?
  answer:
    expected: The exponent field.
  explanation: The exponent shifts the significand by powers of two.
  tags:
  - exponent
