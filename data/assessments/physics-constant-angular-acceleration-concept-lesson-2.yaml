lesson:
  introduction: In many real-world scenarios, a rotating object undergoes multiple
    stages of motion, such as speeding up, maintaining a constant velocity, and then
    braking.
  sections:
  - id: sec-1
    title: Multi-Stage Rotational Motion
    content: "When angular acceleration changes abruptly (e.g., a motor is turned\
      \ off and the object coasts, or a brake is applied), you must split the problem\
      \ into distinct intervals. \n\nThe final angular velocity $\\omega_f$ and position\
      \ $\\theta_f$ of the first interval become the initial conditions $\\omega_0$\
      \ and $\\theta_0$ for the second interval. The kinematic equations can only\
      \ be applied within an interval where $\\alpha$ remains perfectly constant."
    media: []
    check:
      id: chk-ca-3
      type: multipleChoice
      prompt: A fan accelerates at a constant rate for 5 seconds, then coasts at a
        constant angular velocity for 10 seconds. How should you calculate the total
        angular displacement?
      choices:
      - id: a
        text: Use the average acceleration over the 15 seconds in a single equation.
        issueSignals:
        - id: trigonometry-error
      - id: b
        text: Calculate the displacement for the first 5 seconds using $\alpha$, then
          calculate the displacement for the next 10 seconds using $\alpha = 0$, and
          sum them.
      - id: c
        text: Use $\theta = \frac{1}{2}\alpha(15)^2$.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: d
        text: Use the final angular velocity and multiply by 15 seconds.
        issueSignals:
        - id: linear-angular-confusion
      answer:
        choiceId: b
      explanation: 'Solution:

        Calculate the displacement for the first 5 seconds using $\alpha$, then calculate
        the displacement for the next 10 seconds using $\alpha = 0$, and sum them.


        Why it works:

        Because the acceleration changes, the motion must be split into two intervals.
        The total displacement is the sum of the displacements from the acceleration
        phase and the constant velocity phase.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-2
    title: Graphical Analysis of Rotational Motion
    content: 'Just as with linear motion, graphs can provide profound insights. An
      $\omega$ vs. $t$ (angular velocity-time) graph has a slope equal to the angular
      acceleration $\alpha$. The area under the $\omega$-$t$ curve represents the
      angular displacement $\Delta\theta$.


      A $\theta$ vs. $t$ graph will be a parabola if $\alpha \neq 0$, and a straight
      line if $\alpha = 0$. The slope of the tangent to the $\theta$-$t$ curve at
      any point gives the instantaneous angular velocity $\omega$.'
    media: []
    check:
      id: chk-ca-4
      type: multipleChoice
      prompt: On a graph of angular velocity $\omega$ versus time $t$, what does a
        horizontal line above the t-axis indicate?
      choices:
      - id: a
        text: The object is at rest.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: The object has constant, non-zero angular acceleration.
        issueSignals:
        - id: linear-angular-confusion
      - id: c
        text: The object is rotating at a constant angular velocity ($\alpha = 0$).
      - id: d
        text: The object's angular displacement is zero.
        issueSignals:
        - id: linear-angular-confusion
      answer:
        choiceId: c
      explanation: 'Solution:

        The object is rotating at a constant angular velocity ($\alpha = 0$).


        Why it works:

        A horizontal line on an $\omega$-$t$ graph means the angular velocity is not
        changing. Therefore, the object is rotating at a constant angular velocity
        and $\alpha = 0$.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
