lesson:
  introduction: SHM is motion with restoring acceleration proportional and opposite to displacement. Use phase, not just position, to connect displacement, velocity, acceleration, and energy.
  sections:
  - id: physics1-reinforcement-shm-s1
    title: Identify the restoring model
    required: true
    content: A mass-spring system obeys $m\ddot x=-kx$, so $\omega=\sqrt{k/m}$ and the acceleration always points toward equilibrium.
    check:
      id: physics1-reinforcement-shm-s1-check
      type: multipleChoice
      prompt: At the positive turning point of an ideal spring oscillator, which state is correct?
      choices:
      - { id: a, text: '$v=0$ and $a$ points toward negative $x$' }
      - { id: b, text: '$v$ and $a$ both point toward positive $x$', issueSignals: [{ id: physics1-shm-acceleration-direction, domains: [physics-1] }] }
      - { id: c, text: '$a=0$ because velocity is zero', issueSignals: [{ id: physics1-shm-turning-point-acceleration, domains: [physics-1] }] }
      - { id: d, text: '$v$ is maximum and $a$ is positive', issueSignals: [{ id: physics1-shm-phase-state-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: At maximum positive displacement, velocity is zero and $a=-\omega^2x$ is negative. Why it works: Restoring acceleration points toward equilibrium. Why the other choices fail: They reverse the restoring direction or confuse turning-point speed with equilibrium speed.'
    difficultyDimensions: [phase, forceModel]
    difficultyEvidence: Reads two state variables from the SHM differential equation.
  - id: physics1-reinforcement-shm-s2
    title: Scale the period
    required: true
    content: For a mass-spring oscillator, $T=2\pi\sqrt{m/k}$. Mass and stiffness change timing differently.
    check:
      id: physics1-reinforcement-shm-s2-check
      type: multipleChoice
      prompt: If the mass is multiplied by four while $k$ stays fixed, what happens to the period?
      choices:
      - { id: a, text: 'It doubles' }
      - { id: b, text: 'It quadruples', issueSignals: [{ id: physics1-shm-square-root-error, domains: [physics-1] }] }
      - { id: c, text: 'It halves', issueSignals: [{ id: physics1-shm-mass-trend-error, domains: [physics-1] }] }
      - { id: d, text: 'It is unchanged', issueSignals: [{ id: physics1-shm-period-independence-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: $T$ scales as $\sqrt m$, so multiplying $m$ by four multiplies $T$ by two. Why it works: The square-root dependence converts a factor of four into a factor of two. Why the other choices fail: They treat the relation as linear, inverse, or independent of mass.'
    difficultyDimensions: [scaling, algebra]
    difficultyEvidence: Applies square-root scaling rather than memorizing direction alone.
  - id: physics1-reinforcement-shm-s3
    title: Track energy exchange
    required: true
    content: In ideal SHM, $K+U$ is constant. At equilibrium, speed and kinetic energy are greatest; at a turning point, spring energy is greatest.
    check:
      id: physics1-reinforcement-shm-s3-check
      type: multipleChoice
      prompt: Where is the spring's potential energy largest during one ideal oscillation?
      choices:
      - { id: a, text: 'At either turning point, where $|x|=A$' }
      - { id: b, text: 'At equilibrium, where $x=0$', issueSignals: [{ id: physics1-shm-energy-location-error, domains: [physics-1] }] }
      - { id: c, text: 'Halfway between equilibrium and a turning point only', issueSignals: [{ id: physics1-shm-energy-phase-error, domains: [physics-1] }] }
      - { id: d, text: 'It is constant and equal to kinetic energy', issueSignals: [{ id: physics1-shm-energy-conservation-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: $U_s=\tfrac12kx^2$ is largest when $|x|=A$. Why it works: The turning points store all ideal oscillator energy as spring energy. Why the other choices fail: Equilibrium maximizes kinetic energy, and energy shifts rather than remaining equally divided.'
    difficultyDimensions: [energy, phase]
    difficultyEvidence: Connects the energy expression to oscillator position.
  - id: physics1-reinforcement-shm-s4
    title: Use the phase relation
    required: true
    content: For $x=A\cos(\omega t+\phi)$, velocity is shifted by a quarter cycle and acceleration is opposite displacement.
    check:
      id: physics1-reinforcement-shm-s4-check
      type: multipleChoice
      prompt: When $x=0$ and the oscillator is moving toward positive $x$, which sign pair is possible?
      choices:
      - { id: a, text: '$v>0$ and $a=0$' }
      - { id: b, text: '$v=0$ and $a>0$', issueSignals: [{ id: physics1-shm-equilibrium-speed-error, domains: [physics-1] }] }
      - { id: c, text: '$v<0$ and $a=0$', issueSignals: [{ id: physics1-shm-velocity-direction-error, domains: [physics-1] }] }
      - { id: d, text: '$v>0$ and $a>0$', issueSignals: [{ id: physics1-shm-acceleration-equilibrium-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: At equilibrium $a=-\omega^2x=0$, and “toward positive $x$” means $v>0$. Why it works: Equilibrium is the maximum-speed location but has zero restoring acceleration. Why the other choices fail: They assign turning-point speed or nonzero acceleration at zero displacement.'
    difficultyDimensions: [phase, sign]
    difficultyEvidence: Combines verbal direction with the phase equations.
