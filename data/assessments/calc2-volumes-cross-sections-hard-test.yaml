- id: vol-cross-ht-1
  title: Equilateral Triangles on Ellipse
  type: symbolicResponse
  prompt: |
    The base of a solid is bounded by the ellipse $rac{x^2}{16} + rac{y^2}{9} = 1$. Cross-sections perpendicular to the $x$-axis are equilateral triangles. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: 48\sqrt{3}
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Base width $s = 6\sqrt{1 - x^2/16}$.
    2. Area $A(x) = rac{\sqrt{3}}{4}s^2 = rac{\sqrt{3}}{4}(36)(1 - x^2/16) = 9\sqrt{3}(1 - x^2/16)$.
    3. $V = \int_{-4}^4 9\sqrt{3}(1 - x^2/16) \, dx = 18\sqrt{3} \int_0^4 (1 - x^2/16) \, dx = 18\sqrt{3} [x - x^3/48]_0^4 = 18\sqrt{3}(4 - 64/48) = 18\sqrt{3}(4 - 4/3) = 18\sqrt{3}(8/3) = 48\sqrt{3}$.
- id: vol-cross-ht-2
  title: Squares on Sine/Cosine
  type: symbolicResponse
  prompt: |
    The base of a solid is bounded by $y = \cos x$ and $y = \sin x$ for $0 \le x \le \pi/4$. Cross-sections perpendicular to the $x$-axis are squares. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: \pi/4 - 1/2
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Base width $s = \cos x - \sin x$. Area $A(x) = (\cos x - \sin x)^2 = \cos^2 x - 2\sin x \cos x + \sin^2 x = 1 - \sin(2x)$.
    2. $V = \int_0^{\pi/4} (1 - \sin(2x)) \, dx = [x + rac{1}{2}\cos(2x)]_0^{\pi/4}$.
    3. Evaluate: $(\pi/4 + 0) - (0 + 1/2) = \pi/4 - 1/2$.
- id: vol-cross-ht-3
  title: Semicircles on Logarithmic Y-axis Base
  type: symbolicResponse
  prompt: |
    The base of a solid is bounded by $y = \ln x$, $y = 1$, and $x = 1$. Cross-sections perpendicular to the **$y$-axis** are semicircles. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: rac{\pi}{8}(rac{e^2}{2} - 2e + rac{5}{2})
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Solve for $x$: $x = e^y$. The bounds are $x = 1$ to $x = e^y$.
    2. Base width $d = e^y - 1$. Area $A(y) = rac{\pi}{8} (e^y - 1)^2 = rac{\pi}{8} (e^{2y} - 2e^y + 1)$.
    3. $V = rac{\pi}{8} \int_0^1 (e^{2y} - 2e^y + 1) \, dy = rac{\pi}{8} [rac{1}{2}e^{2y} - 2e^y + y]_0^1$.
    4. Evaluate: $rac{\pi}{8} ((rac{1}{2}e^2 - 2e + 1) - (1/2 - 2 + 0)) = rac{\pi}{8} (rac{e^2}{2} - 2e + 1 - (-3/2)) = rac{\pi}{8} (rac{e^2}{2} - 2e + rac{5}{2})$.
- id: vol-cross-ht-4
  title: Squares on Secant
  type: symbolicResponse
  prompt: |
    The base of a solid is bounded by $y = \sec x$, $y=0$, and $x=\pm \pi/3$. Cross-sections perpendicular to the $x$-axis are squares. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: 2\sqrt{3}
    equivalenceMode: expression
    tolerance: 0
  explanation: "1. Base width $s = \\sec x$. Area $A(x) = \\sec^2 x$.\n2. $V = \\int_{-\\pi/3}^{\\pi/3} \\sec^2 x \\, dx = [\tan x]_{-\\pi/3}^{\\pi/3} = \\sqrt{3} - (-\\sqrt{3}) = 2\\sqrt{3}$.\n"
- id: vol-cross-ht-5
  title: Reverse Engineering Volume
  type: symbolicResponse
  prompt: |
    The base of a solid is bounded by $y = x^2$ and $y = c$ (where $c > 0$). Cross sections perpendicular to the $x$-axis are squares. If the volume of the solid is $rac{16}{15}$, find the value of $c$.
  answer:
    gradingMode: auto
    expectedLatex: 1
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Base width $s = c - x^2$. Area $A(x) = (c - x^2)^2 = c^2 - 2cx^2 + x^4$.
    2. Limits of integration: $x^2 = c \implies x = \pm\sqrt{c}$.
    3. $V = \int_{-\sqrt{c}}^{\sqrt{c}} (c^2 - 2cx^2 + x^4) \, dx = 2 [c^2 x - rac{2c}{3}x^3 + rac{1}{5}x^5]_0^{\sqrt{c}}$.
    4. $V = 2(c^{5/2} - rac{2}{3}c^{5/2} + rac{1}{5}c^{5/2}) = 2(rac{15 - 10 + 3}{15})c^{5/2} = rac{16}{15}c^{5/2}$.
    5. Given $V = rac{16}{15}$, we have $c^{5/2} = 1 \implies c = 1$.
- id: vol-cross-ht-6
  title: Inverse Tangent Slicing
  type: symbolicResponse
  prompt: |
    The base of a solid is bounded by $y = rctan x$, $y=0$, and $x=1$. Cross sections perpendicular to the **$y$-axis** are squares. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: 1 - \ln 2
    equivalenceMode: expression
    tolerance: 0
  explanation: "1. Solve for $x$: $x = \tan y$. Base width $s = 1 - \tan y$.\n2. Limits for $y$: from $0$ to $\\pi/4$.\n3. $V = \\int_0^{\\pi/4} (1 - \tan y)^2 \\, dy = \\int_0^{\\pi/4} (1 - 2\tan y + \tan^2 y) \\, dy$.\n4. Rewrite $1 + \tan^2 y = \\sec^2 y$. So integral is $\\int_0^{\\pi/4} (\\sec^2 y - 2\tan y) \\, dy$.\n5. Antiderivative: $\tan y + 2\\ln|\\cos y|$.\n6. Evaluate: $(1 + 2\\ln(rac{\\sqrt{2}}{2})) - (0 + 2\\ln 1) = 1 + \\ln(1/2) = 1 - \\ln 2$.\n"
- id: vol-cross-ht-7
  title: Generalized Hemisphere
  type: symbolicResponse
  prompt: |
    The base of a solid is bounded by the circle $x^2 + y^2 = R^2$. Cross sections perpendicular to the $x$-axis are semicircles. Evaluate the exact volume analytically in terms of $R$.
  answer:
    gradingMode: auto
    expectedLatex: rac{2}{3}\pi R^3
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Base width $d = 2\sqrt{R^2 - x^2}$.
    2. $A(x) = rac{\pi}{8} d^2 = rac{\pi}{2}(R^2 - x^2)$.
    3. $V = \int_{-R}^R rac{\pi}{2}(R^2 - x^2) \, dx = \pi \int_0^R (R^2 - x^2) \, dx = \pi[R^2 x - x^3/3]_0^R = \pi(R^3 - R^3/3) = rac{2}{3}\pi R^3$.
- id: vol-cross-ht-8
  title: Integration by Parts Volume
  type: symbolicResponse
  prompt: |
    The base of a solid is bounded by $y = \sqrt{x} e^{-x}$, $y=0$, and $x=1$. Cross sections perpendicular to the $x$-axis are squares. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: rac{1 - 3e^{-2}}{4}
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Base width $s = \sqrt{x} e^{-x}$. Area $A(x) = x e^{-2x}$.
    2. $V = \int_0^1 x e^{-2x} \, dx$. Use integration by parts: $u=x, dv=e^{-2x}dx$.
    3. $du=dx, v=-1/2 e^{-2x}$.
    4. $V = [-x/2 e^{-2x}]_0^1 + 1/2 \int_0^1 e^{-2x} \, dx = [-x/2 e^{-2x} - 1/4 e^{-2x}]_0^1$.
    5. Evaluate at 1: $-1/2 e^{-2} - 1/4 e^{-2} = -3/4 e^{-2}$.
    6. Evaluate at 0: $0 - 1/4 = -1/4$.
    7. Volume = $-3/4 e^{-2} - (-1/4) = rac{1 - 3e^{-2}}{4}$.
- id: vol-cross-ht-9
  title: Absolute Value Base
  type: symbolicResponse
  prompt: |
    The base of a solid is bounded by $y = |x-1|$ and $y = 2$. Cross sections perpendicular to the $x$-axis are isosceles right triangles with one leg on the base. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: 8/3
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Intersections: $|x-1| = 2 \implies x-1 = \pm 2 \implies x = -1, 3$.
    2. Base width $s = 2 - |x-1|$. Area $A(x) = rac{1}{2}s^2 = rac{1}{2}(2 - |x-1|)^2$.
    3. Let $u = x-1$, then $dx = du$. Limits become $-2$ to $2$. $V = \int_{-2}^2 rac{1}{2}(2-|u|)^2 \, du$.
    4. By symmetry, $V = 2 \int_0^2 rac{1}{2}(2-u)^2 \, du = \int_0^2 (2-u)^2 \, du$.
    5. Evaluate: $[-1/3(2-u)^3]_0^2 = 0 - (-8/3) = 8/3$.
- id: vol-cross-ht-10
  title: Semicircles on Sideways Parabolas
  type: symbolicResponse
  prompt: |
    The base of a solid is bounded by $x = y^2$ and $x = 2y$. Cross sections perpendicular to the **$y$-axis** are semicircles. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: 2\pi/15
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Intersections: $y^2 = 2y \implies y=0, 2$.
    2. Base width $d = 2y - y^2$. Area $A(y) = rac{\pi}{8}(2y - y^2)^2 = rac{\pi}{8}(4y^2 - 4y^3 + y^4)$.
    3. $V = rac{\pi}{8} \int_0^2 (4y^2 - 4y^3 + y^4) \, dy = rac{\pi}{8} [4y^3/3 - y^4 + y^5/5]_0^2$.
    4. Evaluate: $rac{\pi}{8} (32/3 - 16 + 32/5) = rac{\pi}{8} (160/15 - 240/15 + 96/15) = rac{\pi}{8} (16/15) = rac{2\pi}{15}$.
