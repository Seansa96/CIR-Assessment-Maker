schemaVersion: 1
id: pwsh-basics-guided-project-2
title: "Log File Filter Challenge"
assessmentType: sandbox
categoryId: scripting
subcategoryIds:
- pwsh-object-pipeline
skills:
- Apply scripting concepts
- Apply The Object Pipeline and Filtering
navigation:
  learningGoal: apply
  activityType: sandbox
  tags:
  - scripting
  - pwsh-object-pipeline
  - pwsh-navigation
  - pwsh-cmdlets
sandbox:
  language: pwsh
  image: mcr.microsoft.com/powershell:latest
  initialCommand: 'pwsh -NoExit -Command "& /workspace/.cir/setup.ps1; Start-Job -FilePath /workspace/.cir/monitor.ps1 | Out-Null"'
  readOnlyFileSystem: false
  instructions: |
    Welcome to the Log File Filter Challenge!
    
    You have a directory at `/var/www/site/logs/` that is completely cluttered with hundreds of text files, backups, and log files.
    
    Your task is to write a script `filter-logs.ps1` that uses `Get-ChildItem` to list **ONLY** the names of files that end with `.log`.
    
    **Requirements:**
    1. Do not list `.txt` or `.bak` files.
    2. Output *only* the names of the files (e.g., `error.log`), not their full paths or other properties. You can use the `-Name` parameter of `Get-ChildItem` to achieve this.
    3. Use the `-Filter` parameter to specify the file extension.
    4. Your script must target the `/var/www/site/logs/` directory.
    
    The environment is pre-configured. When you have correctly written and saved your script, the background monitor will automatically detect it and advance the assessment.
  files:
    - path: filter-logs.ps1
      readOnly: false
      content: |
        # Write your PowerShell command below to list only the names of .log files
        
    - path: .cir/setup.ps1
      readOnly: true
      content: |
        New-Item -ItemType Directory -Force -Path /var/www/site/logs/ | Out-Null
        New-Item -ItemType File -Force -Path /var/www/site/logs/access.log | Out-Null
        New-Item -ItemType File -Force -Path /var/www/site/logs/error.log | Out-Null
        New-Item -ItemType File -Force -Path /var/www/site/logs/notes.txt | Out-Null
        New-Item -ItemType File -Force -Path /var/www/site/logs/backup.bak | Out-Null
        New-Item -ItemType File -Force -Path /var/www/site/logs/system.log | Out-Null
        
    - path: .cir/monitor.ps1
      readOnly: true
      content: |
        while ($true) {
            if (Test-Path "/workspace/filter-logs.ps1") {
                $output = & /workspace/filter-logs.ps1 | Out-String
                if ($output -match "access\.log" -and $output -match "error\.log" -and $output -match "system\.log" -and $output -notmatch "notes\.txt" -and $output -notmatch "backup\.bak") {
                    Invoke-RestMethod -Method Post -Uri "$env:CIR_API_URL/api/attempts/$env:CIR_ATTEMPT_ID/sandbox/complete"
                    break
                }
            }
            Start-Sleep -Seconds 3
        }
