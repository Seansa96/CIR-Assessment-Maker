questions:
- id: q001
  type: multipleChoice
  prompt: |-
    An original Shifts, Turns, Flips, Stretches, and Squeezes problem variant is designed to test **translation**. Which solution strategy is most appropriate?
  choices:
  - id: a
    text: Use track invariant quantities after checking the relevant constraints.
  - id: b
    text: Assume the answer from a visually similar problem still applies.
  - id: c
    text: Ignore the distinction between necessary and sufficient conditions.
  - id: d
    text: Try arithmetic first and decide the structure only after the answer appears.
  answer:
    choiceId: a
  explanation: |-
    This mirrors the difficulty of a chapter problem archetype: recognize translation, choose track invariant quantities, and verify the constraints before computing.
  skills:
  - aops-transformations
