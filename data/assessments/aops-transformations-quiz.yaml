questions:
- id: q001
  type: multipleChoice
  prompt: A point $A$ at $(3, -4)$ is translated 5 units to the left and 2 units up. What are the coordinates
    of the new point $A'$?
  difficultyDimensions:
  - 'Apply translation to x: $3 - 5 = -2$.'
  - 'Apply translation to y: $-4 + 2 = -2$.'
  - 'Combine: $(-2, -2)$.'
  choices:
  - id: a
    text: $(8, -2)$
    issueSignals:
    - id: direction-sign-error
      domains: []
  - id: b
    text: $(-2, -2)$
  - id: c
    text: $(2, -6)$
    issueSignals:
    - id: axis-swap-error
      domains: []
  - id: d
    text: $(-2, -6)$
    issueSignals:
    - id: direction-sign-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    A translation shifts a point left/right (changing the $x$-coordinate) and up/down (changing the $y$-coordinate).

    "5 units to the left" means subtract 5 from the $x$-coordinate: $3 - 5 = -2$.

    "2 units up" means add 2 to the $y$-coordinate: $-4 + 2 = -2$.

    The new point $A''$ is $(-2, -2)$.


    Why it works:

    The coordinate plane is just a grid of directions. Left/Down is negative, Right/Up is positive.


    Why the other choices fail:

    - $(8, -2)$ adds 5 to the $x$-coordinate instead of subtracting (translating right instead of left).

    - $(2, -6)$ subtracts 5 from $y$ and adds 2 to $x$ (swapping the axes).

    - $(-2, -6)$ subtracts 2 from the $y$-coordinate (translating down instead of up).

    '
- id: q002
  type: multipleChoice
  prompt: Point $B(-5, 7)$ is reflected across the $x$-axis. What are the coordinates of the reflected
    point $B'$?
  difficultyDimensions:
  - 'Recall the rule for reflecting across the $x$-axis: $(x, y) \to (x, -y)$.'
  - 'Apply rule: $x$ stays $-5$, $y$ becomes $-7$.'
  - 'Combine: $(-5, -7)$.'
  choices:
  - id: a
    text: $(5, 7)$
    issueSignals:
    - id: reflection-y-axis-confusion
      domains: []
  - id: b
    text: $(-5, -7)$
  - id: c
    text: $(5, -7)$
    issueSignals:
    - id: origin-reflection-confusion
      domains: []
  - id: d
    text: $(7, -5)$
    issueSignals:
    - id: y-equals-x-reflection-confusion
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    When a point is reflected across the $x$-axis, it jumps from top to bottom (or bottom to top). Its
    horizontal position ($x$) stays exactly the same, but its vertical position ($y$) flips to the opposite
    sign.

    The rule is $(x, y) \to (x, -y)$.

    Applying this to $B(-5, 7)$, we get $B''(-5, -7)$.


    Why it works:

    Imagine folding the graph paper along the horizontal $x$-axis. A dot in the upper-left quadrant (like
    $(-5, 7)$) will leave a wet ink mark in the lower-left quadrant (at $(-5, -7)$).


    Why the other choices fail:

    - $(5, 7)$ is a reflection across the $y$-axis.

    - $(5, -7)$ is a reflection across the origin (both signs flipped).

    - $(7, -5)$ is a reflection across the line $y = -x$.

    '
- id: q003
  type: multipleChoice
  prompt: What are the coordinates of point $C(2, -8)$ after it is reflected across the $y$-axis?
  difficultyDimensions:
  - 'Recall the rule for reflecting across the $y$-axis: $(x, y) \to (-x, y)$.'
  - 'Apply rule: $x$ becomes $-2$, $y$ stays $-8$.'
  - 'Combine: $(-2, -8)$.'
  choices:
  - id: a
    text: $(2, 8)$
    issueSignals:
    - id: reflection-x-axis-confusion
      domains: []
  - id: b
    text: $(-2, -8)$
  - id: c
    text: $(-2, 8)$
    issueSignals:
    - id: origin-reflection-confusion
      domains: []
  - id: d
    text: $(-8, 2)$
    issueSignals:
    - id: y-equals-x-reflection-confusion
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    When a point is reflected across the vertical $y$-axis, it jumps from right to left (or left to right).
    Its vertical position ($y$) stays exactly the same, but its horizontal position ($x$) flips to the
    opposite sign.

    The rule is $(x, y) \to (-x, y)$.

    Applying this to $C(2, -8)$, we get $C''(-2, -8)$.


    Why it works:

    Folding the graph paper along the vertical $y$-axis moves points horizontally, changing only the $x$-coordinate.


    Why the other choices fail:

    - $(2, 8)$ is a reflection across the $x$-axis.

    - $(-2, 8)$ is a reflection across the origin.

    - $(-8, 2)$ is a reflection across the line $y = x$.

    '
- id: q004
  type: multipleChoice
  prompt: A point $D(1, 6)$ is reflected across the diagonal line $y = x$. What are the coordinates of
    the new point $D'$?
  difficultyDimensions:
  - 'Recall the rule for reflecting across $y = x$: $(x, y) \to (y, x)$.'
  - 'Apply rule: swap the coordinates.'
  - 'Combine: $(6, 1)$.'
  choices:
  - id: a
    text: $(-1, -6)$
    issueSignals:
    - id: origin-reflection-confusion
      domains: []
  - id: b
    text: $(6, 1)$
  - id: c
    text: $(-6, -1)$
    issueSignals:
    - id: y-equals-negative-x-reflection-confusion
      domains: []
  - id: d
    text: $(1, -6)$
    issueSignals:
    - id: reflection-x-axis-confusion
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    Reflecting a point across the line $y = x$ swaps the $x$ and $y$ coordinates.

    The rule is $(x, y) \to (y, x)$.

    Applying this to $D(1, 6)$, the coordinates simply trade places, resulting in $D''(6, 1)$.


    Why it works:

    The line $y = x$ is a perfect $45^\circ$ diagonal line passing through the origin. If you fold the
    paper along this diagonal, the $x$-axis lies exactly on top of the $y$-axis, meaning horizontal distances
    become vertical distances and vice versa.


    Why the other choices fail:

    - $(-1, -6)$ is a reflection across the origin.

    - $(-6, -1)$ is a reflection across the line $y = -x$.

    - $(1, -6)$ is a reflection across the $x$-axis.

    '
- id: q005
  type: multipleChoice
  prompt: Point $E(4, 3)$ is rotated $90^\circ$ counter-clockwise about the origin $(0,0)$. What are its
    new coordinates?
  difficultyDimensions:
  - 'Recall the rule for a $90^\circ$ counter-clockwise rotation: $(x, y) \to (-y, x)$.'
  - 'Apply rule: swap coordinates and flip the sign of the *new* first coordinate.'
  - 'Evaluate: $(4, 3) \to (-3, 4)$.'
  choices:
  - id: a
    text: $(3, -4)$
    issueSignals:
    - id: clockwise-rotation-confusion
      domains: []
  - id: b
    text: $(-3, 4)$
  - id: c
    text: $(-4, -3)$
    issueSignals:
    - id: 180-rotation-confusion
      domains: []
  - id: d
    text: $(-4, 3)$
    issueSignals:
    - id: reflection-y-axis-confusion
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    A $90^\circ$ counter-clockwise rotation about the origin follows the rule $(x, y) \to (-y, x)$.

    For point $E(4, 3)$:

    1. Swap the coordinates: $(3, 4)$.

    2. Change the sign of the new $x$-coordinate: $(-3, 4)$.

    The new point is $(-3, 4)$.


    Why it works:

    Point $E(4,3)$ is in Quadrant I (top right). Rotating it $90^\circ$ counter-clockwise pushes it into
    Quadrant II (top left), where $x$ is negative and $y$ is positive. The coordinates swap values because
    horizontal distance from the origin becomes vertical distance, and vice versa.


    Why the other choices fail:

    - $(3, -4)$ is a $90^\circ$ CLOCKWISE rotation (or $270^\circ$ counter-clockwise).

    - $(-4, -3)$ is a $180^\circ$ rotation.

    - $(-4, 3)$ is merely a reflection across the $y$-axis.

    '
