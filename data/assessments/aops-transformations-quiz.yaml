- id: q005
  type: freeResponse
  prompt: |-
    A Shifts, Turns, Flips, Stretches, and Squeezes problem has been changed so that the obvious first method no longer applies directly. Explain how you would decide whether **map coordinates under a rule** is still legal, and name one condition you would check.
  answer:
    expected: |-
      Check whether the structure still contains dilation and whether the constraints needed for map coordinates under a rule remain true.
    gradingMode: selfCheck
    keyPoints:
    - Mentions dilation.
    - Mentions map coordinates under a rule.
    - Checks a condition or edge case.
  explanation: |-
    The purpose is to test method selection. Related topic: Shifts, Turns, Flips, Stretches, and Squeezes; specific technique: map coordinates under a rule.
  skills:
  - aops-transformations
