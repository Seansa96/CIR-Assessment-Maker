questions:
- id: q001
  type: numericResponse
  prompt: |
    Calculate the volume flow rate $Q$ in $\text{m}^3\text{/s}$ of a cylindrical pipe with a radius of $0.5 \text{ m}$ if the fluid is traveling at a speed of $4.0 \text{ m/s}$.
    Use $\pi \approx 3.14159$.
  answer:
    value: 3.14159
    tolerance: 0.1
  explanation: |
    Solution:
    First, calculate the cross-sectional area: $A = \pi r^2 = \pi (0.5)^2 = 0.25\pi \text{ m}^2$.
    Then calculate the volume flow rate: $Q = Av = (0.25\pi)(4.0) = 1.0\pi \approx 3.14159 \text{ m}^3\text{/s}$.
    
    Why it works:
    The volume flow rate is the product of the cross-sectional area and the velocity of the fluid passing through it.
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
- id: q002
  type: multipleChoice
  prompt: |
    A horizontal pipe narrows, causing the fluid inside to speed up. According to Bernoulli's equation, what must happen to the pressure in the narrowed section?
  choices:
  - id: a
    text: 'The pressure must increase to force the fluid to move faster.'
  - id: b
    text: 'The pressure must decrease.'
  - id: c
    text: 'The pressure remains constant because the pipe is horizontal.'
  - id: d
    text: 'The pressure fluctuates unpredictably.'
  answer:
    choiceId: b
  explanation: |
    Solution:
    The pressure must decrease.
    
    Why it works:
    In a horizontal pipe, gravitational potential energy is constant. Therefore, an increase in kinetic energy (speeding up) must be perfectly balanced by a decrease in pressure energy. This phenomenon is called the Venturi effect.
    
    Why the other choices fail:
    Our intuition often incorrectly links high speed with "high pressure" because getting hit by a fast jet of water exerts a high force on *us*. But *within* the steady stream itself, the lateral pressure against the walls is lower.
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
