id: physics-fixed-axis-rotation-concept-test
title: Fixed-Axis Rotation Concept Test
assessmentType: test
categoryId: physics-1
topicId: physics-comprehensive-review
modeDefault: evaluate
randomizeQuestions: true
questions:
  - id: far-q01
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Students confuse angular velocity with translational velocity."
    prerequisiteObjectiveIds: [physics-rotational-variables]
    extensionObjectiveIds: [physics-angular-translational]
    prompt: |
      A rigid disk is spinning about its central axis. How do the angular velocity and tangential (linear) speed of a point near the rim compare to a point near the center?
    choices:
      - id: a
        text: 'The point near the rim has a greater angular velocity and greater tangential speed.'
      - id: b
        text: 'They have the same angular velocity, but the point near the rim has a greater tangential speed.'
      - id: c
        text: 'They have the same tangential speed, but the point near the rim has a greater angular velocity.'
      - id: d
        text: 'They have the same angular velocity and the same tangential speed.'
    answer:
      choiceId: b
    explanation: |
        Solution: For a rigid body in rotation, all points complete one revolution in the same amount of time.
        
        Why it works: Because they rotate together, $\omega$ (angular velocity) is identical for all points. The tangential speed is $v = r\omega$. Since the rim has a larger radius $r$, its tangential speed is greater.
        
        Why the other choices fail: A rigid object cannot have different angular velocities at different radii without tearing apart.

  - id: far-q02
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Direction of angular velocity vector."
    prerequisiteObjectiveIds: [physics-rotational-variables]
    extensionObjectiveIds: [physics-rotational-variables]
    prompt: |
      A wheel is spinning counterclockwise when viewed from above. According to the right-hand rule, what is the direction of its angular velocity vector?
    choices:
      - id: a
        text: 'Counterclockwise.'
      - id: b
        text: 'Inward toward the center of the wheel.'
      - id: c
        text: 'Upward (out of the plane).'
      - id: d
        text: 'Downward (into the plane).'
    answer:
      choiceId: c
    explanation: |
        Solution: The right-hand rule determines the direction of axial vectors.
        
        Why it works: Curl the fingers of your right hand in the direction of rotation (counterclockwise). Your extended thumb points upward, which is the direction of the angular velocity vector $\vec{\omega}$.
        
        Why the other choices fail: Angular velocity is a vector perpendicular to the plane of rotation, not a circular path.

  - id: far-q03
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Analogy between kinematics equations."
    prerequisiteObjectiveIds: [physics-constant-angular-acceleration]
    extensionObjectiveIds: [physics-constant-angular-acceleration]
    prompt: |
      Which of the following rotational kinematic equations correctly corresponds to the translational equation $v^2 = v_0^2 + 2a\Delta x$?
    choices:
      - id: a
        text: '$\omega = \omega_0 + \alpha t$'
      - id: b
        text: '$\theta = \omega_0 t + \frac{1}{2}\alpha t^2$'
      - id: c
        text: '$\omega^2 = \omega_0^2 + 2\alpha\Delta\theta$'
      - id: d
        text: '$\tau = I\alpha$'
    answer:
      choiceId: c
    explanation: |
        Solution: The direct analogies are $v \leftrightarrow \omega$, $a \leftrightarrow \alpha$, and $x \leftrightarrow \theta$.
        
        Why it works: Substituting the rotational analogs into the translational equation directly yields $\omega^2 = \omega_0^2 + 2\alpha\Delta\theta$.
        
        Why the other choices fail: Option A corresponds to $v = v_0 + at$. Option B corresponds to $x = x_0 + v_0 t + \frac{1}{2}at^2$. Option D is Newton's Second Law for rotation, not a kinematic equation.

  - id: far-q04
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Relating angular and tangential acceleration."
    prerequisiteObjectiveIds: [physics-angular-translational]
    extensionObjectiveIds: [physics-angular-translational]
    prompt: |
      If a rotating wheel is slowing down, what can be said about its angular velocity $\vec{\omega}$ and angular acceleration $\vec{\alpha}$?
    choices:
      - id: a
        text: 'They point in the same direction.'
      - id: b
        text: 'They point in opposite directions.'
      - id: c
        text: 'They are perpendicular to each other.'
      - id: d
        text: '$\vec{\alpha}$ is zero because the wheel is slowing down.'
    answer:
      choiceId: b
    explanation: |
        Solution: Angular acceleration dictates the rate of change of angular velocity.
        
        Why it works: Just like in linear 1D kinematics, if an object is slowing down, its acceleration vector must oppose its velocity vector. Therefore, $\vec{\alpha}$ and $\vec{\omega}$ point in opposite directions along the axis of rotation.
        
        Why the other choices fail: Same direction means speeding up. Perpendicular would change the axis of rotation (precession), not speed.

  - id: far-q05
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Moment of inertia mass distribution dependence."
    prerequisiteObjectiveIds: [physics-moment-of-inertia-ke]
    extensionObjectiveIds: [physics-calculating-moi]
    prompt: |
      Two cylinders have the same mass and the same outer radius. Cylinder A is a solid, uniform cylinder. Cylinder B is a hollow hoop with all its mass concentrated at the outer rim. Which one has a larger moment of inertia about its central axis?
    choices:
      - id: a
        text: 'Cylinder A'
      - id: b
        text: 'Cylinder B'
      - id: c
        text: 'They have the same moment of inertia.'
      - id: d
        text: 'It depends on their lengths.'
    answer:
      choiceId: b
    explanation: |
        Solution: Moment of inertia $I = \int r^2 dm$ depends on how far the mass is distributed from the axis.
        
        Why it works: In the hollow hoop (B), all the mass is at the maximum distance $R$ from the axis ($I = MR^2$). In the solid cylinder (A), mass is distributed from $r=0$ to $r=R$, so its effective distance is smaller ($I = \frac{1}{2}MR^2$).
        
        Why the other choices fail: Mass and radius alone do not determine $I$; the distribution is critical. Length does not affect $I$ if mass and radius are fixed.

  - id: far-q06
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Moment of inertia of everyday objects."
    prerequisiteObjectiveIds: [physics-calculating-moi]
    extensionObjectiveIds: [physics-calculating-moi]
    prompt: |
      A tightrope walker carries a long, heavy pole to help balance. How does the pole aid their balance?
    choices:
      - id: a
        text: 'It lowers their center of mass.'
      - id: b
        text: 'It greatly increases their moment of inertia, resisting rotational acceleration.'
      - id: c
        text: 'It decreases their total weight.'
      - id: d
        text: 'It creates a gyroscopic effect that keeps them upright.'
    answer:
      choiceId: b
    explanation: |
        Solution: Resistance to angular acceleration is given by $\alpha = \tau_{net} / I$.
        
        Why it works: A long pole places mass very far from the axis of rotation (the tightrope), making $I$ very large. For any given unbalanced torque $\tau$ (from leaning), the resulting angular acceleration $\alpha$ is small, giving the walker more time to correct.
        
        Why the other choices fail: It actually raises their center of mass slightly (if held at chest level) and increases their total weight. The pole is not spinning, so there is no gyroscopic effect.

  - id: far-q07
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Torque dependence on force application point."
    prerequisiteObjectiveIds: [physics-torque]
    extensionObjectiveIds: [physics-torque]
    prompt: |
      You are trying to open a heavy door. Which of the following strategies will maximize the torque you apply?
    choices:
      - id: a
        text: 'Push as close to the hinges as possible, perpendicular to the door.'
      - id: b
        text: 'Push at the doorknob, at a 45-degree angle to the door.'
      - id: c
        text: 'Push at the doorknob, perpendicular to the door.'
      - id: d
        text: 'Push on the hinges parallel to the door.'
    answer:
      choiceId: c
    explanation: |
        Solution: Torque is defined as $\tau = r F \sin\theta$.
        
        Why it works: To maximize torque, you want the largest lever arm $r$ (push at the doorknob, farthest from hinges) and the largest angle factor $\sin\theta = 1$ (push perpendicularly, $\theta = 90^\circ$).
        
        Why the other choices fail: Pushing near the hinges reduces $r$. Pushing at an angle reduces $\sin\theta$. Pushing parallel to the door ($\theta = 0^\circ$) yields zero torque.

  - id: far-q08
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Net torque vs net force."
    prerequisiteObjectiveIds: [physics-torque]
    extensionObjectiveIds: [physics-torque]
    prompt: |
      If the net force on an extended object is zero, does that guarantee the net torque on the object is also zero?
    choices:
      - id: a
        text: 'Yes, zero net force always means zero net torque.'
      - id: b
        text: 'No, a couple (two equal and opposite forces applied at different points) can produce a net torque even if net force is zero.'
      - id: c
        text: 'No, but only if the object is already in motion.'
      - id: d
        text: 'Yes, as long as the forces act on the center of mass.'
    answer:
      choiceId: b
    explanation: |
        Solution: Force controls translational acceleration; torque controls rotational acceleration.
        
        Why it works: Imagine a steering wheel. Pulling down on the left side and pushing up on the right side with equal force yields $\Sigma F = 0$, so the center of mass doesn't move. However, both forces produce a counterclockwise torque, so $\Sigma \tau \neq 0$ and the wheel rotates.
        
        Why the other choices fail: Net force and net torque are independent conditions for equilibrium.

  - id: far-q09
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Newton's Second Law for Rotation."
    prerequisiteObjectiveIds: [physics-newtons-second-law-rotation]
    extensionObjectiveIds: [physics-newtons-second-law-rotation]
    prompt: |
      A constant net torque is applied to a rigid body that is initially at rest. Which of the following quantities will increase at a constant rate?
    choices:
      - id: a
        text: 'Angular position.'
      - id: b
        text: 'Angular velocity.'
      - id: c
        text: 'Angular acceleration.'
      - id: d
        text: 'Moment of inertia.'
    answer:
      choiceId: b
    explanation: |
        Solution: Newton's Second Law for rotation is $\tau_{net} = I\alpha$.
        
        Why it works: A constant net torque produces a constant angular acceleration $\alpha$. Since $\alpha = d\omega/dt$, a constant $\alpha$ means angular velocity $\omega$ increases at a constant, linear rate.
        
        Why the other choices fail: Angular position increases quadratically ($\theta \propto t^2$). Angular acceleration is constant, not increasing. Moment of inertia is a fixed property of the rigid body.

  - id: far-q10
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Rotational inertia affecting translational motion."
    prerequisiteObjectiveIds: [physics-newtons-second-law-rotation]
    extensionObjectiveIds: [physics-newtons-second-law-rotation]
    prompt: |
      A mass $m$ is hung from a string wrapped around a massive pulley of moment of inertia $I$. When the mass is released, how does its downward linear acceleration $a$ compare to the acceleration it would have in free fall ($g$)?
    choices:
      - id: a
        text: '$a = g$'
      - id: b
        text: '$a > g$'
      - id: c
        text: '$a < g$'
      - id: d
        text: 'It depends on the radius of the pulley.'
    answer:
      choiceId: c
    explanation: |
        Solution: The falling mass must accelerate not only itself but also provide the torque to rotationally accelerate the massive pulley.
        
        Why it works: Tension in the string acts upward on the mass, slowing its fall: $mg - T = ma$. This tension also provides the torque to the pulley: $TR = I(a/R)$. Because energy/force is diverted into rotating the pulley, $a < g$.
        
        Why the other choices fail: $a=g$ only happens if the pulley is massless and frictionless.

  - id: far-q11
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Work done by torque."
    prerequisiteObjectiveIds: [physics-rotational-work-power]
    extensionObjectiveIds: [physics-rotational-work-power]
    prompt: |
      What is the rotational equivalent of the work equation $W = \int F dx$?
    choices:
      - id: a
        text: '$W = \int \tau d\omega$'
      - id: b
        text: '$W = \int \tau d\theta$'
      - id: c
        text: '$W = \int I d\alpha$'
      - id: d
        text: '$W = \int \omega d\tau$'
    answer:
      choiceId: b
    explanation: |
        Solution: Substitute the rotational analogs into the translational equation.
        
        Why it works: Force $F$ becomes torque $\tau$, and linear displacement $dx$ becomes angular displacement $d\theta$. Thus, rotational work is $W = \int \tau d\theta$.
        
        Why the other choices fail: $d\omega$ is change in velocity, $d\alpha$ is change in acceleration, none of which correspond to displacement $dx$.

  - id: far-q12
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Rotational Kinetic Energy definition."
    prerequisiteObjectiveIds: [physics-moment-of-inertia-ke]
    extensionObjectiveIds: [physics-moment-of-inertia-ke]
    prompt: |
      A solid sphere is rotating in place about its center. Does it have kinetic energy?
    choices:
      - id: a
        text: 'No, because its center of mass is not moving.'
      - id: b
        text: 'Yes, because the individual particles making up the sphere are moving.'
      - id: c
        text: 'No, because kinetic energy requires a net force.'
      - id: d
        text: 'Yes, but only if it is also moving linearly.'
    answer:
      choiceId: b
    explanation: |
        Solution: Rotational kinetic energy ($K_{rot} = \frac{1}{2}I\omega^2$) is simply the sum of the translational kinetic energies of all the constituent particles.
        
        Why it works: Even though the center of mass is stationary ($v_{cm} = 0$), all other particles in the sphere are traveling in circles, thus they have speed and kinetic energy.
        
        Why the other choices fail: Kinetic energy does not require the center of mass to move if the object is rotating.

  - id: far-q13
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Parallel-axis theorem concepts."
    prerequisiteObjectiveIds: [physics-calculating-moi]
    extensionObjectiveIds: [physics-calculating-moi]
    prompt: |
      According to the parallel-axis theorem ($I = I_{com} + Mh^2$), how does the moment of inertia about an axis through the center of mass ($I_{com}$) compare to the moment of inertia about any other parallel axis?
    choices:
      - id: a
        text: '$I_{com}$ is always greater.'
      - id: b
        text: '$I_{com}$ is always less.'
      - id: c
        text: 'They are always equal.'
      - id: d
        text: 'It depends on the shape of the object.'
    answer:
      choiceId: b
    explanation: |
        Solution: $M$ (mass) and $h^2$ (distance squared) are always positive numbers.
        
        Why it works: Because $Mh^2 > 0$ for any axis not through the center of mass, $I = I_{com} + \text{positive number}$. Therefore, $I$ is always greater than $I_{com}$, making $I_{com}$ the minimum possible moment of inertia for a given axis orientation.
        
        Why the other choices fail: It does not depend on shape; $I_{com}$ is universally the minimum for parallel axes.

  - id: far-q14
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Torque right-hand rule cross product."
    prerequisiteObjectiveIds: [physics-torque]
    extensionObjectiveIds: [physics-torque]
    prompt: |
      Torque is defined as the cross product $\vec{\tau} = \vec{r} \times \vec{F}$. If position vector $\vec{r}$ points east and force $\vec{F}$ points north, in what direction does the torque vector point?
    choices:
      - id: a
        text: 'North'
      - id: b
        text: 'East'
      - id: c
        text: 'Up (out of the ground)'
      - id: d
        text: 'Down (into the ground)'
    answer:
      choiceId: c
    explanation: |
        Solution: Use the right-hand rule for cross products.
        
        Why it works: Point your right fingers East (direction of $\vec{r}$), and curl them North (direction of $\vec{F}$). Your thumb will point Up, out of the ground.
        
        Why the other choices fail: The cross product of two vectors is always perpendicular to both original vectors. East and North are in the horizontal plane, so torque must be vertical.

  - id: far-q15
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Relating angular and linear equations."
    prerequisiteObjectiveIds: [physics-angular-translational]
    extensionObjectiveIds: [physics-angular-translational]
    prompt: |
      A string is wound around a pulley of radius $R$. If the string is pulled a linear distance $x$, what is the corresponding angular displacement $\theta$ of the pulley (assuming no slipping)?
    choices:
      - id: a
        text: '$\theta = x R$'
      - id: b
        text: '$\theta = x / R$'
      - id: c
        text: '$\theta = R / x$'
      - id: d
        text: '$\theta = x$'
    answer:
      choiceId: b
    explanation: |
        Solution: The arc length $s$ along the edge of a circle is related to the subtended angle by $s = \theta R$ (with $\theta$ in radians).
        
        Why it works: The linear distance the string moves ($x$) is equal to the arc length ($s$) that rotates past the tangent point. Therefore $x = \theta R$, which rearranges to $\theta = x / R$.
        
        Why the other choices fail: Option A gets the dimensional analysis wrong (meters * meters $\neq$ radians).

  - id: far-q16
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Rotational power conceptualization."
    prerequisiteObjectiveIds: [physics-rotational-work-power]
    extensionObjectiveIds: [physics-rotational-work-power]
    prompt: |
      A motor delivers a constant torque to a spinning flywheel. If the flywheel's angular velocity doubles, what happens to the mechanical power delivered by the motor?
    choices:
      - id: a
        text: 'The power remains constant.'
      - id: b
        text: 'The power halves.'
      - id: c
        text: 'The power doubles.'
      - id: d
        text: 'The power quadruples.'
    answer:
      choiceId: c
    explanation: |
        Solution: The rotational analog to $P = Fv$ is $P = \tau\omega$.
        
        Why it works: If torque $\tau$ is constant and angular velocity $\omega$ doubles, the product $P = \tau\omega$ also doubles.
        
        Why the other choices fail: Power is directly proportional to angular velocity for a constant torque.

  - id: far-q17
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Kinetic energy vs moment of inertia."
    prerequisiteObjectiveIds: [physics-moment-of-inertia-ke]
    extensionObjectiveIds: [physics-moment-of-inertia-ke]
    prompt: |
      Two spinning disks have the same angular momentum, but Disk A has a larger moment of inertia than Disk B. Which disk has more rotational kinetic energy?
    choices:
      - id: a
        text: 'Disk A'
      - id: b
        text: 'Disk B'
      - id: c
        text: 'They have the same kinetic energy.'
      - id: d
        text: 'It cannot be determined without knowing their angular velocities.'
    answer:
      choiceId: b
    explanation: |
        Solution: Rotational kinetic energy can be expressed in terms of angular momentum $L = I\omega$.
        
        Why it works: $K_{rot} = \frac{1}{2}I\omega^2 = \frac{L^2}{2I}$. Since $L$ is constant for both, kinetic energy is inversely proportional to moment of inertia. Disk B has the smaller $I$, so it has the larger kinetic energy.
        
        Why the other choices fail: This is exactly analogous to $K = p^2/(2m)$ in translational motion.

  - id: far-q18
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Net torque vs angular acceleration direction."
    prerequisiteObjectiveIds: [physics-newtons-second-law-rotation]
    extensionObjectiveIds: [physics-newtons-second-law-rotation]
    prompt: |
      A wheel is rotating clockwise but slowing down. What is the direction of the net torque acting on the wheel?
    choices:
      - id: a
        text: 'Clockwise'
      - id: b
        text: 'Counterclockwise'
      - id: c
        text: 'Toward the center'
      - id: d
        text: 'Zero'
    answer:
      choiceId: b
    explanation: |
        Solution: Net torque dictates the direction of angular acceleration ($\tau = I\alpha$).
        
        Why it works: Because the wheel is slowing down, its angular acceleration must oppose its angular velocity. The velocity is clockwise, so the acceleration (and thus the net torque causing it) must be counterclockwise.
        
        Why the other choices fail: A clockwise torque would make it speed up. Toward the center is a force direction, not a torque direction.

  - id: far-q19
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Torque from gravity on extended objects."
    prerequisiteObjectiveIds: [physics-torque]
    extensionObjectiveIds: [physics-torque]
    prompt: |
      A uniform meter stick is pivoted at the 20 cm mark. Where can we consider the force of gravity to act when calculating the gravitational torque on the stick?
    choices:
      - id: a
        text: 'At the pivot (20 cm mark).'
      - id: b
        text: 'At the center of mass (50 cm mark).'
      - id: c
        text: 'At the ends (0 cm and 100 cm marks).'
      - id: d
        text: 'Gravity does not create torque.'
    answer:
      choiceId: b
    explanation: |
        Solution: For the purpose of calculating torque and forces, the total weight of a rigid body can be considered to act at its center of mass.
        
        Why it works: The uniform meter stick has its center of mass exactly in the middle (50 cm). Gravity effectively pulls down at this point, creating a lever arm of 30 cm relative to the pivot.
        
        Why the other choices fail: Gravity acts on all parts of the stick, but its *net effect* is mathematically identical to a single force acting at the center of mass.

  - id: far-q20
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding pure rotation vs translation."
    prerequisiteObjectiveIds: [physics-angular-translational]
    extensionObjectiveIds: [physics-angular-translational]
    prompt: |
      If a rigid body undergoes pure translation (no rotation), what can be said about the velocities of all the particles within the body?
    choices:
      - id: a
        text: 'They are all zero.'
      - id: b
        text: 'They all have the same velocity vector at any given instant.'
      - id: c
        text: 'Their speeds are proportional to their distance from the center of mass.'
      - id: d
        text: 'Only the center of mass has a non-zero velocity.'
    answer:
      choiceId: b
    explanation: |
        Solution: Pure translation means the orientation of the object does not change as it moves.
        
        Why it works: Because the object does not rotate, every single point on it traces out identical, parallel paths. Therefore, at any instant, every particle has the exact same velocity vector.
        
        Why the other choices fail: If speeds varied by distance, the object would be rotating.
