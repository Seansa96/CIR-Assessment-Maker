workedExamples:
- id: we01
  title: A singular-coefficient linear IVP
  problem: Solve $xy'+y=x^2$, $y(1)=2$, on the interval containing the initial point.
  steps:
  - id: we01-s1
    title: Normalize and choose interval
    instruction: Divide only where $x$ is nonzero.
    type: freeResponse
    prompt: Write standard form and interval.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Normalizes
      - Chooses x positive
    explanation: |-
      Solution: On $x>0$, $y'+y/x=x$; this interval contains $x=1$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s2
    title: Use the product derivative
    instruction: Find the integrating factor and integrate.
    type: freeResponse
    prompt: Construct the general solution.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Finds factor
      - Integrates
    explanation: |-
      Solution: $\mu=x$ and $(xy)'=x^2$, so $xy=x^3/3+C$ and $y=x^2/3+C/x$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s3
    title: Apply and verify data
    instruction: Determine the constant and check the original equation.
    type: freeResponse
    prompt: Give the IVP solution.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Finds constant
      - Checks interval
    explanation: |-
      Solution: $2=1/3+C$ gives $C=5/3$; substitution verifies $xy'+y=x^2$ on $(0,\infty)$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we02
  title: Variation of parameters and its reciprocal factor
  problem: Solve $y'-(2/x)y=x^2$, $y(1)=0$, on $x>0$ using $y=u x^2$.
  steps:
  - id: we02-s1
    title: Choose a complementary solution
    instruction: Solve the homogeneous equation.
    type: freeResponse
    prompt: Find $y_1$ and relate it to an integrating factor.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Finds y1
      - Relates reciprocal
    explanation: |-
      Solution: $y_1=x^2$; its reciprocal $x^{-2}$ is an integrating factor.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s2
    title: Vary the parameter
    instruction: Substitute $y=ux^2$ and cancel complementary terms.
    type: freeResponse
    prompt: Find the equation for $u$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Differentiates product
      - Cancels terms
    explanation: |-
      Solution: $y'=u'x^2+2ux$, so substitution gives $u'x^2=x^2$ and $u'=1$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s3
    title: Apply data and verify
    instruction: Integrate $u$ and use the IVP.
    type: freeResponse
    prompt: Give and check the solution.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Uses data
      - Verifies
    explanation: |-
      Solution: $u=x+C$ and $0=1+C$, so $y=x^2(x-1)$; direct substitution verifies the IVP.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we03
  title: A separable branch with finite blow-up
  problem: Solve $y'=y(y-2)$, $y(0)=3$, and find the maximal interval.
  steps:
  - id: we03-s1
    title: Retain and separate
    instruction: Record equilibria, then divide.
    type: freeResponse
    prompt: Write the separated equation.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Retains equilibria
      - Separates
    explanation: |-
      Solution: $y=0,2$ are equilibria; for the IVP branch, $dy/[y(y-2)]=dx$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s2
    title: Integrate and apply data
    instruction: Use partial fractions and the initial value.
    type: freeResponse
    prompt: Find the explicit branch.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Integrates
      - Solves branch
    explanation: |-
      Solution: $\tfrac12\ln|(y-2)/y|=x+C$ gives $(y-2)/y=e^{2x}/3$, hence $y=2/(1-e^{2x}/3)$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s3
    title: Find the maximal interval
    instruction: Locate the denominator zero around $x=0$.
    type: freeResponse
    prompt: State and verify the interval.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Finds blow-up
      - Chooses containing interval
    explanation: |-
      Solution: The denominator vanishes at $x=\tfrac12\ln3$, so the maximal interval is $(-\infty,\tfrac12\ln3)$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
