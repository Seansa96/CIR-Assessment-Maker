schemaVersion: 1
id: calc2-improper-integrals-p-test-interactive-exploration
title: Improper Integrals P-Test Interactive Exploration
assessmentType: interactiveExploration
categoryId: calculus-2
subcategoryId: improper-integrals
subcategoryIds:
  - improper-integrals
modeDefault: practice
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: interactiveExploration
  tags:
    - improper-integrals
    - p-test
    - parameter-exploration
exploration:
  introduction: |
    Vary the exponent $p$ to see how it affects the convergence or divergence of the improper integral
    
    $$
    \int_{1}^{\infty} \frac{1}{x^p}\,dx.
    $$

    The p-test states that this integral converges if and only if $p > 1$.
  sections:
    - id: explore-p-values
      title: Explore Different Values of p
      required: true
      instruction: |
        Use the slider to change the value of $p$. Notice how the exponent determines whether the accumulated area reaches a finite limit.

        When $p > 1$, the function shrinks to zero rapidly, bounding the total area. 
        When $p \le 1$, the function shrinks too slowly, and the area grows infinitely.
      controls:
        - id: p
          type: slider
          label: Exponent p
          min: 0.1
          max: 3.0
          step: 0.1
          defaultValue: '2.0'
      views:
        - id: p-value
          type: readout
          label: Current value of p
          expression: p
        - id: convergence-status
          type: conditionalText
          label: Convergence
          condition: p>1
          content: The integral converges because p > 1. The accumulated area is finite.
        - id: divergence-status
          type: conditionalText
          label: Divergence
          condition: p<=1
          content: The integral diverges because p <= 1. The accumulated area is infinite.
        - id: evaluated-integral
          type: conditionalText
          label: Evaluated Area Limit
          condition: p>1
          content: Since p > 1, the integral converges to 1 / (p - 1).
      check:
        id: explore-p-values-check
        type: multipleChoice
        prompt: If you set $p = 0.5$, what is the result according to the p-test?
        choices:
          - id: a
            text: The integral converges because $0.5 < 1$.
          - id: b
            text: The integral diverges because $0.5 \le 1$.
          - id: c
            text: The integral converges because the function is positive.
          - id: d
            text: The integral evaluates to zero.
        answer:
          choiceId: b
        explanation: |
          Since $p = 0.5 \le 1$, the function does not approach zero fast enough, and the total area under the curve is infinite.

          Related topic: evaluating improper integrals with the p-test.


