schemaVersion: 1
id: power-reduction-identities-quiz
title: Power Reduction Identities Pattern Quiz
assessmentType: quiz
categoryId: trigonometry
subcategoryIds:
  - trig-power-reduction
modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Which identity should replace $\sin^2 x$?
    choices:
      - id: a
        text: '$\frac{1-\cos(2x)}{2}$'
      - id: b
        text: '$\frac{1+\cos(2x)}{2}$'
      - id: c
        text: '$2\sin x\cos x$'
      - id: d
        text: '$1+\tan^2 x$'
    answer:
      choiceId: a
    explanation: "Related topic: sine power reduction. Check the identity at $x=0$ to remember the minus sign."

  - id: q002
    type: multipleChoice
    prompt: |
      Which identity should replace $\cos^2 x$?
    choices:
      - id: a
        text: '$\frac{1+\cos(2x)}{2}$'
      - id: b
        text: '$\frac{1-\cos(2x)}{2}$'
      - id: c
        text: '$\sin(2x)$'
      - id: d
        text: '$1-\sin^2 x$ only, with no other option'
    answer:
      choiceId: a
    explanation: 'Related topic: cosine power reduction. At $x=0$, cosine squared is 1, so the numerator must be $1+\cos(0)=2$.'

  - id: q003
    type: multipleChoice
    prompt: "What is the main structural cue for power reduction?"
    choices:
      - id: a
        text: "Even powers of sine or cosine"
      - id: b
        text: "A rational function with repeated linear factors"
      - id: c
        text: "A product of a polynomial and logarithm"
      - id: d
        text: 'A radical of the form $\sqrt{a^2-x^2}$'
    answer:
      choiceId: a
    explanation: "Related topic: recognizing trig identity use. Power reduction is built for even powers that are awkward to integrate or simplify directly."

  - id: q004
    type: multipleChoice
    prompt: |
      What is the best first step for $\sin^4 x$?
    choices:
      - id: a
        text: 'Rewrite it as $(\sin^2 x)^2$ and reduce $\sin^2 x$'
      - id: b
        text: 'Replace it with $\sin(4x)$'
      - id: c
        text: 'Replace it with $\cos(4x)$'
      - id: d
        text: "Cancel two sine factors"
    answer:
      choiceId: a
    explanation: "Related topic: repeated power reduction. Higher even powers are reduced in layers."

  - id: q005
    type: multipleChoice
    prompt: |
      What is the most useful rewrite for $\int \cos^2 x\,dx$?
    choices:
      - id: a
        text: '$\int \frac{1+\cos(2x)}{2}\,dx$'
      - id: b
        text: '$\int \frac{1-\cos(2x)}{2}\,dx$'
      - id: c
        text: '$\int 2\sin x\cos x\,dx$'
      - id: d
        text: '$\int \sec^2 x\,dx$'
    answer:
      choiceId: a
    explanation: "Related topic: integrating cosine squared. Use power reduction to split the integral into a constant part and a double-angle part."

  - id: q006
    type: multipleChoice
    prompt: |
      Which expression is equivalent to $1-\cos(2x)$?
    choices:
      - id: a
        text: '$2\sin^2 x$'
      - id: b
        text: '$2\cos^2 x$'
      - id: c
        text: '$\sin(2x)$'
      - id: d
        text: '$\tan^2 x$'
    answer:
      choiceId: a
    explanation: 'Related topic: rearranging power reduction identities. From $\sin^2 x=(1-\cos(2x))/2$, multiply both sides by 2.'

  - id: q007
    type: multipleChoice
    prompt: "Which expression is not primarily a power-reduction situation?"
    choices:
      - id: a
        text: '$\sin x\cos x$'
      - id: b
        text: '$\sin^2 x$'
      - id: c
        text: '$\cos^4 x$'
      - id: d
        text: '$\sin^2 x\cos^2 x$'
    answer:
      choiceId: a
    explanation: 'Related topic: product-to-double-angle identities. $\sin x\cos x$ is usually rewritten with $\sin(2x)=2\sin x\cos x$.'

  - id: q008
    type: multipleChoice
    prompt: |
      Why does power reduction often make trig integrals easier?
    choices:
      - id: a
        text: "It turns even powers into constants and double-angle terms that are easier to integrate."
      - id: b
        text: "It always removes every trigonometric function."
      - id: c
        text: "It converts all trig expressions into rational functions."
      - id: d
        text: "It avoids the need for any identities."
    answer:
      choiceId: a
    explanation: "Related topic: purpose of power reduction. The method reduces the power and changes the structure into simpler pieces."
