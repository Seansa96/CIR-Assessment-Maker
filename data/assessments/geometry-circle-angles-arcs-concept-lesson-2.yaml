lesson:
  introduction: |-
    We know what happens when an angle is exactly at the center (central) or exactly on the edge (inscribed). But what if the angle's vertex is floating somewhere inside the circle, or somewhere outside the circle?
  sections:
  - id: sec-interior
    title: Angles Inside the Circle
    required: true
    content: |-
      When two chords intersect *inside* a circle (but not at the center), they form vertical angles that intercept two different arcs on opposite sides of the circle.
      
      **Interior Angle Theorem**: The measure of an angle formed by two intersecting chords is half the **sum** of the measures of the intercepted arcs.
      $$\text{Angle} = \frac{\text{Arc}_1 + \text{Arc}_2}{2}$$
      
      Basically, the angle is the *average* of the two arcs it cuts off!

  - id: sec-exterior
    title: Angles Outside the Circle
    required: true
    content: |-
      When two secants, two tangents, or a secant and a tangent intersect *outside* a circle, they form an angle that intercepts two arcs on the circle (a "far" arc and a "near" arc).
      
      **Exterior Angle Theorem**: The measure of an angle formed outside a circle is half the **difference** of the measures of the intercepted arcs.
      $$\text{Angle} = \frac{\text{Far Arc} - \text{Near Arc}}{2}$$
      
      *Mnemonic*: If the vertex is INSIDE, you ADD (+). If the vertex is OUTSIDE, you SUBTRACT (-).

questions:
- id: q-geom-arcs2-1
  title: Concept Check - Interior Angle
  prompt: |-
    Two chords intersect inside a circle. The two arcs intercepted by the vertical angles measure $40^\circ$ and $80^\circ$. What is the measure of the angle between the chords?
  type: numericResponse
  answer:
    numericValue: 60
    tolerance: 0
  explanation: |-
    Because the intersection is inside the circle, we add the arcs and divide by two (average them).
    $$\text{Angle} = \frac{40^\circ + 80^\circ}{2} = \frac{120^\circ}{2} = 60^\circ$$
  skills:
  - geometry-circle-angles-arcs

- id: q-geom-arcs2-2
  title: Concept Check - Exterior Angle
  prompt: |-
    Two secants intersect outside a circle. They intercept a far arc measuring $100^\circ$ and a near arc measuring $30^\circ$. What is the measure of the angle formed outside the circle?
  type: numericResponse
  answer:
    numericValue: 35
    tolerance: 0
  explanation: |-
    Because the intersection is outside the circle, we subtract the near arc from the far arc and divide by two.
    $$\text{Angle} = \frac{100^\circ - 30^\circ}{2} = \frac{70^\circ}{2} = 35^\circ$$
  skills:
  - geometry-circle-angles-arcs
