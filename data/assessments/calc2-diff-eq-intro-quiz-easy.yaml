  skills: [translate rate statements]
  prompt: In a fixed population $M$, $y$ people have heard a rumor. Enter the rate model if spreading is proportional to interactions between informed and uninformed people.
  answer: { expectedLatex: 'k*y*(M-y)', equivalenceMode: expression, tolerance: 0.000001, variables: [k, y, M], explanation: The two interacting groups have sizes $y$ and $M-y$. }
