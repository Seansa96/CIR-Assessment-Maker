questions:
- id: q1
  type: numericResponse
  prompt: A disk with $I = 3.0 \text{ kg}\cdot\text{m}^2$ spins at $4.0 \text{ rad/s}$.
    What is the magnitude of its angular momentum?
  answer:
    value: 12.0
    tolerance: 0.5
  explanation: $L = I\omega = 3.0(4.0) = 12 \text{ kg}\cdot\text{m}^2/\text{s}$.
