questions:
- id: q1
  type: numericResponse
  prompt: A disk with $I = 3.0 \text{ kg}\cdot\text{m}^2$ spins at $4.0 \text{ rad/s}$.
    What is the magnitude of its angular momentum?
  answer:
    value: 12.0
    tolerance: 0.5
  difficultyDimensions: [modelOrDerivation, representationTransfer]
  subjectDifficultyTags: [rigid-body-angular-momentum]
  difficultyEvidence: Applies the rigid-body angular-momentum model and keeps rotational SI units explicit.
  prerequisiteObjectiveIds: [phys1-obj-fixed-axis-rotation]
  explanation: |
    Solution:

    $$
    L=I\omega=(3.0\ \text{kg}\cdot\text{m}^2)(4.0\ \text{rad/s})
    =12\ \text{kg}\cdot\text{m}^2/\text{s}.
    $$

    Why it works: For a rigid body rotating about its symmetry axis, angular-momentum magnitude is $L=I\omega$.
