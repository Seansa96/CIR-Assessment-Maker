workedExamples:
  - id: cubic-parametric-tangent-values-example
    title: Horizontal and Vertical Tangents From Component Derivatives
    problem: |
      ![Parametric cubic curve with horizontal, vertical, and singular tangent candidates marked](/assessments/calc2-parametric-polar/parametric-review-cubic-horizontal-vertical-tangents.svg)

      Find all values of $t$ where the curve

      $$
      x=t^3-3t^2,\qquad y=t^3-12t
      $$

      has a horizontal or vertical tangent.
    steps:
      - id: cubic-tangent-values-step-1
        title: Differentiate both components
        instruction: |
          For parametric curves, horizontal and vertical tangents come from the component derivatives:

          $$
          \frac{dx}{dt},\qquad \frac{dy}{dt}.
          $$
        type: selectAll
        prompt: Which component derivatives are correct?
        choices:
          - id: a
            text: '$\frac{dx}{dt}=3t^2-6t=3t(t-2)$'
          - id: b
            text: '$\frac{dy}{dt}=3t^2-12=3(t-2)(t+2)$'
          - id: c
            text: '$\frac{dx}{dt}=3t^2-3t$'
          - id: d
            text: '$\frac{dy}{dt}=3t^2-12t$'
        answer:
          choiceIds:
            - a
            - b
        explanation: |
          Differentiate term by term:

          $$
          \frac{dx}{dt}=3t^2-6t=3t(t-2),
          $$

          $$
          \frac{dy}{dt}=3t^2-12=3(t-2)(t+2).
          $$
      - id: cubic-tangent-values-step-2
        title: Find horizontal candidates
        instruction: |
          A horizontal tangent requires:

          $$
          \frac{dy}{dt}=0
          $$

          while also requiring:

          $$
          \frac{dx}{dt}\ne0.
          $$
        type: multipleChoice
        prompt: Which values make $\frac{dy}{dt}=0$?
        choices:
          - id: a
            text: '$t=-2$ and $t=2$'
          - id: b
            text: '$t=0$ and $t=2$'
          - id: c
            text: '$t=-2$ only'
          - id: d
            text: '$t=2$ only'
        answer:
          choiceId: a
        explanation: |
          Since

          $$
          \frac{dy}{dt}=3(t-2)(t+2),
          $$

          the candidates are $t=-2$ and $t=2$.
      - id: cubic-tangent-values-step-3
        title: Keep only valid horizontal tangents
        instruction: |
          A candidate from $\frac{dy}{dt}=0$ is not automatically horizontal. You must check that $\frac{dx}{dt}$ is nonzero at that same $t$.
        type: multipleChoice
        prompt: Which value gives a true horizontal tangent?
        choices:
          - id: a
            text: '$t=-2$ only'
          - id: b
            text: '$t=2$ only'
          - id: c
            text: '$t=-2$ and $t=2$'
          - id: d
            text: 'Neither value'
        answer:
          choiceId: a
        explanation: |
          Check $\frac{dx}{dt}=3t(t-2)$.

          At $t=-2$:

          $$
          \frac{dx}{dt}=3(-2)(-4)=24\ne0,
          $$

          so $t=-2$ gives a horizontal tangent.

          At $t=2$:

          $$
          \frac{dx}{dt}=3(2)(0)=0,
          $$

          so $t=2$ is a singular candidate, not an ordinary horizontal tangent.
      - id: cubic-tangent-values-step-4
        title: Find vertical candidates
        instruction: |
          A vertical tangent requires:

          $$
          \frac{dx}{dt}=0
          $$

          while also requiring:

          $$
          \frac{dy}{dt}\ne0.
          $$
        type: multipleChoice
        prompt: Which values make $\frac{dx}{dt}=0$?
        choices:
          - id: a
            text: '$t=0$ and $t=2$'
          - id: b
            text: '$t=-2$ and $t=2$'
          - id: c
            text: '$t=0$ only'
          - id: d
            text: '$t=2$ only'
        answer:
          choiceId: a
        explanation: |
          Since

          $$
          \frac{dx}{dt}=3t(t-2),
          $$

          the candidates are $t=0$ and $t=2$.
      - id: cubic-tangent-values-step-5
        title: Keep only valid vertical tangents
        instruction: |
          Now check whether $\frac{dy}{dt}$ is nonzero at each vertical candidate.
        type: multipleChoice
        prompt: Which value gives a true vertical tangent?
        choices:
          - id: a
            text: '$t=0$ only'
          - id: b
            text: '$t=2$ only'
          - id: c
            text: '$t=0$ and $t=2$'
          - id: d
            text: 'Neither value'
        answer:
          choiceId: a
        explanation: |
          At $t=0$:

          $$
          \frac{dy}{dt}=3(0-2)(0+2)=-12\ne0,
          $$

          so $t=0$ gives a vertical tangent.

          At $t=2$, both component derivatives are zero, so it must be analyzed separately.
      - id: cubic-tangent-values-step-6
        title: Classify the shared zero
        instruction: |
          At $t=2$, both $\frac{dx}{dt}$ and $\frac{dy}{dt}$ are zero. Use the simplified slope away from the removable factor:

          $$
          \frac{dy}{dx}
          =
          \frac{3(t-2)(t+2)}{3t(t-2)}
          =
          \frac{t+2}{t},
          \qquad t\ne2.
          $$
        type: multipleChoice
        prompt: What happens at $t=2$?
        choices:
          - id: a
            text: 'It has limiting slope $2$, so it is neither horizontal nor vertical.'
          - id: b
            text: 'It is horizontal because $\frac{dy}{dt}=0$.'
          - id: c
            text: 'It is vertical because $\frac{dx}{dt}=0$.'
          - id: d
            text: 'It has no tangent because both derivatives vanish.'
        answer:
          choiceId: a
        explanation: |
          The simplified slope approaches:

          $$
          \lim_{t\to2}\frac{t+2}{t}=2.
          $$

          Since the limiting tangent slope is finite and nonzero, it is not horizontal and not vertical.
      - id: cubic-tangent-values-step-7
        title: State the final values
        instruction: |
          Collect only the values that passed the nonzero component-derivative checks.
        type: multipleChoice
        prompt: What is the final answer?
        choices:
          - id: a
            text: 'Horizontal at $t=-2$; vertical at $t=0$.'
          - id: b
            text: 'Horizontal at $t=-2,2$; vertical at $t=0,2$.'
          - id: c
            text: 'Horizontal at $t=0$; vertical at $t=-2$.'
          - id: d
            text: 'Horizontal at $t=2$; vertical at $t=2$.'
        answer:
          choiceId: a
        explanation: |
          Final result:

          $$
          \boxed{\text{horizontal tangent at }t=-2}
          $$

          and

          $$
          \boxed{\text{vertical tangent at }t=0.}
          $$

          The shared zero at $t=2$ has limiting slope $2$, so it is a special tangent point but not horizontal or vertical.
