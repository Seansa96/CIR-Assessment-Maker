glossary:
  introduction: Retrieve the definitions and relations that determine when mechanical energy can be conserved.
  sections:
  - id: potential-energy-terms
    title: Potential energy and conservation terms
    required: true
    content: Pair each energy term with its relation and model condition.
    entries:
    - id: conservative-force
      term: Conservative force
      definition: A force whose work between two positions is independent of path.
      notation: $W_c=-\Delta U$
      examples:
      - Gravity and an ideal spring force are conservative.
      aliases: []
      media: []
      tags:
      - conservation
      drills:
      - id: conservative-cloze
        type: cloze
        prompt: For a conservative force, work is independent of the ____.
        answer:
          expected: path
          expectedLatex: ''
          aliases:
          - route
          media: []
          choiceId: 
        explanation: 'Solution: The missing word is "path."\n\nWhy it works: Only endpoints determine conservative-force work.'
        tags:
        - conservation
        skills: []
        issueSignals: []
        choices: []
    - id: gravitational-potential
      term: Gravitational potential energy
      definition: Energy associated with height near Earth''s surface.
      notation: $U_g=mgy$
      examples:
      - Raising a mass increases $U_g$.
      aliases: []
      media: []
      tags:
      - gravity
      drills:
      - id: gravity-cloze
        type: cloze
        prompt: Near Earth, $U_g=mg____$.
        answer:
          expected: y
          expectedLatex: y
          aliases:
          - height
          media: []
          choiceId: 
        explanation: 'Solution: Insert $y$.\n\nWhy it works: Gravitational potential energy increases with vertical position.'
        tags:
        - gravity
        skills: []
        issueSignals: []
        choices: []
    - id: elastic-potential
      term: Elastic potential energy
      definition: Energy stored by an ideal spring displaced from equilibrium.
      notation: $U_s=\tfrac12kx^2$
      examples:
      - Compression and extension store the same energy for equal $|x|$.
      aliases:
      - spring energy
      media: []
      tags:
      - spring
      drills:
      - id: spring-cloze
        type: cloze
        prompt: An ideal spring has $U_s=\tfrac12k____^2$.
        answer:
          expected: x
          expectedLatex: x
          aliases:
          - displacement
          media: []
          choiceId: 
        explanation: 'Solution: Insert $x$.\n\nWhy it works: Spring energy depends on squared displacement.'
        tags:
        - spring
        skills: []
        issueSignals: []
        choices: []
    - id: turning-point
      term: Turning point
      definition: A position where kinetic energy and speed are zero for a given total energy.
      notation: $E=U$, $K=0$
      examples:
      - The highest point of vertical motion is a turning point.
      aliases: []
      media: []
      tags:
      - diagrams
      drills:
      - id: turning-cloze
        type: cloze
        prompt: At a turning point, kinetic energy is ____.
        answer:
          expected: 0
          expectedLatex: 0
          aliases:
          - zero
          media: []
          choiceId: 
        explanation: 'Solution: It is $0$.\n\nWhy it works: All available mechanical energy is potential energy at the turning point.'
        tags:
        - diagrams
        skills: []
        issueSignals: []
        choices: []
