    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: mathematical-translation-error
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: mathematical-translation-error
    answer:
      choiceId: a
    issueSignals:
    - id: mathematical-translation-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $\langle1,2,3\rangle$

