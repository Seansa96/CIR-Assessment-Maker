workedExamples:
- id: example-001
  title: Construct and verify a plane
  problem: Find a scalar equation for the plane through $P(1,-2,3)$ with normal vector $\mathbf n=\langle2,-1,4\rangle$, then verify that $P$ lies on your plane.
  steps:
  - id: s001
    title: Identify the governing form
    instruction: Select the plane equation that uses a point and a normal vector.
    hint: A plane point must make its displacement from $P$ perpendicular to the normal.
    type: multipleChoice
    prompt: Which form should be used?
    choices:
    - id: a
      text: $\mathbf n\cdot(\mathbf r-\mathbf r_0)=0$
      media: []
      issueSignals: []
    - id: b
      text: $\mathbf r=\mathbf r_0+t\mathbf n$
      media: []
      issueSignals:
      - id: line-plane-role-confusion
        domains: []
    - id: c
      text: $|\mathbf r-\mathbf r_0|=|\mathbf n|$
      media: []
      issueSignals:
      - id: point-plane-distance-error
        domains: []
    - id: d
      text: $\mathbf r\cdot\mathbf n=\mathbf r_0$
      media: []
      issueSignals:
      - id: point-normal-sign-error
        domains: []
    answer:
      choiceId: a
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: Use $\mathbf n\cdot(\mathbf r-\mathbf r_0)=0$.

      Why it works: This dot product is zero precisely when the displacement from the known point is perpendicular to the plane normal.

      Why the other choices fail: b traces a line in the normal direction. c imposes an equal-distance condition. d equates unlike vector and scalar quantities.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals:
    - id: line-plane-role-confusion
      domains: []
  - id: s002
    title: Substitute the normal and point
    instruction: Write the point-normal equation before expanding it.
    hint: The displacement is $\langle x-1,y-(-2),z-3\rangle$.
    type: symbolicResponse
    prompt: Enter the equation after substituting $\mathbf n=\langle2,-1,4\rangle$ and $P=(1,-2,3)$.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 2(x-1)-(y+2)+4(z-3)=0
      equivalenceMode: expression
      variables:
      - x
      - y
      - z
      value: 
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $2(x-1)-(y+2)+4(z-3)=0$.

      Why it works: Dotting $\langle2,-1,4\rangle$ with $\langle x-1,y+2,z-3\rangle$ matches each normal component to the corresponding coordinate displacement.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals:
    - id: point-normal-sign-error
      domains: []
  - id: s003
    title: Expand the x contribution
    instruction: Isolate the contribution from the normal's x-component.
    hint: Distribute 2 to both terms.
    type: symbolicResponse
    prompt: Enter the expansion of $2(x-1)$.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 2x-2
      equivalenceMode: expression
      variables:
      - x
      value: 
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $2(x-1)=2x-2$.

      Why it works: Distribution multiplies both $x$ and $-1$ by the x-component of the normal.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals:
    - id: point-normal-sign-error
      domains: []
  - id: s004
    title: Expand and collect terms
    instruction: Combine all variable and constant contributions.
    hint: The constant terms are $-2$, $-2$, and $-12$.
    type: symbolicResponse
    prompt: Enter the expanded left-hand side of the plane equation, set equal to zero.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 2x-y+4z-16=0
      equivalenceMode: expression
      variables:
      - x
      - y
      - z
      value: 
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $2x-y+4z-16=0$.

      Why it works: Expanding gives $2x-2-y-2+4z-12=0$, and collecting the constants gives $-16$.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
