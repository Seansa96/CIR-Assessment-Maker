    - id: point-normal-sign-error
      domains: []
  - id: s005
    title: State the plane
    instruction: Use the equivalent scalar equation with the constant on the right.
    hint: Add 16 to both sides of $2x-y+4z-16=0$.
    type: symbolicResponse
    prompt: Enter the final scalar plane equation.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 2x-y+4z=16
      equivalenceMode: expression
      variables:
      - x
      - y
      - z
      value: 
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $2x-y+4z=16$.

      Why it works: Moving the constant preserves equality and leaves the normal coefficients $\langle2,-1,4\rangle$ visible.
    media: []
    language: 
