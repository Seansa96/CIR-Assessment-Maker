  - id: s006
    title: Verify the given point
    instruction: Substitute $P(1,-2,3)$ into the final equation.
    hint: Evaluate the left side of $2x-y+4z=16$ using the point's coordinates.
    type: numericResponse
    prompt: What value does $2(1)-(-2)+4(3)$ produce?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 16
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $2+2+12=16$, matching the right-hand side.

      Why it works: A point lies on a scalar plane exactly when its coordinates satisfy the equation; this checks both the point and the signs in the construction.
