workedExamples:
- id: basic-io
  title: Building a Simple Formatter
  problem: 'Write a program that asks the user for a product name, price, and quantity,
    then prints a formatted receipt.


    Example interaction:

    ```

    Product: Apples

    Price: 1.50

    Quantity: 4


    --- RECEIPT ---

    4x Apples @ $1.5

    Total: $6

    ---------------

    ```

    '
  steps:
  - id: step-basic-io-1
    title: Include necessary headers
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'To use `cin`, `cout`, and `string`, we must include the appropriate
      standard library headers.


      ```cpp

      #include <iostream>

      #include <string>


      using namespace std;

      ```

      '
  - id: step-basic-io-2
    title: Declare variables with appropriate types
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: "We need to store a name (text), a price (decimal), and a quantity\
      \ (whole number).\n\n```cpp\nint main() {\n    string name;\n    double price;\n\
      \    int quantity;\n```\n\n`string`\rholds the product name, `double` is standard\
      \ for prices/decimals, and `int` handles the whole number of items.\n"
  - id: step-basic-io-3
    title: Prompt and read input
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: "We'll print prompts using `cout` and read values using `cin`.\n\n\
      ```cpp\n    cout << \"Product: \";\n    cin >> name;\n    \n    cout << \"Price:\
      \ \";\n    cin >> price;\n    \n    cout << \"Quantity: \";\n    cin >> quantity;\n\
      ```\n\nNote that `cin >> name` works for single-word products like \"Apples\"\
      . If we wanted multi-word names like \"Gala Apples\", we would need `getline(cin,\
      \ name);`.\n"
  - id: step-basic-io-4
    title: Calculate and print output
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: "We calculate the total and print the receipt using multiple `<<`\
      \ operators to chain output together.\n\n```cpp\n    double total = price *\
      \ quantity;\n    \n    cout << \"\\n--- RECEIPT ---\\n\";\n    cout << quantity\
      \ << \"x \" << name << \" @ $\" << price << \"\\n\";\n    cout << \"Total: $\"\
      \ << total << \"\\n\";\n    cout << \"---------------\\n\";\n    \n    return\
      \ 0;\n}\n```\n\nNotice we used `\\n` inside the string literals for newlines\
      \ instead of `endl`. This is often slightly faster and cleaner when writing\
      \ many lines.\n"
  check:
    id: format-check
    type: multipleChoice
    prompt: 'If `quantity` is 3 and `price` is 2.5, what does `cout << "Cost: $" <<
      (quantity * price);` output?

      '
    choices:
    - id: a
      text: '`Cost: $7.5`'
    - id: b
      text: '`Cost: $ 7.5`'
    - id: c
      text: '`Cost: $quantity*price`'
    - id: d
      text: An error occurs
    answer:
      choiceId: a
    explanation: 'The expression `(quantity * price)` is evaluated to `7.5`, and the
      `<<` operator correctly concatenates the string literal and the numeric result.

      '
