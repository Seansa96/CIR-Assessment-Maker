workedExamples:
- id: we001
  title: Example 1
  problem: |-
    Test $\sum \frac{4^n}{5^n - 3^n}$.
  steps:
  - id: step-we001-1
    title: Solution
    instruction: |-
      $\frac{4^n}{5^n-3^n} \sim (4/5)^n$. LCT with $(4/5)^n$: $\frac{5^n}{5^n-3^n} \to 1$. Converges.
    type: freeResponse
    issueSignals:
    - id: geometric-series-convergence-error
    - id: algebraic-simplification-error
    - id: series-test-selection-error
    - id: fraction-arithmetic-error
    - id: exponent-rule-misapplied
    - id: limit-evaluation-error
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
    explanation: 'Solution:


      Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.


      Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.'
