schemaVersion: 1
id: calc2-parametric-derivatives-worked-example
title: Tangents and Concavity of Parametric Curves
assessmentType: workedExample
categoryId: calculus-2
subcategoryIds:
  - parametric-derivatives
modeDefault: study
randomizeQuestions: false
workedExamples:
  - id: we-param-deriv-1
    title: First and Second Derivatives
    problem: |
      Consider the parametric curve given by:

      $$
      x = t^2, \quad y = t^3 - 3t
      $$

      We will find the first derivative $\frac{dy}{dx}$, the second derivative $\frac{d^2y}{dx^2}$, and determine the concavity of the curve.
    steps:
      - id: step-we-param-deriv-1a
        title: Find the first derivative
        instruction: |
          The first derivative of a parametric curve is given by the formula:

          $$
          \frac{dy}{dx} = \frac{\frac{dy}{dt}}{\frac{dx}{dt}}
          $$

          First, compute $\frac{dx}{dt}$ and $\frac{dy}{dt}$.
          $\frac{dx}{dt} = 2t$
          $\frac{dy}{dt} = 3t^2 - 3$
        type: symbolicResponse
        prompt: 'What is the expression for $\frac{dy}{dx}$ in terms of $t$?'
        answer:
          expectedLatex: '\frac{3t^2 - 3}{2t}'
          equivalenceMode: algebraic
          variables:
            - t
          tolerance: 0.000001
        explanation: |
          Substituting the derivatives into the formula:
          $\frac{dy}{dx} = \frac{3t^2 - 3}{2t} = \frac{3}{2}t - \frac{3}{2}t^{-1}$.
        skills:
          - parametric-derivatives

      - id: step-we-param-deriv-1b
        title: Find the horizontal and vertical tangents
        instruction: |
          Horizontal tangents occur where $\frac{dy}{dt} = 0$ and $\frac{dx}{dt} \neq 0$.
          Vertical tangents occur where $\frac{dx}{dt} = 0$ and $\frac{dy}{dt} \neq 0$.

          Set $\frac{dy}{dt} = 3t^2 - 3 = 0 \implies t^2 = 1 \implies t = \pm 1$.
          At $t = \pm 1$, $\frac{dx}{dt} = \pm 2 \neq 0$. So there are horizontal tangents at $t = \pm 1$.
          
          Set $\frac{dx}{dt} = 2t = 0 \implies t = 0$.
          At $t = 0$, $\frac{dy}{dt} = -3 \neq 0$. So there is a vertical tangent at $t = 0$.
        type: numericResponse
        prompt: 'At what $x$-coordinate does the vertical tangent occur? (Substitute $t=0$ into the equation for $x$).'
        answer:
          expectedNumeric: 0
          tolerance: 0.000001
        explanation: |
          Since the vertical tangent occurs at $t=0$, we find the $x$-coordinate by evaluating $x(0) = 0^2 = 0$. 
          The point is $(0, 0)$.
        skills:
          - parametric-derivatives

      - id: step-we-param-deriv-1c
        title: Find the second derivative
        instruction: |
          The second derivative is given by the formula:

          $$
          \frac{d^2y}{dx^2} = \frac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}{\frac{dx}{dt}}
          $$

          We found $\frac{dy}{dx} = \frac{3}{2}t - \frac{3}{2}t^{-1}$.
          Let's find the derivative of this with respect to $t$:
          $\frac{d}{dt}\left(\frac{dy}{dx}\right) = \frac{3}{2} + \frac{3}{2}t^{-2} = \frac{3t^2 + 3}{2t^2}$
        type: symbolicResponse
        prompt: 'Now divide by $\frac{dx}{dt} = 2t$ to find $\frac{d^2y}{dx^2}$. What is the simplified expression?'
        answer:
          expectedLatex: '\frac{3t^2 + 3}{4t^3}'
          equivalenceMode: algebraic
          variables:
            - t
          tolerance: 0.000001
        explanation: |
          $$
          \frac{d^2y}{dx^2} = \frac{\frac{3t^2 + 3}{2t^2}}{2t} = \frac{3t^2 + 3}{4t^3}
          $$
        skills:
          - parametric-derivatives

      - id: step-we-param-deriv-1d
        title: Determine concavity
        instruction: |
          Concavity is determined by the sign of $\frac{d^2y}{dx^2}$.
          We found $\frac{d^2y}{dx^2} = \frac{3(t^2 + 1)}{4t^3}$.
          
          Notice that the numerator $3(t^2 + 1)$ is always strictly positive for all real $t$.
          Therefore, the sign of the second derivative depends entirely on the denominator $4t^3$.
        type: multipleChoice
        prompt: 'For what values of $t$ is the curve concave up?'
        choices:
          - id: c1
            text: '$t > 0$'
          - id: c2
            text: '$t < 0$'
          - id: c3
            text: '$t > 1$'
          - id: c4
            text: 'All real $t$'
        answer:
          correctChoiceId: c1
        explanation: |
          The curve is concave up when $\frac{d^2y}{dx^2} > 0$. 
          Since the numerator is positive, we need $4t^3 > 0$, which occurs when $t > 0$. 
          The curve is concave down for $t < 0$.
        skills:
          - parametric-derivatives
