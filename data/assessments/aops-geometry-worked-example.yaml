- id: aops-geometry-problem-1
  title: 'Direct application: Geometry'
  problem: 'Original Geometry problem 1: use the givens to identify similarity, cyclicity, and auxiliary constructions, then solve without assuming unstated facts.'
  steps:
  - id: aops-geometry-p1-s1
    title: Read the givens
    instruction: List the quantities, relationships, and restrictions that control this Geometry problem.
    type: multipleChoice
    prompt: Which action is required at this stage of the direct application problem?
    choices:
    - id: a
      text: List the quantities, relationships, and restrictions that control this Geometry problem.
    - id: b
      text: Assume the diagram is to scale.
    - id: c
      text: Discard inconvenient cases.
    - id: d
      text: Choose an answer before reasoning.
    answer:
      choiceId: a
    explanation: List the quantities, relationships, and restrictions that control this Geometry problem.
    media:
    - type: image
      src: /assessments/aops/aops-geometry-problem-1.svg
      alt: Original labeled Geometry diagram for problem 1; labels identify the givens used in the solution.
      caption: Diagram for the stated Geometry relationships.
