    - id: b
      text: Assume the diagram is to scale.
    - id: c
      text: Discard inconvenient cases.
    - id: d
      text: Choose an answer before reasoning.
    answer:
      choiceId: a
    explanation: Apply the chosen relationship carefully; preserve equality, direction, and domain restrictions.
