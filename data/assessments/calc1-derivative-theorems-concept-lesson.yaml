lesson:
  introduction: |
    Derivatives begin as limits of average rates of change, then become theorem tools for proving shape, equality, and limiting behavior.
  sections:
  - id: difference-quotient
    title: Difference quotient
    required: true
    content: |
      $\frac{f(a+h)-f(a)}{h}$ is an average rate of change. Letting $h\to0$ asks for the instantaneous rate and tangent slope.
    check:
      id: difference-quotient-check
      type: multipleChoice
      prompt: |
        What does $h$ represent in the difference quotient?
      choices:
      - id: a
        text: The horizontal change from $a$ to $a+h$
      - id: b
        text: The derivative value
      - id: c
        text: The function output
      - id: d
        text: A required integer
      answer:
        choiceId: a
      explanation: |
        $h$ is the input displacement.
  - id: mvt
    title: Mean Value Theorem
    required: true
    content: |
      The Mean Value Theorem says that under continuity and differentiability hypotheses, some instantaneous slope equals the secant slope over the interval.
    check:
      id: mvt-check
      type: multipleChoice
      prompt: |
        The MVT conclusion is $f'(c)=$ what?
      choices:
      - id: a
        text: $\frac{f(b)-f(a)}{b-a}$
      - id: b
        text: $f(b)-f(a)$
      - id: c
        text: $b-a$
      - id: d
        text: $0$ always
      answer:
        choiceId: a
      explanation: |
        The derivative equals the average rate of change over the interval.
  - id: lhospital
    title: L'Hospital's Rule
    required: true
    content: |
      L'Hospital's Rule is for certain indeterminate quotient forms such as $0/0$ or $\infty/\infty$. It is not a generic quotient simplification rule.
    check:
      id: lhospital-check
      type: multipleChoice
      prompt: |
        Which form is a direct L'Hospital candidate?
      choices:
      - id: a
        text: $0/0$
      - id: b
        text: $5/0$
      - id: c
        text: $0/5$
      - id: d
        text: $5/5$
      answer:
        choiceId: a
      explanation: |
        $0/0$ is indeterminate and may permit L'Hospital's Rule after checking hypotheses.
