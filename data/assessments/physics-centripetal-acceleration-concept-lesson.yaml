lesson:
  introduction: 'Uniform circular motion has constant speed but not constant velocity.
    This lesson

    develops the inward acceleration model, derives its common forms, and connects
    it

    to the real forces that bend a trajectory.

    '
  sections:
  - id: velocity-is-a-vector
    title: Constant speed can still mean acceleration
    required: true
    content: 'Velocity includes direction. As a particle moves around a circle, its
      velocity

      remains tangent to the path, so the velocity vector continuously rotates.

      Acceleration measures the rate of change of the **velocity vector**, not merely

      the rate of change of speed.

      '
    check:
      id: velocity-is-a-vector-check
      type: multipleChoice
      prompt: A particle moves around a circle at constant speed. Why is its acceleration
        nonzero?
      choices:
      - id: a
        text: Its velocity direction changes continuously.
      - id: b
        text: Its speed increases once per revolution.
      - id: c
        text: Its mass changes with direction.
      - id: d
        text: A circular path has no velocity.
      answer:
        choiceId: a
      explanation: 'Acceleration is $d\vec{v}/dt$. A changing direction means a changing
        velocity

        even when $|\vec{v}|$ is constant.


        Related topic: vector velocity and acceleration.

        '
  - id: inward-direction
    title: Direction of centripetal acceleration
    required: true
    content: 'Over a short interval, the difference between two nearby tangent velocity
      vectors

      points toward the center of curvature. In the limit,


      $$

      \vec{a}_c=-\frac{v^2}{r}\hat{r}.

      $$


      The minus sign means opposite the outward radial unit vector.

      '
    media:
    - type: image
      src: /assessments/physics-dynamics/centripetal-directions.svg
      alt: Particle on a circular path with tangent velocity and inward centripetal
        acceleration vectors.
      caption: Velocity is tangent to the path; centripetal acceleration points toward
        the center.
    check:
      id: inward-direction-check
      type: multipleChoice
      prompt: At the rightmost point of a\rhorizontal circle, which way does centripetal
        acceleration point?
      choices:
      - id: a
        text: Toward the center, to the left
      - id: b
        text: Tangent to the path, upward
      - id: c
        text: Away from the center, to the right
      - id: d
        text: In the direction of motion
      answer:
        choiceId: a
      explanation: 'Centripetal acceleration is radial and inward. Tangential velocity
        and radial

        acceleration are perpendicular in uniform circular motion.


        Related topic: radial and tangential components.

        '
  - id: geometric-derivation
    title: Derive the magnitude from similar triangles
    required: true
    content: 'During a short time $\Delta t$, the particle travels an arc


      $$

      \Delta s\a\approx v\Delta t.

      $$


      The triangle formed by two radius vectors is similar to the triangle formed
      by

      two equal-magnitude velocity vectors. Therefore,


      $$

      \frac{|\Delta\vec{v}|}{v}\a\approx\frac{\Delta s}{r}.

      $$


      Substitute $\Delta s\a\approx v\Delta t$, divide by $\Delta t$, and take the limit:


      $$

      a_c=\lim_{\Delta t\to0}\frac{|\Delta\vec{v}|}{\Delta t}

      =\frac{v^2}{r}.

      $$

      '
    check:
      id: geometric-derivation-check
      type: multipleChoice
      prompt: Which relationship is the key geometric step in the centripetal-acceleration
        derivation?
      choices:
      - id: a
        text: $|\Delta\vec{v}|/v\a\approx\Delta s/r$
      - id: b
        text: $|\Delta\vec{v}|=r/v$
      - id: c
        text: $\Delta s=v/r$
      - id: d
        text: $a_c=rv$
      answer:
        choiceId: a
      explanation: 'The velocity-vector triangle and radius-vector triangle have the
        same small

        rotation angle, which makes them similar.


        Related topic: geometric vector derivation of circular motion.

        '
  - id: angular-forms
    title: Connect linear and angular descriptions
    required: true
    content: 'Since


      $$

      v=\omega r,

      $$


      substitute into $a_c=v^2/r$:


      $$

      a_c=\frac{(\omega r)^2}{r}=\omega^2r.

      $$


      With period $T$, $\omega=2\pi/T$, so


      $$

      a_c=\frac{4\pi^2r}{T^2}.

      $$

      '
    check:
      id: angular-forms-check
      type: selectAll
      prompt: Which expressions correctly represent centripetal acceleration magnitude?
      choices:
      - id: a
        text: $v^2/r$
      - id: b
        text: $\omega^2r$
      - id: c
        text: $4\pi^2r/T^2$
      - id: d
        text: $vr$
      answer:
        choiceIds:
        - a
        - b
        - c
      explanation: 'The three correct forms follow from $v=\omega r$ and $\omega=2\pi/T$.


        Related topic: linear speed, angular speed, and period.

        '
  - id: force-model
    title: Centripetal force is a role, not a new force
    required: true
    content: 'Newton''s Second Law in the radial direction is


      $$

      \sum F_r=ma_r=-m\frac{v^2}{r}.

      $$


      "Centripetal force" names the **net inward force requirement**. It may be supplied

      by tension, gravity, friction, a normal force, or a combination. Do not add
      a

      separate force labeled centripetal force to a free-body diagram.

      '
    check:
      id: force-model-check
      type: multipleChoice
      prompt: A car turns on a flat road without slipping. What supplies the inward
        force?
      choices:
      - id: a
        text: Static friction from the road
      - id: b
        text: A separate centripetal-force interaction
      - id: c
        text: The car's velocity
      - id: d
        text: The outward motion force
      answer:
        choiceId: a
      explanation: 'Static friction points toward the center and supplies the required
        radial net

        force. Centripetal force is not an additional interaction.


        Related topic: force identification in circular motion.

        '
  - id: radius-and-speed-scaling
    title: Read the scaling laws
    required: true
    content: 'At fixed radius, doubling speed multiplies $a_c$ by four because acceleration

      depends on $v^2$. At fixed speed, doubling radius cuts $a_c$ in half.


      At fixed angular speed,\rhowever, $a_c=\omega^2r$ increases with radius. Always

      identify which quantity is held constant before applying a proportional argument.

      '
    check:
      id: radius-and-speed-scaling-check
      type: multipleChoice
      prompt: At fixed radius, what happens to centripetal acceleration if speed triples?
      choices:
      - id: a
        text: It becomes nine times as large.
      - id: b
        text: It becomes three times as large.
      - id: c
        text: It becomes one-third as large.
      - id: d
        text: It does not change.
      answer:
        choiceId: a
      explanation: 'Because $a_c\propto v^2$, multiplying $v$ by $3$ multiplies $a_c$
        by $3^2=9$.


        Related topic: proportional reasoning in physics equations.

        '
  - id: numerical-synthesis
    title: Apply the model
    required: true
    content: 'A particle moving at speed $v$ on a path of radius $r$ has inward acceleration

      $v^2/r$. Keep the direction separate from the positive magnitude calculation.

      '
    check:
      id: numerical-synthesis-check
      type: numericResponse
      prompt: 'A car moves at $12\ \text{m/s}$ around a curve of radius $36\ \text{m}$.

        Enter the centripetal acceleration magnitude in $\text{m/s}^2$.

        '
      answer:
        value: 4
        tolerance: 0.001
      explanation: '$$

        a_c=\frac{v^2}{r}=\frac{(12)^2}{36}=4\ \text{m/s}^2.

        $$


        The vector points toward the center of the curve.


        Related topic: uniform circular motion calculations.

        '
