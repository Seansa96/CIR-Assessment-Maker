workedExamples:
- id: l2-sec1
  title: Kirchhoff's Junction Rule
  explanation: 'Based on the conservation of charge, the sum of currents entering
    any junction must equal the sum of currents leaving that junction: $\sum I_{in}
    = \sum I_{out}$.'
- id: l2-sec2
  title: Kirchhoff's Loop Rule
  explanation: 'Based on the conservation of energy, the algebraic sum of the changes
    in potential around any closed loop must be zero: $\sum \Delta V = 0$.'
