id: physics2-ch10-kirchhoffs-rules-concept-lesson
title: Kirchhoff's Rules
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-dc-circuits
lesson:
  introduction: This lesson develops the main ideas behind Kirchhoff's Rules and connects them to the
    governing physical relationships.
  sections:
  - id: l2-sec1
    title: Kirchhoff's Junction Rule
    required: true
    content: 'Based on the conservation of charge, the sum of currents entering any junction must equal
      the sum of currents leaving that junction: $\sum I_{in} = \sum I_{out}$.'
  - id: l2-sec2
    title: Kirchhoff's Loop Rule
    required: true
    content: 'Based on the conservation of energy, the algebraic sum of the changes in potential around
      any closed loop must be zero: $\sum \Delta V = 0$.'
