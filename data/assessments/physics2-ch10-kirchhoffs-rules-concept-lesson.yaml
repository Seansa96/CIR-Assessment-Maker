glossary: 
lesson:
  introduction: >
    This lesson develops a repeatable way to solve Kirchhoff's Rules problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch10-kirchhoffs-rules-s1
    title: Name the model and quantities
    required: true
    content: >
      Kirchhoff's Rules uses sum I_in = sum I_out and sum Delta V = 0. In the name the model and quantities stage, assign loop and current directions first, write signed equations, and interpret a negative result as a reversed assumption.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Kirchhoff's Rules problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch10-kirchhoffs-rules-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Kirchhoff's Rules, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use sum I_in = sum I_out and sum Delta V = 0 after you assign loop and current directions first, write signed equations, and interpret a negative result as a reversed assumption.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Kirchhoff's Rules problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch10-kirchhoffs-rules-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables sum I_in = sum I_out and sum Delta V = 0 relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch10-kirchhoffs-rules-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Kirchhoff's Rules.
        media: []
        issueSignals:
        - id: physics2-physics2-ch10-kirchhoffs-rules-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: During name the model and quantities for Kirchhoff's Rules, first assign loop and current directions first, write signed equations, and interpret a negative result as a reversed assumption. Then apply sum I_in = sum I_out and sum Delta V = 0 with one consistent coordinate system and solve for the requested quantity.


        Why it works: sum I_in = sum I_out and sum Delta V = 0 connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
