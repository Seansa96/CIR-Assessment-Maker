questions:
  - { id: q001, type: freeResponse, prompt: 'Rank equal-formula-unit concentrations of glucose, NaCl, and AlCl3 from lowest to highest ideal osmotic pressure. Justify with particles.', answer: { gradingMode: selfCheck, keyPoints: ['glucose then NaCl then AlCl3', '1 2 4 particles'] }, explanation: 'Solution: Glucose < NaCl < AlCl3 because their ideal particle counts are 1, 2, and 4 per formula unit. Why it works: Osmotic pressure is a colligative property that increases with dissolved-particle count. Common trap: Ranking by molar mass instead of particles.', difficultyDimensions: [modelOrDerivation, representationTransfer, casePartition], difficultyEvidence: 'Builds particle models for molecular and ionic solutes and transfers counts to osmotic trend.', prerequisiteObjectiveIds: [colligative-trends], extensionObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: hard-osmotic-ranking, variationAxes: { scenario: equal-molar solutions, unknown: property ranking, governingRelation: particle count } }
  - { id: q002, type: freeResponse, prompt: 'A student says 0.200 M FeCl3 has [Cl−] = 0.600 M and total ion concentration = 0.800 M. Verify or correct both.', answer: { gradingMode: selfCheck, keyPoints: ['both correct', 'three chloride 0.600 M', 'four total ions 0.800 M'] }, explanation: 'Solution: FeCl3 yields one Fe3+ and three Cl−. Thus $[Cl^-]=3(0.200)=0.600\ \mathrm M$, and total ions are $4(0.200)=0.800\ \mathrm M$. Why it works: Subscripts count ions; charge does not add extra particles. Common trap: Counting charge magnitude as more particles.', difficultyDimensions: [errorDiagnosis, representationTransfer, proofJustification], difficultyEvidence: 'Audits an ion-accounting claim using dissociation coefficients and total-particle logic.', prerequisiteObjectiveIds: [ion-molarity], extensionObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: hard-ion-report-audit, variationAxes: { scenario: student claim, methodBranch: error verification, unknown: ion and total concentration } }
  - { id: q003, type: freeResponse, prompt: 'Equal volumes of 0.100 M CaCl2 and 0.100 M NaCl are mixed. Find [Cl−] after mixing, assuming additive volumes and complete dissociation.', answer: { gradingMode: selfCheck, keyPoints: ['0.150 M chloride', 'moles chloride 0.300 times one volume', 'two total volumes'] }, explanation: 'Solution: Let each volume be V L. Chloride moles are $2(0.100V)+1(0.100V)=0.300V$; total volume is 2V, so $[Cl^-]=0.150\ \mathrm M$. Why it works: Add moles of the same ion, then divide by combined volume. Common trap: Adding 0.200 M and 0.100 M without accounting for doubled volume.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Constructs a variable-volume mole balance, counts dissociation products, and normalizes by mixed volume.', prerequisiteObjectiveIds: [ion-molarity], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: hard-mixed-ion-molarity, variationAxes: { scenario: mixing salts, unknown: shared-ion concentration, constraints: additive volumes } }
  - { id: q004, type: freeResponse, prompt: 'Explain why 0.10 M CH3COOH cannot be assigned the same ideal particle count as 0.10 M HCl for an exact colligative comparison.', answer: { gradingMode: selfCheck, keyPoints: ['CH3COOH partial ionization', 'HCl complete dissociation', 'particle count differs and depends on equilibrium'] }, explanation: 'Solution: HCl is a strong acid that dissociates essentially completely, whereas CH3COOH is a weak acid that remains mostly molecular with some ions. Their actual particle counts therefore differ, and CH3COOH requires equilibrium information for an exact value. Why it works: Weak-electrolyte dissociation is conditional, not a fixed complete-splitting rule. Common trap: Treating all acids as strong electrolytes.', difficultyDimensions: [casePartition, domainCondition, proofJustification], difficultyEvidence: 'Distinguishes strong and weak acid models and identifies missing equilibrium information.', prerequisiteObjectiveIds: [electrolyte-classification], extensionObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: hard-weak-acid-particle-limit, variationAxes: { scenario: acid comparison, constraints: partial ionization, methodBranch: model selection } }
  - { id: q005, type: freeResponse, prompt: 'At equal molality and ideal dissociation, which gives the greater boiling-point elevation: 0.050 m Na2SO4 or 0.060 m glucose? Show the particle comparison.', answer: { gradingMode: selfCheck, keyPoints: ['Na2SO4', '0.150 particle molality versus 0.060', 'three ions versus one molecule'] }, explanation: 'Solution: Na2SO4 gives three particles, so its effective particle amount is $3(0.050)=0.150$; glucose gives $1(0.060)=0.060$. Na2SO4 therefore gives the larger elevation. Why it works: Boiling-point elevation follows particle concentration, not merely formula-unit concentration. Common trap: Choosing glucose because 0.060 is numerically larger than 0.050.', difficultyDimensions: [representationTransfer, auxiliaryTechnique, errorDiagnosis], difficultyEvidence: 'Transforms formula-unit concentration into particle concentration and rejects bare-number comparison.', prerequisiteObjectiveIds: [colligative-trends], extensionObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: hard-particle-concentration-compare, variationAxes: { representation: molality and particle factor, unknown: colligative ranking } }
  - { id: q006, type: freeResponse, prompt: 'A diagram shows 18 neutral molecules and 2 pairs of ions after a solute dissolves. Classify the solute behavior and explain its conductivity relative to a fully dissociated salt at the same formal concentration.', answer: { gradingMode: selfCheck, keyPoints: ['weak electrolyte', 'partial ionization', 'lower conductivity than fully dissociated salt'] }, explanation: 'Solution: The mixture of mostly neutral molecules with some ion pairs represents a weak electrolyte. It conducts, but less than a fully dissociated salt because it supplies fewer mobile ions. Why it works: Particle composition, not simply dissolved amount, determines conductivity. Common trap: Calling any visible ions a strong electrolyte.', difficultyDimensions: [representationTransfer, casePartition, globalLocalReasoning], difficultyEvidence: 'Interprets a particle diagram, classifies partial ionization, and compares macroscopic conductivity.', prerequisiteObjectiveIds: [electrolyte-classification], extensionObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0396], reasoningSignature: hard-particle-diagram-conductivity, variationAxes: { representation: particle diagram, unknown: classification and relative conductivity } }
  - { id: q007, type: freeResponse, prompt: 'Find [K+] and [PO4 3−] when 75.0 mL of 0.400 M K3PO4 is diluted to 300.0 mL.', answer: { gradingMode: selfCheck, keyPoints: ['0.100 M K3PO4 final', '0.300 M K plus', '0.100 M phosphate'] }, explanation: 'Solution: Dilution gives $M_2=(0.400)(75.0/300.0)=0.100\ \mathrm M$ K3PO4. Complete dissociation gives $[K^+]=3(0.100)=0.300\ \mathrm M$ and $[PO_4^{3-}]=0.100\ \mathrm M$. Why it works: First conserve solute moles through dilution, then apply formula coefficients. Common trap: Multiplying the initial ion concentration by dilution volume ratio incorrectly.', difficultyDimensions: [auxiliaryTechnique, modelOrDerivation, representationTransfer], difficultyEvidence: 'Chains dilution conservation with ion-stoichiometry conversion.', prerequisiteObjectiveIds: [ion-molarity], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: hard-diluted-ion-molarity, variationAxes: { scenario: diluted salt, methodBranch: dilution then dissociation, unknown: two ion concentrations } }
  - { id: q008, type: freeResponse, prompt: 'A solution has 0.250 M total ions and contains only fully dissociated MgCl2. Find the formula-unit molarity and [Mg2+].', answer: { gradingMode: selfCheck, keyPoints: ['0.0833 M MgCl2', '0.0833 M magnesium', 'three ions per formula unit'] }, explanation: 'Solution: MgCl2 yields three ions total, so formula-unit molarity is $0.250/3=0.0833\ \mathrm M$; [Mg2+] is also 0.0833 M. Why it works: Total particle concentration equals formula concentration times ion count. Common trap: Dividing by ionic charge total rather than three particles.', difficultyDimensions: [reverseReasoning, representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Works backward from total-ion concentration to formula-unit and individual-ion concentration.', prerequisiteObjectiveIds: [ion-molarity], extensionObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: hard-total-ion-reverse, variationAxes: { givens: total ion concentration, unknown: formula concentration and cation concentration } }
  - { id: q009, type: freeResponse, prompt: 'Two equal-molar solutions are separated by a semipermeable membrane that passes only water: glucose on one side and CaCl2 on the other. Predict water movement ideally and justify.', answer: { gradingMode: selfCheck, keyPoints: ['toward CaCl2 side', 'more dissolved particles', 'higher osmotic pressure'] }, explanation: 'Solution: Water moves toward the CaCl2 side because ideal CaCl2 produces three particles per formula unit versus one for glucose, giving higher osmotic pressure. Why it works: Osmosis drives solvent toward greater effective solute-particle concentration. Common trap: Moving water toward the side with the larger solute molecule.', difficultyDimensions: [modelOrDerivation, representationTransfer, globalLocalReasoning], difficultyEvidence: 'Constructs an osmotic model from particle counts and predicts system-level solvent direction.', prerequisiteObjectiveIds: [colligative-trends], extensionObjectiveIds: [electrolyte-classification], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: hard-osmosis-particle-direction, variationAxes: { scenario: membrane system, representation: particle count to water movement, unknown: direction } }
  - { id: q010, type: freeResponse, prompt: 'A student claims 0.10 M AlCl3 and 0.40 M glucose must have identical freezing points because both correspond to 0.40 mol particles/L ideally. State the conclusion and one real-world qualification.', answer: { gradingMode: selfCheck, keyPoints: ['ideal prediction same colligative effect', 'real solutions may deviate due ion interactions or nonideal behavior'] }, explanation: 'Solution: Under the ideal particle-count model, both correspond to 0.40 mol particles/L and predict the same colligative effect. Real ionic solutions can deviate because ion interactions reduce ideal behavior. Why it works: Ideal colligative comparison uses effective particle count, but the ideal assumption is a condition. Common trap: Saying formula-unit molarity alone determines the effect.', difficultyDimensions: [modelOrDerivation, domainCondition, proofJustification], difficultyEvidence: 'Applies an ideal model, matches effective particle concentration, and names a validity limitation.', prerequisiteObjectiveIds: [colligative-trends], extensionObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: hard-ideal-versus-real-colligative, variationAxes: { scenario: model comparison, constraints: ideal versus nonideal, unknown: qualified conclusion } }
