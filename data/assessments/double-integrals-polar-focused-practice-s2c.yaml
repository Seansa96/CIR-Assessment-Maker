questions:
- id: q001
  type: multipleChoice
  prompt: Which factor must appear in a polar double integral?
  choices:
  - id: a
    text: r
  - id: b
    text: r squared
    issueSignals:
    - id: polar-rectangular-conversion-error
  - id: c
    text: theta
    issueSignals:
    - id: polar-rectangular-conversion-error
  - id: d
    text: 1/r
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: polar-rectangular-conversion-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Polar rectangles have area approximately r times dr times dtheta.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Polar Coordinates.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q002
  type: multipleChoice
  prompt: What bounds describe the unit disk in polar form?
  choices:
  - id: a
    text: '$0\le r\le1$, $0\le\theta\le2\pi$'
  - id: b
    text: '$-1\le x,y\le1$'
    issueSignals:
    - id: polar-rectangular-conversion-error
  - id: c
    text: '$0\le r\le2\pi$, $0\le\theta\le1$'
    issueSignals:
    - id: polar-rectangular-conversion-error
  - id: d
    text: $r=1$ only
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: polar-rectangular-conversion-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Radius sweeps from center to boundary through all angles.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Polar Coordinates.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q003
  type: multipleChoice
  prompt: What is $x^2+y^2$ in polar coordinates?
  choices:
  - id: a
    text: $r^2$
  - id: b
    text: r
    issueSignals:
    - id: polar-rectangular-conversion-error
  - id: c
    text: theta squared
    issueSignals:
    - id: polar-rectangular-conversion-error
  - id: d
    text: '$r\cos\theta$'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: polar-rectangular-conversion-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: The radius satisfies r squared equals x squared plus y squared.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Polar Coordinates.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q004
  type: multipleChoice
  prompt: Why can polar coordinates simplify a disk?
  choices:
  - id: a
    text: The boundary has constant radius
  - id: b
    text: They remove area
    issueSignals:
    - id: polar-rectangular-conversion-error
  - id: c
    text: The angle is always zero
    issueSignals:
    - id: polar-rectangular-conversion-error
  - id: d
    text: They make r negative
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: polar-rectangular-conversion-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Circular boundaries become simple radial bounds.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Polar Coordinates.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
