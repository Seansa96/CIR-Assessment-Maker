id: physics2-ch09-ohms-law-concept-lesson
title: Resistance & Ohm's Law
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-current-resistance
lesson:
  introduction: This lesson develops the main ideas behind Resistance & Ohm's Law and connects them to
    the governing physical relationships.
  sections:
  - id: l2-sec1
    title: Ohm's Law
    required: true
    content: 'Ohm''s Law states that for many materials (ohmic materials), the current is directly proportional
      to the applied voltage: $V = IR$. The resistance $R$ is constant regardless of $V$ or $I$.'
  - id: l2-sec2
    title: Resistivity
    required: true
    content: 'The resistance of a wire depends on its material and geometry: $R = \rho \frac{L}{A}$, where
      $\rho$ is the resistivity of the material. Resistivity usually increases with temperature.'
