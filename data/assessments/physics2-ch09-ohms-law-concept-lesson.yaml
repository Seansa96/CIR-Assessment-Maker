      explanation: >
        Solution: During name the model and quantities for Resistance & Ohm's Law, first use a single element's voltage and current, then distinguish resistance from resistivity. Then apply V = IR with one consistent coordinate system and solve for the requested quantity.


        Why it works: V = IR connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
