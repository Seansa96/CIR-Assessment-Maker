topicId: physics2-current-resistance
workedExamples:
- id: l2-sec1
  title: Ohm's Law
  explanation: 'Ohm''s Law states that for many materials (ohmic materials), the current
    is directly proportional to the applied voltage: $V = IR$. The resistance $R$
    is constant regardless of $V$ or $I$.'
- id: l2-sec2
  title: Resistivity
  explanation: 'The resistance of a wire depends on its material and geometry: $R
    = \rho \frac{L}{A}$, where $\rho$ is the resistivity of the material. Resistivity
    usually increases with temperature.'
