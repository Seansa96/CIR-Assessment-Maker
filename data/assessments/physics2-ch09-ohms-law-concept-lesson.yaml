lesson:
  introduction: >
    This lesson develops a repeatable way to solve Resistance & Ohm's Law problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch09-ohms-law-s1
    title: Name the model and quantities
    required: true
    content: >
      Resistance & Ohm's Law uses V = IR. In the name the model and quantities stage, use a single element's voltage and current, then distinguish resistance from resistivity.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Resistance & Ohm's Law problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch09-ohms-law-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Resistance & Ohm's Law, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use V = IR after you use a single element's voltage and current, then distinguish resistance from resistivity.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Resistance & Ohm's Law problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch09-ohms-law-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables V = IR relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch09-ohms-law-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Resistance & Ohm's Law.
        media: []
        issueSignals:
        - id: physics2-physics2-ch09-ohms-law-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
