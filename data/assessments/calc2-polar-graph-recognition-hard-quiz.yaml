questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a limacon with an inner loop oriented to the right](/assessments/calc2-parametric-polar/polar-graph-recognition-hard-01-inner-loop-right.svg)
    choices:
      - id: a
        text: '$r=2+4\cos\theta$'
      - id: b
        text: '$r=4+2\cos\theta$'
      - id: c
        text: '$r=2+4\sin\theta$'
      - id: d
        text: '$r=2-4\cos\theta$'
    answer:
      choiceId: a
    explanation: |
      The graph has an inner loop because $a<b$. It is oriented to the right because the larger radius occurs when $\cos\theta=1$.

  - id: q002
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a large limacon with an inner loop oriented downward](/assessments/calc2-parametric-polar/polar-graph-recognition-hard-02-inner-loop-down.svg)
    choices:
      - id: a
        text: '$r=3-5\sin\theta$'
      - id: b
        text: '$r=3+5\sin\theta$'
      - id: c
        text: '$r=3-5\cos\theta$'
      - id: d
        text: '$r=5-3\sin\theta$'
    answer:
      choiceId: a
    explanation: |
      The negative sine term points the large lobe downward. Since $3<5$, the graph has an inner loop rather than just a dimple.

  - id: q003
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a three-petal rose with longer petals](/assessments/calc2-parametric-polar/polar-graph-recognition-hard-03-three-petal-large.svg)
    choices:
      - id: a
        text: '$r=4\cos(3\theta)$'
      - id: b
        text: '$r=4\sin(3\theta)$'
      - id: c
        text: '$r=4\cos(4\theta)$'
      - id: d
        text: '$r^2=16\cos(2\theta)$'
    answer:
      choiceId: a
    explanation: |
      The graph is a three-petal rose, so the angular multiplier is $3$. The petal on the positive $x$-axis indicates cosine rather than sine.

  - id: q004
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing an eight-petal rose](/assessments/calc2-parametric-polar/polar-graph-recognition-hard-04-eight-petal.svg)
    choices:
      - id: a
        text: '$r=5\sin(4\theta)$'
      - id: b
        text: '$r=5\sin(2\theta)$'
      - id: c
        text: '$r=5\cos(3\theta)$'
      - id: d
        text: '$r=5+5\sin\theta$'
    answer:
      choiceId: a
    explanation: |
      For $r=a\sin(n\theta)$ with even $n$, the graph has $2n$ petals. Eight petals therefore suggest $n=4$.

  - id: q005
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a horizontal lemniscate with two lobes left and right](/assessments/calc2-parametric-polar/polar-graph-recognition-hard-05-lemniscate-horizontal.svg)
    choices:
      - id: a
        text: '$r^2=9\cos(2\theta)$'
      - id: b
        text: '$r^2=9\sin(2\theta)$'
      - id: c
        text: '$r=3\cos(2\theta)$'
      - id: d
        text: '$r=3+3\cos\theta$'
    answer:
      choiceId: a
    explanation: |
      Lemniscates often appear in squared-radius form. The cosine $2\theta$ version has lobes along the horizontal axis.

  - id: q006
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a diagonal lemniscate with lobes in the first and third quadrants](/assessments/calc2-parametric-polar/polar-graph-recognition-hard-06-lemniscate-diagonal.svg)
    choices:
      - id: a
        text: '$r^2=16\sin(2\theta)$'
      - id: b
        text: '$r^2=16\cos(2\theta)$'
      - id: c
        text: '$r=4\sin(2\theta)$'
      - id: d
        text: '$r=4\cos(4\theta)$'
    answer:
      choiceId: a
    explanation: |
      The sine $2\theta$ lemniscate has diagonal lobes. The squared radius and two-lobed shape distinguish it from a four-petal rose.

  - id: q007
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a horizontally stretched ellipse centered at the pole](/assessments/calc2-parametric-polar/polar-graph-recognition-hard-07-implicit-ellipse.svg)
    choices:
      - id: a
        text: '$r^2\cos^2\theta+3r^2\sin^2\theta=12$'
      - id: b
        text: '$3r^2\cos^2\theta+r^2\sin^2\theta=12$'
      - id: c
        text: '$r^2=9\cos(2\theta)$'
      - id: d
        text: '$4r^2\cos^2\theta-r^2\sin^2\theta=16$'
    answer:
      choiceId: a
    explanation: |
      Using $x=r\cos\theta$ and $y=r\sin\theta$, the equation becomes $x^2+3y^2=12$. The larger denominator is under $x^2$, so the ellipse is wider horizontally.

  - id: q008
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a horizontal hyperbola with left and right branches](/assessments/calc2-parametric-polar/polar-graph-recognition-hard-08-implicit-hyperbola.svg)
    choices:
      - id: a
        text: '$4r^2\cos^2\theta-r^2\sin^2\theta=16$'
      - id: b
        text: '$r^2\cos^2\theta+4r^2\sin^2\theta=16$'
      - id: c
        text: '$r^2=16\sin(2\theta)$'
      - id: d
        text: '$4r^2\sin^2\theta-r^2\cos^2\theta=16$'
    answer:
      choiceId: a
    explanation: |
      Substitution gives $4x^2-y^2=16$, a hyperbola opening left and right. The minus sign is the key feature.

  - id: q009
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a conic-like ellipse with focus at the pole and bulging to the right](/assessments/calc2-parametric-polar/polar-graph-recognition-hard-09-conic-ellipse-focus.svg)
    choices:
      - id: a
        text: '$r=\frac{6}{2-\cos\theta}$'
      - id: b
        text: '$r=\frac{6}{2+\cos\theta}$'
      - id: c
        text: '$r=\frac{6}{1-2\cos\theta}$'
      - id: d
        text: '$r=2+4\cos\theta$'
    answer:
      choiceId: a
    explanation: |
      The denominator is smallest when $\cos\theta=1$, so the largest radius points to the right. Because the eccentricity-like coefficient is less than the constant term, the graph is closed.

  - id: q010
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a conic hyperbola with separated branches from a focus at the pole](/assessments/calc2-parametric-polar/polar-graph-recognition-hard-10-conic-hyperbola-focus.svg)
    choices:
      - id: a
        text: '$r=\frac{5}{1+1.4\cos\theta}$'
      - id: b
        text: '$r=\frac{5}{2+\cos\theta}$'
      - id: c
        text: '$r=5+1.4\cos\theta$'
      - id: d
        text: '$r^2=25\cos(2\theta)$'
    answer:
      choiceId: a
    explanation: |
      The denominator can become zero because the cosine coefficient is larger than the constant term. That creates asymptotic behavior and separate hyperbola-like branches rather than a closed limacon or ellipse.
