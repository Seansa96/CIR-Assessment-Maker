schemaVersion: 1
id: calc2-arc-length-surface-area-worked-examples-s2c
title: 'Arc Length and Surface Area: Worked Examples'

assessmentType: workedExample
categoryId: calculus-2
topicId: arc-length-surface-area
modeDefault: practice
randomizeQuestions: false
skills: [arc-length, surface-area-of-revolution, differential-geometry, substitution]
navigation: { learningGoal: learn, activityType: guidedWorkedExample, tags: [calculus-2, arc-length, surface-area] }
authoring: { visualRequirement: required, visualRationale: Both models require a labelled slanted segment and an axis-based radius. }
workedExamples:
  - id: arc-length-parabola
    title: 'Arc length: a curve with a perfect-square differential'
    problem: 'Find the exact arc length of $y=\frac{x^2}{2}$ from $x=0$ to $x=3$.'
    steps:
      - id: arc-s1
        title: Differentiate the curve
        instruction: 'Arc length is built from slope, so find f prime before writing ds.'
        type: symbolicResponse
        prompt: 'Find $f''(x)$. '
        media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Slanted differential segment with horizontal dx and vertical dy }]
        answer: { expectedLatex: x, equivalenceMode: expression, variables: [x], tolerance: 0.000001 }
        explanation: 'Solution: $f''(x)=x$. Why it works: The derivative of $x^2/2$ is x. Common trap: The original function does not go directly under the arc-length square root.'
      - id: arc-s2
        title: Build the differential length
        instruction: 'Substitute the slope into the Pythagorean differential formula.'
        type: symbolicResponse
        prompt: 'Write $ds$ in terms of x and dx.'
        media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Hypotenuse ds of a small slope triangle }]
        answer: { expectedLatex: '\\sqrt{1+x^2}', equivalenceMode: expression, variables: [x], tolerance: 0.000001 }
        explanation: 'Solution: $ds=\sqrt{1+x^2}\,dx$. Why it works: Substitute $f''(x)=x$ into $\sqrt{1+[f''(x)]^2}dx$. Common trap: The integrand is $\sqrt{1+x^2}$, not $1+x^2$.'
      - id: arc-s3
        title: Set up the arc-length integral
        instruction: 'Use the stated x-locations because ds is expressed with dx.'
        type: symbolicResponse
        prompt: 'Write the definite integral for L.'
        media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Curve segments accumulated from x equals 0 to x equals 3 }]
        answer: { expectedLatex: '\\int_0^3\\sqrt{1+x^2}\\,dx', equivalenceMode: expression, variables: [x], tolerance: 0.000001 }
        explanation: 'Solution: $L=\int_0^3\sqrt{1+x^2}\,dx$. Why it works: The bounds and differential both use x. Common trap: Arc length is not the area under the curve.'
      - id: arc-s4
        title: Evaluate with the standard antiderivative
        instruction: 'Use the known antiderivative for square root of one plus x squared.'
        type: freeResponse
        prompt: 'Give the exact length.'
        media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Arc length along a parabola }]
        answer: { gradingMode: selfCheck, keyPoints: ['3sqrt10/2', 'asinh 3', 'ln(3+sqrt10)'] }
        explanation: 'Solution: $L=\frac12[x\sqrt{1+x^2}+\ln(x+\sqrt{1+x^2})]_0^3=\frac{3\sqrt{10}+\ln(3+\sqrt{10})}{2}$. Why it works: The antiderivative differentiates to $\sqrt{1+x^2}$. Common trap: The logarithm term does not vanish at x=3; only its value at 0 is zero.'
  - id: surface-area-line
    title: 'Surface area: a line segment revolved about an offset axis'
    problem: 'Rotate $y=x+1$ from $x=0$ to $x=2$ about the x-axis. Find the exact lateral surface area.'
    steps:
      - id: surface-s1
        title: Identify radius and differential length
        instruction: 'Label the axis distance separately from the slanted segment length.'
        type: freeResponse
        prompt: 'State the radius r(x) and the differential arc-length factor without dx.'
        media: [{ type: image, src: /media/calculus/disk-washer-model.svg, alt: A line segment swept into a surface band about the x-axis }]
        answer: { gradingMode: selfCheck, keyPoints: ['radius x+1', 'sqrt 2'] }
        explanation: 'Solution: $r=x+1$ and $\sqrt{1+[f''(x)]^2}=\sqrt2$ because f prime is 1. Why it works: The line is above the x-axis, so its y-value is its radius. Common trap: Radius is x+1, while $\sqrt2$ measures slanted length per dx.'
      - id: surface-s2
        title: Form the swept-band integral
        instruction: 'Multiply circumference, radius, and differential arc length.'
        type: symbolicResponse
        prompt: 'Write the surface-area integral.'
        media: [{ type: image, src: /media/calculus/disk-washer-model.svg, alt: Surface band with circumference 2 pi r and slanted width ds }]
        answer: { expectedLatex: '2\\pi\\int_0^2(x+1)\\sqrt{2}\\,dx', equivalenceMode: expression, variables: [x], tolerance: 0.000001 }
        explanation: 'Solution: $S=2\pi\int_0^2(x+1)\sqrt2\,dx$. Why it works: $dS=2\pi r\,ds$. Common trap: $\pi r^2$ would calculate a disk cross section, not a lateral surface band.'
      - id: surface-s3
        title: Evaluate the surface area
        instruction: 'Integrate the radius factor and retain the circumference constant.'
        type: symbolicResponse
        prompt: 'Find the exact surface area.'
        media: [{ type: image, src: /media/calculus/disk-washer-model.svg, alt: Completed surface of revolution }]
        answer: { expectedLatex: '8\\pi\\sqrt{2}', equivalenceMode: expression, variables: [], tolerance: 0.000001 }
        explanation: 'Solution: $S=2\pi\sqrt2[x^2/2+x]_0^2=2\pi\sqrt2(2+2)=8\pi\sqrt2$. Why it works: A radius times slanted length produces a square-unit band area. Common trap: Reporting cubic units would confuse surface area with volume.'
