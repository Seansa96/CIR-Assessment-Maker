title: Cylindrical Shells Glossary
assessmentType: glossary
categoryId: calculus-2
topicId: cylindrical-shells
modeDefault: practice
randomizeQuestions: false
skills: [shell-method, radius, circumference, shell-height]
navigation: { learningGoal: learn, activityType: glossary, tags: [calculus-2, cylindrical-shells] }
authoring: { visualRequirement: required, visualRationale: Shell vocabulary refers to spatial parts of a rotated strip. }
glossary:
  introduction: 'A shell is a rolled parallel strip; its terms prevent confusing circumference with cross-sectional area.'
  sections:
    - id: terms
      title: Shell terms
      required: true
      content: 'A shell model tracks a rolled strip by its radius, its height, and its circumference.'
      entries:
        - id: cylindrical-shell
          term: Cylindrical shell
          definition: 'The thin hollow cylinder produced when a strip parallel to the axis is rotated.'
          notation: '$dV=2\pi r h\,dt$'
          examples: ['A vertical strip rotated about the y-axis creates a shell.']
          aliases: [shell]
          media: [{ type: image, src: /media/calculus/cylindrical-shell-model.svg, alt: Hollow cylindrical shell produced by rotation }]
          tags: [shell, rotation]
          drills:
            - { id: g1, type: cloze, prompt: 'The differential shell volume has the form $dV=2\pi(____)(\text{height})(\text{thickness})$.', answer: { expected: radius, aliases: [r] }, explanation: 'Solution: The missing factor is radius. Why it works: $2\pi r$ is the shell circumference. Common trap: $\pi r^2$ is a disk area, not shell circumference.' }
        - id: shell-height
          term: Shell height
          definition: 'The length of the strip parallel to the axis, often top minus bottom or right minus left.'
          notation: '$h=f(x)-g(x)$'
          examples: ['The height is not the shell radius.']
          aliases: [strip length]
          media: [{ type: image, src: /media/calculus/cylindrical-shell-model.svg, alt: Shell height labelled along the rotated strip }]
          tags: [height, boundaries]
          drills:
            - { id: g2, type: flashcard, prompt: 'What slice orientation creates shells?', answer: { expected: 'parallel to the axis of rotation', aliases: [parallel] }, explanation: 'Solution: Use a strip parallel to the axis. Why it works: It rolls into a hollow cylinder. Common trap: Perpendicular strips create disks or washers.' }
