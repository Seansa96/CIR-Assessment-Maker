workedExamples:
- id: reinforcement-damped-we1
  title: Classify a damping regime
  problem: An oscillator has natural angular frequency $\omega_0=10\,\mathrm{rad/s}$ and damping coefficient $\gamma=3\,\mathrm{s^{-1}}$ in the convention $x''+2\gamma x'+\omega_0^2x=0$.
  steps:
  - id: reinforcement-damped-we1-s1
    title: Compare damping with natural frequency
    instruction: Use the underdamped criterion for this convention.
    hint: Underdamped motion has $\gamma<\omega_0$.
    type: multipleChoice
    prompt: Which regime applies?
    choices:
    - { id: a, text: 'Underdamped' }
    - { id: b, text: 'Critically damped', issueSignals: [{ id: physics1-damping-critical-equality, domains: [physics-1] }] }
    - { id: c, text: 'Overdamped', issueSignals: [{ id: physics1-damping-regime-reversal, domains: [physics-1] }] }
    - { id: d, text: 'No damping because $\gamma$ is not negative', issueSignals: [{ id: physics1-damping-coefficient-meaning, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: Since $3<10$, the system is underdamped. Why it works: In this equation the oscillatory regime occurs when $\gamma<\omega_0$. Why the other choices fail: Critical damping requires equality, overdamping requires larger damping, and positive $\gamma$ represents decay rather than no damping.'
  - id: reinforcement-damped-we1-s2
    title: Predict the motion
    instruction: Combine the oscillation with the exponential envelope.
    hint: Underdamped motion has a decaying envelope and repeated zero crossings.
    type: multipleChoice
    prompt: Which qualitative graph matches the motion?
    choices:
    - { id: a, text: 'A sinusoid whose amplitude decays exponentially' }
    - { id: b, text: 'A sinusoid with constant amplitude', issueSignals: [{ id: physics1-damping-envelope-omission, domains: [physics-1] }] }
    - { id: c, text: 'A monotonic exponential with no crossings', issueSignals: [{ id: physics1-damping-oscillation-omission, domains: [physics-1] }] }
    - { id: d, text: 'An oscillation whose amplitude grows without input', issueSignals: [{ id: physics1-damping-growth-error, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: The response oscillates while its envelope decreases like $e^{-\gamma t}$. Why it works: Inertia and restoring force produce crossings; damping removes energy. Why the other choices fail: They omit decay, omit oscillation, or violate passive energy loss.'
- id: reinforcement-damped-we2
  title: Read a resonance curve
  problem: Two otherwise identical driven oscillators are compared near resonance; oscillator B has the larger damping.
  steps:
  - id: reinforcement-damped-we2-s1
    title: Compare peak response
    instruction: Use the effect of damping on the resonance curve.
    hint: Dissipation reduces the largest steady-state amplitude.
    type: multipleChoice
    prompt: Which comparison is expected?
    choices:
    - { id: a, text: 'B has a lower maximum amplitude than A' }
    - { id: b, text: 'B has a higher maximum amplitude than A', issueSignals: [{ id: physics1-resonance-damping-peak, domains: [physics-1] }] }
    - { id: c, text: 'The peaks must be identical because the drive is identical', issueSignals: [{ id: physics1-resonance-drive-only, domains: [physics-1] }] }
    - { id: d, text: 'B has no response at any frequency', issueSignals: [{ id: physics1-resonance-zero-response, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: Greater damping lowers the resonance peak. Why it works: More energy is dissipated during each cycle, limiting steady-state amplitude. Why the other choices fail: They reverse the damping trend or replace a reduced response with an impossible zero response.'
  - id: reinforcement-damped-we2-s2
    title: Compare bandwidth
    instruction: Read both height and width of the response curve.
    hint: Strong damping makes resonance less selective.
    type: multipleChoice
    prompt: What happens to the resonance peak as damping increases?
    choices:
    - { id: a, text: 'It becomes lower and broader' }
    - { id: b, text: 'It becomes higher and narrower', issueSignals: [{ id: physics1-resonance-width-reversal, domains: [physics-1] }] }
    - { id: c, text: 'It becomes lower and narrower', issueSignals: [{ id: physics1-resonance-selectivity-error, domains: [physics-1] }] }
    - { id: d, text: 'Only the natural frequency changes; height and width do not', issueSignals: [{ id: physics1-resonance-curve-invariance, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: Increased damping lowers and broadens the resonance curve. Why it works: Dissipation suppresses the peak and makes nearby drive frequencies comparatively effective. Why the other choices fail: They reverse one trend or ignore the response amplitude and bandwidth changes.'
