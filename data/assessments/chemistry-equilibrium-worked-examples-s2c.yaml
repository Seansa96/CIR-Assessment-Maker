workedExamples:
  - id: k-expression
    title: Build and interpret Kc
    problem: 'For $2SO_2(g)+O_2(g)\rightleftharpoons2SO_3(g)$, write $K_c$ and interpret $K_c=25$.'
    steps:
      - { id: k1, title: Identify products and reactants, instruction: 'Use the balanced equation as the expression map.', type: freeResponse, prompt: 'Which species are numerator factors?', answer: { gradingMode: selfCheck, keyPoints: ['$SO_3$'] }, explanation: 'Solution: $SO_3$ is the product numerator factor. Why it works: Equilibrium expressions place products over reactants.' }
      - { id: k2, title: Apply coefficient exponents, instruction: 'Use every stoichiometric coefficient as an exponent.', type: freeResponse, prompt: 'Write $K_c$.', answer: { gradingMode: selfCheck, keyPoints: ['$[SO_3]^2/([SO_2]^2[O_2])$'] }, explanation: 'Solution: $K_c=[SO_3]^2/([SO_2]^2[O_2])$. Why it works: Coefficients 2, 1, and 2 become powers.' }
      - { id: k3, title: Interpret magnitude, instruction: 'Compare the product-to-reactant ratio with one.', type: freeResponse, prompt: 'Does Kc = 25 favor reactants or products?', answer: { gradingMode: selfCheck, keyPoints: ['products'] }, explanation: 'Solution: Products are favored. Why it works: A ratio much greater than one has a comparatively large product factor.' }
  - id: quotient-direction
    title: Compare Q with K
    problem: 'For $H_2+I_2\rightleftharpoons2HI$, $K_c=50$. A mixture has $[H_2]=0.20$ M, $[I_2]=0.20$ M, and $[HI]=0.40$ M.'
    steps:
      - { id: q1, title: Write Qc, instruction: 'Q has Kc structure but current values.', type: freeResponse, prompt: 'Write Qc.', answer: { gradingMode: selfCheck, keyPoints: ['$[HI]^2/([H_2][I_2])$'] }, explanation: 'Solution: $Q_c=[HI]^2/([H_2][I_2])$. Why it works: The same balanced reaction defines Q and K.' }
      - { id: q2, title: Calculate Qc, instruction: 'Substitute only the current mixture values.', type: numericResponse, prompt: 'Find Qc.', answer: { value: 4, tolerance: 0.001 }, explanation: 'Solution: $0.40^2/(0.20\cdot0.20)=4.0$. Why it works: Q is the current product-to-reactant ratio.' }
      - { id: q3, title: Predict net direction, instruction: 'Compare Qc = 4 with Kc = 50.', type: freeResponse, prompt: 'State the net direction.', answer: { gradingMode: selfCheck, keyPoints: ['forward', 'toward products'] }, explanation: 'Solution: The net reaction proceeds forward. Why it works: $Q<K$, so product relative concentration must rise.' }
  - id: ice-approximation
    title: Solve a supported ICE setup
    problem: 'For $A\rightleftharpoons B$, initially $[A]=0.100$ M and $[B]=0$. At equilibrium $K_c=4.0\times10^{-4}$.'
    steps:
      - { id: i1, title: Set up equilibrium values, instruction: 'Let x be the amount of B formed.', type: freeResponse, prompt: 'State [A]eq and [B]eq.', answer: { gradingMode: selfCheck, keyPoints: ['$0.100-x$', '$x$'] }, explanation: 'Solution: $[A]_{eq}=0.100-x$ and $[B]_{eq}=x$. Why it works: One B forms per A consumed.' }
      - { id: i2, title: Use the small-x model, instruction: 'For small K, test $0.100-x\approx0.100$.', type: numericResponse, prompt: 'Using the approximation, find x.', answer: { value: 0.00004, tolerance: 0.000001 }, explanation: 'Solution: $K=x/(0.100)=4.0\times10^{-4}$, so $x=4.0\times10^{-5}$ M. Why it works: The small K predicts little conversion.' }
      - { id: i3, title: Check the approximation, instruction: 'Compare x with the initial concentration.', type: numericResponse, prompt: 'Find the percent change in A.', answer: { value: 0.04, tolerance: 0.002 }, explanation: 'Solution: $(4.0\times10^{-5}/0.100)100=0.040\%$. Why it works: The change is far below 5%, supporting the approximation.' }
