items:
  - id: r001
    type: typed
    prompt: What should each important line of a proof have?
    answer: { expected: justification, aliases: ['a reason', 'a valid reason'] }
    explanation: |
      Solution: It should have a justification.
      Why it works: A proof is a sequence of claims licensed by assumptions, definitions, calculations, or earlier results.
  - id: r002
    type: typed
    prompt: What two parts should you label first in a conditional theorem?
    answer: { expected: 'hypothesis and conclusion', aliases: ['the hypothesis and the conclusion'] }
    explanation: |
      Solution: Label the hypothesis and conclusion.
      Why it works: Their connection is the destination of a proof of a conditional statement.
  - id: r003
    type: typed
    prompt: What is a proof map?
    answer: { expected: 'an outline of claims and reasons', aliases: ['a map of claims and justifications', 'an argument outline'] }
    explanation: |
      Solution: It is an outline of claims and reasons.
      Why it works: Mapping dependencies makes the proof's logical structure visible to a reader.
  - id: r004
    type: typed
    prompt: If a proof step seems to jump, what should you look for before accepting it?
    answer: { expected: 'a valid rule or justification', aliases: ['a justification', 'a definition theorem or rule'] }
    explanation: |
      Solution: Look for a valid rule or justification.
      Why it works: An omitted step is safe only when it follows from information already available by a named or checkable rule.
