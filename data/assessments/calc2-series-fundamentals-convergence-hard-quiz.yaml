  prompt: |
    Does the series converge or diverge?

    $$
    \sum_{n=1}^{\infty}\frac{n^2+1}{n^3+n}
    $$
  choices:
  - id: a
    text: |-
      Diverges by limit comparison with $\frac1n$
  - id: b
    text: |-
      Converges by comparison with $\frac1{n^2}$
  - id: c
    text: Converges by ratio test
  - id: d
    text: Diverges by oscillation
  answer:
    choiceId: a
  explanation: |-
    Solution: The dominant behavior is $\frac{n^2}{n^3}=\frac1n$. Since the harmonic series diverges, limit comparison gives divergence. Therefore the answer is Diverges by limit comparison with $\frac1n$.

    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

    Why the other choices fail: Converges by comparison with $\frac1{n^2}$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; Converges by ratio test conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; Diverges by oscillation conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
