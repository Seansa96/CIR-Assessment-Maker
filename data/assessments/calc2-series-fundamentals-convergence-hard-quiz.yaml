questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac{n^2+1}{n^3+n}
      $$
    choices:
      - id: a
        text: Diverges by limit comparison with $\frac1n$
      - id: b
        text: Converges by comparison with $\frac1{n^2}$
      - id: c
        text: Converges by ratio test
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      The dominant behavior is $\frac{n^2}{n^3}=\frac1n$. Since the harmonic series diverges, limit comparison gives divergence.
  - id: q002
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac{3n^2+1}{n^4+7}
      $$
    choices:
      - id: a
        text: Converges by comparison with $\frac1{n^2}$
      - id: b
        text: Diverges by comparison with $\frac1n$
      - id: c
        text: Diverges by nth-term test
      - id: d
        text: Converges conditionally
    answer:
      choiceId: a
    explanation: |
      The dominant behavior is $\frac{3n^2}{n^4}=\frac3{n^2}$. Since $\sum \frac1{n^2}$ converges, the given positive series converges.
  - id: q003
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac{\left(1+\frac1n\right)^n}{n^2}
      $$
    choices:
      - id: a
        text: Converges by comparison with $\frac{e}{n^2}$
      - id: b
        text: Diverges because $\left(1+\frac1n\right)^n\to e$
      - id: c
        text: Diverges by nth-term test
      - id: d
        text: Diverges by ratio test
    answer:
      choiceId: a
    explanation: |
      The numerator approaches $e$ and stays bounded. The series behaves like a constant times $\frac1{n^2}$, so it converges.
  - id: q004
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac{n^3}{3^n}
      $$
    choices:
      - id: a
        text: Converges by the ratio test
      - id: b
        text: Diverges because $n^3$ grows
      - id: c
        text: Diverges by p-series
      - id: d
        text: Diverges by nth-term test
    answer:
      choiceId: a
    explanation: |
      Exponential growth in $3^n$ beats polynomial growth. The ratio test limit is $\frac13<1$.
  - id: q005
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac{(-1)^n}{\sqrt n}
      $$
    choices:
      - id: a
        text: Converges conditionally by the alternating series test
      - id: b
        text: Converges absolutely by p-series
      - id: c
        text: Diverges by p-series
      - id: d
        text: Diverges by nth-term test
    answer:
      choiceId: a
    explanation: |
      The terms $\frac1{\sqrt n}$ decrease to $0$, so the alternating series converges. The absolute-value series is a divergent p-series with $p=\frac12$.
  - id: q006
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}(-1)^n\frac{n}{n+1}
      $$
    choices:
      - id: a
        text: Diverges by the nth-term test
      - id: b
        text: Converges conditionally by alternating series test
      - id: c
        text: Converges absolutely
      - id: d
        text: Converges by ratio test
    answer:
      choiceId: a
    explanation: |
      The term $\frac{n}{n+1}$ approaches $1$, so the signed terms do not approach $0$. The series diverges.
  - id: q007
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac{1}{\sqrt{n^2+1}}
      $$
    choices:
      - id: a
        text: Diverges by limit comparison with $\frac1n$
      - id: b
        text: Converges by comparison with $\frac1{n^2}$
      - id: c
        text: Converges by ratio test
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      Since $\sqrt{n^2+1}\sim n$, the terms behave like $\frac1n$. Limit comparison with the harmonic series gives divergence.
  - id: q008
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac{1}{n^2+\sin n}
      $$
    choices:
      - id: a
        text: Converges by comparison with $\frac1{n^2}$
      - id: b
        text: Diverges by comparison with $\frac1n$
      - id: c
        text: Diverges because $\sin n$ oscillates
      - id: d
        text: Diverges by nth-term test
    answer:
      choiceId: a
    explanation: |
      The denominator is dominated by $n^2$, and the bounded $\sin n$ term does not change the p-series behavior. The series converges.
  - id: q009
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=2}^{\infty}\frac{\ln n}{n}
      $$
    choices:
      - id: a
        text: Diverges by the integral test
      - id: b
        text: Converges by comparison with $\frac1{n^2}$
      - id: c
        text: Converges by ratio test
      - id: d
        text: Converges conditionally
    answer:
      choiceId: a
    explanation: |
      The integral of $\frac{\ln x}{x}$ is $\frac12(\ln x)^2$, which grows without bound. The series diverges.
  - id: q010
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac{(n!)^2}{(2n)!}
      $$
    choices:
      - id: a
        text: Converges by the ratio test
      - id: b
        text: Diverges by the ratio test
      - id: c
        text: Diverges by p-series
      - id: d
        text: Diverges by nth-term test
    answer:
      choiceId: a
    explanation: |
      The ratio simplifies to

      $$
      \frac{a_{n+1}}{a_n}=\frac{(n+1)^2}{(2n+2)(2n+1)}\to \frac14.
      $$

      Since the ratio limit is less than $1$, the series converges.
  - id: q011
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac{5^n}{n^3 6^n}
      $$
    choices:
      - id: a
        text: Converges by comparison with a geometric series
      - id: b
        text: Diverges by comparison with harmonic
      - id: c
        text: Diverges by nth-term test
      - id: d
        text: Converges conditionally
    answer:
      choiceId: a
    explanation: |
      The factor $\left(\frac56\right)^n$ is geometric with ratio less than $1$, and division by $n^3$ only makes terms smaller.
  - id: q012
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac{n^n}{n!}
      $$
    choices:
      - id: a
        text: Diverges by the nth-term test
      - id: b
        text: Converges by the ratio test
      - id: c
        text: Converges by p-series
      - id: d
        text: Converges conditionally
    answer:
      choiceId: a
    explanation: |
      The terms do not approach $0$; in fact they grow. A series cannot converge unless its terms approach $0$.
  - id: q013
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\left(\sqrt{n+1}-\sqrt n\right)
      $$
    choices:
      - id: a
        text: Diverges; the partial sums telescope to $\sqrt{N+1}-1$
      - id: b
        text: Converges; the terms approach 0
      - id: c
        text: Converges absolutely by p-series
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      The partial sums are $\sqrt{N+1}-1$, which go to infinity. Terms going to $0$ is necessary but not sufficient.
  - id: q014
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\left(\frac1n-\frac1{n+1}\right)
      $$
    choices:
      - id: a
        text: Converges; it telescopes
      - id: b
        text: Diverges like harmonic
      - id: c
        text: Diverges by nth-term test
      - id: d
        text: Diverges by ratio test
    answer:
      choiceId: a
    explanation: |
      The partial sum is $1-\frac1{N+1}$, which approaches $1$.
  - id: q015
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\left(1-\cos\left(\frac1n\right)\right)
      $$
    choices:
      - id: a
        text: Converges by comparison with $\frac1{n^2}$
      - id: b
        text: Diverges by comparison with $\frac1n$
      - id: c
        text: Diverges by nth-term test
      - id: d
        text: Converges conditionally
    answer:
      choiceId: a
    explanation: |
      For small $x$, $1-\cos x\sim \frac{x^2}{2}$. With $x=\frac1n$, the terms behave like $\frac1{2n^2}$, so the series converges.
