questions:
  - id: q001
    type: freeResponse
    prompt: |
      Convert the equation to standard form. Then state the vertex, focus, directrix, axis, and direction of opening.

      $$
      y^2+6y+2x+1=0
      $$
    answer:
      expected: |
        Complete the square:

        $$
        y^2+6y=-2x-1,
        $$

        $$
        (y+3)^2=-2x+8=-2(x-4).
        $$

        Vertex: $(4,-3)$
        $4p=-2$, so $p=-\frac12$
        Focus: $\left(\frac72,-3\right)$
        Directrix: $x=\frac92$
        Axis: $y=-3$
        The parabola opens left.
      gradingMode: selfCheck
      keyPoints:
        - Completes the square by adding $9$.
        - Factors the right side as $-2(x-4)$.
        - Uses $p=-\frac12$ for the focus and directrix.
    explanation: |
      Only $y$ is squared, so the result must be a horizontal parabola. Keep the $x$ coefficient attached when factoring standard form; the coefficient equals $4p$, not $p$.

      Related topic: completing the square for a translated parabola.

  - id: q002
    type: freeResponse
    prompt: |
      Convert the equation to standard form. Then state the vertex, focus, directrix, axis, and direction of opening.

      $$
      2x^2-16x-3y+38=0
      $$
    answer:
      expected: |
        Group and complete the square:

        $$
        2(x^2-8x)-3y+38=0,
        $$

        $$
        2(x-4)^2=3(y-2),
        $$

        $$
        (x-4)^2=\frac32(y-2).
        $$

        Vertex: $(4,2)$
        $p=\frac38$
        Focus: $\left(4,\frac{19}{8}\right)$
        Directrix: $y=\frac{13}{8}$
        Axis: $x=4$
        The parabola opens upward.
      gradingMode: selfCheck
      keyPoints:
        - Factors $2$ before completing the square.
        - Balances the equation correctly after adding $16$ inside the group.
        - Uses $4p=\frac32$.
    explanation: |
      Factoring the leading coefficient before completing the square prevents a balancing error. Once the equation is $(x-h)^2=4p(y-k)$, all geometric information follows from the vertex and directed distance $p$.

      Related topic: completing the square with a non-unit leading coefficient.

  - id: q003
    type: freeResponse
    prompt: |
      The graph below is a parabola. Find its equation, focus, and directrix.
    media:
      - type: image
        src: /assessments/precalc-conics/parabola-y2-negative-x.svg
        alt: Coordinate graph of a parabola with vertex at the origin opening left through negative x-values.
        caption: Determine the scale and orientation from the grid.
    answer:
      expected: |
        The vertex is $(0,0)$ and points such as $(-1,\pm1)$ and $(-4,\pm2)$ satisfy the graph. Therefore

        $$
        y^2=-x.
        $$

        Since $4p=-1$, $p=-\frac14$.

        Focus: $\left(-\frac14,0\right)$
        Directrix: $x=\frac14$
      gradingMode: selfCheck
      keyPoints:
        - Reads the vertex and left-opening orientation.
        - Uses a grid point to determine the coefficient.
        - Converts $4p=-1$ into $p=-\frac14$.
    explanation: |
      Start with $y^2=4px$ because the vertex is the origin and the axis is horizontal. A visible point such as $(-1,1)$ gives $1=4p(-1)$, so $4p=-1$.

      Related topic: reconstructing a parabola from a graph.

  - id: q004
    type: freeResponse
    prompt: |
      Convert the equation to standard form. Then state the center, orientation, vertices, co-vertices, and foci.

      $$
      4x^2+25y^2-50y=75
      $$
    answer:
      expected: |
        Complete the square in $y$:

        $$
        4x^2+25(y^2-2y)=75,
        $$

        $$
        4x^2+25(y-1)^2=100,
        $$

        $$
        \frac{x^2}{25}+\frac{(y-1)^2}{4}=1.
        $$

        Center: $(0,1)$
        Vertices: $(\pm5,1)$
        Co-vertices: $(0,3)$ and $(0,-1)$
        Foci: $(\pm\sqrt{21},1)$
      gradingMode: selfCheck
      keyPoints:
        - Factors $25$ from the $y$ terms before completing the square.
        - Adds the corresponding $25$ to the equation.
        - Uses $c^2=25-4=21$.
    explanation: |
      The coefficient outside the completed-square group scales the balancing term. After normalization, the larger denominator lies under $x$, making the major axis horizontal.

      Related topic: ellipse conversion from general to standard form.

  - id: q005
    type: freeResponse
    prompt: |
      Convert the equation to standard form. Then state the center, orientation, vertices, co-vertices, and foci.

      $$
      9x^2-54x+y^2+2y+46=0
      $$
    answer:
      expected: |
        Complete both squares:

        $$
        9(x^2-6x)+(y^2+2y)=-46,
        $$

        $$
        9(x-3)^2+(y+1)^2=36,
        $$

        $$
        \frac{(x-3)^2}{4}+\frac{(y+1)^2}{36}=1.
        $$

        Center: $(3,-1)$
        Vertices: $(3,5)$ and $(3,-7)$
        Co-vertices: $(5,-1)$ and $(1,-1)$
        Foci: $(3,-1\pm4\sqrt2)$
      gradingMode: selfCheck
      keyPoints:
        - Completes both squares with their outside coefficients.
        - Identifies the vertical major axis.
        - Uses $c^2=36-4=32$.
    explanation: |
      Group each variable separately and account for the factor $9$ on the $x$ group. The denominator $36$ under the $y$ term gives a vertical major axis.

      Related topic: completing two squares in an ellipse equation.

  - id: q006
    type: freeResponse
    prompt: |
      Use the graph to find an equation of the ellipse and then find its foci.
    media:
      - type: image
        src: /assessments/precalc-conics/ellipse-centered-vertical.svg
        alt: Coordinate graph of an ellipse centered at the origin with horizontal radius two and vertical radius three.
        caption: Read the center and both semi-axis lengths from the grid.
    answer:
      expected: |
        The center is $(0,0)$, the vertical semi-major axis is $a=3$, and the horizontal semi-minor axis is $b=2$. Thus

        $$
        \frac{x^2}{4}+\frac{y^2}{9}=1.
        $$

        Since $c^2=9-4=5$, the foci are

        $$
        (0,\pm\sqrt5).
        $$
      gradingMode: selfCheck
      keyPoints:
        - Reads horizontal radius $2$ and vertical radius $3$.
        - Places each squared radius under its corresponding variable.
        - Places the foci on the vertical major axis.
    explanation: |
      A graph supplies the center and semi-axis lengths directly. The major-axis denominator is $a^2=9$, while the other denominator is $b^2=4$.

      Related topic: recovering an ellipse equation from its graph.

  - id: q007
    type: freeResponse
    prompt: |
      Use the graph to find an equation of the ellipse and then find its foci.
    media:
      - type: image
        src: /assessments/precalc-conics/ellipse-translated-horizontal.svg
        alt: Coordinate graph of an ellipse centered at two comma one with horizontal radius three and vertical radius two.
        caption: Read the translated center and both semi-axis lengths from the grid.
    answer:
      expected: |
        The center is $(2,1)$, the horizontal semi-major axis is $a=3$, and the vertical semi-minor axis is $b=2$. Therefore

        $$
        \frac{(x-2)^2}{9}+\frac{(y-1)^2}{4}=1.
        $$

        Since $c^2=9-4=5$, the foci are

        $$
        (2\pm\sqrt5,1).
        $$
      gradingMode: selfCheck
      keyPoints:
        - Reads the translated center $(2,1)$.
        - Uses horizontal radius $3$ and vertical radius $2$.
        - Translates the foci from the center.
    explanation: |
      The midpoint of opposite vertices is the center. Once the semi-axis lengths are read from the graph, use $c^2=a^2-b^2$ and move $c$ units along the major axis.

      Related topic: translated ellipse reconstruction.

  - id: q008
    type: freeResponse
    prompt: |
      Convert the equation to standard form. Then state the center, vertices, foci, and asymptotes.

      $$
      x^2-y^2+2y=2
      $$
    answer:
      expected: |
        Complete the square in $y$:

        $$
        x^2-(y^2-2y)=2,
        $$

        $$
        x^2-(y-1)^2=1.
        $$

        Center: $(0,1)$
        Vertices: $(\pm1,1)$
        Foci: $(\pm\sqrt2,1)$
        Asymptotes: $y-1=\pm x$
      gradingMode: selfCheck
      keyPoints:
        - Handles the negative sign outside the $y$ group.
        - Identifies a horizontal translated hyperbola.
        - Translates both asymptotes through $(0,1)$.
    explanation: |
      The subtraction must remain outside the completed square. Once written as $x^2-(y-1)^2=1$, both denominators are $1$, so the asymptote slopes are $\pm1$.

      Related topic: sign control while completing the square for a hyperbola.

  - id: q009
    type: freeResponse
    prompt: |
      Identify the conic, write it in standard form, and state its vertices and foci.

      $$
      4x^2=y^2+4
      $$
    answer:
      expected: |
        Rearrange and normalize:

        $$
        4x^2-y^2=4,
        \qquad
        x^2-\frac{y^2}{4}=1.
        $$

        This is a horizontal hyperbola centered at $(0,0)$.

        Vertices: $(\pm1,0)$
        Foci: $(\pm\sqrt5,0)$
        Asymptotes: $y=\pm2x$
      gradingMode: selfCheck
      keyPoints:
        - Recognizes opposite signs as a hyperbola.
        - Normalizes the right side to $1$.
        - Uses $c^2=1+4=5$.
    explanation: |
      Two squared variables with opposite signs indicate a hyperbola. The positive term identifies the transverse axis.

      Related topic: conic classification by quadratic-term signs.

  - id: q010
    type: freeResponse
    prompt: |
      Identify the conic, write it in standard form, and state its vertex, focus, and directrix.

      $$
      4x^2=y+4
      $$
    answer:
      expected: |
        Rewrite as

        $$
        x^2=\frac14(y+4).
        $$

        This is an upward-opening parabola with vertex $(0,-4)$. Since $4p=\frac14$, $p=\frac1{16}$.

        Focus: $\left(0,-\frac{63}{16}\right)$
        Directrix: $y=-\frac{65}{16}$
      gradingMode: selfCheck
      keyPoints:
        - Recognizes that only one variable is squared.
        - Uses $4p=\frac14$, not $p=\frac14$.
        - Offsets the focus and directrix from $y=-4$.
    explanation: |
      A single squared variable indicates a parabola. Isolate $x^2$ so its coefficient can be compared directly with $4p$.

      Related topic: distinguishing a parabola from a hyperbola.

  - id: q011
    type: freeResponse
    prompt: |
      Identify the conic, write it in standard form, and state its center, vertices, and foci.

      $$
      x^2=4y-2y^2
      $$
    answer:
      expected: |
        Complete the square:

        $$
        x^2+2(y^2-2y)=0,
        $$

        $$
        x^2+2(y-1)^2=2,
        $$

        $$
        \frac{x^2}{2}+(y-1)^2=1.
        $$

        This is an ellipse centered at $(0,1)$.

        Vertices: $(\pm\sqrt2,1)$
        Co-vertices: $(0,0)$ and $(0,2)$
        Foci: $(\pm1,1)$
      gradingMode: selfCheck
      keyPoints:
        - Recognizes same-sign squared terms after rearranging.
        - Completes the square in $y$.
        - Uses $c^2=2-1=1$.
    explanation: |
      Classification may become clear only after moving terms to the same side. Both squared terms are positive after rearrangement, which indicates an ellipse.

      Related topic: classification after algebraic rearrangement.

  - id: q012
    type: freeResponse
    prompt: |
      Identify the conic, write it in standard form, and state its center, vertices, foci, and asymptotes.

      $$
      y^2-2=x^2-2x
      $$
    answer:
      expected: |
        Complete the square:

        $$
        y^2-(x^2-2x)=2,
        $$

        $$
        y^2-(x-1)^2=1.
        $$

        This is a vertical hyperbola centered at $(1,0)$.

        Vertices: $(1,\pm1)$
        Foci: $(1,\pm\sqrt2)$
        Asymptotes: $y=\pm(x-1)$
      gradingMode: selfCheck
      keyPoints:
        - Keeps the negative sign outside the $x$ group.
        - Identifies the translated center.
        - Writes asymptotes through $(1,0)$.
    explanation: |
      Opposite signs produce a hyperbola. The positive $y^2$ term makes it vertical, and the completed square shifts the center one unit right.

      Related topic: translated hyperbola classification.

  - id: q013
    type: freeResponse
    prompt: |
      Identify the conic, write it in standard form, and state its vertex, focus, and directrix.

      $$
      3x^2-6x-2y=1
      $$
    answer:
      expected: |
        Complete the square:

        $$
        3(x^2-2x)-2y=1,
        $$

        $$
        3(x-1)^2=2(y+2),
        $$

        $$
        (x-1)^2=\frac23(y+2).
        $$

        This is a parabola with vertex $(1,-2)$. Since $4p=\frac23$, $p=\frac16$.

        Focus: $\left(1,-\frac{11}{6}\right)$
        Directrix: $y=-\frac{13}{6}$
      gradingMode: selfCheck
      keyPoints:
        - Recognizes one squared variable as a parabola.
        - Completes the $x$ square after factoring $3$.
        - Computes $p=\frac16$.
    explanation: |
      Factor the quadratic coefficient before completing the square. The positive value of $p$ means the focus lies above the vertex.

      Related topic: general-form parabola classification.

  - id: q014
    type: freeResponse
    prompt: |
      Identify the conic, write it in standard form, and state its center, vertices, co-vertices, and foci.

      $$
      x^2-2x+2y^2-8y+7=0
      $$
    answer:
      expected: |
        Complete both squares:

        $$
        (x-1)^2+2(y-2)^2=2,
        $$

        $$
        \frac{(x-1)^2}{2}+(y-2)^2=1.
        $$

        This is an ellipse centered at $(1,2)$.

        Vertices: $(1\pm\sqrt2,2)$
        Co-vertices: $(1,1)$ and $(1,3)$
        Foci: $(0,2)$ and $(2,2)$
      gradingMode: selfCheck
      keyPoints:
        - Completes both squares correctly.
        - Normalizes the equation.
        - Uses $c^2=2-1=1$.
    explanation: |
      Same-sign squared terms with unequal coefficients indicate an ellipse. Normalization reveals the semi-axis lengths and horizontal major axis.

      Related topic: complete-square conic classification.

  - id: q015
    type: symbolicResponse
    prompt: |
      Find an equation of the parabola with a vertical axis passing through $(0,4)$, $(1,3)$, and $(-2,-6)$.
    answer:
      expectedLatex: 'y=-2x^2+x+4'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      Use $y=ax^2+bx+c$. The point $(0,4)$ gives $c=4$. The other points produce

      $$
      a+b=-1
      $$

      and

      $$
      2a-b=-5.
      $$

      Solving gives $a=-2$ and $b=1$, so

      $$
      y=-2x^2+x+4.
      $$

      Related topic: constructing a parabola from three points using a linear system.

  - id: q016
    type: symbolicResponse
    prompt: |
      Find an equation of the ellipse with foci $(\pm4,0)$ that passes through $\left(-4,\frac95\right)$.
    answer:
      expectedLatex: '\frac{x^2}{25}+\frac{y^2}{9}=1'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      The center is the origin, the major axis is horizontal, and $c=4$. Let $a^2=A$, so $b^2=A-16$. Substituting the point gives

      $$
      \frac{16}{A}+\frac{81/25}{A-16}=1.
      $$

      The geometrically valid solution is $A=25$, so $b^2=9$. Therefore

      $$
      \frac{x^2}{25}+\frac{y^2}{9}=1.
      $$

      Related topic: constructing an ellipse from its foci and one point.

  - id: q017
    type: symbolicResponse
    prompt: |
      Find an equation of the hyperbola with vertices $(-3,-4)$ and $(-3,6)$ and foci $(-3,-7)$ and $(-3,9)$.
    answer:
      expectedLatex: '\frac{(y-1)^2}{25}-\frac{(x+3)^2}{39}=1'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      Both pairs have midpoint $(-3,1)$, and their shared $x$ coordinate gives a vertical transverse axis. The center-to-vertex distance is $a=5$ and the center-to-focus distance is $c=8$. Thus

      $$
      b^2=c^2-a^2=64-25=39.
      $$

      Related topic: translated hyperbola construction from vertices and foci.

  - id: q018
    type: symbolicResponse
    prompt: |
      Find an equation of the hyperbola with vertices $(-1,2)$ and $(7,2)$ and foci $(-2,2)$ and $(8,2)$.
    answer:
      expectedLatex: '\frac{(x-3)^2}{16}-\frac{(y-2)^2}{9}=1'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      The common midpoint is $(3,2)$ and the shared $y$ coordinate gives a horizontal transverse axis. Here $a=4$ and $c=5$, so

      $$
      b^2=25-16=9.
      $$

      Related topic: midpoint and distance extraction for translated hyperbolas.

  - id: q019
    type: symbolicResponse
    prompt: |
      Find an equation of the hyperbola with vertices $(\pm3,0)$ and asymptotes $y=\pm2x$.
    answer:
      expectedLatex: '\frac{x^2}{9}-\frac{y^2}{36}=1'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      The vertices give a horizontal hyperbola centered at the origin with $a=3$. For

      $$
      \frac{x^2}{a^2}-\frac{y^2}{b^2}=1,
      $$

      the asymptote slopes are $\pm\frac ba$. Therefore $\frac b3=2$, so $b=6$ and $b^2=36$.

      Related topic: building a hyperbola from vertices and asymptotes.

  - id: q020
    type: symbolicResponse
    prompt: |
      Find an equation of the hyperbola with foci $(2,0)$ and $(2,8)$ and asymptotes

      $$
      y=3+\frac12x
      \qquad\text{and}\qquad
      y=5-\frac12x.
      $$
    answer:
      expectedLatex: '\frac{(y-4)^2}{16/5}-\frac{(x-2)^2}{64/5}=1'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      The asymptotes intersect at the center $(2,4)$, which is also the midpoint of the foci. Thus $c=4$. The vertical hyperbola has asymptote slopes $\pm\frac ab=\pm\frac12$, so $b=2a$. Using

      $$
      c^2=a^2+b^2
      $$

      gives $16=5a^2$, hence $a^2=\frac{16}{5}$ and $b^2=\frac{64}{5}$.

      Related topic: recovering hyperbola parameters from asymptotes and foci.

  - id: q021
    type: symbolicResponse
    prompt: |
      The point in a lunar orbit nearest the Moon is called perilune, and the farthest point is called apolune. Apollo 11 entered an elliptical lunar orbit with a perilune altitude of $110$ km and an apolune altitude of $314$ km. The Moon's radius is $1728$ km.

      Place the Moon's center at the focus $(0,0)$, place the orbit's major axis on the $x$-axis, and place perilune to the left of the Moon. Find an equation of the orbit.
    answer:
      expectedLatex: '\frac{(x-102)^2}{3763600}+\frac{y^2}{3753196}=1'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      The stated altitudes are measured from the surface, so first add the Moon's radius:

      $$
      r_{\text{peri}}=1728+110=1838,
      $$

      $$
      r_{\text{apo}}=1728+314=2042.
      $$

      For a focus on the major axis, these distances are $a-c$ and $a+c$. Therefore

      $$
      a=\frac{1838+2042}{2}=1940,
      \qquad
      c=\frac{2042-1838}{2}=102.
      $$

      Then

      $$
      b^2=a^2-c^2=1940^2-102^2=3{,}753{,}196.
      $$

      With perilune on the left and the Moon at the left focus, the ellipse center is $(102,0)$. Hence

      $$
      \frac{(x-102)^2}{3{,}763{,}600}
      +
      \frac{y^2}{3{,}753{,}196}
      =1.
      $$

      Related topic: ellipse modeling from periapsis and apoapsis distances.
