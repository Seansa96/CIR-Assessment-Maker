glossary:
  introduction: Use these definitions to separate the vector quantities, time interval, and system condition in collision reasoning.
  sections:
  - id: momentum-terms
    title: Momentum, impulse, and system terms
    required: true
    content: Link each term to its equation and units before substituting values.
    entries:
    - id: linear-momentum
      term: Linear momentum
      definition: A vector equal to mass times velocity.
      notation: $\vec p=m\vec v$
      examples:
      - A leftward velocity gives negative x momentum when right is positive.
      aliases:
      - momentum
      media: []
      tags:
      - momentum
      drills:
      - id: momentum-drill
        type: cloze
        prompt: In $\vec p=m\vec v$, $\vec p$ is ____ momentum.
        answer:
          expected: linear
          expectedLatex: ''
          aliases: []
          media: []
          choiceId: 
        explanation: 'Solution: The word is "linear."\n\nWhy it works: $\vec p$ is the standard symbol for linear momentum.'
        tags:
        - momentum
        skills: []
        choices: []
    - id: impulse
      term: Impulse
      definition: The vector integral of net force over an interval
      notation: $\vec J=\int\vec F\,dt=\Delta\vec p$
      examples:
      - A force-time graph area is impulse.
      aliases: []
      media: []
      tags:
      - impulse
      drills:
      - id: impulse-drill
        type: cloze
        prompt: Net impulse equals the change in ____.
        answer:
          expected: momentum
          expectedLatex: ''
          aliases: []
          media: []
          choiceId: 
        explanation: 'Solution: It equals the change in momentum.\n\nWhy it works: The impulse-momentum theorem states $\vec J=\Delta\vec p$.'
        tags:
        - impulse
        skills: []
        choices: []
    - id: net-external-impulse
      term: Net external impulse
      definition: The time-integrated vector sum of forces exerted on the system by outside agents.
      notation: $\vec J_{\mathrm{ext}}=\Delta\vec P$
      examples:
      - Negligible external impulse allows momentum conservation during a short collision.
      aliases: []
      media: []
      tags:
      - system
      drills:
      - id: external-impulse-drill
        type: cloze
        prompt: If net external impulse is zero, total system momentum is ____.
        answer:
          expected: conserved
          expectedLatex: ''
          aliases:
          - constant
          media: []
          choiceId: 
        explanation: 'Solution: It is conserved.\n\nWhy it works: Zero net external impulse means $\Delta\vec P=0$.'
        tags:
        - system
        skills: []
        choices: []
    - id: perfectly-inelastic
      term: Perfectly inelastic collision
      definition: A collision in which objects stick together and share one final velocity.
      notation: $m_1v_{1i}+m_2v_{2i}=(m_1+m_2)v_f$
      examples:
      - Two carts latch together after colliding.
      aliases:
      - sticking collision
      media: []
      tags:
      - collisions
      drills:
      - id: inelastic-drill
        type: cloze
        prompt: In a perfectly inelastic collision, the objects ____ together.
        answer:
          expected: stick
          expectedLatex: ''
          aliases:
          - remain attached
          - attach
          media: []
          choiceId: 
        explanation: 'Solution: They stick together.\n\nWhy it works: A perfectly inelastic collision has one shared final velocity.'
        tags:
        - collisions
        skills: []
        choices: []
