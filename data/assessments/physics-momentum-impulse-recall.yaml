schemaVersion: 1
id: physics-momentum-impulse-recall
title: 'Recall: Momentum and Impulse'
description: Retrieve the essential relationships and conditions before applying momentum methods.
assessmentType: glossary
categoryId: physics-1
topicId: physics-momentum-collisions
skills: [linear-momentum, impulse, conservation-of-momentum]
navigation:
  learningGoal: learn
  activityType: glossary
  tags: [physics-1, momentum, impulse, collisions]
glossary:
  introduction: Use these short recalls to distinguish momentum, impulse, and the system condition needed for conservation.
  sections:
  - id: momentum-and-impulse-core-terms
    title: Momentum and impulse
    entries:
    - id: momentum-definition
      term: Linear momentum
      definition: Linear momentum is a vector quantity given by $\vec{p}=m\vec{v}$.
      drills:
      - id: momentum-symbol-recall
        prompt: In $\vec{p}=m\vec{v}$, the symbol $\vec{p}$ represents linear ________.
        type: typed
        answer:
          expected: momentum
    - id: impulse-momentum-theorem
      term: Impulse-momentum theorem
      definition: The net impulse on an object equals its change in momentum, $\vec{J}=\Delta\vec{p}$.
      drills:
      - id: impulse-change-recall
        prompt: Net impulse equals the change in ________.
        type: typed
        answer:
          expected: momentum
  - id: momentum-conservation-condition
    title: Conservation condition
    entries:
    - id: closed-system-condition
      term: Closed system for momentum
      definition: Momentum conservation applies when the system has no net external force over the interaction being modeled.
      drills:
      - id: conservation-condition-recall
        prompt: For momentum to be conserved, the system's net external ________ must be zero.
        type: typed
        answer:
          expected: force
    - id: collision-classification
      term: Inelastic collision
      definition: In an inelastic collision, total momentum can be conserved for a closed system, while kinetic energy is not conserved.
      drills:
      - id: inelastic-energy-recall
        prompt: In a closed-system inelastic collision, total momentum is conserved but total ________ energy is not.
        type: typed
        answer:
          expected: kinetic
