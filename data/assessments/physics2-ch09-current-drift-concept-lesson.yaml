lesson:
  introduction: >
    This lesson develops a repeatable way to solve Current & Drift Velocity problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch09-current-drift-s1
    title: Name the model and quantities
    required: true
    content: >
      Current & Drift Velocity uses I = nqA v_d. In the name the model and quantities stage, connect microscopic carrier density and drift speed to macroscopic current.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Current & Drift Velocity problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch09-current-drift-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Current & Drift Velocity, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use I = nqA v_d after you connect microscopic carrier density and drift speed to macroscopic current.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Current & Drift Velocity problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch09-current-drift-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables I = nqA v_d relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch09-current-drift-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Current & Drift Velocity.
        media: []
        issueSignals:
        - id: physics2-physics2-ch09-current-drift-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: During name the model and quantities for Current & Drift Velocity, first connect microscopic carrier density and drift speed to macroscopic current. Then apply I = nqA v_d with one consistent coordinate system and solve for the requested quantity.


        Why it works: I = nqA v_d connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
