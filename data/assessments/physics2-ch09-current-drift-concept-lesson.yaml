id: physics2-ch09-current-drift-concept-lesson
title: Current & Drift Velocity
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-current-resistance
lesson:
  introduction: This lesson develops the main ideas behind Current & Drift Velocity and connects them
    to the governing physical relationships.
  sections:
  - id: l1-sec1
    title: Electric Current
    required: true
    content: 'Electric current $I$ is the rate of flow of net charge through a cross-sectional area: $I
      = \frac{dq}{dt}$. It is measured in Amperes ($1\text{ A} = 1\text{ C/s}$).'
  - id: l1-sec2
    title: Drift Velocity
    required: true
    content: In a conductor, an electric field causes free electrons to drift slowly in a direction opposite
      to the field. The current is related to the drift velocity $v_d$ by $I = n q v_d A$, where $n$ is
      the charge carrier density, $q$ is the charge per carrier, and $A$ is the cross-sectional area.
