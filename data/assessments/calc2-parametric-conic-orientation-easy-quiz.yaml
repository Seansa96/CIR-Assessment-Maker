questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Select the graph for $0\le t\le2\pi$:

      $$
      x=\cos t,\qquad y=\sin t.
      $$
    choices:
      - id: a
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-right-ccw.svg)
      - id: b
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-right-cw.svg)
      - id: c
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-top-ccw.svg)
      - id: d
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-left-ccw.svg)
    answer:
      choiceId: a
    explanation: |
      At $t=0$, the point is $(1,0)$. As $t$ increases, $y=\sin t$ increases first, so the motion is counterclockwise.

  - id: q002
    type: multipleChoice
    prompt: |
      Select the graph for $0\le t\le2\pi$:

      $$
      x=\cos(-t),\qquad y=\sin(-t).
      $$
    choices:
      - id: a
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-right-cw.svg)
      - id: b
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-right-ccw.svg)
      - id: c
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-top-cw.svg)
      - id: d
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-bottom-ccw.svg)
    answer:
      choiceId: a
    explanation: |
      The starting point is still $(1,0)$, but replacing $t$ with $-t$ reverses the direction, so the circle is traced clockwise.

  - id: q003
    type: multipleChoice
    prompt: |
      Select the graph for $0\le t\le2\pi$:

      $$
      x=\cos\left(t+\frac{\pi}{2}\right),
      \qquad
      y=\sin\left(t+\frac{\pi}{2}\right).
      $$
    choices:
      - id: a
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-top-ccw.svg)
      - id: b
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-top-cw.svg)
      - id: c
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-right-ccw.svg)
      - id: d
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-left-cw.svg)
    answer:
      choiceId: a
    explanation: |
      At $t=0$, the angle is $\frac{\pi}{2}$, so the start is at the top. The positive $t$ coefficient keeps the standard counterclockwise direction.

  - id: q004
    type: multipleChoice
    prompt: |
      Select the graph for $0\le t\le2\pi$:

      $$
      x=2+3\cos t,\qquad y=1+1.2\sin t.
      $$
    choices:
      - id: a
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-ellipse-shift-right-ccw.svg)
      - id: b
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-ellipse-shift-right-cw.svg)
      - id: c
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-ellipse-top-ccw.svg)
      - id: d
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-right-ccw.svg)
    answer:
      choiceId: a
    explanation: |
      The center is $(2,1)$. At $t=0$, the start is $(5,1)$, the rightmost point, and positive sine makes the trace move upward.

  - id: q005
    type: multipleChoice
    prompt: |
      Select the graph for $0\le t\le2\pi$:

      $$
      x=\cos\left(-t+\frac{\pi}{2}\right),
      \qquad
      y=\sin\left(-t+\frac{\pi}{2}\right).
      $$
    choices:
      - id: a
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-top-cw.svg)
      - id: b
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-top-ccw.svg)
      - id: c
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-right-cw.svg)
      - id: d
        text: |
          ![Graph option](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-bottom-cw.svg)
    answer:
      choiceId: a
    explanation: |
      The phase shift starts the point at the top. The negative $t$ reverses the standard direction, so the orientation is clockwise.

  - id: q006
    type: multipleChoice
    prompt: |
      Select the parameterization that best matches the graph.

      ![Circle with red starting point at the left and counterclockwise arrows](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-left-ccw.svg)
    choices:
      - id: a
        text: '$x=\cos(t+\pi),\ y=\sin(t+\pi)$'
      - id: b
        text: '$x=\cos(-t+\pi),\ y=\sin(-t+\pi)$'
      - id: c
        text: '$x=\cos t,\ y=\sin t$'
      - id: d
        text: '$x=\cos(t+\frac{\pi}{2}),\ y=\sin(t+\frac{\pi}{2})$'
    answer:
      choiceId: a
    explanation: |
      The start at the left means the initial angle is $\pi$. Counterclockwise motion means the angle increases as $t$ increases.

  - id: q007
    type: multipleChoice
    prompt: |
      Select the parameterization that best matches the graph.

      ![Circle with red starting point at the bottom and clockwise arrows](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-bottom-cw.svg)
    choices:
      - id: a
        text: '$x=\cos(-t+\frac{3\pi}{2}),\ y=\sin(-t+\frac{3\pi}{2})$'
      - id: b
        text: '$x=\cos(t+\frac{3\pi}{2}),\ y=\sin(t+\frac{3\pi}{2})$'
      - id: c
        text: '$x=\cos(-t),\ y=\sin(-t)$'
      - id: d
        text: '$x=\cos(t+\pi),\ y=\sin(t+\pi)$'
    answer:
      choiceId: a
    explanation: |
      The bottom point corresponds to initial angle $\frac{3\pi}{2}$. Clockwise motion requires the negative $t$ coefficient.

  - id: q008
    type: multipleChoice
    prompt: |
      Select the parameterization that best matches the graph.

      ![Shifted ellipse with red starting point on the right and clockwise arrows](/assessments/calc2-parametric-polar/parametric-conic-quiz-ellipse-shift-right-cw.svg)
    choices:
      - id: a
        text: '$x=2+3\cos(-t),\ y=1+1.2\sin(-t)$'
      - id: b
        text: '$x=2+3\cos t,\ y=1+1.2\sin t$'
      - id: c
        text: '$x=-1+1.5\cos t,\ y=2+3\sin t$'
      - id: d
        text: '$x=\cos(-t),\ y=\sin(-t)$'
    answer:
      choiceId: a
    explanation: |
      The graph is centered at $(2,1)$ and starts at the rightmost point. The arrows move clockwise, so the parameter appears as $-t$.

  - id: q009
    type: multipleChoice
    prompt: |
      Select the parameterization that best matches the graph.

      ![Tall ellipse with red starting point at the top and counterclockwise arrows](/assessments/calc2-parametric-polar/parametric-conic-quiz-ellipse-top-ccw.svg)
    choices:
      - id: a
        text: '$x=-1+1.5\cos(t+\frac{\pi}{2}),\ y=2+3\sin(t+\frac{\pi}{2})$'
      - id: b
        text: '$x=-1+1.5\cos(-t+\frac{\pi}{2}),\ y=2+3\sin(-t+\frac{\pi}{2})$'
      - id: c
        text: '$x=2+3\cos t,\ y=1+1.2\sin t$'
      - id: d
        text: '$x=\cos(t+\frac{\pi}{2}),\ y=\sin(t+\frac{\pi}{2})$'
    answer:
      choiceId: a
    explanation: |
      The top start uses the $\frac{\pi}{2}$ phase shift. The counterclockwise direction keeps $t$ positive.

  - id: q010
    type: multipleChoice
    prompt: |
      Select the parameterization that best matches the graph.

      ![Circle with red starting point at the left and clockwise arrows](/assessments/calc2-parametric-polar/parametric-conic-quiz-circle-left-cw.svg)
    choices:
      - id: a
        text: '$x=\cos(-t+\pi),\ y=\sin(-t+\pi)$'
      - id: b
        text: '$x=\cos(t+\pi),\ y=\sin(t+\pi)$'
      - id: c
        text: '$x=\cos(-t+\frac{\pi}{2}),\ y=\sin(-t+\frac{\pi}{2})$'
      - id: d
        text: '$x=\cos t,\ y=\sin t$'
    answer:
      choiceId: a
    explanation: |
      The start at the left gives the initial angle $\pi$. The clockwise direction means the angle decreases as $t$ increases.
