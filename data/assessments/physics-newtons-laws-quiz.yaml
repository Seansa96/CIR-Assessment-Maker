questions:
- id: q001
  type: multipleChoice
  prompt: 'A 5.0 kg block is pushed across a frictionless\rhorizontal table by a constant
    net force of 20 N. What is the acceleration of the block?

    '
  choices:
  - id: a
    text: 100 m/s²
  - id: b
    text: 0.25 m/s²
  - id: c
    text: 4.0 m/s²
  - id: d
    text: 9.8 m/s²
  answer:
    choiceId: c
  explanation: 'Using Newton''s Second Law: $a = F/m = 20 / 5.0 = 4.0$ m/s².

    '
- id: q002
  type: multipleChoice
  prompt: 'A\rhorse pulls on a cart with a force of 500 N, accelerating it forward.
    According to Newton''s Third Law, what force does the cart exert on the\rhorse?

    '
  choices:
  - id: a
    text: Less than 500 N, because the cart is accelerating forward.
  - id: b
    text: Exactly 500 N, pulling backward on the\rhorse.
  - id: c
    text: More than 500 N, due to the inertia of the cart.
  - id: d
    text: 0 N, since the cart is inanimate and cannot pull.
  answer:
    choiceId: b
  explanation: 'Newton''s Third Law states that forces come in equal and opposite
    pairs. The force of the\rhorse on the cart is exactly equal in magnitude and opposite
    in direction to the force of the cart on the\rhorse. The reason they accelerate
    is because the\rhorse exerts a force on the *ground*, which pushes the\rhorse forward!

    '
- id: q003
  type: multipleChoice
  prompt: 'An elevator is accelerating upwards. What can be said about the apparent
    weight of a person standing on a scale inside the elevator?

    '
  choices:
  - id: a
    text: Their apparent weight is greater than their true weight.
  - id: b
    text: Their apparent weight is less than their true weight.
  - id: c
    text: Their apparent weight is equal to their true weight.
  - id: d
    text: Their apparent weight is zero.
  answer:
    choiceId: a
  explanation: 'The scale measures the normal force $N$. From Newton''s Second Law,
    $N - mg = ma$. Since $a$ is positive (upward), $N = m(g + a)$, meaning the normal
    force (apparent weight) is greater than the true weight ($mg$).

    '
- id: q004
  type: multipleChoice
  prompt: 'An object is moving at a constant velocity of 10 m/s in a straight line.
    What is the net force acting on the object?

    '
  choices:
  - id: a
    text: A constant net force in the direction of motion.
  - id: b
    text: A net force that increases over time.
  - id: c
    text: Zero net force.
  - id: d
    text: A constant net force opposing the motion.
  answer:
    choiceId: c
  explanation: 'By Newton''s First Law, if an object has a constant velocity, its
    acceleration is zero. Therefore, the net force must be zero.

    '
- id: q005
  type: numericResponse
  prompt: 'A 10 kg mass is hanging from a vertical string. What is the tension in
    the string in Newtons? (Use $g = 9.8$ m/s²).

    '
  answer:
    value: 98.0
    tolerance: 1.0
  explanation: 'The mass is not accelerating, so the net force is zero. $T - mg =
    0 \implies T = mg = 10 \times 9.8 = 98$ N.

    '
