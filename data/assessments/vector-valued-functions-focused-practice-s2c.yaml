- id: q001
  type: multipleChoice
  prompt: 'Differentiate $\mathbf r(t)=\langle t^2,\cos t,3t\rangle$.'
  choices:
  - id: a
    text: '$\langle2t,-\sin t,3\rangle$'
  - id: b
    text: '$\langle t, -\sin t,3t\rangle$'
    issueSignals:
    - id: parametric-derivative-error
  - id: c
    text: '$\langle2t,\sin t,3\rangle$'
    issueSignals:
    - id: parametric-derivative-error
  - id: d
    text: '$\langle t^2,\cos t,3t\rangle$'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: parametric-derivative-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Differentiate each component.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 2 → Parametric Curves.

    Why the other choices fail: Choice b, ''$\langle t, -\sin t,3t\rangle$'', does not give ''$\langle2t,-\sin t,3\rangle$''
    for ''Differentiate $\mathbf r(t)=\langle t^2,\cos t,3t\rangle$.''. It substitutes a different result, representation,
    or condition for the one the prompt specifies.

    Choice c, ''$\langle2t,\sin t,3\rangle$'', does not give ''$\langle2t,-\sin t,3\rangle$'' for ''Differentiate $\mathbf
    r(t)=\langle t^2,\cos t,3t\rangle$.''. It substitutes a different result, representation, or condition for the one the
    prompt specifies.

    Choice d, ''$\langle t^2,\cos t,3t\rangle$'', does not give ''$\langle2t,-\sin t,3\rangle$'' for ''Differentiate $\mathbf
    r(t)=\langle t^2,\cos t,3t\rangle$.''. It substitutes a different result, representation, or condition for the one the
    prompt specifies.'
