workedExamples:
  - id: polar-limacon-tangent-slope
    title: Find a polar tangent slope at a specified angle
    problem: |
      Find the slope of the tangent line to the polar curve

      $$
      r=1-5\cos\theta
      $$

      at

      $$
      \theta=\frac{\pi}{4}.
      $$

      ![The limacon r equals one minus five cosine theta, with the pi-over-four ray, negative-radius point, and tangent line marked](/assessments/calc2-parametric-polar/polar-tangent-limacon-1-minus-5cos.svg)
    steps:
      - id: polar-slope-parametric-bridge
        title: Treat the polar curve as a parametric curve
        instruction: |
          A polar equation already uses $\theta$ as a parameter. Its Cartesian coordinates are

          $$
          x(\theta)=r(\theta)\cos\theta,
          \qquad
          y(\theta)=r(\theta)\sin\theta.
          $$

          Therefore its tangent slope is the parametric ratio

          $$
          \frac{dy}{dx}
          =
          \frac{dy/d\theta}{dx/d\theta}.
          $$

          Differentiate $x=r\cos\theta$ and $y=r\sin\theta$ with the product rule.
        type: multipleChoice
        prompt: Which formula correctly gives the slope of a polar curve?
        choices:
          - id: correct
            text: '$\displaystyle \frac{r''\sin\theta+r\cos\theta}{r''\cos\theta-r\sin\theta}$'
          - id: reciprocal
            text: '$\displaystyle \frac{r''\cos\theta-r\sin\theta}{r''\sin\theta+r\cos\theta}$'
          - id: missing-product
            text: '$\displaystyle \frac{r''\sin\theta}{r''\cos\theta}$'
          - id: cartesian-only
            text: '$\displaystyle \frac{r''}{r}$'
        answer:
          choiceId: correct
        hint: Differentiate both products before forming $\frac{dy/d\theta}{dx/d\theta}$.
        explanation: |
          The product rule gives

          $$
          \frac{dy}{d\theta}=r'\sin\theta+r\cos\theta
          $$

          and

          $$
          \frac{dx}{d\theta}=r'\cos\theta-r\sin\theta.
          $$

          The first expression is the numerator and the second is the denominator.

      - id: polar-slope-differentiate-radius
        title: Differentiate the radius function
        instruction: |
          Differentiate

          $$
          r=1-5\cos\theta.
          $$

          The derivative of the constant is zero. Because

          $$
          \frac{d}{d\theta}\cos\theta=-\sin\theta,
          $$

          the two negative signs cancel.
        type: symbolicResponse
        prompt: Find $r'(\theta)$.
        answer:
          expectedLatex: '5\sin\theta'
          equivalenceMode: expression
          variables:
            - theta
          tolerance: 0.000001
        hint: Differentiate the cosine term and keep track of both negative signs.
        explanation: |
          $r'(\theta)=5\sin\theta$. A sign error here changes both the numerator and denominator later.

          Related topic: derivatives of trigonometric functions.

      - id: polar-slope-evaluate-radius
        title: Evaluate r and r prime at the target angle
        instruction: |
          At $\theta=\frac{\pi}{4}$,

          $$
          \sin\frac{\pi}{4}
          =
          \cos\frac{\pi}{4}
          =
          \frac{\sqrt2}{2}.
          $$

          Substitute this value into $r=1-5\cos\theta$ before using the slope formula.
        type: symbolicResponse
        prompt: What is $r\left(\frac{\pi}{4}\right)$?
        answer:
          expectedLatex: '1-\frac{5\sqrt2}{2}'
          equivalenceMode: expression
          variables: []
          tolerance: 0.000001
        hint: Substitute $\cos\frac{\pi}{4}=\frac{\sqrt2}{2}$ without rounding.
        explanation: |
          The exact radius is

          $$
          r\left(\frac{\pi}{4}\right)
          =
          1-\frac{5\sqrt2}{2}.
          $$

          Also,

          $$
          r'\left(\frac{\pi}{4}\right)
          =
          \frac{5\sqrt2}{2}.
          $$

          Keep both values exact so cancellation remains visible.

      - id: polar-slope-negative-radius
        title: Interpret the negative radius
        instruction: |
          Since $\frac{5\sqrt2}{2}>1$, the evaluated radius

          $$
          1-\frac{5\sqrt2}{2}
          $$

          is negative. In polar coordinates, a negative radius does not invalidate the point. It places the point $|r|$ units in the direction opposite the named angle.

          This is why the plotted point lies in the third quadrant even though $\theta=\frac{\pi}{4}$ points into the first quadrant.
        type: multipleChoice
        prompt: Which Cartesian point corresponds to this polar input?
        choices:
          - id: correct
            text: '$\displaystyle \left(\frac{\sqrt2-5}{2},\frac{\sqrt2-5}{2}\right)$'
          - id: positive
            text: '$\displaystyle \left(\frac{5-\sqrt2}{2},\frac{5-\sqrt2}{2}\right)$'
          - id: mixed
            text: '$\displaystyle \left(\frac{\sqrt2-5}{2},\frac{5-\sqrt2}{2}\right)$'
          - id: polar-pair
            text: '$\displaystyle \left(1-\frac{5\sqrt2}{2},\frac{\pi}{4}\right)$'
        answer:
          choiceId: correct
        hint: Compute both $x=r\cos\theta$ and $y=r\sin\theta$.
        explanation: |
          Because sine and cosine are equal at $\frac{\pi}{4}$,

          $$
          x=y=
          \left(1-\frac{5\sqrt2}{2}\right)\frac{\sqrt2}{2}
          =
          \frac{\sqrt2}{2}-\frac52
          =
          \frac{\sqrt2-5}{2}.
          $$

          Related topic: equivalent polar representations and negative radius.

      - id: polar-slope-numerator
        title: Simplify the vertical-rate numerator
        instruction: |
          Compute the numerator separately:

          $$
          N=r'\sin\theta+r\cos\theta.
          $$

          At $\theta=\frac{\pi}{4}$,

          $$
          N=
          \frac{5\sqrt2}{2}\frac{\sqrt2}{2}
          +
          \left(1-\frac{5\sqrt2}{2}\right)\frac{\sqrt2}{2}.
          $$

          The first product contributes $\frac52$, while the second contributes $\frac{\sqrt2}{2}-\frac52$.
        type: symbolicResponse
        prompt: Simplify the numerator $N$ exactly.
        answer:
          expectedLatex: '\frac{\sqrt2}{2}'
          equivalenceMode: expression
          variables: []
          tolerance: 0.000001
        hint: The positive and negative $\frac52$ terms cancel.
        explanation: |
          The cancellation leaves

          $$
          N=\frac{\sqrt2}{2}.
          $$

          Computing the numerator independently reduces the chance of mixing its signs with the denominator.

      - id: polar-slope-denominator
        title: Simplify the horizontal-rate denominator
        instruction: |
          Now compute

          $$
          D=r'\cos\theta-r\sin\theta.
          $$

          Substitution gives

          $$
          D=
          \frac{5\sqrt2}{2}\frac{\sqrt2}{2}
          -
          \left(1-\frac{5\sqrt2}{2}\right)\frac{\sqrt2}{2}.
          $$

          Be especially careful: the slope formula subtracts the entire $r\sin\theta$ product.
        type: symbolicResponse
        prompt: Simplify the denominator $D$ exactly.
        answer:
          expectedLatex: '5-\frac{\sqrt2}{2}'
          equivalenceMode: expression
          variables: []
          tolerance: 0.000001
        hint: Distribute the outside negative sign before combining terms.
        explanation: |
          The denominator becomes

          $$
          D=
          \frac52-\left(\frac{\sqrt2}{2}-\frac52\right)
          =
          5-\frac{\sqrt2}{2}.
          $$

          Equivalently,

          $$
          D=\frac{10-\sqrt2}{2}.
          $$

      - id: polar-slope-denominator-check
        title: Check that the tangent has a finite slope
        instruction: |
          Before dividing, inspect the denominator:

          $$
          D=5-\frac{\sqrt2}{2}>0.
          $$

          Therefore $\frac{dx}{d\theta}\neq0$ at this point. The curve has a finite tangent slope here, not a vertical tangent or a $0/0$ singularity.
        type: multipleChoice
        prompt: What does the nonzero denominator tell us?
        choices:
          - id: finite
            text: The slope ratio is defined and finite.
          - id: vertical
            text: The tangent is vertical.
          - id: horizontal
            text: The tangent must be horizontal.
          - id: pole
            text: The curve must be at the pole.
        answer:
          choiceId: finite
        hint: A vertical tangent would require $dx/d\theta=0$ while $dy/d\theta\neq0$.
        explanation: |
          The numerator and denominator are both nonzero, so the tangent is neither horizontal nor vertical.

          Related topic: horizontal, vertical, and singular polar tangents.

      - id: polar-slope-final-value
        title: Divide and rationalize
        instruction: |
          Form the slope:

          $$
          m=
          \frac{\frac{\sqrt2}{2}}
               {5-\frac{\sqrt2}{2}}
          =
          \frac{\sqrt2}{10-\sqrt2}.
          $$

          Rationalize by multiplying numerator and denominator by $10+\sqrt2$.
        type: symbolicResponse
        prompt: Give the final exact slope.
        answer:
          expectedLatex: '\frac{1+5\sqrt2}{49}'
          equivalenceMode: expression
          variables: []
          tolerance: 0.000001
        hint: $(10-\sqrt2)(10+\sqrt2)=98$.
        explanation: |
          Rationalizing gives

          $$
          \frac{\sqrt2(10+\sqrt2)}{98}
          =
          \frac{10\sqrt2+2}{98}
          =
          \frac{1+5\sqrt2}{49}.
          $$

          The decimal value is approximately $0.1647$, which agrees with the shallow positive tangent shown in the graph.

      - id: polar-slope-tangent-line
        title: Extend the result to the tangent line
        instruction: |
          The problem asks only for slope, but the point and slope together determine the complete tangent line.

          Use

          $$
          \left(x_0,y_0\right)
          =
          \left(
          \frac{\sqrt2-5}{2},
          \frac{\sqrt2-5}{2}
          \right)
          $$

          and

          $$
          m=\frac{1+5\sqrt2}{49}.
          $$
        type: freeResponse
        prompt: Write the tangent line in point-slope form and compare its orientation with the diagram.
        answer:
          expected: |
            $$
            y-\frac{\sqrt2-5}{2}
            =
            \frac{1+5\sqrt2}{49}
            \left(
            x-\frac{\sqrt2-5}{2}
            \right).
            $$

            Its slope is positive but small, so the line rises gently from left to right through the third-quadrant evaluation point.
          gradingMode: selfCheck
          keyPoints:
            - Uses the Cartesian point produced by the negative radius.
            - Uses the exact slope $\frac{1+5\sqrt2}{49}$.
            - Writes a geometrically consistent shallow positive tangent.
        hint: Use $y-y_0=m(x-x_0)$ without expanding.
        explanation: |
          Point-slope form preserves the exact point and makes the connection between the algebra and diagram easiest to inspect.

      - id: polar-slope-synthesis
        title: Consolidate the procedure
        instruction: |
          The reliable order for a polar tangent-slope problem is:

          1. Differentiate $r$.
          2. Evaluate $r$, $r'$, $\sin\theta$, and $\cos\theta$.
          3. Interpret the point, especially if $r<0$.
          4. Simplify $dy/d\theta$ and $dx/d\theta$ separately.
          5. Check the denominator.
          6. Divide and simplify.

          Keeping these stages separate prevents the most common product-rule, sign, and negative-radius mistakes.
        type: selectAll
        prompt: Which checks should be made before accepting a polar tangent slope?
        choices:
          - id: derivative
            text: Differentiate $r(\theta)$ correctly.
          - id: denominator
            text: Check whether $dx/d\theta$ is zero.
          - id: radius
            text: Interpret a negative value of $r$ geometrically.
          - id: round-first
            text: Round all trigonometric values before substitution.
        answer:
          choiceIds:
            - derivative
            - denominator
            - radius
        hint: Preserve exact values until the final result.
        explanation: |
          Correct differentiation, denominator classification, and radius interpretation are all structural checks. Early decimal rounding obscures exact cancellation and should be avoided.

          Related topics: polar-to-Cartesian conversion, parametric differentiation, and tangent classification.
