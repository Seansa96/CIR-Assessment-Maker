id: physics2-ch11-torque-worked-example
title: Torque on a Current Loop
assessmentType: workedExample
categoryId: physics-2
topicId: physics2-magnetic-forces-fields
workedExamples:
- id: we2
  title: Maximum Torque
  prompt: A rectangular coil with dimensions $0.1\text{ m} \times 0.2\text{ m}$ has
    50 turns and carries a current of $2.0\text{ A}$. It is placed in a uniform magnetic
    field of $0.5\text{ T}$. What is the maximum torque it can experience?
  steps:
  - id: s1
    prompt: Calculate magnetic moment and torque.
    explanation: 'Solution:

      1) Area $A = 0.1 \times 0.2 = 0.02\text{ m}^2$.

      2) Magnetic moment magnitude $\mu = N I A = (50)(2.0)(0.02) = 2.0\text{ A m}^2$.

      3) Max torque $\tau_{max} = \mu B = (2.0)(0.5) = 1.0\text{ N m}$.


      Why it works:

      Torque is maximized when the magnetic moment vector is perpendicular to the
      magnetic field (the plane of the coil is parallel to the field).'
