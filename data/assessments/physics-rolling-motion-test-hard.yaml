questions:
- id: q1
  type: numericResponse
  prompt: A hoop ($I=MR^2$) rolls without slipping down a slope. If it starts from
    rest and drops a vertical height of $2.0 \text{ m}$, what is its final translational
    speed? ($g = 9.8 \text{ m/s}^2$)
  answer:
    value: 4.43
    tolerance: 0.1
  explanation: $mgh = K_{tot} = \frac{1}{2}mv^2 + \frac{1}{2}(mr^2)(v/r)^2 = mv^2$.
    $v = \sqrt{gh} = \sqrt{19.6} \approx 4.427 \text{ m/s}$.
