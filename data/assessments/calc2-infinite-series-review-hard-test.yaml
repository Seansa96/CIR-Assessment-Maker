schemaVersion: 1
id: calc2-infinite-series-review-hard-test
title: Infinite Series Comprehensive Review Hard Test
assessmentType: test
categoryId: calculus-2
topicId: infinite-series-review
skills:
- Analyze sequences and classify numerical series with efficient tests
- Distinguish absolute, conditional, and endpoint convergence
- Use Taylor coefficients and remainder estimates in synthesis problems
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - calculus-2
  - infinite-series-review
  - hard
  - comprehensive-series
modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - evaluate-sequence-limits
  prompt: |
    Evaluate $\displaystyle\lim_{n\to\infty}\frac{3n^2-n+4}{5n^2+7}$.
  choices:
  - id: a
    text: $3/5$
  - id: b
    text: $1$
  - id: c
    text: $0$
  - id: d
    text: |-
      $\infty$
  answer:
    choiceId: a
  explanation: Divide numerator and denominator by $n^2$ and take the ratio of the leading coefficients.
- id: q002
  type: multipleChoice
  skills:
  - apply-the-term-test
  prompt: |
    What happens to $\displaystyle\sum_{n=1}^{\infty}(-1)^n n/(n+1)$?
  choices:
  - id: a
    text: It diverges because its terms do not approach zero.
  - id: b
    text: It converges conditionally by the alternating-series test.
  - id: c
    text: It converges absolutely.
  - id: d
    text: It is geometric with ratio minus one.
  answer:
    choiceId: a
  explanation: The term magnitude approaches one, so the necessary condition for series convergence fails.
- id: q003
  type: multipleChoice
  skills:
  - sum-geometric-series
  prompt: |
    Evaluate $\displaystyle\sum_{n=3}^{\infty}5(2/3)^n$.
  choices:
  - id: a
    text: $40/9$
  - id: b
    text: $5$
  - id: c
    text: $10/9$
  - id: d
    text: $40/27$
  answer:
    choiceId: a
  explanation: The first term is $40/27$, and division by $1-2/3$ gives $40/9$.
- id: q004
  type: multipleChoice
  skills:
  - sum-telescoping-series
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac{1}{n(n+1)}$.
  choices:
  - id: a
    text: $1$
  - id: b
    text: $1/2$
  - id: c
    text: |-
      $\pi^2/6$
  - id: d
    text: It diverges
  answer:
    choiceId: a
  explanation: Write the term as $1/n-1/(n+1)$; the finite partial sum is $1-1/(N+1)$.
- id: q005
  type: multipleChoice
  skills:
  - apply-limit-comparison
  prompt: |
    Which conclusion holds for
    $\displaystyle\sum_{n=1}^{\infty}\frac{4n+1}{n^3+2}$?
  choices:
  - id: a
    text: It converges by limit comparison with $1/n^2$.
  - id: b
    text: It diverges by comparison with $1/n$.
  - id: c
    text: It converges conditionally.
  - id: d
    text: The term test proves convergence.
  answer:
    choiceId: a
  explanation: The term is asymptotic to $4/n^2$, giving a positive finite comparison limit with a convergent
    p-series.
- id: q006
  type: multipleChoice
  skills:
  - apply-ratio-tests-to-factorials
  prompt: |
    What does the ratio test show for
    $\displaystyle\sum_{n=1}^{\infty}n!/5^n$?
  choices:
  - id: a
    text: It diverges because the ratio eventually exceeds one.
  - id: b
    text: It converges with ratio one-fifth.
  - id: c
    text: It converges conditionally.
  - id: d
    text: The ratio limit is zero.
  answer:
    choiceId: a
  explanation: The ratio of successive terms is $(n+1)/5$, which grows without bound.
- id: q007
  type: multipleChoice
  skills:
  - apply-root-tests
  prompt: |
    Classify $\displaystyle\sum_{n=1}^{\infty}n^4(3/4)^n$.
  choices:
  - id: a
    text: It converges absolutely by the root test.
  - id: b
    text: It diverges because $n^4$ grows.
  - id: c
    text: It converges conditionally.
  - id: d
    text: The root-test limit is one.
  answer:
    choiceId: a
  explanation: The nth root is $n^{4/n}(3/4)$, which tends to three-fourths.
- id: q008
  type: multipleChoice
  skills:
  - classify-absolute-and-conditional-convergence
  prompt: |
    How does $\displaystyle\sum_{n=1}^{\infty}(-1)^{n+1}/\sqrt n$
    converge?
  choices:
  - id: a
    text: Conditionally
  - id: b
    text: Absolutely
  - id: c
    text: It diverges by the term test
  - id: d
    text: Geometrically
  answer:
    choiceId: a
  explanation: The alternating magnitudes decrease to zero, but the absolute p-series has exponent one-half
    and diverges.
- id: q009
  type: multipleChoice
  skills:
  - find-power-series-intervals
  prompt: |
    Find the interval of convergence of
    $\displaystyle\sum_{n=1}^{\infty}(x-2)^n/n$.
  choices:
  - id: a
    text: $[1,3)$
  - id: b
    text: $(1,3]$
  - id: c
    text: $(1,3)$
  - id: d
    text: $[1,3]$
  answer:
    choiceId: a
  explanation: The radius is one; x equals one gives the alternating harmonic series, while x equals three
    gives the harmonic series.
- id: q010
  type: multipleChoice
  skills:
  - extract-taylor-coefficients
  prompt: |
    What is the coefficient of $x^8$ in $\log(1+x^2)$?
  choices:
  - id: a
    text: $-1/4$
  - id: b
    text: $1/4$
  - id: c
    text: $-1/8$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: The fourth logarithm term is $-(x^2)^4/4=-x^8/4$.
- id: q011
  type: multipleChoice
  skills:
  - bound-alternating-approximation-errors
  prompt: |
    The first six terms of
    $\sum_{n=1}^{\infty}(-1)^{n+1}/n^2$ are used. Which error bound
    is guaranteed?
  choices:
  - id: a
    text: $1/49$
  - id: b
    text: $1/36$
  - id: c
    text: $1/7$
  - id: d
    text: $1/64$
  answer:
    choiceId: a
  explanation: The first omitted term has n equals seven and magnitude one over forty-nine.
- id: q012
  type: multipleChoice
  skills:
  - identify-inconclusive-convergence-tests
  prompt: |
    Applying the ratio test to $\sum1/n^2$ gives a ratio limit of one.
    What conclusion follows from that test alone?
  choices:
  - id: a
    text: The ratio test is inconclusive.
  - id: b
    text: The series diverges.
  - id: c
    text: The series converges conditionally.
  - id: d
    text: The sum equals one.
  answer:
    choiceId: a
  explanation: A ratio limit equal to one lies exactly at the test's undecided boundary, even though another
    test proves this series converges.
- id: q013
  type: multipleChoice
  skills:
  - use-asymptotic-equivalence
  prompt: |
    Classify $\displaystyle\sum_{n=2}^{\infty}\log(1+1/n^2)$.
  choices:
  - id: a
    text: It converges because the terms are asymptotic to $1/n^2$.
  - id: b
    text: It diverges because logarithms grow.
  - id: c
    text: It converges conditionally.
  - id: d
    text: It diverges by the term test.
  answer:
    choiceId: a
  explanation: |-
    Since $\log(1+u)\sim u$ as u tends to zero, limit comparison with the reciprocal-square series applies.
- id: q014
  type: multipleChoice
  skills:
  - understand-rearrangements
  prompt: |
    A series converges absolutely to S. What happens under any
    rearrangement of its terms?
  choices:
  - id: a
    text: It still converges to S.
  - id: b
    text: It may converge to any chosen value.
  - id: c
    text: It must diverge.
  - id: d
    text: Its sum changes sign.
  answer:
    choiceId: a
  explanation: Absolute convergence permits reordering because the total absolute tail can be made arbitrarily
    small independent of order.
- id: q015
  type: multipleChoice
  skills:
  - select-efficient-convergence-tests
  prompt: |
    Which test is most direct for
    $\displaystyle\sum_{n=1}^{\infty}\frac{3^n(n!)^2}{(2n)!}$?
  choices:
  - id: a
    text: The ratio test
  - id: b
    text: The alternating-series test
  - id: c
    text: The telescoping test
  - id: d
    text: The integral test on the original formula
  answer:
    choiceId: a
  explanation: Successive factorials cancel cleanly in a ratio, revealing a limiting factor without estimating
    the factorials separately.
attemptQuestionCount: 15
