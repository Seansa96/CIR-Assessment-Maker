schemaVersion: 1
id: chemistry-matter-energy-atomic-structure
title: Matter, Energy, and Atomic Structure
assessmentType: quiz
categoryId: chemistry
subcategoryId: chemistry-matter
subcategoryIds:
  - chemistry-matter
  - chemistry-atomic-theory
modeDefault: practice
randomizeQuestions: true
questionTimerSeconds:
assessmentTimerSeconds:
questions:
  - id: q001
    type: multipleChoice
    prompt: "Matter is anything that:"
    choices:
      - id: a
        text: "Has mass and occupies space"
      - id: b
        text: "Has no volume"
      - id: c
        text: "Is always visible"
      - id: d
        text: "Is only energy"
    answer: { choiceId: a }
    explanation: |
      Matter includes gases, liquids, solids, and microscopic particles.

      Related topic: Definition of Matter
  - id: q002
    type: multipleChoice
    prompt: "Which is a pure substance?"
    choices:
      - id: a
        text: "Element"
      - id: b
        text: "Air"
      - id: c
        text: "Salt water"
      - id: d
        text: "Soil"
    answer: { choiceId: a }
    explanation: |
      Elements and compounds are pure substances; mixtures contain variable combinations.

      Related topic: Pure Substances
  - id: q003
    type: multipleChoice
    prompt: "Which is a mixture?"
    choices:
      - id: a
        text: "Air"
      - id: b
        text: "Oxygen element"
      - id: c
        text: "Pure water compound"
      - id: d
        text: "Gold element"
    answer: { choiceId: a }
    explanation: |
      Air is a mixture of gases such as nitrogen, oxygen, argon, and carbon dioxide.

      Related topic: Mixtures
  - id: q004
    type: multipleChoice
    prompt: "A homogeneous mixture is also called a:"
    choices:
      - id: a
        text: "Solution"
      - id: b
        text: "Compound"
      - id: c
        text: "Element"
      - id: d
        text: "Nucleus"
    answer: { choiceId: a }
    explanation: |
      Homogeneous mixtures have uniform composition throughout.

      Related topic: Homogeneous Mixtures
  - id: q005
    type: multipleChoice
    prompt: "Which is a physical property?"
    choices:
      - id: a
        text: "Density"
      - id: b
        text: "Flammability"
      - id: c
        text: "Reactivity with acid"
      - id: d
        text: "Ability to rust"
    answer: { choiceId: a }
    explanation: |
      Density can be observed without changing the substance's identity.

      Related topic: Physical Properties
  - id: q006
    type: multipleChoice
    prompt: "Which is a chemical property?"
    choices:
      - id: a
        text: "Flammability"
      - id: b
        text: "Melting point"
      - id: c
        text: "Color"
      - id: d
        text: "Density"
    answer: { choiceId: a }
    explanation: |
      Flammability describes the ability to undergo combustion, a chemical change.

      Related topic: Chemical Properties
  - id: q007
    type: multipleChoice
    prompt: "Which is a physical change?"
    choices:
      - id: a
        text: "Ice melting"
      - id: b
        text: "Iron rusting"
      - id: c
        text: "Wood burning"
      - id: d
        text: "Milk souring"
    answer: { choiceId: a }
    explanation: |
      Melting changes state but not chemical identity.

      Related topic: Physical Changes
  - id: q008
    type: multipleChoice
    prompt: "Which is a chemical change?"
    choices:
      - id: a
        text: "Paper burning"
      - id: b
        text: "Water freezing"
      - id: c
        text: "Glass breaking"
      - id: d
        text: "Sugar dissolving"
    answer: { choiceId: a }
    explanation: |
      Burning forms new substances.

      Related topic: Chemical Changes
  - id: q009
    type: multipleChoice
    prompt: "Energy is best described as:"
    choices:
      - id: a
        text: "The capacity to do work or transfer heat"
      - id: b
        text: "Matter with mass"
      - id: c
        text: "Only temperature"
      - id: d
        text: "Only light"
    answer: { choiceId: a }
    explanation: |
      Energy appears in many forms, including thermal, chemical, and kinetic energy.

      Related topic: Energy
  - id: q010
    type: multipleChoice
    prompt: "Kinetic energy is energy of:"
    choices:
      - id: a
        text: "Motion"
      - id: b
        text: "Position only"
      - id: c
        text: "Chemical bonds only"
      - id: d
        text: "Mass only"
    answer: { choiceId: a }
    explanation: |
      Moving particles and objects have kinetic energy.

      Related topic: Kinetic Energy
  - id: q011
    type: multipleChoice
    prompt: "Potential energy is energy:"
    choices:
      - id: a
        text: "Stored by position or arrangement"
      - id: b
        text: "Only from motion"
      - id: c
        text: "That cannot change"
      - id: d
        text: "Only in gases"
    answer: { choiceId: a }
    explanation: |
      Chemical energy is a form of potential energy stored in bonds and arrangements.

      Related topic: Potential Energy
  - id: q012
    type: multipleChoice
    prompt: "Which subatomic particle has a positive charge?"
    choices:
      - id: a
        text: "Proton"
      - id: b
        text: "Electron"
      - id: c
        text: "Neutron"
      - id: d
        text: "Photon"
    answer: { choiceId: a }
    explanation: |
      Protons are positive and are located in the nucleus.

      Related topic: Protons
  - id: q013
    type: multipleChoice
    prompt: "Which subatomic particle has a negative charge?"
    choices:
      - id: a
        text: "Electron"
      - id: b
        text: "Proton"
      - id: c
        text: "Neutron"
      - id: d
        text: "Nucleus"
    answer: { choiceId: a }
    explanation: |
      Electrons are negative and occupy regions outside the nucleus.

      Related topic: Electrons
  - id: q014
    type: multipleChoice
    prompt: "Which subatomic particle is neutral?"
    choices:
      - id: a
        text: "Neutron"
      - id: b
        text: "Electron"
      - id: c
        text: "Proton"
      - id: d
        text: "Ion"
    answer: { choiceId: a }
    explanation: |
      Neutrons have no electric charge.

      Related topic: Neutrons
  - id: q015
    type: multipleChoice
    prompt: "The atomic number equals the number of:"
    choices:
      - id: a
        text: "Protons"
      - id: b
        text: "Neutrons"
      - id: c
        text: "Protons plus neutrons"
      - id: d
        text: "Electrons plus neutrons"
    answer: { choiceId: a }
    explanation: |
      Atomic number identifies the element.

      Related topic: Atomic Number
  - id: q016
    type: multipleChoice
    prompt: "Mass number equals:"
    choices:
      - id: a
        text: "Protons plus neutrons"
      - id: b
        text: "Protons only"
      - id: c
        text: "Electrons only"
      - id: d
        text: "Neutrons minus protons"
    answer: { choiceId: a }
    explanation: |
      Most atomic mass is in protons and neutrons.

      Related topic: Mass Number
  - id: q017
    type: multipleChoice
    prompt: "Isotopes of an element have different numbers of:"
    choices:
      - id: a
        text: "Neutrons"
      - id: b
        text: "Protons"
      - id: c
        text: "Atomic numbers"
      - id: d
        text: "Element symbols"
    answer: { choiceId: a }
    explanation: |
      Isotopes share the same number of protons but differ in neutrons.

      Related topic: Isotopes
  - id: q018
    type: multipleChoice
    prompt: "A neutral atom has equal numbers of:"
    choices:
      - id: a
        text: "Protons and electrons"
      - id: b
        text: "Protons and neutrons"
      - id: c
        text: "Electrons and neutrons"
      - id: d
        text: "Atoms and molecules"
    answer: { choiceId: a }
    explanation: |
      Equal positive and negative charges produce no net charge.

      Related topic: Neutral Atoms
  - id: q019
    type: multipleChoice
    prompt: "An ion forms when an atom gains or loses:"
    choices:
      - id: a
        text: "Electrons"
      - id: b
        text: "Protons"
      - id: c
        text: "Neutrons"
      - id: d
        text: "Mass number"
    answer: { choiceId: a }
    explanation: |
      Changing electron number changes the net charge without changing the element identity.

      Related topic: Ions
  - id: q020
    type: multipleChoice
    prompt: "Where are protons and neutrons found?"
    choices:
      - id: a
        text: "In the nucleus"
      - id: b
        text: "Only in electron clouds"
      - id: c
        text: "Outside the atom"
      - id: d
        text: "In chemical bonds only"
    answer: { choiceId: a }
    explanation: |
      The nucleus contains protons and neutrons and accounts for most atomic mass.

      Related topic: Atomic Nucleus


