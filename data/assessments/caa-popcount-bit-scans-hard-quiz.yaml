schemaVersion: 1
id: caa-popcount-bit-scans-hard-quiz
title: Population Counts and Bit Scans Hard Quiz
assessmentType: quiz
categoryId: computer-arithmetic-algorithms
subcategoryIds:
- caa-popcount-bit-scans
modeDefault: scored
randomizeQuestions: true
attemptQuestionCount: 10
navigation:
  learningGoal: evaluate
  activityType: formalTest
