lesson:
  introduction: Parametric equations allow us to define both x and y as functions
    of a third variable, t, usually representing time. This is incredibly useful for
    describing curves that aren't functions of x, such as loops or paths of moving
    objects.
  sections:
  - id: intro-parametric
    title: What is a Parametric Curve?
    content: 'Consider the parametric curve defined by $x=t-\sin(t)$, $y=1-\cos(t)$.
      This represents a point on a rolling wheel, also known as a cycloid.


      ![Parametric Curve Demo](/assessments/calc2-parametric-polar/parametric_curve_demo.svg)


      As $t$ increases, the curve traces arches.'
    check:
      id: intro-parametric-check
      type: multipleChoice
      prompt: As $t$ increases from $0$ to $2\pi$, how many full arches does the curve
        complete?
      choices:
      - id: a
        text: Half an arch
      - id: b
        text: One full arch
      - id: c
        text: Two full arches
      answer:
        choiceId: b
      explanation: At $t=0$, $(x,y)=(0,0)$. At $t=2\pi$, $(x,y)=(2\pi, 0)$. In between,
        $y>0$. This traces exactly one full arch of the cycloid.
  - id: why-parametric
    title: Why Parametric Equations?
    content: "Cartesian equations of the form $y=f(x)$ are limited to passing the\
      \ Vertical Line Test. But what if a particle moves in a circle or a complex\
      \ loop? By defining $x(t)$ and $y(t)$ separately, we free the curve from the\
      \ Vertical Line Test. \n\nFurthermore, the parameter $t$ provides **direction**\
      \ and **speed**, capturing *how* the path is traced over time."
    check:
      id: why-parametric-check
      type: multipleChoice
      prompt: What key information does a parametric representation $x(t), y(t)$ provide
        that a standard Cartesian equation $y=f(x)$ typically lacks?
      choices:
      - id: a
        text: The maximum y-value
      - id: b
        text: The orientation (direction) of the curve
      - id: c
        text: The x-intercepts
      answer:
        choiceId: b
      explanation: Parametric equations have an inherent directionality based on increasing
        $t$.
  - id: eliminating-parameter
    title: 'Pitfall: Eliminating the Parameter'
    content: "A common way to understand a parametric curve is to eliminate $t$ to\
      \ find the Cartesian equation. However, you must be careful with **domains**.\
      \ \n\nFor example, if $x = t^2$ and $y = t^4$, you might say $y = x^2$. But\
      \ since $x = t^2$, $x$ can never be negative! The true curve is only the right\
      \ half of the parabola: $y = x^2$ for $x \\ge 0$."
    check:
      id: eliminating-parameter-check
      type: multipleChoice
      prompt: If $x = e^t$ and $y = e^{2t}$, what is the Cartesian equation and its
        domain restriction?
      choices:
      - id: a
        text: $y = x^2$ for all $x$
      - id: b
        text: $y = x^2$ for $x > 0$
      - id: c
        text: $y = 2x$ for $x > 0$
      answer:
        choiceId: b
      explanation: Since $x = e^t$, $x$ must be strictly greater than $0$. $y = e^{2t}
        = (e^t)^2 = x^2$.
