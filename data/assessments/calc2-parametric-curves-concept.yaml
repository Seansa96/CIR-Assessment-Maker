lesson:
  introduction: Parametric equations allow us to define both x and y as functions
    of a third variable, t, usually representing time. This is incredibly useful for
    describing curves that aren't functions of x, such as loops or paths of moving
    objects.
  sections:
  - id: intro-parametric
    title: What is a Parametric Curve?
    content: |-
      Consider the parametric curve defined by $x=t-\sin(t)$, $y=1-\cos(t)$. This represents a point on a rolling wheel, also known as a cycloid.

      ![Parametric Curve Demo](/assessments/calc2-parametric-polar/parametric_curve_demo.svg)

      As $t$ increases, the curve traces arches.
    check:
      id: intro-parametric-check
      type: multipleChoice
      prompt: |-
        As $t$ increases from $0$ to $2\pi$, how many full arches does the curve complete?
      choices:
      - id: a
        text: Half an arch
      - id: b
        text: One full arch
      - id: c
        text: Two full arches
      answer:
        choiceId: b
      explanation: |-
        At $t=0$, $(x,y)=(0,0)$. At $t=2\pi$, $(x,y)=(2\pi, 0)$. In between, $y>0$. This traces exactly one full arch of the cycloid.
