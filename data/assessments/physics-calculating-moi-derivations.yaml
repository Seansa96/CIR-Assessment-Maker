workedExamples:
- id: we-parallel-axis
  title: 'Proof: Parallel Axis Theorem'
  problem: Derive the Parallel Axis Theorem.
  steps:
  - id: we-parallel-axis-step-1
    title: Set up coordinates
    instruction: Define the origin and coordinates.
    prompt: How do we define the coordinates?
    type: freeResponse
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Set origin at center of mass.
    explanation: 'Solution: Place the center-of-mass axis at the origin and locate the parallel axis a distance $d$ away.\n\nWhy it works: This coordinate choice makes the center-of-mass cross term vanish in the derivation.'

- id: parallel-axis-we002
  title: Apply the Parallel-Axis Theorem
  problem: 'A 4.0 kg solid disk of radius 0.50 m rotates about an axis parallel to its central axis and 0.30 m away. Find its moment of inertia about the shifted axis.'
  steps:
  - id: pad2
    title: Find central-axis inertia
    instruction: Use $I_{cm}=\tfrac12MR^2$.
    prompt: 'What is $I_{cm}$ in kg m$^2$?'
    type: numericResponse
    answer: { value: 0.5, tolerance: 0.01 }
    explanation: 'Solution: $I_{cm}=\tfrac12(4.0)(0.50)^2=0.50\ \mathrm{kg\,m^2}$.\n\nWhy it works: A solid disk has central inertia $\tfrac12MR^2$.'
  - id: pad3
    title: Shift the axis
    instruction: Apply $I=I_{cm}+Md^2$.
    prompt: 'What is the shifted-axis inertia in kg m$^2$?'
    type: numericResponse
    answer: { value: 0.86, tolerance: 0.01 }
    explanation: 'Solution: $I=0.50+4.0(0.30)^2=0.86\ \mathrm{kg\,m^2}$.\n\nWhy it works: The parallel-axis theorem adds the mass-distance-squared term.'
