questions:
- id: q001
  type: numericResponse
  difficultyDimensions:
  - calculation-complexity
  - formula-application
  prompt: An ideal solenoid has $500$ turns per meter and carries a current of $3.0\text{ A}$. What is
    the magnitude of the magnetic field inside the solenoid (in milliTeslas)? (Use $\mu_0 = 4\pi \times
    10^{-7}\text{ T m/A}$ and $\pi \approx 3.1416$).
  answer:
    tolerance: 0.05
    value: 1.88
  explanation: 'Solution:

    1) Use the formula for an ideal solenoid: $B = \mu_0 n I$.

    2) Substitute: $B = (4\pi \times 10^{-7})(500)(3.0)$.

    3) Calculate: $B = (4\pi \times 10^{-7})(1500) = 6000\pi \times 10^{-7} \approx 1.885 \times 10^{-3}\text{
    T}$.

    4) Convert to mT: $B \approx 1.88\text{ mT}$.


    Why it works:

    Inside a long solenoid, the field is uniform and proportional to the current and the number of turns
    per unit length.'
