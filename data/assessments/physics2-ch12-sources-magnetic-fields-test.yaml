questions:
- id: q001
  type: freeResponse
  skills:
  - physics2-ch12-modeling
  prompt: A Sources of Magnetic Fields situation emphasizes biot-savart law. Define the system and sign convention,
    state when $\\oint \\mathbf{B}\\cdot d\\mathbf{l}=\\mu_0 I_{enc}$ applies, and construct a written solution
    that includes the relation, units, assumptions, and a limiting-case check.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - defines the system and sign convention
    - states or applies $\\oint \\mathbf{B}\\cdot d\\mathbf{l}=\\mu_0 I_{enc}$ with appropriate assumptions
    - shows units and an intermediate relation
    - checks direction or a limiting case
  explanation: 'Solution: Start from a defined system, write the governing relation symbolically, then connect the
    result to units and a physical limit.


    Why it works: The Sources of Magnetic Fields model of fields generated by currents is reliable only when its
    relation, conditions, and interpretation are kept together.'
  difficultyDimensions: &id001
  - modelOrDerivation
  - proofJustification
  - representationTransfer
  subjectDifficultyTags:
  - physics2-ch12-modeling
  difficultyEvidence: Requires a multi-step written model, transfer from a verbal situation to a governing relation,
    and justification of conditions and limiting behavior.
  prerequisiteObjectiveIds:
  - physics2-ch12-modeling
