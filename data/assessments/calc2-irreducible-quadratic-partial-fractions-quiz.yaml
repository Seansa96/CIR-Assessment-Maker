questions:
  - id: q001
    type: symbolicResponse
    prompt: |
      Evaluate.

      $$
      \int \frac{1}{x(x^2+1)}\,dx
      $$
    answer:
      expectedLatex: '\ln\left|x\right|-\frac{1}{2}\ln\left(x^2+1\right)+C'
      equivalenceMode: derivative
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      The denominator contains the linear factor $x$ and the irreducible quadratic
      $x^2+1$. Use

      $$
      \frac{1}{x(x^2+1)}
      =
      \frac{A}{x}+\frac{Bx+C}{x^2+1}.
      $$

      Clearing denominators gives

      $$
      1=A(x^2+1)+x(Bx+C),
      $$

      so $A=1$, $B=-1$, and $C=0$. Therefore

      $$
      \frac{1}{x(x^2+1)}
      =
      \frac{1}{x}-\frac{x}{x^2+1}.
      $$

      Integrate the first term as a logarithm and use
      $u=x^2+1$ for the second.

      **Technique order:** identify factor types, decompose, solve coefficients,
      then use two logarithmic patterns.

      **Related topic:** linear plus irreducible-quadratic partial fractions.

  - id: q002
    type: symbolicResponse
    prompt: |
      Evaluate.

      $$
      \int \frac{2x+3}{(x-1)(x^2+4)}\,dx
      $$
    answer:
      expectedLatex: '\ln\left|x-1\right|-\frac{1}{2}\ln\left(x^2+4\right)+\frac{1}{2}\arctan\left(\frac{x}{2}\right)+C'
      equivalenceMode: derivative
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      The correct template is

      $$
      \frac{2x+3}{(x-1)(x^2+4)}
      =
      \frac{A}{x-1}+\frac{Bx+C}{x^2+4}.
      $$

      Clearing denominators and solving gives $A=1$, $B=-1$, and $C=1$:

      $$
      \frac{2x+3}{(x-1)(x^2+4)}
      =
      \frac{1}{x-1}+\frac{-x+1}{x^2+4}.
      $$

      The linear-factor term produces $\ln|x-1|$. Split the quadratic numerator:
      $-x$ is a constant multiple of the denominator derivative and produces
      $-\frac{1}{2}\ln(x^2+4)$; the remaining $1$ produces
      $\frac{1}{2}\arctan\left(\frac{x}{2}\right)$.

      **Technique order:** partial fractions, numerator splitting, logarithm, then
      arctangent.

      **Related topic:** mixed linear and irreducible-quadratic factors.

  - id: q003
    type: symbolicResponse
    prompt: |
      Evaluate.

      $$
      \int \frac{x^3+x+1}{(x^2+1)^2}\,dx
      $$
    answer:
      expectedLatex: '\frac{1}{2}\ln\left(x^2+1\right)+\frac{x}{2(x^2+1)}+\frac{1}{2}\arctan(x)+C'
      equivalenceMode: derivative
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      The denominator is a repeated irreducible quadratic. Include one linear
      numerator for every power:

      $$
      \frac{x^3+x+1}{(x^2+1)^2}
      =
      \frac{Ax+B}{x^2+1}
      +\frac{Cx+D}{(x^2+1)^2}.
      $$

      Solving gives $A=1$, $B=0$, $C=0$, and $D=1$, so

      $$
      \frac{x^3+x+1}{(x^2+1)^2}
      =
      \frac{x}{x^2+1}+\frac{1}{(x^2+1)^2}.
      $$

      The first term gives $\frac{1}{2}\ln(x^2+1)$. For the second, use the
      standard reduction result

      $$
      \int\frac{dx}{(x^2+1)^2}
      =
      \frac{x}{2(x^2+1)}+\frac{1}{2}\arctan x+C.
      $$

      **Technique order:** repeated-quadratic decomposition, logarithmic
      substitution, then the squared-quadratic reduction formula.

      **Related topic:** repeated irreducible quadratic factors.

  - id: q004
    type: symbolicResponse
    prompt: |
      Evaluate.

      $$
      \int \frac{7x^2-15x+12}{(x-2)^2(x^2+1)}\,dx
      $$
    answer:
      expectedLatex: '\ln\left|x-2\right|-\frac{2}{x-2}-\frac{1}{2}\ln\left(x^2+1\right)+3\arctan(x)+C'
      equivalenceMode: derivative
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      This denominator combines a repeated linear factor with an irreducible
      quadratic, so the complete template is

      $$
      \frac{A}{x-2}
      +\frac{B}{(x-2)^2}
      +\frac{Cx+D}{x^2+1}.
      $$

      Solving the coefficient identity gives

      $$
      A=1,\qquad B=2,\qquad C=-1,\qquad D=3.
      $$

      Thus the integrand becomes

      $$
      \frac{1}{x-2}
      +\frac{2}{(x-2)^2}
      +\frac{-x+3}{x^2+1}.
      $$

      Integrate the repeated-linear term with the power rule, the $-x$ term by
      logarithmic substitution, and the constant-over-quadratic term by
      arctangent.

      **Technique order:** repeated-linear and irreducible-quadratic partial
      fractions, power rule, logarithm, arctangent.

      **Related topic:** mixed repeated factors in rational integration.

  - id: q005
    type: symbolicResponse
    prompt: |
      Evaluate.

      $$
      \int
      \frac{x^4-x^3+2x^2+3x-1}
      {(x-1)(x^2+1)}
      \,dx
      $$
    answer:
      expectedLatex: '\frac{x^2}{2}+2\ln\left|x-1\right|-\frac{1}{2}\ln\left(x^2+1\right)+3\arctan(x)+C'
      equivalenceMode: derivative
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      This is an improper rational function because the numerator degree is $4$
      and the denominator degree is $3$. Polynomial division must come before
      partial fractions:

      $$
      \frac{x^4-x^3+2x^2+3x-1}{(x-1)(x^2+1)}
      =
      x+\frac{x^2+4x-1}{(x-1)(x^2+1)}.
      $$

      Now decompose the proper remainder:

      $$
      \frac{x^2+4x-1}{(x-1)(x^2+1)}
      =
      \frac{2}{x-1}+\frac{-x+3}{x^2+1}.
      $$

      Integrate $x$ directly. The linear factor produces a logarithm; the $-x$
      numerator over $x^2+1$ produces another logarithm; and the constant
      numerator over $x^2+1$ produces arctangent.

      **Technique order:** polynomial division, mixed-factor partial fractions,
      numerator splitting, power rule, logarithms, arctangent.

      **Related topic:** improper rational integration followed by irreducible-
      quadratic partial fractions.
