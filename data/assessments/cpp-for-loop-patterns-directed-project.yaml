directedProject:
  summary: >-
    Build mechanical fluency with for loop syntax through three exercises:
    counting sequences, modifying loop increments, and nested loops for
    printing patterns.
  estimatedTimeMinutes: 10
  resources: []
  phases:
    - id: phase-1-counting
      title: "Basic Counting"
      steps:
        - id: step-1-count
          title: "Count from 1 to 20"
          instruction: |
            Create a new C++ console project named `ForLoopPatterns`.

            Write a program that prints numbers 1 through 20 using a `for` loop:

            ```cpp
            #include <iostream>
            using namespace std;

            int main() {
                cout << "=== Count 1 to 20 ===" << endl;
                for (int i = 1; i <= 20; i++) {
                    cout << i << " ";
                }
                cout << endl;

                return 0;
            }
            ```

            The `for` loop has three parts separated by semicolons:
            1. **Initialization:** `int i = 1` — runs once before the loop starts
            2. **Condition:** `i <= 20` — checked before each iteration
            3. **Update:** `i++` — runs after each iteration

            Build and run. You should see: `1 2 3 4 5 ... 20`
          checklist:
            - id: chk-1-to-20
              text: "Program prints numbers 1 through 20"
          resources: []

    - id: phase-2-evens
      title: "Even Numbers"
      steps:
        - id: step-2-evens
          title: "Print Even Numbers by Modifying the Increment"
          instruction: |
            Add a second loop that prints only even numbers from 2 to 30.
            You can do this by changing the start value and increment:

            ```cpp
            cout << endl << "=== Even Numbers 2 to 30 ===" << endl;
            for (int i = 2; i <= 30; i += 2) {
                cout << i << " ";
            }
            cout << endl;
            ```

            The `i += 2` makes the loop count by twos instead of by ones.

            Now add a third loop that counts *backwards* from 10 to 1:

            ```cpp
            cout << endl << "=== Countdown ===" << endl;
            for (int i = 10; i >= 1; i--) {
                cout << i << " ";
            }
            cout << "Liftoff!" << endl;
            ```

            Build and run to see all three patterns.
          checklist:
            - id: chk-evens
              text: "Printed even numbers from 2 to 30 using i += 2"
            - id: chk-countdown
              text: "Printed a countdown from 10 to 1 using i--"
          resources: []

    - id: phase-3-nested
      title: "Nested Loops and Patterns"
      steps:
        - id: step-3-triangle
          title: "Print a Right Triangle"
          instruction: |
            Add a nested loop that prints a right triangle of `*` characters:

            ```cpp
            cout << endl << "=== Right Triangle ===" << endl;
            for (int row = 1; row <= 5; row++) {
                for (int col = 1; col <= row; col++) {
                    cout << "* ";
                }
                cout << endl;
            }
            ```

            This produces:
            ```
            *
            * *
            * * *
            * * * *
            * * * * *
            ```

            The outer loop controls the row number. The inner loop runs `row` times,
            printing that many stars. After the inner loop finishes, `endl` moves to
            the next line.
          checklist:
            - id: chk-triangle
              text: "Right triangle pattern displays correctly"
          resources: []

        - id: step-4-rectangle
          title: "Challenge: Print a Rectangle and Inverted Triangle"
          instruction: |
            Add two more patterns:

            **Rectangle (5 rows × 8 columns):**
            ```cpp
            cout << endl << "=== Rectangle ===" << endl;
            for (int row = 1; row <= 5; row++) {
                for (int col = 1; col <= 8; col++) {
                    cout << "* ";
                }
                cout << endl;
            }
            ```

            **Inverted triangle (hint: make the inner loop count from `row` to 5):**
            ```cpp
            cout << endl << "=== Inverted Triangle ===" << endl;
            for (int row = 1; row <= 5; row++) {
                for (int col = row; col <= 5; col++) {
                    cout << "* ";
                }
                cout << endl;
            }
            ```

            Build and run to see all patterns together.
          checklist:
            - id: chk-rectangle
              text: "Rectangle pattern displays correctly"
            - id: chk-inverted
              text: "Inverted triangle pattern displays correctly"
          resources: []
