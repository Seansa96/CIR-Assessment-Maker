lesson:
  introduction: 'Programs need to make decisions and repeat actions. C++ provides
    standard control flow statements for this: `if/else` for conditions, `switch`
    for multiple choices, and loops (`for`, `while`, `do-while`) for repetition.

    '
  sections:
  - id: conditionals
    title: If / Else
    required: true
    content: "The `if` statement executes a block of code if a condition is `true`.\
      \ `else if` and `else` provide alternative paths.\n\n```cpp\nint temp = 85;\n\
      \nif (temp > 90) {\n    cout << \"Too\rhot!\";\n} else if (temp < 60) {\n   \
      \ cout << \"Too cold!\";\n} else {\n    cout << \"Just right.\";\n}\n```\n\n\
      Conditions use operators like `==` (equal), `!=` (not equal), `<`, `>`, `<=`,\
      \ and `>=`. Logical operators combine conditions: `&&` (AND), `||` (OR), and\
      \ `!` (NOT).\n"
    check:
      id: conditionals-check
      type: multipleChoice
      prompt: If `int score = 75;`, what will `if (score >= 80) { cout << "A"; } else
        if (score >= 70) { cout << "B"; } else { cout << "C"; }` print?
      choices:
      - id: a
        text: '"B"'
      - id: b
        text: '"A"'
      - id: c
        text: '"C"'
      - id: d
        text: '"BC"'
      answer:
        choiceId: a
      explanation: '`75 >= 80` is false, so it moves to `else if (score >= 70)`, which
        is true. It prints "B" and skips the rest.

        '
  - id: switch-statements
    title: Switch Statements
    required: true
    content: "A `switch` statement is an efficient way to check a single integer or\
      \ character against multiple constant values.\n\n```cpp\nchar grade = 'B';\n\
      \nswitch (grade) {\n    case 'A':\n        cout << \"Excellent\";\n        break;\n\
      \    case 'B':\n        cout << \"Good\";\n        break;\n    default:\n  \
      \      cout << \"Other\";\n        break;\n}\n```\n\n**Important:** You must\
      \ include a `break` statement at the end of each case. If you forget it, execution\
      \ will \"fall through\" and run the code in the next cases too!\n"
    check:
      id: switch-statements-check
      type: multipleChoice
      prompt: What happens if you forget the `break` statement inside a `switch` case?
      choices:
      - id: a
        text: Execution continues into the next case block (fall-through).
      - id: b
        text: The code will not compile.
      - id: c
        text: The program crashes immediately.
      - id: d
        text: The switch statement exits automatically.
      answer:
        choiceId: a
      explanation: 'Without `break`, C++ executes all subsequent case blocks until
        it hits a `break` or the end of the `switch`.

        '
  - id: loops
    title: Loops (While, Do-While, For)
    required: true
    content: "Loops repeat code as long as a condition is true.\n\n**While loop:**\
      \ Checks the condition *before* executing the block. It might execute zero times.\n\
      ```cpp\nint i = 0;\nwhile (i < 3) {\n    cout << i << \" \";\n    i++;\n} //\
      \ Prints: 0 1 2\n```\n\n**Do-while loop:** Checks the condition *after* executing\
      \ the block. It always executes at least once.\n```cpp\nint j = 0;\ndo {\n \
      \   cout << j << \" \";\n    j++;\n} while (j < 3); // Prints: 0 1 2\n```\n\n\
      **For loop:** Combines initialization, condition, and update into one line.\
      \ Best when you know\rhow many times to loop.\n```cpp\nfor (int k = 0; k < 3;\
      \ k++) {\n    cout << k << \" \";\n} // Prints: 0 1 2\n```\n"
    check:
      id: loops-check
      type: multipleChoice
      prompt: Which loop is guaranteed to run its block of code at least one time,
        regardless of the condition?
      choices:
      - id: a
        text: '`do-while` loop'
      - id: b
        text: '`while` loop'
      - id: c
        text: '`for` loop'
      - id: d
        text: range-based `for` loop
      answer:
        choiceId: a
      explanation: 'A `do-while` loop executes the body first, then checks the condition
        at the end.

        '
  - id: break-continue
    title: Break and Continue
    required: true
    content: "You can alter the normal flow of a loop from inside its block.\n\n-\
      \ `break` exits the entire loop immediately.\n- `continue` skips the rest of\
      \ the current iteration and jumps straight to the next iteration.\n\n```cpp\n\
      for (int i = 0; i < 5; i++) {\n    if (i == 2) {\n        continue; // Skips\
      \ printing 2\n    }\n    if (i == 4) {\n        break;    // Stops before printing\
      \ 4\n    }\n    cout << i << \" \";\n}\n// Prints: 0 1 3\n```\n"
    check:
      id: break-continue-check
      type: multipleChoice
      prompt: What does `continue` do when executed inside a `while` loop?
      choices:
      - id: a
        text: It jumps back to the condition check for the next iteration.
      - id: b
        text: It exits the loop entirely.
      - id: c
        text: It pauses the program until the user presses enter.
      - id: d
        text: It restarts the loop from the very beginning (resetting variables).
      answer:
        choiceId: a
      explanation: '`continue` skips the remainder of the loop body and proceeds to
        the next iteration''s evaluation.

        '
