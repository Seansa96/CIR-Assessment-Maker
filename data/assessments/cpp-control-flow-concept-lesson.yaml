lesson:
  introduction: |
    Programs need to make decisions and repeat actions. C++ provides standard control flow statements for this: `if/else` for conditions, `switch` for multiple choices, and loops (`for`, `while`, `do-while`) for repetition.
  sections:
    - id: conditionals
      title: If / Else
      required: true
      content: |
        The `if` statement executes a block of code if a condition is `true`. `else if` and `else` provide alternative paths.

        ```cpp
        int temp = 85;

        if (temp > 90) {
            cout << "Too hot!";
        } else if (temp < 60) {
            cout << "Too cold!";
        } else {
            cout << "Just right.";
        }
        ```

        Conditions use operators like `==` (equal), `!=` (not equal), `<`, `>`, `<=`, and `>=`. Logical operators combine conditions: `&&` (AND), `||` (OR), and `!` (NOT).
      check:
        id: conditionals-check
        type: multipleChoice
        prompt: If `int score = 75;`, what will `if (score >= 80) { cout << "A"; } else if (score >= 70) { cout << "B"; } else { cout << "C"; }` print?
        choices:
          - id: a
            text: '"B"'
          - id: b
            text: '"A"'
          - id: c
            text: '"C"'
          - id: d
            text: '"BC"'
        answer:
          choiceId: a
        explanation: |
          `75 >= 80` is false, so it moves to `else if (score >= 70)`, which is true. It prints "B" and skips the rest.

    - id: switch-statements
      title: Switch Statements
      required: true
      content: |
        A `switch` statement is an efficient way to check a single integer or character against multiple constant values.

        ```cpp
        char grade = 'B';

        switch (grade) {
            case 'A':
                cout << "Excellent";
                break;
            case 'B':
                cout << "Good";
                break;
            default:
                cout << "Other";
                break;
        }
        ```

        **Important:** You must include a `break` statement at the end of each case. If you forget it, execution will "fall through" and run the code in the next cases too!
      check:
        id: switch-statements-check
        type: multipleChoice
        prompt: What happens if you forget the `break` statement inside a `switch` case?
        choices:
          - id: a
            text: 'Execution continues into the next case block (fall-through).'
          - id: b
            text: 'The code will not compile.'
          - id: c
            text: 'The program crashes immediately.'
          - id: d
            text: 'The switch statement exits automatically.'
        answer:
          choiceId: a
        explanation: |
          Without `break`, C++ executes all subsequent case blocks until it hits a `break` or the end of the `switch`.

    - id: loops
      title: Loops (While, Do-While, For)
      required: true
      content: |
        Loops repeat code as long as a condition is true.

        **While loop:** Checks the condition *before* executing the block. It might execute zero times.
        ```cpp
        int i = 0;
        while (i < 3) {
            cout << i << " ";
            i++;
        } // Prints: 0 1 2
        ```

        **Do-while loop:** Checks the condition *after* executing the block. It always executes at least once.
        ```cpp
        int j = 0;
        do {
            cout << j << " ";
            j++;
        } while (j < 3); // Prints: 0 1 2
        ```

        **For loop:** Combines initialization, condition, and update into one line. Best when you know how many times to loop.
        ```cpp
        for (int k = 0; k < 3; k++) {
            cout << k << " ";
        } // Prints: 0 1 2
        ```
      check:
        id: loops-check
        type: multipleChoice
        prompt: Which loop is guaranteed to run its block of code at least one time, regardless of the condition?
        choices:
          - id: a
            text: '`do-while` loop'
          - id: b
            text: '`while` loop'
          - id: c
            text: '`for` loop'
          - id: d
            text: 'range-based `for` loop'
        answer:
          choiceId: a
        explanation: |
          A `do-while` loop executes the body first, then checks the condition at the end.

    - id: break-continue
      title: Break and Continue
      required: true
      content: |
        You can alter the normal flow of a loop from inside its block.

        - `break` exits the entire loop immediately.
        - `continue` skips the rest of the current iteration and jumps straight to the next iteration.

        ```cpp
        for (int i = 0; i < 5; i++) {
            if (i == 2) {
                continue; // Skips printing 2
            }
            if (i == 4) {
                break;    // Stops before printing 4
            }
            cout << i << " ";
        }
        // Prints: 0 1 3
        ```
      check:
        id: break-continue-check
        type: multipleChoice
        prompt: What does `continue` do when executed inside a `while` loop?
        choices:
          - id: a
            text: 'It jumps back to the condition check for the next iteration.'
          - id: b
            text: 'It exits the loop entirely.'
          - id: c
            text: 'It pauses the program until the user presses enter.'
          - id: d
            text: 'It restarts the loop from the very beginning (resetting variables).'
        answer:
          choiceId: a
        explanation: |
          `continue` skips the remainder of the loop body and proceeds to the next iteration's evaluation.
