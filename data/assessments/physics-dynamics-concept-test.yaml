questions:
  - id: d-q01
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Students often misidentify Newton's Third Law pairs."
    prerequisiteObjectiveIds: [physics-newton-laws]
    extensionObjectiveIds: [physics-newton-laws]
    prompt: |
      A book rests on a table. The Earth exerts a downward gravitational force on the book. According to Newton's Third Law, what is the corresponding reaction force to this gravitational force?
    choices:
      - id: a
        text: 'The upward normal force exerted by the table on the book.'
      - id: b
        text: 'The downward force exerted by the book on the table.'
      - id: c
        text: 'The upward gravitational force exerted by the book on the Earth.'
      - id: d
        text: 'There is no reaction force because the book is at rest.'
    answer:
      choiceId: c
    explanation: |
        Solution: Newton's Third Law pairs always involve two objects interacting with the same type of force.
        
        Why it works: The action is "Earth pulls Book (gravity)". The reaction must be "Book pulls Earth (gravity)".
        
        Why the other choices fail: The normal force (table pushes book) is a different type of force and involves a different object. The book pushing on the table is the reaction to the table pushing on the book.
  
  - id: d-q02
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Confusion about net force and constant velocity."
    prerequisiteObjectiveIds: [physics-newton-laws]
    extensionObjectiveIds: [physics-newton-laws]
    prompt: |
      A spaceship is traveling in deep space, far from any stars or planets, with its engines turned off. What is required to keep it moving at a constant velocity?
    choices:
      - id: a
        text: 'A constant forward force.'
      - id: b
        text: 'A force proportional to its mass.'
      - id: c
        text: 'A force proportional to its velocity.'
      - id: d
        text: 'No force is required.'
    answer:
      choiceId: d
    explanation: |
        Solution: According to Newton's First Law (inertia), an object in motion stays in motion with the same velocity unless acted upon by a net external force.
        
        Why it works: Since there are no opposing forces (like friction or gravity), zero net force maintains a constant velocity.
        
        Why the other choices fail: Applying any forward force would cause the spaceship to accelerate (speed up).

  - id: d-q03
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Interpreting FBDs during acceleration."
    prerequisiteObjectiveIds: [physics-free-body-diagrams]
    extensionObjectiveIds: [physics-free-body-diagrams]
    prompt: |
      An elevator is moving upward but slowing down. Which statement correctly describes the relative magnitudes of the forces acting on a person standing inside?
    choices:
      - id: a
        text: 'The normal force from the floor is greater than the gravitational force.'
      - id: b
        text: 'The normal force from the floor is less than the gravitational force.'
      - id: c
        text: 'The normal force from the floor is exactly equal to the gravitational force.'
      - id: d
        text: 'The normal force is zero.'
    answer:
      choiceId: b
    explanation: |
        Solution: The elevator is moving upward but slowing down, meaning its acceleration is directed downward.
        
        Why it works: For a downward net acceleration, the downward force (gravity, $mg$) must be greater than the upward force (normal force, $F_N$). Thus, $F_{net} = mg - F_N > 0 \implies mg > F_N$.
        
        Why the other choices fail: If $F_N > mg$, the person would accelerate upward. If $F_N = mg$, they would move at a constant velocity.

  - id: d-q04
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding mass vs weight."
    prerequisiteObjectiveIds: [physics-newton-laws]
    extensionObjectiveIds: [physics-newton-laws]
    prompt: |
      An astronaut travels from Earth to the Moon. How do their mass and weight change?
    choices:
      - id: a
        text: 'Both mass and weight decrease.'
      - id: b
        text: 'Mass remains the same, weight decreases.'
      - id: c
        text: 'Mass decreases, weight remains the same.'
      - id: d
        text: 'Both mass and weight remain the same.'
    answer:
      choiceId: b
    explanation: |
        Solution: Mass is an intrinsic property indicating the amount of matter. Weight is the local force of gravity ($W = mg$).
        
        Why it works: The astronaut's body composition (mass) does not change. Since the Moon's gravitational acceleration ($g$) is less than Earth's, their weight decreases.
        
        Why the other choices fail: Mass is independent of location. Weight is dependent on location.

  - id: d-q05
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Friction behavior for stationary objects."
    prerequisiteObjectiveIds: [physics-friction]
    extensionObjectiveIds: [physics-friction]
    prompt: |
      You push horizontally on a heavy box that rests on a rough floor, but the box does not move. You push twice as hard, but it still does not move. What happens to the force of static friction during this time?
    choices:
      - id: a
        text: 'It remains constant at its maximum possible value.'
      - id: b
        text: 'It increases to exactly match your pushing force.'
      - id: c
        text: 'It remains zero until the box begins to move.'
      - id: d
        text: 'It decreases because static friction opposes the applied force.'
    answer:
      choiceId: b
    explanation: |
        Solution: Static friction adjusts to maintain equilibrium (zero net force) up to a maximum limit ($\mu_s F_N$).
        
        Why it works: Since the box doesn't move, its acceleration is zero, so $F_{push} - F_{friction} = 0$. As $F_{push}$ increases, $F_{friction}$ must also increase to match it exactly.
        
        Why the other choices fail: Static friction is not always at its maximum; it is reactive. It is not zero if a lateral force is applied.

  - id: d-q06
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Kinetic vs static friction coefficients."
    prerequisiteObjectiveIds: [physics-friction]
    extensionObjectiveIds: [physics-friction]
    prompt: |
      Once a heavy box starts sliding across the floor, it requires less force to keep it moving at a constant speed than it did to start it moving. This is because:
    choices:
      - id: a
        text: 'The normal force decreases when the object is in motion.'
      - id: b
        text: 'The coefficient of kinetic friction is typically less than the coefficient of static friction.'
      - id: c
        text: 'The box gains momentum, which assists the pushing force.'
      - id: d
        text: 'Air resistance provides a forward lift on the box.'
    answer:
      choiceId: b
    explanation: |
        Solution: The force required to overcome static friction is $\mu_s F_N$, while the force to maintain motion is $\mu_k F_N$.
        
        Why it works: For almost all surfaces, $\mu_k < \mu_s$, meaning sliding friction is weaker than the maximum static friction that resists initial movement.
        
        Why the other choices fail: Normal force depends on gravity, which doesn't change. Momentum does not "assist" a force (it's not a force). Air resistance would oppose motion.

  - id: d-q07
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Friction on an inclined plane."
    prerequisiteObjectiveIds: [physics-inclined-planes]
    extensionObjectiveIds: [physics-inclined-planes]
    prompt: |
      A block sits on a wooden plank. You slowly tilt one end of the plank upward. As the angle of incline increases (but before the block slips), what happens to the normal force and the force of static friction acting on the block?
    choices:
      - id: a
        text: 'Normal force increases, static friction decreases.'
      - id: b
        text: 'Normal force decreases, static friction increases.'
      - id: c
        text: 'Both normal force and static friction increase.'
      - id: d
        text: 'Both normal force and static friction decrease.'
    answer:
      choiceId: b
    explanation: |
        Solution: Decompose gravity into components perpendicular ($mg \cos\theta$) and parallel ($mg \sin\theta$) to the incline.
        
        Why it works: Normal force balances the perpendicular component ($F_N = mg \cos\theta$), which decreases as $\theta$ increases. Static friction balances the parallel component ($F_f = mg \sin\theta$), which increases as $\theta$ increases.
        
        Why the other choices fail: The forces depend on sine and cosine functions, which behave oppositely between 0 and 90 degrees.

  - id: d-q08
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Tension in connected systems."
    prerequisiteObjectiveIds: [physics-connected-systems]
    extensionObjectiveIds: [physics-connected-systems]
    prompt: |
      Two blocks, A (mass 2 kg) and B (mass 4 kg), are connected by a massless string. You pull block B horizontally across a frictionless table. How does the tension in the string compare to the pulling force?
    choices:
      - id: a
        text: 'The tension is equal to the pulling force.'
      - id: b
        text: 'The tension is greater than the pulling force.'
      - id: c
        text: 'The tension is less than the pulling force.'
      - id: d
        text: 'The tension is zero because the string is massless.'
    answer:
      choiceId: c
    explanation: |
        Solution: The pulling force accelerates the entire system (mass $2 + 4 = 6$ kg), while the tension only accelerates block A (mass $2$ kg).
        
        Why it works: Both blocks share the same acceleration $a$. The pulling force is $F_{pull} = (m_A + m_B)a$. The tension pulling block A is $T = m_A a$. Since $m_A < (m_A + m_B)$, $T < F_{pull}$.
        
        Why the other choices fail: If tension equaled the pull, block B would have a net force of zero and wouldn't accelerate.

  - id: d-q09
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Centripetal force identification."
    prerequisiteObjectiveIds: [physics-circular-motion]
    extensionObjectiveIds: [physics-circular-motion]
    prompt: |
      A car drives at a constant speed around a flat, circular track. What provides the centripetal force required to keep the car moving in a circle?
    choices:
      - id: a
        text: 'The normal force from the road.'
      - id: b
        text: 'The gravitational force on the car.'
      - id: c
        text: 'The force of static friction between the tires and the road.'
      - id: d
        text: 'The force of kinetic friction between the tires and the road.'
    answer:
      choiceId: c
    explanation: |
        Solution: Centripetal force is a net force requirement, provided by real physical forces acting towards the center.
        
        Why it works: On a flat curve, the only horizontal force available to push the car inward is the friction between the tires and the road. Because the tires roll without slipping laterally, this is static friction.
        
        Why the other choices fail: Normal force and gravity are vertical. Kinetic friction would mean the car is skidding sideways.

  - id: d-q10
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding apparent weight in circular motion."
    prerequisiteObjectiveIds: [physics-circular-motion]
    extensionObjectiveIds: [physics-circular-motion]
    prompt: |
      A roller coaster car goes over the top of a circular hill at a constant speed. How does the normal force from the seat on the passenger compare to the passenger's true weight ($mg$)?
    choices:
      - id: a
        text: 'The normal force is greater than the true weight.'
      - id: b
        text: 'The normal force is equal to the true weight.'
      - id: c
        text: 'The normal force is less than the true weight.'
      - id: d
        text: 'The normal force is zero.'
    answer:
      choiceId: c
    explanation: |
        Solution: At the top of a hill, the net acceleration is downward (centripetal, toward the center of the curve).
        
        Why it works: According to Newton's Second Law, $F_{net} = mg - F_N = ma_c$. Therefore, $F_N = mg - ma_c$. The normal force is less than $mg$, making the passenger feel "lighter".
        
        Why the other choices fail: If $F_N \ge mg$, the passenger would accelerate upward or move in a straight line, not follow the downward curve.

  - id: d-q11
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Atwood machine tension behavior."
    prerequisiteObjectiveIds: [physics-connected-systems]
    extensionObjectiveIds: [physics-connected-systems]
    prompt: |
      In an ideal Atwood machine (two masses hanging over a frictionless, massless pulley), a 5 kg mass is connected to a 3 kg mass. When released from rest, how does the tension in the string compare to the weights of the two masses?
    choices:
      - id: a
        text: 'The tension is exactly equal to the weight of the 5 kg mass.'
      - id: b
        text: 'The tension is exactly equal to the weight of the 3 kg mass.'
      - id: c
        text: 'The tension is between the weights of the 3 kg and 5 kg masses.'
      - id: d
        text: 'The tension is equal to the sum of both weights.'
    answer:
      choiceId: c
    explanation: |
        Solution: The system accelerates such that the heavier mass goes down and the lighter mass goes up.
        
        Why it works: For the 5 kg mass accelerating downward, $5g - T = 5a \implies T < 5g$. For the 3 kg mass accelerating upward, $T - 3g = 3a \implies T > 3g$. Thus, $3g < T < 5g$.
        
        Why the other choices fail: If tension equaled either weight, that mass would not accelerate. If it equaled the sum, both masses would accelerate violently upward.

  - id: d-q12
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Static equilibrium conditions."
    prerequisiteObjectiveIds: [physics-static-equilibrium-tension]
    extensionObjectiveIds: [physics-static-equilibrium-tension]
    prompt: |
      A heavy sign is hung symmetrically by two cables attached to a ceiling. If the angle between the cables and the ceiling is decreased (making the cables more horizontal), what happens to the tension in the cables?
    choices:
      - id: a
        text: 'The tension increases.'
      - id: b
        text: 'The tension decreases.'
      - id: c
        text: 'The tension remains the same.'
      - id: d
        text: 'The tension becomes zero.'
    answer:
      choiceId: a
    explanation: |
        Solution: The upward vertical components of the tension must balance the constant downward weight of the sign: $2 T \sin\theta = mg$.
        
        Why it works: If the angle $\theta$ (relative to horizontal) decreases, $\sin\theta$ decreases. To keep the product $T \sin\theta$ constant, the tension $T$ must increase.
        
        Why the other choices fail: The vertical force needed is constant. A smaller angle provides less vertical "leverage" per unit of tension, so more tension is required.

  - id: d-q13
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Direction of friction on driven wheels."
    prerequisiteObjectiveIds: [physics-friction]
    extensionObjectiveIds: [physics-friction]
    prompt: |
      When a car accelerates forward on a level road, in what direction does the force of static friction exerted by the road on the drive tires point?
    choices:
      - id: a
        text: 'Forward'
      - id: b
        text: 'Backward'
      - id: c
        text: 'Upward'
      - id: d
        text: 'Downward'
    answer:
      choiceId: a
    explanation: |
        Solution: Friction always opposes the *relative* motion (or tendency of motion) between the two surfaces.
        
        Why it works: The engine attempts to spin the tires backward against the road. To prevent this slipping, the road pushes *forward* on the tires. This forward friction is what accelerates the car forward.
        
        Why the other choices fail: If friction pointed backward, the car would accelerate backward.

  - id: d-q14
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Air resistance concepts."
    prerequisiteObjectiveIds: [physics-newton-laws]
    extensionObjectiveIds: [physics-newton-laws]
    prompt: |
      A skydiver is falling at terminal velocity. They then open their parachute. What is the direction of their net acceleration immediately after the parachute opens?
    choices:
      - id: a
        text: 'Downward'
      - id: b
        text: 'Upward'
      - id: c
        text: 'Zero'
      - id: d
        text: 'Sideways'
    answer:
      choiceId: b
    explanation: |
        Solution: Terminal velocity means zero acceleration ($F_{drag} = mg$). Opening the chute massively increases the drag force.
        
        Why it works: Immediately after opening, $F_{drag} > mg$. The net force is directed upward, causing an upward acceleration that slows the skydiver's downward descent.
        
        Why the other choices fail: If acceleration were downward, they would speed up. They do not travel upward, but their *acceleration* is upward because they are losing downward speed.

  - id: d-q15
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Newton's second law with varying mass."
    prerequisiteObjectiveIds: [physics-newton-laws]
    extensionObjectiveIds: [physics-newton-laws]
    prompt: |
      A constant net force is applied to a cart. If the mass of the cart is suddenly doubled (e.g., by dropping a sandbag onto it), what happens to its acceleration?
    choices:
      - id: a
        text: 'It doubles.'
      - id: b
        text: 'It halves.'
      - id: c
        text: 'It remains the same.'
      - id: d
        text: 'It becomes zero.'
    answer:
      choiceId: b
    explanation: |
        Solution: Newton's Second Law states $a = F_{net} / m$.
        
        Why it works: If the net force remains constant and the mass is multiplied by 2, the new acceleration is $F_{net} / (2m)$, which is exactly half of the original acceleration.
        
        Why the other choices fail: Acceleration is inversely proportional to mass for a constant force.

  - id: d-q16
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Normal force vs weight on inclines."
    prerequisiteObjectiveIds: [physics-inclined-planes]
    extensionObjectiveIds: [physics-inclined-planes]
    prompt: |
      A block is at rest on an inclined plane. How does the magnitude of the normal force compare to the block's true weight ($mg$)?
    choices:
      - id: a
        text: 'The normal force is greater than the weight.'
      - id: b
        text: 'The normal force is exactly equal to the weight.'
      - id: c
        text: 'The normal force is less than the weight.'
      - id: d
        text: 'It depends on the friction.'
    answer:
      choiceId: c
    explanation: |
        Solution: The normal force only balances the component of gravity perpendicular to the surface.
        
        Why it works: On an incline of angle $\theta$, the perpendicular component of gravity is $mg \cos\theta$. Since $\cos\theta < 1$ for $\theta > 0$, the normal force is less than $mg$.
        
        Why the other choices fail: The normal force equals weight only on a flat horizontal surface with no other vertical forces.

  - id: d-q17
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Scale readings in accelerating frames."
    prerequisiteObjectiveIds: [physics-newton-laws]
    extensionObjectiveIds: [physics-newton-laws]
    prompt: |
      A person stands on a bathroom scale in an elevator. The scale reading will be perfectly equal to the person's true weight only when:
    choices:
      - id: a
        text: 'The elevator is accelerating upward.'
      - id: b
        text: 'The elevator is accelerating downward.'
      - id: c
        text: 'The elevator is moving with a constant velocity (or at rest).'
      - id: d
        text: 'The elevator is in free fall.'
    answer:
      choiceId: c
    explanation: |
        Solution: The scale measures the normal force it exerts on the person.
        
        Why it works: $F_N - mg = ma$. The scale reading ($F_N$) equals $mg$ only when $a = 0$. Constant velocity or rest both mean zero acceleration.
        
        Why the other choices fail: Upward acceleration means $F_N > mg$. Downward acceleration means $F_N < mg$. Free fall means $F_N = 0$.

  - id: d-q18
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "FBD force origins."
    prerequisiteObjectiveIds: [physics-free-body-diagrams]
    extensionObjectiveIds: [physics-free-body-diagrams]
    prompt: |
      When drawing a Free-Body Diagram for a thrown ball that is currently in mid-air (ignoring air resistance), which forces should be included?
    choices:
      - id: a
        text: 'Gravity pointing downward and a ''force of the throw'' pointing forward.'
      - id: b
        text: 'Only gravity pointing downward.'
      - id: c
        text: 'Gravity pointing downward and a normal force pointing upward.'
      - id: d
        text: 'Gravity pointing downward and inertia pointing forward.'
    answer:
      choiceId: b
    explanation: |
        Solution: A Free-Body Diagram includes only forces actively exerted by the environment on the object at that moment.
        
        Why it works: Once the ball leaves the hand, the hand is no longer exerting a force. The only environmental interaction is Earth's gravity.
        
        Why the other choices fail: "Force of the throw" and "inertia" are not forces; they describe the object's velocity and momentum. Normal force requires surface contact.

  - id: d-q19
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Misconceptions of action-reaction."
    prerequisiteObjectiveIds: [physics-newton-laws]
    extensionObjectiveIds: [physics-newton-laws]
    prompt: |
      A large truck collides head-on with a small car. During the collision, how does the force exerted by the truck on the car compare to the force exerted by the car on the truck?
    choices:
      - id: a
        text: 'The truck exerts a much larger force on the car.'
      - id: b
        text: 'The car exerts a much larger force on the truck.'
      - id: c
        text: 'Both vehicles exert forces of equal magnitude on each other.'
      - id: d
        text: 'The force depends on their initial speeds.'
    answer:
      choiceId: c
    explanation: |
        Solution: Newton's Third Law states that forces between two objects always exist in equal-magnitude, opposite-direction pairs.
        
        Why it works: The interaction force is identical for both. The car experiences a much larger *acceleration* (and more damage) because it has a much smaller mass ($a = F/m$), not because the force is larger.
        
        Why the other choices fail: Size, mass, and velocity do not alter the fundamental symmetry of the interaction force.

  - id: d-q20
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Circular motion release trajectory."
    prerequisiteObjectiveIds: [physics-circular-motion]
    extensionObjectiveIds: [physics-circular-motion]
    prompt: |
      A ball attached to a string is swung in a horizontal circle. If the string suddenly breaks, what path will the ball take?
    choices:
      - id: a
        text: 'It will fly straight outward from the center.'
      - id: b
        text: 'It will curve outward in an expanding spiral.'
      - id: c
        text: 'It will fly off in a straight line tangent to the circle.'
      - id: d
        text: 'It will stop immediately.'
    answer:
      choiceId: c
    explanation: |
        Solution: The string provided the centripetal force. When broken, the net force is zero (in the horizontal plane).
        
        Why it works: By Newton's First Law, without a net force, an object maintains its current velocity. The instantaneous velocity of an object in a circle is tangent to the path.
        
        Why the other choices fail: "Centrifugal" outward flight is a misconception arising from non-inertial reference frames. The object simply continues straight.
