lesson:
  introduction: >-
    Capacitance is set by geometry and material. This lesson reinforces series/parallel rules, battery-connected versus isolated
    conditions, dielectric response, and field energy.
  sections:
  - id: physics2-reinforcement-cap-s1
    title: Interpret capacitance
    required: true
    content: Capacitance is $C=Q/V$. It describes how much charge a geometry stores per potential difference; it is not itself charge or voltage.
    check:
      id: physics2-reinforcement-cap-s1-check
      type: multipleChoice
      prompt: If a capacitor's capacitance doubles while the voltage remains fixed, what happens to stored charge?
      choices:
      - { id: a, text: 'It doubles because $Q=CV$' }
      - { id: b, text: 'It halves because capacitance resists charge', issueSignals: [{ id: physics2-capacitance-inverse-error, domains: [physics-2] }] }
      - { id: c, text: 'It is unchanged because voltage is fixed', issueSignals: [{ id: physics2-capacitance-charge-error, domains: [physics-2] }] }
      - { id: d, text: 'It becomes $C/V$', issueSignals: [{ id: physics2-capacitance-definition-error, domains: [physics-2] }] }
      answer: { choiceId: a }
      explanation: >-
        Solution: Rearranging $C=Q/V$ gives $Q=CV$; fixed $V$ means doubling $C$ doubles $Q$.
        Why it works: Capacitance measures charge per voltage for the specified geometry.
        Why the other choices fail: They invert the proportionality, confuse fixed voltage with fixed charge, or misuse the definition.
    difficultyDimensions: [modelOrDerivation, proportionality]
    difficultyEvidence: Applies the defining relation under a controlled change.
  - id: physics2-reinforcement-cap-s2
    title: Distinguish series and parallel
    required: true
    content: Parallel capacitors share voltage and add capacitance. Series capacitors share charge magnitude and add reciprocals.
    check:
      id: physics2-reinforcement-cap-s2-check
      type: multipleChoice
      prompt: Two capacitors are connected in parallel. Which statement is correct?
      choices:
      - { id: a, text: 'They have the same voltage and $C_{eq}=C_1+C_2$' }
      - { id: b, text: 'They have the same charge and $1/C_{eq}=1/C_1+1/C_2$', issueSignals: [{ id: physics2-capacitor-series-parallel-swap, domains: [physics-2] }] }
      - { id: c, text: 'Their equivalent capacitance is always smaller than each one', issueSignals: [{ id: physics2-capacitance-magnitude-error, domains: [physics-2] }] }
      - { id: d, text: 'Their voltages must add to the battery voltage separately', issueSignals: [{ id: physics2-capacitor-voltage-error, domains: [physics-2] }] }
      answer: { choiceId: a }
      explanation: >-
        Solution: Parallel branches share the same two nodes, so voltage is common and charges add; therefore capacitances add.
        Why it works: The network geometry determines which quantity is common.
        Why the other choices fail: b is the series rule, c reverses the equivalent-size trend, and d is not a parallel constraint.
    difficultyDimensions: [representation, modelSelection]
    difficultyEvidence: Maps circuit geometry to the correct capacitor combination rule.
  - id: physics2-reinforcement-cap-s3
    title: Track a dielectric condition
    required: true
    content: Inserting a dielectric increases $C$. With a battery connected, $V$ is fixed; with an isolated capacitor, $Q$ is fixed.
    check:
      id: physics2-reinforcement-cap-s3-check
      type: multipleChoice
      prompt: A dielectric is inserted while the capacitor remains connected to an ideal battery. What changes immediately?
      choices:
      - { id: a, text: 'Capacitance and stored charge increase while voltage stays fixed' }
      - { id: b, text: 'Capacitance increases but charge stays fixed', issueSignals: [{ id: physics2-capacitor-battery-condition-error, domains: [physics-2] }] }
      - { id: c, text: 'Voltage increases while capacitance stays fixed', issueSignals: [{ id: physics2-dielectric-capacitance-error, domains: [physics-2] }] }
      - { id: d, text: 'All three quantities decrease', issueSignals: [{ id: physics2-dielectric-trend-error, domains: [physics-2] }] }
      answer: { choiceId: a }
      explanation: >-
        Solution: The dielectric raises $C$ and the connected battery holds $V$ fixed, so $Q=CV$ increases.
        Why it works: The battery supplies additional free charge while maintaining the potential difference.
        Why the other choices fail: b describes an isolated condition, c denies the dielectric effect, and d reverses all trends.
    difficultyDimensions: [constraints, proportionality]
    difficultyEvidence: Requires selecting the correct external constraint before applying $Q=CV$.
  - id: physics2-reinforcement-cap-s4
    title: Check energy scaling
    required: true
    content: For fixed voltage, $U=\tfrac12CV^2$ increases with capacitance. For fixed charge, $U=Q^2/(2C)$ decreases when capacitance increases.
    check:
      id: physics2-reinforcement-cap-s4-check
      type: multipleChoice
      prompt: An isolated capacitor's capacitance doubles after a dielectric is inserted. How does its stored energy change?
      choices:
      - { id: a, text: 'It halves because $Q$ is fixed and $U=Q^2/(2C)$' }
      - { id: b, text: 'It doubles because $U=\tfrac12CV^2$', issueSignals: [{ id: physics2-capacitor-fixed-condition-error, domains: [physics-2] }] }
      - { id: c, text: 'It is unchanged because energy is conserved inside the capacitor', issueSignals: [{ id: physics2-capacitor-energy-error, domains: [physics-2] }] }
      - { id: d, text: 'It quadruples because capacitance appears twice', issueSignals: [{ id: physics2-capacitor-power-error, domains: [physics-2] }] }
      answer: { choiceId: a }
      explanation: >-
        Solution: Isolation fixes $Q$, so use $U=Q^2/(2C)$. Doubling $C$ halves $U$.
        Why it works: The voltage falls as the dielectric is inserted, and the field energy decreases.
        Why the other choices fail: b assumes fixed voltage, c ignores work done during insertion, and d misreads the exponent.
    difficultyDimensions: [energy, constraints]
    difficultyEvidence: Chooses the energy form from the physical boundary condition.
