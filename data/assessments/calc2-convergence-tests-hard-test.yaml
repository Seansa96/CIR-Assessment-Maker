schemaVersion: 1
id: calc2-convergence-tests-hard-test
title: Convergence Tests Hard Test
assessmentType: test
categoryId: calculus-2
topicId: convergence-tests
skills:
- Analyze logarithmic, radical, factorial, and oscillatory series
- Use condensation, limsup root, Dirichlet, and asymptotic comparison
- Diagnose inconclusive tests and invalid comparison directions
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - calculus-2
  - convergence-tests
  - hard
  - asymptotic-comparison
modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - apply-limit-comparison-to-perturbed-terms
  prompt: |
    Classify $\displaystyle\sum_{n=2}^{\infty}\frac1{n+(-1)^n}$.
  choices:
  - id: a
    text: Divergent by limit comparison with $1/n$
  - id: b
    text: Convergent by cancellation
  - id: c
    text: Conditionally convergent
  - id: d
    text: Divergent by the term test
  answer:
    choiceId: a
  explanation: |-
    The terms are positive and their quotient with $1/n$ is $n/[n+(-1)^n]\to1$.
- id: q002
  type: multipleChoice
  skills:
  - classify-bertrand-series
  prompt: |
    For which p does
    $\sum_{n=2}^{\infty}1/[n(\ln n)^p]$ converge?
  choices:
  - id: a
    text: $p>1$
  - id: b
    text: |-
      $p\ge1$
  - id: c
    text: $p>0$
  - id: d
    text: Every real p
  answer:
    choiceId: a
  explanation: |-
    Substitution u equals ln x turns the integral into $\int u^{-p}\,du$, whose threshold is p greater than one.
- id: q003
  type: multipleChoice
  skills:
  - apply-cauchy-condensation
  prompt: |
    What does condensation show for
    $\sum_{n=2}^{\infty}1/[\sqrt n\,\ln n]$?
  choices:
  - id: a
    text: It diverges.
  - id: b
    text: It converges.
  - id: c
    text: It is alternating.
  - id: d
    text: The test is inapplicable because terms approach zero.
  answer:
    choiceId: a
  explanation: |-
    The condensed term is $2^k/[2^{k/2}k\ln2]=2^{k/2}/(k\ln2)$, which does not even approach zero.
- id: q004
  type: multipleChoice
  skills:
  - apply-ratio-tests-to-factorials
  prompt: |
    How does $\sum_{n=1}^{\infty}n!/(2n)!$ behave?
  choices:
  - id: a
    text: It converges.
  - id: b
    text: It diverges harmonically.
  - id: c
    text: It is conditionally convergent.
  - id: d
    text: Its terms approach one.
  answer:
    choiceId: a
  explanation: |-
    The consecutive ratio is $(n+1)/[(2n+2)(2n+1)]\to0$.
- id: q005
  type: multipleChoice
  skills:
  - use-limsup-root-tests
  prompt: |
    Let $a_n=(1/2)^n$ for even n and $a_n=(3/4)^n$ for odd n. What does
    the root test conclude for $\sum a_n$?
  choices:
  - id: a
    text: It converges because the limsup root is $3/4$.
  - id: b
    text: It diverges because the root limit does not exist.
  - id: c
    text: It is conditionally convergent.
  - id: d
    text: The limsup root is $1$.
  answer:
    choiceId: a
  explanation: The nth roots alternate between one half and three fourths, and the decisive limsup remains
    below one.
- id: q006
  type: multipleChoice
  skills:
  - choose-two-sided-comparisons
  prompt: |
    Classify $\sum_{n=1}^{\infty}1/\sqrt{n^3+2n}$.
  choices:
  - id: a
    text: Convergent by limit comparison with $1/n^{3/2}$
  - id: b
    text: Divergent by comparison with $1/n$
  - id: c
    text: Conditionally convergent
  - id: d
    text: Divergent by the term test
  answer:
    choiceId: a
  explanation: |-
    Multiplying by $n^{3/2}$ gives $1/\sqrt{1+2/n^2}\to1$.
- id: q007
  type: multipleChoice
  skills:
  - interpret-ratio-test-boundaries
  prompt: |
    The ratio test gives limit $1$ for $\sum1/n^3$. What is the correct
    next conclusion?
  choices:
  - id: a
    text: The ratio test is inconclusive, but the p-series test proves convergence.
  - id: b
    text: The series diverges.
  - id: c
    text: The ratio test proves conditional convergence.
  - id: d
    text: No other test may be used.
  answer:
    choiceId: a
  explanation: A ratio boundary result says nothing; the exact p-series structure gives convergence because
    three exceeds one.
- id: q008
  type: multipleChoice
  skills:
  - apply-integral-remainder-estimates
  prompt: |
    For $\sum_{n=2}^{\infty}1/[n(\ln n)^2]$, which integral gives the
    standard upper bound for the tail after N?
  choices:
  - id: a
    text: |-
      $1/\ln N$
  - id: b
    text: $1/N$
  - id: c
    text: |-
      $\ln N$
  - id: d
    text: |-
      $1/(\ln N)^2$
  answer:
    choiceId: a
  explanation: |-
    $\int_N^\infty dx/[x(\ln x)^2]=1/\ln N$.
- id: q009
  type: multipleChoice
  skills:
  - apply-comparison-to-trigonometric-terms
  prompt: |
    How does $\sum_{n=1}^{\infty}\sin n/n^2$ converge?
  choices:
  - id: a
    text: Absolutely
  - id: b
    text: Conditionally
  - id: c
    text: |-
      It diverges because $\sin n$ oscillates.
  - id: d
    text: It diverges by the term test.
  answer:
    choiceId: a
  explanation: |-
    $|\sin n|/n^2\le1/n^2$, so the absolute series converges.
- id: q010
  type: multipleChoice
  skills:
  - apply-small-angle-limit-comparison
  prompt: |
    Classify $\sum_{n=2}^{\infty}\tan(1/n)$.
  choices:
  - id: a
    text: Divergent by limit comparison with $1/n$
  - id: b
    text: Convergent by comparison with $1/n^2$
  - id: c
    text: Conditionally convergent
  - id: d
    text: Divergent because terms do not approach zero
  answer:
    choiceId: a
  explanation: |-
    $\tan(1/n)/(1/n)\to1$, so the positive series has harmonic behavior.
- id: q011
  type: multipleChoice
  skills:
  - classify-binomial-coefficient-series
  prompt: |
    What does the ratio test show for
    $\sum_{n=1}^{\infty}1/\binom{2n}{n}$?
  choices:
  - id: a
    text: Convergence, with ratio limit $1/4$
  - id: b
    text: Divergence, with ratio limit $4$
  - id: c
    text: Inconclusive, with ratio limit $1$
  - id: d
    text: Conditional convergence
  answer:
    choiceId: a
  explanation: |-
    The ratio is $(n+1)^2/[(2n+2)(2n+1)]\to1/4$.
- id: q012
  type: multipleChoice
  skills:
  - apply-dirichlets-test
  prompt: |
    Why does $\sum_{n=1}^{\infty}\cos n/n$ converge?
  choices:
  - id: a
    text: |-
      Partial sums of $\cos n$ are bounded and $1/n\downarrow0$.
  - id: b
    text: It converges absolutely by comparison with $1/n$.
  - id: c
    text: The cosine terms approach zero.
  - id: d
    text: It is geometric.
  answer:
    choiceId: a
  explanation: Dirichlet's test uses bounded coefficient partial sums and a monotone weight tending to
    zero.
- id: q013
  type: multipleChoice
  skills:
  - test-endpoint-comparison-logic
  prompt: |
    Suppose $0\le a_n\le1/n$ for every n. What can be concluded about
    $\sum a_n$ from this inequality alone?
  choices:
  - id: a
    text: Nothing definitive
  - id: b
    text: It diverges.
  - id: c
    text: It converges.
  - id: d
    text: It converges conditionally.
  answer:
    choiceId: a
  explanation: Both $a_n=1/n$ and $a_n=1/n^2$ satisfy the inequality but have opposite convergence behavior.
- id: q014
  type: multipleChoice
  skills:
  - combine-asymptotics-and-p-series
  prompt: |
    Classify $\sum_{n=2}^{\infty}(\ln n)/n^{3/2}$.
  choices:
  - id: a
    text: Convergent
  - id: b
    text: |-
      Divergent like $\sum1/n$
  - id: c
    text: Conditionally convergent
  - id: d
    text: Divergent by the term test
  answer:
    choiceId: a
  explanation: |-
    Eventually $\ln n<n^{1/4}$, making the term smaller than $1/n^{5/4}$.
- id: q015
  type: multipleChoice
  skills:
  - distinguish-conditional-and-absolute-tests
  prompt: |
    Classify $\sum_{n=2}^{\infty}(-1)^n/[n\ln n]$.
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: The magnitudes decrease to zero, but their positive series is the divergent p equals one
    logarithmic boundary.
