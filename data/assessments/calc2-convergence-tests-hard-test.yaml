- id: q001
  type: multipleChoice
  skills:
  - apply-limit-comparison-to-perturbed-terms
  prompt: |
    Classify $\displaystyle\sum_{n=2}^{\infty}\frac1{n+(-1)^n}$.
  choices:
  - id: a
    text: Divergent by limit comparison with $1/n$
  - id: b
    text: Convergent by cancellation
  - id: c
    text: Conditionally convergent
  - id: d
    text: Divergent by the term test
  answer:
    choiceId: a
  explanation: |-
    Solution: The terms are positive and their quotient with $1/n$ is $n/[n+(-1)^n]\to1$. Therefore the answer is Divergent by limit comparison with $1/n$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: Convergent by cancellation conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Conditionally convergent conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Divergent by the term test conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
- id: q002
  type: multipleChoice
  skills:
  - classify-bertrand-series
  prompt: |
    For which p does
    $\sum_{n=2}^{\infty}1/[n(\ln n)^p]$ converge?
  choices:
  - id: a
    text: $p>1$
  - id: b
    text: |-
      $p\ge1$
  - id: c
    text: $p>0$
  - id: d
    text: Every real p
  answer:
    choiceId: a
  explanation: |-
    Solution: Substitution u equals ln x turns the integral into $\int u^{-p}\,du$, whose threshold is p greater than one. Therefore the answer is $p>1$.

    Why it works: The Integral Test compares the positive tail $a_n=f(n)$ with the improper integral of a continuous, positive, eventually decreasing function $f$. The integral and series then have the same convergence behavior.

    Common trap: An antiderivative by itself is not enough; positivity and eventual decrease are required hypotheses.

    Why the other choices fail: $p\ge1$ conflicts with this criterion: The Integral Test compares the positive tail $a_n=f(n)$ with the improper integral of a continuous, positive, eventually decreasing function $f$; $p>0$ conflicts with this criterion: The Integral Test compares the positive tail $a_n=f(n)$ with the improper integral of a continuous, positive, eventually decreasing function $f$; Every real p conflicts with this criterion: The Integral Test compares the positive tail $a_n=f(n)$ with the improper integral of a continuous, positive, eventually decreasing function $f$.
