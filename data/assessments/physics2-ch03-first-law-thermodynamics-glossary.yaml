{"schemaVersion": 1, "id": "physics2-ch03-first-law-thermodynamics-glossary", "title": "First Law of Thermodynamics Glossary", "assessmentType": "glossary", "categoryId": "physics-2", "topicId": "physics2-first-law-thermodynamics", "modeDefault": "practice", "randomizeQuestions": false, "skills": ["physics2-first-law-thermodynamics"], "navigation": {"learningGoal": "learn", "activityType": "glossary", "tags": ["physics-2", "physics2-first-law-thermodynamics", "s2c-reviewed"]}, "glossary": {"introduction": "Vocabulary for modeling, calculation, and interpretation.", "sections": [{"id": "terms", "title": "Core terms", "required": true, "content": "Use definitions to distinguish quantities, processes, and assumptions.", "entries": [{"id": "t01", "term": "thermodynamic system", "definition": "A defined quantity of matter or region of space selected for study and analysis.", "drills": [{"id": "t01-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with thermodynamic system.", "answer": {"expected": "thermodynamic system"}, explanation: "Solution:\nA system is the specific focus of a thermodynamic analysis.\n\nWhy it works:\nBoundaries separate the system from its surroundings to track energy transfers."}]}, {"id": "t02", "term": "state variable", "definition": "A property that depends only on the current equilibrium state of the system, not on its history.", "drills": [{"id": "t02-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with state variable.", "answer": {"expected": "state variable"}, explanation: "Solution:\nState variables describe the 'now' of a system (e.g., P, V, T).\n\nWhy it works:\nTheir changes are path-independent, making them fundamental for defining thermodynamic states."}]}, {"id": "t03", "term": "path function", "definition": "A quantity whose value depends on the specific transition process between thermodynamic states.", "drills": [{"id": "t03-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with path function.", "answer": {"expected": "path function"}, explanation: "Solution:\nPath functions, like work and heat, depend on how a process occurs.\n\nWhy it works:\nDifferent processes between the same initial and final states can involve different amounts of work and heat."}]}, {"id": "t04", "term": "internal energy", "definition": "The total energy contained within a thermodynamic system, including kinetic and potential energy.", "drills": [{"id": "t04-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with internal energy.", "answer": {"expected": "internal energy"}, explanation: "Solution:\nInternal energy is the sum of all microscopic energies.\n\nWhy it works:\nFor an ideal gas, internal energy depends only on temperature and the number of particles."}]}, {"id": "t05", "term": "heat", "definition": "Energy transferred across a system boundary due solely to a temperature difference.", "drills": [{"id": "t05-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with heat.", "answer": {"expected": "heat"}, explanation: "Solution:\nHeat is thermal energy in transit.\n\nWhy it works:\nIt only exists during a transfer process and is not stored internally as 'heat'."}]}, {"id": "t06", "term": "work", "definition": "Energy transferred across a system boundary via macroscopic forces, such as expanding a boundary.", "drills": [{"id": "t06-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with work.", "answer": {"expected": "work"}, explanation: "Solution:\nWork is mechanical energy transfer, calculated as $\\int P \\, dV$.\n\nWhy it works:\nAn expanding gas does positive work on its surroundings."}]}, {"id": "t07", "term": "isothermal", "definition": "A thermodynamic process in which the temperature of the system remains constant.", "drills": [{"id": "t07-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with isothermal.", "answer": {"expected": "isothermal"}, explanation: "Solution:\nIsothermal processes have $\\Delta T = 0$.\n\nWhy it
works:\nFor an ideal gas, this implies the internal energy remains constant and $Q = W$."}]}, {"id": "t08", "term": "isochoric", "definition": "A thermodynamic process in which the volume of the system remains constant.", "drills": [{"id": "t08-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with isochoric.", "answer": {"expected": "isochoric"}, explanation: "Solution:\nIsochoric processes have $\\Delta V = 0$.\n\nWhy it works:\nBecause volume doesn't change, the system does no boundary work ($W = 0$)."}]}, {"id": "t09", "term": "isobaric", "definition": "A thermodynamic process in which the pressure of the system remains constant.", "drills": [{"id": "t09-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with isobaric.", "answer": {"expected": "isobaric"}, explanation: "Solution:\nIsobaric processes have constant pressure.\n\nWhy it works:\nWork done is simply $W = P \\Delta V$."}]}, {"id": "t10", "term": "adiabatic", "definition": "A thermodynamic process in which no heat is exchanged with the surroundings.", "drills": [{"id": "t10-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with adiabatic.", "answer": {"expected": "adiabatic"}, explanation: "Solution:\nAdiabatic processes have $Q = 0$.\n\nWhy it works:\nAny change in internal energy is due entirely to work done on or by the system."}]}, {"id": "t11", "term": "quasistatic", "definition": "A process that occurs infinitely slowly, ensuring the system remains in internal equilibrium.", "drills": [{"id": "t11-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with quasistatic.", "answer": {"expected": "quasistatic"}, explanation: "Solution:\nQuasistatic processes are idealized slow transitions.\n\nWhy it works:\nIt allows state variables like pressure and temperature to be well-defined at all times."}]}, {"id": "t12", "term": "pressure-volume diagram", "definition": "A graph plotting pressure versus volume, where the area under the curve represents work done.", "drills": [{"id": "t12-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with pressure-volume diagram.", "answer": {"expected": "pressure-volume diagram"}, explanation: "Solution:\nPV diagrams visually represent thermodynamic processes.\n\nWhy it works:\nThe integral $\\int P \\, dV$ corresponds exactly to the geometric area under the PV curve."}]}, {"id": "t13", "term": "heat capacity", "definition": "The amount of heat required to raise the temperature of a specific object by 1 K.", "drills": [{"id": "t13-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with heat capacity.", "answer": {"expected": "heat capacity"}, explanation: "Solution:\nHeat capacity applies to an entire object rather than per unit mass.\n\nWhy it works:\nIt is the product of the object's mass and its specific heat."}]}, {"id": "t14", "term": "first law", "definition": "The principle of energy conservation: the change in internal energy equals heat added minus work done.", "drills": [{"id": "t14-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with first law.", "answer": {"expected": "first law"}, explanation: "Solution:\nThe First Law is $\\Delta U = Q - W$.\n\nWhy it works:\nEnergy cannot be created or destroyed, only transferred as heat or work, or stored internally."}]}, {"id": "t15", "term": "reversible process", "definition": "An idealized process that can be reversed without leaving any net change in the system or surroundings.", "drills": [{"id": "t15-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with reversible process.", "answer": {"expected": "reversible process"}, explanation: "Solution:\nReversible processes generate no entropy.\n\nWhy it works:\nThey require the process to be quasistatic and perfectly free of dissipative forces like friction."}]}]}]}}
