schemaVersion: 1
id: python-sockets-conceptual-worked-example
title: Python Sockets Conceptual Worked Example
assessmentType: workedExample
categoryId: python
subcategoryIds:
  - python-networking
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Identifying sockets and their roles
    problem: "Understand what a socket represents before writing socket code."
    steps:
      - id: s001
        title: Define a socket
        instruction: "Start with the basic mental model."
        type: multipleChoice
        prompt: "What is a socket in network programming?"
        choices:
          - id: a
            text: "An endpoint a program uses to send or receive data over a network."
          - id: b
            text: "A Python list that stores every web page."
          - id: c
            text: "A type of loop used only for files."
          - id: d
            text: "A replacement for all functions."
        answer:
          choiceId: a
        hint: "Think endpoint, not storage container."
        explanation: |
          A socket is one endpoint of a communication channel. A program reads from and writes to that endpoint to communicate with another endpoint.

          Related topic: Socket endpoint model; identify the local endpoint and the remote endpoint before thinking about code.
      - id: s002
        title: Identify client and server roles
        instruction: "Most beginner socket examples use a client/server model."
        type: multipleChoice
        prompt: "Which statement best describes the usual server role?"
        choices:
          - id: a
            text: "It listens for incoming connections."
          - id: b
            text: "It always sends the first email."
          - id: c
            text: "It can only run in a browser."
          - id: d
            text: "It deletes the client's socket."
        answer:
          choiceId: a
        hint: "A server waits; a client initiates."
        explanation: |
          A server usually binds to an address, listens, and accepts incoming client connections.

          Related topic: Client/server roles; the server listens and accepts, while the client connects.
      - id: s003
        title: Recognize address pieces
        instruction: "A network endpoint is usually described by a host and port."
        type: selectAll
        prompt: "Which values usually identify where a socket should connect or listen?"
        choices:
          - id: a
            text: "Host or IP address"
          - id: b
            text: "Port number"
          - id: c
            text: "Favorite color"
          - id: d
            text: "Protocol family, such as IPv4"
        answer:
          choiceIds: [a, b, d]
        hint: "The address needs a machine/address, a port, and a protocol family."
        explanation: |
          A socket address commonly combines a host/IP and port. The socket also has a family such as `AF_INET` for IPv4 and a type such as `SOCK_STREAM` for TCP.

          Related topic: Socket addressing; choose the address family, socket type, host, and port before calling connect or bind.
      - id: s004
        title: Distinguish TCP from UDP
        instruction: "Socket type affects the communication style."
        type: multipleChoice
        prompt: "For a basic reliable byte-stream connection, which socket type is commonly used?"
        choices:
          - id: a
            text: "`socket.SOCK_STREAM`"
          - id: b
            text: "`socket.SOCK_RANDOM`"
          - id: c
            text: "`socket.SOCK_FILE`"
          - id: d
            text: "`socket.SOCK_LOOP`"
        answer:
          choiceId: a
        hint: "TCP is stream-oriented."
        explanation: |
          `SOCK_STREAM` is used for TCP-style reliable byte streams. `SOCK_DGRAM` is used for UDP-style datagrams.

          Related topic: Socket type selection; use `AF_INET` plus `SOCK_STREAM` for a basic IPv4 TCP socket.
      - id: s005
        title: Explain the model
        instruction: "Summarize the conceptual pieces before writing code."
        type: freeResponse
        prompt: "Explain the difference between a client socket and a server socket in a simple TCP example."
        answer:
          expected: |
            The server socket binds to a host and port, listens, and accepts connections. The client socket connects to the server's host and port. After connection, both sides can send and receive bytes.
          gradingMode: selfCheck
          keyPoints:
            - "Server binds/listens/accepts."
            - "Client connects."
            - "Both use host and port information."
            - "Connected sockets exchange bytes."
        hint: "Use the words listen, accept, connect, and bytes."
        explanation: |
          The server creates a listening endpoint. The client creates a connecting endpoint. Once the server accepts the client, the accepted connection socket and the client socket can exchange bytes.

          Related topic: TCP socket roles; server waits for connections, client initiates, then both communicate over the established connection.
