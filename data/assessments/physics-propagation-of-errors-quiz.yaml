schemaVersion: 1
id: physics-propagation-of-errors-quiz
title: Propagation of Errors
assessmentType: quiz
categoryId: physics-1
subcategoryIds:
- physics-measurement-error
skills:
- physics-measurement-error
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  prompt: 'If $z=x+y$ and no assumption is made about random independent errors, which
    uncertainty rule is most conservative?

    '
  choices:
  - id: a
    text: $\delta z=\delta x+\delta y$
  - id: b
    text: $\delta z=\sqrt{(\delta x)^2+(\delta y)^2}$
  - id: c
    text: $\frac{\delta z}{z}=\frac{\delta x}{x}$
  - id: d
    text: $\delta z=0$
  answer:
    choiceId: a
  explanation: 'For addition and subtraction, conservative absolute uncertainties
    add. Related topic: absolute error propagation for sums.

    '
- id: q002
  type: multipleChoice
  prompt: 'If $z=x-y$ with independent random errors, which uncertainty rule is usually
    used?

    '
  choices:
  - id: a
    text: $\delta z=\sqrt{(\delta x)^2+(\delta y)^2}$
  - id: b
    text: $\delta z=\delta x-\delta y$
  - id: c
    text: $\delta z=\delta x+\delta y$ only
  - id: d
    text: $\frac{\delta z}{z}=\frac{\delta x}{x}+\frac{\delta y}{y}$
  answer:
    choiceId: a
  explanation: 'Independent random errors combine in quadrature. Related topic: quadrature
    for sums and differences.

    '
- id: q003
  type: multipleChoice
  prompt: 'If $z=xy$, which kind of uncertainty is easiest to combine first?

    '
  choices:
  - id: a
    text: Fractional uncertainty
  - id: b
    text: Absolute uncertainty only
  - id: c
    text: Angular uncertainty
  - id: d
    text: No uncertainty
  answer:
    choiceId: a
  explanation: 'Products and quotients use relative or fractional uncertainty. Related
    topic: fractional error propagation.

    '
- id: q004
  type: multipleChoice
  prompt: 'If $z=\frac{x}{y}$ without assuming independent random errors, which rule
    is appropriate?

    '
  choices:
  - id: a
    text: $\frac{\delta z}{|z|}=\frac{\delta x}{|x|}+\frac{\delta y}{|y|}$
  - id: b
    text: $\delta z=\delta x+\delta y$
  - id: c
    text: $\delta z=\frac{x}{y}$
  - id: d
    text: $\delta z=\delta x-\delta y$
  answer:
    choiceId: a
  explanation: 'Division uses fractional uncertainty just like multiplication. Related
    topic: relative uncertainty for quotients.

    '
- id: q005
  type: multipleChoice
  prompt: 'If $y=x^3$, what is the propagated fractional uncertainty?

    '
  choices:
  - id: a
    text: $\frac{\delta y}{|y|}=3\frac{\delta x}{|x|}$
  - id: b
    text: $\frac{\delta y}{|y|}=\frac{1}{3}\frac{\delta x}{|x|}$
  - id: c
    text: $\delta y=\delta x+3$
  - id: d
    text: $\delta y=0$
  answer:
    choiceId: a
  explanation: 'Power rules multiply fractional uncertainty by the absolute exponent.
    Related topic: error propagation for powers.

    '
- id: q006
  type: multipleChoice
  prompt: 'If $y=f(x)$, what does $\left|\frac{df}{dx}\right|$ represent in first-order
    uncertainty propagation?

    '
  choices:
  - id: a
    text: The sensitivity of the output to the input
  - id: b
    text: The number of trials performed
  - id: c
    text: The exact error in every experiment
  - id: d
    text: The unit conversion factor only
  answer:
    choiceId: a
  explanation: 'The derivative measures local sensitivity. Related topic: local linear
    a\approximation.

    '
- id: q007
  type: multipleChoice
  prompt: 'If $y=5x$ and $\delta x=0.20$, what is $\delta y$?

    '
  choices:
  - id: a
    text: $1.0$
  - id: b
    text: $0.20$
  - id: c
    text: $5.2$
  - id: d
    text: $25$
  answer:
    choiceId: a
  explanation: 'Use $\delta y=\left|\frac{dy}{dx}\right|\delta x=5(0.20)=1.0$. Related
    topic: derivative sensitivity.

    '
- id: q008
  type: multipleChoice
  prompt: 'If $z=f(x,y)$, which tools measure the separate sensitivity to $x$ and
    $y$?

    '
  choices:
  - id: a
    text: Partial derivatives
  - id: b
    text: Only significant figures
  - id: c
    text: Only the average of $x$ and $y$
  - id: d
    text: Only unit cancellation
  answer:
    choiceId: a
  explanation: 'Partial derivatives isolate\rhow the output changes with respect to
    one input at a time. Related topic: multivariable uncertainty propagation.

    '
- id: q009
  type: multipleChoice
  prompt: 'Which statement best describes when quadrature is appropriate?

    '
  choices:
  - id: a
    text: When errors are treated as random and independent
  - id: b
    text: Whenever variables are multiplied
  - id: c
    text: Only when uncertainty is zero
  - id: d
    text: Only for exact theoretical values
  answer:
    choiceId: a
  explanation: 'Quadrature depends on the assumption that random independent errors
    combine statistically. Related topic: assumptions behind error models.

    '
- id: q010
  type: multipleChoice
  prompt: 'Why is it important to identify the operation before propagating uncertainty?

    '
  choices:
  - id: a
    text: Because sums use absolute uncertainty while products and quotients use fractional
      uncertainty.
  - id: b
    text: Because every operation uses exactly the same rule.
  - id: c
    text: Because uncertainty is ignored after calculation.
  - id: d
    text: Because units are never relevant.
  answer:
    choiceId: a
  explanation: 'The operation determines the correct uncertainty structure. Related
    topic: choosing an uncertainty propagation rule.

    '
