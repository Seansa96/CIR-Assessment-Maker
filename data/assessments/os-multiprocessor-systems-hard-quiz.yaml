- id: q001
  title: Apply Parallelism versus speedup
  type: multipleChoice
  prompt: A system design discussion mentions **Parallelism versus speedup**. Which conclusion is most defensible?
  choices:
  - id: a
    text: More cores do not guarantee proportional speedup.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: More cores do not guarantee proportional speedup. This is why Parallelism versus speedup matters in Multiple Processor Systems.
