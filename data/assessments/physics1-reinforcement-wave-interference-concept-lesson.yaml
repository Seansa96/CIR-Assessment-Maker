lesson:
  introduction: Interference adds instantaneous displacements, while reflection changes phase according to the boundary. These rules explain nodes, antinodes, and standing-wave patterns.
  sections:
  - id: physics1-reinforcement-interference-s1
    title: Add displacements
    required: true
    content: 'Superposition is linear: the net displacement is the signed sum of each wave''s displacement at the same position and time.'
    check:
      id: physics1-reinforcement-interference-s1-check
      type: multipleChoice
      prompt: Two pulses meet with displacements $+3\,\mathrm{cm}$ and $-1\,\mathrm{cm}$. What is the instantaneous resultant?
      choices:
      - { id: a, text: '$+2\,\mathrm{cm}$' }
      - { id: b, text: '$+4\,\mathrm{cm}$', issueSignals: [{ id: physics1-interference-sign-error, domains: [physics-1] }] }
      - { id: c, text: '$-2\,\mathrm{cm}$', issueSignals: [{ id: physics1-interference-direction-error, domains: [physics-1] }] }
      - { id: d, text: '$+3\,\mathrm{cm}$ because the larger pulse dominates', issueSignals: [{ id: physics1-interference-superposition-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: Add signed displacements: $3+(-1)=2\,\mathrm{cm}$. Why it works: Superposition adds wave amplitudes at the instant of overlap. Why the other choices fail: b ignores the negative sign, c reverses the sum, and d ignores the smaller contribution.'
    difficultyDimensions: [sign, superposition]
    difficultyEvidence: Performs signed displacement addition.
  - id: physics1-reinforcement-interference-s2
    title: Identify constructive interference
    required: true
    content: In-phase waves reinforce; equal-amplitude out-of-phase waves cancel. Phase difference, not source label, determines the result.
    check:
      id: physics1-reinforcement-interference-s2-check
      type: multipleChoice
      prompt: Two equal sinusoidal waves arrive in phase at point P. What happens there?
      choices:
      - { id: a, text: 'Their amplitudes add constructively' }
      - { id: b, text: 'They cancel because there are two waves', issueSignals: [{ id: physics1-interference-count-error, domains: [physics-1] }] }
      - { id: c, text: 'The frequency doubles while displacement stays zero', issueSignals: [{ id: physics1-interference-frequency-error, domains: [physics-1] }] }
      - { id: d, text: 'The waves stop at P', issueSignals: [{ id: physics1-interference-propagation-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: Equal in-phase displacements have the same sign and add. Why it works: Phase alignment determines constructive interference. Why the other choices fail: Wave count alone does not imply cancellation, and interference does not stop propagation or change frequency in this way.'
    difficultyDimensions: [phase, superposition]
    difficultyEvidence: Uses phase relationship rather than wave count.
  - id: physics1-reinforcement-interference-s3
    title: Read reflection phase
    required: true
    content: A pulse reflecting from a fixed end inverts; reflection from a free end does not invert. This boundary phase controls node placement.
    check:
      id: physics1-reinforcement-interference-s3-check
      type: multipleChoice
      prompt: A positive pulse reflects from a rigid fixed end. What is the reflected pulse immediately after reflection?
      choices:
      - { id: a, text: 'An inverted negative pulse' }
      - { id: b, text: 'An upright positive pulse', issueSignals: [{ id: physics1-reflection-fixed-end-phase, domains: [physics-1] }] }
      - { id: c, text: 'A pulse with twice the speed', issueSignals: [{ id: physics1-reflection-speed-error, domains: [physics-1] }] }
      - { id: d, text: 'No reflected pulse', issueSignals: [{ id: physics1-reflection-existence-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: A fixed end enforces zero displacement, requiring phase inversion on reflection. Why it works: The reflected and incident pulses cancel at the boundary. Why the other choices fail: Upright reflection belongs to a free-end condition, and reflection does not double speed or vanish.'
    difficultyDimensions: [boundaryCondition, sign]
    difficultyEvidence: Infers reflection phase from the endpoint constraint.
  - id: physics1-reinforcement-interference-s4
    title: Locate standing-wave nodes
    required: true
    content: A standing wave is the sum of opposite-traveling waves. Nodes are fixed zero-amplitude points; antinodes have maximum amplitude.
    check:
      id: physics1-reinforcement-interference-s4-check
      type: multipleChoice
      prompt: Which statement identifies a node in an ideal standing wave?
      choices:
      - { id: a, text: 'It is a location where destructive interference keeps displacement zero' }
      - { id: b, text: 'It is where amplitude is largest', issueSignals: [{ id: physics1-standing-wave-node-antinode-swap, domains: [physics-1] }] }
      - { id: c, text: 'It moves at the wave speed', issueSignals: [{ id: physics1-standing-wave-motion-error, domains: [physics-1] }] }
      - { id: d, text: 'It exists only at a free end', issueSignals: [{ id: physics1-standing-wave-boundary-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: At a node, the two opposite waves cancel for all time. Why it works: A standing-wave node is fixed in space and has zero amplitude. Why the other choices fail: Maximum amplitude describes an antinode, and nodes need not be confined to one boundary type.'
    difficultyDimensions: [representation, interference]
    difficultyEvidence: Distinguishes spatial node structure from traveling-wave motion.
