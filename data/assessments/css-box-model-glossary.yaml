glossary:
  introduction: Review these terms for CSS Box Model Glossary.
  sections:
  - id: main-terms
    title: Core Terms
    required: true
    entries:
    - id: content-box
      term: Content Box
      definition: The area where your content is displayed.
      drills:
      - id: content-box-drill
        type: typed
        prompt: 'What is the term for: The area where your content is displayed.?'
        answer:
          expected: Content Box
          aliases:
          - content box
        explanation: The term is Content Box.
    - id: padding-box
      term: Padding Box
      definition: The space around the content, inside of any defined borders.
      drills:
      - id: padding-box-drill
        type: typed
        prompt: 'What is the term for: The space around the content, inside of any defined borders.?'
        answer:
          expected: Padding Box
          aliases:
          - padding box
        explanation: The term is Padding Box.
    - id: border-box
      term: Border Box
      definition: The border that goes around the padding and content.
      drills:
      - id: border-box-drill
        type: typed
        prompt: 'What is the term for: The border that goes around the padding and content.?'
        answer:
          expected: Border Box
          aliases:
          - border box
        explanation: The term is Border Box.
    - id: margin-box
      term: Margin Box
      definition: The space outside the border.
      drills:
      - id: margin-box-drill
        type: typed
        prompt: 'What is the term for: The space outside the border.?'
        answer:
          expected: Margin Box
          aliases:
          - margin box
        explanation: The term is Margin Box.
