schemaVersion: 1
id: css-box-model-glossary
title: The CSS Box Model Glossary
assessmentType: glossary
categoryId: css
subcategoryIds:
  - css-box-model
modeDefault: study
glossary:
  - id: content-box
    term: Content Box
    definition: The innermost part of the box where text, images, or other content appears.
  - id: padding
    term: Padding
    definition: Transparent space immediately surrounding the content. It clears an area around the content and inherits the element's background color.
  - id: border
    term: Border
    definition: A line that wraps around the padding (or content, if no padding). It can have various styles, widths, and colors.
  - id: margin
    term: Margin
    definition: Transparent space outside the border. It pushes surrounding elements away to create layout spacing.
  - id: box-sizing
    term: box-sizing
    definition: A CSS property that defines how the total width and height of an element are calculated. By default, it is `content-box`.
  - id: border-box
    term: border-box
    definition: A value for `box-sizing` that forces the browser to include padding and border within the specified width and height of an element.
