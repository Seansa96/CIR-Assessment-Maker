lesson:
  introduction: |
    Parametric derivatives are about comparing two rates of change. Instead of asking how $y$ changes directly with $x$, you ask how both $x$ and $y$ change with respect to the parameter $t$, then divide those rates carefully.

    The main workflow is:

    1. Compute $\frac{dx}{dt}$ and $\frac{dy}{dt}$.
    2. Use $\frac{dy}{dx}=\frac{dy/dt}{dx/dt}$ when $\frac{dx}{dt}\ne0$.
    3. Use the numerator and denominator separately to classify horizontal and vertical tangents.
    4. Use $\frac{d^2y}{dx^2}=\frac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}{\frac{dx}{dt}}$ for concavity.
  sections:
    - id: velocity-components-to-slope
      title: Slope from Component Rates
      required: true
      content: |
        A parametric curve gives position as

        $$
        x=f(t),\qquad y=g(t).
        $$

        The derivatives $\frac{dx}{dt}$ and $\frac{dy}{dt}$ are the horizontal and vertical rates of motion. The tangent slope compares vertical change to horizontal change:

        $$
        \frac{dy}{dx}=\frac{\frac{dy}{dt}}{\frac{dx}{dt}}.
        $$

        ![A parametric curve with horizontal and vertical tangent types marked](/assessments/calc2-parametric-polar/parametric-derivatives-tangent-types.svg)
      check:
        id: velocity-components-to-slope-check
        type: multipleChoice
        prompt: Why does $\frac{dy}{dx}$ equal $\frac{dy/dt}{dx/dt}$?
        choices:
          - id: a
            text: It compares vertical rate per unit time to horizontal rate per unit time.
          - id: b
            text: It compares $x$ to $y$ directly.
          - id: c
            text: It avoids using the chain rule.
          - id: d
            text: It is always equal to $\frac{dx}{dy}$.
        answer:
          choiceId: a
        explanation: |
          Since $\frac{dy}{dt}$ measures vertical change per time and $\frac{dx}{dt}$ measures horizontal change per time, dividing them gives vertical change per horizontal change.

    - id: tangent-line-construction
      title: Building the Tangent Line
      required: true
      content: |
        To construct a tangent line at $t=t_0$, you need two pieces:

        1. The point:

        $$
        (x(t_0),y(t_0)).
        $$

        2. The slope:

        $$
        m=\left.\frac{dy/dt}{dx/dt}\right|_{t=t_0}.
        $$

        Then use point-slope form:

        $$
        y-y(t_0)=m(x-x(t_0)).
        $$
      check:
        id: tangent-line-construction-check
        type: multipleChoice
        prompt: To write a tangent line for a parametric curve at $t=t_0$, which information is required?
        choices:
          - id: a
            text: The point at $t_0$ and the slope at $t_0$.
          - id: b
            text: Only $\frac{dx}{dt}$.
          - id: c
            text: Only the graph's intercepts.
          - id: d
            text: The full Cartesian equation only.
        answer:
          choiceId: a
        explanation: |
          A tangent line is still a line. You need a point and a slope; parametric calculus tells you how to compute both from $t$.

    - id: horizontal-vertical-tangent-rules
      title: Horizontal and Vertical Tangents
      required: true
      content: |
        The formula

        $$
        \frac{dy}{dx}=\frac{dy/dt}{dx/dt}
        $$

        separates tangent classification into numerator and denominator checks.

        A horizontal tangent occurs when:

        $$
        \frac{dy}{dt}=0,\qquad \frac{dx}{dt}\ne0.
        $$

        A vertical tangent occurs when:

        $$
        \frac{dx}{dt}=0,\qquad \frac{dy}{dt}\ne0.
        $$

        If both are zero at the same parameter value, the formula is inconclusive. That may indicate a cusp, corner, self-intersection, or another singular behavior.
      check:
        id: horizontal-vertical-tangent-rules-check
        type: multipleChoice
        prompt: Which condition gives a vertical tangent?
        choices:
          - id: a
            text: '$\frac{dx}{dt}=0$ and $\frac{dy}{dt}\ne0$'
          - id: b
            text: '$\frac{dy}{dt}=0$ and $\frac{dx}{dt}\ne0$'
          - id: c
            text: '$\frac{dx}{dt}=\frac{dy}{dt}=1$'
          - id: d
            text: '$x(t)=y(t)$'
        answer:
          choiceId: a
        explanation: |
          A vertical tangent has undefined slope because the horizontal rate is zero while the vertical rate is not zero.

    - id: singular-points-and-cusps
      title: Singular Points and Cusps
      required: true
      content: |
        When

        $$
        \frac{dx}{dt}=0
        $$

        and

        $$
        \frac{dy}{dt}=0
        $$

        at the same value of $t$, the tangent slope formula becomes $\frac{0}{0}$. Do not label this automatically as horizontal or vertical.

        Instead, inspect behavior near the parameter value. You may need to:

        - simplify the curve,
        - take a limit of $\frac{dy/dt}{dx/dt}$,
        - check one-sided behavior,
        - determine whether the curve stops, reverses, crosses itself, or forms a cusp.
      check:
        id: singular-points-and-cusps-check
        type: multipleChoice
        prompt: If both $\frac{dx}{dt}$ and $\frac{dy}{dt}$ are zero at the same $t$, what should you conclude immediately?
        choices:
          - id: a
            text: The usual slope formula is inconclusive there.
          - id: b
            text: The tangent is definitely horizontal.
          - id: c
            text: The tangent is definitely vertical.
          - id: d
            text: The curve does not exist.
        answer:
          choiceId: a
        explanation: |
          The form $\frac{0}{0}$ needs more analysis. It can signal important geometry, but it is not automatically a horizontal or vertical tangent.

    - id: second-derivative-logic
      title: Second Derivative and Concavity
      required: true
      content: |
        The second derivative measures how the slope changes with respect to $x$, not with respect to $t$.

        Start with:

        $$
        \frac{dy}{dx}.
        $$

        Differentiate it with respect to $t$, then convert from $t$-change to $x$-change:

        $$
        \frac{d^2y}{dx^2}
        =
        \frac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}
        {\frac{dx}{dt}}.
        $$

        The extra division by $\frac{dx}{dt}$ is the most common place to lose the chain rule.
      check:
        id: second-derivative-logic-check
        type: multipleChoice
        prompt: What is the correct parametric second derivative formula?
        choices:
          - id: a
            text: '$\frac{d^2y}{dx^2}=\frac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}{\frac{dx}{dt}}$'
          - id: b
            text: '$\frac{d^2y}{dx^2}=\frac{d}{dt}\left(\frac{dy}{dx}\right)$'
          - id: c
            text: '$\frac{d^2y}{dx^2}=\frac{dx/dt}{dy/dt}$'
          - id: d
            text: '$\frac{d^2y}{dx^2}=x''(t)+y''(t)$'
        answer:
          choiceId: a
        explanation: |
          Differentiating with respect to $x$ means applying $\frac{d}{dx}=\frac{1}{dx/dt}\frac{d}{dt}$.

    - id: derivative-workflow-summary
      title: Full Parametric Derivative Workflow
      required: true
      content: |
        Use this decision order:

        1. Compute $\frac{dx}{dt}$ and $\frac{dy}{dt}$.
        2. Find the point by substituting the target $t$ into $x(t)$ and $y(t)$.
        3. For ordinary slope, compute $\frac{dy/dt}{dx/dt}$.
        4. For horizontal tangents, solve $\frac{dy}{dt}=0$ and check $\frac{dx}{dt}\ne0$.
        5. For vertical tangents, solve $\frac{dx}{dt}=0$ and check $\frac{dy}{dt}\ne0$.
        6. For concavity, compute $\frac{d^2y}{dx^2}$ and study its sign.
        7. If both component derivatives vanish, slow down and analyze the local behavior.
      check:
        id: derivative-workflow-summary-check
        type: multipleChoice
        prompt: Which step should come before classifying horizontal and vertical tangents?
        choices:
          - id: a
            text: Compute both $\frac{dx}{dt}$ and $\frac{dy}{dt}$.
          - id: b
            text: Assume the tangent is horizontal.
          - id: c
            text: Convert every curve to Cartesian form.
          - id: d
            text: Ignore parameter values where a derivative is zero.
        answer:
          choiceId: a
        explanation: |
          Horizontal and vertical tangent tests are built directly from the component derivatives.

