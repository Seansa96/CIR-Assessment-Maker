schemaVersion: 1
id: precalculus-binomial-theorem-recall
title: Binomial Theorem Practical Recall
assessmentType: recallDrill
categoryId: precalculus
subcategoryId: precalc-binomial
subcategoryIds:
  - precalc-binomial
modeDefault: practice
randomizeQuestions: false
items:
  - id: binomial-general-term
    type: symbolic
    prompt: |
      Recall the general term in the expansion of $(a+b)^n$.
    answer:
      expectedLatex: '\binom{n}{k}a^{n-k}b^k'
      aliases:
        - n choose k a to n minus k b to k
    explanation: |
      This is the core structure. The exponent on $a$ decreases, the exponent on $b$ increases, and $\binom{n}{k}$ counts how many ways the term appears.
    tags:
      - binomial-theorem
      - general-term

  - id: binomial-coefficient-name
    type: cloze
    prompt: |
      Complete:

      The coefficient $\binom{n}{k}$ is read as "n ____ k."
    answer:
      expected: choose
    explanation: |
      $\binom{n}{k}$ is read "n choose k." It counts combinations.
    tags:
      - binomial-coefficients

  - id: pascal-row-four
    type: typed
    prompt: |
      Write the coefficient row for $(a+b)^4$.
    answer:
      expected: 1, 4, 6, 4, 1
      aliases:
        - 1 4 6 4 1
    explanation: |
      The fourth row is $1,4,6,4,1$, which appears in expansions like $(a+b)^4$.
    tags:
      - pascals-triangle
      - binomial-coefficients

  - id: signed-term-flashcard
    type: flashcard
    prompt: |
      In $(a-b)^n$, what is the practical way to handle the minus sign?
    answer:
      expected: Treat the expression as $(a+(-b))^n$ so the sign is included in the $b^k$ part of each term.
    explanation: |
      This keeps signs organized. Odd powers of $-b$ are negative and even powers are positive.
    tags:
      - signed-binomial

  - id: coefficient-extraction
    type: flashcard
    prompt: |
      If you only need one coefficient from a binomial expansion, what should you use?
    answer:
      expected: Use the general term and solve for the exponent that matches the requested power.
    explanation: |
      You do not need to expand the entire polynomial. Match the desired power, then compute that one term.
    tags:
      - coefficient-extraction

  - id: binomial-sum-exponents
    type: cloze
    prompt: |
      Complete:

      In every term of $(a+b)^n$, the exponents on $a$ and $b$ add to ____.
    answer:
      expected: n
    explanation: |
      The term $\binom{n}{k}a^{n-k}b^k$ has exponents $(n-k)+k=n$.
    tags:
      - binomial-theorem
      - exponent-patterns
