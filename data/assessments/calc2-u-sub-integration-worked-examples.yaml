workedExamples:
- id: polynomial-inside-power
  title: A direct inner-function substitution
  problem: 'Evaluate $\int x(x^2+4)^5\,dx$.'
  steps:
  - id: p1-choose
    title: Identify the pair
    instruction: The power has inner expression $x^2+4$, and its derivative is $2x$. The x factor is present up to the constant 2.
    type: freeResponse
    prompt: 'Write a suitable u and du.'
    answer: { gradingMode: selfCheck, checkModel: '$u=x^2+4$, $du=2x\,dx$.' }
    explanation: Use the inner expression and write its complete differential.
    media: [{ type: image, src: /media/calculus/u-substitution-flow.svg, alt: A substitution flow matching an inner expression and its derivative, caption: Identify both pieces before transforming the integral. }]
  - id: p1-transform
    title: Account for the missing factor
    instruction: 'Since $x\,dx=du/2$, replace every part of the integral: $\frac12\int u^5\,du$.'
    type: freeResponse
    prompt: 'What is the transformed integral in u?'
    answer: { gradingMode: selfCheck, checkModel: '$\frac12\int u^5\,du$.' }
    explanation: The factor one-half is essential because $du$ contains $2x\,dx$.
  - id: p1-finish
    title: Integrate and return
    instruction: Integrate $u^5$, multiply by one-half, then substitute $u=x^2+4$ back into the result.
    type: freeResponse
    prompt: 'Give the antiderivative in x.'
    answer: { gradingMode: selfCheck, checkModel: '$(x^2+4)^6/12+C$.' }
    explanation: Differentiating $(x^2+4)^6/12$ gives $x(x^2+4)^5$.
- id: definite-exponential
  title: A definite integral with changed bounds
  problem: 'Evaluate $\int_0^1 2x e^{x^2}\,dx$.'
  steps:
  - id: p2-map-bounds
    title: Convert the variable and bounds
    instruction: Use $u=x^2$, so $du=2x\,dx$. The x-bounds 0 and 1 map to u-bounds 0 and 1.
    type: freeResponse
    prompt: 'Write the transformed definite integral.'
    answer: { gradingMode: selfCheck, checkModel: '$\int_0^1 e^u\,du$.' }
    explanation: Both limits happen to stay numerically the same, but they were still converted.
    media: [{ type: image, src: /media/calculus/u-substitution-flow.svg, alt: A flow diagram showing a definite integral changing from x bounds to u bounds, caption: Convert bounds rather than returning to x. }]
  - id: p2-evaluate
    title: Evaluate in u
    instruction: The antiderivative of $e^u$ is $e^u$. Evaluate it at the converted bounds.
    type: freeResponse
    prompt: 'What is the numerical value?'
    answer: { gradingMode: selfCheck, checkModel: '$e-1$.' }
    explanation: $e^1-e^0=e-1$.
  - id: p2-check
    title: Check the workflow
    instruction: Because the calculation finished in u, do not substitute x back into an antiderivative before evaluating the bounds.
    type: freeResponse
    prompt: 'State the common bounds error this workflow avoids.'
    answer: { gradingMode: selfCheck, checkModel: 'Mixing x-bounds with a u-antiderivative, or changing bounds and then substituting back.' }
    explanation: A definite integral must use matching variable and bounds throughout its evaluation.
- id: trig-with-constant
  title: A trigonometric inner expression
  problem: 'Evaluate $\int \sin(3x)\cos(3x)\,dx$.'
  steps:
  - id: p3-choose
    title: Choose a function whose differential is present
    instruction: Let $u=\sin(3x)$. Then $du=3\cos(3x)\,dx$, so the original cosine differential contributes a factor of one-third.
    type: freeResponse
    prompt: 'Write the transformed integral.'
    answer: { gradingMode: selfCheck, checkModel: '$\frac13\int u\,du$.' }
    explanation: The coefficient 3 in the chain rule becomes the compensating factor one-third.
    media: [{ type: image, src: /media/calculus/u-substitution-flow.svg, alt: A substitution flow from a trigonometric composite to a power of u, caption: Chain-rule constants must be preserved. }]
  - id: p3-integrate
    title: Integrate the u expression
    instruction: Apply the power rule to $u$.
    type: freeResponse
    prompt: 'What is the u-antiderivative before substituting back?'
    answer: { gradingMode: selfCheck, checkModel: '$u^2/6+C$.' }
    explanation: One-third times $u^2/2$ is $u^2/6$.
  - id: p3-return
    title: Return and verify
    instruction: Replace u with $\sin(3x)$ and differentiate mentally to check the factor.
    type: freeResponse
    prompt: 'Give the final antiderivative.'
    answer: { gradingMode: selfCheck, checkModel: '$\sin^2(3x)/6+C$.' }
    explanation: Differentiation gives $(1/6)\cdot2\sin(3x)\cdot3\cos(3x)$.
