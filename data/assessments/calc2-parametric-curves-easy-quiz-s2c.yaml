questions:
  - { id: q001, type: multipleChoice, prompt: 'For $x=t-1,y=t^2$, what point occurs at $t=3$?', choices: [{ id: a, text: '$(2,9)$' }, { id: b, text: '$(3,8)$' }, { id: c, text: '$(2,3)$' }, { id: d, text: '$(9,2)$' }], answer: { choiceId: a }, explanation: 'Solution: x equals 3 minus 1 equals 2 and y equals 3 squared equals 9. Why it works: Both coordinates use t equals 3. Common trap: Interchanging coordinates. Why the other choices fail: They use an incorrect substitution or reversed ordered pair.', difficultyDimensions: [representationTransfer, simplification], difficultyEvidence: 'Evaluates a shared parameter in two coordinate rules.' , issueSignals: [{ id: parametric-derivative-error }, { id: expression-equation-recognition-error }, { id: chain-rule-missed }, { id: conic-section-misidentified }, { id: trigonometric-identity-misapplied }]}
  - { id: q002, type: multipleChoice, prompt: 'Eliminate t from $x=t+2,y=4t-1$.', choices: [{ id: a, text: '$y=4x-9$' }, { id: b, text: '$y=4x-1$' }, { id: c, text: '$y=x-9$' }, { id: d, text: '$y=4x+9$' }], answer: { choiceId: a }, explanation: 'Solution: t equals x minus 2, so y equals 4x minus 8 minus 1 equals 4x minus 9. Why it works: Substitute the solved parameter into y. Common trap: Using x plus 2. Why the other choices fail: Each has a wrong inverse or arithmetic sign.', difficultyDimensions: [representationTransfer, simplification], difficultyEvidence: 'Solves for t and simplifies a substitution.' , issueSignals: [{ id: parametric-derivative-error }, { id: expression-equation-recognition-error }, { id: chain-rule-missed }, { id: conic-section-misidentified }, { id: trigonometric-identity-misapplied }]}
  - { id: q003, type: multipleChoice, prompt: 'For $x=\cos t,y=\sin t$, which way does the trace initially move from $(1,0)$?', choices: [{ id: a, text: upward }, { id: b, text: downward }, { id: c, text: leftward }, { id: d, text: rightward }], answer: { choiceId: a }, explanation: 'Solution: For small positive t, sine is positive while cosine is still near one. Why it works: Nearby parameter values reveal orientation. Common trap: Assuming clockwise motion. Why the other choices fail: They contradict the initial sine/cosine changes.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: 'Interprets a nearby parameter change as directed motion.' , issueSignals: [{ id: parametric-derivative-error }, { id: expression-equation-recognition-error }, { id: chain-rule-missed }, { id: conic-section-misidentified }, { id: trigonometric-identity-misapplied }]}
  - { id: q004, type: multipleChoice, prompt: 'What restriction accompanies $x=t^2,y=t^2-4$ after elimination?', choices: [{ id: a, text: '$x\ge0$' }, { id: b, text: '$x\le0$' }, { id: c, text: 'all x' }, { id: d, text: '$x\ne0$' }], answer: { choiceId: a }, explanation: 'Solution: x is a real square, so x is at least zero. Why it works: Elimination does not remove domain restrictions. Common trap: Keeping the whole line y equals x minus 4. Why the other choices fail: Squares can equal zero but cannot be negative.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: 'Eliminates a shared expression while retaining its domain.' , issueSignals: [{ id: parametric-derivative-error }, { id: expression-equation-recognition-error }, { id: chain-rule-missed }, { id: conic-section-misidentified }, { id: trigonometric-identity-misapplied }]}
  - { id: q005, type: multipleChoice, prompt: 'A full unit-circle trace of $(\cos(2u),\sin(2u))$ occurs on which interval?', choices: [{ id: a, text: '$0\le u\le\pi$' }, { id: b, text: '$0\le u\le2\pi$' }, { id: c, text: '$0\le u\le\pi/2$' }, { id: d, text: '$0\le u\le1$' }], answer: { choiceId: a }, explanation: 'Solution: The angular argument 2u must advance by 2 pi, so u advances by pi. Why it works: One circle trace is one full angular revolution. Common trap: Reusing the usual t interval and tracing twice. Why the other choices fail: They undertrace or overtrace.', difficultyDimensions: [parameterThreshold, representationTransfer], difficultyEvidence: 'Relates transformed parameter rate to a full angular cycle.' , issueSignals: [{ id: parametric-derivative-error }, { id: expression-equation-recognition-error }, { id: chain-rule-missed }, { id: conic-section-misidentified }, { id: trigonometric-identity-misapplied }]}
  - { id: q006, type: multipleChoice, prompt: 'Which information is not supplied by $x^2+y^2=1$ alone?', choices: [{ id: a, text: orientation }, { id: b, text: locus }, { id: c, text: radius }, { id: d, text: center }], answer: { choiceId: a }, explanation: 'Solution: Orientation requires a parameterization or arrows. Why it works: The equation describes an unordered point set. Common trap: Reading counterclockwise into every circle. Why the other choices fail: The locus, radius, and center follow from the equation.', difficultyDimensions: [representationTransfer, proofJustification], difficultyEvidence: 'Distinguishes set-based Cartesian data from directed trace data.' , issueSignals: [{ id: parametric-derivative-error }, { id: expression-equation-recognition-error }, { id: chain-rule-missed }, { id: conic-section-misidentified }, { id: trigonometric-identity-misapplied }]}
  - { id: q007, type: multipleChoice, prompt: 'For $x=2+3\cos t,y=-1+3\sin t$, what is the center?', choices: [{ id: a, text: '$(2,-1)$' }, { id: b, text: '$(3,3)$' }, { id: c, text: '$(-2,1)$' }, { id: d, text: '$(2,3)$' }], answer: { choiceId: a }, explanation: 'Solution: The constants outside sine and cosine translate the center to $(2,-1)$. Why it works: The radius terms are the trig coefficients. Common trap: Using the radius as a coordinate. Why the other choices fail: They confuse translation and radius data.', difficultyDimensions: [representationTransfer, simplification], difficultyEvidence: 'Separates translation constants from radius coefficients.' , issueSignals: [{ id: parametric-derivative-error }, { id: expression-equation-recognition-error }, { id: chain-rule-missed }, { id: conic-section-misidentified }, { id: trigonometric-identity-misapplied }]}
  - { id: q008, type: multipleChoice, prompt: '![Directed trace](/media/calculus/parametric-review-trace.svg) What extra data does the arrow add to the locus?', choices: [{ id: a, text: parameter order }, { id: b, text: a new Cartesian equation }, { id: c, text: a radius }, { id: d, text: an asymptote }], answer: { choiceId: a }, explanation: 'Solution: The arrow gives parameter order or orientation. Why it works: It marks the direction as t increases. Common trap: Treating it as a geometric boundary. Why the other choices fail: None follows from a direction arrow.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Interprets a visual direction marker as parametric order.' , issueSignals: [{ id: parametric-derivative-error }, { id: expression-equation-recognition-error }, { id: chain-rule-missed }, { id: conic-section-misidentified }, { id: trigonometric-identity-misapplied }]}
  - { id: q009, type: freeResponse, prompt: 'For $x=t^2,y=t^3$, state the Cartesian relation and the restriction.', answer: { gradingMode: selfCheck, keyPoints: ['y squared equals x cubed', 'x greater than or equal to zero'] }, explanation: 'Solution: Squaring y gives t to the sixth and cubing x gives t to the sixth, so y squared equals x cubed; x is nonnegative. Why it works: Both expressions contain compatible powers of t. Common trap: Omitting the x restriction.', difficultyDimensions: [identityConstruction, domainCondition], difficultyEvidence: 'Constructs an invariant power relation and retains its domain.' , issueSignals: [{ id: parametric-derivative-error }, { id: expression-equation-recognition-error }, { id: chain-rule-missed }, { id: conic-section-misidentified }, { id: trigonometric-identity-misapplied }]}
  - { id: q010, type: multipleChoice, prompt: 'If a curve is traced twice over an interval, what happens to a directed boundary integral over that interval?', choices: [{ id: a, text: It is counted twice. }, { id: b, text: It becomes zero. }, { id: c, text: It is unchanged. }, { id: d, text: It becomes undefined. }], answer: { choiceId: a }, explanation: 'Solution: A line integral accumulates along the traversal, so repeating the path repeats its contribution. Why it works: It counts directed motion, not merely the set of points. Common trap: Confusing the locus with the traversal. Why the other choices fail: Repetition does not cancel unless orientation reverses.', difficultyDimensions: [globalLocalReasoning, representationTransfer], difficultyEvidence: 'Separates path multiplicity from the geometric locus.' , issueSignals: [{ id: parametric-derivative-error }, { id: expression-equation-recognition-error }, { id: chain-rule-missed }, { id: conic-section-misidentified }, { id: trigonometric-identity-misapplied }]}
