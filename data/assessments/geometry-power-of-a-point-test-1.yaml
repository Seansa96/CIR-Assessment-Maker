questions:
- id: q-power-of-a-point-test-1
  type: multipleChoice
  prompt: 'A tangent segment is 4 units long. A secant from the same point has an external segment of 5. What is the total length of the secant?'
  choices:
  - id: choice-A
    text: '9'
  - id: choice-B
    text: '11'
  - id: choice-C
    text: '3.2'
  answer:
    choiceId: choice-C
    explanation: 'Power of a point: tangent^2 = external * total. 4^2 = 5 * total, so total = 16/5 = 3.2.'
  skills:
  - geometry-power-of-a-point
