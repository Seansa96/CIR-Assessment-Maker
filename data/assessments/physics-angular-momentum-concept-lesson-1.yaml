schemaVersion: 1
id: physics-angular-momentum-concept-lesson-1
title: 'Angular Momentum: Lesson 1'
description: The rotational analog of linear momentum.
assessmentType: conceptLesson
categoryId: physics-1
subcategoryIds:
- physics-angular-momentum
lesson:
  introduction: Just as a moving mass has linear momentum $\vec{p} = m\vec{v}$, a
    rotating object or a particle moving relative to a pivot has angular momentum.
  sections:
  - id: sec-1
    title: Angular Momentum of a Particle
    content: 'The angular momentum $\vec{L}$ of a single particle with respect to
      a chosen origin is defined as the cross product of its position vector $\vec{r}$
      and its linear momentum $\vec{p}$:


      $$\vec{L} = \vec{r} \times \vec{p}$$


      The magnitude is $L = rp\sin\phi = mvr\sin\phi$, where $\phi$ is the angle between
      $\vec{r}$ and $\vec{v}$. Notice that a particle traveling in a straight line
      *does* have angular momentum relative to an origin, as long as its line of motion
      does not pass directly through the origin.'
    media:
    - type: image
      src: /media/physics/animations/angular-momentum-rhr.gif
      alt: Animation showing the angular momentum vector L via the cross product of
        r and p.
      caption: 'Figure 1: Angular momentum is a vector perpendicular to both the position
        and velocity vectors.'
    check:
      id: chk-am-1
      type: multipleChoice
      prompt: A comet flies past the Sun in a straight line at a constant speed. Does
        it have angular momentum relative to the Sun?
      choices:
      - id: a
        text: No, because it is not traveling in a circle.
      - id: b
        text: No, because its velocity is constant.
      - id: c
        text: Yes, but its angular momentum constantly changes.
      - id: d
        text: Yes, and its angular momentum relative to the Sun is constant.
      answer:
        choiceId: d
      explanation: Yes. $L = mvr_{\perp}$. Even though $r$ changes, the perpendicular
        distance from the Sun to the line of motion ($r_{\perp}$ or the impact parameter)
        is constant, and $v$ is constant, so $L$ is constant.
  - id: sec-2
    title: Angular Momentum of a Rigid Body
    content: 'For a rigid body rotating around a fixed axis of symmetry, we can sum
      the angular momentum of all its particles. This simplifies elegantly to:


      $$L = I\omega$$


      Where $I$ is the moment of inertia about the axis and $\omega$ is the angular
      velocity. Since $\vec{\omega}$ points along the axis of rotation, $\vec{L}$
      also points along the axis of rotation: $\vec{L} = I\vec{\omega}$.'
    media: []
    check:
      id: chk-am-2
      type: multipleChoice
      prompt: A merry-go-round has a moment of inertia of $1000 \text{ kg}\cdot\text{m}^2$
        and is rotating at $0.5 \text{ rad/s}$. What is the magnitude of its angular
        momentum?
      choices:
      - id: a
        text: $500 \text{ kg}\cdot\text{m}^2/\text{s}$
      - id: b
        text: $1000 \text{ kg}\cdot\text{m}^2/\text{s}$
      - id: c
        text: $2000 \text{ kg}\cdot\text{m}^2/\text{s}$
      - id: d
        text: $250 \text{ kg}\cdot\text{m}^2/\text{s}$
      answer:
        choiceId: a
      explanation: Using $L = I\omega$, we have $L = (1000)(0.5) = 500 \text{ kg}\cdot\text{m}^2/\text{s}$.
