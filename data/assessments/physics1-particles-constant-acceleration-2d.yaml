questions:
- id: q001
  type: multipleChoice
  prompt: 'A particle moves in two dimensions with constant acceleration.


    Which pair of equations correctly gives the velocity components as functions of
    time?

    '
  choices:
  - id: a
    text: $v_x=v_{0x}+a_xt$ and $v_y=v_{0y}+a_yt$
  - id: b
    text: $v_x=x_0+a_xt$ and $v_y=y_0+a_yt$
  - id: c
    text: $v_x=v_{0x}+\frac12a_xt^2$ and $v_y=v_{0y}+\frac12a_yt^2$
  - id: d
    text: $v_x=a_x/t$ and $v_y=a_y/t$
  answer:
    choiceId: a
  explanation: 'Use the component velocity equations


    $$

    v_x=v_{0x}+a_xt,\qquad v_y=v_{0y}+a_yt

    $$


    Split the two-dimensional motion into independent x- and y-components, then apply
    the one-dimensional velocity-time equation to each component.


    Related topic: Component velocity equations; identify $v_{0x},v_{0y},a_x,a_y$,
    then substitute into $v=v_0+at$ separately for each axis.

    '
- id: q002
  type: symbolicResponse
  prompt: 'A particle has


    $$

    v_{0x}=12,\qquad a_x=3

    $$


    Enter an expression for $v_x(t)$.


    Use $t$ as the variable.

    '
  answer:
    expectedLatex: 12+3t
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0
  explanation: 'Use the x-component velocity equation


    $$

    v_x(t)=v_{0x}+a_xt

    $$


    Substitute $v_{0x}=12$ and $a_x=3$ to get


    $$

    v_x(t)=12+3t

    $$


    Related topic: Velocity component formula; choose the x-axis data and substitute
    directly into $v_x=v_{0x}+a_xt$.

    '
- id: q003
  type: multipleChoice
  prompt: 'A projectile is launched with no air resistance. If the positive y-direction
    is upward, which acceleration components are usually used?

    '
  choices:
  - id: a
    text: $a_x=0$ and $a_y=-g$
  - id: b
    text: $a_x=-g$ and $a_y=0$
  - id: c
    text: $a_x=g$ and $a_y=g$
  - id: d
    text: $a_x=0$ and $a_y=0$
  answer:
    choiceId: a
  explanation: 'With no air resistance, gravity acts vertically downward only.


    $$

    a_x=0,\qquad a_y=-g

    $$


    The\rhorizontal velocity stays constant, while the vertical velocity changes because
    of gravity.


    Related topic: Projectile acceleration components; set\rhorizontal acceleration
    to zero and assign the vertical sign from the chosen positive direction.

    '
- id: q004
  type: symbolicResponse
  prompt: 'A particle starts at $y_0=0$ with


    $$

    v_{0y}=20,\qquad a_y=-9.8

    $$


    Enter an expression for $y(t)$.


    Use $t$ as the variable.

    '
  answer:
    expectedLatex: 20t-4.9t^2
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0
  explanation: 'Use the vertical position equation


    $$

    y(t)=y_0+v_{0y}t+\frac12a_yt^2

    $$


    Since $y_0=0$, $v_{0y}=20$, and $a_y=-9.8$,


    $$

    y(t)=20t+\frac12(-9.8)t^2=20t-4.9t^2

    $$


    Related topic: Vertical position formula; substitute $y_0$, $v_{0y}$, and $a_y$,
    then simplify the $\frac12a_y$ coefficient.

    '
- id: q005
  type: multipleChoice
  prompt: 'A particle has constant acceleration in two dimensions. Which statement
    is true about solving its motion?

    '
  choices:
  - id: a
    text: The x- and y-motions can be solved separately using component equations.
  - id: b
    text: The x-motion always determines the y-motion.
  - id: c
    text: The y-motion always has zero acceleration.
  - id: d
    text: The particle must move in a straight line.
  answer:
    choiceId: a
  explanation: 'Constant-acceleration motion in two dimensions is solved component
    by component:


    $$

    x=x_0+v_{0x}t+\frac12a_xt^2,\qquad

    y=y_0+v_{0y}t+\frac12a_yt^2

    $$


    The same time variable connects the components, but each axis uses its own initial
    velocity and acceleration.


    Related topic: Component separation; write separate x- and y-equations, solve
    the needed component, and connect them only through the shared time.

    '
- id: q006
  type: symbolicResponse
  prompt: 'A particle starts at $x_0=5$ with


    $$

    v_{0x}=4,\qquad a_x=2

    $$


    Enter an expression for $x(t)$.


    Use $t$ as the variable.

    '
  answer:
    expectedLatex: 5+4t+t^2
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0
  explanation: 'Use


    $$

    x(t)=x_0+v_{0x}t+\frac12a_xt^2

    $$


    Substitute $x_0=5$, $v_{0x}=4$, and $a_x=2$:


    $$

    x(t)=5+4t+\frac12(2)t^2=5+4t+t^2

    $$


    Related topic: Horizontal position formula; insert $x_0$, add the linear $v_{0x}t$
    term, then simplify the quadratic $\frac12a_xt^2$ term.

    '
- id: q007
  type: multipleChoice
  prompt: 'A projectile returns to its launch height. Which equation is most direct
    for finding the total flight time from vertical motion?

    '
  choices:
  - id: a
    text: $0=v_{0y}t+\frac12a_yt^2$, then factor out $t$
  - id: b
    text: $x=x_0+v_{0x}t$, then set $x=0$
  - id: c
    text: $v_x=v_{0x}+a_xt$, then solve for $a_x$
  - id: d
    text: $v_y^2=v_{0y}^2+2a_y\Delta y$, then set $t=0$
  answer:
    choiceId: a
  explanation: 'Returning to launch height means $\Delta y=0$. The vertical position
    equation becomes


    $$

    0=v_{0y}t+\frac12a_yt^2

    $$


    Factor it as


    $$

    0=t\left(v_{0y}+\frac12a_yt\right)

    $$


    and use the nonzero root for the landing time.


    Related topic: Time of flight from vertical displacement; set $\Delta y=0$, factor
    the position equation, discard $t=0$, and solve the remaining factor.

    '
- id: q008
  type: symbolicResponse
  prompt: 'A particle has


    $$

    v_{0y}=18,\qquad a_y=-6

    $$


    Enter an expression for $v_y(t)$.


    Use $t$ as the variable.

    '
  answer:
    expectedLatex: 18-6t
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0
  explanation: 'Use


    $$

    v_y(t)=v_{0y}+a_yt

    $$


    Substitute $v_{0y}=18$ and $a_y=-6$:


    $$

    v_y(t)=18-6t

    $$


    Related topic: Vertical velocity formula; keep the acceleration sign and combine
    it with time in $v_y=v_{0y}+a_yt$.

    '
- id: q009
  type: multipleChoice
  prompt: 'A particle is launched\rhorizontally from a height. Ignoring air resistance,
    which statement is true?

    '
  choices:
  - id: a
    text: Horizontal velocity stays constant while vertical velocity changes.
  - id: b
    text: Vertical velocity stays constant while\rhorizontal velocity changes.
  - id: c
    text: Both velocity components stay constant.
  - id: d
    text: Both velocity components must become zero at the same time.
  answer:
    choiceId: a
  explanation: 'For\rhorizontal launch with no air resistance,


    $$

    a_x=0,\qquad a_y=-g

    $$


    Therefore $v_x=v_{0x}$ stays constant, while $v_y=v_{0y}-gt$ changes downward
    with time.


    Related topic: Horizontal launch components; set $a_x=0$ for constant $v_x$ and
    use $v_y=v_{0y}-gt$ for the vertical component.

    '
- id: q010
  type: symbolicResponse
  prompt: 'A particle begins at the origin with


    $$

    v_{0x}=10,\qquad a_x=0

    $$


    Enter an expression for $x(t)$.


    Use $t$ as the variable.

    '
  answer:
    expectedLatex: 10t
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0
  explanation: 'Start with


    $$

    x(t)=x_0+v_{0x}t+\frac12a_xt^2

    $$


    Since $x_0=0$ and $a_x=0$, the constant and quadratic terms vanish:


    $$

    x(t)=10t

    $$


    Related topic: Horizontal position with zero acceleration; remove the $x_0$ and
    $\frac12a_xt^2$ terms when they are zero, leaving $x=v_{0x}t$.

    '
