  prompt: |
    Which expression writes $1-\frac12+\frac13-\frac14+\cdots$ using a
    positive magnitude sequence?
  choices:
  - id: a
    text: |-
      $\sum_{n=1}^{\infty}(-1)^{n-1}/n$
  - id: b
    text: |-
      $\sum_{n=1}^{\infty}(-1)^n n$
  - id: c
    text: |-
      $\sum_{n=1}^{\infty}1/n$
  - id: d
    text: |-
      $\sum_{n=1}^{\infty}(-1)^{n-1}n$
  answer:
    choiceId: a
  explanation: |-
    Solution: Substituting $n=1,2,3$ into $(-1)^{n-1}/n$ reproduces the signs and reciprocals in order. Therefore the answer is $\sum_{n=1}^{\infty}(-1)^{n-1}/n$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $\sum_{n=1}^{\infty}(-1)^n n$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $\sum_{n=1}^{\infty}1/n$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $\sum_{n=1}^{\infty}(-1)^{n-1}n$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
