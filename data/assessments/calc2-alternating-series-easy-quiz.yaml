modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - recognize-alternating-series
  prompt: |
    Which expression writes $1-\frac12+\frac13-\frac14+\cdots$ using a
    positive magnitude sequence?
  choices:
  - id: a
    text: |-
      $\sum_{n=1}^{\infty}(-1)^{n-1}/n$
  - id: b
    text: |-
      $\sum_{n=1}^{\infty}(-1)^n n$
  - id: c
    text: |-
      $\sum_{n=1}^{\infty}1/n$
  - id: d
    text: |-
      $\sum_{n=1}^{\infty}(-1)^{n-1}n$
  answer:
    choiceId: a
  explanation: Substituting $n=1,2,3$ into $(-1)^{n-1}/n$ reproduces the signs and reciprocals in order.
- id: q002
  type: multipleChoice
  skills:
  - verify-alternating-series-hypotheses
  prompt: |
    For $\sum(-1)^{n-1}b_n$ with $b_n\ge0$, which pair of conditions is
    sufficient for the alternating-series test?
  choices:
  - id: a
    text: |-
      $b_n$ is eventually nonincreasing and $b_n\to0$.
  - id: b
    text: |-
      $b_n$ is bounded and $b_n\to1$.
  - id: c
    text: $b_n$ is increasing and positive.
  - id: d
    text: |-
      $\sum b_n$ converges and $b_n$ increases.
  answer:
    choiceId: a
  explanation: The theorem uses eventual nonincrease to trap partial sums and a zero magnitude limit to
    make the trap width vanish.
- id: q003
  type: multipleChoice
  skills:
  - apply-the-divergence-test
  prompt: |
    What happens to $\sum_{n=1}^{\infty}(-1)^n(2+1/n)$?
  choices:
  - id: a
    text: It converges by the alternating-series test.
  - id: b
    text: It converges absolutely.
  - id: c
    text: It diverges because its terms do not approach zero.
  - id: d
    text: It telescopes to $2$.
  answer:
    choiceId: c
  explanation: |-
    The magnitudes approach $2$, so the signed terms oscillate near $\pm2$ and violate a necessary condition for series convergence.
- id: q004
  type: multipleChoice
  skills:
  - interpret-eventual-monotonicity
  prompt: |
    A positive sequence satisfies $b_n\to0$ and $b_{n+1}\le b_n$ for every
    $n\ge20$, but not for all earlier indices. What can be said about
    $\sum(-1)^n b_n$?
  choices:
  - id: a
    text: It converges by applying the alternating-series test to the tail.
  - id: b
    text: It must diverge because monotonicity fails once.
  - id: c
    text: It converges absolutely.
  - id: d
    text: Its terms have a nonzero limit.
  answer:
    choiceId: a
  explanation: Removing the first nineteen terms leaves a decreasing-to-zero alternating tail, and finitely
    many terms do not change convergence.
- id: q005
  type: multipleChoice
  skills:
  - limit-alternating-test-conclusions
  prompt: |
    After verifying the alternating-series hypotheses, which conclusion is
    justified immediately?
  choices:
  - id: a
    text: The signed series converges.
  - id: b
    text: The series of absolute values converges.
  - id: c
    text: The exact sum equals the first term.
  - id: d
    text: Every rearrangement has the same sum.
  answer:
    choiceId: a
  explanation: The alternating-series test proves convergence of the signed partial sums but makes no
    absolute-convergence claim.
- id: q006
  type: multipleChoice
  skills:
  - classify-conditional-convergence
  prompt: |
    How is $\sum_{n=1}^{\infty}(-1)^{n-1}/n$ classified?
  choices:
  - id: a
    text: Absolutely convergent
  - id: b
    text: Conditionally convergent
  - id: c
    text: Divergent by the term test
  - id: d
    text: Geometric
  answer:
    choiceId: b
  explanation: Decreasing magnitudes tending to zero give signed convergence, while the absolute-value
    harmonic series diverges.
- id: q007
  type: multipleChoice
  skills:
  - classify-absolute-convergence
  prompt: |
    Classify $\sum_{n=1}^{\infty}(-1)^n/n^3$.
  choices:
  - id: a
    text: Absolutely convergent
  - id: b
    text: Conditionally convergent
  - id: c
    text: Divergent because it alternates
  - id: d
    text: Inconclusive by every standard test
  answer:
    choiceId: a
  explanation: |-
    Its absolute-value series is the convergent $p$-series $\sum1/n^3$, so absolute convergence is established directly.
- id: q008
  type: multipleChoice
  skills:
  - apply-alternating-remainder-bound
  prompt: |
    For $\sum_{n=1}^{\infty}(-1)^{n-1}/n^2$, what bound does the
    alternating remainder theorem give after $N$ terms?
  choices:
  - id: a
    text: |-
      $|R_N|\le1/(N+1)^2$
  - id: b
    text: |-
      $|R_N|\le1/N^2$ only
  - id: c
    text: $|R_N|=1/(N+1)^2$
  - id: d
    text: |-
      $|R_N|\le1/(N+1)$
  answer:
    choiceId: a
  explanation: The error is at most the magnitude $b_{N+1}$ of the first omitted term.
- id: q009
  type: multipleChoice
  skills:
  - solve-remainder-inequalities
  prompt: |
    For the alternating harmonic series, what is the least $N$ for which the
    next-term bound guarantees $|R_N|<1/20$?
  choices:
  - id: a
    text: $N=19$
  - id: b
    text: $N=20$
  - id: c
    text: $N=21$
  - id: d
    text: $N=400$
  answer:
    choiceId: b
  explanation: Solve $1/(N+1)<1/20$, giving $N+1>20$; the least integer is $N=20$.
- id: q010
  type: multipleChoice
  skills:
  - determine-remainder-signs
  prompt: |
    Let $S=1-\frac12+\frac13-\cdots$. Is $S_4$ an overestimate or an
    underestimate of $S$?
  choices:
  - id: a
    text: Overestimate
    because the first omitted term is positive.: null
  - id: b
    text: Underestimate
    because the first omitted term is positive.: null
  - id: c
    text: Exact
    because four terms cancel.: null
  - id: d
    text: Impossible to determine from alternation.
  answer:
    choiceId: b
  explanation: The fifth term is positive, so $R_4=S-S_4>0$ and the true sum lies above $S_4$.
- id: q011
  type: multipleChoice
  skills:
  - bracket-alternating-series-sums
  prompt: |
    For a decreasing positive magnitude sequence beginning with a positive
    term, which interval must contain the series sum?
  choices:
  - id: a
    text: The interval with endpoints $S_{2k}$ and $S_{2k+1}$
  - id: b
    text: $[0,b_{2k}]$ for every $k$
  - id: c
    text: The interval with endpoints $b_{2k}$ and $b_{2k+1}$
  - id: d
    text: $[S_{2k}-1,S_{2k}+1]$ only
  answer:
    choiceId: a
  explanation: Even and odd partial sums approach from opposite sides, so every consecutive pair of opposite
    parity brackets the limit.
- id: q012
  type: multipleChoice
  skills:
  - verify-monotonicity
  prompt: |
    For $b_n=n/(n^2+4)$, which fact proves the magnitudes eventually decrease?
  choices:
  - id: a
    text: $f'(x)=(4-x^2)/(x^2+4)^2<0$ for $x>2$.
  - id: b
    text: $f(x)>0$ for $x>0$.
  - id: c
    text: $f(1)<1$.
  - id: d
    text: $f'(x)>0$ for $x>2$.
  answer:
    choiceId: a
  explanation: |-
    Extending to $f(x)=x/(x^2+4)$ shows it is decreasing on $(2,\infty)$, which is enough for the discrete tail.
- id: q013
  type: multipleChoice
  skills:
  - check-test-applicability
  prompt: |
    Suppose $b_n>0$ and $b_n\to0$, but $b_n$ has infinitely many increases.
    What is the correct conclusion about $\sum(-1)^n b_n$ from the
    alternating-series test alone?
  choices:
  - id: a
    text: The test is not applicable; another argument is needed.
  - id: b
    text: The series necessarily converges.
  - id: c
    text: The series necessarily diverges.
  - id: d
    text: The series converges absolutely.
  answer:
    choiceId: a
  explanation: The theorem's eventual monotonicity hypothesis has not been established, so it supplies
    no verdict even though other methods might.
- id: q014
  type: multipleChoice
  skills:
  - estimate-alternating-series-values
  prompt: |
    A valid alternating approximation has $S_{10}=0.742$ and
    $b_{11}=0.006$. Which interval is guaranteed to contain $S$?
  choices:
  - id: a
    text: $[0.736,0.748]$
  - id: b
    text: $[0.742,0.748]$ only, regardless of the next sign
  - id: c
    text: $[0.006,0.742]$
  - id: d
    text: $[0.748,0.754]$
  answer:
    choiceId: a
  explanation: |-
    The absolute error inequality $|S-S_{10}|\le0.006$ places $S$ within $0.006$ on either side of $0.742$.
- id: q015
  type: multipleChoice
  skills:
  - select-convergence-tests
  prompt: |
    To classify $\sum_{n=2}^{\infty}(-1)^n/[n\ln n]$, which plan is most
    direct?
  choices:
  - id: a
    text: Use the alternating-series test
    then the integral test on $\sum1/(n\ln n)$.: null
  - id: b
    text: Use only the divergence test because the terms approach zero.
  - id: c
    text: Use the geometric-series formula.
  - id: d
    text: Use only the ratio test
    whose limit is $1$.: null
  answer:
    choiceId: a
  explanation: |-
    The magnitudes decrease to zero, while the absolute-value series diverges because $\int_2^\infty dx/(x\ln x)$ is unbounded; the result is conditional.
