  id: statics-hard-quiz-q001
  title: Statics Hard Q1
- prompt: A mass $M$ hangs from two strings. One is horizontal, and the other makes
    an angle $\theta$ with the vertical. What is the tension $T$ in the horizontal
    string?
  type: symbolicResponse
  answer:
    expectedLatex: M g \tan(\theta)
    equivalenceMode: derivative
    variables:
    - M
    - g
    - \theta
    tolerance: 0.001
  explanation: 'Vertical balance: $T_{{angled}}\cos\theta = Mg$. Horizontal balance:
    $T = T_{{angled}}\sin\theta$. Thus $T = Mg\tan\theta$.'
  difficultyDimensions:
  - symbolic-manipulation
  - force-balance-2d
  - coupled-equations
