questions:
- prompt: A 23 kg sign is supported by two cables making symmetric angles of $45^\circ$
    with the horizontal. What is the tension in one of the cables? Use $g = 9.8\text{
    m/s}^2$.
  type: numericResponse
  answer:
    value: 159.38339697355397
    tolerance: 1.0
  explanation: $2T\sin(45^\circ) = mg \implies T = \frac{mg}{2\sin(45^\circ)} = \frac{225.4}{1.414}
    = 159.4$ N.
  difficultyDimensions:
  - calculation-2-step
  - force-balance-2d
  - trigonometry
  subjectDifficultyTags: []
  difficultyEvidence: Requires equilibrium force balance
  prerequisiteObjectiveIds:
