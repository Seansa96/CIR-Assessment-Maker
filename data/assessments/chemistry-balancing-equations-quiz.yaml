questions:
- id: q001
  type: multipleChoice
  prompt: 'Which of the following is a correctly balanced equation?

    '
  choices:
  - id: a
    text: 2H2 + O2 → 2H2O
  - id: b
    text: H2 + O2 → H2O
  - id: c
    text: H2 + O → H2O
  - id: d
    text: 2H + O → H2O
  answer:

    choiceId: a
  explanation: 'Check option (a): Left: 4H, 2O. Right: 4H, 2O. ✓ Option (b): Left
    2H, 2O; Right 2H, 1O. ✗ Option (c) changes subscripts — invalid. Option (d) uses
    atoms, not molecules.

    '
- id: q002
  type: numericResponse
  prompt: 'What is the coefficient of O2 in the balanced equation for the combustion
    of propane?

    C3H8 + _O2 → CO2 + H2O (unbalanced)

    '
  answer:
    value: 5
    tolerance: 0
  explanation: 'Balanced: C3H8 + 5O2 → 3CO2 + 4H2O. Check: 3C, 8H on left; 3C, 8H
    on right. Oxygen: 10 O on left (5×2); 10 O on right (6 in CO2 + 4 in H2O). ✓

    '
- id: q003
  type: multipleChoice
  prompt: 'What is the correctly balanced equation for the reaction of iron(III) oxide
    with carbon monoxide?

    Fe2O3 + CO → Fe + CO2 (unbalanced)

    '
  choices:
  - id: a
    text: Fe2O3 + 3CO → 2Fe + 3CO2
  - id: b
    text: Fe2O3 + CO → 2Fe + CO2
  - id: c
    text: 2Fe2O3 + 3CO → 4Fe + 3CO2
  - id: d
    text: Fe2O3 + 3CO → Fe2 + 3CO2
  answer:

    choiceId: a
  explanation: 'Fe2O3 + 3CO → 2Fe + 3CO2. Left: 2Fe, 3O (Fe2O3) + 3C, 3O (3CO) = 3C,
    2Fe, 6O. Right: 2Fe + 3C, 6O (3CO2). ✓

    '
- id: q004
  type: numericResponse
  prompt: 'What is the coefficient of H2O in the balanced equation for the combustion
    of ethanol?

    C2H5OH + O2 → CO2 + H2O (unbalanced)

    '
  answer:
    value: 3
    tolerance: 0
  explanation: 'Balanced: C2H5OH + 3O2 → 2CO2 + 3H2O. Check C: 2=2✓; H: 6=6✓; O: 1+6=7
    on left, 4+3=7 on right✓.

    '
- id: q005
  type: multipleChoice
  prompt: 'What is the correct balanced equation for the synthesis of ammonia (Haber
    process)?

    '
  choices:
  - id: a
    text: N2 + 3H2 → 2NH3
  - id: b
    text: N2 + H2 → 2NH3
  - id: c
    text: N + 3H → NH3
  - id: d
    text: 2N + 6H → 2NH3
  answer:

    choiceId: a
  explanation: 'N2 + 3H2 → 2NH3. Left: 2N, 6H. Right: 2N (in 2NH3), 6H (in 2NH3 ×
    3H each). ✓

    '
- id: q006
  type: multipleChoice
  prompt: 'In the balanced equation: 2KClO3 → 2KCl + 3O2, what does the coefficient
    3 tell you?

    '
  choices:
  - id: a
    text: 3 moles of O2 are produced for every 2 moles of KClO3 decomposed.
  - id: b
    text: 3 atoms of oxygen react with each potassium atom.
  - id: c
    text: O2 is 3 times as reactive as KCl.
  - id: d
    text: The reaction takes 3 seconds.
  answer:

    choiceId: a
  explanation: 'Coefficients are mole ratios. 3 mol O2 produced per 2 mol KClO3 (and
    2 mol KCl produced). This is the thermal decomposition of potassium chlorate,
    a classic oxygen-generation reaction.

    '
- id: q007
  type: numericResponse
  prompt: 'What is the sum of all coefficients in the balanced equation for:

    Al + HCl → AlCl3 + H2 (unbalanced)?

    '
  answer:
    value: 13
    tolerance: 0
  explanation: 'Balanced: 2Al + 6HCl → 2AlCl3 + 3H2. Left Al: 2, Right Al: 2✓; Left
    Cl: 6, Right Cl: 6✓; Left H: 6, Right H: 6✓. Sum of coefficients: 2 + 6 + 2 +
    3 = 13.

    '
- id: q008
  type: multipleChoice
  prompt: 'A student writes the equation for the decomposition of water as: H2O →
    H + O2. What is wrong?

    '
  choices:
  - id: a
    text: The equation is not balanced — oxygen atoms are not conserved.
  - id: b
    text: The products should be H2O2 and H2.
  - id: c
    text: The student forgot to add a catalyst.
  - id: d
    text: Nothing is wrong with this equation.
  answer:

    choiceId: a
  explanation: 'The equation is unbalanced: left has 1 O; right has 2 O. Correct balanced
    equation: 2H2O → 2H2 + O2. Left: 4H, 2O; Right: 4H, 2O. ✓

    '
- id: q009
  type: numericResponse
  prompt: 'What coefficient should be placed in front of O2 to balance the following
    equation?

    4FeS2 + _O2 → 2Fe2O3 + 8SO2

    '
  answer:
    value: 11
    tolerance: 0
  explanation: 'Count oxygen needed on the right: 2Fe2O3 has 6 O, 8SO2 has 16 O →
    22 O total needed. Each O2 provides 2 O, so coefficient = 22/2 = 11. 4FeS2 + 11O2
    → 2Fe2O3 + 8SO2. Verify: S: 8=8✓, Fe: 4=4✓, O: 22=22✓.

    '
- id: q010
  type: multipleChoice
  prompt: 'Which of the following best explains why you can use a fraction as a temporary
    coefficient when balancing?

    '
  choices:
  - id: a
    text: Fractions represent partial mole ratios and are valid; they are cleared
      by multiplying through by a whole number.
  - id: b
    text: Fractions are not valid and should never be used.
  - id: c
    text: Fractions can only be used for oxygen.
  - id: d
    text: A fraction means less than one molecule is used, which is chemically impossible.
  answer:

    choiceId: a
  explanation: 'Fractions represent mole ratios and are mathematically valid. The
    convention is to report integer coefficients, so after achieving balance with
    fractions, multiply all coefficients by the denominator to clear fractions. For
    example, 1/2 O2 → multiply by 2 → 1 O2 (but double all other coefficients too).

    '
