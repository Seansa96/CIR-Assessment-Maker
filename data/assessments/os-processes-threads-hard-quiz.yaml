questions:
- id: q001
  title: Apply Process context
  type: multipleChoice
  prompt: A system design discussion mentions **Process context**. Which conclusion is most defensible?
  choices:
  - id: a
    text: A process is more than a program file.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: A process is more than a program file. This is why Process context matters in Processes and Threads.
