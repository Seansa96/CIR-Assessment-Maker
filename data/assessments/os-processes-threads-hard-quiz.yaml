  explanation: 'Related topic: Processes and Threads.'
- id: q008
  title: 'Misconception: Process context'
  type: multipleChoice
  prompt: Which misconception is most dangerous when reasoning about **Process context**?
  choices:
  - id: a
    text: Treating the concept as a label instead of an OS mechanism with costs and boundaries.
  - id: b
    text: Asking what resource is controlled.
  - id: c
    text: Checking whether the mechanism can fail or block.
  - id: d
    text: Separating user-visible behavior from kernel-mediated work.
  answer:
    choiceId: a
  explanation: The correct reasoning must connect Process context to mechanism and tradeoff.
