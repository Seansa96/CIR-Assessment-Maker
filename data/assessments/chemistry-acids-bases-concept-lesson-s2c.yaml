        Why it works: For the Amphiprotic species check, identify the governing acid-base relation in the prompt, apply it to the stated species or values, and verify charge, units, or model scope.


        Why the other choices fail: Choice A (HCO3− → CO3^2− + H+) uses the wrong model or operation; choice C (HCO3− → H+ + CO3^2− only) ignores a stated condition; choice D (HCO3− + OH− → H2O) substitutes an irrelevant shortcut.
