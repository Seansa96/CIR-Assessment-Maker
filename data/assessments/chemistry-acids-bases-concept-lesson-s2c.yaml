  - id: sec-2
    title: Amphiprotic species
    required: true
    content: An amphiprotic species can donate or accept H+. Bicarbonate can become carbonate by donation or carbonic acid by acceptance.
    media:
    - type: image
      src: /media/chemistry/chemistry-acids-bases-model.svg
      alt: Original diagram supporting amphiprotic species.
      caption: 
    check:
      id: chk-2
      type: multipleChoice
      prompt: Which equation shows HCO3− acting as a base?
      choices:
      - id: a
        text: HCO3− → CO3^2− + H+
        media: []
        issueSignals:
        - id: amphiprotic-role-confusion
          domains:
          - chemistry
      - id: b
        text: HCO3− + H+ → H2CO3
        media: []
        issueSignals: []
      - id: c
        text: HCO3− → H+ + CO3^2− only
        media: []
        issueSignals:
        - id: amphiprotic-role-confusion
          domains:
          - chemistry
      - id: d
        text: HCO3− + OH− → H2O
        media: []
        issueSignals:
        - id: amphiprotic-role-confusion
          domains:
          - chemistry
      answer:
        choiceId: b
        choiceIds: []
