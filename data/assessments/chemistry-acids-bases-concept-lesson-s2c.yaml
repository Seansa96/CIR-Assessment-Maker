lesson:
  introduction: This lesson builds an acid-base model from definitions through equations, calculations, and verification.
  sections:
  - id: sec-1
    title: Model scope
    required: true
    content: Arrhenius describes aqueous H+/OH− production; Brønsted–Lowry describes proton transfer in broader settings. Use the broader model when water is absent.
    media:
    - type: image
      src: /media/chemistry/chemistry-acids-bases-model.svg
      alt: Original diagram supporting model scope.
      caption: 
    check:
      id: chk-1
      type: multipleChoice
      prompt: Which reaction is best classified with Brønsted–Lowry language without water?
      choices:
      - id: a
        text: NH3 + HCl → NH4+ + Cl−
        media: []
        issueSignals: []
      - id: b
        text: NaOH → Na+ + OH− in water
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      - id: c
        text: HCl(aq) → H+ + Cl−
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      - id: d
        text: KOH(aq) → K+ + OH−
        media: []
        issueSignals:
        - id: acid-base-model-confusion
          domains:
          - chemistry
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: Choice A (NH3 + HCl → NH4+ + Cl−).


        Why it works: For the Model scope check, identify the governing acid-base relation in the prompt, apply it to the stated species or values, and verify charge, units, or model scope.


        Why the other choices fail: Choice B (NaOH → Na+ + OH− in water) uses the wrong model or operation; choice C (HCl(aq) → H+ + Cl−) ignores a stated condition; choice D (KOH(aq) → K+ + OH−) substitutes an irrelevant shortcut.
