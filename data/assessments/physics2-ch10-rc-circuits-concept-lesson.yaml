title: RC Circuits
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-dc-circuits
workedExamples:
- id: l3-sec1
  title: Charging a Capacitor
  explanation: When a battery is connected to an uncharged capacitor $C$ in series
    with a resistor $R$, the charge on the capacitor increases over time as $q(t)
    = C\mathcal{E}(1 - e^{-t/RC})$. The time constant is $\tau = RC$.
- id: l3-sec2
  title: Discharging a Capacitor
  explanation: 'When a charged capacitor discharges through a resistor, the charge
    decays exponentially: $q(t) = Q_0 e^{-t/RC}$. The current also decays exponentially.'
