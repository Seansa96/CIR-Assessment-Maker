lesson:
  introduction: >
    This lesson develops a repeatable way to solve RC Circuits problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch10-rc-circuits-s1
    title: Name the model and quantities
    required: true
    content: >
      RC Circuits uses q(t) = C V(1-exp(-t/RC)). In the name the model and quantities stage, identify the time constant, evaluate the exponential at the requested time, and check the long-time limit.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving RC Circuits problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch10-rc-circuits-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for RC Circuits, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use q(t) = C V(1-exp(-t/RC)) after you identify the time constant, evaluate the exponential at the requested time, and check the long-time limit.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this RC Circuits problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch10-rc-circuits-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables q(t) = C V(1-exp(-t/RC)) relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch10-rc-circuits-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit RC Circuits.
        media: []
        issueSignals:
        - id: physics2-physics2-ch10-rc-circuits-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: During name the model and quantities for RC Circuits, first identify the time constant, evaluate the exponential at the requested time, and check the long-time limit. Then apply q(t) = C V(1-exp(-t/RC)) with one consistent coordinate system and solve for the requested quantity.


        Why it works: q(t) = C V(1-exp(-t/RC)) connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
