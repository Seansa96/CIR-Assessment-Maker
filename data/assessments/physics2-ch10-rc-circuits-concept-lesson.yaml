id: physics2-ch10-rc-circuits-concept-lesson
title: RC Circuits
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-dc-circuits
lesson:
  introduction: This lesson develops the main ideas behind RC Circuits and connects them to the governing
    physical relationships.
  sections:
  - id: l3-sec1
    title: Charging a Capacitor
    required: true
    content: When a battery is connected to an uncharged capacitor $C$ in series with a resistor $R$,
      the charge on the capacitor increases over time as $q(t) = C\mathcal{E}(1 - e^{-t/RC})$. The time
      constant is $\tau = RC$.
  - id: l3-sec2
    title: Discharging a Capacitor
    required: true
    content: 'When a charged capacitor discharges through a resistor, the charge decays exponentially:
      $q(t) = Q_0 e^{-t/RC}$. The current also decays exponentially.'
