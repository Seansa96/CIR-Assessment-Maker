workedExamples:
  - id: we-known-time
    title: Find speed when time is known
    problem: 'A cyclist starts at $v_i=4.0$ m/s and accelerates constantly at $2.0$ m/s$^2$ for $3.0$ s. Choose a direct equation and find final speed.'
    steps:
      - id: kt-1
        title: Select an equation
        instruction: 'The desired quantity is final velocity and time is known.'
        type: multipleChoice
        prompt: 'Which equation is most direct?'
        choices: [{ id: a, text: '$v_f=v_i+at$' }, { id: b, text: '$v_f^2=v_i^2+2a\Delta x$' }]
        answer: { choiceId: a }
        explanation: 'Solution: Choose $v_f=v_i+at$.\n\nWhy it works: It contains the target and all known quantities without introducing displacement.\n\nWhy the other choices fail: The second equation requires displacement, which was not supplied.'
      - id: kt-2
        title: Calculate final velocity
        instruction: 'Substitute the given velocity, acceleration, and time.'
        type: numericResponse
        prompt: 'What is $v_f$ in m/s?'
        answer: { value: 10, tolerance: 0.01 }
        explanation: 'Solution: $v_f=4.0+(2.0)(3.0)=10$ m/s.\n\nWhy it works: Constant acceleration changes velocity linearly with time.'
  - id: we-no-time
    title: Find speed when time is absent
    problem: 'A car moves at $v_i=20$ m/s, has constant acceleration $-5.0$ m/s$^2$, and stops. Find its displacement without first finding time.'
    steps:
      - id: nt-1
        title: Translate stopping condition
        instruction: 'Stopping fixes the final velocity.'
        type: multipleChoice
        prompt: 'What value should be substituted for $v_f$?'
        choices: [{ id: a, text: '$0$ m/s' }, { id: b, text: '$20$ m/s' }]
        answer: { choiceId: a }
        explanation: 'Solution: Set $v_f=0$.\n\nWhy it works: An object that has stopped has zero final velocity.\n\nWhy the other choices fail: $20$ m/s is the initial velocity.'
      - id: nt-2
        title: Choose and solve no-time relation
        instruction: 'Use the equation that includes velocity, acceleration, and displacement but not time.'
        type: numericResponse
        prompt: 'What is the displacement in meters?'
        answer: { value: 40, tolerance: 0.01 }
        explanation: 'Solution: $0=20^2+2(-5.0)\Delta x$, so $\Delta x=40$ m.\n\nWhy it works: $v_f^2=v_i^2+2a\Delta x$ eliminates the unknown time.'
