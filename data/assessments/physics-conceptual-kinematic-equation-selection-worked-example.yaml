schemaVersion: 1
id: physics-conceptual-kinematic-equation-selection-worked-example
title: Conceptual Kinematic Equation Selection Worked Example
assessmentType: workedExample
categoryId: physics-1
subcategoryIds:
  - kinematics-2
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Choosing the right constant-acceleration equation from structure
    problem: |
      Learn how to decide which one-dimensional kinematic equation to use before doing algebra.
    steps:
      - id: s001
        title: Check the assumption first
        instruction: "The standard kinematic equations only apply directly when acceleration is constant over the interval."
        type: multipleChoice
        prompt: "What condition must be true before using the basic constant-acceleration kinematic equations?"
        choices:
          - id: a
            text: "Acceleration is constant over the motion interval."
          - id: b
            text: "Velocity is always zero."
          - id: c
            text: "Position is always positive."
          - id: d
            text: "The object must move horizontally."
        answer:
          choiceId: a
        hint: "The equations come from integrating a constant acceleration."
        explanation: |
          The familiar equations assume constant acceleration:

          $$v_f=v_i+at$$

          $$\Delta x=v_it+\frac12at^2$$

          $$v_f^2=v_i^2+2a\Delta x$$

          Related topic: constant acceleration. Look up "kinematic equations constant acceleration derivation" and notice that they come from integrating $a=\text{constant}$.

      - id: s002
        title: Use displacement instead of raw position when possible
        instruction: "Many equation-selection mistakes come from mixing up final position, initial position, and displacement."
        type: multipleChoice
        prompt: 'What does $\Delta x$ mean in one-dimensional kinematics?'
        choices:
          - id: a
            text: "Final position minus initial position"
          - id: b
            text: "Distance traveled, always positive"
          - id: c
            text: "Initial position minus final velocity"
          - id: d
            text: "Acceleration times time"
        answer:
          choiceId: a
        hint: "Delta means change in a quantity."
        explanation: |
          $\Delta x=x_f-x_i$. It can be positive, negative, or zero depending on direction and start/end locations.

          Related topic: displacement versus distance. Review the difference before selecting equations in vertical motion or return-to-start problems.

      - id: s003
        title: Identify the target variable
        instruction: "Equation selection starts with the unknown the problem asks for, not with the first number you see."
        type: multipleChoice
        prompt: "A car starts from rest and accelerates for 5 seconds. The question asks for final velocity. What is the target variable?"
        choices:
          - id: a
            text: "$v_f$"
          - id: b
            text: "$x_i$"
          - id: c
            text: '$\Delta x$'
          - id: d
            text: "$a$"
        answer:
          choiceId: a
        hint: "Ask: what quantity should the final answer represent?"
        explanation: |
          The target variable is the quantity you are trying to find. Here the phrase "final velocity" points directly to $v_f$.

          Related topic: variable identification. Quick lookup: "kinematics knowns and unknowns table."

      - id: s004
        title: Translate words into known values
        instruction: "After finding the target, translate common phrases into variables."
        type: selectAll
        prompt: "Which translations are usually correct?"
        choices:
          - id: a
            text: '"Starts from rest" means $v_i=0$.'
          - id: b
            text: '"Stops" means $v_f=0$.'
          - id: c
            text: '"Returns to the release height" means $\Delta x=0$.'
          - id: d
            text: '"Falls under gravity" means acceleration is zero.'
        answer:
          choiceIds:
            - a
            - b
            - c
        hint: "Look for phrases that impose a value or condition."
        explanation: |
          These translations are major shortcuts:

          - starts from rest: $v_i=0$
          - stops: $v_f=0$
          - returns to the starting height: $\Delta x=0$

          Falling under gravity does not mean acceleration is zero. It usually means $a=-g$ if upward is positive.

          Related topic: interpreting kinematics language. Review common phrase-to-variable translations.

      - id: s005
        title: Choose the equation containing time
        instruction: "If the target is velocity and time is known, use the equation that directly connects velocity and time."
        type: multipleChoice
        prompt: "A cyclist has known $v_i$, known $a$, and known $t$. You need $v_f$. Which equation is the cleanest?"
        choices:
          - id: a
            text: '$v_f=v_i+at$'
          - id: b
            text: '$v_f^2=v_i^2+2a\Delta x$'
          - id: c
            text: '$\Delta x=v_it+\frac12at^2$'
          - id: d
            text: '$a=0$'
        answer:
          choiceId: a
        hint: "The target is final velocity, and time is known."
        explanation: |
          $v_f=v_i+at$ directly uses initial velocity, acceleration, and time to find final velocity.

          Related topic: velocity as a function of time. Look up "v equals v initial plus at."

      - id: s006
        title: Choose the position-time equation
        instruction: "If the target is position or displacement and time is known, position as a function of time is usually the direct route."
        type: multipleChoice
        prompt: "A dropped object starts from rest and falls for a known time. You need displacement. Which equation is the cleanest?"
        choices:
          - id: a
            text: '$\Delta x=v_it+\frac12at^2$'
          - id: b
            text: '$v_f=v_i+at$'
          - id: c
            text: '$v_f^2=v_i^2+2a\Delta x$'
          - id: d
            text: '$v_i=v_f$'
        answer:
          choiceId: a
        hint: "The target is displacement, and the time interval is known."
        explanation: |
          The position-time equation accumulates motion over a known time interval. If the object starts from rest, $v_i=0$, but the acceleration term still matters.

          Related topic: displacement under constant acceleration. Review why the $\frac12at^2$ term appears.

      - id: s007
        title: Choose the no-time equation
        instruction: "When time is not known and not requested, avoid introducing it unless you must."
        type: multipleChoice
        prompt: "A motorcycle has known $v_i$, known $a$, and known displacement. You need $v_f$, but time is not known. Which equation is most direct?"
        choices:
          - id: a
            text: '$v_f^2=v_i^2+2a\Delta x$'
          - id: b
            text: '$v_f=v_i+at$'
          - id: c
            text: '$\Delta x=v_it+\frac12at^2$'
          - id: d
            text: '$\Delta x=0$'
        answer:
          choiceId: a
        hint: "Pick the equation that omits time."
        explanation: |
          $v_f^2=v_i^2+2a\Delta x$ is the velocity-position equation. It is ideal when velocity, acceleration, and displacement matter but time does not.

          Related topic: time-eliminated kinematics equation. Look up "v squared equals v initial squared plus 2 a delta x."

      - id: s008
        title: Use stop conditions
        instruction: "Stopping problems usually give a final velocity condition."
        type: multipleChoice
        prompt: "A train brakes until it stops. Which substitution should you usually make first?"
        choices:
          - id: a
            text: '$v_f=0$'
          - id: b
            text: '$v_i=0$'
          - id: c
            text: '$a=0$'
          - id: d
            text: '$t=0$'
        answer:
          choiceId: a
        hint: "Stopping describes final velocity."
        explanation: |
          "Stops" means final velocity is zero. After that, choose the equation based on whether the problem asks for stopping time or stopping distance.

          Related topic: braking motion. Look up "stopping time versus stopping distance kinematics."

      - id: s009
        title: Separate stopping time from stopping distance
        instruction: "The same story can require different equations depending on the requested unknown."
        type: multipleChoice
        prompt: "A car brakes from known $v_i$ with known constant acceleration. Which pairing is correct?"
        choices:
          - id: a
            text: 'Stopping time: use $v_f=v_i+at$; stopping distance: use $v_f^2=v_i^2+2a\Delta x$.'
          - id: b
            text: 'Stopping time: use $a=0$; stopping distance: use $t=0$.'
          - id: c
            text: 'Stopping time and stopping distance always use only $\Delta x=v_it$.'
          - id: d
            text: 'Stopping problems cannot use kinematic equations.'
        answer:
          choiceId: a
        hint: "Time target uses the velocity-time equation; displacement target often uses the no-time equation."
        explanation: |
          If you need stopping time, set $v_f=0$ in $v_f=v_i+at$. If you need stopping distance without finding time first, set $v_f=0$ in $v_f^2=v_i^2+2a\Delta x$.

          Related topic: choosing by requested unknown. Review how one physical scenario can lead to different equations.

      - id: s010
        title: Use turning-point facts
        instruction: "Projectile and vertical-motion problems often hide useful conditions at the top of the path."
        type: multipleChoice
        prompt: "A ball is thrown upward. At the highest point, what is true about its vertical velocity?"
        choices:
          - id: a
            text: '$v_y=0$'
          - id: b
            text: '$a_y=0$'
          - id: c
            text: '$\Delta y=0$ for every upward throw'
          - id: d
            text: '$t=0$'
        answer:
          choiceId: a
        hint: "The ball momentarily changes direction at the top."
        explanation: |
          At the highest point, vertical velocity is zero, but acceleration is still gravity. If upward is positive, $a_y=-g$ throughout the flight.

          Related topic: vertical motion turning points. Look up "velocity at maximum height projectile motion."

      - id: s011
        title: Use return-height symmetry carefully
        instruction: "Returning to the same height gives a position condition, not an acceleration condition."
        type: multipleChoice
        prompt: "A ball returns to the same height where it was released. Which condition should be used?"
        choices:
          - id: a
            text: '$\Delta y=0$'
          - id: b
            text: '$a_y=0$'
          - id: c
            text: '$v_i=0$'
          - id: d
            text: '$g=0$'
        answer:
          choiceId: a
        hint: "Same height means final position equals initial position."
        explanation: |
          Returning to the release height means $y_f=y_i$, so $\Delta y=0$. Gravity remains active the whole time.

          Related topic: symmetric vertical motion. Review "same launch and landing height projectile motion."

      - id: s012
        title: Notice when two equations are needed
        instruction: "Some problems ask for multiple target quantities, so one equation may not be enough."
        type: multipleChoice
        prompt: 'A cart has known $v_i$, $a$, and $t$. You need both $v_f$ and $\Delta x$. What should you do?'
        choices:
          - id: a
            text: 'Use $v_f=v_i+at$ for velocity and $\Delta x=v_it+\frac12at^2$ for displacement.'
          - id: b
            text: 'Use only $v_f^2=v_i^2+2a\Delta x$ because it contains every answer.'
          - id: c
            text: 'Set acceleration to zero and use constant velocity.'
          - id: d
            text: 'Avoid equations because there are two unknowns.'
        answer:
          choiceId: a
        hint: "One target is velocity; the other is displacement."
        explanation: |
          When time is known, $v_f=v_i+at$ gives final velocity directly, and $\Delta x=v_it+\frac12at^2$ gives displacement directly.

          Related topic: multi-part kinematics problems. Make a known/unknown table before solving.

      - id: s013
        title: Avoid unnecessary unknowns
        instruction: "A clean equation does not introduce a new unknown that the problem did not ask for."
        type: multipleChoice
        prompt: 'Why is $v_f^2=v_i^2+2a\Delta x$ often better when time is not known?'
        choices:
          - id: a
            text: "It avoids introducing time as an extra unknown."
          - id: b
            text: "It only works when acceleration is zero."
          - id: c
            text: "It ignores displacement."
          - id: d
            text: "It is always more accurate than every other equation."
        answer:
          choiceId: a
        hint: "Equations with fewer irrelevant unknowns are easier to solve."
        explanation: |
          If time is absent and not requested, the no-time equation often avoids a two-step solution.

          Related topic: equation efficiency. Look up "choose kinematic equation missing variable."

      - id: s014
        title: Connect to calculus
        instruction: "The equations are not magic formulas. They come from relationships between derivatives and integrals."
        type: multipleChoice
        prompt: "Which calculus relationship underlies one-dimensional kinematics?"
        choices:
          - id: a
            text: 'Acceleration is the derivative of velocity, and velocity is the derivative of position.'
          - id: b
            text: 'Position is the derivative of acceleration.'
          - id: c
            text: 'Velocity is unrelated to slope.'
          - id: d
            text: 'Acceleration is always zero after integration.'
        answer:
          choiceId: a
        hint: "Think of position, velocity, and acceleration as a derivative chain."
        explanation: |
          The chain is:

          $$a(t)=v'(t), \qquad v(t)=x'(t).$$

          If acceleration is constant, integrating once gives velocity as a linear function of time, and integrating again gives position as a quadratic function of time.

          Related topic: calculus foundations of kinematics. Look up "derive kinematic equations by integration."

      - id: s015
        title: Build the selection checklist
        instruction: "Use this checklist before solving: assumption, target, knowns, missing variable, hidden condition."
        type: selectAll
        prompt: "Which questions belong in a good kinematic equation-selection checklist?"
        choices:
          - id: a
            text: "Is acceleration constant?"
          - id: b
            text: "What variable is the problem asking for?"
          - id: c
            text: "Which variable is missing or unnecessary?"
          - id: d
            text: "Are there hidden conditions like starts from rest, stops, same height, or highest point?"
        answer:
          choiceIds:
            - a
            - b
            - c
            - d
        hint: "The checklist should happen before algebra."
        explanation: |
          This is the main pattern:

          1. Confirm constant acceleration.
          2. Identify the target variable.
          3. List known values and hidden conditions.
          4. Notice the absent variable.
          5. Choose the equation that includes the target and avoids unnecessary unknowns.

          Related topic: kinematics problem setup. Review known/unknown tables.

      - id: s016
        title: Apply the full checklist
        instruction: "Now choose the equation from a full story by identifying the structure."
        type: multipleChoice
        prompt: |
          A rock is thrown straight upward from a cliff. You know its initial upward velocity, the height of the cliff above the ground, and gravitational acceleration. You want its speed just before it hits the ground, not the time of flight.

          Which equation is most direct?
        choices:
          - id: a
            text: '$v_f^2=v_i^2+2a\Delta y$'
          - id: b
            text: '$v_f=v_i+at$'
          - id: c
            text: '$\Delta y=v_it+\frac12at^2$'
          - id: d
            text: '$a=0$'
        answer:
          choiceId: a
        hint: "You know displacement and want final speed, but you do not want time."
        explanation: |
          The target is final speed. The known structure includes initial velocity, acceleration, and vertical displacement from the cliff to the ground. Time is not requested.

          Use:

          $$v_f^2=v_i^2+2a\Delta y.$$

          Related topic: vertical motion without time. Look up "projectile final speed from height no time."

      - id: s017
        title: Explain the method
        instruction: "Finish by writing the reasoning pattern in your own words."
        type: freeResponse
        prompt: "How should you choose a kinematic equation before doing algebra?"
        answer:
          expected: "First check that acceleration is constant. Then identify the target variable, translate phrases like starts from rest or stops, list known quantities, notice which variable is missing or unnecessary, and choose the equation that contains the target while avoiding extra unknowns."
          gradingMode: selfCheck
          keyPoints:
            - "Check constant acceleration."
            - "Identify the target variable."
            - "Translate hidden conditions like rest, stop, same height, or highest point."
            - "List knowns and the missing variable."
            - "Choose the equation that directly connects the target and knowns."
        hint: "Think: assumption, target, knowns, missing variable, hidden condition."
        explanation: |
          Equation selection is mostly classification. The formula is chosen by structure before numbers are substituted.

          Related topic: conceptual kinematic equation selection. Quick lookup phrase: "which kinematic equation to use missing variable."
