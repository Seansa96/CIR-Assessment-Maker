items:
- id: item-1
  type: typed
  prompt: What is the sign of q for a system that releases heat?
  answer:
    expected: negative
  explanation: 'Solution: Heat leaves the system, so $q<0$.


    Why it works: By convention, energy leaving a system is negative.'
- id: item-2
  type: typed
  prompt: What equation relates heat, mass, specific heat, and temperature change?
  answer:
    expected: $q=mc\Delta T$
  explanation: 'Solution: Multiply mass by specific heat and final-minus-initial temperature.


    Why it works: This model gives heat absorbed or released during a temperature change.'
- id: item-3
  type: typed
  prompt: What happens to ΔH when a thermochemical equation is reversed?
  answer:
    expected: Its sign reverses.
  explanation: 'Solution: Reverse $+x$ to $-x$, or vice versa.


    Why it works: Reversing the process reverses energy transfer.'
- id: item-4
  type: typed
  prompt: What happens to ΔH when all coefficients are multiplied by 2?
  answer:
    expected: It is multiplied by 2.
  explanation: 'Solution: Scale the energy with the extensive reaction amount.


    Why it works: Enthalpy is tied to the equation as written.'
- id: item-5
  type: typed
  prompt: State the formation-enthalpy equation for reaction enthalpy.
  answer:
    expected: sum of products minus sum of reactants
  explanation: 'Solution: Apply each stoichiometric coefficient before subtracting.


    Why it works: Formation enthalpies add according to the balanced equation.'
- id: item-6
  type: typed
  prompt: What is ΔHf° for an element in its standard state?
  answer:
    expected: zero
  explanation: 'Solution: Use zero for forms such as O₂(g) and C(graphite).


    Why it works: The reference convention defines these formation values.'
- id: item-7
  type: typed
  prompt: What are surroundings in a coffee-cup calorimeter?
  answer:
    expected: The water and calorimeter outside the reaction.
  explanation: 'Solution: They receive or supply heat measured by temperature change.


    Why it works: System and surroundings exchange equal and opposite heat.'
- id: item-8
  type: typed
  prompt: What does exothermic mean?
  answer:
    expected: The system releases heat.
  explanation: 'Solution: An exothermic reaction has negative q and typically negative ΔH.


    Why it works: Heat flows from system to surroundings.'
- id: item-9
  type: typed
  prompt: Why must a thermochemical equation be balanced?
  answer:
    expected: Coefficients define the amount associated with ΔH.
  explanation: 'Solution: Use the balanced coefficients in mole-to-energy conversions.


    Why it works: Reaction enthalpy is extensive.'
- id: item-10
  type: typed
  prompt: What does Hess’s law allow?
  answer:
    expected: Add reaction equations and their enthalpies to obtain a target reaction.
  explanation: 'Solution: Manipulate equations until intermediates cancel.


    Why it works: Enthalpy depends only on initial and final states.'
