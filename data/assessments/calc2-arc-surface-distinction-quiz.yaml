questions:
  - id: arc-surf-1-distinction
    type: multipleChoice
    skills:
    - arc-surface-distinction
    prompt: |
      You are given the curve $y = \frac{x^3}{3} + \frac{1}{4x}$ for $1 \le x \le 2$. 
      Which of the following integrals represents the **surface area** generated by revolving this curve about the **$x$-axis**?
    choices:
      - id: a
        text: '$\int_1^2 \sqrt{1 + (x^2 - \frac{1}{4x^2})^2} \, dx$'
      - id: b
        text: '$2\pi \int_1^2 x \sqrt{1 + (x^2 - \frac{1}{4x^2})^2} \, dx$'
      - id: c
        text: '$2\pi \int_1^2 (\frac{x^3}{3} + \frac{1}{4x}) \sqrt{1 + (x^2 - \frac{1}{4x^2})^2} \, dx$'
      - id: d
        text: '$\pi \int_1^2 (\frac{x^3}{3} + \frac{1}{4x})^2 \sqrt{1 + (x^2 - \frac{1}{4x^2})^2} \, dx$'
    answer:
      choiceId: c
    explanation: |
      First, distinguish between Arc Length, Surface Area, and Volume.
      - **Arc Length**: $L = \int \sqrt{1 + (f'(x))^2} \, dx$ (Choice A is just the arc length).
      - **Volume (Disk)**: $V = \pi \int (f(x))^2 \, dx$.
      - **Surface Area**: $SA = \int 2\pi r \cdot ds$, where $ds = \sqrt{1 + (f'(x))^2} \, dx$.
      
      Since we are revolving about the $x$-axis, the radius $r$ of the surface of revolution at a point $(x,y)$ is the distance from the point to the $x$-axis, which is $y$ (or $f(x)$).
      
      Therefore, $r = \frac{x^3}{3} + \frac{1}{4x}$.
      The derivative is $y' = x^2 - \frac{1}{4x^2}$.
      
      Plugging this into the Surface Area formula:
      $$SA = \int_1^2 2\pi y \sqrt{1 + (y')^2} \, dx = 2\pi \int_1^2 (\frac{x^3}{3} + \frac{1}{4x}) \sqrt{1 + (x^2 - \frac{1}{4x^2})^2} \, dx$$
      
      *Common Error Traps:* Choice B uses $r = x$, which would be correct if revolving about the $y$-axis. Choice D mixes the volume formula $\pi r^2$ with the arc length element $ds$.

  - id: arc-surf-2-simplification
    type: multipleChoice
    skills:
    - arc-surface-distinction
    prompt: |
      Find the arc length of the curve $y = \frac{1}{8}x^2 - \ln(x)$ from $x = 1$ to $x = 2$. 
      *(Hint: Look for a perfect square after expanding $1 + (y')^2$.)*
    choices:
      - id: a
        text: '$\frac{3}{8} + \ln(2)$'
      - id: b
        text: '$\frac{3}{8} - \ln(2)$'
      - id: c
        text: '$\frac{15}{8} + \ln(2)$'
      - id: d
        text: '$\frac{15}{8} - \ln(2)$'
    answer:
      choiceId: a
    explanation: |
      The arc length formula is $L = \int_1^2 \sqrt{1 + (y')^2} \, dx$.
      
      First, find the derivative:
      $$y' = \frac{1}{4}x - \frac{1}{x}$$
      
      Square it:
      $$(y')^2 = (\frac{1}{4}x - \frac{1}{x})^2 = \frac{1}{16}x^2 - 2(\frac{1}{4}x)(\frac{1}{x}) + \frac{1}{x^2} = \frac{1}{16}x^2 - \frac{1}{2} + \frac{1}{x^2}$$
      
      Add 1:
      $$1 + (y')^2 = 1 + \frac{1}{16}x^2 - \frac{1}{2} + \frac{1}{x^2} = \frac{1}{16}x^2 + \frac{1}{2} + \frac{1}{x^2}$$
      
      Notice this is a perfect square! It is exactly $(y')^2$ but with a $+\frac{1}{2}$ instead of $-\frac{1}{2}$.
      $$1 + (y')^2 = (\frac{1}{4}x + \frac{1}{x})^2$$
      
      Now, take the square root for the integral:
      $$\sqrt{1 + (y')^2} = \frac{1}{4}x + \frac{1}{x}$$
      
      Integrate:
      $$L = \int_1^2 (\frac{1}{4}x + \frac{1}{x}) \, dx = [\frac{1}{8}x^2 + \ln|x|]_1^2$$
      $$= (\frac{1}{8}(4) + \ln(2)) - (\frac{1}{8}(1) + \ln(1))$$
      $$= (\frac{1}{2} + \ln(2)) - \frac{1}{8} = \frac{3}{8} + \ln(2)$$

  - id: arc-surf-3-y-axis-surface
    type: multipleChoice
    skills:
    - arc-surface-distinction
    prompt: |
      Consider the curve $x = \sqrt{2y - y^2}$ for $0 \le y \le 1$. Which integral represents the surface area generated by revolving this curve around the **$y$-axis**?
    choices:
      - id: a
        text: '$2\pi \int_0^1 y \sqrt{1 + (\frac{1-y}{\sqrt{2y-y^2}})^2} \, dy$'
      - id: b
        text: '$2\pi \int_0^1 \sqrt{2y - y^2} \sqrt{1 + (\frac{1-y}{\sqrt{2y-y^2}})^2} \, dy$'
      - id: c
        text: '$2\pi \int_0^1 \sqrt{2y - y^2} \sqrt{1 + (\frac{1}{2\sqrt{2y-y^2}})^2} \, dy$'
      - id: d
        text: '$2\pi \int_0^1 (1-y) \sqrt{1 + (\frac{1-y}{\sqrt{2y-y^2}})^2} \, dy$'
    answer:
      choiceId: b
    explanation: |
      We are given $x = g(y)$ and revolving about the $y$-axis.
      The formula for surface area is $SA = \int 2\pi r \, ds$.
      
      When revolving about the $y$-axis, the radius $r$ is the distance to the $y$-axis, which is $x$.
      Therefore, $r = x = \sqrt{2y - y^2}$.
      
      The arc length element with respect to $y$ is $ds = \sqrt{1 + (dx/dy)^2} \, dy$.
      Let's find $dx/dy$:
      $$x = (2y - y^2)^{1/2}$$
      $$\frac{dx}{dy} = \frac{1}{2}(2y - y^2)^{-1/2} \cdot (2 - 2y) = \frac{1 - y}{\sqrt{2y - y^2}}$$
      
      Substitute $r$ and $dx/dy$ into the integral:
      $$SA = \int_0^1 2\pi \sqrt{2y - y^2} \sqrt{1 + \left(\frac{1-y}{\sqrt{2y-y^2}}\right)^2} \, dy$$
      
      Choice B exactly matches this. Choice A incorrectly uses $r = y$ (which would be for revolution about the $x$-axis).
