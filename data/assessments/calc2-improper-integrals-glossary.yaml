title: Improper Integrals Glossary and Formula Map
assessmentType: glossary
categoryId: calculus-2
topicId: improper-integrals
modeDefault: practice
randomizeQuestions: false
skills: [improper-integral-limits, p-test, comparison-test]
navigation: { learningGoal: learn, activityType: glossary, tags: [calculus-2, improper-integrals, formulas, terminology] }
authoring: { visualRequirement: required, visualRationale: The limit map supplies recognition cues for the three defect locations. }
glossary:
  introduction: 'Use the location of the defect to select a limit definition. The same p-power has different convergence thresholds at infinity and near a finite singularity.'
  sections:
  - id: improper-core-terms
    title: Limits, defects, and benchmark forms
    required: true
    content: 'These entries are the language needed to set up and classify improper integrals.'
    entries:
    - id: type-one
      term: Type 1 improper integral
      definition: An integral over an infinite interval, defined through a limit of truncated finite integrals.
      notation: '$\int_a^\infty f(x)\,dx=\lim_{t\to\infty}\int_a^t f(x)\,dx$'
      examples: ['A left tail uses an analogous lower-limit cutoff.']
      aliases: []
      media: [{ type: image, src: /media/calculus/improper-integral-limit-map.svg, alt: Infinite-interval branch of the improper-integral limit map }]
      tags: [type-1, tail]
      drills: [{ id: type-one-drill, type: cloze, prompt: 'An integral over $[a,\infty)$ is called Type ____.', answer: { expected: '1', aliases: ['one', 'I'] }, explanation: 'Infinite intervals are Type 1 improper integrals.', tags: [type-1] }]
    - id: type-two
      term: Type 2 improper integral
      definition: An integral whose integrand is unbounded at an endpoint or an interior point of a finite interval.
      notation: '$\int_a^b f=\lim_{t\to a^+}\int_t^b f$ when the left endpoint is singular'
      examples: ['An interior asymptote requires two independent one-sided limits.']
      aliases: []
      media: [{ type: image, src: /media/calculus/improper-integral-limit-map.svg, alt: Endpoint and interior-singularity branches of the limit map }]
      tags: [type-2, singularity]
      drills: [{ id: type-two-drill, type: cloze, prompt: 'An unbounded integrand on a finite interval creates a Type ____ improper integral.', answer: { expected: '2', aliases: ['two', 'II'] }, explanation: 'Finite-domain singularities are Type 2.', tags: [type-2] }]
    - id: convergence
      term: Convergent improper integral
      definition: Every required defining limit exists and is finite.
      notation: ''
      examples: ['For an interior singularity, both split limits must be finite.']
      aliases: []
      media: []
      tags: [convergence]
      drills: [{ id: convergence-drill, type: typed, prompt: 'What must be true of every defining limit for an improper integral to converge?', answer: { expected: 'It exists and is finite', aliases: ['finite', 'all required limits are finite'] }, explanation: 'One divergent component makes the whole improper integral diverge.', tags: [convergence] }]
    - id: p-tail
      term: Infinite-tail p-test
      definition: The integral $\int_1^\infty x^{-p}\,dx$ converges exactly when $p>1$.
      notation: '$p>1$ at infinity'
      examples: ['$1/x^2$ has finite tail area; $1/x$ does not.']
      aliases: []
      media: []
      tags: [p-test, tail]
      drills: [{ id: p-tail-drill, type: cloze, prompt: 'At infinity, $\int_1^\infty x^{-p}\,dx$ converges when $p$ is ____ than 1.', answer: { expected: greater, aliases: ['greater than', '>'] }, explanation: 'Tail decay must be faster than $1/x$.', tags: [p-test] }]
    - id: p-endpoint
      term: Endpoint p-test
      definition: The integral $\int_0^1 x^{-p}\,dx$ converges exactly when $p<1$.
      notation: '$p<1$ near zero'
      examples: ['$1/\sqrt{x}$ is integrable near zero; $1/x$ is not.']
      aliases: []
      media: []
      tags: [p-test, endpoint]
      drills: [{ id: p-endpoint-drill, type: cloze, prompt: 'Near zero, $\int_0^1x^{-p}\,dx$ converges when $p$ is ____ than 1.', answer: { expected: less, aliases: ['less than', '<'] }, explanation: 'The endpoint threshold reverses from the infinite-tail case.', tags: [p-test] }]
    - id: comparison
      term: Direct comparison for positive integrals
      definition: Near the defect, a smaller nonnegative function than a convergent benchmark has a convergent integral; a larger one than a divergent benchmark has a divergent integral.
      notation: ''
      examples: ['$0\le f(x)\le x^{-2}$ eventually implies a convergent tail for f.']
      aliases: []
      media: []
      tags: [comparison]
      drills: [{ id: comparison-drill, type: flashcard, prompt: 'Which comparison direction proves divergence for nonnegative functions?', answer: { expected: 'A function larger than a divergent benchmark', aliases: ['larger than a divergent comparison function'] }, explanation: 'A larger nonnegative area cannot be finite when the benchmark area is infinite.', tags: [comparison] }]
