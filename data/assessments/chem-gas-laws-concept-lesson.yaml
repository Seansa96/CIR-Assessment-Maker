lesson:
  introduction: |
    Four measurable properties completely define the state of any gas: **pressure ($P$), volume ($V$), temperature ($T$), and number of moles ($n$)**. The gas laws are simple mathematical relationships between these variables, keeping one or more of them constant.
  sections:
    - id: sec-simple-laws
      title: Boyle's, Charles's, and Avogadro's Laws
      required: true
      content: |
        - **Boyle's Law ($P$ vs $V$):** At constant $T$ and $n$, pressure and volume are **inversely proportional**. If you halve the volume, you double the pressure.
          $$P_1 V_1 = P_2 V_2$$
          *(Think of squishing a balloon — the pressure inside goes up).*

        - **Charles's Law ($V$ vs $T$):** At constant $P$ and $n$, volume and absolute temperature (Kelvin) are **directly proportional**.
          $$\frac{V_1}{T_1} = \frac{V_2}{T_2}$$
          *(Think of a hot air balloon expanding as it is heated).*

        - **Avogadro's Law ($V$ vs $n$):** At constant $P$ and $T$, volume and the number of moles are **directly proportional**.
          $$\frac{V_1}{n_1} = \frac{V_2}{n_2}$$
          *(Think of blowing more air into a balloon — it gets bigger).*
      media:
        - type: image
          src: /media/chemistry/solids-liquids-gases/chem-gas-laws-graphs.png
          alt: Three graphs showing the inverse relationship of P vs V, the direct relationship of V vs T, and the direct relationship of V vs n.
          caption: "Boyle's law shows an inverse curve. Charles's and Avogadro's laws show linear, direct relationships."
      check:
        id: chk-gaslaws-1
        type: multipleChoice
        prompt: |
          A fixed amount of gas in a rigid container (constant volume) is heated from 300 K to 600 K. According to the relationships described, what happens to the pressure?

          *(Hint: This is Gay-Lussac's law, a direct consequence of combining the others).*
        choices:
          - id: a
            text: The pressure halves.
          - id: b
            text: The pressure remains constant.
          - id: c
            text: The pressure doubles.
          - id: d
            text: The pressure increases by a factor of 4.
        answer:
          choiceId: c
        explanation: |
          Like volume and temperature, **pressure and temperature** are directly proportional when volume is held constant. If the Kelvin temperature doubles (300 K → 600 K), the kinetic energy of the molecules doubles, causing them to hit the rigid walls twice as hard/often, doubling the pressure.

    - id: sec-combined-and-ideal
      title: The Combined and Ideal Gas Laws
      required: true
      content: |
        **The Combined Gas Law:**
        Combines Boyle's and Charles's (and Gay-Lussac's) laws into one equation for a fixed amount of gas (constant $n$):
        $$\frac{P_1 V_1}{T_1} = \frac{P_2 V_2}{T_2}$$
        *(Always use Kelvin for temperature!)*

        **The Ideal Gas Law:**
        When you need to know the actual number of moles (or grams), you use the Ideal Gas Law:
        $$PV = nRT$$
        Where $R$ is the ideal gas constant. The value of $R$ depends on your pressure units:
        - If $P$ is in **atm**, $R = 0.08206$ L·atm/(mol·K)
        - If $P$ is in **torr** or **mm Hg**, $R = 62.36$ L·torr/(mol·K)
        - If $P$ is in **kPa**, $R = 8.314$ J/(mol·K)
      check:
        id: chk-gaslaws-2
        type: numericResponse
        prompt: |
          A 2.0 L balloon at 300 K and 1.0 atm is heated to 450 K while the pressure remains 1.0 atm. What is the new volume (in L)?
        answer:
          value: 3.0
          tolerance: 0.1
        explanation: |
          Using Charles's Law ($\frac{V_1}{T_1} = \frac{V_2}{T_2}$):
          $$\frac{2.0 \text{ L}}{300 \text{ K}} = \frac{V_2}{450 \text{ K}}$$
          $$V_2 = 2.0 \times \frac{450}{300} = 2.0 \times 1.5 = 3.0 \text{ L}$$

    - id: sec-dalton-partial
      title: Dalton's Law of Partial Pressures
      required: true
      content: |
        Because gas molecules are so far apart, they don't care about the identity of their neighbors (assuming ideal behavior).

        **Dalton's Law:** In a mixture of non-reacting gases, the total pressure is simply the sum of the partial pressures of the individual gases.
        $$P_{total} = P_1 + P_2 + P_3 + \dots$$

        **Mole Fraction ($\chi$):**
        The partial pressure of a gas is directly proportional to its mole fraction in the mixture.
        $$P_A = \chi_A \times P_{total}$$
        Where $\chi_A = \frac{\text{moles of A}}{\text{total moles}}$.

        For example, air is ~78% Nitrogen by moles ($\chi = 0.78$). If total atmospheric pressure is 1.0 atm, the partial pressure of nitrogen is $1.0 \times 0.78 = 0.78$ atm.
      check:
        id: chk-gaslaws-3
        type: numericResponse
        prompt: |
          A tank contains 2.0 moles of $He$ and 3.0 moles of $Ne$. If the total pressure in the tank is 10.0 atm, what is the partial pressure of $He$ (in atm)?
        answer:
          value: 4.0
          tolerance: 0.1
        explanation: |
          Total moles = $2.0 + 3.0 = 5.0$ moles.
          Mole fraction of He ($\chi_{He}$) = $2.0 / 5.0 = 0.40$.
          Partial pressure of He = $\chi_{He} \times P_{total} = 0.40 \times 10.0 = 4.0$ atm.
