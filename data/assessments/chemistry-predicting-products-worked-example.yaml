workedExamples:
- id: we001
  title: Predicting Products of Aluminum Sulfate and Barium Hydroxide
  problem: |
    Aqueous solutions of aluminum sulfate, $Al_2(SO_4)_3(aq)$, and barium hydroxide, $Ba(OH)_2(aq)$, are mixed in a beaker. A chemical reaction occurs.
    
    We need to predict the products, determine their phases, and write the balanced molecular equation for this reaction.
  steps:
  - id: step-1
    title: Identify the Reaction Type
    instruction: |
      First, look at the reactants. We have two aqueous ionic compounds mixing together. What major class of reaction involves two ionic compounds exchanging partners?
    type: multipleChoice
    skills:
    - chemical-reactions-types
    prompt: 'What type of reaction will occur between $Al_2(SO_4)_3(aq)$ and $Ba(OH)_2(aq)$?'
    choices:
    - id: a
      text: Synthesis
    - id: b
      text: Decomposition
    - id: c
      text: Single Displacement
    - id: d
      text: Double Displacement (Precipitation)
    answer:

      choiceId: d
    explanation: 'When two aqueous ionic compounds are mixed, they typically undergo a double displacement reaction, potentially forming a solid precipitate.'
  
  - id: step-2
    title: Break Reactants into Ions
    instruction: |
      To predict the products correctly, we must first break the reactants into their constituent ions and determine their charges. Do not just drag subscripts over!
      
      The reactants are $Al_2(SO_4)_3$ and $Ba(OH)_2$.
    type: selectAll
    skills:
    - polyatomic-ions
    - periodic-table-patterns
    prompt: 'Which of the following represents the correct constituent ions (and charges) present in these reactants before they swap partners? (Select all that apply)'
    choices:
    - id: a
      text: $Al^{3+}$
    - id: b
      text: $SO_4^{2-}$
    - id: c
      text: $Ba^{2+}$
    - id: d
      text: $OH^-$
    - id: e
      text: $Al^{2+}$
    - id: f
      text: $OH^{2-}$
    answer:

      choiceIds: ['a', 'b', 'c', 'd']
    explanation: 'Aluminum is in Group 13 and forms a $+3$ ion. Sulfate is a polyatomic ion with a $-2$ charge. Barium is in Group 2 and forms a $+2$ ion. Hydroxide is a polyatomic ion with a $-1$ charge.'
  
  - id: step-3
    title: Swap Partners and Balance Charges
    instruction: |
      Now, swap the partners. The cation of the first reactant pairs with the anion of the second. The cation of the second reactant pairs with the anion of the first.
      
      We are forming bonds between:
      1. $Al^{3+}$ and $OH^-$
      2. $Ba^{2+}$ and $SO_4^{2-}$
      
      You must balance the charges to write neutral formulas for the new compounds. Do not worry about balancing the overall equation yet; just get the individual formulas right!
    type: multipleChoice
    skills:
    - ionic-compounds
    prompt: 'What are the correct empirical formulas for the two products?'
    choices:
    - id: a
      text: $AlOH_3$ and $Ba(SO_4)_2$
    - id: b
      text: $Al(OH)_3$ and $BaSO_4$
    - id: c
      text: $Al_2(OH)_3$ and $Ba_2(SO_4)_3$
    - id: d
      text: $AlOH$ and $BaSO_4$
    answer:

      choiceId: b
    explanation: 'To balance the $+3$ charge of Al, we need three $-1$ OH ions: $Al(OH)_3$. To balance the $+2$ charge of Ba, we need one $-2$ SO4 ion: $BaSO_4$.'

  - id: step-4
    title: Determine Phases Using Solubility Rules
    instruction: |
      Our products are $Al(OH)_3$ and $BaSO_4$.
      We must use solubility rules to determine if they are aqueous ($aq$) or solid precipitates ($s$).
      
      - Most hydroxides are insoluble. (Exceptions: Group 1, $NH_4^+$, $Ca^{2+}$, $Sr^{2+}$, $Ba^{2+}$).
      - Most sulfates are soluble. (Exceptions: $Ba^{2+}$, $Sr^{2+}$, $Pb^{2+}$, $Ag^+$, $Ca^{2+}$).
    type: multipleChoice
    skills:
    - solubility-rules
    prompt: 'What are the correct phases for the products?'
    choices:
    - id: a
      text: Both are soluble $(aq)$. No reaction occurs.
    - id: b
      text: $Al(OH)_3(s)$ and $BaSO_4(aq)$
    - id: c
      text: $Al(OH)_3(aq)$ and $BaSO_4(s)$
    - id: d
      text: $Al(OH)_3(s)$ and $BaSO_4(s)$
    answer:

      choiceId: d
    explanation: '$Al^{3+}$ is not an exception for hydroxides, so $Al(OH)_3$ is insoluble $(s)$. $Ba^{2+}$ is an exception for sulfates, so $BaSO_4$ is also insoluble $(s)$. Both products precipitate!'

  - id: step-5
    title: Balance the Overall Equation
    instruction: |
      We now have the complete skeleton equation:
      $Al_2(SO_4)_3(aq) + Ba(OH)_2(aq) \rightarrow Al(OH)_3(s) + BaSO_4(s)$
      
      The final step is to balance the entire equation by adding coefficients.
    type: symbolicResponse
    skills:
    - chemical-reactions-balancing
    prompt: 'Type the fully balanced molecular equation. Include the state symbols.'
    answer:
      expectedLatex: Al_2(SO_4)_3(aq)+3Ba(OH)_2(aq)\rightarrow2Al(OH)_3(s)+3BaSO_4(s)
      equivalenceMode: expression
      tolerance: 0
    explanation: 'Start by balancing Al: place a 2 in front of $Al(OH)_3$. This gives 6 $OH^-$ ions on the right. To balance $OH^-$, place a 3 in front of $Ba(OH)_2$. This gives 3 $Ba^{2+}$ ions on the left. To balance Ba, place a 3 in front of $BaSO_4$. Now, check sulfate: there are 3 $SO_4^{2-}$ on the left and 3 on the right. It is balanced.'
