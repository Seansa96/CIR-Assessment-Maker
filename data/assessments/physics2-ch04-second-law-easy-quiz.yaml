questions:
- id: q001
  type: multipleChoice
  difficultyDimensions:
  - conceptual-mapping
  - principle-recognition
  prompt: Which of the following statements is a consequence of the Second Law of Thermodynamics?
  explanation: 'Solution: The Kelvin-Planck statement of the Second Law dictates that no engine can completely
    convert heat into work.

    Why it works: A 100% efficient engine would require a cold reservoir at absolute zero ($0\text{ K}$),
    which is impossible to reach. Thus, some waste heat must always be expelled.

    Why the other choices fail: Energy conservation is the First Law. Internal energy depends on temperature,
    not volume, for an ideal gas. Heat naturally flows from hot to cold, not cold to hot.'
  choices:
  - id: a
    text: It is impossible to build a heat engine that is 100% efficient.
  - id: b
    text: Energy can be neither created nor destroyed.
  - id: c
    text: The internal energy of an ideal gas depends only on its volume.
  - id: d
    text: Heat naturally flows from a colder body to a hotter body.
  answer:
    choiceId: a
- id: q002
  type: multipleChoice
  difficultyDimensions:
  - conceptual-mapping
  - principle-recognition
  prompt: 'In any reversible process, the total entropy of the universe:'
  explanation: 'Solution: For a truly reversible process, the entropy change of the system is exactly
    balanced by the entropy change of the surroundings.

    Why it works: Therefore, $\Delta S_{univ} = \Delta S_{sys} + \Delta S_{surr} = 0$.

    Why the other choices fail: Real (irreversible) processes cause an increase in the universe''s entropy,
    but reversible processes leave it unchanged. The entropy of the universe never decreases.'
  choices:
  - id: a
    text: Remains constant
  - id: b
    text: Always increases
  - id: c
    text: Always decreases
  - id: d
    text: Depends on the substance
  answer:
    choiceId: a
