questions:
  - { id: q001, type: freeResponse, prompt: 'Predict the precipitate when AgNO3(aq) and NaCl(aq) are mixed.', answer: { gradingMode: selfCheck, keyPoints: ['AgCl(s)'] }, explanation: 'Solution: AgCl(s) precipitates. Why it works: Silver chloride is insoluble. Common trap: Naming NaNO3, which remains aqueous.', difficultyDimensions: [representationTransfer, casePartition], difficultyEvidence: 'Matches exchanged ions to solubility behavior.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: easy-test-agcl-precipitate, variationAxes: { scenario: silver-halide mixing, unknown: precipitate } }
  - { id: q002, type: freeResponse, prompt: 'Write the net ionic equation for formation of BaSO4(s).', answer: { gradingMode: selfCheck, keyPoints: ['Ba2+(aq) + SO4 2−(aq) → BaSO4(s)'] }, explanation: 'Solution: Ba2+(aq)+SO4 2−(aq)→BaSO4(s). Why it works: One 2+ cation and one 2− anion form a neutral insoluble solid. Common trap: Splitting the solid.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Constructs a charge-balanced net ionic equation.', prerequisiteObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-test-baso4-net, variationAxes: { representation: ions to equation, unknown: net ionic equation } }
  - { id: q003, type: freeResponse, prompt: 'State the spectator ions for AgNO3(aq)+NaCl(aq)→AgCl(s)+NaNO3(aq).', answer: { gradingMode: selfCheck, keyPoints: ['Na+', 'NO3−'] }, explanation: 'Solution: Na+ and NO3− are spectators. Why it works: They remain aqueous and unchanged in the complete ionic equation. Common trap: Calling Cl− a spectator; it becomes part of AgCl(s).', difficultyDimensions: [representationTransfer, errorDiagnosis], difficultyEvidence: 'Distinguishes unchanged ions from precipitate-forming ions.', prerequisiteObjectiveIds: [spectator-ion-cancellation], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-test-agcl-spectators, variationAxes: { scenario: silver chloride reaction, unknown: spectators } }
  - { id: q004, type: freeResponse, prompt: 'Does NaNO3(aq)+KCl(aq) have a net ionic reaction?', answer: { gradingMode: selfCheck, keyPoints: ['no reaction', 'all ions remain aqueous'] }, explanation: 'Solution: No net reaction occurs. Why it works: All possible ions remain soluble and unchanged. Common trap: Writing a partner swap as though it proves reaction.', difficultyDimensions: [casePartition, proofJustification], difficultyEvidence: 'Applies the no-driving-force criterion.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: easy-test-soluble-mixture-nr, variationAxes: { scenario: two soluble salts, unknown: reaction decision } }
  - { id: q005, type: freeResponse, prompt: 'Write the complete ionic form of 2NaCl(aq).', answer: { gradingMode: selfCheck, keyPoints: ['2Na+(aq) + 2Cl−(aq)'] }, explanation: 'Solution: 2NaCl(aq) is 2Na+(aq)+2Cl−(aq). Why it works: Each soluble formula unit separates into one sodium and one chloride ion. Common trap: Dropping the equation coefficient.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Expands a coefficient-bearing soluble salt into ions.', prerequisiteObjectiveIds: [complete-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-test-split-coefficient-salt, variationAxes: { representation: coefficient formula to ions, unknown: complete ionic form } }
  - { id: q006, type: freeResponse, prompt: 'Write the balanced molecular equation for CaCl2(aq)+Na2CO3(aq).', answer: { gradingMode: selfCheck, keyPoints: ['CaCl2(aq)+Na2CO3(aq)→CaCO3(s)+2NaCl(aq)'] }, explanation: 'Solution: CaCl2(aq)+Na2CO3(aq)→CaCO3(s)+2NaCl(aq). Why it works: Ca2+ and CO3 2− form the insoluble neutral solid and coefficients conserve Na and Cl. Common trap: Writing CaCO3(aq).', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Predicts products, assigns phase, and balances molecular equation.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: easy-test-calcium-carbonate-molecular, variationAxes: { scenario: carbonate precipitation, unknown: molecular equation } }
  - { id: q007, type: freeResponse, prompt: 'Should KNO3(aq) be split in a complete ionic equation? State why.', answer: { gradingMode: selfCheck, keyPoints: ['yes', 'soluble ionic strong electrolyte', 'K+ + NO3−'] }, explanation: 'Solution: Yes; write K+(aq)+NO3−(aq). Why it works: A soluble ionic salt is a strong electrolyte in this representation. Common trap: Keeping every compound intact.', difficultyDimensions: [casePartition, representationTransfer], difficultyEvidence: 'Uses phase and electrolyte rule to choose equation treatment.', prerequisiteObjectiveIds: [complete-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-test-split-potassium-nitrate, variationAxes: { scenario: ionic equation rule, unknown: split decision } }
  - { id: q008, type: freeResponse, prompt: 'Should PbI2(s) be split in a complete ionic equation? State why.', answer: { gradingMode: selfCheck, keyPoints: ['no', 'solid remains intact'] }, explanation: 'Solution: No; PbI2(s) remains intact. Why it works: A precipitated solid is not a dispersed aqueous electrolyte. Common trap: Splitting every ionic compound regardless of phase.', difficultyDimensions: [casePartition, representationTransfer], difficultyEvidence: 'Applies phase exception to complete ionic notation.', prerequisiteObjectiveIds: [complete-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-test-keep-lead-iodide-solid, variationAxes: { scenario: precipitate notation, unknown: split decision } }
  - { id: q009, type: freeResponse, prompt: 'Write the net ionic equation for Pb2+(aq) and I−(aq).', answer: { gradingMode: selfCheck, keyPoints: ['Pb2+(aq)+2I−(aq)→PbI2(s)'] }, explanation: 'Solution: Pb2+(aq)+2I−(aq)→PbI2(s). Why it works: Two iodides balance one Pb2+ and the resulting salt is insoluble. Common trap: Writing one iodide.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Uses charge balance and phase prediction.', prerequisiteObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-test-pbi2-net, variationAxes: { representation: ions to solid, unknown: balanced equation } }
  - { id: q010, type: freeResponse, prompt: 'Identify the precipitate from MgCl2(aq)+2NaOH(aq).', answer: { gradingMode: selfCheck, keyPoints: ['Mg(OH)2(s)'] }, explanation: 'Solution: Mg(OH)2(s) precipitates. Why it works: Magnesium hydroxide is insoluble and requires two OH− to balance Mg2+. Common trap: Writing MgOH.', difficultyDimensions: [identityConstruction, representationTransfer], difficultyEvidence: 'Builds a neutral ionic product and applies solubility.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: easy-test-magnesium-hydroxide, variationAxes: { scenario: hydroxide mixing, unknown: precipitate formula } }
  - { id: q011, type: freeResponse, prompt: 'Write the net ionic equation for strong acid–strong base neutralization.', answer: { gradingMode: selfCheck, keyPoints: ['H+(aq)+OH−(aq)→H2O(l)'] }, explanation: 'Solution: H+(aq)+OH−(aq)→H2O(l). Why it works: The hydrogen and hydroxide ions form liquid water; counterions are spectators. Common trap: Keeping NaCl in the net ionic equation.', difficultyDimensions: [representationTransfer, casePartition], difficultyEvidence: 'Reduces a neutralization to the reacting ions and liquid product.', prerequisiteObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0410], reasoningSignature: easy-test-neutralization-net, variationAxes: { scenario: acid-base reaction, unknown: net ionic form } }
  - { id: q012, type: freeResponse, prompt: 'Why is BaSO4(s) a driving force for an aqueous reaction?', answer: { gradingMode: selfCheck, keyPoints: ['insoluble solid forms', 'ions removed from solution'] }, explanation: 'Solution: BaSO4(s) removes Ba2+ and SO4 2− from the aqueous-ion mixture. Why it works: Formation of an insoluble phase creates a net particle change. Common trap: Thinking the solid is merely a label change.', difficultyDimensions: [modelOrDerivation, globalLocalReasoning], difficultyEvidence: 'Connects precipitate formation with a particle-level driving force.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: easy-test-precipitate-driving-force, variationAxes: { scenario: precipitate concept, unknown: causal explanation } }
  - { id: q013, type: freeResponse, prompt: 'Complete the ionic equation: Ca2+(aq)+CO3 2−(aq)→ ?', answer: { gradingMode: selfCheck, keyPoints: ['CaCO3(s)'] }, explanation: 'Solution: The product is CaCO3(s). Why it works: The 2+ and 2− ions form a 1:1 neutral insoluble carbonate. Common trap: Adding unnecessary coefficients.', difficultyDimensions: [identityConstruction, representationTransfer], difficultyEvidence: 'Constructs neutral product formula from ion charges.', prerequisiteObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-test-complete-carbonate-net, variationAxes: { representation: partial net equation, unknown: product } }
  - { id: q014, type: freeResponse, prompt: 'For BaCl2(aq)+Na2SO4(aq), list the ions present before reaction.', answer: { gradingMode: selfCheck, keyPoints: ['Ba2+', '2Cl−', '2Na+', 'SO4 2−'] }, explanation: 'Solution: The ions are Ba2+, 2Cl−, 2Na+, and SO4 2−. Why it works: Both soluble salts dissociate according to their subscripts. Common trap: Leaving the salts as neutral molecules.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Expands two reactant formulas into a particle inventory.', prerequisiteObjectiveIds: [complete-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-test-reactant-ion-inventory, variationAxes: { representation: formulas to ions, unknown: particle inventory } }
  - { id: q015, type: freeResponse, prompt: 'For the same BaSO4 reaction, list the spectator ions.', answer: { gradingMode: selfCheck, keyPoints: ['Na+', 'Cl−'] }, explanation: 'Solution: Na+ and Cl− are spectators. Why it works: They stay aqueous on both sides while Ba2+ and sulfate form a solid. Common trap: Calling all reactant ions spectators.', difficultyDimensions: [representationTransfer, casePartition], difficultyEvidence: 'Partitions an ionic inventory into changed and unchanged species.', prerequisiteObjectiveIds: [spectator-ion-cancellation], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-test-baso4-spectators, variationAxes: { scenario: barium sulfate, unknown: spectator set } }
  - { id: q016, type: freeResponse, prompt: 'State one condition that makes an aqueous mixture a no-reaction case.', answer: { gradingMode: selfCheck, keyPoints: ['all species remain soluble unchanged ions', 'no precipitate gas water or weak electrolyte'] }, explanation: 'Solution: It is no reaction when no product removes or changes ions—for example, all possible products are soluble electrolytes. Why it works: No net particle-level change remains after spectators are considered. Common trap: Calling any two-solutions mixture a reaction.', difficultyDimensions: [casePartition, proofJustification], difficultyEvidence: 'States the condition separating no reaction from a driven aqueous process.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: easy-test-no-reaction-condition, variationAxes: { scenario: general decision, unknown: criterion } }
  - { id: q017, type: freeResponse, prompt: 'Write the complete ionic equation for HCl(aq)+NaOH(aq)→NaCl(aq)+H2O(l).', answer: { gradingMode: selfCheck, keyPoints: ['H+ + Cl− + Na+ + OH− → Na+ + Cl− + H2O'] }, explanation: 'Solution: H+(aq)+Cl−(aq)+Na+(aq)+OH−(aq)→Na+(aq)+Cl−(aq)+H2O(l). Why it works: Strong aqueous acid, base, and salt split; liquid water remains intact. Common trap: Splitting H2O(l).', difficultyDimensions: [representationTransfer, casePartition], difficultyEvidence: 'Applies splitting rules across acid, base, salt, and liquid phases.', prerequisiteObjectiveIds: [complete-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0410], reasoningSignature: easy-test-neutralization-complete-ionic, variationAxes: { representation: molecular to complete ionic, unknown: full ionic equation } }
  - { id: q018, type: freeResponse, prompt: 'Predict whether Na2SO4(aq)+KCl(aq) gives a precipitate.', answer: { gradingMode: selfCheck, keyPoints: ['no precipitate', 'sodium potassium and chloride salts soluble'] }, explanation: 'Solution: No precipitate forms. Why it works: The exchanged products K2SO4 and NaCl remain soluble. Common trap: Assuming every sulfate is insoluble.', difficultyDimensions: [casePartition, representationTransfer], difficultyEvidence: 'Uses product prediction and sulfate solubility exception reasoning.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: easy-test-soluble-sulfate-mixture, variationAxes: { scenario: sulfate salt mixture, unknown: precipitate decision } }
  - { id: q019, type: freeResponse, prompt: 'Explain why an equation must be balanced before it can be converted to complete ionic form.', answer: { gradingMode: selfCheck, keyPoints: ['conserve atoms and charge', 'coefficients must carry into ions'] }, explanation: 'Solution: Balance first so atom and charge counts are conserved when each aqueous compound is expanded into ions. Why it works: Ionic splitting does not repair incorrect stoichiometry. Common trap: Balancing individual ions after arbitrary cancellation.', difficultyDimensions: [proofJustification, errorDiagnosis], difficultyEvidence: 'Justifies correct procedural ordering using conservation.', prerequisiteObjectiveIds: [complete-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-test-balance-before-split, variationAxes: { scenario: procedure rationale, unknown: ordering reason } }
  - { id: q020, type: freeResponse, prompt: 'What observation would support that a precipitation reaction occurred?', answer: { gradingMode: selfCheck, keyPoints: ['visible solid or cloudiness', 'insoluble product'] }, explanation: 'Solution: A visible solid or cloudiness supports precipitate formation. Why it works: Insoluble product particles separate from the clear aqueous phase. Common trap: Treating color change alone as proof of precipitation.', difficultyDimensions: [representationTransfer, proofJustification], difficultyEvidence: 'Links a macroscopic observation to insoluble-particle formation.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: easy-test-precipitate-observation, variationAxes: { scenario: laboratory observation, unknown: evidence } }
