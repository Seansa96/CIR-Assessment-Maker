questions:
- id: q001
  type: freeResponse
  prompt: Find the volume of the higher-dimensional solid of revolution for f(x) =
    e^{-50 x^2}.
  answer:
    gradingMode: selfCheck
    checkModel: Requires advanced generalized volume formulas.
  explanation: Generalize the disk method to n-dimensions using Gamma functions.
- id: q002
  type: freeResponse
  prompt: Find the area bounded by y = 5x^2 and y = 7x.
  answer:
    gradingMode: selfCheck
    checkModel: '2.2866666666666666'
  explanation: Find intersections and integrate the difference of the functions.
- id: q003
  type: freeResponse
  prompt: Find the arc length of y = (2/3)3x^{3/2} from x=0 to x=3.
  answer:
    gradingMode: selfCheck
    checkModel: Evaluate integral of sqrt(1 + (y')^2).
  explanation: Apply the arc length formula.
