questions:
- id: q001
  type: multipleChoice
  prompt: 'A 1000 kg car accelerates from rest to 20 m/s in 5.0 seconds. What is the
    average power delivered by the car''s engine? (Ignore air resistance and friction).

    '
  choices:
  - id: a
    text: 40,000 W
  - id: b
    text: 200,000 W
  - id: c
    text: 20,000 W
  - id: d
    text: 4,000 W
  answer:
    choiceId: a
  explanation: 'Initial kinetic energy is 0. Final kinetic energy is $K_f = \frac{1}{2}(1000)(20)^2
    = 500 \times 400 = 200,000$ J. The net work done is equal to the change in kinetic
    energy: $W = 200,000$ J. Average power is $P = W / t = 200,000 / 5.0 = 40,000$
    W.

    '
- id: q002
  type: multipleChoice
  prompt: 'A spring exerts a restoring force $F(x) = -kx$. How much work does the
    *spring* do when it is stretched from its equilibrium position ($x=0$) to a displacement
    $x=A$?

    '
  choices:
  - id: a
    text: $-\frac{1}{2}kA^2$
  - id: b
    text: $\frac{1}{2}kA^2$
  - id: c
    text: $-kA$
  - id: d
    text: $kA^2$
  answer:
    choiceId: a
  explanation: 'Work is the integral of the force: $W = \int_{0}^{A} (-kx) dx = \left[
    -\frac{1}{2}kx^2 \right]_0^A = -\frac{1}{2}kA^2$. The work is negative because
    the spring force pulls in the opposite direction of the displacement.

    '
- id: q003
  type: multipleChoice
  prompt: 'A block of mass $m$ slides down a rough ramp of length $L$. It starts from
    rest. The work done by gravity is $W_g$ and the work done by friction is $W_f$.
    Which of the following expressions represents the final kinetic energy of the
    block at the bottom of the ramp?

    '
  choices:
  - id: a
    text: $W_g + W_f$
  - id: b
    text: $W_g - W_f$
  - id: c
    text: $W_g$
  - id: d
    text: $W_f$
  answer:
    choiceId: a
  explanation: 'By the Work-Kinetic Energy Theorem, $W_{net} = \Delta K$. The net
    work is the sum of the work done by all forces: $W_{net} = W_g + W_f + W_N$. Since
    the normal force does zero work ($W_N=0$), $\Delta K = W_g + W_f$. (Note: $W_f$
    is a negative value, so adding it mathematically reduces the kinetic energy, as
    expected).

    '
- id: q004
  type: numericResponse
  prompt: 'A 5.0 kg object moving at 4.0 m/s encounters a region of rough floor. It
    comes to a complete stop after sliding for 2.0 m. What is the magnitude of the
    friction force acting on it? (in Newtons)

    '
  answer:
    value: 20.0
    tolerance: 0.5
  explanation: 'Initial kinetic energy $K_i = \frac{1}{2} (5.0) (4.0)^2 = 40$ J. Final
    kinetic energy $K_f = 0$. By the Work-Energy Theorem, $W_{net} = \Delta K = -40$
    J. The only force doing work is friction: $W = -f_k d \implies -f_k (2.0) = -40
    \implies f_k = 20$ N.

    '
- id: q005
  type: multipleChoice
  prompt: 'If you double the speed of an object, what happens to the amount of work
    required to bring it to a stop?

    '
  choices:
  - id: a
    text: It quadruples.
  - id: b
    text: It doubles.
  - id: c
    text: It halves.
  - id: d
    text: It stays the same.
  answer:
    choiceId: a
  explanation: 'Kinetic energy is proportional to the square of the speed ($K \propto
    v^2$). Doubling the speed quadruples the initial kinetic energy. Since the work
    required to stop it must equal the change in kinetic energy ($W = \Delta K$),
    the required work also quadruples.

    '
