items:
  - { id: q001, type: cloze, prompt: 'Cartesian conversion uses $x=r\,$____$\theta$ and $y=r\,$____$\theta$.', answer: { expected: 'cos; sin', aliases: ['cos,sin'] }, explanation: 'Solution: The entries are cosine and sine. Why it works: They resolve a directed radius into horizontal and vertical components. Common trap: Reversing them.' }
  - { id: q002, type: typed, prompt: 'Give an equivalent coordinate for $(3,0)$ using negative radius.', answer: { expected: 'negative three pi', aliases: ['(-3,pi)', '-3 pi'] }, explanation: 'Solution: $(-3,\pi)$ is equivalent. Why it works: Negative radius reverses the ray. Common trap: Negating r without adding pi.' }
  - { id: q003, type: cloze, prompt: 'A zero of r places a polar point at the ____.', answer: { expected: pole, aliases: [origin] }, explanation: 'Solution: The point is at the pole. Why it works: Radius zero means zero distance from the pole. Common trap: Calling it only an x-intercept.' }
  - { id: q004, type: typed, prompt: 'What curve family is $r=2\cos\theta$?', answer: { expected: circle, aliases: ['a circle'] }, explanation: 'Solution: It is a circle. Why it works: Multiplying by r gives a completed-square Cartesian circle. Common trap: Calling it a rose.' }
  - { id: q005, type: recognition, prompt: '![Polar loop](/media/calculus/polar-review-loop-sector.svg) Which feature can be caused by negative radius values?', choices: [{ id: a, text: inner loop }, { id: b, text: Cartesian asymptote }], answer: { choiceId: a, expected: 'inner loop', aliases: [loop] }, explanation: 'Solution: An inner loop can result from a negative-r interval. Why it works: Points shift to opposite rays. Common trap: Treating the loop as a plotting error.' }
