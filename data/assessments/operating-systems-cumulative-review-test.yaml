questions:
- id: q001
  title: 'Introduction and System Calls: Operating system roles'
  type: multipleChoice
  prompt: |
    In the context of Introduction and System Calls, which statement best explains **Operating system roles**?
  choices:
  - id: a
    text: An operating system presents useful abstractions while allocating shared hardware resources fairly and safely.
  - id: b
    text: Treating the OS as only a user interface misses its resource-management role.
  - id: c
    text: It is unrelated to operating-system design.
  - id: d
    text: It is only a historical term with no modern relevance.
  answer:
    choiceId: a
  explanation: |
    An operating system presents useful abstractions while allocating shared hardware resources fairly and safely. This question checks whether the topic's core mental model is connected to OS responsibilities.
