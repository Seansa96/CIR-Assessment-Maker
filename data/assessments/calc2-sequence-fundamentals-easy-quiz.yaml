schemaVersion: 1
id: calc2-sequence-fundamentals-easy-quiz
title: Sequence Fundamentals Easy Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: sequence-fundamentals
skills:
- Evaluate explicit sequence limits
- Apply boundedness, monotonicity, and subsequence reasoning
- Interpret recurrence fixed points and epsilon thresholds
navigation:
  learningGoal: practice
  activityType: mixedPractice
  tags:
  - calculus-2
  - sequence-fundamentals
  - easy
  - sequence-limits
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - interpret-sequence-notation
  prompt: |
    If $a_n=2n-1$, what are the first three terms of the sequence $(a_n)$?
  choices:
  - id: a
    text: $1,3,5$
  - id: b
    text: $1,4,9$
  - id: c
    text: $2,4,6$
  - id: d
    text: $-1,1,3$
  answer:
    choiceId: a
  explanation: Substitute $n=1,2,3$ into $2n-1$ to obtain $1,3,5$.
- id: q002
  type: multipleChoice
  skills:
  - evaluate-rational-sequence-limits
  prompt: |
    Find
    $$\lim_{n\to\infty}\frac{5n^2-n}{2n^2+7}.$$
  choices:
  - id: a
    text: $0$
  - id: b
    text: $2/5$
  - id: c
    text: $5/2$
  - id: d
    text: |-
      $+\infty$
  answer:
    choiceId: c
  explanation: Divide by $n^2$; the lower-order fractions vanish and the leading-coefficient ratio is
    $5/2$.
- id: q003
  type: multipleChoice
  skills:
  - apply-the-squeeze-theorem
  prompt: |
    What is $\lim_{n\to\infty}\sin n/n$?
  choices:
  - id: a
    text: $-1$
  - id: b
    text: $0$
  - id: c
    text: $1$
  - id: d
    text: |-
      The limit does not exist because $\sin n$ oscillates.
  answer:
    choiceId: b
  explanation: |-
    The bound $-1/n\le\sin n/n\le1/n$ squeezes the sequence to zero.
- id: q004
  type: multipleChoice
  skills:
  - distinguish-boundedness-from-convergence
  prompt: |
    Which sequence is bounded but divergent?
  choices:
  - id: a
    text: $a_n=(-1)^n$
  - id: b
    text: $a_n=1/n$
  - id: c
    text: $a_n=2+1/n$
  - id: d
    text: $a_n=0$
  answer:
    choiceId: a
  explanation: Its terms remain in $[-1,1]$ but its even and odd subsequences approach different values.
- id: q005
  type: multipleChoice
  skills:
  - apply-monotone-convergence
  prompt: |
    Which information is sufficient to prove that a real sequence converges?
  choices:
  - id: a
    text: It is increasing and bounded above.
  - id: b
    text: It is increasing.
  - id: c
    text: It is bounded.
  - id: d
    text: Its first term is positive.
  answer:
    choiceId: a
  explanation: A nondecreasing sequence with an upper bound converges to its supremum.
- id: q006
  type: multipleChoice
  skills:
  - check-monotonicity
  prompt: |
    How does $a_n=n/(n+1)$ behave?
  choices:
  - id: a
    text: It is increasing and bounded above by $1$.
  - id: b
    text: It is decreasing and bounded below by $1$.
  - id: c
    text: It alternates signs.
  - id: d
    text: It is unbounded.
  answer:
    choiceId: a
  explanation: Write $a_n=1-1/(n+1)$; the subtracted reciprocal decreases, so $a_n$ increases toward one.
- id: q007
  type: multipleChoice
  skills:
  - evaluate-geometric-sequence-limits
  prompt: |
    What is $\lim_{n\to\infty}(-2/3)^n$?
  choices:
  - id: a
    text: $-2/3$
  - id: b
    text: $0$
  - id: c
    text: $1$
  - id: d
    text: The limit does not exist.
  answer:
    choiceId: b
  explanation: The signs alternate, but the magnitudes $(2/3)^n$ shrink to zero because the base magnitude
    is below one.
- id: q008
  type: multipleChoice
  skills:
  - use-subsequences-to-prove-divergence
  prompt: |
    For $a_n=3+(-1)^n$, what are the even and odd subsequential limits?
  choices:
  - id: a
    text: $4$ and $2$, respectively
  - id: b
    text: $2$ and $4$, respectively
  - id: c
    text: $3$ and $3$, respectively
  - id: d
    text: $1$ and $-1$, respectively
  answer:
    choiceId: a
  explanation: Even powers of $-1$ equal one and odd powers equal negative one, producing constants four
    and two.
- id: q009
  type: multipleChoice
  skills:
  - interpret-fixed-point-equations
  prompt: |
    A recurrence has the form $a_{n+1}=\sqrt{2+a_n}$. If $a_n$ converges to
    a positive limit $L$, what must $L$ equal?
  choices:
  - id: a
    text: $1$
  - id: b
    text: $2$
  - id: c
    text: $-1$
  - id: d
    text: |-
      $\sqrt2$
  answer:
    choiceId: b
  explanation: |-
    Continuity gives $L=\sqrt{2+L}$, so $L^2-L-2=0$; positivity selects $L=2$.
- id: q010
  type: multipleChoice
  skills:
  - construct-epsilon-thresholds
  prompt: |
    For $a_n=1/n$, which condition on $n$ guarantees $|a_n-0|<0.01$?
  choices:
  - id: a
    text: $n>100$
  - id: b
    text: |-
      $n\ge10$
  - id: c
    text: $n<100$
  - id: d
    text: $n=1$ only
  answer:
    choiceId: a
  explanation: Solve $1/n<1/100$ for positive $n$, giving the strict condition $n>100$.
- id: q011
  type: multipleChoice
  skills:
  - apply-limit-laws
  prompt: |
    If $a_n\to2$ and $b_n\to-3$, what is
    $\lim(a_nb_n+a_n)$?
  choices:
  - id: a
    text: $-8$
  - id: b
    text: $-4$
  - id: c
    text: $1$
  - id: d
    text: $6$
  answer:
    choiceId: b
  explanation: Limit laws give $(2)(-3)+2=-4$.
- id: q012
  type: multipleChoice
  skills:
  - distinguish-sequences-from-series
  prompt: |
    Which statement about $a_n=1/n$ is correct?
  choices:
  - id: a
    text: |-
      The sequence converges to zero, but $\sum a_n$ diverges.
  - id: b
    text: Both the sequence and series converge to zero.
  - id: c
    text: The sequence diverges, but the series converges.
  - id: d
    text: Both diverge because the terms are positive.
  answer:
    choiceId: a
  explanation: Reciprocal terms approach zero, while harmonic partial sums grow without bound.
- id: q013
  type: multipleChoice
  skills:
  - identify-unbounded-monotone-sequences
  prompt: |
    Why does the monotone convergence theorem not prove that $a_n=n$ converges?
  choices:
  - id: a
    text: The sequence is not bounded above.
  - id: b
    text: The sequence is not increasing.
  - id: c
    text: The terms are integers.
  - id: d
    text: The first term is one.
  answer:
    choiceId: a
  explanation: Although increasing, the sequence has no finite upper bound and tends to positive infinity.
- id: q014
  type: multipleChoice
  skills:
  - evaluate-factorial-sequence-limits
  prompt: |
    What is $\lim_{n\to\infty}2^n/n!$?
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1$
  - id: c
    text: $2$
  - id: d
    text: |-
      $+\infty$
  answer:
    choiceId: a
  explanation: The consecutive ratio is $2/(n+1)$, eventually below any fixed number less than one, so
    the sequence decays to zero.
- id: q015
  type: multipleChoice
  skills:
  - use-continuity-with-sequence-limits
  prompt: |
    If $a_n\to4$ and every $a_n\ge0$, what is
    $\lim_{n\to\infty}\sqrt{a_n}$?
  choices:
  - id: a
    text: $0$
  - id: b
    text: $2$
  - id: c
    text: $4$
  - id: d
    text: $16$
  answer:
    choiceId: b
  explanation: |-
    The square-root function is continuous at four, so the limit passes through it and equals $\sqrt4=2$.
attemptQuestionCount: 15
