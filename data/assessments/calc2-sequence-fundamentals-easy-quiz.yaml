  prompt: 'Which sequence is bounded but divergent?

    '
  choices:
  - id: a
    text: $a_n=(-1)^n$
  - id: b
    text: $a_n=1/n$
  - id: c
    text: $a_n=2+1/n$
  - id: d
    text: $a_n=0$
  answer:
    choiceId: a
  explanation: 'Solution: Its terms remain in $[-1,1]$ but its even and odd subsequences approach different values. Therefore the answer is $a_n=(-1)^n$.


    Why it works: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit. Establish both monotonicity and the appropriate bound before concluding convergence.


    Common trap: Boundedness alone does not imply a sequence converges; for example, $(-1)^n$ is bounded but oscillates.


    Why the other choices fail: $a_n=1/n$ conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; $a_n=2+1/n$ conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; $a_n=0$ conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit.'
