workedExamples:
- id: we01
  title: Cooling from two observations
  problem: A sample is 90 C when placed in a 20 C room and is 55 C after 10 min.
  steps:
  - id: we01-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Shift by ambient temperature.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - ambient shift
      - initial excess
    explanation: |-
      Solution: $T-20=70e^{-kt}$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Infer the parameter.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - ratio
      - k units
    explanation: |-
      Solution: $35=70e^{-10k}$ gives $k=\ln2/10\approx0.0693147$ min$^{-1}$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Predict and check.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - prediction
      - physical range
    explanation: |-
      Solution: At 20 min, $T=20+70(1/2)^2=37.5$ C, between the initial and ambient temperatures.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we02
  title: Unequal-flow mixing
  problem: A 50-L tank starts fresh. Brine enters at 4 L/min and 1 g/L; mixture leaves at 2 L/min.
  steps:
  - id: we02-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Construct volume and balance.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - changing volume
      - balance
    explanation: |-
      Solution: $V=50+2t$ and $Q'=4-2Q/(50+2t)$, $Q(0)=0$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Solve the linear IVP.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - integrating factor
      - solution
    explanation: |-
      Solution: An integrating factor is $50+2t$; integration gives $Q=(200t+4t^2)/(50+2t)$ grams.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Verify the physical interval.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - capacity
      - ODE check
    explanation: |-
      Solution: For a 100-L capacity, $0\le t<25$ min; substitution verifies the ODE on that interval.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we03
  title: Emptying-time domain
  problem: An 80-L tank has 3 L/min entering and 7 L/min leaving.
  steps:
  - id: we03-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Find the volume law.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - net rate
      - volume
    explanation: |-
      Solution: $V(t)=80-4t$ L.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Locate the boundary.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - emptying time
      - singularity
    explanation: |-
      Solution: $V=0$ at $t=20$ min, so concentration terms $Q/V$ become singular there.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: State the model interval.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - half-open physical interval
      - assumption
    explanation: |-
      Solution: The well-mixed ODE is physically valid on $0\le t<20$, subject to the mixing assumption.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
