- id: q001
  type: multipleChoice
  prompt: What is a normal direction to r(u,v)=<u,v,0>?
  choices:
  - id: a
    text: <0,0,1>
  - id: b
    text: <1,0,0>
    issueSignals:
    - id: surface-orientation-parameterization-error
  - id: c
    text: <0,1,0>
    issueSignals:
    - id: surface-orientation-parameterization-error
  - id: d
    text: <u,v,0>
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: surface-orientation-parameterization-error
  difficultyDimensions: &id001
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  difficultyEvidence: Requires matching a vector-calculus representation to the governing relation and orientation.
  explanation: 'Solution: The parameter tangent vectors are <1,0,0> and <0,1,0>.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 3 -> Vector-Valued Functions.

    Why the other choices fail: Choice b, ''<1,0,0>'', does not give ''<0,0,1>'' for ''What is a normal direction to r(u,v)=<u,v,0>?''.
    It substitutes a different result, representation, or condition for the one the prompt specifies.

    Choice c, ''<0,1,0>'', does not give ''<0,0,1>'' for ''What is a normal direction to r(u,v)=<u,v,0>?''. It substitutes
    a different result, representation, or condition for the one the prompt specifies.

    Choice d, ''<u,v,0>'', does not give ''<0,0,1>'' for ''What is a normal direction to r(u,v)=<u,v,0>?''. It substitutes
    a different result, representation, or condition for the one the prompt specifies.'
