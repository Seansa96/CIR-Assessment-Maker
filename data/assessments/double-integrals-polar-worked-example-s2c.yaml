workedExamples:
- id: example-001
  title: Build the representation
  problem: 'Set up the area of the disk $x^2+y^2\le4$ in polar coordinates.'
  steps:
  - id: s001
    title: Convert boundary
    instruction: What is the radial bound?
    type: multipleChoice
    prompt: What is the radial bound?
    choices:
    - id: a
      text: '$0\le r\le2$'
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: polar-rectangular-conversion-error
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: polar-rectangular-conversion-error
    answer:
      choiceId: a
    issueSignals:
    - id: polar-rectangular-conversion-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $0\le r\le2$

      Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Polar Coordinates.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
  - id: s002
    title: Choose angular sweep
    instruction: What theta interval covers the disk?
    type: multipleChoice
    prompt: What theta interval covers the disk?
    choices:
    - id: a
      text: '$0\le\theta\le2\pi$'
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: polar-rectangular-conversion-error
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
