questions:
  - id: ht-eigenvector-powers
    type: multipleChoice
    prompt: |
      Suppose $\vec{v}$ is an eigenvector of $A$ with corresponding eigenvalue $\lambda = 3$.
      What is $A^3 \vec{v}$?
    choices:
      - id: c1
        text: '$3\vec{v}$'
      - id: c2
        text: '$9\vec{v}$'
      - id: c3
        text: '$27\vec{v}$'
      - id: c4
        text: 'It cannot be determined without knowing the entries of $A$.'
    answer:
      choiceId: c3
    explanation: |
      If $A\vec{v} = 3\vec{v}$, then multiplying by $A$ again gives:
      $A^2\vec{v} = A(A\vec{v}) = A(3\vec{v}) = 3(A\vec{v}) = 3(3\vec{v}) = 9\vec{v}$.
      Multiplying by $A$ a third time gives:
      $A^3\vec{v} = A(9\vec{v}) = 9(A\vec{v}) = 9(3\vec{v}) = 27\vec{v}$.
      In general, if $\lambda$ is an eigenvalue of $A$, then $\lambda^k$ is an eigenvalue of $A^k$.

  - id: ht-invertible-eigenvalue-implication
    type: multipleChoice
    prompt: |
      Let $A$ be a matrix with eigenvalues $\lambda = 4$ and $\lambda = -2$.
      Which of the following must be true?
    choices:
      - id: c1
        text: 'The matrix $A$ is not invertible.'
      - id: c2
        text: 'The matrix $A$ is invertible.'
      - id: c3
        text: 'The null space of $A$ has dimension 1.'
      - id: c4
        text: 'The characteristic polynomial of $A$ is $\lambda^2 - 2\lambda - 8 = 0$.'
    answer:
      choiceId: c2
    explanation: |
      A matrix is invertible if and only if $\lambda = 0$ is NOT an eigenvalue. Since the eigenvalues are $4$ and $-2$ (neither is zero), the matrix must be invertible. (Option D is a possible characteristic polynomial if $A$ is $2 \times 2$, but we don't know the size of $A$; it could be larger and just have those two distinct eigenvalues).

  - id: ht-eigenvalue-full-pipeline
    type: freeResponse
    prompt: |
      Let $A = \begin{bmatrix}3 & -2 \\ 1 & 0\end{bmatrix}$.
      Find the characteristic equation, the eigenvalues, and a basis for each eigenspace.
    answer:
      gradingMode: selfCheck
      keyPoints:
        - |
          **Characteristic Equation**: $\det(A - \lambda I) = (3-\lambda)(-\lambda) - (-2)(1) = -\lambda(3-\lambda) + 2 = \lambda^2 - 3\lambda + 2 = 0$.
        - |
          **Eigenvalues**: Factoring $\lambda^2 - 3\lambda + 2 = 0$ gives $(\lambda - 1)(\lambda - 2) = 0$.
          The eigenvalues are $\lambda = 1$ and $\lambda = 2$.
        - |
          **Eigenspace for $\lambda = 1$**:
          $A - I = \begin{bmatrix}2 & -2 \\ 1 & -1\end{bmatrix}$.
          Solving $(A-I)\vec{x} = \vec{0}$ gives $x_1 - x_2 = 0 \implies x_1 = x_2$.
          Basis: $\left\{ \begin{bmatrix}1\\1\end{bmatrix} \right\}$.
        - |
          **Eigenspace for $\lambda = 2$**:
          $A - 2I = \begin{bmatrix}1 & -2 \\ 1 & -2\end{bmatrix}$.
          Solving $(A-2I)\vec{x} = \vec{0}$ gives $x_1 - 2x_2 = 0 \implies x_1 = 2x_2$.
          Basis: $\left\{ \begin{bmatrix}2\\1\end{bmatrix} \right\}$.
