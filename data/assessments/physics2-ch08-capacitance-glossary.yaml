    entries:
    - id: t1
      term: Capacitance
      definition: The ratio of the charge on either conductor of a capacitor to the potential difference
        between them.
      drills:
      - id: t1-drill
        type: flashcard
        prompt: What does Capacitance mean?
        answer:
          expected: The ratio of the charge on either conductor of a capacitor to the potential difference
            between them.
        explanation: 'Solution:


          The ratio of the charge on either conductor of a capacitor to the potential difference between
          them.


          Why it works:


          This definition identifies the essential meaning of Capacitance.'
        tags: []
    - id: t2
      term: Dielectric
      definition: An insulating material placed between the plates of a capacitor to increase its capacitance.
      drills:
      - id: t2-drill
        type: flashcard
        prompt: What does Dielectric mean?
        answer:
          expected: An insulating material placed between the plates of a capacitor to increase its capacitance.
        explanation: 'Solution:


          An insulating material placed between the plates of a capacitor to increase its capacitance.


          Why it works:


          This definition identifies the essential meaning of Dielectric.'
        tags: []
    - id: t3
      term: Dielectric Constant
      definition: A dimensionless factor $\kappa$ that characterizes how much a dielectric material increases
        the capacitance.
      drills:
