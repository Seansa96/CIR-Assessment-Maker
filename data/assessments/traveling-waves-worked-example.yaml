workedExamples:
- id: we-traveling-waves
  title: Deriving and applying Traveling Waves
  problem: Use the labeled model to derive and calculate the wave speed from $v=f\lambda$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Analyze the provided snapshot and history graphs to extract basic parameters.
    prompt: 'Identify wavelength and period.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Wavelength \lambda and Period T'
    explanation: >-
      The spatial graph gives wavelength $\lambda$, and the temporal graph gives period $T$.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the assumption about the medium.
    prompt: 'What is assumed about the medium?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Uniform medium with constant wave speed.'
    explanation: >-
      We assume the medium is uniform (homogeneous and isotropic), so wave speed is constant.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target variable.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Wave speed v'
    explanation: >-
      We want to calculate the wave speed $v$.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the fundamental wave equation relating speed, wavelength, and period.
    prompt: 'Write the governing relation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'v = \lambda / T'
    explanation: >-
      Speed is distance over time: $v = \frac{\lambda}{T} = f\lambda$.
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the wave speed (it is already isolated).
    prompt: 'Isolate $v$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'v = \lambda f'
    explanation: >-
      $v = \lambda f$ is ready to use.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given $\lambda = 2.0$ m and $f = 5.0$ Hz, calculate the wave speed $v$.
    prompt: 'Calculate wave speed.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      value: 10.0
      tolerance: 0.1
    explanation: >-
      $v = 2.0 \times 5.0 = 10.0$ m/s.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the units of the calculation.
    prompt: 'What are the units?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'm/s'
    explanation: >-
      Meters times Hertz ($1/s$) yields m/s.
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated wave speed.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      value: 10.0
      tolerance: 0.1
    explanation: >-
      The wave speed is $10.0$ m/s.
