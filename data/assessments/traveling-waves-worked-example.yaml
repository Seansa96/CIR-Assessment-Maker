workedExamples:
- id: we-traveling-waves
  title: Deriving and applying Traveling Waves
  problem: Use the labeled model to derive and calculate the wave speed from $v=f\lambda$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Analyze the provided snapshot and history graphs to extract basic parameters.
    prompt: 'Identify wavelength and period.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Identify wavelength $\lambda$ from space and period $T$ from time. Why it works: the two graphs display the spatial and temporal cycles of one wave.'
  - id: step2
    title: State the assumptions
    instruction: >-
      State the assumption about the medium.
    prompt: 'What is assumed about the medium?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Assume a uniform medium with constant speed. Why it works: unchanging medium properties keep the propagation speed constant.'
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target variable.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Target the wave speed $v$. Why it works: speed connects the spatial and temporal repetitions.'
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the fundamental wave equation relating speed, wavelength, and period.
    prompt: 'Write the governing relation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Write $v=\lambda/T=f\lambda$. Why it works: one wavelength advances in one period.'
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the wave speed (it is already isolated).
    prompt: 'Isolate $v$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Use $v=\lambda f$. Why it works: frequency is reciprocal period, so it is equivalent to $\lambda/T$.'
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given $\lambda = 2.0$ m and $f = 5.0$ Hz, calculate the wave speed $v$.
    prompt: 'Calculate wave speed.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      value: 10.0
      tolerance: 0.1
    explanation: 'Solution: $v=(2.0)(5.0)=10.0\ \text{m/s}$. Why it works: wavelength times cycles per second gives distance per second.'
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the units of the calculation.
    prompt: 'What are the units?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Units are m/s. Why it works: meters times hertz, or inverse seconds, gives meters per second.'
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated wave speed.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/traveling-waves.svg
      alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
      caption: Traveling Waves model diagram.
    answer:
      value: 10.0
      tolerance: 0.1
    explanation: 'Solution: The wave speed is $10.0\ \text{m/s}$. Why it works: it is the evaluated product of wavelength and frequency.'
- id: traveling-period-we002
  title: Find Period From Wave Speed and Wavelength
  problem: A wave travels at $24\ \text{m/s}$ with wavelength $3.0\ \text{m}$. Find its period.
  steps:
  - id: traveling-period-we002-step-1
    title: Find frequency
    type: numericResponse
    prompt: What is the frequency in hertz?
    answer: {value: 8, tolerance: 0.01}
    explanation: 'Solution: $f=v/\lambda=24/3.0=8.0\ \text{Hz}$. Why it works: propagation speed is wavelength times frequency.'
  - id: traveling-period-we002-step-2
    title: Find period
    type: numericResponse
    prompt: What is the period in seconds?
    answer: {value: 0.125, tolerance: 0.001}
    explanation: 'Solution: $T=1/f=1/8.0=0.125\ \text{s}$. Why it works: period and frequency are reciprocal cycle measures.'
