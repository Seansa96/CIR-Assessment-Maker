glossary:
  introduction: |
    Study the defining condition for each term before beginning recall. Pay attention to whether a relationship depends on an individual angle's measure, a sum of measures, or the position of two angles.
  sections:
    - id: angle-classifications
      title: Classifying Individual Angles
      required: true
      content: |
        These terms classify one angle by its degree measure. The direction in which the rays point does not change the classification.
      entries:
        - id: acute-angle
          term: Acute Angle
          definition: |
            An angle whose measure is strictly between $0^\circ$ and $90^\circ$.
          notation: '$0^\circ<m\angle A<90^\circ$'
          examples:
            - 'A $45^\circ$ angle is acute.'
          aliases: []
          media:
            - type: image
              src: /assessments/geometry/angle-classification-examples.svg
              alt: Acute, right, obtuse, and straight angle examples shown side by side.
          tags: [acute-angle, angle-classification]
          drills:
            - id: acute-angle-definition-recall
              type: typed
              prompt: What term describes an angle measuring more than $0^\circ$ but less than $90^\circ$?
              answer:
                expected: Acute angle
                aliases: [acute]
              explanation: The endpoints are excluded; a $90^\circ$ angle is right, not acute.
              tags: [acute-angle, angle-classification]

        - id: right-angle
          term: Right Angle
          definition: |
            An angle whose measure is exactly $90^\circ$, commonly marked by a small square at its vertex.
          notation: '$m\angle A=90^\circ$'
          examples:
            - Adjacent perpendicular rays form a right angle.
          aliases: []
          media: []
          tags: [right-angle, perpendicular]
          drills:
            - id: right-angle-cloze
              type: cloze
              prompt: 'Complete the statement: An angle measuring exactly ____ is a right angle.'
              answer:
                expected: 90 degrees
                aliases: ['$90^\circ$', '90']
              explanation: Right angles are defined by an exact measure of $90^\circ$.
              tags: [right-angle, perpendicular]

        - id: obtuse-angle
          term: Obtuse Angle
          definition: |
            An angle whose measure is strictly greater than $90^\circ$ and strictly less than $180^\circ$.
          notation: '$90^\circ<m\angle A<180^\circ$'
          examples:
            - 'A $125^\circ$ angle is obtuse.'
          aliases: []
          media: []
          tags: [obtuse-angle, angle-classification]
          drills:
            - id: obtuse-angle-recognition
              type: recognition
              prompt: Which angle measure is obtuse?
              choices:
                - id: a
                  text: '$45^\circ$'
                - id: b
                  text: '$90^\circ$'
                - id: c
                  text: '$125^\circ$'
                - id: d
                  text: '$180^\circ$'
              answer:
                choiceId: c
                expected: '$125^\circ$'
              explanation: $125^\circ$ lies strictly between $90^\circ$ and $180^\circ$.
              tags: [obtuse-angle, angle-classification]

        - id: straight-angle
          term: Straight Angle
          definition: |
            An angle measuring exactly $180^\circ$. Its sides are opposite rays and form a straight line.
          notation: '$m\angle A=180^\circ$'
          examples:
            - A half-turn forms a straight angle.
          aliases: []
          media: []
          tags: [straight-angle, opposite-rays]
          drills:
            - id: straight-angle-definition-recall
              type: typed
              prompt: What term describes an angle whose sides are opposite rays?
              answer:
                expected: Straight angle
                aliases: [straight]
              explanation: Opposite rays create an opening of exactly $180^\circ$.
              tags: [straight-angle, opposite-rays]

    - id: angle-pair-relationships
      title: Relationships Between Angles
      required: true
      content: |
        Pair relationships may depend on shared geometry, the sum of two measures, or the position of angles formed by intersecting lines.
      entries:
        - id: adjacent-angles
          term: Adjacent Angles
          definition: |
            Two coplanar angles that share a vertex and one side but have no overlapping interior points.
          examples:
            - Two neighboring angles formed by three rays from one vertex are adjacent.
          aliases: []
          media:
            - type: image
              src: /assessments/geometry/angle-pair-relationship-examples.svg
              alt: Adjacent, complementary, supplementary, vertical, and linear-pair angle examples.
          tags: [adjacent-angles, shared-side]
          drills:
            - id: adjacent-angles-recognition
              type: recognition
              prompt: Which condition identifies adjacent angles?
              choices:
                - id: a
                  text: They have equal measures.
                - id: b
                  text: They share a vertex and side without overlapping interiors.
                - id: c
                  text: Their measures sum to $90^\circ$.
                - id: d
                  text: They lie opposite each other at an intersection.
              answer:
                choiceId: b
                expected: They share a vertex and side without overlapping interiors.
              explanation: Adjacency is positional; it does not require a particular measure or sum.
              tags: [adjacent-angles, shared-side]

        - id: complementary-angles
          term: Complementary Angles
          definition: |
            Two angles whose measures add to exactly $90^\circ$. They do not need to be adjacent.
          notation: '$m\angle A+m\angle B=90^\circ$'
          examples:
            - '$30^\circ$ and $60^\circ$ are complementary.'
          aliases: [complements]
          media: []
          tags: [complementary-angles, angle-sums]
          drills:
            - id: complementary-angles-cloze
              type: cloze
              prompt: 'Complete the relationship: Complementary angles have measures that add to ____.'
              answer:
                expected: 90 degrees
                aliases: ['$90^\circ$', '90']
              explanation: Complementary is a measure relationship and does not imply adjacency.
              tags: [complementary-angles, angle-sums]

        - id: supplementary-angles
          term: Supplementary Angles
          definition: |
            Two angles whose measures add to exactly $180^\circ$. They do not need to share a vertex.
          notation: '$m\angle A+m\angle B=180^\circ$'
          examples:
            - '$80^\circ$ and $100^\circ$ are supplementary.'
          aliases: [supplements]
          media: []
          tags: [supplementary-angles, angle-sums]
          drills:
            - id: supplementary-angles-definition-recall
              type: typed
              prompt: What relationship do a $115^\circ$ angle and a $65^\circ$ angle have?
              answer:
                expected: Supplementary angles
                aliases: [supplementary, supplements]
              explanation: Their measures add to $180^\circ$.
              tags: [supplementary-angles, angle-sums]

        - id: vertical-angles
          term: Vertical Angles
          definition: |
            The opposite, nonadjacent angles formed when two lines intersect. Vertical angles are congruent.
          notation: '$m\angle 1=m\angle 3$'
          examples:
            - Opposite angles in an X-shaped intersection are vertical angles.
          aliases: [vertically opposite angles]
          media: []
          tags: [vertical-angles, intersecting-lines, congruent-angles]
          drills:
            - id: vertical-angles-flashcard
              type: flashcard
              prompt: State the Vertical Angles Theorem.
              answer:
                expected: Vertical angles formed by intersecting lines are congruent.
              explanation: Opposite angles inherit equal measures from the supplementary linear pairs around the intersection.
              tags: [vertical-angles, intersecting-lines, congruent-angles]

        - id: linear-pair
          term: Linear Pair
          definition: |
            Two adjacent angles whose noncommon sides are opposite rays. Every linear pair is supplementary.
          notation: '$m\angle 1+m\angle 2=180^\circ$'
          examples:
            - Neighboring angles along a straight line form a linear pair.
          aliases: []
          media: []
          tags: [linear-pair, adjacent-angles, supplementary-angles]
          drills:
            - id: linear-pair-recognition
              type: recognition
              prompt: Which statement must be true for a linear pair?
              choices:
                - id: a
                  text: The angles are opposite and congruent.
                - id: b
                  text: The angles sum to $90^\circ$.
                - id: c
                  text: The angles are adjacent and their noncommon sides are opposite rays.
                - id: d
                  text: The angles have no shared side.
              answer:
                choiceId: c
                expected: The angles are adjacent and their noncommon sides are opposite rays.
              explanation: Those opposite rays form a straight angle, so the adjacent pair sums to $180^\circ$.
              tags: [linear-pair, adjacent-angles, supplementary-angles]
