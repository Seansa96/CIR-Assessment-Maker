- id: chem-acids-hard-test-q001
  type: multipleChoice
  prompt: Which reaction is best classified with Brønsted–Lowry language without water? Include the stated aqueous condition
    and classify the model before choosing.
  choices:
  - id: a
    text: NH3 + HCl → NH4+ + Cl−
    issueSignals: []
  - id: b
    text: NaOH → Na+ + OH− in water (test item 1)
    issueSignals:
    - id: acid-base-model-confusion
      domains:
      - chemistry
  - id: c
    text: HCl(aq) → H+ + Cl− (test item 1)
    issueSignals:
    - id: acid-base-model-confusion
      domains:
      - chemistry
  - id: d
    text: KOH(aq) → K+ + OH− (test item 1)
    issueSignals:
    - id: acid-base-model-confusion
      domains:
      - chemistry
  answer:
    choiceId: a
  explanation: 'Solution: Choice A (NH3 + HCl → NH4+ + Cl−).


    Why it works: Apply the acid-base definition, equilibrium relation, logarithmic conversion, or stoichiometric ratio named
    by the prompt, then check units and assumptions.


    Why the other choices fail: Choice B (NaOH → Na+ + OH− in water (test item 1)) makes a model or sign error; choice C (HCl(aq)
    → H+ + Cl− (test item 1)) uses the wrong condition or operation; choice D (KOH(aq) → K+ + OH− (test item 1)) does not
    follow from the supplied species, values, or titration region.'
  difficultyDimensions:
