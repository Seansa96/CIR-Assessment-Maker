lesson:
  introduction: 'This lesson introduces Virtual Memory through the mental models emphasized by 3.3-3.7 Virtual Memory. Focus
    on what the OS is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: paging
    title: Paging
    required: true
    content: 'Paging divides virtual and physical memory into fixed-size units so pages can be mapped independently.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Pages are fixed-size chunks; segments are logical variable-size regions.

      '
    check:
      id: paging-check
      title: 'Check: Paging'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Paging**?

        '
      choices:
      - id: a
        text: Paging divides virtual and physical memory into fixed-size units so pages can be mapped independently.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'Paging divides virtual and physical memory into fixed-size units so pages can be mapped independently.
        Related topic: Virtual Memory.

        '
  - id: page-table
    title: Page table
    required: true
    content: 'A page table records how virtual pages map to physical frames and with what permissions.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A page table entry is not the page data itself.

      '
    check:
      id: page-table-check
      title: 'Check: Page table'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Page table**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: A page table records how virtual pages map to physical frames and with what permissions.
      answer:
        choiceId: d
      explanation: 'A page table records how virtual pages map to physical frames and with what permissions. Related topic:
        Virtual Memory.

        '
  - id: tlb
    title: TLB
    required: true
    content: 'A TLB caches recent address translations to avoid frequent page-table walks.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A TLB miss is not necessarily a page fault.

      '
    check:
      id: tlb-check
      title: 'Check: TLB'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **TLB**?

        '
      choices:
      - id: a
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: A TLB caches recent address translations to avoid frequent page-table walks.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: c
      explanation: 'A TLB caches recent address translations to avoid frequent page-table walks. Related topic: Virtual Memory.

        '
  - id: page-fault
    title: Page fault
    required: true
    content: 'A page fault occurs when a needed virtual page is not currently accessible as required.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      The OS must determine whether the access is valid before loading data.

      '
    check:
      id: page-fault-check
      title: 'Check: Page fault'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Page fault**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: A page fault occurs when a needed virtual page is not currently accessible as required.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      answer:
        choiceId: b
      explanation: 'A page fault occurs when a needed virtual page is not currently accessible as required. Related topic:
        Virtual Memory.

        '
  - id: replacement-algorithm
    title: Replacement algorithm
    required: true
    content: 'When memory is full, a replacement policy chooses which page to evict.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Optimal replacement is a benchmark, not implementable without future knowledge.

      '
    check:
      id: replacement-algorithm-check
      title: 'Check: Replacement algorithm'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Replacement algorithm**?

        '
      choices:
      - id: a
        text: When memory is full, a replacement policy chooses which page to evict.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'When memory is full, a replacement policy chooses which page to evict. Related topic: Virtual Memory.

        '
  - id: working-set
    title: Working set
    required: true
    content: 'The working set approximates the pages a process actively needs in a recent time window.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      If working sets do not fit in memory, thrashing can occur.

      '
    check:
      id: working-set-check
      title: 'Check: Working set'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Working set**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: The working set approximates the pages a process actively needs in a recent time window.
      answer:
        choiceId: d
      explanation: 'The working set approximates the pages a process actively needs in a recent time window. Related topic:
        Virtual Memory.

        '
