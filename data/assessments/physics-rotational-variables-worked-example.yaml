workedExamples:
- id: we-rotational-vars-1
  title: Angular Position as a Function of Time
  problem: A disc starts from rest and its angular position is given by $\theta(t)
    = 2t^3 - 0.5t^2$ radians. Calculate its angular velocity and angular acceleration
    at $t = 2.0$ s.
  steps:
  - id: we-rotational-vars-1-step1
    title: 'Step 1: Differentiate to find Angular Velocity'
    instruction: Take the first derivative of $\theta(t)$ with respect to time to
      find the angular velocity function $\omega(t)$. Then evaluate at $t = 2.0$ s.
    prompt: What is the angular velocity $\omega(2.0)$ in rad/s?
    type: numericResponse
    answer:
      value: 22.0
      tolerance: 0.1
    explanation: |
      Solution: $\omega(t)=d\theta/dt=6t^2-t$, so $\omega(2.0)=6(2.0)^2-2.0=22$ rad/s.

      Why it works: Angular velocity is the time derivative of angular position.
  - id: we-rotational-vars-1-step2
    title: 'Step 2: Differentiate to find Angular Acceleration'
    instruction: Take the second derivative of $\theta(t)$ (or the first derivative
      of $\omega(t)$) to find $\alpha(t)$, then evaluate at $t = 2.0$ s.
    prompt: What is the angular acceleration $\alpha(2.0)$ in $\text{rad/s}^2$?
    type: numericResponse
    answer:
      value: 23.0
      tolerance: 0.1
    explanation: |
      Solution: $\alpha(t)=d\omega/dt=12t-1$, so $\alpha(2.0)=23$ rad/s$^2$.

      Why it works: Angular acceleration is the time derivative of angular velocity.
