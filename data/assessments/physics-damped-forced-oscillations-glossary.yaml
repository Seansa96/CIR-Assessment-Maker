# REVIEW_NOTE: Merged from physics-damped-oscillations and physics-forced-oscillations stubs.
# The differential-equation derivation (underdamped solution, driven steady state) is intentionally
# brief here. Students seeking the full ODE treatment should see the
# elementary-differential-equations-bvp category → Second-Order Linear Equations.
# Needs a proper conceptLesson, workedExample, quiz, and test to complete the curriculum stack.
glossary:
  introduction: >
    Terms for real oscillators that lose energy to friction or viscosity, and for oscillators
    driven by an external periodic force. The underlying differential equations are developed in
    the ODE course; this entry focuses on the physical language and key results.
  sections:
  - id: damping-terms
    title: Damped Oscillations
    entries:
    - id: damping-constant
      term: damping constant
      definition: 'The coefficient $b$ in $F_\text{damp}=-bv$, with SI units $\text{kg/s}$.'
      drills:
      - {id: damping-constant-drill, type: typed, prompt: 'What symbol names the linear damping constant?', answer: {expected: b}}
    - id: underdamped
      term: underdamped
      definition: A regime in which the system continues to oscillate while its amplitude decays.
      drills:
      - {id: underdamped-drill, type: cloze, prompt: 'An oscillator with decaying amplitude that still crosses equilibrium is {{underdamped}}.', answer: {expected: underdamped}}
    - id: critical-damping
      term: critical damping
      definition: The boundary damping level that returns a system to equilibrium as quickly as possible without oscillating.
      drills:
      - {id: critical-damping-drill, type: typed, prompt: 'What damping regime returns to equilibrium fastest without oscillating?', answer: {expected: critical damping}}
    - id: exponential-envelope
      term: exponential envelope
      definition: 'The decreasing curve $A_0e^{-bt/(2m)}$ that bounds an underdamped displacement.'
      drills:
      - {id: exponential-envelope-drill, type: cloze, prompt: 'The amplitude of an underdamped oscillator follows an {{exponential envelope}}.', answer: {expected: exponential envelope}}
  - id: forced-terms
    title: Forced Oscillations
    entries:
    - id: driving-force
      term: driving force
      definition: 'A time-varying external force, often $F_d\cos(\omega_d t)$, applied to the oscillator.'
      drills:
      - {id: driving-force-drill, type: typed, prompt: 'What is the external periodic force on a forced oscillator called?', answer: {expected: driving force}}
    - id: driving-frequency
      term: driving frequency
      definition: 'The angular frequency $\omega_d$ of the applied periodic force.'
      drills:
      - {id: driving-freq-drill, type: cloze, prompt: 'The angular frequency of the applied force is the {{driving frequency}}.', answer: {expected: driving frequency}}
    - id: resonance
      term: resonance
      definition: 'Maximum steady-state amplitude when $\omega_d\approx\omega_0$, the natural frequency.'
      drills:
      - {id: resonance-drill, type: typed, prompt: 'At what driving frequency is amplitude largest in a lightly damped forced oscillator?', answer: {expected: natural frequency}}
    - id: steady-state
      term: steady-state response
      definition: The long-term oscillation at driving frequency after transient dies away.
      drills:
      - {id: steady-state-drill, type: cloze, prompt: 'After transients die away, the oscillator settles into a {{steady-state response}}.', answer: {expected: steady-state response}}
