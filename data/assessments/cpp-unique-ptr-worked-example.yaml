workedExamples:
  - id: avoid-leaks
    title: Refactoring to avoid Memory Leaks
    problem: |
      We have a function that uses raw pointers. It dynamically allocates a `Widget`, calls a function that might throw an exception, and then deletes the `Widget`. If the exception is thrown, the `delete` is never reached, causing a memory leak. Let's fix this using `std::unique_ptr`.
    steps:
      - id: raw-pointer
        title: The problematic raw pointer code
        content: |
          Notice how an early exit (like a `return` or a thrown exception) skips the `delete` statement.

          ```cpp
          void processWidget() {
              Widget* w = new Widget();
              
              if (somethingFailed()) {
                  // Memory leak! 'delete w' is skipped.
                  return;
              }
              
              w->doWork();
              delete w;
          }
          ```
      - id: use-unique-ptr
        title: Replace with unique_ptr
        content: |
          By replacing the raw pointer with `std::unique_ptr` and allocating it with `std::make_unique`, we tie the memory's lifetime to the pointer's scope.

          ```cpp
          #include <memory>

          void processWidget() {
              std::unique_ptr<Widget> w = std::make_unique<Widget>();
              
              if (somethingFailed()) {
                  // No leak! When 'w' goes out of scope here, it cleans up.
                  return;
              }
              
              w->doWork();
              // No leak! When 'w' goes out of scope here, it cleans up.
          }
          ```
    check:
      id: make-unique-check
      type: multipleChoice
      prompt: Why is `std::make_unique<Widget>()` preferred over `std::unique_ptr<Widget>(new Widget())`?
      choices:
        - id: a
          text: 'It is exception-safe and slightly faster/cleaner.'
        - id: b
          text: 'It allows the `unique_ptr` to be copied.'
        - id: c
          text: 'It bypasses the constructor of `Widget`.'
        - id: d
          text: 'It places the object on the stack instead of the heap.'
      answer:
        choiceId: a
      explanation: |
        `std::make_unique` ensures that no memory leaks occur even if an exception is thrown during evaluation of other arguments in a complex expression.


