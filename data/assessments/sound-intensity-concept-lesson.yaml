lesson:
  introduction: This lesson develops Sound Intensity from a diagram, a mathematical model, and a calculus-based
    interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      Sound intensity relates to the energy transported by the wave. The physical system involves a source emitting sound power (energy per second) outward into a three-dimensional medium.
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      Measurable quantities include the source's power output $P$ (in Watts), the distance $r$ from the source, the intensity $I$ (Power per unit area, $\text{W/m}^2$), and the intensity level $\beta$ in decibels (dB).
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
  - id: s3
    title: Mathematical model
    content: >-
      The mathematical model for an isotropic point source (radiating equally in all directions) is the inverse-square law: $I = \frac{P}{4\pi r^2}$. The spherical surface area $4\pi r^2$ spreads the energy thinner as distance increases.
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
  - id: s4
    title: Calculus connection
    content: >-
      Because human hearing encompasses an enormous range of intensities (from $10^{-12} \text{ W/m}^2$ to $1 \text{ W/m}^2$), we define a logarithmic scale for Sound Intensity Level: $\beta = 10 \log_{10} \left(\frac{I}{I_0}\right)$, where $I_0 = 10^{-12} \text{ W/m}^2$ is the threshold of hearing.
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
  - id: s5
    title: Derivation or justification
    content: >-
      Calculus is used to relate intensity to the pressure amplitude derived earlier. The time-averaged power transmitted by the wave yields $I = \frac{(\Delta P_{\text{max}})^2}{2\rho v}$. This shows intensity is proportional to the square of the pressure amplitude.
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, plotting intensity $I$ versus distance $r$ produces an inverse-square curve. However, because human perception of loudness is roughly logarithmic, a plot of decibels $\beta$ versus $\log(r)$ yields a straight line with a negative slope.
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
  - id: s7
    title: Quantitative strategy
    content: >-
      A crucial quantitative strategy with decibels is knowing the 'factor of 10' rule: adding 10 dB means multiplying the physical intensity $I$ by 10. Adding 3 dB roughly doubles the physical intensity.
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: If distance $r$ doubles, the intensity $I$ drops to $1/4$ of its original value. In decibels, this is a drop of about 6 dB ($10 \log_{10}(1/4) \approx -6$). The units of $\beta$ are dimensionless decibels (dB).
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
