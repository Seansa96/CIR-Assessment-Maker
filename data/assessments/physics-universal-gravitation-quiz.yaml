  - Simplification
  - IdentityConstruction
  type: multipleChoice
  prompt: |
    Three masses are arranged in a straight line. Mass A is located at $x=0$. Mass C is located at $x=3d$. Mass A has a mass of $M$, and Mass C has a mass of $4M$. 
    
    Where must a third mass, Mass B (with mass $m$), be placed on the x-axis between them so that the net gravitational force on Mass B is exactly zero?
  choices:
  - id: a
    text: 'At $x = d$'
  - id: b
    text: 'At $x = 1.5d$'
  - id: c
    text: 'At $x = 2d$'
  - id: d
    text: 'At $x = 0.75d$'
  answer:
    choiceId: a
  explanation: |
    Solution:
    The net force is zero when the gravitational pull from Mass A equals the gravitational pull from Mass C. 
    Let Mass B be at position $x$. The distance to Mass A is $x$, and the distance to Mass C is $(3d - x)$.
    
    Why it works:
    Set the magnitudes of the forces equal:
    $$ G \frac{M m}{x^2} = G \frac{(4M) m}{(3d - x)^2} $$
    
    Cancel $G$, $M$, and $m$ from both sides:
    $$ \frac{1}{x^2} = \frac{4}{(3d - x)^2} $$
    
    Take the square root of both sides (since distances are positive):
    $$ \frac{1}{x} = \frac{2}{3d - x} $$
    
    Cross-multiply and solve for $x$:
    $$ 3d - x = 2x \implies 3d = 3x \implies x = d $$
    
    Why the other choices fail: 
    - $x = 1.5d$ places the mass exactly in the middle, but since Mass C is larger, the net force would pull toward C.
    - $x = 2d$ is closer to the larger mass, which would make the pull from Mass C even stronger.
    - $x = 0.75d$ might be chosen if one incorrectly sets up a linear ratio (1 to 4) instead of an inverse-square relationship.
