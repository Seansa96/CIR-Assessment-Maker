workedExamples:
  - id: we-ph-calc
    title: "Calculating pH from [H+]"
    problem: "What is the pH of a 0.0025 M solution of HCl?"
    steps:
      - id: s1
        title: "Determine [H+]"
        instruction: >
          Since HCl is a strong acid, it dissociates completely.
          
          [H+] = 0.0025 M
        type: freeResponse
        skills:
          - ph-calculations
        prompt: "Did you understand this step?"
        answer:
          gradingMode: selfCheck
      - id: s2
        title: "Apply the pH formula"
        instruction: >
          pH = -log[H+]
          
          pH = -log(0.0025) = 2.60
        type: freeResponse
        skills:
          - ph-calculations
        prompt: "Did you understand this step?"
        answer:
          gradingMode: selfCheck
questions:
  - id: q-poh-calc
    title: "Calculate pOH"
    type: numericResponse
    skills:
      - ph-calculations
    prompt: "If the pH of a solution is 4.5, what is its pOH? (Remember: pH + pOH = 14)"
    answer:
      value: 9.5
      tolerance: 0
