workedExamples:
- id: ex-electron-configs
  title: Determining the configuration of Cobalt (Co)
  problem: |-
    Write the full and noble gas shorthand electron configuration for Cobalt (Co), a metal commonly used in magnetic alloys and lithium-ion batteries.
  steps:
  - id: step-1
    title: Step 1 — Determine the number of electrons
    instruction: |-
      Find Cobalt on the periodic table. Its atomic number tells you the number of protons, which is equal to the number of electrons in a neutral atom.
    prompt: |-
      Cobalt is a neutral atom with atomic number 27. How many electrons must the configuration account for?
    explanation: |-
      How to Solve: The atomic number is the proton count. A neutral atom has equal numbers of protons and electrons, so cobalt has 27 electrons to place.
    type: multipleChoice
    choices:
    - id: a
      text: 27 electrons
      issueSignals: []
    - id: b
      text: 26 electrons, because one proton is unpaired
      issueSignals:
      - id: electron-configuration-electron-count-error
        domains:
        - chemistry
    - id: c
      text: 54 electrons, because the atomic number counts protons and electrons separately
      issueSignals:
      - id: electron-configuration-electron-count-error
        domains:
        - chemistry
    - id: d
      text: 59 electrons, adding the mass number to the atomic number
      issueSignals:
      - id: electron-configuration-electron-count-error
        domains:
        - chemistry
    answer:
      choiceId: a
  - id: step-2
    title: Step 2 — Fill orbitals according to the Aufbau Principle
    instruction: |-
      Follow the order of orbital filling: $1s, 2s, 2p, 3s, 3p, 4s, 3d$.
      Remember the maximum capacities: $s=2, p=6, d=10$.
      Keep a running tally until you hit 27 electrons.

      $1s^2$ (2 e-)
      $2s^2$ (4 e-)
      $2p^6$ (10 e-)
      $3s^2$ (12 e-)
      $3p^6$ (18 e-)
      $4s^2$ (20 e-)

      We need 7 more electrons. They go into the $3d$ sublevel.
    type: multipleChoice
    prompt: |-
      What is the full electron configuration for Cobalt?
    choices:
    - id: a
      text: $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2 3d^7$
      issueSignals: []
    - id: b
      text: $1s^2 2s^2 2p^6 3s^2 3p^6 3d^9$
      issueSignals:
      - id: electron-configuration-aufbau-order-error
        domains:
        - chemistry
    - id: c
      text: $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2 4p^7$
      issueSignals:
      - id: electron-configuration-aufbau-order-error
        domains:
        - chemistry
    answer:
      choiceId: a
    explanation: |-
      How to Solve: Follow the filling sequence and tally the electrons: $1s^2$ gives 2, $2s^2$ gives 4, $2p^6$ gives 10, $3s^2$ gives 12, $3p^6$ gives 18, and $4s^2$ gives 20. The remaining $27-20=7$ electrons occupy $3d$, giving $[\mathrm{Ar}]\,4s^2 3d^7$.
  - id: step-3
    title: Step 3 — Write the noble gas shorthand
    instruction: |-
      To write the shorthand, find the noble gas in the period *above* Cobalt.
      Cobalt is in period 4, so look at the end of period 3. The noble gas is Argon (Ar), which has 18 electrons ($1s^2 2s^2 2p^6 3s^2 3p^6$).

      Replace that inner core portion of the configuration with $[Ar]$.
    type: multipleChoice
    prompt: |-
      What is the noble gas shorthand configuration for Cobalt?
    choices:
    - id: a
      text: $[Kr] 4s^2 3d^7$
      issueSignals:
      - id: electron-configuration-noble-gas-core-error
        domains:
        - chemistry
    - id: b
      text: $[Ar] 4s^2 3d^7$
      issueSignals: []
    - id: c
      text: $[Ar] 3d^9$
      issueSignals:
      - id: electron-configuration-noble-gas-core-error
        domains:
        - chemistry
    answer:
      choiceId: b
    explanation: |-
      How to Solve: The completed inner configuration through $3p^6$ contains 18 electrons, matching argon. Replace that prefix with $[\mathrm{Ar}]$ and retain the remaining $4s^2 3d^7$, so the shorthand is $[\mathrm{Ar}]\,4s^2 3d^7$.
