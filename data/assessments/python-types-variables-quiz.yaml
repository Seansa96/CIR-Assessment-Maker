id: python-types-variables-quiz
title: Python Types and Variables Quiz
assessmentType: quiz
categoryId: python
subcategoryId: python-types-and-variables
subcategoryIds:
  - python-types-and-variables
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 3
questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Look at the following Python code for a game's merchant:
      
      ```python
      item_cost = 50.0
      gold = "100"
      remaining = float(gold) - item_cost
      ```
      
      What is the type and value of the `remaining` variable?
    choices:
      - id: a
        text: '`float`, `50.0`'
      - id: b
        text: '`int`, `50`'
      - id: c
        text: '`str`, `"50"`'
      - id: d
        text: 'It will cause a `TypeError`'
    answer:
      choiceId: a
    explanation: |
      Because we used `float(gold)`, `"100"` was safely converted to a number. `100.0 - 50.0` yields `50.0`, which is a `float`.

  - id: q002
    type: multipleChoice
    prompt: |
      If you run this code and type `Warrior` when prompted:
      
      ```python
      player_class = input("Choose class: ")
      print(f"Welcome, {player_class}!")
      ```
      
      What exactly is printed to the console?
    choices:
      - id: a
        text: '`Welcome, Warrior!`'
      - id: b
        text: '`Welcome, {player_class}!`'
      - id: c
        text: '`Welcome, "Warrior"!`'
      - id: d
        text: '`Welcome, player_class!`'
    answer:
      choiceId: a
    explanation: |
      The `f` in front of the string evaluates the `{player_class}` block, inserting the value `"Warrior"` directly into the text.

  - id: q003
    type: numericResponse
    prompt: |
      Trace this block of code:
      
      ```python
      level = 4
      exp_needed = level * 100
      level = 5
      ```
      
      What is the numeric value of `exp_needed` after all three lines execute?
    answer:
      value: 400
      tolerance: 0
    explanation: |
      Assignment evaluates the right side *at that moment*. When `exp_needed` is assigned, `level` is `4`, so it stores `400`. Changing `level` to `5` later does not retroactively change `exp_needed`.

  - id: q004
    type: multipleChoice
    prompt: |
      You want to ask the player for a quantity of items to buy, and store it as an integer. Which is the correct way?
    choices:
      - id: a
        text: '`quantity = int(input("How many? "))`'
      - id: b
        text: '`quantity = input(int("How many? "))`'
      - id: c
        text: '`quantity = input("How many? ").int()`'
      - id: d
        text: '`int quantity = input("How many? ")`'
    answer:
      choiceId: a
    explanation: |
      `input()` is executed first to get the string, and the result is passed into `int()` to convert it to an integer. Option D uses C++/C# syntax, not Python.


