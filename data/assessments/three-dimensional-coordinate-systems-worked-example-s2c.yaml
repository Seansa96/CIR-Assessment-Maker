workedExamples:
- id: example-001
  title: Build the representation
  problem: Find the equation of the sphere centered at $(1,-2,3)$ with radius $4$.
  steps:
  - id: s001
    title: Identify the center
    instruction: Which signed shifts appear?
    type: multipleChoice
    prompt: Which signed shifts appear?
    choices:
    - id: a
      text: $(x-1)^2$, $(y+2)^2$, and $(z-3)^2$
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: algebraic-simplification-error
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: algebraic-simplification-error
    answer:
      choiceId: a
    issueSignals:
    - id: algebraic-simplification-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $(x-1)^2$, $(y+2)^2$, and $(z-3)^2$

      Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Inequalities and the Real
      Numbers.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
  - id: s002
    title: Insert the radius
    instruction: What is $r^2$?
    type: multipleChoice
    prompt: What is $r^2$?
    choices:
    - id: a
      text: '16'
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: algebraic-simplification-error
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: algebraic-simplification-error
    answer:
      choiceId: a
    issueSignals:
    - id: algebraic-simplification-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: 16

      Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Inequalities and the Real
      Numbers.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
  - id: s003
    title: Write the locus
    instruction: Which equation is correct?
    type: multipleChoice
    prompt: Which equation is correct?
    choices:
    - id: a
      text: $(x-1)^2+(y+2)^2+(z-3)^2=16$
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: algebraic-simplification-error
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
