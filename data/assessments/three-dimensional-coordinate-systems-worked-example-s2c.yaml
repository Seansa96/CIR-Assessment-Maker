      - id: sign-error
    - id: d
      text: $(x-1)^2+(y+2)^2+(z-3)^2=16$ (answers 'Which equation is correct?', not 'Which signed shifts appear?')
      issueSignals:
      - id: algebraic-simplification-error
    answer:
