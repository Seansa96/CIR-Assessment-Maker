      {
        "id": "s1",
        "title": "Growth, decay, and steady state",
        "required": true,
        "content": "A rate proportional to amount gives $Q'=kQ$; constant input with removal gives $Q'=a-kQ$. Equilibria solve $Q'=0$, then initial data selects a particular trajectory.",
        "media": [
          {
            "type": "image",
            "src": "/media/ede/ch04-model-flow.svg",
            "alt": "Modeling flow diagram from quantities and assumptions to a differential equation.",
            "caption": "Use the labeled quantities before selecting a method."
          }
        ],
        "check": {
          "id": "chk-01",
          "type": "multipleChoice",
          "skills": [
            "ede-ch04-first-order-applications-growth-decay"
          ],
          "prompt": "Which conclusion follows from the growth, decay, and steady state section?",
          "choices": [
            {
              "id": "a",
              "text": "Use the governing relation and stated conditions for growth, decay, and steady state."
            },
            {
              "id": "b",
              "text": "Discard the given state.",
