lesson:
  introduction: Applications begin with a state variable and a rate balance, not a memorized formula. This lesson
    builds and checks growth, cooling, mixing, resistance, autonomous, and curve-family models.
  sections:
  - id: s1
    title: Growth, decay, input, and limiting values
    required: true
    content: Pure proportional change satisfies $Q'=kQ$ and gives $Q=Q_0e^{kt}$. A constant input with proportional
      removal gives $Q'=a-kQ$ and equilibrium $Q_*=a/k$. The solution $Q=Q_*+(Q_0-Q_*)e^{-kt}$ shows directly whether
      the state rises or falls toward its limiting value.
    media:
    - type: image
      src: /media/ede/ch04-model-flow.svg
      alt: Workflow from physical situation through variables, rate law, initial data, and interpretation.
      caption: Model assumptions and units are checked before and after solving.
    check:
      id: chk-01
      type: symbolicResponse
      prompt: Solve $Q'=12-0.3Q$ with $Q(0)=10$.
      skills:
      - ede-ch04-first-order-applications-growth-decay
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - symbolicExecution
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-growth-decay
      difficultyEvidence: Requires carrying out symbolic steps and checking the resulting expression.
      answer:
        expectedLatex: 40-30e^{-0.3t}
        equivalenceMode: expression
        variables:
        - t
        tolerance: 0.0001
      explanation: |-
        Solution: The equilibrium is $40$, so $Q=40+Ce^{-0.3t}$ and $C=-30$.

        Why it works: Differentiation verifies the rate law, the initial value is $10$, and the limiting value is $40$.
  - id: s2
    title: Newton cooling
    required: true
    content: 'Newton''s law uses the temperature difference from the ambient value: $T''=-k(T-T_a)$ for $k>0$. Thus
      $T=T_a+(T_0-T_a)e^{-kt}$. The sign automatically reverses when the object is colder than its surroundings,
      and a changed ambient temperature starts a new IVP at the switching time.'
    media: []
    check:
      id: chk-02
      type: multipleChoice
      prompt: A sample is at $10^\circ$C in a $25^\circ$C room and follows $T'=-0.2(T-25)$. What is true initially?
      skills:
      - ede-ch04-first-order-applications-cooling-mixing
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-cooling-mixing
      difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a
        plausible error.
      choices:
      - id: a
        text: It warms because $T'(0)=3>0$.
      - id: b
        text: It cools because the leading sign is negative.
        issueSignals:
        - id: ede-cooling-ambient-shift-error
          domains: &id001
          - elementary-differential-equations-bvp
      - id: c
        text: It remains constant because the room temperature is fixed.
        issueSignals:
        - id: ede-equilibrium-limiting-error
          domains: *id001
      - id: d
        text: Its rate is $-3^\circ$C per time unit.
        issueSignals:
        - id: ede-growth-decay-sign-error
          domains: *id001
      answer:
        choiceId: a
      explanation: |-
        Solution: The sample initially warms at $3^\circ$C per time unit.

        Why it works: The temperature difference is negative, so the negative coefficient produces a positive derivative.

        Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  - id: s3
    title: Well-mixed tanks
    required: true
    content: For salt amount $Q(t)$, use $Q'=\text{mass rate in}-\text{mass rate out}$. Each mass rate is volumetric
      flow times concentration. The tank concentration is $Q/V(t)$ only under the well-mixed assumption, and $V(t)$
      must change when inflow and outflow differ.
    media: []
    check:
      id: chk-03
      type: multipleChoice
      prompt: A tank has volume $V(t)$, salt amount $Q(t)$, and outflow $r$ L/min. Which salt-out term is correct?
      skills:
      - ede-ch04-first-order-applications-cooling-mixing
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-cooling-mixing
      difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a
        plausible error.
      choices:
      - id: a
        text: $rQ/V(t)$
      - id: b
        text: $rV(t)/Q$
        issueSignals:
        - id: ede-mixing-concentration-error
          domains: *id001
      - id: c
        text: $Q/r$
        issueSignals:
        - id: ede-model-rate-unit-error
          domains: *id001
      - id: d
        text: $rQ$
        issueSignals:
        - id: ede-mixing-concentration-error
          domains: *id001
      answer:
        choiceId: a
      explanation: |-
        Solution: The salt-out rate is $r[Q/V(t)]$.

        Why it works: Flow times the well-mixed concentration has mass-per-time units.

        Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  - id: s4
    title: Mechanics with linear resistance
    required: true
    content: Choose a positive direction before writing Newton's law. With downward positive, a falling mass with
      linear resistance satisfies $mv'=mg-bv$ because resistance opposes positive downward velocity. Terminal velocity
      occurs when acceleration vanishes, giving $v_T=mg/b$ in this convention.
    media: []
    check:
      id: chk-04
      type: numericResponse
      prompt: A $3$-kg object falls downward with resistance coefficient $b=1.5$ kg/s and $g=9.8$ m/s². What is
        its terminal speed in m/s?
      skills:
      - ede-ch04-first-order-applications-mechanics
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-mechanics
      difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
      answer:
        value: 19.6
        tolerance: 0.0001
      explanation: |-
        Solution: $v_T=mg/b=3(9.8)/1.5=19.6$ m/s.

        Why it works: At terminal speed the net force and acceleration are zero.
  - id: s5
    title: Autonomous second-order equations and phase planes
    required: true
    content: For $y''=f(y,y')$, set $v=y'$ to obtain the phase-plane system $y'=v$, $v'=f(y,v)$. Where $v$ can be
      viewed as a function of $y$, the chain rule gives $y''=v\,dv/dy$. An equilibrium requires both $v=0$ and $f(y,0)=0$;
      initial position and velocity select a trajectory and its direction.
    media: &id002
    - type: image
      src: /media/ede/ch04-phase-line-trajectory-map.svg
      alt: Stable and unstable phase-line equilibria paired with solution curves, plus perpendicular tangent directions
        for orthogonal trajectories.
      caption: Signs control autonomous motion; negative reciprocal slopes control orthogonality.
    check:
      id: chk-05
      type: multipleChoice
      prompt: For $y''=-y$, what is the phase-plane velocity at the state $(y,v)=(1,2)$?
      skills:
      - ede-ch04-first-order-applications-autonomous-phase
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-autonomous-phase
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The system is $y'=v$, $v'=-y$, so the vector is $(2,-1)$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $(y',v')=(2,-1)$
      - id: b
        text: $(1,2)$
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $(-1,2)$
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $(2,1)$
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s6
    title: Curve families and orthogonal trajectories
    required: true
    content: Differentiate a one-parameter family and eliminate its parameter to obtain the differential equation
      of the family. If its slope is $m(x,y)$, an orthogonal trajectory has slope $-1/m(x,y)$ where $m\ne0$. The
      perpendicular relation is local and must be integrated to obtain the new family.
    media: *id002
    check:
      id: chk-06
      type: multipleChoice
      prompt: The family $y=cx^2$ has slope $2y/x$. Which ODE describes its orthogonal trajectories?
      skills:
      - ede-ch04-first-order-applications-curves
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-curves
      difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a
        plausible error.
      choices:
      - id: a
        text: $y'=-x/(2y)$
      - id: b
        text: $y'=2y/x$
        issueSignals:
        - id: ede-orthogonal-slope-error
          domains: *id001
      - id: c
        text: $y'=-2y/x$
        issueSignals:
        - id: ede-orthogonal-slope-error
          domains: *id001
      - id: d
        text: $y'=x/(2y)$
        issueSignals:
        - id: ede-orthogonal-slope-error
          domains: *id001
      answer:
        choiceId: a
      explanation: |-
        Solution: The orthogonal slope is the negative reciprocal, $-x/(2y)$.

        Why it works: Perpendicular nonvertical slopes have product $-1$.

        Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
