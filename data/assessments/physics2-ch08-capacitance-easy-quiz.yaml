- id: q004
  type: multipleChoice
  skills:
  - physics2-ch08-capacitance-dielectrics
  prompt: '3.0 and 6.0 microF capacitors in parallel have C equivalent:'
  choices:
  - id: a
    text: 4.5 microF (harmonic mean)
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: 18 microF (product without division by the sum)
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: 9.0 microF
  - id: d
    text: 2.0 microF
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: c
  explanation: 'Solution: Parallel capacitances add to 9.0 microF.


    Why it works: Equal voltage allows stored charges to add.


    Why the other choices fail: The other choices apply series or product formulas.'
  difficultyDimensions:
  - modelOrDerivation
