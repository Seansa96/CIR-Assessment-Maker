questions:
- id: q001
  type: multipleChoice
  difficultyDimensions: &id001
  - modelOrDerivation
  - errorDiagnosis
  prompt: If the plate area of a parallel-plate capacitor is doubled and the distance between plates is halved,
    what happens to the capacitance?
  explanation: 'Solution:

    Use $C = \frac{\epsilon_0 A}{d}$. If $A \to 2A$ and $d \to d/2$, then $C_{new} = \frac{\epsilon_0 (2A)}{d/2}
    = 4 C$.


    Why it works:

    Capacitance is directly proportional to area and inversely proportional to distance.

    Why the other choices fail: A factor of 4 comes from $2 / 0.5 = 4$.'
  choices:
  - id: a
    text: Increases by a factor of 4
  - id: b
    text: Decreases by a factor of 4
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: Remains unchanged
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: d
    text: Doubles
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  answer:
    choiceId: a
  difficultyEvidence: Requires selecting the governing physical model and checking an assumption or representation.
