questions:
- id: q001
  type: multipleChoice
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  prompt: If the plate area of a parallel-plate capacitor is doubled and the distance between plates is halved,
    what happens to the capacitance?
  explanation: 'Solution:

    Use $C = \frac{\epsilon_0 A}{d}$. If $A \to 2A$ and $d \to d/2$, then $C_{new} = \frac{\epsilon_0 (2A)}{d/2}
    = 4 C$.


    Why it works:

    Capacitance is directly proportional to area and inversely proportional to distance.

    Why the other choices fail: A factor of 4 comes from $2 / 0.5 = 4$.'
  choices:
  - id: a
    text: Increases by a factor of 4
  - id: b
    text: Decreases by a factor of 4
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: Remains unchanged
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: d
    text: Doubles
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  answer:
    choiceId: a
  difficultyEvidence: Apply the topic’s defining relation to a direct case.
  skills:
  - physics2-ch08-capacitance-capacitance-definition
  prerequisiteObjectiveIds:
  - physics2-ch08-capacitance-dielectric-model
  subjectDifficultyTags:
  - physics2-ch08-capacitance-capacitance-definition
- id: q002
  type: multipleChoice
  skills:
  - physics2-ch08-capacitance-capacitor-combinations
  prompt: 'Plate area doubles and separation halves. C changes by:'
  choices:
  - id: a
    text: factor 4
  - id: b
    text: factor 2
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: factor 1/2
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: factor 1/4
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: a
  explanation: 'Solution: C=epsilon0 A/d gives 2/(1/2)=4.


    Why it works: Capacitance is proportional to area and inverse to separation.


    Why the other choices fail: The alternatives omit or reverse one scaling.'
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch08-capacitance-capacitor-combinations
  difficultyEvidence: Requires applying the topic’s governing relation and interpreting its physical sign, geometry,
    or scaling.
  prerequisiteObjectiveIds:
  - physics2-ch08-capacitance-capacitance-definition
- id: q003
  type: multipleChoice
  skills:
  - physics2-ch08-capacitance-capacitor-energy
  prompt: '3.0 and 6.0 microF capacitors in series have C equivalent:'
  choices:
  - id: a
    text: 9.0 microF
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: 4.5 microF (arithmetic mean)
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: 18 microF (product)
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: 2.0 microF
  answer:
    choiceId: d
  explanation: 'Solution: 1/Ceq=1/3+1/6=1/2, hence 2.0 microF.


    Why it works: Series capacitors share charge and equivalent C is below either component.


    Why the other choices fail: The sum is the parallel rule; remaining options fail reciprocal addition.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  subjectDifficultyTags:
  - physics2-ch08-capacitance-capacitor-energy
  difficultyEvidence: Requires applying the topic’s governing relation and interpreting its physical sign, geometry,
    or scaling.
