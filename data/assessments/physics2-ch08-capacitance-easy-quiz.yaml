    text: Q/V
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: b
  explanation: 'Solution: Integrating V=q/C from 0 to Q gives U=Q^2/(2C)=QV/2.


    Why it works: Voltage rises during charging, so average voltage is V/2.


    Why the other choices fail: QV uses final voltage throughout; ratio choices have wrong dimensions.'
