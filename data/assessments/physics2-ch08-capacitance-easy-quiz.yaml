- id: q005
  type: multipleChoice
  skills:
  - physics2-ch08-capacitance-dielectric-model
  prompt: 'Voltage triples at fixed C. Stored energy changes by:'
  choices:
  - id: a
    text: no change
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: factor 9
  - id: c
    text: factor 3
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: factor 1/3
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: b
  explanation: 'Solution: U=1/2 C V^2, so energy grows by 9.


    Why it works: Energy is quadratic in voltage at fixed capacitance.


    Why the other choices fail: The other choices use linear, inverse, or no voltage dependence.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  subjectDifficultyTags:
