- id: q006
  type: multipleChoice
  skills:
  - physics2-ch08-capacitance-capacitance-definition
  prompt: An isolated capacitor receives a dielectric. Which is fixed?
  choices:
  - id: a
    text: charge Q
  - id: b
    text: voltage V
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: capacitance C
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: stored energy U
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: a
  explanation: 'Solution: Disconnected means no charge can flow, so Q stays fixed.


    Why it works: C rises while V=Q/C and U=Q^2/(2C) fall.


    Why the other choices fail: Voltage is fixed only with a battery; C and energy change.'
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
