  - id: c
    text: the pair’s stored energy U
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: battery voltage V
  answer:
    choiceId: d
  explanation: 'Solution: The battery maintains potential difference.


    Why it works: Increasing C at fixed V raises Q and stored energy.


    Why the other choices fail: Other quantities respond to dielectric insertion.'
