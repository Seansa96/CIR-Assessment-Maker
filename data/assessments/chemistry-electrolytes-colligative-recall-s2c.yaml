items:
  - { id: er-01, type: cloze, prompt: 'Soluble ionic compounds are generally ___ electrolytes.', answer: { expected: strong }, explanation: 'Solution: The blank is strong. Why it works: Their ions dissociate essentially completely.' }
  - { id: er-02, type: typed, prompt: 'State what makes a solution electrically conductive.', answer: { expected: mobile ions }, explanation: 'Solution: Mobile ions conduct charge. Why it works: Neutral dissolved molecules do not provide charge carriers.' }
  - { id: er-03, type: cloze, prompt: 'A nonvolatile solute makes freezing point go ___.', answer: { expected: down }, explanation: 'Solution: The blank is down. Why it works: Dissolved particles cause freezing-point depression.' }
  - { id: er-04, type: cloze, prompt: 'A nonvolatile solute makes boiling point go ___.', answer: { expected: up }, explanation: 'Solution: The blank is up. Why it works: Dissolved particles cause boiling-point elevation.' }
  - { id: er-05, type: typed, prompt: 'For complete dissociation, state [SO4 2−] in 0.30 M Na2SO4.', answer: { expected: 0.30 M }, explanation: 'Solution: It is 0.30 M. Why it works: Each formula unit has one sulfate ion.' }
  - { id: er-06, type: cloze, prompt: 'A weak electrolyte has both neutral molecules and some ___.', answer: { expected: ions }, explanation: 'Solution: The blank is ions. Why it works: Weak electrolytes partially ionize.' }
  - { id: er-07, type: typed, prompt: 'Name the property involving solvent flow through a semipermeable membrane.', answer: { expected: osmotic pressure }, explanation: 'Solution: The term is osmotic pressure. Why it works: It describes the pressure associated with osmosis.' }
