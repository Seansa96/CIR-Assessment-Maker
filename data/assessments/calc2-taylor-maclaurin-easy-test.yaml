- id: q016
  type: freeResponse
  skills:
  - identify-taylor-coefficients
  prompt: 'What is the coefficient of $(x-a)^n$ in the Taylor series of $f$ about $a$?

    '
  choices:
  - id: a
    text: $f^{(n)}(a)/n!$
  - id: b
    text: $f(a)/n$
  - id: c
    text: $f^{(n)}(x)$
  - id: d
    text: $n!f(a)$
  answer:
    choiceId: a
    gradingMode: selfCheck
  explanation: Repeated differentiation at the center isolates the nth coefficient as $f^{(n)}(a)/n!$.
  difficultyDimensions:
  - representationTransfer
  - simplification
  difficultyEvidence: The learner selects a Taylor representation and simplifies its coefficient or finite evaluation into the requested result.
- id: q017
  type: freeResponse
  skills:
  - distinguish-taylor-and-maclaurin-series
  prompt: 'A Maclaurin series is a Taylor series centered at which value?

    '
  choices:
  - id: a
    text: $a=0$
  - id: b
    text: $a=1$
  - id: c
    text: $a=e$
  - id: d
    text: $a=\infty$
  answer:
    choiceId: a
    gradingMode: selfCheck
  explanation: “Maclaurin” is the conventional name for the Taylor expansion about zero.
  difficultyDimensions:
  - representationTransfer
  - simplification
  difficultyEvidence: The learner selects a Taylor representation and simplifies its coefficient or finite evaluation into the requested result.
- id: q018
  type: freeResponse
  skills:
  - construct-exponential-series
  prompt: 'Which Maclaurin series represents $e^x$?

    '
  choices:
  - id: a
    text: $\sum_{n=0}^{\infty}x^n/n!$
  - id: b
    text: $\sum_{n=0}^{\infty}(-1)^nx^n$
  - id: c
    text: $\sum_{n=1}^{\infty}x^n/n$
  - id: d
    text: $\sum_{n=0}^{\infty}n!x^n$
  answer:
    choiceId: a
    gradingMode: selfCheck
  explanation: Every derivative of $e^x$ equals $e^x$ and evaluates to one at zero.
  difficultyDimensions:
  - representationTransfer
  - simplification
  difficultyEvidence: The learner selects a Taylor representation and simplifies its coefficient or finite evaluation into the requested result.
- id: q019
  type: freeResponse
  skills:
  - recognize-sine-series
  prompt: 'Which are the first four nonzero Maclaurin terms for $\sin x$?

    '
  choices:
  - id: a
    text: $x-x^3/3!+x^5/5!-x^7/7!$
  - id: b
    text: $1-x^2/2!+x^4/4!-x^6/6!$
  - id: c
    text: $x+x^2+x^3+x^4$
  - id: d
    text: $1+x+x^2/2!+x^3/3!$
  answer:
    choiceId: a
    gradingMode: selfCheck
  explanation: The sine derivative cycle vanishes at even orders and alternates signs at odd orders.
  difficultyDimensions:
  - representationTransfer
  - simplification
  difficultyEvidence: The learner selects a Taylor representation and simplifies its coefficient or finite evaluation into the requested result.
- id: q020
  type: freeResponse
  skills:
  - form-taylor-polynomials
  prompt: 'What is the degree-four Maclaurin polynomial for $\cos x$?

    '
  choices:
  - id: a
    text: $1-x^2/2!+x^4/4!$
  - id: b
    text: $x-x^3/3!$
  - id: c
    text: $1+x+x^2/2!+x^3/3!+x^4/4!$
  - id: d
    text: $1-x+x^2-x^3+x^4$
  answer:
    choiceId: a
    gradingMode: selfCheck
  explanation: Cosine has nonzero even-order coefficients with alternating signs.
  difficultyDimensions:
  - representationTransfer
  - simplification
  difficultyEvidence: The learner selects a Taylor representation and simplifies its coefficient or finite evaluation into the requested result.
