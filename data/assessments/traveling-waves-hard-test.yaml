- id: q001
  type: numericResponse
  skills:
  - physics-traveling-waves
  prompt: A seismic surface wave has a characteristic wavelength of 6.28 m and vibrates
    at 36.7 Hz. What is the angular frequency omega in rad/s?
  answer:
    value: 230.5929
    tolerance: 0.05
  explanation: omega = 2*pi*f = 2*pi*36.7 = 230.5929 rad/s.
- id: q002
  type: numericResponse
  skills:
  - physics-traveling-waves
  prompt: A laboratory ripple tank generates water waves of length 8.47 m at a frequency
    of 69.2 Hz. What is the wave speed in m/s?
  answer:
    value: 586.124
    tolerance: 0.05
  explanation: v = lambda * f = 8.47 * 69.2 = 586.12 m/s.
