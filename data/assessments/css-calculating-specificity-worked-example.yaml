schemaVersion: 1
id: css-calculating-specificity-worked-example
title: Calculating Specificity
assessmentType: workedExample
categoryId: css
subcategoryIds:
  - css-selectors-specificity
modeDefault: study
workedExamples:
  - id: we-specificity-1
    title: Calculating the specificity of a complex selector
    problem: |
      Let's determine the exact specificity score of the following selector:
      `div#header .nav-link:hover`
    steps:
      - id: step-1
        title: Count the IDs
        instruction: Identify any ID selectors.
        type: freeResponse
        prompt: How many ID selectors are in `div#header .nav-link:hover`?
        check:
          id: check-1
          type: exactMatch
          answer: "1"
          explanation: |
            There is exactly one ID selector: `#header`. This puts a 1 in the IDs column.
      - id: step-2
        title: Count the Classes and Pseudo-classes
        instruction: Identify any class, attribute, or pseudo-class selectors.
        type: freeResponse
        prompt: How many class/pseudo-class selectors are in `div#header .nav-link:hover`?
        check:
          id: check-2
          type: exactMatch
          answer: "2"
          explanation: |
            There are two: `.nav-link` (a class selector) and `:hover` (a pseudo-class). This puts a 2 in the Classes column.
      - id: step-3
        title: Count the Elements
        instruction: Identify any element selectors.
        type: freeResponse
        prompt: How many element selectors are in `div#header .nav-link:hover`?
        check:
          id: check-3
          type: exactMatch
          answer: "1"
          explanation: |
            There is exactly one element selector: `div`. This puts a 1 in the Elements column.
      - id: step-4
        title: Final Score
        instruction: Combine the scores into the final format (IDs-Classes-Elements).
        type: freeResponse
        prompt: What is the final specificity score?
        check:
          id: check-4
          type: exactMatch
          answer: "1-2-1"
          explanation: |
            Combining the results, the specificity is 1 ID, 2 Classes, and 1 Element, making the score **1-2-1**.
