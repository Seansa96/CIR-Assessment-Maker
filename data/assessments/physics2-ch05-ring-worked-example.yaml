title: Electric Field of a Charged Ring
assessmentType: workedExample
categoryId: physics-2
topicId: physics2-electric-charges-fields
workedExamples:
- id: we2
  title: Field on the axis of a charged ring
  prompt: A thin ring of radius $R$ carries a uniform total charge $Q$. Find the electric
    field on the central axis at distance $z$ from the center.
  steps:
  - id: s1
    prompt: Identify symmetry and integrate.
    explanation: 'Solution:

      1) Consider an element $dq$. Its distance to the point $z$ is $r = \sqrt{R^2
      + z^2}$.

      2) By symmetry, the radial components of $d\vec{E}$ cancel. Only the z-components
      add up.

      3) $dE_z = dE \cos \theta = \left(k \frac{dq}{R^2 + z^2}\right) \left(\frac{z}{\sqrt{R^2
      + z^2}}\right)$.

      4) Integrate $dq$ to get $Q$: $E_z = k \frac{Q z}{(R^2 + z^2)^{3/2}}$.


      Why it works:

      Symmetry simplifies the vector integral to a scalar integral over the charge
      distribution.'
