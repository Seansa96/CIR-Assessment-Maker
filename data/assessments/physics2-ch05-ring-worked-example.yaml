modeDefault: practice
randomizeQuestions: false
questions: []
workedExamples:
- id: ring-axis
  title: Derive the on-axis field
  problem: A thin ring of radius $R$ carries total charge $Q>0$ uniformly. Find the field at height $z>0$ on its axis.
  steps:
  - id: ring-axis-symmetry
    title: Resolve the components
    instruction: Use a paired charge element and its opposite partner.
    hint: Compare components perpendicular and parallel to the axis.
    type: multipleChoice
    prompt: Which statement correctly describes the pairwise sum of field contributions at the axial point?
    choices:
    - { id: a, text: Transverse components cancel; axial components add in $+\hat z$ }
    - { id: b, text: Axial components cancel; transverse components add radially, issueSignals: [{ id: physics2-ring-component-swap, domains: [physics-2] }] }
    - { id: c, text: Both components cancel because the ring has rotational symmetry, issueSignals: [{ id: physics2-ring-zero-field-error, domains: [physics-2] }] }
    - { id: d, text: The field is tangent to the ring at the observation point, issueSignals: [{ id: physics2-ring-direction-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: Opposite elements have equal transverse components in opposite directions and equal positive axial components.
      Why it works: Rotational symmetry leaves only the axis direction, and $Q>0$ points the field away from the ring.
      Why the other choices fail: They interchange components, cancel the surviving contribution, or choose a tangent direction.
  - id: ring-axis-expression
    title: Build the integral
    instruction: Project one charge element onto the axis before integrating.
    hint: Every element is at distance $\sqrt{R^2+z^2}$.
    type: multipleChoice
    prompt: Which expression is the correct axial field after integrating over the ring?
    choices:
    - { id: a, text: '$kQ/(R^2+z^2)$', issueSignals: [{ id: physics2-ring-projection-error, domains: [physics-2] }] }
    - { id: b, text: '$kQz/(R^2+z^2)^{3/2}$' }
    - { id: c, text: '$kQz/(R^2+z^2)$', issueSignals: [{ id: physics2-ring-power-error, domains: [physics-2] }] }
    - { id: d, text: '$kQR/(R^2+z^2)^{3/2}$', issueSignals: [{ id: physics2-ring-axis-variable-error, domains: [physics-2] }] }
    answer: { choiceId: b }
    explanation: >
      Solution: $dE_z=kz\,dq/(R^2+z^2)^{3/2}$; integrating gives $E_z=kQz/(R^2+z^2)^{3/2}$.
      Why it works: The factor $z$ is the axial projection and the denominator retains the full source distance.
      Why the other choices fail: They omit the projection, use the wrong power, or replace the axial coordinate with the radius.
  - id: ring-axis-number
    title: Evaluate and check
    instruction: Substitute SI values and compare with the far-field limit.
    hint: Use $k=8.99\times10^9$ and keep the direction $+\hat z$.
    type: multipleChoice
    prompt: For $Q=5.0\,\mathrm{nC}$, $R=0.10\,\mathrm m$, and $z=0.20\,\mathrm m$, which value is closest to $E_z$?
    choices:
    - { id: a, text: '$8.04\times10^2\,\mathrm{N/C}$ in $+\hat z$' }
    - { id: b, text: '$1.12\times10^1\,\mathrm{N/C}$ in $+\hat z$', issueSignals: [{ id: physics2-ring-distance-limit-error, domains: [physics-2] }] }
    - { id: c, text: '$4.02\times10^2\,\mathrm{N/C}$ in $+\hat z$', issueSignals: [{ id: physics2-ring-projection-error, domains: [physics-2] }] }
    - { id: d, text: '$8.04\times10^2\,\mathrm{N/C}$ in $-\hat z$', issueSignals: [{ id: physics2-ring-sign-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: $E_z=(8.99\times10^9)(5.0\times10^{-9})(0.20)/(0.05)^{3/2}=8.04\times10^2\,\mathrm{N/C}$.
      Why it works: The positive ring charge produces an upward axial field; the value is larger than the far-field estimate because $z$ is only two radii.
      Why the other choices fail: b is the distant point-charge estimate, c loses a factor of two, and d reverses the sign.
- id: ring-far-field
  title: Check the far-field limit
  problem: Use the same ring and examine the limit $z\gg R$.
  steps:
  - id: ring-far-field-model
    title: Choose the limiting model
    instruction: Compare the source size with the observation distance.
    hint: A localized distribution with nonzero net charge has a monopole term.
    type: multipleChoice
    prompt: What should the ring field approach when $z\gg R$?
    choices:
    - { id: a, text: The point-charge field of charge $Q$ at the center }
    - { id: b, text: The field of an infinite line charge, issueSignals: [{ id: physics2-ring-limit-model-error, domains: [physics-2] }] }
    - { id: c, text: A dipole field proportional to $1/z^3$, issueSignals: [{ id: physics2-ring-net-charge-error, domains: [physics-2] }] }
    - { id: d, text: Zero because the ring is symmetric, issueSignals: [{ id: physics2-ring-zero-field-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: At large distance the nonzero net charge dominates, so the ring behaves like a point charge $Q$.
      Why it works: The monopole term falls as $1/z^2$ and precedes higher multipoles.
      Why the other choices fail: They use the wrong source model or confuse transverse cancellation with zero total field.
  - id: ring-far-field-expression
    title: Simplify the expression
    instruction: Factor out the dominant power of $z$.
    hint: $(z^2+R^2)^{3/2}\to z^3$ for $z\gg R$.
    type: multipleChoice
    prompt: Which leading expression follows from the exact ring field?
    choices:
    - { id: a, text: '$kQ/z^2$' }
    - { id: b, text: '$kQ/z^3$', issueSignals: [{ id: physics2-ring-power-error, domains: [physics-2] }] }
    - { id: c, text: '$kQR/z^3$', issueSignals: [{ id: physics2-ring-limit-variable-error, domains: [physics-2] }] }
    - { id: d, text: '$kQ/R^2$', issueSignals: [{ id: physics2-ring-limit-variable-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: Replace $(z^2+R^2)^{3/2}$ by $z^3$ and cancel the numerator's $z$: $E_z\sim kQ/z^2$.
      Why it works: It recovers Coulomb scaling for the ring's net charge.
      Why the other choices fail: They retain an extra power, an irrelevant radius, or the wrong limiting variable.
  - id: ring-far-field-comparison
    title: Compare exact and approximate values
    instruction: Evaluate the point-charge estimate at $z=2.0\,\mathrm m$.
    hint: Use $kQ/z^2$.
    type: multipleChoice
    prompt: For $Q=5.0\,\mathrm{nC}$ and $z=2.0\,\mathrm m$, which point-charge estimate is closest?
    choices:
    - { id: a, text: '$11.2\,\mathrm{N/C}$ in $+\hat z$' }
    - { id: b, text: '$2.25\,\mathrm{N/C}$ in $+\hat z$', issueSignals: [{ id: physics2-ring-distance-power-error, domains: [physics-2] }] }
    - { id: c, text: '$44.9\,\mathrm{N/C}$ in $+\hat z$', issueSignals: [{ id: physics2-ring-distance-power-error, domains: [physics-2] }] }
    - { id: d, text: '$11.2\,\mathrm{N/C}$ in $-\hat z$', issueSignals: [{ id: physics2-ring-sign-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: $E\approx kQ/z^2=(8.99\times10^9)(5.0\times10^{-9})/4=11.2\,\mathrm{N/C}$.
      Why it works: At twenty ring radii, the point-charge limit is accurate and the direction is away from positive charge.
      Why the other choices fail: b and c use incorrect distance powers, while d reverses the direction.
