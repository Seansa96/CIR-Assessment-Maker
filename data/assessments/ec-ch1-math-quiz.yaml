questions:
- id: q001
  type: numericResponse
  prompt: If a circuit element has a voltage of $v = 5\text{ V}$ across it, and a
    current of $i = 2\text{ A}$ entering the positive terminal, what is the power
    absorbed in Watts?
  answer:
    tolerance: 0.1
    value: 10
  explanation: $p = vi = (5)(2) = 10\text{ W}$
