lesson:
  introduction: >
    This lesson develops a repeatable way to solve Energy & Dielectrics problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch08-energy-dielectrics-s1
    title: Name the model and quantities
    required: true
    content: >
      Energy & Dielectrics uses U = 1/2 CV^2. In the name the model and quantities stage, hold the stated quantity fixed, update capacitance for the dielectric, and then recompute energy.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Energy & Dielectrics problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch08-energy-dielectrics-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Energy & Dielectrics, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use U = 1/2 CV^2 after you hold the stated quantity fixed, update capacitance for the dielectric, and then recompute energy.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Energy & Dielectrics problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch08-energy-dielectrics-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables U = 1/2 CV^2 relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch08-energy-dielectrics-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Energy & Dielectrics.
        media: []
        issueSignals:
        - id: physics2-physics2-ch08-energy-dielectrics-units-error
          domains:
          - physics-2
      answer:
