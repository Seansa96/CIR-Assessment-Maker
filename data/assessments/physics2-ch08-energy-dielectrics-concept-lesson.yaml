title: Energy & Dielectrics
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-capacitance
lesson:
  introduction: This lesson develops the main ideas behind Energy & Dielectrics and connects them to the
    governing physical relationships.
  sections:
  - id: l3-sec1
    title: Energy Stored in a Capacitor
    required: true
    content: The electric potential energy stored in a charged capacitor represents the work required
      to assemble the charges. It is given by $U = \frac{1}{2} C V^2 = \frac{Q^2}{2C} = \frac{1}{2} Q
      V$. The energy density (energy per unit volume) in an electric field is $u = \frac{1}{2} \epsilon_0
      E^2$.
  - id: l3-sec2
    title: Dielectrics
    required: true
    content: 'Inserting an insulating material (a dielectric) with dielectric constant $\kappa$ between
      the plates of a capacitor increases its capacitance by a factor of $\kappa$: $C = \kappa C_0$. The
      dielectric partially neutralizes the field, allowing more charge to be stored for the same voltage.'
