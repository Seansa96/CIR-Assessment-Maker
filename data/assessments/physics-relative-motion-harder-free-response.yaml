questions:
- id: q001
  type: freeResponse
  prompt: 'Pursuit with a delay: A patrol car starts from rest $6.0\ \text{s}$ after
    a speeding car passes it moving at constant speed $25\ \text{m/s}$. The patrol
    car accelerates at $4.0\ \text{m/s}^2$.


    How long after the patrol car starts does it catch the speeding car?

    '
  answer:
    expected: 'About 19.2 s after the patrol car starts. The speeding car has a 150
      m head start and keeps moving, so solve $2t^2=150+25t$.

      '
    gradingMode: selfCheck
    keyPoints:
    - Convert the delay into a head-start distance.
    - Patrol car position is $\frac{1}{2}at^2$ after it starts.
    - Speeder position after patrol starts is $150+25t$.
  explanation: 'The delay gives the speeding car a head start:


    $$

    d_0=25(6.0)=150\ \text{m}.

    $$


    Measure time from when the patrol car starts. Patrol displacement is


    $$

    x_p=\frac{1}{2}(4.0)t^2=2t^2.

    $$


    The speeding car''s displacement from the patrol car''s starting position is


    $$

    x_s=150+25t.

    $$


    Catch-up means $x_p=x_s$, so $2t^2=150+25t$. The positive root is about $19.2\
    \text{s}$. This is not a simple $d/v_{\text{rel}}$ problem because one object
    accelerates.

    '
- id: q002
  type: freeResponse
  prompt: 'Same-direction trains with acceleration: A $160\ \text{m}$ train moving
    $18\ \text{m/s}$ starts passing a $100\ \text{m}$ train moving $12\ \text{m/s}$.
    The faster train accelerates at $0.50\ \text{m/s}^2$ while passing.


    How long until it completely passes?

    '
  answer:
    expected: 'About 23.1 s. In relative motion, cover 260 m with initial relative
      speed 6 m/s and relative acceleration 0.50 m/s²: $260=6t+\frac{1}{2}(0.50)t^2$.

      '
    gradingMode: selfCheck
    keyPoints:
    - Passing distance is sum of train lengths.
    - Use relative initial speed.
    - Include relative acceleration.
  explanation: 'The faster train must gain the combined length:


    $$

    d=160+100=260\ \text{m}.

    $$


    Relative initial speed is $18-12=6\ \text{m/s}$. Relative acceleration is $0.50\
    \text{m/s}^2$ because the slower train is constant speed. Use


    $$

    d=v_{0,\text{rel}}t+\frac{1}{2}a_{\text{rel}}t^2.

    $$


    So


    $$

    260=6t+0.25t^2.

    $$


    The positive root is about $23.1\ \text{s}$. This is a train passing problem plus
    kinematics in the relative frame.

    '
- id: q003
  type: freeResponse
  prompt: 'River aiming angle: A river flows east at $2.4\ \text{m/s}$. A boat can
    move $6.0\ \text{m/s}$ relative to water. It wants to land directly north across
    the river.


    At what angle west of north should it aim?

    '
  answer:
    expected: 'About 23.6 degrees west of north. The westward component must be 2.4
      m/s, so $\sin\theta=2.4/6.0=0.4$.

      '
    gradingMode: selfCheck
    keyPoints:
    - The upstream component must cancel current.
    - Boat speed relative to water is the hypotenuse.
    - Use sine with opposite component over hypotenuse.
  explanation: 'To land directly opposite, the net east-west velocity relative to
    shore must be zero. The boat must aim west with component


    $$

    v_{\text{west}}=2.4\ \text{m/s}.

    $$


    Since boat speed relative to water is $6.0\ \text{m/s}$, draw the right triangle:


    $$

    \sin\theta=\frac{2.4}{6.0}=0.4.

    $$


    Thus $\theta\a\approx23.6^\circ$ west of north. The technique is current-cancellation
    by vector components.

    '
- id: q004
  type: freeResponse
  prompt: "Plane with crosswind: A plane must fly due north relative to the ground\
    \ at ground speed $120\\ \\text{m/s}$. Wind blows east at $30\\ \\text{m/s}$.\
    \ \n\nWhat westward component must the plane have relative to the air, and what\
    \ a\approximate airspeed is required?\n"
  answer:
    expected: 'The plane needs 30 m/s west relative to air, and its airspeed is about
      123.7 m/s from $\sqrt{120^2+30^2}$.

      '
    gradingMode: selfCheck
    keyPoints:
    - Westward airspeed component cancels eastward wind.
    - Northward ground component remains 120 m/s.
    - Airspeed is the hypotenuse of the component triangle.
  explanation: 'Use vector addition:


    $$

    \vec{v}_{pg}=\vec{v}_{pa}+\vec{v}_{ag}.

    $$


    Since wind is $30\ \text{m/s}$ east and ground track must have zero east-west
    component, the plane must have a $30\ \text{m/s}$ westward air-relative component.
    The northward component is $120\ \text{m/s}$, so airspeed is


    $$

    \sqrt{120^2+30^2}\a\approx123.7\ \text{m/s}.

    $$

    '
- id: q005
  type: freeResponse
  prompt: 'Rain and umbrella, angle form: Rain falls vertically at $12\ \text{m/s}$
    relative to the ground. You run east at $5\ \text{m/s}$.


    At what angle from vertical does the rain appear to fall relative to you?

    '
  answer:
    expected: 'About 22.6 degrees from vertical, toward the west/front. Use $\tan\theta=5/12$
      from relative\rhorizontal and vertical components.

      '
    gradingMode: selfCheck
    keyPoints:
    - Relative\rhorizontal component is opposite your motion.
    - Vertical component remains 12 m/s downward.
    - 'Angle from vertical uses tangent:\rhorizontal over vertical.'
  explanation: 'Relative velocity is


    $$

    \vec{v}_{rain,you}=\vec{v}_{rain,ground}-\vec{v}_{you,ground}.

    $$


    This gives components $5\ \text{m/s}$ west and $12\ \text{m/s}$ downward. The
    angle from vertical satisfies


    $$

    \tan\theta=\frac{5}{12}.

    $$


    Thus $\theta\a\approx22.6^\circ$. The technique is observer subtraction plus right-triangle
    trig.

    '
- id: q006
  type: freeResponse
  prompt: 'Moving walkway frame: A walkway moves east at $1.2\ \text{m/s}$. A person
    walks west on it at $1.8\ \text{m/s}$ relative to the walkway for $10\ \text{s}$.


    What is the person''s displacement relative to the ground?

    '
  answer:
    expected: '6 m west. Ground velocity is $-1.8+1.2=-0.6$ m/s, so displacement is
      $-0.6(10)=-6$ m.

      '
    gradingMode: selfCheck
    keyPoints:
    - Choose east as positive.
    - Add person-relative-to-walkway and walkway-relative-to-ground.
    - Multiply ground velocity by time.
  explanation: 'Use relative velocity addition:


    $$

    v_{pg}=v_{pw}+v_{wg}.

    $$


    East is positive, so $v_{pw}=-1.8$ and $v_{wg}=1.2$. Thus


    $$

    v_{pg}=-0.6\ \text{m/s}.

    $$


    Over $10\ \text{s}$, displacement is $-6\ \text{m}$, meaning $6\ \text{m}$ west.
    This is an elevator/moving-reference-frame style problem in one dimension.

    '
- id: q007
  type: freeResponse
  prompt: 'Lead-on motion with two components: A target moves north at $3\ \text{m/s}$.
    You launch a projectile eastward toward the target''s path. The projectile takes
    $2.0\ \text{s}$ to reach that path.


    How far north of the target''s current position should you aim?

    '
  answer:
    expected: '6 m north. The target moves $3(2.0)=6$ m while the projectile is in
      flight.

      '
    gradingMode: selfCheck
    keyPoints:
    - The projectile travel time is given.
    - Target future displacement is target speed times time.
    - Aim at future position.
  explanation: 'Lead-on motion asks for the target''s future position. During the
    projectile''s $2.0\ \text{s}$ travel time, the target moves


    $$

    d=vt=(3)(2.0)=6\ \text{m}.

    $$


    Aim $6\ \text{m}$ north of the current target position. The technique is future-position
    prediction, not current-position aiming.

    '
- id: q008
  type: freeResponse
  prompt: 'Crossing river with specified landing drift: A boat points straight across
    a river and moves $5.0\ \text{m/s}$ relative to water. The current is $1.2\ \text{m/s}$.
    The boat lands $36\ \text{m}$ downstream.


    How wide is the river?

    '
  answer:
    expected: '150 m. Drift time is $36/1.2=30$ s, and width is $5.0(30)=150$ m.

      '
    gradingMode: selfCheck
    keyPoints:
    - Downstream drift determines time.
    - Straight-across boat component determines width.
    - Work backward from final drift.
  explanation: 'The downstream current gives the travel time:


    $$

    t=\frac{36}{1.2}=30\ \text{s}.

    $$


    The across-river component is $5.0\ \text{m/s}$ because the boat points straight
    across relative to the water. Therefore the width is


    $$

    w=(5.0)(30)=150\ \text{m}.

    $$


    This is the reverse of the usual drift problem: use the drift to find time, then
    use time to find width.

    '
- id: q009
  type: freeResponse
  prompt: 'Catch-up with positions: Train A is at $x=0$ and moves east at $16\ \text{m/s}$.
    Train B is at $x=-240\ \text{m}$ and moves east at $24\ \text{m/s}$.


    When and where does Train B catch Train A?

    '
  answer:
    expected: 'After 30 s, at x = 480 m. Relative gap is 240 m and relative speed
      is 8 m/s; then plug time into Train A''s position.

      '
    gradingMode: selfCheck
    keyPoints:
    - Initial separation is 240 m.
    - Same direction relative speed is $24-16=8$ m/s.
    - Position uses either train after catch time.
  explanation: 'The gap is $240\ \text{m}$ and Train B closes it at


    $$

    v_{\text{rel}}=24-16=8\ \text{m/s}.

    $$


    Catch time:


    $$

    t=\frac{240}{8}=30\ \text{s}.

    $$


    Train A''s position then is


    $$

    x_A=16(30)=480\ \text{m}.

    $$


    The technique combines relative-speed catch-up with absolute position after the
    meeting time is found.

    '
- id: q010
  type: freeResponse
  prompt: 'Elevator toss with acceleration phase: An elevator is moving upward at
    $2.0\ \text{m/s}$ when a ball is tossed upward inside it at $6.0\ \text{m/s}$
    relative to the elevator.


    Immediately after release, what is the ball''s velocity relative to the building,
    and what acceleration should be used for its motion relative to the building?

    '
  answer:
    expected: 'Initial velocity is 8.0 m/s upward relative to the building. After
      release, acceleration is $-9.8$ m/s² due to gravity, not the elevator''s velocity.

      '
    gradingMode: selfCheck
    keyPoints:
    - Add initial velocities at release.
    - Upward velocities add.
    - After release, acceleration is gravity if air resistance is ignored.
  explanation: 'At release,


    $$

    v_{ball,building}=v_{ball,elevator}+v_{elevator,building}=6.0+2.0=8.0\ \text{m/s}.

    $$


    Once the ball is no longer in contact with the hand, its building-frame acceleration
    is due to gravity:


    $$

    a_y=-9.8\ \text{m/s}^2.

    $$


    The technique choice is frame conversion for initial velocity, then ordinary projectile/vertical
    kinematics for the motion after release.

    '
