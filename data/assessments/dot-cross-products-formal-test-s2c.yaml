questions:
- { id: q001, type: multipleChoice, prompt: 'Compute $\langle2,-1,3\rangle\cdot\langle1,4,-2\rangle$.', choices: [{ id: a, text: '$-8$' }, { id: b, text: '$12$', issueSignals: [{ id: sign-error, domains: [] }] }, { id: c, text: '$\langle2,-4,-6\rangle$', issueSignals: [{ id: scalar-vector-confusion, domains: [] }] }, { id: d, text: '$8$', issueSignals: [{ id: sign-error, domains: [] }] }], answer: { choiceId: a }, issueSignals: [{ id: dot-product-computation-error, domains: [] }], difficultyDimensions: [representationTransfer, modelOrDerivation, methodSelection], difficultyEvidence: Transfers signed component products to a scalar result., prerequisiteObjectiveIds: [calc3-vector-operations], extensionObjectiveIds: [calc3-lines-planes-model], explanation: 'Solution: $2(1)+(-1)(4)+3(-2)=-8$. Why it works: Dot products add corresponding component products. Why the other choices fail: b loses signs; c is componentwise multiplication; d reverses the computed sign.' }
- { id: q002, type: multipleChoice, prompt: 'Which expression gives the area of the triangle spanned by $\mathbf u$ and $\mathbf v$?', choices: [{ id: a, text: '$\frac12|\mathbf u\times\mathbf v|$' }, { id: b, text: '$|\mathbf u\times\mathbf v|$', issueSignals: [{ id: cross-product-area-error, domains: [] }] }, { id: c, text: '$\mathbf u\cdot\mathbf v$', issueSignals: [{ id: dot-cross-confusion, domains: [] }] }, { id: d, text: '$|\mathbf u+\mathbf v|$', issueSignals: [{ id: dot-cross-confusion, domains: [] }] }], answer: { choiceId: a }, issueSignals: [{ id: cross-product-area-error, domains: [] }], difficultyDimensions: [representationTransfer, modelOrDerivation, methodSelection], difficultyEvidence: Selects the correct geometric area model., prerequisiteObjectiveIds: [calc3-vector-operations], extensionObjectiveIds: [calc3-lines-planes-model], explanation: 'Solution: Use $\frac12|\mathbf u\times\mathbf v|$. Why it works: Cross-product magnitude is parallelogram area, and a triangle is half of it. Why the other choices fail: b omits one-half; c is scalar alignment; d is a diagonal length.' }
- { id: q003, type: multipleChoice, prompt: 'Let $\mathbf a=\langle1,2,0\rangle$ and $\mathbf b=\langle2,-1,3\rangle$. Which vector is normal to their plane?', choices: [{ id: a, text: '$\langle6,-3,-5\rangle$' }, { id: b, text: '$\langle3,1,3\rangle$', issueSignals: [{ id: normal-vector-method-error, domains: [] }] }, { id: c, text: '$\langle4,4,9\rangle$', issueSignals: [{ id: normal-vector-method-error, domains: [] }] }, { id: d, text: '$\langle1,2,0\rangle$', issueSignals: [{ id: normal-vector-method-error, domains: [] }] }], answer: { choiceId: a }, issueSignals: [{ id: cross-product-computation-error, domains: [] }], difficultyDimensions: [representationTransfer, modelOrDerivation, methodSelection], difficultyEvidence: Expands a determinant and identifies a normal direction., prerequisiteObjectiveIds: [calc3-vector-operations], extensionObjectiveIds: [calc3-lines-planes-model], explanation: 'Solution: $\mathbf a\times\mathbf b=\langle6,-3,-5\rangle$. Why it works: A cross product is perpendicular to both inputs. Why the other choices fail: b is vector addition; c is componentwise multiplication; d is an input direction.' }
- { id: q004, type: multipleChoice, prompt: 'Two nonzero vectors have dot product $-6$. Which conclusion is guaranteed?', choices: [{ id: a, text: The angle between them is obtuse. }, { id: b, text: They are perpendicular., issueSignals: [{ id: dot-product-geometry-error, domains: [] }] }, { id: c, text: They are parallel., issueSignals: [{ id: dot-product-geometry-error, domains: [] }] }, { id: d, text: Their cross product is zero., issueSignals: [{ id: dot-cross-confusion, domains: [] }] }], answer: { choiceId: a }, issueSignals: [{ id: dot-product-geometry-error, domains: [] }], difficultyDimensions: [representationTransfer, modelOrDerivation, methodSelection], difficultyEvidence: Interprets the sign of a dot product geometrically., prerequisiteObjectiveIds: [calc3-vector-operations], extensionObjectiveIds: [calc3-lines-planes-model], explanation: 'Solution: The angle is obtuse. Why it works: Negative dot product means $\cos\theta<0$. Why the other choices fail: perpendicular requires zero; parallel is not guaranteed; a nonzero dot product does not determine a zero cross product.' }
