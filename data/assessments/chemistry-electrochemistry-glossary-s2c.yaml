glossary:
  introduction: 'Use these terms to track electron transfer, cell direction, electrical driving force, and electrolysis quantitatively.'
  sections:
    - id: redox-and-cells
      title: Redox reactions and cell structure
      entries:
        - id: oxidation
          term: oxidation
          definition: 'Loss of electrons by a species, accompanied by an increase in its oxidation number.'
          drills: [{ id: d1, type: flashcard, prompt: 'What electron change defines oxidation?', answer: { expected: 'loss of electrons', aliases: ['electron loss'] }, explanation: 'Solution: Oxidation is loss of electrons. Why it works: Removing negative charge raises the species oxidation number.' }]
        - id: reduction
          term: reduction
          definition: 'Gain of electrons by a species, accompanied by a decrease in its oxidation number.'
          drills: [{ id: d2, type: flashcard, prompt: 'What electron change defines reduction?', answer: { expected: 'gain of electrons', aliases: ['electron gain'] }, explanation: 'Solution: Reduction is gain of electrons. Why it works: Adding negative charge lowers the species oxidation number.' }]
        - id: oxidizing-agent
          term: oxidizing agent
          definition: 'The reactant that accepts electrons and is itself reduced while causing another species to oxidize.'
          drills: [{ id: d3, type: flashcard, prompt: 'What happens to an oxidizing agent during reaction?', answer: { expected: 'it is reduced', aliases: ['gains electrons'] }, explanation: 'Solution: It is reduced. Why it works: The oxidizing agent accepts the electrons lost by the other species.' }]
        - id: reducing-agent
          term: reducing agent
          definition: 'The reactant that donates electrons and is itself oxidized while causing another species to reduce.'
          drills: [{ id: d4, type: flashcard, prompt: 'What happens to a reducing agent during reaction?', answer: { expected: 'it is oxidized', aliases: ['loses electrons'] }, explanation: 'Solution: It is oxidized. Why it works: The reducing agent supplies electrons to the species being reduced.' }]
        - id: half-reaction
          term: half-reaction
          definition: 'An equation that represents either the oxidation or reduction part of a redox process and displays transferred electrons.'
          drills: [{ id: d5, type: flashcard, prompt: 'Why are electrons written in a half-reaction?', answer: { expected: 'to show and balance transferred charge', aliases: ['balance charge', 'show electron transfer'] }, explanation: 'Solution: They show and balance transferred charge. Why it works: Equal electron loss and gain must cancel in the net reaction.' }]
        - id: anode
          term: anode
          definition: 'The electrode at which oxidation occurs, regardless of whether the cell is galvanic or electrolytic.'
          drills: [{ id: d6, type: flashcard, prompt: 'Which reaction always occurs at the anode?', answer: { expected: 'oxidation' }, explanation: 'Solution: Oxidation. Why it works: Anode is defined by reaction type, not by a universal electrode sign.' }]
        - id: cathode
          term: cathode
          definition: 'The electrode at which reduction occurs, regardless of whether the cell is galvanic or electrolytic.'
          drills: [{ id: d7, type: flashcard, prompt: 'Which reaction always occurs at the cathode?', answer: { expected: 'reduction' }, explanation: 'Solution: Reduction. Why it works: Cathode is the site that accepts electrons into a reduction half-reaction.' }]
        - id: salt-bridge
          term: salt bridge
          definition: 'An ionic connection between half-cells that permits ion migration and prevents solution charge from accumulating.'
          drills: [{ id: d8, type: flashcard, prompt: 'What circuit function does a salt bridge perform?', answer: { expected: 'maintains charge balance by ion migration', aliases: ['maintains electrical neutrality', 'allows ion migration'] }, explanation: 'Solution: It maintains charge balance through ion migration. Why it works: Continued electron flow would otherwise leave uncompensated solution charge.' }]
    - id: potential-and-operation
      title: Cell potential and operation
      entries:
        - id: galvanic-cell
          term: galvanic cell
          definition: 'An electrochemical cell that converts the energy of a spontaneous redox reaction into electrical work.'
          drills: [{ id: d9, type: flashcard, prompt: 'Is the operating reaction in a galvanic cell spontaneous?', answer: { expected: 'yes' }, explanation: 'Solution: Yes. Why it works: A galvanic cell produces electrical work from a spontaneous reaction.' }]
        - id: electrolytic-cell
          term: electrolytic cell
          definition: 'An electrochemical cell in which an external power source drives a nonspontaneous redox reaction.'
          drills: [{ id: d10, type: flashcard, prompt: 'What supplies the driving force in an electrolytic cell?', answer: { expected: 'an external power source', aliases: ['external electrical energy'] }, explanation: 'Solution: An external power source. Why it works: Electrical energy forces the nonspontaneous chemical change.' }]
        - id: standard-reduction-potential
          term: standard reduction potential
          definition: 'The potential assigned to a reduction half-reaction under standard conditions, measured relative to the standard hydrogen electrode.'
          drills: [{ id: d11, type: flashcard, prompt: 'What does a more positive standard reduction potential indicate?', answer: { expected: 'a greater tendency to be reduced', aliases: ['stronger reduction tendency'] }, explanation: 'Solution: A greater reduction tendency. Why it works: The more positive half-reaction is favored as the galvanic cathode.' }]
        - id: cell-potential
          term: cell potential
          definition: 'The electrical potential difference between cathode and anode, calculated from reduction potentials as cathode minus anode.'
          drills: [{ id: d12, type: flashcard, prompt: 'State the standard cell-potential relation.', answer: { expected: 'cathode reduction potential minus anode reduction potential', aliases: ['E cathode minus E anode'] }, explanation: 'Solution: $E^\circ_{cell}=E^\circ_{red,cathode}-E^\circ_{red,anode}$. Why it works: The difference measures the cell driving force.' }]
        - id: cell-notation
          term: cell notation
          definition: 'A compact representation listing the anode half-cell on the left, cathode half-cell on the right, phase boundaries as single lines, and the salt bridge as a double line.'
          drills: [{ id: d13, type: flashcard, prompt: 'Which half-cell is written on the left in conventional galvanic-cell notation?', answer: { expected: 'anode half-cell', aliases: ['anode'] }, explanation: 'Solution: The anode half-cell. Why it works: Conventional notation follows oxidation on the left and reduction on the right.' }]
        - id: reaction-quotient
          term: reaction quotient
          definition: 'The products-over-reactants activity ratio, Q, evaluated for the cell reaction at its current composition.'
          drills: [{ id: d14, type: flashcard, prompt: 'What composition does Q describe?', answer: { expected: 'the current composition', aliases: ['current concentrations or pressures'] }, explanation: 'Solution: The current composition. Why it works: Q supplies the composition correction to standard cell potential.' }]
        - id: nernst-equation
          term: Nernst equation
          definition: 'The relation connecting nonstandard cell potential to standard potential, temperature, electron count, and reaction quotient.'
          drills: [{ id: d15, type: flashcard, prompt: 'At 25 C, what quantity is subtracted from $E^\circ$ in the Nernst equation?', answer: { expected: '(0.05916/n) log Q', aliases: ['0.05916 over n times log Q'] }, explanation: 'Solution: $(0.05916/n)\log Q$. Why it works: Composition changes the available electrical driving force.' }]
        - id: faraday-constant
          term: Faraday constant
          definition: 'The magnitude of electric charge carried by one mole of electrons, approximately $96485\ \mathrm{C\,mol^{-1}}$.'
          drills: [{ id: d16, type: flashcard, prompt: 'What does the Faraday constant convert between?', answer: { expected: 'electric charge and moles of electrons', aliases: ['coulombs and moles of electrons'] }, explanation: 'Solution: Charge and moles of electrons. Why it works: One mole of electrons carries approximately 96485 coulombs.' }]
