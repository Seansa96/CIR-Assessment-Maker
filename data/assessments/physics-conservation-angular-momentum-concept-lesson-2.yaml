lesson:
  introduction: We now apply Conservation Angular Momentum to complex, multi-body
    physical systems.
  sections:
  - id: sec-1
    title: Complex Systems
    content: When applying Conservation Angular Momentum to systems with multiple
      interconnected moving parts, conservation laws become our most powerful tools.
      If net external torque is zero, angular momentum is conserved.
    media: []
    check:
      id: chk-physics-conservation-angular-momentum-3
      type: multipleChoice
      prompt: When can you assume angular momentum is conserved?
      choices:
      - id: a
        text: Always.
      - id: b
        text: Only when the object is isolated from gravity.
      - id: c
        text: When the net external torque is zero.
      answer:
        choiceId: c
      explanation: $\tau_{net} = dL/dt$. If $\tau_{net} = 0$, then $dL/dt = 0$, meaning
        $L$ is constant.
  - id: sec-2
    title: Problem Solving Strategy
    content: '1. Identify the system and the axis of rotation.

      2. Draw a free-body diagram.

      3. Determine all torques and forces.

      4. Apply Newton''s Second Law for rotation and translation simultaneously.'
    media: []
    check:
      id: chk-physics-conservation-angular-momentum-4
      type: multipleChoice
      prompt: What is the first step in solving a complex rotational dynamics problem?
      choices:
      - id: a
        text: Pick an arbitrary equation.
      - id: b
        text: Identify the system and the axis of rotation.
      - id: c
        text: Plug in all known numbers immediately.
      answer:
        choiceId: b
      explanation: A clear understanding of the system boundary and the pivot axis
        is required before any equations can be written.
  - { id: cal2-3, title: Isolated system, content: 'Internal torques cannot change total angular momentum of a selected system.', check: { id: calc23, type: multipleChoice, prompt: 'Internal torques in an isolated system:', choices: [{ id: a, text: 'cancel in total' }, { id: b, text: 'always increase total $L$' }], answer: { choiceId: a }, explanation: 'Solution: They cancel in total.\n\nWhy it works: Internal interactions occur in equal-opposite pairs.\n\nWhy the other choices fail: Internal torques redistribute rather than create total $L$.' } }
  - { id: cal2-4, title: Collisions, content: 'Angular momentum can be conserved during a collision if external torque is negligible.', check: { id: calc24, type: multipleChoice, prompt: 'During a short collision, angular momentum is conserved if:', choices: [{ id: a, text: 'external torque impulse is negligible' }, { id: b, text: 'kinetic energy is conserved' }], answer: { choiceId: a }, explanation: 'Solution: Require negligible external torque impulse.\n\nWhy it works: Angular impulse changes angular momentum.\n\nWhy the other choices fail: Kinetic energy can be lost while angular momentum is conserved.' } }
  - { id: cal2-5, title: Rotating star, content: 'A contracting rotating object spins faster if angular momentum is conserved.', check: { id: calc25, type: multipleChoice, prompt: 'As a star contracts with conserved $L$, its angular speed:', choices: [{ id: a, text: 'increases' }, { id: b, text: 'decreases' }], answer: { choiceId: a }, explanation: 'Solution: It increases.\n\nWhy it works: Contraction lowers moment of inertia.\n\nWhy the other choices fail: Lower inertia requires higher speed for the same $L$.' } }
  - { id: cal2-6, title: Direction, content: 'Angular momentum conservation is a vector law, so direction matters.', check: { id: calc26, type: multipleChoice, prompt: 'A conserved angular-momentum equation must preserve:', choices: [{ id: a, text: 'magnitude and direction' }, { id: b, text: 'magnitude only' }], answer: { choiceId: a }, explanation: 'Solution: Preserve magnitude and direction.\n\nWhy it works: Angular momentum is a vector.\n\nWhy the other choices fail: Components can change only through torque.' } }
  - { id: cal2-7, title: Problem check, content: 'After solving, compare initial and final total angular momentum about the same axis.', check: { id: calc27, type: multipleChoice, prompt: 'A useful conservation check is to compare:', choices: [{ id: a, text: 'initial and final total $L$' }, { id: b, text: 'only final angular speed' }], answer: { choiceId: a }, explanation: 'Solution: Compare total initial and final $L$.\n\nWhy it works: Conservation concerns a system total.\n\nWhy the other choices fail: Speed alone ignores inertia and other components.' } }
