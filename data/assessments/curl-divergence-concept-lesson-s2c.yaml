  - id: s02
    title: Divergence measures net outflow
    required: true
    content: Positive divergence indicates source-like local behavior; negative divergence indicates sink-like behavior. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
