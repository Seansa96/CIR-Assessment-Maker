      id: check-01
      type: multipleChoice
      prompt: What does curl measure?
      choices:
      - id: a
        text: local rotation
        media: []
        issueSignals: []
      - id: b
        text: net outflow (answers 'What does divergence measure?', not 'What does curl measure?')
        media: []
        issueSignals:
        - id: curl-divergence-component-error
          domains: []
      - id: c
        text: zero (answers 'What is curl of a gradient?', not 'What does curl measure?')
        media: []
        issueSignals:
        - id: curl-divergence-component-error
          domains: []
      - id: d
        text: zero (answers 'What is divergence of a constant field?', not 'What does curl measure?')
        media: []
        issueSignals:
        - id: curl-divergence-component-error
          domains: []
