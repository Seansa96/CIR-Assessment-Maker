  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 3 -> Partial Derivatives if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Curl measures local rotation
    required: true
    content: 'Curl is a vector in three dimensions and detects local spinning tendencies. In Curl and Divergence, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
