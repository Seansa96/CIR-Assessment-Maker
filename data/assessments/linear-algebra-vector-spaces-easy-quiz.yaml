questions:
  - id: eq-subspace-check-line
    type: multipleChoice
    prompt: |
      Let $H = \{ t \begin{bmatrix} 1 \\ 2 \\ -1 \end{bmatrix} : t \in \mathbb{R} \}$ be a line through the origin in $\mathbb{R}^3$. Is $H$ a subspace of $\mathbb{R}^3$?
    choices:
      - id: c1
        text: 'Yes — it contains the zero vector (when $t=0$) and is closed under addition and scalar multiplication.'
      - id: c2
        text: 'No — it is a line, and lines are not subspaces.'
      - id: c3
        text: 'No — it is closed under scalar multiplication, but not under addition.'
      - id: c4
        text: 'Yes — any set of vectors that can be parameterized is a subspace.'
    answer:
      choiceId: c1
    explanation: |
      **Zero vector**: $t=0$ gives $\vec{0}$. ✓
      **Closed under addition**: $(t\vec{v}) + (s\vec{v}) = (t+s)\vec{v}$, still on the line. ✓
      **Closed under scalar multiplication**: $c(t\vec{v}) = (ct)\vec{v}$, still on the line. ✓
      Any line **through the origin** is a subspace. (Lines not through the origin fail the zero vector test.)

  - id: eq-subspace-plane-fails
    type: multipleChoice
    prompt: |
      Let $H = \{ (x, y, z) \in \mathbb{R}^3 : x + y + z = 1 \}$. Is $H$ a subspace of $\mathbb{R}^3$?
    choices:
      - id: c1
        text: 'Yes, because it is a 2-dimensional plane.'
      - id: c2
        text: 'No, because $(0,0,0)$ does not satisfy $x + y + z = 1$.'
      - id: c3
        text: 'Yes, because any two points in the plane sum to a point in the plane.'
      - id: c4
        text: 'No, because it has more than one dimension.'
    answer:
      choiceId: c2
    explanation: |
      The zero vector $(0,0,0)$ gives $0 + 0 + 0 = 0 \neq 1$, so $\vec{0} \notin H$. This immediately fails the first condition of the Subspace Test. Only planes **through the origin** (equations of the form $ax + by + cz = 0$) are subspaces.

  - id: eq-col-space-ambient
    type: multipleChoice
    prompt: |
      For a $4 \times 6$ matrix $A$, which of the following correctly identifies the ambient spaces for $\text{Col}(A)$ and $\text{Nul}(A)$?
    choices:
      - id: c1
        text: '$\text{Col}(A) \subseteq \mathbb{R}^4$, $\text{Nul}(A) \subseteq \mathbb{R}^6$.'
      - id: c2
        text: '$\text{Col}(A) \subseteq \mathbb{R}^6$, $\text{Nul}(A) \subseteq \mathbb{R}^4$.'
      - id: c3
        text: 'Both $\text{Col}(A)$ and $\text{Nul}(A)$ are subsets of $\mathbb{R}^6$.'
      - id: c4
        text: 'Both $\text{Col}(A)$ and $\text{Nul}(A)$ are subsets of $\mathbb{R}^4$.'
    answer:
      choiceId: c1
    explanation: |
      $A$ maps $\mathbb{R}^6 \to \mathbb{R}^4$. The column space is made of output vectors (4 entries), so $\text{Col}(A) \subseteq \mathbb{R}^4$. The null space is made of input vectors that map to zero (6 entries), so $\text{Nul}(A) \subseteq \mathbb{R}^6$.

  - id: eq-rank-nullity-apply
    type: numericResponse
    prompt: |
      A $6 \times 8$ matrix $A$ has rank 5. What is the dimension of $\text{Nul}(A)$?
    answer:
      value: 3
      tolerance: 0
    explanation: |
      By the Rank-Nullity Theorem: $\text{rank}(A) + \text{nullity}(A) = n$ (number of columns) $= 8$.
      $5 + \text{nullity}(A) = 8 \implies \text{nullity}(A) = 3$.
