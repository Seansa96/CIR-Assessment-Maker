schemaVersion: 1
id: cpp-functions-recall
title: C++ Functions Recall
assessmentType: recallDrill
categoryId: c++
subcategoryId: c++-functions
subcategoryIds:
  - c++-functions
modeDefault: practice
randomizeQuestions: true
items:
  - id: r001
    type: typed
    prompt: 'What keyword indicates a function does not return a value?'
    answer:
      expected: void
  - id: r002
    type: typed
    prompt: 'What symbol is used to pass a parameter by reference?'
    answer:
      expected: '&'
      aliases:
        - ampersand
  - id: r003
    type: flashcard
    prompt: 'When passing a large object that shouldn''t be modified, what is the best parameter type qualifier?'
    answer:
      expected: const reference (const T&)
  - id: r004
    type: flashcard
    prompt: 'Can you overload two functions if they only differ by their return type?'
    answer:
      expected: No, the parameter lists must differ.
  - id: r005
    type: flashcard
    prompt: 'Where must default parameters be placed in a function''s parameter list?'
    answer:
      expected: At the end of the list.
  - id: r006
    type: flashcard
    prompt: 'What is the condition that stops a recursive function from calling itself infinitely?'
    answer:
      expected: The base case.


