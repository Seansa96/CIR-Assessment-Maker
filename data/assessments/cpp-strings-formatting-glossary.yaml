schemaVersion: 1
id: cpp-strings-formatting-glossary
title: C++ Strings and Formatting Glossary
assessmentType: glossary
categoryId: c++
topicId: cpp-strings-formatting
modeDefault: practice
navigation: { learningGoal: learn, activityType: glossary, tags: [c++, cpp-strings-formatting, strings, formatting] }
authoring: { visualRequirement: notApplicable, visualRationale: The glossary is a textual reference; the concept lesson supplies the contextual input/output reasoning. }
glossary:
  introduction: Use these definitions to recognize the C++ text representation and input behavior required by the topic.
  sections:
  - id: string-terms
    title: String and formatting terms
    entries:
    - id: cpp-string-owned
      term: '`std::string`'
      definition: An owning, mutable standard-library sequence of characters.
      drills: [{ id: cpp-string-owned-drill, type: typed, prompt: The owning standard C++ text type is ________., answer: { expected: 'std::string', aliases: [string] } }]
    - id: cpp-string-view
      term: '`std::string_view`'
      definition: A non-owning view of character data. It avoids a copy but depends on the referenced characters remaining valid.
      drills: [{ id: cpp-string-view-drill, type: typed, prompt: The non-owning text view type is ________., answer: { expected: 'std::string_view', aliases: [string_view] } }]
    - id: cpp-getline
      term: '`std::getline`'
      definition: A line-input function that reads through a newline and preserves spaces inside the line.
      drills: [{ id: cpp-getline-drill, type: typed, prompt: The line-input function that preserves spaces is ________., answer: { expected: getline, aliases: ['std::getline'] } }]
    - id: cpp-format-boundary
      term: Formatting boundary
      definition: The point where typed values are converted into presentation text for a terminal, file, or other output destination.
      drills: [{ id: cpp-format-boundary-drill, type: typed, prompt: Values should normally become presentation text at the output ________., answer: { expected: boundary } }]
