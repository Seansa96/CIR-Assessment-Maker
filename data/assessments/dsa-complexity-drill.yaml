id: dsa-complexity-drill
categoryId: dsa
topicId: dsa-complexity
learningGoal: recall
activityType: recallDrill
title: "Polynomial Big-O Reduction Drill"
description: "Practice reducing polynomial cost functions to their tightest Big-O bound."
navigation:
  tags: [big-o, complexity, drill]
skills:
  - id: obj-dsa-complexity-04
    level: recall
blueprintId: bp-dsa-complexity-drill-01
sourceChunkIds: ["src-20260810144616-0dc6e2835b:page-20-23"]

items:
  - id: drill-reduce-1
    prompt: "Given the cost function $f(n) = 8n + 4n$, what is the tightest Big-O bound?"
    answer: "O(n)"
  
  - id: drill-reduce-2
    prompt: "Given the cost function $f(n) = n(n+1)/2$, what is the tightest Big-O bound?"
    answer: "O(n^2)"
    
  - id: drill-reduce-3
    prompt: "Given the cost function $f(n) = 12$, what is the tightest Big-O bound?"
    answer: "O(1)"
    
  - id: drill-reduce-4
    prompt: "Given the cost function $f(n) = 1000n^2 + 5n^3 + 2$, what is the tightest Big-O bound?"
    answer: "O(n^3)"
