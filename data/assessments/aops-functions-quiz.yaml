- id: q005
  type: freeResponse
  prompt: |-
    A Functions problem has been changed so that the obvious first method no longer applies directly. Explain how you would decide whether **interpret graph transformations** is still legal, and name one condition you would check.
  answer:
    expected: |-
      Check whether the structure still contains absolute value and whether the constraints needed for interpret graph transformations remain true.
    gradingMode: selfCheck
    keyPoints:
    - Mentions absolute value.
    - Mentions interpret graph transformations.
    - Checks a condition or edge case.
  explanation: |-
    The purpose is to test method selection. Related topic: Functions; specific technique: interpret graph transformations.
  skills:
  - aops-functions
