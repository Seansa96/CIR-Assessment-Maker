questions:
- id: q-1
  type: multipleChoice
  prompt: Which distinction is correct? Include the stated aqueous condition and classify the model before choosing.
  choices:
  - id: a
    text: They are identical by definition
    issueSignals:
    - id: titration-equivalence-endpoint-confusion
      domains:
      - chemistry
  - id: b
    text: Equivalence is stoichiometric; endpoint is observed
    issueSignals: []
  - id: c
    text: Endpoint is calculated from moles only
    issueSignals:
    - id: titration-equivalence-endpoint-confusion
      domains:
      - chemistry
  - id: d
    text: Equivalence depends on indicator color
    issueSignals:
    - id: titration-equivalence-endpoint-confusion
      domains:
      - chemistry
  answer:
    choiceId: b
  explanation: 'Solution: Choice B (Equivalence is stoichiometric; endpoint is observed).


    Why it works: Apply the acid-base definition, equilibrium relation, logarithmic conversion, or stoichiometric ratio named
    by the prompt, then check units and assumptions.


    Why the other choices fail: Choice A (They are identical by definition) makes a model or sign error; choice C (Endpoint
    is calculated from moles only) uses the wrong condition or operation; choice D (Equivalence depends on indicator color)
    does not follow from the supplied species, values, or titration region.'
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  - representationTransfer
  difficultyEvidence: 'Titration vocabulary: apply the governing acid-base relation and check the result against the stated
    condition.'
  prerequisiteObjectiveIds:
  - acid-base-models
  extensionObjectiveIds:
  - acid-base-transfer
