        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Choice a balances atoms and includes phases. Why it works: Two NaCl units are needed for two chloride ions. Why the other choices fail: b omits a reactant/product and phases; c is an incomplete ionic shorthand; d leaves Na and Cl unbalanced.'
