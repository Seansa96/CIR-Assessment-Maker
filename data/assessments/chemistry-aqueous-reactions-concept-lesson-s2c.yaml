  - id: ar-05
    title: 5. Split only strong aqueous electrolytes
    required: true
    content: In a complete ionic equation, split aqueous soluble salts, strong acids, and strong bases. Keep solids, liquids, gases, and weak electrolytes intact.
    media:
    - type: image
      src: /media/chemistry/aqueous-reaction-flow.svg
      alt: Complete ionic equation stage
      caption: Only strong aqueous electrolytes are separated into ions.
    check:
      id: ar-05-c
      type: multipleChoice
      prompt: How is BaSO4(s) written in a complete ionic equation?
      choices:
      - id: a
        text: BaSO4(s)
        media: []
        issueSignals: []
      - id: b
        text: Ba2+(aq)+SO4 2−(aq)
        media: []
        issueSignals: []
      - id: c
        text: Ba+(aq)+SO4−(aq)
        media: []
        issueSignals: []
      - id: d
        text: Ba(aq)+SO4(aq)
        media: []
        issueSignals: []
