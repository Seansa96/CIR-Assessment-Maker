  - id: ar-04
    title: 4. Write the molecular equation
    required: true
    content: The molecular equation keeps compounds intact and labels phases. It is the balanced bookkeeping representation used before splitting strong electrolytes.
    media:
    - type: image
      src: /media/chemistry/aqueous-reaction-flow.svg
      alt: Molecular equation stage
      caption: Molecular equations preserve formula units and phases.
    check:
      id: ar-04-c
      type: multipleChoice
      prompt: Which is the balanced molecular equation for BaCl2(aq)+Na2SO4(aq)?
      choices:
      - id: a
        text: BaCl2(aq)+Na2SO4(aq)→BaSO4(s)+2NaCl(aq)
        media: []
        issueSignals: []
      - id: b
        text: BaCl2→BaSO4+NaCl
        media: []
        issueSignals: []
      - id: c
        text: Ba+SO4→BaSO4
        media: []
        issueSignals: []
      - id: d
        text: BaCl2+Na2SO4→BaSO4+NaCl
        media: []
        issueSignals: []
