id: chemistry-aqueous-reactions-concept-lesson-s2c
title: Reactions in Aqueous Solution
assessmentType: conceptLesson
categoryId: chemistry
topicId: chemistry-aqueous-reactions
modeDefault: practice
randomizeQuestions: false
navigation: { learningGoal: learn, activityType: conceptLesson, tags: [chemistry, precipitation, ionic-equations, spectator-ions] }
authoring: { visualRequirement: required, visualRationale: 'Molecular, ionic, and net-ionic equations describe different representations of the same particle-level event.', sourceId: src-20260720035703-91ea51b0d8 }
lesson:
  introduction: 'A reaction in water is not established merely because two clear solutions are mixed. Predict products and phases, then decide whether an insoluble solid, water, gas, or weak electrolyte is actually formed.'
  sections:
    - { id: ar-01, title: '1. Identify aqueous reactants', content: 'Aqueous soluble salts exist as hydrated ions. Begin by recognizing cations and anions and retaining each formula charge.', media: [{ type: image, src: /media/chemistry/aqueous-reaction-flow.svg, alt: Aqueous reaction decision workflow, caption: Move from formula prediction to particle-level net change. }], check: { id: ar-01-c, type: multipleChoice, prompt: 'Which ions occur in Na2CO3(aq)?', choices: [{ id: a, text: '2 Na+ and CO3 2−' }, { id: b, text: 'Na2+ and CO3−' }, { id: c, text: 'neutral Na2CO3 molecules only' }, { id: d, text: 'Na+ and CO3− only' }], answer: { choiceId: a }, explanation: 'Solution: Na2CO3 dissociates to two Na+ ions and one CO3 2− ion. Why it works: Formula subscripts and ionic charges determine ion count. Why the other choices fail: b and d assign wrong charges; c ignores soluble ionic dissociation.' } }
    - { id: ar-02, title: '2. Predict double-displacement products', content: 'For AX + BY, exchange ion partners and use charges to write neutral formulas before balancing. Do not invent product formulas by concatenating symbols.', media: [{ type: image, src: /media/chemistry/aqueous-reaction-flow.svg, alt: Partner-exchange workflow, caption: Product formulas must be charge balanced before phases are assigned. }], check: { id: ar-02-c, type: multipleChoice, prompt: 'What product contains Ba2+ and SO4 2−?', choices: [{ id: a, text: 'BaSO4' }, { id: b, text: 'Ba2SO4' }, { id: c, text: 'Ba(SO4)2' }, { id: d, text: 'BaSO3' }], answer: { choiceId: a }, explanation: 'Solution: Ba2+ and SO4 2− balance in a 1:1 formula, BaSO4. Why it works: Charges sum to zero. Why the other choices fail: b and c do not balance the given charges; d changes the anion.' } }
    - { id: ar-03, title: '3. Use solubility to decide whether reaction occurs', content: 'If every possible product remains soluble strong electrolyte, all ions remain spectators and there is no net ionic reaction. An insoluble product is a precipitate.', media: [{ type: image, src: /media/chemistry/aqueous-reaction-flow.svg, alt: Solubility decision workflow, caption: A precipitate removes ions from the aqueous mixture. }], check: { id: ar-03-c, type: multipleChoice, prompt: 'Mixing BaCl2(aq) and Na2SO4(aq) produces which precipitate?', choices: [{ id: a, text: 'BaSO4(s)' }, { id: b, text: 'NaCl(s)' }, { id: c, text: 'Cl2(g)' }, { id: d, text: 'none because all sulfates are soluble' }], answer: { choiceId: a }, explanation: 'Solution: BaSO4 is insoluble and precipitates. Why it works: Ba2+ is a sulfate solubility exception. Why the other choices fail: NaCl is soluble; no chlorine gas forms; d ignores the barium exception.' } }
    - { id: ar-04, title: '4. Write the molecular equation', content: 'The molecular equation keeps compounds intact and labels phases. It is the balanced bookkeeping representation used before splitting strong electrolytes.', media: [{ type: image, src: /media/chemistry/aqueous-reaction-flow.svg, alt: Molecular equation stage, caption: Molecular equations preserve formula units and phases. }], check: { id: ar-04-c, type: multipleChoice, prompt: 'Which is the balanced molecular equation for BaCl2(aq)+Na2SO4(aq)?', choices: [{ id: a, text: 'BaCl2(aq)+Na2SO4(aq)→BaSO4(s)+2NaCl(aq)' }, { id: b, text: 'BaCl2→BaSO4+NaCl' }, { id: c, text: 'Ba+SO4→BaSO4' }, { id: d, text: 'BaCl2+Na2SO4→BaSO4+NaCl' }], answer: { choiceId: a }, explanation: 'Solution: Choice a balances atoms and includes phases. Why it works: Two NaCl units are needed for two chloride ions. Why the other choices fail: b omits a reactant/product and phases; c is an incomplete ionic shorthand; d leaves Na and Cl unbalanced.' } }
    - { id: ar-05, title: '5. Split only strong aqueous electrolytes', content: 'In a complete ionic equation, split aqueous soluble salts, strong acids, and strong bases. Keep solids, liquids, gases, and weak electrolytes intact.', media: [{ type: image, src: /media/chemistry/aqueous-reaction-flow.svg, alt: Complete ionic equation stage, caption: Only strong aqueous electrolytes are separated into ions. }], check: { id: ar-05-c, type: multipleChoice, prompt: 'How is BaSO4(s) written in a complete ionic equation?', choices: [{ id: a, text: 'BaSO4(s)' }, { id: b, text: 'Ba2+(aq)+SO4 2−(aq)' }, { id: c, text: 'Ba+(aq)+SO4−(aq)' }, { id: d, text: 'Ba(aq)+SO4(aq)' }], answer: { choiceId: a }, explanation: 'Solution: Keep BaSO4(s) intact. Why it works: A solid precipitate is not an aqueous strong electrolyte. Why the other choices fail: b incorrectly dissolves the precipitate; c and d also give invalid charge notation.' } }
    - { id: ar-06, title: '6. Cancel spectator ions', content: 'Species unchanged on both sides of the complete ionic equation are spectators. Cancel exactly identical species; do not cancel ions merely because they have opposite charge.', media: [{ type: image, src: /media/chemistry/aqueous-reaction-flow.svg, alt: Spectator-ion cancellation stage, caption: Net ionic equations retain only species that change. }], check: { id: ar-06-c, type: multipleChoice, prompt: 'Which ions are spectators in Ba2+ + 2Cl− + 2Na+ + SO4 2− → BaSO4(s)+2Na+ +2Cl−?', choices: [{ id: a, text: 'Na+ and Cl−' }, { id: b, text: 'Ba2+ and SO4 2−' }, { id: c, text: 'all ions' }, { id: d, text: 'none' }], answer: { choiceId: a }, explanation: 'Solution: Na+ and Cl− occur unchanged on both sides. Why it works: Spectator ions do not participate in the chemical change. Why the other choices fail: Ba2+ and sulfate form the solid; c and d ignore unchanged ions.' } }
    - { id: ar-07, title: '7. Recognize no-reaction cases', content: 'Mixing NaCl(aq) and KNO3(aq) produces only soluble ions; no precipitate, weak electrolyte, water, or gas removes particles from solution. The correct net ionic result is no reaction.', media: [{ type: image, src: /media/chemistry/aqueous-reaction-flow.svg, alt: No-reaction branch, caption: If every ion remains aqueous and unchanged, there is no net reaction. }], check: { id: ar-07-c, type: multipleChoice, prompt: 'What is the net ionic equation after mixing NaCl(aq) and KNO3(aq)?', choices: [{ id: a, text: 'No reaction' }, { id: b, text: 'Na+ + Cl− → NaCl(s)' }, { id: c, text: 'K+ + NO3− → KNO3(s)' }, { id: d, text: 'Na+ + NO3− → NaNO3(s)' }], answer: { choiceId: a }, explanation: 'Solution: No reaction occurs. Why it works: All possible salts remain soluble, so every ion is spectator. Why the other choices fail: None of the written salts precipitates under the stated conditions.' } }
