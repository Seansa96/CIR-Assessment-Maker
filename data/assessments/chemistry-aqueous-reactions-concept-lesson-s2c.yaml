  - id: ar-07
    title: 7. Recognize no-reaction cases
    required: true
    content: Mixing NaCl(aq) and KNO3(aq) produces only soluble ions; no precipitate, weak electrolyte, water, or gas removes particles from solution. The correct net ionic result is no reaction.
    media:
    - type: image
      src: /media/chemistry/aqueous-reaction-flow.svg
      alt: No-reaction branch
      caption: If every ion remains aqueous and unchanged
    check:
      id: ar-07-c
      type: multipleChoice
      prompt: What is the net ionic equation after mixing NaCl(aq) and KNO3(aq)?
      choices:
      - id: a
        text: No reaction
        media: []
        issueSignals: []
      - id: b
        text: Na+ + Cl− → NaCl(s)
        media: []
        issueSignals: []
      - id: c
        text: K+ + NO3− → KNO3(s)
        media: []
        issueSignals: []
      - id: d
        text: Na+ + NO3− → NaNO3(s)
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: No reaction occurs. Why it works: All possible salts remain soluble, so every ion is spectator. Why the other choices fail: None of the written salts precipitates under the stated conditions.'
