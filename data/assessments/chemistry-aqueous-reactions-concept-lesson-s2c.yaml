lesson:
  introduction: A reaction in water is not established merely because two clear solutions are mixed. Predict products and phases, then decide whether an insoluble solid, water, gas, or weak electrolyte is actually formed.
  sections:
  - id: ar-01
    title: 1. Identify aqueous reactants
    required: true
    content: Aqueous soluble salts exist as hydrated ions. Begin by recognizing cations and anions and retaining each formula charge.
    media:
    - type: image
      src: /media/chemistry/aqueous-reaction-flow.svg
      alt: Aqueous reaction decision workflow
      caption: Move from formula prediction to particle-level net change.
    check:
      id: ar-01-c
      type: multipleChoice
      prompt: Which ions occur in Na2CO3(aq)?
      choices:
      - id: a
        text: 2 Na+ and CO3 2−
        media: []
        issueSignals: []
      - id: b
        text: Na2+ and CO3−
        media: []
        issueSignals: []
      - id: c
        text: neutral Na2CO3 molecules only
        media: []
        issueSignals: []
      - id: d
        text: Na+ and CO3− only
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Na2CO3 dissociates to two Na+ ions and one CO3 2− ion. Why it works: Formula subscripts and ionic charges determine ion count. Why the other choices fail: b and d assign wrong charges; c ignores soluble ionic dissociation.'
