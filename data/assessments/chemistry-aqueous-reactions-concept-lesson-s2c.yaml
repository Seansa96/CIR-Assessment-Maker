        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Na+ and Cl− occur unchanged on both sides. Why it works: Spectator ions do not participate in the chemical change. Why the other choices fail: Ba2+ and sulfate form the solid; c and d ignore unchanged ions.'
