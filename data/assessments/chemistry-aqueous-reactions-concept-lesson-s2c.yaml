  - id: ar-03
    title: 3. Use solubility to decide whether reaction occurs
    required: true
    content: If every possible product remains soluble strong electrolyte, all ions remain spectators and there is no net ionic reaction. An insoluble product is a precipitate.
    media:
    - type: image
      src: /media/chemistry/aqueous-reaction-flow.svg
      alt: Solubility decision workflow
      caption: A precipitate removes ions from the aqueous mixture.
    check:
      id: ar-03-c
      type: multipleChoice
      prompt: Mixing BaCl2(aq) and Na2SO4(aq) produces which precipitate?
      choices:
      - id: a
        text: BaSO4(s)
        media: []
        issueSignals: []
      - id: b
        text: NaCl(s)
        media: []
        issueSignals: []
      - id: c
        text: Cl2(g)
        media: []
        issueSignals: []
      - id: d
        text: none because all sulfates are soluble
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: BaSO4 is insoluble and precipitates. Why it works: Ba2+ is a sulfate solubility exception. Why the other choices fail: NaCl is soluble; no chlorine gas forms; d ignores the barium exception.'
