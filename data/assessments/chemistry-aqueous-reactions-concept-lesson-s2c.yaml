  - id: ar-02
    title: 2. Predict double-displacement products
    required: true
    content: For AX + BY, exchange ion partners and use charges to write neutral formulas before balancing. Do not invent product formulas by concatenating symbols.
    media:
    - type: image
      src: /media/chemistry/aqueous-reaction-flow.svg
      alt: Partner-exchange workflow
      caption: Product formulas must be charge balanced before phases are assigned.
    check:
      id: ar-02-c
      type: multipleChoice
      prompt: What product contains Ba2+ and SO4 2−?
      choices:
      - id: a
        text: BaSO4
        media: []
        issueSignals: []
      - id: b
        text: Ba2SO4
        media: []
        issueSignals: []
      - id: c
        text: Ba(SO4)2
        media: []
        issueSignals: []
      - id: d
        text: BaSO3
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Ba2+ and SO4 2− balance in a 1:1 formula, BaSO4. Why it works: Charges sum to zero. Why the other choices fail: b and c do not balance the given charges; d changes the anion.'
