  - id: ar-06
    title: 6. Cancel spectator ions
    required: true
    content: Species unchanged on both sides of the complete ionic equation are spectators. Cancel exactly identical species; do not cancel ions merely because they have opposite charge.
    media:
    - type: image
      src: /media/chemistry/aqueous-reaction-flow.svg
      alt: Spectator-ion cancellation stage
      caption: Net ionic equations retain only species that change.
    check:
      id: ar-06-c
      type: multipleChoice
      prompt: Which ions are spectators in Ba2+ + 2Cl− + 2Na+ + SO4 2− → BaSO4(s)+2Na+ +2Cl−?
      choices:
      - id: a
        text: Na+ and Cl−
        media: []
        issueSignals: []
      - id: b
        text: Ba2+ and SO4 2−
        media: []
        issueSignals: []
      - id: c
        text: all ions
        media: []
        issueSignals: []
      - id: d
        text: none
        media: []
        issueSignals: []
