questions:
- id: olympiad-test-q068
  type: multipleChoice
  prompt: A circle problem has a chord and center but no useful angles. What first construction is natural?
  choices:
  - id: a
    text: Draw a random parallel
  - id: b
    text: The stated facts are insufficient.
  - id: c
    text: Use the diagram scale to estimate the result.
  - id: d
    text: Connect center to chord endpoints
  answer:
    choiceId: d
  explanation: It produces equal radii and isosceles triangle. A common error is draw a random parallel.
- id: olympiad-test-q035
  type: multipleChoice
  prompt: Two tangent segments from one exterior point meet circle. What length relation holds?
  choices:
  - id: a
    text: The stated facts are insufficient.
  - id: b
    text: Use the diagram scale to estimate the result.
  - id: c
    text: They are equal
  - id: d
    text: They are perpendicular
  answer:
    choiceId: c
  explanation: Use tangent-segment theorem. A common error is they are perpendicular.
- id: olympiad-test-q075
  type: multipleChoice
  prompt: How can an auxiliary parallel line transfer an angle to a remote vertex?
  choices:
  - id: a
    text: Apply the converse without checking its hypothesis.
  - id: b
    text: Draw through target vertex a line parallel to the reference side and use corresponding angles
  - id: c
    text: The stated facts are insufficient.
  - id: d
    text: Use the diagram scale to estimate the result.
  answer:
    choiceId: b
  explanation: Extend the angle arbitrarily.
- id: olympiad-test-q067
  type: multipleChoice
  prompt: Prove a quadrilateral with supplementary opposite angles is cyclic.
  choices:
  - id: a
    text: Use the converse inscribed-angle relation to show one vertex lies on circle through other three
  - id: b
    text: The stated facts are insufficient.
  - id: c
    text: Use the diagram scale to estimate the result.
  - id: d
    text: Apply the converse without checking its hypothesis.
  answer:
    choiceId: a
  explanation: Use forward cyclic theorem only.
- id: olympiad-test-q074
  type: multipleChoice
  prompt: Why does a point drawn on a circle require incidence marking?
  choices:
  - id: a
    text: The stated facts are insufficient.
  - id: b
    text: Use the diagram scale to estimate the result.
  - id: c
    text: Apply the converse without checking its hypothesis.
  - id: d
    text: A diagram alone cannot certify exact membership
  answer:
    choiceId: d
  explanation: Circles contain every nearby point.
- id: olympiad-test-q077
  type: multipleChoice
  prompt: What distinguishes a proof chase from a calculation chase?
  choices:
  - id: a
    text: Use the diagram scale to estimate the result.
  - id: b
    text: Apply the converse without checking its hypothesis.
  - id: c
    text: A proof establishes a general relation from givens; a calculation finds a specified measure with reasons
  - id: d
    text: The stated facts are insufficient.
  answer:
    choiceId: c
  explanation: A proof uses no equations.
- id: olympiad-test-q033
  type: multipleChoice
  prompt: An isosceles triangle has vertex angle 20. A line from vertex bisects it. Find each new vertex angle.
  choices:
  - id: a
    text: 5 degrees
  - id: b
    text: 10 degrees
  - id: c
    text: 80 degrees
  - id: d
    text: 170 degrees
  answer:
    choiceId: b
  explanation: Angle bisector halves the angle. A common error is 80 degrees.
- id: olympiad-test-q108
  type: multipleChoice
  prompt: A transversal makes equal alternate interior angles. What conclusion is licensed?
  choices:
  - id: a
    text: The lines are parallel
  - id: b
    text: The transversal is perpendicular
  - id: c
    text: The stated facts are insufficient.
  - id: d
    text: Use the diagram scale to estimate the result.
  answer:
    choiceId: a
  explanation: Use the converse theorem. A common error is the transversal is perpendicular.
- id: olympiad-test-q079
  type: multipleChoice
  prompt: Why are same-side interior angles supplementary for parallel lines?
  choices:
  - id: a
    text: The stated facts are insufficient.
  - id: b
    text: Use the diagram scale to estimate the result.
  - id: c
    text: Apply the converse without checking its hypothesis.
  - id: d
    text: They combine with a corresponding/linear-pair relation under the parallel condition
  answer:
    choiceId: d
  explanation: They are vertical angles.
- id: olympiad-test-q073
  type: multipleChoice
  prompt: Why must an outside-secant angle use arc difference, not sum?
  choices:
  - id: a
    text: Use the diagram scale to estimate the result.
  - id: b
    text: Apply the converse without checking its hypothesis.
  - id: c
    text: Its rays intercept nested arcs and the external turning compares far minus near
  - id: d
    text: The stated facts are insufficient.
  answer:
    choiceId: c
  explanation: All circle angles average arcs the same way.
- id: olympiad-test-q110
  type: multipleChoice
  prompt: Why does a tangent touch a circle once?
  choices:
  - id: a
    text: Apply the converse without checking its hypothesis.
  - id: b
    text: A line at distance exactly radius from center has one intersection; smaller distance gives two
  - id: c
    text: The stated facts are insufficient.
  - id: d
    text: Use the diagram scale to estimate the result.
  answer:
    choiceId: b
  explanation: Tangency is visual.
- id: olympiad-test-q069
  type: multipleChoice
  prompt: Why is substituting labels into a triangle sum safer than chasing by appearance?
  choices:
  - id: a
    text: The equation records a complete invariant and exposes arithmetic errors
  - id: b
    text: The stated facts are insufficient.
  - id: c
    text: Use the diagram scale to estimate the result.
  - id: d
    text: Apply the converse without checking its hypothesis.
  answer:
    choiceId: a
  explanation: It makes the diagram to scale.
- id: olympiad-test-q111
  type: multipleChoice
  prompt: What construction often proves two chord-related angles equal?
  choices:
  - id: a
    text: The stated facts are insufficient.
  - id: b
    text: Use the diagram scale to estimate the result.
  - id: c
    text: Apply the converse without checking its hypothesis.
  - id: d
    text: Connect endpoints to center and use equal radii/isosceles angles
  answer:
    choiceId: d
  explanation: Draw an unrelated diameter.
- id: olympiad-test-q066
  type: multipleChoice
  prompt: Prove an angle in a semicircle is right.
  choices:
  - id: a
    text: It intercepts 90-degree arc, and inscribed angle is half arc
  - id: b
    text: It intercepts 190-degree arc, and inscribed angle is half arc
  - id: c
    text: It intercepts 180-degree arc, and inscribed angle is half arc
  - id: d
    text: It intercepts 360-degree arc, and inscribed angle is half arc
  answer:
    choiceId: c
  explanation: Assume every chord is diameter.
- id: olympiad-test-q109
  type: multipleChoice
  prompt: A quadrilateral has opposite angles 88 and 92. What circle conclusion can be drawn?
  choices:
  - id: a
    text: Use the diagram scale to estimate the result.
  - id: b
    text: It is cyclic, provided it is a simple quadrilateral
  - id: c
    text: It is a rectangle
  - id: d
    text: The stated facts are insufficient.
  answer:
    choiceId: b
  explanation: Use supplementary-opposite-angle converse. A common error is it is a rectangle.
