- id: q-circle-area-sectors-segments-test-1
  type: multipleChoice
  prompt: 'What is the arc length of a sector with radius 6 and central angle 120 degrees?'
  choices:
  - id: choice-A
    text: '6\pi'
  - id: choice-B
    text: '4\pi'
  - id: choice-C
    text: '12\pi'
  answer:
    choiceId: choice-B
    explanation: 'Arc length = (angle/360) * 2 * pi * r = (120/360) * 2 * 6 * pi = 4\pi.'
  skills:
  - geometry-circle-area-sectors-segments
