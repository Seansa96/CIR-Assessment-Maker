- id: easy-q007
  type: symbolicResponse
  prompt: |-
    The angular velocity of a disk is given by $\omega(t) = a t^8 + b$. What is its angular acceleration?
  answer:
    expectedLatex: 8 a t^7
    equivalenceMode: derivative
    variables:
    - a
    - b
    - t
    tolerance: 0.001
  explanation: |-
    $\alpha(t) = \frac{d\omega}{dt}$. Taking the derivative of the given polynomial yields the answer.
