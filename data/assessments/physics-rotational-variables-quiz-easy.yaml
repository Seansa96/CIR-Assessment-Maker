questions:
- id: easy-q001
  type: numericResponse
  prompt: |-
    A motor starts from rest and accelerates at $2.0\text{ rad/s}^2$ for $3.0\text{ s}$. What is its final angular velocity?
  answer:
    value: 6.0
    tolerance: 0.1
  explanation: |-
    $\omega_f = \omega_i + \alpha t = 0 + 2.0(3.0) = 6.0$ rad/s.
