questions:
- id: easy-q001
  type: numericResponse
  prompt: A wheel starts from rest with constant angular acceleration $2.0$ rad/s^2 for $3.0$ s. Find final angular velocity in rad/s.
  answer: { value: 6.0, tolerance: 0.1 }
  explanation: |
    Solution: $omega_f=omega_i+alpha t=0+2.0(3.0)=6.0$ rad/s.

    Why it works: Constant angular acceleration changes angular velocity linearly with time.
  difficultyDimensions: [modelOrDerivation, simplification]
- id: easy-q002
  type: numericResponse
  prompt: A disk rotates at $120$ rev/min. What is its angular speed in rad/s?
  answer: { value: 12.566371, tolerance: 0.05 }
  explanation: |
    Solution: $120$ rev/min equals $2.0$ rev/s, so $omega=2.0(2pi)=12.57$ rad/s.

    Why it works: One revolution is $2pi$ radians and one minute is 60 seconds.
  difficultyDimensions: [representationTransfer, simplification]
- id: easy-q003
  type: numericResponse
  prompt: A fan turns through $3.0$ complete revolutions. What angular displacement in radians has it undergone?
  answer: { value: 18.849556, tolerance: 0.05 }
  explanation: |
    Solution: $theta=3.0(2pi)=18.85$ rad.

    Why it works: Angular displacement measures the angle swept, with $2pi$ radians per revolution.
  difficultyDimensions: [representationTransfer, simplification]
- id: easy-q004
  type: numericResponse
  prompt: A turntable's angular velocity changes from $4.0$ rad/s to $10.0$ rad/s in $2.0$ s. Find its angular acceleration in rad/s^2.
  answer: { value: 3.0, tolerance: 0.1 }
  explanation: |
    Solution: $alpha=(omega_f-omega_i)/t=(10.0-4.0)/2.0=3.0$ rad/s^2.

    Why it works: Angular acceleration is the rate of change of angular velocity.
  difficultyDimensions: [modelOrDerivation, simplification]
- id: easy-q005
  type: numericResponse
  prompt: A point on the rim of a $0.40$ m radius wheel has angular speed $5.0$ rad/s. Find its tangential speed in m/s.
  answer: { value: 2.0, tolerance: 0.05 }
  explanation: |
    Solution: $v=r omega=(0.40)(5.0)=2.0$ m/s.

    Why it works: All rim points share angular speed, while tangential speed scales with radius.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
- id: easy-q006
  type: multipleChoice
  prompt: Which quantity has SI unit rad/s^2?
  choices: [{ id: a, text: angular acceleration }, { id: b, text: angular displacement }, { id: c, text: moment of inertia }]
  answer: { choiceId: a }
  explanation: |
    Solution: Angular acceleration has unit rad/s^2.

    Why it works: It is the time rate of change of angular velocity, which is measured in rad/s.

    Why the other choices fail: Angular displacement is in radians, and moment of inertia has mass-length-squared units.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
- id: easy-q007
  type: symbolicResponse
  prompt: If $omega(t)=4t^2+3$, find angular acceleration as a function of time.
  answer: { expectedLatex: 8t, equivalenceMode: expression, variables: [t], tolerance: 0.001 }
  explanation: |
    Solution: $alpha(t)=d omega/dt=8t$.

    Why it works: Angular acceleration is the derivative of angular velocity.
  difficultyDimensions: [modelOrDerivation, auxiliaryTechnique]
- id: easy-q008
  type: numericResponse
  prompt: A wheel initially rotates at $8.0$ rad/s and slows at constant $-2.0$ rad/s^2. How long until it stops?
  answer: { value: 4.0, tolerance: 0.1 }
  explanation: |
    Solution: Set $omega_f=0$: $0=8.0-2.0t$, giving $t=4.0$ s.

    Why it works: Constant negative angular acceleration reduces the angular velocity at a fixed rate.
  difficultyDimensions: [modelOrDerivation, reverseReasoning]
- id: easy-q009
  type: numericResponse
  prompt: A wheel begins at rest and has angular acceleration $4.0$ rad/s^2 for $2.0$ s. Find its angular displacement in radians.
  answer: { value: 8.0, tolerance: 0.1 }
  explanation: |
    Solution: $theta=omega_i t+0.5 alpha t^2=0+0.5(4.0)(2.0)^2=8.0$ rad.

    Why it works: Constant-angular-acceleration kinematics gives displacement from initial velocity, acceleration, and time.
  difficultyDimensions: [modelOrDerivation, simplification]
- id: easy-q010
  type: multipleChoice
  prompt: Two points lie on the same rigid rotating disk, one near the hub and one at the rim. Which statement is correct?
  choices: [{ id: a, text: They have the same angular speed but different tangential speeds. }, { id: b, text: They have the same tangential speed but different angular speeds. }, { id: c, text: The hub point always has greater angular speed. }]
  answer: { choiceId: a }
  explanation: |
    Solution: They have the same angular speed but different tangential speeds.

    Why it works: A rigid disk turns through one angle in one time, while $v=r omega$ increases with radius.

    Why the other choices fail: Rigid rotation does not give different angular speeds, and tangential speed is not constant across radius.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
