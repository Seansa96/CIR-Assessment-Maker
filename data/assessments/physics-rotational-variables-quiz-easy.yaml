questions:
- id: q1
  type: numericResponse
  prompt: A motor spins at $1200 \text{ rev/min}$. What is its angular velocity in
    $\text{rad/s}$? (Use $\pi \approx 3.14159$)
  answer:
    value: 125.66
    tolerance: 1.0
  explanation: $1200 \times \frac{2\pi}{60} \approx 125.66 \text{ rad/s}$.
