lesson:
  introduction: |
    Most chemistry happens in water. Understanding *why* water is such a powerful solvent and *what happens* when ionic and molecular compounds dissolve in it is the foundation of solution chemistry, acid-base reactions, and biological processes.
  sections:
    - id: water-as-solvent
      title: Water as a Universal Solvent
      required: true
      content: |
        Water (H2O) is a **polar molecule**: the oxygen end carries a partial negative charge (δ−) and each hydrogen carries a partial positive charge (δ+). This asymmetry arises from oxygen's high electronegativity.

        When an ionic compound (like NaCl) is placed in water:
        1. The δ− oxygen atoms are attracted to Na+ cations.
        2. The δ+ hydrogen atoms are attracted to Cl− anions.
        3. Water molecules surround and pull apart the ions — a process called **solvation** (or hydration for water specifically).

        Each ion becomes surrounded by a "hydration shell" of water molecules. This releases energy (hydration energy), which drives the dissolution process.

        **"Like dissolves like":**
        - Polar and ionic solutes dissolve in polar solvents (like water).
        - Nonpolar solutes (like oils and waxes) dissolve in nonpolar solvents (like hexane).

        Sugar (C12H22O11) dissolves in water because it has many polar OH groups that hydrogen-bond with water. Oil does not dissolve because its C-H bonds are nonpolar.
      check:
        id: water-check
        type: multipleChoice
        prompt: |
          Which of the following best explains why NaCl dissolves readily in water but does not dissolve in cooking oil?
        choices:
          - id: a
            text: NaCl is ionic (polar) and water is polar. Oil is nonpolar and cannot solvate ions.
          - id: b
            text: NaCl is heavier than oil so it sinks past the oil.
          - id: c
            text: Water is hotter and breaks NaCl apart thermally.
          - id: d
            text: NaCl has a higher melting point than oil.
        answer:
          choiceId: a
        explanation: |
          "Like dissolves like." NaCl is an ionic compound with strong electrostatic forces. Polar water can interact with and stabilize the Na+ and Cl− ions through hydration. Nonpolar oil cannot interact with these ions, so NaCl remains undissolved.

    - id: electrolytes
      title: Strong Electrolytes, Weak Electrolytes, and Nonelectrolytes
      required: true
      content: |
        When a solute dissolves in water, it may or may not produce ions. The ability to conduct electricity in solution depends on the presence of ions.

        **Strong Electrolytes** — completely dissociate into ions:
        - All soluble ionic salts: NaCl(s) → Na+(aq) + Cl−(aq)
        - Strong acids: HCl(g) → H+(aq) + Cl−(aq)
        - Strong bases: NaOH(s) → Na+(aq) + OH−(aq)
        - Conduct electricity well.

        **Weak Electrolytes** — only partially ionize (reach equilibrium):
        - Weak acids: CH3COOH(aq) ⇌ H+(aq) + CH3COO−(aq) (only ~1% ionizes)
        - Weak bases: NH3(aq) + H2O(l) ⇌ NH4+(aq) + OH−(aq)
        - Conduct electricity poorly.

        **Nonelectrolytes** — do not ionize at all:
        - Molecular compounds without ionizable protons: C12H22O11 (sugar), C2H5OH (ethanol)
        - Do not conduct electricity.

        **The 6 strong acids** (memorize): HCl, HBr, HI, HNO3, H2SO4 (first proton only), HClO4
        **Strong bases**: Group 1A hydroxides (NaOH, KOH, LiOH...) and heavier Group 2A hydroxides (Ba(OH)2, Sr(OH)2)
      check:
        id: electrolytes-check
        type: selectAll
        prompt: |
          Which of the following are strong electrolytes in aqueous solution? Select all that apply.
        choices:
          - id: a
            text: KNO3 (potassium nitrate — soluble ionic salt)
          - id: b
            text: HCl (hydrochloric acid — strong acid)
          - id: c
            text: CH3COOH (acetic acid — weak acid)
          - id: d
            text: NaOH (sodium hydroxide — strong base)
          - id: e
            text: C6H12O6 (glucose — molecular compound)
        answer:
          choiceIds:
            - a
            - b
            - d
        explanation: |
          KNO3, HCl, and NaOH are all strong electrolytes (completely dissociate). Acetic acid (CH3COOH) is a weak electrolyte (partial ionization). Glucose is a nonelectrolyte (no ionization).

    - id: molarity
      title: Concentration — Molarity
      required: true
      content: |
        **Molarity (M)** is the most common unit of concentration in chemistry:

        $$
        M = \frac{\text{moles of solute}}{\text{liters of solution}}
        $$

        Note: molarity uses **liters of solution**, not liters of solvent.

        **Example:** Dissolve 5.85 g of NaCl in enough water to make exactly 500.0 mL (0.5000 L) of solution.

        $$
        n_{NaCl} = \frac{5.85 \text{ g}}{58.44 \text{ g/mol}} = 0.1001 \text{ mol}
        $$

        $$
        M = \frac{0.1001 \text{ mol}}{0.5000 \text{ L}} = 0.200 \text{ M}
        $$

        **Dilution:** When you add water to a concentrated stock solution, the moles of solute stay the same but the volume increases:
        $$
        M_1 V_1 = M_2 V_2
        $$

        Example: How much 12.0 M HCl is needed to make 500.0 mL of 0.100 M HCl?
        $$
        V_1 = \frac{M_2 V_2}{M_1} = \frac{(0.100)(0.500)}{12.0} = 4.17 \times 10^{-3} \text{ L} = 4.17 \text{ mL}
        $$
      check:
        id: molarity-check
        type: numericResponse
        prompt: |
          How many moles of H2SO4 are present in 250.0 mL of a 2.00 M H2SO4 solution?
        answer:
          value: 0.500
          tolerance: 0.005
        explanation: |
          moles = M × V(L) = 2.00 mol/L × 0.2500 L = 0.500 mol.
