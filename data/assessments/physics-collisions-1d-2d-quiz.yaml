questions:
- id: q001
  type: numericResponse
  prompt: A $1000\text{ kg}$ car at $20\text{ m/s}$ rear-ends a stationary $3000\text{ kg}$ truck. They lock together. What is their final velocity in m/s?
  answer: { value: 5.0, tolerance: 0.1 }
  explanation: |
    Solution: $1000(20)+3000(0)=(1000+3000)v_f$, so $v_f=20000/4000=5.0\text{ m/s}$.

    Why it works: With negligible external impulse, momentum is conserved; locking together gives both vehicles one shared final velocity.
  difficultyDimensions: [modelOrDerivation, simplification]
  difficultyEvidence: Models a perfectly inelastic collision with one final velocity.
- id: q002
  type: numericResponse
  prompt: For the collision in q001, how much kinetic energy in J is lost?
  answer: { value: 150000, tolerance: 500 }
  explanation: |
    Solution: $K_i=0.5(1000)(20)^2=200000\text{ J}$ and $K_f=0.5(4000)(5)^2=50000\text{ J}$, so the loss is $150000\text{ J}$.

    Why it works: Momentum determines the shared final speed, while the kinetic-energy comparison shows energy converted to internal forms during the inelastic collision.
  difficultyDimensions: [modelOrDerivation, auxiliaryTechnique]
  difficultyEvidence: Combines a momentum result with initial and final kinetic-energy calculations.
- id: q003
  type: numericResponse
  prompt: A $2.0\text{ kg}$ block moving right at $5.0\text{ m/s}$ has a perfectly elastic head-on collision with a $3.0\text{ kg}$ block moving left at $4.0\text{ m/s}$. What is the final velocity of the $2.0\text{ kg}$ block in m/s?
  answer: { value: -5.8, tolerance: 0.1 }
  explanation: |
    Solution: Momentum gives $-2=2v_{1f}+3v_{2f}$. Elastic relative velocity gives $9=v_{2f}-v_{1f}$. Substitution yields $v_{1f}=-5.8\text{ m/s}$.

    Why it works: A one-dimensional elastic collision conserves momentum and reverses relative velocity.
  difficultyDimensions: [modelOrDerivation, representationTransfer]
  difficultyEvidence: Uses signed velocities and a second independent elastic-collision relation.
- id: q004
  type: numericResponse
  prompt: An $800\text{ kg}$ car travels east at $15\text{ m/s}$ and a $1200\text{ kg}$ car travels north at $10\text{ m/s}$. They stick together. What is the magnitude of their final velocity in m/s?
  answer: { value: 8.485281, tolerance: 0.1 }
  explanation: |
    Solution: $p_x=800(15)=12000$ and $p_y=1200(10)=12000\text{ kg m/s}$. Dividing each by total mass $2000\text{ kg}$ gives $v_x=v_y=6.0\text{ m/s}$, so $v=\sqrt{6^2+6^2}=8.49\text{ m/s}$.

    Why it works: Momentum is conserved separately in perpendicular directions, then the final velocity magnitude follows from its components.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
  difficultyEvidence: Separates a two-dimensional collision into component momentum balances.
