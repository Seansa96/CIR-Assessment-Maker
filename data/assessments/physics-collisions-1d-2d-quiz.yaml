questions:
- id: q001
  type: freeResponse
  prompt: '**Perfectly Inelastic Collision (1D)**


    A $1000\ \text{kg}$ car moving at $20\ \text{m/s}$ rear-ends a stationary $3000\
    \text{kg}$ truck. The two vehicles lock bumpers and move together.


    What is the final velocity of the combined mass?

    '
  answer:
    expected: '$5.0\ \text{m/s}$. Use $m_1v_1 = (m_1+m_2)v_f$.

      '
    gradingMode: selfCheck
    keyPoints:
    - 'Momentum is conserved: $P_i = P_f$.'
    - 'Initial momentum is just the car: $(1000)(20) = 20000$.'
    - 'Final momentum is the combined mass: $(1000+3000)v_f = 4000v_f$.'
  explanation: 'In a perfectly inelastic collision, the objects stick together. By
    conservation of momentum:

    $$m_1v_{1i} + m_2v_{2i} = (m_1 + m_2)v_f$$

    $$1000(20) + 3000(0) = (1000 + 3000)v_f$$

    $$20000 = 4000v_f$$

    $$v_f = \frac{20000}{4000} = 5.0\ \text{m/s}$$

    '
- id: q002
  type: freeResponse
  prompt: '**Kinetic Energy Lost**


    In the previous problem (the $1000\ \text{kg}$ car hitting the $3000\ \text{kg}$
    truck),\rhow much kinetic energy was lost during the collision?

    '
  answer:
    expected: '$150,000\ \text{J}$. Find $K_i - K_f$.

      '
    gradingMode: selfCheck
    keyPoints:
    - 'Initial kinetic energy is just the car: $\frac{1}{2}(1000)(20)^2 = 200,000\
      \text{J}$.'
    - 'Final kinetic energy is the combined mass: $\frac{1}{2}(4000)(5)^2 = 50,000\
      \text{J}$.'
    - Loss is $200,000 - 50,000 = 150,000\ \text{J}$.
  explanation: 'Let''s calculate the initial kinetic energy:

    $$K_i = \frac{1}{2}m_1v_{1i}^2 = \frac{1}{2}(1000)(20)^2 = 500(400) = 200,000\
    \text{J}$$


    The final kinetic energy of the locked vehicles:

    $$K_f = \frac{1}{2}(m_1+m_2)v_f^2 = \frac{1}{2}(4000)(5)^2 = 2000(25) = 50,000\
    \text{J}$$


    The energy lost (which turned into sound, heat, and crumpled metal) is:

    $$\Delta K = K_i - K_f = 200,000 - 50,000 = 150,000\ \text{J}$$

    (Exactly 75% of the initial energy was lost!)

    '
- id: q003
  type: freeResponse
  prompt: "**Elastic Collision (1D)**\n\nA $2.0\\ \\text{kg}$ block moving right at\
    \ $5.0\\ \\text{m/s}$ has a perfectly elastic head-on collision with a $3.0\\\
    \ \\text{kg}$ block moving left at $4.0\\ \\text{m/s}$. \n\nWhat is the velocity\
    \ of the $2.0\\ \\text{kg}$ block after the collision? (Hint: In a 1D elastic\
    \ collision, the relative velocity of approach equals the relative velocity of\
    \ separation: $v_{1i} - v_{2i} = -(v_{1f} - v_{2f})$).\n"
  answer:
    expected: '$-5.8\ \text{m/s}$ (or $5.8\ \text{m/s}$ left). Use momentum conservation
      and relative velocity equations.

      '
    gradingMode: selfCheck
    keyPoints:
    - $v_{2i}$ must be $-4.0\ \text{m/s}$ because it moves left.
    - 'Momentum eq: $2(5) + 3(-4) = 2v_{1f} + 3v_{2f} \Rightarrow -2 = 2v_{1f} + 3v_{2f}$.'
    - 'Relative velocity eq: $5 - (-4) = v_{2f} - v_{1f} \Rightarrow 9 = v_{2f} -
      v_{1f} \Rightarrow v_{2f} = v_{1f} + 9$.'
    - Substitute to solve for $v_{1f}$.
  explanation: 'First, establish direction signs. Right is positive. $v_{1i} = 5$,
    $v_{2i} = -4$.


    Conservation of Momentum:

    $m_1v_{1i} + m_2v_{2i} = m_1v_{1f} + m_2v_{2f}$

    $2(5) + 3(-4) = 2v_{1f} + 3v_{2f}$

    $-2 = 2v_{1f} + 3v_{2f}$  (Equation 1)


    Relative Velocity (Elastic condition):

    $v_{1i} - v_{2i} = v_{2f} - v_{1f}$

    $5 - (-4) = v_{2f} - v_{1f}$

    $9 = v_{2f} - v_{1f} \implies v_{2f} = v_{1f} + 9$ (Equation 2)


    Substitute Eq 2 into Eq 1:

    $-2 = 2v_{1f} + 3(v_{1f} + 9)$

    $-2 = 2v_{1f} + 3v_{1f} + 27$

    $-29 = 5v_{1f}$

    $v_{1f} = -5.8\ \text{m/s}$


    The $2.0\ \text{kg}$ block bounces back to the left at $5.8\ \text{m/s}$.

    '
- id: q004
  type: freeResponse
  prompt: '**2D Perfectly Inelastic Collision**


    An $800\ \text{kg}$ car traveling east at $15\ \text{m/s}$ collides at an intersection
    with a $1200\ \text{kg}$ car traveling north at $10\ \text{m/s}$. They stick together
    after the collision.


    What is the magnitude of their final velocity?

    '
  answer:
    expected: '$8.5\ \text{m/s}$.

      '
    gradingMode: selfCheck
    keyPoints:
    - Momentum is a vector! Conserve $P_x$ and $P_y$ separately.
    - $P_x = 800(15) = 12000$.
    - $P_y = 1200(10) = 12000$.
    - $P_f = \sqrt{P_x^2 + P_y^2} = \sqrt{12000^2 + 12000^2} = 12000\sqrt{2} \a\approx
      16970$.
    - $v_f = P_f / m_{\text{total}} = 16970 / 2000 \a\approx 8.5\ \text{m/s}$.
  explanation: 'Since this is a 2D problem, we must conserve momentum in both the
    x (east) and y (north) directions.


    x-direction (East):

    $P_{xi} = m_1v_{1x} = (800)(15) = 12000\ \text{kg}\cdot\text{m/s}$

    $P_{xf} = (m_1+m_2)v_{fx} = 2000v_{fx} = 12000 \implies v_{fx} = 6.0\ \text{m/s}$


    y-direction (North):

    $P_{yi} = m_2v_{2y} = (1200)(10) = 12000\ \text{kg}\cdot\text{m/s}$

    $P_{yf} = (m_1+m_2)v_{fy} = 2000v_{fy} = 12000 \implies v_{fy} = 6.0\ \text{m/s}$


    The final velocity vector has components $(6.0, 6.0)$.

    Magnitude: $v_f = \sqrt{6.0^2 + 6.0^2} = \sqrt{36 + 36} = \sqrt{72} \a\approx 8.485\
    \text{m/s}$.

    '
