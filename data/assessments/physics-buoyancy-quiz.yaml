questions:
- id: q001
  type: numericResponse
  prompt: 'A solid crown has a true weight of $20.0 \text{ N}$ when measured in air.
    When it is suspended from a spring scale and completely submerged in water, the
    scale reads $18.5 \text{ N}$ (its apparent weight).

    Calculate the buoyant force acting on the crown in Newtons.

    '
  answer:
    value: 1.5
    tolerance: 0.1
  explanation: 'Solution:

    $W_{app} = W_{true} - F_B$

    $18.5 = 20.0 - F_B$

    $F_B = 20.0 - 18.5 = 1.5 \text{ N}$.


    Why it works:

    The apparent weight is the net downward force. Because the water pushes up on
    the crown, the tension required to support it (the scale reading) is reduced by
    an amount exactly equal to the buoyant force.

    '
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
- id: q002
  type: multipleChoice
  prompt: 'A large cargo ship sails from a freshwater river ($\rho \approx 1000 \text{
    kg/m}^3$) out into the open saltwater ocean ($\rho \approx 1025 \text{ kg/m}^3$).
    Assuming the ship''s cargo does not change, what happens to the ship?

    '
  choices:
  - id: a
    text: The ship displaces a smaller volume of water, so it rides higher in the
      ocean.
  - id: b
    text: The ship displaces a larger volume of water, so it sinks lower in the ocean.
    issueSignals:
    - id: density-buoyancy-inverted
  - id: c
    text: The buoyant force acting on the ship increases.
    issueSignals:
    - id: buoyant-force-weight-confusion
  - id: d
    text: The buoyant force acting on the ship decreases.
    issueSignals:
    - id: buoyant-force-weight-confusion
  answer:
    choiceId: a
  explanation: 'Solution:

    The ship displaces a smaller volume of water, so it rides higher in the ocean.


    Why it works:

    Because the ship is floating in equilibrium in both cases, the buoyant force must
    perfectly equal the ship''s weight ($F_B = W$). Thus, the buoyant force *does
    not change*. However, because salt water is denser, a *smaller volume* of it is
    needed to match the weight of the ship ($W = \rho V_{sub} g$). Since $V_{sub}$
    decreases, the ship rides higher.


    Why the other choices fail:

    The buoyant force is locked to the ship''s weight, which is constant. Therefore,
    the force cannot increase or decrease. It must be that a denser fluid provides
    the same force with less displaced volume.

    '
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
