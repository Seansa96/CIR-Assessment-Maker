- id: build-power-series-from-geometric
  title: Build a Power Series from a Geometric Series
  problem: |
    Find a power series representation for:

    $$
    f(x)=\frac{x^2}{1+3x}.
    $$

    Also state where the representation converges.
  steps:
  - id: build-power-step-1
    title: Match the geometric template
    instruction: |
      The core template is:

      $$
      \frac{1}{1-r}=\sum_{n=0}^{\infty}r^n,
      \qquad |r|<1.
      $$

      Rewrite:

      $$
      \frac{1}{1+3x}=\frac{1}{1-(-3x)}.
      $$
    type: multipleChoice
    issueSignals:
    - id: power-series-expansion-error
    - id: algebraic-simplification-error
    - id: power-rule-error
    - id: exponent-rule-misapplied
    - id: chain-rule-missed
    - id: function-composition-error
    prompt: What is $r$?
    choices:
    - id: a
      text: $-3x$
    - id: b
      text: $3x$
    - id: c
      text: $x^2$
    - id: d
      text: $1+3x$
    answer:
      choiceId: a
    explanation: 'Solution: Since $1+3x=1-(-3x)$, the geometric ratio is $r=-3x$. Therefore the answer is $-3x$.


      Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.


      Common trap: The first omitted term is not automatically an error bound. State the theorem''s hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.


      Why the other choices fail: $3x$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $x^2$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $1+3x$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.'
  - id: build-power-step-2
    title: Write the base series
    instruction: |
      Substitute $r=-3x$:

      $$
      \frac{1}{1+3x}
      =
      \sum_{n=0}^{\infty}(-3x)^n.
      $$
    type: multipleChoice
    issueSignals:
    - id: power-series-expansion-error
    - id: algebraic-simplification-error
    - id: power-rule-error
    - id: exponent-rule-misapplied
    - id: chain-rule-missed
    - id: function-composition-error
    prompt: What convergence condition comes from the geometric template?
    choices:
    - id: a
      text: $|-3x|<1$
    - id: b
      text: $|x|>3$
    - id: c
      text: $x^2<0$
    - id: d
      text: No condition is needed.
    answer:
      choiceId: a
    explanation: 'Solution: A geometric series converges when $|r|<1$, so here $|-3x|<1$. Therefore the answer is $|-3x|<1$.


      Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.


      Common trap: The first omitted term is not automatically an error bound. State the theorem''s hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.


      Why the other choices fail: $|x|>3$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $x^2<0$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; No condition is needed. conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.'
  - id: build-power-step-3
    title: Multiply by the extra factor
    instruction: |
      The original function has an extra factor of $x^2$:

      $$
      \frac{x^2}{1+3x}
      =
      x^2\sum_{n=0}^{\infty}(-3x)^n.
      $$
    type: multipleChoice
    issueSignals:
    - id: power-series-expansion-error
    - id: algebraic-simplification-error
    - id: power-rule-error
    - id: exponent-rule-misapplied
    - id: chain-rule-missed
    - id: function-composition-error
    prompt: Write the resulting series as a single summation.
    choices:
    - id: a
      text: |-
        $\sum_{n=0}^{\infty}(-3)^n x^{n+2}$
    - id: b
      text: |-
        $\sum_{n=0}^{\infty}(-3)^n x^n$
    - id: c
      text: |-
        $\sum_{n=0}^{\infty}3^n x^{n-2}$
    - id: d
      text: |-
        $\sum_{n=0}^{\infty}x^{2n}$
    answer:
      choiceId: a
    explanation: |-
      Solution: Multiplying by $x^2$ gives:

      $$
      x^2(-3x)^n=(-3)^n x^{n+2}.
      $$ Therefore the answer is $\sum_{n=0}^{\infty}(-3)^n x^{n+2}$.

      Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.

      Common trap: The first omitted term is not automatically an error bound. State the theorem's hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.

      Why the other choices fail: $\sum_{n=0}^{\infty}(-3)^n x^n$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $\sum_{n=0}^{\infty}3^n x^{n-2}$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $\sum_{n=0}^{\infty}x^{2n}$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.
  - id: build-power-step-4
    title: State the interval of convergence
    instruction: 'Solve:


      $$

      |-3x|<1.

      $$

      '
    type: multipleChoice
    issueSignals:
    - id: power-series-expansion-error
    - id: algebraic-simplification-error
    - id: power-rule-error
    - id: exponent-rule-misapplied
    - id: chain-rule-missed
    - id: function-composition-error
    prompt: What is the interval of convergence?
    choices:
    - id: a
      text: |-
        $\left(-\frac13,\frac13\right)$
    - id: b
      text: $(-3,3)$
    - id: c
      text: |-
        $(-\infty,\infty)$
    - id: d
      text: |-
        $\left[-\frac13,\frac13\right]$ automatically
    answer:
      choiceId: a
    explanation: |-
      Solution: $|-3x|<1$ gives $|x|<\frac13$. Because this came from a geometric series, the endpoints are not included. Therefore the answer is $\left(-\frac13,\frac13\right)$.

      Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.

      Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.

      Why the other choices fail: $(-3,3)$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; $(-\infty,\infty)$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; $\left[-\frac13,\frac13\right]$ automatically conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$.
- id: compose-maclaurin-series
  title: Compose a Maclaurin Series
  problem: |
    Find the Maclaurin series for:

    $$
    \sin(x^2).
    $$
  steps:
  - id: compose-maclaurin-step-1
    title: Recall the parent series
    instruction: |
      Start from the known Maclaurin series:

      $$
      \sin u=\sum_{n=0}^{\infty}(-1)^n\frac{u^{2n+1}}{(2n+1)!}.
      $$
    type: multipleChoice
    issueSignals:
    - id: power-series-expansion-error
    - id: algebraic-simplification-error
    - id: power-rule-error
    - id: exponent-rule-misapplied
    - id: chain-rule-missed
    - id: function-composition-error
    prompt: What substitution should be made?
    choices:
    - id: a
      text: $u=x^2$
    - id: b
      text: $u=2x$
    - id: c
      text: |-
        $u=\sin x$
    - id: d
      text: $u=n$
    answer:
      choiceId: a
    explanation: |-
      Solution: Since the input to sine is $x^2$, substitute $u=x^2$ into the known sine series. Therefore the answer is $u=x^2$.

      Why it works: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$. Compute derivatives at the center, divide by $n!$, and preserve the power $(x-a)^n$ before analyzing convergence.

      Common trap: Do not confuse the derivative value with its Taylor coefficient; the factorial belongs in every coefficient, including the constant term where $0!=1$.

      Why the other choices fail: $u=2x$ conflicts with this criterion: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$; $u=\sin x$ conflicts with this criterion: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$; $u=n$ conflicts with this criterion: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$.
  - id: compose-maclaurin-step-2
    title: Substitute into the powers
    instruction: |
      Replace $u$ with $x^2$:

      $$
      \sin(x^2)=\sum_{n=0}^{\infty}(-1)^n\frac{(x^2)^{2n+1}}{(2n+1)!}.
      $$
    type: symbolicResponse
    issueSignals:
    - id: power-series-expansion-error
    - id: algebraic-simplification-error
    - id: power-rule-error
    - id: exponent-rule-misapplied
    - id: chain-rule-missed
    - id: function-composition-error
    prompt: Simplify the power $(x^2)^{2n+1}$.
    answer:
      expectedLatex: x^{4n+2}
      equivalenceMode: expression
      variables:
      - x
      - n
      tolerance: 0.000001
    explanation: 'Solution: Use exponent multiplication:


      $$

      (x^2)^{2n+1}=x^{2(2n+1)}=x^{4n+2}.

      $$ Therefore the answer is x^{4n+2}.


      Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.


      Common trap: The first omitted term is not automatically an error bound. State the theorem''s hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.'
  - id: compose-maclaurin-step-3
    title: Write the final series
    instruction: |
      After simplifying the power, the series is:

      $$
      \sin(x^2)=\sum_{n=0}^{\infty}(-1)^n\frac{x^{4n+2}}{(2n+1)!}.
      $$
    type: multipleChoice
    issueSignals:
    - id: power-series-expansion-error
    - id: algebraic-simplification-error
    - id: power-rule-error
    - id: exponent-rule-misapplied
    - id: chain-rule-missed
    - id: function-composition-error
    prompt: What are the first three nonzero terms?
    choices:
    - id: a
      text: |-
        $x^2-\frac{x^6}{3!}+\frac{x^{10}}{5!}$
    - id: b
      text: |-
        $x-\frac{x^3}{3!}+\frac{x^5}{5!}$
    - id: c
      text: |-
        $x^2+\frac{x^4}{2!}+\frac{x^6}{3!}$
    - id: d
      text: |-
        $1-x^2+\frac{x^4}{2!}$
    answer:
      choiceId: a
    explanation: |-
      Solution: Plug in $n=0,1,2$:

      $$
      x^2-\frac{x^6}{3!}+\frac{x^{10}}{5!}.
      $$ Therefore the answer is $x^2-\frac{x^6}{3!}+\frac{x^{10}}{5!}$.

      Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.

      Common trap: The first omitted term is not automatically an error bound. State the theorem's hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.

      Why the other choices fail: $x-\frac{x^3}{3!}+\frac{x^5}{5!}$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $x^2+\frac{x^4}{2!}+\frac{x^6}{3!}$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $1-x^2+\frac{x^4}{2!}$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.
  - id: compose-maclaurin-step-4
    title: State the convergence behavior
    instruction: 'The sine series converges for all real inputs. Composing with $x^2$ does not create a finite radius restriction.

      '
    type: multipleChoice
    issueSignals:
    - id: power-series-expansion-error
    - id: algebraic-simplification-error
    - id: power-rule-error
    - id: exponent-rule-misapplied
    - id: chain-rule-missed
    - id: function-composition-error
    prompt: For which $x$ does the series converge?
    choices:
    - id: a
      text: All real $x$
    - id: b
      text: Only $|x|<1$
    - id: c
      text: Only $x=0$
    - id: d
      text: Only $x>0$
    answer:
      choiceId: a
    explanation: |-
      Solution: The Maclaurin series for $\sin u$ has infinite radius of convergence, so $\sin(x^2)$ also has a series representation valid for every real $x$. Therefore the answer is All real $x$.

      Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.

      Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.

      Why the other choices fail: Only $|x|<1$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; Only $x=0$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; Only $x>0$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$.
- id: approximation-error-for-exponential
  title: Approximation Error for $e^x$
  problem: '![Taylor polynomials of increasing degree approximating e to the x near the center](/assessments/calc2-infinite-series/taylor-approximation-error.svg)


    Use the degree $3$ Maclaurin polynomial for $e^x$ to approximate $e^{0.2}$ and bound the error.

    '
  steps:
  - id: exponential-error-step-1
    title: Write the degree 3 polynomial
    instruction: |
      The Maclaurin series for $e^x$ is:

      $$
      e^x=\sum_{n=0}^{\infty}\frac{x^n}{n!}.
      $$

      The degree $3$ polynomial is:

      $$
      P_3(x)=1+x+\frac{x^2}{2!}+\frac{x^3}{3!}.
      $$
    type: numericResponse
    issueSignals:
    - id: power-series-expansion-error
    - id: algebraic-simplification-error
    - id: power-rule-error
    - id: exponent-rule-misapplied
    - id: chain-rule-missed
    - id: function-composition-error
    prompt: What is $P_3(0.2)$?
    answer:
      value: 1.2213333333
      tolerance: 0.000001
    explanation: |-
      Solution: Compute:

      $$
      1+0.2+\frac{0.2^2}{2}+\frac{0.2^3}{6}
      =
      1.2213333333\ldots
      $$

      Why it works: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$. Compute derivatives at the center, divide by $n!$, and preserve the power $(x-a)^n$ before analyzing convergence.

