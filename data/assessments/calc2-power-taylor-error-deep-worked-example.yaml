- id: interval-of-convergence-with-endpoints
  title: Radius and Interval of Convergence with Endpoint Tests
  problem: |
    Find the interval of convergence:

    $$
    \sum_{n=1}^{\infty}\frac{(x+2)^n}{n4^n}.
    $$
  steps:
  - id: power-interval-step-1
    title: Apply the ratio test to the variable part
    instruction: |
      Let

      $$
      a_n=\frac{(x+2)^n}{n4^n}.
      $$

      The ratio test gives:

      $$
      L=\lim_{n\to\infty}\left|\frac{a_{n+1}}{a_n}\right|.
      $$
    type: multipleChoice
    issueSignals:
    - id: power-series-expansion-error
    - id: algebraic-simplification-error
    - id: power-rule-error
    - id: exponent-rule-misapplied
    - id: chain-rule-missed
    - id: function-composition-error
    prompt: What does $L$ simplify to?
    choices:
    - id: a
      text: |-
        $\left|\frac{x+2}{4}\right|$
    - id: b
      text: |-
        $\left|\frac{4}{x+2}\right|$
    - id: c
      text: |-
        $\left|\frac{x+2}{n}\right|$
    - id: d
      text: $0$ for every $x$
    answer:
      choiceId: a
    explanation: |-
      Solution: The ratio becomes:

      $$
      \left|\frac{(x+2)^{n+1}}{(n+1)4^{n+1}}\cdot\frac{n4^n}{(x+2)^n}\right|
      =
      \left|\frac{x+2}{4}\cdot\frac{n}{n+1}\right|
      \to
      \left|\frac{x+2}{4}\right|.
      $$ Therefore the answer is $\left|\frac{x+2}{4}\right|$.

      Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.

      Common trap: The first omitted term is not automatically an error bound. State the theorem's hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.

      Why the other choices fail: $\left|\frac{4}{x+2}\right|$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $\left|\frac{x+2}{n}\right|$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $0$ for every $x$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.
  - id: power-interval-step-2
    title: Solve the inequality for the open interval
    instruction: |
      The ratio test requires:

      $$
      \left|\frac{x+2}{4}\right|<1.
      $$
    type: multipleChoice
    issueSignals:
    - id: power-series-expansion-error
    - id: algebraic-simplification-error
    - id: power-rule-error
    - id: exponent-rule-misapplied
    - id: chain-rule-missed
    - id: function-composition-error
    prompt: What is the open interval before endpoint testing?
    choices:
    - id: a
      text: $(-6,2)$
    - id: b
      text: $(-2,4)$
    - id: c
      text: $(-4,4)$
    - id: d
      text: |-
        $(-\infty,\infty)$
    answer:
      choiceId: a
    explanation: |-
      Solution: $\left|\frac{x+2}{4}\right|<1$ gives $|x+2|<4$, so $-6<x<2$. Therefore the answer is $(-6,2)$.

      Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.

      Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.

      Why the other choices fail: $(-2,4)$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; $(-4,4)$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; $(-\infty,\infty)$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$.
