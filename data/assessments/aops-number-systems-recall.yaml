- Recall closure and complex-number facts
items:
- id: set-nesting
  type: flashcard
  prompt: State the standard nesting from natural through complex numbers.
  answer:
    expected: Natural numbers are contained in integers, which are contained in rationals, reals, and then complex numbers.
    aliases: ['$\mathbb N\subset\mathbb Z\subset\mathbb Q\subset\mathbb R\subset\mathbb C$']
  explanation: Each set extends the earlier one.
  tags: [number-set-nesting]
- id: rational-definition
  type: flashcard
  prompt: State the exact definition of a rational number.
  answer:
    expected: A quotient p/q of integers with q nonzero.
  explanation: An approximate decimal is not the definition.
  tags: [rational-number]
- id: irrational-definition
  type: flashcard
  prompt: What is an irrational number?
  answer:
    expected: A real number that is not rational.
  explanation: It has no exact quotient-of-integers representation.
  tags: [irrational-number]
- id: terminating-denominator
  type: flashcard
  prompt: Which prime factors may occur in the reduced denominator of a terminating rational decimal?
  answer:
    expected: Only 2 and 5.
  explanation: A terminating decimal can be expressed over a power of ten.
  tags: [terminating-decimal]
- id: repeating-shift
  type: flashcard
  prompt: For a repeating block of length $k$, by what number is the decimal multiplied before subtraction?
  answer:
    expected: 10 to the kth power.
    aliases: ['$10^k$']
  explanation: This aligns one whole repeating block.
  tags: [repeating-decimal]
- id: lowest-terms-condition
  type: typed
  prompt: Complete the lowest-terms condition $\gcd(p,q)=$ ____.
  answer:
    expected: '1'
  explanation: Coprime numerator and denominator share no prime factor.
  tags: [lowest-terms]
- id: square-root-criterion
  type: flashcard
  prompt: For a positive integer $n$, when is $\sqrt n$ rational?
  answer:
    expected: Exactly when n is a perfect square.
  explanation: Squares have even exponents in prime factorization.
  tags: [irrationality]
- id: contradiction-target
  type: flashcard
  prompt: What contradiction closes the standard lowest-terms proof of square-root irrationality?
  answer:
    expected: The numerator and denominator are both forced to share a prime factor.
  explanation: That contradicts the coprime assumption.
  tags: [irrationality-proof]
- id: integer-closure
  type: flashcard
  prompt: Name two operations under which integers are closed.
  answer:
    expected: Addition and multiplication.
    aliases: [subtraction and multiplication, addition and subtraction]
  explanation: Integer division is not always an integer.
  tags: [closure]
- id: universal-disproof
  type: flashcard
  prompt: What is sufficient to disprove a universal closure claim?
  answer:
    expected: One valid counterexample.
  explanation: The case must satisfy the hypotheses and violate the conclusion.
  tags: [counterexample]
- id: imaginary-unit
  type: typed
  prompt: Complete $i^2=$ ____.
  answer:
    expected: '-1'
  explanation: This defines the imaginary unit.
  tags: [imaginary-unit]
- id: conjugate-product
  type: flashcard
  prompt: What is $(a+bi)(a-bi)$ for real $a,b$?
  answer:
    expected: a squared plus b squared.
    aliases: ['$a^2+b^2$']
  explanation: The imaginary cross terms cancel and $-b^2i^2=+b^2$.
  tags: [complex-conjugate]
