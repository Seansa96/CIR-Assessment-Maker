workedExamples:
- id: aops-angle-chasing-circle-mixed-worked-example-problem-1
  title: Central to inscribed
  problem: "Central angle $\angle AOB=104^\\circ$. Point $C$ lies on the opposite arc. Find inscribed angle $\angle ACB$."
  steps:
  - id: aops-angle-chasing-circle-mixed-worked-example-p1-s1
    title: Identify the shared arc
    instruction: Both angles intercept minor arc $AB$.
    type: multipleChoice
    prompt: What is arc $AB$?
    choices:
    - id: a
      text: $104^\circ$
    - id: b
      text: $52^\circ$
    - id: c
      text: $208^\circ$
    - id: d
      text: $256^\circ$
    answer:
      choiceId: a
    explanation: The central angle equals its arc.
    media:
    - type: image
      src: /assessments/aops/aops-angle-circle.svg
      alt: Central angle 104 degrees and inscribed target x intercepting the same arc AB.
      caption: Use only the labels and markings stated in the problem.
  - id: aops-angle-chasing-circle-mixed-worked-example-p1-s2
    title: Classify the target
    instruction: The vertex C lies on the circle.
    type: multipleChoice
    prompt: What kind of angle is ACB?
    choices:
    - id: a
      text: inscribed
    - id: b
      text: central
    - id: c
      text: exterior
    - id: d
      text: reflex
    answer:
      choiceId: a
    explanation: Its vertex is on the circumference and sides are chords.
  - id: aops-angle-chasing-circle-mixed-worked-example-p1-s3
    title: Apply the half-arc rule
    instruction: An inscribed angle is half its intercepted arc.
    type: multipleChoice
    prompt: Which expression gives the target?
    choices:
    - id: a
      text: $104/2$
    - id: b
      text: $2(104)$
    - id: c
      text: $360-104$
    - id: d
      text: $180-104/2$
    answer:
      choiceId: a
    explanation: Use half the shared arc.
  - id: aops-angle-chasing-circle-mixed-worked-example-p1-s4
    title: Calculate
    instruction: Divide by two.
    type: multipleChoice
    prompt: "What is $\angle ACB$?"
    choices:
    - id: a
      text: $52^\circ$
    - id: b
      text: $104^\circ$
    - id: c
      text: $156^\circ$
    - id: d
      text: $208^\circ$
    answer:
      choiceId: a
    explanation: $104/2=52$.
  - id: aops-angle-chasing-circle-mixed-worked-example-p1-s5
    title: Check
    instruction: The inscribed angle must be half the central angle.
    type: multipleChoice
    prompt: Which relation verifies it?
    choices:
    - id: a
      text: $2(52)=104$
    - id: b
      text: $52+104=180$
    - id: c
      text: $104-52=104$
    - id: d
      text: $52=104$
    answer:
      choiceId: a
    explanation: Doubling the result recovers the central angle.
- id: aops-angle-chasing-circle-mixed-worked-example-problem-2
  title: Cyclic quadrilateral converse
  problem: "In quadrilateral $ABCD$, $\angle A=73^\\circ$ and $\angle C=107^\\circ$. Prove that $A,B,C,D$ are concyclic."
  steps:
  - id: aops-angle-chasing-circle-mixed-worked-example-p2-s1
    title: Identify the target theorem
    instruction: A converse can establish concyclicity from opposite angles.
    type: multipleChoice
    prompt: What must be shown?
    choices:
    - id: a
      text: "$\angle A+\angle C=180^\\circ$"
    - id: b
      text: "$\angle A=\angle C$"
    - id: c
      text: $AB=CD$
    - id: d
      text: $AB\parallel CD$
    answer:
      choiceId: a
    explanation: Supplementary opposite angles imply a cyclic quadrilateral.
    media:
    - type: image
      src: /assessments/aops/aops-angle-cyclic-tangent.svg
      alt: Four points on a circle illustrating a cyclic quadrilateral; proof uses the given opposite angles.
      caption: Use only the labels and markings stated in the problem.
  - id: aops-angle-chasing-circle-mixed-worked-example-p2-s2
    title: Substitute
    instruction: Use the two given angle measures.
    type: multipleChoice
    prompt: What sum is obtained?
    choices:
    - id: a
      text: $73+107=180$
    - id: b
      text: $73+107=170$
    - id: c
      text: $107-73=180$
    - id: d
      text: $2(73)=107$
    answer:
      choiceId: a
    explanation: The given values are supplementary.
  - id: aops-angle-chasing-circle-mixed-worked-example-p2-s3
    title: Check opposition
    instruction: Angles A and C are at opposite vertices.
    type: multipleChoice
    prompt: Why does adjacency matter?
    choices:
    - id: a
      text: The converse requires an opposite pair.
    - id: b
      text: Any two angles suffice.
    - id: c
      text: Only equal angles suffice.
    - id: d
      text: It does not matter.
    answer:
      choiceId: a
    explanation: Supplementary adjacent angles occur in many noncyclic quadrilaterals.
  - id: aops-angle-chasing-circle-mixed-worked-example-p2-s4
    title: Invoke the converse
    instruction: State the theorem after its condition is verified.
    type: multipleChoice
    prompt: What conclusion follows?
    choices:
    - id: a
      text: $A,B,C,D$ are concyclic.
    - id: b
      text: $ABCD$ is a square.
    - id: c
      text: $AC$ is a diameter.
    - id: d
      text: $AB=BC$.
    answer:
      choiceId: a
    explanation: The cyclic-quadrilateral converse gives exactly concyclicity.
  - id: aops-angle-chasing-circle-mixed-worked-example-p2-s5
    title: Close the proof
    instruction: Connect the conclusion to the target without adding visual assumptions.
    type: multipleChoice
    prompt: Which final sentence is valid?
    choices:
    - id: a
      text: Therefore one circle passes through all four vertices.
    - id: b
      text: Therefore every side is equal.
    - id: c
      text: Therefore the diagonals are perpendicular.
    - id: d
      text: Therefore the drawing is to scale.
    answer:
      choiceId: a
    explanation: Concyclic means lying on one circle.
- id: aops-angle-chasing-circle-mixed-worked-example-problem-3
  title: Tangent, chord, and arc transfer
  problem: "A tangent at $A$ forms angle $y$ with chord $AB$. Inscribed angle $\angle ADB=38^\\circ$ intercepts chord $AB$. Find $y$ and minor arc $AB$."
  steps:
  - id: aops-angle-chasing-circle-mixed-worked-example-p3-s1
    title: Match the chord
    instruction: The tangent-chord angle and ADB both correspond to chord AB.
    type: multipleChoice
    prompt: Which theorem finds $y$?
    choices:
    - id: a
      text: tangent-chord theorem
    - id: b
      text: linear-pair theorem
    - id: c
      text: triangle inequality
    - id: d
      text: parallel-lines converse
    answer:
      choiceId: a
    explanation: The theorem equates the two angles intercepting the same chord.
    media:
    - type: image
      src: /assessments/aops/aops-angle-cyclic-tangent.svg
      alt: Tangent at A and inscribed angle ADB of 38 degrees both associated with chord AB.
      caption: Use only the labels and markings stated in the problem.
  - id: aops-angle-chasing-circle-mixed-worked-example-p3-s2
    title: Find the tangent angle
    instruction: Transfer the inscribed angle measure.
    type: multipleChoice
    prompt: What is $y$?
    choices:
    - id: a
      text: $38^\circ$
    - id: b
      text: $52^\circ$
    - id: c
      text: $76^\circ$
    - id: d
      text: $142^\circ$
    answer:
      choiceId: a
    explanation: "$y=\angle ADB=38^\\circ$."
  - id: aops-angle-chasing-circle-mixed-worked-example-p3-s3
    title: Convert to an arc
    instruction: An inscribed angle is half its intercepted arc.
    type: multipleChoice
    prompt: Which equation gives arc $AB$?
    choices:
    - id: a
      text: $m\widehat{AB}=2(38)$
    - id: b
      text: $m\widehat{AB}=38/2$
    - id: c
      text: $m\widehat{AB}=180-38$
    - id: d
      text: $m\widehat{AB}=360-38$
    answer:
      choiceId: a
    explanation: Double the inscribed angle.
  - id: aops-angle-chasing-circle-mixed-worked-example-p3-s4
    title: Calculate the arc
    instruction: Evaluate the doubled measure.
    type: multipleChoice
    prompt: What is minor arc $AB$?
    choices:
    - id: a
      text: $76^\circ$
    - id: b
      text: $38^\circ$
    - id: c
      text: $142^\circ$
    - id: d
      text: $322^\circ$
    answer:
      choiceId: a
    explanation: $2\cdot38=76$.
  - id: aops-angle-chasing-circle-mixed-worked-example-p3-s5
    title: Audit conditions
    instruction: Check the vertex and tangency hypotheses.
    type: multipleChoice
    prompt: Which facts were essential?
    choices:
    - id: a
      text: D lies on the circle and the line at A is tangent.
    - id: b
      text: The picture is symmetric.
    - id: c
      text: AB is a diameter.
    - id: d
      text: AD is parallel to the tangent.
    answer:
      choiceId: a
    explanation: Those locations activate the two circle-angle theorems.
