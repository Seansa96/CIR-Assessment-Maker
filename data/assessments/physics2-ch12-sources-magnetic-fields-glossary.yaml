      term: Biot-Savart Law
      definition: An equation describing the magnetic field generated by a constant electric current.
      drills:
      - id: t1-drill
        type: flashcard
        prompt: What does Biot-Savart Law mean?
        answer:
          expected: An equation describing the magnetic field generated by a constant electric current.
