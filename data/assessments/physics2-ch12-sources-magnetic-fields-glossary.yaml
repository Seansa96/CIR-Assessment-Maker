topicId: physics2-sources-magnetic-fields
glossary:
  introduction: Core terms for sources of magnetic fields.
  sections:
  - id: terms
    title: Core terms
    required: true
    content: Definitions of laws and materials.
    entries:
    - id: t1
      term: Biot-Savart Law
      definition: An equation describing the magnetic field generated by a constant
        electric current.
    - id: t2
      term: Ampere's Law
      definition: Relates the integrated magnetic field around a closed loop to the
        electric current passing through the loop.
    - id: t3
      term: Permeability of Free Space
      definition: A physical constant ($\mu_0$) that is a measure of the amount of
        resistance encountered when forming a magnetic field in a classical vacuum.
