    - id: t2
      term: Ampere's Law
      definition: Relates the integrated magnetic field around a closed loop to the electric current passing
        through the loop.
      drills:
      - id: t2-drill
        type: flashcard
        prompt: What does Ampere's Law mean?
        answer:
          expected: Relates the integrated magnetic field around a closed loop to the electric current
            passing through the loop.
        explanation: 'Solution:


          Relates the integrated magnetic field around a closed loop to the electric current passing through
          the loop.


          Why it works:


          This definition identifies the essential meaning of Ampere''s Law.'
