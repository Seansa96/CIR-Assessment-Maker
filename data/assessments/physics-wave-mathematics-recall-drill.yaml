items:
- {id: wm-r1, type: cloze, prompt: 'A positive-x wave can be $y=A\sin({{kx-\omega t+\phi}})$.', answer: {expected: 'kx-\omega t+\phi'}, explanation: 'Solution: Use $kx-\omega t+\phi$. Why it works: the negative time term gives positive-x phase propagation.'}
- {id: wm-r2, type: typed, prompt: 'What is the relation between wave number and wavelength?', answer: {expected: 'k=2pi/lambda'}, explanation: 'Solution: Use $k=2\pi/\lambda$. Why it works: one spatial cycle accumulates $2\pi$ radians of phase.'}
- {id: wm-r3, type: cloze, prompt: 'Wave speed is $v={{\omega/k}}$.', answer: {expected: '\omega/k'}, explanation: 'Solution: Use $v=\omega/k$. Why it works: a constant phase has $kx-\omega t=\text{constant}$.'}
- {id: wm-r4, type: typed, prompt: 'What is the transverse particle velocity of y=A sin(kx-omega t+phi)?', answer: {expected: '-omega A cos(kx-omega t+phi)'}, explanation: 'Solution: Differentiate with respect to time. Why it works: the time derivative of the phase contributes negative omega.'}
- {id: wm-r5, type: cloze, prompt: 'Particle acceleration is $a_y={{-\omega^2y}}$.', answer: {expected: '-\omega^2y'}, explanation: 'Solution: Use $a_y=-\omega^2y$. Why it works: the second time derivative of a sinusoid reverses its sign.'}
- {id: wm-r6, type: typed, prompt: 'Does transverse particle speed equal wave propagation speed in general?', answer: {expected: no}, explanation: 'Solution: No. Why it works: one describes medium motion while the other describes phase travel.'}
