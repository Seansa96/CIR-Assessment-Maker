workedExamples:
- id: we001
  title: Car on an Unbanked Curve
  problem: 'A 1200 kg car rounds a flat, unbanked curve with a radius of 50 m. The
    coefficient of static friction between the tires and the road is $\mu_s = 0.8$.


    What is the maximum speed the car can travel without skidding off the road? (Take
    $g = 9.8$ m/s²).

    '
  steps:
  - id: step-we001-1
    title: Identify the force providing the centripetal acceleration.
    instruction: 'Since the road is flat, the normal force and gravity act vertically
      and cancel each other out. The only\rhorizontal force is static friction, which
      points toward the center of the curve to keep the car turning.


      Therefore, static friction provides the centripetal force:

      $$ f_s = m \frac{v^2}{r} $$

      '
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
  - id: step-we001-2
    title: Set up the maximum static friction condition.
    instruction: 'To find the maximum speed $v_{\max}$, we need the maximum possible
      static friction force:

      $$ f_{s, \max} = \mu_s N $$

      Since $N = mg$ on a flat surface:

      $$ f_{s, \max} = \mu_s mg $$

      '
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
  - id: step-we001-3
    title: Equate and solve for $v_{\max}$.
    instruction: 'Set the maximum friction equal to the required centripetal force:

      $$ \mu_s mg = m \frac{v_{\max}^2}{r} $$

      Notice that the mass $m$ cancels out!

      $$ \mu_s g = \frac{v_{\max}^2}{r} $$

      $$ v_{\max} = \sqrt{\mu_s g r} $$


      Substitute the given values:

      $$ v_{\max} = \sqrt{0.8 \times 9.8 \times 50} = \sqrt{392} \a\approx 19.8 \text{
      m/s} $$


      The maximum safe speed is about 19.8 m/s.

      '
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
