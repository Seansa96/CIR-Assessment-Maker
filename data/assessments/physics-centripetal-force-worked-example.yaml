      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: At the threshold, $f_{s,max}=\mu_sN=\mu_smg$.\n\nWhy it works: Static friction cannot exceed its coefficient-times-normal-force limit.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: step-we001-3
    title: Equate and solve for $v_{\max}$.
    instruction: >
      Set the maximum friction equal to the required centripetal force:

      $$ \mu_s mg = m \frac{v_{\max}^2}{r} $$

      Notice that the mass $m$ cancels out!

      $$ \mu_s g = \frac{v_{\max}^2}{r} $$

      $$ v_{\max} = \sqrt{\mu_s g r} $$


      Substitute the given values:

      $$ v_{\max} = \sqrt{0.8 \times 9.8 \times 50} = \sqrt{392} \a\approx 19.8 \text{ m/s} $$


      The maximum safe speed is about 19.8 m/s.
