- id: we001
  title: Car on an Unbanked Curve
  problem: >
    A 1200 kg car rounds a flat, unbanked curve with a radius of 50 m. The coefficient of static friction between the tires and the road is $\mu_s = 0.8$.


    What is the maximum speed the car can travel without skidding off the road? (Take $g = 9.8$ m/s²).

    ![Top-down flat curve diagram showing static friction pointing toward the center of the circular path](/media/physics/worked-examples/centripetal-flat-curve-friction.svg)
  steps:
  - id: step-we001-1
    title: Identify the force providing the centripetal acceleration.
    instruction: >
      Since the road is flat, the normal force and gravity act vertically and cancel each other out. The only\rhorizontal force is static friction, which points toward the center of the curve to keep the car turning.


      Therefore, static friction provides the centripetal force:

      $$ f_s = m \frac{v^2}{r} $$
    hint: 
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: Static friction is the horizontal inward force, so $f_s=mv^2/r$.\n\nWhy it works: On a flat road, weight and normal cancel vertically; friction supplies the radial net force.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: step-we001-2
    title: Set up the maximum static friction condition.
    instruction: >
      To find the maximum speed $v_{\max}$, we need the maximum possible static friction force:

      $$ f_{s, \max} = \mu_s N $$

      Since $N = mg$ on a flat surface:

      $$ f_{s, \max} = \mu_s mg $$
    hint: 
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
