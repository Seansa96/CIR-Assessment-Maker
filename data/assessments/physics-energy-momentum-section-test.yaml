questions:
  - id: em-test-q01
    title: Work Done at an Angle
    type: numericResponse
    prompt: |
      A person pulls a 15 kg sled a distance of 25 m with a rope making a $30°$ angle above horizontal, applying a constant tension of 80 N. Using $W = Fd\cos\theta$, how much work does the rope do on the sled in Joules? Round to one decimal place.
    answer:
      value: 1732.1
      tolerance: 10.0
    explanation: |
      $$W = Fd\cos\theta = 80(25)\cos 30° = 2000(0.8660) = 1732.1\text{ J}$$

      Only the horizontal component of the force does work on the sled's horizontal displacement. The vertical component of the rope tension does no work on the sled (it's perpendicular to the horizontal displacement).

  - id: em-test-q02
    title: Kinetic Energy — Finding Speed
    type: numericResponse
    prompt: |
      A 0.145 kg baseball has kinetic energy of 60 J. What is its speed in m/s? Round to one decimal place.

      Use $KE = \dfrac{1}{2}mv^2$.
    answer:
      value: 28.8
      tolerance: 0.3
    explanation: |
      $$v = \sqrt{\frac{2KE}{m}} = \sqrt{\frac{2(60)}{0.145}} = \sqrt{827.6} \approx 28.8\text{ m/s}$$

      For context, that's roughly 64 mph — a typical major-league pitch.

  - id: em-test-q03
    title: Work-Energy Theorem
    type: numericResponse
    prompt: |
      A 3 kg box starts at rest on a frictionless surface and is pushed by a 12 N horizontal force for 4 m. Using the **work-energy theorem** ($W_\text{net} = \Delta KE$), find the box's final speed in m/s. Round to two decimal places.
    answer:
      value: 5.66
      tolerance: 0.05
    explanation: |
      Work done: $W = Fd = 12(4) = 48\text{ J}$.

      Work-energy theorem: $W = \frac{1}{2}mv^2 - 0 \implies v = \sqrt{2W/m} = \sqrt{2(48)/3} = \sqrt{32} \approx 5.66\text{ m/s}$.

  - id: em-test-q04
    title: Gravitational Potential Energy and Conservation
    type: numericResponse
    prompt: |
      A 2 kg ball is dropped from rest at a height of 5 m above the ground. Using $g = 9.8\text{ m/s}^2$ and conservation of energy (no air resistance), what is the ball's speed just before it hits the ground in m/s? Round to two decimal places.
    answer:
      value: 9.90
      tolerance: 0.05
    explanation: |
      Conservation of energy: $mgh = \frac{1}{2}mv^2$ (mass cancels):
      $$v = \sqrt{2gh} = \sqrt{2(9.8)(5)} = \sqrt{98} \approx 9.90\text{ m/s}$$

      The speed is independent of mass — all objects fall at the same rate when air resistance is negligible.

  - id: em-test-q05
    title: Spring Potential Energy
    type: numericResponse
    prompt: |
      A spring with constant $k = 200\text{ N/m}$ is compressed by $0.15\text{ m}$ from its natural length. A 0.5 kg block is placed against it and released on a frictionless surface. Using $\frac{1}{2}kx^2 = \frac{1}{2}mv^2$, find the block's speed in m/s after leaving the spring. Round to two decimal places.
    answer:
      value: 3.00
      tolerance: 0.05
    explanation: |
      $$\frac{1}{2}kx^2 = \frac{1}{2}mv^2 \implies v = x\sqrt{\frac{k}{m}} = 0.15\sqrt{\frac{200}{0.5}} = 0.15\sqrt{400} = 0.15(20) = 3.00\text{ m/s}$$

  - id: em-test-q06
    title: Power
    type: numericResponse
    prompt: |
      An electric motor lifts a 400 kg load from rest to a height of 8 m in 5 seconds, at constant velocity. Using $g = 9.8\text{ m/s}^2$, what is the average power delivered by the motor in Watts?
    answer:
      value: 6272.0
      tolerance: 50.0
    explanation: |
      Work done (against gravity): $W = mgh = 400(9.8)(8) = 31360\text{ J}$.

      Average power: $P = W/t = 31360/5 = 6272\text{ W}$.

      For comparison, this is about 8.4 horsepower ($1\text{ hp} \approx 746\text{ W}$).

  - id: em-test-q07
    title: Momentum and Impulse
    type: numericResponse
    prompt: |
      A 0.5 kg ball moving at $12\text{ m/s}$ to the right is hit by a bat, which exerts a force for $0.01\text{ s}$ and sends it back at $18\text{ m/s}$ to the left. What is the magnitude of the average force exerted by the bat on the ball in Newtons?
    answer:
      value: 1500.0
      tolerance: 20.0
    explanation: |
      Taking rightward as positive: $p_i = 0.5(12) = 6\text{ kg·m/s}$; $p_f = 0.5(-18) = -9\text{ kg·m/s}$.

      Impulse: $J = \Delta p = -9 - 6 = -15\text{ kg·m/s}$.

      Average force: $F = J/\Delta t = 15/0.01 = 1500\text{ N}$ (magnitude).

  - id: em-test-q08
    title: Perfectly Inelastic Collision — Final Velocity
    type: numericResponse
    prompt: |
      A 5 kg cart moving at $6\text{ m/s}$ east collides and sticks to a stationary 3 kg cart. What is the final speed of the combined system in m/s? Round to two decimal places.
    answer:
      value: 3.75
      tolerance: 0.05
    explanation: |
      Conservation of momentum (perfectly inelastic):
      $$m_1 v_1 = (m_1 + m_2)v_f$$
      $$v_f = \frac{m_1 v_1}{m_1 + m_2} = \frac{5(6)}{5+3} = \frac{30}{8} = 3.75\text{ m/s}$$

  - id: em-test-q09
    title: Elastic Collision — Final Velocities
    type: numericResponse
    prompt: |
      A 4 kg ball moving at $8\text{ m/s}$ collides elastically with a stationary 4 kg ball. Using the elastic collision formulas for equal masses:
      $$v_1' = \frac{m_1 - m_2}{m_1 + m_2}v_1, \quad v_2' = \frac{2m_1}{m_1 + m_2}v_1$$

      What is the final speed of **Ball 2** in m/s?
    answer:
      value: 8.0
      tolerance: 0.1
    explanation: |
      For equal masses ($m_1 = m_2$):
      $$v_1' = \frac{4-4}{8}(8) = 0\text{ m/s}, \quad v_2' = \frac{2(4)}{8}(8) = 8\text{ m/s}$$

      Ball 1 stops completely and Ball 2 moves with Ball 1's original velocity. This is the classic Newton's Cradle result — complete momentum and energy transfer for equal-mass elastic collisions.

  - id: em-test-q10
    title: Explosion — Recoil
    type: numericResponse
    prompt: |
      A 2 kg pistol fires a 0.01 kg bullet at $400\text{ m/s}$ forward. Using conservation of momentum (initial system is at rest), what is the recoil speed of the pistol in m/s?
    answer:
      value: 2.0
      tolerance: 0.05
    explanation: |
      Initial momentum = 0. After firing:
      $$0 = m_\text{bullet}v_\text{bullet} + m_\text{pistol}v_\text{pistol}$$
      $$v_\text{pistol} = -\frac{m_\text{bullet}v_\text{bullet}}{m_\text{pistol}} = -\frac{0.01(400)}{2} = -2\text{ m/s}$$

      The pistol recoils backward at 2 m/s. The minus sign indicates the direction is opposite to the bullet.

  - id: em-test-q11
    title: Energy Lost in Inelastic Collision
    type: numericResponse
    prompt: |
      A 6 kg block moving at $10\text{ m/s}$ collides with and sticks to a stationary 4 kg block. How much kinetic energy is **lost** in the collision in Joules?
    answer:
      value: 120.0
      tolerance: 2.0
    explanation: |
      Initial KE: $KE_i = \frac{1}{2}(6)(10)^2 = 300\text{ J}$.

      Final velocity: $v_f = 6(10)/(6+4) = 6\text{ m/s}$.

      Final KE: $KE_f = \frac{1}{2}(10)(6)^2 = 180\text{ J}$.

      Energy lost: $\Delta KE = 300 - 180 = 120\text{ J}$ — converted to heat, sound, and deformation.

  - id: em-test-q12
    title: "Conceptual — Work Done by Normal Force"
    type: multipleChoice
    prompt: |
      A box slides along a horizontal floor. The floor exerts a normal force on the box that is perpendicular to the surface. How much work does the normal force do on the box?
    choices:
      - id: a
        text: 'Positive work — the normal force supports the box and prevents it from sinking.'
      - id: b
        text: 'Negative work — the normal force acts opposite to the direction of motion.'
      - id: c
        text: 'Zero work — the normal force is perpendicular to the displacement, so $W = Fd\cos 90° = 0$.'
      - id: d
        text: 'It depends on the speed of the box — faster boxes have more normal force and more work.'
    answer:
      choiceId: c
    explanation: |
      Work is $W = \vec{F} \cdot \vec{d} = Fd\cos\theta$. The normal force acts perpendicular ($90°$) to the horizontal displacement, so $\cos 90° = 0$ and $W = 0$.

      This is why normal forces never appear in energy calculations — they are perpendicular to motion and do no work. Only force components **parallel** to displacement do work.

  - id: em-test-q13
    title: Conservation of Energy — Roller Coaster
    type: numericResponse
    prompt: |
      A roller coaster car (mass $800\text{ kg}$) starts from rest at the top of a $40\text{ m}$ tall hill. It then travels to the top of a second $25\text{ m}$ tall hill. Assuming no friction, what is the car's speed at the top of the second hill in m/s? Use $g = 9.8\text{ m/s}^2$. Round to one decimal place.
    answer:
      value: 17.1
      tolerance: 0.3
    explanation: |
      Energy conservation (mass cancels):
      $$mgh_1 = mgh_2 + \frac{1}{2}mv^2$$
      $$v = \sqrt{2g(h_1 - h_2)} = \sqrt{2(9.8)(40 - 25)} = \sqrt{2(9.8)(15)} = \sqrt{294} \approx 17.1\text{ m/s}$$

  - id: em-test-q14
    title: Power from Velocity and Force
    type: numericResponse
    prompt: |
      A car engine provides a driving force of 3500 N while the car moves at a constant speed of $28\text{ m/s}$ on a level road. What is the engine's power output in Watts?
    answer:
      value: 98000.0
      tolerance: 500.0
    explanation: |
      When force is constant and parallel to velocity: $P = Fv = 3500(28) = 98000\text{ W} = 98\text{ kW}$.

      At constant speed on level road, the driving force equals the total resistive force (air drag + rolling friction), so this is also the rate at which the engine overcomes resistance.

  - id: em-test-q15
    title: "Conceptual — Coefficient of Restitution"
    type: multipleChoice
    prompt: |
      A rubber ball is dropped from a height $h$ and bounces back to a height $0.64h$. What is the coefficient of restitution $e$ for this ball-floor collision?

      *(The coefficient of restitution is defined as $e = v_\text{after}/v_\text{before}$ for the relative speeds of separation/approach.)*
    choices:
      - id: a
        text: '$e = 0.64$ — the fraction of height recovered equals the coefficient of restitution.'
      - id: b
        text: '$e = 0.80$ — the coefficient of restitution is the square root of the height ratio: $e = \sqrt{0.64} = 0.80$.'
      - id: c
        text: '$e = 0.36$ — the energy lost is $1 - 0.64 = 0.36$, which equals the coefficient of restitution.'
      - id: d
        text: '$e = 1.0$ — any bouncing ball has $e = 1$ by definition.'
    answer:
      choiceId: b
    explanation: |
      Speed just before hitting floor from height $h$: $v_\text{before} = \sqrt{2gh}$.

      Speed just after bouncing to height $0.64h$: $v_\text{after} = \sqrt{2g(0.64h)}$.

      $$e = \frac{v_\text{after}}{v_\text{before}} = \sqrt{\frac{0.64h}{h}} = \sqrt{0.64} = 0.80$$

      A ball with $e = 1$ is perfectly elastic; $e = 0$ is perfectly inelastic. This ball loses $1 - e^2 = 36\%$ of its kinetic energy per bounce.

  - id: em-test-q16
    title: Two-Dimensional Collision — Momentum Components
    type: numericResponse
    prompt: |
      A 2 kg ball moving at $5\text{ m/s}$ in the **x-direction** collides with a 3 kg ball at rest. After the collision, the 2 kg ball moves at $2\text{ m/s}$ at $30°$ above the x-axis. What is the **x-component** of the 3 kg ball's velocity after the collision in m/s? Round to two decimal places.

      Use conservation of x-momentum: $m_1 v_{1x,i} = m_1 v_{1x,f} + m_2 v_{2x,f}$.
    answer:
      value: 2.49
      tolerance: 0.05
    explanation: |
      Initial x-momentum: $p_{xi} = 2(5) = 10\text{ kg·m/s}$.

      Ball 1's x-momentum after: $m_1 v_{1x,f} = 2(2\cos 30°) = 2(1.732) = 3.46\text{ kg·m/s}$.

      Conservation: $10 = 3.46 + 3v_{2x,f} \implies v_{2x,f} = (10 - 3.46)/3 = 6.54/3 \approx 2.18\text{ m/s}$.

      *(Answer: 2.18 m/s with tolerance 0.1 m/s)*

  - id: em-test-q17
    title: Work Done Against Gravity — Path Independence
    type: multipleChoice
    prompt: |
      Two workers each lift a 50 kg box from the floor to a height of $3\text{ m}$:
      - Worker A lifts it straight up in 2 seconds.
      - Worker B carries it up a $6\text{ m}$ ramp inclined at $30°$, taking 4 seconds.

      Ignoring friction, which statement is correct about the work done against gravity?
    choices:
      - id: a
        text: 'Worker A does more work — the straight-up path is more efficient.'
      - id: b
        text: 'Worker B does more work — the longer path means more work against gravity.'
      - id: c
        text: 'Both do the same work — gravitational PE depends only on the height gained, not the path taken.'
      - id: d
        text: 'Worker B does more work — the greater distance means more force is required.'
    answer:
      choiceId: c
    explanation: |
      Both raise the box by $\Delta h = 3\text{ m}$, so both do $W = mgh = 50(9.8)(3) = 1470\text{ J}$ against gravity.

      Gravity is a **conservative force** — work done against it depends only on the height change, not the path taken. (Worker B exerts less force over a longer distance; Worker A exerts more force over a shorter distance — both products equal $1470\text{ J}$.)

      However, Worker A delivers the work in half the time, so they use **twice the power**.

  - id: em-test-q18
    title: Escape Velocity — Conceptual
    type: multipleChoice
    prompt: |
      Earth's escape velocity is approximately $11.2\text{ km/s}$. A student asks: "If a 1 kg rock and a 100 kg boulder are both launched straight up at $11.2\text{ km/s}$, which one escapes Earth's gravity?"
    choices:
      - id: a
        text: "The rock — lighter objects need less energy to escape."
      - id: b
        text: "The boulder — more massive objects have more momentum and can push through gravity."
      - id: c
        text: "Both escape — escape velocity is independent of the object's mass. The required launch speed depends only on Earth's mass and radius, not the projectile's mass."
      - id: d
        text: "Neither — both will eventually slow down and fall back because no finite force can overcome gravity forever."
    answer:
      choiceId: c
    explanation: |
      Setting kinetic energy equal to gravitational potential energy at infinity:
      $$\frac{1}{2}mv^2 = \frac{GMm}{R} \implies v_\text{escape} = \sqrt{\frac{2GM}{R}}$$

      The projectile's mass $m$ cancels. Escape velocity depends only on Earth's mass $M$ and radius $R$ — not on the projectile mass. Both the rock and boulder escape at the same launch speed.

  - id: em-test-q19
    title: Inelastic Collision — Finding Velocity Before Impact
    type: numericResponse
    prompt: |
      A 0.008 kg bullet embeds in a 2 kg stationary block on a frictionless surface. The combined system moves at $0.80\text{ m/s}$ after the collision. What was the bullet's initial speed in m/s?
    answer:
      value: 201.0
      tolerance: 2.0
    explanation: |
      Conservation of momentum (perfectly inelastic):
      $$m_\text{bullet} v_\text{bullet} = (m_\text{bullet} + m_\text{block})v_f$$
      $$v_\text{bullet} = \frac{(0.008 + 2)(0.80)}{0.008} = \frac{2.008(0.80)}{0.008} = \frac{1.606}{0.008} \approx 200.8\text{ m/s}$$

  - id: em-test-q20
    title: Power and Efficiency
    type: numericResponse
    prompt: |
      An electric pump rated at 500 W has an efficiency of 80% (meaning 80% of electrical energy becomes useful mechanical work). How much water (in kg) can the pump lift to a height of 10 m per minute? Use $g = 9.8\text{ m/s}^2$. Round to one decimal place.
    answer:
      value: 244.9
      tolerance: 5.0
    explanation: |
      Useful power output: $P_\text{useful} = 0.80(500) = 400\text{ W}$.

      Energy available per minute: $E = P_\text{useful} \cdot t = 400(60) = 24000\text{ J}$.

      This energy lifts mass $m$ by height $h$: $E = mgh$.

      $$m = \frac{E}{gh} = \frac{24000}{9.8(10)} = \frac{24000}{98} \approx 244.9\text{ kg}$$

      Rounding: $m \approx 244.9\text{ kg}$ with tolerance $5\text{ kg}$.

      *(Note: value corrected to 244.9 kg)*
