lesson:
  introduction: Learn to solve What Numbers Really Are problems by recognizing integers, rationals, irrationals, complex numbers, lowest terms and justifying each theorem or transformation.
  sections:
  - id: aops-number-systems-motivation
    title: What the topic helps you notice
    required: true
    content: What Numbers Really Are is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are integers, rationals, irrationals, complex numbers, lowest terms.
    check:
      id: aops-number-systems-motivation-check
      type: multipleChoice
      prompt: In What Numbers Really Are, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-number-systems-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-number-systems-definitions-check
      type: multipleChoice
      prompt: In What Numbers Really Are, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-number-systems-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: classify number sets, prove irrationality by contradiction, respect closure properties. Record the givens, unknown, and any restriction before selecting a method.'
    check:
      id: aops-number-systems-recognition-check
      type: multipleChoice
      prompt: In What Numbers Really Are, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-number-systems-method
    title: Choose a method
    required: true
    content: Choose the shortest valid route from the givens to the target. Explain why the condition for the chosen method is satisfied.
    check:
      id: aops-number-systems-method-check
      type: multipleChoice
      prompt: In What Numbers Really Are, what should be checked before applying a method?
