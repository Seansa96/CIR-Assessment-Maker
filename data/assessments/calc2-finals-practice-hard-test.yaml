- id: q016
  title: Area with dy Differential
  type: freeResponse
  skills:
  - geom-applications-comprehensive
  prompt: 'Find the exact area of the region enclosed by $x = 2y^2$ and $x = 4 + y^2$.

    '
  answer:
    gradingMode: selfCheck
    keyPoints:
    - |-
      1. Intersections: $2y^2 = 4 + y^2 \implies y^2 = 4 \implies y = \pm 2$.
      2. The rightmost curve is $x = 4 + y^2$. The leftmost curve is $x = 2y^2$.
      3. $A = \int_{-2}^2 (4 + y^2 - 2y^2) \, dy = \int_{-2}^2 (4 - y^2) \, dy$.
      4. $A = \left[ 4y - \frac{1}{3}y^3 \right]_{-2}^2 = \left(8 - \frac{8}{3}\right) - \left(-8 + \frac{8}{3}\right) = 16 - \frac{16}{3} = \frac{32}{3}$.
  explanation: |-
    1. Intersections: $2y^2 = 4 + y^2 \implies y^2 = 4 \implies y = \pm 2$.
    2. The rightmost curve is $x = 4 + y^2$. The leftmost curve is $x = 2y^2$.
    3. $A = \int_{-2}^2 (4 + y^2 - 2y^2) \, dy = \int_{-2}^2 (4 - y^2) \, dy$.
    4. $A = \left[ 4y - \frac{1}{3}y^3 \right]_{-2}^2 = \left(8 - \frac{8}{3}\right) - \left(-8 + \frac{8}{3}\right) = 16 - \frac{16}{3} = \frac{32}{3}$.
  difficultyDimensions: *id001
  difficultyEvidence: The problem requires selecting a representation, carrying out the governing calculus method, and checking the condition that makes the result valid.
  prerequisiteObjectiveIds:
  - calc2-obj-finals-integration-and-applications
- id: q017
  title: Area Integral Setup (dx vs dy)
  type: freeResponse
  skills:
  - geom-applications-comprehensive
  prompt: |
    Consider the region bounded by $y = \sqrt{x-2}$, the x-axis, and $x = 11$.
    Set up, but do not evaluate, one definite integral using $dx$ and one using $dy$ for this area.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - |
      1. With $dx$: Top curve is $\sqrt{x-2}$, bottom is $0$. $x$ goes from 2 to 11. $\int_2^{11} \sqrt{x-2} \, dx$.
      2. With $dy$: Rearrange to $x = y^2 + 2$. At $x=11$, $y=3$. The Right curve is $x=11$, Left curve is $x=y^2+2$.
      3. $\int_0^3 (11 - (y^2+2)) \, dy$.
  explanation: |
    1. With $dx$: Top curve is $\sqrt{x-2}$, bottom is $0$. $x$ goes from 2 to 11. $\int_2^{11} \sqrt{x-2} \, dx$.
    2. With $dy$: Rearrange to $x = y^2 + 2$. At $x=11$, $y=3$. The Right curve is $x=11$, Left curve is $x=y^2+2$.
    3. $\int_0^3 (11 - (y^2+2)) \, dy$.
  difficultyDimensions: *id001
  difficultyEvidence: The problem requires selecting a representation, carrying out the governing calculus method, and checking the condition that makes the result valid.
  prerequisiteObjectiveIds:
  - calc2-obj-finals-integration-and-applications
- id: q018
  title: Volume by Cross Sections (Semicircles, dy)
  type: freeResponse
  skills:
  - geom-applications-comprehensive
  prompt: |
    The region bounded by $y = \sqrt{x-2}$, the x-axis, and $x=11$ is the base of a solid where cross sections perpendicular to the y-axis are semicircles.

    Determine the exact volume of the solid.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - |-
      1. Slices perpendicular to y-axis $\implies dy$. Base spans from $x = y^2+2$ to $x=11$.
      2. Diameter $d = 11 - (y^2+2) = 9-y^2$. Radius $r = \frac{9-y^2}{2}$.
      3. Area of semicircle $A(y) = \frac{1}{2}\pi r^2 = \frac{\pi}{8}(9-y^2)^2 = \frac{\pi}{8}(81 - 18y^2 + y^4)$.
      4. $V = \frac{\pi}{8} \int_0^3 (81 - 18y^2 + y^4) \, dy = \frac{\pi}{8} \left[ 81y - 6y^3 + \frac{1}{5}y^5 \right]_0^3$.
      5. $V = \frac{\pi}{8} \left( 243 - 162 + \frac{243}{5} \right) = \frac{\pi}{8} \left( 81 + 48.6 \right) = \frac{\pi}{8}(129.6) = 16.2\pi = \frac{81\pi}{5}$.
  explanation: |-
    1. Slices perpendicular to y-axis $\implies dy$. Base spans from $x = y^2+2$ to $x=11$.
    2. Diameter $d = 11 - (y^2+2) = 9-y^2$. Radius $r = \frac{9-y^2}{2}$.
    3. Area of semicircle $A(y) = \frac{1}{2}\pi r^2 = \frac{\pi}{8}(9-y^2)^2 = \frac{\pi}{8}(81 - 18y^2 + y^4)$.
    4. $V = \frac{\pi}{8} \int_0^3 (81 - 18y^2 + y^4) \, dy = \frac{\pi}{8} \left[ 81y - 6y^3 + \frac{1}{5}y^5 \right]_0^3$.
    5. $V = \frac{\pi}{8} \left( 243 - 162 + \frac{243}{5} \right) = \frac{\pi}{8} \left( 81 + 48.6 \right) = \frac{\pi}{8}(129.6) = 16.2\pi = \frac{81\pi}{5}$.
  difficultyDimensions: *id001
  difficultyEvidence: The problem requires selecting a representation, carrying out the governing calculus method, and checking the condition that makes the result valid.
  prerequisiteObjectiveIds:
  - calc2-obj-finals-integration-and-applications
- id: q019
  title: Volume of Revolution (x-axis, dy)
  type: freeResponse
  skills:
  - geom-applications-comprehensive
  prompt: 'The region bounded by $y=x^3$, the x-axis, and $x=2$ is rotated about the x-axis.


    Which integral correctly uses the differential $dy$ to find the volume?

    '
  answer:
    gradingMode: selfCheck
    keyPoints:
    - |-
      1. Rotation about x-axis with $dy$ requires the Cylindrical Shells method.
      2. Radius $r = y$. Height $h = x_{right} - x_{left} = 2 - \sqrt[3]{y}$.
      3. $V = \int_0^8 2\pi y (2 - \sqrt[3]{y}) \, dy$.
  explanation: |-
    1. Rotation about x-axis with $dy$ requires the Cylindrical Shells method.
    2. Radius $r = y$. Height $h = x_{right} - x_{left} = 2 - \sqrt[3]{y}$.
    3. $V = \int_0^8 2\pi y (2 - \sqrt[3]{y}) \, dy$.
  difficultyDimensions: *id001
  difficultyEvidence: The problem requires selecting a representation, carrying out the governing calculus method, and checking the condition that makes the result valid.
  prerequisiteObjectiveIds:
  - calc2-obj-finals-integration-and-applications
- id: q020
  title: Volume of Revolution (y-axis, dy)
  type: freeResponse
  skills:
  - geom-applications-comprehensive
  prompt: 'The region bounded by $y=x^3$, the x-axis, and $x=2$ is rotated about the y-axis.


    Which integral correctly uses the differential $dy$ to find the volume?

    '
  answer:
    gradingMode: selfCheck
    keyPoints:
    - |-
      1. Rotation about y-axis with $dy$ requires the Washer method.
      2. Outer radius $R = 2$. Inner radius $r = x_{curve} = y^{1/3}$.
      3. $V = \int_0^8 \pi (R^2 - r^2) \, dy = \int_0^8 \pi [4 - y^{2/3}] \, dy$.
  explanation: |-
    1. Rotation about y-axis with $dy$ requires the Washer method.
    2. Outer radius $R = 2$. Inner radius $r = x_{curve} = y^{1/3}$.
    3. $V = \int_0^8 \pi (R^2 - r^2) \, dy = \int_0^8 \pi [4 - y^{2/3}] \, dy$.
