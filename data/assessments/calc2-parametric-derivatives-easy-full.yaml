questions:
- id: q-b99102
  type: symbolicResponse
  title: First Derivative (1)
  prompt: Find $\frac{dy}{dx}$ in terms of $t$ for $x = 4t^2$, $y = t^3$.
  answer:
    expectedLatex: (3*t)/(8)
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0.0001
  explanation: $\frac{dx}{dt} = 8t$, $\frac{dy}{dt} = 3t^2$. Thus $\frac{dy}{dx} =
    \frac{3t^2}{8t} = \frac{3t}{8}$.
  skills:
  - parametric-derivatives
- id: q-6c3b24
  type: symbolicResponse
  title: First Derivative (2)
  prompt: Find $\frac{dy}{dx}$ in terms of $t$ for $x = 6t^2$, $y = t^3$.
  answer:
    expectedLatex: (3*t)/(12)
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0.0001
  explanation: $\frac{dx}{dt} = 12t$, $\frac{dy}{dt} = 3t^2$. Thus $\frac{dy}{dx}
    = \frac{3t^2}{12t} = \frac{3t}{12}$.
  skills:
  - parametric-derivatives
- id: q-d0dea0
  type: numericResponse
  title: Slope at Point (3)
  prompt: Find the slope of the tangent line to $x = t^2 + 4$, $y = 3t^2 - t$ at $t
    = 2$.
  answer:
    value: 2.75
    tolerance: 0.01
  explanation: $\frac{dx}{dt} = 2t = 4$. $\frac{dy}{dt} = 6t - 1 = 11$. Slope is $11/4$.
  skills:
  - parametric-derivatives
