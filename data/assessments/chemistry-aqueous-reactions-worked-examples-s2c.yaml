workedExamples:
  - id: aq-we-1
    title: Predicting Precipitation
    problem: 'Does a precipitate form when aqueous solutions of NaCl and AgNO3 are mixed? If so, what is it?'
    steps:
      - { id: aw-01, title: Identify possible products, instruction: 'Determine the products of a double replacement.', type: freeResponse, prompt: 'What are the two possible new ion pairings?', answer: { gradingMode: selfCheck, keyPoints: ['NaNO3', 'AgCl'] }, explanation: 'Solution: NaNO3 and AgCl. Why it works: Cations swap anions.' }
      - { id: aw-02, title: Apply solubility rules, instruction: 'Determine which product is insoluble.', type: multipleChoice, prompt: 'Which of the products is insoluble?', choices: [{ id: a, text: 'NaNO3' }, { id: b, text: 'AgCl' }, { id: c, text: 'both' }, { id: d, text: 'neither' }], answer: { choiceId: b }, explanation: 'Solution: AgCl is insoluble. Why it works: Most chlorides are soluble, but Ag+ is an exception. Nitrates and sodium salts are soluble. Why the other choices fail: NaNO3 is completely soluble.' }
  - id: aq-we-2
    title: Writing Net Ionic Equations
    problem: 'Write the net ionic equation for the reaction of aqueous Pb(NO3)2 with aqueous KI.'
    steps:
      - { id: aw-03, title: Write the complete ionic equation, instruction: 'Write all soluble compounds as ions.', type: freeResponse, prompt: 'Write the complete ionic equation.', answer: { gradingMode: selfCheck, keyPoints: ['Pb 2+', '2 NO3-', '2 K+', '2 I-', 'PbI2 (s)', '2 K+', '2 NO3-'] }, explanation: 'Solution: Pb2+(aq) + 2NO3-(aq) + 2K+(aq) + 2I-(aq) -> PbI2(s) + 2K+(aq) + 2NO3-(aq). Why it works: PbI2 is insoluble, while the others are soluble strong electrolytes.' }
      - { id: aw-04, title: Identify spectator ions, instruction: 'Find ions that appear unchanged on both sides.', type: freeResponse, prompt: 'Which ions are spectator ions?', answer: { gradingMode: selfCheck, keyPoints: ['K+', 'NO3-'] }, explanation: 'Solution: Potassium and nitrate ions. Why it works: They do not change state or charge.' }
      - { id: aw-05, title: Write the net ionic equation, instruction: 'Remove spectator ions.', type: freeResponse, prompt: 'What is the final net ionic equation?', answer: { gradingMode: selfCheck, keyPoints: ['Pb 2+', '2 I-', 'PbI2'] }, explanation: 'Solution: Pb2+(aq) + 2I-(aq) -> PbI2(s). Why it works: This shows only the species involved in forming the precipitate.' }
  - id: aq-we-3
    title: Recognizing No Reaction
    problem: 'What happens when aqueous NaCl is mixed with aqueous KNO3?'
    steps:
      - { id: aw-06, title: Identify potential products, instruction: 'Swap the ions to find potential products.', type: freeResponse, prompt: 'What are the possible products?', answer: { gradingMode: selfCheck, keyPoints: ['NaNO3', 'KCl'] }, explanation: 'Solution: NaNO3 and KCl. Why it works: Cations exchange anions.' }
      - { id: aw-07, title: Check solubility, instruction: 'Determine if either product is insoluble.', type: multipleChoice, prompt: 'Are either of these products insoluble?', choices: [{ id: a, text: 'Yes, NaNO3' }, { id: b, text: 'Yes, KCl' }, { id: c, text: 'No, both are soluble' }], answer: { choiceId: c }, explanation: 'Solution: No, both are soluble. Why it works: All sodium, potassium, and nitrate salts are soluble. Why the other choices fail: Neither forms a precipitate.' }
      - { id: aw-08, title: Conclude, instruction: 'Determine the overall result.', type: multipleChoice, prompt: 'What is the net ionic equation?', choices: [{ id: a, text: 'Na+ + Cl- -> NaCl' }, { id: b, text: 'no reaction' }], answer: { choiceId: b }, explanation: 'Solution: No reaction. Why it works: Since all species remain as dissolved ions, no chemical change occurs.' }
