workedExamples:
- id: ex-variable-force-work
  title: From Dot Product to 1D Integral
  problem: |
    Let's derive the formula for the work done by a position-dependent force $F(x)$ moving an object in 1D from $x_i$ to $x_f$.
  steps:
  - id: step-1
    title: Step 1 — Vector Dot Product
    instruction: |
      Start with the general vector definition of infinitesimal work: $dW = \vec F \cdot d\vec r$.
      If the force is purely along the x-axis, we write $\vec F = F(x) \hat i$.
      For 1D motion along the x-axis, $d\vec r = dx \hat i$.
    type: multipleChoice
    prompt: What is the result of the dot product $\vec F \cdot d\vec r$?
    choices:
    - id: a
      text: $F(x) \, dx$
    - id: b
      text: $0$
    - id: c
      text: $F(x) \times dx$ (cross product)
    answer:
      choiceId: a
    explanation: Since $\hat i \cdot \hat i = 1$, the dot product evaluates to exactly $F(x) \, dx$.
  - id: step-2
    title: Step 2 — Integration
    instruction: |
      We now have $dW = F(x) \, dx$. This is the tiny amount of work done over an infinitesimally small step $dx$.
      To find the total work done over a macroscopic distance, we must sum up all these tiny amounts of work.
    type: symbolicResponse
    prompt: Write the definite integral for the total work $W$ from position $x_i$ to $x_f$. (Use 'int' for integral, e.g., \int_{x_i}^{x_f})
    answer:
      gradingMode: auto
      expectedLatex: \int_{x_i}^{x_f} F(x) dx
      equivalenceMode: expression
      tolerance: 0
    explanation: Total work is simply the integral of the force with respect to position. Geometrically, this is the signed area under the $F$ vs. $x$ graph.
