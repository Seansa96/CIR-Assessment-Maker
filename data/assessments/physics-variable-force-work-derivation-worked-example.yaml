workedExamples:
  - id: ex-variable-force-work
    title: From dot product to a one-dimensional integral
    problem: 'Derive work for a force $F(x)\hat i$ moving an object from $x_i$ to $x_f$.'
    steps:
      - id: vf-1
        title: Infinitesimal work
        instruction: 'Use $d\vec r=dx\hat i$.'
        type: symbolicResponse
        prompt: 'What is $dW$?'
        answer: { gradingMode: auto, expectedLatex: 'F(x) dx', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $dW=(F(x)\hat i)\cdot(dx\hat i)=F(x)dx$.\n\nWhy it works: The unit vector dot product is $\hat i\cdot\hat i=1$.'
      - id: vf-2
        title: Sum the increments
        instruction: 'Integrate the infinitesimal work across the interval.'
        type: symbolicResponse
        prompt: 'Write the total work.'
        answer: { gradingMode: auto, expectedLatex: '\int_{x_i}^{x_f} F(x) dx', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $W=\int_{x_i}^{x_f}F(x)\,dx$.\n\nWhy it works: Integration adds each infinitesimal energy transfer over the path.'
  - id: ex-variable-force-linear
    title: Linear force calculation
    problem: 'A one-dimensional force is $F(x)=3x$ N. Find the work from $x=0$ m to $x=4.0$ m.'
    steps:
      - id: vl-1
        title: Set up the integral
        instruction: 'Substitute the supplied force function into the work integral.'
        type: symbolicResponse
        prompt: 'Write the integral for work.'
        answer: { gradingMode: auto, expectedLatex: '\int_0^4 3x dx', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $W=\int_0^4 3x\,dx$.\n\nWhy it works: The force is position dependent, so force must be integrated over displacement.'
      - id: vl-2
        title: Evaluate the integral
        instruction: 'Use an antiderivative of $3x$.'
        type: numericResponse
        prompt: 'What is the work in joules?'
        answer: { value: 24, tolerance: 0.01 }
        explanation: 'Solution: $W=[\tfrac32x^2]_0^4=\tfrac32(16)=24$ J.\n\nWhy it works: The signed area under the positive $F$-versus-$x$ curve is the work.'
