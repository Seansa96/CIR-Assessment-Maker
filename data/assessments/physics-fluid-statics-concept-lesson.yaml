lesson:
  introduction: >
    Welcome to the lesson on Fluid Statics. Unlike solids, fluids (liquids and gases) can flow and take the shape of their container. In this lesson, we will explore the fundamental properties of fluids at rest, focusing on density, pressure, and Pascal's Principle.
  sections:
  - id: density-and-pressure
    title: 1. Density and Pressure
    required: true
    content: >
      **Density** ($\rho$) is defined as mass per unit volume:

      $$ \rho = \frac{m}{V} $$

      The standard SI unit is $\text{kg/m}^3$. For example, the density of pure water is $1000 \text{ kg/m}^3$.


      **Pressure** ($P$) is defined as the magnitude of the normal force ($F$) exerted per unit area ($A$):

      $$ P = \frac{F}{A} $$

      The SI unit for pressure is the Pascal ($\text{Pa}$), where $1 \text{ Pa} = 1 \text{ N/m}^2$.
    media:
    - type: image
      src: /media/physics/owa/hydrostatic-depth.svg
      alt: Two differently shaped containers with equal-depth points in the same fluid.
      caption: Equal depth in the same static fluid means equal pressure, regardless of container shape.
    check:
      id: check-1
      type: multipleChoice
      prompt: >
        If you stand on one foot instead of two, how does the force and pressure exerted on the ground change?
      choices:
      - id: a
        text: Both the force and the pressure increase.
        media: []
        issueSignals:
        - id: pressure-confusion
          domains: []
        - id: force-pressure-confusion
          domains: []
      - id: b
        text: The force remains the same, but the pressure increases.
        media: []
        issueSignals: []
      - id: c
        text: The force increases, but the pressure remains the same.
        media: []
        issueSignals:
        - id: pressure-confusion
          domains: []
        - id: force-pressure-confusion
          domains: []
      - id: d
        text: Both the force and the pressure remain the same.
        media: []
        issueSignals:
        - id: pressure-confusion
          domains: []
        - id: force-pressure-confusion
          domains: []
      answer:
        choiceId: b
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution:

        The force remains the same, but the pressure increases.


        Why it works:

        The total normal force exerted on the ground is simply your weight ($mg$), which does not change. However, by standing on one foot, you halve the contact area ($A$). Since $P = F/A$, halving the area doubles the pressure.


        Why the other choices fail:

        Your weight doesn't magically change depending on how you stand, so the force is constant.
