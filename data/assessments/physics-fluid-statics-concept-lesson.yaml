lesson:
  introduction: 'Welcome to the lesson on Fluid Statics. Unlike solids, fluids (liquids
    and gases) can flow and take the shape of their container. In this lesson, we
    will explore the fundamental properties of fluids at rest, focusing on density,
    pressure, and Pascal''s Principle.

    '
  sections:
  - id: density-and-pressure
    title: 1. Density and Pressure
    required: true
    content: '**Density** ($\rho$) is defined as mass per unit volume:

      $$ \rho = \frac{m}{V} $$

      The standard SI unit is $\text{kg/m}^3$. For example, the density of pure water
      is $1000 \text{ kg/m}^3$.


      **Pressure** ($P$) is defined as the magnitude of the normal force ($F$) exerted
      per unit area ($A$):

      $$ P = \frac{F}{A} $$

      The SI unit for pressure is the Pascal ($\text{Pa}$), where $1 \text{ Pa} =
      1 \text{ N/m}^2$.

      '
    media:
    - type: image
      src: /media/physics/owa/hydrostatic-depth.svg
      alt: Two differently shaped containers with equal-depth points in the same fluid.
      caption: Equal depth in the same static fluid means equal pressure, regardless
        of container shape.
    check:
      id: check-1
      type: multipleChoice
      prompt: 'If you stand on one foot instead of two, how does the force and pressure
        exerted on the ground change?

        '
      choices:
      - id: a
        text: Both the force and the pressure increase.
        issueSignals:
        - id: pressure-confusion
        - id: force-pressure-confusion
      - id: b
        text: The force remains the same, but the pressure increases.
      - id: c
        text: The force increases, but the pressure remains the same.
        issueSignals:
        - id: pressure-confusion
        - id: force-pressure-confusion
      - id: d
        text: Both the force and the pressure remain the same.
        issueSignals:
        - id: pressure-confusion
        - id: force-pressure-confusion
      answer:
        choiceId: b
      explanation: 'Solution:

        The force remains the same, but the pressure increases.


        Why it works:

        The total normal force exerted on the ground is simply your weight ($mg$),
        which does not change. However, by standing on one foot, you halve the contact
        area ($A$). Since $P = F/A$, halving the area doubles the pressure.


        Why the other choices fail:

        Your weight doesn''t magically change depending on how you stand, so the force
        is constant.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: hydrostatic-pressure
    title: 2. Hydrostatic Pressure
    required: true
    content: 'In a static fluid, pressure increases with depth due to the weight of
      the fluid above. The absolute pressure $P$ at a depth $h$ is given by:

      $$ P = P_0 + \rho g h $$

      where $P_0$ is the pressure at the surface (often atmospheric pressure), $\rho$
      is the fluid density, and $g$ is the acceleration due to gravity.


      **Gauge Pressure** is the pressure relative to atmospheric pressure:

      $$ P_{gauge} = P - P_{atm} = \rho g h $$

      '
    media:
    - type: image
      src: /media/physics/owa/hydrostatic-depth.svg
      alt: Fluid columns with a marked vertical depth below the surface.
      caption: Pressure increases with vertical depth through the fluid.
    check:
      id: check-2
      type: multipleChoice
      prompt: 'Which of the following describes the relationship between the shape
        of a container and the hydrostatic pressure at its bottom?

        '
      choices:
      - id: a
        text: Wider containers have higher pressure at the bottom.
        issueSignals:
        - id: pressure-confusion
      - id: b
        text: Narrower containers have higher pressure at the bottom.
        issueSignals:
        - id: pressure-confusion
      - id: c
        text: The shape of the container does not affect the pressure; only the depth
          matters.
      answer:
        choiceId: c
      explanation: 'Solution:

        The shape of the container does not affect the pressure.


        Why it works:

        The hydrostatic pressure equation $P = P_0 + \rho g h$ depends only on the
        density of the fluid and the vertical depth $h$. It is completely independent
        of the total volume or shape of the container. This is known as the hydrostatic
        paradox.


        Why the other choices fail:

        Pressure is force per unit area. While a wider container holds more total
        weight of fluid, that weight is distributed over a proportionally larger bottom
        area, leaving the pressure ($F/A$) unchanged.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: pascals-principle
    title: 3. Pascal's Principle
    required: true
    content: 'Pascal''s Principle states that a change in pressure applied to an enclosed,
      incompressible fluid is transmitted undiminished to every portion of the fluid
      and to the walls of its container.


      This is the basis of the **hydraulic lift**. If a small force $F_1$ is applied
      to a small piston of area $A_1$, it creates a pressure $P = F_1/A_1$. This same
      pressure acts on a larger piston of area $A_2$, creating a much larger output
      force $F_2$:

      $$ \frac{F_1}{A_1} = \frac{F_2}{A_2} \implies F_2 = F_1 \left( \frac{A_2}{A_1}
      \right) $$

      '
    media: []
    check:
      id: check-3
      type: numericResponse
      prompt: "In a hydraulic press, the small piston has an area of $0.01 \\text{\
        \ m}^2$ and the large piston has an area of $0.5 \\text{ m}^2$. \nIf a force\
        \ of $200 \\text{ N}$ is applied to the small piston, what is the upward force\
        \ exerted by the large piston in Newtons?\n"
      answer:
        value: 10000
        tolerance: 10
      explanation: 'Solution:

        $F_2 = F_1 \frac{A_2}{A_1} = 200 \left(\frac{0.5}{0.01}\right) = 200 (50)
        = 10000 \text{ N}$.


        Why it works:

        The pressure $P = 200 / 0.01 = 20000 \text{ Pa}$ is transmitted equally throughout
        the fluid. Applying $20000 \text{ Pa}$ to an area of $0.5 \text{ m}^2$ yields
        a force of $F = P \times A = 10000 \text{ N}$.

        '
