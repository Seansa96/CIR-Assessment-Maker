  - id: hydrostatic-pressure
    title: 2. Hydrostatic Pressure
    required: true
    content: >
      In a static fluid, pressure increases with depth due to the weight of the fluid above. The absolute pressure $P$ at a depth $h$ is given by:

      $$ P = P_0 + \rho g h $$

      where $P_0$ is the pressure at the surface (often atmospheric pressure), $\rho$ is the fluid density, and $g$ is the acceleration due to gravity.


      **Gauge Pressure** is the pressure relative to atmospheric pressure:

      $$ P_{gauge} = P - P_{atm} = \rho g h $$
    media:
    - type: image
      src: /media/physics/owa/hydrostatic-depth.svg
      alt: Fluid columns with a marked vertical depth below the surface.
      caption: Pressure increases with vertical depth through the fluid.
    check:
      id: check-2
      type: multipleChoice
      prompt: >
        Which of the following describes the relationship between the shape of a container and the hydrostatic pressure at its bottom?
      choices:
      - id: a
        text: Wider containers have higher pressure at the bottom.
        media: []
        issueSignals:
        - id: pressure-confusion
          domains: []
      - id: b
        text: Narrower containers have higher pressure at the bottom.
        media: []
        issueSignals:
        - id: pressure-confusion
          domains: []
      - id: c
        text: The shape of the container does not affect the pressure; only the depth matters.
        media: []
        issueSignals: []
      answer:
        choiceId: c
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution:

        The shape of the container does not affect the pressure.


        Why it works:

        The hydrostatic pressure equation $P = P_0 + \rho g h$ depends only on the density of the fluid and the vertical depth $h$. It is completely independent of the total volume or shape of the container. This is known as the hydrostatic paradox.


        Why the other choices fail:

        Pressure is force per unit area. While a wider container holds more total weight of fluid, that weight is distributed over a proportionally larger bottom area, leaving the pressure ($F/A$) unchanged.
