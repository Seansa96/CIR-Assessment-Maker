  - id: pascals-principle
    title: 3. Pascal's Principle
    required: true
    content: >
      Pascal's Principle states that a change in pressure applied to an enclosed, incompressible fluid is transmitted undiminished to every portion of the fluid and to the walls of its container.


      This is the basis of the **hydraulic lift**. If a small force $F_1$ is applied to a small piston of area $A_1$, it creates a pressure $P = F_1/A_1$. This same pressure acts on a larger piston of area $A_2$, creating a much larger output force $F_2$:

      $$ \frac{F_1}{A_1} = \frac{F_2}{A_2} \implies F_2 = F_1 \left( \frac{A_2}{A_1} \right) $$
    media: []
    check:
      id: check-3
      type: numericResponse
      prompt: >
        In a hydraulic press, the small piston has an area of $0.01 \text{ m}^2$ and the large piston has an area of $0.5 \text{ m}^2$. 

        If a force of $200 \text{ N}$ is applied to the small piston, what is the upward force exerted by the large piston in Newtons?
      choices: []
      answer:
        choiceId: 
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 10000
        tolerance: 10
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution:

        $F_2 = F_1 \frac{A_2}{A_1} = 200 \left(\frac{0.5}{0.01}\right) = 200 (50) = 10000 \text{ N}$.


        Why it works:

        The pressure $P = 200 / 0.01 = 20000 \text{ Pa}$ is transmitted equally throughout the fluid. Applying $20000 \text{ Pa}$ to an area of $0.5 \text{ m}^2$ yields a force of $F = P \times A = 10000 \text{ N}$.
