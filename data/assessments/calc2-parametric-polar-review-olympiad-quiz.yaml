questions:
- id: q001
  type: freeResponse
  skills:
  - parametric-polar-review
  - olympiad-problem-solving
  prompt: For $r=3(1+\cos\theta)$, find $r$ at $\theta=\pi$ and state what it tells you about the curve.
  answer:
    gradingMode: selfCheck
    expected: $r=0$; the curve passes through the pole (a cardioid cusp).
    keyPoints:
    - 'Matches the reference result: $r=0$; the curve passes through the pole (a cardioid cusp).'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: Substitution gives $3(1-1)=0$. A polar point with $r=0$ is the pole, so this identifies the cusp/pole passage.
