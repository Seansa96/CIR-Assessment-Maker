lesson:
  introduction: Numerical methods replace an unavailable or inconvenient exact solution by a sequence of computed
    states. Every update must use the correct mesh point, step size, and slope data, and every accuracy claim needs
    a fair reference.
  sections:
  - id: s1
    title: Why approximate?
    required: true
    content: For an IVP $y'=f(x,y)$, $y(x_0)=y_0$, a numerical method constructs values $y_n\approx y(x_n)$ on mesh
      points $x_n=x_0+nh$. This is useful when no elementary closed form exists, when only sampled output is needed,
      or when a model is coupled to data. The method still requires $f$ to be evaluable at every stage.
    media: []
    check:
      id: chk-01
      type: multipleChoice
      prompt: A solver has reached $(x_n,y_n)=(0.4,1.7)$ for $y'=x-y$. What information is needed before any one-step
        method can advance?
      skills:
      - ede-ch03-numerical-methods-euler-updates
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch03-numerical-methods-euler-updates
      difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a
        plausible error.
      choices:
      - id: a
        text: A step size and the method's required evaluations of $f$
      - id: b
        text: Only the original value $y_0$
        issueSignals:
        - id: ede-numerical-current-state-error
          domains: &id001
          - elementary-differential-equations-bvp
      - id: c
        text: An assumed exact solution
        issueSignals:
        - id: ede-numerical-reference-error
          domains: *id001
      - id: d
        text: A new differential equation
        issueSignals:
        - id: ede-method-selection-error
          domains: *id001
      answer:
        choiceId: a
      explanation: |-
        Solution: The method needs $h$ and its prescribed slope evaluations.

        Why it works: A one-step rule advances from the current numerical state using the given right-hand side.

        Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  - id: s2
    title: Euler updates
    required: true
    content: 'Euler''s method uses the current slope only: $y_{n+1}=y_n+h f(x_n,y_n)$. Geometrically it follows
      the tangent line at $(x_n,y_n)$ for a horizontal distance $h$. For $y''=x-y$ at $(0,2)$ with $h=0.25$, the
      slope is $-2$ and the next value is $1.5$.'
    media:
    - type: image
      src: /media/ede/ch03-euler-steps.svg
      alt: Euler polygon following current tangent slopes beneath a curved reference solution.
      caption: Euler advances from the current state along one local tangent.
    check:
      id: chk-02
      type: numericResponse
      prompt: Use one Euler step for $y'=2x+y$ from $(x_0,y_0)=(1,3)$ with $h=0.2$. Find $y_1$.
      skills:
      - ede-ch03-numerical-methods-euler-updates
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch03-numerical-methods-euler-updates
      difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
      answer:
        value: 4.0
        tolerance: 0.0001
      explanation: |-
        Solution: $f(1,3)=5$, so $y_1=3+0.2(5)=4$.

        Why it works: Euler evaluates the slope at the current point, not at the unknown next state.
  - id: s3
    title: Local error, global error, and step size
    required: true
    content: Local truncation error compares one update started from the exact current value with the exact value
      one step later. Global error compares the accumulated numerical value $y_n$ with $y(x_n)$ after many steps.
      Euler has local error of order $h^2$ and, over a fixed interval under standard smoothness assumptions, global
      error of order $h$. Halving $h$ usually reduces Euler's global error by about a factor of two, not four.
    media: &id002
    - type: image
      src: /media/ede/ch03-error-method-comparison.svg
      alt: Reference curve with coarse and fine Euler polygons, a marked local error, endpoint global errors, and
        a cost-accuracy comparison for Euler, Heun, and RK4.
      caption: Step size changes both accumulated error and computational cost.
    check:
      id: chk-03
      type: multipleChoice
      prompt: Euler errors at a fixed endpoint are $0.048$ for $h=0.2$ and $0.025$ for $h=0.1$. Which conclusion
        is justified?
      skills:
      - ede-ch03-numerical-methods-error-step-size
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch03-numerical-methods-error-step-size
      difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a
        plausible error.
      choices:
      - id: a
        text: The behavior is consistent with approximately first-order global convergence.
      - id: b
        text: The local error is exactly $0.025$.
        issueSignals:
        - id: ede-numerical-local-global-error
          domains: *id001
      - id: c
        text: Halving $h$ made the method exact.
        issueSignals:
        - id: ede-numerical-step-size-error
          domains: *id001
      - id: d
        text: The larger-step result must be more accurate.
        issueSignals:
        - id: ede-numerical-step-size-error
          domains: *id001
      answer:
        choiceId: a
      explanation: |-
        Solution: The endpoint error is roughly halved when the step is halved.

        Why it works: That pattern is consistent with Euler's first-order global error, while two data points do not prove exactness.

        Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  - id: s4
    title: Endpoint-average Improved Euler and related two-stage rules
    required: true
    content: Endpoint-average Improved Euler (also called explicit trapezoid and often called Heun's method in other
      texts) predicts an endpoint and averages the starting and predicted endpoint slopes. This source reserves
      Heun's name for the second-order choice with stage location $2h/3$ and weights $1/4,3/4$; midpoint samples
      at $h/2$ and uses that slope for the update. Formulas, not names, determine the stages.
    media: []
    check:
      id: chk-04
      type: numericResponse
      prompt: For $y'=x+y$, $(x_0,y_0)=(0,1)$, and $h=0.4$, endpoint-average Improved Euler predicts $y^*=1.4$.
        What corrected value results?
      skills:
      - ede-ch03-numerical-methods-improved-euler
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch03-numerical-methods-improved-euler
      difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
      answer:
        value: 1.56
        tolerance: 0.0001
      explanation: |-
        Solution: The slopes are $1$ and $f(0.4,1.4)=1.8$, so $y_1=1+0.4(1+1.8)/2=1.56$.

        Why it works: Endpoint-average Improved Euler uses the starting slope and the predicted endpoint slope; the formula avoids ambiguity among naming conventions.
  - id: s5
    title: Classical fourth-order Runge–Kutta
    required: true
    content: 'RK4 samples four slopes: $k_1=f(x_n,y_n)$, two midpoint slopes $k_2$ and $k_3$, and the endpoint slope
      $k_4$. The update is $y_{n+1}=y_n+\frac h6(k_1+2k_2+2k_3+k_4)$. The stage states, not merely the stage locations,
      must be updated before each evaluation.'
    media: []
    check:
      id: chk-05
      type: multipleChoice
      prompt: In classical RK4, where is $k_3$ evaluated?
      skills:
      - ede-ch03-numerical-methods-runge-kutta
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch03-numerical-methods-runge-kutta
      difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a
        plausible error.
      choices:
      - id: a
        text: At the midpoint using the state predicted from $k_2$
      - id: b
        text: At the initial point again
        issueSignals:
        - id: ede-rk4-stage-location-error
          domains: *id001
      - id: c
        text: At the endpoint using $k_1$
        issueSignals:
        - id: ede-rk4-stage-location-error
          domains: *id001
      - id: d
        text: At the midpoint using the unchanged value $y_n$
        issueSignals:
        - id: ede-rk4-stage-location-error
          domains: *id001
      answer:
        choiceId: a
      explanation: |-
        Solution: $k_3=f(x_n+h/2,y_n+hk_2/2)$.

        Why it works: The second midpoint stage uses the state generated by the preceding midpoint slope.

        Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  - id: s6
    title: Choosing a method fairly
    required: true
    content: 'Accuracy must be compared at the same endpoint against the same reference solution or sufficiently
      accurate benchmark. Cost should report right-hand-side evaluations, not just step count: Euler uses one per
      step, Heun typically two, and RK4 four. Smaller steps improve resolution but increase cost and can magnify
      roundoff in extreme cases.'
    media: *id002
    check:
      id: chk-06
      type: selectAll
      prompt: Select every fair comparison between Euler and RK4 on the same IVP.
      skills:
      - ede-ch03-numerical-methods-method-comparison
      media: []
      difficultyDimensions:
      - constraintTracking
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch03-numerical-methods-method-comparison
      difficultyEvidence: Requires checking several statements independently against the differential equation and
        its conditions.
      choices:
      - id: a
        text: Compare endpoint errors against the same reference value.
      - id: b
        text: Report total evaluations of $f$.
      - id: c
        text: Give RK4 a smaller interval and compare raw errors.
        issueSignals:
        - id: ede-numerical-cost-comparison-error
          domains: *id001
      - id: d
        text: Compare only the number of time steps and ignore stages.
        issueSignals:
        - id: ede-numerical-cost-comparison-error
          domains: *id001
      answer:
        choiceIds:
        - a
        - b
      explanation: |-
        Solution: Use a common endpoint/reference and report function-evaluation cost.

        Why it works: Both accuracy and computational work must be measured on comparable tasks.

        Why the other choices fail: Every unselected statement violates a stated equation, condition, or theorem hypothesis.
