    "sections": [
      {
        "id": "s1",
        "title": "Why approximate?",
        "required": true,
        "content": "When no usable closed form is available, an IVP $y' = f(x,y)$ can still be advanced in short steps. A numerical method replaces the unknown curve by locally computed values.",
        "media": [
          {
            "type": "image",
            "src": "/media/ede/ch03-euler-steps.svg",
            "alt": "Euler update diagram showing a tangent prediction and corrected step.",
            "caption": "Use the labeled quantities before selecting a method."
          }
        ],
        "check": {
          "id": "chk-01",
          "type": "multipleChoice",
          "skills": [
            "ede-ch03-numerical-methods-euler-updates"
          ],
          "prompt": "Which conclusion follows from the why approximate? section?",
          "choices": [
