        "id": "s2",
        "title": "Euler updates",
        "required": true,
        "content": "Euler uses the known slope at $(x_n,y_n)$: $y_{n+1}=y_n+h f(x_n,y_n)$. The update is a tangent-line prediction, so both the sign and the step size matter.",
