glossary:
  introduction: Vocabulary for tracing how a proof moves from assumptions to a justified conclusion.
  sections:
  - id: proof-map
    title: Proof-map vocabulary
    required: true
    content: Use these labels to record why each line of an argument is allowed.
    entries:
    - id: t01
      term: Claim
      definition: A statement that a proof is trying to establish or uses along the way.
      drills:
      - id: t01-drill
        type: flashcard
        prompt: What is a proof claim?
        answer:
          expected: A statement in the argument.
        explanation: 'Solution: A statement in the argument. Why it works: Proofs advance through claims.'
        tags: []
    - id: t02
      term: Justification
      definition: The definition, assumption, calculation, or prior result that licenses a claim.
      drills:
      - id: t02-drill
        type: flashcard
        prompt: What licenses a proof claim?
        answer:
          expected: Justification.
        explanation: 'Solution: Justification. Why it works: Each proof line needs a reason.'
        tags: []
    - id: t03
      term: Inference
      definition: A conclusion drawn from earlier information by a valid logical rule.
      drills:
      - id: t03-drill
        type: flashcard
        prompt: What is an inference?
        answer:
          expected: A conclusion from earlier information.
        explanation: 'Solution: A conclusion from earlier information. Why it works: Valid rules connect premises
          to conclusions.'
        tags: []
    - id: t04
      term: Proof map
      definition: A reader-created outline linking each important claim to its supporting reasons.
      drills:
      - id: t04-drill
        type: flashcard
        prompt: What does a proof map link?
        answer:
          expected: Claims and supporting reasons.
        explanation: 'Solution: Claims and supporting reasons. Why it works: The map shows dependencies.'
        tags: []
    - id: t05
      term: Gap
      definition: A transition whose justification is omitted, unclear, or not valid from the available information.
      drills:
      - id: t05-drill
        type: flashcard
        prompt: What is a proof gap?
        answer:
          expected: A transition without a clear justification.
        explanation: 'Solution: A transition without a clear justification. Why it works: The reader cannot verify
          the logical link.'
        tags: []
