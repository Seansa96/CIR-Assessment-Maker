questions:
- id: q-67bca0
  type: symbolicResponse
  title: Trig Identities (1)
  prompt: Find $y$ in terms of $x$ for the curve $x = e^t$, $y = e^{2t}$.
  answer:
    expectedLatex: x^2
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0.0001
  explanation: Since $t = \ln(x)$, $y = e^{2\ln(x)} = x^2$.
  skills:
  - parametric-curves
