- id: q-59f6b2
  type: multipleChoice
  title: Complex Elimination (4)
  prompt: Eliminate the parameter $t$ for $x = 4\cos(t)$, $y = 4\sin(t)$. Which equation
    correctly describes the curve?
  choices:
  - id: c1
    text: $(x/4)^2 + (y/4)^2 = 1$
  - id: c2
    text: $(x/4)^2 + (y/4)^2 = 1$
  - id: c3
    text: $4x^2 + 4y^2 = 1$
  - id: c4
    text: $x^2/4 + y^2/4 = 1$
  answer:
    choiceId: c1
  explanation: Using $\cos^2(t) + \sin^2(t) = 1$, we get $(x/4)^2 + (y/4)^2 = 1$.
  skills:
  - parametric-curves
- id: q-065157
  type: numericResponse
  title: Intersection (5)
  prompt: Find the $t > 0$ value where the parametric curve $x(t) = t^2 - 2$, $y(t)
    = t^3 - 2t$ crosses the y-axis.
  answer:
    value: 1.4142135623730951
    tolerance: 0.01
  explanation: Crosses the y-axis when $x=0$, so $t^2 - 2 = 0 \implies t = \sqrt{2}$.
  skills:
  - parametric-curves
