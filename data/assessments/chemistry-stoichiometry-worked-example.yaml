- id: mole-to-mole
  title: Mole-to-Mole Stoichiometry
  problem: |
    The Haber process produces ammonia:
    N2(g) + 3H2(g) → 2NH3(g)

    **Problem A: Lab Scale**
    (a) How many moles of H2 are needed to produce 8.50 mol of NH3?
    (b) How many moles of N2 are consumed if 5.00 mol of H2 reacts with excess N2?

    **Problem B: Pilot Scale**
    (c) How many moles of H2 are needed to produce 850.0 mol of NH3?
    (d) How many moles of N2 are consumed if 500.0 mol of H2 reacts with excess N2?

    **Problem C: Industrial Scale**
    (e) How many moles of H2 are needed to produce 85000 mol of NH3?
    (f) How many moles of N2 are consumed if 50000 mol of H2 reacts with excess N2?
  steps:
  - id: step-mole-to-mole-1
    title: Problem A (a) — Moles of H2 needed for 8.50 mol NH3
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      The mole ratio from the balanced equation is:
      $$
      \frac{3 \text{ mol H}_2}{2 \text{ mol NH}_3}
      $$

      $$
      n_{H_2} = 8.50 \text{ mol NH}_3 \times \frac{3 \text{ mol H}_2}{2 \text{ mol NH}_3} = 12.75 \text{ mol H}_2
      $$
  - id: step-mole-to-mole-2
    title: Problem A (b) — Moles of N2 consumed by 5.00 mol H2
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      The mole ratio from the balanced equation is:
      $$
      \frac{1 \text{ mol N}_2}{3 \text{ mol H}_2}
      $$

      $$
      n_{N_2} = 5.00 \text{ mol H}_2 \times \frac{1 \text{ mol N}_2}{3 \text{ mol H}_2} = 1.67 \text{ mol N}_2
      $$

      ![Visual representation of lab scale ammonia yield](/media/placeholders/stoich-mole-lab.svg)
  - id: step-mole-to-mole-3
    title: Problem B (c) — Moles of H2 needed for 850.0 mol NH3
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      Using the same mole ratio for the pilot scale amount:
      $$
      n_{H_2} = 850.0 \text{ mol NH}_3 \times \frac{3 \text{ mol H}_2}{2 \text{ mol NH}_3} = 1275 \text{ mol H}_2
      $$
  - id: step-mole-to-mole-4
    title: Problem B (d) — Moles of N2 consumed by 500.0 mol H2
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      Using the same mole ratio for the pilot scale amount:
      $$
      n_{N_2} = 500.0 \text{ mol H}_2 \times \frac{1 \text{ mol N}_2}{3 \text{ mol H}_2} = 166.7 \text{ mol N}_2
      $$

      ![Visual representation of pilot scale ammonia yield](/media/placeholders/stoich-mole-pilot.svg)
  - id: step-mole-to-mole-5
    title: Problem C (e) — Moles of H2 needed for 85000 mol NH3
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      Using the same mole ratio for the industrial scale amount:
      $$
      n_{H_2} = 85000 \text{ mol NH}_3 \times \frac{3 \text{ mol H}_2}{2 \text{ mol NH}_3} = 127500 \text{ mol H}_2
      $$
  - id: step-mole-to-mole-6
    title: Problem C (f) — Moles of N2 consumed by 50000 mol H2
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      Using the same mole ratio for the industrial scale amount:
      $$
      n_{N_2} = 50000 \text{ mol H}_2 \times \frac{1 \text{ mol N}_2}{3 \text{ mol H}_2} = 16667 \text{ mol N}_2
      $$

      ![Visual representation of industrial scale ammonia yield](/media/placeholders/stoich-mole-industrial.svg)
  check:
    id: mole-check
    type: numericResponse
    prompt: 'For the reaction 2H2O → 2H2 + O2,\rhow many moles of O2 are produced from
      6.00 mol of H2O?

      '
    answer:
      value: 3.0
      tolerance: 0.05
- id: limiting-reactant
  title: Identifying the Limiting Reactant and Theoretical Yield
  problem: |
    Consider the reaction:
    2H2(g) + O2(g) → 2H2O(g)

    **Problem A: Small Reactor**
    A reactor is loaded with 25.0 g of H2 and 75.0 g of O2.
    (a) Identify the limiting reactant.
    (b) Calculate the theoretical yield of water in grams.
    (c) If 78.5 g of water is collected, what is the percent yield?

    **Problem B: Large Reactor**
    A reactor is loaded with 250.0 g of H2 and 750.0 g of O2.
    (d) Identify the limiting reactant.
    (e) Calculate the theoretical yield of water in grams.
    (f) If 785.0 g of water is collected, what is the percent yield?

    Use: H = 1.008, O = 15.999 g/mol.
  steps:
  - id: step-limiting-reactant-1
    title: 'Problem A: Step 1 — Convert both reactant masses to moles'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$

      M_{H_2} = 2(1.008) = 2.016 \text{ g/mol}

      $$

      $$

      M_{O_2} = 2(15.999) = 31.998 \text{ g/mol}

      $$

      $$

      n_{H_2} = \frac{25.0}{2.016} = 12.40 \text{ mol}

      $$

      $$

      n_{O_2} = \frac{75.0}{31.998} = 2.344 \text{ mol}

      $$

      '
  - id: step-limiting-reactant-2
    title: 'Problem A: Step 2 — Find the limiting reactant'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Calculate moles of H2O that could be produced from each reactant:


      From H2: $12.40 \text{ mol H}_2 \times \frac{2 \text{ mol H}_2\text{O}}{2 \text{
      mol H}_2} = 12.40 \text{ mol H}_2\text{O}$


      From O2: $2.344 \text{ mol O}_2 \times \frac{2 \text{ mol H}_2\text{O}}{1 \text{
      mol O}_2} = 4.688 \text{ mol H}_2\text{O}$


      **O2 produces less water → O2 is the limiting reactant.**

      '
  - id: step-limiting-reactant-3
    title: 'Problem A: Step 3 — Calculate the theoretical yield'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Maximum water = 4.688 mol H2O (determined by the limiting reactant,
      O2).


      $$

      M_{H_2O} = 18.015 \text{ g/mol}

      $$

      $$

      m_{H_2O} = 4.688 \text{ mol} \times 18.015 \text{ g/mol} = 84.4 \text{ g}

      $$


      Theoretical yield = **84.4 g of water**.

      '
  - id: step-limiting-reactant-4
    title: 'Problem A: Step 4 — Calculate the percent yield'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $$
      \%\text{ yield} = \frac{78.5 \text{ g}}{84.4 \text{ g}} \times 100\% = 93.0\%
      $$

      An excellent yield! The remaining 6.4 g difference accounts for product lost in collection.

      ![Visual representation of small reactor yield](/media/placeholders/stoich-limiting-small.svg)
  - id: step-limiting-reactant-5
    title: 'Problem B: Step 1 — Convert both reactant masses to moles'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $$
      n_{H_2} = \frac{250.0}{2.016} = 124.0 \text{ mol}
      $$
      $$
      n_{O_2} = \frac{750.0}{31.998} = 23.44 \text{ mol}
      $$
  - id: step-limiting-reactant-6
    title: 'Problem B: Step 2 — Find the limiting reactant'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      Calculate moles of H2O that could be produced from each reactant:

      From H2: $124.0 \text{ mol H}_2 \times \frac{2 \text{ mol H}_2\text{O}}{2 \text{ mol H}_2} = 124.0 \text{ mol H}_2\text{O}$

      From O2: $23.44 \text{ mol O}_2 \times \frac{2 \text{ mol H}_2\text{O}}{1 \text{ mol O}_2} = 46.88 \text{ mol H}_2\text{O}$

      **O2 produces less water → O2 is the limiting reactant.**
  - id: step-limiting-reactant-7
    title: 'Problem B: Step 3 — Calculate the theoretical yield'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      Maximum water = 46.88 mol H2O (determined by the limiting reactant, O2).
      $$
      m_{H_2O} = 46.88 \text{ mol} \times 18.015 \text{ g/mol} = 844 \text{ g}
      $$

      Theoretical yield = **844 g of water**.
  - id: step-limiting-reactant-8
    title: 'Problem B: Step 4 — Calculate the percent yield'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $$
      \%\text{ yield} = \frac{785.0 \text{ g}}{844 \text{ g}} \times 100\% = 93.0\%
      $$

      An excellent yield! The remaining 59 g difference accounts for product lost in collection.

      ![Visual representation of large reactor yield](/media/placeholders/stoich-limiting-large.svg)
  check:
    id: limiting-check
    type: numericResponse
    prompt: 'In the reaction 2Mg + O2 → 2MgO, 12.0 g of Mg reacts with 12.0 g of O2.

      What is the theoretical yield of MgO in grams?

      (Mg = 24.31, O = 15.999 g/mol; M(O2) = 31.998, M(MgO) = 40.31 g/mol)

      '
    answer:
      value: 19.94
      tolerance: 0.2
    explanation: 'n(Mg) = 12.0/24.31 = 0.4936 mol → n(MgO) from Mg = 0.4936 mol.

      n(O2) = 12.0/31.998 = 0.3750 mol → n(MgO) from O2 = 0.3750 × 2 = 0.7500 mol.

      Mg produces less → Mg is limiting. Theoretical yield MgO = 0.4936 × 40.31 =
      19.90 g ≈ 19.9 g.

      '
- id: complete-stoichiometry-problem
  title: Complete Stoichiometry — Mass to Mass with Excess Reactant
  problem: |
    Iron reacts with hydrochloric acid:
    Fe(s) + 2HCl(aq) → FeCl2(aq) + H2(g)

    **Problem A: Small Experiment**
    If 15.0 g of iron reacts with 30.0 g of HCl, calculate:
    (a) The limiting reactant
    (b) The theoretical yield of FeCl2
    (c) The mass of the excess reactant remaining after the reaction

    **Problem B: Scaled Experiment**
    If 150.0 g of iron reacts with 300.0 g of HCl, calculate:
    (d) The limiting reactant
    (e) The theoretical yield of FeCl2
    (f) The mass of the excess reactant remaining after the reaction

    Use: Fe = 55.845, H = 1.008, Cl = 35.453 g/mol
  steps:
  - id: step-complete-stoichiometry-problem-1
    title: 'Problem A: Step 1 — Moles of each reactant'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$M_{Fe} = 55.845$ g/mol; $M_{HCl} = 1.008 + 35.453 = 36.461$ g/mol


      $$

      n_{Fe} = \frac{15.0}{55.845} = 0.2686 \text{ mol}

      $$

      $$

      n_{HCl} = \frac{30.0}{36.461} = 0.8228 \text{ mol}

      $$

      '
  - id: step-complete-stoichiometry-problem-2
    title: 'Problem A: Step 2 — Identify the limiting reactant'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'The stoichiometric ratio requires 2 mol HCl per 1 mol Fe.


      HCl needed for all the Fe: $0.2686 \text{ mol Fe} \times 2 = 0.5372 \text{ mol
      HCl}$


      Available HCl = 0.8228 mol > 0.5372 mol needed.


      **All the Fe reacts; Fe is the limiting reactant.** (HCl is in excess.)

      '
  - id: step-complete-stoichiometry-problem-3
    title: 'Problem A: Step 3 — Theoretical yield of FeCl2'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$

      n_{FeCl_2} = 0.2686 \text{ mol Fe} \times \frac{1 \text{ mol FeCl}_2}{1 \text{
      mol Fe}} = 0.2686 \text{ mol}

      $$

      $$

      M_{FeCl_2} = 55.845 + 2(35.453) = 126.751 \text{ g/mol}

      $$

      $$

      m_{FeCl_2} = 0.2686 \times 126.751 = 34.04 \text{ g}

      $$

      '
  - id: step-complete-stoichiometry-problem-4
    title: 'Problem A: Step 4 — Mass of excess HCl remaining'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      HCl consumed by the Fe: 0.5372 mol HCl × 36.461 g/mol = 19.59 g

      HCl remaining = 30.0 g − 19.59 g = **10.41 g HCl remaining**

      ![Visual representation of small experiment yield](/media/placeholders/stoich-complete-small.svg)
  - id: step-complete-stoichiometry-problem-5
    title: 'Problem B: Step 1 — Moles of each reactant'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $M_{Fe} = 55.845$ g/mol; $M_{HCl} = 1.008 + 35.453 = 36.461$ g/mol

      $$
      n_{Fe} = \frac{150.0}{55.845} = 2.686 \text{ mol}
      $$
      $$
      n_{HCl} = \frac{300.0}{36.461} = 8.228 \text{ mol}
      $$
  - id: step-complete-stoichiometry-problem-6
    title: 'Problem B: Step 2 — Identify the limiting reactant'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      The stoichiometric ratio requires 2 mol HCl per 1 mol Fe.

      HCl needed for all the Fe: $2.686 \text{ mol Fe} \times 2 = 5.372 \text{ mol HCl}$

      Available HCl = 8.228 mol > 5.372 mol needed.

      **All the Fe reacts; Fe is the limiting reactant.** (HCl is in excess.)
  - id: step-complete-stoichiometry-problem-7
    title: 'Problem B: Step 3 — Theoretical yield of FeCl2'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $$
      n_{FeCl_2} = 2.686 \text{ mol Fe} \times \frac{1 \text{ mol FeCl}_2}{1 \text{ mol Fe}} = 2.686 \text{ mol}
      $$
      $$
      M_{FeCl_2} = 55.845 + 2(35.453) = 126.751 \text{ g/mol}
      $$
      $$
      m_{FeCl_2} = 2.686 \times 126.751 = 340.5 \text{ g}
      $$
  - id: step-complete-stoichiometry-problem-8
    title: 'Problem B: Step 4 — Mass of excess HCl remaining'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      HCl consumed by the Fe: 5.372 mol HCl × 36.461 g/mol = 195.9 g

      HCl remaining = 300.0 g − 195.9 g = **104.1 g HCl remaining**

      ![Visual representation of scaled experiment yield](/media/placeholders/stoich-complete-scaled.svg)
  check:
    id: excess-check
    type: numericResponse
    prompt: 'In the reaction Fe + 2HCl → FeCl2 + H2, if the limiting reactant is Fe
      (0.2686 mol) and each mole of Fe produces 1 mol of H2 (M = 2.016 g/mol), what
      mass of H2 gas is produced?

      '
    answer:
      value: 0.541
      tolerance: 0.01
    explanation: 'n(H2) = 0.2686 mol (1:1 ratio with Fe). m(H2) = 0.2686 × 2.016 =
      0.5415 g ≈ 0.541 g.

      '
