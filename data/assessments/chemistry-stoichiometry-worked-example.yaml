  check:
    id: limiting-check
    type: numericResponse
    prompt: 'In the reaction 2Mg + O2 → 2MgO, 12.0 g of Mg reacts with 12.0 g of O2.

      What is the theoretical yield of MgO in grams?

      (Mg = 24.31, O = 15.999 g/mol; M(O2) = 31.998, M(MgO) = 40.31 g/mol)

      '
    answer:
      value: 19.94
      tolerance: 0.2
    explanation: 'Solution:

      Solution:

      Solution:

      Solution:

      n(Mg) = 12.0/24.31 = 0.4936 mol → n(MgO) from Mg = 0.4936 mol.

      n(O2) = 12.0/31.998 = 0.3750 mol → n(MgO) from O2 = 0.3750 × 2 = 0.7500 mol.

      Mg produces less → Mg is limiting. Theoretical yield MgO = 0.4936 × 40.31 = 19.90 g ≈ 19.9 g.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.


