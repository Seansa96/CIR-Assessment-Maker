- id: mole-to-mole
  title: Mole-to-Mole Stoichiometry
  problem: 'The Haber process produces ammonia:

    N2(g) + 3H2(g) → 2NH3(g)


    **Problem A: Lab Scale**

    (a) How many moles of H2 are needed to produce 8.50 mol of NH3?

    (b) How many moles of N2 are consumed if 5.00 mol of H2 reacts with excess N2?


    **Problem B: Pilot Scale**

    (c) How many moles of H2 are needed to produce 850.0 mol of NH3?

    (d) How many moles of N2 are consumed if 500.0 mol of H2 reacts with excess N2?


    **Problem C: Industrial Scale**

    (e) How many moles of H2 are needed to produce 85000 mol of NH3?

    (f) How many moles of N2 are consumed if 50000 mol of H2 reacts with excess N2?

    '
  steps:
  - id: step-mole-to-mole-1
    title: Problem A (a) — Moles of H2 needed for 8.50 mol NH3
    type: numericResponse
    answer:
      value: 12.75
      tolerance: 0.0063750000000000005
    prompt: For 8.50 mol NH3, how many moles of H2 are required?
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Use coefficients in the balanced Haber equation as a mole ratio.
  - id: step-mole-to-mole-2
    title: Problem A (b) — Moles of N2 consumed by 5.00 mol H2
    type: numericResponse
    answer:
      value: 1.667
      tolerance: 0.0008335
    prompt: If 5.00 mol H2 reacts completely, how many moles of N2 are consumed? Enter three significant figures.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Choose the ratio that cancels mol H2 and leaves mol N2.
  - id: step-mole-to-mole-3
    title: Problem B (c) — Moles of H2 needed for 850.0 mol NH3
    type: numericResponse
    answer:
      value: 1275
      tolerance: 0.6375000000000001
    prompt: For 850.0 mol NH3, how many moles of H2 are required?
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: The balanced-equation coefficient ratio does not change with scale.
  - id: step-mole-to-mole-4
    title: Problem B (d) — Moles of N2 consumed by 500.0 mol H2
    type: numericResponse
    answer:
      value: 166.7
      tolerance: 0.08335
    prompt: If 500.0 mol H2 reacts completely, how many moles of N2 are consumed?
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Use the N2:H2 coefficient ratio.
