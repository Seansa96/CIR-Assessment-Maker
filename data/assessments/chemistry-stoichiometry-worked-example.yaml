- id: limiting-reactant
  title: Identifying the Limiting Reactant and Theoretical Yield
  problem: 'Consider the reaction:

    2H2(g) + O2(g) → 2H2O(g)


    **Problem A: Small Reactor**

    A reactor is loaded with 25.0 g of H2 and 75.0 g of O2.

    (a) Identify the limiting reactant.

    (b) Calculate the theoretical yield of water in grams.

    (c) If 78.5 g of water is collected, what is the percent yield?


    **Problem B: Large Reactor**

    A reactor is loaded with 250.0 g of H2 and 750.0 g of O2.

    (d) Identify the limiting reactant.

    (e) Calculate the theoretical yield of water in grams.

    (f) If 785.0 g of water is collected, what is the percent yield?


    Use: H = 1.008, O = 15.999 g/mol.

    '
  steps:
  - id: step-limiting-reactant-1
    title: 'Problem A: Step 1 — Convert both reactant masses to moles'
    type: numericResponse
    answer:
      value: 2.344
      tolerance: 0.0011719999999999999
    prompt: For Problem A, how many moles of O2 are present in 75.0 g O2? Enter four significant figures.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Divide the oxygen mass by the molar mass of O2.
  - id: step-limiting-reactant-2
    title: 'Problem A: Step 2 — Find the limiting reactant'
    type: multipleChoice
    answer:
      choiceId: b
    prompt: Which reactant limits water production in Problem A?
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.


      Why the other choices fail:

      They either reverse the stoichiometric comparison, ignore coefficients, or name a product instead of a reactant.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Compare the water amount each reactant could produce using the balanced equation.
    choices:
    - id: a
      text: H2
      issueSignals:
      - id: limiting-reactant-misidentified
        domains:
        - chemistry
    - id: b
      text: O2
    - id: c
      text: Neither; both are completely consumed.
      issueSignals:
      - id: limiting-reactant-misidentified
        domains:
        - chemistry
    - id: d
      text: H2O
      issueSignals:
      - id: limiting-reactant-misidentified
        domains:
        - chemistry
