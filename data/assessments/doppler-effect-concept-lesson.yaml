lesson:
  introduction: This lesson develops The Doppler Effect from a diagram, a mathematical model, and a calculus-based
    interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      The Doppler Effect is the change in observed frequency of a wave due to the relative motion between the source and the observer. The physical system requires defining a stationary reference frame (usually the medium, like the air) and tracking the velocities of the source and observer relative to it.
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      The measurable quantities are the speed of sound $v$, the source frequency $f_s$, the source velocity $v_s$, the observer velocity $v_o$, and the resulting observed frequency $f_o$.
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
  - id: s3
    title: Mathematical model
    content: >-
      The mathematical model combines the effects of moving observers (who intercept wavefronts faster or slower) and moving sources (who compress or stretch the emitted wavefronts). The general formula is $f_o = f_s \left( \frac{v \pm v_o}{v \mp v_s} \right)$.
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
  - id: s4
    title: Calculus connection
    content: >-
      To derive this using kinematics, assume the source emits waves with period $T = 1/f_s$. If the source moves at $v_s$ toward the observer, the distance between wave crests (the new wavelength) is $\lambda' = vT - v_s T = \frac{v - v_s}{f_s}$.
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
  - id: s5
    title: Derivation or justification
    content: >-
      If the observer is also moving toward the source at $v_o$, they measure the waves arriving at a relative speed $v' = v + v_o$. The observed frequency is $f_o = \frac{v'}{\lambda'} = \frac{v + v_o}{(v - v_s)/f_s} = f_s \left( \frac{v + v_o}{v - v_s} \right)$.
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, a moving source creates concentric spherical wavefronts that are bunched up in the direction of motion (higher frequency) and spread out behind (lower frequency), resembling a wake.
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
  - id: s7
    title: Quantitative strategy
    content: >-
      A critical quantitative strategy is signing convention. The top sign in the numerator ($+$) and denominator ($-$) corresponds to motion *toward* the other party (which should increase the frequency). The bottom signs correspond to motion *away*.
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: If $v_s = 0$ and $v_o = 0$, the formula simplifies to $f_o = f_s(v/v) = f_s$. If the source moves away at exactly the speed of sound, the observed frequency drops exactly in half. Units check: the fraction $(v \pm v_o)/(v \mp v_s)$ is dimensionless, so $f_o$ retains the units of Hz.
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
