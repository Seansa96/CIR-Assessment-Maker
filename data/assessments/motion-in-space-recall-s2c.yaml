- id: r004
  type: recognition
  prompt: In $\mathbf a=a_T\mathbf T+a_N\mathbf N$, which component measures change in speed?
  answer:
    expected: $a_T$
    expectedLatex: 
    aliases: []
    media: []
    choiceId: a
  explanation: >
    Solution: $a_T=dv/dt$ is the tangential component.


    Why it works: It measures the rate at which speed changes.


    Why the other choices fail: $a_N$ changes direction; $\mathbf T$ and $\mathbf N$ are unit vectors, not component magnitudes.
  tags: []
  skills: []
  issueSignals:
