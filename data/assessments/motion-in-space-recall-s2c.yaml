    media: []
    issueSignals: 
- id: r005
  type: recognition
  prompt: For a projectile with the positive $y$-axis upward and no air resistance, which statement is correct?
  answer:
    expected: Acceleration is $\langle0,-g\rangle$.
    expectedLatex: 
    aliases: []
    media: []
    choiceId: a
  explanation: >
    Solution: Use $\langle0,-g\rangle$.


    Why it works: Gravity is downward, so it changes the vertical component only.


    Why the other choices fail: b reverses the sign, c assigns gravity a horizontal effect, and d confuses velocity with acceleration.
  tags: []
  skills: []
  issueSignals:
  - id: gravity-sign-error
    domains: []
