    text: Acceleration is $\langle0,g\rangle$.
    media: []
    issueSignals: 
  - id: c
    text: Horizontal velocity decreases because of gravity.
    media: []
    issueSignals: 
  - id: d
    text: Acceleration equals the initial-velocity vector.
    media: []
    issueSignals: 
- id: r006
  type: recognition
  prompt: In uniform circular motion, which feature changes continuously?
  answer:
    expected: The direction of velocity
    expectedLatex: 
    aliases: []
    media: []
    choiceId: a
  explanation: >
    Solution: The velocity direction changes continuously.


    Why it works: Circular motion turns the tangent vector while preserving speed.


    Why the other choices fail: b and d are constant by definition; c is fixed for a circle.
