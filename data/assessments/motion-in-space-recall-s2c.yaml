- id: r001
  type: typed
  prompt: 'Complete the definition: $\mathbf v(t)=\underline{\hspace{1.5cm}}$ in terms of $\mathbf r(t)$.'
  answer:
    expected: r'(t)
    expectedLatex: 
    aliases:
    - \mathbf r'(t)
    - derivative of r
    media: []
    choiceId: 
  explanation: >
    Solution: $\mathbf v(t)=\mathbf r'(t)$.


    Why it works: Velocity is defined as the derivative of position.
  tags: []
  skills: []
  issueSignals:
