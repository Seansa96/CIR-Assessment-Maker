- id: r003
  type: recognition
  prompt: Which quantity is speed?
  answer:
    expected: $|\mathbf v(t)|$
    expectedLatex: 
    aliases: []
    media: []
    choiceId: a
  explanation: >
    Solution: Speed is $|\mathbf v(t)|$.


    Why it works: Magnitude removes velocity's direction and leaves a nonnegative scalar rate.


    Why the other choices fail: b is vector velocity, c is acceleration, and d is position.
  tags: []
  skills: []
