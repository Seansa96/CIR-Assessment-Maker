schemaVersion: 1
id: csharp-oop-recall
title: C# OOP Recall
assessmentType: recallDrill
categoryId: csharp
subcategoryIds:
- csharp-oop
skills:
- Apply Object-Oriented Programming in C#
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - csharp
  - csharp-oop
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  prompt: What C# feature combines a private backing field with `get` and `set` accessors
    into a clean, single declaration?
  answer:
    expected: property
    aliases:
    - properties
- id: r002
  type: typed
  prompt: What keyword must a parent class use on a method to allow child classes
    to change its behavior?
  answer:
    expected: virtual
- id: r003
  type: typed
  prompt: What keyword must a child class use to replace or change a `virtual` method
    from the parent class?
  answer:
    expected: override
- id: r004
  type: typed
  prompt: What character is used to indicate inheritance or interface implementation
    in C# (e.g., `class Hero ___ Character`)?
  answer:
    expected: ':'
    aliases:
    - colon
- id: r005
  type: typed
  prompt: What is the keyword used to define a contract that classes must implement
    (e.g., `IDamageable`)?
  answer:
    expected: interface
- id: r006
  type: typed
  prompt: What keyword is used to access methods or constructors from the parent (base)
    class?
  answer:
    expected: base
    aliases:
    - base()
- id: r007
  type: typed
  prompt: What C# keyword safely checks if an object is of a specific type or implements
    an interface, returning `true` or `false`?
  answer:
    expected: is
- id: r008
  type: flashcard
  prompt: By convention, what letter do C# interface names start with?
  answer:
    expected: I (Capital i)
