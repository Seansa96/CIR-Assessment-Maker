questions:
  - id: test-hard-parametric-solution
    type: multipleChoice
    prompt: |
      Find the general solution to the system whose augmented matrix is:
      $\begin{bmatrix} 1 & -3 & 0 & | & 5 \\ 0 & 0 & 1 & | & 2 \end{bmatrix}$
    choices:
      - id: c1
        text: '$\begin{bmatrix} x_1 \\ x_2 \\ x_3 \end{bmatrix} = \begin{bmatrix} 5 \\ 0 \\ 2 \end{bmatrix} + x_2 \begin{bmatrix} 3 \\ 1 \\ 0 \end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix} x_1 \\ x_2 \\ x_3 \end{bmatrix} = \begin{bmatrix} 5 \\ 0 \\ 2 \end{bmatrix} + x_2 \begin{bmatrix} -3 \\ 1 \\ 0 \end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix} x_1 \\ x_2 \\ x_3 \end{bmatrix} = \begin{bmatrix} 5 \\ 0 \\ 2 \end{bmatrix} + x_3 \begin{bmatrix} 3 \\ 0 \\ 1 \end{bmatrix}$'
      - id: c4
        text: 'The system is inconsistent.'
    answer:
      choiceId: c1

  - id: test-hard-consistency-condition
    type: multipleChoice
    prompt: |
      For what values of $h$ and $k$ is the following system consistent with infinitely many solutions?
      $x_1 + 3x_2 = 2$
      $2x_1 + hx_2 = k$
    choices:
      - id: c1
        text: '$h = 6, k = 4$'
      - id: c2
        text: '$h = 6$, $k$ can be any number'
      - id: c3
        text: '$h \neq 6, k = 4$'
      - id: c4
        text: '$h \neq 6$, $k$ can be any number'
    answer:
      choiceId: c1

  - id: test-hard-row-equivalence
    type: multipleChoice
    prompt: |
      If an $n \times n$ matrix $A$ is row equivalent to the $n \times n$ identity matrix $I_n$, which of the following must be true?
    choices:
      - id: c1
        text: 'The equation $A\vec{x} = \vec{0}$ has only the trivial solution $\vec{x} = \vec{0}$.'
      - id: c2
        text: 'The columns of $A$ do not span $\mathbb{R}^n$.'
      - id: c3
        text: 'The system $A\vec{x} = \vec{b}$ is inconsistent for some $\vec{b}$.'
      - id: c4
        text: 'The matrix $A$ has at least one row of zeros.'
    answer:
      choiceId: c1
