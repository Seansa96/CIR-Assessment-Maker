questions:
- id: q001
  type: multipleChoice
  prompt: 'A car starts from rest and accelerates uniformly. You know its acceleration
    and\rhow long it accelerates.


    Which equation best fits finding its final velocity?

    '
  choices:
  - id: a
    text: 'Velocity as a function of time: $(v_f=v_i+at)$'
  - id: b
    text: 'Position as a function of time: $(x=x_i+v_it+\frac12at^2)$'
  - id: c
    text: 'Velocity as a function of position: $(v^2=v_i^2+2a(x-x_i))$'
  - id: d
    text: No kinematic equation can be used
  answer:
    choiceId: a
  explanation: 'The question asks for final velocity, and the known information includes
    initial velocity, acceleration, and time.


    The equation $(v_f=v_i+at)$ directly relates those quantities. It is the cleanest
    choice because position is not needed.

    '
- id: q002
  type: multipleChoice
  prompt: 'A runner begins at a known starting position, has a known initial velocity,
    and accelerates at a constant rate for 6 seconds.


    Which equation best fits finding the runner''s final position?

    '
  choices:
  - id: a
    text: 'Position as a function of time: $(x=x_i+v_it+\frac12at^2)$'
  - id: b
    text: 'Velocity as a function of time: $(v_f=v_i+at)$'
  - id: c
    text: 'Velocity as a function of position: $(v^2=v_i^2+2a(x-x_i))$'
  - id: d
    text: Use only $(x-x_i=v_ft)$
  answer:
    choiceId: a
  explanation: 'The unknown is final position, and the scenario provides time, initial
    position, initial velocity, and acceleration.


    The position-time equation is built for this situation because it accumulates
    the effect of initial velocity and acceleration over a known time interval.

    '
- id: q003
  type: multipleChoice
  prompt: 'A motorcycle speeds up uniformly over a known distance. You know its initial
    velocity, acceleration, and displacement, but you do not know the time.


    Which equation best fits finding its final velocity?

    '
  choices:
  - id: a
    text: 'Velocity as a function of position: $(v^2=v_i^2+2a(x-x_i))$'
  - id: b
    text: 'Velocity as a function of time: $(v_f=v_i+at)$'
  - id: c
    text: 'Position as a function of time: $(x=x_i+v_it+\frac12at^2)$'
  - id: d
    text: Use all three equations in sequence
  answer:
    choiceId: a
  explanation: 'Time is not known, so an equation that does not require time is preferred.


    The equation $(v^2=v_i^2+2a(x-x_i))$ connects initial velocity, final velocity,
    acceleration, and displacement directly.

    '
- id: q004
  type: multipleChoice
  prompt: 'A ball is thrown straight upward and later returns to the same height where
    it was released.


    If you know the initial upward velocity and acceleration due to gravity, which
    approach best fits finding the total time in the air?

    '
  choices:
  - id: a
    text: Use position as a function of time and set $(x=x_i)$
  - id: b
    text: Use velocity as a function of position only
  - id: c
    text: Use position as a function of time and set $(a=0)$
  - id: d
    text: Use velocity as a function of time and set $(x=0)$
  answer:
    choiceId: a
  explanation: 'The key condition is that the final position equals the initial position
    when the ball returns to the release height.


    The position-time equation includes $(x)$, $(x_i)$, $(v_i)$, $(a)$, and $(t)$,
    so setting $(x=x_i)$ leaves an equation that can be solved for the flight time.
    This also usually produces two time values: the launch time and the return time.

    '
- id: q005
  type: multipleChoice
  prompt: 'A train is moving forward and brakes with constant acceleration until it
    stops.


    If you know the initial velocity and braking acceleration, which equation best
    fits finding the stopping time?

    '
  choices:
  - id: a
    text: Velocity as a function of time, with $(v_f=0)$
  - id: b
    text: Position as a function of time, with $(x=x_i)$
  - id: c
    text: Velocity as a function of position, with $(x=x_i)$
  - id: d
    text: None, because braking motion is not constant-acceleration motion
  answer:
    choiceId: a
  explanation: 'The stopping condition is a velocity condition: final velocity is
    zero.


    Since the known information is initial velocity and acceleration, $(v_f=v_i+at)$
    can be used directly by substituting $(v_f=0)$ and solving for $(t)$.

    '
- id: q006
  type: multipleChoice
  prompt: 'A train is moving forward and brakes with constant acceleration until it
    stops.


    If you know the initial velocity and braking acceleration, which equation best
    fits finding the stopping distance without first finding time?

    '
  choices:
  - id: a
    text: Velocity as a function of position, with $(v=0)$
  - id: b
    text: Velocity as a function of time, with $(t=0)$
  - id: c
    text: Position as a function of time, with $(v_i=0)$
  - id: d
    text: Position as a function of time only
  answer:
    choiceId: a
  explanation: 'Stopping distance is a displacement, but the scenario asks for it
    without first finding time.


    The equation $(v^2=v_i^2+2a(x-x_i))$ is ideal because it relates velocity and
    position directly. Setting the final velocity to zero gives an equation for the
    stopping displacement.

    '
- id: q007
  type: multipleChoice
  prompt: 'A dropped object starts from rest and falls for a known amount of time.


    Which equation best fits finding\rhow far it falls?

    '
  choices:
  - id: a
    text: 'Position as a function of time: $(x=x_i+v_it+\frac12at^2)$'
  - id: b
    text: 'Velocity as a function of time: $(v_f=v_i+at)$'
  - id: c
    text: 'Velocity as a function of position: $(v^2=v_i^2+2a(x-x_i))$'
  - id: d
    text: Use no acceleration term because the object starts from rest
  answer:
    choiceId: a
  explanation: 'The question asks for a change in position over a known time interval.


    Even though the object starts from rest, acceleration still affects the distance
    fallen. The position-time equation includes the $(\frac12at^2)$ term that accounts
    for that changing velocity.

    '
- id: q008
  type: multipleChoice
  prompt: 'A dropped object falls from a known height. You want its speed right before
    hitting the ground, but you do not need to know\rhow long it falls.


    Which equation best fits?

    '
  choices:
  - id: a
    text: 'Velocity as a function of position: $(v^2=v_i^2+2a(x-x_i))$'
  - id: b
    text: 'Velocity as a function of time: $(v_f=v_i+at)$'
  - id: c
    text: 'Position as a function of time: $(x=x_i+v_it+\frac12at^2)$'
  - id: d
    text: All equations are equally direct
  answer:
    choiceId: a
  explanation: 'The scenario gives a position change and asks for final speed, while
    time is not required.


    The velocity-position equation connects final velocity to displacement and acceleration
    without introducing time as an extra unknown.

    '
- id: q009
  type: multipleChoice
  prompt: 'A cart moves with known initial velocity and known acceleration. You are
    asked to find both its position and velocity after 4 seconds.


    Which approach best fits?

    '
  choices:
  - id: a
    text: Use $(v_f=v_i+at)$ for velocity and $(x=x_i+v_it+\frac12at^2)$ for position
  - id: b
    text: Use only $(v^2=v_i^2+2a(x-x_i))$
  - id: c
    text: Use only $(x=x_i+v_it+\frac12at^2)$
  - id: d
    text: Use only $(v_f=v_i+at)$
  answer:
    choiceId: a
  explanation: 'There are two requested unknowns: final velocity and final position.


    Because the time is known, $(v_f=v_i+at)$ directly gives final velocity, while
    $(x=x_i+v_it+\frac12at^2)$ directly gives final position. The velocity-position
    equation is not the most direct because displacement is not the only requested
    quantity.

    '
- id: q010
  type: multipleChoice
  prompt: 'A car reaches a known final speed after accelerating uniformly from a known
    initial speed. You also know the distance traveled during that speed change, but
    not the time.


    Which equation best fits finding the acceleration?

    '
  choices:
  - id: a
    text: 'Velocity as a function of position: $(v^2=v_i^2+2a(x-x_i))$'
  - id: b
    text: 'Velocity as a function of time: $(v_f=v_i+at)$'
  - id: c
    text: 'Position as a function of time: $(x=x_i+v_it+\frac12at^2)$'
  - id: d
    text: Use the position-time equation twice
  answer:
    choiceId: a
  explanation: 'The known quantities are initial velocity, final velocity, and displacement.
    Time is not known.


    The velocity-position equation is designed for exactly this kind of situation
    because it can be solved for acceleration using the change in $(v^2)$ over a displacement.

    '
