workedExamples:
- id: reinforcement-interference-we1
  title: Add overlapping pulses
  problem: At one instant two pulses overlap at a point. Their signed displacements there are $+3\,\mathrm{cm}$ and $-5\,\mathrm{cm}$.
  steps:
  - id: reinforcement-interference-we1-s1
    title: Apply superposition
    instruction: Add the signed displacements, preserving the direction of each pulse.
    hint: Superposition is algebraic for the displacement at a point.
    type: multipleChoice
    prompt: What is the resulting displacement?
    choices:
    - { id: a, text: '$-2\,\mathrm{cm}$' }
    - { id: b, text: '$+8\,\mathrm{cm}$', issueSignals: [{ id: physics1-interference-sign-ignored, domains: [physics-1] }] }
    - { id: c, text: '$+2\,\mathrm{cm}$', issueSignals: [{ id: physics1-interference-sign-reversed, domains: [physics-1] }] }
    - { id: d, text: '$-15\,\mathrm{cm}$', issueSignals: [{ id: physics1-interference-multiplication, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: $y_{\mathrm{net}}=3+(-5)=-2\,\mathrm{cm}$. Why it works: Displacements add with their signs. Why the other choices fail: ignore the negative pulse, reverse the result, or multiply amplitudes.'
  - id: reinforcement-interference-we1-s2
    title: Classify the overlap
    instruction: Compare the result with the larger pulse and identify the interference type.
    hint: Opposite-sign pulses partially cancel.
    type: multipleChoice
    prompt: How should this overlap be described?
    choices:
    - { id: a, text: 'Destructive interference with a 2 cm downward result' }
    - { id: b, text: 'Constructive interference with an 8 cm result', issueSignals: [{ id: physics1-interference-type-reversal, domains: [physics-1] }] }
    - { id: c, text: 'No interference because the pulses have different signs', issueSignals: [{ id: physics1-interference-no-superposition, domains: [physics-1] }] }
    - { id: d, text: 'Destructive interference that must give zero', issueSignals: [{ id: physics1-interference-cancellation-too-strong, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: The pulses partially cancel, leaving $2\,\mathrm{cm}$ downward, so the overlap is destructive. Why it works: Complete cancellation requires equal magnitudes. Why the other choices fail: reverse the type, deny superposition, or assume unequal pulses cancel completely.'
- id: reinforcement-interference-we2
  title: Reflection from a fixed end
  problem: A positive pulse reaches a rigid fixed end of a string.
  steps:
  - id: reinforcement-interference-we2-s1
    title: Determine the reflected pulse
    instruction: Apply the fixed-end displacement boundary condition.
    hint: The endpoint must remain at zero displacement.
    type: multipleChoice
    prompt: What does the reflected pulse do?
    choices:
    - { id: a, text: 'It is inverted relative to the incident pulse' }
    - { id: b, text: 'It returns upright with the same sign', issueSignals: [{ id: physics1-interference-fixed-end-inversion, domains: [physics-1] }] }
    - { id: c, text: 'It disappears before reflection', issueSignals: [{ id: physics1-interference-boundary-absorption, domains: [physics-1] }] }
    - { id: d, text: 'Its speed reverses but its displacement shape cannot change', issueSignals: [{ id: physics1-interference-reflection-shape, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: A fixed end reflects the pulse inverted. Why it works: The reflected and incident displacements cancel at the immovable endpoint. Why the other choices fail: omit inversion, replace reflection with absorption, or confuse travel direction with pulse sign.'
  - id: reinforcement-interference-we2-s2
    title: Locate a node
    instruction: Use the standing-wave definition after equal counter-propagating waves interfere.
    hint: A node has zero displacement for all times.
    type: multipleChoice
    prompt: Which location is a node in the resulting standing wave?
    choices:
    - { id: a, text: 'A point where the two contributions always cancel' }
    - { id: b, text: 'A point where the amplitude is largest', issueSignals: [{ id: physics1-interference-node-antinode, domains: [physics-1] }] }
    - { id: c, text: 'Any point where the waves momentarily point upward', issueSignals: [{ id: physics1-interference-instantaneous-node, domains: [physics-1] }] }
    - { id: d, text: 'Only the point halfway between the sources', issueSignals: [{ id: physics1-interference-node-location, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: A node is a location where destructive contributions cancel at every time. Why it works: The defining property is zero oscillation amplitude. Why the other choices fail: describe an antinode, a momentary state, or an unjustified special location.'
