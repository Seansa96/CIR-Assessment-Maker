questions:
  - id: q-polar-calc-quiz-1
    type: multipleChoice
    title: Area Formula
    prompt: |
      Which formula represents the area bounded by the polar curve $r = f(\theta)$ between the rays $\theta = a$ and $\theta = b$?
    choices:
      - id: c1
        text: '$\frac{1}{2} \int_{a}^{b} [f(\theta)]^2 \, d\theta$'
      - id: c2
        text: '$\int_{a}^{b} \pi [f(\theta)]^2 \, d\theta$'
      - id: c3
        text: '$\int_{a}^{b} f(\theta) \, d\theta$'
      - id: c4
        text: '$\frac{1}{2} \int_{a}^{b} f(\theta) \, d\theta$'
    answer:
      choiceId: c1
    explanation: |
      The area of a polar sector is $A = \frac{1}{2}r^2\theta$. Extending this via calculus, the total area bounded by a polar curve is $A = \frac{1}{2} \int_{a}^{b} r^2 \, d\theta = \frac{1}{2} \int_{a}^{b} [f(\theta)]^2 \, d\theta$.
    skills:
      - polar-calculus

  - id: q-polar-calc-quiz-2
    type: multipleChoice
    title: Arc Length Formula
    prompt: |
      Which integral represents the arc length of the polar curve $r = f(\theta)$ from $\theta = a$ to $\theta = b$?
    choices:
      - id: c1
        text: '$\int_{a}^{b} \sqrt{r^2 + \left(\frac{dr}{d\theta}\right)^2} \, d\theta$'
      - id: c2
        text: '$\int_{a}^{b} \sqrt{1 + \left(\frac{dr}{d\theta}\right)^2} \, d\theta$'
      - id: c3
        text: '$\int_{a}^{b} \sqrt{r^2 - \left(\frac{dr}{d\theta}\right)^2} \, d\theta$'
      - id: c4
        text: '$\int_{a}^{b} \left( r + \frac{dr}{d\theta} \right) \, d\theta$'
    answer:
      choiceId: c1
    explanation: |
      Converting the parametric arc length formula $\sqrt{(dx/dt)^2 + (dy/dt)^2}$ into polar coordinates gives $L = \int_{a}^{b} \sqrt{r^2 + \left(\frac{dr}{d\theta}\right)^2} \, d\theta$.
    skills:
      - polar-calculus

  - id: q-polar-calc-quiz-3
    type: multipleChoice
    title: Tangent Line dy/dx
    prompt: |
      To find the slope of the tangent line to a polar curve $r = f(\theta)$, we use $\frac{dy}{dx}$. 
      How is $\frac{dy}{dx}$ expressed in polar coordinates?
    choices:
      - id: c1
        text: '$\frac{\frac{dr}{d\theta}\sin\theta + r\cos\theta}{\frac{dr}{d\theta}\cos\theta - r\sin\theta}$'
      - id: c2
        text: '$\frac{\frac{dr}{d\theta}\cos\theta - r\sin\theta}{\frac{dr}{d\theta}\sin\theta + r\cos\theta}$'
      - id: c3
        text: '$\frac{\frac{dr}{d\theta}}{r}$'
      - id: c4
        text: '$\frac{r\sin\theta}{\frac{dr}{d\theta}\cos\theta}$'
    answer:
      choiceId: c1
    explanation: |
      Since $x = r\cos\theta$ and $y = r\sin\theta$, we use the product rule on both.
      $\frac{dx}{d\theta} = \frac{dr}{d\theta}\cos\theta - r\sin\theta$
      $\frac{dy}{d\theta} = \frac{dr}{d\theta}\sin\theta + r\cos\theta$
      
      Therefore, $\frac{dy}{dx} = \frac{dy/d\theta}{dx/d\theta} = \frac{\frac{dr}{d\theta}\sin\theta + r\cos\theta}{\frac{dr}{d\theta}\cos\theta - r\sin\theta}$.
    skills:
      - polar-calculus

  - id: q-polar-calc-quiz-4
    type: numericResponse
    title: Setting up an Area Integral
    prompt: |
      Set up the integral for the area bounded by the graph of $r = 4\cos\theta$ and the lines $\theta = 0$ and $\theta = \frac{\pi}{4}$.
      
      What is the value of the integral?
    answer:
      value: 5.14159
      tolerance: 0.05
    explanation: |
      The area is $A = \frac{1}{2} \int_{0}^{\pi/4} (4\cos\theta)^2 \, d\theta$.
      $A = \frac{1}{2} \int_{0}^{\pi/4} 16\cos^2\theta \, d\theta = 8 \int_{0}^{\pi/4} \frac{1 + \cos(2\theta)}{2} \, d\theta$.
      $A = 4 \left[ \theta + \frac{1}{2}\sin(2\theta) \right]_0^{\pi/4} = 4 \left( \frac{\pi}{4} + \frac{1}{2}(1) \right) = \pi + 2$.
      $\pi + 2 \approx 3.14159 + 2 = 5.14159$.
