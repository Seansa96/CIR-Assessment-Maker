  type: freeResponse
  prompt: A spring has natural length 2 m. A force of 20 N stretches it by 1 m. Find
    the work done stretching it 2 m.
  answer:
    gradingMode: selfCheck
    checkModel: 40 J
  explanation: Find the spring constant k, then integrate kx from 0 to a.
- id: q002
  type: freeResponse
  prompt: Find the area bounded by y = 4x^2 and y = 6x.
  answer:
    gradingMode: selfCheck
    checkModel: '2.25'
  explanation: Find intersections and integrate the difference of the functions.
