items:
  - id: distillation-definition
    type: flashcard
    prompt: |
      Which separation method is most associated with this idea?
      
      The more volatile component vaporizes first, then condenses in a cooler region.
    answer:
      expected: |
        Distillation
    explanation: |
      Distillation is most useful for separating liquids, or a solvent from dissolved solute, when components have meaningfully different boiling points. It works because the more volatile component vaporizes first, then condenses in a cooler region.
    tags:
      - separation-methods
      - distillation
  - id: decantation-definition
    type: flashcard
    prompt: |
      Which separation method is most associated with this idea?
      
      Gravity lets the denser phase settle, so the upper layer can be poured off carefully.
    answer:
      expected: |
        Decantation
    explanation: |
      Decantation is most useful for separating a liquid from a settled solid or from an immiscible liquid layer. It works because gravity lets the denser phase settle, so the upper layer can be poured off carefully.
    tags:
      - separation-methods
      - decantation
  - id: centrifugation-definition
    type: flashcard
    prompt: |
      Which separation method is most associated with this idea?
      
      Rapid spinning creates a strong effective outward acceleration that drives denser material outward faster than gravity alone.
    answer:
      expected: |
        Centrifugation
    explanation: |
      Centrifugation is most useful for speeding up separation of suspended particles or liquids with different densities. It works because rapid spinning creates a strong effective outward acceleration that drives denser material outward faster than gravity alone.
    tags:
      - separation-methods
      - centrifugation
  - id: fractional-crystallization-definition
    type: flashcard
    prompt: |
      Which separation method is most associated with this idea?
      
      As a solution cools or evaporates, the least soluble component reaches saturation and crystallizes first.
    answer:
      expected: |
        Fractional Crystallization
    explanation: |
      Fractional Crystallization is most useful for separating dissolved solids whose solubilities change differently with temperature. It works because as a solution cools or evaporates, the least soluble component reaches saturation and crystallizes first.
    tags:
      - separation-methods
      - fractional-crystallization
  - id: evaporation-definition
    type: flashcard
    prompt: |
      Which separation method is most associated with this idea?
      
      The solvent escapes as vapor, leaving the nonvolatile solute behind.
    answer:
      expected: |
        Evaporation
    explanation: |
      Evaporation is most useful for recovering a dissolved solid when the solvent can be removed and the solvent does not need to be collected. It works because the solvent escapes as vapor, leaving the nonvolatile solute behind.
    tags:
      - separation-methods
      - evaporation
  - id: extraction-definition
    type: flashcard
    prompt: |
      Which separation method is most associated with this idea?
      
      Different substances partition differently between solvents or phases.
    answer:
      expected: |
        Extraction
    explanation: |
      Extraction is most useful for moving a target substance into a solvent where it is more soluble. It works because different substances partition differently between solvents or phases.
    tags:
      - separation-methods
      - extraction
  - id: sublimation-definition
    type: flashcard
    prompt: |
      Which separation method is most associated with this idea?
      
      One component has enough vapor pressure to sublime and then redeposit on a cooler surface.
    answer:
      expected: |
        Sublimation
    explanation: |
      Sublimation is most useful for separating a solid that can pass directly into vapor from solids that cannot. It works because one component has enough vapor pressure to sublime and then redeposit on a cooler surface.
    tags:
      - separation-methods
      - sublimation
  - id: filtration-definition
    type: flashcard
    prompt: |
      Which separation method is most associated with this idea?
      
      The filter pores allow the fluid through but retain particles larger than the pore size.
    answer:
      expected: |
        Filtration
    explanation: |
      Filtration is most useful for separating an insoluble solid from a liquid or gas. It works because the filter pores allow the fluid through but retain particles larger than the pore size.
    tags:
      - separation-methods
      - filtration
  - id: chromatography-definition
    type: flashcard
    prompt: |
      Which separation method is most associated with this idea?
      
      Components travel at different speeds because they have different attractions to the stationary and mobile phases.
    answer:
      expected: |
        Chromatography
    explanation: |
      Chromatography is most useful for separating small amounts of mixture components for identification or purification. It works because components travel at different speeds because they have different attractions to the stationary and mobile phases.
    tags:
      - separation-methods
      - chromatography
