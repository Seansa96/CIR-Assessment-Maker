questions:
- id: q001
  type: freeResponse
  prompt: 'For real p, classify $\int_0^\infty x^p/(1+x^2)dx$. Prove necessity and sufficiency of every condition.'
  answer: { gradingMode: selfCheck, checkModel: 'Converges exactly for -1<p<1; compare to x^p near zero and x^(p-2) at infinity.' }
  explanation: 'Split at one. On (0,1), the denominator is bounded above and below by positive constants, so the integrand has x to p behavior and requires p>-1. On (1,infinity), it has x to p minus two behavior and requires p<1. Direct comparison in both directions proves that the intersection is necessary and sufficient.'
  difficultyDimensions: [casePartition, representationTransfer, parameterThreshold, estimationOrBounds, proofJustification]
  subjectDifficultyTags: [twoEndpointAsymptotics]
  difficultyEvidence: requires two local comparison proofs, two threshold inequalities, and a global intersection argument.
  extensionObjectiveIds: [calc2-asymptotic-analysis]
- id: q002
  type: freeResponse
  prompt: 'Evaluate $\int_0^\infty x^{3/2}e^{-x}dx$ using the Gamma function, and justify convergence at both endpoints.'
  answer: { gradingMode: selfCheck, checkModel: '$\Gamma(5/2)=3\sqrt\pi/4$.' }
  explanation: 'Near zero, x to the three-halves is integrable; at infinity the exponential dominates every polynomial power. The integral is Gamma of five-halves. Apply the recurrence twice: Gamma(5/2)=3/2 Gamma(3/2)=3/4 Gamma(1/2)=3 square-root pi over 4.'
  difficultyDimensions: [representationTransfer, auxiliaryTechnique, domainCondition, reverseReasoning, proofJustification]
  subjectDifficultyTags: [gammaFunction, recurrence]
  difficultyEvidence: checks two endpoints, identifies a special-function representation, maps the exponent, and repeatedly applies the recurrence.
  extensionObjectiveIds: [calc2-gamma-function]
- id: q003
  type: freeResponse
  prompt: 'Prove that $\int_0^\infty\sin x/x\,dx$ is not absolutely convergent. Then state why this fact alone does not decide ordinary convergence.'
  answer: { gradingMode: selfCheck, checkModel: 'Absolute divergence follows by lower-bounding |sin x| on infinitely many intervals; ordinary convergence requires a separate oscillatory argument such as Dirichlet test.' }
  explanation: 'On a fixed positive-length subinterval of each period, absolute sine is bounded below by a positive constant. Summing the resulting harmonic-size lower bounds proves divergence of the absolute integral. That removes absolute convergence only; conditional convergence is a separate question requiring cancellation control, for example through Dirichlet’s test.'
  difficultyDimensions: [estimationOrBounds, proofJustification, globalLocalReasoning, representationTransfer, errorDiagnosis]
  subjectDifficultyTags: [oscillation, dirichletTest]
  difficultyEvidence: creates periodic lower bounds, transfers them to harmonic divergence, distinguishes absolute from ordinary convergence, and names the needed extension method.
  extensionObjectiveIds: [calc2-dirichlet-test]
- id: q004
  type: freeResponse
  prompt: 'Show that the Cauchy principal value of $\int_{-\infty}^{\infty}x/(1+x^2)dx$ is zero, but that the ordinary improper integral diverges.'
  answer: { gradingMode: selfCheck, checkModel: 'Symmetric cutoffs integrate to zero by oddness; separate one-sided logarithmic tails diverge.' }
  explanation: 'For every R, the integral from -R to R is zero because the integrand is odd, so the symmetric-cutoff limit is zero. Ordinary convergence instead splits at zero: the right tail has one-half ln(1+R squared), which diverges, and the left tail diverges oppositely. The definitions are different and cannot be interchanged.'
  difficultyDimensions: [casePartition, representationTransfer, proofJustification, errorDiagnosis, globalLocalReasoning]
  subjectDifficultyTags: [principalValue, parity]
  difficultyEvidence: compares two limiting procedures, computes a tail divergence, and diagnoses invalid symmetry reasoning.
  extensionObjectiveIds: [calc2-cauchy-principal-value]
- id: q005
  type: freeResponse
  prompt: 'For p real, determine when $\int_0^1[\ln(1/x)]^pdx$ converges, then evaluate it for p=2.'
  answer: { gradingMode: selfCheck, checkModel: 'Converges iff p>-1; for p=2 the value is 2.' }
  explanation: 'Use u=ln(1/x), which turns the integral into $\int_0^\infty u^pe^{-u}du$. Near u=0 it requires p>-1, while exponential decay settles infinity. At p=2 it is Gamma(3), equal to 2 factorial, hence 2. This exposes a hidden Gamma structure behind the original endpoint logarithm.'
  difficultyDimensions: [auxiliaryTechnique, representationTransfer, parameterThreshold, domainCondition, reverseReasoning]
  subjectDifficultyTags: [logarithmicSubstitution, gammaFunction]
  difficultyEvidence: reverses endpoint limits, identifies the special-function form, resolves a local threshold, and evaluates a parameter specialization.
  extensionObjectiveIds: [calc2-gamma-function]
