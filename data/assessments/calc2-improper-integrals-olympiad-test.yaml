questions:
- id: q001
  type: freeResponse
  skills:
  - improper-integrals
  - olympiad-problem-solving
  prompt: Determine whether $\int_1^\infty \frac{dx}{x^2}$ converges, and find its value if it does.
  answer:
    gradingMode: selfCheck
    expected: It converges and equals $\frac1{1}$.
    keyPoints:
    - 'Matches the reference result: It converges and equals $\frac1{1}$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: For $2>1$, evaluate the limit of $[-x^{1-2}/(1)]_1^b$ as $b\to\infty$; the term at $b$ tends to zero.
