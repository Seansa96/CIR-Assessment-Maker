questions:
- id: q001
  title: Apply Design requirements
  type: multipleChoice
  prompt: A system design discussion mentions **Design requirements**. Which conclusion is most defensible?
  choices:
  - id: a
    text: Optimizing one goal can stress another.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: Optimizing one goal can stress another. This is why Design requirements matters in Operating System Design.
