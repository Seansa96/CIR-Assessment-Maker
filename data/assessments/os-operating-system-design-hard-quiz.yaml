- id: q006
  title: Select Valid OS Reasoning
  type: selectAll
  prompt: Which reasoning habits are valid when analyzing Operating System Design?
  choices:
  - id: a
    text: Name the protected resource or shared state.
  - id: b
    text: Separate mechanism from policy when possible.
  - id: c
    text: Check blocking, failure, permission, or boundary cases.
  - id: d
    text: Assume faster hardware removes all OS design tradeoffs.
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: OS design questions usually involve resources, mechanisms, policies, and boundary cases.
- id: q007
  title: Scenario Explanation
  type: freeResponse
  prompt: 'Explain how you would analyze this scenario: A small OS project is becoming a production system. Decide where to optimize, where to keep interfaces stable, and how to separate mechanism from policy.'
  answer:
    expected: A strong answer identifies the OS-managed resource, names the relevant Operating System Design mechanism, describes the tradeoff, and checks a boundary or failure case.
    gradingMode: selfCheck
    keyPoints:
    - Identifies resource
    - Names mechanism
    - Mentions tradeoff
    - Checks boundary or failure case
  explanation: 'Related topic: Operating System Design.'
- id: q008
  title: 'Misconception: Design requirements'
  type: multipleChoice
  prompt: Which misconception is most dangerous when reasoning about **Design requirements**?
  choices:
  - id: a
    text: Treating the concept as a label instead of an OS mechanism with costs and boundaries.
  - id: b
    text: Asking what resource is controlled.
  - id: c
    text: Checking whether the mechanism can fail or block.
  - id: d
    text: Separating user-visible behavior from kernel-mediated work.
  answer:
    choiceId: a
  explanation: The correct reasoning must connect Design requirements to mechanism and tradeoff.
