workedExamples:
- id: we001
  title: Trace a Arrays, Strings, and Contiguous Storage decision
  problem: 'Work through a realistic case: a desktop list that must render and filter quickly. Select an approach, preserve its invariant, and explain the tradeoff.'
  steps:
  - title: Recognize the workload
    instruction: Trace the decision before writing code.
    type: multipleChoice
    prompt: 'Which requirement matters most in this scenario: a desktop list that must render and filter quickly?'
    choices:
    - id: a
      text: The access pattern and bound
    - id: b
      text: The name of the structure
    - id: c
      text: Skip boundary tests
    - id: d
      text: Assume infinite memory
    answer:
      choiceId: a
    explanation: The access pattern and bound. The trace follows the module invariant and workload.
    id: step-1
  - title: Protect the invariant
    instruction: Trace the decision before writing code.
    type: multipleChoice
    prompt: What must the update preserve?
    choices:
    - id: a
      text: valid elements occupy predictable positions and indices stay in bounds
    - id: b
      text: Only the output formatting
    - id: c
      text: Skip boundary tests
    - id: d
      text: Assume infinite memory
    answer:
      choiceId: a
    explanation: valid elements occupy predictable positions and indices stay in bounds. The trace follows the module invariant and workload.
    id: step-2
  - title: Choose the implementation
    instruction: Trace the decision before writing code.
    type: multipleChoice
    prompt: Which implementation action fits Arrays, Strings, and Contiguous Storage?
    choices:
    - id: a
      text: two pointers over a list
    - id: b
      text: Scan unrelated data repeatedly
    - id: c
      text: Skip boundary tests
    - id: d
      text: Assume infinite memory
    answer:
      choiceId: a
    explanation: two pointers over a list. The trace follows the module invariant and workload.
    id: step-3
