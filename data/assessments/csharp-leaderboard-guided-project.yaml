title: C# LINQ Leaderboard Guided Project
assessmentType: guidedProject
categoryId: csharp
subcategoryIds:
- csharp-standard-library
modeDefault: practice
randomizeQuestions: false
guidedProject:
  language: cpp
  instructions: "Build a `Leaderboard` using LINQ!\n\nRequired project behavior:\n\
    - In `Leaderboard.cs`, you are provided with a `Player` class and a `LeaderboardManager`\
    \ class.\n- Implement the `GetTopThree(List<Player> players)` method.\n  - Return\
    \ a `List<string>` containing exactly the names of the top 3 players by score\
    \ (highest to lowest).\n  - Use LINQ `.OrderByDescending()`, `.Select()`, and\
    \ `.Take()` to do this in a single chain!\n- Implement the `GetAverageScore(List<Player>\
    \ players)` method.\n  - Return a `double`.\n  - If the list is empty, return\
    \ 0.0.\n  - Otherwise, use LINQ `.Average()` or a combination of `.Sum()` and\
    \ `.Count()` to calculate the average score.\n"
  requiredChecks:
  - id: compile-check
    title: Compile
    description: Compiles correctly.
    expectedOutputContains:
    - OK
  files:
  - path: Leaderboard.cs
    readOnly: false
    content: "using System.Collections.Generic;\nusing System.Linq;\n\npublic class\
      \ Player\n{\n    public string Name { get; set; }\n    public int Score { get;\
      \ set; }\n}\n\npublic class LeaderboardManager\n{\n    public List<string> GetTopThree(List<Player>\
      \ players)\n    {\n        // TODO: Return a list of the top 3 player names,\
      \ sorted by score descending\n        return new List<string>();\n    }\n  \
      \  \n    public double GetAverageScore(List<Player> players)\n    {\n      \
      \  // TODO: Return the average score. Handle empty list gracefully.\n      \
      \  return 0.0;\n    }\n}\n"
  - path: Program.cs
    readOnly: true
    content: "using System;\nusing System.Collections.Generic;\n\npublic class Program\n\
      {\n    public static void Main()\n    {\n        var manager = new LeaderboardManager();\n\
      \        var players = new List<Player>\n        {\n            new Player {\
      \ Name = \"Alice\", Score = 500 },\n            new Player { Name = \"Bob\"\
      , Score = 1500 },\n            new Player { Name = \"Charlie\", Score = 200\
      \ },\n            new Player { Name = \"Dave\", Score = 1000 }\n        };\n\
      \        \n        var top3 = manager.GetTopThree(players);\n        if (top3.Count\
      \ != 3) throw new Exception(\"Expected exactly 3 names.\");\n        if (top3[0]\
      \ != \"Bob\") throw new Exception($\"Expected Bob first, got {top3[0]}\");\n\
      \        if (top3[1] != \"Dave\") throw new Exception($\"Expected Dave second,\
      \ got {top3[1]}\");\n        if (top3[2] != \"Alice\") throw new Exception($\"\
      Expected Alice third, got {top3[2]}\");\n        \n        double avg = manager.GetAverageScore(players);\n\
      \        if (Math.Abs(avg - 800.0) > 0.01) throw new Exception($\"Expected average\
      \ 800, got {avg}\");\n        \n        double emptyAvg = manager.GetAverageScore(new\
      \ List<Player>());\n        if (Math.Abs(emptyAvg - 0.0) > 0.01) throw new Exception($\"\
      Expected empty average 0, got {emptyAvg}\");\n        \n        Console.WriteLine(\"\
      All tests passed!\");\n    }\n}\n"
