- id: we1
  title: Current Growth in an RL Circuit
  steps:
  - id: s1
    prompt: Calculate the time constant and use the current equation.
    explanation: 'Solution:

      1) Time constant $\tau = L/R = 2.0 / 10 = 0.2\text{ s}$.

      2) Max current $I_{max} = \mathcal{E}/R = 12 / 10 = 1.2\text{ A}$.

      3) The current equation is $i(t) = I_{max} (1 - e^{-t/\tau})$.

      4) At $t = 0.2\text{ s}$ ($t = \tau$), $i(0.2) = 1.2 (1 - e^{-1}) \approx 1.2(1 - 0.368) = 1.2(0.632)
      = 0.758\text{ A}$.


      Why it works:

      The inductor opposes the sudden rise in current, causing an exponential approach to the steady-state
      value.'
    title: Calculate the time constant and use the current equation.
    instruction: 'Work through this step: Calculate the time constant and use the current equation.'
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: An inductor with $L = 2.0\text{ H}$ and a resistor with $R = 10\text{ }\Omega$ are connected
    in series with a $12\text{ V}$ battery. What is the current at $t = 0.2\text{ s}$ after the switch
    is closed?
