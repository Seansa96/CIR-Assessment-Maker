schemaVersion: 1
id: precalculus-parametric-standard-forms-recall
title: Parametric Standard Forms Recall
assessmentType: recallDrill
categoryId: precalculus
subcategoryIds:
  - precalc-parametric
modeDefault: practice
randomizeQuestions: false
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
    - precalc-parametric
    - parametric-standard-forms
skills:
  - parametric-standard-forms
  - parametric-orientation
  - parametric-elimination
items:
  - id: what-parametric-means-flashcard
    type: flashcard
    prompt: |
      What does it mean to describe a curve parametrically?
    answer:
      expected: Each coordinate is written as a function of a parameter, usually $x=x(t)$ and $y=y(t)$.
    explanation: |
      Instead of writing $y$ directly as a function of $x$, both coordinates are driven by a third variable.
    tags:
      - parametric-standard-forms

  - id: basic-coordinate-functions-cloze
    type: cloze
    prompt: |
      Complete the standard notation for a plane parametric curve:

      $$
      x=\_\_\_\_,\qquad y=g(t)
      $$
    answer:
      expected: f(t)
      aliases:
        - f of t
    explanation: |
      A common notation is $x=f(t)$ and $y=g(t)$.
    tags:
      - parametric-standard-forms

  - id: line-through-point-symbolic
    type: symbolic
    prompt: |
      Recall the parametric form of a line through $(x_0,y_0)$ with direction vector $\langle a,b\rangle$.
    answer:
      expectedLatex: 'x=x_0+at,\ y=y_0+bt'
      aliases:
        - x equals x0 plus at and y equals y0 plus bt
    explanation: |
      The starting point anchors the line, and the direction vector controls how the point moves as $t$ changes.
    tags:
      - parametric-standard-forms
      - lines

  - id: line-segment-symbolic
    type: symbolic
    prompt: |
      Recall the interpolation form for a line segment from $(x_0,y_0)$ to $(x_1,y_1)$.
    answer:
      expectedLatex: 'x=(1-t)x_0+tx_1,\ y=(1-t)y_0+ty_1,\ 0\le t\le 1'
      aliases:
        - one minus t times first point plus t times second point
    explanation: |
      This form blends the first point into the second point as $t$ moves from $0$ to $1$.
    tags:
      - parametric-standard-forms
      - line-segments

  - id: circle-center-radius-symbolic
    type: symbolic
    prompt: |
      Recall the standard circle parametrization centered at $(h,k)$ with radius $r$.
    answer:
      expectedLatex: 'x=h+r\cos t,\ y=k+r\sin t'
      aliases:
        - x equals h plus r cosine t and y equals k plus r sine t
    explanation: |
      This is the unit circle shifted to $(h,k)$ and scaled by radius $r$.
    tags:
      - parametric-standard-forms
      - circles

  - id: circle-start-point-cloze
    type: cloze
    prompt: |
      For $x=h+r\cos t,\ y=k+r\sin t$, the point at $t=0$ is $(h+\_\_\_\_,k)$.
    answer:
      expected: r
      aliases:
        - radius
    explanation: |
      Since $\cos 0=1$ and $\sin 0=0$, the curve begins at the rightmost point of the circle.
    tags:
      - parametric-orientation
      - circles

  - id: clockwise-circle-typed
    type: typed
    prompt: |
      Name one simple change that reverses the usual counterclockwise circle orientation.
    answer:
      expected: make the sine term negative
      aliases:
        - use y = k - r sin t
        - replace r sin t with -r sin t
    explanation: |
      Changing the sign of one coordinate's trig term reflects the tracing direction.
    tags:
      - parametric-orientation
      - circles

  - id: ellipse-symbolic
    type: symbolic
    prompt: |
      Recall the standard axis-aligned ellipse parametrization centered at $(h,k)$.
    answer:
      expectedLatex: 'x=h+a\cos t,\ y=k+b\sin t'
      aliases:
        - x equals h plus a cosine t and y equals k plus b sine t
    explanation: |
      The values $a$ and $b$ stretch the unit circle horizontally and vertically.
    tags:
      - parametric-standard-forms
      - ellipses

  - id: ellipse-radii-cloze
    type: cloze
    prompt: |
      In $x=h+a\cos t,\ y=k+b\sin t$, $a$ is the horizontal semi-axis length and $b$ is the ____ semi-axis length.
    answer:
      expected: vertical
    explanation: |
      The coefficient of cosine affects $x$, while the coefficient of sine affects $y$.
    tags:
      - parametric-standard-forms
      - ellipses

  - id: pythagorean-elimination-flashcard
    type: flashcard
    prompt: |
      Which identity should you reach for when eliminating a parameter from sine/cosine forms?
    answer:
      expected: Use $\sin^2 t+\cos^2 t=1$.
    explanation: |
      Solve each parametric equation for the trig function, then square and add.
    tags:
      - parametric-elimination
      - trig-identities

  - id: circle-elimination-symbolic
    type: symbolic
    prompt: |
      Eliminate $t$ from $x=h+r\cos t,\ y=k+r\sin t$.
    answer:
      expectedLatex: '(x-h)^2+(y-k)^2=r^2'
      aliases:
        - circle centered h k with radius r
    explanation: |
      Divide each shifted coordinate by $r$, square, add, and use $\cos^2 t+\sin^2 t=1$.
    tags:
      - parametric-elimination
      - circles

  - id: domain-after-elimination-flashcard
    type: flashcard
    prompt: |
      Why can eliminating the parameter lose information?
    answer:
      expected: It may hide the parameter interval, orientation, speed, or restricted portion of the curve.
    explanation: |
      The Cartesian equation often gives the shape, but the parametrization gives how the shape is traced.
    tags:
      - parametric-elimination
      - domain-restrictions

  - id: interval-for-full-circle-typed
    type: typed
    prompt: |
      Give a common parameter interval that traces $x=\cos t,\ y=\sin t$ exactly once.
    answer:
      expected: 0 <= t <= 2pi
      aliases:
        - 0 to 2pi
        - 0\le t\le 2\pi
    explanation: |
      One full unit-circle cycle has length $2\pi$.
    tags:
      - parametric-orientation
      - intervals

  - id: graph-y-fx-flashcard
    type: flashcard
    prompt: |
      What ordinary graph is traced by $x=t,\ y=t^2+1$?
    answer:
      expected: It traces $y=x^2+1$.
    explanation: |
      Since $x=t$, replace $t$ with $x$ in the expression for $y$.
    tags:
      - parametric-standard-forms
      - function-graphs

  - id: parabola-sideways-flashcard
    type: flashcard
    prompt: |
      What shape is suggested by $x=t^2,\ y=t$ after eliminating the parameter?
    answer:
      expected: A sideways parabola, $x=y^2$.
    explanation: |
      Since $y=t$, substitute into $x=t^2$ to get $x=y^2$.
    tags:
      - parametric-elimination
      - parabolas

  - id: orientation-from-table-flashcard
    type: flashcard
    prompt: |
      What should you check in a table of $t$, $x(t)$, and $y(t)$ values to determine orientation?
    answer:
      expected: Follow the points in increasing order of $t$.
    explanation: |
      Orientation is the direction of travel as the parameter increases.
    tags:
      - parametric-orientation

  - id: repeated-tracing-meaning-cloze
    type: cloze
    prompt: |
      If a parametrization runs through the same path more than once, the curve is being ____.
    answer:
      expected: retraced
      aliases:
        - traced repeatedly
        - repeated
    explanation: |
      Periodic sine and cosine parametrizations often retrace curves when the interval spans multiple cycles.
    tags:
      - parametric-orientation
      - intervals

  - id: standard-form-lookup-flashcard
    type: flashcard
    prompt: |
      What is the fastest recognition cue for a circle or ellipse in parametric form?
    answer:
      expected: Look for one coordinate using cosine and the other using sine with the same parameter.
    explanation: |
      Sine and cosine paired with the same parameter usually point to the identity $\sin^2 t+\cos^2 t=1$.
    tags:
      - parametric-standard-forms
      - which-tool-when
