questions:
- id: q001
  type: multipleChoice
  prompt: A rectangle has a length of 14 cm and a width of 5 cm. What is its area?
  difficultyDimensions:
  - 'Recall area formula for rectangle: $A = l \times w$.'
  - 'Calculate: $14 \times 5 = 70$.'
  choices:
  - id: a
    text: $38\text{ cm}^2$
    issueSignals:
    - id: perimeter-confusion
      domains: []
  - id: b
    text: $70\text{ cm}^2$
  - id: c
    text: $19\text{ cm}^2$
    issueSignals:
    - id: sum-confusion
      domains: []
  - id: d
    text: $35\text{ cm}^2$
    issueSignals:
    - id: triangle-area-confusion
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The formula for the area of a rectangle is Area = length $\times$ width.

    $\text{Area} = 14 \times 5 = 70\text{ cm}^2$.


    Why it works:

    Area measures the number of $1 \times 1$ squares that fit inside a shape. A $14 \times 5$ rectangle
    can be viewed as 5 rows of 14 squares, making exactly 70 squares total.


    Why the other choices fail:

    - $38$ is the perimeter ($14+14+5+5$).

    - $19$ is the sum of the length and width ($14+5$).

    - $35$ is the area of a triangle with base 14 and height 5.

    '
- id: q002
  type: multipleChoice
  prompt: The perimeter of a square is 48 inches. What is its area?
  difficultyDimensions:
  - 'Find the side length from the perimeter: $48 / 4 = 12$.'
  - 'Find the area from the side length: $12^2 = 144$.'
  choices:
  - id: a
    text: $144\text{ in}^2$
  - id: b
    text: $48\text{ in}^2$
    issueSignals:
    - id: perimeter-area-confusion
      domains: []
  - id: c
    text: $576\text{ in}^2$
    issueSignals:
    - id: perimeter-as-side-error
      domains: []
  - id: d
    text: $24\text{ in}^2$
    issueSignals:
    - id: half-perimeter-error
      domains: []
  answer:
    choiceId: a
  explanation: 'Solution:

    First, find the side length of the square. Since all four sides are equal:

    $\text{Perimeter} = 4s = 48 \implies s = 12\text{ inches}$.

    Now, find the area:

    $\text{Area} = s^2 = 12^2 = 144\text{ in}^2$.


    Why it works:

    You cannot calculate area directly from perimeter. You must always use the perimeter to find the missing
    1-dimensional length (the side) first, then use that to find the 2-dimensional area.


    Why the other choices fail:

    - $576$ assumes the side length itself is 48 ($48 \times 48$).

    - $48$ is the perimeter.

    - $24$ is half the perimeter.

    '
- id: q003
  type: multipleChoice
  prompt: A parallelogram has a base of 15 m and a slanted side of 10 m. The perpendicular height to the
    base is 8 m. What is the area of the parallelogram?
  difficultyDimensions:
  - Identify the correct dimensions for area (base and perpendicular height, ignore slanted side).
  - 'Calculate: $15 \times 8 = 120$.'
  choices:
  - id: a
    text: $150\text{ m}^2$
    issueSignals:
    - id: slant-height-confusion
      domains: []
  - id: b
    text: $120\text{ m}^2$
  - id: c
    text: $60\text{ m}^2$
    issueSignals:
    - id: triangle-area-confusion
      domains: []
  - id: d
    text: $50\text{ m}^2$
    issueSignals:
    - id: perimeter-sum-confusion
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The formula for the area of a parallelogram is Area = base $\times$ perpendicular height ($A = bh$).

    We are given the base ($15\text{ m}$) and the perpendicular height ($8\text{ m}$). The slanted side
    ($10\text{ m}$) is a distractor.

    $\text{Area} = 15 \times 8 = 120\text{ m}^2$.


    Why it works:

    If you chop off the right-triangle portion sticking out of one side of a parallelogram and move it
    to fill the gap on the other side, it forms a perfect rectangle with dimensions $b$ and $h$. The slant
    length is irrelevant to area.


    Why the other choices fail:

    - $150$ multiplies the base by the slanted side ($15 \times 10$).

    - $60$ mistakenly halves the area, as if it were a triangle ($\frac{1}{2} \times 15 \times 8$).

    - $50$ is the perimeter ($15+15+10+10$).

    '
- id: q004
  type: multipleChoice
  prompt: A triangle has an area of $54\text{ cm}^2$ and a base of $12\text{ cm}$. What is its height?
  difficultyDimensions:
  - 'Recall triangle area formula: $A = 1/2 \cdot bh$.'
  - 'Set up equation: $54 = 1/2 \cdot 12 \cdot h$.'
  - 'Solve for $h$: $54 = 6h \implies h = 9$.'
  choices:
  - id: a
    text: $4.5\text{ cm}$
    issueSignals:
    - id: double-halving-error
      domains: []
  - id: b
    text: $9\text{ cm}$
  - id: c
    text: $18\text{ cm}$
    issueSignals:
    - id: one-half-omission
      domains: []
  - id: d
    text: $108\text{ cm}$
    issueSignals:
    - id: area-multiplication-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The formula for the area of a triangle is $A = \frac{1}{2}bh$.

    Substitute the known values:

    $54 = \frac{1}{2}(12)h$

    $54 = 6h$

    $h = 9\text{ cm}$.


    Why it works:

    Because the triangle formula has a $\frac{1}{2}$ in it, a common shortcut when working backward from
    area is to double the area first, then divide by the base ($108 / 12 = 9$).


    Why the other choices fail:

    - $4.5$ comes from dividing the area by the base ($54/12 = 4.5$) without accounting for the $\frac{1}{2}$
    in the formula.

    - $18$ comes from solving $54 = 3h$ (maybe halving both base and area).

    - $108$ comes from multiplying area by 2 and ignoring the base division.

    '
- id: q005
  type: multipleChoice
  prompt: What is the area of a right triangle with a hypotenuse of 13 and a leg of 5?
  difficultyDimensions:
  - 'Use Pythagorean theorem to find the other leg: $5^2 + b^2 = 13^2 \implies b = 12$.'
  - 'Use the two legs as base and height: $1/2 \cdot 5 \cdot 12$.'
  - 'Calculate area: $30$.'
  choices:
  - id: a
    text: $30$
  - id: b
    text: $60$
    issueSignals:
    - id: one-half-omission
      domains: []
  - id: c
    text: $32.5$
    issueSignals:
    - id: hypotenuse-as-height
      domains: []
  - id: d
    text: $65$
    issueSignals:
    - id: hypotenuse-as-height-no-half
      domains: []
  answer:
    choiceId: a
  explanation: 'Solution:

    To find the area of a right triangle, we need both legs (which act as the base and height).

    Use the Pythagorean theorem to find the missing leg:

    $5^2 + b^2 = 13^2$

    $25 + b^2 = 169$

    $b^2 = 144 \implies b = 12$.

    Now, use the two legs to find the area:

    $\text{Area} = \frac{1}{2}bh = \frac{1}{2}(5)(12) = 30$.


    Why it works:

    In a right triangle, the two legs meet at a $90^\circ$ angle, meaning one is perfectly perpendicular
    to the other. The hypotenuse is never the height when one of the legs is the base.


    Why the other choices fail:

    - $60$ forgets to multiply by $\frac{1}{2}$ (area of the $5 \times 12$ rectangle).

    - $32.5$ incorrectly uses the hypotenuse as the height ($\frac{1}{2} \times 5 \times 13 = 32.5$).

    - $65$ incorrectly uses the hypotenuse and forgets the $\frac{1}{2}$ ($5 \times 13 = 65$).

    '
