questions:
- id: q001
  type: multipleChoice
  prompt: |-
    An original Areas problem variant is designed to test **similar figures**. Which solution strategy is most appropriate?
  choices:
  - id: a
    text: Use compare areas by ratios after checking the relevant constraints.
  - id: b
    text: Assume the answer from a visually similar problem still applies.
  - id: c
    text: Ignore the distinction between necessary and sufficient conditions.
  - id: d
    text: Try arithmetic first and decide the structure only after the answer appears.
  answer:
    choiceId: a
  explanation: |-
    This mirrors the difficulty of a chapter problem archetype: recognize similar figures, choose compare areas by ratios, and verify the constraints before computing.
  skills:
  - aops-areas
