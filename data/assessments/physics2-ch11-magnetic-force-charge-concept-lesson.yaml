id: physics2-ch11-magnetic-force-charge-concept-lesson
title: Magnetic Force on a Moving Charge
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-magnetic-forces-fields
workedExamples:
- id: l1-sec1
  title: The Magnetic Force
  explanation: 'A magnetic field $\vec{B}$ exerts a force on a moving point charge
    $q$ given by the Lorentz force equation (magnetic part): $\vec{F}_B = q\vec{v}
    \times \vec{B}$. The force is always perpendicular to both velocity and the magnetic
    field.'
- id: l1-sec2
  title: Circular Motion in a B-field
  explanation: Because the magnetic force is perpendicular to velocity, it acts as
    a centripetal force. A charged particle moving perpendicular to a uniform magnetic
    field travels in a circle with radius $r = \frac{mv}{|q|B}$.
