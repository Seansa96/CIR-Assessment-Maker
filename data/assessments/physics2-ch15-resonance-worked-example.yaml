- id: we1
  title: Resonant Frequency
  steps:
  - id: s1
    prompt: Use the resonance formula.
    explanation: 'Solution:

      1) Angular frequency $\omega_0 = \frac{1}{\sqrt{LC}}$.

      2) Substitute values: $\omega_0 = \frac{1}{\sqrt{(20 \times 10^{-3})(5.0 \times 10^{-6})}} = \frac{1}{\sqrt{100
      \times 10^{-9}}} = \frac{1}{3.16 \times 10^{-4}} = 3162\text{ rad/s}$.

      3) Convert to frequency: $f = \frac{\omega_0}{2\pi} = \frac{3162}{2\pi} \approx 503\text{ Hz}$.


      Why it works:

      At resonance, the inductive and capacitive reactances cancel out.'
    title: Use the resonance formula.
    instruction: 'Work through this step: Use the resonance formula.'
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: An RLC series circuit has $R = 150\text{ }\Omega$, $L = 20\text{ mH}$, and $C = 5.0\text{ }\mu\text{F}$.
    Find its resonant frequency in Hz.
