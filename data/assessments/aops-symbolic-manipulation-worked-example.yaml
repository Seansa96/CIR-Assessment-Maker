schemaVersion: 1
id: aops-symbolic-manipulation-worked-example
title: Pure Symbolic Manipulation Worked Example
assessmentType: workedExample
categoryId: art-of-problem-solving
subcategoryId: aops-symbolic-manipulation
subcategoryIds:
  - aops-symbolic-manipulation
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Building an expression without numerical values
    problem: |
      Pure symbolic manipulation means building and transforming expressions by structure, not by plugging in numbers.

      Suppose a number is called $x$. Build an expression for this instruction:

      Start with $x$, increase it by $a$, square the result, subtract the square of the original number, and then divide by $a$.

      The goal is not to evaluate anything. The goal is to create the expression and simplify it in a way that reveals structure.
    steps:
      - id: s001
        title: Preserve the unknown
        instruction: |
          In a symbolic problem, letters represent quantities whose values are not known or not needed.
        type: multipleChoice
        prompt: |
          What should you do with the instruction "increase $x$ by $a$"?
        choices:
          - id: a
            text: 'Write $x+a$ and keep both symbols.'
          - id: b
            text: 'Choose convenient values for $x$ and $a$.'
          - id: c
            text: 'Replace $a$ with $0$.'
          - id: d
            text: 'Write $xa$.'
        answer:
          choiceId: a
        explanation: |
          The phrase "increase $x$ by $a$" means add $a$ to $x$:

          $$
          x+a.
          $$

          Related topic: translating words into algebra. Strengthen the habit of preserving symbolic variables until a problem explicitly gives values.

      - id: s002
        title: Square the entire result
        instruction: |
          Parentheses matter because the instruction says to square the result after increasing $x$ by $a$.
        type: multipleChoice
        prompt: |
          Which expression correctly squares the increased quantity?
        choices:
          - id: a
            text: '$(x+a)^2$'
          - id: b
            text: '$x+a^2$'
          - id: c
            text: '$x^2+a$'
          - id: d
            text: '$2(x+a)$'
        answer:
          choiceId: a
        explanation: |
          The entire quantity $x+a$ is being squared:

          $$
          (x+a)^2.
          $$

          Related topic: grouping symbols. Many algebra errors come from squaring only the last term instead of the whole expression.

      - id: s003
        title: Subtract the original square
        instruction: |
          The original number is $x$, so the square of the original number is $x^2$.
        type: multipleChoice
        prompt: |
          Which expression represents "subtract the square of the original number"?
        choices:
          - id: a
            text: '$(x+a)^2-x^2$'
          - id: b
            text: '$(x+a-x)^2$'
          - id: c
            text: '$x^2-(x+a)^2$'
          - id: d
            text: '$(x+a)^2-a^2$'
        answer:
          choiceId: a
        explanation: |
          The expression after squaring is $(x+a)^2$. Subtracting the square of the original number gives

          $$
          (x+a)^2-x^2.
          $$

          Related topic: order of operations in expression construction. Follow the instructions in sequence.

      - id: s004
        title: Divide by the symbolic change
        instruction: |
          Now divide the whole difference by $a$.
        type: multipleChoice
        prompt: |
          Which expression correctly represents the full instruction?
        choices:
          - id: a
            text: '$\frac{(x+a)^2-x^2}{a}$'
          - id: b
            text: '$(x+a)^2-\frac{x^2}{a}$'
          - id: c
            text: '$\frac{x+a^2-x^2}{a}$'
          - id: d
            text: '$\frac{(x+a)^2}{a}-x$'
        answer:
          choiceId: a
        explanation: |
          The full difference must stay grouped in the numerator:

          $$
          \frac{(x+a)^2-x^2}{a}.
          $$

          Related topic: numerator grouping. A fraction bar groups the entire numerator, so preserve that structure.

      - id: s005
        title: Expand carefully
        instruction: |
          To simplify, expand the square before canceling.
        type: multipleChoice
        prompt: |
          What is $(x+a)^2$?
        choices:
          - id: a
            text: '$x^2+2ax+a^2$'
          - id: b
            text: '$x^2+a^2$'
          - id: c
            text: '$2x+2a$'
          - id: d
            text: '$x^2+ax+a^2$'
        answer:
          choiceId: a
        explanation: |
          Use the square of a binomial:

          $$
          (x+a)^2=x^2+2ax+a^2.
          $$

          Related topic: binomial expansion. The middle term appears because $(x+a)(x+a)$ contains two $ax$ terms.

      - id: s006
        title: Cancel structure, not symbols blindly
        instruction: |
          Substitute the expansion into the fraction and simplify the numerator first.
        type: multipleChoice
        prompt: |
          Which simplification is correct?
        choices:
          - id: a
            text: '$\frac{x^2+2ax+a^2-x^2}{a}=\frac{2ax+a^2}{a}$'
          - id: b
            text: '$\frac{x^2+2ax+a^2-x^2}{a}=x+2x+a$'
          - id: c
            text: '$\frac{(x+a)^2-x^2}{a}=x+a-x$'
          - id: d
            text: '$\frac{(x+a)^2-x^2}{a}=0$'
        answer:
          choiceId: a
        explanation: |
          The $x^2$ and $-x^2$ terms cancel inside the numerator:

          $$
          \frac{x^2+2ax+a^2-x^2}{a}
          =
          \frac{2ax+a^2}{a}.
          $$

          Related topic: combining like terms before canceling factors. Cancel terms only when they are separated by addition/subtraction within the same grouped expression.

      - id: s007
        title: Factor before canceling
        instruction: |
          To cancel with the denominator, factor the numerator.
        type: multipleChoice
        prompt: |
          What is the most useful factorization of $2ax+a^2$?
        choices:
          - id: a
            text: '$a(2x+a)$'
          - id: b
            text: '$x(2a+a)$'
          - id: c
            text: '$(2a)(xa)$'
          - id: d
            text: '$a^2(2x+1)$'
        answer:
          choiceId: a
        explanation: |
          Both terms contain a factor of $a$:

          $$
          2ax+a^2=a(2x+a).
          $$

          Related topic: factoring common factors. This is the safe setup for cancellation.

      - id: s008
        title: Final symbolic result
        instruction: |
          Complete the simplification.
        type: symbolicResponse
        prompt: |
          Simplify the full expression:

          $$
          \frac{(x+a)^2-x^2}{a}
          $$
        answer:
          expectedLatex: '2x+a'
          equivalenceMode: expression
          variables:
            - x
            - a
          tolerance: 0.000001
        hint: |
          Factor the numerator as $a(2x+a)$.
        explanation: |
          After factoring:

          $$
          \frac{2ax+a^2}{a}
          =
          \frac{a(2x+a)}{a}
          =
          2x+a.
          $$

          Related topic: symbolic simplification. The procedure is translate, group, expand, combine like terms, factor, then cancel common factors.
