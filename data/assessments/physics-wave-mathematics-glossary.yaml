glossary:
  introduction: Mathematical quantities in a sinusoidal traveling-wave equation.
  sections:
  - id: wave-math-terms
    title: Core terms
    entries:
    - {id: wave-number, term: wave number, definition: 'Spatial angular frequency $k=2\pi/\lambda$ in rad/m.', drills: [{id: wave-number-drill, type: typed, prompt: 'What is $2\pi/\lambda$ called?', answer: wave number}]}
    - {id: angular-frequency, term: angular frequency, definition: 'Temporal angular frequency $\omega=2\pi f$.', drills: [{id: angular-frequency-drill, type: cloze, prompt: 'Angular frequency is $\omega={{2\pi f}}$.', answer: '2\pi f'}]}
    - {id: phase, term: phase, definition: 'The argument of the sinusoid, such as $kx-\omega t+\phi$.', drills: [{id: phase-drill, type: typed, prompt: 'What is the sinusoid argument called?', answer: phase}]}
    - {id: propagation-speed, term: propagation speed, definition: 'Speed of a constant-phase point, $v=\omega/k=f\lambda$.', drills: [{id: propagation-speed-drill, type: cloze, prompt: 'Propagation speed is $v={{\omega/k}}$.', answer: '\omega/k'}]}
