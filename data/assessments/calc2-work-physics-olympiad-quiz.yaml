  type: freeResponse
  prompt: Find the volume obtained by rotating y = 5x^2 from x=0 to x=1 about the
    y-axis.
  answer:
    gradingMode: selfCheck
    checkModel: 5*pi/2
  explanation: Use the method of cylindrical shells.
