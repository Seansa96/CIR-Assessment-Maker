questions:
- id: q1
  type: numericResponse
  prompt: A constant torque of $5.0 \text{ N}\cdot\text{m}$ acts on a system for $4.0
    \text{ s}$. What is the change in the system's angular momentum?
  answer:
    value: 20.0
    tolerance: 1.0
  explanation: $\Delta L = \tau\Delta t = 5.0(4.0) = 20 \text{ kg}\cdot\text{m}^2/\text{s}$.
