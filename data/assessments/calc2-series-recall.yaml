schemaVersion: 1
id: calc2-series-recall
title: Series and Convergence Tests Recall
assessmentType: recallDrill
categoryId: calculus-2
topicId: convergence-tests
skills:
- Select and interpret convergence tests
- Recognize benchmark series and inconclusive test outcomes
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - calculus-2
  - convergence-tests
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  skills:
  - series
  prompt: If the limit of a_n is NOT zero, the series diverges. What is the name of
    this test?
  answer:
    expected: Test for Divergence
    aliases:
    - Divergence Test
    - nth Term Test
- id: r002
  type: typed
  skills:
  - series
  prompt: A geometric series converges if the absolute value of the common ratio is
    strictly less than what number?
  answer:
    expected: '1'
    aliases:
    - one
- id: r003
  type: typed
  skills:
  - series
  prompt: What is the formula for the sum of an infinite geometric series that converges?
  answer:
    expected: a / (1 - r)
    aliases:
    - a/(1-r)
- id: r004
  type: typed
  skills:
  - series
  prompt: The Harmonic Series (1/n) has p=1. Does it converge or diverge?
  answer:
    expected: diverge
    aliases:
    - diverges
- id: r005
  type: flashcard
  skills:
  - series
  prompt: For the Ratio Test, what happens if the limit L equals 1?
  answer:
    expected: The test is inconclusive (you must use a different test).
- id: r006
  type: typed
  skills:
  - p-series
  prompt: For what values of p does $\sum_{n=1}^{\infty}1/n^p$ converge?
  answer:
    expected: $p>1$
    aliases:
    - p greater than 1
- id: r007
  type: flashcard
  skills:
  - direct-comparison
  prompt: To prove a positive series converges by direct comparison, should it be bounded above or below by a known convergent series?
  answer:
    expected: bounded above
    aliases:
    - above
- id: r008
  type: flashcard
  skills:
  - direct-comparison
  prompt: To prove a positive series diverges by direct comparison, should it be bounded above or below by a known divergent series?
  answer:
    expected: bounded below
    aliases:
    - below
- id: r009
  type: typed
  skills:
  - ratio-test
  prompt: If the ratio-test limit L satisfies $L<1$, what is the conclusion?
  answer:
    expected: absolute convergence
    aliases:
    - converges absolutely
    - converges
- id: r010
  type: typed
  skills:
  - ratio-test
  prompt: If the ratio-test limit L is greater than one, what is the conclusion?
  answer:
    expected: diverges
    aliases:
    - divergence
- id: r011
  type: flashcard
  skills:
  - root-test
  prompt: Which convergence test is especially natural when the entire nth term is raised to the nth power?
  answer:
    expected: Root Test
    aliases:
    - nth-root test
- id: r012
  type: flashcard
  skills:
  - integral-test
  prompt: What three common hypotheses must a comparison function satisfy for the Integral Test?
  answer:
    expected: positive, continuous, and decreasing
    aliases:
    - positive continuous decreasing
- id: r013
  type: typed
  skills:
  - telescoping-series
  prompt: What finite objects should you write out to expose cancellation in a telescoping series?
  answer:
    expected: partial sums
    aliases:
    - a partial sum
- id: r014
  type: flashcard
  skills:
  - limit-comparison
  prompt: In the Limit Comparison Test, what kind of limit transfers convergence behavior between two positive series?
  answer:
    expected: a finite positive limit
    aliases:
    - positive finite limit
    - a limit between zero and infinity
- id: r015
  type: typed
  skills:
  - convergence-test-selection
  prompt: Which test is usually most direct for terms containing factorials or exponentials in n?
  answer:
    expected: Ratio Test
    aliases:
    - ratio
