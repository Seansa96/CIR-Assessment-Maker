schemaVersion: 1
id: calc2-series-recall
title: Series and Convergence Tests Recall
assessmentType: recallDrill
categoryId: calculus-2
subcategoryId: sequences-series
subcategoryIds:
  - sequences-series
modeDefault: practice
randomizeQuestions: true
items:
  - id: r001
    type: typed
    prompt: "If the limit of a_n is NOT zero, the series diverges. What is the name of this test?"
    answer:
      expected: "Test for Divergence"
      aliases:
        - "Divergence Test"
        - "nth Term Test"
  - id: r002
    type: typed
    prompt: "A geometric series converges if the absolute value of the common ratio is strictly less than what number?"
    answer:
      expected: "1"
      aliases:
        - "one"
  - id: r003
    type: typed
    prompt: "What is the formula for the sum of an infinite geometric series that converges?"
    answer:
      expected: "a / (1 - r)"
      aliases:
        - "a/(1-r)"
  - id: r004
    type: typed
    prompt: "The Harmonic Series (1/n) has p=1. Does it converge or diverge?"
    answer:
      expected: diverge
      aliases:
        - diverges
  - id: r005
    type: flashcard
    prompt: "For the Ratio Test, what happens if the limit L equals 1?"
    answer:
      expected: "The test is inconclusive (you must use a different test)."
