questions:
- id: q001
  type: numericResponse
  prompt: |
    An airplane wing is designed such that air ($\rho = 1.2 \text{ kg/m}^3$) flows over the top surface at a speed of $250 \text{ m/s}$, and under the bottom surface at a speed of $220 \text{ m/s}$. 
    Assuming the vertical thickness of the wing is small enough to ignore changes in elevation ($y_1 \approx y_2$), calculate the pressure difference $\Delta P = P_{bottom} - P_{top}$ in Pascals.
  answer:
    value: 8460
    tolerance: 10
  explanation: |
    Solution:
    $P_{bottom} + \frac{1}{2}\rho v_{bottom}^2 = P_{top} + \frac{1}{2}\rho v_{top}^2$
    $P_{bottom} - P_{top} = \frac{1}{2}\rho (v_{top}^2 - v_{bottom}^2)$
    $\Delta P = 0.5(1.2) (250^2 - 220^2)$
    $\Delta P = 0.6 (62500 - 48400) = 0.6(14100) = 8460 \text{ Pa}$.
    
    Why it works:
    The faster-moving air over the top of the wing exerts less downward pressure than the slower-moving air exerts upward on the bottom. This net upward pressure difference ($\Delta P$) multiplied by the wing area produces the aerodynamic lift that keeps the plane in the air.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
- id: q002
  type: symbolicResponse
  prompt: |
    Write the expression for the pressure drop $\Delta P = P_1 - P_2$ across a horizontal Venturi tube. 
    Use `\rho` for fluid density, `v_1` for the initial velocity, and `v_2` for the velocity in the constricted section.
  answer:
    expectedLatex: \frac{1}{2} \rho (v_2^2 - v_1^2)
    equivalenceMode: expression
    variables: [\rho, v_1, v_2]
    tolerance: 0.00001
    keyPoints:
    - 0.5 \rho (v_2^2 - v_1^2)
  explanation: |
    Solution:
    From Bernoulli's equation for a horizontal pipe:
    $P_1 + \frac{1}{2}\rho v_1^2 = P_2 + \frac{1}{2}\rho v_2^2$
    $P_1 - P_2 = \frac{1}{2}\rho v_2^2 - \frac{1}{2}\rho v_1^2 = \frac{1}{2}\rho(v_2^2 - v_1^2)$
    
    Why it works:
    The pressure drop is exactly equal to the gain in kinetic energy density. Measuring this pressure drop (using a manometer attached to the Venturi tube) is a common way to measure fluid flow rates in pipes.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
