schemaVersion: 1
id: aops-circles-introduction-hard-test
title: 'Circles: Hard Test'
assessmentType: test
categoryId: art-of-problem-solving
topicId: aops-circles-introduction
modeDefault: scored
randomizeQuestions: true
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags: [art-of-problem-solving, aops-circles-introduction, aops-volume-1, circles, hard, geometry]
skills:
- Synthesize arc, sector, annulus, chord, and tangent relationships
- Use circle constraints in algebraic and coordinate settings
- Prove the tangent-radius theorem from distance properties
questions:
- id: hard-test-q064
  type: multipleChoice
  prompt: An annulus has outer radius $13$ and inner radius $5$. Find its area.
  choices:
  - {id: a, text: '$64\pi$'}
  - {id: b, text: '$120\pi$'}
  - {id: c, text: '$144\pi$'}
  - {id: d, text: '$194\pi$'}
  answer: {choiceId: c}
  explanation: $\pi(13^2-5^2)=144\pi$.
- id: hard-test-q054
  type: multipleChoice
  prompt: In a radius-8 circle, a $60^\circ$ central angle subtends a chord. Find the chord length.
  choices:
  - {id: a, text: '$4$'}
  - {id: b, text: '$8$'}
  - {id: c, text: '$8\sqrt2$'}
  - {id: d, text: '$16$'}
  answer: {choiceId: b}
  explanation: The two radii and chord form an equilateral triangle when the central angle is $60^\circ$.
- id: hard-test-q074
  type: multipleChoice
  prompt: A radius-15 circle has a chord $9$ units from the center. Find the chord length.
  media:
  - {type: image, src: /assessments/aops/aops-circles-chord.svg, alt: Perpendicular from center O bisecting chord AB at M.}
  choices:
  - {id: a, text: '$12$'}
  - {id: b, text: '$18$'}
  - {id: c, text: '$24$'}
  - {id: d, text: '$30$'}
  answer: {choiceId: c}
  explanation: Half-chord $=\sqrt{15^2-9^2}=12$, so the chord is $24$.
- id: hard-test-q094
  type: multipleChoice
  prompt: $OP=26$ and radius $OT=10$. If $PT$ is tangent at $T$, find $PT$.
  media:
  - {type: image, src: /assessments/aops/aops-circles-tangent.svg, alt: Tangent PT perpendicular to radius OT, with OP as hypotenuse.}
  choices:
  - {id: a, text: '$16$'}
  - {id: b, text: '$20$'}
  - {id: c, text: '$24$'}
  - {id: d, text: '$36$'}
  answer: {choiceId: c}
  explanation: $PT=\sqrt{26^2-10^2}=24$.
- id: hard-test-q084
  type: multipleChoice
  prompt: Tangents from one point have lengths $7x-4$ and $3x+12$. Find $x$.
  choices:
  - {id: a, text: '$2$'}
  - {id: b, text: '$4$'}
  - {id: c, text: '$6$'}
  - {id: d, text: '$8$'}
  answer: {choiceId: b}
  explanation: Equal tangents give $7x-4=3x+12$, so $x=4$ and both lengths are $24$.
- id: hard-test-q065
  type: multipleChoice
  prompt: Two tangents from $P$ form a $74^\circ$ angle. Find the minor arc between their tangent points.
  choices:
  - {id: a, text: '$74^\circ$'}
  - {id: b, text: '$106^\circ$'}
  - {id: c, text: '$148^\circ$'}
  - {id: d, text: '$286^\circ$'}
  answer: {choiceId: b}
  explanation: The minor central angle, hence minor arc measure, is $180^\circ-74^\circ=106^\circ$.
- id: hard-test-q055
  type: multipleChoice
  prompt: Find the perimeter of a $90^\circ$ sector of radius $12$.
  choices:
  - {id: a, text: '$6\pi$'}
  - {id: b, text: '$12\pi$'}
  - {id: c, text: '$24+6\pi$'}
  - {id: d, text: '$24+12\pi$'}
  answer: {choiceId: c}
  explanation: The arc is one quarter of $24\pi$, or $6\pi$; add two radii totaling $24$.
- id: hard-test-q075
  type: multipleChoice
  prompt: A circle has circumference $24\pi$. Find the area of a $45^\circ$ sector.
  choices:
  - {id: a, text: '$9\pi$'}
  - {id: b, text: '$18\pi$'}
  - {id: c, text: '$36\pi$'}
  - {id: d, text: '$144\pi$'}
  answer: {choiceId: b}
  explanation: Radius is $12$, disk area $144\pi$, and one eighth is $18\pi$.
- id: hard-test-q095
  type: multipleChoice
  prompt: A circle centered at $(-3,4)$ passes through $(5,10)$. Find its circumference.
  choices:
  - {id: a, text: '$10\pi$'}
  - {id: b, text: '$20\pi$'}
  - {id: c, text: '$50\pi$'}
  - {id: d, text: '$100\pi$'}
  answer: {choiceId: b}
  explanation: Radius $=\sqrt{8^2+6^2}=10$, so circumference is $20\pi$.
- id: hard-test-q085
  type: multipleChoice
  prompt: A $72^\circ$ sector has area $20\pi$. Find the circle's radius.
  choices:
  - {id: a, text: '$5$'}
  - {id: b, text: '$10$'}
  - {id: c, text: '$20$'}
  - {id: d, text: '$50$'}
  answer: {choiceId: b}
  explanation: The sector is one fifth of the disk, so $\pi r^2=100\pi$ and $r=10$.
- id: hard-test-q066
  type: multipleChoice
  prompt: A chord of length $30$ lies in a radius-17 circle. Find its distance from the center.
  choices:
  - {id: a, text: '$2$'}
  - {id: b, text: '$8$'}
  - {id: c, text: '$15$'}
  - {id: d, text: '$16$'}
  answer: {choiceId: b}
  explanation: The half-chord is $15$, so distance $=\sqrt{17^2-15^2}=8$.
- id: hard-test-q056
  type: multipleChoice
  prompt: Two circles have equal circumference. Which conclusion is forced?
  choices:
  - {id: a, text: Their radii and areas are equal.}
  - {id: b, text: Their radii may differ but their areas agree.}
  - {id: c, text: Only their diameters are equal.}
  - {id: d, text: No measurement is determined.}
  answer: {choiceId: a}
  explanation: Equal $2\pi r$ gives equal radii, which gives equal areas.
- id: hard-test-q076
  type: selectAll
  prompt: Which statements follow for tangents $PA,PB$ from the same external point?
  choices:
  - {id: a, text: '$PA=PB$'}
  - {id: b, text: '$OA\perp PA$ and $OB\perp PB$'}
  - {id: c, text: Quadrilateral $OAPB$ has two right angles.}
  - {id: d, text: '$OP$ must be a diameter.'}
  answer:
    choiceIds: [a, b, c]
  explanation: $OP$ connects the center to an external point; it is not a circle chord.
- id: hard-test-q096
  type: selectAll
  prompt: Which data are sufficient to determine a circle uniquely in the plane?
  choices:
  - {id: a, text: Its center and positive radius.}
  - {id: b, text: Three noncollinear points on it.}
  - {id: c, text: One point on it only.}
  - {id: d, text: Two endpoints of a diameter.}
  answer:
    choiceIds: [a, b, d]
  explanation: One point lies on infinitely many circles; the other data determine center and radius.
- id: hard-test-q086
  type: freeResponse
  prompt: Prove that a tangent to a circle is perpendicular to the radius drawn to the point of tangency.
  media:
  - {type: image, src: /assessments/aops/aops-circles-tangent.svg, alt: Circle centered at O with tangent through T and radius OT.}
  answer:
    gradingMode: selfCheck
    expected: |-
      Suppose the tangent through $T$ were not perpendicular to $OT$. Let $H$ be the foot of the perpendicular from $O$ to the tangent line. Then $H\ne T$ and $OH<OT=r$, so $H$ lies inside the circle. A line through an interior point intersects the circle in two points, contradicting that the line is tangent. Hence $OT$ is perpendicular to the tangent at $T$.
    keyPoints:
    - Assumes the tangent is not perpendicular.
    - Drops the true perpendicular to a different point $H$.
    - Shows $H$ lies inside the circle because $OH<r$.
    - Contradicts the one-point intersection property of a tangent.
  explanation: The radius is the shortest distance from the center to the tangent line.
