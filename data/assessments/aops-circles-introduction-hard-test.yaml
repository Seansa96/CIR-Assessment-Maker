- id: hard-test-q064
  type: multipleChoice
  prompt: An annulus has outer radius $13$ and inner radius $5$. Find its area.
  choices:
  - id: a
    text: $64\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $120\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: $144\pi$
  - id: d
    text: $194\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Setup the formula $A = \pi(R^2 - r^2)$.
  - Evaluate $13^2 - 5^2$.
  explanation: 'Solution:

    Area of outer circle $= \pi(13^2) = 169\pi$.

    Area of inner circle $= \pi(5^2) = 25\pi$.

    Annulus area $= 169\pi - 25\pi = 144\pi$.


    Why it works:

    The area between two concentric circles is the difference between their areas.


    Why the other choices fail:

    - **(A)** $64\pi = \pi(13-5)^2 = \pi(8^2)$ subtracts radii before squaring.

    - **(B)** $120\pi$ is $2\pi(13 \times 5)$ or some other incorrect combination.

    - **(D)** $194\pi = \pi(13^2 + 5^2)$ adds the areas instead of subtracting.

    '
- id: hard-test-q054
  type: multipleChoice
  prompt: In a radius-8 circle, a $60^\circ$ central angle subtends a chord. Find the chord length.
  choices:
  - id: a
    text: $4$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $8$
  - id: c
    text: $8\sqrt{2}$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: $16$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Identify that the triangle formed by two radii and the chord is isosceles.
  - Conclude that an isosceles triangle with a $60^\circ$ vertex angle is equilateral.
  explanation: 'Solution:

    The triangle formed by the center and the two chord endpoints has two sides equal to the radius ($8$).

    This makes it an isosceles triangle. Since the angle between the equal sides is $60^\circ$, the other
    two angles must be $(180^\circ - 60^\circ)/2 = 60^\circ$.

    The triangle is equilateral. Thus, the chord length is equal to the radius, $8$.


    Why it works:

    Any isosceles triangle with a $60^\circ$ angle (anywhere) is necessarily equilateral, meaning all
    three sides are equal.


    Why the other choices fail:

    - **(A)** $4$ is half the radius.

    - **(C)** $8\sqrt{2}$ is the chord length for a $90^\circ$ central angle (a right isosceles triangle).

    - **(D)** $16$ is the diameter ($180^\circ$ central angle).

    '
- id: hard-test-q074
  type: multipleChoice
  prompt: A radius-15 circle has a chord $9$ units from the center. Find the chord length.
  media:
  - type: image
    src: /assessments/aops/aops-circles-chord.svg
    alt: Perpendicular from center O bisecting chord AB at M.
  choices:
  - id: a
    text: $12$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $18$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: $24$
  - id: d
    text: $30$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Apply Pythagorean theorem to the radius and distance to find the half-chord.
  - Double the half-chord to find the full chord length.
  explanation: 'Solution:

    The distance to the chord is the perpendicular bisector from the center. This forms a right triangle
    with hypotenuse $= 15$ and leg $= 9$.

    Half-chord $= \sqrt{15^2 - 9^2} = \sqrt{225 - 81} = \sqrt{144} = 12$.

    Full chord $= 2 \times 12 = 24$.


    Why it works:

    The perpendicular from the center of a circle to a chord bisects the chord. A radius drawn to the
    chord endpoint completes the right triangle. This is a $3$-$4$-$5$ triangle scaled by $3$ ($9$-$12$-$15$).


    Why the other choices fail:

    - **(A)** $12$ is the length of the half-chord.

    - **(B)** $18 = 2 \times 9$, doubling the distance instead of the half-chord.

    - **(D)** $30 = 2 \times 15$, the diameter of the circle.

    '
- id: hard-test-q094
  type: multipleChoice
  prompt: $OP=26$ and radius $OT=10$. If $PT$ is tangent at $T$, find $PT$.
  media:
  - type: image
    src: /assessments/aops/aops-circles-tangent.svg
    alt: Tangent PT perpendicular to radius OT
    with OP as hypotenuse.: null
  choices:
  - id: a
    text: $16$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $20$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: $24$
  - id: d
    text: $36$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Identify that the radius is perpendicular to the tangent at $T$.
  - Apply the Pythagorean theorem to find leg $PT$.
  explanation: 'Solution:

    The tangent $PT$ and radius $OT$ meet at a right angle, making $\triangle OTP$ a right triangle with
    hypotenuse $OP = 26$ and leg $OT = 10$.

    $$PT^2 + 10^2 = 26^2 \implies PT^2 + 100 = 676 \implies PT^2 = 576 \implies PT = 24.$$


    Why it works:

    A tangent to a circle is perpendicular to the radius drawn to the point of tangency. This gives a
    right triangle. Notice that $10$-$24$-$26$ is the $5$-$12$-$13$ Pythagorean triple scaled by $2$.


    Why the other choices fail:

    - **(A)** $16 = 26 - 10$, subtracting directly instead of using squares.

    - **(B)** $20 = 2 \times 10$, doubling the radius.

    - **(D)** $36 = 26 + 10$, adding directly.

    '
- id: hard-test-q084
  type: multipleChoice
  prompt: Tangents from one point have lengths $7x-4$ and $3x+12$. Find $x$.
  choices:
  - id: a
    text: $2$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $4$
  - id: c
    text: $6$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: $8$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Equate the two tangent expressions.
  - Solve for $x$.
  explanation: 'Solution:

    Tangents drawn from the same external point are equal in length.

    $$7x - 4 = 3x + 12 \implies 4x = 16 \implies x = 4.$$


    Why it works:

    The Two-Tangent Theorem guarantees that the segments from the external point to the points of tangency
    are strictly congruent.


    Why the other choices fail:

    - **(A)** $2$ is the result of $7x+4 = 3x+12 \implies 4x=8 \implies x=2$ (sign error).

    - **(C)** $6$ might result from $7x-3x = 24 \implies 4x=24$ (adding $12+12$ instead of $12+4$).

    - **(D)** $8$ is $16/2$, failing to divide by $4$.

    '
- id: hard-test-q065
  type: multipleChoice
  prompt: Two tangents from $P$ form a $74^\circ$ angle. Find the minor arc between their tangent points.
  choices:
  - id: a
    text: $74^\circ$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $106^\circ$
  - id: c
    text: $148^\circ$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: $286^\circ$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Set up the quadrilateral formed by tangents and radii.
  - Recognize that the central angle and the tangent angle are supplementary.
  explanation: 'Solution:

    Let the tangent points be $A$ and $B$, and the center be $O$. The quadrilateral $PAOB$ has two right
    angles at $A$ and $B$.

    The sum of the other two angles must be $180^\circ$.

    $$\angle AOB + \angle APB = 180^\circ \implies \angle AOB + 74^\circ = 180^\circ \implies \angle AOB
    = 106^\circ.$$

    The minor arc has the same measure as its central angle, $106^\circ$.


    Why it works:

    The radii to the points of tangency are perpendicular to the tangents. The interior angles of a quadrilateral
    sum to $360^\circ$. With two $90^\circ$ angles, the remaining two must sum to $180^\circ$.


    Why the other choices fail:

    - **(A)** $74^\circ$ assumes the minor arc equals the external angle.

    - **(C)** $148^\circ = 2 \times 74^\circ$.

    - **(D)** $286^\circ = 360^\circ - 74^\circ$ is the measure of the major arc.

    '
- id: hard-test-q055
  type: multipleChoice
  prompt: Find the perimeter of a $90^\circ$ sector of radius $12$.
  choices:
  - id: a
    text: $6\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $12\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: $24+6\pi$
  - id: d
    text: $24+12\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Compute the arc length for $90^\circ$ ($1/4$ circumference).
  - Add two radii to the arc length to find total perimeter.
  explanation: 'Solution:

    Full circumference $= 2\pi(12) = 24\pi$.

    The arc length is $\frac{90}{360} = \frac{1}{4}$ of the circumference: $\frac{1}{4}(24\pi) = 6\pi$.

    The perimeter includes the arc and the two straight radii ($12 + 12 = 24$).

    Perimeter $= 24 + 6\pi$.


    Why it works:

    A sector is bounded by its arc and two radii. To find the total perimeter, all three lengths must
    be added.


    Why the other choices fail:

    - **(A)** $6\pi$ is the arc length only, ignoring the straight sides.

    - **(B)** $12\pi$ is half the circumference.

    - **(D)** $24 + 12\pi$ uses half the circumference instead of one-quarter.

    '
- id: hard-test-q075
  type: multipleChoice
  prompt: A circle has circumference $24\pi$. Find the area of a $45^\circ$ sector.
  choices:
  - id: a
    text: $9\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $18\pi$
  - id: c
    text: $36\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: $144\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Find the radius from the circumference.
  - Calculate the full area, then take the $45/360$ fraction.
  explanation: 'Solution:

    $C = 2\pi r \implies 24\pi = 2\pi r \implies r = 12$.

    Full disk area $= \pi(12^2) = 144\pi$.

    A $45^\circ$ sector is $\frac{45}{360} = \frac{1}{8}$ of the circle.

    Sector area $= \frac{1}{8}(144\pi) = 18\pi$.


    Why it works:

    The circumference uniquely determines the radius, which determines the area. The central angle dictates
    the specific proportional slice of that area.


    Why the other choices fail:

    - **(A)** $9\pi = 144\pi/16$, mistakenly using $1/16$ instead of $1/8$.

    - **(C)** $36\pi$ is the area of a $90^\circ$ sector ($1/4$).

    - **(D)** $144\pi$ is the full area of the circle.

    '
- id: hard-test-q095
  type: multipleChoice
  prompt: A circle centered at $(-3,4)$ passes through $(5,10)$. Find its circumference.
  choices:
  - id: a
    text: $10\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $20\pi$
  - id: c
    text: $50\pi$
    issueSignals:
    - id: area-formula-wrong-base
      domains: []
  - id: d
    text: $100\pi$
    issueSignals:
    - id: area-formula-wrong-base
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Use the distance formula to calculate the radius.
  - Apply the circumference formula $C = 2\pi r$.
  explanation: 'Solution:

    The radius is the distance from the center to the point on the circle:

    $$r = \sqrt{(5 - (-3))^2 + (10 - 4)^2} = \sqrt{8^2 + 6^2} = \sqrt{64+36} = \sqrt{100} = 10.$$

    Circumference $= 2\pi r = 2\pi(10) = 20\pi$.


    Why it works:

    The distance from the center to any point on the boundary defines the radius. Once the radius is known,
    standard formulas apply.


    Why the other choices fail:

    - **(A)** $10\pi$ is $\pi r$, omitting the factor of 2.

    - **(C)** $50\pi$ is half the area.

    - **(D)** $100\pi$ is the area ($\pi r^2$).

    '
- id: hard-test-q085
  type: multipleChoice
  prompt: A $72^\circ$ sector has area $20\pi$. Find the circle's radius.
  choices:
  - id: a
    text: $5$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $10$
  - id: c
    text: $20$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: $50$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Relate the sector area to the full area by dividing by the angular fraction.
  - Extract the radius from the full area.
  explanation: 'Solution:

    A $72^\circ$ sector is $\frac{72}{360} = \frac{1}{5}$ of the full circle.

    If $\frac{1}{5}$ of the area is $20\pi$, the full area is $5 \times 20\pi = 100\pi$.

    $$A = \pi r^2 \implies 100\pi = \pi r^2 \implies r^2 = 100 \implies r = 10.$$


    Why it works:

    The area of the sector is directly proportional to the full area. Scaling the sector up to a full
    circle allows us to cleanly solve for the radius.


    Why the other choices fail:

    - **(A)** $5$ is the scale factor ($360/72=5$).

    - **(C)** $20$ is the given sector area value (sans $\pi$) and the diameter.

    - **(D)** $50$ comes from $100\pi = 2\pi r \implies r=50$, mistakenly using the circumference formula
    for area.

    '
- id: hard-test-q066
  type: multipleChoice
  prompt: A chord of length $30$ lies in a radius-17 circle. Find its distance from the center.
  choices:
  - id: a
    text: $2$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $8$
  - id: c
    text: $15$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: $16$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Set up the right triangle with hypotenuse 17 and leg 15 (half-chord).
  - Solve for the distance using the Pythagorean theorem.
  explanation: 'Solution:

    The perpendicular distance from the center bisects the chord, making the half-chord length $30/2 =
    15$.

    This creates a right triangle with hypotenuse $17$ (radius) and leg $15$.

    Distance $= \sqrt{17^2 - 15^2} = \sqrt{289 - 225} = \sqrt{64} = 8$.


    Why it works:

    The shortest distance from a point to a line is the perpendicular segment. A perpendicular from the
    center to a chord always bisects it, forming a right triangle.


    Why the other choices fail:

    - **(A)** $2 = 17 - 15$ subtracts lengths directly instead of squaring.

    - **(C)** $15$ is the half-chord length.

    - **(D)** $16$ is $2 \times 8$, doubling the distance (which isn''t geometrically meaningful here).

    '
- id: hard-test-q056
  type: multipleChoice
  prompt: Two circles have equal circumference. Which conclusion is forced?
  choices:
  - id: a
    text: Their radii and areas are equal.
  - id: b
    text: Their radii may differ but their areas agree.
    issueSignals:
    - id: scaling-error
      domains: []
  - id: c
    text: Only their diameters are equal.
    issueSignals:
    - id: scaling-error
      domains: []
  - id: d
    text: No measurement is determined.
    issueSignals:
    - id: scaling-error
      domains: []
  answer:
    choiceId: a
  difficultyDimensions:
  - Recognize that one scalar measure uniquely determines all other circle measures.
  - Conclude that equal circumferences force equal radii, which force equal areas.
  explanation: 'Solution:

    If $C_1 = C_2$, then $2\pi r_1 = 2\pi r_2$, meaning $r_1 = r_2$.

    If the radii are equal, then the areas $\pi r_1^2$ and $\pi r_2^2$ are also equal.

    Therefore, both radii and areas are exactly equal.


    Why it works:

    A circle is a 1-parameter shape. Fixing any one of radius, diameter, circumference, or area rigidly
    determines all the others.


    Why the other choices fail:

    - **(B)** It is mathematically impossible for radii to differ while areas agree, since $A = \pi r^2$
    is strictly increasing for positive $r$.

    - **(C)** If diameters are equal, radii must be equal, and thus areas are equal too.

    - **(D)** "No measurement is determined" is false because all of them are determined.

    '
- id: hard-test-q076
  type: selectAll
  prompt: Which statements follow for tangents $PA,PB$ from the same external point?
  choices:
  - id: a
    text: $PA=PB$
  - id: b
    text: $OA\perp PA$ and $OB\perp PB$
  - id: c
    text: Quadrilateral $OAPB$ has two right angles.
  - id: d
    text: $OP$ must be a diameter.
    issueSignals:
    - id: definition-error
      domains: []
  answer:
    choiceIds:
    - a
    - b
    - c
  difficultyDimensions:
  - Synthesize the Two-Tangent Theorem and the Tangent-Radius Theorem.
  - Reject false assertions about $OP$.
  explanation: 'Solution:

    (A), (B), and (C) are all standard properties of the two-tangent configuration.


    Why it works:

    Tangents from an external point are equal in length (A). The radius to the point of tangency is perpendicular
    to the tangent (B). This creates two right angles in the resulting quadrilateral (C).


    (D) is false: $OP$ connects the center to an external point, meaning it extends outside the circle.
    A diameter must have both endpoints ON the circle.

    '
- id: hard-test-q096
  type: selectAll
  prompt: Which data are sufficient to determine a circle uniquely in the plane?
  choices:
  - id: a
    text: Its center and positive radius.
  - id: b
    text: Three noncollinear points on it.
  - id: c
    text: One point on it only.
    issueSignals:
    - id: definition-error
      domains: []
  - id: d
    text: Two endpoints of a diameter.
  answer:
    choiceIds:
    - a
    - b
    - d
  difficultyDimensions:
  - Define a circle by center and radius.
  - Connect other geometric data sets (3 points, diameter) to the center and radius.
  explanation: 'Solution:

    (A), (B), and (D) are all sufficient to uniquely define a circle.


    Why it works:

    - (A) is the standard definition of a circle.

    - (B) defines a unique circumcircle for the triangle formed by the three points.

    - (D) provides the midpoint (center) and half the distance (radius).


    (C) is false: Infinitely many circles of all different sizes and positions can pass through a single
    point.

    '
- id: hard-test-q086
  type: freeResponse
  prompt: Prove that a tangent to a circle is perpendicular to the radius drawn to the point of tangency.
  media:
  - type: image
    src: /assessments/aops/aops-circles-tangent.svg
    alt: Circle centered at O with tangent through T and radius OT.
  difficultyDimensions:
  - Setup a proof by contradiction assuming the perpendicular falls elsewhere.
  - Show the assumed perpendicular is shorter than the radius, placing it inside the circle.
  - Conclude this violates the definition of a tangent (which only touches the circle once).
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Assumes the tangent is not perpendicular.
    - Drops the true perpendicular to a different point $H$.
    - Shows $H$ lies inside the circle because $OH<r$.
    - Contradicts the one-point intersection property of a tangent.
  explanation: 'Solution:

    Let $T$ be the point of tangency on circle $O$. A tangent intersects the circle at exactly one point,
    so every other point on the tangent line lies strictly outside the circle.

    Since $T$ is on the circle, $OT = r$.

    Any other point $P$ on the tangent line is outside the circle, so $OP > r$.

    Therefore, $OT$ is the shortest distance from the center $O$ to the tangent line.

    The shortest distance from a point to a line is the perpendicular segment. Thus, $OT$ is perpendicular
    to the tangent line at $T$.


    Why it works:

    This proof elegantly uses the definition of a tangent (touching only at $T$) to establish $T$ as the
    unique closest point on the line to the center. Since the closest point is always the foot of the
    perpendicular, the radius must be perpendicular.

    '
