schemaVersion: 1
id: calc2-polar-curves-test
title: Polar Curves Test
assessmentType: test
categoryId: calculus-2
subcategoryIds:
  - polar-curves
modeDefault: test
randomizeQuestions: true
questions:
  - id: q-polar-curves-test-1
    type: numericResponse
    title: Number of Intersection Points
    prompt: |
      Find the total number of distinct intersection points between the two polar curves:
      
      $$
      r = \sin(2\theta)
      $$
      $$
      r = \cos(2\theta)
      $$
      
      for $0 \le \theta < 2\pi$. 
      (Be sure to count all points where their paths cross, even if they reach them at different $\theta$-values, and include the pole if they both cross it).
    answer:
      expectedNumeric: 9
      tolerance: 0.000001
    explanation: |
      Set $r_1 = r_2$ or $r_1 = -r_2$:
      $\sin(2\theta) = \cos(2\theta) \implies \tan(2\theta) = 1$
      $2\theta = \frac{\pi}{4}, \frac{5\pi}{4}, \frac{9\pi}{4}, \frac{13\pi}{4} \implies \theta = \frac{\pi}{8}, \frac{5\pi}{8}, \frac{9\pi}{8}, \frac{13\pi}{8}$.
      This gives 4 distinct points (since none map to the same physical location).
      
      Now check $\sin(2\theta) = -\cos(2\theta)$ (because a point $(r, \theta)$ is the same as $(-r, \theta+\pi)$):
      $\tan(2\theta) = -1 \implies 2\theta = \frac{3\pi}{4}, \frac{7\pi}{4}, \frac{11\pi}{4}, \frac{15\pi}{4} \implies \theta = \frac{3\pi}{8}, \frac{7\pi}{8}, \frac{11\pi}{8}, \frac{15\pi}{8}$.
      This gives 4 more distinct points.
      
      Finally, check the pole. 
      $r = \sin(2\theta) = 0$ for $\theta = 0, \frac{\pi}{2}$, etc.
      $r = \cos(2\theta) = 0$ for $\theta = \frac{\pi}{4}, \frac{3\pi}{4}$, etc.
      Since both curves pass through the pole, the pole is an intersection point.
      
      Total intersection points = 4 + 4 + 1 = 9.
    skills:
      - polar-curves

  - id: q-polar-curves-test-2
    type: multipleChoice
    title: Translating a Polar Curve
    prompt: |
      If the graph of $r = 2\cos\theta$ is translated up by 1 unit in the Cartesian plane, what is the new polar equation?
    choices:
      - id: c1
        text: '$r = 2\cos\theta + \sin\theta$'
      - id: c2
        text: '$r = \cos\theta + 2\sin\theta$'
      - id: c3
        text: '$r^2 - 2r\cos\theta - 2r\sin\theta + 1 = 0$'
      - id: c4
        text: '$r^2 = 2r\cos\theta + 2r\sin\theta$'
    answer:
      correctChoiceId: c3
    explanation: |
      The original curve $r = 2\cos\theta$ is the circle $x^2 + y^2 = 2x$, or $(x - 1)^2 + y^2 = 1$.
      Translating it up by 1 unit changes it to $(x - 1)^2 + (y - 1)^2 = 1$.
      Expand this Cartesian equation:
      $x^2 - 2x + 1 + y^2 - 2y + 1 = 1$
      $x^2 + y^2 - 2x - 2y + 1 = 0$
      
      Convert back to polar ($x = r\cos\theta$, $y = r\sin\theta$, $x^2 + y^2 = r^2$):
      $r^2 - 2r\cos\theta - 2r\sin\theta + 1 = 0$.
    skills:
      - polar-curves

  - id: q-polar-curves-test-3
    type: symbolicResponse
    title: Identifying Limacon Inner Loop
    prompt: |
      Consider the polar curve $r = 2 - 4\cos\theta$. 
      The curve traces an inner loop for values of $\theta$ where $r \le 0$.
      
      What is the smallest positive angle $\theta$ (in $[0, 2\pi)$) where the curve crosses the pole to begin or end the inner loop? (Enter your answer in terms of $\pi$)
    answer:
      expectedLatex: '\frac{\pi}{3}'
      equivalenceMode: algebraic
      variables: []
      tolerance: 0.000001
    explanation: |
      Set $r = 0$ to find where the curve crosses the pole:
      $2 - 4\cos\theta = 0 \implies \cos\theta = \frac{1}{2}$
      
      In the interval $[0, 2\pi)$, $\cos\theta = \frac{1}{2}$ at $\theta = \frac{\pi}{3}$ and $\theta = \frac{5\pi}{3}$.
      The smallest positive angle is $\frac{\pi}{3}$.
