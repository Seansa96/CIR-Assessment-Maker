workedExamples:
  - id: limacon-inner-loop-area-example
    title: Finding the Bounds and Area of an Inner Loop
    problem: |
      ![Polar graph of r=1+2cos theta with the inner loop interval highlighted](/assessments/calc2-parametric-polar/polar-review-limacon-inner-loop-bounds-1-plus-2cos.svg)

      Find the area of the inner loop of the limacon

      $$
      r=1+2\cos\theta.
      $$

      Provide the setup integral and the final decimal answer rounded to three decimal places.
    steps:
      - id: limacon-inner-loop-step-1
        title: Find where the curve passes through the pole
        instruction: |
          Inner-loop bounds usually come from where the polar curve passes through the pole.

          Passing through the pole means:

          $$
          r=0.
          $$

          For this curve:

          $$
          1+2\cos\theta=0.
          $$
        type: multipleChoice
        prompt: Which equation finds the angles where the loop begins and ends?
        choices:
          - id: a
            text: '$1+2\cos\theta=0$'
          - id: b
            text: '$1+2\cos\theta=1$'
          - id: c
            text: '$\cos\theta=1$'
          - id: d
            text: '$2\cos\theta=1$'
        answer:
          choiceId: a
        explanation: |
          The inner loop starts and ends at the pole, so set $r=0$:

          $$
          1+2\cos\theta=0.
          $$

          Related topic: polar loop bounds from zeros of $r$.
      - id: limacon-inner-loop-step-2
        title: Solve the pole equation
        instruction: |
          Solve:

          $$
          1+2\cos\theta=0.
          $$

          This gives:

          $$
          \cos\theta=-\frac12.
          $$
        type: multipleChoice
        prompt: On $0\le\theta<2\pi$, what angles solve $\cos\theta=-\frac12$?
        choices:
          - id: a
            text: '$\theta=\frac{2\pi}{3},\frac{4\pi}{3}$'
          - id: b
            text: '$\theta=\frac{\pi}{3},\frac{5\pi}{3}$'
          - id: c
            text: '$\theta=0,\pi$'
          - id: d
            text: '$\theta=\frac{\pi}{2},\frac{3\pi}{2}$'
        answer:
          choiceId: a
        explanation: |
          Since cosine is negative in Quadrants II and III:

          $$
          \theta=\frac{2\pi}{3},\frac{4\pi}{3}.
          $$
      - id: limacon-inner-loop-step-3
        title: Interpret negative radius geometrically
        instruction: |
          Between $\frac{2\pi}{3}$ and $\frac{4\pi}{3}$, the value of $r=1+2\cos\theta$ is negative.

          A negative polar radius does not mean the point disappears. It means the point is plotted in the opposite direction from the ray angle.
        type: multipleChoice
        prompt: Why does the interval $\frac{2\pi}{3}\le\theta\le\frac{4\pi}{3}$ trace the inner loop?
        choices:
          - id: a
            text: 'Because $r<0$ between the pole crossings, so the plotted points flip across the pole and trace the small loop.'
          - id: b
            text: 'Because $r>0$ between the pole crossings, so the graph moves farthest right.'
          - id: c
            text: 'Because cosine is zero throughout that interval.'
          - id: d
            text: 'Because polar area can only use negative values of $r$.'
        answer:
          choiceId: a
        explanation: |
          The zeros mark where the curve enters and leaves the pole. Between those zeros, $r$ is negative, so the points are reflected through the pole. That reflected portion is the inner loop.

          This is the key geometric reason the bounds are not chosen randomly.
      - id: limacon-inner-loop-step-4
        title: Choose the polar area formula
        instruction: |
          The area enclosed by a polar curve between two angles is:

          $$
          A=\frac12\int_\alpha^\beta r^2\,d\theta.
          $$

          Squaring $r$ makes the area positive even when $r$ is negative on the interval.
        type: multipleChoice
        prompt: Which integral sets up the inner-loop area?
        choices:
          - id: a
            text: '$\frac12\int_{2\pi/3}^{4\pi/3}(1+2\cos\theta)^2\,d\theta$'
          - id: b
            text: '$\int_{0}^{2\pi}(1+2\cos\theta)^2\,d\theta$'
          - id: c
            text: '$\frac12\int_{0}^{2\pi}(1+2\cos\theta)\,d\theta$'
          - id: d
            text: '$\frac12\int_{\pi/3}^{5\pi/3}(1+2\cos\theta)^2\,d\theta$'
        answer:
          choiceId: a
        explanation: |
          The inner loop is traced from $\theta=\frac{2\pi}{3}$ to $\theta=\frac{4\pi}{3}$, so:

          $$
          \boxed{
          A=\frac12\int_{2\pi/3}^{4\pi/3}(1+2\cos\theta)^2\,d\theta
          }.
          $$
      - id: limacon-inner-loop-step-5
        title: Expand the integrand
        instruction: |
          To evaluate the integral, expand:

          $$
          (1+2\cos\theta)^2.
          $$

          Then use:

          $$
          \cos^2\theta=\frac{1+\cos2\theta}{2}.
          $$
        type: multipleChoice
        prompt: Which expression is equivalent to $(1+2\cos\theta)^2$?
        choices:
          - id: a
            text: '$3+4\cos\theta+2\cos2\theta$'
          - id: b
            text: '$1+4\cos\theta+2\cos2\theta$'
          - id: c
            text: '$3+2\cos\theta+4\cos2\theta$'
          - id: d
            text: '$1+2\cos\theta+4\cos2\theta$'
        answer:
          choiceId: a
        explanation: |
          Expand first:

          $$
          (1+2\cos\theta)^2=1+4\cos\theta+4\cos^2\theta.
          $$

          Then use the power-reduction identity:

          $$
          4\cos^2\theta=2+2\cos2\theta.
          $$

          So:

          $$
          (1+2\cos\theta)^2=3+4\cos\theta+2\cos2\theta.
          $$
      - id: limacon-inner-loop-step-6
        title: Evaluate exactly
        instruction: |
          An antiderivative of the half-integrand is:

          $$
          \frac12\left(3\theta+4\sin\theta+\sin2\theta\right).
          $$

          Evaluate this from $\frac{2\pi}{3}$ to $\frac{4\pi}{3}$.
        type: multipleChoice
        prompt: What exact area is obtained?
        choices:
          - id: a
            text: '$\pi-\frac{3\sqrt3}{2}$'
          - id: b
            text: '$\pi+\frac{3\sqrt3}{2}$'
          - id: c
            text: '$2\pi-3\sqrt3$'
          - id: d
            text: '$\frac{\pi}{2}-\frac{3\sqrt3}{2}$'
        answer:
          choiceId: a
        explanation: |
          Using:

          $$
          A=\frac12\int_{2\pi/3}^{4\pi/3}(3+4\cos\theta+2\cos2\theta)\,d\theta,
          $$

          the exact area is:

          $$
          A=\pi-\frac{3\sqrt3}{2}.
          $$
      - id: limacon-inner-loop-step-7
        title: Round the final answer
        instruction: |
          The prompt asks for a decimal rounded to three places.
        type: numericResponse
        prompt: 'What is $\pi-\frac{3\sqrt3}{2}$ rounded to three decimal places?'
        answer:
          value: 0.543
          tolerance: 0.001
        explanation: |
          Numerically:

          $$
          \pi-\frac{3\sqrt3}{2}\approx0.543516.
          $$

          Therefore:

          $$
          \boxed{
          A=\frac12\int_{2\pi/3}^{4\pi/3}(1+2\cos\theta)^2\,d\theta
          =
          \pi-\frac{3\sqrt3}{2}
          \approx0.543.
          }
          $$

          Related topic: polar area for inner loops and interpreting negative radius intervals.
