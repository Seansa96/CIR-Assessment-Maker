schemaVersion: 1
id: aops-linear-equations-recall
title: Linear Equations Recall Drill
assessmentType: recallDrill
categoryId: art-of-problem-solving
topicId: aops-linear-equations
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - art-of-problem-solving
  - aops-linear-equations
  - equation-vocabulary
skills:
- Recall equation and system classifications
- Recognize reversible transformations and modeling cues
items:
- id: equivalence-invariant
  type: flashcard
  prompt: What invariant should be preserved through every reversible solving step?
  answer:
    expected: The equation should retain exactly the same solution set.
  explanation: Equivalent equations have identical solutions.
  tags: [equivalence]
- id: identity-classification
  type: typed
  prompt: What solution count is indicated by $0=0$ with no additional restrictions?
  answer:
    expected: infinitely many
    aliases: [all real values, every real number]
  explanation: An identity imposes no restriction.
  tags: [identity]
- id: contradiction-classification
  type: typed
  prompt: What solution count is indicated by $0=7$?
  answer:
    expected: no solution
    aliases: [none, empty solution set]
  explanation: The remaining statement is impossible.
  tags: [contradiction]
- id: nonzero-division-condition
  type: cloze
  prompt: Division by an expression preserves equivalence only after showing that expression is ____.
  answer:
    expected: nonzero
    aliases: [not zero]
  explanation: Division by zero is undefined and may discard a valid case.
  tags: [equivalence]
- id: system-solution-meaning
  type: flashcard
  prompt: What does a solution of a two-equation system satisfy?
  answer:
    expected: Both original equations simultaneously.
  explanation: A point on only one line is not a system solution.
  tags: [linear-system]
- id: substitution-cue
  type: flashcard
  prompt: When is substitution usually the shortest system method?
  answer:
    expected: When one variable is already isolated or easy to isolate.
  explanation: The isolated expression can be inserted directly into the other equation.
  tags: [substitution]
- id: elimination-cue
  type: flashcard
  prompt: When is elimination usually the shortest system method?
  answer:
    expected: When coefficients are already opposite or can be made opposite cheaply.
  explanation: Adding equation multiples then removes one variable.
  tags: [elimination]
- id: proportional-system-classification
  type: flashcard
  prompt: What solution count occurs when one system equation is a nonzero multiple of the other?
  answer:
    expected: Infinitely many solutions.
  explanation: Both equations describe the same line.
  tags: [system-classification]
- id: parallel-system-classification
  type: flashcard
  prompt: What is the graphical meaning of no solution in a two-line system?
  answer:
    expected: Distinct parallel lines.
  explanation: They have equal slopes but different intercepts and never meet.
  tags: [system-classification]
- id: distance-rate-time
  type: typed
  prompt: Complete the relationship distance = ____ times time.
  answer:
    expected: rate
    aliases: [speed]
  explanation: The units $(distance/time)(time)$ reduce to distance.
  tags: [modeling]
- id: model-variable-definition
  type: flashcard
  prompt: What two things should be stated when defining a model variable?
  answer:
    expected: What quantity it represents and its units.
  explanation: Meaning and units prevent ambiguous equations.
  tags: [modeling]
- id: original-equation-check
  type: flashcard
  prompt: Why should a candidate be checked in the original equation or system?
  answer:
    expected: To verify every transformation and every original restriction.
  explanation: Checking only a later line may miss an earlier algebra or modeling error.
  tags: [verification]
