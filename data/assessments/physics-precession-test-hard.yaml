modeDefault: exam
randomizeQuestions: true
questions:
- id: q1
  type: numericResponse
  prompt: If you double the spin angular velocity $\omega$ of a gyroscope, its precession
    angular velocity $\Omega$ will change by what factor?
  answer:
    value: 0.5
    tolerance: 0.1
  explanation: $\Omega = \frac{mgr}{I\omega}$, so $\Omega \propto 1/\omega$. Doubling
    $\omega$ halves $\Omega$.
