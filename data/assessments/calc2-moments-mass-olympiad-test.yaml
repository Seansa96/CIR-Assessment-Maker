questions:
- id: q001
  type: freeResponse
  skills:
  - moments-mass
  - olympiad-problem-solving
  prompt: A rod on $[0,2]$ has density $\rho(x)=x$. Find its center of mass.
  answer:
    gradingMode: selfCheck
    expected: $\bar x=\frac{22}3$.
    keyPoints:
    - 'Matches the reference result: $\bar x=\frac{22}3$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: Mass is $\int_0^2x dx=4/2$ and moment is $\int_0^2x\cdot x dx=8/3$. Their quotient is $22/3$.
