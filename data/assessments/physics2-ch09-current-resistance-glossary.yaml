schemaVersion: 1
id: physics2-ch09-current-resistance-glossary
title: Current & Resistance Glossary
assessmentType: glossary
categoryId: physics-2
topicId: physics2-current-resistance
glossary:
  introduction: Core terms for current and resistance.
  sections:
  - id: terms
    title: Core terms
    required: true
    content: Definitions of current and material properties.
    entries:
    - id: t1
      term: Electric Current
      definition: The rate of flow of electric charge, measured in Amperes.
    - id: t2
      term: Resistance
      definition: The opposition to current flow in a material, defined as the ratio
        of voltage to current ($R = V/I$).
    - id: t3
      term: Resistivity
      definition: An intrinsic property of a material that quantifies how strongly
        it resists electric current.
    - id: t4
      term: Drift Velocity
      definition: The average velocity attained by charged particles, such as electrons,
        in a material due to an electric field.
