    entries:
    - id: t1
      term: Electric Current
      definition: The rate of flow of electric charge, measured in Amperes.
      drills:
      - id: t1-drill
        type: flashcard
        prompt: What does Electric Current mean?
        answer:
          expected: The rate of flow of electric charge, measured in Amperes.
        explanation: 'Solution:


          The rate of flow of electric charge, measured in Amperes.


          Why it works:


          This definition identifies the essential meaning of Electric Current.'
        tags: []
    - id: t2
      term: Resistance
      definition: The opposition to current flow in a material, defined as the ratio of voltage to current
        ($R = V/I$).
      drills:
      - id: t2-drill
        type: flashcard
        prompt: What does Resistance mean?
        answer:
          expected: The opposition to current flow in a material, defined as the ratio of voltage to current
            ($R = V/I$).
        explanation: 'Solution:


          The opposition to current flow in a material, defined as the ratio of voltage to current ($R
          = V/I$).


          Why it works:


          This definition identifies the essential meaning of Resistance.'
        tags: []
    - id: t3
      term: Resistivity
      definition: An intrinsic property of a material that quantifies how strongly it resists electric
        current.
      drills:
      - id: t3-drill
        type: flashcard
        prompt: What does Resistivity mean?
        answer:
          expected: An intrinsic property of a material that quantifies how strongly it resists electric
            current.
        explanation: 'Solution:


          An intrinsic property of a material that quantifies how strongly it resists electric current.


          Why it works:


          This definition identifies the essential meaning of Resistivity.'
        tags: []
    - id: t4
      term: Drift Velocity
      definition: The average velocity attained by charged particles, such as electrons, in a material
        due to an electric field.
      drills:
      - id: t4-drill
