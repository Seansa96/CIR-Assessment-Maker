modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - classify-conditional-convergence
  - use-limit-comparison
  prompt: |
    Classify
    $$\sum_{n=1}^{\infty}(-1)^{n-1}\frac{n}{n^2+4}.$$
  choices:
  - id: a
    text: Absolutely convergent
  - id: b
    text: Conditionally convergent
  - id: c
    text: Divergent because the magnitudes behave like $1/n$
  - id: d
    text: Divergent because the ratio-test limit is $1$
  answer:
    choiceId: b
  explanation: |-
    The magnitudes tend to zero and decrease for $n\ge2$, so the signed series converges; their ratio to $1/n$ tends to $1$, so absolute convergence fails.
- id: q002
  type: multipleChoice
  skills:
  - classify-conditional-convergence
  - verify-eventual-monotonicity
  prompt: |
    What is the convergence classification of
    $$\sum_{n=2}^{\infty}(-1)^n\frac{\ln n}{n}?$$
  choices:
  - id: a
    text: Absolutely convergent by comparison with $1/n$
  - id: b
    text: Conditionally convergent
  - id: c
    text: |-
      Divergent because $\ln n$ grows
  - id: d
    text: Geometric with ratio $-1$
  answer:
    choiceId: b
  explanation: |-
    The function $\ln x/x$ decreases after $x=e$ and tends to zero, while $\sum\ln n/n$ diverges by the integral test.
- id: q003
  type: multipleChoice
  skills:
  - classify-parameter-families
  prompt: |
    For real $p$, when is
    $$\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{n^p}$$
    conditionally convergent?
  choices:
  - id: a
    text: $p>1$
  - id: b
    text: |-
      $0<p\le1$
  - id: c
    text: |-
      $p\le0$
  - id: d
    text: All real $p$
  answer:
    choiceId: b
  explanation: |-
    Signed convergence begins at $p>0$, whereas absolute convergence begins only at $p>1$; their difference is $0<p\le1$.
- id: q004
  type: multipleChoice
  skills:
  - apply-ratio-test-to-absolute-values
  prompt: |
    Classify
    $$\sum_{n=1}^{\infty}(-1)^{n(n+1)/2}\frac{3^n}{n!}.$$
  choices:
  - id: a
    text: Absolutely convergent
  - id: b
    text: Conditionally convergent
  - id: c
    text: Divergent because the signs are not strictly alternating
  - id: d
    text: Divergent by the term test
  answer:
    choiceId: a
  explanation: |-
    Regardless of the signs, the absolute ratio is $3/(n+1)\to0$, so the series of magnitudes converges.
- id: q005
  type: multipleChoice
  skills:
  - classify-radical-series
  - rationalize-differences
  prompt: |
    Determine the strongest classification of
    $$\sum_{n=1}^{\infty}(-1)^{n-1}\left(\sqrt{n+1}-\sqrt n\right).$$
  choices:
  - id: a
    text: Absolutely convergent
  - id: b
    text: Conditionally convergent
  - id: c
    text: Divergent because each radical grows
  - id: d
    text: Telescoping to $1$
  answer:
    choiceId: b
  explanation: |-
    Rationalization gives magnitude $1/(\sqrt{n+1}+\sqrt n)$, which decreases to zero but is comparable to $1/\sqrt n$, so only conditional convergence holds.
- id: q006
  type: multipleChoice
  skills:
  - classify-composed-magnitudes
  - use-limit-comparison
  prompt: |
    Classify
    $$\sum_{n=1}^{\infty}(-1)^n\arctan(1/n).$$
  choices:
  - id: a
    text: Absolutely convergent because arctangent is bounded
  - id: b
    text: Conditionally convergent
  - id: c
    text: |-
      Divergent because $\arctan(1/n)$ is positive
  - id: d
    text: Divergent because the signs alternate
  answer:
    choiceId: b
  explanation: |-
    The magnitudes decrease to zero, but $\arctan(1/n)/(1/n)\to1$, so their positive series diverges like the harmonic series.
- id: q007
  type: multipleChoice
  skills:
  - reason-about-series-sums
  prompt: |
    Suppose $\sum a_n$ converges conditionally and $\sum b_n$ converges
    absolutely. Which statement must be true?
  choices:
  - id: a
    text: |-
      $\sum(a_n+b_n)$ converges conditionally.
  - id: b
    text: |-
      $\sum(a_n+b_n)$ converges absolutely.
  - id: c
    text: |-
      $\sum(a_n+b_n)$ diverges.
  - id: d
    text: No convergence conclusion is possible.
  answer:
    choiceId: a
  explanation: |-
    The sum series converges, and if it were absolute then $\sum|a_n|$ would converge by $|a_n|\le|a_n+b_n|+|b_n|$, contradicting conditionality.
- id: q008
  type: multipleChoice
  skills:
  - reason-about-rearrangements
  prompt: |
    Which hypothesis guarantees that every rearrangement of $\sum a_n$
    converges to the original sum?
  choices:
  - id: a
    text: |-
      $a_n\to0$
  - id: b
    text: |-
      $\sum a_n$ converges conditionally
  - id: c
    text: |-
      $\sum|a_n|$ converges
  - id: d
    text: The positive and negative terms occur equally often
  answer:
    choiceId: c
  explanation: Absolute convergence controls the total magnitude of every tail, making finite permutations
    and then arbitrary rearrangements sum-invariant.
- id: q009
  type: multipleChoice
  skills:
  - analyze-positive-and-negative-parts
  prompt: |
    Define $a_n^+=\max(a_n,0)$ and $a_n^-=\max(-a_n,0)$. Which condition is
    equivalent to absolute convergence of $\sum a_n$?
  choices:
  - id: a
    text: |-
      Both $\sum a_n^+$ and $\sum a_n^-$ converge.
  - id: b
    text: |-
      At least one of $\sum a_n^+$ and $\sum a_n^-$ diverges.
  - id: c
    text: $a_n^+=a_n^-$ for every $n$.
  - id: d
    text: The two partial sums have the same limit.
  answer:
    choiceId: a
  explanation: Since $|a_n|=a_n^++a_n^-$, convergence of the nonnegative absolute series is equivalent
    to convergence of both nonnegative component series.
- id: q010
  type: multipleChoice
  skills:
  - select-comparison-directions
  prompt: |
    A student observes $0\le |a_n|\le1/n$ and concludes that $\sum a_n$
    converges absolutely. What is wrong?
  choices:
  - id: a
    text: An upper bound by a divergent series cannot prove convergence.
  - id: b
    text: Absolute values cannot be compared.
  - id: c
    text: The harmonic series converges too slowly.
  - id: d
    text: The inequality proves conditional convergence instead.
  answer:
    choiceId: a
  explanation: |-
    Direct comparison proves convergence only when the upper comparison series converges; $\sum1/n$ does not.
- id: q011
  type: multipleChoice
  skills:
  - classify-logarithmic-p-series
  prompt: |
    For which $q$ is
    $$\sum_{n=2}^{\infty}\frac{(-1)^n}{n(\ln n)^q}$$
    conditionally convergent?
  choices:
  - id: a
    text: $q>1$
  - id: b
    text: |-
      $q\le1$
  - id: c
    text: |-
      $q\le0$ only
  - id: d
    text: No real $q$
  answer:
    choiceId: b
  explanation: The magnitudes eventually decrease to zero for every real $q$, while the positive logarithmic
    p-series converges exactly for $q>1$.
- id: q012
  type: multipleChoice
  skills:
  - apply-root-test
  - classify-absolute-convergence
  prompt: |
    Determine the convergence type of
    $$\sum_{n=1}^{\infty}(-1)^n\frac{n^4}{5^n}.$$
  choices:
  - id: a
    text: Absolutely convergent because the root-test limit is $1/5$
  - id: b
    text: Conditionally convergent because signs alternate
  - id: c
    text: Divergent because $n^4$ grows
  - id: d
    text: The root test is inconclusive with limit $1$
  answer:
    choiceId: a
  explanation: |-
    The nth root of the magnitude is $n^{4/n}/5\to1/5<1$, proving convergence of the absolute-value series.
- id: q013
  type: multipleChoice
  skills:
  - analyze-grouped-series
  prompt: |
    A convergent series is grouped as
    $(a_1+a_2)+(a_3+a_4)+\cdots$ without changing term order. Which statement
    is correct?
  choices:
  - id: a
    text: The grouped series converges to the same sum.
  - id: b
    text: The sum may change whenever convergence is conditional.
  - id: c
    text: Grouping always produces absolute convergence.
  - id: d
    text: The grouped series must diverge if signs alternate.
  answer:
    choiceId: a
  explanation: Grouped partial sums form a subsequence of the original convergent partial sums, so they
    approach the same limit when every term remains in order.
- id: q014
  type: multipleChoice
  skills:
  - test-absolute-convergence
  - use-asymptotic-equivalence
  prompt: |
    Classify
    $$\sum_{n=1}^{\infty}(-1)^{n-1}\sin(1/n).$$
  choices:
  - id: a
    text: Absolutely convergent
  - id: b
    text: Conditionally convergent
  - id: c
    text: Divergent because sine oscillates
  - id: d
    text: Divergent because the terms approach $1$
  answer:
    choiceId: b
  explanation: |-
    The magnitudes decrease to zero, while $\sin(1/n)/(1/n)\to1$, so the absolute series has harmonic behavior and diverges.
- id: q015
  type: multipleChoice
  skills:
  - reason-from-cauchy-criterion
  prompt: |
    If $\sum|a_n|$ converges, why must $\sum a_n$ satisfy the Cauchy
    criterion?
  choices:
  - id: a
    text: |-
      Because $|\sum_{k=m}^{n}a_k|\le\sum_{k=m}^{n}|a_k|$, whose tails become arbitrarily small.
  - id: b
    text: Because every $a_n$ is nonnegative.
  - id: c
    text: Because the signed tail always equals the absolute tail.
  - id: d
    text: Because the ratio $a_{n+1}/a_n$ must approach zero.
  answer:
    choiceId: a
  explanation: Convergence of the nonnegative magnitude series makes every sufficiently late magnitude
    tail small, and the triangle inequality bounds the signed tail by it.
