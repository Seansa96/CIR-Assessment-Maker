questions:
- id: q001
  type: freeResponse
  prompt: |-
    Classify $\sum_{n=2}^\infty(-1)^n\ln(n)/n$, including a proof of both its signed and absolute behavior.
  answer:
    gradingMode: selfCheck
    checkModel: Conditionally convergent; ln(n)/n decreases eventually to 0
    while its positive series diverges by the integral test.: null
  explanation: |-
    Solution: Establish eventual monotonicity before invoking the alternating-series test. Answer check: Conditionally convergent; ln(n)/n decreases eventually to 0

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.
- id: q002
  type: freeResponse
  prompt: |-
    For real $p$, classify $\sum_{n=2}^\infty(-1)^{n-1}/(n(\ln n)^p)$ for all p.
  answer:
    gradingMode: selfCheck
    checkModel: Divergent for p<=0; conditional for 0<p<=1; absolute for p>1.
  explanation: |-
    Solution: Alternation needs the magnitudes to tend to zero; the logarithmic p-series gives the absolute threshold.

    Why it works: Match the positive tail to $\sum 1/n^p$. Its threshold is strict: it converges only when $p>1$ and diverges for $p\le1$.

    Common trap: The harmonic boundary $p=1$ diverges, so replacing $p>1$ with $p\ge1$ changes the conclusion.
- id: q003
  type: freeResponse
  prompt: |-
    Classify $\sum_{n=1}^\infty(-1)^n\sqrt n/(n+1)$ and give the decisive necessary-condition argument.
  answer:
    gradingMode: selfCheck
    checkModel: Conditionally convergent; its positive magnitudes decrease to 0 and are asymptotic to 1/sqrt(n)
    so the absolute series diverges.: null
  explanation: |-
    Solution: Rewrite the magnitude as $\sqrt n/(n+1)$; it decreases to zero and is comparable to $1/\sqrt n$.

    Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.

    Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.
