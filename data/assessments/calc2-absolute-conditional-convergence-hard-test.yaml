- id: q006
  type: freeResponse
  prompt: |-
    Suppose $\sum a_n$ converges absolutely. Prove that every subseries obtained by retaining arbitrary terms converges absolutely.
  answer:
    gradingMode: selfCheck
    checkModel: Its absolute partial sums are increasing and bounded above by the full absolute series.
  explanation: |-
    Solution: Compare retained absolute terms with $\sum|a_n|$. Answer check: Its absolute partial sums are increasing and bounded above by the full absolute series.

    Why it works: Convergence of $\sum a_n$ requires the necessary condition $a_n\to0$. A nonzero limit, an infinite limit, or no limit immediately proves divergence.

    Common trap: $a_n\to0$ is necessary but not sufficient; the harmonic series is the standard counterexample.
