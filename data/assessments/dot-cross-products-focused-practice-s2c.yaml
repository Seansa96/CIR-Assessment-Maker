questions:
- { id: q001, type: multipleChoice, prompt: 'Compute $\langle1,2,-1\rangle\cdot\langle3,0,4\rangle$.', choices: [{ id: a, text: '$-1$' }, { id: b, text: '$7$', issueSignals: [{ id: dot-product-computation-error, domains: [] }] }, { id: c, text: '$\langle3,0,-4\rangle$', issueSignals: [{ id: scalar-vector-confusion, domains: [] }] }, { id: d, text: '$11$', issueSignals: [{ id: sign-error, domains: [] }] }], answer: { choiceId: a }, issueSignals: [{ id: dot-product-computation-error, domains: [] }], difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: Computes signed component products and interprets the scalar output., explanation: 'Solution: $1(3)+2(0)+(-1)(4)=-1$. Why it works: A dot product adds products of corresponding components. Why the other choices fail: b loses the negative product; c is componentwise multiplication; d adds components instead of products.' }
- { id: q002, type: multipleChoice, prompt: 'Which condition proves two nonzero vectors are perpendicular?', choices: [{ id: a, text: Their dot product is zero }, { id: b, text: Their cross product is zero, issueSignals: [{ id: dot-cross-confusion, domains: [] }] }, { id: c, text: Their magnitudes are equal, issueSignals: [{ id: dot-product-geometry-error, domains: [] }] }, { id: d, text: Their sum has magnitude one, issueSignals: [{ id: dot-product-geometry-error, domains: [] }] }], answer: { choiceId: a }, issueSignals: [{ id: dot-product-geometry-error, domains: [] }], difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: Connects the zero-dot-product condition to angle geometry., explanation: 'Solution: Their dot product is zero. Why it works: For nonzero vectors, $\mathbf u\cdot\mathbf v=|\mathbf u||\mathbf v|\cos\theta$, so zero means a right angle. Why the other choices fail: b signals parallel inputs; c and d do not determine the angle.' }
- { id: q003, type: multipleChoice, prompt: 'What is $\mathbf i\times\mathbf k$?', choices: [{ id: a, text: '$-\mathbf j$' }, { id: b, text: '$\mathbf j$', issueSignals: [{ id: cross-product-order-error, domains: [] }] }, { id: c, text: '$\mathbf k$', issueSignals: [{ id: cross-product-direction-error, domains: [] }] }, { id: d, text: '$\mathbf0$', issueSignals: [{ id: cross-product-direction-error, domains: [] }] }], answer: { choiceId: a }, issueSignals: [{ id: cross-product-order-error, domains: [] }], difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: Uses cyclic order and anti-commutativity., explanation: 'Solution: $\mathbf i\times\mathbf k=-\mathbf j$. Why it works: $\mathbf k\times\mathbf i=\mathbf j$, so reversing the order negates it. Why the other choices fail: b misses reversal; c is an input direction; d applies the parallel case.' }
- { id: q004, type: multipleChoice, prompt: 'Find $|\langle2,1,0\rangle\times\langle0,3,0\rangle|$.', choices: [{ id: a, text: '6' }, { id: b, text: '3', issueSignals: [{ id: cross-product-area-error, domains: [] }] }, { id: c, text: '7', issueSignals: [{ id: cross-product-computation-error, domains: [] }] }, { id: d, text: '$\langle0,0,6\rangle$', issueSignals: [{ id: scalar-vector-confusion, domains: [] }] }], answer: { choiceId: a }, issueSignals: [{ id: cross-product-area-error, domains: [] }], difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: Computes a cross-product magnitude as area., explanation: 'Solution: The cross product is $\langle0,0,6\rangle$, so its magnitude is 6. Why it works: Cross-product magnitude is parallelogram area. Why the other choices fail: b is the triangle area; c is not the computed magnitude; d is the vector before taking magnitude.' }
- { id: q005, type: multipleChoice, prompt: 'Which vector is normal to both $\langle1,1,0\rangle$ and $\langle1,-1,0\rangle$?', choices: [{ id: a, text: '$\langle0,0,-2\rangle$' }, { id: b, text: '$\langle2,0,0\rangle$', issueSignals: [{ id: normal-vector-method-error, domains: [] }] }, { id: c, text: '$\langle0,2,0\rangle$', issueSignals: [{ id: normal-vector-method-error, domains: [] }] }, { id: d, text: '$\langle1,0,0\rangle$', issueSignals: [{ id: normal-vector-method-error, domains: [] }] }], answer: { choiceId: a }, issueSignals: [{ id: normal-vector-method-error, domains: [] }], difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: Verifies a cross-product direction with orthogonality., explanation: 'Solution: $\langle0,0,-2\rangle$. Why it works: It is the cross product and its dot product with each input is zero. Why the other choices fail: b, c, and d have nonzero dot product with at least one input.' }
- { id: q006, type: multipleChoice, prompt: 'If $\mathbf u\cdot\mathbf v=12$, $|\mathbf u|=3$, and $|\mathbf v|=8$, what is the angle between them?', choices: [{ id: a, text: '$60^\circ$' }, { id: b, text: '$30^\circ$', issueSignals: [{ id: trigonometric-identity-misapplied, domains: [] }] }, { id: c, text: '$90^\circ$', issueSignals: [{ id: dot-product-geometry-error, domains: [] }] }, { id: d, text: '$0^\circ$', issueSignals: [{ id: dot-product-geometry-error, domains: [] }] }], answer: { choiceId: a }, issueSignals: [{ id: trigonometric-identity-misapplied, domains: [] }], difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: Solves the dot-product angle formula., explanation: 'Solution: $\cos\theta=12/(3\cdot8)=1/2$, so $\theta=60^\circ$. Why it works: The dot product links magnitudes and the included angle. Why the other choices fail: b uses the wrong inverse cosine; c would require dot product zero; d would require parallel vectors.' }
