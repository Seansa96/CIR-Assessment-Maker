questions:
- id: q001
  type: multipleChoice
  prompt: 'Compute $\langle1,2,-1\rangle\cdot\langle3,0,4\rangle$.'
  choices:
  - id: a
    text: $-1$
  - id: b
    text: $7$
    issueSignals:
    - id: trigonometric-identity-misapplied
  - id: c
    text: '$\langle3,0,-4\rangle$'
    issueSignals:
    - id: trigonometric-identity-misapplied
  - id: d
    text: $11$
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: trigonometric-identity-misapplied
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Multiply corresponding components and add.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Unit Circle Trigonometry.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q002
  type: multipleChoice
  prompt: Which condition proves two nonzero vectors are perpendicular?
  choices:
  - id: a
    text: Their dot product is zero
  - id: b
    text: Their cross product is zero
    issueSignals:
    - id: trigonometric-identity-misapplied
  - id: c
    text: Their magnitudes are equal
    issueSignals:
    - id: trigonometric-identity-misapplied
  - id: d
    text: Their sum is zero
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: trigonometric-identity-misapplied
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Orthogonal vectors have zero dot product.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Unit Circle Trigonometry.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q003
  type: multipleChoice
  prompt: 'What is $\mathbf i\times\mathbf k$?'
  choices:
  - id: a
    text: '$-\mathbf j$'
  - id: b
    text: '$\mathbf j$'
    issueSignals:
    - id: trigonometric-identity-misapplied
  - id: c
    text: '$\mathbf k$'
    issueSignals:
    - id: trigonometric-identity-misapplied
