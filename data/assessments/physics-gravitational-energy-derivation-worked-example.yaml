- id: ex-gravitational-energy
  title: Gravity Work to Potential Energy
  problem: |
    Let's derive the formula for gravitational potential energy near Earth's surface ($U_g = mgy$) by calculating the work done by gravity.
  steps:
  - id: step-1
    title: Step 1 — Vector Dot Product
    instruction: |
      Start with the gravity force vector $\vec F_g = -mg \hat j$ (where $\hat j$ points upward).
      The 3D displacement vector is $d\vec r = dx\hat i + dy\hat j + dz\hat k$.
    type: symbolicResponse
    prompt: Evaluate the dot product $dW = \vec F_g \cdot d\vec r$.
    answer:
      gradingMode: auto
      expectedLatex: -mg \, dy
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Solution: Only the $\hat j$ components survive, so $dW=-mg\,dy$.

      Why it works: Orthogonal unit vectors have zero dot product.
  - id: step-2
    title: Step 2 — Integrate Work
    instruction: |
      Now integrate this tiny amount of work from an initial height $y_i$ to a final height $y_f$.
    type: symbolicResponse
    prompt: What is the resulting expression for $W_g$ after evaluating the integral $\int_{y_i}^{y_f} -mg \, dy$?
    answer:
      gradingMode: auto
      expectedLatex: -mg(y_f - y_i)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Solution: $W_g=-mg[y]_{y_i}^{y_f}=-mg(y_f-y_i)$.

      Why it works: Mass and gravitational acceleration are constant near Earth''s surface.
  - id: step-3
    title: Step 3 — Define Potential Energy
    instruction: |
      We define potential energy such that the work done by the conservative force equals the negative change in potential energy: $W_g = -\Delta U_g$.
    type: symbolicResponse
    prompt: By matching $-mg(y_f - y_i)$ to $-(U_{g,f} - U_{g,i})$, what is the formula for $U_g$ at height $y$?
    answer:
      gradingMode: auto
      expectedLatex: mgy
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Solution: Define $U_g=mgy$ relative to a chosen $y=0$ reference.

      Why it works: Then $W_g=-\Delta U_g$ for every vertical displacement.

- id: ex-gravitational-energy-numeric
  title: Calculate a Gravitational Potential-Energy Change
  problem: A 3.0 kg equipment case is raised from a 1.0 m platform to a 4.0 m shelf. Find its change in gravitational potential energy using $g=9.8$ m/s$^2$.
  steps:
  - id: numeric-step-1
    title: Find the vertical displacement
    instruction: Subtract initial height from final height.
    type: numericResponse
    prompt: What is $\Delta y$ in m?
    choices: []
    answer: { value: 3.0, tolerance: 0.001 }
    explanation: |
      Solution: $\Delta y=4.0-1.0=3.0$ m.

      Why it works: Potential-energy change depends on the difference in height, not the selected zero level.
  - id: numeric-step-2
    title: Calculate the energy change
    instruction: Use $\Delta U_g=mg\Delta y$.
    type: numericResponse
    prompt: What is $\Delta U_g$ in J?
    choices: []
    answer: { value: 88.2, tolerance: 0.01 }
    explanation: |
      Solution: $\Delta U_g=(3.0)(9.8)(3.0)=+88.2$ J.

      Why it works: Raising the case increases its gravitational potential energy.
