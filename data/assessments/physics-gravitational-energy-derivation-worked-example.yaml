workedExamples:
- id: ex-gravitational-energy
  title: Gravity Work to Potential Energy
  problem: |
    Let's derive the formula for gravitational potential energy near Earth's surface ($U_g = mgy$) by calculating the work done by gravity.
  steps:
  - id: step-1
    title: Step 1 — Vector Dot Product
    instruction: |
      Start with the gravity force vector $\vec F_g = -mg \hat j$ (where $\hat j$ points upward).
      The 3D displacement vector is $d\vec r = dx\hat i + dy\hat j + dz\hat k$.
    type: symbolicResponse
    prompt: Evaluate the dot product $dW = \vec F_g \cdot d\vec r$.
    answer:
      gradingMode: auto
      expectedLatex: -mg \, dy
      equivalenceMode: expression
      tolerance: 0
    explanation: Only the $\hat j$ components survive because $\hat j \cdot \hat i = 0$ and $\hat j \cdot \hat k = 0$. So $dW = -mg \, dy$.
  - id: step-2
    title: Step 2 — Integrate Work
    instruction: |
      Now integrate this tiny amount of work from an initial height $y_i$ to a final height $y_f$.
    type: symbolicResponse
    prompt: What is the resulting expression for $W_g$ after evaluating the integral $\int_{y_i}^{y_f} -mg \, dy$?
    answer:
      gradingMode: auto
      expectedLatex: -mg(y_f - y_i)
      equivalenceMode: expression
      tolerance: 0
    explanation: The integral evaluates to $-mg [y]_{y_i}^{y_f} = -mg(y_f - y_i)$.
  - id: step-3
    title: Step 3 — Define Potential Energy
    instruction: |
      We define potential energy such that the work done by the conservative force equals the negative change in potential energy: $W_g = -\Delta U_g$.
    type: symbolicResponse
    prompt: By matching $-mg(y_f - y_i)$ to $-(U_{g,f} - U_{g,i})$, what is the formula for $U_g$ at height $y$?
    answer:
      gradingMode: auto
      expectedLatex: mgy
      equivalenceMode: expression
      tolerance: 0
    explanation: We define $U_g = mgy$. Note that this is relative to wherever you decide $y=0$ is!
