schemaVersion: 1
id: aops-linear-equations-glossary
title: Linear Equations Glossary
assessmentType: glossary
categoryId: art-of-problem-solving
topicId: aops-linear-equations
modeDefault: practice
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: glossary
  tags:
  - art-of-problem-solving
  - aops-linear-equations
  - equation-vocabulary
  - system-vocabulary
skills:
- Interpret equation and system classifications precisely
- Recognize equivalence-preserving methods and exceptional cases
- Use modeling terminology with units and constraints
glossary:
  introduction: |-
    Linear-equation vocabulary describes solution sets and legal transformations. These are not interchangeable labels: identity, contradiction, equivalence, and verification each make a different mathematical claim.
  sections:
  - id: equation-structure
    title: Equation Structure and Classification
    required: true
    content: These terms describe what an equation requires and how many values satisfy it.
    entries:
    - id: equation
      term: Equation
      definition: A statement that two expressions are equal for specified values of their variables.
      notation: '$L=R$'
      examples: ['$3x-7=14$ is true when $x=7$.']
      aliases: []
      media: []
      tags: [equation]
      drills:
      - id: equation-drill
        type: flashcard
        prompt: What does solving an equation seek?
        answer:
          expected: Every value that makes the equality true.
        explanation: A solution belongs to the equation's solution set.
        tags: [equation]
    - id: solution-set
      term: Solution Set
      definition: The complete collection of values that make an equation or every equation in a system true.
      notation: null
      examples: ['The solution set of $x^2=1$ is $\{-1,1\}$.']
      aliases: [solutions]
      media: []
      tags: [solution-set]
      drills:
      - id: solution-set-drill
        type: flashcard
        prompt: Why is one example point insufficient for a system with infinitely many solutions?
        answer:
          expected: A solution set must describe every point satisfying the system.
        explanation: One point demonstrates existence but not completeness.
        tags: [solution-set]
    - id: equivalent-equations
      term: Equivalent Equations
      definition: Equations having exactly the same solution set.
      notation: '$E_1\iff E_2$'
      examples: ['$3x=12$ and $x=4$ are equivalent.']
      aliases: []
      media: []
      tags: [equivalence]
      drills:
      - id: equivalent-equations-drill
        type: flashcard
        prompt: What must two equivalent equations share?
        answer:
          expected: Exactly the same solution set.
        explanation: Similar appearance is irrelevant if their solutions differ.
        tags: [equivalence]
    - id: identity
      term: Identity
      definition: An equation true for every value in its stated domain, often revealed after simplification as $0=0$.
      notation: null
      examples: ['$4x+2=4x+2$ is an identity over the reals.']
      aliases: []
      media: []
      tags: [identity]
      drills:
      - id: identity-drill
        type: typed
        prompt: How many real solutions does an equation have if it simplifies to $0=0$ with no domain restrictions?
        answer:
          expected: infinitely many
          aliases: [all real numbers, every real number]
        explanation: The identity imposes no restriction on the variable.
        tags: [identity]
    - id: contradiction
      term: Contradiction
      definition: An impossible statement such as $0=5$ obtained after valid simplification, proving that the original equation has no solution.
      notation: null
      examples: ['$3x-5=3x+1$ simplifies to $-5=1$.']
      aliases: [inconsistent equation]
      media: []
      tags: [contradiction]
      drills:
      - id: contradiction-drill
        type: typed
        prompt: How is an equation classified when valid simplification produces $2=9$?
        answer:
          expected: no solution
          aliases: [inconsistent, empty solution set]
        explanation: No variable value can make a false numerical statement true.
        tags: [contradiction]
    - id: coefficient
      term: Coefficient
      definition: A numerical or parameter factor multiplying a variable.
      notation: '$a$ in $ax$'
      examples: ['In $(k-2)x=6$, the coefficient of $x$ is $k-2$.']
      aliases: []
      media: []
      tags: [coefficient]
      drills:
      - id: coefficient-drill
        type: typed
        prompt: What is the coefficient of $x$ in $(m+4)x=7$?
        answer:
          expected: m+4
          aliases: ['$m+4$']
        explanation: The full factor multiplying the variable is its coefficient.
        tags: [coefficient]
    - id: parameter
      term: Parameter
      definition: A symbol treated as fixed within one equation but allowed to vary across a family of equations, potentially changing the solution classification.
      notation: null
      examples: ['In $(k-2)x=k-2$, $k$ is a parameter and $x$ is the unknown.']
      aliases: []
      media: []
      tags: [parameter]
      drills:
      - id: parameter-drill
        type: flashcard
        prompt: Why must a parameter value that makes a variable coefficient zero be checked separately?
        answer:
          expected: Division by that coefficient would be illegal and the solution count may change.
        explanation: The exceptional value can create an identity or contradiction.
        tags: [parameter]
  - id: systems-and-models
    title: Systems and Models
    required: true
    content: These terms describe simultaneous constraints and their translation from context.
    entries:
    - id: linear-system
      term: Linear System
      definition: A collection of linear equations whose solution must satisfy every equation simultaneously.
      notation: null
      examples: ['$x+y=9$ and $x-y=1$ have the shared solution $(5,4)$.']
      aliases: [system of linear equations]
      media: []
      tags: [linear-system]
      drills:
      - id: linear-system-drill
        type: flashcard
        prompt: What must an ordered pair do to solve a two-equation system?
        answer:
          expected: It must make both original equations true.
        explanation: Satisfying only one equation is insufficient.
        tags: [linear-system]
    - id: substitution-method
      term: Substitution Method
      definition: Solving a system by replacing a variable with an equal expression from another equation.
      notation: null
      examples: ['If $y=3x-2$, replace $y$ by $3x-2$ in the other equation.']
      aliases: [substitution]
      media: []
      tags: [substitution]
      drills:
      - id: substitution-method-drill
        type: flashcard
        prompt: What structural cue makes substitution especially efficient?
        answer:
          expected: A variable is already isolated or has an easy coefficient.
        explanation: The replacement can then be made without extra elimination steps.
        tags: [substitution]
    - id: elimination-method
      term: Elimination Method
      definition: Solving a system by adding suitable equation multiples so one variable's coefficients cancel.
      notation: null
      examples: ['Adding $4x+3y=8$ and $2x-3y=10$ eliminates $y$.']
      aliases: [linear combination method]
      media: []
      tags: [elimination]
      drills:
      - id: elimination-method-drill
        type: typed
        prompt: What operation eliminates $y$ from equations containing $+5y$ and $-5y$?
        answer:
          expected: add the equations
          aliases: [addition]
        explanation: Opposite coefficients cancel under addition.
        tags: [elimination]
    - id: mathematical-model
      term: Mathematical Model
      definition: An equation or system translating quantities, units, and relationships from a situation into mathematics.
      notation: null
      examples: ['$4+2.5m=19$ models a fixed fee plus a per-mile charge.']
      aliases: [model]
      media: []
      tags: [modeling]
      drills:
      - id: mathematical-model-drill
        type: flashcard
        prompt: What should be assigned to every variable in a word-problem model?
        answer:
          expected: A clear meaning and units.
        explanation: Definitions make equations interpretable and expose unit errors.
        tags: [modeling]
    - id: extraneous-or-context-invalid-value
      term: Context-Invalid Value
      definition: An algebraic solution that violates a condition of the original situation, such as a negative count or time.
      notation: null
      examples: ['A result of $-2$ tickets is rejected even if it solves a poorly constrained algebraic equation.']
      aliases: [inadmissible solution]
      media: []
      tags: [context-check]
      drills:
      - id: context-invalid-value-drill
        type: flashcard
        prompt: What must be done when algebra gives a negative value for a count?
        answer:
          expected: Compare it with the context and reject it if counts must be nonnegative.
        explanation: Model restrictions remain part of the original problem.
        tags: [context-check]
