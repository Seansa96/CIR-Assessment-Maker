schemaVersion: 1
id: pwsh-navigation-concept-lesson
title: "General Directory Navigation"
assessmentType: conceptLesson
categoryId: scripting
subcategoryIds:
  - pwsh-navigation
skills:
  - pwsh-navigation
modeDefault: practice
randomizeQuestions: false
lesson:
  introduction: |
    Navigating the file system is the most common task you'll perform in any shell. PowerShell treats the file system as a hierarchy of **Items** (files and folders) located in **Locations** (paths).
  sections:
    - id: sec-location
      title: "Getting and Setting Location"
      required: true
      content: |
        - **`Get-Location`** (alias: `pwd`): Shows you your current working directory.
        - **`Set-Location`** (alias: `cd`): Changes your current working directory.
        
        Like in bash or cmd, you can use relative paths:
        - `Set-Location ..` moves you up one directory.
        - `Set-Location .\Scripts` moves into a folder named Scripts in your current directory.
        - `Set-Location C:\Windows` moves to an absolute path.
      check:
        id: chk-nav-1
        type: multipleChoice
        prompt: "If your current location is `C:\Users\Sean\Documents` and you run `Set-Location ..\Downloads`, what is your new location?"
        choices:
          - id: a
            text: "C:\\Users\\Sean\\Documents\\Downloads"
          - id: b
            text: "C:\\Users\\Sean\\Downloads"
          - id: c
            text: "C:\\Users\\Downloads"
          - id: d
            text: "Error: Path does not exist"
        answer:
          choiceId: b
        explanation: |
          `..` moves up one level to `C:\Users\Sean`, and then `\Downloads` moves into the Downloads directory.

    - id: sec-childitem
      title: "Listing Files and Folders"
      required: true
      content: |
        To see what is inside a directory, use **`Get-ChildItem`** (alias: `ls` or `dir`).
        
        By default, it lists the contents of your current directory. You can also pass a path:
        `Get-ChildItem C:\Windows\System32`
        
        Because PowerShell outputs objects, `Get-ChildItem` doesn't just output text names; it outputs `FileInfo` and `DirectoryInfo` objects that contain properties like `Length` (file size), `CreationTime`, and `LastWriteTime`.
      check:
        id: chk-nav-2
        type: multipleChoice
        prompt: "What underlying type of data does `Get-ChildItem` return?"
        choices:
          - id: a
            text: "A single long block of text"
          - id: b
            text: "Objects representing files and directories"
          - id: c
            text: "An array of string filenames"
          - id: d
            text: "A byte stream"
        answer:
          choiceId: b
        explanation: |
          PowerShell is object-oriented. `Get-ChildItem` returns rich objects, which allows you to easily filter files by their properties (like size or date) later down the pipeline.

    - id: sec-psdrives
      title: "Understanding PSDrives"
      required: true
      content: |
        PowerShell extends navigation beyond just the C: drive. It uses a concept called **PSDrives**, which allows you to navigate other data stores exactly like a file system!
        
        For example, the Windows Registry is mapped as a PSDrive. 
        You can type `Set-Location HKLM:\` to enter the HKEY_LOCAL_MACHINE registry hive, and then use `Get-ChildItem` to list registry keys just like you were looking at folders!
        
        You can also navigate the Certificate store (`Cert:\`) or Environment variables (`Env:\`).
      check:
        id: chk-nav-3
        type: multipleChoice
        prompt: "Which command would you use to view all the Environment variables on your system using PowerShell's PSDrive feature?"
        choices:
          - id: a
            text: "Get-ChildItem Env:\\"
          - id: b
            text: "Get-Environment"
          - id: c
            text: "Set-Location Variables:\\"
          - id: d
            text: "View-Env"
        answer:
          choiceId: a
        explanation: |
          Because Environment variables are mapped as a PSDrive (`Env:\`), you can use standard navigation cmdlets like `Get-ChildItem` to list them out.
