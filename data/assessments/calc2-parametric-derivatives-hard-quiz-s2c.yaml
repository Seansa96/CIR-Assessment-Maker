questions:
  - { id: q001, type: freeResponse, prompt: 'For $x=t^2-1,y=t(t^2-1)$, find all horizontal tangent points.', answer: { gradingMode: selfCheck, keyPoints: ['t plus or minus one over square root three', 'x negative two thirds', 'points substituted correctly'] }, explanation: 'Solution: Set y-prime equal to $3t^2-1=0$, verify x-prime equals 2t is nonzero, then substitute $t=\pm1/\sqrt3$. Why it works: A horizontal tangent requires zero vertical rate and nonzero horizontal rate. Common trap: Reporting only parameters.', difficultyDimensions: [auxiliaryTechnique, domainCondition, representationTransfer], difficultyEvidence: 'Solves a derivative condition, checks validity, and maps to points.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-tangent-concavity] }
  - { id: q002, type: freeResponse, prompt: 'For $x=t^3,y=t^2$, classify the origin using a nearby-slope limit.', answer: { gradingMode: selfCheck, keyPoints: ['zero over zero', 'slope two over three t', 'vertical direction cusp'] }, explanation: 'Solution: Both rates vanish, but for nonzero t the slope is $2/(3t)$, unbounded near zero. The origin is a cusp with vertical tangent direction. Why it works: A simultaneous zero needs local analysis. Common trap: Applying the regular vertical rule.', difficultyDimensions: [domainCondition, auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Resolves an indeterminate quotient by simplification and local geometric interpretation.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-tangent-concavity] }
  - { id: q003, type: freeResponse, prompt: 'For $x=t+1/t,y=t-1/t$, $t>0$, classify the tangent at t equals 1 and identify the branch restriction.', answer: { gradingMode: selfCheck, keyPoints: ['vertical', 'x prime zero y prime two', 'positive t branch'] }, explanation: 'Solution: x-prime is $1-1/t^2$ and y-prime is $1+1/t^2$; at one they are zero and two, so vertical. Positive t selects one hyperbola branch. Why it works: Derivative classification and domain describe distinct parts of the model. Common trap: Reporting slope zero.', difficultyDimensions: [auxiliaryTechnique, domainCondition, representationTransfer], difficultyEvidence: 'Combines derivative classification with branch-domain interpretation.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-tangent-concavity] }
  - { id: q004, type: freeResponse, prompt: 'Derive $d^2y/dx^2$ for $x=t^2,y=t^3$ and determine concavity for t positive.', answer: { gradingMode: selfCheck, keyPoints: ['dy dx three t over two', 'second derivative three over four t', 'positive for t positive'] }, explanation: 'Solution: $dy/dx=3t/2$; differentiating gives 3/2 and dividing by x-prime 2t gives $3/(4t)$, positive for t positive. Why it works: The second derivative needs the second division by x-prime. Common trap: Reporting 3/2.', difficultyDimensions: [auxiliaryTechnique, simplification, domainCondition], difficultyEvidence: 'Chains two derivative conversions and interprets a sign on a restricted domain.', prerequisiteObjectiveIds: [parametric-derivatives], extensionObjectiveIds: [parametric-review-tangent-concavity] }
  - { id: q005, type: freeResponse, prompt: 'Explain why cancelling a common factor in a parametric slope can hide a singular point that still needs analysis.', answer: { gradingMode: selfCheck, keyPoints: ['cancellation valid only away from zero', 'original zero over zero', 'check excluded parameter separately'] }, explanation: 'Solution: Cancellation may simplify the slope for nearby parameters but is not valid at the cancelled zero. Analyze that excluded parameter through a limit or local curve behavior. Why it works: Algebraic simplification can change a formula domain. Common trap: Substituting the excluded value into the simplified expression.', difficultyDimensions: [domainCondition, errorDiagnosis, proofJustification], difficultyEvidence: 'Tracks a domain change and justifies separate local analysis.', prerequisiteObjectiveIds: [parametric-derivatives], extensionObjectiveIds: [parametric-review-tangent-concavity] }
  - { id: q006, type: freeResponse, prompt: 'A student calls every x-prime zero point vertical. Give the missing condition and a counterexample class.', answer: { gradingMode: selfCheck, keyPoints: ['y prime must be nonzero', 'both zero gives indeterminate', 'cusp or smooth stop possible'] }, explanation: 'Solution: Require y-prime nonzero. If both rates are zero, the slope is zero over zero and can represent a cusp or smooth point. Why it works: A vertical tangent is a nonzero-over-zero slope. Common trap: Ignoring the numerator.', difficultyDimensions: [errorDiagnosis, domainCondition, counterexampleOrConstruction], difficultyEvidence: 'Repairs a false rule using a condition and counterexample family.', prerequisiteObjectiveIds: [parametric-derivatives], extensionObjectiveIds: [parametric-review-tangent-concavity] }
  - { id: q007, type: freeResponse, prompt: 'Given a tangent slope expression in t, explain how to decide whether the curve is concave up at a parameter without graphing it.', answer: { gradingMode: selfCheck, keyPoints: ['differentiate slope with respect to t', 'divide by x prime', 'test sign', 'respect domain'] }, explanation: 'Solution: Differentiate the slope in t, divide by dx/dt, then test the resulting second derivative sign at the parameter and check it is defined. Why it works: This converts slope change to change per x. Common trap: Reading concavity from the first-derivative sign.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, domainCondition], difficultyEvidence: 'Constructs a second-derivative workflow with a validity check.', prerequisiteObjectiveIds: [parametric-derivatives], extensionObjectiveIds: [parametric-review-tangent-concavity] }
  - { id: q008, type: freeResponse, prompt: '![Tangent trace](/media/calculus/parametric-review-trace.svg) Give a procedure to distinguish a cusp from a regular vertical tangent in a plotted parametric path.', answer: { gradingMode: selfCheck, keyPoints: ['check both rates', 'if both zero inspect nearby slopes and direction', 'regular vertical has y prime nonzero', 'check local retrace'] }, explanation: 'Solution: First test component rates. A regular vertical tangent has x-prime zero and y-prime nonzero; if both vanish, inspect nearby slopes, direction changes, and the local path for a cusp. Why it works: The graph and rate conditions together classify local behavior. Common trap: Using only a steep visual appearance.', difficultyDimensions: [representationTransfer, casePartition, modelOrDerivation], difficultyEvidence: 'Combines visual local behavior with derivative-case partitioning.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-tangent-concavity] }
  - { id: q009, type: freeResponse, prompt: 'Explain why a tangent-line answer must include a point even after an exact slope has been found.', answer: { gradingMode: selfCheck, keyPoints: ['many parallel lines', 'evaluate x and y at parameter', 'point slope form'] }, explanation: 'Solution: A slope identifies infinitely many parallel lines. Evaluate x(a) and y(a), then use point-slope form with the computed slope. Why it works: Point plus slope uniquely determines a nonvertical line. Common trap: Treating dy/dx as a line equation.', difficultyDimensions: [proofJustification, representationTransfer, modelOrDerivation], difficultyEvidence: 'Connects rate information to the geometric data required for a line.', prerequisiteObjectiveIds: [parametric-derivatives], extensionObjectiveIds: [parametric-review-tangent-concavity] }
  - { id: q010, type: freeResponse, prompt: 'Write a model-validation checklist for a parametric tangent and concavity solution.', answer: { gradingMode: selfCheck, keyPoints: ['differentiate both components', 'check horizontal vertical conditions', 'compute points', 'handle simultaneous zero', 'second derivative and domain sign'] }, explanation: 'Solution: Differentiate both coordinates; classify with both rate conditions; compute requested points; separately analyze simultaneous zeros; form the second derivative with its extra division; and check domain/sign. Why it works: Each step validates a different part of the local model. Common trap: Letting correct algebra conceal an invalid tangent classification.', difficultyDimensions: [errorDiagnosis, proofJustification, modelOrDerivation], difficultyEvidence: 'Audits the complete local-analysis workflow.', prerequisiteObjectiveIds: [parametric-derivatives], extensionObjectiveIds: [parametric-review-tangent-concavity] }
