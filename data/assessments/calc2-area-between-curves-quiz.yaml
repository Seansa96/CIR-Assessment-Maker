questions:
- id: q001
  type: multipleChoice
  skills:
  - area-between-curves
  prompt: 'Set up the integral for the area bounded by $y = e^x$, $y = x$, $x = 0$,
    and $x = 1$.

    '
  choices:
  - id: a
    text: $\int_0^1 (e^x - x)\,dx$
  - id: b
    text: $\int_0^1 (x - e^x)\,dx$
  - id: c
    text: $\int_0^1 (e^x + x)\,dx$
  - id: d
    text: $\int_0^1 (e^x - 1)\,dx$
  answer:
    choiceId: a
  explanation: 'On $[0,1]$, $e^x > x$, so $e^x$ is the upper curve.

    '
- id: q002
  type: numericResponse
  skills:
  - area-between-curves
  prompt: 'Calculate the area bounded by $y = x^2$ and $y = 4$.

    '
  answer:
    value: 10.666
    tolerance: 0.1
  explanation: 'Intersection: $x^2 = 4 \implies x = \pm 2$.

    $$ A = \int_{-2}^2 (4 - x^2)\,dx = \left[4x - \frac{x^3}{3}\right]_{-2}^2 = (8
    - 8/3) - (-8 + 8/3) = 16 - 16/3 = 32/3 \a\approx 10.666. $$

    '
- id: q003
  type: multipleChoice
  skills:
  - area-between-curves
  prompt: 'Which of the following is the correct setup to find the area bounded by
    $x = y^2$ and $x = 4$ using\rhorizontal slicing?

    '
  choices:
  - id: a
    text: $\int_{-2}^2 (4 - y^2)\,dy$
  - id: b
    text: $\int_{0}^4 (4 - y^2)\,dy$
  - id: c
    text: $\int_{-2}^2 (y^2 - 4)\,dy$
  - id: d
    text: $\int_{0}^2 (4 - y^2)\,dy$
  answer:
    choiceId: a
  explanation: 'Intersection: $y^2 = 4 \implies y = \pm 2$. The right curve is $x=4$,
    and the left curve is $x=y^2$. So integrate $4 - y^2$ from $-2$ to $2$.

    '
- id: q004
  type: numericResponse
  skills:
  - area-between-curves
  prompt: 'Find the area between $y = \sin x$ and $y = \cos x$ from $x = 0$ to $x
    = \pi/2$. (Hint: you must split the integral at their intersection, $x = \pi/4$).

    Provide the exact decimal value up to 3 places.

    '
  answer:
    value: 0.828
    tolerance: 0.01
  explanation: '$A = \int_0^{\pi/4} (\cos x - \sin x)\,dx + \int_{\pi/4}^{\pi/2} (\sin
    x - \cos x)\,dx = (\sqrt{2}-1) + (\sqrt{2}-1) = 2\sqrt{2} - 2 \a\approx 0.828$.

    '
- id: q005
  type: multipleChoice
  skills:
  - area-between-curves
  prompt: 'If a region is bounded by $y = \ln x$, $y = 0$, and $x = e$, what is the
    easiest way to compute the area?

    '
  choices:
  - id: a
    text: Vertical slicing (integrate with respect to x)
  - id: b
    text: Horizontal slicing (integrate with respect to y)
  - id: c
    text: Both are equally difficult
  answer:
    choiceId: b
  explanation: 'Vertical slicing requires integrating $\ln x$. Horizontal slicing
    turns $y = \ln x$ into $x = e^y$. The\rhorizontal integral $\int_0^1 (e - e^y)\,dy$
    is generally easier.

    '
