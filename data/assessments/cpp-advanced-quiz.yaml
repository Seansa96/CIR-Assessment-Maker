questions:
  - id: q001
    type: multipleChoice
    prompt: |
      What happens during the compilation of a template function like `template<typename T> void print(T val)`?
    choices:
      - id: a
        text: 'The compiler generates a separate physical function for every different type `T` used in the program.'
      - id: b
        text: 'The compiler generates one function that takes a generic memory pointer.'
      - id: c
        text: 'The compiler ignores the type until the program runs.'
      - id: d
        text: 'The template is converted into a macro.'
    answer:
      choiceId: a
    explanation: |
      C++ templates use "monomorphization", meaning a unique copy of the function is generated for each type.

  - id: q002
    type: multipleChoice
    prompt: |
      What is a lambda expression in C++?
    choices:
      - id: a
        text: 'An anonymous, inline function.'
      - id: b
        text: 'A variable that captures mathematical constants.'
      - id: c
        text: 'A type of template parameter.'
      - id: d
        text: 'A tool for managing memory.'
    answer:
      choiceId: a
    explanation: |
      Lambdas allow you to define functions on the fly, typically to pass into algorithms.

  - id: q003
    type: code
    prompt: |
      Write a function template named `swapValues` that takes two reference parameters of type `T` and swaps their values.
    language: cpp
    functionName: swapValues
    starterCode: |
      template <typename T>
      void swapValues(T& a, T& b) {
          // Your code here
      }
    tests:
      - input: "int a=1, b=2; swapValues(a,b); return a == 2 && b == 1;"
        expected: "1"
    answer: {}
    explanation: |
      You can use a temporary variable of type `T` or `std::swap`.


