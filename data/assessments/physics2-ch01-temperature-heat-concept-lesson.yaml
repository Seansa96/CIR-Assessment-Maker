        Solution: During name the model and quantities for 'Temperature and Heat: Concept Lesson', first isolate the substance, convert units, and solve for the requested heat, mass, or temperature change. Then apply Q = mc Delta T with one consistent coordinate system and solve for the requested quantity.


        Why it works: Q = mc Delta T connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
