lesson:
  introduction: >
    This lesson develops a repeatable way to solve 'Temperature and Heat: Concept Lesson' problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch01-temperature-heat-s1
    title: Name the model and quantities
    required: true
    content: >
      'Temperature and Heat: Concept Lesson' uses Q = mc Delta T. In the name the model and quantities stage, isolate the substance, convert units, and solve for the requested heat, mass, or temperature change.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving 'Temperature and Heat: Concept Lesson' problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch01-temperature-heat-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for 'Temperature and Heat: Concept Lesson', what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use Q = mc Delta T after you isolate the substance, convert units, and solve for the requested heat, mass, or temperature change.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this 'Temperature and Heat: Concept Lesson' problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch01-temperature-heat-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables Q = mc Delta T relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch01-temperature-heat-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit 'Temperature and Heat: Concept Lesson'.
        media: []
        issueSignals:
        - id: physics2-physics2-ch01-temperature-heat-units-error
          domains:
          - physics-2
