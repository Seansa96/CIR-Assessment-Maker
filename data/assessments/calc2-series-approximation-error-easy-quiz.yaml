- id: q001
  type: multipleChoice
  skills:
  - interpret-series-remainders
  prompt: 'If a convergent series has sum $S$ and $N$th partial sum $S_N$, what is

    the remainder $R_N$?

    '
  choices:
  - id: a
    text: $S-S_N$
  - id: b
    text: $S_N-S$ only
  - id: c
    text: $S+S_N$
  - id: d
    text: $S_N/N$
  answer:
    choiceId: a
  explanation: 'Solution: The remainder is the omitted tail, so adding it to $S_N$ must recover $S$. Therefore the answer is $S-S_N$.


    Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.


    Common trap: The first omitted term is not automatically an error bound. State the theorem''s hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.


    Why the other choices fail: $S_N-S$ only conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $S+S_N$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $S_N/N$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.'
