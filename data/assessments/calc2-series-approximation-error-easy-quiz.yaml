  prompt: 'If $a_n=f(n)$ for positive decreasing $f$, which remainder inequality is

    correct?

    '
  choices:
  - id: a
    text: |-
      $\int_{N+1}^{\infty}f(x)\,dx\le R_N\le\int_N^{\infty}f(x)\,dx$
  - id: b
    text: |-
      $\int_N^{\infty}f(x)\,dx\le R_N\le\int_{N+1}^{\infty}f(x)\,dx$
  - id: c
    text: $R_N=f(N)$ exactly
  - id: d
    text: $R_N=0$ for decreasing $f$
  answer:
    choiceId: a
  explanation: |-
    Solution: Left- and right-endpoint rectangle comparisons place the positive tail between the integrals beginning at $N+1$ and $N$. Therefore the answer is $\int_{N+1}^{\infty}f(x)\,dx\le R_N\le\int_N^{\infty}f(x)\,dx$.

    Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.

    Common trap: The first omitted term is not automatically an error bound. State the theorem's hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.

    Why the other choices fail: $\int_N^{\infty}f(x)\,dx\le R_N\le\int_{N+1}^{\infty}f(x)\,dx$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $R_N=f(N)$ exactly conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $R_N=0$ for decreasing $f$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.
