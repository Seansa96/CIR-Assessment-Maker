schemaVersion: 1
id: calc2-series-approximation-error-easy-quiz
title: Series Approximation and Error Easy Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: series-approximation-error
skills:
- Apply alternating and integral remainder bounds
- Use Taylor and geometric error estimates
- Interpret strict tolerances and approximation guarantees
navigation:
  learningGoal: practice
  activityType: mixedPractice
  tags:
