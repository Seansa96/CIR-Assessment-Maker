lesson:
  introduction: This deeper lesson expands Processes and Threads from Chapter 2 of the Modern Operating Systems reference structure. It focuses on mechanism, boundary, tradeoff, and common failure modes rather than memorized labels.
  sections:
  - id: process-context
    title: Process context
    required: true
    content: 'A process combines an executing program with registers, memory mapping, open resources, credentials, and scheduling state.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Processes and Threads, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: process-context-deep-check
      title: 'Check: Process context'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Process context**?
      choices:
      - id: a
        text: A process is more than a program file.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'A process is more than a program file. Related topic: Processes and Threads.'
  - id: state-transitions
    title: State transitions
    required: true
    content: 'Running, ready, and blocked describe why a process can or cannot use the CPU now.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Processes and Threads, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: state-transitions-deep-check
      title: 'Check: State transitions'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **State transitions**?
      choices:
      - id: a
        text: Ready waits for CPU; blocked waits for an event.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Ready waits for CPU; blocked waits for an event. Related topic: Processes and Threads.'
    media:
    - type: image
      src: /assessments/operating-systems/processes-threads/context-switch.svg
      alt: Context switch diagram showing one execution context saved and another restored.
      caption: A context switch saves one execution state and restores another.
  - id: creation-termination
    title: Creation and termination
    required: true
    content: 'Process creation establishes managed execution state; termination reclaims resources and reports status to interested parents or managers.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Processes and Threads, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: creation-termination-deep-check
      title: 'Check: Creation and termination'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Creation and termination**?
      choices:
      - id: a
        text: Creation and cleanup are OS-managed lifecycle events.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Creation and cleanup are OS-managed lifecycle events. Related topic: Processes and Threads.'
  - id: thread-sharing
    title: Thread sharing
    required: true
    content: 'Threads in the same process share address space and resources but keep separate execution stacks and register states.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Processes and Threads, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: thread-sharing-deep-check
      title: 'Check: Thread sharing'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Thread sharing**?
      choices:
      - id: a
        text: Threads are cheaper partly because they share memory.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Threads are cheaper partly because they share memory. Related topic: Processes and Threads.'
    media:
    - type: image
      src: /assessments/operating-systems/processes-threads/process-vs-thread-layout.svg
      alt: One process with shared code data and heap plus separate stacks for several threads.
      caption: Threads share process memory but keep separate execution state.
  - id: user-kernel-threads
    title: Thread implementation choices
    required: true
    content: 'User-level threads are cheap for a runtime to manage, while kernel-level threads are visible to the scheduler and can run on multiple CPUs.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Processes and Threads, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: user-kernel-threads-deep-check
      title: 'Check: Thread implementation choices'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Thread implementation choices**?
      choices:
      - id: a
        text: Neither user nor kernel threads are universally best.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Neither user nor kernel threads are universally best. Related topic: Processes and Threads.'
