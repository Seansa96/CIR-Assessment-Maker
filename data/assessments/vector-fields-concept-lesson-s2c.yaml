  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 3 -> Vectors if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: A vector at every point
    required: true
    content: 'A vector field assigns a vector to each point in a plane or space. In Vector Fields, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
