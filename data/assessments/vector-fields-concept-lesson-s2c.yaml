  - id: s02
    title: Arrows encode direction and size
    required: true
    content: Arrow direction shows the local direction; arrow length represents relative magnitude. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
