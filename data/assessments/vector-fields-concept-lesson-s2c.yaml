  - id: s03
    title: Gradient fields point uphill
    required: true
    content: A gradient is perpendicular to a level curve and points toward greatest increase. Draw or mentally trace the representation before simplifying. Ask what remains fixed, what changes, and which direction is positive. This check is especially useful when a sign, a normal vector, a parameter order, or an integration limit can change the numerical value or the meaning of the result.
