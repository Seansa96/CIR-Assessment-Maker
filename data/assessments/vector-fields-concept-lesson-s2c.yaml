  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 3 -> Vectors if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: A vector at every point
    required: true
    content: 'A vector field assigns a vector to each point in a plane or space. In Vector Fields, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
    media:
    - type: image
      src: /media/calculus-3/vector-fields.svg
      alt: Original vector fields reference visual.
      caption: 
    check:
      id: check-01
      type: multipleChoice
      prompt: What does a vector field assign to each point?
      choices:
      - id: a
        text: a vector
        media: []
        issueSignals: []
      - id: b
        text: relative magnitude (answers 'What does arrow length represent?', not 'What does a vector field assign to each point?')
        media: []
        issueSignals:
        - id: vector-field-interpretation-error
          domains: []
      - id: c
        text: local direction (answers 'What does arrow direction represent?', not 'What does a vector field assign to each point?')
        media: []
        issueSignals:
        - id: vector-field-interpretation-error
          domains: []
      - id: d
        text: greatest increase (answers 'What does a gradient point toward?', not 'What does a vector field assign to each point?')
        media: []
        issueSignals:
        - id: vector-field-interpretation-error
          domains: []
      answer:
        choiceId: a
