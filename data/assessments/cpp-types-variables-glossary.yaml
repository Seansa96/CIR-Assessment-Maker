schemaVersion: 1
id: cpp-types-variables-glossary
title: C++ Types, Variables, and I/O Glossary
assessmentType: glossary
categoryId: c++
topicId: c++-types-and-variables
modeDefault: practice
navigation: { learningGoal: learn, activityType: glossary, tags: [c++, c++-types-and-variables, types, input-output] }
authoring: { visualRequirement: notApplicable, visualRationale: The glossary is a compact reference for type and stream terms; the concept lesson carries the data-flow visual requirement. }
glossary:
  introduction: Review the type, initialization, and stream vocabulary used when a C++ program receives data.
  sections:
  - id: types-and-input-terms
    title: Types and input terms
    entries:
    - id: cpp-double
      term: '`double`'
      definition: A floating-point type used when a value may have a fractional component.
      drills: [{ id: cpp-double-drill, type: typed, prompt: 'The common type for a decimal measurement is ________.', answer: { expected: double } }]
    - id: cpp-value-initialization
      term: Value initialization
      definition: Initialization with braces such as `int count{}`; for an integer it produces zero.
      drills: [{ id: cpp-value-initialization-drill, type: typed, prompt: 'The syntax `int count{}` is called value ________.', answer: { expected: initialization } }]
    - id: cpp-formatted-extraction
      term: Formatted extraction
      definition: Reading a whitespace-delimited value from a stream with `>>`, such as `std::cin >> number`.
      drills: [{ id: cpp-formatted-extraction-drill, type: typed, prompt: 'The operator used with `std::cin` to read a formatted value is ________.', answer: { expected: '>>', aliases: [extraction] } }]
    - id: cpp-stream-recovery
      term: Stream recovery
      definition: Clearing a stream failure state and discarding offending buffered input before retrying extraction.
      drills: [{ id: cpp-stream-recovery-drill, type: typed, prompt: 'After a failed extraction, the method that resets the stream error state is ________.', answer: { expected: clear, aliases: ['clear()'] } }]
