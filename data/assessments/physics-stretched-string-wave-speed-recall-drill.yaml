items:
- {id: string-r1, type: cloze, prompt: 'String wave speed is $v={{\sqrt{F_T/\mu}}}$.', answer: {expected: '\sqrt{F_T/\mu}'}, explanation: 'Solution: Use $v=\sqrt{F_T/\mu}$. Why it works: tension provides restoring force and linear density provides inertia.'}
- {id: string-r2, type: typed, prompt: 'If tension quadruples, by what factor does string wave speed change?', answer: {expected: 2}, explanation: 'Solution: It doubles. Why it works: wave speed is proportional to square root of tension.'}
- {id: string-r3, type: cloze, prompt: 'Linear density is $\mu={{m/L}}$.', answer: {expected: 'm/L'}, explanation: 'Solution: Use $\mu=m/L$. Why it works: it measures how much string mass must be accelerated per length.'}
- {id: string-r4, type: typed, prompt: 'If linear density increases fourfold at fixed tension, what happens to speed?', answer: {expected: it halves}, explanation: 'Solution: It halves. Why it works: speed is inversely proportional to square root of linear density.'}
- {id: string-r5, type: cloze, prompt: 'A hanging mass M can provide tension $F_T={{Mg}}$.', answer: {expected: Mg}, explanation: 'Solution: Use $F_T=Mg$. Why it works: a hanging mass’s weight supplies tension in static equilibrium.'}
- {id: string-r6, type: typed, prompt: 'What are the units of linear mass density?', answer: {expected: kg/m}, explanation: 'Solution: Use kilograms per meter. Why it works: it is mass divided by length.'}
