schemaVersion: 1
id: aops-triangles-hard-test
title: Triangles Hard Test
description: A scored synthesis of enumeration, congruence, similarity, right-triangle structure, centers, trigonometry, and area.
assessmentType: test
categoryId: art-of-problem-solving
topicId: aops-triangles
skills:
- Enumerate constrained integer triangles
- Compose similarity, center, and area invariants
- Solve right-triangle projection problems
- Construct proof chains from explicit hypotheses
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags: [art-of-problem-solving, aops-triangles, geometry, hard, formal-test, triangle-proof, similarity, triangle-area]
questions:
- id: hard-test-q001
  type: multipleChoice
  prompt: How many unordered integer-sided nondegenerate triangles have perimeter 12?
  choices: [{id: a, text: '2'}, {id: b, text: '3'}, {id: c, text: '4'}, {id: d, text: '5'}]
  answer: {choiceId: b}
  explanation: With $a\le b\le c$, the possibilities are $(2,5,5)$, $(3,4,5)$, and $(4,4,4)$.
- id: hard-test-q002
  type: multipleChoice
  prompt: A right triangle is similar to a 5-12-13 triangle and has perimeter 60. Find its hypotenuse.
  choices: [{id: a, text: '$20$'}, {id: b, text: '$24$'}, {id: c, text: '$26$'}, {id: d, text: '$30$'}]
  answer: {choiceId: c}
  explanation: The reference perimeter is 30, so the scale factor is 2 and the hypotenuse is 26.
- id: hard-test-q003
  type: multipleChoice
  prompt: Triangles are congruent with corresponding sides $3x-2$ and $2x+7$. What is their common length?
  choices: [{id: a, text: '$9$'}, {id: b, text: '$16$'}, {id: c, text: '$23$'}, {id: d, text: '$25$'}]
  answer: {choiceId: d}
  explanation: $3x-2=2x+7$ gives $x=9$, and the common side is 25.
- id: hard-test-q004
  type: multipleChoice
  prompt: Similar triangles have area ratio $25:81$. If the smaller perimeter is 30, find the larger perimeter.
  choices: [{id: a, text: '$48$'}, {id: b, text: '$50$'}, {id: c, text: '$54$'}, {id: d, text: '$243/5$'}]
  answer: {choiceId: c}
  explanation: The length ratio is $5:9$, so the larger perimeter is $30(9/5)=54$.
- id: hard-test-q005
  type: multipleChoice
  prompt: An altitude to a right triangle's hypotenuse divides it into segments 5 and 20. Find the leg adjacent to the segment of length 5.
  choices: [{id: a, text: '$5\sqrt5$'}, {id: b, text: '$10$'}, {id: c, text: '$10\sqrt5$'}, {id: d, text: '$25$'}]
  answer: {choiceId: a}
  explanation: The hypotenuse is 25 and the leg satisfies $a^2=25\cdot5=125$, so $a=5\sqrt5$.
- id: hard-test-q006
  type: multipleChoice
  prompt: An equilateral triangle has side 6. Find its circumradius.
  choices: [{id: a, text: '$\sqrt3$'}, {id: b, text: '$2\sqrt3$'}, {id: c, text: '$3\sqrt3$'}, {id: d, text: '$6$'}]
  answer: {choiceId: b}
  explanation: The altitude is $3\sqrt3$, and the common centroid/circumcenter is two thirds of the way from a vertex, giving $2\sqrt3$.
- id: hard-test-q007
  type: multipleChoice
  prompt: A right triangle has legs 9 and 40. Find its inradius.
  choices: [{id: a, text: '$4$'}, {id: b, text: '$9/2$'}, {id: c, text: '$5$'}, {id: d, text: '$9$'}]
  answer: {choiceId: a}
  explanation: The hypotenuse is 41, so $K=180$, $s=45$, and $r=K/s=4$.
- id: hard-test-q008
  type: multipleChoice
  prompt: An angle bisector divides the opposite side into segments 12 and 18. If the adjacent side corresponding to 12 has length 10, find the other adjacent side.
  choices: [{id: a, text: '$12$'}, {id: b, text: '$15$'}, {id: c, text: '$18$'}, {id: d, text: '$20$'}]
  answer: {choiceId: b}
  explanation: The angle-bisector theorem gives $10/x=12/18=2/3$, so $x=15$.
- id: hard-test-q009
  type: multipleChoice
  prompt: A median divides a triangle of area 90. What is the area ratio of the two resulting triangles?
  choices: [{id: a, text: '$1:1$'}, {id: b, text: '$1:2$'}, {id: c, text: '$2:3$'}, {id: d, text: '$2:1$'}]
  answer: {choiceId: a}
  explanation: Equal bases on the bisected side and a shared altitude give equal areas.
- id: hard-test-q010
  type: multipleChoice
  prompt: A right triangle has $\tan\theta=3/4$ and hypotenuse 20. Find the side opposite $\theta$.
  choices: [{id: a, text: '$9$'}, {id: b, text: '$12$'}, {id: c, text: '$15$'}, {id: d, text: '$16$'}]
  answer: {choiceId: b}
  explanation: The side ratio is 3-4-5 scaled by 4, so the opposite side is 12.
- id: hard-test-q011
  type: multipleChoice
  prompt: Find the area of a triangle with side lengths 10, 10, and 12.
  choices: [{id: a, text: '$36$'}, {id: b, text: '$40$'}, {id: c, text: '$48$'}, {id: d, text: '$60$'}]
  answer: {choiceId: c}
  explanation: Heron gives $s=16$ and $K=\sqrt{16\cdot6\cdot6\cdot4}=48$.
- id: hard-test-q012
  type: multipleChoice
  prompt: Two sides of a triangle are fixed at 8 and 15. What is the largest possible area?
  choices: [{id: a, text: '$30$'}, {id: b, text: '$60$'}, {id: c, text: '$92$'}, {id: d, text: '$120$'}]
  answer: {choiceId: b}
  explanation: $K=\tfrac12(8)(15)\sin C\le60$, with equality when the included angle is $90^\circ$.
- id: hard-test-q013
  type: selectAll
  prompt: Which line-family and center matches are correct?
  choices:
  - {id: a, text: Angle bisectors meet at the incenter.}
  - {id: b, text: Perpendicular bisectors meet at the circumcenter.}
  - {id: c, text: Medians meet at the centroid.}
  - {id: d, text: Altitudes meet at the incenter.}
  answer: {choiceIds: [a, b, c]}
  explanation: Altitudes meet at the orthocenter.
- id: hard-test-q014
  type: selectAll
  prompt: If two triangles are similar with small-to-large scale factor $k$, which statements are valid?
  choices:
  - {id: a, text: Corresponding angle measures are equal.}
  - {id: b, text: Every corresponding length ratio is $k$.}
  - {id: c, text: The area ratio is $k^2$.}
  - {id: d, text: The triangles are necessarily congruent.}
  answer: {choiceIds: [a, b, c]}
  explanation: Congruence follows only in the special case $k=1$.
- id: hard-test-q015
  type: freeResponse
  prompt: Prove that a segment through two sides of a triangle and parallel to the third side divides those two sides proportionally.
  media:
  - type: image
    src: /assessments/aops/aops-triangles-similarity.svg
    alt: Triangle ABC with D on AB, E on AC, and DE parallel to BC.
  answer:
    gradingMode: selfCheck
    expected: 'Because $DE\parallel BC$, corresponding angles at $D,B$ and $E,C$ are congruent, while angle $A$ is shared. Thus $\triangle ADE\sim\triangle ABC$ by AA. Therefore $AD/AB=AE/AC$. Writing $AB=AD+DB$ and $AC=AE+EC$ and simplifying gives $AD/DB=AE/EC$, so the two sides are divided proportionally.'
    keyPoints:
    - Uses parallel-line angle equalities.
    - Proves AA similarity.
    - Writes a consistent correspondence proportion.
    - Converts whole-side ratios to split-side ratios.
  explanation: Proportional division is a consequence of proved similarity, not a visual assumption.
