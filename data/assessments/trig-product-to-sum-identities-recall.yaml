schemaVersion: 1
id: trig-product-to-sum-identities-recall
title: Product-to-Sum Identities Recall
assessmentType: recallDrill
categoryId: trigonometry
subcategoryId: trig-identities
subcategoryIds:
  - trig-identities
  - trig-angle-sum
modeDefault: practice
randomizeQuestions: false
items:
  - id: product-to-sum-sin-cos
    type: symbolic
    prompt: |
      Recall the product-to-sum identity for:

      $$
      \sin A\cos B
      $$
    answer:
      expectedLatex: '\frac{1}{2}\left[\sin(A+B)+\sin(A-B)\right]'
      aliases:
        - one half times sine A plus B plus sine A minus B
    explanation: |
      This identity converts a sine-cosine product into a sum of sine expressions. It is useful when products are harder to integrate, simplify, or compare than sums.
    tags:
      - product-to-sum
      - sine-cosine

  - id: product-to-sum-cos-sin
    type: symbolic
    prompt: |
      Recall the product-to-sum identity for:

      $$
      \cos A\sin B
      $$
    answer:
      expectedLatex: '\frac{1}{2}\left[\sin(A+B)-\sin(A-B)\right]'
      aliases:
        - one half times sine A plus B minus sine A minus B
    explanation: |
      This is the companion to $\sin A\cos B$. The sign changes because switching the sine argument changes which difference angle appears positively.
    tags:
      - product-to-sum
      - cosine-sine

  - id: product-to-sum-cos-cos
    type: symbolic
    prompt: |
      Recall the product-to-sum identity for:

      $$
      \cos A\cos B
      $$
    answer:
      expectedLatex: '\frac{1}{2}\left[\cos(A+B)+\cos(A-B)\right]'
      aliases:
        - one half times cosine A plus B plus cosine A minus B
    explanation: |
      A cosine-cosine product becomes a sum of cosines. The actionable lookup path is: compare this with the cosine angle-sum formulas.
    tags:
      - product-to-sum
      - cosine-cosine

  - id: product-to-sum-sin-sin
    type: symbolic
    prompt: |
      Recall the product-to-sum identity for:

      $$
      \sin A\sin B
      $$
    answer:
      expectedLatex: '\frac{1}{2}\left[\cos(A-B)-\cos(A+B)\right]'
      aliases:
        - one half times cosine A minus B minus cosine A plus B
    explanation: |
      A sine-sine product becomes a difference of cosines. The order matters: $\cos(A-B)$ comes before $\cos(A+B)$.
    tags:
      - product-to-sum
      - sine-sine

  - id: product-to-sum-cloze-half-factor
    type: cloze
    prompt: |
      Every basic product-to-sum identity begins with the same coefficient:

      $$
      \_\_\_\_ [\text{sum or difference of trig terms}]
      $$
    answer:
      expected: '1/2'
      aliases:
        - one half
    explanation: |
      The factor is $\frac{1}{2}$. These identities are rearranged versions of angle-sum and angle-difference formulas, and the one-half appears when solving those systems for the product.
    tags:
      - product-to-sum
      - coefficients

  - id: product-to-sum-flashcard-when
    type: flashcard
    prompt: |
      When are product-to-sum identities especially useful?
    answer:
      expected: When a product of trig functions is harder to integrate, simplify, or compare than a sum or difference of trig functions.
    explanation: |
      Product-to-sum identities change multiplication into addition/subtraction. That often makes integrals and algebraic simplification more direct.
    tags:
      - product-to-sum
      - which-tool-when
