lesson:
  introduction: This deeper lesson expands File Systems from Chapter 4 of the Modern Operating Systems reference structure. It focuses on mechanism, boundary, tradeoff, and common failure modes rather than memorized labels.
  sections:
  - id: file-abstraction
    title: File abstraction
    required: true
    content: 'A file is persistent data plus metadata and operations, not merely anonymous bytes on a device.


      Decision habit: ask what boundary, resource, or policy is being controlled. For File Systems, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: file-abstraction-deep-check
      title: 'Check: File abstraction'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **File abstraction**?
      choices:
      - id: a
        text: Metadata and access rules are part of the abstraction.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Metadata and access rules are part of the abstraction. Related topic: File Systems.'
  - id: directory-namespace
    title: Directory namespace
    required: true
    content: 'Directories map names to file metadata references and create a traversable namespace.


      Decision habit: ask what boundary, resource, or policy is being controlled. For File Systems, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: directory-namespace-deep-check
      title: 'Check: Directory namespace'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Directory namespace**?
      choices:
      - id: a
        text: A path is namespace traversal, not direct disk geometry.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'A path is namespace traversal, not direct disk geometry. Related topic: File Systems.'
    media:
    - type: image
      src: /assessments/operating-systems/file-systems/path-lookup-inode.svg
      alt: Path components traversing directories to an inode and data blocks.
      caption: Path lookup walks a namespace before reaching metadata and blocks.
  - id: allocation
    title: File allocation
    required: true
    content: 'Contiguous, linked, and indexed allocation make different tradeoffs in random access, growth, and fragmentation.


      Decision habit: ask what boundary, resource, or policy is being controlled. For File Systems, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: allocation-deep-check
      title: 'Check: File allocation'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **File allocation**?
      choices:
      - id: a
        text: Allocation strategy shapes performance and flexibility.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Allocation strategy shapes performance and flexibility. Related topic: File Systems.'
  - id: free-space
    title: Free-space tracking
    required: true
    content: 'File systems track free blocks with bitmaps, lists, or grouped structures so allocation can be recovered after operations.


      Decision habit: ask what boundary, resource, or policy is being controlled. For File Systems, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: free-space-deep-check
      title: 'Check: Free-space tracking'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Free-space tracking**?
      choices:
      - id: a
        text: Free-space state is filesystem metadata.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Free-space state is filesystem metadata. Related topic: File Systems.'
  - id: crash-consistency
    title: Crash consistency
    required: true
    content: 'Journaling or related techniques preserve metadata consistency when updates are interrupted.


      Decision habit: ask what boundary, resource, or policy is being controlled. For File Systems, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: crash-consistency-deep-check
      title: 'Check: Crash consistency'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Crash consistency**?
      choices:
      - id: a
        text: Crash consistency is about recoverable ordering.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Crash consistency is about recoverable ordering. Related topic: File Systems.'
    media:
    - type: image
      src: /assessments/operating-systems/file-systems/journaled-write.svg
      alt: Journaled write sequence with intent, journal, metadata update, and commit.
      caption: Journaling records update intent so recovery can preserve consistency.
