- id: q001
  type: freeResponse
  prompt: >
    Let $a_n=\frac{2n+1}{n+3}$ and let $S_N=\sum_{n=1}^{N} a_n$.


    (a) Find $a_1,a_2,a_3$.

    (b) Determine whether $(a_n)$ converges and find its limit if it does.

    (c) Find $S_3$ and use the term test to decide whether $\sum_{n=1}^{\infty}a_n$ can converge.
  choices: []
  answer:
    choiceId: 
    choiceIds: []
    expected: 
    gradingMode: selfCheck
    expectedLatex: 
    equivalenceMode: 
    variables: []
    value: 
    tolerance: 
    media: []
    keyPoints:
    - $a_1=3/4$, $a_2=1$, $a_3=7/6$; $\lim a_n=2$; $S_3=35/12$; the series diverges because $a_n\not\to0$.
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: Dividing numerator and denominator of $a_n$ by $n$ gives $a_n=(2+1/n)/(1+3/n)$, so the sequence tends to $2$.

    The first three terms are $3/4,1,7/6$, whose sum is $35/12$. A sequence may converge to a nonzero value, but an infinite series can converge only if its terms tend to zero. Since $a_n\to2$, the related series diverges by the term test.


    Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


    Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.
