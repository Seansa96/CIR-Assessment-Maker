  type: freeResponse
  prompt: >
    Determine whether $\sum_{n=2}^{\infty}\frac{\ln n}{n^2}$ converges or diverges. Clearly name a convergence test and justify each comparison or condition you use.
  choices: []
  answer:
    choiceId: 
    choiceIds: []
