- id: q005
  type: freeResponse
  prompt: >
    Determine whether $\sum_{n=1}^{\infty}\frac{n!}{(n+2)^n}$ converges or diverges. Use the Ratio Test and interpret its limit.
  choices: []
  answer:
    choiceId: 
    choiceIds: []
    expected: 
    gradingMode: selfCheck
    expectedLatex: 
    equivalenceMode: 
    variables: []
    value: 
    tolerance: 
    media: []
    keyPoints:
    - 'Converges: $\frac{a_{n+1}}{a_n}=\frac{n+1}{n+3}\left(\frac{n+2}{n+3}\right)^n\to e^{-1}<1$.'
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: With $a_n=n!/(n+2)^n$, cancellation gives

    $$\frac{a_{n+1}}{a_n}=\frac{n+1}{n+3}\left(\frac{n+2}{n+3}\right)^n.$$

    The first factor tends to $1$ and the second is $(1-1/(n+3))^n\to e^{-1}$. Since the Ratio-Test limit is less than $1$, the series converges absolutely.


    Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


    Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.
