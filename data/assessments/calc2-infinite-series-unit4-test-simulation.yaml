    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: Let $b_n=1/\sqrt{n+1}$. It is positive, decreases, and tends to zero, so the Alternating Series Test proves convergence.

    For absolute convergence, $\sum|(-1)^{n+1}/\sqrt{n+1}|=\sum1/\sqrt{n+1}$ is a $p$-series with $p=1/2\le1$, so it diverges. Thus the original series is conditionally convergent.


    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.


    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.
