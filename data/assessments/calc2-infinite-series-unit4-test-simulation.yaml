    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: The derivatives of $\cosh x$ alternate between $\cosh x$ and $\sinh x$. At $0$, every odd derivative is $0$ and every even derivative is $1$.

    Hence the Maclaurin definition gives $1+x^2/2!+x^4/4!+\cdots=\sum_{n=0}^{\infty}x^{2n}/(2n)!$. The Ratio Test on the absolute terms has limit $0$ for every fixed $x$, so $R=\infty$.


    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.


    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.
