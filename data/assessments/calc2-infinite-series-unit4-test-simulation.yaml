  type: freeResponse
  prompt: >
    Determine whether $\sum_{n=1}^{\infty}\frac{n^2+4}{n^3+2n}$ converges or diverges. Use limit comparison and show the limit that supports your conclusion.
  choices: []
  answer:
    choiceId: 
    choiceIds: []
    expected: 
    gradingMode: selfCheck
    expectedLatex: 
