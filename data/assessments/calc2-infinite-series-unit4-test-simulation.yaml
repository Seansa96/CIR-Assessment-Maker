    media: []
    keyPoints:
    - 'Diverges: compare with $1/n$; $\lim_{n\to\infty}\frac{(n^2+4)/(n^3+2n)}{1/n}=1$.'
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: The leading behavior is $n^2/n^3=1/n$, so compare to the harmonic series. The limit-comparison ratio is

    $$\lim_{n\to\infty}\frac{n(n^2+4)}{n^3+2n}=\lim_{n\to\infty}\frac{n^2+4}{n^2+2}=1.$$

    This positive finite limit gives the same behavior as $\sum1/n$, which diverges.


    Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


    Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.
