  explanation: >-
    Solution: The magnitude $b_n=(n+1)/(n^2+1)$ tends to zero and is decreasing for $n\ge1$ (for example, its continuous extension has negative derivative there). Hence the alternating series converges.

    For absolute convergence, compare with $1/n$:

    $$\lim_{n\to\infty}\frac{(n+1)/(n^2+1)}{1/n}=1.$$

    The absolute series diverges with the harmonic series, so the convergence is conditional.


    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.


    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.
