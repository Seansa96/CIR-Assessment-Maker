- id: q008
  type: freeResponse
  prompt: >
    Find the radius and interval of convergence of

    $$\sum_{n=1}^{\infty}\frac{(-1)^n(x-2)^n}{n\,4^n}.$$

    Show the endpoint tests separately.
  choices: []
  answer:
    choiceId: 
    choiceIds: []
    expected: 
    gradingMode: selfCheck
    expectedLatex: 
    equivalenceMode: 
    variables: []
    value: 
    tolerance: 
    media: []
    keyPoints:
    - Radius $R=4$; interval $(-2,6]$. At $x=-2$ the series is harmonic; at $x=6$ it is alternating harmonic.
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: The Ratio Test gives $|x-2|/4<1$, so $R=4$ and the open interval is $(-2,6)$.

    At $x=-2$, the series becomes $\sum(-1)^n(-1)^n/n=\sum1/n$, which diverges. At $x=6$, it becomes $\sum(-1)^n/n$, which converges conditionally. Therefore the interval is $(-2,6]$.


    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.


    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.
