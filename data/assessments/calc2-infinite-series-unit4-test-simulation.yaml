- id: q002
  type: freeResponse
  prompt: >
    Determine whether $\sum_{n=1}^{\infty}\frac{5}{3^n}$ converges. If it converges, find its exact sum. State the test or structure used and why it applies.
  choices: []
  answer:
    choiceId: 
    choiceIds: []
    expected: 
    gradingMode: selfCheck
    expectedLatex: 
    equivalenceMode: 
    variables: []
    value: 
    tolerance: 
    media: []
    keyPoints:
    - Geometric with first term $5/3$ and ratio $1/3$; it converges because $|r|<1$, and its sum is $5/2$.
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: Rewrite the terms as a geometric series with $a=5/3$ and $r=1/3$. Because $|r|<1$, its partial sums approach $a/(1-r)$.

    Thus $\sum_{n=1}^{\infty}5/3^n=(5/3)/(2/3)=5/2$. Saying only that a calculator produced a finite decimal would not establish the geometric-series condition.


    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.


    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.
