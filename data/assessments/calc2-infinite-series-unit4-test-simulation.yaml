- id: q009
  type: freeResponse
  prompt: >
    Starting from $\frac1{1-u}=\sum_{n=0}^{\infty}u^n$ for $|u|<1$, find a power-series representation centered at $0$ for

    $$\frac{x^2}{(1+3x^2)^2}.$$

    State its interval of convergence.
  choices: []
  answer:
    choiceId: 
    choiceIds: []
    expected: 
    gradingMode: selfCheck
    expectedLatex: 
    equivalenceMode: 
    variables: []
    value: 
    tolerance: 
    media: []
    keyPoints:
    - $\sum_{n=1}^{\infty}n(-1)^{n-1}3^{n-1}x^{2n}$ for $|x|<1/\sqrt3$.
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: Differentiate the known geometric identity to obtain $1/(1-u)^2=\sum_{n=1}^{\infty}nu^{n-1}$. Put $u=-3x^2$, giving

    $$\frac1{(1+3x^2)^2}=\sum_{n=1}^{\infty}n(-3x^2)^{n-1}.$$

    Multiplying by $x^2$ yields $\sum_{n=1}^{\infty}n(-1)^{n-1}3^{n-1}x^{2n}$. The transformed geometric condition is $|-3x^2|<1$, so $|x|<1/\sqrt3$; both endpoints diverge because the terms do not approach zero.


    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.


    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.
