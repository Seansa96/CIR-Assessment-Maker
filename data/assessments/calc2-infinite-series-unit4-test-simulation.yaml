    keyPoints:
    - 'Converges: for sufficiently large $n$, $\ln n\le\sqrt n$, so $0\le\ln n/n^2\le1/n^{3/2}$; apply comparison with a convergent $p$-series.'
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: The logarithm grows more slowly than every positive power of $n$; in particular, $\ln n\le\sqrt n$ for all sufficiently large $n$.

    Therefore $0\le\ln n/n^2\le1/n^{3/2}$ eventually. The comparison series is a $p$-series with $p=3/2>1$, so it converges. The finite initial terms do not change convergence.


    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.


    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.
