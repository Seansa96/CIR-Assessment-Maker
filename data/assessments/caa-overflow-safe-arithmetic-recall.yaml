items:
- id: overflow-add-same-sign
  type: flashcard
  prompt: When can signed addition overflow?
  answer:
    expected: When adding two values with the same sign produces a result with the opposite sign.
  explanation: Opposite-sign addition cannot exceed both signed bounds in the same way.
  tags:
  - overflow
- id: average-without-overflow
  type: typed
  prompt: Recall one safe way to average two nonnegative integers without overflowing their sum.
  answer:
    expected: a + (b - a) / 2, when a <= b
  explanation: Subtract first, then add the smaller offset.
  tags:
  - average
  - overflow
- id: saturating-arithmetic
  type: cloze
  prompt: 'Complete: saturating arithmetic clamps overflowed results to a ____ instead of wrapping.'
  answer:
    expected: boundary
  explanation: Saturation uses min/max bounds.
  tags:
  - saturation
- id: multiword-carry
  type: flashcard
  prompt: What does a carry represent in multiword addition?
  answer:
    expected: A carry is the overflow out of a lower word that must be added into the next higher word.
  explanation: Multiword arithmetic chains fixed-width words.
  tags:
  - carry
  - multiword
- id: unsigned-wrap
  type: typed
  prompt: What does unsigned overflow usually do in fixed-width modular arithmetic?
  answer:
    expected: It wraps modulo 2^w for a w-bit word.
  explanation: This is a representation-level wraparound behavior.
  tags:
  - unsigned
  - wraparound
