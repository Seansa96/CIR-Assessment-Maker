items:
- id: item-1
  type: typed
  prompt: What should cancel in a correctly oriented conversion factor?
  answer:
    expected: The unwanted given unit.
  explanation: 'Solution: Place the unwanted unit on the opposite side of the fraction from the given
    quantity.


    Why it works: Cancellation reveals the path to the target unit.'
- id: item-2
  type: typed
  prompt: How many centimeters are in one meter?
  answer:
    expected: 100 cm
  explanation: 'Solution: $1\ \mathrm{m}=100\ \mathrm{cm}$.


    Why it works: centi- means one hundredth of the base unit.'
- id: item-3
  type: typed
  prompt: How many milliliters are in one liter?
  answer:
    expected: 1000 mL
  explanation: 'Solution: $1\ \mathrm{L}=1000\ \mathrm{mL}$.


    Why it works: milli- means one thousandth of the base unit.'
- id: item-4
  type: typed
  prompt: What happens to a length conversion factor when converting an area?
  answer:
    expected: It must be squared.
  explanation: 'Solution: Square both the unit and numerical factor.


    Why it works: Area contains two length dimensions.'
- id: item-5
  type: typed
  prompt: What is the equivalence between cm³ and mL?
  answer:
    expected: $1\ \mathrm{cm^3}=1\ \mathrm{mL}$
  explanation: 'Solution: A cubic centimeter is defined as one milliliter.


    Why it works: Both are standard volume units.'
- id: item-6
  type: typed
  prompt: Which unit does molar mass convert between?
  answer:
    expected: grams and moles
  explanation: 'Solution: Use g/mol or its reciprocal depending on the target.


    Why it works: Molar mass is a bridge between sample mass and amount.'
- id: item-7
  type: typed
  prompt: What should the final units match?
  answer:
    expected: The requested unknown unit.
  explanation: 'Solution: Read the surviving units after cancellation.


    Why it works: Units are a check on the setup.'
- id: item-8
  type: typed
  prompt: What does a factor of 1 do in dimensional analysis?
  answer:
    expected: Changes units without changing quantity.
  explanation: 'Solution: Equivalent numerator and denominator represent the same amount.


    Why it works: A conversion factor is a ratio equal to one.'
- id: item-9
  type: typed
  prompt: What is the correct factor to convert g to mol using 18.0 g/mol?
  answer:
    expected: $1\ \mathrm{mol}/18.0\ \mathrm{g}$
  explanation: 'Solution: Put grams in the denominator so given grams cancel.


    Why it works: Orientation follows the desired surviving unit.'
- id: item-10
  type: typed
  prompt: Why is $1\ \mathrm{m}=100\ \mathrm{cm}$ not enough for cubic conversion?
  answer:
    expected: The factor must be cubed.
  explanation: 'Solution: Use $(100\ \mathrm{cm}/1\ \mathrm{m})^3$.


    Why it works: Three length factors appear in a volume.'
