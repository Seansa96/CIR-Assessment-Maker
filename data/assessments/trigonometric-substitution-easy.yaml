questions:
  - id: q001
    type: symbolicResponse
    prompt: |
      Evaluate the integral using trigonometric substitution.

      $$
      \int \frac{dx}{\sqrt{9-x^2}}
      $$
    answer:
      expectedLatex: \arcsin\left(\frac{x}{3}\right)+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Use the pattern $\int \frac{dx}{\sqrt{a^2-x^2}}=\arcsin\left(\frac{x}{a}\right)+C$.

      Related topic: Sine Substitution

  - id: q002
    type: symbolicResponse
    prompt: |
      Evaluate the integral using trigonometric substitution.

      $$
      \int \frac{dx}{\sqrt{16-x^2}}
      $$
    answer:
      expectedLatex: \arcsin\left(\frac{x}{4}\right)+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Here $a=4$ in the $\sqrt{a^2-x^2}$ pattern.

      Related topic: Sine Substitution

  - id: q003
    type: symbolicResponse
    prompt: |
      Evaluate the integral using trigonometric substitution.

      $$
      \int \frac{x}{\sqrt{25-x^2}}\,dx
      $$
    answer:
      expectedLatex: -\sqrt{25-x^2}+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      A direct substitution $u=25-x^2$ also confirms the result.

      Related topic: Radicals of the Form $a^2-x^2$

  - id: q004
    type: symbolicResponse
    prompt: |
      Evaluate the integral using trigonometric substitution.

      $$
      \int \frac{dx}{x^2+9}
      $$
    answer:
      expectedLatex: \frac{1}{3}\arctan\left(\frac{x}{3}\right)+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Use the pattern $\int \frac{dx}{x^2+a^2}=\frac{1}{a}\arctan\left(\frac{x}{a}\right)+C$.

      Related topic: Tangent Substitution

  - id: q005
    type: symbolicResponse
    prompt: |
      Evaluate the integral using trigonometric substitution.

      $$
      \int \frac{dx}{x^2+4}
      $$
    answer:
      expectedLatex: \frac{1}{2}\arctan\left(\frac{x}{2}\right)+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Here $a=2$ in the $x^2+a^2$ pattern.

      Related topic: Tangent Substitution

  - id: q006
    type: symbolicResponse
    prompt: |
      Evaluate the integral using trigonometric substitution.

      $$
      \int \frac{dx}{\sqrt{x^2+9}}
      $$
    answer:
      expectedLatex: \ln|x+\sqrt{x^2+9}|+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      This is the standard antiderivative for $\frac{1}{\sqrt{x^2+a^2}}$.

      Related topic: Tangent Substitution with $x^2+a^2$

  - id: q007
    type: symbolicResponse
    prompt: |
      Evaluate the integral using trigonometric substitution.

      $$
      \int \frac{x}{\sqrt{x^2+16}}\,dx
      $$
    answer:
      expectedLatex: \sqrt{x^2+16}+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      A direct substitution $u=x^2+16$ gives the same result quickly.

      Related topic: Radicals of the Form $x^2+a^2$

  - id: q008
    type: symbolicResponse
    prompt: |
      Evaluate the integral using trigonometric substitution.

      $$
      \int \frac{dx}{\sqrt{x^2-9}}
      $$
    answer:
      expectedLatex: \ln|x+\sqrt{x^2-9}|+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Use the standard form for $\frac{1}{\sqrt{x^2-a^2}}$.

      Related topic: Secant Substitution

  - id: q009
    type: symbolicResponse
    prompt: |
      Evaluate the integral using trigonometric substitution.

      $$
      \int \frac{x}{\sqrt{x^2-4}}\,dx
      $$
    answer:
      expectedLatex: \sqrt{x^2-4}+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      A direct substitution $u=x^2-4$ confirms the antiderivative.

      Related topic: Radicals of the Form $x^2-a^2$

  - id: q010
    type: symbolicResponse
    prompt: |
      Evaluate the integral using trigonometric substitution.

      $$
      \int \sqrt{4-x^2}\,dx
      $$
    answer:
      expectedLatex: \frac{x}{2}\sqrt{4-x^2}+2\arcsin\left(\frac{x}{2}\right)+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Use $x=2\sin\theta$ to turn the radical into $2\cos\theta$.

      Related topic: Area-Type Sine Substitution

  - id: q011
    type: symbolicResponse
    prompt: |
      Evaluate the integral using trigonometric substitution.

      $$
      \int \sqrt{9-x^2}\,dx
      $$
    answer:
      expectedLatex: \frac{x}{2}\sqrt{9-x^2}+\frac{9}{2}\arcsin\left(\frac{x}{3}\right)+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Use $x=3\sin\theta$ and convert back to $x$.

      Related topic: Area-Type Sine Substitution

  - id: q012
    type: symbolicResponse
    prompt: |
      Evaluate the integral using trigonometric substitution.

      $$
      \int \frac{dx}{x^2\sqrt{x^2+1}}
      $$
    answer:
      expectedLatex: -\frac{\sqrt{x^2+1}}{x}+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Differentiate $-\frac{\sqrt{x^2+1}}{x}$ to check the result.

      Related topic: Reciprocal Radical Forms

  - id: q013
    type: symbolicResponse
    prompt: |
      Evaluate the integral using trigonometric substitution.

      $$
      \int \frac{dx}{\sqrt{1-x^2}}
      $$
    answer:
      expectedLatex: \arcsin x+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      This is the $a=1$ case of the $\sqrt{a^2-x^2}$ pattern.

      Related topic: Inverse Sine Form

  - id: q014
    type: symbolicResponse
    prompt: |
      Evaluate the integral using trigonometric substitution.

      $$
      \int \frac{dx}{1+x^2}
      $$
    answer:
      expectedLatex: \arctan x+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      This is the $a=1$ case of the arctangent pattern.

      Related topic: Inverse Tangent Form

  - id: q015
    type: symbolicResponse
    prompt: |
      Evaluate the integral using trigonometric substitution.

      $$
      \int \frac{x^2}{\sqrt{4-x^2}}\,dx
      $$
    answer:
      expectedLatex: 2\arcsin\left(\frac{x}{2}\right)-\frac{x}{2}\sqrt{4-x^2}+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Use $x=2\sin\theta$, then reduce the resulting $\sin^2\theta$ integral.

      Related topic: Sine Substitution with Powers
