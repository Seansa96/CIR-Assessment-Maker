lesson:
  introduction: 'This lesson introduces Input and Output through the mental models emphasized by 5 Input/Output. Focus on
    what the OS is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: i-o-stack
    title: I/O stack
    required: true
    content: 'I/O moves through applications, system calls, device-independent OS layers, drivers, controllers, and devices.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A read call does not talk to hardware directly from user mode.

      '
    check:
      id: i-o-stack-check
      title: 'Check: I/O stack'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **I/O stack**?

        '
      choices:
      - id: a
        text: I/O moves through applications, system calls, device-independent OS layers, drivers, controllers, and devices.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'I/O moves through applications, system calls, device-independent OS layers, drivers, controllers, and
        devices. Related topic: Input and Output.

        '
  - id: interrupts
    title: Interrupts
    required: true
    content: 'Interrupts let devices notify the CPU that attention is needed.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Interrupt-driven I/O avoids constant polling but introduces asynchronous control flow.

      '
    check:
      id: interrupts-check
      title: 'Check: Interrupts'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Interrupts**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Interrupts let devices notify the CPU that attention is needed.
      answer:
        choiceId: d
      explanation: 'Interrupts let devices notify the CPU that attention is needed. Related topic: Input and Output.

        '
  - id: dma
    title: DMA
    required: true
    content: 'Direct memory access lets a device controller transfer data to or from memory with less CPU copying.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      DMA still needs OS setup and protection.

      '
    check:
      id: dma-check
      title: 'Check: DMA'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **DMA**?

        '
      choices:
      - id: a
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: Direct memory access lets a device controller transfer data to or from memory with less CPU copying.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: c
      explanation: 'Direct memory access lets a device controller transfer data to or from memory with less CPU copying. Related
        topic: Input and Output.

        '
  - id: device-drivers
    title: Device drivers
    required: true
    content: 'Drivers translate general OS requests into device-specific commands.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A driver bug can compromise kernel reliability.

      '
    check:
      id: device-drivers-check
      title: 'Check: Device drivers'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Device drivers**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: Drivers translate general OS requests into device-specific commands.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      answer:
        choiceId: b
      explanation: 'Drivers translate general OS requests into device-specific commands. Related topic: Input and Output.

        '
  - id: device-independent-i-o
    title: Device-independent I/O
    required: true
    content: 'The OS hides many device differences behind common naming, buffering, error handling, and protection rules.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Uniform interfaces do not erase hardware-specific behavior.

      '
    check:
      id: device-independent-i-o-check
      title: 'Check: Device-independent I/O'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Device-independent I/O**?

        '
      choices:
      - id: a
        text: The OS hides many device differences behind common naming, buffering, error handling, and protection rules.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'The OS hides many device differences behind common naming, buffering, error handling, and protection rules.
        Related topic: Input and Output.

        '
  - id: disk-performance
    title: Disk performance
    required: true
    content: 'Seek time, rotational delay, transfer time, caching, and scheduling influence storage performance.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Disk speed is not explained by transfer rate alone.

      '
    check:
      id: disk-performance-check
      title: 'Check: Disk performance'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Disk performance**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Seek time, rotational delay, transfer time, caching, and scheduling influence storage performance.
      answer:
        choiceId: d
      explanation: 'Seek time, rotational delay, transfer time, caching, and scheduling influence storage performance. Related
        topic: Input and Output.

        '
