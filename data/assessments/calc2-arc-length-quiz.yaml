modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Set up the integral for the arc length of the curve $y = \ln(\cos x)$ from $x=0$ to $x=\pi/4$.
    choices:
      - id: a
        text: $\int_0^{\pi/4} \sec x\,dx$
      - id: b
        text: $\int_0^{\pi/4} \sqrt{1 + \sin^2 x}\,dx$
      - id: c
        text: $\int_0^{\pi/4} \sqrt{1 + \tan x}\,dx$
      - id: d
        text: $\int_0^{\pi/4} \cos x\,dx$
    answer:
      choiceId: a
    explanation: |
      $y = \ln(\cos x) \implies y' = \frac{1}{\cos x}(-\sin x) = -\tan x$.
      $1 + (y')^2 = 1 + \tan^2 x = \sec^2 x$.
      $\sqrt{\sec^2 x} = \sec x$ (since $\sec x > 0$ on $(0, \pi/4)$).
      The integral is $\int \sec x\,dx$.

  - id: q002
    type: numericResponse
    prompt: |
      Calculate the exact decimal value of the arc length of $y = \frac{2}{3}(x^2 - 1)^{3/2}$ from $x = 1$ to $x = 2$.
    answer:
      value: 2.333
      tolerance: 0.1
    explanation: |
      $y' = \frac{2}{3} \cdot \frac{3}{2} (x^2 - 1)^{1/2} \cdot 2x = 2x(x^2 - 1)^{1/2}$.
      $(y')^2 = 4x^2(x^2 - 1) = 4x^4 - 4x^2$.
      $1 + (y')^2 = 1 - 4x^2 + 4x^4 = (1 - 2x^2)^2$.
      $L = \int_1^2 (2x^2 - 1)\,dx = [\frac{2x^3}{3} - x]_1^2 = (\frac{16}{3} - 2) - (\frac{2}{3} - 1) = \frac{10}{3} - (-\frac{1}{3}) = \frac{11}{3} \approx 3.666$.
      Wait, $(2x^2 - 1)^2 = 4x^4 - 4x^2 + 1$. Yes.
      $x=2$: $16/3 - 6/3 = 10/3$. $x=1$: $2/3 - 3/3 = -1/3$. Total: $11/3 = 3.666$.
      Let me fix the answer to 3.666.

  - id: q003
    type: multipleChoice
    prompt: |
      Which of the following describes the perfect square trick for arc length?
    choices:
      - id: a
        text: The derivative squared yields a trinomial. Adding 1 flips the sign of the middle term, making it a perfect square trinomial again.
      - id: b
        text: You square the entire integral to remove the square root.
      - id: c
        text: You substitute $x = \sin \theta$ to create $1 - \sin^2 \theta = \cos^2 \theta$.
      - id: d
        text: You multiply by the conjugate of the expression inside the square root.
    answer:
      choiceId: a
    explanation: |
      This trick often happens with functions of the form $ax^p + bx^{-p}$, where their product is a constant. Adding 1 to the negative middle term turns it positive, forming a perfect square.

  - id: q004
    type: multipleChoice
    prompt: |
      What is the arc length of $x = \cos t, y = \sin t$ from $t=0$ to $t=\pi$?
    choices:
      - id: a
        text: $\pi$
      - id: b
        text: $2\pi$
      - id: c
        text: $1$
      - id: d
        text: $\pi/2$
    answer:
      choiceId: a
    explanation: |
      This is the parametric arc length of a semicircle of radius 1. The full circumference is $2\pi(1) = 2\pi$. A semicircle is $\pi$.
      Parametric formula: $\int \sqrt{(- \sin t)^2 + (\cos t)^2}\,dt = \int 1\,dt = \pi$.

  - id: q005
    type: multipleChoice
    prompt: |
      When computing the arc length of $x = y^3/3 + 1/(4y)$ from $y=1$ to $y=2$, which variable should you integrate with respect to?
    choices:
      - id: a
        text: y
      - id: b
        text: x
    answer:
      choiceId: a
    explanation: |
      Since the function is given as $x = g(y)$, it is far easier to use $L = \int \sqrt{1 + [g'(y)]^2}\,dy$.


