questions:
- id: q-gravity-work
  title: Lifting a Book
  type: symbolicResponse
  prompt: 'A $3.0\\text{ kg}$ book is lifted from a table ($y_i = 1.0\\text{ m}$) to a high shelf ($y_f = 2.5\\text{ m}$) using $g = 10\\text{ m/s}^2$. \nWhat is the change in gravitational potential energy $\\Delta U_g$ (in Joules)?\n'
  answer:
    gradingMode: auto
    expectedLatex: 45
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    $\Delta U_g = mg(y_f - y_i) = (3.0)(10)(2.5 - 1.0) = (30)(1.5) = +45\text{ J}$.
    Note that this is true regardless of where you define $y=0$.
