glossary:
  introduction: Use these terms to make quantitative chemistry decisions precisely.
  sections:
  - id: terms
    title: Core terms
    entries:
    - id: e1
      term: molar gas volume
      definition: Volume occupied by one mole at stated conditions.
      drills:
      - id: d1
        type: flashcard
        prompt: Define molar gas volume.
        answer:
          expected: volume per mole
        explanation: 'Solution: volume per mole. Why it works: Volume occupied by one mole at stated conditions.'
    - id: e2
      term: ideal gas law
      definition: $PV=nRT$.
      drills:
      - id: d2
        type: flashcard
        prompt: Define ideal gas law.
        answer:
          expected: PV=nRT
        explanation: 'Solution: PV=nRT. Why it works: $PV=nRT$.'
    - id: e3
      term: STP
      definition: Specified standard temperature and pressure conditions.
      drills:
      - id: d3
        type: flashcard
        prompt: Define STP.
        answer:
          expected: standard temperature and pressure
        explanation: 'Solution: standard temperature and pressure. Why it works: Specified standard temperature and pressure
          conditions.'
    - id: e4
      term: partial pressure
      definition: Pressure contributed by one gas.
      drills:
      - id: d4
        type: flashcard
        prompt: Define partial pressure.
        answer:
          expected: pressure from one gas
        explanation: 'Solution: pressure from one gas. Why it works: Pressure contributed by one gas.'
    - id: e5
      term: dry gas pressure
      definition: Total pressure minus water vapor pressure.
      drills:
      - id: d5
        type: flashcard
        prompt: Define dry gas pressure.
        answer:
          expected: total minus water vapor pressure
        explanation: 'Solution: total minus water vapor pressure. Why it works: Total pressure minus water vapor pressure.'
    - id: e6
      term: gas stoichiometry
      definition: Balanced-equation conversion involving gas quantities.
      drills:
      - id: d6
        type: flashcard
        prompt: Define gas stoichiometry.
        answer:
          expected: stoichiometry with gas quantities
        explanation: 'Solution: stoichiometry with gas quantities. Why it works: Balanced-equation conversion involving gas
          quantities.'
