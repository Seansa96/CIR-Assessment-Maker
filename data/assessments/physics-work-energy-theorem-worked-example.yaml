workedExamples:
  - id: we001
    title: Stopping a Car
    problem: |
      A 1500 kg car is traveling at 20 m/s on a horizontal road. The driver slams on the brakes, and the car skids to a stop. The coefficient of kinetic friction between the tires and the road is $\mu_k = 0.8$.
      
      Use the Work-Energy Theorem to find the stopping distance. (Take $g = 9.8$ m/s²).
    solutionSteps:
      - step: Identify the forces doing work.
        explanation: |
          The forces acting on the car are gravity (down), normal force (up), and kinetic friction (backward).
          * Gravity and Normal force are perpendicular to the displacement, so they do **zero work**.
          * Kinetic friction $f_k$ points opposite to the displacement $d$, so the angle is $180^\circ$.
          
          $$ W_{net} = W_{friction} = f_k \cdot d \cdot \cos(180^\circ) = -f_k d $$

      - step: Calculate the kinetic friction force.
        explanation: |
          Since the road is flat, $N = mg$.
          $$ f_k = \mu_k N = \mu_k mg = (0.8)(1500)(9.8) = 11760 \text{ N} $$

      - step: Apply the Work-Energy Theorem.
        explanation: |
          $$ W_{net} = \Delta K = K_f - K_i $$
          The car stops, so $K_f = 0$.
          $$ -f_k d = 0 - \frac{1}{2} m v_i^2 $$
          $$ - (11760) d = - \frac{1}{2} (1500) (20)^2 $$
          $$ 11760 d = 750 (400) = 300000 $$
          $$ d = \frac{300000}{11760} \approx 25.5 \text{ m} $$
          The stopping distance is approximately 25.5 meters.


