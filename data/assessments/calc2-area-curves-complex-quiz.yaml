questions:
- id: area-adv-1-respect-to-y
  title: Integration with Respect to y
  type: multipleChoice
  skills:
  - area-curves-complex
  prompt: 'Find the area of the region bounded by $y = \\ln(x)$, the $x$-axis, and the lines $y = 0$ and $y = 1$. \nWhich of the following integrals correctly computes this area by integrating with respect to $y$?\n'
  choices:
  - id: a
    text: $\int_0^1 (e^y) \, dy$
  - id: b
    text: $\int_1^e (\ln(x)) \, dx$
  - id: c
    text: $\int_0^1 (1 - e^y) \, dy$
  - id: d
    text: $\int_0^1 (e^y - 1) \, dy$
  answer:
    choiceId: a
  explanation: The function $y = \ln(x)$ can be inverted to $x = e^y$. The region is bounded by the y-axis ($x=0$) on the left and the curve $x=e^y$ on the right. Integrating with respect to $y$ gives $\int_0^1 (e^y - 0) \, dy$. While choice B gives the same numerical area, the question specifically asked for integration with respect to $y$.
- id: area-adv-2-bound-change
  title: Bound Evaluation
  type: multipleChoice
  skills:
  - area-curves-complex
  prompt: 'You are given the region bounded by $y = x^2$ and $y = \\sqrt{x}$. You decide to switch from integrating with respect to $x$ to integrating with respect to $y$. \nDo the numerical limits of integration change?\n'
  choices:
  - id: a
    text: Yes, because the variables swap, the bounds must swap.
  - id: b
    text: Yes, the bounds become $0$ to $2$.
  - id: c
    text: No, the limits of integration remain $0$ to $1$.
  answer:
    choiceId: c
  explanation: The curves intersect at $(0,0)$ and $(1,1)$. For $x$, the bounds are $0$ to $1$. For $y$, the bounds are the y-coordinates of the intersections, which are also $0$ to $1$. The numerical limits do not change in this specific case.
- id: area-adv-3-improper-area
  title: Infinite Area Region
  type: symbolicResponse
  skills:
  - area-curves-complex
  prompt: |
    Find the area of the unbounded region between the curve $y = \frac{1}{x^3}$ and the $x$-axis, for $x \ge 1$.
    Enter the numerical value of the area.
  answer:
    gradingMode: auto
    expectedLatex: 0.5
    equivalenceMode: expression
    tolerance: 0
  explanation: 'This is an improper integral: $\int_1^\infty x^{-3} \, dx = \lim_{b\to\infty} \left[ -\frac{1}{2x^2} \right]_1^b = 0 - (-\frac{1}{2}) = 0.5$.'
- id: area-adv-4-improper-diverge
  title: Diverging Area
  type: multipleChoice
  skills:
  - area-curves-complex
  prompt: |
    Consider the area of the region bounded between $y = \frac{1}{x}$, the $x$-axis, and $x \ge 1$.
    Which of the following describes this area?
  choices:
  - id: a
    text: The area is exactly $1$.
  - id: b
    text: The area is $e$.
  - id: c
    text: The area is infinite (the integral diverges).
  answer:
    choiceId: c
  explanation: The integral $\int_1^\infty \frac{1}{x} \, dx = \lim_{b\to\infty} \ln(b) - \ln(1) = \infty$. The area is infinite.
- id: area-adv-5-split-region
  title: Splitting Regions
  type: multipleChoice
  skills:
  - area-curves-complex
  prompt: 'Consider the region bounded by $y = x$, $y = 2$, and $y = 1/x$ for $x > 0$. \nTo find the area by integrating with respect to $x$, how many integrals are required?\n'
  choices:
  - id: a
    text: One integral.
  - id: b
    text: Two integrals.
  - id: c
    text: Three integrals.
  answer:
    choiceId: b
  explanation: The "bottom" boundary changes. From $x=1/2$ to $x=1$, the bottom is $y=1/x$. From $x=1$ to $x=2$, the bottom is $y=x$ (wait, actually bounded by $y=2$ on top, so top is $y=2$, bottom is $y=1/x$ from $x=1/2$ to $1$, then bottom is $y=x$ from $1$ to $2$. Yes, two integrals are required). If you integrate with respect to $y$, only ONE integral is required (right $x=y$, left $x=1/y$).
