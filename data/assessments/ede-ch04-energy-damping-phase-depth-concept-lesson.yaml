lesson:
  introduction: First integrals organize conservative motion; damping replaces closed energy curves with trajectories
    of decreasing energy.
  sections:
  - id: s1
    title: Conservative first integrals
    required: true
    content: For $y''+p(y)=0$, let $P'(y)=p(y)$. Multiplying by $y'$ gives $d[\frac12v^2+P(y)]/dt=0$, so energy
      is constant.
    media:
    - type: image
      src: /media/ede/ch04-conservative-energy-levels.svg
      alt: Potential wells, energy levels, turning points, and their phase-plane curves.
      caption: Use the relationships in the diagram to organize the calculation and verification.
    check:
      id: q001
      type: multipleChoice
      prompt: Which quantity is conserved for $y''+4y=0$?
      skills:
      - ede-ch04-first-order-applications-autonomous-second-order-energy
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-autonomous-second-order-energy
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Here $P(y)=2y^2$, so kinetic plus potential energy is constant.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $v^2/2+2y^2$
      - id: b
        text: $v+4y$
        issueSignals:
        - id: ede-autonomous-energy-conservation-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $v^2/2-2y^2$
        issueSignals:
        - id: ede-autonomous-energy-conservation-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $4v+y$
        issueSignals:
        - id: ede-autonomous-energy-conservation-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s2
    title: Kinetic and potential energy
    required: true
    content: Allowed positions satisfy $P(y)\le E$ because $v^2/2=E-P(y)\ge0$. Turning points occur where $v=0$
      and $P(y)=E$.
    media: []
    check:
      id: q002
      type: numericResponse
      prompt: For $E=v^2/2+2y^2=8$, find the positive turning point.
      skills:
      - ede-ch04-first-order-applications-autonomous-second-order-energy
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-autonomous-second-order-energy
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: At a turning point $v=0$, so $2y^2=8$ and $y=2$.

        Why it works: Direct substitution verifies the numerical result and its units or sign.
      answer:
        value: 2
        tolerance: 0.0001
  - id: s3
    title: Spring phase curves
    required: true
    content: A linear spring produces elliptical phase curves. Their orientation follows $y'=v$, and no nonzero
      trajectory spirals inward without damping.
    media: []
    check:
      id: q003
      type: multipleChoice
      prompt: What does a closed phase ellipse indicate?
      skills:
      - ede-ch04-first-order-applications-autonomous-second-order-energy
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-autonomous-second-order-energy
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: A closed energy level corresponds to repeated oscillation at constant energy.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: Periodic conservative motion
      - id: b
        text: Monotone escape
        issueSignals:
        - id: ede-autonomous-energy-conservation-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: Energy loss each cycle
        issueSignals:
        - id: ede-autonomous-energy-conservation-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: A single equilibrium point
        issueSignals:
        - id: ede-autonomous-energy-conservation-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s4
    title: Pendulum separatrices
    required: true
    content: For $y''+\sin y=0$, energy is $E=v^2/2+1-\cos y$. The level $E=2$ passes through unstable upright equilibria
      and separates oscillations from rotations.
    media: []
    check:
      id: q004
      type: multipleChoice
      prompt: For the normalized pendulum, which energy is the separatrix?
      skills:
      - ede-ch04-first-order-applications-autonomous-second-order-energy
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-autonomous-second-order-energy
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: At the upright point $y=\pi$, $v=0$, so $E=1-\cos\pi=2$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $E=2$
      - id: b
        text: $E=0$
        issueSignals:
        - id: ede-autonomous-energy-conservation-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $E=1/2$
        issueSignals:
        - id: ede-autonomous-energy-conservation-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: Every energy
        issueSignals:
        - id: ede-autonomous-energy-conservation-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s5
    title: Damped systems
    required: true
    content: For $y''+c y'+p(y)=0$, the phase system is $y'=v$, $v'=-cv-p(y)$. The mechanical energy satisfies $E'=-cv^2\le0$
      when $c>0$.
    media:
    - type: image
      src: /media/ede/ch04-damped-phase-portraits.svg
      alt: Closed conservative orbits contrasted with inward damped trajectories and decreasing energy.
      caption: Use the relationships in the diagram to organize the calculation and verification.
    check:
      id: q005
      type: multipleChoice
      prompt: What is $E'$ for $y''+0.5y'+y=0$?
      skills:
      - ede-ch04-first-order-applications-damped-phase-trajectories
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-damped-phase-trajectories
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Multiplying the equation by $v$ leaves the dissipative term $-0.5v^2$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $-0.5v^2$
      - id: b
        text: $+0.5v^2$
        issueSignals:
        - id: ede-autonomous-damping-energy-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $-y^2$
        issueSignals:
        - id: ede-autonomous-damping-energy-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $0$
        issueSignals:
        - id: ede-autonomous-damping-energy-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s6
    title: Inward phase trajectories
    required: true
    content: Damping usually turns closed conservative curves into inward trajectories. Energy decreases strictly
      except at instants with $v=0$, so crossing outward to a higher energy level is impossible.
    media: []
    check:
      id: q006
      type: multipleChoice
      prompt: Which observation is incompatible with positive viscous damping and no external forcing?
      skills:
      - ede-ch04-first-order-applications-damped-phase-trajectories
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-damped-phase-trajectories
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: With $E'=-cv^2\le0$, mechanical energy cannot increase.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: A trajectory crosses repeatedly to higher energy levels
      - id: b
        text: Amplitude decreases
        issueSignals:
        - id: ede-autonomous-damping-energy-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: Energy is momentarily stationary at a turning point
        issueSignals:
        - id: ede-autonomous-damping-energy-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: The state approaches equilibrium
        issueSignals:
        - id: ede-autonomous-damping-energy-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
