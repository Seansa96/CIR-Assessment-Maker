questions:
- id: q001
  type: freeResponse
  skills:
  - polar-curves
  - olympiad-problem-solving
  prompt: Convert the polar equation $r=3\cos\theta$ to Cartesian form and identify the curve.
  answer:
    gradingMode: selfCheck
    expected: $(x-3/2)^2+y^2=(3/2)^2$.
    keyPoints:
    - 'Matches the reference result: $(x-3/2)^2+y^2=(3/2)^2$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: 'Multiply by $r$: $r^2=3r\cos\theta=3x$. Thus $x^2+y^2=3x$, then complete the square.'
