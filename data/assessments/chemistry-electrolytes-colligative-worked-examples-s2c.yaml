workedExamples:
  - id: classify-particles
    title: Classify Solutes by Particle Model
    problem: 'Classify KBr, CH3COOH, and C6H12O6 as strong, weak, or nonelectrolytes.'
    steps:
      - { id: ew-01, title: Identify ionic salt, instruction: 'Complete this step.', type: freeResponse, prompt: 'Classify KBr and state its particle model.', answer: { gradingMode: selfCheck, keyPoints: ['strong electrolyte', 'K plus and Br minus ions'] }, explanation: 'Solution: KBr is a soluble ionic salt, so it is a strong electrolyte and produces K+ and Br− ions. Why it works: Ionic solids separate into their constituent ions in water. Common trap: Calling any compound with covalent-looking symbols molecular.' }
      - { id: ew-02, title: Identify partial ionization, instruction: 'Complete this step.', type: freeResponse, prompt: 'Classify CH3COOH and state what coexistence appears in water.', answer: { gradingMode: selfCheck, keyPoints: ['weak electrolyte', 'mostly molecules', 'some ions'] }, explanation: 'Solution: Acetic acid is a weak electrolyte: mostly CH3COOH molecules coexist with some H3O+ and CH3COO−. Why it works: Weak acids ionize only partially. Common trap: Treating every acid as completely dissociated.' }
      - { id: ew-03, title: Identify neutral dissolved molecules, instruction: 'Complete this step.', type: freeResponse, prompt: 'Classify glucose, C6H12O6.', answer: { gradingMode: selfCheck, keyPoints: ['nonelectrolyte', 'neutral molecules'] }, explanation: 'Solution: Glucose is a nonelectrolyte; it dissolves as neutral molecules. Why it works: Solubility does not imply ion formation. Common trap: Calling it an electrolyte because it contains oxygen atoms.' }
  - id: ion-concentration
    title: Calculate Individual Ion Concentrations
    problem: 'Find [Al3+] and [SO4 2−] in 0.125 M Al2(SO4)3, assuming complete dissociation.'
    steps:
      - { id: ew-04, title: Write dissociation coefficients, instruction: 'Complete this step.', type: freeResponse, prompt: 'Write the ion count per formula unit.', answer: { gradingMode: selfCheck, keyPoints: ['2 Al 3 plus', '3 sulfate 2 minus'] }, explanation: 'Solution: $\mathrm{Al_2(SO_4)_3\rightarrow2Al^{3+}+3SO_4^{2-}}$. Why it works: Formula subscripts become coefficients on complete dissociation. Common trap: Forgetting the 2 on aluminum.' }
      - { id: ew-05, title: Find aluminum concentration, instruction: 'Complete this step.', type: numericResponse, prompt: 'Find [Al3+] in M.', answer: { value: 0.25, tolerance: 0.001 }, explanation: 'Solution: $[Al^{3+}]=2(0.125)=0.250\ \mathrm M$. Why it works: Two aluminum ions occur per formula unit. Common trap: Leaving it at 0.125 M.' }
      - { id: ew-06, title: Find sulfate concentration, instruction: 'Complete this step.', type: numericResponse, prompt: 'Find [SO4 2−] in M.', answer: { value: 0.375, tolerance: 0.001 }, explanation: 'Solution: $[SO_4^{2-}]=3(0.125)=0.375\ \mathrm M$. Why it works: Three sulfate ions occur per formula unit. Common trap: Multiplying by ionic charge rather than subscript.' }
  - id: colligative-ranking
    title: Rank Colligative Effects by Particle Count
    problem: 'Rank equal-concentration glucose, NaCl, and CaCl2 solutions for greatest freezing-point depression.'
    steps:
      - { id: ew-07, title: Count ideal particles, instruction: 'Complete this step.', type: freeResponse, prompt: 'Give ideal particles per formula unit for glucose, NaCl, and CaCl2.', answer: { gradingMode: selfCheck, keyPoints: ['1', '2', '3'] }, explanation: 'Solution: Glucose remains one molecule, NaCl yields two ions, and CaCl2 yields three ions. Why it works: Colligative effects follow number of dissolved particles. Common trap: Ranking by molar mass.' }
      - { id: ew-08, title: Connect count to freezing point, instruction: 'Complete this step.', type: multipleChoice, prompt: 'Which has the lowest freezing point at equal concentration?', choices: [{ id: a, text: 'CaCl2' }, { id: b, text: 'NaCl' }, { id: c, text: 'glucose' }, { id: d, text: 'all equal' }], answer: { choiceId: a }, explanation: 'Solution: CaCl2 has three ideal particles and therefore the largest depression. Why it works: More particles give a larger colligative effect. Why the other choices fail: NaCl has two particles, glucose one, and particle count prevents equality.' }
      - { id: ew-09, title: Transfer the trend, instruction: 'Complete this step.', type: freeResponse, prompt: 'State the corresponding boiling-point ranking from highest to lowest.', answer: { gradingMode: selfCheck, keyPoints: ['CaCl2', 'NaCl', 'glucose'] }, explanation: 'Solution: CaCl2 > NaCl > glucose for boiling point. Why it works: The same greater-particle-count ordering gives a greater boiling-point elevation. Common trap: Reversing boiling trend because freezing trend decreases.' }
