questions:
  - { id: q001, type: multipleChoice, prompt: 'If y=f(x) is above y=g(x) on [a,b], which integral is the area between them?', media: [{ type: image, src: /media/calculus/area-between-curves-model.svg, alt: Vertical slice between upper and lower curves }], choices: [{ id: a, text: '$\int_a^b[f(x)-g(x)]dx$' }, { id: b, text: '$\int_a^b[g(x)-f(x)]dx$' }, { id: c, text: '$\int_a^bf(x)g(x)dx$' }, { id: d, text: '$\int_a^b[f(x)-g(x)]dy$' }], answer: { choiceId: a }, explanation: 'Solution: Use $\int_a^b[f(x)-g(x)]dx$. Why it works: A vertical slice has positive height top minus bottom and thickness dx. Common trap: Do not reverse the height. Why the other choices fail: b is negative; c is not a distance; d mismatches vertical slices with dy.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: Translates the diagrammed vertical slice into a positive area integral. , issueSignals: [{ id: sign-error }, { id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: geometric-area-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q002, type: multipleChoice, prompt: 'Where do y=x^2 and y=4 intersect?', choices: [{ id: a, text: '$x=\pm2$' }, { id: b, text: '$x=2$ only' }, { id: c, text: '$x=\pm4$' }, { id: d, text: no real x-values }], answer: { choiceId: a }, explanation: 'Solution: Solve $x^2=4$ to get $x=\pm2$. Why it works: Both positive and negative square roots square to 4. Common trap: Taking only the principal square root loses a boundary. Why the other choices fail: b misses -2; c does not square to 4; d ignores real roots.', difficultyDimensions: [auxiliaryTechnique, casePartition], difficultyEvidence: Solves the boundary equality and accounts for both roots. , issueSignals: [{ id: sign-error }, { id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: geometric-area-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q003, type: multipleChoice, prompt: 'For horizontal slices with right boundary x=5 and left boundary x=y^2, what is the slice length?', choices: [{ id: a, text: '$5-y^2$' }, { id: b, text: '$y^2-5$' }, { id: c, text: '$5y^2$' }, { id: d, text: dy }], answer: { choiceId: a }, explanation: 'Solution: Length is right minus left: $5-y^2$. Why it works: A horizontal slice measures x-distance. Common trap: dy is thickness, not slice length. Why the other choices fail: b reverses sign; c is a product; d omits boundaries.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: Converts horizontal boundary data into a positive length expression. , issueSignals: [{ id: sign-error }, { id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: geometric-area-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q004, type: multipleChoice, prompt: 'Which point forces a split for the area between y=x and the x-axis on [-2,2]?', choices: [{ id: a, text: '$x=0$' }, { id: b, text: '$x=2$ only' }, { id: c, text: '$x=-2$ only' }, { id: d, text: no split is needed }], answer: { choiceId: a }, explanation: 'Solution: Split at x=0. Why it works: The top/bottom relation reverses there. Common trap: A signed integral cancels while geometric area adds both pieces. Why the other choices fail: Endpoints do not change boundary order; d ignores the sign change.', difficultyDimensions: [casePartition, representationTransfer], difficultyEvidence: Detects a boundary-order reversal from the curve and axis. , issueSignals: [{ id: sign-error }, { id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: geometric-area-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q005, type: multipleChoice, prompt: 'Evaluate the area between y=3 and y=x^2 on [-1,1].', choices: [{ id: a, text: '$16/3$' }, { id: b, text: '$2/3$' }, { id: c, text: '$8/3$' }, { id: d, text: '$-16/3$' }], answer: { choiceId: a }, explanation: 'Solution: $\int_{-1}^1(3-x^2)dx=[3x-x^3/3]_{-1}^1=16/3$. Why it works: 3 remains above x squared on this interval. Common trap: Area must be positive. Why the other choices fail: b and c omit part of the interval or subtraction; d reverses the boundaries.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: Builds a routine top-minus-bottom model and evaluates its definite integral. , issueSignals: [{ id: sign-error }, { id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: geometric-area-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q006, type: multipleChoice, prompt: 'For vertical slices, what do the integral bounds represent?', choices: [{ id: a, text: x-locations of the first and last slices }, { id: b, text: slice heights }, { id: c, text: y-values only }, { id: d, text: final area units }], answer: { choiceId: a }, explanation: 'Solution: The bounds are the first and last x-locations. Why it works: Vertical thickness is dx. Common trap: Heights belong in the integrand. Why the other choices fail: b, c, and d are different parts of the model.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: Associates vertical slicing with x-indexed bounds. , issueSignals: [{ id: sign-error }, { id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: geometric-area-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q007, type: multipleChoice, prompt: 'If both axes are measured in meters, an area-between-curves answer has units of', choices: [{ id: a, text: square meters }, { id: b, text: meters }, { id: c, text: cubic meters }, { id: d, text: meters per second }], answer: { choiceId: a }, explanation: 'Solution: Area has square meters. Why it works: Slice height times dx is meter times meter. Common trap: Cubic units require a third length factor. Why the other choices fail: b is length; c is volume; d is a rate.', difficultyDimensions: [representationTransfer, errorDiagnosis], difficultyEvidence: Uses dimensional analysis to check the accumulated quantity. , issueSignals: [{ id: sign-error }, { id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: geometric-area-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q008, type: multipleChoice, prompt: 'What is the best first step in an area-between-curves problem?', choices: [{ id: a, text: sketch the region and locate intersections }, { id: b, text: choose an antiderivative first }, { id: c, text: multiply the curves }, { id: d, text: change dx to dy at random }], answer: { choiceId: a }, explanation: 'Solution: Sketch and find intersections first. Why it works: They reveal bounds and boundary order. Common trap: Algebra cannot correct an unmodeled region. Why the other choices fail: b starts after modeling; c is not an area distance; d changes notation without geometry.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: Selects the geometric planning action that determines a valid integral. , issueSignals: [{ id: sign-error }, { id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: geometric-area-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q009, type: multipleChoice, prompt: 'Which condition suggests using horizontal slices?', choices: [{ id: a, text: right and left boundaries are simpler functions of y }, { id: b, text: the region has an x-bound }, { id: c, text: every curve is a polynomial }, { id: d, text: dx is forbidden }], answer: { choiceId: a }, explanation: 'Solution: Use horizontal slices when right-minus-left in y is simpler. Why it works: Slice orientation is chosen for a clear single boundary description. Common trap: An x-bound does not force vertical slices. Why the other choices fail: b and c are not decisive; d is false.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: Chooses an orientation by comparing boundary representations. , issueSignals: [{ id: sign-error }, { id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: geometric-area-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q010, type: multipleChoice, prompt: 'Why is a negative value from a proposed area integral a warning sign?', choices: [{ id: a, text: geometric slice height was likely reversed on some interval }, { id: b, text: integrals cannot be negative }, { id: c, text: all curves must be positive }, { id: d, text: dx is always negative }], answer: { choiceId: a }, explanation: 'Solution: A negative result usually means the top/bottom order was reversed or a partition was missed. Why it works: Geometric area accumulates nonnegative distances. Common trap: Definite integrals may be negative; geometric area should not be. Why the other choices fail: b and c are false; d is not inherently negative.', difficultyDimensions: [errorDiagnosis, casePartition], difficultyEvidence: Diagnoses the geometric cause of an invalid signed area result. , issueSignals: [{ id: sign-error }, { id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: geometric-area-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
