questions:
- id: q1
  type: numericResponse
  prompt: A constant torque of $10 \text{ N}\cdot\text{m}$ causes a wheel to rotate
    through $5.0 \text{ rad}$. How much work is done?
  answer:
    value: 50.0
    tolerance: 1.0
  explanation: $W = \tau\Delta\theta = 10(5.0) = 50 \text{ J}$.
