  tags: [physics-1, rotational-work-power]
questions:
- id: q001
  type: numericResponse
  prompt: A constant torque of 12 N m turns a wheel through 5.0 rad. Find the work in J.
  answer: { value: 60, tolerance: 0.3 }
  explanation: |
    Solution: $W=tau theta=12(5.0)=60$ J.

    Why it works: Constant torque does work through angular displacement.
  difficultyDimensions: [modelOrDerivation, simplification]
- id: q002
  type: numericResponse
  prompt: A motor applies torque 8.0 N m while rotating at 20 rad/s. Find its power in W.
  answer: { value: 160, tolerance: 1 }
  explanation: |
    Solution: $P=tau omega=8.0(20)=160$ W.

    Why it works: Rotational power is torque times angular speed.
  difficultyDimensions: [modelOrDerivation, simplification]
- id: q003
  type: numericResponse
  prompt: A motor delivers 300 W at 15 rad/s. Find its torque in N m.
  answer: { value: 20, tolerance: 0.2 }
  explanation: |
    Solution: $tau=P/omega=300/15=20$ N m.

    Why it works: Rearranging the power relation isolates torque.
  difficultyDimensions: [reverseReasoning, modelOrDerivation]
- id: q004
  type: numericResponse
  prompt: A flywheel has moment of inertia 2.0 kg m^2 and angular speed 6.0 rad/s. Find its rotational kinetic energy in J.
  answer: { value: 36, tolerance: 0.2 }
  explanation: |
    Solution: $K=0.5I omega^2=0.5(2.0)(6.0)^2=36$ J.

    Why it works: Rotational kinetic energy depends on moment of inertia and squared angular speed.
  difficultyDimensions: [modelOrDerivation, simplification]
- id: q005
  type: multipleChoice
  prompt: A braking torque points opposite the angular displacement. What sign of work does it do?
  choices: [{ id: a, text: negative }, { id: b, text: positive }, { id: c, text: always zero }]
  answer: { choiceId: a }
  explanation: |
    Solution: The work is negative.

    Why it works: Opposing torque removes rotational kinetic energy.

    Why the other choices fail: Positive work aids the motion, and nonzero opposing torque over a nonzero angle does not give zero work.
  difficultyDimensions: [modelOrDerivation, representationTransfer]
- id: q006
  type: numericResponse
  prompt: A solid disk and a hoop have equal mass and radius. Which has the larger moment of inertia about the center? Enter 1 for disk or 2 for hoop.
  answer: { value: 2, tolerance: 0.01 }
  explanation: |
    Solution: Enter 2, the hoop.

    Why it works: More of a hoop's mass lies farther from the axis, increasing its moment of inertia.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
- id: q007
  type: numericResponse
  prompt: A shaft supplies 10 N m at 120 rev/min. Find power in W.
  answer: { value: 125.663706, tolerance: 1 }
  explanation: |
    Solution: 120 rev/min is $4pi$ rad/s, so $P=10(4pi)=125.7$ W.

    Why it works: Angular speed must be converted to rad/s before using the power relation.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
- id: q008
  type: numericResponse
  prompt: A torque of 6.0 N m performs 42 J of work. Find the angular displacement in rad.
  answer: { value: 7, tolerance: 0.05 }
  explanation: |
    Solution: $theta=W/tau=42/6.0=7.0$ rad.

    Why it works: Rearranging constant-torque work isolates angular displacement.
  difficultyDimensions: [reverseReasoning, modelOrDerivation]
- id: q009
  type: numericResponse
  prompt: A motor transfers 900 J in 30 s. Find average power in W.
  answer: { value: 30, tolerance: 0.2 }
  explanation: |
    Solution: $P=W/t=900/30=30$ W.

    Why it works: Average power is energy transferred per time.
  difficultyDimensions: [modelOrDerivation, simplification]
- id: q010
  type: multipleChoice
  prompt: Which expression is the rotational analog of linear work $W=Fd$?
  choices: [{ id: a, text: $W=tau theta$ }, { id: b, text: $W=I omega$ }, { id: c, text: $W=alpha t$ }]
  answer: { choiceId: a }
  explanation: |
    Solution: $W=tau theta$.

    Why it works: Torque corresponds to force and angular displacement corresponds to linear displacement.

    Why the other choices fail: The alternatives are not work expressions.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
