schemaVersion: 1
id: calc2-arc-length-surface-area-test
title: Arc Length and Surface Area Test
assessmentType: test
categoryId: calculus-2
subcategoryId: arc-length-surface-area
subcategoryIds:
  - arc-length-surface-area
modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: numericResponse
    prompt: |
      Find the exact decimal value of the arc length of the curve $y = \frac{x^4}{8} + \frac{1}{4x^2}$ from $x = 1$ to $x = 2$.
    answer:
      value: 2.0625
      tolerance: 0.01
    explanation: |
      $y = \frac{1}{8}x^4 + \frac{1}{4}x^{-2}$
      $y' = \frac{1}{2}x^3 - \frac{1}{2}x^{-3}$
      $(y')^2 = \frac{1}{4}x^6 - \frac{1}{2} + \frac{1}{4}x^{-6}$
      $1 + (y')^2 = \frac{1}{4}x^6 + \frac{1}{2} + \frac{1}{4}x^{-6} = (\frac{1}{2}x^3 + \frac{1}{2}x^{-3})^2$
      $L = \int_1^2 (\frac{1}{2}x^3 + \frac{1}{2}x^{-3})\,dx = [\frac{x^4}{8} - \frac{1}{4x^2}]_1^2$
      At $x=2$: $16/8 - 1/16 = 2 - 1/16 = 31/16$.
      At $x=1$: $1/8 - 1/4 = 1/8 - 2/8 = -1/8 = -2/16$.
      $31/16 - (-2/16) = 33/16 = 2.0625$.

  - id: q002
    type: numericResponse
    prompt: |
      Find the surface area generated by revolving the line segment $y = 3x$ from $x=0$ to $x=2$ around the y-axis.
      Provide the exact decimal value to 2 decimal places (use $\pi \approx 3.14159$).
    answer:
      value: 39.73
      tolerance: 0.1
    explanation: |
      Revolving around the y-axis, radius is $x$.
      $y' = 3 \implies 1 + (y')^2 = 10$.
      $S = \int_0^2 2\pi x \sqrt{10}\,dx = 2\pi\sqrt{10} [\frac{x^2}{2}]_0^2 = 2\pi\sqrt{10} (2) = 4\pi\sqrt{10}$.
      $4(3.14159)(\sqrt{10}) \approx 12.566 \times 3.162 \approx 39.73$.

  - id: q003
    type: multipleChoice
    prompt: |
      Set up the integral for the surface area of the solid obtained by revolving $x = y^2 + 1$ on $y \in [0, 3]$ around the x-axis.
    choices:
      - id: a
        text: $2\pi \int_0^3 y \sqrt{1 + 4y^2}\,dy$
      - id: b
        text: $2\pi \int_0^3 (y^2 + 1) \sqrt{1 + 4y^2}\,dy$
      - id: c
        text: $2\pi \int_0^3 x \sqrt{1 + 4y^2}\,dy$
      - id: d
        text: $2\pi \int_0^3 y \sqrt{1 + 2y}\,dy$
    answer:
      choiceId: a
    explanation: |
      Revolving around the x-axis, the radius is $y$.
      $x = g(y) = y^2 + 1 \implies g'(y) = 2y$.
      $S = \int_0^3 2\pi y \sqrt{1 + (2y)^2}\,dy = 2\pi \int_0^3 y \sqrt{1 + 4y^2}\,dy$.

  - id: q004
    type: multipleChoice
    prompt: |
      Set up the integral for the surface area of the solid obtained by revolving $y = e^x$ on $[0, 1]$ around the line $y = -2$.
    choices:
      - id: a
        text: $2\pi \int_0^1 (e^x + 2) \sqrt{1 + e^{2x}}\,dx$
      - id: b
        text: $2\pi \int_0^1 (e^x - 2) \sqrt{1 + e^{2x}}\,dx$
      - id: c
        text: $2\pi \int_0^1 e^x \sqrt{1 + e^{2x}}\,dx$
      - id: d
        text: $2\pi \int_0^1 (2 - e^x) \sqrt{1 + e^{2x}}\,dx$
    answer:
      choiceId: a
    explanation: |
      The radius is the distance from the curve to the axis of revolution. The curve is $y = e^x$ and the axis is $y = -2$ (below the curve).
      Radius = top - bottom = $e^x - (-2) = e^x + 2$.
      $y' = e^x$, so $1 + (y')^2 = 1 + e^{2x}$.
      $S = 2\pi \int (e^x + 2)\sqrt{1 + e^{2x}}\,dx$.

  - id: q005
    type: numericResponse
    prompt: |
      Find the arc length of the curve $y = \frac{2}{3}(x^2+1)^{3/2}$ from $x=0$ to $x=3$.
      Provide the exact decimal value to 3 places.
    answer:
      value: 12.0
      tolerance: 0.1
    explanation: |
      $y' = \frac{2}{3} \cdot \frac{3}{2} (x^2+1)^{1/2} (2x) = 2x\sqrt{x^2+1}$.
      $(y')^2 = 4x^2(x^2+1) = 4x^4 + 4x^2$.
      $1 + (y')^2 = 1 + 4x^2 + 4x^4 = (1+2x^2)^2$.
      $L = \int_0^3 \sqrt{(1+2x^2)^2}\,dx = \int_0^3 (1+2x^2)\,dx$.
      $L = [x + \frac{2x^3}{3}]_0^3 = (3 + \frac{2(27)}{3}) - 0 = 3 + 18 = 21$.
