- id: we001
  title: Geosynchronous Orbit Altitude
  problem: |
    A geosynchronous satellite orbits Earth with a period exactly equal to Earth's rotational period, so it appears to hover over the same spot on the equator.
    Calculate the **altitude** $h$ (distance above the surface) of a geosynchronous orbit in meters.
    Use Earth's mass $M_E = 5.97 \times 10^{24} \text{ kg}$, Earth's radius $R_E = 6.37 \times 10^6 \text{ m}$, $G = 6.67 \times 10^{-11} \text{ N m}^2/\text{kg}^2$, and assume the rotational period of Earth is exactly $24 \text{ hours}$.
  steps:
  - id: step-1
    title: 1. Convert period to SI units
    instruction: |
      Kepler's Third Law requires all units to be standard SI units. Convert the orbital period $T = 24 \text{ hours}$ into seconds.
    type: numericResponse
    prompt: |
      What is the period $T$ in seconds?
    answer:
      value: 86400
      tolerance: 10
    explanation: |
      Solution:
      $T = 24 \text{ h} \times 60 \text{ min/h} \times 60 \text{ s/min} = 86400 \text{ s}$.

      Why it works:
      We must use standard SI base units (seconds) to ensure compatibility with the gravitational constant $G$.

  - id: step-2
    title: 2. Apply Kepler's Third Law to find orbital radius
    instruction: |
      Use Kepler's Third Law: $T^2 = \frac{4\pi^2}{GM} r^3$ to solve for the orbital radius $r$ (the distance from the center of the Earth).
    type: numericResponse
    prompt: |
      What is the orbital radius $r$ in meters?
    answer:
      value: 42241000
      tolerance: 100000
    explanation: |
      Solution:
      Rearranging for $r$: $r^3 = \frac{GM T^2}{4\pi^2}$.
      $r = \left( \frac{(6.67 \times 10^{-11})(5.97 \times 10^{24})(86400)^2}{4\pi^2} \right)^{1/3}$.
      $r = \left( \frac{2.973 \times 10^{24}}{39.478} \right)^{1/3} \approx (7.53 \times 10^{22})^{1/3} \approx 4.224 \times 10^7 \text{ m}$.

      Why it works:
      The radius $r$ represents the distance from the center of mass of the system (the center of Earth) to the satellite.

  - id: step-3
    title: 3. Calculate altitude above the surface
    instruction: |
      The radius $r$ is the distance from the center of the Earth. To find the altitude $h$, subtract the Earth's radius $R_E$.
    type: numericResponse
    prompt: |
      What is the altitude $h$ in meters?
    answer:
      value: 35871000
      tolerance: 100000
    explanation: |
      Solution:
      $h = r - R_E = 4.224 \times 10^7 - 6.37 \times 10^6 = 3.587 \times 10^7 \text{ m}$.

      Why it works:
      By definition, $r = R_E + h$. Subtracting the planetary radius gives the height above the surface, which is roughly $35,800 \text{ km}$.

- id: we002
  title: Circular Orbit Speed
  problem: |
    A satellite orbits a planet of mass $M=6.0\times10^{24}$ kg at a radius $r=8.0\times10^6$ m from the planet's center. Use $G=6.67\times10^{-11}$ in SI units to find the circular-orbit speed.
  steps:
  - id: step-4
    title: Set gravity equal to centripetal force
    instruction: Use $GMm/r^2=mv^2/r$ and cancel satellite mass.
    type: symbolicResponse
    prompt: What expression gives circular speed $v$?
    answer: { gradingMode: auto, expectedLatex: '\sqrt{G M/r}', equivalenceMode: expression, tolerance: 0 }
    explanation: |
      Solution: $v=\sqrt{GM/r}$.

      Why it works: Gravity supplies the centripetal force, and satellite mass cancels from both sides.
  - id: step-5
    title: Calculate speed
    instruction: Substitute the planet mass and orbital radius.
    type: numericResponse
    prompt: What is the orbital speed in m/s?
    answer: { value: 7072.48, tolerance: 1 }
    explanation: |
      Solution: $v=\sqrt{(6.67\times10^{-11})(6.0\times10^{24})/(8.0\times10^6)}=7.07\times10^3$ m/s.

      Why it works: A larger orbital radius requires less circular speed for the same central mass.
