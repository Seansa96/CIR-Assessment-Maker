schemaVersion: 1
id: chemistry-atoms-molecules-ions-test
title: Atoms, Molecules, and Ions Test
assessmentType: test
categoryId: chemistry
subcategoryIds:
- chemistry-atomic-theory
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  prompt: 'Zinc burns in oxygen to produce zinc oxide. Before the reaction, a student
    has 32.7 g of zinc. After the reaction, 40.7 g of zinc oxide is collected. What
    mass of oxygen reacted?

    '
  choices:
  - id: a
    text: 8.0 g
  - id: b
    text: 40.7 g
  - id: c
    text: 32.7 g
  - id: d
    text: 73.4 g
  answer:
    choiceId: a
  explanation: 'Conservation of mass: mass O2 = mass product − mass Zn = 40.7 − 32.7
    = 8.0 g.

    '
- id: q002
  type: numericResponse
  prompt: 'Copper forms two compounds with oxygen. In one compound, 63.5 g of copper
    combines with 8.0 g of oxygen. In the second, 63.5 g of copper combines with 16.0
    g of oxygen. What is the ratio of oxygen masses (compound 2 : compound 1)?

    '
  answer:
    value: 2
    tolerance: 0
  explanation: '16.0 / 8.0 = 2.0. A whole-number ratio, illustrating the Law of Multiple
    Proportions.

    '
- id: q003
  type: numericResponse
  prompt: 'An atom of ${}^{39}_{19}\text{K}$ (potassium) is neutral. How many neutrons
    does it have?

    '
  answer:
    value: 20
    tolerance: 0
  explanation: 'Neutrons = A − Z = 39 − 19 = 20.

    '
- id: q004
  type: multipleChoice
  prompt: 'Silicon (Si) has three stable isotopes: Si-28 (92.23%), Si-29 (4.67%),
    and Si-30 (3.10%). The atomic mass listed on the periodic table (a\approximately
    28.09 amu) is best described as:

    '
  choices:
  - id: a
    text: A weighted average of the masses of all naturally occurring isotopes.
  - id: b
    text: The mass of the most common isotope only.
  - id: c
    text: The sum of all isotope masses.
  - id: d
    text: The mass of Si-29, the middle isotope.
  answer:
    choiceId: a
  explanation: 'Atomic masses on the periodic table are weighted averages. Si-28 dominates
    (92.23%), pulling the average close to 28, but the small contributions from Si-29
    and Si-30 shift it slightly above 28.

    '
- id: q005
  type: multipleChoice
  prompt: 'An oxygen atom (atomic number 8) gains 2 electrons. Which description is
    correct?

    '
  choices:
  - id: a
    text: The oxide ion O2− has 8 protons and 10 electrons.
  - id: b
    text: The oxide ion O2− has 10 protons and 8 electrons.
  - id: c
    text: The oxide ion O2+ has 8 protons and 6 electrons.
  - id: d
    text: The atom becomes a different element with atomic number 10.
  answer:
    choiceId: a
  explanation: 'Gaining electrons creates an anion. Oxygen (8 protons) gains 2 electrons:
    8 + 2 = 10 electrons. The charge is 2−. Protons never change, so the element is
    still oxygen.

    '
- id: q006
  type: multipleChoice
  prompt: 'Which set of elements is correctly listed in order of increasing atomic
    radius (smallest to largest)?

    '
  choices:
  - id: a
    text: F < O < S < Se
  - id: b
    text: Se < S < O < F
  - id: c
    text: F < S < O < Se
  - id: d
    text: O < F < S < Se
  answer:
    choiceId: a
  explanation: 'All four are in Group 16 or nearby. F is the smallest (Period 2, Group
    17); O is also Period 2 but Group 16 (slightly larger than F). S (Period 3) is
    larger than O. Se (Period 4) is the largest. Correct order: F < O < S < Se.

    '
- id: q007
  type: multipleChoice
  prompt: 'Which element has the highest first ionization energy?

    '
  choices:
  - id: a
    text: Ne (noble gas, Period 2)
  - id: b
    text: Na (Period 3, Group 1)
  - id: c
    text: Mg (Period 3, Group 2)
  - id: d
    text: Ar (noble gas, Period 3)
  answer:
    choiceId: a
  explanation: 'Noble gases have complete valence shells and the highest ionization
    energies in their period. Ne (Period 2) has a higher ionization energy than Ar
    (Period 3) because it is in a higher period (closer to nucleus, more nuclear charge
    per shell). Ne has the highest IE of the four.

    '
- id: q008
  type: multipleChoice
  prompt: 'What is the correct name for SnO2?

    '
  choices:
  - id: a
    text: tin(IV) oxide
  - id: b
    text: tin(II) oxide
  - id: c
    text: ditin dioxide
  - id: d
    text: stannum oxide
  answer:
    choiceId: a
  explanation: 'Tin (Sn) is a transition metal — Type II. 2 O2− ions → 4− total →
    Sn must be 4+. Name: tin(IV) oxide.

    '
- id: q009
  type: freeResponse
  prompt: 'Name the compound Pb3(PO4)2.

    '
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Lead (Pb) is a transition metal — Type II.
    - Phosphate is PO4³−; 2 phosphate ions = 6− total.
    - 3 Pb ions supply 6+, so each Pb = 2+ (Pb2+).
    - Name is lead(II) phosphate.
- id: q010
  type: multipleChoice
  prompt: 'Which of the following is a molecular (covalent) compound?

    '
  choices:
  - id: a
    text: SF6 (sulfur hexafluoride)
  - id: b
    text: CsBr (cesium bromide)
  - id: c
    text: BaS (barium sulfide)
  - id: d
    text: Fe2O3 (iron(III) oxide)
  answer:
    choiceId: a
  explanation: 'SF6 contains sulfur and fluorine — both are nonmetals — so it is a
    molecular (covalent) compound. The others all contain a metal (Cs, Ba, Fe) paired
    with a nonmetal, making them ionic.

    '
- id: q011
  type: freeResponse
  prompt: 'Write the formula for manganese(IV) sulfide.

    '
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Manganese(IV) = Mn4+.
    - Sulfide = S2−.
    - LCM of 4 and 2 is 4. Need 1 Mn4+ and 2 S2−.
    - Formula is MnS2.
- id: q012
  type: multipleChoice
  prompt: 'Dalton''s atomic theory states that atoms of the same element are identical.
    Which modern discovery shows this is not strictly true?

    '
  choices:
  - id: a
    text: Isotopes — atoms of the same element can have different numbers of neutrons
      and thus different masses.
  - id: b
    text: Electrons — different atoms of the same element can have different numbers
      of electrons.
  - id: c
    text: Nuclear fusion — atoms of the same element can be created from lighter atoms.
  - id: d
    text: Chemical bonding — atoms can share electrons, changing their identity.
  answer:
    choiceId: a
  explanation: 'Isotopes are atoms of the same element with different numbers of neutrons
    (and thus different masses), directly contradicting Dalton''s postulate that all
    atoms of an element are identical. (b) describes ions, which are still the same
    element. (c) and (d) do not contradict this postulate.

    '
- id: q013
  type: numericResponse
  prompt: 'Silicon (Si, atomic number 14) has three stable isotopes. Si-28 has an
    abundance of 92.23% and a mass of 27.977 amu. Si-29 has an abundance of 4.67%
    and a mass of 28.976 amu. Si-30 has an abundance of 3.10% and a mass of 29.974
    amu. Calculate the weighted average atomic mass of Si in amu (to 2 decimal places).

    '
  answer:
    value: 28.09
    tolerance: 0.02
  explanation: '(0.9223 × 27.977) + (0.0467 × 28.976) + (0.0310 × 29.974) = 25.804
    + 1.353 + 0.929 = 28.086 ≈ 28.09 amu.

    '
- id: q014
  type: multipleChoice
  prompt: 'What is the name of (NH4)2Cr2O7?

    '
  choices:
  - id: a
    text: ammonium dichromate
  - id: b
    text: ammonium(I) chromate
  - id: c
    text: nitrogen-hydrogen dichromate
  - id: d
    text: ammonium chromium oxide
  answer:
    choiceId: a
  explanation: 'NH4+ is the ammonium ion; Cr2O7²− is the dichromate ion. Two ammonium
    ions (2 × 1+) balance the 2− dichromate. No Roman numeral is needed for ammonium.
    Name: ammonium dichromate. (This compound famously decomposes dramatically when
    ignited — the "pharaoh''s serpent" reaction.)

    '
- id: q015
  type: selectAll
  prompt: 'Which of the following compounds are ionic? Select all that apply.

    '
  choices:
  - id: a
    text: CaCl2
  - id: b
    text: N2O
  - id: c
    text: K2SO4
  - id: d
    text: HCl (in gas phase)
  - id: e
    text: AlPO4
  answer:
    choiceIds:
    - a
    - c
    - e
  explanation: 'CaCl2 (metal + nonmetal), K2SO4 (metal + polyatomic ion), and AlPO4
    (metal + polyatomic ion) are all ionic. N2O is two nonmetals — molecular. HCl
    in gas phase is molecular (covalent); it only ionizes when dissolved in water.

    '
