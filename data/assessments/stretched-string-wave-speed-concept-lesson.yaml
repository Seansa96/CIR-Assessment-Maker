lesson:
  introduction: This lesson develops Wave Speed on a Stretched String from a diagram, a mathematical model,
    and a calculus-based interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      When a string under tension is disturbed, the disturbance propagates as a transverse wave. The physical system is governed by the inertia of the string (resisting acceleration) and the tension in the string (providing the restoring force).
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    check: {id: string-s1, type: multipleChoice, prompt: 'What governs a string disturbance?', choices: [{id: a, text: 'Tension and inertia'}, {id: b, text: 'Frequency alone'}, {id: c, text: 'A constant displacement'}, {id: d, text: 'No mass'}], answer: {choiceId: a}, explanation: 'This follows from the stretched-string wave-speed model.'}
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      The measurable quantities are the macroscopic tension force $F_T$ applied to the string, and the linear mass density $\mu$, which is the mass per unit length ($\mu = m/L$).
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    check: {id: string-s2, type: multipleChoice, prompt: 'What is mass per unit length called?', choices: [{id: a, text: 'Linear mass density'}, {id: b, text: 'Frequency alone'}, {id: c, text: 'A constant displacement'}, {id: d, text: 'No mass'}], answer: {choiceId: a}, explanation: 'This follows from the stretched-string wave-speed model.'}
  - id: s3
    title: Mathematical model
    content: >-
      The mathematical model predicts the wave speed $v$. Intuitively, higher tension means a stronger restoring force (faster wave), and higher linear density means more inertia (slower wave). The exact relationship is $v = \sqrt{\frac{F_T}{\mu}}$.
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    check: {id: string-s3, type: multipleChoice, prompt: 'What is string wave speed?', choices: [{id: a, text: '$v=\sqrt{F_T/\mu}$'}, {id: b, text: 'Frequency alone'}, {id: c, text: 'A constant displacement'}, {id: d, text: 'No mass'}], answer: {choiceId: a}, explanation: 'This follows from the stretched-string wave-speed model.'}
  - id: s4
    title: Calculus connection
    content: >-
      To derive this using calculus and Newtonian mechanics, consider a small segment of the string of length $\Delta s$ at the peak of a wave pulse. In the reference frame of the moving pulse, the segment travels in a circular arc of radius $R$ at speed $v$.
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    check: {id: string-s4, type: multipleChoice, prompt: 'What geometry supports the derivation?', choices: [{id: a, text: 'A curved pulse segment'}, {id: b, text: 'Frequency alone'}, {id: c, text: 'A constant displacement'}, {id: d, text: 'No mass'}], answer: {choiceId: a}, explanation: 'This follows from the stretched-string wave-speed model.'}
  - id: s5
    title: Derivation or justification
    content: >-
      The tension $F_T$ pulls tangentially on both ends of the segment. The downward components sum to $2F_T \sin(\theta) \approx 2F_T(\frac{\Delta s / 2}{R}) = F_T \frac{\Delta s}{R}$. This acts as a centripetal force: $F_{\text{net}} = \frac{(\Delta m) v^2}{R}$. Substituting $\Delta m = \mu \Delta s$, we get $F_T \frac{\Delta s}{R} = \frac{\mu \Delta s v^2}{R}$. The $\Delta s$ and $R$ cancel, leaving $F_T = \mu v^2$, or $v = \sqrt{\frac{F_T}{\mu}}$.
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    check: {id: string-s5, type: multipleChoice, prompt: 'What force balance yields the speed formula?', choices: [{id: a, text: 'Centripetal force balance'}, {id: b, text: 'Frequency alone'}, {id: c, text: 'A constant displacement'}, {id: d, text: 'No mass'}], answer: {choiceId: a}, explanation: 'This follows from the stretched-string wave-speed model.'}
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, this means generating a pulse on a thicker, heavier rope (high $\mu$) results in a visibly slower-moving pulse compared to a thin, light string under the same tension.
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    check: {id: string-s6, type: multipleChoice, prompt: 'What happens as linear density rises?', choices: [{id: a, text: 'A heavier rope has lower speed'}, {id: b, text: 'Frequency alone'}, {id: c, text: 'A constant displacement'}, {id: d, text: 'No mass'}], answer: {choiceId: a}, explanation: 'This follows from the stretched-string wave-speed model.'}
  - id: s7
    title: Quantitative strategy
    content: >-
      A quantitative strategy in problems involving hanging masses is recognizing that tension $F_T$ is provided by the weight of the hanging mass, $F_T = Mg$. Remember to distinguish the hanging mass $M$ from the string's mass $m$.
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    check: {id: string-s7, type: multipleChoice, prompt: 'What tension is supplied by a hanging mass?', choices: [{id: a, text: '$F_T=Mg$'}, {id: b, text: 'Frequency alone'}, {id: c, text: 'A constant displacement'}, {id: d, text: 'No mass'}], answer: {choiceId: a}, explanation: 'This follows from the stretched-string wave-speed model.'}
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: As tension $F_T \to 0$ (a slack string), the wave speed $v \to 0$, which aligns with reality as a slack string cannot transmit a transverse wave. Units check: $\sqrt{\text{N} / (\text{kg/m})} = \sqrt{(\text{kg}\cdot\text{m/s}^2) \cdot \text{m/kg}} = \sqrt{\text{m}^2/\text{s}^2} = \text{m/s}$.
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    check: {id: string-s8, type: multipleChoice, prompt: 'If tension quadruples at fixed density, what happens to speed?', choices: [{id: a, text: 'It doubles'}, {id: b, text: 'It quadruples'}, {id: c, text: 'It halves'}, {id: d, text: 'It is unchanged'}], answer: {choiceId: a}, explanation: 'Speed is proportional to the square root of tension.'}
