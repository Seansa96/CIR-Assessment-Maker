lesson:
  introduction: This deeper lesson expands Virtualization and the Cloud from Chapter 7 of the Modern Operating Systems reference structure. It focuses on mechanism, boundary, tradeoff, and common failure modes rather than memorized labels.
  sections:
  - id: virtual-machine-boundary
    title: Virtual machine boundary
    required: true
    content: 'A virtual machine presents a hardware-like boundary to a guest OS while the hypervisor mediates real resources.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Virtualization and the Cloud, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: virtual-machine-boundary-deep-check
      title: 'Check: Virtual machine boundary'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Virtual machine boundary**?
      choices:
      - id: a
        text: The guest sees a machine abstraction.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'The guest sees a machine abstraction. Related topic: Virtualization and the Cloud.'
  - id: hypervisor
    title: Hypervisor role
    required: true
    content: 'The hypervisor allocates CPU, memory, and I/O while preserving isolation among guests.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Virtualization and the Cloud, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: hypervisor-deep-check
      title: 'Check: Hypervisor role'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Hypervisor role**?
      choices:
      - id: a
        text: The hypervisor is the resource manager for VMs.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'The hypervisor is the resource manager for VMs. Related topic: Virtualization and the Cloud.'
  - id: privileged-operations
    title: Privileged operations
    required: true
    content: 'Guest privileged operations must be trapped, translated, or handled with hardware virtualization support.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Virtualization and the Cloud, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: privileged-operations-deep-check
      title: 'Check: Privileged operations'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Privileged operations**?
      choices:
      - id: a
        text: Virtualization depends on safe mediation.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Virtualization depends on safe mediation. Related topic: Virtualization and the Cloud.'
    media:
    - type: image
      src: /assessments/operating-systems/virtualization/trap-and-emulate.svg
      alt: Guest privileged operation trapped to a hypervisor and safely emulated.
      caption: Virtualization keeps host control by mediating privileged guest operations.
  - id: containers
    title: Containers
    required: true
    content: 'Containers share the host kernel and isolate processes using namespaces, cgroups, and filesystem boundaries.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Virtualization and the Cloud, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: containers-deep-check
      title: 'Check: Containers'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Containers**?
      choices:
      - id: a
        text: Containers are not full guest machines.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Containers are not full guest machines. Related topic: Virtualization and the Cloud.'
    media:
    - type: image
      src: /assessments/operating-systems/virtualization/vm-vs-container.svg
      alt: Comparison of virtual machine and container stacks.
      caption: VMs and containers isolate at different layers.
  - id: cloud-resource-model
    title: Cloud resource model
    required: true
    content: 'Cloud platforms package virtualized compute, storage, and networks with provisioning, elasticity, and management APIs.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Virtualization and the Cloud, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: cloud-resource-model-deep-check
      title: 'Check: Cloud resource model'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Cloud resource model**?
      choices:
      - id: a
        text: Cloud is operationalized virtualization and resource automation.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Cloud is operationalized virtualization and resource automation. Related topic: Virtualization and the Cloud.'
