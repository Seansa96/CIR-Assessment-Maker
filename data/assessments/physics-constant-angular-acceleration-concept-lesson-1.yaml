lesson:
  introduction: Just as we used kinematic equations for linear motion with constant
    acceleration, we can derive an analogous set of equations for rotational motion
    with constant angular acceleration.
  sections:
  - id: sec-1
    title: Kinematic Equations for Rotation
    content: 'When a rigid body rotates with a constant angular acceleration ($\alpha
      = \text{constant}$), we can integrate $\alpha = d\omega/dt$ and $\omega = d\theta/dt$
      to yield a set of equations identical in form to the 1D linear kinematic equations:


      1. $\omega = \omega_0 + \alpha t$

      2. $\theta = \theta_0 + \omega_0 t + \frac{1}{2}\alpha t^2$

      3. $\omega^2 = \omega_0^2 + 2\alpha(\theta - \theta_0)$

      4. $\theta - \theta_0 = \frac{1}{2}(\omega_0 + \omega)t$


      Here, $\theta_0$ and $\omega_0$ are the initial angular position and velocity
      at $t=0$.'
    media: []
    check:
      id: chk-ca-1
      type: multipleChoice
      prompt: Which of the following equations correctly relates angular velocity,
        angular acceleration, and angular displacement without explicitly requiring
        time $t$?
      choices:
      - id: a
        text: $\theta = \theta_0 + \omega_0 t + \frac{1}{2}\alpha t^2$
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: $\omega = \omega_0 + \alpha t$
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: c
        text: $\omega^2 = \omega_0^2 + 2\alpha(\Delta\theta)$
      - id: d
        text: $\Delta\theta = \frac{1}{2}(\omega_0 + \omega)t$
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: c
      explanation: 'Solution:

        $\omega^2 = \omega_0^2 + 2\alpha(\Delta\theta)$


        Why it works:

        Equation 3, $\omega^2 = \omega_0^2 + 2\alpha(\Delta\theta)$, is derived by
        substituting time out of the first two equations, making it perfectly suited
        for problems where time is not given.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-3
    title: Initial Conditions
    content: 'Define $\theta_0$ and $\omega_0$ at one chosen start time before selecting a kinematic equation.'
    media: []
    check: { id: chk-ca-5, type: multipleChoice, prompt: 'An object starts from rest. What is $\omega_0$?', choices: [{ id: a, text: '$0$' }, { id: b, text: '$\alpha t$' }, { id: c, text: '$\theta/t$' }, { id: d, text: undefined }], answer: { choiceId: a }, explanation: 'Solution: $\omega_0=0$.\n\nWhy it works: Starting from rest defines zero initial angular velocity.\n\nWhy the other choices fail: They describe later quantities, not the stated initial condition.' }
  - id: sec-4
    title: Sign Choices
    content: 'A consistent positive rotation direction makes the signs of $\omega$, $\alpha$, and $\Delta\theta$ meaningful.'
    media: []
    check: { id: chk-ca-6, type: multipleChoice, prompt: 'A positive angular velocity with negative angular acceleration means the object is:', choices: [{ id: a, text: speeding up }, { id: b, text: slowing down }, { id: c, text: at rest }, { id: d, text: moving linearly }], answer: { choiceId: b }, explanation: 'Solution: It is slowing down.\n\nWhy it works: Opposite signs reduce angular-speed magnitude.\n\nWhy the other choices fail: The signs do not match acceleration that increases the rotation rate.' }
  - id: sec-5
    title: Time-Free Equation
    content: 'Use $\omega^2=\omega_0^2+2\alpha\Delta\theta$ when time is absent.'
    media: []
    check: { id: chk-ca-7, type: multipleChoice, prompt: 'Which quantity is absent from $\omega^2=\omega_0^2+2\alpha\Delta\theta$?', choices: [{ id: a, text: time }, { id: b, text: displacement }, { id: c, text: acceleration }, { id: d, text: angular speed }], answer: { choiceId: a }, explanation: 'Solution: Time is absent.\n\nWhy it works: The equation eliminates time between the basic kinematic relations.\n\nWhy the other choices fail: All listed angular variables appear explicitly.' }
  - id: sec-6
    title: Average Angular Velocity
    content: 'For constant angular acceleration, average angular velocity is $(\omega_0+\omega)/2$.'
    media: []
    check: { id: chk-ca-8, type: multipleChoice, prompt: 'With constant acceleration from 2 to 10 rad/s, average angular speed is:', choices: [{ id: a, text: '$4$' }, { id: b, text: '$6$' }, { id: c, text: '$8$' }, { id: d, text: '$12$' }], answer: { choiceId: b }, explanation: 'Solution: $(2+10)/2=6$ rad/s.\n\nWhy it works: Constant acceleration makes angular velocity change linearly.\n\nWhy the other choices fail: They do not take the arithmetic mean.' }
  - id: sec-7
    title: Equation Selection
    content: 'List known variables and choose the equation containing the target but no unknown extras.'
    media: []
    check: { id: chk-ca-9, type: multipleChoice, prompt: 'Given $\omega_0$, $\alpha$, and $t$, use which equation to find $\omega$?', choices: [{ id: a, text: '$\omega=\omega_0+\alpha t$' }, { id: b, text: '$v=r\omega$' }, { id: c, text: '$\tau=I\alpha$' }, { id: d, text: '$P=\tau\omega$' }], answer: { choiceId: a }, explanation: 'Solution: Use $\omega=\omega_0+\alpha t$.\n\nWhy it works: It contains exactly the given variables and target.\n\nWhy the other choices fail: They address linear speed, dynamics, or power.' }
  - id: sec-2
    title: Applying the Equations
    content: 'To solve problems involving constant angular acceleration, follow a
      structured approach: identify the known and unknown variables among $\theta,
      \theta_0, \omega, \omega_0, \alpha,$ and $t$. Choose the equation that contains
      the desired unknown and the provided knowns.


      Be mindful of units and signs. If a wheel starts from rest and accelerates clockwise,
      it''s often easiest to define clockwise as the positive direction for that specific
      problem to avoid negative signs, provided you remain consistent.'
    media: []
    check:
      id: chk-ca-2
      type: multipleChoice
      prompt: A centrifuge starts from rest and accelerates at a constant $5 \text{
        rad/s}^2$. What is its angular velocity after 4 seconds?
      choices:
      - id: a
        text: $10 \text{ rad/s}$
        issueSignals:
        - id: unit-conversion-error
      - id: b
        text: $20 \text{ rad/s}$
      - id: c
        text: $40 \text{ rad/s}$
        issueSignals:
        - id: unit-conversion-error
      - id: d
        text: $80 \text{ rad/s}$
        issueSignals:
        - id: unit-conversion-error
      answer:
        choiceId: b
      explanation: 'Solution:

        $20 \text{ rad/s}$


        Why it works:

        Using $\omega = \omega_0 + \alpha t$. Since it starts from rest, $\omega_0
        = 0$. Thus, $\omega = 0 + (5)(4) = 20 \text{ rad/s}$.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
