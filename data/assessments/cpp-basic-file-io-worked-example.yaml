schemaVersion: 1
id: cpp-basic-file-io-worked-example
title: C++ Basic File I/O Worked Example
assessmentType: workedExample
categoryId: c++
subcategoryId: c++-file-io
subcategoryIds:
  - c++-file-io
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Reading text from a file with streams
    problem: "Plan how to open a text file, read from it, and check that the file opened successfully."
    steps:
      - id: s001
        title: Choose the stream type
        instruction: "C++ file I/O commonly uses stream classes from `<fstream>`."
        type: multipleChoice
        prompt: "Which type is commonly used to read from a file?"
        choices:
          - id: a
            text: "`std::ifstream`"
          - id: b
            text: "`std::ofstream`"
          - id: c
            text: "`std::thread`"
          - id: d
            text: "`std::socketstream`"
        answer:
          choiceId: a
        hint: "`if` in `ifstream` stands for input file."
        explanation: |
          `std::ifstream` is an input file stream used for reading. `std::ofstream` is used for writing.

          Related topic: File stream selection; choose input stream for reading and output stream for writing.
      - id: s002
        title: Open the file
        instruction: "The stream needs a path to the file."
        type: multipleChoice
        prompt: "Which line opens a file named `notes.txt` for reading?"
        choices:
          - id: a
            text: "`std::ifstream file(\"notes.txt\");`"
          - id: b
            text: "`std::ofstream file.read(\"notes.txt\");`"
          - id: c
            text: "`std::thread file(\"notes.txt\");`"
          - id: d
            text: "`std::cin file(\"notes.txt\");`"
        answer:
          choiceId: a
        hint: "Create an input file stream with the path."
        explanation: |
          Constructing `std::ifstream file("notes.txt");` attempts to open the file for reading.

          Related topic: Opening file streams; provide the path when constructing or call `.open(path)`.
      - id: s003
        title: Check that opening succeeded
        instruction: "File paths can be wrong, permissions can fail, and files may not exist."
        type: multipleChoice
        prompt: "Which check is commonly used before reading from an input file stream named `file`?"
        choices:
          - id: a
            text: "`if (!file) { ... }`"
          - id: b
            text: "`if (file == socket) { ... }`"
          - id: c
            text: "`if (file.thread()) { ... }`"
          - id: d
            text: "`if (file.delete()) { ... }`"
        answer:
          choiceId: a
        hint: "Streams can be tested in boolean context."
        explanation: |
          `if (!file)` checks whether the stream is in a failed state after opening.

          Related topic: Stream state checks; verify the stream opened before assuming reads will work.
      - id: s004
        title: Read lines
        instruction: "Reading line by line is a common text-file pattern."
        type: multipleChoice
        prompt: "Which loop reads each line from `file` into a `std::string line`?"
        choices:
          - id: a
            text: "`while (std::getline(file, line))`"
          - id: b
            text: "`while (std::readline(line, file))`"
          - id: c
            text: "`while (file.join(line))`"
          - id: d
            text: "`while (line.socket(file))`"
        answer:
          choiceId: a
        hint: "`std::getline` takes the stream first and the string second."
        explanation: |
          `std::getline(file, line)` reads one line at a time and returns a stream state that works naturally in a `while` condition.

          Related topic: Line-based file reading; use `std::getline` when whole lines matter.
      - id: s005
        title: Assemble the pattern
        instruction: "Now write the safe read structure."
        type: freeResponse
        prompt: "Write or describe the standard C++ pattern for opening `notes.txt`, checking it opened, and reading each line."
        answer:
          expected: |
            Include `<fstream>` and `<string>`, create `std::ifstream file("notes.txt");`, check `if (!file)`, then use `while (std::getline(file, line))` to read lines.
          gradingMode: selfCheck
          keyPoints:
            - "Use `std::ifstream`."
            - "Check whether the stream opened successfully."
            - "Use `std::getline(file, line)` for line reading."
            - "Use a `std::string line` variable."
        hint: "The shape is open, check, then `while (std::getline(...))`."
        explanation: |
          The core pattern is:

          ```cpp
          #include <fstream>
          #include <string>

          std::ifstream file("notes.txt");
          if (!file) {
              // handle error
          }

          std::string line;
          while (std::getline(file, line)) {
              // use line
          }
          ```

          Related topic: C++ file stream reading; use `std::ifstream`, check stream state, and read with `std::getline`.


