- id: we001
  title: Example 1
  problem: |-
    Find $T_3(x)$ for $\ln x$ at $a=1$.
  steps:
  - id: step-we001-1
    title: Solution
    instruction: |-
      $f=0, f'=1, f''=-1, f'''=2$. $T_3 = (x-1) - \frac{(x-1)^2}{2} + \frac{(x-1)^3}{3}$.
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
- id: we002
  title: Example 2
  problem: |-
    Find the Maclaurin series for $\sin(x^2)$.
  steps:
  - id: step-we002-1
    title: Solution
    instruction: |-
      $\sin(x^2) = \sum \frac{(-1)^n (x^2)^{2n+1}}{(2n+1)!} = \sum \frac{(-1)^n x^{4n+2}}{(2n+1)!}$.
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
