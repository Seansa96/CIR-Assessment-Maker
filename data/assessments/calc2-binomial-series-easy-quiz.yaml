  explanation: >
    Solution: The coefficient is $(1/2)(-1/2)/2!=-1/8$.


    Why it works: Generalized binomial coefficients use descending factors divided by $n!$.


    Why the other choices fail: They miss the negative second factor, the factorial, or both.
