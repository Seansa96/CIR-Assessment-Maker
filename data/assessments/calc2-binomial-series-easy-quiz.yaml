  explanation: >
    Solution: Substitute $u=-3x$ into the binomial series condition $|u|<1$, giving $|x|<1/3$.


    Why it works: Scaling the input rescales the radius of convergence.


    Why the other choices fail: They include untested endpoints, invert the scale, or ignore the radius.
