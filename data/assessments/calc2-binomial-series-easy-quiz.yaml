  explanation: >
    Solution: The descending factors give coefficients $1,-1,1,-1,\ldots$.


    Why it works: This is also the geometric series $1/(1-(-x))$.


    Why the other choices fail: They use an incorrect sign pattern or expand the expression as powers of $x^{-1}$.
