schemaVersion: 1
id: ap-overview-foundations
title: Overview of Anatomy and Physiology
assessmentType: quiz
categoryId: anatomy-and-physiology
subcategoryIds:
  - ap-introduction
modeDefault: practice
randomizeQuestions: true
questionTimerSeconds:
assessmentTimerSeconds:
questions:
  - id: q001
    type: multipleChoice
    prompt: "What is anatomy?"
    choices:
      - id: a
        text: "The study of body structures"
      - id: b
        text: "The study of chemical reactions only"
      - id: c
        text: "The study of disease treatment"
      - id: d
        text: "The study of inheritance only"
    answer:
      choiceId: a
    explanation: |
      Anatomy focuses on identifiable body structures, such as bones, organs, vessels, tissues, and their spatial relationships. A structure question usually asks what something is, where it is located, or how parts are arranged.

      Related topic: Anatomy Versus Physiology
  - id: q002
    type: multipleChoice
    prompt: "What is physiology?"
    choices:
      - id: a
        text: "The study of body functions"
      - id: b
        text: "The naming of bones only"
      - id: c
        text: "The study of body shape only"
      - id: d
        text: "The study of fossils"
    answer:
      choiceId: a
    explanation: |
      Physiology explains how body structures perform functions, such as how muscle cells contract, how nerves transmit signals, or how kidneys regulate fluid composition. A function question usually asks what a structure does or how a process happens.

      Related topic: Body Function
  - id: q003
    type: multipleChoice
    prompt: "Which statement best describes the relationship between structure and function?"
    choices:
      - id: a
        text: "Structure often supports function"
      - id: b
        text: "Structure and function are unrelated"
      - id: c
        text: "Function never depends on shape"
      - id: d
        text: "Only organs have functions"
    answer:
      choiceId: a
    explanation: |
      Structure often supports function because shape, size, location, and tissue composition affect what a body part can do. For example, the thin walls of alveoli support gas exchange, while the thick muscular wall of the left ventricle supports high-pressure pumping.

      Related topic: Structure and Function
  - id: q004
    type: multipleChoice
    prompt: "What is homeostasis?"
    choices:
      - id: a
        text: "Maintaining relatively stable internal conditions"
      - id: b
        text: "Stopping all body change"
      - id: c
        text: "Breaking down tissues"
      - id: d
        text: "Producing only movement"
    answer:
      choiceId: a
    explanation: |
      Homeostasis means maintaining internal variables near set ranges, such as body temperature, blood glucose, blood pH, and water balance. These values can fluctuate, but control systems keep them compatible with cell survival.

      Related topic: Homeostasis
  - id: q005
    type: multipleChoice
    prompt: "Which process usually restores homeostasis?"
    choices:
      - id: a
        text: "Negative feedback"
      - id: b
        text: "Positive feedback"
      - id: c
        text: "Mutation"
      - id: d
        text: "Osmosis only"
    answer:
      choiceId: a
    explanation: |
      Negative feedback opposes the original change. If body temperature rises, sweating and skin vasodilation help lower it; if blood glucose rises, insulin helps move glucose into cells.

      Related topic: Negative Feedback
  - id: q006
    type: multipleChoice
    prompt: "Which is an example of positive feedback?"
    choices:
      - id: a
        text: "Labor contractions intensifying during childbirth"
      - id: b
        text: "Sweating to cool the body"
      - id: c
        text: "Shivering when cold"
      - id: d
        text: "Insulin lowering blood glucose"
    answer:
      choiceId: a
    explanation: |
      Positive feedback increases the original stimulus until a specific endpoint stops the loop. During childbirth, cervical stretching promotes oxytocin release, which strengthens uterine contractions and causes more stretching until delivery occurs.

      Related topic: Positive Feedback
  - id: q007
    type: multipleChoice
    prompt: "In a feedback loop, what detects a change?"
    choices:
      - id: a
        text: "Receptor"
      - id: b
        text: "Effector"
      - id: c
        text: "Response"
      - id: d
        text: "Organism"
    answer:
      choiceId: a
    explanation: |
      A receptor detects a stimulus or variable change, such as temperature receptors sensing heat or pancreatic cells sensing blood glucose. The receptor sends input to a control center so the body can compare the value with a set point.

      Related topic: Feedback Loop Components
  - id: q008
    type: multipleChoice
    prompt: "In a feedback loop, what carries out the response?"
    choices:
      - id: a
        text: "Effector"
      - id: b
        text: "Receptor"
      - id: c
        text: "Stimulus"
      - id: d
        text: "Set point"
    answer:
      choiceId: a
    explanation: |
      An effector carries out the response directed by the control center. Examples include sweat glands secreting sweat, skeletal muscles shivering, blood vessels changing diameter, or endocrine cells releasing hormones.

      Related topic: Feedback Loop Effectors
  - id: q009
    type: multipleChoice
    prompt: "Which survival need involves obtaining energy and raw materials?"
    choices:
      - id: a
        text: "Nutrients"
      - id: b
        text: "Pressure"
      - id: c
        text: "Excretion"
      - id: d
        text: "Responsiveness"
    answer:
      choiceId: a
    explanation: |
      Nutrients include carbohydrates, lipids, proteins, vitamins, minerals, and water. They provide chemical energy, raw materials for repair and growth, and cofactors needed for enzyme-driven reactions.

      Related topic: Survival Needs
  - id: q010
    type: multipleChoice
    prompt: "Which life process means detecting and responding to change?"
    choices:
      - id: a
        text: "Responsiveness"
      - id: b
        text: "Digestion"
      - id: c
        text: "Metabolism"
      - id: d
        text: "Growth"
    answer:
      choiceId: a
    explanation: |
      Responsiveness is the ability to detect changes and respond to them. Examples include withdrawing from pain, increasing heart rate during exercise, and adjusting hormone release when blood chemistry changes.

      Related topic: Basic Life Processes
  - id: q011
    type: multipleChoice
    prompt: "What does metabolism include?"
    choices:
      - id: a
        text: "All chemical reactions in the body"
      - id: b
        text: "Only muscle contraction"
      - id: c
        text: "Only bone growth"
      - id: d
        text: "Only breathing"
    answer:
      choiceId: a
    explanation: |
      Metabolism includes catabolic reactions that break molecules down for energy and anabolic reactions that build larger molecules for growth, repair, and storage. Cellular respiration and protein synthesis are both metabolic processes.

      Related topic: Metabolism
  - id: q012
    type: multipleChoice
    prompt: "What is the simplest level of structural organization listed in most A&P courses?"
    choices:
      - id: a
        text: "Chemical level"
      - id: b
        text: "Organismal level"
      - id: c
        text: "Organ system level"
      - id: d
        text: "Tissue level"
    answer:
      choiceId: a
    explanation: |
      The chemical level includes atoms, ions, and molecules such as water, glucose, proteins, and DNA. These chemical components make up cells and determine many cell-level functions.

      Related topic: Levels of Organization
  - id: q013
    type: multipleChoice
    prompt: "What is a group of organs working together called?"
    choices:
      - id: a
        text: "Organ system"
      - id: b
        text: "Tissue"
      - id: c
        text: "Cell"
      - id: d
        text: "Molecule"
    answer:
      choiceId: a
    explanation: |
      An organ system is a group of organs that cooperate in a major body function. For example, the cardiovascular system uses the heart, blood, and blood vessels to transport gases, nutrients, hormones, and wastes.

      Related topic: Organ Systems
  - id: q014
    type: multipleChoice
    prompt: "Why is flow important in A&P?"
    choices:
      - id: a
        text: "Materials must move through the body to support function"
      - id: b
        text: "Only blood can move"
      - id: c
        text: "Flow prevents all feedback"
      - id: d
        text: "Flow is unrelated to physiology"
    answer:
      choiceId: a
    explanation: |
      Flow matters because many physiological processes depend on directed movement through tubes, chambers, or membranes. Blood flow delivers oxygen, airflow supports gas exchange, urine flow removes wastes, lymph flow returns fluid, and digestive flow moves nutrients toward absorption.

      Related topic: Flow and Body Function
  - id: q015
    type: multipleChoice
    prompt: "Which phrase best describes A&P as a course?"
    choices:
      - id: a
        text: "How body structures support body functions"
      - id: b
        text: "Only memorizing names"
      - id: c
        text: "Only chemistry without organs"
      - id: d
        text: "Only disease diagnosis"
    answer:
      choiceId: a
    explanation: |
      A&P connects what body parts are with what they do. A complete explanation often identifies the structure, names its level of organization, and explains how that structure contributes to a function such as movement, transport, protection, regulation, or exchange.

      Related topic: Core Themes of Anatomy and Physiology
