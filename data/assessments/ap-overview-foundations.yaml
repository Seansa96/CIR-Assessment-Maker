schemaVersion: 1
id: ap-overview-foundations
title: Overview of Anatomy and Physiology
assessmentType: quiz
categoryId: anatomy-and-physiology
subcategoryIds:
  - ap-introduction
modeDefault: practice
randomizeQuestions: true
questionTimerSeconds:
assessmentTimerSeconds:
questions:
  - id: q001
    type: multipleChoice
    prompt: "What is anatomy?"
    choices:
      - id: a
        text: "The study of body structures"
      - id: b
        text: "The study of chemical reactions only"
      - id: c
        text: "The study of disease treatment"
      - id: d
        text: "The study of inheritance only"
    answer:
      choiceId: a
    explanation: |
      Anatomy focuses on the structures of the body and their relationships.

      Related topic: Anatomy Versus Physiology
  - id: q002
    type: multipleChoice
    prompt: "What is physiology?"
    choices:
      - id: a
        text: "The study of body functions"
      - id: b
        text: "The naming of bones only"
      - id: c
        text: "The study of body shape only"
      - id: d
        text: "The study of fossils"
    answer:
      choiceId: a
    explanation: |
      Physiology explains how body parts work, from cells to organ systems.

      Related topic: Body Function
  - id: q003
    type: multipleChoice
    prompt: "Which statement best describes the relationship between structure and function?"
    choices:
      - id: a
        text: "Structure often supports function"
      - id: b
        text: "Structure and function are unrelated"
      - id: c
        text: "Function never depends on shape"
      - id: d
        text: "Only organs have functions"
    answer:
      choiceId: a
    explanation: |
      Body parts are shaped and organized in ways that help them perform their jobs.

      Related topic: Structure and Function
  - id: q004
    type: multipleChoice
    prompt: "What is homeostasis?"
    choices:
      - id: a
        text: "Maintaining relatively stable internal conditions"
      - id: b
        text: "Stopping all body change"
      - id: c
        text: "Breaking down tissues"
      - id: d
        text: "Producing only movement"
    answer:
      choiceId: a
    explanation: |
      Homeostasis means the body regulates internal variables within useful ranges despite changing conditions.

      Related topic: Homeostasis
  - id: q005
    type: multipleChoice
    prompt: "Which process usually restores homeostasis?"
    choices:
      - id: a
        text: "Negative feedback"
      - id: b
        text: "Positive feedback"
      - id: c
        text: "Mutation"
      - id: d
        text: "Osmosis only"
    answer:
      choiceId: a
    explanation: |
      Negative feedback reverses a change and moves a variable back toward its set point.

      Related topic: Negative Feedback
  - id: q006
    type: multipleChoice
    prompt: "Which is an example of positive feedback?"
    choices:
      - id: a
        text: "Labor contractions intensifying during childbirth"
      - id: b
        text: "Sweating to cool the body"
      - id: c
        text: "Shivering when cold"
      - id: d
        text: "Insulin lowering blood glucose"
    answer:
      choiceId: a
    explanation: |
      Positive feedback amplifies a change until a specific endpoint occurs.

      Related topic: Positive Feedback
  - id: q007
    type: multipleChoice
    prompt: "In a feedback loop, what detects a change?"
    choices:
      - id: a
        text: "Receptor"
      - id: b
        text: "Effector"
      - id: c
        text: "Response"
      - id: d
        text: "Organism"
    answer:
      choiceId: a
    explanation: |
      Receptors monitor conditions and send information to a control center.

      Related topic: Feedback Loop Components
  - id: q008
    type: multipleChoice
    prompt: "In a feedback loop, what carries out the response?"
    choices:
      - id: a
        text: "Effector"
      - id: b
        text: "Receptor"
      - id: c
        text: "Stimulus"
      - id: d
        text: "Set point"
    answer:
      choiceId: a
    explanation: |
      Effectors are muscles, glands, or other structures that produce a response.

      Related topic: Feedback Loop Effectors
  - id: q009
    type: multipleChoice
    prompt: "Which survival need involves obtaining energy and raw materials?"
    choices:
      - id: a
        text: "Nutrients"
      - id: b
        text: "Pressure"
      - id: c
        text: "Excretion"
      - id: d
        text: "Responsiveness"
    answer:
      choiceId: a
    explanation: |
      Nutrients supply energy and building blocks for body processes.

      Related topic: Survival Needs
  - id: q010
    type: multipleChoice
    prompt: "Which life process means detecting and responding to change?"
    choices:
      - id: a
        text: "Responsiveness"
      - id: b
        text: "Digestion"
      - id: c
        text: "Metabolism"
      - id: d
        text: "Growth"
    answer:
      choiceId: a
    explanation: |
      Responsiveness allows organisms to react to internal or external stimuli.

      Related topic: Basic Life Processes
  - id: q011
    type: multipleChoice
    prompt: "What does metabolism include?"
    choices:
      - id: a
        text: "All chemical reactions in the body"
      - id: b
        text: "Only muscle contraction"
      - id: c
        text: "Only bone growth"
      - id: d
        text: "Only breathing"
    answer:
      choiceId: a
    explanation: |
      Metabolism includes all chemical reactions that build up and break down substances.

      Related topic: Metabolism
  - id: q012
    type: multipleChoice
    prompt: "What is the simplest level of structural organization listed in most A&P courses?"
    choices:
      - id: a
        text: "Chemical level"
      - id: b
        text: "Organismal level"
      - id: c
        text: "Organ system level"
      - id: d
        text: "Tissue level"
    answer:
      choiceId: a
    explanation: |
      Atoms and molecules form the chemical foundation of body structure.

      Related topic: Levels of Organization
  - id: q013
    type: multipleChoice
    prompt: "What is a group of organs working together called?"
    choices:
      - id: a
        text: "Organ system"
      - id: b
        text: "Tissue"
      - id: c
        text: "Cell"
      - id: d
        text: "Molecule"
    answer:
      choiceId: a
    explanation: |
      Organ systems coordinate multiple organs to carry out broad body functions.

      Related topic: Organ Systems
  - id: q014
    type: multipleChoice
    prompt: "Why is flow important in A&P?"
    choices:
      - id: a
        text: "Materials must move through the body to support function"
      - id: b
        text: "Only blood can move"
      - id: c
        text: "Flow prevents all feedback"
      - id: d
        text: "Flow is unrelated to physiology"
    answer:
      choiceId: a
    explanation: |
      Blood, air, urine, lymph, and digestive contents all move in ways that support body function.

      Related topic: Flow and Body Function
  - id: q015
    type: multipleChoice
    prompt: "Which phrase best describes A&P as a course?"
    choices:
      - id: a
        text: "How body structures support body functions"
      - id: b
        text: "Only memorizing names"
      - id: c
        text: "Only chemistry without organs"
      - id: d
        text: "Only disease diagnosis"
    answer:
      choiceId: a
    explanation: |
      Introductory A&P links anatomical structures with physiological functions across levels of organization.

      Related topic: Core Themes of Anatomy and Physiology
