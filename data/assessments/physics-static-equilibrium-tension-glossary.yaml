    entries:
      - { id: static-equilibrium, term: Static equilibrium, definition: 'State in which net force and net torque are both zero.', drills: [{ id: seg1, type: cloze, prompt: 'Static equilibrium requires net force and net torque equal ____.', answer: { expected: zero, expectedLatex: '0', aliases: [], media: [] }, explanation: 'Solution: Zero.\n\nWhy it works: Then there is no translational or angular acceleration.' }] }
      - { id: torque, term: Torque, definition: 'Rotational effect of a force about an axis.', drills: [{ id: seg2, type: typed, prompt: 'What quantity measures a force''s rotational effect?', answer: { expected: torque, expectedLatex: '\tau', aliases: [], media: [] }, explanation: 'Solution: Torque.\n\nWhy it works: Torque depends on force and lever arm.' }] }
      - { id: lever-arm, term: Lever arm, definition: 'Perpendicular distance from an axis to a force line of action.', drills: [{ id: seg3, type: cloze, prompt: 'Torque uses the perpendicular ____ arm.', answer: { expected: lever, expectedLatex: '', aliases: [moment], media: [] }, explanation: 'Solution: Lever.\n\nWhy it works: Perpendicular distance sets torque magnitude.' }] }
      - { id: tension, term: Tension, definition: 'Pulling force exerted by a cable or string.', drills: [{ id: seg4, type: typed, prompt: 'Can a cable push?', answer: { expected: no, expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: No.\n\nWhy it works: A cable only transmits pulling tension.' }] }
