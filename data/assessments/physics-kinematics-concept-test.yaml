questions:
  - id: k-q01
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Students often confuse velocity and position graphs."
    prerequisiteObjectiveIds: [physics-motion-1d]
    extensionObjectiveIds: [physics-motion-2d]
    prompt: |
      A particle moves in one dimension. The position versus time graph is a parabola that opens downward. What can be concluded about the particle's acceleration?
    choices:
      - id: a
        text: 'The acceleration is constant and positive.'
      - id: b
        text: 'The acceleration is constant and negative.'
      - id: c
        text: 'The acceleration is increasing.'
      - id: d
        text: 'The acceleration is zero.'
    answer:
      choiceId: b
    explanation: |
        Solution: The position function is $x(t) = c_1 t^2 + c_2 t + c_3$. A downward opening parabola means the coefficient of $t^2$ is negative.
        
        Why it works: Since $a = d^2x/dt^2$, taking the second derivative yields a negative constant.
        
        Why the other choices fail: A positive acceleration would mean an upward opening parabola. An increasing acceleration would require a cubic or higher-order position function. Zero acceleration corresponds to a straight line.
  
  - id: k-q02
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding average vs instantaneous velocity from graphs."
    prerequisiteObjectiveIds: [physics-motion-1d]
    extensionObjectiveIds: [physics-motion-2d]
    prompt: |
      On a position-time graph, what geometric feature represents the instantaneous velocity at a specific time?
    choices:
      - id: a
        text: 'The slope of the secant line between two points.'
      - id: b
        text: 'The area under the curve up to that time.'
      - id: c
        text: 'The slope of the tangent line to the curve at that time.'
      - id: d
        text: 'The y-intercept of the tangent line.'
    answer:
      choiceId: c
    explanation: |
        Solution: Instantaneous velocity is the derivative of position with respect to time, $v = dx/dt$.
        
        Why it works: The derivative at a point corresponds to the slope of the tangent line at that point on the position-time graph.
        
        Why the other choices fail: The secant line slope gives average velocity. The area under the curve does not have a standard physical meaning for a position-time graph. The y-intercept represents an initial position extrapolation.
        
  - id: k-q03
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Distinguishing speed and velocity when acceleration opposes motion."
    prerequisiteObjectiveIds: [physics-motion-1d]
    extensionObjectiveIds: [physics-motion-2d]
    prompt: |
      An object is moving to the right and slowing down. Which of the following is true about its acceleration vector?
    choices:
      - id: a
        text: 'It points to the right.'
      - id: b
        text: 'It points to the left.'
      - id: c
        text: 'It is zero.'
      - id: d
        text: 'It points upward.'
    answer:
      choiceId: b
    explanation: |
        Solution: When an object is slowing down, its acceleration vector must point in the opposite direction of its velocity vector.
        
        Why it works: The velocity is to the right. To decrease the magnitude of velocity (speed), acceleration must oppose it, pointing left.
        
        Why the other choices fail: If it pointed right, the object would speed up. Zero acceleration means constant speed. Upward acceleration changes the direction of motion but doesn't immediately slow it down linearly.
        
  - id: k-q04
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Interpreting area under velocity-time graphs."
    prerequisiteObjectiveIds: [physics-motion-1d]
    extensionObjectiveIds: [physics-motion-2d]
    prompt: |
      What does the total area under a velocity-time graph represent?
    choices:
      - id: a
        text: 'The average acceleration of the object.'
      - id: b
        text: 'The displacement of the object.'
      - id: c
        text: 'The instantaneous acceleration of the object.'
      - id: d
        text: 'The final position of the object.'
    answer:
      choiceId: b
    explanation: |
        Solution: The area under a curve is the integral of the function. For velocity, this is $\int v(t) dt$.
        
        Why it works: The integral of velocity with respect to time yields the change in position, which is displacement ($\Delta x$).
        
        Why the other choices fail: Average acceleration is the change in velocity over time (slope of secant). Instantaneous acceleration is the slope of the tangent. Final position requires knowing the initial position ($x_0 + \Delta x$).

  - id: k-q05
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding independence of x and y motion in projectiles."
    prerequisiteObjectiveIds: [physics-motion-2d]
    extensionObjectiveIds: [physics-motion-2d]
    prompt: |
      A ball is dropped from rest at the same instant and from the same height that a second identical ball is thrown horizontally. If air resistance is negligible, which ball hits the ground first?
    choices:
      - id: a
        text: 'The dropped ball hits first.'
      - id: b
        text: 'The thrown ball hits first.'
      - id: c
        text: 'Both balls hit the ground at the same time.'
      - id: d
        text: 'It depends on the initial horizontal speed of the thrown ball.'
    answer:
      choiceId: c
    explanation: |
        Solution: Both balls have zero initial vertical velocity and experience the same downward acceleration ($g$).
        
        Why it works: Vertical and horizontal motions are independent. The time to fall depends only on vertical parameters ($h = \frac{1}{2}gt^2$), which are identical for both.
        
        Why the other choices fail: The horizontal velocity of the thrown ball affects only its horizontal range, not its time of flight.
        
  - id: k-q06
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Analyzing acceleration at the peak of projectile motion."
    prerequisiteObjectiveIds: [physics-motion-2d]
    extensionObjectiveIds: [physics-motion-2d]
    prompt: |
      A projectile is launched upward at an angle. At the highest point in its trajectory, what are its velocity and acceleration vectors?
    choices:
      - id: a
        text: 'Velocity is zero, acceleration is zero.'
      - id: b
        text: 'Velocity is horizontal, acceleration is zero.'
      - id: c
        text: 'Velocity is zero, acceleration is directed downward.'
      - id: d
        text: 'Velocity is horizontal, acceleration is directed downward.'
    answer:
      choiceId: d
    explanation: |
        Solution: At the peak, vertical velocity is zero, but horizontal velocity remains constant (non-zero). Gravity constantly accelerates the object downward.
        
        Why it works: The object is still moving horizontally ($v_x \neq 0$) and gravity is always acting ($a_y = -g$).
        
        Why the other choices fail: Velocity is not zero because horizontal motion continues. Acceleration is never zero for a projectile in free fall.
        
  - id: k-q07
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding optimal launch angles."
    prerequisiteObjectiveIds: [physics-motion-2d]
    extensionObjectiveIds: [physics-motion-2d]
    prompt: |
      Ignoring air resistance, which launch angle relative to the horizontal yields the maximum range for a projectile launched from and landing on level ground?
    choices:
      - id: a
        text: '$30^\circ$'
      - id: b
        text: '$45^\circ$'
      - id: c
        text: '$60^\circ$'
      - id: d
        text: '$90^\circ$'
    answer:
      choiceId: b
    explanation: |
        Solution: The range equation is $R = \frac{v_0^2 \sin(2\theta)}{g}$.
        
        Why it works: The function $\sin(2\theta)$ is maximized when $2\theta = 90^\circ$, which occurs at $\theta = 45^\circ$.
        
        Why the other choices fail: $30^\circ$ and $60^\circ$ give the same, smaller range. $90^\circ$ gives zero range (straight up and down).

  - id: k-q08
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Vector addition principles."
    prerequisiteObjectiveIds: [physics-vectors]
    extensionObjectiveIds: [physics-vectors]
    prompt: |
      Vector $\vec{A}$ has magnitude 5 and vector $\vec{B}$ has magnitude 12. What is the maximum possible magnitude of their sum, $\vec{A} + \vec{B}$?
    choices:
      - id: a
        text: '7'
      - id: b
        text: '13'
      - id: c
        text: '17'
      - id: d
        text: '60'
    answer:
      choiceId: c
    explanation: |
        Solution: The magnitude of the sum of two vectors is maximized when they point in the same direction.
        
        Why it works: When the angle between them is zero, their magnitudes add linearly: $5 + 12 = 17$.
        
        Why the other choices fail: 7 is the minimum magnitude (if they are opposite). 13 is the magnitude if they are perpendicular (Pythagorean theorem). 60 is their product, not sum.

  - id: k-q09
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Relative motion concepts."
    prerequisiteObjectiveIds: [physics-motion-2d]
    extensionObjectiveIds: [physics-motion-2d]
    prompt: |
      A boat heads directly across a river (perpendicular to the current) at a constant speed relative to the water. If the river current's speed increases, how does this affect the time it takes the boat to cross the river?
    choices:
      - id: a
        text: 'The time to cross increases.'
      - id: b
        text: 'The time to cross decreases.'
      - id: c
        text: 'The time to cross remains the same.'
      - id: d
        text: 'It depends on the boat''s speed.'
    answer:
      choiceId: c
    explanation: |
        Solution: The time to cross is determined solely by the component of velocity directed across the river and the river's width.
        
        Why it works: Since the boat's velocity relative to the water is perpendicular to the current, the current only affects the downstream distance, not the cross-stream velocity component.
        
        Why the other choices fail: The current increases the total speed relative to the shore, but does not alter the perpendicular component. Thus, time $t = d/v_{cross}$ is unchanged.

  - id: k-q10
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding uniform circular motion kinematics."
    prerequisiteObjectiveIds: [physics-motion-2d]
    extensionObjectiveIds: [physics-motion-2d]
    prompt: |
      An object undergoes uniform circular motion. Which of the following is true?
    choices:
      - id: a
        text: 'Its velocity is constant, but acceleration is changing.'
      - id: b
        text: 'Its speed is constant, and its acceleration vector points toward the center.'
      - id: c
        text: 'Both its velocity and acceleration are constant.'
      - id: d
        text: 'Its acceleration is zero because speed is constant.'
    answer:
      choiceId: b
    explanation: |
        Solution: Uniform circular motion means constant speed, but direction changes continuously.
        
        Why it works: Because direction changes, velocity is not constant, meaning there is an acceleration. This acceleration (centripetal) always points toward the center of the circle.
        
        Why the other choices fail: Velocity is a vector; since direction changes, velocity is not constant. Acceleration also changes direction (it always points to the center, which rotates), so it is not a constant vector. Zero acceleration would mean straight-line motion.

  - id: k-q11
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Acceleration interpretation in varying speed circular motion."
    prerequisiteObjectiveIds: [physics-motion-2d]
    extensionObjectiveIds: [physics-motion-2d]
    prompt: |
      A car speeds up as it travels along a circular track. What can be said about its net acceleration vector?
    choices:
      - id: a
        text: 'It points directly to the center of the circle.'
      - id: b
        text: 'It points purely along the tangent of the circle.'
      - id: c
        text: 'It has both a centripetal and a tangential component.'
      - id: d
        text: 'It points outward from the center of the circle.'
    answer:
      choiceId: c
    explanation: |
        Solution: The net acceleration has two components when speed is changing on a curve.
        
        Why it works: The change in direction gives a centripetal (inward) component, and the change in speed gives a tangential (forward) component. The net vector is the sum of these two.
        
        Why the other choices fail: If it pointed directly to the center, speed would be constant. If it pointed tangentially, it would be moving in a straight line. Acceleration never points outward in the stationary reference frame.

  - id: k-q12
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Analyzing acceleration from velocity changes."
    prerequisiteObjectiveIds: [physics-motion-1d]
    extensionObjectiveIds: [physics-motion-1d]
    prompt: |
      If an object's velocity is zero at a given instant, can its acceleration be non-zero at that same instant?
    choices:
      - id: a
        text: 'Yes, for example when a ball is thrown straight up and reaches its peak.'
      - id: b
        text: 'Yes, but only if the object is in uniform circular motion.'
      - id: c
        text: 'No, if velocity is zero, acceleration must be zero.'
      - id: d
        text: 'No, acceleration requires motion to exist.'
    answer:
      choiceId: a
    explanation: |
        Solution: Acceleration is the *rate of change* of velocity, not the velocity itself.
        
        Why it works: At the peak of a vertical throw, the velocity transitions from positive (up) to negative (down), passing through zero. However, gravity ($a = -g$) acts continuously, causing this change.
        
        Why the other choices fail: Velocity is never zero in uniform circular motion. The misconception that $v=0 \implies a=0$ ignores the instantaneous rate of change.

  - id: k-q13
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding free fall dependence on mass."
    prerequisiteObjectiveIds: [physics-motion-1d]
    extensionObjectiveIds: [physics-motion-1d]
    prompt: |
      Two objects of different masses are dropped simultaneously from the same height in a vacuum. Which object will have the greater acceleration?
    choices:
      - id: a
        text: 'The heavier object.'
      - id: b
        text: 'The lighter object.'
      - id: c
        text: 'Both will have the same acceleration.'
      - id: d
        text: 'It depends on their shapes.'
    answer:
      choiceId: c
    explanation: |
        Solution: In a vacuum, the only force is gravity. 
        
        Why it works: According to Newton's Second Law and Universal Gravitation, $a = F_g/m = (G M m / r^2) / m = G M / r^2 = g$. Mass cancels out, leaving the same acceleration for both.
        
        Why the other choices fail: Without air resistance, mass and shape do not affect the rate of acceleration.

  - id: k-q14
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Displacement vs Distance."
    prerequisiteObjectiveIds: [physics-motion-1d]
    extensionObjectiveIds: [physics-motion-1d]
    prompt: |
      A runner completes exactly one lap around a 400-meter circular track. Which of the following statements is true?
    choices:
      - id: a
        text: 'The distance traveled is zero and displacement is 400 m.'
      - id: b
        text: 'The distance traveled is 400 m and displacement is zero.'
      - id: c
        text: 'Both distance traveled and displacement are 400 m.'
      - id: d
        text: 'Both distance traveled and displacement are zero.'
    answer:
      choiceId: b
    explanation: |
        Solution: Distance is the total path length, while displacement is the vector from start to finish.
        
        Why it works: The runner covered a path of 400 m, so distance is 400 m. Since they ended at the exact starting point, the net change in position (displacement) is zero.
        
        Why the other choices fail: Displacement cannot be 400 m if they return to the start. Distance cannot be zero if they moved.

  - id: k-q15
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Interpreting graphs of constant acceleration."
    prerequisiteObjectiveIds: [physics-motion-1d]
    extensionObjectiveIds: [physics-motion-1d]
    prompt: |
      For an object moving with constant, non-zero acceleration, how does its velocity-time graph appear?
    choices:
      - id: a
        text: 'A horizontal line.'
      - id: b
        text: 'A straight line with a non-zero slope.'
      - id: c
        text: 'A parabola.'
      - id: d
        text: 'An exponential curve.'
    answer:
      choiceId: b
    explanation: |
        Solution: Acceleration is the slope of the velocity-time graph.
        
        Why it works: Since the acceleration is constant and non-zero, the slope must be constant and non-zero. A straight sloped line perfectly represents this.
        
        Why the other choices fail: A horizontal line means zero acceleration (constant velocity). A parabola would mean changing acceleration.

  - id: k-q16
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Symmetry in projectile motion."
    prerequisiteObjectiveIds: [physics-motion-2d]
    extensionObjectiveIds: [physics-motion-2d]
    prompt: |
      A ball is thrown upward from the ground and returns to the ground. If air resistance is ignored, how does the speed of the ball just before it hits the ground compare to its initial launch speed?
    choices:
      - id: a
        text: 'It is greater than the launch speed.'
      - id: b
        text: 'It is less than the launch speed.'
      - id: c
        text: 'It is exactly equal to the launch speed.'
      - id: d
        text: 'It cannot be determined without knowing the height.'
    answer:
      choiceId: c
    explanation: |
        Solution: Projectile motion over level ground is symmetric when air resistance is absent.
        
        Why it works: Conservation of energy (or kinematic symmetry) dictates that the kinetic energy lost on the way up is fully regained on the way down, resulting in identical speeds at the same height.
        
        Why the other choices fail: Air resistance would cause it to be slower, but it is ignored here. The speeds are identical, though the velocities have opposite vertical directions.

  - id: k-q17
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Vector subtraction conceptualization."
    prerequisiteObjectiveIds: [physics-vectors]
    extensionObjectiveIds: [physics-vectors]
    prompt: |
      Two vectors, $\vec{P}$ and $\vec{Q}$, have equal magnitudes. The magnitude of their difference, $|\vec{P} - \vec{Q}|$, is equal to the magnitude of either vector. What is the angle between them?
    choices:
      - id: a
        text: '$0^\circ$'
      - id: b
        text: '$60^\circ$'
      - id: c
        text: '$90^\circ$'
      - id: d
        text: '$120^\circ$'
    answer:
      choiceId: b
    explanation: |
        Solution: Use the law of cosines for vector subtraction: $|\vec{P} - \vec{Q}|^2 = P^2 + Q^2 - 2PQ\cos\theta$.
        
        Why it works: Let the magnitude be $v$. Then $v^2 = v^2 + v^2 - 2v^2\cos\theta \implies 1 = 2 - 2\cos\theta \implies \cos\theta = 1/2$. The angle is $60^\circ$. Geometrically, they form an equilateral triangle.
        
        Why the other choices fail: $0^\circ$ gives a difference of 0. $90^\circ$ gives $v\sqrt{2}$. $120^\circ$ gives $v\sqrt{3}$.

  - id: k-q18
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding coordinate frame relativity."
    prerequisiteObjectiveIds: [physics-motion-2d]
    extensionObjectiveIds: [physics-motion-2d]
    prompt: |
      A person walks inside a train carriage at 2 m/s forward relative to the train. The train moves at 20 m/s forward relative to the ground. What is the person's velocity relative to the ground?
    choices:
      - id: a
        text: '18 m/s forward'
      - id: b
        text: '20 m/s forward'
      - id: c
        text: '22 m/s forward'
      - id: d
        text: '2 m/s forward'
    answer:
      choiceId: c
    explanation: |
        Solution: Galilean velocity addition applies in classical mechanics. $v_{person/ground} = v_{person/train} + v_{train/ground}$.
        
        Why it works: Both velocities are in the same direction, so $2 + 20 = 22$ m/s.
        
        Why the other choices fail: 18 m/s would be if the person walked backward. 20 m/s ignores the person's walking speed.

  - id: k-q19
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Acceleration vector in projectile motion."
    prerequisiteObjectiveIds: [physics-motion-2d]
    extensionObjectiveIds: [physics-motion-2d]
    prompt: |
      During the entire flight of a projectile (ignoring air resistance), which of the following remains constant?
    choices:
      - id: a
        text: 'Its speed.'
      - id: b
        text: 'Its velocity.'
      - id: c
        text: 'Its horizontal and vertical acceleration components.'
      - id: d
        text: 'Its position.'
    answer:
      choiceId: c
    explanation: |
        Solution: Projectiles experience a constant downward force from gravity.
        
        Why it works: The vertical acceleration is constant ($-g$) and the horizontal acceleration is constant ($0$).
        
        Why the other choices fail: Speed and velocity both change as the vertical component of velocity changes. Position constantly changes.

  - id: k-q20
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Interpreting inflection points on position graphs."
    prerequisiteObjectiveIds: [physics-motion-1d]
    extensionObjectiveIds: [physics-motion-1d]
    prompt: |
      On a position-time graph, what physical event occurs at an inflection point (where concavity changes)?
    choices:
      - id: a
        text: 'The object stops.'
      - id: b
        text: 'The object reaches maximum speed.'
      - id: c
        text: 'The acceleration is zero.'
      - id: d
        text: 'The object changes direction.'
    answer:
      choiceId: c
    explanation: |
        Solution: Concavity on a position-time graph relates to the second derivative, which is acceleration.
        
        Why it works: An inflection point is where concavity changes sign (e.g., from positive to negative), meaning the second derivative passes through zero. Thus, acceleration is zero at that instant.
        
        Why the other choices fail: The object stopping is a horizontal tangent ($v=0$). Changing direction is a local extremum. Maximum speed could occur here, but the defining feature is $a=0$.
