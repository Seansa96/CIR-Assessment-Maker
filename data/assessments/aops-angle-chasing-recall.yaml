schemaVersion: 1
id: aops-angle-chasing-recall
title: Angle Chasing Terminology Recall Drill
assessmentType: recallDrill
categoryId: art-of-problem-solving
topicId: aops-angle-chasing
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - art-of-problem-solving
  - aops-angle-chasing
  - aops-volume-1
  - geometry
  - terminology
skills:
- Recall precise definitions and theorem triggers.
items:
- id: vertex-flashcard
  type: flashcard
  prompt: Define Vertex and state its recognition cue.
  answer:
    expected: The common endpoint of the rays that form an angle.
  explanation: Vertex location distinguishes central from inscribed angles.
  tags:
  - vertex
  - aops-angle-chasing
- id: vertical-angles-flashcard
  type: flashcard
  prompt: Define Vertical angles and state its recognition cue.
  answer:
    expected: Opposite angles formed by two intersecting lines.
  explanation: Vertical angles are equal.
  tags:
  - vertical-angles
  - aops-angle-chasing
- id: linear-pair-flashcard
  type: flashcard
  prompt: Define Linear pair and state its recognition cue.
  answer:
    expected: Adjacent angles whose noncommon sides form a straight line.
  explanation: A linear pair sums to 180 degrees.
  tags:
  - linear-pair
  - aops-angle-chasing
- id: complementary-angles-flashcard
  type: flashcard
  prompt: Define Complementary angles and state its recognition cue.
  answer:
    expected: Two angles whose measures sum to 90 degrees.
  explanation: Complementary does not require adjacency.
  tags:
  - complementary-angles
  - aops-angle-chasing
- id: supplementary-angles-flashcard
  type: flashcard
  prompt: Define Supplementary angles and state its recognition cue.
  answer:
    expected: Two angles whose measures sum to 180 degrees.
  explanation: Opposite angles of a cyclic quadrilateral are supplementary.
  tags:
  - supplementary-angles
  - aops-angle-chasing
- id: transversal-flashcard
  type: flashcard
  prompt: Define Transversal and state its recognition cue.
  answer:
    expected: A line that intersects two or more other lines at distinct points.
  explanation: A transversal creates corresponding and alternate angle pairs.
  tags:
  - transversal
  - aops-angle-chasing
- id: corresponding-angles-flashcard
  type: flashcard
  prompt: Define Corresponding angles and state its recognition cue.
  answer:
    expected: Angles in matching relative positions at two intersections of a transversal.
  explanation: They are equal when the crossed lines are parallel.
  tags:
  - corresponding-angles
  - aops-angle-chasing
- id: alternate-interior-angles-flashcard
  type: flashcard
  prompt: Define Alternate interior angles and state its recognition cue.
  answer:
    expected: Interior angles on opposite sides of a transversal.
  explanation: They are equal when the crossed lines are parallel.
  tags:
  - alternate-interior-angles
  - aops-angle-chasing
- id: same-side-interior-angles-flashcard
  type: flashcard
  prompt: Define Same-side interior angles and state its recognition cue.
  answer:
    expected: Interior angles on the same side of a transversal.
  explanation: They are supplementary when the crossed lines are parallel.
  tags:
  - same-side-interior-angles
  - aops-angle-chasing
- id: exterior-angle-flashcard
  type: flashcard
  prompt: Define Exterior angle and state its recognition cue.
  answer:
    expected: An angle formed by one side of a polygon and an extension of an adjacent side.
  explanation: A triangle exterior angle equals its remote interior angles' sum.
  tags:
  - exterior-angle
  - aops-angle-chasing
- id: remote-interior-angles-flashcard
  type: flashcard
  prompt: Define Remote interior angles and state its recognition cue.
  answer:
    expected: The two triangle interior angles not adjacent to a chosen exterior angle.
  explanation: Their sum equals that exterior angle.
  tags:
  - remote-interior-angles
  - aops-angle-chasing
- id: inscribed-angle-flashcard
  type: flashcard
  prompt: Define Inscribed angle and state its recognition cue.
  answer:
    expected: An angle with vertex on a circle and sides that are chords.
  explanation: It measures half its intercepted arc.
  tags:
  - inscribed-angle
  - aops-angle-chasing
- id: cyclic-quadrilateral-flashcard
  type: flashcard
  prompt: Define Cyclic quadrilateral and state its recognition cue.
  answer:
    expected: A quadrilateral whose four vertices lie on one circle.
  explanation: Its opposite angles are supplementary.
  tags:
  - cyclic-quadrilateral
  - aops-angle-chasing
- id: tangent-chord-angle-flashcard
  type: flashcard
  prompt: Define Tangent-chord angle and state its recognition cue.
  answer:
    expected: An angle formed by a tangent and a chord at their shared endpoint.
  explanation: It equals an inscribed angle intercepting the same chord.
  tags:
  - tangent-chord-angle
  - aops-angle-chasing
- id: auxiliary-line-flashcard
  type: flashcard
  prompt: Define Auxiliary line and state its recognition cue.
  answer:
    expected: A deliberately added line that creates a theorem-ready relationship.
  explanation: A radius to tangency creates a right angle.
  tags:
  - auxiliary-line
  - aops-angle-chasing
- id: reason-ledger-flashcard
  type: flashcard
  prompt: Define Reason ledger and state its recognition cue.
  answer:
    expected: A record pairing each derived angle relation with the theorem or given that justifies it.
  explanation: Write x=62 because alternate interior angles are equal.
  tags:
  - reason-ledger
  - aops-angle-chasing
