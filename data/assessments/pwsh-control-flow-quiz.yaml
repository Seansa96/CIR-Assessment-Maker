schemaVersion: 1
id: pwsh-control-flow-quiz
title: "Control Flow and Loops Quiz"
assessmentType: quiz
categoryId: scripting
subcategoryIds:
  - pwsh-conditionals
  - pwsh-loops
  - pwsh-pipeline-loops
skills:
- Apply scripting concepts
- Apply Conditionals (If, Switch)
- Apply Loops (While, For)
- Apply Pipeline Looping (ForEach-Object)
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - scripting
  - pwsh-conditionals
  - pwsh-loops
  - pwsh-pipeline-loops
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 8
questions:
  - id: q001
    type: multipleChoice
    skills:
      - pwsh-conditionals
    prompt: |
      Which of the following is the correct PowerShell operator for "Not Equal To"?
    choices:
      - id: a
        text: '`!=`'
      - id: b
        text: '`<>`'
      - id: c
        text: '`-neq`'
      - id: d
        text: '`-ne`'
    answer:
      choiceId: d
    explanation: |
      PowerShell uses `-ne` for "Not Equal".

  - id: q002
    type: multipleChoice
    skills:
      - pwsh-conditionals
    prompt: |
      What does the `-le` comparison operator stand for?
    choices:
      - id: a
        text: Less than or equal to
      - id: b
        text: Logical equality
      - id: c
        text: Larger or equal
      - id: d
        text: Length equals
    answer:
      choiceId: a
    explanation: |
      `-le` stands for Less than or Equal to.

  - id: q003
    type: multipleChoice
    skills:
      - pwsh-loops
    prompt: |
      Which loop executes its code block first, and *then* evaluates the condition at the end?
    choices:
      - id: a
        text: '`while` loop'
      - id: b
        text: '`for` loop'
      - id: c
        text: '`do-while` loop'
      - id: d
        text: '`foreach` statement'
    answer:
      choiceId: c
    explanation: |
      A `do-while` (or `do-until`) loop executes the `do { }` block before ever checking the `while ()` condition at the bottom.

  - id: q004
    type: multipleChoice
    skills:
      - pwsh-pipeline-loops
    prompt: |
      Inside a pipeline scriptblock `{ }` for `Where-Object` or `ForEach-Object`, what does `$_` represent?
    choices:
      - id: a
        text: A null value.
      - id: b
        text: The last error that occurred.
      - id: c
        text: The current object coming down the pipeline.
      - id: d
        text: The total number of objects processed.
    answer:
      choiceId: c
    explanation: |
      `$_` (also known as `$PSItem`) is the automatic variable representing the current pipeline object.

  - id: q005
    type: multipleChoice
    skills:
      - pwsh-pipeline-loops
    prompt: |
      Which statement correctly filters a list of services to only show those that are "Running"?
    choices:
      - id: a
        text: '`Get-Service | Where-Object { $_.Status -eq "Running" }`'
      - id: b
        text: '`Get-Service | ForEach-Object { $_.Status = "Running" }`'
      - id: c
        text: '`Get-Service | Where-Object ( $_.Status == "Running" )`'
      - id: d
        text: '`Get-Service | Filter "Running"`'
    answer:
      choiceId: a
    explanation: |
      `Where-Object` uses a scriptblock `{}` and the PowerShell `-eq` operator to check the `.Status` property of the current object `$_`.

  - id: q006
    type: multipleChoice
    skills:
      - pwsh-conditionals
    prompt: |
      In a `switch` statement, what keyword is used to execute a block if no other conditions match?
    choices:
      - id: a
        text: '`else`'
      - id: b
        text: '`default`'
      - id: c
        text: '`catch`'
      - id: d
        text: '`finally`'
    answer:
      choiceId: b
    explanation: |
      `default` catches any values that did not match the specific cases in the switch statement.

  - id: q007
    type: multipleChoice
    skills:
      - pwsh-pipeline-loops
    prompt: |
      What is a primary advantage of using the pipeline (`| ForEach-Object`) over a programmatic `foreach` statement?
    choices:
      - id: a
        text: It executes significantly faster.
      - id: b
        text: It streams objects one at a time, keeping memory consumption low.
      - id: c
        text: It does not require curly braces.
      - id: d
        text: It is the only way to process arrays.
    answer:
      choiceId: b
    explanation: |
      The pipeline streams objects immediately, whereas `foreach` requires generating and loading the entire collection into memory before the loop can begin.

  - id: q008
    type: multipleChoice
    skills:
      - pwsh-loops
    prompt: |
      In the `for` loop declaration: `for ($i = 0; $i -lt 10; $i++)`, what does `$i++` do?
    choices:
      - id: a
        text: It compares `$i` to 10.
      - id: b
        text: It increments the value of `$i` by 1 at the end of each iteration.
      - id: c
        text: It adds two to the variable `$i`.
      - id: d
        text: It defines the variable `$i`.
    answer:
      choiceId: b
    explanation: |
      `$i++` is the iterator. It is shorthand for `$i = $i + 1`, ensuring the loop eventually terminates when `$i` hits 10.
