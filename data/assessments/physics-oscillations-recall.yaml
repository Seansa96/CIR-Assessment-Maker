items:
- id: r01
  type: typed
  prompt: State a central equation or relationship for Simple Harmonic Motion.
  answer:
    expected: 'T=2\pi\sqrt{m/k}'
  explanation: 'Solution: Use $T=2\pi\sqrt{m/k}$. Why it works: the mass-spring angular frequency is $\sqrt{k/m}$.'
  tags:
  - physics-simple-harmonic-motion
  - equations
- id: r02
  type: typed
  prompt: State a central equation or relationship for Energy in Simple Harmonic Motion.
  answer:
    expected: 'E=\frac{1}{2} kA^2'
  explanation: 'Solution: Use $E=\frac12kA^2$. Why it works: all energy is elastic potential energy at amplitude.'
  tags:
  - physics-shm-energy
  - equations
- id: r03
  type: typed
  prompt: State a central equation or relationship for Comparing SHM and Circular Motion.
  answer:
    expected: 'v_{max}=A\omega'
  explanation: 'Solution: Use $v_{max}=A\omega$. Why it works: it is the tangential speed of the reference-circle particle.'
  tags:
  - physics-shm-circular-motion
  - equations
- id: r04
  type: typed
  prompt: State a central equation or relationship for Pendulums.
  answer:
    expected: 'T=2\pi\sqrt{L/g}'
  explanation: 'Solution: Use $T=2\pi\sqrt{L/g}$. Why it works: the small-angle gravitational restoring force produces SHM.'
  tags:
  - physics-pendulums
  - equations
- id: r05
  type: typed
  prompt: State a central equation or relationship for Damped Oscillations.
  answer:
    expected: 'A=A_0e^{-bt}'
  explanation: 'Solution: Use the exponential amplitude-decay relation. Why it works: damping removes energy over time.'
  tags:
  - physics-damped-oscillations
  - equations
- id: r06
  type: typed
  prompt: State a central equation or relationship for Forced Oscillations.
  answer:
    expected: '\omega_0=\sqrt{k/m}'
  explanation: 'Solution: Use $\omega_0=\sqrt{k/m}$. Why it works: it is the undamped mass-spring natural angular frequency.'
  tags:
  - physics-forced-oscillations
  - equations
