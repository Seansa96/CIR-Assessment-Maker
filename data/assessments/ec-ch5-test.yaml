- id: q001
  type: multipleChoice
  prompt: Test question 1 regarding Op-Amps. If $R_f = 10\text{ k}\Omega$ and $R_s
    = 1\text{ k}\Omega$, what is the gain of a non-inverting amplifier?
  explanation: Gain $= 1 + R_f/R_s = 1 + 10 = 11$.
  choices:
  - id: a
    text: '11'
  - id: b
    text: '10'
  - id: c
    text: '-10'
  - id: d
    text: '-11'
  answer:
    choiceId: a
