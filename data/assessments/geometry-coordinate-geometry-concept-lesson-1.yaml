lesson:
  introduction: |-
    When we place shapes on a grid (the Cartesian plane), we can use algebra to find their exact measurements. The two most fundamental tools in coordinate geometry are the Distance Formula and the Midpoint Formula.
  sections:
  - id: sec-distance
    title: The Distance Formula
    required: true
    content: |-
      How do you find the distance between two points $(x_1, y_1)$ and $(x_2, y_2)$? 
      
      You simply use the Pythagorean Theorem! The difference in the $x$-values is the horizontal leg of a right triangle, and the difference in the $y$-values is the vertical leg.
      
      **Distance Formula**:
      $$d = \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$$
      
      Because you are squaring the differences, it does not matter which point you call point 1 and which you call point 2. The result will always be a positive length.

  - id: sec-midpoint
    title: The Midpoint Formula
    required: true
    content: |-
      The **midpoint** is the exact center of a line segment. To find it, you just find the average of the $x$-coordinates and the average of the $y$-coordinates.
      
      **Midpoint Formula**:
      $$M = \left( \frac{x_1 + x_2}{2}, \frac{y_1 + y_2}{2} \right)$$
      
      Unlike the distance formula which subtracts coordinates to find a length, the midpoint formula *adds* the coordinates and divides by 2 to find a location!

questions:
- id: q-geom-coord-1
  title: Concept Check - Finding the Distance
  prompt: |-
    What is the distance between the point $(0, 0)$ and the point $(3, 4)$?
  type: numericResponse
  answer:
    numericValue: 5
    tolerance: 0
  explanation: |-
    $$d = \sqrt{(3 - 0)^2 + (4 - 0)^2}$$
    $$d = \sqrt{3^2 + 4^2} = \sqrt{9 + 16} = \sqrt{25} = 5$$
  skills:
  - geometry-coordinate-geometry

- id: q-geom-coord-2
  title: Concept Check - Finding the Midpoint
  prompt: |-
    What is the midpoint of the line segment connecting $(-2, 5)$ and $(4, -1)$?
  type: multipleChoice
  choices:
  - id: c1
    text: $(1, 2)$
  - id: c2
    text: $(2, 4)$
  - id: c3
    text: $(3, 3)$
  - id: c4
    text: $(-3, 3)$
  answer:
    choiceId: c1
  explanation: |-
    Average the $x$-coordinates: $\frac{-2 + 4}{2} = \frac{2}{2} = 1$.
    Average the $y$-coordinates: $\frac{5 + -1}{2} = \frac{4}{2} = 2$.
    The midpoint is $(1, 2)$.
  skills:
  - geometry-coordinate-geometry
