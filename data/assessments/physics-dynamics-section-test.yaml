questions:
  - id: dyn-test-q01
    title: Net Force and Acceleration
    type: numericResponse
    prompt: |
      A 12 kg crate rests on a frictionless surface. Two horizontal forces act on it: $F_1 = 45\text{ N}$ to the right and $F_2 = 18\text{ N}$ to the left. What is the magnitude of the crate's acceleration in m/s²? Round to two decimal places.
    answer:
      value: 2.25
      tolerance: 0.05
    explanation: |
      Net force: $F_\text{net} = 45 - 18 = 27\text{ N}$.

      Newton's 2nd law: $a = F_\text{net}/m = 27/12 = 2.25\text{ m/s}^2$.

  - id: dyn-test-q02
    title: Find Mass from Force and Acceleration
    type: numericResponse
    prompt: |
      A horizontal net force of 84 N causes an object to accelerate at $3.5\text{ m/s}^2$. What is the object's mass in kg?
    answer:
      value: 24.0
      tolerance: 0.5
    explanation: |
      From $F = ma$: $m = F/a = 84/3.5 = 24\text{ kg}$.

  - id: dyn-test-q03
    title: Elevator — Apparent Weight
    type: numericResponse
    prompt: |
      A 65 kg student stands in an elevator that accelerates **upward** at $1.8\text{ m/s}^2$. Using $g = 9.8\text{ m/s}^2$, what does the floor scale read (normal force on the student) in Newtons? Round to one decimal place.
    answer:
      value: 754.0
      tolerance: 2.0
    explanation: |
      Applying Newton's 2nd law (upward positive):
      $$N - mg = ma \implies N = m(g + a) = 65(9.8 + 1.8) = 65(11.6) = 754\text{ N}$$

      The student feels heavier because the floor pushes harder to accelerate them upward.

  - id: dyn-test-q04
    title: Frictionless Inclined Plane — Acceleration
    type: numericResponse
    prompt: |
      A 5 kg block slides down a **frictionless** inclined plane tilted at $30°$ from horizontal. Using $g = 9.8\text{ m/s}^2$, what is the block's acceleration along the incline in m/s²? Round to two decimal places.
    answer:
      value: 4.90
      tolerance: 0.05
    explanation: |
      The only force along the slope is the gravitational component:
      $$a = g\sin\theta = 9.8\sin 30° = 9.8(0.5) = 4.90\text{ m/s}^2$$

      Acceleration is independent of mass on a frictionless incline — the mass cancels.

  - id: dyn-test-q05
    title: Atwood Machine — System Acceleration
    type: numericResponse
    prompt: |
      An Atwood machine uses a massless, frictionless pulley with $m_1 = 4\text{ kg}$ on the left and $m_2 = 6\text{ kg}$ on the right. Using $g = 9.8\text{ m/s}^2$, what is the magnitude of the system's acceleration in m/s²? Round to two decimal places.

      $$a = \frac{(m_2 - m_1)g}{m_1 + m_2}$$
    answer:
      value: 1.96
      tolerance: 0.05
    explanation: |
      $$a = \frac{(6-4)(9.8)}{4+6} = \frac{2(9.8)}{10} = 1.96\text{ m/s}^2$$

  - id: dyn-test-q06
    title: Atwood Machine — Rope Tension
    type: numericResponse
    prompt: |
      In the same Atwood machine ($m_1 = 4\text{ kg}$, $m_2 = 6\text{ kg}$, $g = 9.8\text{ m/s}^2$, system acceleration $a = 1.96\text{ m/s}^2$), find the tension in the connecting rope in Newtons.

      Apply Newton's 2nd law to $m_1$ accelerating upward: $T - m_1 g = m_1 a$.
    answer:
      value: 47.04
      tolerance: 0.5
    explanation: |
      $$T = m_1(g + a) = 4(9.8 + 1.96) = 4(11.76) = 47.04\text{ N}$$

      Verify with $m_2$: $T = m_2(g - a) = 6(9.8 - 1.96) = 6(7.84) = 47.04\text{ N}$ ✓

  - id: dyn-test-q07
    title: Two Blocks on Frictionless Surface — String Tension
    type: numericResponse
    prompt: |
      Block A ($m_A = 3\text{ kg}$) and Block B ($m_B = 7\text{ kg}$) are connected by a light string on a frictionless surface. A $20\text{ N}$ horizontal force pulls Block B. What is the tension in the connecting string in Newtons?
    answer:
      value: 6.0
      tolerance: 0.2
    explanation: |
      **System acceleration:** $a = F/(m_A + m_B) = 20/10 = 2\text{ m/s}^2$

      **String tension** (only accelerates Block A): $T = m_A \cdot a = 3(2) = 6\text{ N}$

  - id: dyn-test-q08
    title: Incline with Friction — Net Acceleration
    type: numericResponse
    prompt: |
      A 4 kg block slides up a $25°$ incline under a 50 N force directed along the slope. The coefficient of kinetic friction is $\mu_k = 0.20$. Using $g = 9.8\text{ m/s}^2$, what is the block's acceleration in m/s²? Round to one decimal place.
    answer:
      value: 6.6
      tolerance: 0.3
    explanation: |
      Forces along the slope (up = positive):
      - Applied: $+50\text{ N}$
      - Gravity component: $-mg\sin 25° = -4(9.8)(0.4226) = -16.56\text{ N}$
      - Kinetic friction (opposing upward motion): $-\mu_k mg\cos 25° = -0.20(4)(9.8)(0.9063) = -7.10\text{ N}$

      $$a = (50 - 16.56 - 7.10)/4 = 26.34/4 \approx 6.6\text{ m/s}^2$$

  - id: dyn-test-q09
    title: Normal Force with Downward-Angled Push
    type: numericResponse
    prompt: |
      A 10 kg box rests on a horizontal floor. A person pushes it with a 30 N force directed **downward at 40° below horizontal**. Using $g = 9.8\text{ m/s}^2$, what is the normal force from the floor in Newtons? Round to one decimal place.
    answer:
      value: 117.3
      tolerance: 1.5
    explanation: |
      Vertical equilibrium (no vertical acceleration):
      $$N = mg + F\sin 40° = 10(9.8) + 30(0.6428) = 98 + 19.3 = 117.3\text{ N}$$

      Pushing downward increases the normal force — the opposite of pulling upward with a rope.

  - id: dyn-test-q10
    title: "Newton's Third Law — The Horse-Cart Paradox"
    type: multipleChoice
    prompt: |
      A horse pulls a cart with a rope. By Newton's 3rd Law, the cart pulls the horse backward with an equal and opposite force. A student argues: *"Since these forces are equal and opposite, the horse and cart should never accelerate."*

      What is the fundamental flaw in this reasoning?
    choices:
      - id: a
        text: "Newton's 3rd Law only applies to stationary systems — once moving, the action is stronger than the reaction."
      - id: b
        text: "Action-reaction pairs always act on **different objects** and cannot cancel each other. The horse's net force depends on the ground pushing it forward vs. the cart pulling it back; these are different forces from different objects. The student wrongly tries to cancel forces on two different objects."
      - id: c
        text: "The horse exerts its force slightly before the cart reacts, giving the horse a brief advantage."
      - id: d
        text: "The rope transmits force in only one direction, so the forces are not truly equal."
    answer:
      choiceId: b
    explanation: |
      Newton's 3rd Law pairs always act on **two different objects**. To analyze motion of one object, you only sum forces acting **on that object**.

      - **Horse's equation:** $F_\text{ground on horse} - F_\text{cart on horse} = m_\text{horse} \cdot a$
      - **Cart's equation:** $F_\text{horse on cart} - F_\text{resistance} = m_\text{cart} \cdot a$

      The ground's push on the horse's hooves is the external force driving the system forward. If it exceeds the cart's pull-back on the horse, the system accelerates.

  - id: dyn-test-q11
    title: Multi-Force 2D Equilibrium — Missing Component
    type: numericResponse
    prompt: |
      Four forces act on an object. Three are known:
      - $\vec{F}_1 = (8, 0)\text{ N}$
      - $\vec{F}_2 = (-3, 6)\text{ N}$
      - $\vec{F}_3 = (0, -10)\text{ N}$

      The object is in equilibrium. What is the **y-component** of the fourth force $\vec{F}_4$ in Newtons?
    answer:
      value: 4.0
      tolerance: 0.1
    explanation: |
      For equilibrium: $\sum F_y = 0$.

      $$F_{4y} = -(0 + 6 + (-10)) = -(-4) = +4\text{ N}$$

      (And $F_{4x} = -(8 - 3 + 0) = -5\text{ N}$.)

  - id: dyn-test-q12
    title: Incline — Minimum Force to Prevent Sliding
    type: numericResponse
    prompt: |
      A 6 kg block rests on a rough $35°$ incline with $\mu_s = 0.45$. Using $g = 9.8\text{ m/s}^2$, what is the **minimum** force (directed up the slope) needed to prevent the block from sliding down? Round to one decimal place.

      At minimum force, friction acts at its maximum value and points up the slope (helping the applied force).
    answer:
      value: 12.1
      tolerance: 1.0
    explanation: |
      At the minimum force, friction is maximum and upward:
      $$F_\text{min} + \mu_s mg\cos\theta = mg\sin\theta$$
      $$F_\text{min} = mg(\sin 35° - \mu_s\cos 35°) = 6(9.8)(0.5736 - 0.45 \times 0.8192)$$
      $$= 58.8(0.5736 - 0.3686) = 58.8(0.2050) \approx 12.1\text{ N}$$

  - id: dyn-test-q13
    title: Variable Force — Velocity from Integration
    type: numericResponse
    prompt: |
      A 3 kg object starts from rest. A time-varying force $F(t) = 6t^2 - 4t$ (Newtons) acts on it. What is the object's velocity at $t = 2\text{ s}$?

      $$v(t) = v_0 + \frac{1}{m}\int_0^t F(t')\,dt'$$
    answer:
      value: 2.67
      tolerance: 0.05
    explanation: |
      $$v(2) = 0 + \frac{1}{3}\int_0^2 (6t^2 - 4t)\,dt = \frac{1}{3}\left[2t^3 - 2t^2\right]_0^2$$
      $$= \frac{1}{3}\bigl(2(8) - 2(4)\bigr) = \frac{1}{3}(16-8) = \frac{8}{3} \approx 2.67\text{ m/s}$$

  - id: dyn-test-q14
    title: "Conceptual — Static Friction Direction on an Incline"
    type: multipleChoice
    prompt: |
      A box sits **stationary** on a rough inclined surface. Which direction does static friction point on the box?
    choices:
      - id: a
        text: Straight down (parallel to gravity)
      - id: b
        text: Perpendicular to the inclined surface, pointing away from it
      - id: c
        text: Up the slope (opposing the tendency to slide down)
      - id: d
        text: Horizontally, opposing any horizontal motion tendency
    answer:
      choiceId: c
    explanation: |
      Static friction **opposes the tendency of motion**. The box tends to slide **down** the slope due to gravity's parallel component, so static friction points **up the slope** to oppose that tendency.

      Key rule: friction always acts **along the contact surface**, never perpendicular to it.

  - id: dyn-test-q15
    title: Rocket Launch — Net Acceleration
    type: numericResponse
    prompt: |
      A model rocket (mass $0.5\text{ kg}$) produces a thrust of $12\text{ N}$ straight up. Air resistance is negligible. Using $g = 9.8\text{ m/s}^2$, what is the rocket's initial acceleration in m/s²? Round to one decimal place.
    answer:
      value: 14.2
      tolerance: 0.3
    explanation: |
      Net upward force: $F_\text{net} = F_\text{thrust} - mg = 12 - 0.5(9.8) = 12 - 4.9 = 7.1\text{ N}$

      $$a = F_\text{net}/m = 7.1/0.5 = 14.2\text{ m/s}^2\text{ (upward)}$$

  - id: dyn-test-q16
    title: Constant Velocity — Rope Angle and Friction
    type: numericResponse
    prompt: |
      A 20 kg box is pulled across a floor at constant velocity by a rope making $20°$ above horizontal. The coefficient of kinetic friction is $\mu_k = 0.30$. Using $g = 9.8\text{ m/s}^2$, find the rope tension in Newtons. Round to one decimal place.

      Hint: The rope's upward component reduces the normal force.
    answer:
      value: 56.4
      tolerance: 1.5
    explanation: |
      Let $T$ = tension. Constant velocity means zero net force.

      **Vertical:** $N = mg - T\sin 20°$

      **Horizontal:** $T\cos 20° = \mu_k N = \mu_k(mg - T\sin 20°)$

      $$T\cos 20° + \mu_k T\sin 20° = \mu_k mg$$
      $$T(\cos 20° + 0.30\sin 20°) = 0.30(20)(9.8) = 58.8$$
      $$T(0.9397 + 0.1026) = 58.8 \implies T = 58.8/1.0423 \approx 56.4\text{ N}$$

  - id: dyn-test-q17
    title: Ball on String — Tension at Top of Loop
    type: multipleChoice
    prompt: |
      A 5 kg ball on a 0.8 m string swings in a vertical circle at $v = 4\text{ m/s}$ at the **top**. Using $g = 9.8\text{ m/s}^2$, which expression gives the string tension at the top?
    choices:
      - id: a
        text: '$T = mg = 49\text{ N}$ — tension equals weight at the top.'
      - id: b
        text: '$T = mv^2/r - mg = 100 - 49 = 51\text{ N}$ — both tension and gravity point toward the center (downward) at the top.'
      - id: c
        text: '$T = mv^2/r + mg = 100 + 49 = 149\text{ N}$ — tension must overcome gravity at the top.'
      - id: d
        text: '$T = 0$ — gravity alone provides the centripetal force at the top.'
    answer:
      choiceId: b
    explanation: |
      At the **top**, both tension and gravity point downward (toward center):
      $$T + mg = \frac{mv^2}{r} \implies T = \frac{mv^2}{r} - mg = \frac{5(16)}{0.8} - 49 = 100 - 49 = 51\text{ N}$$

      At the **bottom**, tension must also support the weight: $T - mg = mv^2/r$, so tension is larger there — ropes break at the bottom.

  - id: dyn-test-q18
    title: Free Fall — Scale Reading
    type: numericResponse
    prompt: |
      A 70 kg person stands on a bathroom scale inside an elevator. The cable snaps and the elevator enters **free fall** (ignore air resistance). What does the scale read in Newtons?
    answer:
      value: 0.0
      tolerance: 0.1
    explanation: |
      In free fall, both the person and scale accelerate at $g$ downward. Newton's 2nd law on the person (upward positive):
      $$N - mg = m(-g) \implies N = 0\text{ N}$$

      The person is "weightless" — same condition as astronauts in orbit, where the spacecraft and crew fall together toward Earth.

  - id: dyn-test-q19
    title: Incline — Angle for Constant Velocity Sliding
    type: numericResponse
    prompt: |
      A block slides down a rough incline at **constant velocity**. The coefficient of kinetic friction is $\mu_k = 0.55$. At what angle $\theta$ (in degrees) is the incline tilted? Round to one decimal place.
    answer:
      value: 28.8
      tolerance: 0.5
    explanation: |
      Constant velocity means zero net force along the slope:
      $$mg\sin\theta = \mu_k mg\cos\theta \implies \tan\theta = \mu_k = 0.55$$
      $$\theta = \arctan(0.55) \approx 28.8°$$

      This is called the **friction angle** — independent of mass. It is the steepest angle at which an object can slide at constant velocity.

  - id: dyn-test-q20
    title: Force Decomposition in 2D
    type: numericResponse
    prompt: |
      A 100 N force acts at $37°$ above horizontal on a 15 kg box on a frictionless floor. What is the horizontal component of the net force on the box in Newtons? Round to one decimal place.

      $(cos 37° \approx 0.7986,\; sin 37° \approx 0.6018)$
    answer:
      value: 79.9
      tolerance: 1.0
    explanation: |
      The horizontal component of the applied force is:
      $$F_x = F\cos 37° = 100(0.7986) = 79.9\text{ N}$$

      The floor's normal force and gravity cancel vertically — neither contributes to horizontal force. So the horizontal net force is simply the horizontal component of the applied force.

      This gives horizontal acceleration: $a_x = 79.9/15 \approx 5.3\text{ m/s}^2$.
