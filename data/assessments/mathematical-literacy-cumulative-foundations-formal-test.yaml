questions:
- id: q001
  type: freeResponse
  prompt: 'Read $B\subseteq A$. State the direction in words.'
  instruction: Give the requested reading judgment and name the condition, definition, or inference that licenses
    it.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Every element of B is an element of A.
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  prerequisiteObjectiveIds:
  - ml-notation
  - ml-logic
  extensionObjectiveIds:
  - ml-review
  difficultyEvidence: Requires transferring a reading convention across notation, logic, and proof context while
    checking a stated condition.
  explanation: |-
    Solution: Every element of B is an element of A.
    Why it works: Subset notation is directional containment, not membership of one whole set.
- id: q002
  type: freeResponse
  prompt: 'A line says $x\in\mathbb Z$ and $x^2<9$. State what must be preserved in a translation.'
  instruction: Give the requested reading judgment and name the condition, definition, or inference that licenses
    it.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - x is an integer and its square is less than 9.
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  prerequisiteObjectiveIds:
  - ml-notation
  - ml-logic
  extensionObjectiveIds:
  - ml-review
  difficultyEvidence: Requires transferring a reading convention across notation, logic, and proof context while
    checking a stated condition.
  explanation: |-
    Solution: x is an integer and its square is less than 9.
    Why it works: The declaration gives the domain and the inequality supplies the condition.
