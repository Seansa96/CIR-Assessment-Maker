schemaVersion: 1
id: csharp-collections-recall
title: C# Collections and LINQ Recall
assessmentType: recallDrill
categoryId: csharp
subcategoryIds:
- csharp-standard-library
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  prompt: What C# generic collection type represents a dynamic array that can grow
    and shrink in size?
  answer:
    expected: List
    aliases:
    - List<T>
- id: r002
  type: typed
  prompt: What C# generic collection type maps unique keys to values?
  answer:
    expected: Dictionary
    aliases:
    - Dictionary<TKey, TValue>
- id: r003
  type: typed
  prompt: What namespace must you include (`using ...;`) to access LINQ extension
    methods?
  answer:
    expected: System.Linq
- id: r004
  type: typed
  prompt: Which LINQ method filters a collection based on a condition (e.g., returning
    only items > 10)?
  answer:
    expected: Where
    aliases:
    - Where()
- id: r005
  type: typed
  prompt: Which LINQ method transforms each element in a collection into a new form
    (e.g., extracting just the Name property)?
  answer:
    expected: Select
    aliases:
    - Select()
- id: r006
  type: typed
  prompt: Which LINQ method returns the first element of a sequence, or a default
    value (like `null`) if the sequence is empty?
  answer:
    expected: FirstOrDefault
    aliases:
    - FirstOrDefault()
- id: r007
  type: typed
  prompt: Which LINQ method returns `true` if at least one element satisfies a given
    condition?
  answer:
    expected: Any
    aliases:
    - Any()
- id: r008
  type: typed
  prompt: Which LINQ method sorts the elements of a sequence in ascending order?
  answer:
    expected: OrderBy
    aliases:
    - OrderBy()
