glossary:
  introduction: Vocabulary for recognizing the form and scope of formal mathematical statements.
  sections:
  - id: logical-language
    title: Logical language
    required: true
    content: These terms describe the shape of a formal claim, not its topic.
    entries:
    - id: t01
      term: Statement
      definition: A sentence or mathematical expression that is definitely true or definitely false.
      drills:
      - id: t01-drill
        type: flashcard
        prompt: What must a statement have?
        answer:
          expected: A definite truth value.
        explanation: 'Solution: A definite truth value. Why it works: Statements can be true or false.'
        tags: []
    - id: t02
      term: Conditional
      definition: A statement of the form “if P, then Q,” with hypothesis P and conclusion Q.
      drills:
      - id: t02-drill
        type: flashcard
        prompt: What form does a conditional have?
        answer:
          expected: If P then Q.
        explanation: 'Solution: If P then Q. Why it works: A conditional connects a hypothesis to a conclusion.'
        tags: []
    - id: t03
      term: Converse
      definition: The reversed conditional “if Q, then P”; it is a separate claim that needs its own evidence.
      drills:
      - id: t03-drill
        type: flashcard
        prompt: What does a converse do?
        answer:
          expected: It reverses a conditional.
        explanation: 'Solution: It reverses a conditional. Why it works: The hypothesis and conclusion swap places.'
        tags: []
    - id: t04
      term: 'Universal quantifier ($\forall$)'
      definition: The symbol meaning “for every” or “for all.”
      drills:
      - id: t04-drill
        type: flashcard
        prompt: What does the universal quantifier mean?
        answer:
          expected: For every.
        explanation: 'Solution: For every. Why it works: It ranges over all objects in the domain.'
        tags: []
    - id: t05
      term: 'Existential quantifier ($\exists$)'
      definition: The symbol meaning “there exists at least one.”
      drills:
      - id: t05-drill
        type: flashcard
        prompt: What does the existential quantifier mean?
        answer:
          expected: There exists at least one.
        explanation: 'Solution: There exists at least one. Why it works: It requires a witness in the domain.'
        tags: []
