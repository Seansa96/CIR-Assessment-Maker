schemaVersion: 1
id: physics-connected-systems-concept-lesson
title: Connected Systems and Atwood Machines
assessmentType: conceptLesson
categoryId: physics-1
topicId: physics-connected-systems
skills: [Apply Newton's Laws and Force Models, free-body-diagram, tension, atwood-machine]
modeDefault: practice
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags: [physics-1, physics-connected-systems, atwood-machine, tension]
authoring:
  visualRequirement: required
  visualRationale: Coupled motion only becomes unambiguous when each object has its own diagram and the shared rope constraint is visible.
  physicsModel:
    modelId: connectedSystem
    modelRole: foundation
    requiredRepresentations: [systemBoundary, freeBodyDiagram, coordinateAxes, motionConstraint]
lesson:
  introduction: A rope does not turn two masses into one featureless object. Start with a system boundary for each mass, then connect their equations with the rope constraint.
  sections:
  - id: isolate-each-mass
    title: Draw one diagram for each object
    content: For an ideal Atwood machine, each hanging mass has tension upward and weight downward. Draw two separate free-body diagrams; the forces are not identical because the weights can differ.
    media:
    - type: image
      src: /media/physics/worked-examples/atwood-tension-standard.svg
      alt: Two hanging masses connected by a light rope over a pulley, with separate tension and weight arrows.
      caption: Separate diagrams make the common tension and different weights visible.
    check:
      id: isolate-each-mass-check
      type: multipleChoice
      prompt: Which setup is required before writing Atwood-machine equations?
      choices:
      - { id: a, text: One FBD for each mass }
      - { id: b, text: A single arrow equal to the larger weight }
      - { id: c, text: An acceleration force on both masses }
      - { id: d, text: A velocity vector instead of tension }
      answer: { choiceId: a }
      explanation: Newton's law applies to a selected body, so each mass needs its own external-force model.
  - id: choose-linked-axes
    title: Choose compatible positive directions
    content: If the heavier mass moves down, choose down as positive for it and up as positive for the lighter mass. Both equations then use the same positive acceleration magnitude $a$.
    check:
      id: choose-linked-axes-check
      type: multipleChoice
      prompt: Why can the two masses use opposite positive directions?
      choices:
      - { id: a, text: Their motions are opposite but the rope gives them equal acceleration magnitudes }
      - { id: b, text: Tension has opposite magnitudes }
      - { id: c, text: Gravity reverses direction }
      - { id: d, text: Newton's second law needs no signs }
      answer: { choiceId: a }
      explanation: The coordinate directions are independent choices; the inextensible rope supplies the relation between the accelerations.
  - id: write-per-object-laws
    title: Write Newton's law for both bodies
    content: With $m_2$ descending and $m_1$ ascending, write $T-m_1g=m_1a$ and $m_2g-T=m_2a$. Do not cancel tension until both equations have been written.
    check:
      id: write-per-object-laws-check
      type: multipleChoice
      prompt: In the equation for the descending mass, which term is positive with downward chosen positive?
      choices:
      - { id: a, text: Its weight $m_2g$ }
      - { id: b, text: The upward tension only }
      - { id: c, text: Both forces regardless of direction }
      - { id: d, text: Neither force }
      answer: { choiceId: a }
      explanation: The weight points along the selected positive direction, while tension points against it.
  - id: apply-constraint
    title: Use the motion constraint explicitly
    content: A light, taut, inextensible rope gives equal acceleration magnitudes. It does not by itself justify equal tensions if the pulley or rope has non-negligible mass; the ideal model makes that additional approximation.
    check:
      id: apply-constraint-check
      type: multipleChoice
      prompt: Which statement follows from an inextensible taut rope?
      choices:
      - { id: a, text: Connected masses have linked displacement, speed, and acceleration magnitudes }
      - { id: b, text: Every force on the masses is equal }
      - { id: c, text: Both masses have the same velocity direction }
      - { id: d, text: The heavier mass has no tension }
      answer: { choiceId: a }
      explanation: The rope constrains motion; equality of tension requires the separate ideal-rope/pulley assumption.
  - id: solve-as-system
    title: Add equations only after modeling
    content: Adding the two equations cancels the internal tension in the two-mass system and gives $(m_2-m_1)g=(m_1+m_2)a$. Substitute $a$ back into either per-object equation to find $T$.
    check:
      id: solve-as-system-check
      type: multipleChoice
      prompt: Why does tension cancel when the two ideal-mass equations are added?
      choices:
      - { id: a, text: It is an internal interaction for the selected two-mass system }
      - { id: b, text: Tension is never a real force }
      - { id: c, text: Weight cancels it on each object }
      - { id: d, text: Acceleration is zero }
      answer: { choiceId: a }
      explanation: Tension remains on each individual FBD, but its equal/opposite contributions cancel in the combined-system equation.
  - id: check-limits
    title: Check limiting cases
    content: Equal masses predict $a=0$; a much heavier $m_2$ predicts acceleration below $g$, never above it. These checks catch reversed signs and an omitted mass in the denominator.
    check:
      id: check-limits-check
      type: multipleChoice
      prompt: For equal masses in an ideal Atwood machine released from rest, what should the acceleration be?
      choices:
      - { id: a, text: $0$ }
      - { id: b, text: $g$ }
      - { id: c, text: $2g$ }
      - { id: d, text: It cannot be predicted }
      answer: { choiceId: a }
      explanation: The total external driving weights balance, so the net force on the two-mass system is zero.
  - id: transfer-to-pulley-table
    title: Transfer the model to a table and pulley
    content: A mass on a table and a hanging mass still need separate FBDs. The shared rope sets their acceleration relation; friction or an incline changes only the force terms for the table-side mass.
    check:
      id: transfer-to-pulley-table-check
      type: multipleChoice
      prompt: In a table-pulley system, what new force belongs on the table mass when the surface is rough?
      choices:
      - { id: a, text: Friction opposing relative motion }
      - { id: b, text: A second weight from the hanging mass }
      - { id: c, text: Centripetal force from the pulley }
      - { id: d, text: Acceleration force }
      answer: { choiceId: a }
      explanation: The rough contact adds friction to that object's FBD; the rope constraint still connects the two acceleration magnitudes.
