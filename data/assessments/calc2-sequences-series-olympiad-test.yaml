modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - evaluate-binomial-denominator-series
  prompt: |
    Evaluate $\displaystyle\sum_{n=2}^{\infty}\frac1{\binom n2}$.
  choices:
  - id: a
    text: $2$
  - id: b
    text: $1$
  - id: c
    text: |-
      $\pi^2/6$
  - id: d
    text: Diverges
  answer:
    choiceId: a
  explanation: The term is $2/[n(n-1)]=2[1/(n-1)-1/n]$, so the partial sums approach two.
- id: q002
  type: multipleChoice
  skills:
  - use-generating-functions-for-harmonic-numbers
  prompt: |
    Find $\displaystyle\sum_{n=1}^{\infty}H_n/2^n$.
  choices:
  - id: a
    text: |-
      $2\ln2$
  - id: b
    text: |-
      $\ln2$
  - id: c
    text: $2$
  - id: d
    text: |-
      $\pi^2/12$
  answer:
    choiceId: a
  explanation: |-
    For $|x|<1$, reversing the nonnegative sums gives $\sum H_nx^n=[-\ln(1-x)]/(1-x)$; substituting one half gives $2\ln2$.
- id: q003
  type: multipleChoice
  skills:
  - apply-tonellis-theorem
  prompt: |
    For nonnegative numbers $a_{m,n}$, which statement about
    $\sum_m\sum_n a_{m,n}$ and $\sum_n\sum_m a_{m,n}$ is correct?
  choices:
  - id: a
    text: |-
      They are equal in $[0,\infty]$, even if both diverge.
  - id: b
    text: They are equal only when finitely many entries are nonzero.
  - id: c
    text: Changing order always changes the value.
  - id: d
    text: They must both be finite.
  answer:
    choiceId: a
  explanation: Tonelli's theorem permits reordering nonnegative sums, with infinity allowed as the common
    value.
- id: q004
  type: multipleChoice
  skills:
  - classify-central-binomial-ratio-series
  prompt: |
    How does $\displaystyle\sum_{n=1}^{\infty}\frac{(n!)^2}{(2n)!}$
    behave?
  choices:
  - id: a
    text: It converges absolutely.
  - id: b
    text: It diverges harmonically.
  - id: c
    text: It is conditionally convergent.
  - id: d
    text: Its terms do not approach zero.
  answer:
    choiceId: a
  explanation: The consecutive ratio is $(n+1)^2/[(2n+2)(2n+1)]$, which tends to one fourth.
- id: q005
  type: multipleChoice
  skills:
  - connect-products-and-log-series
  prompt: |
    For $u_n>-1$, which finite identity underlies analysis of
    $\prod_{n=1}^{\infty}(1+u_n)$?
  choices:
  - id: a
    text: |-
      $\ln\prod_{n=1}^{N}(1+u_n)=\sum_{n=1}^{N}\ln(1+u_n)$
  - id: b
    text: |-
      $\prod(1+u_n)=1+\prod u_n$
  - id: c
    text: |-
      $\ln(1+u_n)=u_n$ exactly
  - id: d
    text: Every such product converges
  answer:
    choiceId: a
  explanation: The logarithm turns each finite product into a finite sum; only after that identity is
    established should limits be taken.
- id: q006
  type: multipleChoice
  skills:
  - apply-cesaro-to-partial-sums
  prompt: |
    If the partial sums $S_n$ of a series converge to $S$, what is
    $\lim_{N\to\infty}(S_1+\cdots+S_N)/N$?
  choices:
  - id: a
    text: $S$
  - id: b
    text: $0$
  - id: c
    text: $S/2$
  - id: d
    text: It need not exist.
  answer:
    choiceId: a
  explanation: Cesàro's theorem states that arithmetic means of any convergent sequence share its limit.
- id: q007
  type: multipleChoice
  skills:
  - apply-iterated-log-condensation
  prompt: |
    Classify
    $\sum_{n=3}^{\infty}1/[n\ln n\,\ln(\ln n)]$.
  choices:
  - id: a
    text: Divergent
  - id: b
    text: Convergent
  - id: c
    text: Conditionally convergent
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: |-
    Condensation reduces it, up to constants, to $\sum1/[k\ln k]$, which diverges.
- id: q008
  type: multipleChoice
  skills:
  - evaluate-weighted-geometric-series
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac{n(n+1)}{2^{n+1}}$.
  choices:
  - id: a
    text: $4$
  - id: b
    text: $2$
  - id: c
    text: $6$
  - id: d
    text: $8$
  answer:
    choiceId: a
  explanation: |-
    At x equals one half, $\sum n(n+1)x^n=2x/(1-x)^3=8$; the extra factor one half gives four.
- id: q009
  type: multipleChoice
  skills:
  - use-recurrence-generating-functions
  prompt: |
    With $F_0=0$, $F_1=1$, and $F_{n+1}=F_n+F_{n-1}$, find
    $\sum_{n=1}^{\infty}F_n/2^n$.
  choices:
  - id: a
    text: $2$
  - id: b
    text: $1$
  - id: c
    text: |-
      $\varphi$
  - id: d
    text: Diverges
  answer:
    choiceId: a
  explanation: The generating function is $x/(1-x-x^2)$; at x equals one half it equals two.
- id: q010
  type: multipleChoice
  skills:
  - detect-recurrence-series-divergence
  prompt: |
    What happens to $\sum_{n=1}^{\infty}F_n/\varphi^n$, where
    $\varphi=(1+\sqrt5)/2$?
  choices:
  - id: a
    text: |-
      It diverges because its terms approach $1/\sqrt5$.
  - id: b
    text: It converges geometrically.
  - id: c
    text: |-
      It converges to $\varphi$.
  - id: d
    text: It alternates.
  answer:
    choiceId: a
  explanation: |-
    Binet's formula gives $F_n/\varphi^n\to1/\sqrt5$, violating the necessary term condition.
- id: q011
  type: multipleChoice
  skills:
  - use-monotone-partial-sum-convergence
  prompt: |
    For $a_n\ge0$, which condition is equivalent to convergence of
    $\sum a_n$?
  choices:
  - id: a
    text: The partial sums are bounded above.
  - id: b
    text: |-
      $a_n\to0$.
  - id: c
    text: The terms are bounded.
  - id: d
    text: Some subsequence of terms converges.
  answer:
    choiceId: a
  explanation: Nonnegative terms make partial sums monotone increasing, so boundedness is exactly the
    remaining hypothesis of monotone convergence.
- id: q012
  type: multipleChoice
  skills:
  - use-asymptotic-equivalence
  prompt: |
    Suppose $a_n,b_n>0$ and $a_n/b_n\to1$. What relationship holds
    between $\sum a_n$ and $\sum b_n$?
  choices:
  - id: a
    text: They either both converge or both diverge.
  - id: b
    text: They have the same numerical sum.
  - id: c
    text: Both converge.
  - id: d
    text: No relationship is possible.
  answer:
    choiceId: a
  explanation: Eventually the ratio lies between two positive constants, giving comparison in both directions.
- id: q013
  type: multipleChoice
  skills:
  - analyze-positive-and-negative-parts
  prompt: |
    If a real series converges conditionally, what happens to the sum of its
    positive terms and the sum of the absolute values of its negative terms?
  choices:
  - id: a
    text: |-
      Both diverge to $+\infty$.
  - id: b
    text: Both converge.
  - id: c
    text: Exactly one diverges.
  - id: d
    text: Both equal the original sum.
  answer:
    choiceId: a
  explanation: Finiteness of either nonnegative part plus convergence of the signed difference would force
    the other finite, contradicting failure of absolute convergence.
- id: q014
  type: multipleChoice
  skills:
  - apply-dirichlet-to-oscillatory-series
  prompt: |
    Classify $\sum_{n=1}^{\infty}\sin n/n$.
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent by the term test
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: Partial sums of sine n are bounded and 1/n decreases to zero, while absolute sine values
    retain positive average harmonic mass.
- id: q015
  type: multipleChoice
  skills:
  - evaluate-telescoping-products
  prompt: |
    Evaluate $\displaystyle\prod_{n=2}^{\infty}\frac{n^2-1}{n^2}$.
  choices:
  - id: a
    text: $1/2$
  - id: b
    text: $0$
  - id: c
    text: $1$
  - id: d
    text: $2$
  answer:
    choiceId: a
  explanation: Factoring into $(n-1)/n$ and $(n+1)/n$ makes the Nth product $(N+1)/(2N)$.
