  prompt: |
    If the partial sums $S_n$ of a series converge to $S$, what is
    $\lim_{N\to\infty}(S_1+\cdots+S_N)/N$?
  choices:
  - id: a
    text: $S$
  - id: b
    text: $0$
  - id: c
    text: $S/2$
  - id: d
    text: It need not exist.
  answer:
    choiceId: a
  explanation: 'Solution: Cesàro''s theorem states that arithmetic means of any convergent sequence share its limit. Therefore the answer is $S$.


    Why it works: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$. For a finite sum, use $S_n=n(a_1+a_n)/2$ after identifying the correct first and last terms.


    Common trap: The $n$th term has $(n-1)d$, not $nd$; distinguish the number of terms from the index of the final term.


