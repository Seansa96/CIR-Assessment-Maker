  prompt: |
    Evaluate $\displaystyle\sum_{n=2}^{\infty}\frac1{\binom n2}$.
  choices:
  - id: a
    text: $2$
  - id: b
    text: $1$
  - id: c
    text: |-
      $\pi^2/6$
  - id: d
    text: Diverges
  answer:
    choiceId: a
  explanation: |-
    Solution: The term is $2/[n(n-1)]=2[1/(n-1)-1/n]$, so the partial sums approach two. Therefore the answer is $2$.

    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

