items:
- id: popcount-definition
  type: flashcard
  prompt: What is population count?
  answer:
    expected: The number of 1 bits in a word.
  explanation: It summarizes how many flags or set positions exist.
  tags:
  - popcount
- id: parity-definition
  type: cloze
  prompt: 'Complete: parity records whether the number of set bits is odd or ____.'
  answer:
    expected: even
  explanation: Parity is the set-bit count modulo 2.
  tags:
  - parity
- id: ctz-definition
  type: typed
  prompt: What does count trailing zeros measure?
  answer:
    expected: The number of zero bits below the least significant set bit.
  explanation: It locates the rightmost set bit position.
  tags:
  - ctz
- id: clz-definition
  type: typed
  prompt: What does count leading zeros measure?
  answer:
    expected: The number of zero bits before the most significant set bit.
  explanation: It helps locate the highest set bit.
  tags:
  - clz
- id: clear-loop-popcount
  type: flashcard
  prompt: How does a clear-rightmost-set-bit loop count bits?
  answer:
    expected: Each iteration removes exactly one set bit, so the iteration count equals the population count.
  explanation: The invariant is that one 1 bit disappears per loop.
  tags:
  - popcount
  - rightmost-bit
