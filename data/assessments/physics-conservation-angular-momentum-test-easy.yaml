  type: multipleChoice
  prompt: 'Angular momentum of a system is conserved when:'
  choices:
  - id: c1
    content: The net external torque is zero.
  - id: c2
    content: The net external force is zero.
  - id: c3
    content: Kinetic energy is conserved.
  answer:
    choiceId: c1
  explanation: $\sum \tau_{ext} = \frac{dL}{dt}$, so if $\sum \tau_{ext} = 0$, $L$
    is constant.
