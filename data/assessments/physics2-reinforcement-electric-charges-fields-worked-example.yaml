workedExamples:
- id: reinforcement-fields-we1
  title: Symmetric pair on an axis
  problem: Two equal positive charges $+Q$ sit at $(\pm b,0)$. Find the field direction and scaling at $(0,a)$.
  steps:
  - id: reinforcement-fields-we1-s1
    title: Use symmetry
    instruction: Pair the fields from the two charges before calculating a magnitude.
    hint: Reflecting across the y-axis changes only the horizontal component sign.
    type: multipleChoice
    prompt: Which component survives at $(0,a)$?
    choices:
    - { id: a, text: 'Horizontal components cancel and vertical components add upward' }
    - { id: b, text: 'Vertical components cancel and horizontal components add', issueSignals: [{ id: physics2-component-swap, domains: [physics-2] }] }
    - { id: c, text: 'Both components cancel', issueSignals: [{ id: physics2-symmetry-zero-error, domains: [physics-2] }] }
    - { id: d, text: 'The field points toward the nearer charge', issueSignals: [{ id: physics2-pair-direction-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: 'Solution: Reflection cancels x-components and adds the positive y-components. Why it works: Component parity, not scalar magnitude, determines cancellation. Why the other choices fail: They cancel the wrong component, cancel all contributions, or ignore the two-charge symmetry.'
  - id: reinforcement-fields-we1-s2
    title: Write the magnitude
    instruction: Project each Coulomb field onto y and add the two equal terms.
    hint: Each source distance is $\sqrt{a^2+b^2}$.
    type: multipleChoice
    prompt: Which expression gives the upward field magnitude?
    choices:
    - { id: a, text: '$2kQa/(a^2+b^2)^{3/2}$' }
    - { id: b, text: '$2kQ/(a^2+b^2)$', issueSignals: [{ id: physics2-field-projection-error, domains: [physics-2] }] }
    - { id: c, text: '$kQa/(a^2+b^2)^{3/2}$', issueSignals: [{ id: physics2-field-count-error, domains: [physics-2] }] }
    - { id: d, text: '$2kQb/(a^2+b^2)^{3/2}$', issueSignals: [{ id: physics2-field-axis-coordinate-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: 'Solution: Each contribution has y-component $kQa/(a^2+b^2)^{3/2}$; doubling gives the keyed result. Why it works: The numerator is the y projection and the denominator uses the full distance. Why the other choices fail: They omit projection, omit one charge, or use the horizontal coordinate.'
  - id: reinforcement-fields-we1-s3
    title: Check the symmetry limit
    instruction: Use component cancellation as the separation shrinks.
    hint: Reflection symmetry still cancels horizontal components.
    type: multipleChoice
    prompt: Which direction remains possible as the vertical separation tends to zero?
    choices: [{ id: a, text: 'Positive y' }, { id: b, text: 'Purely horizontal', issueSignals: [{ id: physics2-field-limit-direction, domains: [physics-2] }] }, { id: c, text: 'Zero by symmetry', issueSignals: [{ id: physics2-field-symmetry-zero, domains: [physics-2] }] }, { id: d, text: 'Negative y', issueSignals: [{ id: physics2-field-sign-limit, domains: [physics-2] }] }]
    answer: { choiceId: a }
    explanation: 'Solution: The horizontal components cancel and the upward components add. Why it works: Reflection symmetry fixes component parity. Why the other choices fail: They cancel the wrong component or reverse the sign.'
- id: reinforcement-fields-we2
  title: Field of a negative test charge
  problem: At a point the source field is $\mathbf E=400\,\mathrm{N/C}\,\hat y$. A particle with charge $-3\,\mu\mathrm C$ is released there.
  steps:
  - id: reinforcement-fields-we2-s1
    title: Determine force direction
    instruction: Apply $\mathbf F=q\mathbf E$ with the signed test charge.
    hint: A negative multiplier reverses a vector.
    type: multipleChoice
    prompt: Which direction is the initial electric force?
    choices:
    - { id: a, text: 'Downward, opposite $\mathbf E$' }
    - { id: b, text: 'Upward, along $\mathbf E$', issueSignals: [{ id: physics2-negative-test-charge-direction, domains: [physics-2] }] }
    - { id: c, text: 'Horizontal because force and field differ', issueSignals: [{ id: physics2-field-force-direction-error, domains: [physics-2] }] }
    - { id: d, text: 'Zero because the field was specified independently', issueSignals: [{ id: physics2-field-force-zero-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: 'Solution: Multiplying $\mathbf E$ by negative $q$ reverses the direction, so force is downward. Why it works: Force is the field sampled by the signed charge. Why the other choices fail: They ignore the sign or confuse field ownership with force response.'
  - id: reinforcement-fields-we2-s2
    title: Calculate force magnitude
    instruction: Multiply the field magnitude by $|q|$ and convert microcoulombs.
    hint: $3\,\mu\mathrm C=3\times10^{-6}\,\mathrm C$.
    type: multipleChoice
    prompt: What is the force magnitude?
    choices:
    - { id: a, text: '$1.2\times10^{-3}\,\mathrm N$' }
    - { id: b, text: '$1.2\times10^{3}\,\mathrm N$', issueSignals: [{ id: physics2-charge-prefix-error, domains: [physics-2] }] }
    - { id: c, text: '$133\,\mathrm N$', issueSignals: [{ id: physics2-force-division-error, domains: [physics-2] }] }
    - { id: d, text: '$4.0\times10^{-4}\,\mathrm N$', issueSignals: [{ id: physics2-force-charge-factor-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: 'Solution: $F=|q|E=(3\times10^{-6})(400)=1.2\times10^{-3}\,\mathrm N$. Why it works: Force units are charge times field. Why the other choices fail: b mishandles the micro prefix, c divides by charge, and d uses the wrong charge factor.'
  - id: reinforcement-fields-we2-s3
    title: Check field units
    instruction: Distinguish field from force units.
    hint: $\mathbf F=q\mathbf E$.
    type: multipleChoice
    prompt: Which unit belongs to electric field?
    choices: [{ id: a, text: '$\mathrm N/\mathrm C$' }, { id: b, text: '$\mathrm N\,\mathrm C$', issueSignals: [{ id: physics2-field-unit-product, domains: [physics-2] }] }, { id: c, text: '$\mathrm J/\mathrm C$', issueSignals: [{ id: physics2-field-potential-unit, domains: [physics-2] }] }, { id: d, text: '$\mathrm C/\mathrm N$', issueSignals: [{ id: physics2-field-unit-inverse, domains: [physics-2] }] }]
    answer: { choiceId: a }
    explanation: 'Solution: Electric field has units N/C. Why it works: Multiplying by charge gives force in newtons. Why the other choices fail: They multiply, substitute potential units, or invert the field unit.'
