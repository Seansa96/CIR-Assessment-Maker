  - id: s03
    title: The graph adds the function value as height
    required: true
    content: >
      The graph of a scalar function $f(x,y)$ is the set of triples $(x,y,z)$ satisfying $z=f(x,y)$. The first two coordinates locate the input in the domain; the third coordinate is the function value. Evaluating $f$ at a point in the domain therefore identifies one point on the surface, not just a height by itself.
    media:
    - type: image
      src: /media/calculus-3/graph-point-from-input.svg
      alt: A point in the xy-plane is paired with the function height to form the graph point (x, y, f of x and y) in three-dimensional space.
      caption: The graph point keeps the input coordinates and appends the output as its z-coordinate.
    check:
      id: check-03
      type: multipleChoice
      prompt: Let $f(x,y)=6-x^2-y^2$. Which point on its graph lies above $(1,2)$?
      choices:
      - id: a
        text: $(1,2,1)$
        media: []
        issueSignals: []
      - id: b
        text: $(1,2,5)$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: c
        text: $(1,2,6)$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: d
        text: $(1,2,-1)$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Compute the height at the given input:

        $$f(1,2)=6-1^2-2^2=6-1-4=1.$$

        The graph point is therefore $(1,2,1)$.


        Why it works: A graph point has the form $(x,y,f(x,y))$.


        Why the other choices fail:

        Choice b, $(1,2,5)$, subtracts only $1^2$ and omits the $y^2$ term.

        Choice c, $(1,2,6)$, copies the constant term without subtracting either square.

        Choice d, $(1,2,-1)$, subtracts $1+4$ but omits the constant 6.
