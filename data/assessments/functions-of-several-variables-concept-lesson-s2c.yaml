  - id: s08
    title: Combine domain, evaluation, and graph coordinates
    required: true
    content: >
      Before evaluating, confirm that the input lies in the domain; then compute the output and place it in the correct representation. For $H(x,y,z)=\sqrt{25-x^2-y^2-z^2}$, the domain is the closed ball $x^2+y^2+z^2\le25$. At a boundary point the output is zero, while an interior point gives a positive height. The graph point stores all three inputs followed by that height.
    media: []
    check:
      id: check-08
      type: multipleChoice
      prompt: For $H(x,y,z)=\sqrt{25-x^2-y^2-z^2}$, which graph point corresponds to input $(1,2,2)$?
      choices:
      - id: a
        text: $(1,2,2,4)$
        media: []
        issueSignals: []
      - id: b
        text: $(1,2,2,16)$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: c
        text: $(1,2,2,3)$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: d
        text: $(1,2,2,\sqrt{25})$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: First check the radicand and evaluate it:

        $$25-1^2-2^2-2^2=25-1-4-4=16,\qquad H(1,2,2)=\sqrt{16}=4.$$

        The graph point is $(1,2,2,4)$.


        Why it works: The input lies inside the radius-5 domain ball, and the graph appends the scalar output to its three inputs.


        Why the other choices fail:

        Choice b uses the radicand 16 as the output without taking its square root.

        Choice c subtracts 9 from 25 but then evaluates the square root incorrectly.

        Choice d uses the constant term alone and ignores all three squared inputs.
