  - id: s02
    title: Domains are regions
    required: true
    content: Restrictions on square roots, denominators, and logarithms produce regions rather than intervals. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
