  - id: s03
    title: Level curves organize a surface
    required: true
    content: A level curve keeps $f(x,y)$ fixed while x and y vary. Draw or mentally trace the representation before simplifying. Ask what remains fixed, what changes, and which direction is positive. This check is especially useful when a sign, a normal vector, a parameter order, or an integration limit can change the numerical value or the meaning of the result.
