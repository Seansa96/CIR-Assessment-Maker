  - id: s06
    title: Fixing a value in three inputs creates a level surface
    required: true
    content: >
      For $F(x,y,z)=x^2+y^2+z^2$, the level surface $F=9$ satisfies $x^2+y^2+z^2=9$. This is a sphere of radius 3 centered at the origin. A level surface lives in the three-dimensional input space; it is a different object from the graph of $F$, which would require a fourth coordinate for the output.
    media:
    - type: image
      src: /media/calculus-3/level-surfaces-spheres.svg
      alt: Cross sections of concentric spherical level surfaces for x squared plus y squared plus z squared equal to 4, 9, and 16, with radii 2, 3, and 4.
      caption: Each sphere is a set of three-dimensional inputs with one fixed output value.
    check:
      id: check-06
      type: multipleChoice
      prompt: The level surface $x^2+y^2+z^2=9$ is which geometric object?
      choices:
      - id: a
        text: A sphere of radius 3 centered at the origin.
        media: []
        issueSignals: []
      - id: b
        text: A sphere of radius 9 centered at the origin.
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: c
        text: A circular cylinder of radius 3 around the $z$-axis.
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: d
        text: A sphere of radius $\sqrt{3}$ centered at the origin.
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Compare with the standard sphere equation $x^2+y^2+z^2=r^2$. Here $r^2=9$, so $r=3$.


        Why it works: The equation fixes the distance from $(x,y,z)$ to the origin at 3.


        Why the other choices fail:

        Choice b uses the right side as the radius instead of the squared radius.

        Choice c would have an equation involving only $x^2+y^2$, leaving $z$ unrestricted.

        Choice d takes the square root of 3 instead of the square root of 9.
