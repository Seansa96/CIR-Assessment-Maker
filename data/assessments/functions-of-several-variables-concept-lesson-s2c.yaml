  - id: s07
    title: Keep the graph and level set dimensions separate
    required: true
    content: >
      A scalar function of three variables maps points in $\mathbb R^3$ to real numbers. Its graph records both the three inputs and the output, so it sits in $\mathbb R^4$ and cannot be drawn as an ordinary three-dimensional surface. A level set fixes the output and keeps only the input coordinates; in three variables, that set can be a surface in $\mathbb R^3$.
    media: []
    check:
      id: check-07
      type: multipleChoice
      prompt: Let $G(x,y,z)=x+y-z$. Which point on the graph corresponds to input $(1,2,3)$?
      choices:
      - id: a
        text: $(1,2,3,0)$
        media: []
        issueSignals: []
      - id: b
        text: $(1,2,3,6)$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: c
        text: $(1,2,0)$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: d
        text: $(1,2,3,-2)$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Evaluate the output: $G(1,2,3)=1+2-3=0$. Append it to the three input coordinates to obtain $(1,2,3,0)$.


        Why it works: A graph point for a function of three variables has the form $(x,y,z,G(x,y,z))$.


        Why the other choices fail:

        Choice b adds all three inputs instead of subtracting $z$.

        Choice c gives only three coordinates and omits the function value.

        Choice d reports $-2$, which results from dropping the input $y=2$ during evaluation: $1-3=-2$.
