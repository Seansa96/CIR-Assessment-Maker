  - id: s02
    title: A domain can be a region in the plane
    required: true
    content: >
      A two-variable domain is a set of points in the $xy$-plane. For a square root, its radicand must be nonnegative; for a logarithm, its argument must be positive; a denominator cannot be zero. For $h(x,y)=\sqrt{9-x^2-y^2}$, the condition $x^2+y^2\le9$ is a closed disk of radius 3. A boundary point is allowed because the square root of zero is defined.
    media:
    - type: image
      src: /media/calculus-3/domain-disk-radius-3.svg
      alt: The closed disk x squared plus y squared less than or equal to 9 is shaded, with radius 3 and its included circular boundary marked.
      caption: The radicand is nonnegative on the disk, including its boundary.
    check:
      id: check-02
      type: multipleChoice
      prompt: Which inequality describes the domain of $p(x,y)=\sqrt{16-x^2-4y^2}$?
      choices:
      - id: a
        text: $x^2+4y^2\le16$
        media: []
        issueSignals: []
      - id: b
        text: $x^2+4y^2<16$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: c
        text: $x^2+4y^2\ge16$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: d
        text: $x^2+4y^2\le4$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Require the radicand to be nonnegative:

        $$16-x^2-4y^2\ge0\quad\Longleftrightarrow\quad x^2+4y^2\le16.$$


        Why it works: The inequality includes every point where the square root is real, including points where the radicand is zero.


        Why the other choices fail:

        Choice b excludes the valid boundary where the radicand is zero.

        Choice c reverses the inequality and selects points outside the ellipse.

        Choice d changes the right side from 16 to 4, shrinking the domain.
