lesson:
  introduction: >
    A function of several variables takes a tuple of inputs and returns one output. Its domain, graph, and level sets are different geometric objects. Work through the representations in order: evaluate a rule, identify where it is defined, then translate its values into geometric language. This lesson is recommended preparation, not a gate to later Calc 3 topics.
  sections:
  - id: s01
    title: One input tuple gives one output
    required: true
    content: >
      In $f(x,y)$, the ordered pair $(x,y)$ is one input. Substitution must preserve which number goes in which slot, and the function returns a single scalar. For example, $g(x,y)=2x-y^2$ sends $(2,-1)$ to $2(2)-(-1)^2=3$. The pair is the input; 3 is the output.
    media:
    - type: image
      src: /media/calculus-3/function-input-output.svg
      alt: The input pair (2, negative 1) passes through the rule 2x minus y squared and produces the scalar output 3.
      caption: A two-variable function maps one ordered pair to one number.
    check:
      id: check-01
      type: multipleChoice
      prompt: For $g(x,y)=2x-y^2$, what is $g(3,-2)$?
      choices:
      - id: a
        text: $2$
        media: []
        issueSignals: []
      - id: b
        text: $8$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: c
        text: $10$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: d
        text: $-10$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Substitute $x=3$ and $y=-2$ in their respective positions:

        $$g(3,-2)=2(3)-(-2)^2=6-4=2.$$


        Why it works: The ordered pair supplies the two inputs, and the rule returns the scalar 2.


        Why the other choices fail:

        Choice b, 8, uses $2(3)-(-2)$ and forgets to square the second input.

        Choice c, 10, changes the subtraction to addition after squaring.

        Choice d, $-10$, changes the coefficient $2x$ to $-2x$ before subtracting the squared input.
