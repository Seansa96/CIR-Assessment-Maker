  - id: s05
    title: Three inputs still produce one scalar
    required: true
    content: >
      A function can depend on three or more inputs while still returning one number. For example, a simple model $T(x,y,t)$ might use two location coordinates and time to return a temperature. The coordinates and time form one ordered input triple; units and context tell you what each slot means. Fixing time gives a two-variable slice of that model.
    media:
    - type: image
      src: /media/calculus-3/three-input-temperature-model.svg
      alt: Two location coordinates and a time value enter a temperature function, which returns one scalar temperature.
      caption: Adding an input changes the tuple's length, not the fact that the function returns one value.
    check:
      id: check-05
      type: multipleChoice
      prompt: A model uses $T(x,y,t)=12+2x-y+3t$. What value does it return at $(1,-2,3)$?
      choices:
      - id: a
        text: $25$
        media: []
        issueSignals: []
      - id: b
        text: $21$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: c
        text: $24$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: d
        text: $16$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Substitute each coordinate in order:

        $$T(1,-2,3)=12+2(1)-(-2)+3(3)=12+2+2+9=25.$$


        Why it works: The three inputs represent the two location coordinates and time, and the output is one scalar.


        Why the other choices fail:

        Choice b, 21, uses $-(-2)=-2$ instead of $+2$.

        Choice c, 24, replaces the term $2x$ with $x$.

        Choice d, 16, omits the time contribution $3t=9$.
