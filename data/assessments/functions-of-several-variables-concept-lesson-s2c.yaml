  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 1 → Sets, Sequences, and Functions if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Inputs form ordered pairs
    required: true
    content: 'A function of two variables assigns one output to each permitted pair $(x,y)$. In Functions of Several Variables, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
