  - id: s04
    title: Fixing an output creates a level curve
    required: true
    content: >
      A level curve in the domain plane consists of all inputs that produce one chosen output $c$. Set $f(x,y)=c$ and solve for the resulting curve. For $f(x,y)=x^2+4y^2$, the level $c=16$ is the ellipse $x^2+4y^2=16$, or $x^2/16+y^2/4=1$. Its semiaxes are 4 in the $x$ direction and 2 in the $y$ direction.
    media:
    - type: image
      src: /media/calculus-3/level-curve-ellipse-k16.svg
      alt: An ellipse with horizontal semiaxis 4 and vertical semiaxis 2 shows the level curve x squared plus 4y squared equals 16.
      caption: Every point on the ellipse gives the same function value, 16.
    check:
      id: check-04
      type: multipleChoice
      prompt: For $q(x,y)=x^2+4y^2$, which normalized equation is the level curve $q(x,y)=16$?
      choices:
      - id: a
        text: $\frac{x^2}{16}+\frac{y^2}{4}=1$
        media: []
        issueSignals: []
      - id: b
        text: $\frac{x^2}{4}+\frac{y^2}{16}=1$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: c
        text: $\frac{x^2}{16}+\frac{y^2}{4}=16$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: d
        text: $x^2+y^2=16$
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Set the function equal to 16, then divide by 16:

        $$x^2+4y^2=16\quad\Longrightarrow\quad\frac{x^2}{16}+\frac{y^2}{4}=1.$$


        Why it works: The right side becomes 1 after dividing the entire equation by the level value; the denominators give the squared semiaxes.


        Why the other choices fail:

        Choice b swaps the horizontal and vertical semiaxes.

        Choice c divides the left side but leaves the right side undivided.

        Choice d drops the coefficient 4 on $y^2$, changing the level curve into a circle.
