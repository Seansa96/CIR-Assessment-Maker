workedExamples:
  - id: limacon-inner-loop-area
    title: Find One Inner-Loop Area
    problem: 'Find the area of the inner loop of $r=1+2\cos\theta$.'
    steps:
      - { id: lia-1, title: 'Find loop endpoints', instruction: 'Set r equal to zero to find consecutive pole crossings.', type: freeResponse, prompt: 'Find the two bounding angles in $[0,2\pi]$.', answer: { gradingMode: selfCheck, keyPoints: ['two pi over three', 'four pi over three'] }, explanation: 'Solution: $1+2\cos\theta=0$ gives cosine theta equals negative one half, so theta equals two pi over three and four pi over three. Why it works: r equals zero reaches the pole. Common trap: Choosing a full period.' }
      - { id: lia-2, title: 'Use the loop area model', instruction: 'The negative-radius interval traces the inner loop once.', type: multipleChoice, prompt: 'Which setup is correct?', choices: [{ id: a, text: '$\frac12\int_{2\pi/3}^{4\pi/3}(1+2\cos\theta)^2d\theta$' }, { id: b, text: '$\int_0^{2\pi}(1+2\cos\theta)d\theta$' }, { id: c, text: '$\frac12\int_0^{2\pi}(1+2\cos\theta)^2d\theta$' }, { id: d, text: '$\int_{2\pi/3}^{4\pi/3}(1+2\cos\theta)d\theta$' }], answer: { choiceId: a }, explanation: 'Solution: Use one half integral r squared on the two consecutive loop zeros. Why it works: Polar area accumulates sectors over the one-loop interval. Common trap: Integrating r rather than r squared. Why the other choices fail: They omit the one-half/square or include the outer loop.' }
      - { id: lia-3, title: 'Validate the trace', instruction: 'A sample angle pi has r negative, confirming opposite-ray inner-loop tracing.', type: freeResponse, prompt: 'Why does negative r not make the area setup invalid?', answer: { gradingMode: selfCheck, keyPoints: ['r squared nonnegative', 'negative radius traces opposite ray', 'interval traces loop'] }, explanation: 'Solution: r squared is nonnegative in the sector formula, and negative radius simply plots on the opposite ray. Why it works: Area depends on radial magnitude while the signed radius determines the trace. Common trap: Dropping the negative-r interval.' }
  - id: between-circle-and-cardioid
    title: Set Up an Area Between Curves
    problem: 'Set up the area inside $r=2\sin\theta$ and outside $r=1$.'
    steps:
      - { id: bcc-1, title: 'Find intersections', instruction: 'Set the two radii equal.', type: freeResponse, prompt: 'Find the relevant intersection angles.', answer: { gradingMode: selfCheck, keyPoints: ['pi over six', 'five pi over six'] }, explanation: 'Solution: $2\sin\theta=1$ gives sine theta equals one half, so theta equals pi over six and five pi over six. Why it works: Boundary switches occur where radial distances match. Common trap: Ignoring the second quadrant solution.' }
      - { id: bcc-2, title: 'Determine radial order', instruction: 'Test theta equals pi over two between the intersections.', type: multipleChoice, prompt: 'Which radius is outer there?', choices: [{ id: a, text: '$2\sin\theta$' }, { id: b, text: '$1$' }], answer: { choiceId: a }, explanation: 'Solution: At pi over two, $2\sin\theta=2$, larger than 1. Why it works: A sample angle establishes outer/inner order on the interval. Common trap: Assuming order without testing. Why the other choice fails: The unit circle is the inner boundary.' }
      - { id: bcc-3, title: 'Write annular-sector setup', instruction: 'Subtract inner sector area from outer sector area.', type: freeResponse, prompt: 'Write the exact area integral.', answer: { gradingMode: selfCheck, keyPoints: ['one half integral pi over six to five pi over six', 'four sine squared theta minus one'] }, explanation: 'Solution: $A=\frac12\int_{\pi/6}^{5\pi/6}[(2\sin\theta)^2-1]d\theta$. Why it works: The region is between radial boundaries. Common trap: Squaring the difference $2\sin\theta-1$.' }
