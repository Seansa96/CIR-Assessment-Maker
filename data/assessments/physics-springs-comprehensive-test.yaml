schemaVersion: 1
id: physics-springs-comprehensive-test
title: Comprehensive Springs Test
assessmentType: test
categoryId: physics-1
subcategoryIds:
- physics-work-energy
modeDefault: test
randomizeQuestions: true
questions:
- id: q-keq-calc
  title: Calculating Keq
  type: symbolicResponse
  prompt: "A $200\\text{ N/m}$ spring and a $300\\text{ N/m}$ spring are connected in series. \nWhat is the equivalent spring constant $k_{eq}$ of the system (in N/m)?\n"
  answer:
    gradingMode: auto
    expectedLatex: 120
    equivalenceMode: expression
    tolerance: 1
  explanation: For series, $1/k_{eq} = 1/200 + 1/300 = 5/600 \implies k_{eq} = 120\text{ N/m}$.
- id: q-shared-concept
  title: Shared Extensions
  type: multipleChoice
  prompt: |
    You are designing a suspension system and need two springs to share the exact same deformation distance when compressed by a plate. How must you arrange them?
  choices:
  - id: a
    text: In series
  - id: b
    text: In parallel
  - id: c
    text: Either arrangement works if they have identical $k$ values.
  answer:
    choiceId: b
  explanation: Parallel springs share the exact same extension geometrically, regardless of their individual spring constants.
- id: q-fbd-forces
  title: Free-Body Diagram Identification
  type: multipleChoice
  prompt: "A block is pushed horizontally against a wall, compressing a spring. The surface is completely frictionless. \nWhich of the following represents the correct forces acting on the block *in the horizontal direction* just as it is released?\n"
  choices:
  - id: a
    text: Spring force pointing away from the wall, normal force pointing away from the wall.
  - id: b
    text: Spring force pointing away from the wall, no other horizontal forces.
  - id: c
    text: Spring force pointing away from the wall, kinetic friction pointing toward the wall.
  answer:
    choiceId: b
  explanation: Since the surface is frictionless, there is no horizontal friction. The wall only pushes on the spring, not the block directly. The only horizontal force on the block is the spring force pushing it away from the wall.
- id: q-equilibrium-calc
  title: Equilibrium Stretch Calculation
  type: symbolicResponse
  prompt: "A $5.0\\text{ kg}$ object hangs from a vertical spring, stretching it $0.25\\text{ m}$ to reach static equilibrium. \nUsing $g = 9.8\\text{ m/s}^2$, calculate the spring constant $k$ (in N/m).\n"
  answer:
    gradingMode: auto
    expectedLatex: 196
    equivalenceMode: expression
    tolerance: 2
  explanation: $\sum F = k\Delta y - mg = 0 \implies k(0.25) = (5.0)(9.8) = 49$. Thus $k = 49 / 0.25 = 196\text{ N/m}$.
- id: q-parallel-force-calc
  title: Force in Parallel Springs
  type: symbolicResponse
  prompt: "Two springs are in parallel supporting a platform. Spring 1 has $k_1 = 400\\text{ N/m}$ and Spring 2 has $k_2 = 600\\text{ N/m}$. \nThe platform is pushed down by $0.15\\text{ m}$. Calculate the force (in Newtons) exerted by Spring 2.\n"
  answer:
    gradingMode: auto
    expectedLatex: 90
    equivalenceMode: expression
    tolerance: 1
  explanation: Parallel springs share the same displacement. The force in Spring 2 is $F_2 = k_2 x = 600(0.15) = 90\text{ N}$.
- id: q-series-stretch-calc
  title: Stretch in Series Springs
  type: symbolicResponse
  prompt: "A $20\\text{ N}$ pulling force is applied to a chain of two springs connected in series. \nIf $k_1 = 100\\text{ N/m}$ and $k_2 = 400\\text{ N/m}$, how much does the *first* spring stretch (in meters)?\n"
  answer:
    gradingMode: auto
    expectedLatex: 0.2
    equivalenceMode: expression
    tolerance: 0.01
  explanation: In series, both springs feel the full $20\text{ N}$ force. $x_1 = F / k_1 = 20 / 100 = 0.20\text{ m}$.
- id: q-energy-calc
  title: Stored Potential Energy
  type: symbolicResponse
  prompt: "A spring with $k = 800\\text{ N/m}$ is compressed by $0.10\\text{ m}$. \nHow much potential energy (in Joules) is stored in the spring?\n"
  answer:
    gradingMode: auto
    expectedLatex: 4.0
    equivalenceMode: expression
    tolerance: 0.1
  explanation: $U_s = \frac{1}{2}kx^2 = \frac{1}{2}(800)(0.10)^2 = 400(0.01) = 4.0\text{ J}$.
- id: q-work-calc
  title: Work Done by a Spring
  type: symbolicResponse
  prompt: |
    A spring ($k = 300\text{ N/m}$) is already stretched $0.10\text{ m}$ from equilibrium. It is then stretched further to $0.30\text{ m}$.
    Calculate the work done *by the spring* (in Joules) during this additional stretch.
  answer:
    gradingMode: auto
    expectedLatex: -12.0
    equivalenceMode: expression
    tolerance: 0.5
  explanation: $W_s = -\Delta U_s = -(\frac{1}{2}(300)(0.30)^2 - \frac{1}{2}(300)(0.10)^2) = -(13.5 - 1.5) = -12.0\text{ J}$.
- id: q-energy-gravity-friction
  title: Launching with Friction
  type: symbolicResponse
  prompt: "A $2.0\\text{ kg}$ block compresses a horizontal spring ($k = 500\\text{ N/m}$) by $0.40\\text{ m}$. \nIt is released and slides across a rough surface ($\\mu_k = 0.25$, $g = 9.8\\text{ m/s}^2$). \nAssuming the block detaches from the spring exactly at the equilibrium point, calculate the block's kinetic energy (in Joules) at the moment it detaches.\n"
  answer:
    gradingMode: auto
    expectedLatex: 38.04
    equivalenceMode: expression
    tolerance: 0.5
  explanation: Initial energy is $U_s = \frac{1}{2}(500)(0.40)^2 = 40\text{ J}$. Friction does work $W_f = -f_k d = -(\mu_k mg)d = -(0.25 \times 2.0 \times 9.8)(0.40) = -1.96\text{ J}$. The final kinetic energy is $40 - 1.96 = 38.04\text{ J}$.
- id: q-stiffness-concept
  title: Series Stiffness
  type: multipleChoice
  prompt: |
    If you take a long spring and cut it perfectly in half, and then connect those two halves in parallel side-by-side, what happens to the overall stiffness compared to the original long spring?
  choices:
  - id: a
    text: The overall stiffness increases.
  - id: b
    text: The overall stiffness decreases.
  - id: c
    text: The overall stiffness remains exactly the same.
  answer:
    choiceId: a
  explanation: Cutting a spring in half doubles its individual spring constant (it is harder to stretch a short spring). Putting those two stiffer springs in parallel adds their constants together, resulting in a system that is $4\times$ stiffer than the original long spring!
