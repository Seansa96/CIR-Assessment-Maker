glossary:
  introduction: Terms linking the projection of uniform circular motion to simple harmonic motion.
  sections:
  - id: shm-circle-terms
    title: Core terms
    entries:
    - {id: reference-circle, term: reference circle, definition: 'The uniform circular motion whose projection represents SHM.', drills: [{id: reference-circle-drill, type: typed, prompt: 'What circle is used to visualize SHM as a projection?', answer: {expected: reference circle}}]}
    - {id: amplitude, term: amplitude, definition: 'The maximum displacement in SHM, equal to reference-circle radius.', drills: [{id: amplitude-drill, type: cloze, prompt: 'Reference-circle radius equals SHM {{amplitude}}.', answer: {expected: amplitude}}]}
    - {id: angular-frequency, term: angular frequency, definition: 'The rotation rate $\omega$, also the SHM angular frequency.', drills: [{id: angular-frequency-drill, type: typed, prompt: 'What symbol denotes angular frequency?', answer: {expected: '\omega'}}]}
    - {id: phase, term: phase, definition: 'The angular location $\omega t+\phi$ that locates the circular particle and SHM state.', drills: [{id: phase-drill, type: cloze, prompt: 'The angle $\omega t+\phi$ is the {{phase}}.', answer: {expected: phase}}]}
