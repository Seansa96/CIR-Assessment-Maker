- id: we002
  title: Scale the input and state the interval
  problem: Expand $(4-x)^{-1/2}$ about $x=0$ and find its open interval of convergence.
  steps:
  - id: step003
    title: Factor the constant
    instruction: Write $(4-x)^{-1/2}=\frac12(1-x/4)^{-1/2}$.
    hint: 
    type: multipleChoice
    prompt: What substituted binomial input should be used?
    choices:
    - id: a
      text: $u=-x/4$
      media: []
      issueSignals: []
    - id: b
      text: $u=-4x$
      media: []
      issueSignals:
      - id: algebraic-simplification-error
        domains: []
    - id: c
      text: $u=x/4$
      media: []
      issueSignals:
      - id: sign-error
        domains: []
    - id: d
      text: $u=4-x$
      media: []
      issueSignals:
      - id: expression-equation-recognition-error
        domains: []
    answer:
      choiceId: a
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: The factor inside the binomial is $1-x/4$, so $u=-x/4$.


      Why it works: Factoring the constant makes the expression match $1+u$.


      Why the other choices fail: They use the wrong scale, sign, or template.
