questions:
- title: Angle Sum Application
  prompt: |-
    In a triangle, two of the interior angles measure $90^\circ$ and $55^\circ$. What is the measure of the third interior angle in degrees?
  type: numericResponse
  answer:
    value: 35.0
    tolerance: 0
  explanation: |-
    The sum of interior angles is $180^\circ$. $180 - 90 - 55 = 35^\circ$.
  skills:
  - geometry-triangles-basics
  id: q-geom-quiz-01
- title: Exterior Angle Theorem
  prompt: |-
    The measures of two remote interior angles of a triangle are $38^\circ$ and $79^\circ$. What is the measure of the corresponding exterior angle in degrees?
  type: numericResponse
  answer:
    value: 117.0
    tolerance: 0
  explanation: |-
    The exterior angle is equal to the sum of the two remote interior angles: $38 + 79 = 117^\circ$.
  skills:
  - geometry-triangles-basics
  id: q-geom-quiz-02
- title: Exterior Angle Theorem
  prompt: |-
