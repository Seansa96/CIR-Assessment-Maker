  skills:
  - geometry-triangles-basics
  id: q-geom-quiz-04
- title: Isosceles Vertex Angle
  prompt: |-
    In an isosceles triangle, one of the base angles measures $77^\circ$. What is the measure of the vertex angle in degrees?
  type: numericResponse
  answer:
    value: 26.0
    tolerance: 0
  explanation: |-
    The two base angles are equal, so their sum is $2 \times 77 = 154^\circ$. The vertex angle is $180 - 154 = 26^\circ$.
  skills:
  - geometry-triangles-basics
  id: q-geom-quiz-05
- title: Exterior Angle Theorem
