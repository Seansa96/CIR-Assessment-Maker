  - { id: br1, type: cloze, prompt: 'Complete: $F_B=\rho_fV_{sub}\underline{\hspace{0.7cm}}$.', answer: { expected: g, expectedLatex: 'g', aliases: [gravity], media: [] }, explanation: 'Solution: Insert $g$.\n\nWhy it works: Buoyant force is displaced-fluid weight.', tags: [force] }
