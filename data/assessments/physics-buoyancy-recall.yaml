  - { id: br5, type: typed, prompt: 'What direction is buoyant force?', answer: { expected: upward, expectedLatex: '', aliases: [up], media: [] }, explanation: 'Solution: It is upward.\n\nWhy it works: Pressure is greater at larger depth.', tags: [direction] }
