  - { id: br3, type: typed, prompt: 'If object density is less than fluid density, does it float or sink?', answer: { expected: float, expectedLatex: '', aliases: [floats], media: [] }, explanation: 'Solution: It floats.\n\nWhy it works: It can balance its weight before fully submerging.', tags: [density] }
