items:
  - id: item-001
    type: flashcard
    prompt: What is electronegativity?
    answer:
      expected: |
      A measure of an atom's ability to attract **bonding electrons** toward itself in a covalent bond.

      Increases going **up** a group and **right** across a period. Highest: F (4.0). Lowest (among main group): Fr (~0.7).
  - id: item-002
    type: flashcard
    prompt: What electronegativity difference (ΔEN) separates nonpolar covalent, polar covalent, and ionic bonds?
    answer:
      expected: |
      - $\Delta EN < 0.4$: **Nonpolar covalent** (electrons shared equally)
      - $0.4 \leq \Delta EN < 2.0$: **Polar covalent** (unequal sharing, partial charges)
      - $\Delta EN \geq 2.0$: **Ionic** (essentially complete transfer)

      *(These are approximate guidelines, not sharp cutoffs.)*
  - id: item-003
    type: flashcard
    prompt: 'Electronegativity values — key elements to know'
    answer:
      expected: |
      | Element | EN |
      |---|---|
      | F | 4.0 |
      | O | 3.5 |
      | Cl | 3.2 |
      | N | 3.0 |
      | S | 2.6 |
      | C | 2.5 |
      | H | 2.1 |
      | Na | 0.9 |
      | K | 0.8 |
  - id: item-004
    type: flashcard
    prompt: 'CO₂ — polar or nonpolar? Why?'
    answer:
      expected: |
      **Nonpolar** ($\mu = 0$ D)

      Each C=O bond is polar ($\Delta EN = 1.0$), but the **linear geometry** (180°) causes the two equal bond dipoles to point in exactly opposite directions and cancel completely.

      Polar bonds + symmetric geometry = nonpolar molecule.
  - id: item-005
    type: flashcard
    prompt: 'H₂O — polar or nonpolar? Why?'
    answer:
      expected: |
      **Polar** ($\mu = 1.85$ D — one of the largest small-molecule dipoles)

      Both O—H bonds are polar ($\Delta EN = 1.4$). The **bent geometry** (~104.5°) means the two bond dipoles point toward O and reinforce each other instead of canceling.

      Polar bonds + asymmetric geometry = polar molecule.
  - id: item-006
    type: flashcard
    prompt: 'CCl₄ vs CHCl₃ — which is polar?'
    answer:
      expected: |
      - **$CCl_4$**: Nonpolar — perfect tetrahedral symmetry, four equal C—Cl dipoles cancel.
      - **$CHCl_3$**: Polar — one C—H bond breaks the symmetry; the four bond dipoles don't cancel.

      Substituting one atom destroys the symmetry → net dipole appears.
  - id: item-007
    type: flashcard
    prompt: 'BF₃ vs NF₃ — which is polar?'
    answer:
      expected: |
      - **$BF_3$**: Nonpolar — trigonal planar (AX₃E₀), three equal B—F dipoles cancel at 120°.
      - **$NF_3$**: Polar — trigonal pyramidal (AX₃E₁), the lone pair on N breaks the symmetry; dipoles don't cancel.

      The lone pair on the central atom is the key structural difference.
  - id: item-008
    type: flashcard
    prompt: What does "like dissolves like" mean in terms of molecular polarity?
    answer:
      expected: |
      **Polar** solvents (e.g., $H_2O$) dissolve **polar** and **ionic** solutes — the dipole or ion-dipole interactions are strong enough to overcome the solute's lattice/intermolecular forces.

      **Nonpolar** solvents (e.g., hexane, $CCl_4$) dissolve **nonpolar** solutes — London dispersion forces between nonpolar molecules are the dominant interaction.

      Polar and nonpolar solvents do not mix with each other.
  - id: item-009
    type: flashcard
    prompt: 'In which direction does the dipole arrow point?'
    answer:
      expected: |
      The dipole arrow points from the **partial positive end** ($\delta^+$) toward the **partial negative end** ($\delta^-$).

      $$\delta^+ \longrightarrow \delta^-$$

      It points in the direction that electrons are shifted (toward the more electronegative atom).
  - id: item-010
    type: flashcard
    prompt: Give three examples of polar molecules and three examples of nonpolar molecules.
    answer:
      expected: |
      **Polar:**
      - $H_2O$ (bent)
      - $NH_3$ (trigonal pyramidal)
      - $HCl$ (linear, only one bond — cannot cancel)

      **Nonpolar:**
      - $CO_2$ (linear, symmetric)
      - $CCl_4$ (tetrahedral, symmetric)
      - $SF_6$ (octahedral, symmetric)

