title: Second Law of Thermodynamics Glossary
assessmentType: glossary
categoryId: physics-2
topicId: physics2-second-law-thermodynamics
glossary:
  introduction: Vocabulary for modeling, calculation, and interpretation.
  sections:
  - id: terms
    title: Core terms
    required: true
    content: Use definitions to distinguish quantities, processes, and assumptions.
    entries:
    - id: t01
      term: Heat Engine
      definition: A device that converts thermal energy into mechanical work through
        a cyclic process.
    - id: t02
      term: Carnot Cycle
      definition: An ideal, reversible thermodynamic cycle consisting of two isothermal
        and two adiabatic processes. It provides the maximum possible efficiency for
        a heat engine.
    - id: t03
      term: Entropy
      definition: A state variable that quantifies the degree of disorder or multiplicity
        of microscopic states in a system. Its change for a reversible process is
        $dS = dQ/T$.
    - id: t04
      term: Thermal Efficiency
      definition: The ratio of the net work done by a heat engine to the heat absorbed
        from the hot reservoir ($W/Q_h$).
    - id: t05
      term: Coefficient of Performance (COP)
      definition: A measure of the effectiveness of a refrigerator or heat pump, defined
        as the ratio of the desired heat transfer to the required work input.
