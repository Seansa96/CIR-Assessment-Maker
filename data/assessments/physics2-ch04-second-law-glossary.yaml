    - id: t01
      term: Heat Engine
      definition: A device that converts thermal energy into mechanical work through a cyclic process.
      drills:
      - id: t01-drill
        type: flashcard
        prompt: What does Heat Engine mean?
        answer:
          expected: A device that converts thermal energy into mechanical work through a cyclic process.
        explanation: 'Solution:


          A device that converts thermal energy into mechanical work through a cyclic process.


          Why it works:


          This definition identifies the essential meaning of Heat Engine.'
        tags: []
    - id: t02
      term: Carnot Cycle
      definition: An ideal, reversible thermodynamic cycle consisting of two isothermal and two adiabatic
        processes. It provides the maximum possible efficiency for a heat engine.
      drills:
      - id: t02-drill
        type: flashcard
        prompt: What does Carnot Cycle mean?
        answer:
          expected: An ideal, reversible thermodynamic cycle consisting of two isothermal and two adiabatic
            processes. It provides the maximum possible efficiency for a heat engine.
        explanation: 'Solution:


          An ideal, reversible thermodynamic cycle consisting of two isothermal and two adiabatic processes.
          It provides the maximum possible efficiency for a heat engine.


          Why it works:


          This definition identifies the essential meaning of Carnot Cycle.'
        tags: []
    - id: t03
      term: Entropy
      definition: A state variable that quantifies the degree of disorder or multiplicity of microscopic
        states in a system. Its change for a reversible process is $dS = dQ/T$.
      drills:
      - id: t03-drill
        type: flashcard
        prompt: What does Entropy mean?
        answer:
          expected: A state variable that quantifies the degree of disorder or multiplicity of microscopic
            states in a system. Its change for a reversible process is $dS = dQ/T$.
        explanation: 'Solution:


          A state variable that quantifies the degree of disorder or multiplicity of microscopic states
          in a system. Its change for a reversible process is $dS = dQ/T$.


          Why it works:


          This definition identifies the essential meaning of Entropy.'
        tags: []
    - id: t04
      term: Thermal Efficiency
      definition: The ratio of the net work done by a heat engine to the heat absorbed from the hot reservoir
        ($W/Q_h$).
      drills:
      - id: t04-drill
        type: flashcard
        prompt: What does Thermal Efficiency mean?
        answer:
          expected: The ratio of the net work done by a heat engine to the heat absorbed from the hot
            reservoir ($W/Q_h$).
        explanation: 'Solution:


          The ratio of the net work done by a heat engine to the heat absorbed from the hot reservoir
          ($W/Q_h$).


          Why it works:


          This definition identifies the essential meaning of Thermal Efficiency.'
        tags: []
    - id: t05
      term: Coefficient of Performance (COP)
      definition: A measure of the effectiveness of a refrigerator or heat pump, defined as the ratio
        of the desired heat transfer to the required work input.
      drills:
