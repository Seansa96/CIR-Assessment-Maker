  visualRationale: Fluid levels and pressure comparisons are spatial relationships.
lesson:
  introduction: A manometer converts a pressure difference into a measurable height difference in a connected fluid.
  sections:
  - id: equal-depth
    title: Equal depth means equal pressure
    content: |
      In one continuous fluid at rest, two points at the same height have the same pressure. If they did not, fluid would flow until the pressures balanced. This is the key rule for connected tubes.
    media:
    - type: image
      src: /media/physics/owa/open-tube-manometer.svg
      alt: Open U-tube manometer with one side connected to a gas source and a labeled height difference.
      caption: The vertical height difference records a pressure difference.
  - id: hydrostatic
    title: Relate height to pressure
    content: |
      Moving downward a vertical distance $h$ in a fluid of density $\rho$ increases pressure by $\rho gh$. The relationship compares points in the same static fluid; horizontal travel at one height does not change pressure.
  - id: gauge
    title: Distinguish gauge and absolute pressure
    content: |
      Gauge pressure is measured relative to atmospheric pressure:

      $$p_{\text{gauge}}=p_{\text{absolute}}-p_{\text{atm}}.$$

      A tire gauge reads zero at atmospheric pressure even though the air still has nonzero absolute pressure.
  - id: open-tube
    title: Read an open-tube manometer
    content: |
      One arm is open to atmosphere. If the gas-connected side is lower, the gas pressure is greater than atmospheric pressure by $\rho gh$. If it is higher, the gas pressure is lower by $\rho gh$.
  - id: sign
    title: Use the fluid motion to set the sign
    content: |
      Ask which side pushes the manometer liquid down. The side with greater pressure has the lower surface. This physical check prevents reversing the sign in $p_{\text{gas}}=p_{\text{atm}}\pm\rho gh$.
  - id: units
    title: Keep pressure units consistent
    content: |
      Use SI units in $\rho gh$: density in $\text{kg/m}^3$, height in m, and $g$ in $\text{m/s}^2$ produce Pa. A height difference of millimeters must be converted to meters before using the formula.
  - id: limits
    title: State the model limits
    content: |
      This ideal model assumes a static liquid of known density and negligible capillary effects. It compares pressures at the liquid surfaces; it does not require the tube arms to have the same diameter.
