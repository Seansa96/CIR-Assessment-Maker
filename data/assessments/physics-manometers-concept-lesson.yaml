  - id: hydrostatic
    title: Relate height to pressure
    required: true
    content: >
      Moving downward a vertical distance $h$ in a fluid of density $\rho$ increases pressure by $\rho gh$. The relationship compares points in the same static fluid; horizontal travel at one height does not change pressure.
    media: []
    check:
      id: mc2
      type: multipleChoice
      prompt: 'Moving downward in a static fluid changes pressure by:'
      choices:
      - id: a
        text: $\rho gh$
        media: []
        issueSignals: []
      - id: b
        text: $\rho/h$
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: The change is $\rho gh$.\n\nWhy it works: Hydrostatic pressure is linear in depth.\n\nWhy the other choices fail: Inverse depth is not the hydrostatic relation.'
      media: []
      language: 
