  - id: gauge
    title: Distinguish gauge and absolute pressure
    required: true
    content: >
      Gauge pressure is measured relative to atmospheric pressure:


      $$p_{\text{gauge}}=p_{\text{absolute}}-p_{\text{atm}}.$$


      A tire gauge reads zero at atmospheric pressure even though the air still has nonzero absolute pressure.
    media: []
    check:
      id: mc3
      type: multipleChoice
      prompt: 'Gauge pressure equals absolute pressure minus:'
      choices:
      - id: a
        text: atmospheric pressure
        media: []
        issueSignals: []
      - id: b
        text: zero
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Subtract atmospheric pressure.\n\nWhy it works: Gauge pressure is referenced to atmosphere.\n\nWhy the other choices fail: Absolute pressure is nonzero at atmosphere.'
      media: []
