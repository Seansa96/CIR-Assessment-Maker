  - id: limits
    title: State the model limits
    required: true
    content: >
      This ideal model assumes a static liquid of known density and negligible capillary effects. It compares pressures at the liquid surfaces; it does not require the tube arms to have the same diameter.
    media: []
    check:
      id: mc7
      type: multipleChoice
      prompt: 'The basic manometer model assumes the liquid is:'
      choices:
      - id: a
        text: static
        media: []
        issueSignals: []
      - id: b
        text: turbulent
        media: []
        issueSignals: []
