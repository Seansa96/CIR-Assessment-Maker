  - id: sign
    title: Use the fluid motion to set the sign
    required: true
    content: >
      Ask which side pushes the manometer liquid down. The side with greater pressure has the lower surface. This physical check prevents reversing the sign in $p_{\text{gas}}=p_{\text{atm}}\pm\rho gh$.
    media: []
    check:
      id: mc5
      type: multipleChoice
      prompt: 'The side with greater pressure has the liquid surface:'
      choices:
      - id: a
        text: lower
        media: []
        issueSignals: []
      - id: b
        text: higher
        media: []
        issueSignals: []
