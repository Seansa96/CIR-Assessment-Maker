  - id: open-tube
    title: Read an open-tube manometer
    required: true
    content: >
      One arm is open to atmosphere. If the gas-connected side is lower, the gas pressure is greater than atmospheric pressure by $\rho gh$. If it is higher, the gas pressure is lower by $\rho gh$.
    media: []
    check:
      id: mc4
      type: multipleChoice
      prompt: 'If the gas side is lower in an open U-tube, gas pressure is:'
      choices:
      - id: a
        text: greater than atmospheric
        media: []
        issueSignals: []
      - id: b
        text: less than atmospheric
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: It is greater.\n\nWhy it works: Higher pressure pushes the liquid down on its side.\n\nWhy the other choices fail: Lower pressure leaves its side higher.'
