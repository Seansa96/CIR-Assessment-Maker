        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: It is lower.\n\nWhy it works: Greater pressure pushes down harder.\n\nWhy the other choices fail: A higher surface indicates less pressure on that side.'
