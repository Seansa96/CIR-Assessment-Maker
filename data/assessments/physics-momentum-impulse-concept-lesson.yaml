lesson:
  introduction: Momentum and Impulse
  sections:
  - id: sec-q001
    title: Linear Momentum
    content: |
      **Linear Momentum**

      The linear momentum $\vec{p}$ of an object is defined as the product of its mass and velocity:

      $$
      \vec{p} = m\vec{v}
      $$

      Because velocity is a vector, momentum is also a vector pointing in the same direction as the velocity. The SI unit of momentum is $\text{kg} \cdot \text{m/s}$.

      Suppose a $1000\ \text{kg}$ car is moving north at $20\ \text{m/s}$ and a $2000\ \text{kg}$ truck is moving north at $10\ \text{m/s}$. How do their momenta compare?
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: c1
        text: The car has more momentum because it is faster.
      - id: c2
        text: The truck has more momentum because it is heavier.
      - id: c3
        text: They have the exact same momentum.
      - id: c4
        text: They have the same magnitude of momentum, but in different directions.
      answer:
        choiceId: c3
        gradingMode: auto
      explanation: |
        Car momentum: $p_{\text{car}} = (1000\ \text{kg})(20\ \text{m/s}) = 20000\ \text{kg} \cdot \text{m/s}$ north.
        Truck momentum: $p_{\text{truck}} = (2000\ \text{kg})(10\ \text{m/s}) = 20000\ \text{kg} \cdot \text{m/s}$ north.
        Both have the same magnitude and direction, so their momentum vectors are identical!
  - id: sec-q002
    title: Newton's Second Law Revisited
    content: |
      **Newton's Second Law Revisited**

      We normally write Newton's Second Law as $\sum \vec{F} = m\vec{a}$. However, Newton originally stated it in terms of momentum: The net force on an object is equal to the rate of change of its momentum.

      $$
      \sum \vec{F} = \frac{d\vec{p}}{dt}
      $$

      If the mass is constant, we can pull $m$ out of the derivative: $\frac{d}{dt}(m\vec{v}) = m\frac{d\vec{v}}{dt} = m\vec{a}$, which gets us back to our familiar equation. But the momentum version is more general because it works even if the object's mass is changing (like a rocket burning fuel).

      If a constant net force of $50\ \text{N}$ is applied to an object for $3.0\ \text{s}$, what is the change in the object's momentum?
    check:
      id: check-q002
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: c1
        text: $50\ \text{kg} \cdot \text{m/s}$
      - id: c2
        text: $150\ \text{kg} \cdot \text{m/s}$
      - id: c3
        text: $16.7\ \text{kg} \cdot \text{m/s}$
      - id: c4
        text: It depends on the mass of the object.
      answer:
        choiceId: c2
        gradingMode: auto
      explanation: |
        From $\sum \vec{F} = \frac{\Delta \vec{p}}{\Delta t}$, we can rearrange to find $\Delta \vec{p} = \sum \vec{F} \Delta t$.
        $\Delta p = (50\ \text{N})(3.0\ \text{s}) = 150\ \text{N} \cdot \text{s}$.
        Note that $\text{N} \cdot \text{s}$ is perfectly equivalent to $\text{kg} \cdot \text{m/s}$.
  - id: sec-q003
    title: Impulse
    content: |
      **Impulse**

      The product of the average force and the time interval over which it acts is called **Impulse** ($\vec{J}$). If the force varies with time, impulse is the integral of force over time (the area under the Force vs Time curve):

      $$
      \vec{J} = \int_{t_1}^{t_2} \sum \vec{F} dt
      $$

      The **Impulse-Momentum Theorem** states that the impulse acting on an object is exactly equal to its change in momentum: $\vec{J} = \Delta \vec{p}$.

      When catching a fast-moving baseball, a catcher pulls their hand backward while making the catch. How does this use the Impulse-Momentum Theorem to reduce the sting?
    check:
      id: check-q003
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: c1
        text: It decreases the total impulse required to stop the ball.
      - id: c2
        text: It decreases the change in momentum of the ball.
      - id: c3
        text: It increases the time $\Delta t$ over which the ball stops, which decreases
          the average force required.
      - id: c4
        text: It increases the ball's final momentum, causing less force.
      answer:
        choiceId: c3
        gradingMode: auto
      explanation: |
        The ball comes in with momentum $p_i$ and ends with $p_f = 0$. The required change in momentum ($\Delta p$), and therefore the required impulse ($\vec{J}$), is fixed regardless of\rhow you catch it. Since $\vec{J} = \vec{F}_{\text{avg}} \Delta t$, increasing the time $\Delta t$ of the collision significantly lowers the average force $\vec{F}_{\text{avg}}$ acting on the catcher's hand.
  - id: sec-q004
    title: Conservation of Momentum
    content: |
      **Conservation of Momentum**

      If the net external force on a system of particles is zero ($\sum \vec{F}_{\text{ext}} = 0$), then the total momentum of the system cannot change ($\frac{d\vec{P}}{dt} = 0$). This is the Law of Conservation of Momentum:

      $$
      \vec{P}_i = \vec{P}_f
      $$

      This principle is incredibly powerful during collisions or explosions because the internal forces between the interacting objects are equal and opposite (Newton's Third Law) and cancel each other out. If a bomb explodes mid-air, what happens to the total momentum of the pieces immediately after the explosion?
    check:
      id: check-q004
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: c1
        text: The total momentum is zero because the pieces fly in all directions.
      - id: c2
        text: The total momentum is greater because of the energy released.
      - id: c3
        text: The total momentum vector exactly equals the momentum vector of the
          bomb right before it exploded.
      answer:
        choiceId: c3
        gradingMode: auto
      explanation: |
        The explosion forces are entirely internal to the bomb system. Since there is no net external impulse during the split-second of the explosion, the total momentum vector $\vec{P}_{\text{total}}$ is exactly conserved.
