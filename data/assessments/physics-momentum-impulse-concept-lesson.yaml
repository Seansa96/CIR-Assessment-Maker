  - id: conservation
    title: 6. Choose a system before conserving momentum
    required: true
    content: When net external impulse on a system is negligible, $\vec P_i=\vec P_f$. Include all colliding objects so collision forces are internal; define an axis and retain signs.
    media: []
    check:
      id: mom-c006
      type: multipleChoice
      prompt: For two carts colliding on a nearly frictionless track, which system best supports momentum conservation during the collision?
      choices:
      - id: a
        text: Both carts together
        media: []
        issueSignals: []
      - id: b
        text: Only the cart that is initially moving
        media: []
        issueSignals:
        - id: open-system-conservation
          domains:
          - physics-1
      - id: c
        text: Only the cart that is initially still
        media: []
        issueSignals:
        - id: open-system-conservation
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: auto
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Use both carts as the system.\n\nWhy it works: Their collision forces then occur internally and cancel in the system sum.\n\nWhy the other choices fail: Each single-cart system receives a large external collision impulse from the omitted cart.'
      media: []
