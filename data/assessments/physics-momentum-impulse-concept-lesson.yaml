  - id: force
    title: 3. Connect force to momentum change
    required: true
    content: Newton's second law in momentum form is $\sum\vec F=d\vec p/dt$. A net force changes momentum in its own direction.
    media: []
    check:
      id: mom-c003
      type: multipleChoice
      prompt: What quantity is the net force equal to?
      choices:
      - id: a
        text: The rate of change of momentum
        media: []
        issueSignals: []
      - id: b
        text: Momentum divided by mass
        media: []
        issueSignals:
        - id: force-momentum-confusion
          domains:
          - physics-1
      - id: c
        text: Momentum times time
        media: []
        issueSignals:
        - id: force-impulse-confusion
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: auto
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: $\sum\vec F=d\vec p/dt$.\n\nWhy it works: Force measures how rapidly momentum changes.\n\nWhy the other choices fail: Choice b is velocity; c does not have force units.'
      media: []
      language: 
