  - id: impulse
    title: 4. Calculate impulse
    required: true
    content: Impulse is $\vec J=\int\sum\vec F\,dt=\Delta\vec p$. For a constant force, $\vec J=\vec F\Delta t$; on a force-time graph it is the signed area.
    media: []
    check:
      id: mom-c004
      type: multipleChoice
      prompt: A constant $12$ N force acts rightward for $0.50$ s. What is the impulse?
      choices:
      - id: a
        text: $+6.0$ N s
        media: []
        issueSignals: []
      - id: b
        text: $+24$ N s
        media: []
        issueSignals:
        - id: impulse-time-division
          domains:
          - physics-1
      - id: c
        text: $+12$ N
        media: []
        issueSignals:
        - id: impulse-missing-time
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: auto
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: $J=(12)(0.50)=+6.0$ N s.\n\nWhy it works: Constant-force impulse is force multiplied by duration.\n\nWhy the other choices fail: Choice b divides by time; c omits the time interval and has force units only.'
      media: []
      language: 
