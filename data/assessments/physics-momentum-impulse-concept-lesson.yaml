  - id: types
    title: 7. Distinguish collision types
    required: true
    content: For a closed system, total momentum is conserved in elastic, inelastic, and perfectly inelastic collisions. Kinetic energy is conserved only in elastic collisions; objects that stick together undergo a perfectly inelastic collision.
    media: []
    check:
      id: mom-c007
      type: multipleChoice
      prompt: Two carts collide and remain attached. Which statement is correct for an isolated system?
      choices:
      - id: a
        text: Momentum is conserved and kinetic energy decreases
        media: []
        issueSignals: []
      - id: b
        text: Both momentum and kinetic energy are conserved
        media: []
        issueSignals:
        - id: inelastic-ke-conservation
          domains:
          - physics-1
      - id: c
        text: Momentum is not conserved because they stick
        media: []
        issueSignals:
        - id: sticking-breaks-momentum
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: auto
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: A sticking collision is perfectly inelastic: momentum is conserved but kinetic energy decreases.\n\nWhy it works: Internal collision forces preserve total momentum while deformation and heat reduce kinetic energy.\n\nWhy the other choices fail: Kinetic energy is not conserved in a perfectly inelastic collision, and sticking does not break momentum conservation.'
