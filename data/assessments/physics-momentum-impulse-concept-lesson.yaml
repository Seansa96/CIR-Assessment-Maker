glossary: 
lesson:
  introduction: Momentum tracks mass in motion; impulse explains how force changes it; conservation links all members of an appropriately chosen collision system.
  sections:
  - id: momentum
    title: 1. Define signed momentum
    required: true
    content: 'Momentum is a vector: $\vec p=m\vec v$. With a chosen positive axis, direction is carried by the sign and the SI unit is kg m/s.'
    media: []
    check:
      id: mom-c001
      type: multipleChoice
      prompt: A 3.0 kg cart moves left at 2.0 m/s, with right positive. What is its momentum?
      choices:
      - id: a
        text: $-6.0$ kg m/s
        media: []
        issueSignals: []
      - id: b
        text: $+6.0$ kg m/s
        media: []
        issueSignals:
        - id: momentum-sign-error
          domains:
          - physics-1
      - id: c
        text: $1.5$ kg m/s
        media: []
        issueSignals:
        - id: divided-by-mass
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: auto
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: $p=(3.0)(-2.0)=-6.0$ kg m/s.\n\nWhy it works: Momentum has the same direction as velocity.\n\nWhy the other choices fail: Choice b loses direction; c divides instead of multiplying.'
      media: []
      language: 
      functionName: 
      executionMode: unspecified
