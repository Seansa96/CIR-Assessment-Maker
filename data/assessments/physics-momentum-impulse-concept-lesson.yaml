  - id: total
    title: 2. Add momentum as a vector
    required: true
    content: For a system, $\vec P=\sum_i\vec p_i$. In one dimension add signed momenta; in two dimensions add matching components before finding any magnitude.
    media: []
    check:
      id: mom-c002
      type: multipleChoice
      prompt: Two equal carts have momenta $+8$ and $-8$ kg m/s. What is system momentum?
      choices:
      - id: a
        text: $0$ kg m/s
        media: []
        issueSignals: []
      - id: b
        text: $16$ kg m/s
        media: []
        issueSignals:
        - id: momentum-magnitude-addition
          domains:
          - physics-1
      - id: c
        text: $8$ kg m/s
        media: []
        issueSignals:
        - id: ignored-object
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: auto
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: $P=+8+(-8)=0$ kg m/s.\n\nWhy it works: Opposite signed vectors cancel.\n\nWhy the other choices fail: Choice b adds magnitudes, and c omits one cart.'
      media: []
      language: 
