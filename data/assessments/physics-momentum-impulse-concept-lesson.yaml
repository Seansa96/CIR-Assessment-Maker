  - id: cushioning
    title: 5. Use impulse to explain cushioning
    required: true
    content: Stopping an object fixes its momentum change. Extending the stopping time decreases average force because $F_{\mathrm{avg}}=\Delta p/\Delta t$.
    media: []
    check:
      id: mom-c005
      type: multipleChoice
      prompt: Why does bending your knees reduce average landing force for the same landing speed?
      choices:
      - id: a
        text: It increases stopping time for the same momentum change
        media: []
        issueSignals: []
      - id: b
        text: It makes the required momentum change zero
        media: []
        issueSignals:
        - id: impulse-change-zero
          domains:
          - physics-1
      - id: c
        text: It eliminates gravity
        media: []
        issueSignals:
        - id: external-force-elimination
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: auto
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Longer stopping time lowers the average force.\n\nWhy it works: The needed impulse remains the same while $\Delta t$ increases.\n\nWhy the other choices fail: Stopping still changes momentum, and gravity is not eliminated.'
