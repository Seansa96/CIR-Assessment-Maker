questions:
- id: q001
  type: numericResponse
  prompt: Use Euler for $y'=x-y$, $y(0)=1$, with $h=0.25$. After two steps, what is $y_2$?
  skills:
  - ede-ch03-numerical-methods-euler-updates
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  - representationTransfer
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-euler-updates
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 0.625
    tolerance: 0.0001
  explanation: |-
    Solution: $y_1=1+0.25(-1)=0.75$; then $f(0.25,0.75)=-0.5$ and $y_2=0.75-0.125=0.625$.

    Why it works: Each update uses the new mesh point and state.
  prerequisiteObjectiveIds:
  - ede-ch02-first-order-equations-linear-ivps
  extensionObjectiveIds:
  - ede-ch04-first-order-applications-growth-decay
- id: q002
  type: numericResponse
  prompt: From $(x_n,y_n)=(1,2)$, take one Euler step of size $0.1$ for $y'=x^2+y$. Find $y_{n+1}$.
  skills:
  - ede-ch03-numerical-methods-euler-updates
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-euler-updates
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 2.3
    tolerance: 0.0001
  explanation: |-
    Solution: $f(1,2)=3$, so $y_{n+1}=2+0.1(3)=2.3$.

    Why it works: The nonautonomous slope uses both coordinates of the current state.
- id: q003
  type: selectAll
  prompt: Select every correct distinction between local truncation error and global error.
  skills:
  - ede-ch03-numerical-methods-error-step-size
  media: []
  difficultyDimensions:
  - constraintTracking
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-error-step-size
  difficultyEvidence: Requires checking several statements independently against the differential equation and its
    conditions.
  choices:
  - id: a
    text: Local error analyzes one step begun from exact data.
  - id: b
    text: Global error includes accumulated effects at a mesh point.
  - id: c
    text: Local and global error are always numerically equal.
    issueSignals:
    - id: ede-numerical-local-global-error
      domains: &id001
      - elementary-differential-equations-bvp
  - id: d
    text: Global error can be assessed without identifying the endpoint.
    issueSignals:
    - id: ede-numerical-local-global-error
      domains: *id001
  answer:
    choiceIds:
    - a
    - b
  explanation: |-
    Solution: The first two statements are correct.

    Why it works: The two errors differ in starting state and accumulation across steps.

    Why the other choices fail: Every unselected statement violates a stated equation, condition, or theorem hypothesis.
- id: q004
  type: numericResponse
  prompt: Euler endpoint errors are $0.080$ for $h=0.2$ and $0.040$ for $h=0.1$. What is the ratio of the larger
    error to the smaller?
  skills:
  - ede-ch03-numerical-methods-error-step-size
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-error-step-size
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 2
    tolerance: 0.0001
  explanation: |-
    Solution: $0.080/0.040=2$.

    Why it works: A factor near two under step halving is consistent with first-order global convergence.
- id: q005
  type: numericResponse
  prompt: For $y'=x+y$, $y(0)=0$, take one Heun step with $h=0.5$. Find the corrected value.
  skills:
  - ede-ch03-numerical-methods-improved-euler
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-improved-euler
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 0.125
    tolerance: 0.0001
  explanation: |-
    Solution: $k_1=0$, the predictor is $0$, and $k_2=f(0.5,0)=0.5$; hence $y_1=0+0.25(0+0.5)=0.125$.

    Why it works: Heun averages the starting and predicted endpoint slopes.
- id: q006
  type: numericResponse
  prompt: Use the explicit midpoint method for $y'=x-y$, $y(0)=2$, with $h=0.2$. Find $y_1$.
  skills:
  - ede-ch03-numerical-methods-improved-euler
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-improved-euler
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 1.66
    tolerance: 0.0001
  explanation: |-
    Solution: The midpoint state is $2+0.1(-2)=1.8$ at $x=0.1$; its slope is $-1.7$, so $y_1=2+0.2(-1.7)=1.66$.

    Why it works: The midpoint slope, not an endpoint predictor slope, controls the full update.
- id: q007
  type: numericResponse
  prompt: For one RK4 step on $y'=x+y$ from $(0,1)$ with $h=0.2$, $k_1=1$, $k_2=1.2$, and $k_3=1.22$. Find $k_4$.
  skills:
  - ede-ch03-numerical-methods-runge-kutta
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-runge-kutta
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 1.444
    tolerance: 0.0001
  explanation: |-
    Solution: $k_4=f(0.2,1+0.2(1.22))=f(0.2,1.244)=1.444$.

    Why it works: The endpoint stage uses the state generated from $k_3$.
- id: q008
  type: numericResponse
  prompt: An RK4 step has $y_n=2$, $h=0.2$, and slopes $k_1=2$, $k_2=2.2$, $k_3=2.22$, $k_4=2.444$. Find $y_{n+1}$.
  skills:
  - ede-ch03-numerical-methods-runge-kutta
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-runge-kutta
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 2.4428
    tolerance: 0.0001
  explanation: |-
    Solution: $y_{n+1}=2+\frac{0.2}{6}(2+4.4+4.44+2.444)=2.4428$.

    Why it works: RK4 uses the weighted slope sum $1,2,2,1$.
- id: q009
  type: multipleChoice
  prompt: At $x=1$, a reference value is $2.71828$. Method A gives $2.70$ using 10 evaluations; Method B gives $2.719$
    using 40 evaluations. Which statement is defensible?
  skills:
  - ede-ch03-numerical-methods-method-comparison
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-method-comparison
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: Method B is more accurate here, while Method A is cheaper by the stated cost measure.
  - id: b
    text: Method B is always preferable for every tolerance.
    issueSignals:
    - id: ede-numerical-cost-comparison-error
      domains: *id001
  - id: c
    text: Method A is more accurate because it uses fewer evaluations.
    issueSignals:
    - id: ede-numerical-reference-error
      domains: *id001
  - id: d
    text: No comparison is possible even though a common reference is supplied.
    issueSignals:
    - id: ede-numerical-reference-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: Method B has smaller endpoint error, while Method A uses fewer evaluations.

    Why it works: Accuracy and cost are separate quantities and both were measured on the same target.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q010
  type: selectAll
  prompt: Two solvers reach the same endpoint. Select all information needed for a fair cost-accuracy comparison.
  skills:
  - ede-ch03-numerical-methods-method-comparison
  media: []
  difficultyDimensions:
  - constraintTracking
  - errorDiagnosis
  - representationTransfer
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-method-comparison
  difficultyEvidence: Requires checking several statements independently against the differential equation and its
    conditions.
  choices:
  - id: a
    text: A common reference or error estimate
  - id: b
    text: The total number of right-hand-side evaluations
  - id: c
    text: The same requested endpoint and IVP
  - id: d
    text: Only the method names
    issueSignals:
    - id: ede-numerical-cost-comparison-error
      domains: *id001
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: |-
    Solution: Use the same task, a common accuracy measure, and comparable computational cost.

    Why it works: Raw step counts are insufficient when methods use different numbers of stages.

    Why the other choices fail: Every unselected statement violates a stated equation, condition, or theorem hypothesis.
  prerequisiteObjectiveIds:
  - ede-ch02-first-order-equations-linear-ivps
  extensionObjectiveIds:
  - ede-ch04-first-order-applications-growth-decay
- id: q011
  type: multipleChoice
  prompt: A forecast is computed with Euler at $h=0.2$ and $h=0.1$. What is the most defensible use of the two results?
  skills:
  - ede-ch03-numerical-methods-method-comparison
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  - representationTransfer
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-method-comparison
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: Compare their endpoint difference as convergence evidence, without treating it as proof of the exact error.
  - id: b
    text: Declare the fine result exact.
    issueSignals:
    - id: ede-numerical-reference-error
      domains: *id001
  - id: c
    text: Use the coarse result because it has fewer rows.
    issueSignals:
    - id: ede-numerical-step-size-error
      domains: *id001
  - id: d
    text: Subtract the step sizes instead of the approximations.
    issueSignals:
    - id: ede-numerical-local-global-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: The difference is evidence about step-size sensitivity, not an exact-error certificate.

    Why it works: Without an exact reference or rigorous estimate, refinement supports but does not prove accuracy.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  prerequisiteObjectiveIds:
  - ede-ch02-first-order-equations-linear-ivps
  extensionObjectiveIds:
  - ede-ch04-first-order-applications-growth-decay
- id: q012
  type: multipleChoice
  prompt: An RK4 program evaluates four stage slopes per step. What comparison reports computational cost honestly?
  skills:
  - ede-ch03-numerical-methods-method-comparison
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  - representationTransfer
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-method-comparison
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: Compare total evaluations of $f$ together with endpoint error.
  - id: b
    text: Compare only the number of time steps.
    issueSignals:
    - id: ede-numerical-cost-comparison-error
      domains: *id001
  - id: c
    text: Count RK4 as one evaluation per step.
    issueSignals:
    - id: ede-rk4-stage-location-error
      domains: *id001
  - id: d
    text: Ignore accuracy whenever costs differ.
    issueSignals:
    - id: ede-numerical-cost-comparison-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: Report function evaluations and error on the same task.

    Why it works: Each RK4 step contains four right-hand-side evaluations, so step count alone understates its work.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  prerequisiteObjectiveIds:
  - ede-ch02-first-order-equations-linear-ivps
  extensionObjectiveIds:
  - ede-ch04-first-order-applications-growth-decay
