title: Power Series Family Tree Glossary
assessmentType: glossary
categoryId: calculus-2
topicId: power-series
modeDefault: practice
randomizeQuestions: true
skills:
  - Apply Power Series and Representations
navigation:
  learningGoal: learn
  activityType: glossary
  tags: [calculus-2, power-series, geometric-series, known-series, series-transformations]
glossary:
  introduction: |
    Use these terms to recognize a template, choose a valid transformation, and retain its convergence condition.
  sections:
    - id: family-tree-terms
      title: Templates and Operations
      required: true
      content: A compact vocabulary for building new power-series representations from known ones.
      entries:
        - id: geometric-series-template
          term: Geometric Series Template
          definition: |
            The root representation is

            $$
            \frac{1}{1-x}=\sum_{n=0}^{\infty}x^n,
            $$

            for $|x|<1$.
          notation: '$\frac{1}{1-x}=\sum_{n=0}^{\infty}x^n$'
          examples: ['Replace $x$ by $-x$ to represent $1/(1+x)$.']
          tags: [geometric-series, known-series]
          drills:
            - id: family-tree-geometric-cloze
              type: cloze
              prompt: 'Complete the denominator of the root template: $\frac{1}{1-\square}$.'
              answer: { expected: x }
              explanation: The geometric input is $x$ in the root template.
              tags: [geometric-series]
        - id: substitution
          term: Series Substitution
          definition: Replacing the input variable in every term of a known series by the same new expression.
          notation: '$u=g(x)$'
          examples: ['In $e^u$, set $u=-x^2$ to obtain a series for $e^{-x^2}$.']
          tags: [substitution, series-transformations]
          drills:
            - id: family-tree-substitution-typed
              type: typed
              prompt: What must be replaced consistently in a known series during substitution?
              answer: { expected: every occurrence of the input, aliases: [every x, the input variable, each occurrence of x] }
              explanation: Substitution changes the input throughout the series and its convergence condition.
              tags: [substitution]
        - id: termwise-differentiation
          term: Termwise Differentiation
          definition: Differentiating each term of a power series inside its interval of convergence.
          notation: '$\frac{d}{dx}\sum x^n=\sum n x^{n-1}$'
          examples: ['Differentiate the geometric series to obtain $1/(1-x)^2$.']
          tags: [differentiation, series-transformations]
          drills:
            - id: family-tree-differentiation-recognition
              type: recognition
              prompt: 'Which operation introduces the coefficient $n$ in $\sum_{n=1}^{\infty}n x^{n-1}$?'
              choices: [{ id: a, text: Differentiate }, { id: b, text: Integrate }, { id: c, text: Shift the center }, { id: d, text: Test an endpoint }]
              answer: { choiceId: a, expected: Differentiate }
              explanation: The power rule brings the old exponent down as a coefficient.
              tags: [differentiation]
        - id: termwise-integration
          term: Termwise Integration
          definition: Integrating each term of a power series inside its interval of convergence and determining the constant from a known value when needed.
          notation: '$\int\sum x^n\,dx=\sum\frac{x^{n+1}}{n+1}+C$'
          examples: ['Integrate the series for $1/(1+x)$ to obtain $\ln(1+x)$.']
          tags: [integration, series-transformations]
          drills:
            - id: family-tree-integration-cloze
              type: cloze
              prompt: 'Termwise integration of $x^n$ creates the denominator ____.'
              answer: { expected: n+1, aliases: ['n + 1'] }
              explanation: The antiderivative is $x^{n+1}/(n+1)$.
              tags: [integration]
        - id: standard-maclaurin-library
          term: Standard Maclaurin Library
          definition: The recurring templates for $e^x$, $\sin x$, $\cos x$, and $\arctan x$ that are efficient to recognize directly.
          notation: '$e^x,\ \sin x,\ \cos x,\ \arctan x$'
          examples: ['Replace $x$ by $-x^2$ in $e^x$ to represent $e^{-x^2}$.']
          tags: [maclaurin-series, known-series]
          drills:
            - id: family-tree-library-flashcard
              type: flashcard
              prompt: Name the four standard Maclaurin templates in this library.
              answer: { expected: '$e^x$, $\sin x$, $\cos x$, and $\arctan x$.' }
              explanation: These functions are useful root templates alongside the geometric series.
              tags: [maclaurin-series]
        - id: transformed-convergence-condition
          term: Transformed Convergence Condition
          definition: The original convergence condition rewritten using the substituted input.
          notation: '$|u|<1\ \Rightarrow\ |g(x)|<1$'
          examples: ['For $u=3x$, $|u|<1$ becomes $|x|<1/3$.']
          tags: [interval-of-convergence, substitution]
          drills:
            - id: family-tree-condition-cloze
              type: cloze
              prompt: 'If $u=x^3$ and $|u|<1$, then the interior condition is $|x|<____$.'
              answer: { expected: 1 }
              explanation: $|x^3|<1$ holds exactly when $|x|<1$.
              tags: [interval-of-convergence]
