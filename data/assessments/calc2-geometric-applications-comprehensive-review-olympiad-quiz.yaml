questions:
- id: q001
  type: freeResponse
  skills:
  - geometric-applications-comprehensive-review
  - olympiad-problem-solving
  prompt: Find the area between $y=3x-x^2$ and the $x$-axis.
  answer:
    gradingMode: selfCheck
    expected: $\frac{27}{6}$.
    keyPoints:
    - 'Matches the reference result: $\frac{27}{6}$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: The zeros are 0 and $3$ and the parabola is nonnegative between them. Therefore $A=\int_0^3(3x-x^2)dx=27/6$.
