- id: q004
  title: Explain Deadlock detection
  type: freeResponse
  prompt: 'In a short answer, explain why **Deadlock detection** matters in Deadlocks.

    '
  answer:
    expected: 'Detection allows deadlock to happen, then identifies it for recovery. A complete answer should also note that
      detection requires a recovery policy.

      '
    gradingMode: selfCheck
