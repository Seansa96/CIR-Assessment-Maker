questions:
- id: q001
  title: Recognize Deadlock condition
  type: multipleChoice
  prompt: 'Which statement best describes **Deadlock condition** in operating systems?

    '
  choices:
  - id: a
    text: Deadlock occurs when a set of processes cannot proceed because each waits for resources held by others.
  - id: b
    text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
  - id: c
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: d
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  answer:
    choiceId: a
  explanation: 'Deadlock occurs when a set of processes cannot proceed because each waits for resources held by others. The
    distractors either ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
