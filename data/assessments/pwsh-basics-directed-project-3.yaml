guidedProject: null
directedProject:
  summary: "PowerShell extends the file system to other data stores using PSDrives. You will explore your Environment Variables and Registry as if they were normal folders."
  estimatedTimeMinutes: 20
  resources: []
  phases:
    - id: phase-1-env
      title: "Exploring Environment Variables"
      steps:
        - id: step-1-env-drive
          title: "Navigate the Env: Drive"
          instruction: |
            1. Open PowerShell.
            2. Run `Set-Location Env:\` to enter the Environment Variables PSDrive.
            3. Run `Get-ChildItem` to list all environment variables.
            4. Try reading a specific variable, like the Path, by running `Get-Item Path`.
          checklist:
            - id: chk-env-loc
              text: "Navigated to the Env:\\ drive"
            - id: chk-env-ls
              text: "Listed environment variables using Get-ChildItem"
          resources: []
    - id: phase-2-registry
      title: "Exploring the Registry"
      steps:
        - id: step-2-reg-drive
          title: "Navigate the HKLM: Drive"
          instruction: |
            1. Run `Set-Location HKLM:\` to enter the HKEY_LOCAL_MACHINE registry hive.
            2. Run `Get-ChildItem` to see the top-level registry keys (HARDWARE, SOFTWARE, SYSTEM, etc.).
            3. Run `Set-Location SOFTWARE` and run `Get-ChildItem` again.
            4. Finally, run `Set-Location C:\` to return to your normal file system.
          checklist:
            - id: chk-reg-loc
              text: "Navigated to the HKLM:\\ drive"
            - id: chk-reg-return
              text: "Returned to the C:\\ drive safely"
          resources: []
