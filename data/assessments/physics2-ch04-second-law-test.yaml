questions:
- id: q001
  type: numericResponse
  difficultyDimensions:
  - calculation-complexity
  - multiple-steps
  prompt: A Carnot engine has an efficiency of $25.0\%$. If it absorbs $2000\text{
    J}$ of heat from the hot reservoir, how much work does it perform (in Joules)?
  answer:
    numericValue: 500
    tolerance: 1
  explanation: 'Solution:

    1) Use the definition of efficiency: $e = \frac{W}{Q_h}$.

    2) Substitute the known values: $0.25 = \frac{W}{2000\text{ J}}$.

    3) Solve for $W$: $W = 0.25 \times 2000 = 500\text{ J}$.


    Why it works:

    The efficiency represents the fraction of input heat that is successfully converted
    into useful work.'
- id: q002
  type: numericResponse
  difficultyDimensions:
  - conceptual-mapping
  - calculation-complexity
  prompt: An ideal Carnot refrigerator operates between an interior temperature of
    $270\text{ K}$ and a room temperature of $300\text{ K}$. What is its coefficient
    of performance (COP)?
  answer:
    numericValue: 9
    tolerance: 0.1
  explanation: 'Solution:

    1) For a Carnot refrigerator, the COP is given by $K = \frac{T_c}{T_h - T_c}$.

    2) Substitute the temperatures: $K = \frac{270}{300 - 270} = \frac{270}{30} =
    9$.


    Why it works:

    The COP represents the ratio of heat removed from the cold reservoir to the work
    required to remove it. A higher COP means better performance.'
