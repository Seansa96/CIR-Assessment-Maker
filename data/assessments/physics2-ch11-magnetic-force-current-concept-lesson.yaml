      explanation: >
        Solution: During name the model and quantities for Magnetic Force on Currents & Torque, first identify the wire segment direction, apply the right-hand rule, and calculate only the perpendicular component. Then apply F = I L cross B with one consistent coordinate system and solve for the requested quantity.


        Why it works: F = I L cross B connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
