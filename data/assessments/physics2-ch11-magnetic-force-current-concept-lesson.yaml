schemaVersion: 1
id: physics2-ch11-magnetic-force-current-concept-lesson
title: Magnetic Force on Currents & Torque
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-magnetic-forces-fields
workedExamples:
- id: l2-sec1
  title: Force on a Current-Carrying Wire
  explanation: 'Since current is a flow of charges, a magnetic field exerts a force
    on a current-carrying wire: $\vec{F}_B = I\vec{L} \times \vec{B}$, where $\vec{L}$
    points in the direction of the current.'
- id: l2-sec2
  title: Torque on a Current Loop
  explanation: 'A current loop with magnetic dipole moment $\vec{\mu} = I\vec{A}$
    placed in a uniform magnetic field experiences a torque: $\vec{\tau} = \vec{\mu}
    \times \vec{B}$. This is the principle behind electric motors.'
