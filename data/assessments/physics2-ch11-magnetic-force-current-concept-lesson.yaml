lesson:
  introduction: >
    This lesson develops a repeatable way to solve Magnetic Force on Currents & Torque problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch11-magnetic-force-current-s1
    title: Name the model and quantities
    required: true
    content: >
      Magnetic Force on Currents & Torque uses F = I L cross B. In the name the model and quantities stage, identify the wire segment direction, apply the right-hand rule, and calculate only the perpendicular component.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Magnetic Force on Currents & Torque problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch11-magnetic-force-current-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Magnetic Force on Currents & Torque, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use F = I L cross B after you identify the wire segment direction, apply the right-hand rule, and calculate only the perpendicular component.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Magnetic Force on Currents & Torque problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch11-magnetic-force-current-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables F = I L cross B relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch11-magnetic-force-current-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Magnetic Force on Currents & Torque.
        media: []
        issueSignals:
        - id: physics2-physics2-ch11-magnetic-force-current-units-error
          domains:
          - physics-2
      answer:
