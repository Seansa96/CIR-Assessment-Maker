    - id: term-polar-coordinates
      term: Polar Coordinates
      recallDrills:
      - id: recall-polar-coordinates
        prompt: Define or explain the concept of Polar Coordinates.
        answer:
          gradingMode: selfCheck
          expected: A two-dimensional coordinate system in which each point on a plane
            is determined by a distance from a reference point and an angle from a
            reference direction.
      definition: A definition for this term.
      drills:
      - id: drill-term-polar-coordinates
        type: flashcard
        prompt: What is Polar Coordinates?
        answer:
          expected: A definition for this term.
    - id: term-cardioid
      term: Cardioid
      recallDrills:
      - id: recall-cardioid
        prompt: Define or explain the concept of Cardioid.
        answer:
          gradingMode: selfCheck
          expected: A somewhat heart-shaped curve that is the locus of a point on
            the circumference of a circle rolling around another circle of the same
            radius.
      definition: A definition for this term.
      drills:
      - id: drill-term-cardioid
        type: flashcard
        prompt: What is Cardioid?
        answer:
          expected: A definition for this term.
