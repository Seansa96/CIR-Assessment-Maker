      recallDrills:
      - id: recall-parametric-equations
        prompt: Define or explain the concept of Parametric Equations.
        answer:
          gradingMode: selfCheck
          expected: A set of equations that express a set of quantities as explicit
            functions of a number of independent variables, known as parameters.
      definition: A definition for this term.
      drills:
