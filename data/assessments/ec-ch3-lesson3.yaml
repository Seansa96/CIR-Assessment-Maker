  problem: 'Review the following concept:'
  steps:
  - id: step1
    title: 'Measuring Resistance: Wheatstone Bridge'
    instruction: 'A Wheatstone Bridge is a circuit used to measure unknown resistance
      by balancing two legs of a bridge circuit. When balanced, no current flows through
      the galvanometer: $R_1/R_2 = R_3/R_x$.'
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l3-sec2
  title: Delta-Wye (Pi-Tee) Transformations
  problem: 'Review the following concept:'
  steps:
  - id: step2
    title: Delta-Wye (Pi-Tee) Transformations
    instruction: 'Some circuits cannot be simplified using series/parallel combinations.
      We can convert a Delta ($\Delta$) network to a Wye (Y) network using: $R_1 =
      (R_b R_c) / (R_a + R_b + R_c)$.'
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
