- id: q001
  type: numericResponse
  skills:
  - physics-wave-mathematics
  prompt: A laboratory ripple tank generates water waves of length 19.33 m at a frequency
    of 26.0 Hz. What is the angular frequency omega in rad/s?
  answer:
    value: 163.3628
    tolerance: 0.05
  explanation: omega = 2*pi*f = 2*pi*26.0 = 163.3628 rad/s.
- id: q002
  type: numericResponse
  skills:
  - physics-wave-mathematics
  prompt: A tensioned cable vibrates with wavelength 15.41 m when driven at 61.0 Hz.
    What is the wave number k in rad/m?
  answer:
    value: 0.4077
    tolerance: 0.05
  explanation: k = 2*pi / lambda = 2*pi / 15.41 = 0.4077 rad/m.
