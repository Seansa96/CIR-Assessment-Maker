questions:
- id: q001
  type: numericResponse
  prompt: A wave has angular frequency 24 rad/s and wave number 3.0 rad/m. What speed in m/s follows from $v=\omega/k$?
  answer: { value: 8, tolerance: 0.1 }
  explanation: |
    Solution: $v=\omega/k=24/3.0=8.0$ m/s.

    Why it works: The angular phase parameters give speed as temporal phase rate divided by spatial phase rate.
  difficultyDimensions: [modelOrDerivation, representationTransfer, unitAnalysis]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]
- id: q002
  type: numericResponse
  prompt: A wave travels at 18 m/s with frequency 6.0 Hz. What wave number in rad/m does it have?
  answer: { value: 2.0944, tolerance: 0.01 }
  explanation: |
    Solution: $\lambda=v/f=18/6.0=3.0$ m, then $k=2\pi/\lambda=2.0944$ rad/m.

    Why it works: Wave speed first determines wavelength from frequency; wave number then converts wavelength to spatial phase rate.
  difficultyDimensions: [multiStep, modelCombination, unitConversion]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]
- id: q003
  type: multipleChoice
  prompt: For $y=A\sin(kx-\omega t)$, which direction does the wave pattern travel?
  choices:
  - { id: a, text: Positive x direction }
  - { id: b, text: Negative x direction }
  - { id: c, text: It does not travel. }
  - { id: d, text: It travels only upward. }
  answer: { choiceId: a }
  explanation: |
    Solution: Positive x direction.

    Why it works: Keeping $kx-\omega t$ constant gives $x=(\omega/k)t+\text{constant}$, which increases with time.

    Why the other choices fail: A plus sign between $kx$ and $\omega t$ would indicate negative x propagation; a nonzero phase speed rules out the other choices.
  difficultyDimensions: [symbolicManipulation, representationTransfer, signConvention]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]
- id: q004
  type: symbolicResponse
  prompt: Starting from $v=f\lambda$, enter wavelength $\lambda$ in terms of wave speed $v$ and period $T$.
  answer: { expectedLatex: 'v*T', equivalenceMode: expression, variables: [v, T], tolerance: 0.000001 }
  explanation: |
    Solution: Since $f=1/T$, $v=(1/T)\lambda$, so $\lambda=vT$.

    Why it works: Substituting the reciprocal relation between frequency and period gives the distance the wave travels in one cycle.
  difficultyDimensions: [symbolicManipulation, modelCombination, reverseReasoning]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]

