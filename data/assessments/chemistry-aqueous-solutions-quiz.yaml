modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: numericResponse
  prompt: 'What is the molarity of a solution made by dissolving 2.50 mol of NaCl
    in enough water to make 5.00 L of solution?

    '
  answer:
    value: 0.5
    tolerance: 0.005
  explanation: 'M = moles / volume (L) = 2.50 mol / 5.00 L = 0.500 M.

    '
- id: q002
  type: numericResponse
  prompt: 'How many grams of KCl (M = 74.55 g/mol) are required to prepare 250.0 mL
    of a 0.200 M solution?

    '
  answer:
    value: 3.73
    tolerance: 0.05
  explanation: 'n = M × V = 0.200 mol/L × 0.2500 L = 0.0500 mol. m = 0.0500 mol ×
    74.55 g/mol = 3.7275 g ≈ 3.73 g.

    '
- id: q003
  type: multipleChoice
  prompt: 'Which of the following compounds is a weak electrolyte in aqueous solution?

    '
  choices:
  - id: a
    text: HC2H3O2 (acetic acid)
  - id: b
    text: HCl (hydrochloric acid)
  - id: c
    text: NaCl (sodium chloride)
  - id: d
    text: C12H22O11 (sucrose)
  answer:

    choiceId: a
  explanation: 'Acetic acid is a weak acid, meaning it only partially dissociates
    into ions, making it a weak electrolyte. HCl and NaCl are strong electrolytes,
    and sucrose is a nonelectrolyte.

    '
- id: q004
  type: numericResponse
  prompt: 'You have 100.0 mL of a 2.00 M HCl stock solution. You add water until the
    final volume is 500.0 mL. What is the new molarity?

    '
  answer:
    value: 0.4
    tolerance: 0.005
  explanation: 'M1V1 = M2V2. (2.00 M)(100.0 mL) = M2(500.0 mL). M2 = 200.0 / 500.0
    = 0.400 M.

    '
- id: q005
  type: multipleChoice
  prompt: 'When a strong electrolyte like CaCl2 dissolves in water, what is the best
    description of the resulting species in solution?

    '
  choices:
  - id: a
    text: Ca2+(aq) and Cl-(aq) ions, completely dissociated.
  - id: b
    text: Intact CaCl2 molecules.
  - id: c
    text: Ca+(aq) and Cl2-(aq) ions.
  - id: d
    text: Ca(s) metal and Cl2(g) gas.
  answer:

    choiceId: a
  explanation: 'Strong electrolytes completely dissociate into their constituent ions
    when dissolved in water. CaCl2 dissociates into one Ca2+ ion and two Cl- ions.

    '
- id: q006
  type: numericResponse
  prompt: 'What volume (in mL) of 12.0 M HNO3 is needed to prepare 2.00 L of 0.150
    M HNO3?

    '
  answer:
    value: 25.0
    tolerance: 0.5
  explanation: 'M1V1 = M2V2. (12.0 M)(V1) = (0.150 M)(2.00 L). V1 = 0.300 / 12.0 =
    0.0250 L = 25.0 mL.

    '
- id: q007
  type: multipleChoice
  prompt: 'Why is water such an effective solvent for ionic compounds?

    '
  choices:
  - id: a
    text: Water molecules are polar and can form hydration shells around both cations
      and anions.
  - id: b
    text: Water molecules are nonpolar and easily slip between the ions.
  - id: c
    text: Water reacts chemically with ionic compounds to form new, soluble substances.
  - id: d
    text: Water's high boiling point allows it to melt ionic crystals.
  answer:

    choiceId: a
  explanation: 'Water is a highly polar molecule. The partially negative oxygen end
    attracts cations, and the partially positive hydrogen end attracts anions, pulling
    the crystal lattice apart (hydration).

    '
- id: q008
  type: selectAll
  prompt: 'Which of the following would you expect to be a nonelectrolyte? Select
    all that apply.

    '
  choices:
  - id: a
    text: C2H5OH (ethanol, an alcohol)
  - id: b
    text: KOH (potassium hydroxide)
  - id: c
    text: C6H12O6 (glucose)
  - id: d
    text: HNO3 (nitric acid)
  - id: e
    text: CH4 (methane)
  answer:

    choiceIds:
    - a
    - c
    - e
  explanation: 'Ethanol, glucose, and methane are molecular compounds that do not
    ionize in water (nonelectrolytes). KOH is a strong base (strong electrolyte),
    and HNO3 is a strong acid (strong electrolyte).

    '
- id: q009
  type: numericResponse
  prompt: 'Calculate the concentration of chloride ions (Cl-) in a 0.150 M solution
    of MgCl2.

    Assume complete dissociation.

    '
  answer:
    value: 0.3
    tolerance: 0.005
  explanation: 'MgCl2 → Mg2+ + 2Cl-. The concentration of Cl- is twice the concentration
    of MgCl2. [Cl-] = 2 × 0.150 M = 0.300 M.

    '
- id: q010
  type: multipleChoice
  prompt: 'A student needs to make a 1.0 M solution of NaOH. They measure 40.0 g of
    NaOH (1.0 mol) and add exactly 1.0 L of water to it. What is the problem with
    this procedure?

    '
  choices:
  - id: a
    text: Molarity is defined as moles of solute per liter of SOLUTION, not solvent.
      Adding 1.0 L of water to the solid will result in a total volume slightly greater
      than 1.0 L, so the molarity will be slightly less than 1.0 M.
  - id: b
    text: Molarity uses kilograms of solvent, not liters.
  - id: c
    text: 40.0 g of NaOH is 2.0 moles, not 1.0 mole.
  - id: d
    text: The NaOH will not dissolve in that much water.
  answer:

    choiceId: a
  explanation: 'Molarity is moles of solute / liters of *solution*. To make exactly
    1.0 L of a 1.0 M solution, the solute should be dissolved in a smaller amount
    of water, and then more water is added until the *total volume* reaches exactly
    1.0 L.

    '
