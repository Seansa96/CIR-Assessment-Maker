- id: q001
  type: numericResponse
  skills:
  - physics-simple-harmonic-motion
  prompt: An industrial suspension system features a spring of 44.7 N/m supporting a load of 8.61 kg. What is the period of oscillation in seconds?
  answer:
    value: 2.7576
    tolerance: 0.05
  explanation: 'Solution: T = 2*pi*sqrt(m/k) = 2*pi*sqrt(8.61/44.7) = 2.7576 s.


    Why it works: The stated model applies under the prompt conditions, and the result is checked against its units and constraints.'
  difficultyDimensions:
