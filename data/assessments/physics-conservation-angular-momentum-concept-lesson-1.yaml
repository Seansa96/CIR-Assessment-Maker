lesson:
  introduction: This lesson covers the primary definitions and equations governing
    Conservation Angular Momentum.
  sections:
  - id: sec-1
    title: Defining Conservation Angular Momentum
    content: The physics of Conservation Angular Momentum requires a solid understanding
      of both rotational kinematics and dynamics. The core principles mirror linear
      mechanics but account for radial distribution of mass and rotational axes. For
      example, torque relates to angular acceleration via $\tau = I\alpha$.
    media: []
    check:
      id: chk-physics-conservation-angular-momentum-1
      type: multipleChoice
      prompt: Which of the following best describes a key principle of Conservation
        Angular Momentum?
      choices:
      - id: a
        text: It depends strictly on linear mass alone.
      - id: b
        text: It involves the relationship between forces, torques, and mass distribution.
      - id: c
        text: It is independent of the axis of rotation.
      answer:
        choiceId: b
      explanation: Rotational mechanics always heavily relies on mass distribution
        and torques.
  - id: sec-2
    title: Mathematical Formulas
    content: The mathematical framework often relies on cross products and integrals.
      Ensuring consistent units (radians for angular measures) is critical. $L = I\omega$
      and $\tau = \vec{r} \times \vec{F}$ are foundational.
    media: []
    check:
      id: chk-physics-conservation-angular-momentum-2
      type: multipleChoice
      prompt: What unit is essential when using rotational kinematic formulas?
      choices:
      - id: a
        text: Degrees
      - id: b
        text: Radians
      - id: c
        text: Revolutions
      answer:
        choiceId: b
      explanation: Radians are the natural mathematical unit tying arc length to radius.
  - { id: cal1-3, title: External torque condition, content: 'Total angular momentum is conserved when net external torque is zero.', check: { id: calc13, type: multipleChoice, prompt: 'Angular momentum conservation requires net external torque:', choices: [{ id: a, text: 'zero' }, { id: b, text: 'constant but nonzero' }], answer: { choiceId: a }, explanation: 'Solution: It must be zero.\n\nWhy it works: $\tau_{ext}=dL/dt$.\n\nWhy the other choices fail: Nonzero torque changes angular momentum.' } }
  - { id: cal1-4, title: Inertia-speed tradeoff, content: 'With conserved $L=I\omega$, decreasing inertia increases angular speed.', check: { id: calc14, type: multipleChoice, prompt: 'A skater pulls arms inward. Angular speed:', choices: [{ id: a, text: 'increases' }, { id: b, text: 'decreases' }], answer: { choiceId: a }, explanation: 'Solution: It increases.\n\nWhy it works: Smaller $I$ requires larger $\omega$ at fixed $L$.\n\nWhy the other choices fail: That would reduce angular momentum.' } }
  - { id: cal1-5, title: System boundary, content: 'Choose a system before deciding whether a torque is external.', check: { id: calc15, type: multipleChoice, prompt: 'A force between two parts of one system is:', choices: [{ id: a, text: 'internal' }, { id: b, text: 'external' }], answer: { choiceId: a }, explanation: 'Solution: It is internal.\n\nWhy it works: Both interacting objects are inside the boundary.\n\nWhy the other choices fail: External forces come from outside the system.' } }
  - { id: cal1-6, title: Axis choice, content: 'Angular momentum and torque are defined relative to a selected axis or origin.', check: { id: calc16, type: multipleChoice, prompt: 'Changing reference axis can change:', choices: [{ id: a, text: 'angular momentum value' }, { id: b, text: 'mass' }], answer: { choiceId: a }, explanation: 'Solution: It can change angular momentum.\n\nWhy it works: $\vec L=\vec r\times\vec p$ uses position relative to the axis.\n\nWhy the other choices fail: Mass is intrinsic to the object.' } }
  - { id: cal1-7, title: Conservation equation, content: 'For an isolated rotating system, $L_i=L_f$.', check: { id: calc17, type: multipleChoice, prompt: 'Which equation represents angular momentum conservation?', choices: [{ id: a, text: '$L_i=L_f$' }, { id: b, text: '$I_i=I_f$' }], answer: { choiceId: a }, explanation: 'Solution: Use $L_i=L_f$.\n\nWhy it works: Angular momentum, not inertia alone, is conserved.\n\nWhy the other choices fail: Inertia can change shape-dependently.' } }
