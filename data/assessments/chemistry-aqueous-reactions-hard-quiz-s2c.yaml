questions:
  - { id: q001, type: freeResponse, prompt: 'Mix 50.0 mL 0.20 M AgNO3 with 75.0 mL 0.10 M NaCl. Identify the limiting ion and write the net ionic equation.', answer: { gradingMode: selfCheck, keyPoints: ['Cl− limiting: 0.00750 mol versus 0.0100 mol Ag+', 'Ag+ + Cl− → AgCl(s)'] }, explanation: 'Solution: Ag+ moles are 0.0500×0.20=0.0100 mol; Cl− moles are 0.0750×0.10=0.00750 mol, so Cl− limits. The net ionic equation is Ag+(aq)+Cl−(aq)→AgCl(s). Why it works: Compare reactive-ion moles after dissociation, then retain only the ions forming the precipitate. Common trap: Calling the smaller listed molarity limiting without considering volume.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Combines molarity conversion, limiting comparison, and net-ion representation.', prerequisiteObjectiveIds: [net-ionic-equations], extensionObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: hard-agcl-limiting-ion-net, variationAxes: { scenario: unequal-volume mixing, unknown: limiting ion and net equation, methodBranch: stoichiometric comparison } }
  - { id: q002, type: freeResponse, prompt: 'A student writes Na2CO3(aq)+CaCl2(aq)→CaCO3(aq)+2NaCl(aq). Identify and repair every chemically relevant error.', answer: { gradingMode: selfCheck, keyPoints: ['CaCO3 must be solid', 'molecular equation otherwise balanced', 'net ionic Ca2+ + CO3 2− → CaCO3(s)'] }, explanation: 'Solution: The precipitate must be CaCO3(s), so the molecular equation is Na2CO3(aq)+CaCl2(aq)→CaCO3(s)+2NaCl(aq). Its net ionic form is Ca2+(aq)+CO3 2−(aq)→CaCO3(s). Why it works: Solubility determines phase; sodium and chloride are spectators. Common trap: Balancing atoms but omitting the phase change that drives the reaction.', difficultyDimensions: [errorDiagnosis, representationTransfer, proofJustification], difficultyEvidence: 'Audits phase information, transforms equation representations, and justifies spectator removal.', prerequisiteObjectiveIds: [complete-ionic-equations], extensionObjectiveIds: [spectator-ion-cancellation], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: hard-repair-carbonate-equation, variationAxes: { scenario: student equation, unknown: multiple corrections, methodBranch: phase plus net ionic } }
  - { id: q003, type: freeResponse, prompt: 'Predict whether mixing NH4Cl(aq) and NaNO3(aq) gives a precipitate, gas, weak electrolyte, or no net reaction. Explain.', answer: { gradingMode: selfCheck, keyPoints: ['no net reaction', 'all ions remain aqueous', 'no driving product'] }, explanation: 'Solution: There is no net reaction: NH4+, Cl−, Na+, and NO3− remain dissolved. Why it works: No insoluble solid, gas, water, or weak electrolyte is formed. Common trap: Assuming double replacement always creates a reaction.', difficultyDimensions: [casePartition, modelOrDerivation, proofJustification], difficultyEvidence: 'Evaluates product possibilities against all reaction-driving branches and justifies no change.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: hard-no-reaction-driving-force-analysis, variationAxes: { scenario: ammonium nitrate mixture, unknown: reaction class, constraints: all soluble } }
  - { id: q004, type: freeResponse, prompt: 'Write molecular, complete ionic, and net ionic equations for Pb(NO3)2(aq)+2KI(aq).', answer: { gradingMode: selfCheck, keyPoints: ['Pb(NO3)2+2KI→PbI2(s)+2KNO3', 'split aqueous salts only', 'Pb2+ + 2I− → PbI2(s)'] }, explanation: 'Solution: Molecular: Pb(NO3)2(aq)+2KI(aq)→PbI2(s)+2KNO3(aq). Complete ionic: Pb2++2NO3−+2K++2I−→PbI2(s)+2K++2NO3−. Net ionic: Pb2++2I−→PbI2(s). Why it works: Split soluble salts, retain the solid, then cancel unchanged K+ and NO3−. Common trap: Splitting PbI2(s) into aqueous ions.', difficultyDimensions: [modelOrDerivation, representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Builds three linked equation forms while preserving coefficients and phases.', prerequisiteObjectiveIds: [complete-ionic-equations], extensionObjectiveIds: [spectator-ion-cancellation], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: hard-three-form-lead-iodide, variationAxes: { representation: molecular-complete-net, unknown: three equation forms, governingRelation: solubility } }
  - { id: q005, type: freeResponse, prompt: 'Explain why HCl(aq)+NaOH(aq) is not treated as “no reaction” even though Na+ and Cl− are spectators.', answer: { gradingMode: selfCheck, keyPoints: ['H+ + OH− → H2O', 'water remains intact', 'spectators do not erase net change'] }, explanation: 'Solution: The net ionic reaction is H+(aq)+OH−(aq)→H2O(l); Na+ and Cl− cancel, but H+ and OH− form liquid water. Why it works: A net ionic equation retains the species that change, not every initial ion. Common trap: Canceling all ions and overlooking water formation.', difficultyDimensions: [casePartition, representationTransfer, errorDiagnosis], difficultyEvidence: 'Separates spectator cancellation from the acid-base product branch.', prerequisiteObjectiveIds: [net-ionic-equations], extensionObjectiveIds: [acid-base-reaction-models], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0410], reasoningSignature: hard-neutralization-not-no-reaction, variationAxes: { scenario: neutralization, methodBranch: weak-electrolyte product, unknown: net-change rationale } }
  - { id: q006, type: freeResponse, prompt: 'A complete ionic equation contains 2Na+(aq) on both sides but only one SO4 2− on the reactant side. Can Na+ be canceled before the equation is repaired? Explain.', answer: { gradingMode: selfCheck, keyPoints: ['no', 'equation must be balanced first', 'cancellation requires identical balanced species'] }, explanation: 'Solution: No. First repair and balance the molecular/complete ionic equation; only then can identical Na+ terms be canceled. Why it works: Cancellation is bookkeeping on a balanced representation, not a substitute for atom and charge conservation. Common trap: Canceling matching-looking terms in an unbalanced equation.', difficultyDimensions: [errorDiagnosis, domainCondition, proofJustification], difficultyEvidence: 'Identifies a sequencing condition for valid equation manipulation and justifies conservation requirements.', prerequisiteObjectiveIds: [complete-ionic-equations], extensionObjectiveIds: [spectator-ion-cancellation], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: hard-balance-before-cancel, variationAxes: { scenario: malformed equation, unknown: valid procedure order, methodBranch: error diagnosis } }
  - { id: q007, type: freeResponse, prompt: 'Mix MgCl2(aq) and NaOH(aq). Predict the precipitate, then write its net ionic equation.', answer: { gradingMode: selfCheck, keyPoints: ['Mg(OH)2(s)', 'Mg2+ + 2OH− → Mg(OH)2(s)'] }, explanation: 'Solution: Magnesium hydroxide is the precipitate: Mg2+(aq)+2OH−(aq)→Mg(OH)2(s). Why it works: Magnesium hydroxide is insoluble, and charge balance requires two hydroxides per Mg2+. Common trap: Writing MgOH or leaving hydroxide coefficient at one.', difficultyDimensions: [modelOrDerivation, identityConstruction, representationTransfer], difficultyEvidence: 'Constructs a charge-balanced product formula and converts it to net ionic form.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: hard-hydroxide-precipitate-net, variationAxes: { scenario: hydroxide precipitation, unknown: formula and net equation, governingRelation: charge balance } }
  - { id: q008, type: freeResponse, prompt: 'Why does a particle diagram with dispersed Na+, Cl−, K+, and NO3− only represent a no-reaction mixture, even if the beaker labels changed?', answer: { gradingMode: selfCheck, keyPoints: ['same particles before and after', 'no new phase or species', 'labels do not create chemical change'] }, explanation: 'Solution: It represents no net reaction because all ions remain dispersed and chemically unchanged; changing paired formula labels does not change the particle inventory. Why it works: Net reaction requires an observable particle-level change such as a solid, gas, water, or weak electrolyte. Common trap: Treating a written partner exchange as a physical reaction.', difficultyDimensions: [representationTransfer, globalLocalReasoning, proofJustification], difficultyEvidence: 'Interprets particle-level evidence and distinguishes labels from actual chemical change.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], extensionObjectiveIds: [spectator-ion-cancellation], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: hard-particle-diagram-no-change, variationAxes: { representation: particle diagram, unknown: reaction decision, constraints: unchanged inventory } }
  - { id: q009, type: freeResponse, prompt: 'A reaction prediction gives Ba(NO3)2(aq)+K2SO4(aq)→BaSO4(s)+2KNO3(aq). Identify spectator ions and explain why they remain spectators.', answer: { gradingMode: selfCheck, keyPoints: ['K+ and NO3−', 'present unchanged on both sides', 'Ba2+ and sulfate form solid'] }, explanation: 'Solution: K+ and NO3− are spectators because they remain aqueous and unchanged. The net ionic equation is Ba2++SO4 2−→BaSO4(s). Why it works: Only barium and sulfate undergo the phase-changing combination. Common trap: Calling nitrate a reactant because it appears in the molecular formula.', difficultyDimensions: [representationTransfer, proofJustification, casePartition], difficultyEvidence: 'Maps molecular species to ionic identities and partitions changed from unchanged ions.', prerequisiteObjectiveIds: [spectator-ion-cancellation], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: hard-barium-sulfate-spectator-analysis, variationAxes: { scenario: nitrate sulfate mixture, unknown: spectators and rationale, representation: molecular to ionic } }
  - { id: q010, type: freeResponse, prompt: 'A student says “all nitrates precipitate with metal ions.” Use a nitrate-containing reaction to refute the claim and state the correct solubility rule.', answer: { gradingMode: selfCheck, keyPoints: ['nitrates are soluble', 'for example NaNO3 remains aqueous', 'counterexample or no-reaction mixture'] }, explanation: 'Solution: The claim is false: nitrate salts are generally soluble. For example, NaNO3 remains aqueous when mixed with KCl, so no nitrate precipitate forms. Why it works: A solubility rule is tested by the phase of the product, not by the mere presence of a metal ion. Common trap: Confusing nitrate with carbonate or sulfate exceptions.', difficultyDimensions: [counterexampleOrConstruction, errorDiagnosis, proofJustification], difficultyEvidence: 'Refutes an overgeneralization with a constructed aqueous counterexample and rule statement.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: hard-nitrate-solubility-counterexample, variationAxes: { scenario: false rule claim, unknown: counterexample and corrected rule, methodBranch: counterexample } }
