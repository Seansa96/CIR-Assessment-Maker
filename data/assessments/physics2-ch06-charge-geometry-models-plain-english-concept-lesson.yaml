lesson:
  introduction: >
    **Start with the object, not the formula.** A charge distribution's shape and symmetry tell us which pieces of the electric field can cancel, which stay the same, and whether a Gaussian surface can turn Gauss's law into an easy equation.


    This lesson builds three models from the physical picture: (1) a finite rod and its long-line limit, (2) a spherically symmetric charge distribution, and (3) a cylindrically symmetric distribution. In each case we ask: What is actually charged? What can be moved or rotated without changing it? What field direction and distance-dependence follow? Which assumptions would make the model fail?


    **One sentence to keep:** Gauss's law is always true, but symmetry is what lets us solve for the field from it. A finite rod is usually an integration problem; an effectively infinite line, a spherical distribution, and an effectively infinite cylinder have the symmetry needed for a simple Gaussian surface.
  sections:
  - id: charge-geometry-s1
    title: Read the picture before choosing a law
    required: true
    content: >
      **Plain-English scan:** Find the charged material; mark its ends or center/axis; locate the observation point $P$; then ask what rotations or shifts leave the whole charge pattern unchanged. The dashed boundary is a mathematical Gaussian surface, not another charged object.


      A rod has a preferred axis and endpoints. A sphere has one center and no preferred direction. A cylinder has one axis and no preferred direction around or along that axis **only when it is long enough and uniform enough**. The shape of the material by itself is not proof of symmetry: a sphere with charge only on its upper half is not spherically symmetric.
