  - id: charge-geometry-s3
    title: The finite rod becomes a long line only in a limit
    required: true
    content: >
      The finite answer still remembers the rod's half-length $L$. If the observation distance is much larger than the half-length, $a\gg L$, then $\sqrt{a^2+L^2}\approx a$ and


      $$E\approx\frac{2k\lambda L}{a^2}=\frac{kQ}{a^2},\qquad Q=2\lambda L.$$


      From far away, a finite rod looks like its total charge concentrated at one point. In the opposite limit, $L\gg a$, the point is close to the middle of a rod whose ends are very far away. Then $\sqrt{a^2+L^2}\approx L$ and


      $$E\approx\frac{2k\lambda}{a}=\frac{\lambda}{2\pi\epsilon_0a}.$$


      That is the infinite-line result. “Infinite” is a model for a rod much longer than the distance being studied, with the point far from its ends. If the point is near an end, or the rod is not uniform, the infinite-line shortcut may fail.
