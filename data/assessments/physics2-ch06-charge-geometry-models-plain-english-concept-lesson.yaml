      explanation: >
        Solution: B. The visible finite ends and the point's position near one end break the translation symmetry needed for the infinite-line shortcut.


        Why it works: Build the source from $dq=\lambda dx$, use the source-to-observer vector in Coulomb's law, and integrate over the actual finite interval.


        Why the other choices fail: A ignores the nearby endpoint. C confuses the observation point being outside with spherical symmetry of the source. D mistakes zero enclosed charge for zero field; Gauss's law constrains flux, and external charges can create a nonzero local field.
