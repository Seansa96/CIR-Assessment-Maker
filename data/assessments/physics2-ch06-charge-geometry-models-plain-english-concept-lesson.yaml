        Why it works: Flux uses $\mathbf E\cdot d\mathbf A$. It is largest on the curved wall and zero on the caps, where the angle between field and area vector is $90^\circ$.


        Why the other choices fail: A reverses the field direction. B reverses the dot-product condition. D ignores orientation and counts area that carries no flux.
