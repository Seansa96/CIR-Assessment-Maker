  - id: charge-geometry-s8
    title: Why the distance powers are different
    required: true
    content: >
      The power of distance comes from how the field spreads over a symmetry-matched surface:


      | Symmetry | Gaussian surface | Area carrying flux | Outside field |

      | --- | --- | --- | --- |

      | Spherical | concentric sphere | $4\pi r^2$ | $E\propto 1/r^2$ |

      | Cylindrical | coaxial cylinder | $2\pi r\ell$ | $E\propto 1/r$ |


      A finite rod is different because its ends break the translation symmetry. Its exact field comes from the Coulomb integral, not from pretending that one cylinder has the same constant field over the whole surface. Far from the rod it approaches the point-charge $1/r^2$ behavior; close to its middle, when the rod is very long compared with the observation distance, it approaches the line-charge $1/r$ behavior.


      **Quick check before using a formula:** (1) Is the charge pattern actually symmetric? (2) Does the chosen Gaussian surface match it? (3) Is $E$ constant and either parallel or perpendicular on each surface piece? If any answer is no, Gauss's law still holds, but it may not directly solve for $E$.
    media:
    - type: image
      src: /media/physics2/charge-geometry-recognition.svg
      alt: Side-by-side symmetry diagram showing how spherical area grows as r squared and cylindrical curved area grows as r.
      caption: 
    check:
