  - id: charge-geometry-s2
    title: 'A finite rod: add the contributions from its pieces'
    required: true
    content: >
      Consider a uniform rod from $x=-L$ to $x=L$, with line density $\lambda$, and a point $P$ a perpendicular distance $a$ above its midpoint. Its total length is $2L$. The rod is not a point: each little piece is at a different distance from $P$.


      A slice of length $dx$ carries $dq=\lambda\,dx$; uniform density means the whole rod has $Q=2\lambda L$. Coulomb's law gives the small field magnitude $dE=k\,dq/R^2$, where $R=\sqrt{x^2+a^2}$. The vertical fraction is $a/R$, so $dE_y=k\lambda a\,dx/(x^2+a^2)^{3/2}$. The horizontal components from matching slices at $+x$ and $-x$ cancel; their vertical components add.


      Now integrate over every slice exactly once:


      $$\int\frac{dx}{(x^2+a^2)^{3/2}}=\frac{x}{a^2\sqrt{x^2+a^2}}+C.$$


      So the field is


      $$E_y=\frac{k\lambda}{a}\left[\frac{x}{\sqrt{x^2+a^2}}\right]_{-L}^{L}=\frac{2k\lambda L}{a\sqrt{a^2+L^2}}.$$


      For positive $\lambda$, the field points away from the rod; for negative $\lambda$, it points toward it. The integral is the mathematical version of “add all the little pushes,” with symmetry doing the cancellation before the calculus.
