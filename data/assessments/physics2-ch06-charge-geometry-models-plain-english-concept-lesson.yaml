  - id: charge-geometry-s4
    title: 'Infinite line: why a cylinder gives the inverse-distance law'
    required: true
    content: >
      An infinite uniform line looks unchanged if we slide along it or rotate around it. So the field points radially away from the line (for positive charge) and has the same magnitude at every point the same distance $r$ from the axis. A coaxial Gaussian cylinder of radius $r$ and length $\ell$ matches that symmetry.


      The flat end caps contribute no flux: their area vectors point along the line, while the electric field points sideways. On the curved wall, the field and outward area vector are parallel and $E$ is constant. The wall area is $2\pi r\ell$, and the enclosed charge is $\lambda\ell$. Gauss's law becomes


      $$E(2\pi r\ell)=\frac{\lambda\ell}{\epsilon_0}\quad\Longrightarrow\quad E(r)=\frac{\lambda}{2\pi\epsilon_0r}.$$


      **Why $1/r$, not $1/r^2$?** The field lines spread over a cylinder whose side area grows in proportion to $r$. The line's charge per chosen length also grows with $\ell$, so that length cancels. A point charge spreads over a sphere whose area grows as $r^2$, producing a different power.
