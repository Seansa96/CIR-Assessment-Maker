  - id: charge-geometry-s5
    title: 'Sphere: why outside fields look like a point charge'
    required: true
    content: >
      Spherical symmetry means the complete charge pattern is unchanged by any rotation about one center. The density may depend on radius; it must not depend on direction. The field is radial and has one magnitude everywhere on a concentric Gaussian sphere of radius $r$.


      On that sphere, $E$ is constant and parallel to the outward area vector (for positive enclosed charge), and the area is $4\pi r^2$. For a point outside all the charge, $Q_{\mathrm{enc}}=Q_{\mathrm{tot}}$, so


      $$E(4\pi r^2)=\frac{Q_{\mathrm{tot}}}{\epsilon_0}\quad\Longrightarrow\quad E(r)=\frac{Q_{\mathrm{tot}}}{4\pi\epsilon_0r^2}=\frac{kQ_{\mathrm{tot}}}{r^2}.$$


      The outside field is exactly the same as if the total charge sat at the center. That result does **not** mean the charge itself is concentrated at the center; it follows because spherical symmetry gives the same field magnitude and direction relation over the entire Gaussian sphere.
