  - id: charge-geometry-s6
    title: 'Inside a sphere: enclosed charge changes with radius'
    required: true
    content: >
      Inside a uniformly charged, nonconducting solid sphere of radius $R$, a Gaussian sphere of radius $r<R$ encloses only the smaller volume of radius $r$. If the volume density is $\rho$, then


      $$Q_{\mathrm{enc}}=\rho\left(\frac{4}{3}\pi r^3\right).$$


      Put this into the same flux equation, $E(4\pi r^2)=Q_{\mathrm{enc}}/\epsilon_0$. The result is


      $$E(r)=\frac{\rho r}{3\epsilon_0},\qquad 0\le r<R.$$


      The field grows linearly inside: the enclosed charge grows as $r^3$, while the Gaussian area grows as $r^2$, leaving one factor of $r$. For a thin spherical shell, an inside Gaussian sphere encloses no charge, so the field inside is zero. A conducting sphere in electrostatic equilibrium is not the same model as a uniformly charged solid insulator; its excess charge sits on the surface and the interior field is zero.
