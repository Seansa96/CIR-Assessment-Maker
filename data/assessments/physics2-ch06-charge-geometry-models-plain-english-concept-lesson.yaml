      explanation: >
        Solution: B. Spherical symmetry makes the field's magnitude constant over a concentric sphere and makes the field radial there; outside the source, that surface encloses all of $Q_{\mathrm{tot}}$.


        Why it works: Those facts reduce the flux integral to $E(4\pi r^2)$, so Gauss's law gives the point-charge expression.


        Why the other choices fail: A mistakes an equivalent outside field for the actual location of the charge. C confuses the source's radius with the freely chosen Gaussian radius. D applies a spherical area law to geometries with different symmetries.
