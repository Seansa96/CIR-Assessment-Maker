  - id: charge-geometry-s9
    title: Diagnose the model from a new diagram
    required: true
    content: >
      Use the visual checklist on a fresh sketch:


      - **Finite rod:** visible endpoints are not negligible at the field point. Use $dq=\lambda,dx$, Coulomb's law, component symmetry, and an integral.

      - **Effectively infinite line:** the rod is uniform, much longer than the distance to the point, and the point is far from either end. Use a coaxial cylinder and expect $1/r$ outside.

      - **Spherical distribution:** charge density is direction-independent about one center, even if it varies with radius. Use a concentric sphere. For a conductor in electrostatic equilibrium, distinguish the surface charge and zero field inside the conducting material from a uniformly charged insulating solid.

      - **Cylindrical distribution:** density is independent of angle and position along one axis. Use a coaxial cylinder. Ends and axial variations can invalidate the ideal result.


      If a diagram shows only a two-dimensional cross-section, imagine the missing third dimension before deciding. A circle might represent a sphere's cross-section or a cylinder's cross-section; look for a center-only symmetry or a repeated axis extending through space.
