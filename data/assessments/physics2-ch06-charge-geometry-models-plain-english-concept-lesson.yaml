  - id: charge-geometry-s7
    title: 'Cylinder: why a coaxial Gaussian surface gives one over r'
    required: true
    content: >
      Cylindrical symmetry requires the charge pattern to look the same when rotated about its axis or shifted along that axis. The density can vary with distance from the axis, but it cannot vary with angle or position along the axis. An effectively infinite line, a very long uniformly charged cylinder, and concentric long cylindrical shells can have this symmetry. A short rod or cylinder near its end does not.


      Choose a Gaussian cylinder coaxial with the source, radius $r$, length $\ell$. The radial field is constant on the curved wall; it is parallel to the flat caps, so the caps have zero flux. Thus $\Phi_E=E(2\pi r\ell)$. For a line source with density $\lambda$, $Q_{\mathrm{enc}}=\lambda\ell$, giving


      $$E(r)=\frac{\lambda}{2\pi\epsilon_0r}.$$


      For a uniformly charged solid cylinder, at an inside radius $r<R$, $Q_{\mathrm{enc}}=\rho\pi r^2\ell$. The same flux argument now gives


      $$E(2\pi r\ell)=\frac{\rho\pi r^2\ell}{\epsilon_0}\quad\Longrightarrow\quad E=\frac{\rho r}{2\epsilon_0}.$$


      The growing enclosed volume per length leaves a linear inside field; outside the cylinder, all charge per length is enclosed and the field returns to a $1/r$ law. For a hollow cylindrical shell, an interior coaxial Gaussian surface encloses no charge, so its interior field is zero; outside it, the field depends on the total charge per length.
