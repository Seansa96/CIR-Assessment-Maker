  type: multipleChoice
  prompt: A system design discussion mentions **Free-space management**. Which conclusion is most defensible?
  choices:
  - id: a
    text: Contiguous needs can fail despite enough total free memory.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: Contiguous needs can fail despite enough total free memory. This is why Free-space management matters in Memory Management.
