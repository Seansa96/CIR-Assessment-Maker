- id: q006
  title: Select Valid OS Reasoning
  type: selectAll
  prompt: Which reasoning habits are valid when analyzing Memory Management?
  choices:
  - id: a
    text: Name the protected resource or shared state.
  - id: b
    text: Separate mechanism from policy when possible.
  - id: c
    text: Check blocking, failure, permission, or boundary cases.
  - id: d
    text: Assume faster hardware removes all OS design tradeoffs.
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: OS design questions usually involve resources, mechanisms, policies, and boundary cases.
- id: q007
  title: Scenario Explanation
  type: freeResponse
  prompt: 'Explain how you would analyze this scenario: Three processes start and exit at different times in a system without paging. Track why holes form, when compaction helps, and why protection is still needed.'
  answer:
    expected: A strong answer identifies the OS-managed resource, names the relevant Memory Management mechanism, describes the tradeoff, and checks a boundary or failure case.
    gradingMode: selfCheck
    keyPoints:
    - Identifies resource
    - Names mechanism
    - Mentions tradeoff
    - Checks boundary or failure case
  explanation: 'Related topic: Memory Management.'
- id: q008
  title: 'Misconception: Address space abstraction'
  type: multipleChoice
  prompt: Which misconception is most dangerous when reasoning about **Address space abstraction**?
  choices:
  - id: a
    text: Treating the concept as a label instead of an OS mechanism with costs and boundaries.
  - id: b
    text: Asking what resource is controlled.
  - id: c
    text: Checking whether the mechanism can fail or block.
  - id: d
    text: Separating user-visible behavior from kernel-mediated work.
  answer:
    choiceId: a
  explanation: The correct reasoning must connect Address space abstraction to mechanism and tradeoff.
