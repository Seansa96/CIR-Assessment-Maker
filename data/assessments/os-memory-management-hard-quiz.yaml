questions:
- id: q001
  title: Apply Address space abstraction
  type: multipleChoice
  prompt: A system design discussion mentions **Address space abstraction**. Which conclusion is most defensible?
  choices:
  - id: a
    text: Virtual addresses require translation and protection.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: Virtual addresses require translation and protection. This is why Address space abstraction matters in Memory Management.
- id: q002
  title: Apply Relocation
  type: multipleChoice
  prompt: A system design discussion mentions **Relocation**. Which conclusion is most defensible?
  choices:
  - id: a
    text: Relocation separates program addresses from placement.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: Relocation separates program addresses from placement. This is why Relocation matters in Memory Management.
