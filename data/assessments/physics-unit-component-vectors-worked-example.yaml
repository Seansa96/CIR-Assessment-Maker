workedExamples:
  - id: we-components-from-magnitude-angle
    title: Resolve a vector into components
    problem: 'A vector has magnitude $10$ and direction $30^\circ$ above the positive x axis. Find its x and y components.'
    steps:
      - id: ca-1
        title: Find x component
        instruction: 'Use the adjacent side of the direction angle.'
        type: numericResponse
        prompt: 'What is $A_x$?'
        answer: { value: 8.660254, tolerance: 0.001 }
        explanation: 'Solution: $A_x=10\cos30^\circ=8.66$.\n\nWhy it works: The x component is adjacent to an angle measured from the x axis.'
      - id: ca-2
        title: Find y component
        instruction: 'Use the opposite side of the direction angle.'
        type: numericResponse
        prompt: 'What is $A_y$?'
        answer: { value: 5, tolerance: 0.001 }
        explanation: 'Solution: $A_y=10\sin30^\circ=5.00$.\n\nWhy it works: The y component is opposite the angle in the right triangle.'
  - id: we-vector-from-components
    title: Build a vector from components
    problem: 'A displacement vector is $\Delta\vec r=-3\hat i+4\hat j$ m. Find its magnitude and direction relative to the positive x axis.'
    steps:
      - id: vc-1
        title: Find magnitude
        instruction: 'Use the component right triangle.'
        type: numericResponse
        prompt: 'What is the magnitude in meters?'
        answer: { value: 5, tolerance: 0.01 }
        explanation: 'Solution: $|\Delta\vec r|=\sqrt{(-3)^2+4^2}=5.0$ m.\n\nWhy it works: Magnitude is the hypotenuse formed by perpendicular components.'
      - id: vc-2
        title: Identify direction quadrant
        instruction: 'Use the signs of both components.'
        type: multipleChoice
        prompt: 'Which quadrant contains the vector?'
        choices: [{ id: a, text: 'Quadrant II' }, { id: b, text: 'Quadrant I' }]
        answer: { choiceId: a }
        explanation: 'Solution: It lies in Quadrant II.\n\nWhy it works: The x component is negative and the y component is positive.\n\nWhy the other choices fail: Quadrant I requires positive x and positive y components.'
