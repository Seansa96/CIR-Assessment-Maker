schemaVersion: 1
id: physics-unit-component-vectors-worked-example
title: Unit Vector and Component Vector Addition Worked Example
assessmentType: workedExample
categoryId: physics-1
subcategoryId: physics-vectors
subcategoryIds:
  - physics-vectors
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Adding and subtracting vectors in i, j, k notation
    problem: |
      Work with vectors written in component form, such as

      $$
      \vec{A}=3\hat{i}-2\hat{j}+5\hat{k},
      \qquad
      \vec{B}=-4\hat{i}+7\hat{j}-\hat{k}.
      $$

      The goal is to recognize that $\hat{i}$, $\hat{j}$, and $\hat{k}$ are direction labels for perpendicular axes, then combine only like components.
    steps:
      - id: s001
        title: Identify what i, j, and k mean
        instruction: "Before doing arithmetic, identify what the unit vectors are doing."
        type: multipleChoice
        prompt: 'In $\vec{A}=3\hat{i}-2\hat{j}+5\hat{k}$, what does the coefficient of $\hat{j}$ represent?'
        choices:
          - id: a
            text: 'The $x$-component of $\vec{A}$'
          - id: b
            text: 'The $y$-component of $\vec{A}$'
          - id: c
            text: 'The magnitude of $\vec{A}$'
          - id: d
            text: 'The angle of $\vec{A}$ from the positive $x$-axis'
        answer:
          choiceId: b
        hint: '$\hat{i}$, $\hat{j}$, and $\hat{k}$ point along the $x$, $y$, and $z$ axes.'
        explanation: |
          The coefficient on $\hat{j}$ is the $y$-component. Here it is $-2$, so the vector points 2 units in the negative $y$ direction.

          Related topic: Unit vector notation. To review it quickly, look up how $\hat{i}$ maps to $x$, $\hat{j}$ maps to $y$, and $\hat{k}$ maps to $z$.

      - id: s002
        title: Translate vector notation into ordered triples
        instruction: "A component vector can be rewritten as an ordered triple by reading off the coefficients."
        type: multipleChoice
        prompt: 'Which ordered triple matches $\vec{B}=-4\hat{i}+7\hat{j}-\hat{k}$?'
        choices:
          - id: a
            text: '$(-4,7,-1)$'
          - id: b
            text: '$(4,-7,1)$'
          - id: c
            text: '$(-4,-7,-1)$'
          - id: d
            text: '$(7,-4,-1)$'
        answer:
          choiceId: a
        hint: 'A missing coefficient is usually $1$ or $-1$, not $0$.'
        explanation: |
          The coefficients are $-4$ for $\hat{i}$, $7$ for $\hat{j}$, and $-1$ for $\hat{k}$. So $\vec{B}=(-4,7,-1)$.

          Related topic: Component notation. The practical move is to rewrite each vector as $(x,y,z)$ before combining them.

      - id: s003
        title: Add like components
        instruction: "Vector addition works component by component. Do not combine unlike directions."
        type: multipleChoice
        prompt: 'For $\vec{A}=3\hat{i}-2\hat{j}+5\hat{k}$ and $\vec{B}=-4\hat{i}+7\hat{j}-\hat{k}$, what is $\vec{A}+\vec{B}$?'
        choices:
          - id: a
            text: '$-\hat{i}+5\hat{j}+4\hat{k}$'
          - id: b
            text: '$7\hat{i}-9\hat{j}+6\hat{k}$'
          - id: c
            text: '$-\hat{i}+9\hat{j}+6\hat{k}$'
          - id: d
            text: '$\hat{i}+5\hat{j}+4\hat{k}$'
        answer:
          choiceId: a
        hint: 'Compute $3+(-4)$, $-2+7$, and $5+(-1)$.'
        explanation: |
          Add each direction separately:

          $$
          (3,-2,5)+(-4,7,-1)=(-1,5,4).
          $$

          Therefore $\vec{A}+\vec{B}=-\hat{i}+5\hat{j}+4\hat{k}$.

          Related topic: Vector addition. The actionable pattern is "same axis with same axis."

      - id: s004
        title: Subtract by distributing the negative
        instruction: "Subtraction means adding the opposite vector."
        type: multipleChoice
        prompt: 'What is $\vec{A}-\vec{B}$?'
        choices:
          - id: a
            text: '$7\hat{i}-9\hat{j}+6\hat{k}$'
          - id: b
            text: '$-\hat{i}+5\hat{j}+4\hat{k}$'
          - id: c
            text: '$-7\hat{i}+9\hat{j}-6\hat{k}$'
          - id: d
            text: '$\hat{i}-9\hat{j}+4\hat{k}$'
        answer:
          choiceId: a
        hint: 'Subtracting $\vec{B}$ means changing the signs of every component of $\vec{B}$ first.'
        explanation: |
          Compute

          $$
          \vec{A}-\vec{B}=(3,-2,5)-(-4,7,-1)=(3+4,-2-7,5+1).
          $$

          So $\vec{A}-\vec{B}=7\hat{i}-9\hat{j}+6\hat{k}$.

          Related topic: Vector subtraction. Look up "opposite vector" if the sign distribution feels slippery.

      - id: s005
        title: Include scalar multiples
        instruction: "Scale first, then add or subtract componentwise."
        type: multipleChoice
        prompt: 'What is $2\vec{A}-3\vec{B}$?'
        choices:
          - id: a
            text: '$18\hat{i}-25\hat{j}+13\hat{k}$'
          - id: b
            text: '$-6\hat{i}+17\hat{j}+7\hat{k}$'
          - id: c
            text: '$18\hat{i}+17\hat{j}+7\hat{k}$'
          - id: d
            text: '$-6\hat{i}-25\hat{j}+13\hat{k}$'
        answer:
          choiceId: a
        hint: 'First compute $2\vec{A}=(6,-4,10)$ and $3\vec{B}=(-12,21,-3)$.'
        explanation: |
          Scale each vector:

          $$
          2\vec{A}=(6,-4,10),
          \qquad
          3\vec{B}=(-12,21,-3).
          $$

          Then subtract:

          $$
          (6,-4,10)-(-12,21,-3)=(18,-25,13).
          $$

          Related topic: Linear combinations of vectors. The reliable workflow is scale, distribute signs, then combine matching components.

      - id: s006
        title: Connect components to physics quantities
        instruction: "In physics, component vectors often describe displacement, velocity, acceleration, or force."
        type: selectAll
        prompt: 'A displacement changes from $\vec{r}_1=2\hat{i}+5\hat{j}$ m to $\vec{r}_2=8\hat{i}-\hat{j}$ m. Which statements are true about $\Delta\vec{r}=\vec{r}_2-\vec{r}_1$?'
        choices:
          - id: a
            text: 'The $x$ displacement is $+6$ m.'
          - id: b
            text: 'The $y$ displacement is $-6$ m.'
          - id: c
            text: 'The displacement vector is $6\hat{i}-6\hat{j}$ m.'
          - id: d
            text: 'The displacement is found by adding the initial and final positions.'
        answer:
          choiceIds: [a, b, c]
        hint: 'Displacement is final position minus initial position.'
        explanation: |
          $\Delta\vec{r}=(8,-1)-(2,5)=(6,-6)$ m. That means $+6$ m in $x$ and $-6$ m in $y$.

          Related topic: Position and displacement vectors. Look up final-minus-initial if you need the physical interpretation.



