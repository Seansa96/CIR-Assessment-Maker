questions:
  - id: q001
    type: multipleChoice
    skills:
      - chem-covalent-molecules
    prompt: |
      Which statement about bond order, bond length, and bond energy is correct?
    choices:
      - id: a
        text: Higher bond order → longer bond → stronger bond
      - id: b
        text: Higher bond order → shorter bond → stronger bond
      - id: c
        text: Higher bond order → longer bond → weaker bond
      - id: d
        text: Bond order has no effect on bond energy
    answer:
      choiceId: b
    explanation: |
      Higher bond order means more shared electron pairs, which pulls nuclei closer (shorter bond) and requires more energy to break (stronger bond).

  - id: q002
    type: numericResponse
    skills:
      - chem-covalent-molecules
    prompt: |
      How many **pi (π) bonds** are in one molecule of acetylene ($HC \equiv CH$)?
    answer:
      value: 2
      tolerance: 0
    explanation: |
      $H-C \equiv C-H$: the two C-H single bonds are each 1σ; the C≡C triple bond is 1σ + 2π. Total: 3σ, **2π**.

  - id: q003
    type: numericResponse
    skills:
      - chem-lewis-dot-structures
    prompt: |
      How many total valence electrons must be shown in the Lewis structure of $PO_4^{3-}$?

      (P: 5; O: 6 each; charge: 3−)
    answer:
      value: 32
      tolerance: 0
    explanation: |
      $5 + 4(6) + 3 = 5 + 24 + 3 = 32$ valence electrons.

  - id: q004
    type: multipleChoice
    skills:
      - chem-lewis-dot-structures
    prompt: |
      Which of the following molecules has an **expanded octet** on its central atom?
    choices:
      - id: a
        text: '$NH_3$'
      - id: b
        text: '$BF_3$'
      - id: c
        text: '$SF_6$'
      - id: d
        text: '$CH_4$'
    answer:
      choiceId: c
    explanation: |
      S in $SF_6$ forms 6 S—F bonds = 12 electrons on S — an expanded octet (Period 3, uses $d$ orbitals). The others involve Period 2 atoms (N, B, C) that cannot exceed 8 electrons.

  - id: q005
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      What is the molecular geometry of $BeCl_2$?

      (Be has 2 Be—Cl bonds, no lone pairs; AX₂E₀)
    choices:
      - id: a
        text: Bent (~104.5°)
      - id: b
        text: Linear (180°)
      - id: c
        text: Trigonal planar (120°)
      - id: d
        text: Tetrahedral (109.5°)
    answer:
      choiceId: b
    explanation: |
      AX₂E₀: 2 bonding domains, no lone pairs → **linear**, 180°. $BeCl_2$ is also an example of an incomplete octet (only 4 electrons on Be).

  - id: q006
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      The molecule $NH_3$ has a smaller bond angle than $CH_4$. Which principle explains this?
    choices:
      - id: a
        text: N—H bonds are longer than C—H bonds, spreading the hydrogens further apart
      - id: b
        text: The lone pair on N exerts greater repulsion than a bonding pair, compressing the H—N—H angle below 109.5°
      - id: c
        text: Nitrogen has a higher atomic mass than carbon
      - id: d
        text: $NH_3$ has fewer electrons than $CH_4$, leaving more space around the molecule
    answer:
      choiceId: b
    explanation: |
      VSEPR: lone pairs exert greater repulsion than bonding pairs. The lone pair on N pushes the three H atoms closer, compressing the H—N—H angle from 109.5° ($CH_4$) to ~107° ($NH_3$).

  - id: q007
    type: numericResponse
    skills:
      - chem-molecular-shapes
    prompt: |
      How many **lone pairs** are on the central Cl atom in $ClF_3$?

      (Cl: 7 valence e⁻; F: 7 each; total = $7 + 3(7) = 28$; skeleton: 3 bonds = 6 e⁻; each F: 3 lone pairs = 18 e⁻; remaining → Cl)
    answer:
      value: 2
      tolerance: 0
    explanation: |
      $28 - 6 - 18 = 4$ electrons → **2 lone pairs on Cl**. AX₃E₂ → T-shaped molecular geometry.

  - id: q008
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      In the trigonal bipyramidal electron-pair geometry, where do lone pairs preferentially sit — in axial or equatorial positions?
    choices:
      - id: a
        text: Axial — they are closer to the central atom for stability
      - id: b
        text: Equatorial — they have fewer 90° repulsive interactions in this position
      - id: c
        text: Both positions are equivalent
      - id: d
        text: Axial — because axial bonds are longer and have more room
    answer:
      choiceId: b
    explanation: |
      Equatorial positions have only 2 neighbors at 90° (the two axial atoms). Axial positions have 3 neighbors at 90° (the three equatorial atoms). Lone pairs, which exert more repulsion, prefer equatorial positions to minimize 90° interactions.

  - id: q009
    type: multipleChoice
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      Which bond is classified as **ionic** (approximately)?
    choices:
      - id: a
        text: 'C—H ($\Delta$EN = 0.4)'
      - id: b
        text: 'N—O ($\Delta$EN = 0.5)'
      - id: c
        text: 'Na—F ($\Delta$EN = 3.1)'
      - id: d
        text: 'H—Cl ($\Delta$EN = 0.9)'
    answer:
      choiceId: c
    explanation: |
      The approximate threshold for ionic character is $\Delta EN \geq 2.0$. Na—F has $\Delta EN = 4.0 - 0.9 = 3.1$ — the largest in the list — clearly **ionic**. The others are polar covalent (0.4–0.9).

  - id: q010
    type: multipleChoice
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      Is $SF_6$ polar or nonpolar?
    choices:
      - id: a
        text: Polar, because S—F bonds are highly polar ($\Delta EN \approx 1.5$)
      - id: b
        text: Nonpolar, because the perfect octahedral symmetry causes the six S—F bond dipoles to cancel
      - id: c
        text: Polar, because sulfur has an expanded octet
      - id: d
        text: Nonpolar, because S—F bonds are nonpolar
    answer:
      choiceId: b
    explanation: |
      $SF_6$ has an octahedral geometry (AX₆E₀) with 6 equivalent S—F bonds. The six bond dipoles point symmetrically in all directions and cancel completely → **nonpolar** ($\mu = 0$).

  - id: q011
    type: numericResponse
    skills:
      - chem-covalent-molecules
    prompt: |
      Using average bond energies, estimate $\Delta H$ (in kJ/mol) for the reaction:

      $$H_2(g) + Cl_2(g) \to 2\,HCl(g)$$

      $D$(H—H) = 436 kJ/mol; $D$(Cl—Cl) = 243 kJ/mol; $D$(H—Cl) = 432 kJ/mol.
    answer:
      value: -185
      tolerance: 5
    explanation: |
      Bonds broken: H—H (436) + Cl—Cl (243) = 679 kJ.
      Bonds formed: 2 × H—Cl (432) = 864 kJ.
      $\Delta H \approx 679 - 864 = -185$ kJ/mol.

  - id: q012
    type: multipleChoice
    skills:
      - chem-molecular-charges
    prompt: |
      What is the formal charge on **carbon** in $CO_2$ (structure O=C=O, C has no lone pairs)?
    choices:
      - id: a
        text: '+2'
      - id: b
        text: '+1'
      - id: c
        text: '0'
      - id: d
        text: '−1'
    answer:
      choiceId: c
    explanation: |
      $$\text{FC}(C) = 4 - 0 - \frac{8}{2} = 4 - 0 - 4 = 0$$
      C forms two double bonds (8 bonding electrons) and has no lone pairs. Formal charge = **0**.

  - id: q013
    type: multipleChoice
    skills:
      - chem-molecular-charges
    prompt: |
      The nitrate ion ($NO_3^-$) has three equivalent resonance structures. What is the N—O bond order in the resonance hybrid?
    choices:
      - id: a
        text: '1.0'
      - id: b
        text: '1.33'
      - id: c
        text: '1.5'
      - id: d
        text: '2.0'
    answer:
      choiceId: b
    explanation: |
      Each N—O position receives a double bond (order 2) in one structure and single bonds (order 1) in the other two:
      $$\text{Bond order} = \frac{2+1+1}{3} = \frac{4}{3} \approx 1.33$$

  - id: q014
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      What is the molecular geometry of $XeF_2$?

      (Xe has 2 bonds + 3 lone pairs, AX₂E₃)
    choices:
      - id: a
        text: Bent
      - id: b
        text: T-shaped
      - id: c
        text: Linear
      - id: d
        text: Trigonal planar
    answer:
      choiceId: c
    explanation: |
      AX₂E₃: all 3 lone pairs occupy equatorial positions in the trigonal bipyramidal electron-pair geometry. The 2 F atoms are in axial positions, directly opposite each other → **linear** (180°).

  - id: q015
    type: selectAll
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      Select all **nonpolar** molecules from the list below.
    choices:
      - id: a
        text: '$N_2$ (homonuclear diatomic)'
      - id: b
        text: '$NH_3$ (trigonal pyramidal)'
      - id: c
        text: '$CCl_4$ (tetrahedral, 4 identical bonds)'
      - id: d
        text: '$CS_2$ (linear, O=C=O analogue with S)'
    answer:
      choiceIds:
        - a
        - c
        - d
    explanation: |
      **$N_2$**: $\Delta EN = 0$, no polarity → nonpolar ✓

      **$NH_3$**: trigonal pyramidal (AX₃E₁), lone pair on N → dipoles don't cancel → **polar** ✗

      **$CCl_4$**: perfect tetrahedral with 4 identical bonds → dipoles cancel → nonpolar ✓

      **$CS_2$** (S=C=S): linear (AX₂E₀), two equal C=S bond dipoles point in opposite directions and cancel → nonpolar ✓

  - id: q016
    type: multipleChoice
    skills:
      - chem-lewis-dot-structures
    prompt: |
      The Lewis structure procedure calls for placing lone pairs on **terminal atoms before the central atom**. The reason is:
    choices:
      - id: a
        text: Terminal atoms are always more electronegative
      - id: b
        text: Terminal atoms need lone pairs for octets; any deficit on the central atom is then resolved by forming multiple bonds
      - id: c
        text: The central atom never needs lone pairs
      - id: d
        text: Lone pairs on central atoms are forbidden by the VSEPR model
    answer:
      choiceId: b
    explanation: |
      The procedure systematically fills octets on terminal atoms first, then addresses any electron deficit on the central atom by converting terminal lone pairs into multiple bonds — without changing the total electron count.

  - id: q017
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      Which of the following has a **square planar** molecular geometry?
    choices:
      - id: a
        text: '$XeF_2$ (AX₂E₃)'
      - id: b
        text: '$SF_4$ (AX₄E₁)'
      - id: c
        text: '$XeF_4$ (AX₄E₂)'
      - id: d
        text: '$PCl_5$ (AX₅E₀)'
    answer:
      choiceId: c
    explanation: |
      AX₄E₂ with octahedral electron-pair geometry: two lone pairs occupy opposing axial positions (minimizing repulsion), leaving 4 bonding atoms in a square equatorial plane → **square planar**.

  - id: q018
    type: multipleChoice
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      A molecule has polar bonds but a net dipole of zero. Which of the following is a **necessary** condition for this?
    choices:
      - id: a
        text: The molecule must be diatomic
      - id: b
        text: The molecular geometry must be symmetric enough for bond dipoles to cancel as vectors
      - id: c
        text: All atoms must have the same electronegativity
      - id: d
        text: The central atom must have an expanded octet
    answer:
      choiceId: b
    explanation: |
      For polar bonds to cancel and give a zero net dipole, the molecular geometry must be symmetric enough that all bond dipole vectors sum to zero. This applies to linear (AX₂E₀), trigonal planar (AX₃E₀), tetrahedral (AX₄E₀), and octahedral (AX₆E₀) geometries with identical substituents.

  - id: q019
    type: numericResponse
    skills:
      - chem-molecular-charges
    prompt: |
      Calculate the formal charge on the **sulfur atom** in $SO_3$ when S forms **three** S=O double bonds and has no lone pairs.

      (S: Group 16, 6 valence electrons; bonding electrons on S = 12)
    answer:
      value: 0
      tolerance: 0
    explanation: |
      $$\text{FC}(S) = 6 - 0 - \frac{12}{2} = 6 - 0 - 6 = 0$$
      This structure (all FC = 0) is the preferred Lewis structure of $SO_3$, with S having an expanded octet of 12 electrons.

  - id: q020
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      Both $H_2O$ and $H_2S$ are AX₂E₂ molecules (bent). The H—S—H bond angle (~92°) is **smaller** than the H—O—H angle (~104.5°). Which best explains this difference?
    choices:
      - id: a
        text: S is more electronegative than O, increasing lone pair repulsion
      - id: b
        text: S is larger, so its lone pairs are more diffuse and the bonding pairs relax closer to the axis, reducing the bond angle
      - id: c
        text: H—S bonds are shorter than H—O bonds, reducing the angle
      - id: d
        text: $H_2S$ has more total electrons, increasing repulsion everywhere
    answer:
      choiceId: b
    explanation: |
      Sulfur's larger atomic radius means its lone pairs are held in larger, more diffuse orbitals. These lone pairs are farther from S than in O, so they exert less compressive force on the bonding pairs. The result is that the H—S—H bond angle (~92°) approaches the 90° of pure p orbital geometry — less lone-pair pressure means the bonding pairs settle closer to perpendicular.
