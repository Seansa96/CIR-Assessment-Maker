items:
  - { id: q001, type: cloze, prompt: 'For a valid alternating approximation, $|R_N|\le$ the magnitude of the first ____ term.', answer: { expected: omitted }, explanation: The next magnitude bounds the alternating tail. }
  - { id: q002, type: typed, prompt: 'Write the Lagrange remainder bound for a degree-$n$ Taylor polynomial.', answer: { expected: 'M|x-a|^(n+1)/(n+1)!', aliases: ['|R_n(x)| <= M|x-a|^(n+1)/(n+1)!'] }, explanation: It uses a bound on the $(n+1)$st derivative over the relevant interval. }
  - { id: q003, type: cloze, prompt: 'For a positive decreasing integral-test tail, the integral beginning at $N$ gives an ____ bound on $R_N$.', answer: { expected: upper }, explanation: $\int_N^\infty f(x)\,dx$ is the upper tail estimate. }
  - { id: q004, type: typed, prompt: 'If the first omitted alternating term is negative, is the current partial sum an overestimate or underestimate?', answer: { expected: overestimate, aliases: [over] }, explanation: Then $R_N=S-S_N<0$, so $S_N>S$. }
