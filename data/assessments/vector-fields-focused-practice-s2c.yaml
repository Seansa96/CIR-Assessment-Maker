  explanation: 'Solution: Differentiate f by each variable, then evaluate at the point.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 3 -> Vectors.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
