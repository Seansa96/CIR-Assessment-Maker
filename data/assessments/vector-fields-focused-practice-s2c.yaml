questions:
- id: q001
  type: multipleChoice
  prompt: For F(x,y)=<y,-x>, what is F(2,1)?
  choices:
  - id: a
    text: <1,-2>
  - id: b
    text: <2,1>
    issueSignals:
    - id: vector-field-interpretation-error
  - id: c
    text: <-1,2>
    issueSignals:
    - id: vector-field-interpretation-error
  - id: d
    text: <2,-1>
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: vector-field-interpretation-error
  difficultyDimensions: &id001
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Requires matching a vector-calculus representation to the governing relation and orientation.
  explanation: 'Solution: Substitute x=2 and y=1 into the ordered components.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 3 -> Vectors.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q002
  type: multipleChoice
  prompt: Which field pattern represents arrows pointing away from the origin?
  choices:
  - id: a
    text: A radial outward field
  - id: b
    text: A circular field
    issueSignals:
    - id: vector-field-interpretation-error
  - id: c
    text: A uniform horizontal field
    issueSignals:
    - id: vector-field-interpretation-error
  - id: d
    text: A zero field
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: vector-field-interpretation-error
  difficultyDimensions: *id001
  difficultyEvidence: Requires matching a vector-calculus representation to the governing relation and orientation.
  explanation: 'Solution: Each arrow must align with the position vector and point away from the origin.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 3 -> Vectors.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
