- id: q001
  type: multipleChoice
  prompt: For F(x,y)=<y,-x>, what is F(2,1)?
  choices:
  - id: a
    text: <1,-2>
  - id: b
    text: <2,1>
    issueSignals:
    - id: vector-field-interpretation-error
  - id: c
    text: <-1,2>
    issueSignals:
    - id: vector-field-interpretation-error
  - id: d
    text: <2,-1>
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: vector-field-interpretation-error
  difficultyDimensions: &id001
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Requires matching a vector-calculus representation to the governing relation and orientation.
  explanation: 'Solution: Substitute x=2 and y=1 into the ordered components.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 3 -> Vectors.

    Why the other choices fail: Choice b, ''<2,1>'', does not give ''<1,-2>'' for ''For F(x,y)=<y,-x>, what is F(2,1)?''.
    It substitutes a different result, representation, or condition for the one the prompt specifies.

    Choice c, ''<-1,2>'', does not give ''<1,-2>'' for ''For F(x,y)=<y,-x>, what is F(2,1)?''. It substitutes a different
    result, representation, or condition for the one the prompt specifies.

