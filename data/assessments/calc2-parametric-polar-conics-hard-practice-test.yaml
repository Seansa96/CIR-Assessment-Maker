questions:
- id: q001
  title: 'Part 1: Sketch a Parametric Curve'
  type: freeResponse
  prompt: |-
    Sketch the parametric curve given by $x=\sec t$, $y=\tan t$ for $-\frac{\pi}{2} < t < \frac{\pi}{2}$. Indicate the direction of motion as $t$ increases and any asymptotes.
  answer:
    gradingMode: selfCheck
    expected: |
      The sketch should show the right branch of $x^2-y^2=1$, traced upward through $(1,0)$ as $t$ increases, with asymptotes $y=x$ and $y=-x$.
    keyPoints:
    - Use $\sec^2t-\tan^2t=1$ to identify the hyperbola.
    - Restrict to the right branch because $x=\sec t>0$ on the interval.
    - Include direction of motion and both asymptotes.
  explanation: |-
    Notice that $x^2 - y^2 = \sec^2 t - \tan^2 t = 1$. This is the standard equation of a hyperbola opening horizontally.

    For $-\frac{\pi}{2} < t < \frac{\pi}{2}$, $x = \sec t > 0$, so this represents only the right branch of the hyperbola.

    As $t \to -\frac{\pi}{2}^+$, $y = \tan t \to -\infty$.
    As $t \to \frac{\pi}{2}^-$, $y = \tan t \to \infty$.

    The curve starts from the bottom right, passes through $(1,0)$ at $t=0$, and continues upwards. The asymptotes are $y = x$ and $y = -x$.
- id: q002
  title: 'Part 1: Parametric Equations for a Line Segment'
  type: symbolicResponse
  prompt: |-
    Write a set of parametric equations for the line segment from $(-2, 5)$ to $(4, 1)$ such that $t=0$ corresponds to $(-2, 5)$ and $t=1$ corresponds to $(4, 1)$.
  answer:
    expectedLatex: 'x=-2+6t,\ y=5-4t'
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0.000001
  explanation: |-
    A line segment from $(x_1, y_1)$ to $(x_2, y_2)$ can be parameterized as:
    $$x(t) = x_1 + (x_2 - x_1)t$$
    $$y(t) = y_1 + (y_2 - y_1)t$$

    Substitute the points $(-2, 5)$ and $(4, 1)$:
    $$x(t) = -2 + (4 - (-2))t = -2 + 6t$$
    $$y(t) = 5 + (1 - 5)t = 5 - 4t$$

    So the equations are $x=-2+6t$ and $y=5-4t$.
- id: q003
  title: 'Part 1: Identify Complex Parametric Curve from Graph'
  type: multipleChoice
  prompt: |-
    Identify the set of parametric equations that matches the given astroid graph.

    ![Astroid](/assessments/calc2-parametric-polar/parametric-astroid-hard.svg)
  choices:
  - id: c1
    text: '$x=\cos(t),\ y=\sin(t)$'
  - id: c2
    text: '$x=\cos^2(t),\ y=\sin^2(t)$'
  - id: c3
    text: '$x=\cos^3(t),\ y=\sin^3(t)$'
  - id: c4
    text: '$x=\cos^4(t),\ y=\sin^4(t)$'
  answer:
    choiceId: c3
  explanation: "The graph shows a four-cusped hypocycloid, also known as an astroid.\
    \ \n\n*   $x=\\cos(t),\\ y=\\sin(t)$ produces a standard circle.\n*   $x=\\\
    cos^2(t),\\ y=\\sin^2(t)$ produces a straight line segment $x+y=1$ restricted\
    \ to the first quadrant since $x,y \\ge 0$.\n*   $x=\\cos^3(t),\\ y=\\sin^3(t)$\
    \ is the standard parameterization of an astroid, which creates sharp cusps\
    \ at $(1,0), (0,1), (-1,0),$ and $(0,-1)$ due to the cubic power maintaining\
    \ the signs of the trigonometric functions."
- id: q004
  title: 'Part 1: Tangent Line of Parametric Curve'
  type: symbolicResponse
  prompt: |-
    Find the equation of the tangent line to the curve $x=t\sin t,\ y=t\cos t$ at $t=\pi$.
  answer:
    expectedLatex: 'y=\frac{1}{\pi}x-\pi'
    equivalenceMode: expression
    variables:
    - x
    - y
    tolerance: 0.000001
  explanation: |-
    The formula for the slope of a parametric curve is:
    $$\frac{dy}{dx} = \frac{dy/dt}{dx/dt}$$

    First, find the derivatives using the product rule:
    $$\frac{dx}{dt} = \sin t + t\cos t$$
    $$\frac{dy}{dt} = \cos t - t\sin t$$

    Evaluate at $t=\pi$:
    $$\frac{dx}{dt}\Big|_{t=\pi} = \sin(\pi) + \pi\cos(\pi) = 0 + \pi(-1) = -\pi$$
    $$\frac{dy}{dt}\Big|_{t=\pi} = \cos(\pi) - \pi\sin(\pi) = -1 - 0 = -1$$

    So, the slope is $m = \frac{-1}{-\pi} = \frac{1}{\pi}$.

    Find the point at $t=\pi$:
    $$x = \pi\sin(\pi) = 0$$
    $$y = \pi\cos(\pi) = -\pi$$

    The equation of the tangent line in point-slope form is:
    $$y - (-\pi) = \frac{1}{\pi}(x - 0)$$
    $$y = \frac{1}{\pi}x - \pi$$
- id: q005
  title: 'Part 1: Concavity of Parametric Curve'
  type: freeResponse
  prompt: |-
    Determine the interval(s) of $t$ for which the curve $x=t^2-1,\ y=t^3-3t$ is concave up.
  answer:
    gradingMode: selfCheck
    expected: |
      The curve is concave up on $(0,\infty)$.
    keyPoints:
    - Compute $\frac{dy}{dx}$ from $\frac{dy/dt}{dx/dt}$.
    - Use $\frac{d^2y}{dx^2}=\frac{d}{dt}(\frac{dy}{dx})/(dx/dt)$.
    - Determine where the second derivative is positive.
  explanation: "The formula for the second derivative of a parametric curve is:\n\
    $$\\frac{d^2y}{dx^2} = \\frac{\\frac{d}{dt}\\left(\\frac{dy}{dx}\\right)}{dx/dt}$$\n\
    \nFirst, find $\\frac{dy}{dx}$:\n$$\\frac{dx}{dt} = 2t$$\n$$\\frac{dy}{dt} =\
    \ 3t^2 - 3$$\n$$\\frac{dy}{dx} = \\frac{3t^2 - 3}{2t} = \\frac{3}{2}t - \\frac{3}{2}t^{-1}$$\n\
    \nNext, find the derivative of $\\frac{dy}{dx}$ with respect to $t$:\n$$\\frac{d}{dt}\\\
    left(\\frac{dy}{dx}\\right) = \\frac{3}{2} + \\frac{3}{2}t^{-2} = \\frac{3}{2}\
    \ + \\frac{3}{2t^2} = \\frac{3t^2 + 3}{2t^2}$$\n\nNow, find the second derivative:\n\
    $$\\frac{d^2y}{dx^2} = \\frac{\\frac{3t^2 + 3}{2t^2}}{2t} = \\frac{3t^2 + 3}{4t^3}$$\n\
    \nFor the curve to be concave up, we need $\\frac{d^2y}{dx^2} > 0$. \nThe numerator\
    \ $3t^2 + 3$ is always positive. The denominator $4t^3$ is positive when $t\
    \ > 0$. \nSo, the curve is concave up on $(0, \\infty)$."
- id: q006
  title: 'Part 1: Horizontal and Vertical Tangents'
  type: freeResponse
  prompt: |-
    Find all points $(x,y)$ where the curve $x=2t^3+3t^2-12t,\ y=2t^3+3t^2+1$ has a vertical tangent.
  answer:
    gradingMode: selfCheck
    expected: |
      Vertical tangents occur at $(20,-3)$ and $(-7,6)$.
    keyPoints:
    - Set $\frac{dx}{dt}=0$ to find vertical tangent candidates.
    - Check $\frac{dy}{dt}\ne0$ at each candidate.
    - Substitute candidate $t$ values back into $x(t)$ and $y(t)$.
  explanation: |-
    First, find the derivatives:
    $$\frac{dx}{dt} = 6t^2 + 6t - 12 = 6(t^2 + t - 2) = 6(t+2)(t-1)$$
    $$\frac{dy}{dt} = 6t^2 + 6t = 6t(t+1)$$

    The condition for a vertical tangent is $\frac{dx}{dt}=0$ and $\frac{dy}{dt} \ne 0$:
    $$6(t+2)(t-1) = 0 \implies t = -2, 1$$

    Check $\frac{dy}{dt}$ at these points to ensure they are not cusps:
    *   At $t=-2$: $\frac{dy}{dt} = 6(-2)(-1) = 12 \ne 0$
    *   At $t=1$: $\frac{dy}{dt} = 6(1)(2) = 12 \ne 0$

    Now, find the $(x,y)$ coordinates for these $t$ values:
    *   For $t=-2$:
        $$x = 2(-8) + 3(4) - 12(-2) = -16 + 12 + 24 = 20$$
        $$y = 2(-8) + 3(4) + 1 = -16 + 12 + 1 = -3$$
        Point: $(20, -3)$
    *   For $t=1$:
        $$x = 2(1) + 3(1) - 12(1) = 2 + 3 - 12 = -7$$
        $$y = 2(1) + 3(1) + 1 = 2 + 3 + 1 = 6$$
        Point: $(-7, 6)$
- id: q007
  title: 'Part 1: Sketch a Polar Curve'
  type: graphingResponse
  prompt: |-
    Sketch the polar curve $r=1-2\sin\theta$. Identify the angles where the curve passes through the origin.
  answer:
    graphingAnswer:
      features:
        - type: PassesThrough
          pointValue: { x: 1.0, y: 0.0 }
          tolerance: 0.2
          weight: 1.0
        - type: PassesThrough
          pointValue: { x: 0.0, y: -1.0 }
          tolerance: 0.2
          weight: 1.0
        - type: PassesThrough
          pointValue: { x: -1.0, y: 0.0 }
          tolerance: 0.2
          weight: 1.0
        - type: PassesThrough
          pointValue: { x: 0.0, y: -3.0 }
          tolerance: 0.2
          weight: 1.0
        - type: PassesThrough
          pointValue: { x: 0.0, y: 0.0 }
          tolerance: 0.2
          weight: 1.0
  explanation: |-
    This is a limaçon with an inner loop because $\left|\frac{a}{b}\right| = \frac{1}{2} < 1$.

    To find where it passes through the origin, set $r=0$:
    $$0 = 1 - 2\sin\theta$$
    $$2\sin\theta = 1$$
    $$\sin\theta = \frac{1}{2}$$

    The angles in $[0, 2\pi)$ are $\theta = \frac{\pi}{6}$ and $\theta = \frac{5\pi}{6}$.

    The curve starts at $(1,0)$ for $\theta=0$, hits the origin at $\pi/6$, creates an inner loop extending down to $r=-1$ at $\theta=\pi/2$, comes back to the origin at $5\pi/6$, and then swings out to a maximum distance of $3$ at $\theta=3\pi/2$.
- id: q008
  title: 'Part 1: Identify Complex Polar Curve from Graph'
  type: multipleChoice
  prompt: |-
    Identify the equation of the given polar curve.

    ![Polar Limacon with Inner Loop](/assessments/calc2-parametric-polar/polar-limacon-hard.svg)
  choices:
  - id: c1
    text: '$r=1+\sin\theta$'
  - id: c2
    text: '$r=1-\sin\theta$'
  - id: c3
    text: '$r=1+2\sin\theta$'
  - id: c4
    text: '$r=1+2\cos\theta$'
  answer:
    choiceId: c3
  explanation: |-
    The graph shows a limaçon with an inner loop, oriented along the positive y-axis. The outer maximum distance from the pole is $3$, and the inner loop's maximum distance from the pole is $1$.

    Testing $r=1+2\sin\theta$:
    *   $\theta=\pi/2 \implies r=1+2(1)=3$. This matches the large loop pointing upwards.
    *   $\theta=3\pi/2 \implies r=1+2(-1)=-1$. This means the curve is $1$ unit away in the opposite direction (upwards), which forms the inner loop.

    The other options would be cardioids ($1\pm\sin\theta$) or oriented horizontally ($1+2\cos\theta$).
- id: q009
  title: 'Part 1: Tangent Line of Polar Curve'
  type: symbolicResponse
  prompt: |-
    Find the slope of the tangent line to the polar curve $r=\theta$ (Archimedean spiral) at $\theta=\pi$.
  answer:
    expectedLatex: '\pi'
    equivalenceMode: expression
    variables: []
    tolerance: 0.000001
  explanation: |-
    The formula for the slope of a polar curve is:
    $$\frac{dy}{dx} = \frac{r'\sin\theta + r\cos\theta}{r'\cos\theta - r\sin\theta}$$

    Given $r = \theta$, its derivative is $r' = 1$.
    Evaluate at $\theta = \pi$:
    $$r = \pi$$
    $$r' = 1$$

    Substitute into the slope formula:
    $$\frac{dy}{dx} = \frac{1\sin(\pi) + \pi\cos(\pi)}{1\cos(\pi) - \pi\sin(\pi)}$$
    $$\frac{dy}{dx} = \frac{1(0) + \pi(-1)}{1(-1) - \pi(0)} = \frac{-\pi}{-1} = \pi$$
    Wait! Numerator is $-\pi$, Denominator is $-1$. Slope is $\pi$. Let me correct the output string to $\pi$.
- id: q010
  title: 'Part 1: Horizontal Tangents of Polar Curve'
  type: freeResponse
  prompt: |-
    Find all values of $\theta$ in $[0, \pi]$ where the polar curve $r=2\cos(2\theta)$ has a horizontal tangent.
  answer:
    gradingMode: selfCheck
    expected: |
      Horizontal tangent values are $\theta=\frac{\pi}{2}$, $\theta=\arcsin\!\left(\frac{1}{\sqrt6}\right)$, and $\theta=\pi-\arcsin\!\left(\frac{1}{\sqrt6}\right)$.
    keyPoints:
    - Use $r'\sin\theta+r\cos\theta=0$.
    - Substitute $r=2\cos(2\theta)$ and $r'=-4\sin(2\theta)$.
    - Use double-angle identities to solve the trigonometric equation.
  explanation: |-
    For a horizontal tangent, set the numerator of $\frac{dy}{dx}$ equal to zero:
    $$\frac{dy}{d\theta} = r'\sin\theta + r\cos\theta = 0$$

    Given $r=2\cos(2\theta)$, we have $r'=-4\sin(2\theta)$:
    $$(-4\sin(2\theta))\sin\theta + (2\cos(2\theta))\cos\theta = 0$$

    Expand using double angle identities $\sin(2\theta) = 2\sin\theta\cos\theta$ and $\cos(2\theta) = 1-2\sin^2\theta$:
    $$-4(2\sin\theta\cos\theta)\sin\theta + 2(1-2\sin^2\theta)\cos\theta = 0$$
    $$-8\sin^2\theta\cos\theta + 2\cos\theta - 4\sin^2\theta\cos\theta = 0$$
    $$-12\sin^2\theta\cos\theta + 2\cos\theta = 0$$
    $$2\cos\theta(1 - 6\sin^2\theta) = 0$$

    This gives two cases:
    1.  $\cos\theta = 0 \implies \theta = \frac{\pi}{2}$
    2.  $1 - 6\sin^2\theta = 0 \implies \sin^2\theta = \frac{1}{6} \implies \sin\theta = \pm\frac{1}{\sqrt{6}}$. In $[0,\pi]$, this gives $\theta = \arcsin\left(\frac{1}{\sqrt{6}}\right)$ and $\theta = \pi - \arcsin\left(\frac{1}{\sqrt{6}}\right)$.
- id: q011
  title: 'Part 1: Identify Conic with Completing the Square'
  type: multipleChoice
  prompt: |-
    Identify the type of conic section represented by the equation $9x^2 - 4y^2 - 54x + 8y + 41 = 0$.
  choices:
  - id: c1
    text: Ellipse
  - id: c2
    text: Parabola
  - id: c3
    text: Circle
  - id: c4
    text: Hyperbola
  answer:
    choiceId: c4
  explanation: |-
    Group the $x$ and $y$ terms and complete the square:
    $$9(x^2 - 6x) - 4(y^2 - 2y) = -41$$
    $$9(x^2 - 6x + 9) - 4(y^2 - 2y + 1) = -41 + 9(9) - 4(1)$$
    $$9(x-3)^2 - 4(y-1)^2 = -41 + 81 - 4 = 36$$

    Divide by $36$:
    $$\frac{(x-3)^2}{4} - \frac{(y-1)^2}{9} = 1$$

    The minus sign between the squared terms indicates that this is a hyperbola.
- id: q012
  title: 'Part 1: Write Conic Equation from Foci and Vertices'
  type: symbolicResponse
  prompt: |-
    Write the standard equation of an ellipse with vertices at $(1, -4)$ and $(1, 6)$, and foci at $(1, -2)$ and $(1, 4)$.
  answer:
    expectedLatex: '\frac{(x-1)^2}{16}+\frac{(y-1)^2}{25}=1'
    equivalenceMode: expression
    variables:
    - x
    - y
    tolerance: 0.000001
  explanation: "The vertices and foci share the same x-coordinate ($x=1$), so the\
    \ major axis is vertical. \nThe standard equation is:\n$$\\frac{(x-h)^2}{b^2}\
    \ + \\frac{(y-k)^2}{a^2} = 1$$\n\nThe center $(h,k)$ is the midpoint of the\
    \ vertices: $(\\frac{1+1}{2}, \\frac{-4+6}{2}) = (1, 1)$.\nThe distance from\
    \ the center to a vertex is $a$: $a = 6 - 1 = 5$, so $a^2 = 25$.\nThe distance\
    \ from the center to a focus is $c$: $c = 4 - 1 = 3$, so $c^2 = 9$.\n\nFor an\
    \ ellipse, $b^2 = a^2 - c^2 = 25 - 9 = 16$.\n\nThe equation is:\n$$\\frac{(x-1)^2}{16}\
    \ + \\frac{(y-1)^2}{25} = 1$$"
- id: q013
  title: 'Part 1: Complex Parametric Area Setup'
  type: symbolicResponse
  prompt: |-
    Set up the integral for the area under the parametric curve $x=t^3-t,\ y=\sqrt{t}$ for $1 \le t \le 2$. Do not evaluate.
  answer:
    expectedLatex: '\int_{1}^{2}\sqrt{t}(3t^2-1)\,dt'
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0.000001
  explanation: |-
    Parametric area is computed with

    $$
    A=\int_{\alpha}^{\beta}y(t)x'(t)\,dt.
    $$

    Here $x'(t)=3t^2-1$, $y(t)=\sqrt{t}$, and the supplied parameter interval is $1\leq t\leq2$. Therefore

    $$
    A=\int_1^2\sqrt{t}(3t^2-1)\,dt.
    $$
- id: q014
  title: 'Part 2: Parametric Arc Length'
  type: freeResponse
  prompt: "Find the arc length of the parametric curve $x=\\ln(t),\\ y=e^t$ for $1\
    \ \\le t \\le 3$. \n\nProvide the setup integral and the final decimal answer\
    \ rounded to 3 decimal places."
  answer:
    gradingMode: selfCheck
    expected: |
      $$L=\int_1^3\sqrt{\frac{1}{t^2}+e^{2t}}\,dt\approx17.439.$$
    keyPoints:
    - Use parametric arc length.
    - Compute $x'(t)=\frac1t$ and $y'(t)=e^t$.
    - Include both the setup integral and rounded decimal value.
  explanation: |-
    The formula for parametric arc length is:
    $$L = \int_a^b \sqrt{\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2} \,dt$$

    Derivatives:
    $$\frac{dx}{dt} = \frac{1}{t}$$
    $$\frac{dy}{dt} = e^t$$

    Setup integral:
    $$L = \int_1^3 \sqrt{\left(\frac{1}{t}\right)^2 + (e^t)^2} \,dt = \int_1^3 \sqrt{\frac{1}{t^2} + e^{2t}} \,dt$$

    Evaluate using a calculator:
    $$L \approx 17.439$$
- id: q015
  title: 'Part 2: Polar Arc Length'
  type: freeResponse
  prompt: "Find the arc length of the polar curve $r=2\\sin^3\\left(\\frac{\\theta}{3}\\\
    right)$ for $0 \\le \\theta \\le \\pi$. \n\nProvide the setup integral and the\
    \ final decimal answer rounded to 3 decimal places."
  answer:
    gradingMode: selfCheck
    expected: |
      $$L=\int_0^\pi\sqrt{\left(2\sin^3\left(\frac{\theta}{3}\right)\right)^2+\left(2\sin^2\left(\frac{\theta}{3}\right)\cos\left(\frac{\theta}{3}\right)\right)^2}\,d\theta\approx1.532.$$
    keyPoints:
    - Use polar arc length.
    - Differentiate $r=2\sin^3(\theta/3)$ with the chain rule.
    - Include the setup integral and rounded decimal value.
  explanation: |-
    The formula for polar arc length is:
    $$L = \int_{\alpha}^{\beta} \sqrt{r^2 + \left(\frac{dr}{d\theta}\right)^2} \,d\theta$$

    Derivative:
    $$r' = 2 \cdot 3\sin^2\left(\frac{\theta}{3}\right)\cos\left(\frac{\theta}{3}\right) \cdot \frac{1}{3} = 2\sin^2\left(\frac{\theta}{3}\right)\cos\left(\frac{\theta}{3}\right)$$

    Setup integral:
    $$L = \int_0^{\pi} \sqrt{\left(2\sin^3\left(\frac{\theta}{3}\right)\right)^2 + \left(2\sin^2\left(\frac{\theta}{3}\right)\cos\left(\frac{\theta}{3}\right)\right)^2} \,d\theta$$

    Evaluate using a calculator:
    $$L \approx 1.532$$
- id: q016
  title: 'Part 2: Parametric Area'
  type: freeResponse
  prompt: |-
    Find the area enclosed by the loop of the parametric curve $x=t^2,\ y=t^3-3t$.

    Provide the setup integral and the final decimal answer rounded to 3 decimal places.
  answer:
    gradingMode: selfCheck
    expected: |
      $$A=\left|\int_{-\sqrt3}^{\sqrt3}(t^3-3t)(2t)\,dt\right|=7.200.$$
    keyPoints:
    - Find the loop interval from the self-intersection at $t=\pm\sqrt3$.
    - Use parametric area $A=\left|\int y(t)x'(t)\,dt\right|$.
    - Take absolute value so area is positive.
  explanation: "First, find where the curve crosses itself. The y-value must be\
    \ $0$ when $x$ is the same. \n$y = t(t^2 - 3) = 0 \\implies t=0, t=\\pm\\sqrt{3}$.\n\
    At $t=\\sqrt{3}$, $x=3$. At $t=-\\sqrt{3}$, $x=3$. So it crosses itself at $(3,0)$.\n\
    The loop is formed between $t=-\\sqrt{3}$ and $t=\\sqrt{3}$.\nBy symmetry, we\
    \ can find the area of the top half (from $t=-\\sqrt{3}$ to $t=0$) and double\
    \ it, or just integrate from $-\\sqrt{3}$ to $\\sqrt{3}$.\nWait, $x=t^2$, so\
    \ $dx/dt = 2t$.\nArea formula:\n$$A = \\left|\\int_{-\\sqrt{3}}^{\\sqrt{3}}\
    \ y(t)x'(t) \\,dt\\right| = \\left|\\int_{-\\sqrt{3}}^{\\sqrt{3}} (t^3-3t)(2t)\
    \ \\,dt\\right|$$\n\nEvaluate using a calculator:\n$$A = 7.200$$"
- id: q017
  title: 'Part 2: Polar Area Between Curves'
  type: freeResponse
  prompt: |-
    Find the area of the region that lies inside the circle $r=3\cos\theta$ and outside the cardioid $r=1+\cos\theta$.

    Provide the setup integral and the final decimal answer rounded to 3 decimal places.
  answer:
    gradingMode: selfCheck
    expected: |
      $$A=\frac12\int_{-\pi/3}^{\pi/3}\left((3\cos\theta)^2-(1+\cos\theta)^2\right)\,d\theta\approx3.142.$$
    keyPoints:
    - Find intersections from $3\cos\theta=1+\cos\theta$.
    - Use polar area between curves.
    - Subtract inner radius squared from outer radius squared on the shared interval.
  explanation: |-
    First, find the points of intersection:
    $$3\cos\theta = 1+\cos\theta \implies 2\cos\theta = 1 \implies \cos\theta = \frac{1}{2}$$
    $$\theta = \pm\frac{\pi}{3}$$

    The area between polar curves is:
    $$A = \frac{1}{2}\int_{\alpha}^{\beta} (r_{outer}^2 - r_{inner}^2) \,d\theta$$

    The circle $3\cos\theta$ is the outer curve, and the cardioid $1+\cos\theta$ is the inner curve on $[-\frac{\pi}{3}, \frac{\pi}{3}]$.

    Setup integral:
    $$A = \frac{1}{2}\int_{-\frac{\pi}{3}}^{\frac{\pi}{3}} \left( (3\cos\theta)^2 - (1+\cos\theta)^2 \right) \,d\theta$$

    Evaluate using a calculator:
    $$A = 3.142$$
