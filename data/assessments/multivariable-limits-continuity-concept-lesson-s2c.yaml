lesson:
  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 1 → The Derivative if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Approach from every direction
    required: true
    content: 'A two-variable limit exists only if every path approaching the point produces one common value. In Multivariable Limits and Continuity, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
    media:
    - type: image
      src: /media/calculus-3/multivariable-limits.svg
      alt: Original multivariable limits and continuity reference visual.
      caption: 
    check:
      id: check-01
      type: multipleChoice
      prompt: What must agree for a multivariable limit to exist?
      choices:
      - id: a
        text: all approach paths
        media: []
        issueSignals: []
      - id: b
        text: the limit does not exist (answers 'What can two paths with different limits prove?', not 'What must agree for a multivariable limit to exist?')
        media: []
        issueSignals:
        - id: mathematical-translation-error
          domains: []
      - id: c
        text: visualizing behavior (answers 'What are level curves useful for near a point?', not 'What must agree for a multivariable limit to exist?')
        media: []
        issueSignals:
        - id: mathematical-translation-error
          domains: []
      - id: d
        text: limit equals function value (answers 'What is continuity at a point?', not 'What must agree for a multivariable limit to exist?')
        media: []
        issueSignals:
        - id: mathematical-translation-error
          domains: []
