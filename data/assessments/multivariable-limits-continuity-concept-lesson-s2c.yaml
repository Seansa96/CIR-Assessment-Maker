  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 1 → The Derivative if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Approach from every direction
    required: true
    content: 'A two-variable limit exists only if every path approaching the point produces one common value. In Multivariable Limits and Continuity, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
