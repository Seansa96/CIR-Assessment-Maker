  - id: s02
    title: One path can disprove existence
    required: true
    content: Two valid paths with different limiting values prove the limit does not exist. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
