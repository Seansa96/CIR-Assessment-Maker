  - id: s04
    title: Worked micro-example
    required: true
    content: 'Use the short task Determine whether $f(x,y)=\frac{x^2-y^2}{x^2+y^2}$ has a limit at $(0,0)$. as a model. First, test one path: What does $f(x,0)$ approach? The resulting statement is 1. This identifies the governing relation and gives a checkable intermediate result.'
