questions:
- id: q-spring-work
  title: Work Done by a Compressed Spring
  type: symbolicResponse
  prompt: |
    A spring with $k = 200\text{ N/m}$ is compressed from equilibrium ($x_i = 0$) to a position $x_f = -0.10\text{ m}$.
    Calculate the work (in Joules) done *by the spring* during this compression.
  answer:
    gradingMode: auto
    expectedLatex: -1.0
    equivalenceMode: expression
    tolerance: 0.1
  explanation: 'The work done by the spring is $W_s = -\\Delta U_s = -(U_{s,f} - U_{s,i})$.\n$U_{s,f} = \\frac{1}{2}(200)(-0.10)^2 = 1.0\\text{ J}$. \n$U_{s,i} = 0\\text{ J}$. \nSo $W_s = -1.0\\text{ J}$. The spring did negative work because it pushed outward while the displacement was inward.\n'
