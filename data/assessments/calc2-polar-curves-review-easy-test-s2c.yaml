authoring: { visualRequirement: required, visualRationale: 'Polar rays, loops, symmetry, and integration regions are spatial models; original diagrams accompany representative prompts.', difficultyTier: easy }
questions:
  - { id: q001, type: symbolicResponse, prompt: 'Convert the polar point $(2,\pi/3)$ to Cartesian coordinates.', answer: { expectedLatex: '(-1,sqrt(3))', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $x=r\cos\theta=2(-1/2)=-1$ and $y=r\sin\theta=2(\sqrt3/2)=\sqrt3$. Why it works: Polar coordinates resolve a radius along a ray into horizontal and vertical components. Common trap: Interchanging sine and cosine.', difficultyDimensions: [representationTransfer, identityConstruction], difficultyEvidence: 'Transfers a polar ray into two Cartesian components using exact trig values.' }
  - { id: q002, type: symbolicResponse, prompt: 'Convert Cartesian point $(-3,3)$ to polar coordinates with $r>0$ and $0\le\theta<2\pi$.', answer: { expectedLatex: '(3sqrt(2),3pi/4)', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $r=\sqrt{(-3)^2+3^2}=3\sqrt2$. The point is in quadrant II with reference angle $\pi/4$, so $\theta=3\pi/4$. Why it works: Radius is distance from the origin and angle must match the quadrant. Common trap: Giving $\pi/4$, which points to quadrant I.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: 'Computes radius and applies a quadrant condition to select the angle.' }
  - { id: q003, type: freeResponse, prompt: 'State the symmetry test showing that $r=2\cos\theta$ is symmetric about the polar axis.', answer: { gradingMode: selfCheck, keyPoints: ['replace theta by negative theta', 'cosine unchanged', 'equation unchanged'] }, explanation: 'Solution: Replace $\theta$ by $-\theta$: $r=2\cos(-\theta)=2\cos\theta$, unchanged. Why it works: Reflecting over the polar axis negates the angle. Common trap: Testing $-r$ instead, which represents a different symmetry operation.', difficultyDimensions: [representationTransfer, identityConstruction], difficultyEvidence: 'Relates a geometric reflection to a trig substitution and evaluates invariance.' }
  - { id: q004, type: symbolicResponse, prompt: 'For $r=4\cos\theta$, give the Cartesian equation.', answer: { expectedLatex: '(x-2)^2+y^2=4', equivalenceMode: expression, variables: [x,y], tolerance: 0.000001 }, explanation: 'Solution: Multiply by $r$: $r^2=4r\cos\theta$, so $x^2+y^2=4x$, hence $(x-2)^2+y^2=4$. Why it works: $r^2=x^2+y^2$ and $r\cos\theta=x$. Common trap: Writing a circle centered at the origin.', difficultyDimensions: [representationTransfer, simplification], difficultyEvidence: 'Uses polar-Cartesian identities and completes a square.' }
  - { id: q005, type: freeResponse, prompt: '![Polar ray and loop](/media/calculus/polar-review-loop-sector.svg) For $r=2\sin\theta$, identify the curve and its center and radius.', answer: { gradingMode: selfCheck, keyPoints: ['circle', 'center zero comma one', 'radius one'] }, explanation: 'Solution: $r^2=2r\sin\theta$ becomes $x^2+y^2=2y$, or $x^2+(y-1)^2=1$. Why it works: Multiplying by r converts the polar equation to a standard circle. Common trap: Centering it at $(0,2)$ instead of halving the y coefficient.', difficultyDimensions: [representationTransfer, simplification], difficultyEvidence: 'Converts a polar equation and completes the square to read geometry.' }
  - { id: q006, type: symbolicResponse, prompt: 'Find the area inside $r=2$ for $0\le\theta\le\pi/2$.', answer: { expectedLatex: 'pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $A=\frac12\int_0^{\pi/2}2^2d\theta=\frac12\cdot4\cdot\pi/2=\pi$. Why it works: Polar area accumulates sectors. Common trap: Omitting the one-half.' , difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Builds a sector-area integral from a radius and angular bounds.' }
  - { id: q007, type: symbolicResponse, prompt: 'Find the area of one petal of $r=3\sin(2\theta)$.', answer: { expectedLatex: '9pi/8', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: One petal is traced on $0\le\theta\le\pi/2$? No: use $0\le\theta\le\pi/2$ traces two petals. One petal is $0\le\theta\le\pi/2$ for $\sin2\theta\ge0$ but it returns at $\pi/2$; this is one petal and $A=\frac92\int_0^{\pi/2}\sin^22\theta d\theta=9\pi/8$. Why it works: Zeros locate petal endpoints. Common trap: Multiplying by four after already integrating a full petal.' , difficultyDimensions: [modelOrDerivation, domainCondition], difficultyEvidence: 'Uses polar zeros to choose a petal interval and integrates a sector model.' }
  - { id: q008, type: freeResponse, prompt: 'Find the intersection of $r=2$ and $r=2\cos\theta$ in the nonnegative x-axis direction.', answer: { gradingMode: selfCheck, keyPoints: ['theta equals zero', 'r equals two', 'Cartesian point 2 comma zero'] }, explanation: 'Solution: Set $2=2\cos\theta$, giving $\cos\theta=1$ and $\theta=0$ on the stated ray. Thus the point is $(r,\theta)=(2,0)$. Why it works: Same polar coordinates require equal radii at the same angle. Common trap: Inventing a non-solution angle.' , difficultyDimensions: [modelOrDerivation, domainCondition], difficultyEvidence: 'Equates radius functions and checks the stated direction.' }
  - { id: q009, type: symbolicResponse, prompt: 'Find the area enclosed by $r=1+\cos\theta$.', answer: { expectedLatex: '3pi/2', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $A=\frac12\int_0^{2\pi}(1+\cos\theta)^2d\theta=\frac12(2\pi+\pi)=3\pi/2$. Why it works: A full cardioid is traced once over $0$ to $2\pi$. Common trap: The cross term integrates to zero, but $\cos^2$ does not.', difficultyDimensions: [identityConstruction, modelOrDerivation], difficultyEvidence: 'Selects a full trace and evaluates a squared-trig area integral.' }
  - { id: q010, type: symbolicResponse, prompt: 'Find the polar arc length of $r=2\theta$ on $0\le\theta\le1$.', answer: { expectedLatex: 'sqrt(2)+ln(1+sqrt(2))', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $dr/d\theta=2$, so $L=2\int_0^1\sqrt{1+\theta^2}d\theta=[\theta\sqrt{1+\theta^2}+\ln(\theta+\sqrt{1+\theta^2})]_0^1=\sqrt2+\ln(1+\sqrt2)$. Why it works: Polar length uses radial change as well as angular motion. Common trap: Using $r$ instead of $\sqrt{r^2+(r'')^2}$.' , difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Builds the polar length expression and applies a standard radical antiderivative.' }
  - { id: q011, type: freeResponse, prompt: 'Classify $r=2+4\cos\theta$ as a rose, cardioid, limacon with inner loop, or circle.', answer: { gradingMode: selfCheck, keyPoints: ['limacon with inner loop', 'absolute b greater than a', 'cosine gives horizontal orientation'] }, explanation: 'Solution: This is $a+b\cos\theta$ with $|b|>|a|$, so it is a limacon with an inner loop, oriented about the polar axis. Why it works: The relative constants determine whether negative r values create a loop. Common trap: Calling every $a+b\cos\theta$ a cardioid.' , difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: 'Maps coefficient comparison to a polar-curve classification.' }
  - { id: q012, type: symbolicResponse, prompt: 'For $r=2\cos(3\theta)$, state the number of petals.', answer: { expectedLatex: '3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: For $r=a\cos(n\theta)$ with odd $n$, there are $n$ petals; hence 3. Why it works: Negative r supplies the opposite-direction petals during the trace. Common trap: Always using $2n$.' , difficultyDimensions: [identityConstruction, representationTransfer], difficultyEvidence: 'Uses the parity rule and the negative-radius representation.' }
  - { id: q013, type: symbolicResponse, prompt: 'Find the area between $r=2$ and $r=\theta$ for $0\le\theta\le1$.', answer: { expectedLatex: '2-1/6', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Outer radius is 2, so $A=\frac12\int_0^1(4-\theta^2)d\theta=2-1/6=11/6$. Why it works: Area between polar curves uses outer squared minus inner squared. Common trap: Subtracting radii before squaring.' , difficultyDimensions: [modelOrDerivation, simplification], difficultyEvidence: 'Compares radii across a stated interval and constructs an annular-sector integral.' }
  - { id: q014, type: freeResponse, prompt: 'Give one equivalent polar coordinate pair for $(r,\theta)=(3,0)$ using a negative radius.', answer: { gradingMode: selfCheck, keyPoints: ['negative three comma pi', 'angle differs by pi', 'same Cartesian point'] }, explanation: 'Solution: $(-3,\pi)$ is equivalent because reversing the radius and rotating the ray by $\pi$ reaches the same point. Why it works: $(r,\theta)$ and $(-r,\theta+\pi)$ represent one Cartesian point. Common trap: Negating r without changing the angle.' , difficultyDimensions: [representationTransfer, identityConstruction], difficultyEvidence: 'Uses the negative-radius equivalence to construct a second coordinate description.' }
  - { id: q015, type: symbolicResponse, prompt: 'For $r=1-\cos\theta$, find $r$ at $\theta=\pi$ and interpret the point.', answer: { expectedLatex: '2', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $r=1-(-1)=2$, so the point lies two units on the negative x-axis. Why it works: Angle $\pi$ points left from the pole. Common trap: Treating a positive radius as a positive x-coordinate.' , difficultyDimensions: [representationTransfer, identityConstruction], difficultyEvidence: 'Evaluates a trig radius and interprets its directed ray.' }
  - { id: q016, type: freeResponse, prompt: 'State the two checks needed before using a polar area integral for a named loop.', answer: { gradingMode: selfCheck, keyPoints: ['find zeros or intersections for bounds', 'ensure loop traced exactly once', 'check which radius is outer if between curves'] }, explanation: 'Solution: Find the endpoints (usually zeros or intersections) and verify the selected interval traces the desired loop once; for two curves, also identify outer versus inner radius. Why it works: Polar integrals count directed sectors over the chosen trace. Common trap: Taking a convenient $0$ to $2\pi$ interval without checking retracing.' , difficultyDimensions: [modelOrDerivation, domainCondition], difficultyEvidence: 'Derives bounds from geometry and checks traversal multiplicity.' }
  - { id: q017, type: symbolicResponse, prompt: 'Convert $r=4\sin\theta$ to Cartesian form.', answer: { expectedLatex: 'x^2+(y-2)^2=4', equivalenceMode: expression, variables: [x,y], tolerance: 0.000001 }, explanation: 'Solution: $r^2=4r\sin\theta$ gives $x^2+y^2=4y$, so $x^2+(y-2)^2=4$. Why it works: $r\sin\theta=y$. Common trap: Putting the center at $(2,0)$, which would correspond to cosine.' , difficultyDimensions: [representationTransfer, simplification], difficultyEvidence: 'Applies a coordinate identity and completes a square.' }
  - { id: q018, type: symbolicResponse, prompt: 'Find the area of the sector $r=5$, $0\le\theta\le\pi/6$.', answer: { expectedLatex: '25pi/12', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $A=\frac12(5^2)(\pi/6)=25\pi/12$. Why it works: This is the constant-radius special case of the polar area formula. Common trap: Using degrees in a calculus integral.' , difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Recognizes a sector as a constant-radius polar-area model.' }
  - { id: q019, type: freeResponse, prompt: 'Explain why $r=-2$ is still a circle of radius 2.', answer: { gradingMode: selfCheck, keyPoints: ['negative radius reverses each ray', 'all directions still occur', 'distance from pole is two'] }, explanation: 'Solution: At every angle, negative r places the point two units on the opposite ray; as the angle varies, every point at distance 2 occurs. Why it works: Radius sign changes direction, not distance magnitude. Common trap: Treating negative r as an invalid radius.' , difficultyDimensions: [representationTransfer, proofJustification], difficultyEvidence: 'Uses the negative-radius mapping to justify the complete locus.' }
  - { id: q020, type: freeResponse, prompt: 'Describe how a polar graph lets you decide whether a curve has an inner loop.', answer: { gradingMode: selfCheck, keyPoints: ['solve r equals zero', 'look for negative radius interval', 'trace opposite rays', 'separate loop bounds'] }, explanation: 'Solution: Locate zeros of r and determine whether r becomes negative between them. Negative values plot on opposite rays and can create a separate inner loop; use consecutive zeros to isolate it. Why it works: The sign of r changes the plotted direction. Common trap: Plotting negative r on the same ray.' , difficultyDimensions: [domainCondition, representationTransfer], difficultyEvidence: 'Connects zeros and sign changes to the geometric loop structure.' }
