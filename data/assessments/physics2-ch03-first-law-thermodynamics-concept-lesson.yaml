      explanation: >
        Solution: During name the model and quantities for 'First Law of Thermodynamics: Concept Lesson', first declare the sign convention, calculate heat and work separately, then combine their signed values. Then apply Delta U = Q - W with one consistent coordinate system and solve for the requested quantity.


        Why it works: Delta U = Q - W connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
