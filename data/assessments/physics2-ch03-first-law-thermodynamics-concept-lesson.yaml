lesson:
  introduction: >
    This lesson develops a repeatable way to solve 'First Law of Thermodynamics: Concept Lesson' problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch03-first-law-thermodynamics-s1
    title: Name the model and quantities
    required: true
    content: >
      'First Law of Thermodynamics: Concept Lesson' uses Delta U = Q - W. In the name the model and quantities stage, declare the sign convention, calculate heat and work separately, then combine their signed values.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving 'First Law of Thermodynamics: Concept Lesson' problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch03-first-law-thermodynamics-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for 'First Law of Thermodynamics: Concept Lesson', what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use Delta U = Q - W after you declare the sign convention, calculate heat and work separately, then combine their signed values.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this 'First Law of Thermodynamics: Concept Lesson' problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch03-first-law-thermodynamics-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables Delta U = Q - W relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch03-first-law-thermodynamics-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit 'First Law of Thermodynamics: Concept Lesson'.
        media: []
        issueSignals:
        - id: physics2-physics2-ch03-first-law-thermodynamics-units-error
          domains:
