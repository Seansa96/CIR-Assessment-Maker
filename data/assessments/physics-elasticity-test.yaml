  type: numericResponse
  prompt: |
    A steel elevator cable has a maximum yield stress of $2.5 \times 10^8\text{ N/m}^2$. The elevator car has a mass of $1200\text{ kg}$ and must be capable of accelerating upward at $2.0\text{ m/s}^2$ without the cable yielding. 
    
    Using $g = 9.8\text{ m/s}^2$, what is the **minimum required radius** of the steel cable in millimeters?
  answer:
    value: 4.25
    tolerance: 0.05
  explanation: |
    Solution:
    First, find the maximum tension $T$ in the cable using Newton's Second Law for the upward accelerating elevator:
    $$ \sum F_y = T - mg = ma $$
    $$ T = m(g + a) = 1200(9.8 + 2.0) = 1200(11.8) = 14,160\text{ N} $$
    
    The yield stress $\sigma_{\text{yield}}$ is the maximum allowable force per unit area:
    $$ \sigma_{\text{yield}} = \frac{T}{A} $$
    $$ A = \frac{T}{\sigma_{\text{yield}}} = \frac{14,160}{2.5 \times 10^8} = 5.664 \times 10^{-5}\text{ m}^2 $$
    
    The cross-sectional area is circular, so $A = \pi r^2$:
    $$ r = \sqrt{\frac{A}{\pi}} = \sqrt{\frac{5.664 \times 10^{-5}}{\pi}} \approx 0.004246\text{ m} $$
    
    Convert to millimeters:
    $$ r \approx 4.25\text{ mm} $$
    
    Why it works: The cable must support not just the static weight of the elevator, but the additional force required to accelerate it upwards. Finding the tension correctly is the critical first step before applying the elasticity boundary condition.
