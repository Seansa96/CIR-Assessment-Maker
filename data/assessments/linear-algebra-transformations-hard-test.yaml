questions:
  - id: test-hard-geometric-matrix
    type: multipleChoice
    prompt: |
      Let $T: \mathbb{R}^2 \to \mathbb{R}^2$ be a linear transformation that first reflects points across the line $y = x$, and then rotates points by $180^\circ$ around the origin.
      Find the standard matrix for $T$.
    choices:
      - id: c1
        text: '$\begin{bmatrix} 0 & -1 \\ -1 & 0 \end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix} -1 & 0 \\ 0 & -1 \end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix} 0 & -1 \\ 1 & 0 \end{bmatrix}$'
    answer:
      choiceId: c1
    explanation: |
      We track $\vec{e}_1 = (1,0)$ and $\vec{e}_2 = (0,1)$ through both steps.
      **Step 1 – Reflect across $y = x$**: Swaps coordinates. $(1,0) \to (0,1)$ and $(0,1) \to (1,0)$.
      **Step 2 – Rotate $180°$**: Negates both coordinates. $(0,1) \to (0,-1)$ and $(1,0) \to (-1,0)$.
      So $T(\vec{e}_1) = \begin{bmatrix}0\\-1\end{bmatrix}$ and $T(\vec{e}_2) = \begin{bmatrix}-1\\0\end{bmatrix}$,
      giving $A = \begin{bmatrix} 0 & -1 \\ -1 & 0 \end{bmatrix}$.

  - id: test-hard-onto-parameter
    type: multipleChoice
    prompt: |
      Let $T: \mathbb{R}^3 \to \mathbb{R}^3$ be a linear transformation whose standard matrix is $A = \begin{bmatrix} 1 & -3 & 2 \\ -2 & 6 & -4 \\ 0 & 1 & h \end{bmatrix}$. 
      For what value of $h$ is the transformation **onto** $\mathbb{R}^3$?
    choices:
      - id: c1
        text: '$h = 0$'
      - id: c2
        text: '$h \neq 0$'
      - id: c3
        text: 'It is onto for all values of $h$.'
      - id: c4
        text: 'It is not onto for any value of $h$.'
    answer:
      choiceId: c4
    explanation: |
      To be onto, the matrix needs a pivot in every row (3 rows ⟹ 3 pivots needed).
      Notice that row 2 = $-2 \times$ row 1: $[-2, 6, -4] = -2 \times [1, -3, 2]$. Row 2 will always zero out during row reduction, regardless of $h$.
      This leaves at most 2 pivot rows, so the transformation can never span all of $\mathbb{R}^3$. It is not onto for any value of $h$.

  - id: test-hard-kernel-dimension
    type: multipleChoice
    prompt: |
      Let $T: \mathbb{R}^5 \to \mathbb{R}^3$ be a linear transformation. If $T$ is **onto** $\mathbb{R}^3$, what is the dimension of the kernel of $T$?
    choices:
      - id: c1
        text: '0'
      - id: c2
        text: '2'
      - id: c3
        text: '3'
      - id: c4
        text: '5'
    answer:
      choiceId: c2
    explanation: |
      If $T$ is onto $\mathbb{R}^3$, then the image of $T$ fills all of $\mathbb{R}^3$, meaning the rank of the standard matrix is 3.
      By the Rank-Nullity Theorem, for a transformation from $\mathbb{R}^5$:
      $$\text{rank} + \text{nullity} = n = 5$$
      $$3 + \text{dim}(\ker T) = 5 \implies \text{dim}(\ker T) = 2$$
      The kernel is 2-dimensional.
