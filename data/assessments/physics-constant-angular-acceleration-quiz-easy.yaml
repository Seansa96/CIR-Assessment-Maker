questions:
- id: q001
  title: Angular acceleration
  type: numericResponse
  prompt: A wheel speeds up from $2.0$ to $10.0\text{ rad/s}$ in $4.0\text{ s}$. What
    is $\alpha$?
  answer:
    value: 2.0
    tolerance: 0.02
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $\alpha=(10-2)/4=2.0\text{ rad/s}^2$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q002
  title: Final angular speed
  type: numericResponse
  prompt: A rotor starts at $3.0\text{ rad/s}$ with $\alpha=1.5\text{ rad/s}^2$ for
    $6.0\text{ s}$. What is $\omega_f$?
  answer:
    value: 12.0
    tolerance: 0.05
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $\omega_f=3.0+1.5(6.0)=12.0\text{ rad/s}$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q003
  title: Angular displacement from rest
  type: numericResponse
  prompt: A wheel starts from rest with $\alpha=4.0\text{ rad/s}^2$ for $3.0\text{
    s}$. What angle is covered?
  answer:
    value: 18.0
    tolerance: 0.1
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $\theta=\frac12\alpha t^2=\frac12(4)(9)=18\text{ rad}$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q004
  title: Time to stop
  type: numericResponse
  prompt: A disk slows from $20\text{ rad/s}$ to rest with $\alpha=-5.0\text{ rad/s}^2$.
    How long does it take?
  answer:
    value: 4.0
    tolerance: 0.02
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $t=(0-20)/(-5)=4.0\text{ s}$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q005
  title: Angle while slowing
  type: numericResponse
  prompt: A wheel slows from $12$ to $4\text{ rad/s}$ in $2.0\text{ s}$. What angle
    is covered?
  answer:
    value: 16.0
    tolerance: 0.1
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $\omega_{avg}=8\text{ rad/s}$, so $\theta=8(2)=16\text{ rad}$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q006
  title: No-time equation
  type: multipleChoice
  prompt: Which equation is most direct when time is not given?
  choices:
  - id: a
    text: $\omega_f^2=\omega_i^2+2\alpha\theta$
  - id: b
    text: $\theta=\omega_it+\frac12\alpha t^2$
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: c
    text: $\omega_f=\omega_i+\alpha t$
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: d
    text: $v=\omega R$
    issueSignals:
    - id: rotational-concept-misunderstood
  answer:
    choiceId: a
  explanation: 'Solution:

    $\omega_f^2=\omega_i^2+2\alpha\theta$


    Why it works:

    Use the no-time kinematic equation.


    Why the other choices fail:

    The distractors relate to common errors in fixed-axis rotation, such as confusing
    linear and angular kinematics, using the wrong lever arm, or misunderstanding
    moment of inertia.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q007
  title: Find alpha without time
  type: numericResponse
  prompt: A wheel starts at $5$ and reaches $13\text{ rad/s}$ after $18\text{ rad}$.
    What is $\alpha$?
  answer:
    value: 4.0
    tolerance: 0.05
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $\alpha=(169-25)/(36)=4.0\text{ rad/s}^2$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q008
  title: Revolutions to radians
  type: numericResponse
  prompt: How many radians are in $4.0$ revolutions?
  answer:
    value: 25.133
    tolerance: 0.02
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $4(2\pi)=8\pi\approx25.13\text{ rad}$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q009
  title: Slowing sign
  type: multipleChoice
  prompt: 'If a wheel is rotating clockwise and slowing, angular acceleration:'
  choices:
  - id: a
    text: points opposite angular velocity under the chosen sign convention
  - id: b
    text: must be zero
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: c
    text: must have the same sign
    issueSignals:
    - id: sign-error
  - id: d
    text: has units of radians only
    issueSignals:
    - id: rotational-concept-misunderstood
  answer:
    choiceId: a
  explanation: 'Solution:

    points opposite angular velocity under the chosen sign convention


    Why it works:

    Slowing means angular acceleration opposes angular velocity.


    Why the other choices fail:

    The distractors relate to common errors in fixed-axis rotation, such as confusing
    linear and angular kinematics, using the wrong lever arm, or misunderstanding
    moment of inertia.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q010
  title: Average angular speed
  type: numericResponse
  prompt: A wheel changes uniformly from $6$ to $14\text{ rad/s}$. What is average
    angular speed?
  answer:
    value: 10.0
    tolerance: 0.02
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $\omega_{avg}=(6+14)/2=10\text{ rad/s}$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
