questions:
- id: q1
  type: numericResponse
  prompt: A fan initially at rest accelerates at $3.0 \text{ rad/s}^2$ for $4.0 \text{
    s}$. What is its final angular velocity?
  answer:
    value: 12.0
    tolerance: 0.5
  explanation: $\omega_f = \omega_0 + \alpha t = 0 + 3(4) = 12 \text{ rad/s}$.
