    - id: t12
      term: Electrostatic equilibrium
      definition: In electrostatic equilibrium, charges in a conductor have finished rearranging, the field inside the conducting material is zero, and excess charge resides on the surface.
      notation: 
      examples: []
      aliases: []
      media: []
      tags: []
      drills:
      - id: t12-drill
        type: flashcard
        prompt: What does Electrostatic equilibrium mean in Electric Charges and Fields?
        answer:
          expected: In electrostatic equilibrium, charges in a conductor have finished rearranging, the field inside the conducting material is zero, and excess charge resides on the surface.
          expectedLatex: 
          aliases: []
          media: []
          choiceId: 
        explanation: >-
          Solution: With no continuing charge motion, the conductor's interior field must be zero; otherwise mobile charges would still accelerate.


          Why it works: A nonzero interior field would keep mobile charges moving, so equilibrium requires the conductor's interior field to vanish.
        tags:
        - physics2-electric-charges-fields
        skills: []
        issueSignals: []
        choices: []
