glossary:
  introduction: Core terms for electric charges.
  sections:
  - id: terms
    title: Core terms
    required: true
    content: Definitions of fields and forces.
    entries:
    - id: t1
      term: Electric Field
      definition: A vector field defining the electric force per unit charge at each
        point in space.
    - id: t2
      term: Superposition Principle
      definition: The net electric force or field is the vector sum of individual
        forces or fields.
    - id: t3
      term: Dipole
      definition: A pair of equal and opposite point charges separated by a small
        distance.
