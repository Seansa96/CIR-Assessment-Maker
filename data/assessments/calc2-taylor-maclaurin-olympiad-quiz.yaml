schemaVersion: 1
id: calc2-taylor-maclaurin-olympiad-quiz
title: Taylor and Maclaurin Series Olympiad Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: taylor-maclaurin
skills:
- Extract advanced coefficients from composite and inverse series
- Use symmetry, analyticity, and ODE recurrences to constrain expansions
- Establish coefficient identities through power-series products
navigation:
  learningGoal: practice
  activityType: mixedPractice
  tags:
  - calculus-2
  - taylor-maclaurin
  - olympiad
  - analytic-series
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - extract-coefficients-with-complex-exponentials
  prompt: |
    What is the coefficient of $x^{10}$ in $e^x\cos x$?
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1/10!$
  - id: c
    text: $32/10!$
  - id: d
    text: $-32/10!$
  answer:
    choiceId: a
  explanation: |-
    The coefficient is $\operatorname{Re}(1+i)^{10}/10!$, and $(1+i)^{10}=32i$ is purely imaginary.
- id: q002
  type: multipleChoice
  skills:
  - recognize-sparse-composite-series
  prompt: |
    What is the coefficient of $x^9$ in $\sin(x^2)$?
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1/9!$
  - id: c
    text: $-1/6$
  - id: d
    text: $1/120$
  answer:
    choiceId: a
  explanation: The nonzero exponents are $4k+2$, so no ninth-degree term occurs.
- id: q003
  type: multipleChoice
  skills:
  - evaluate-high-cancellation-limits
  prompt: |
    Evaluate
    $\displaystyle\lim_{x\to0}\frac{\sin x-x+x^3/6}{x^5}$.
  choices:
  - id: a
    text: $1/120$
  - id: b
    text: $-1/120$
  - id: c
    text: $1/24$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: After cancellation, the first surviving sine term is $x^5/5!$.
- id: q004
  type: multipleChoice
  skills:
  - compute-logarithmic-cauchy-products
  prompt: |
    What is the coefficient of $x^8$ in $[\log(1+x)]^2$?
  choices:
  - id: a
    text: $363/560$
  - id: b
    text: $-363/560$
  - id: c
    text: $1/64$
  - id: d
    text: $1/8$
  answer:
    choiceId: a
  explanation: |-
    The coefficient is $\sum_{k=1}^{7}(-1)^k(-1)^{8-k}/[k(8-k)]=2H_7/8=363/560$.
- id: q005
  type: multipleChoice
  skills:
  - extract-tangent-series-coefficients
  prompt: |
    What is the coefficient of $x^5$ in the Maclaurin series for
    $\tan x$?
  choices:
  - id: a
    text: $2/15$
  - id: b
    text: $1/15$
  - id: c
    text: $-2/15$
  - id: d
    text: $1/120$
  answer:
    choiceId: a
  explanation: |-
    Dividing the sine series by the cosine series gives $\tan x=x+x^3/3+2x^5/15+\cdots$.
- id: q006
  type: multipleChoice
  skills:
  - derive-ode-coefficient-recurrences
  prompt: |
    If $y=\sum_{n=0}^{\infty}a_nx^n$ satisfies $y''=xy$, which
    recurrence holds for $n\ge1$?
  choices:
  - id: a
    text: $a_{n+2}=a_{n-1}/[(n+2)(n+1)]$
  - id: b
    text: $a_{n+2}=a_n/[(n+2)(n+1)]$
  - id: c
    text: $a_{n+1}=na_n$
  - id: d
    text: $a_{n+2}=-(n+2)(n+1)a_{n-1}$
  answer:
    choiceId: a
  explanation: The coefficient of $x^n$ in xy is $a_{n-1}$, while in the second derivative it is $(n+2)(n+1)a_{n+2}$.
- id: q007
  type: multipleChoice
  skills:
  - invert-series-with-lagrange-inversion
  prompt: |
    Near zero, let w be the inverse function of $x\mapsto xe^x$. What
    is the coefficient of $x^4$ in w?
  choices:
  - id: a
    text: $-8/3$
  - id: b
    text: $8/3$
  - id: c
    text: $-1/24$
  - id: d
    text: $4$
  answer:
    choiceId: a
  explanation: Lagrange inversion gives $[x^n]w=(-n)^{n-1}/n!$; at n equals four this is minus sixty-four
    over twenty-four.
- id: q008
  type: multipleChoice
  skills:
  - compose-exponential-series
  prompt: |
    What is the coefficient of $x^{12}$ in $e^{x^3}$?
  choices:
  - id: a
    text: $1/24$
  - id: b
    text: $1/12!$
  - id: c
    text: $1/4$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: The term $(x^3)^k/k!$ reaches degree twelve when k equals four.
- id: q009
  type: multipleChoice
  skills:
  - use-parity-to-constrain-series
  prompt: |
    An analytic function near zero satisfies $f(-x)=f(x)$. What must be
    true of its Maclaurin coefficients?
  choices:
  - id: a
    text: Every odd-degree coefficient is zero.
  - id: b
    text: Every even-degree coefficient is zero.
  - id: c
    text: All coefficients are positive.
  - id: d
    text: Only finitely many coefficients are nonzero.
  answer:
    choiceId: a
  explanation: |-
    Comparing $\sum a_n(-x)^n$ with $\sum a_nx^n$ forces $a_n=-a_n$ for each odd n.
- id: q010
  type: multipleChoice
  skills:
  - recognize-bernoulli-series-structure
  prompt: |
    What is the coefficient of $x^3$ in the removable extension of
    $x/(e^x-1)$?
  choices:
  - id: a
    text: $0$
  - id: b
    text: $-1/6$
  - id: c
    text: $1/12$
  - id: d
    text: $-1/720$
  answer:
    choiceId: a
  explanation: |-
    Series division gives $1-x/2+x^2/12-x^4/720+\cdots$, with no cubic term.
- id: q011
  type: multipleChoice
  skills:
  - derive-generalized-binomial-recurrences
  prompt: |
    If $(1+x)^\alpha=\sum_{n=0}^{\infty}c_nx^n$, which recurrence is
    valid?
  choices:
  - id: a
    text: |-
      $c_{n+1}=c_n(\alpha-n)/(n+1)$
  - id: b
    text: |-
      $c_{n+1}=\alpha c_n$
  - id: c
    text: |-
      $c_{n+1}=c_n(n+1)/(\alpha-n)$
  - id: d
    text: $c_{n+1}=(-1)^nc_n$
  answer:
    choiceId: a
  explanation: |-
    Divide $\binom{\alpha}{n+1}$ by $\binom{\alpha}{n}$ to obtain $(\alpha-n)/(n+1)$.
- id: q012
  type: multipleChoice
  skills:
  - extract-coefficients-from-trigonometric-identities
  prompt: |
    What is the coefficient of $x^8$ in $\sin^2 x$?
  choices:
  - id: a
    text: $-1/315$
  - id: b
    text: $1/315$
  - id: c
    text: $-2/315$
  - id: d
    text: $1/8!$
  answer:
    choiceId: a
  explanation: |-
    Use $\sin^2x=(1-\cos2x)/2$; the degree-eight coefficient is $-\frac12(2^8/8!)=-1/315$.
- id: q013
  type: multipleChoice
  skills:
  - apply-analytic-identity-principles
  prompt: |
    An analytic function near zero satisfies $f^{(n)}(0)=0$ for every
    $n\ge0$. What follows in some neighborhood of zero?
  choices:
  - id: a
    text: $f$ is identically zero.
  - id: b
    text: $f$ may equal $e^{-1/x^2}$ away from zero.
  - id: c
    text: $f$ must be odd.
  - id: d
    text: Only $f(0)$ is determined.
  answer:
    choiceId: a
  explanation: Every Maclaurin coefficient is zero, and analyticity means the function equals that series
    locally.
- id: q014
  type: multipleChoice
  skills:
  - identify-orders-of-composite-zeros
  prompt: |
    Suppose $f(x)=x^2+O(x^3)$ and $g(x)=x^3+O(x^4)$. What is the
    order of the zero of $f(g(x))$ at zero?
  choices:
  - id: a
    text: $6$
  - id: b
    text: $5$
  - id: c
    text: $3$
  - id: d
    text: $2$
  answer:
    choiceId: a
  explanation: The leading term of f is its input squared, and the leading input from g is $x^3$, producing
    $x^6$.
- id: q015
  type: multipleChoice
  skills:
  - translate-centers-in-entire-series
  prompt: |
    Which expansion represents $e^{3x}$ in powers of $x-2$?
  choices:
  - id: a
    text: |-
      $e^6\sum_{n=0}^{\infty}3^n(x-2)^n/n!$
  - id: b
    text: |-
      $\sum 3^n(x-2)^n/n!$
  - id: c
    text: |-
      $e^2\sum (3x)^n/n!$
  - id: d
    text: |-
      $e^6\sum (x-2)^n/(3^n n!)$
  answer:
    choiceId: a
  explanation: Write $3x=6+3(x-2)$ and split the exponential into $e^6e^{3(x-2)}$.
