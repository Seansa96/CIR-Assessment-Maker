  prompt: Find the coefficient of the $x^3$ term in the Maclaurin series for $f(x) = e^{3x}$.
  answer:
    choiceId: a
  explanation: |-
    Solution: Maclaurin series for $e^u$ is $1 + u + u^2/2! + u^3/3!$. Let $u=2x$, so the $x^3$ term is $(2x)^3/6 = 8x^3/6 = (4/3)x^3$. Coefficient is 4/3 = 1.333. For Olympiad-level work, also justify why the chosen representation is valid on the relevant interval and why the alternative methods or endpoint conclusions do not apply. Therefore the answer is $1.9994999999999998$. Therefore the answer is $1.9994999999999998$. Therefore the answer is $1.9994999999999998$. Therefore the answer is $1.9994999999999998$.

    Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.

    Common trap: The first omitted term is not automatically an error bound. State the theorem's hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.

    Why the other choices fail: $0$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $1$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $\infty$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.

    Prerequisites: Taylor and Maclaurin expansions, remainder estimates, asymptotic/error reasoning, and the prerequisite theorem named in the prompt.

    Further study: Review the relevant Taylor remainder theorem and a proof or derivation of the error estimate before attempting related extrapolation or error-propagation problems.
