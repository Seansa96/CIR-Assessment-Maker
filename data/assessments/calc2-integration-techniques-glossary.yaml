    - id: term-integration-by-parts
      term: Integration by Parts
      recallDrills:
      - id: recall-integration-by-parts
        prompt: Define or explain the concept of Integration by Parts.
        answer:
          gradingMode: selfCheck
          expected: 'A technique for integrating products of functions based on the
            product rule. Formula: $\int u dv = uv - \int v du$.'
      definition: A definition for this term.
      drills:
      - id: drill-term-integration-by-parts
        type: flashcard
        prompt: What is Integration by Parts?
        answer:
          expected: A definition for this term.
    - id: term-u-substitution
      term: U-Substitution
      recallDrills:
      - id: recall-u-substitution
        prompt: Define or explain the concept of U-Substitution.
        answer:
          gradingMode: selfCheck
          expected: A technique for evaluating integrals by changing variables, essentially
            reversing the chain rule.
      definition: A definition for this term.
      drills:
      - id: drill-term-u-substitution
        type: flashcard
        prompt: What is U-Substitution?
        answer:
          expected: A definition for this term.
    - id: term-partial-fractions
      term: Partial Fractions
      recallDrills:
      - id: recall-partial-fractions
        prompt: Define or explain the concept of Partial Fractions.
        answer:
          gradingMode: selfCheck
          expected: A technique for integrating rational functions by breaking them
            down into simpler fractions.
      definition: A definition for this term.
      drills:
      - id: drill-term-partial-fractions
        type: flashcard
        prompt: What is Partial Fractions?
        answer:
          expected: A definition for this term.
    - id: term-trigonometric-substitution
      term: Trigonometric Substitution
      recallDrills:
      - id: recall-trigonometric-substitution
        prompt: Define or explain the concept of Trigonometric Substitution.
        answer:
          gradingMode: selfCheck
          expected: A technique substituting trigonometric functions for algebraic
            expressions to simplify integrals containing radicals.
      definition: A definition for this term.
      drills:
      - id: drill-term-trigonometric-substitution
        type: flashcard
        prompt: What is Trigonometric Substitution?
        answer:
          expected: A definition for this term.
    - id: term-improper-integral
      term: Improper Integral
      recallDrills:
      - id: recall-improper-integral
        prompt: Define or explain the concept of Improper Integral.
        answer:
          gradingMode: selfCheck
          expected: A definite integral that has either an infinite limit of integration
            or an integrand that approaches infinity within the limits.
      definition: A definition for this term.
      drills:
