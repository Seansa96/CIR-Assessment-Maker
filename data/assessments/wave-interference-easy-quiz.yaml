questions:
- id: q001
  difficultyDimensions: [modelOrDerivation, simplification]
  type: numericResponse
  skills:
  - physics-wave-interference
  prompt: A laboratory ripple tank generates water waves of length 11.51 m at a frequency
    of 3.7 Hz. What is the wave number k in rad/m?
  answer:
    value: 0.5459
    tolerance: 0.05
  explanation: |
    Solution: $k=2pi/lambda=2pi/11.51=0.5459$ rad/m.

    Why it works: Wave number is the spatial angular frequency set by wavelength.
- id: q002
  difficultyDimensions: [modelOrDerivation, simplification]
  type: numericResponse
  skills:
  - physics-wave-interference
  prompt: An ocean swell propagates with a wavelength of 13.54 m passing a buoy at
    80.0 Hz. What is the wave number k in rad/m?
  answer:
    value: 0.464
    tolerance: 0.05
  explanation: |
    Solution: $k=2pi/lambda=2pi/13.54=0.4640$ rad/m.

    Why it works: The supplied frequency is not needed when the requested quantity is wave number.
- id: q003
  difficultyDimensions: [modelOrDerivation, simplification]
  type: numericResponse
  skills:
  - physics-wave-interference
  prompt: A seismic surface wave has a characteristic wavelength of 18.98 m and vibrates
    at 47.0 Hz. What is the wave speed in m/s?
  answer:
    value: 892.06
    tolerance: 0.05
  explanation: |
    Solution: $v=lambda f=(18.98)(47.0)=892.06$ m/s.

    Why it works: Wave speed equals wavelength times frequency for a periodic wave.
- id: q004
  difficultyDimensions: [modelOrDerivation, representationTransfer]
  type: numericResponse
  skills:
  - physics-wave-interference
  prompt: A wave on a stretched string has wavelength 13.1 m and frequency 49.6 Hz.
    What is the wave number k in rad/m?
  answer:
    value: 0.4796
    tolerance: 0.05
  explanation: |
    Solution: $k=2pi/lambda=2pi/13.1=0.4796$ rad/m.

    Why it works: The string context does not alter the definition of wave number.
- id: q005
  difficultyDimensions: [modelOrDerivation, simplification]
  type: numericResponse
  skills:
  - physics-wave-interference
  prompt: A tensioned cable vibrates with wavelength 16.89 m when driven at 92.0 Hz.
    What is the angular frequency omega in rad/s?
  answer:
    value: 578.053
    tolerance: 0.05
  explanation: |
    Solution: $omega=2pi f=2pi(92.0)=578.0530$ rad/s.

    Why it works: Angular frequency converts cycles per second to radians per second.
