workedExamples:
  - id: polar-limacon-total-area
    title: Determine the integrand, bounds, and exact enclosed area
    problem: |
      The graph of

      $$
      r=9+3\cos\theta
      $$

      is shown. Express its enclosed area in the form

      $$
      \int_0^b f(\theta)\,d\theta,
      $$

      then find $b$, $f(\theta)$, and the exact area.

      ![The limacon r equals nine plus three cosine theta with its enclosed region and upper-half tracing interval highlighted](/assessments/calc2-parametric-polar/polar-limacon-9-plus-3cos-area.svg)
    steps:
      - id: limacon-area-structure
        title: Decide whether the curve has an inner loop
        instruction: |
          Before choosing bounds, inspect the radius:

          $$
          r=9+3\cos\theta.
          $$

          Since $-1\leq\cos\theta\leq1$,

          $$
          6\leq r\leq12.
          $$

          The radius never reaches zero or becomes negative, so one full $2\pi$ parameter cycle traces one simple closed limacon without an inner loop.
        type: multipleChoice
        prompt: What feature of the radius prevents an inner loop?
        choices:
          - id: a
            text: '$r$ remains positive for every $\theta$.'
          - id: b
            text: '$r$ is always equal to $9$.'
          - id: c
            text: '$\cos\theta$ is never negative.'
          - id: d
            text: The curve is symmetric about both coordinate axes.
        answer:
          choiceId: a
        hint: Compare the constant term 9 with the cosine amplitude 3.
        explanation: |
          The minimum radius is $9-3=6>0$. This eliminates retracing through the pole and makes the total-area bounds straightforward.

          Related topic: classifying limacons from $r=a+b\cos\theta$.

      - id: limacon-area-symmetry
        title: Use symmetry to match the requested integral form
        instruction: |
          The polar area formula is

          $$
          A=\frac12\int_\alpha^\beta r^2\,d\theta.
          $$

          Because $\cos(-\theta)=\cos\theta$, the curve is symmetric about the polar axis. The interval $0\leq\theta\leq\pi$ traces the upper half. Reflecting that half doubles its area and cancels the factor $1/2$:

          $$
          A=\int_0^\pi(9+3\cos\theta)^2\,d\theta.
          $$
        type: multipleChoice
        prompt: In the requested form, what are $b$ and $f(\theta)$?
        choices:
          - id: a
            text: '$b=\pi$ and $f(\theta)=(9+3\cos\theta)^2$'
          - id: b
            text: '$b=2\pi$ and $f(\theta)=(9+3\cos\theta)^2$'
          - id: c
            text: '$b=\pi$ and $f(\theta)=\frac12(9+3\cos\theta)$'
          - id: d
            text: '$b=2\pi$ and $f(\theta)=9+3\cos\theta$'
        answer:
          choiceId: a
        hint: Doubling the upper-half area removes the polar formula's factor of one-half.
        explanation: |
          The requested setup is

          $$
          \boxed{b=\pi,\qquad f(\theta)=(9+3\cos\theta)^2}.
          $$

          An equivalent full-cycle setup is

          $$
          A=\frac12\int_0^{2\pi}(9+3\cos\theta)^2\,d\theta.
          $$

      - id: limacon-area-expand
        title: Expand before applying an identity
        instruction: |
          Expand the squared radius:

          $$
          (9+3\cos\theta)^2
          =81+54\cos\theta+9\cos^2\theta.
          $$
        type: symbolicResponse
        prompt: Enter the expanded integrand.
        answer:
          expectedLatex: '81+54\cos\theta+9\cos^2\theta'
          equivalenceMode: expression
          variables:
            - theta
          tolerance: 0.000001
        hint: Use $(a+b)^2=a^2+2ab+b^2$.
        explanation: |
          The cross term is $2(9)(3\cos\theta)=54\cos\theta$. Keeping it is essential even though its definite integral later vanishes.

      - id: limacon-area-power-reduction
        title: Reduce the even cosine power
        instruction: |
          Use

          $$
          \cos^2\theta=\frac{1+\cos2\theta}{2}.
          $$

          Then

          $$
          81+54\cos\theta+9\cos^2\theta
          =\frac{171}{2}+54\cos\theta+\frac92\cos2\theta.
          $$
        type: multipleChoice
        prompt: Why is power reduction needed?
        choices:
          - id: a
            text: 'It converts $\cos^2\theta$ into terms with immediate antiderivatives.'
          - id: b
            text: 'It changes the curve into a circle.'
          - id: c
            text: 'It makes the radius nonnegative.'
          - id: d
            text: 'It changes the bounds from $\pi$ to $2\pi$.'
        answer:
          choiceId: a
        hint: Compare integrating $\cos^2\theta$ with integrating constants and $\cos(k\theta)$.
        explanation: |
          Power reduction converts the even power into a constant plus a first power of cosine. This is the standard integration technique for even trigonometric powers.

          Related topic: trigonometric integrals using half-angle identities.

      - id: limacon-area-antiderivative
        title: Integrate term by term
        instruction: |
          An antiderivative is

          $$
          \frac{171}{2}\theta
          +54\sin\theta
          +\frac94\sin2\theta.
          $$

          The factor $9/4$ comes from integrating $\cos2\theta$.
        type: symbolicResponse
        prompt: Enter an antiderivative of the transformed integrand.
        answer:
          expectedLatex: '\frac{171}{2}\theta+54\sin\theta+\frac94\sin(2\theta)'
          equivalenceMode: derivative
          variables:
            - theta
          tolerance: 0.000001
        hint: $\int\cos(2\theta)\,d\theta=\frac12\sin(2\theta)$.
        explanation: |
          Differentiate the proposed antiderivative to recover

          $$
          \frac{171}{2}+54\cos\theta+\frac92\cos2\theta.
          $$

      - id: limacon-area-evaluate
        title: Evaluate the exact area
        instruction: |
          Evaluate from $0$ to $\pi$. Both sine terms vanish at both endpoints:

          $$
          A=
          \left[
          \frac{171}{2}\theta+54\sin\theta+\frac94\sin2\theta
          \right]_0^\pi
          =\frac{171\pi}{2}.
          $$
        type: symbolicResponse
        prompt: Enter the exact enclosed area.
        answer:
          expectedLatex: '\frac{171\pi}{2}'
          equivalenceMode: expression
          variables: []
          tolerance: 0.000001
        hint: $\sin0=\sin\pi=\sin2\pi=0$.
        explanation: |
          The exact area is

          $$
          \boxed{\frac{171\pi}{2}}.
          $$

          The units are square units because the polar area formula integrates a squared radius.

      - id: limacon-area-synthesis
        title: Explain the complete setup
        instruction: |
          The important structure is not merely the expansion. First determine how the curve is traced, then use symmetry without accidentally losing or duplicating the polar factor $1/2$.
        type: freeResponse
        prompt: State $b$, $f(\theta)$, the exact area, and why the factor $1/2$ is absent from the symmetry-based setup.
        answer:
          expected: 'b = pi, f(theta) = (9 + 3 cos(theta))^2, and the area is 171pi/2. The upper half is doubled by symmetry, which cancels the one-half in the polar area formula.'
          gradingMode: selfCheck
          keyPoints:
            - '$b=\pi$.'
            - '$f(\theta)=(9+3\cos\theta)^2$.'
            - 'Exact area: $171\pi/2$.'
            - Doubling the upper-half area cancels the polar factor $1/2$.
        hint: Compare the half-curve setup with the full-cycle formula.
        explanation: |
          Final result:

          $$
          \boxed{
          A=\int_0^\pi(9+3\cos\theta)^2\,d\theta
          =\frac{171\pi}{2}
          }.
          $$

          Related topics: polar symmetry, polar area, and power-reduction identities.
