guidedProject:
  language: cpp
  instructions: 'Build a `DataAnalyzer` class that processes a `std::vector<double>`
    using STL algorithms.


    Required behavior:

    - Create a class named exactly `DataAnalyzer`.

    - Provide a constructor taking a `std::vector<double>`. Store it in a private
    member `data`.

    - Provide `void sortData()` which sorts the data in ascending order using `std::sort`.

    - Provide `int countGreaterThan(double threshold)` which returns the number of
    elements strictly greater than `threshold` using `std::count_if` and a lambda.

    - Provide `double getMin()` which returns the minimum value using `std::min_element`.

    '
  files:
  - path: DataAnalyzer.h
    readOnly: false
    content: "#pragma once\n#include <vector>\n#include <algorithm>\n\nusing namespace\
      \ std;\n\nclass DataAnalyzer {\nprivate:\n    vector<double> data;\n    \npublic:\n\
      \    // Implement constructor\n    \n    // Implement sortData\n    \n    //\
      \ Implement countGreaterThan\n    \n    // Implement getMin\n};\n"
  - path: ProjectNotes.md
    readOnly: true
    content: 'Required names:

      - `DataAnalyzer`

      - `sortData`

      - `countGreaterThan`

      - `getMin`

      '
  requiredChecks:
  - id: basic-sort-min
    title: sortData and getMin work
    description: Check if data can be sorted and minimum extracted
    expectedOutputContains:
    - SORTMIN_OK
    testCode: "#include \"DataAnalyzer.h\"\n#include <iostream>\n#include <vector>\n\
      using namespace std;\n\nint main() {\n    vector<double> vals = {5.5, 1.1, 3.3,\
      \ 2.2};\n    DataAnalyzer analyzer(vals);\n    analyzer.sortData();\n    if\
      \ (analyzer.getMin() == 1.1) {\n        cout << \"SORTMIN_OK\";\n    } else\
      \ {\n        cout << \"FAIL\";\n    }\n    return 0;\n}\n"
  - id: count-greater
    title: countGreaterThan works
    description: Check if count_if lambda works properly
    expectedOutputContains:
    - COUNT_OK
    testCode: "#include \"DataAnalyzer.h\"\n#include <iostream>\n#include <vector>\n\
      using namespace std;\n\nint main() {\n    vector<double> vals = {1.0, 5.0, 10.0,\
      \ 15.0, 20.0};\n    DataAnalyzer analyzer(vals);\n    if (analyzer.countGreaterThan(9.0)\
      \ == 3 && analyzer.countGreaterThan(25.0) == 0) {\n        cout << \"COUNT_OK\"\
      ;\n    } else {\n        cout << \"FAIL\";\n    }\n    return 0;\n}\n"
