modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 15
questions:
- id: q001
  type: multipleChoice
  skills:
  - chemical-reactions-balancing
  prompt: 'What are the coefficients that will balance the following equation? __ $AlCl_3$ + __ $NaOH$ $\rightarrow$ __ $Al(OH)_3$ + __ $NaCl$'
  choices:
  - id: a
    text: 1, 3, 1, 3
  - id: b
    text: 3, 1, 3, 1
  - id: c
    text: 1, 1, 1, 3
  - id: d
    text: 2, 6, 2, 6
  answer:

    choiceId: a
  explanation: 'Placing a 3 in front of $NaOH$ balances the $OH^-$ groups, and a 3 in front of $NaCl$ balances the $Na^+$ and $Cl^-$ ions.'

- id: q002
  type: multipleChoice
  skills:
  - chemical-reactions-types
  prompt: 'Classify the following reaction: $2H_2O_2(aq) \rightarrow 2H_2O(l) + O_2(g)$'
  choices:
  - id: a
    text: Synthesis
  - id: b
    text: Decomposition
  - id: c
    text: Single Displacement
  - id: d
    text: Combustion
  answer:

    choiceId: b
  explanation: 'A single reactant ($H_2O_2$) breaks down into multiple simpler products.'

- id: q003
  type: multipleChoice
  skills:
  - elemental-states
  prompt: 'Which of the following elements exists as a diatomic gas at standard temperature and pressure?'
  choices:
  - id: a
    text: Bromine
  - id: b
    text: Carbon
  - id: c
    text: Nitrogen
  - id: d
    text: Phosphorus
  answer:

    choiceId: c
  explanation: 'Nitrogen ($N_2$) is a diatomic gas. Bromine is a diatomic liquid. Carbon and Phosphorus are solid networks/polyatomics.'

- id: q004
  type: multipleChoice
  skills:
  - solubility-rules
  prompt: 'According to solubility rules, which of these compounds is soluble in water?'
  choices:
  - id: a
    text: $AgCl$
  - id: b
    text: $BaSO_4$
  - id: c
    text: $CaCO_3$
  - id: d
    text: $NH_4Cl$
  answer:

    choiceId: d
  explanation: 'All ammonium ($NH_4^+$) salts are soluble.'

- id: q005
  type: multipleChoice
  skills:
  - chemical-reactions-predicting
  - elemental-states
  prompt: 'Predict the products of the single displacement reaction between solid Aluminum ($Al$) and aqueous Copper(II) sulfate ($CuSO_4$).'
  choices:
  - id: a
    text: $AlSO_4(aq) + Cu(s)$
  - id: b
    text: $Al_2(SO_4)_3(aq) + Cu(s)$
  - id: c
    text: $Al_3(SO_4)_2(aq) + Cu_2(s)$
  - id: d
    text: No reaction occurs.
  answer:

    choiceId: b
  explanation: 'Aluminum forms a $+3$ ion, pairing with three $SO_4^{2-}$ ions to form $Al_2(SO_4)_3$. Copper is displaced as the solid element.'

- id: q006
  type: multipleChoice
  skills:
  - chemical-reactions-equations
  - net-ionic
  prompt: 'What is the net ionic equation for the reaction between $HCl(aq)$ and $NaOH(aq)$?'
  choices:
  - id: a
    text: $H^+(aq) + Cl^-(aq) + Na^+(aq) + OH^-(aq) \rightarrow H_2O(l) + NaCl(aq)$
  - id: b
    text: $HCl(aq) + NaOH(aq) \rightarrow H_2O(l) + NaCl(aq)$
  - id: c
    text: $H^+(aq) + OH^-(aq) \rightarrow H_2O(l)$
  - id: d
    text: $Na^+(aq) + Cl^-(aq) \rightarrow NaCl(s)$
  answer:

    choiceId: c
  explanation: '$Na^+$ and $Cl^-$ are spectator ions because $NaCl$ is soluble and remains aqueous. Only the formation of water from $H^+$ and $OH^-$ is the net change.'

- id: q007
  type: multipleChoice
  skills:
  - chemical-reactions-predicting
  - solubility-rules
  prompt: 'When aqueous solutions of $BaCl_2$ and $Na_2SO_4$ are mixed, what is the precipitate?'
  choices:
  - id: a
    text: $BaSO_4$
  - id: b
    text: $NaCl$
  - id: c
    text: $BaCl_2$
  - id: d
    text: No precipitate forms
  answer:

    choiceId: a
  explanation: '$BaSO_4$ is an exception to the rule that sulfates are soluble, making it a solid precipitate. $NaCl$ is highly soluble.'

- id: q008
  type: multipleChoice
  skills:
  - chemical-reactions-balancing
  prompt: 'What is the sum of the coefficients when the following equation is balanced in standard form? $C_4H_{10}(g) + O_2(g) \rightarrow CO_2(g) + H_2O(g)$'
  choices:
  - id: a
    text: 19
  - id: b
    text: 25
  - id: c
    text: 33
  - id: d
    text: 38
  answer:

    choiceId: c
  explanation: 'The balanced equation is $2C_4H_{10} + 13O_2 \rightarrow 8CO_2 + 10H_2O$. Sum = 2 + 13 + 8 + 10 = 33.'

- id: q009
  type: selectAll
  skills:
  - elemental-states
  prompt: 'Which of the following elements naturally occur as diatomic molecules? (Select all that apply)'
  choices:
  - id: a
    text: Hydrogen
  - id: b
    text: Helium
  - id: c
    text: Fluorine
  - id: d
    text: Argon
  - id: e
    text: Iodine
  answer:

    choiceIds: ['a', 'c', 'e']
  explanation: 'Hydrogen ($H_2$), Fluorine ($F_2$), and Iodine ($I_2$) are part of the 7 diatomic elements (HOBrFINCl). Helium and Argon are noble gases and exist as monatomic atoms.'

- id: q010
  type: multipleChoice
  skills:
  - chemical-reactions-predicting
  - ionic-compounds
  prompt: 'If you combine Lithium ($Li$) metal and Nitrogen ($N_2$) gas, what is the formula of the product?'
  choices:
  - id: a
    text: $LiN$
  - id: b
    text: $Li_3N$
  - id: c
    text: $LiN_3$
  - id: d
    text: $Li_2N_3$
  answer:

    choiceId: b
  explanation: 'Lithium forms a $+1$ ion and Nitrogen forms a $-3$ nitride ion. You need 3 $Li^+$ for every $N^{3-}$ to balance the charges: $Li_3N$.'

- id: q011
  type: multipleChoice
  skills:
  - chemical-reactions-types
  prompt: 'A reaction in which an element reacts with a compound, replacing an element from the compound, is called:'
  choices:
  - id: a
    text: Synthesis
  - id: b
    text: Double Displacement
  - id: c
    text: Single Displacement
  - id: d
    text: Combustion
  answer:

    choiceId: c
  explanation: 'This is the definition of a single displacement (or single replacement) reaction, typically taking the form $A + BC \rightarrow B + AC$.'

- id: q012
  type: multipleChoice
  skills:
  - chemical-reactions-equations
  prompt: 'In a complete ionic equation, which of the following should NOT be broken apart into ions?'
  choices:
  - id: a
    text: A soluble strong acid, like $HCl(aq)$
  - id: b
    text: A soluble ionic compound, like $KNO_3(aq)$
  - id: c
    text: A solid precipitate, like $AgCl(s)$
  - id: d
    text: A strong base, like $NaOH(aq)$
  answer:

    choiceId: c
  explanation: 'Only aqueous strong electrolytes (soluble ionic compounds, strong acids, strong bases) dissociate into ions. Solids, liquids, and gases remain intact.'

- id: q013
  type: symbolicResponse
  skills:
  - chemical-reactions-predicting
  - chemical-reactions-balancing
  prompt: 'Write the balanced chemical equation for the synthesis of Ammonia ($NH_3$) from its constituent elements in their standard states.'
  answer:
    expectedLatex: N_2(g)+3H_2(g)\rightarrow2NH_3(g)
    equivalenceMode: expression
    tolerance: 0
  explanation: 'Nitrogen and Hydrogen are diatomic gases: $N_2$ and $H_2$. To balance forming $NH_3$, you need $N_2 + 3H_2 \rightarrow 2NH_3$.'

- id: q014
  type: multipleChoice
  skills:
  - solubility-rules
  prompt: 'Which of the following ions is generally an exception that makes a sulfate compound insoluble?'
  choices:
  - id: a
    text: $Na^+$
  - id: b
    text: $Mg^{2+}$
  - id: c
    text: $Ba^{2+}$
  - id: d
    text: $Fe^{3+}$
  answer:

    choiceId: c
  explanation: 'Most sulfates are soluble, but Barium sulfate ($BaSO_4$) is heavily insoluble. Other exceptions include $Sr^{2+}$, $Pb^{2+}$, and $Ca^{2+}$.'

- id: q015
  type: multipleChoice
  skills:
  - chemical-reactions-predicting
  - chemical-reactions-balancing
  prompt: 'What are the products of mixing $Na_2CO_3(aq)$ and $CaCl_2(aq)$?'
  choices:
  - id: a
    text: $CaCO_3(s) + 2NaCl(aq)$
  - id: b
    text: $CaCO_3(aq) + 2NaCl(s)$
  - id: c
    text: $Na_2Cl_2(aq) + Ca(CO_3)(s)$
  - id: d
    text: No reaction occurs
  answer:

    choiceId: a
  explanation: 'They undergo a double displacement reaction. $Ca^{2+}$ and $CO_3^{2-}$ form calcium carbonate, which is an insoluble solid. $Na^+$ and $Cl^-$ form sodium chloride, which is soluble.'
