questions:
- id: q001
  type: multipleChoice
  prompt: Which sequence goes from simplest to most complex?
  choices:
  - id: a
    text: Chemical, cellular, tissue, organ, organ system, organismal
  - id: b
    text: Organismal, organ system, organ, tissue, cellular, chemical
  - id: c
    text: Cellular, chemical, organ, tissue, organismal, organ system
  - id: d
    text: Tissue, cellular, chemical, organ, organ system, organismal
  answer:
    choiceId: a
  explanation: 'Human structure is hierarchical: atoms and molecules form cells, similar
    cells form tissues, tissues combine into organs, organs cooperate in organ systems,
    and all organ systems make the organism.


    Related topic: Levels of Structural Organization

    '
- id: q002
  type: multipleChoice
  prompt: Atoms and molecules belong to which level?
  choices:
  - id: a
    text: Chemical level
  - id: b
    text: Tissue level
  - id: c
    text: Organ level
  - id: d
    text: Organismal level
  answer:
    choiceId: a
  explanation: 'The chemical level includes atoms, ions, molecules, and compounds
    such as water, proteins, lipids, carbohydrates, and nucleic acids. These chemical
    building blocks determine what cells can be made of and\rhow they function.


    Related topic: Chemical Level

    '
- id: q003
  type: multipleChoice
  prompt: Cells belong to which level?
  choices:
  - id: a
    text: Cellular level
  - id: b
    text: Chemical level
  - id: c
    text: Organ level
  - id: d
    text: Organ system level
  answer:
    choiceId: a
  explanation: 'Cells are the smallest living units because they can carry out basic
    life processes such as metabolism, responsiveness, growth, and reproduction. Examples
    include epithelial cells, neurons, muscle cells, and blood cells.


    Related topic: Cellular Level

    '
- id: q004
  type: multipleChoice
  prompt: 'A group of similar cells working together is a:'
  choices:
  - id: a
    text: Tissue
  - id: b
    text: Molecule
  - id: c
    text: Organ system
  - id: d
    text: Body cavity
  answer:
    choiceId: a
  explanation: 'A tissue is a group of similar cells plus extracellular material working
    together for a shared function. The four primary tissue classes are epithelial,
    connective, muscle, and nervous tissue.


    Related topic: Tissue Level

    '
- id: q005
  type: multipleChoice
  prompt: Which level is made of two or more tissue types working together?
  choices:
  - id: a
    text: Organ level
  - id: b
    text: Chemical level
  - id: c
    text: Cellular level
  - id: d
    text: Organismal level only
  answer:
    choiceId: a
  explanation: 'An organ contains two or more tissue types arranged for a specific
    function. For example, the stomach includes epithelial tissue for lining and secretion,
    muscle tissue for churning, connective tissue for support, and nervous tissue
    for control.


    Related topic: Organ Level

    '
- id: q006
  type: multipleChoice
  prompt: 'The heart is best classified as a:'
  choices:
  - id: a
    text: Organ
  - id: b
    text: Cell
  - id: c
    text: Tissue only
  - id: d
    text: Molecule
  answer:
    choiceId: a
  explanation: 'The heart is an organ because several tissues cooperate to pump blood.
    Cardiac muscle contracts, connective tissue supports valves and chambers, epithelial
    tissue lines surfaces, and nervous tissue helps coordinate rhythm.


    Related topic: Organ Examples

    '
- id: q007
  type: multipleChoice
  prompt: The cardiovascular system is an example of which level?
  choices:
  - id: a
    text: Organ system level
  - id: b
    text: Chemical level
  - id: c
    text: Cellular level
  - id: d
    text: Tissue level
  answer:
    choiceId: a
  explanation: 'The cardiovascular system is an organ system because the heart, blood
    vessels, and blood work together to transport oxygen, carbon dioxide, nutrients,
    wastes,\rhormones, and heat.


    Related topic: Organ System Level

    '
- id: q008
  type: multipleChoice
  prompt: 'The whole living human is the:'
  choices:
  - id: a
    text: Organismal level
  - id: b
    text: Organ level
  - id: c
    text: Tissue level
  - id: d
    text: Chemical level
  answer:
    choiceId: a
  explanation: 'The organismal level is the complete living human. It depends on coordinated
    activity among all organ systems, such as respiratory gas exchange, cardiovascular
    transport, nervous control, and urinary waste removal.


    Related topic: Organismal Level

    '
- id: q009
  type: multipleChoice
  prompt: Which tissue type covers surfaces and lines cavities?
  choices:
  - id: a
    text: Epithelial tissue
  - id: b
    text: Muscle tissue
  - id: c
    text: Nervous tissue
  - id: d
    text: Bone only
  answer:
    choiceId: a
  explanation: 'Epithelial tissue covers body surfaces, lines cavities and\rhollow
    organs, and forms glands. Its cells are closely packed, which helps with protection,
    secretion, absorption, and filtration.


    Related topic: Epithelial Tissue

    '
- id: q010
  type: multipleChoice
  prompt: Which tissue type supports, binds, and protects?
  choices:
  - id: a
    text: Connective tissue
  - id: b
    text: Epithelial tissue
  - id: c
    text: Nervous tissue
  - id: d
    text: Muscle tissue only
  answer:
    choiceId: a
  explanation: 'Connective tissue supports, binds, protects, stores energy, and transports
    materials. Its examples include bone, cartilage, blood, adipose tissue, dense
    connective tissue, and loose connective tissue.


    Related topic: Connective Tissue

    '
- id: q011
  type: multipleChoice
  prompt: Which tissue type specializes in contraction?
  choices:
  - id: a
    text: Muscle tissue
  - id: b
    text: Nervous tissue
  - id: c
    text: Epithelial tissue
  - id: d
    text: Cartilage
  answer:
    choiceId: a
  explanation: 'Muscle tissue specializes in contraction. Skeletal muscle moves the
    body, cardiac muscle pumps blood, and smooth muscle moves materials through\rhollow
    organs and controls vessel diameter.


    Related topic: Muscle Tissue

    '
- id: q012
  type: multipleChoice
  prompt: Which tissue type transmits electrical signals?
  choices:
  - id: a
    text: Nervous tissue
  - id: b
    text: Connective tissue
  - id: c
    text: Epithelial tissue
  - id: d
    text: Adipose tissue
  answer:
    choiceId: a
  explanation: 'Nervous tissue contains neurons that generate and transmit electrical
    signals, plus glial cells that support and protect neurons. This tissue enables
    rapid sensing, processing, and response.


    Related topic: Nervous Tissue

    '
- id: q013
  type: multipleChoice
  prompt: Which organ system protects the body surface?
  choices:
  - id: a
    text: Integumentary system
  - id: b
    text: Digestive system
  - id: c
    text: Urinary system
  - id: d
    text: Endocrine system
  answer:
    choiceId: a
  explanation: 'The integumentary system includes skin, hair, nails, sweat glands,
    and oil glands. It protects the body surface, helps regulate temperature, prevents
    water loss, and contributes to sensation.


    Related topic: Integumentary System

    '
- id: q014
  type: multipleChoice
  prompt: Which organ system exchanges oxygen and carbon dioxide?
  choices:
  - id: a
    text: Respiratory system
  - id: b
    text: Skeletal system
  - id: c
    text: Reproductive system
  - id: d
    text: Muscular system
  answer:
    choiceId: a
  explanation: 'The respiratory system moves air into and out of the lungs and exchanges
    oxygen and carbon dioxide across thin respiratory membranes. Oxygen enters blood,
    while carbon dioxide leaves blood to be exhaled.


    Related topic: Respiratory System

    '
- id: q015
  type: multipleChoice
  prompt: Which organ system transports blood?
  choices:
  - id: a
    text: Cardiovascular system
  - id: b
    text: Digestive system
  - id: c
    text: Endocrine system
  - id: d
    text: Skeletal system
  answer:
    choiceId: a
  explanation: 'The cardiovascular system uses the heart as a pump and blood vessels
    as transport pathways. It circulates blood to deliver oxygen and nutrients and
    to carry away carbon dioxide and metabolic wastes.


    Related topic: Cardiovascular System

    '
- id: q016
  type: multipleChoice
  prompt: Which organ system breaks down food and absorbs nutrients?
  choices:
  - id: a
    text: Digestive system
  - id: b
    text: Nervous system
  - id: c
    text: Urinary system
  - id: d
    text: Integumentary system
  answer:
    choiceId: a
  explanation: 'The digestive system mechanically and chemically breaks food down,
    then absorbs nutrients and water across the intestinal lining. It also eliminates
    undigested material as feces.


    Related topic: Digestive System

    '
- id: q017
  type: multipleChoice
  prompt: Which organ system removes nitrogen-containing wastes from blood?
  choices:
  - id: a
    text: Urinary system
  - id: b
    text: Respiratory system
  - id: c
    text: Muscular system
  - id: d
    text: Skeletal system
  answer:
    choiceId: a
  explanation: 'The urinary system filters blood through the kidneys to remove nitrogen-containing
    wastes such as urea. It also helps regulate water balance, electrolyte levels,
    blood pressure, and acid-base balance.


    Related topic: Urinary System

    '
- id: q018
  type: multipleChoice
  prompt: Which organ system controls body activities using\rhormones?
  choices:
  - id: a
    text: Endocrine system
  - id: b
    text: Skeletal system
  - id: c
    text: Respiratory system
  - id: d
    text: Digestive system
  answer:
    choiceId: a
  explanation: 'The endocrine system uses glands that secrete\rhormones into the bloodstream.
    Hormones travel to target cells and regulate slower, longer-lasting processes
    such as metabolism, growth, reproduction, and stress responses.


    Related topic: Endocrine System

    '
- id: q019
  type: multipleChoice
  prompt: Which organ system provides rapid control through electrical signaling?
  choices:
  - id: a
    text: Nervous system
  - id: b
    text: Endocrine system
  - id: c
    text: Digestive system
  - id: d
    text: Lymphatic system
  answer:
    choiceId: a
  explanation: 'The nervous system provides rapid control by sending electrical signals
    through neurons and chemical signals across synapses. It coordinates sensation,
    movement, reflexes, and many short-term adjustments.


    Related topic: Nervous System

    '
- id: q020
  type: multipleChoice
  prompt: Why does organization matter in the human body?
  choices:
  - id: a
    text: Higher levels depend on coordinated lower-level structures
  - id: b
    text: Only organs are important
  - id: c
    text: Chemical structure has no effect on function
  - id: d
    text: Systems work independently with no interaction
  answer:
    choiceId: a
  explanation: 'Higher-level body functions depend on coordinated lower-level parts.
    For example, oxygen delivery requires hemoglobin molecules, red blood cells, blood
    tissue, the heart, blood vessels, lungs, and nervous/endocrine regulation working
    together.


    Related topic: Organization and Emergent Function

    '
