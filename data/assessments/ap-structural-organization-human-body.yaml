schemaVersion: 1
id: ap-structural-organization-human-body
title: Structural Organization of the Human Body
assessmentType: quiz
categoryId: anatomy-and-physiology
subcategoryIds:
  - ap-introduction
modeDefault: practice
randomizeQuestions: true
questionTimerSeconds:
assessmentTimerSeconds:
questions:
  - id: q001
    type: multipleChoice
    prompt: "Which sequence goes from simplest to most complex?"
    choices:
      - id: a
        text: "Chemical, cellular, tissue, organ, organ system, organismal"
      - id: b
        text: "Organismal, organ system, organ, tissue, cellular, chemical"
      - id: c
        text: "Cellular, chemical, organ, tissue, organismal, organ system"
      - id: d
        text: "Tissue, cellular, chemical, organ, organ system, organismal"
    answer:
      choiceId: a
    explanation: |
      Human structure is organized in nested levels from atoms and molecules up to the whole organism.

      Related topic: Levels of Structural Organization
  - id: q002
    type: multipleChoice
    prompt: "Atoms and molecules belong to which level?"
    choices:
      - id: a
        text: "Chemical level"
      - id: b
        text: "Tissue level"
      - id: c
        text: "Organ level"
      - id: d
        text: "Organismal level"
    answer:
      choiceId: a
    explanation: |
      The chemical level includes atoms, ions, molecules, and compounds.

      Related topic: Chemical Level
  - id: q003
    type: multipleChoice
    prompt: "Cells belong to which level?"
    choices:
      - id: a
        text: "Cellular level"
      - id: b
        text: "Chemical level"
      - id: c
        text: "Organ level"
      - id: d
        text: "Organ system level"
    answer:
      choiceId: a
    explanation: |
      Cells are the smallest living units of the body.

      Related topic: Cellular Level
  - id: q004
    type: multipleChoice
    prompt: "A group of similar cells working together is a:"
    choices:
      - id: a
        text: "Tissue"
      - id: b
        text: "Molecule"
      - id: c
        text: "Organ system"
      - id: d
        text: "Body cavity"
    answer:
      choiceId: a
    explanation: |
      Tissues are groups of cells specialized for related functions.

      Related topic: Tissue Level
  - id: q005
    type: multipleChoice
    prompt: "Which level is made of two or more tissue types working together?"
    choices:
      - id: a
        text: "Organ level"
      - id: b
        text: "Chemical level"
      - id: c
        text: "Cellular level"
      - id: d
        text: "Organismal level only"
    answer:
      choiceId: a
    explanation: |
      Organs contain multiple tissue types arranged to perform specific functions.

      Related topic: Organ Level
  - id: q006
    type: multipleChoice
    prompt: "The heart is best classified as a:"
    choices:
      - id: a
        text: "Organ"
      - id: b
        text: "Cell"
      - id: c
        text: "Tissue only"
      - id: d
        text: "Molecule"
    answer:
      choiceId: a
    explanation: |
      The heart contains muscle, connective, epithelial, and nervous tissues that work together.

      Related topic: Organ Examples
  - id: q007
    type: multipleChoice
    prompt: "The cardiovascular system is an example of which level?"
    choices:
      - id: a
        text: "Organ system level"
      - id: b
        text: "Chemical level"
      - id: c
        text: "Cellular level"
      - id: d
        text: "Tissue level"
    answer:
      choiceId: a
    explanation: |
      It includes organs such as the heart and blood vessels working together.

      Related topic: Organ System Level
  - id: q008
    type: multipleChoice
    prompt: "The whole living human is the:"
    choices:
      - id: a
        text: "Organismal level"
      - id: b
        text: "Organ level"
      - id: c
        text: "Tissue level"
      - id: d
        text: "Chemical level"
    answer:
      choiceId: a
    explanation: |
      The organismal level is the complete individual made of all organ systems.

      Related topic: Organismal Level
  - id: q009
    type: multipleChoice
    prompt: "Which tissue type covers surfaces and lines cavities?"
    choices:
      - id: a
        text: "Epithelial tissue"
      - id: b
        text: "Muscle tissue"
      - id: c
        text: "Nervous tissue"
      - id: d
        text: "Bone only"
    answer:
      choiceId: a
    explanation: |
      Epithelial tissue forms coverings, linings, and many glands.

      Related topic: Epithelial Tissue
  - id: q010
    type: multipleChoice
    prompt: "Which tissue type supports, binds, and protects?"
    choices:
      - id: a
        text: "Connective tissue"
      - id: b
        text: "Epithelial tissue"
      - id: c
        text: "Nervous tissue"
      - id: d
        text: "Muscle tissue only"
    answer:
      choiceId: a
    explanation: |
      Connective tissue includes bone, blood, cartilage, adipose tissue, and other support tissues.

      Related topic: Connective Tissue
  - id: q011
    type: multipleChoice
    prompt: "Which tissue type specializes in contraction?"
    choices:
      - id: a
        text: "Muscle tissue"
      - id: b
        text: "Nervous tissue"
      - id: c
        text: "Epithelial tissue"
      - id: d
        text: "Cartilage"
    answer:
      choiceId: a
    explanation: |
      Muscle tissue produces movement by contracting.

      Related topic: Muscle Tissue
  - id: q012
    type: multipleChoice
    prompt: "Which tissue type transmits electrical signals?"
    choices:
      - id: a
        text: "Nervous tissue"
      - id: b
        text: "Connective tissue"
      - id: c
        text: "Epithelial tissue"
      - id: d
        text: "Adipose tissue"
    answer:
      choiceId: a
    explanation: |
      Nervous tissue contains neurons and supporting cells for rapid communication.

      Related topic: Nervous Tissue
  - id: q013
    type: multipleChoice
    prompt: "Which organ system protects the body surface?"
    choices:
      - id: a
        text: "Integumentary system"
      - id: b
        text: "Digestive system"
      - id: c
        text: "Urinary system"
      - id: d
        text: "Endocrine system"
    answer:
      choiceId: a
    explanation: |
      The integumentary system includes skin and related structures.

      Related topic: Integumentary System
  - id: q014
    type: multipleChoice
    prompt: "Which organ system exchanges oxygen and carbon dioxide?"
    choices:
      - id: a
        text: "Respiratory system"
      - id: b
        text: "Skeletal system"
      - id: c
        text: "Reproductive system"
      - id: d
        text: "Muscular system"
    answer:
      choiceId: a
    explanation: |
      The respiratory system moves air and exchanges gases with the blood.

      Related topic: Respiratory System
  - id: q015
    type: multipleChoice
    prompt: "Which organ system transports blood?"
    choices:
      - id: a
        text: "Cardiovascular system"
      - id: b
        text: "Digestive system"
      - id: c
        text: "Endocrine system"
      - id: d
        text: "Skeletal system"
    answer:
      choiceId: a
    explanation: |
      The heart and blood vessels move blood throughout the body.

      Related topic: Cardiovascular System
  - id: q016
    type: multipleChoice
    prompt: "Which organ system breaks down food and absorbs nutrients?"
    choices:
      - id: a
        text: "Digestive system"
      - id: b
        text: "Nervous system"
      - id: c
        text: "Urinary system"
      - id: d
        text: "Integumentary system"
    answer:
      choiceId: a
    explanation: |
      The digestive system processes food into absorbable nutrients.

      Related topic: Digestive System
  - id: q017
    type: multipleChoice
    prompt: "Which organ system removes nitrogen-containing wastes from blood?"
    choices:
      - id: a
        text: "Urinary system"
      - id: b
        text: "Respiratory system"
      - id: c
        text: "Muscular system"
      - id: d
        text: "Skeletal system"
    answer:
      choiceId: a
    explanation: |
      The urinary system filters blood and produces urine.

      Related topic: Urinary System
  - id: q018
    type: multipleChoice
    prompt: "Which organ system controls body activities using hormones?"
    choices:
      - id: a
        text: "Endocrine system"
      - id: b
        text: "Skeletal system"
      - id: c
        text: "Respiratory system"
      - id: d
        text: "Digestive system"
    answer:
      choiceId: a
    explanation: |
      Endocrine glands release hormones into the blood.

      Related topic: Endocrine System
  - id: q019
    type: multipleChoice
    prompt: "Which organ system provides rapid control through electrical signaling?"
    choices:
      - id: a
        text: "Nervous system"
      - id: b
        text: "Endocrine system"
      - id: c
        text: "Digestive system"
      - id: d
        text: "Lymphatic system"
    answer:
      choiceId: a
    explanation: |
      The nervous system uses nerve impulses for fast communication and control.

      Related topic: Nervous System
  - id: q020
    type: multipleChoice
    prompt: "Why does organization matter in the human body?"
    choices:
      - id: a
        text: "Higher levels depend on coordinated lower-level structures"
      - id: b
        text: "Only organs are important"
      - id: c
        text: "Chemical structure has no effect on function"
      - id: d
        text: "Systems work independently with no interaction"
    answer:
      choiceId: a
    explanation: |
      Body function emerges from organized interactions among molecules, cells, tissues, organs, and systems.

      Related topic: Organization and Emergent Function
