modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  prompt: Which method reads a line of text from the console?
  answer:
    expected: Console.ReadLine()
    aliases:
    - Console.ReadLine
    - ReadLine
- id: r002
  type: typed
  prompt: Which method prints text to the console and adds a newline at the end?
  answer:
    expected: Console.WriteLine()
    aliases:
    - Console.WriteLine
    - WriteLine
- id: r003
  type: typed
  prompt: What keyword allows the compiler to infer the variable type based on the
    assigned value?
  answer:
    expected: var
- id: r004
  type: typed
  prompt: What keyword makes a variable immutable (unchangeable) after initialization?
  answer:
    expected: const
- id: r005
  type: typed
  prompt: What method converts a string representation of a number (like "10") into
    an `int`?
  answer:
    expected: int.Parse()
    aliases:
    - int.Parse
    - Parse
- id: r006
  type: flashcard
  prompt: 'What character is used before a string to enable C# string interpolation
    (e.g., `"Value: {x}"`)?'
  answer:
    expected: $
    aliases:
    - Dollar sign
- id: r007
  type: typed
  prompt: What C# type is used to store text?
  answer:
    expected: string
    aliases:
    - String
- id: r008
  type: flashcard
  prompt: What is the boolean literal for "false" in C#?
  answer:
    expected: '`false` (all lowercase)'
