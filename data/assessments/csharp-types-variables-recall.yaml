schemaVersion: 1
id: csharp-types-variables-recall
title: C# Types and Variables Recall
assessmentType: recallDrill
categoryId: csharp
subcategoryIds:
- csharp-types-and-variables
skills:
- Apply Types, Variables, and I/O in C#
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - csharp
