- id: q001
  type: freeResponse
  skills:
  - interpret-series-remainders
  prompt: 'If a convergent series has sum $S$ and $N$th partial sum $S_N$, what is

    the remainder $R_N$?


    Give the conclusion and a complete calculation or theorem-based justification.

    '
  answer:
    gradingMode: selfCheck
    keyPoints:
    - The remainder is the omitted tail, so adding it to $S_N$ must recover $S$.
  explanation: 'Solution: The remainder is the omitted tail, so adding it to $S_N$ must recover $S$.


    Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.


    Common trap: The first omitted term is not automatically an error bound. State the theorem''s hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.'
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  difficultyEvidence: The item requires choosing a remainder model, carrying out its estimate or transformation, and checking the condition that validates the conclusion.
