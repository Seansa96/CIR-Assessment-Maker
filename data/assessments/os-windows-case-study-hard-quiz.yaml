questions:
- id: q001
  title: Apply Object manager
  type: multipleChoice
  prompt: A system design discussion mentions **Object manager**. Which conclusion is most defensible?
  choices:
  - id: a
    text: A handle is a mediated reference, not the object itself.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: A handle is a mediated reference, not the object itself. This is why Object manager matters in Windows Case Study.
