items:
  - id: r-linear-conditions
    type: flashcard
    prompt: |
      What are the two conditions for a transformation $T$ to be linear?
    answer:
      expected: '1. $T(\vec{u} + \vec{v}) = T(\vec{u}) + T(\vec{v})$ (preserves addition) \n 2. $T(c\vec{u}) = cT(\vec{u})$ (preserves scalar multiplication)'

  - id: r-zero-vector
    type: flashcard
    prompt: |
      If $T$ is a linear transformation, what must $T(\vec{0})$ equal?
    answer:
      expected: '$\vec{0}$'

  - id: r-standard-matrix-cols
    type: cloze
    prompt: |
      The columns of the standard matrix $A$ for a linear transformation $T$ are the vectors {{T(\vec{e}_j)}} where $\vec{e}_j$ are the standard basis vectors.
    answer:
      expected: 'T(\vec{e}_j)'

  - id: r-onto-def
    type: flashcard
    prompt: |
      What does it mean for a transformation $T: \mathbb{R}^n \to \mathbb{R}^m$ to be "onto" $\mathbb{R}^m$?
    answer:
      expected: 'The image of $T$ is the entire codomain $\mathbb{R}^m$. (Or: every $\vec{b}$ in $\mathbb{R}^m$ has at least one pre-image).'

  - id: r-onto-pivots
    type: cloze
    prompt: |
      A linear transformation $T: \mathbb{R}^n \to \mathbb{R}^m$ is onto if and only if its standard matrix has a pivot in every {{row}}.
    answer:
      expected: 'row'

  - id: r-one-to-one-def
    type: flashcard
    prompt: |
      What does it mean for a transformation $T: \mathbb{R}^n \to \mathbb{R}^m$ to be "one-to-one"?
    answer:
      expected: 'Each $\vec{b}$ in $\mathbb{R}^m$ is the image of at most one $\vec{x}$ in $\mathbb{R}^n$. (Distinct inputs map to distinct outputs).'

  - id: r-one-to-one-pivots
    type: cloze
    prompt: |
      A linear transformation $T: \mathbb{R}^n \to \mathbb{R}^m$ is one-to-one if and only if its standard matrix has a pivot in every {{column}} (meaning no free variables).
    answer:
      expected: 'column'

  - id: r-kernel-one-to-one
    type: flashcard
    prompt: |
      A linear transformation is one-to-one if and only if its kernel is what?
    answer:
      expected: 'The trivial subspace containing only the zero vector: $\{\vec{0}\}$.'
