items:
- id: pack-word-width
  type: flashcard
  prompt: What does word width control in word searching and packed data?
  answer:
    expected: It controls how many bits exist, where bits can move, and where wraparound or truncation occurs.
  explanation: Without word width, complements, shifts, and overflow are ambiguous.
  tags:
  - packed-data
  - byte-search
- id: pack-boundary-check
  type: cloze
  prompt: 'Complete: low-level arithmetic tricks should be checked at zero, exact powers of two, and ____ boundaries.'
  answer:
    expected: signed or word-size
    aliases:
    - sign
    - word-size
  explanation: Sign and maximum-width boundaries often expose bugs.
  tags:
  - packed-data
  - byte-search
- id: pack-invariant
  type: typed
  prompt: State what an invariant means in a word searching and packed data algorithm.
  answer:
    expected: An invariant is a property that remains true through each transformation and explains why the algorithm works.
  explanation: Memorizing the expression is weaker than knowing what it preserves.
  tags:
  - packed-data
  - byte-search
- id: pack-mask-habit
  type: flashcard
  prompt: What is the mask-first habit?
  answer:
    expected: Build a mask that marks the bits of interest, then use AND, OR, XOR, shifts, or complement to transform only those bits.
  explanation: This habit keeps unrelated fields from being changed accidentally.
  tags:
  - masks
- id: pack-edge-case
  type: typed
  prompt: Name one edge case for word searching and packed data.
  answer:
    expected: Zero, an all-ones value, an exact power of two, a sign boundary, or the maximum shift count.
  explanation: Any one of these is a useful test case depending on the operation.
  tags:
  - packed-data
  - byte-search
