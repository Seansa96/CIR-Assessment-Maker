workedExamples:
  - id: we-equilibrium-symbolic
    title: Hanging mass stretch
    problem: 'Derive the static extension of a vertical spring with spring constant $k$ that supports a mass $m$.'
    steps:
      - id: eqs-1
        title: Force balance
        instruction: 'At equilibrium, acceleration is zero. Take upward as positive.'
        type: symbolicResponse
        prompt: 'What does $k\Delta y$ equal?'
        answer: { gradingMode: auto, expectedLatex: 'm g', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $k\Delta y=mg$.\n\nWhy it works: The upward spring force balances the downward weight when net force is zero.'
      - id: eqs-2
        title: Isolate extension
        instruction: 'Solve the force-balance equation for the stretch.'
        type: symbolicResponse
        prompt: 'Write $\Delta y$.'
        answer: { gradingMode: auto, expectedLatex: 'm g/k', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $\Delta y=mg/k$.\n\nWhy it works: Dividing the balanced-force equation by stiffness isolates the extension.'
  - id: we-equilibrium-numerical
    title: A measured equilibrium extension
    problem: 'A $0.50$ kg mass hangs at rest from a spring with $k=98$ N/m. Find its extension using $g=9.8$ m/s$^2$.'
    steps:
      - id: eqn-1
        title: Substitute values
        instruction: 'Use the equilibrium-extension formula.'
        type: numericResponse
        prompt: 'What is the extension in meters?'
        answer: { value: 0.05, tolerance: 0.0001 }
        explanation: 'Solution: $\Delta y=(0.50)(9.8)/98=0.050$ m.\n\nWhy it works: At rest, the spring force exactly balances weight.'
      - id: eqn-2
        title: Check with force
        instruction: 'Use Hooke''s law to check the result.'
        type: numericResponse
        prompt: 'What spring-force magnitude results at this extension, in newtons?'
        answer: { value: 4.9, tolerance: 0.01 }
        explanation: 'Solution: $F_s=k\Delta y=(98)(0.050)=4.9$ N.\n\nWhy it works: This equals $mg=(0.50)(9.8)=4.9$ N, confirming equilibrium.'
