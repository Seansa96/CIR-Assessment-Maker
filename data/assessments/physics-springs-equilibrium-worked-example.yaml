workedExamples:
  - id: we-equilibrium
    title: Hanging Mass Stretch
    problem: |
      Let's calculate the exact stretch of a vertical spring when a mass is hung from it and allowed to settle into static equilibrium.
    steps:
      - id: step-1
        title: Step 1 — Force Balance
        instruction: |
          A mass $m$ hangs from a spring with constant $k$. At equilibrium, the net force is zero.
          The upward spring force is $F_s = k \Delta y$, and the downward gravitational force is $F_g = mg$.
        type: symbolicResponse
        prompt: |
          Since $F_s - F_g = 0$, what does $k \Delta y$ equal?
        answer:
          gradingMode: auto
          expectedLatex: m*g
          equivalenceMode: expression
          tolerance: 0
        explanation: 'At equilibrium, the spring pulls up with exactly the same amount of force that gravity pulls down: $k \Delta y = mg$.'
      - id: step-2
        title: Step 2 — Solving for Stretch
        instruction: |
          Now we want to isolate the stretch distance $\Delta y$.
        type: symbolicResponse
        prompt: |
          Solve the equation $k \Delta y = mg$ for $\Delta y$.
        answer:
          gradingMode: auto
          expectedLatex: (m*g)/k
          equivalenceMode: expression
          tolerance: 0
        explanation: 'Dividing both sides by $k$ gives $\Delta y = \frac{mg}{k}$. This is the static equilibrium position.'
