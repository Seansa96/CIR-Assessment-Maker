workedExamples:
- id: we001
  title: Dividing polynomials with structure
  problem: 'Divide polynomials by recognizing when long division or synthetic division
    is the most efficient tool.


    Main example:


    $$

    \frac{2x^3+3x^2-11x-6}{x-2}

    $$

    '
  steps:
  - id: step-we001-1
    title: Choose the division method
    instruction: 'Synthetic division is fastest when the divisor is linear and has
      leading coefficient $1$.

      '
    type: multipleChoice
    prompt: |
      Which method is most efficient for dividing by $x-2$?
    choices:
    - id: a
      text: Synthetic division with root $2$
    - id: b
      text: Synthetic division with root $-2$
    - id: c
      text: Complete the square
    - id: d
      text: Partial fraction decomposition first
    answer:
      choiceId: a
    hint: 'Set $x-2=0$.

      '
    explanation: |
      For $x-2$, the synthetic number is $2$. Synthetic division works because the divisor is a monic linear factor.

      Related topic: synthetic division setup. Look up "synthetic division root from divisor."
  - id: step-we001-2
    title: List the coefficients
    instruction: 'Synthetic division uses coefficients, including zeros for missing
      powers.

      '
    type: symbolicResponse
    prompt: |
      Write the coefficient list for:

      $$
      2x^3+3x^2-11x-6
      $$

      Use comma-separated form, such as $1,2,3$.
    answer:
      expectedLatex: 2,3,-11,-6
      equivalenceMode: expression
      variables:
      - x
      tolerance: 0
    hint: 'Read coefficients from highest power to constant term.

      '
    explanation: |
      The coefficients are $2$, $3$, $-11$, and $-6$. No power is missing in this polynomial.

      Related topic: coefficient list for synthetic division.
  - id: step-we001-3
    title: Perform the synthetic division
    instruction: 'Bring down, multiply by the root, add, and repeat.

      '
    type: symbolicResponse
    prompt: |
      Divide:

      $$
      \frac{2x^3+3x^2-11x-6}{x-2}
      $$

      Enter the quotient only.
    answer:
      expectedLatex: 2x^2+7x+3
      equivalenceMode: expression
      variables:
      - x
      tolerance: 0
    hint: 'Synthetic row: bring down $2$, then multiply by $2$ and add each column.

      '
    explanation: |
      Synthetic division with $2$ gives quotient coefficients $2,7,3$ and remainder $0$, so the quotient is

      $$
      2x^2+7x+3.
      $$

      Related topic: synthetic division arithmetic.
  - id: step-we001-4
    title: Interpret a remainder
    instruction: 'Long division and synthetic division both produce quotient plus
      remainder over divisor.

      '
    type: multipleChoice
    prompt: |
      If division by $x-4$ gives quotient $x^2+2$ and remainder $5$, what is the final division result?
    choices:
    - id: a
      text: $x^2+2+\frac{5}{x-4}$
    - id: b
      text: $x^2+2+5(x-4)$
    - id: c
      text: $\frac{x^2+2}{5}$
    - id: d
      text: $x^2+7$
    answer:
      choiceId: a
    explanation: |
      Division result means

      $$
      \text{quotient}+\frac{\text{remainder}}{\text{divisor}}.
      $$

      Related topic: quotient and remainder form.
  - id: step-we001-5
    title: Use long division when needed
    instruction: 'Long division works for any polynomial divisor, including non-linear
      divisors.

      '
    type: symbolicResponse
    prompt: |
      Divide and enter the quotient:

      $$
      \frac{x^3+2x^2-5x-6}{x^2-1}
      $$
    answer:
      expectedLatex: x+2
      equivalenceMode: expression
      variables:
      - x
      tolerance: 0
    hint: 'First term: $x^3/x^2=x$. Subtract $x(x^2-1)$, then continue.

      '
    explanation: |
      Long division gives quotient $x+2$ and remainder $-4x-4$, so the complete division result is

      $$
      x+2+\frac{-4x-4}{x^2-1}.
      $$

      Related topic: polynomial long division with non-linear divisors.
