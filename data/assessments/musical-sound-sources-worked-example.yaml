workedExamples:
- id: we-musical-sound-sources
  title: Deriving and applying Sources of Musical Sound
  problem: Use the labeled model to derive and calculate the fundamental frequency from $f_1=v/(2L)$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the fundamental frequency from the provided frequency spectrum graph.
    prompt: 'Identify the fundamental.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Lowest frequency f_1'
    explanation: >-
      The fundamental $f_1$ is the lowest frequency spike in the harmonic series.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the assumption about how the sound is produced by the instrument.
    prompt: 'What creates the sound?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Superposition of harmonics.'
    explanation: >-
      The sound is a superposition of the fundamental and multiple allowed harmonics (a Fourier series).
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target: determine if the instrument acts like an open-open or closed-open tube.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Tube type'
    explanation: >-
      We need to find the harmonic sequence to determine the tube type.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the harmonic relations for both tube types.
    prompt: 'Write the relations.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'All n vs Odd n'
    explanation: >-
      Open-open: $f_n = n f_1$ (all $n$). Closed-open: $f_n = n f_1$ (odd $n$ only).
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the pattern by dividing the overtone frequencies by the fundamental.
    prompt: 'How to check the pattern?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Check the ratios f_n / f_1'
    explanation: >-
      Calculate $f_n / f_1$ for the visible peaks.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given peaks at 200 Hz, 600 Hz, and 1000 Hz, calculate the ratios relative to $f_1 = 200$ Hz.
    prompt: 'Calculate the ratios.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      value: 55.0
      tolerance: 0.55
    explanation: >-
      $600/200 = 3$, $1000/200 = 5$. The sequence is 1, 3, 5.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Interpret the odd integer sequence.
    prompt: 'What does the sequence imply?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Closed-open tube'
    explanation: >-
      An odd-integer harmonic sequence ($1f_1, 3f_1, 5f_1$) perfectly matches the boundary conditions of a closed-open tube.
  - id: step8
    title: State the result
    instruction: >-
      State the final conclusion about the instrument.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      value: 55.0
      tolerance: 0.55
    explanation: >-
      The instrument functions as a tube closed at one end.
