workedExamples:
- id: we-musical-sound-sources
  title: Deriving and applying Sources of Musical Sound
  problem: Use the labeled model to derive and calculate the fundamental frequency from $f_1=v/(2L)$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the fundamental frequency from the provided frequency spectrum graph.
    prompt: 'Identify the fundamental.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Identify the lowest spectral spike as $f_1$. Why it works: the fundamental is the lowest allowed harmonic frequency.'
  - id: step2
    title: State the assumptions
    instruction: >-
      State the assumption about how the sound is produced by the instrument.
    prompt: 'What creates the sound?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Model the sound as a superposition of harmonics. Why it works: a periodic waveform is represented by Fourier components.'
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target: determine if the instrument acts like an open-open or closed-open tube.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Determine the tube type from its harmonic sequence. Why it works: end boundary conditions select the allowed modes.'
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the harmonic relations for both tube types.
    prompt: 'Write the relations.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Open-open tubes allow all integer multiples; closed-open tubes allow odd multiples. Why it works: their end conditions differ.'
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the pattern by dividing the overtone frequencies by the fundamental.
    prompt: 'How to check the pattern?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Divide each peak by $f_1$. Why it works: the ratios reveal whether the allowed harmonic multipliers are all integers or odd integers.'
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given peaks at 200 Hz, 600 Hz, and 1000 Hz, calculate the ratios relative to $f_1 = 200$ Hz.
    prompt: 'Calculate the ratios.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      value: 55.0
      tolerance: 0.55
    explanation: 'Solution: $600/200=3$ and $1000/200=5$, giving $1,3,5$. Why it works: these ratios are the harmonic multipliers.'
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Interpret the odd integer sequence.
    prompt: 'What does the sequence imply?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Identify a closed-open tube. Why it works: its boundary conditions permit odd harmonics $1f_1,3f_1,5f_1,\ldots$.'
  - id: step8
    title: State the result
    instruction: >-
      State the final conclusion about the instrument.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
    answer:
      value: 55.0
      tolerance: 0.55
    explanation: 'Solution: The instrument functions as a tube closed at one end. Why it works: its spectrum has only odd harmonic multipliers.'
- id: open-tube-we002
  title: Fundamental Frequency of an Open Tube
  problem: An open-open air column is $0.85\ \text{m}$ long. Take sound speed as $340\ \text{m/s}$. Find its fundamental frequency.
  steps:
  - id: open-tube-we002-step-1
    title: Use the open-tube relation
    type: symbolicResponse
    prompt: Write the fundamental frequency for an open-open tube.
    answer: {expectedLatex: 'f_1=\frac{v}{2L}', equivalenceMode: expression, tolerance: 0}
    explanation: 'Solution: Use $f_1=v/(2L)$. Why it works: the fundamental open-open mode has a half wavelength spanning the tube length.'
  - id: open-tube-we002-step-2
    title: Calculate the fundamental
    type: numericResponse
    prompt: Calculate the fundamental frequency in hertz.
    answer: {value: 200, tolerance: 0.1}
    explanation: 'Solution: $f_1=340/(2\cdot0.85)=200\ \text{Hz}$. Why it works: substituting sound speed and length in the mode relation gives the lowest resonant frequency.'
