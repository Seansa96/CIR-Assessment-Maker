    prompt: 'The curves $y=|x|$ and $y=2-x^2$ enclose a region. State the x-values where a vertical-slice model must change form, and explain why.'
    media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Slice diagram emphasizing piecewise boundary changes }]
    answer: { gradingMode: selfCheck, keyPoints: ['$x=-1,1$', 'absolute value changes formula at 0', 'partition at -1, 0, 1'] }
    explanation: 'Solution: Intersections satisfy $|x|=2-x^2$, giving $x=\pm1$. The absolute-value lower boundary also changes from $-x$ to $x$ at 0, so a vertical model partitions at $-1,0,1$. Why it works: Each interval needs one algebraic expression for every boundary. Common trap: Intersection points alone do not catch an internal absolute-value formula change.'
    difficultyDimensions: [casePartition, auxiliaryTechnique, modelOrDerivation]
    difficultyEvidence: Combines intersection solving with a separate piecewise-rule transition to determine partitions.
  - id: q007
