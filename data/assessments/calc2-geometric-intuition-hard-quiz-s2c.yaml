    prompt: 'A student writes $\int_0^4(\sqrt y-y/2)\,dy$ for the area between $x=y/2$ and $x=\sqrt y$. Diagnose whether the order is correct on $[0,4]$, then state the correct model.'
    media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Horizontal slice requiring right-minus-left analysis }]
    answer: { gradingMode: selfCheck, keyPoints: ['correct order is sqrt(y) minus y/2', 'right minus left', '$\int_0^4(\sqrt y-y/2)\,dy$'] }
    explanation: 'Solution: On $0<y<4$, $\sqrt y>y/2$, so $x=\sqrt y$ is right of $x=y/2$. The student’s model is correct: $A=\int_0^4(\sqrt y-y/2)\,dy$. Why it works: Horizontal slices require right minus left and use $dy$. Common trap: Do not reject a model merely because it is written in y; check its boundary order first.'
    difficultyDimensions: [errorDiagnosis, representationTransfer, domainCondition]
    difficultyEvidence: Tests a proposed horizontal model by comparing boundary functions on its interval.
  - id: q003
    type: freeResponse
