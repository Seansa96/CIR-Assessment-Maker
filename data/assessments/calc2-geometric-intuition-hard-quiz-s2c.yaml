    prompt: 'A proposed volume model is $V=\int_0^5r(x)\,dx$, where $r(x)$ is a radius in cm. Explain the dimensional defect and give one possible corrected model for circular cross sections.'
    answer: { gradingMode: selfCheck, keyPoints: ['radius times dx gives cm squared, not volume', '$A(x)=\pi r(x)^2$', '$V=\int_0^5\pi r(x)^2dx$'] }
    explanation: 'Solution: $r(x)\,dx$ has units $\text{cm}^2$, so it cannot represent volume. For circular cross sections, $A(x)=\pi r(x)^2$ and $V=\int_0^5\pi r(x)^2\,dx$. Why it works: Volume requires area times thickness. Common trap: A radius is not a cross-sectional area; the square and factor $\pi$ are essential.'
    difficultyDimensions: [errorDiagnosis, modelOrDerivation, representationTransfer]
    difficultyEvidence: Uses units to detect a missing geometric transformation and rebuilds the model.
  - id: q006
