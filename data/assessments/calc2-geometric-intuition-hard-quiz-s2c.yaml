    prompt: 'A diagram is unavailable. Describe a defensible four-step workflow for building an integral model for any geometric accumulation problem.'
    answer: { gradingMode: selfCheck, keyPoints: [sketch or define region, choose slice orientation, label measurement and thickness, determine bounds and check units] }
    explanation: 'Solution: Define or sketch the object; choose a slice direction; express one slice measurement times $dx$ or $dy$; determine bounds and validate sign and units before evaluating. Why it works: These steps identify the infinitesimal contribution and the interval over which it is accumulated. Common trap: Beginning with an antiderivative cannot reveal an omitted boundary or wrong units.'
    difficultyDimensions: [modelOrDerivation, proofJustification, representationTransfer]
    difficultyEvidence: Requires reconstructing and justifying the general modeling procedure without a supplied diagram.
  - id: q009
    type: freeResponse
