    prompt: 'The region bounded by $y=x^2$ and $y=2x+3$ is to be integrated with vertical slices. Find the intersection bounds and write a positive area integral.'
    media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Vertical representative slice between two curves }]
    answer: { gradingMode: selfCheck, keyPoints: ['$x=-1,3$', '$2x+3-x^2$', '$\int_{-1}^{3}(2x+3-x^2)\,dx$'] }
    explanation: 'Solution: Solve $x^2=2x+3$ to get $(x-3)(x+1)=0$, hence $x=-1,3$. The line is above the parabola between those roots, so $A=\int_{-1}^{3}(2x+3-x^2)\,dx$. Why it works: The model combines intersection bounds, an upper-minus-lower distance, and vertical thickness $dx$. Common trap: The order reverses outside the intersection interval, so do not use it without checking the region.'
    difficultyDimensions: [modelOrDerivation, simplification, domainCondition]
    difficultyEvidence: Requires solving intersections, determining curve order on a bounded interval, and constructing the slice integral.
  - id: q002
    type: freeResponse
    issueSignals:
