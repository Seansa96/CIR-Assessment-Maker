    prompt: 'A horizontal slice has right boundary $x=\sqrt{4-y}$ and left boundary $x=y-2$ for $0\le y\le4$. Write its differential area.'
    answer: { expectedLatex: '(\sqrt{4-y}-y+2)\,dy', equivalenceMode: expression, variables: [y], tolerance: 0.000001 }
    explanation: 'Solution: $dA=[\sqrt{4-y}-(y-2)]\,dy=(\sqrt{4-y}-y+2)\,dy$. Why it works: A horizontal slice measures right minus left and has thickness $dy$. Common trap: The parentheses around $y-2$ matter; dropping them changes the sign of 2.'
    difficultyDimensions: [simplification, representationTransfer, domainCondition]
    difficultyEvidence: Applies a horizontal boundary rule, preserves subtraction structure, and writes the matching differential.
