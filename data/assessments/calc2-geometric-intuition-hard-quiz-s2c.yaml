    prompt: 'Explain why $\int_{-2}^{2}x^3\,dx$ is not the geometric area between $y=x^3$ and the x-axis, then write an area setup.'
    answer: { gradingMode: selfCheck, keyPoints: ['signed cancellation', 'split at 0 or use absolute value', '$\int_{-2}^{0}(-x^3)dx+\int_0^2x^3dx$'] }
    explanation: 'Solution: $x^3$ is negative on $[-2,0]$ and positive on $[0,2]$, so its signed contributions cancel. Geometric area is $\int_{-2}^{0}(-x^3)\,dx+\int_0^2x^3\,dx$. Why it works: Area uses a nonnegative distance from the axis. Common trap: Odd symmetry proves the signed integral is zero; it does not prove the region has zero area.'
    difficultyDimensions: [casePartition, representationTransfer, errorDiagnosis]
    difficultyEvidence: Distinguishes signed accumulation from area, locates a sign-change partition, and repairs the model.
  - id: q004
    type: symbolicResponse
    issueSignals:
