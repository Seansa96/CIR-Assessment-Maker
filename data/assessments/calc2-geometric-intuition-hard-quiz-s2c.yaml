    prompt: 'A student uses vertical slices for a region but cannot write both boundaries as y-functions without solving a difficult inverse relation. Explain why horizontal slices may be the better model and what must be rewritten.'
    media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Slice model used to compare vertical and horizontal orientations }]
    answer: { gradingMode: selfCheck, keyPoints: [horizontal slices may avoid inversion or partitioning, write x as functions of y, use right minus left and dy] }
    explanation: 'Solution: Choose horizontal slices when the boundaries are more naturally $x=L(y)$ and $x=R(y)$; then use $\int[R(y)-L(y)]\,dy$ over y-bounds. Why it works: Slice orientation is a modeling choice, not a fixed rule. Common trap: Switching orientation requires changing both boundary functions and bounds, not merely replacing $dx$ by $dy$.'
    difficultyDimensions: [auxiliaryTechnique, representationTransfer, modelOrDerivation]
    difficultyEvidence: Evaluates an inefficient approach, changes representation, and reconstructs the appropriate integral model.
