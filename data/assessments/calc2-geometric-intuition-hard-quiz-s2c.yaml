    prompt: 'A solid has square cross sections perpendicular to the x-axis. The side length is $s(x)=3-x$ for $0\le x\le3$. Write the volume integral.'
    media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Representative slice interpreted as a cross-sectional slab }]
    answer: { expectedLatex: '\int_0^3(3-x)^2\,dx', equivalenceMode: expression, variables: [x], tolerance: 0.000001 }
    explanation: 'Solution: A square with side $3-x$ has area $A(x)=(3-x)^2$, so $V=\int_0^3(3-x)^2\,dx$. Why it works: Cross-sectional area times $dx$ is differential volume. Common trap: Integrating $3-x$ alone accumulates a length, not the square’s area.'
    difficultyDimensions: [modelOrDerivation, identityConstruction, representationTransfer]
    difficultyEvidence: Converts a geometric cross-section description into an area function and volume accumulation model.
  - id: q005
    type: freeResponse
    issueSignals:
