    prompt: 'For $y=\sin x$ on $[0,2\pi]$, explain how you would set up the geometric area between the curve and the x-axis without evaluating it.'
    answer: { gradingMode: selfCheck, keyPoints: ['split at 0, pi, 2pi', '$\int_0^\pi\sin xdx-\int_\pi^{2\pi}\sin xdx$', 'second integral is negated'] }
    explanation: 'Solution: Since $\sin x\ge0$ on $[0,\pi]$ and $\sin x\le0$ on $[\pi,2\pi]$, use $A=\int_0^\pi\sin x\,dx-\int_\pi^{2\pi}\sin x\,dx$. Why it works: The sign change at $\pi$ changes which side is above the axis. Common trap: $\int_0^{2\pi}\sin x\,dx$ is zero by cancellation, not the positive geometric area.'
    difficultyDimensions: [casePartition, representationTransfer, reverseReasoning]
    difficultyEvidence: Infers area setup from sign behavior and converts a signed-integral scenario to a nonnegative model.
  - id: q010
    type: freeResponse
    issueSignals:
