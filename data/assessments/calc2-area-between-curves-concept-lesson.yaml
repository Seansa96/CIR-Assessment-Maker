lesson:
  introduction: |
    In Calculus I, you learned how to find the area under a curve, between the curve and the x-axis, using a definite integral. 
    In Calculus II, we extend this idea to find the area bounded by two or more intersecting curves.
  sections:
    - id: vertical-slices
      title: Vertical Slices (Integrating with respect to x)
      required: true
      content: |
        When you slice a region vertically, you imagine tiny rectangles of width $dx$. 
        The height of each rectangle is the difference between the **upper curve** $y = f(x)$ and the **lower curve** $y = g(x)$.

        The area is given by:

        $$
        A = \int_a^b [f(x) - g(x)]\,dx
        $$

        To use this formula:
        1. Determine which curve is on top ($f(x)$) and which is on the bottom ($g(x)$).
        2. Find the points of intersection to establish the limits $a$ and $b$.
      check:
        id: vertical-slices-check
        type: multipleChoice
        prompt: If you are finding the area between $y = x$ and $y = x^2$ from $x=0$ to $x=1$, what is the correct integral setup?
        choices:
          - id: a
            text: $\int_0^1 [x - x^2]\,dx$
          - id: b
            text: $\int_0^1 [x^2 - x]\,dx$
          - id: c
            text: $\int_0^1 [x + x^2]\,dx$
          - id: d
            text: $\int_0^1 x^2\,dx$
        answer:
          choiceId: a
        explanation: |
          On the interval $(0, 1)$, $x$ is greater than $x^2$. Thus, $y = x$ is the upper curve, and the integrand is $x - x^2$.

    - id: horizontal-slices
      title: Horizontal Slices (Integrating with respect to y)
      required: true
      content: |
        Sometimes it is easier, or even necessary, to slice the region horizontally with width $dy$.
        The width of each horizontal rectangle is the difference between the **rightmost curve** $x = f(y)$ and the **leftmost curve** $x = g(y)$.

        The area is given by:

        $$
        A = \int_c^d [f(y) - g(y)]\,dy
        $$

        This method is particularly useful when curves cross each other and switch top/bottom orientations, or when the functions are natively expressed in terms of $y$ (like $x = y^2$).
      check:
        id: horizontal-slices-check
        type: multipleChoice
        prompt: When integrating with respect to $y$, the limits of integration $c$ and $d$ must represent what?
        choices:
          - id: a
            text: The lowest and highest y-values of the bounded region.
          - id: b
            text: The leftmost and rightmost x-values of the bounded region.
          - id: c
            text: The intersection points on the x-axis.
          - id: d
            text: The minimum and maximum slopes.
        answer:
          choiceId: a
        explanation: |
          Because you are integrating with respect to $y$, the bounds must correspond to the span of $y$-values for the region.

    - id: compound-regions
      title: Compound Regions
      required: true
      content: |
        If the curves switch positions—meaning the curve that was on top is now on the bottom—you cannot use a single integral to find the total area.
        You must split the integral at the intersection point where the switch occurs.

        For example, to find the area between $y = \sin x$ and $y = \cos x$ from $x=0$ to $x=\pi$, they intersect at $x = \pi/4$.
        You must split it:
        
        $$
        A = \int_0^{\pi/4} (\cos x - \sin x)\,dx + \int_{\pi/4}^{\pi} (\sin x - \cos x)\,dx
        $$
      check:
        id: compound-regions-check
        type: multipleChoice
        prompt: Why is it necessary to split the integral if the curves cross each other?
        choices:
          - id: a
            text: Because area must always be positive, and subtracting the top from the bottom ensures a positive integrand.
          - id: b
            text: Because integration cannot handle negative limits.
          - id: c
            text: Because the variables change from $x$ to $y$.
          - id: d
            text: Because the Fundamental Theorem of Calculus requires continuous derivatives.
        answer:
          choiceId: a
        explanation: |
          If you don't split the integral and flip the order of subtraction, the resulting areas will partially cancel each other out, giving "net" area instead of the "total bounded" area.


