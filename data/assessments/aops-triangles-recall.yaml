schemaVersion: 1
id: aops-triangles-recall
title: Triangles Terminology and Theorem Recall
description: Recall the hypotheses, invariants, and selection cues introduced across the three Triangle modules.
assessmentType: recallDrill
categoryId: art-of-problem-solving
topicId: aops-triangles
modeDefault: practice
randomizeQuestions: true
skills:
- Recall triangle theorem hypotheses and converses
- Distinguish congruence, similarity, cevian, and center vocabulary
- Match trigonometric and area terminology to its required inputs
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags: [art-of-problem-solving, aops-triangles, geometry, terminology, theorem-hypotheses, triangle-centers, triangle-area]
items:
- id: nondegenerate-triangle-flashcard
  type: flashcard
  prompt: What makes a triangle nondegenerate?
  answer: {expected: It has positive area and satisfies every triangle inequality strictly.}
  explanation: Equality flattens the sides into a segment.
  tags: [nondegenerate-triangle]
- id: triangle-inequality-flashcard
  type: flashcard
  prompt: What combined inequality must a third side $x$ satisfy when the other sides are $p$ and $q$?
  answer: {expected: '$|p-q|<x<p+q$'}
  explanation: The difference and sum are excluded boundary values.
  tags: [triangle-inequality]
- id: interior-angle-sum-flashcard
  type: flashcard
  prompt: What is the sum of a Euclidean triangle's interior angles?
  answer: {expected: '$180^\circ$'}
  explanation: This invariant underlies exterior-angle and AA reasoning.
  tags: [interior-angle-sum]
- id: exterior-angle-flashcard
  type: flashcard
  prompt: A triangle exterior angle equals the sum of which angles?
  answer: {expected: The two remote interior angles.}
  explanation: It is supplementary to the adjacent interior angle.
  tags: [exterior-angle]
- id: hypotenuse-flashcard
  type: flashcard
  prompt: How is the hypotenuse located?
  answer: {expected: It is the side opposite the right angle.}
  explanation: It is also the longest side of a right triangle.
  tags: [hypotenuse]
- id: pythagorean-theorem-flashcard
  type: flashcard
  prompt: State the Pythagorean theorem with its hypothesis.
  answer: {expected: In a right triangle with legs a and b and hypotenuse c, $a^2+b^2=c^2$.}
  explanation: The marked or proved right angle is required.
  tags: [pythagorean-theorem]
- id: pythagorean-converse-flashcard
  type: flashcard
  prompt: State the Pythagorean converse for longest side $c$.
  answer: {expected: If an existing triangle satisfies $a^2+b^2=c^2$, then the angle opposite c is right.}
  explanation: The converse turns side equality into angle classification.
  tags: [pythagorean-converse]
- id: triangle-classification-flashcard
  type: flashcard
  prompt: What classification follows when $c^2>a^2+b^2$ for the longest side?
  answer: {expected: Obtuse.}
  explanation: The angle opposite the longest side exceeds $90^\circ$.
  tags: [triangle-classification]
- id: congruence-flashcard
  type: flashcard
  prompt: What does triangle congruence preserve?
  answer: {expected: Every corresponding side length and angle measure.}
  explanation: Rigid motions and reflections preserve shape and size.
  tags: [congruence]
- id: correspondence-flashcard
  type: flashcard
  prompt: In $\triangle ABC\cong\triangle DFE$, which vertex corresponds to $B$?
  answer: {expected: F}
  explanation: Correspondence follows the ordered triangle names.
  tags: [correspondence]
- id: sss-congruence-flashcard
  type: flashcard
  prompt: What information does SSS congruence require?
  answer: {expected: Three pairs of congruent corresponding sides.}
  explanation: Those side lengths rigidly determine a triangle.
  tags: [sss-congruence]
- id: sas-congruence-flashcard
  type: flashcard
  prompt: What special position must the known angle have in SAS?
  answer: {expected: It must be included between the two known sides.}
  explanation: A nonincluded angle produces the ordinary SSA setting.
  tags: [sas-congruence]
- id: asa-aas-congruence-flashcard
  type: flashcard
  prompt: Why do ASA and AAS both prove congruence?
  answer: {expected: Two angles fix the third angle, and the known side fixes scale.}
  explanation: The side distinguishes congruence from AAA similarity.
  tags: [asa-aas-congruence]
- id: hl-congruence-flashcard
  type: flashcard
  prompt: What is the required context for hypotenuse-leg congruence?
  answer: {expected: Both triangles must be right triangles.}
  explanation: The right angles remove the general SSA ambiguity.
  tags: [hl-congruence]
- id: ambiguous-ssa-flashcard
  type: flashcard
  prompt: Why is SSA not a general congruence criterion?
  answer: {expected: The data can produce two different triangles, one triangle, or no triangle.}
  explanation: The nonincluded angle may leave a side free to swing between positions.
  tags: [ambiguous-ssa]
- id: cpctc-flashcard
  type: flashcard
  prompt: When may CPCTC be used?
  answer: {expected: After the two triangles have already been proved congruent.}
  explanation: CPCTC transfers remaining corresponding facts; it does not establish congruence.
  tags: [cpctc]
- id: similarity-flashcard
  type: flashcard
  prompt: What two kinds of relationships define similar triangles?
  answer: {expected: Corresponding angles are congruent and corresponding sides are proportional.}
  explanation: Similarity preserves shape while allowing size to change.
  tags: [similarity]
- id: use-similarity-ratios-cloze
  type: cloze
  prompt: 'Complete the criterion: two matching angle pairs prove triangle similarity by __.'
  answer: {expected: AA, aliases: [angle-angle]}
  explanation: The third angle pair then matches by triangle sum.
  tags: [aa-similarity]
- id: scale-factor-flashcard
  type: flashcard
  prompt: A similarity has linear scale factor $k$. What are its perimeter and area factors?
  answer: {expected: Perimeter scales by k and area scales by $k^2$.}
  explanation: Perimeter is one-dimensional and area is two-dimensional.
  tags: [scale-factor]
- id: cevian-flashcard
  type: flashcard
  prompt: What two locations does a cevian connect?
  answer: {expected: A triangle vertex and a point on the opposite side or its extension.}
  explanation: Medians, angle bisectors, and altitudes are special cevians.
  tags: [cevian]
- id: median-flashcard
  type: flashcard
  prompt: What defines the endpoint of a median on the opposite side?
  answer: {expected: It is the midpoint of that side.}
  explanation: A median need not be perpendicular or angle-bisecting.
  tags: [median]
- id: angle-bisector-flashcard
  type: flashcard
  prompt: What does an internal angle bisector divide equally?
  answer: {expected: The vertex angle.}
  explanation: Its two resulting angle measures are congruent.
  tags: [angle-bisector]
- id: altitude-flashcard
  type: flashcard
  prompt: What relation defines a triangle altitude?
  answer: {expected: It runs from a vertex perpendicular to the opposite side line.}
  explanation: In obtuse triangles the side line may need extension.
  tags: [altitude]
- id: perpendicular-bisector-flashcard
  type: flashcard
  prompt: What two properties define a perpendicular bisector?
  answer: {expected: It passes through a segment's midpoint and is perpendicular to the segment.}
  explanation: Its points are equidistant from the segment endpoints.
  tags: [perpendicular-bisector]
- id: incenter-flashcard
  type: flashcard
  prompt: Which lines meet at the incenter, and from what is it equidistant?
  answer: {expected: Internal angle bisectors meet there, and it is equidistant from the three side lines.}
  explanation: Those equal perpendicular distances form the inradius.
  tags: [incenter]
- id: circumcenter-flashcard
  type: flashcard
  prompt: Which lines meet at the circumcenter, and from what is it equidistant?
  answer: {expected: Side perpendicular bisectors meet there, and it is equidistant from the three vertices.}
  explanation: The common distance is the circumradius.
  tags: [circumcenter]
- id: centroid-flashcard
  type: flashcard
  prompt: How does the centroid divide a median from vertex to midpoint?
  answer: {expected: In a 2 to 1 ratio, with the longer part next to the vertex.}
  explanation: Vertex-to-centroid is two thirds of the full median.
  tags: [centroid]
- id: orthocenter-flashcard
  type: flashcard
  prompt: Which lines meet at the orthocenter?
  answer: {expected: The three altitude lines.}
  explanation: In a right triangle, two legs are altitudes and meet at the right-angle vertex.
  tags: [orthocenter]
- id: trigonometric-side-roles-flashcard
  type: flashcard
  prompt: Which right-triangle side roles depend on the chosen acute angle?
  answer: {expected: Opposite and adjacent; the hypotenuse does not change.}
  explanation: Opposite and adjacent are relative labels.
  tags: [trigonometric-side-roles]
- id: included-angle-flashcard
  type: flashcard
  prompt: Which angle belongs in $K=\tfrac12ab\sin C$?
  answer: {expected: The angle included between sides a and b.}
  explanation: That angle determines the altitude produced from one of the sides.
  tags: [included-angle]
- id: semiperimeter-flashcard
  type: flashcard
  prompt: Define semiperimeter.
  answer: {expected: Half the sum of the three side lengths.}
  explanation: Both Heron formula and $K=rs$ use semiperimeter, not full perimeter.
  tags: [semiperimeter]
- id: inradius-flashcard
  type: flashcard
  prompt: What distance does the inradius measure?
  answer: {expected: The perpendicular distance from the incenter to any side.}
  explanation: It is the radius of the incircle.
  tags: [inradius]
- id: heron-formula-flashcard
  type: flashcard
  prompt: When is Heron formula a natural first area method?
  answer: {expected: When all three side lengths are known but no convenient altitude or included angle is given.}
  explanation: Triangle inequality should still be checked first.
  tags: [heron-formula]
