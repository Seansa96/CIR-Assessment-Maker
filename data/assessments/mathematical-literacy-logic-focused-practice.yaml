questions:
- id: q001
  type: multipleChoice
  prompt: A theorem says, “If an integer is divisible by 4, then it is even.” Which is its converse?
  choices:
  - id: a
    text: If an integer is even, then it is divisible by 4.
    issueSignals:
    - id: reversed-implication
  - id: b
    text: If an integer is not divisible by 4, then it is not even.
  - id: c
    text: If an integer is divisible by 4, then it is not even.
    issueSignals:
    - id: reversed-implication
  - id: d
    text: If an integer is divisible by 4, then it is even.
    issueSignals:
    - id: reversed-implication
  answer:
    choiceId: a
  issueSignals:
  - id: reversed-implication
  difficultyDimensions:
  - representationTransfer
  - reverseReasoning
  difficultyEvidence: Requires separating the syntactic converse from whether that converse is true.
  explanation: |-
    Solution: Swap the hypothesis and conclusion: if an integer is even, then it is divisible by 4.
    Why it works: The converse of “if P then Q” is “if Q then P.”
    Why the other choices fail: B is the contrapositive, C negates the conclusion, and D merely repeats the original direction.
- id: q002
  type: multipleChoice
  prompt: Which statement means “Every real number has a square that is nonnegative”?
  choices:
  - id: a
    text: '$\forall x\in\mathbb R,\ x^2\ge0$'
  - id: b
    text: '$\exists x\in\mathbb R,\ x^2\ge0$'
    issueSignals:
    - id: quantifier-scope-error
  - id: c
    text: '$\forall x\in\mathbb R,\ x\ge0$'
    issueSignals:
    - id: quantifier-scope-error
  - id: d
    text: '$\exists x\in\mathbb R,\ x\ge0$'
    issueSignals:
    - id: quantifier-scope-error
  answer:
    choiceId: a
  issueSignals:
  - id: quantifier-scope-error
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  difficultyEvidence: Preserves the universal quantifier, domain, and expression when translating English.
  explanation: |-
    Solution: Use $\forall$ for “every,” retain the real-number domain, and state $x^2\ge0$.
    Why it works: The claim is about every real input's square, not just one input or the input itself.
    Why the other choices fail: B and D weaken “every” to “there exists,” while C applies nonnegativity to x rather than its square.
- id: q003
  type: multipleChoice
  prompt: What is the negation of “Every integer is positive”?
  choices:
  - id: a
    text: There exists an integer that is not positive.
  - id: b
    text: Every integer is not positive.
    issueSignals:
    - id: quantifier-scope-error
  - id: c
    text: There exists a positive integer.
    issueSignals:
    - id: quantifier-scope-error
  - id: d
    text: No positive integers exist.
    issueSignals:
    - id: quantifier-scope-error
  answer:
    choiceId: a
  issueSignals:
  - id: quantifier-scope-error
  difficultyDimensions:
  - representationTransfer
  - reverseReasoning
  difficultyEvidence: Reverses a universal quantifier and negates the governed predicate without over-negating.
  explanation: |-
    Solution: The negation is that at least one integer is not positive.
    Why it works: Negating a universal claim produces an existential counterexample.
    Why the other choices fail: B claims all integers fail, C does not contradict the original claim, and D is much stronger than required.
- id: q004
  type: multipleChoice
  prompt: Which sentence is a complete mathematical statement?
  choices:
  - id: a
    text: For every integer n, n+1 is an integer.
  - id: b
    text: n+1 is an integer.
    issueSignals:
    - id: quantifier-scope-error
  - id: c
    text: Add 1 to n.
    issueSignals:
    - id: expression-equation-recognition-error
  - id: d
    text: What is n+1?
    issueSignals:
    - id: expression-equation-recognition-error
  answer:
    choiceId: a
  issueSignals:
  - id: quantifier-scope-error
  difficultyDimensions:
  - domainCondition
  - errorDiagnosis
  difficultyEvidence: Distinguishes a quantified assertion from an open sentence, command, and question.
  explanation: |-
    Solution: A is a complete statement because it specifies the domain and has a truth value.
    Why it works: The universal quantifier binds n, making the claim true or false as written.
    Why the other choices fail: B leaves n unbound, C is a command, and D is a question.
- id: q005
  type: multipleChoice
  prompt: Which is a mathematical statement?
  choices:
  - id: a
    text: '$2\in\mathbb{Z}$.'
  - id: b
    text: Add $2$ to both sides.
    issueSignals:
    - id: command-for-statement
  - id: c
    text: What is $2x=8$?
    issueSignals:
    - id: question-for-statement
  - id: d
    text: '$\mathbb{Z}$'
    issueSignals:
    - id: expression-for-statement
  answer:
    choiceId: a
  issueSignals:
  - id: expression-for-statement
  difficultyDimensions:
  - structuralRecognition
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Distinguishes a truth-valued assertion from three superficially mathematical non-statements.
  explanation: |-
    Solution: $2\in\mathbb{Z}$ is a statement.
    Why it works: It asserts a claim with a definite truth value: 2 is an integer.
    Why the other choices fail: B is a command, C is a question, and D is only an expression naming a set.
- id: q006
  type: multipleChoice
  prompt: Why is “the integer $x$ is even” not a statement when no value or domain-wide claim for $x$ is supplied?
  choices:
  - id: a
    text: Its truth depends on the value assigned to $x$.
  - id: b
    text: It is false for every integer.
    issueSignals:
    - id: variable-claim-overgeneralized
  - id: c
    text: Any sentence containing a variable is automatically false.
    issueSignals:
    - id: variable-statement-confused
  - id: d
    text: Evenness is not a mathematical property.
    issueSignals:
    - id: property-status-confused
  answer:
    choiceId: a
  issueSignals:
  - id: variable-statement-confused
  difficultyDimensions:
  - definitionApplication
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Uses the definite-truth-value criterion on an open sentence rather than a bare symbol.
  explanation: |-
    Solution: Its truth depends on the value assigned to $x$.
    Why it works: An open sentence has no definite truth value until its variable is specified or bound by a domain-wide claim.
    Why the other choices fail: B is false for even values, C ignores quantified statements, and D denies a standard property.
- id: q007
  type: multipleChoice
  prompt: Which sentence containing a variable is nevertheless a statement?
  choices:
  - id: a
    text: For every integer $n$, if $n$ is a multiple of $6$, then $n$ is even.
  - id: b
    text: The integer $n$ is even.
    issueSignals:
    - id: open-sentence-missed
  - id: c
    text: Choose an integer $n$.
    issueSignals:
    - id: command-for-statement
  - id: d
    text: Is $n$ divisible by $6$?
    issueSignals:
    - id: question-for-statement
  answer:
    choiceId: a
  issueSignals:
  - id: open-sentence-missed
  difficultyDimensions:
  - quantifierScope
  - structuralRecognition
  - errorDiagnosis
  difficultyEvidence: Requires recognizing that a universal quantifier makes the conditional truth-evaluable.
  explanation: |-
    Solution: The universally quantified conditional is a statement.
    Why it works: It makes one definite claim about all integers, and every multiple of 6 is even.
    Why the other choices fail: B leaves $n$ unbound, C is an instruction, and D asks rather than asserts.
- id: q008
  type: multipleChoice
  prompt: A text labels the claim “Every polynomial of degree $n$ has at most $n$ roots” as $Q$. What is the main
    purpose of the label?
  choices:
  - id: a
    text: It gives a concise name for referring to that entire statement.
  - id: b
    text: It changes the claim into a variable with no truth value.
    issueSignals:
    - id: label-truth-status-confused
  - id: c
    text: It proves the claim without further reasoning.
    issueSignals:
    - id: label-for-proof-confused
  - id: d
    text: It means $Q$ is a set of roots.
    issueSignals:
    - id: statement-set-confused
  answer:
    choiceId: a
  issueSignals:
  - id: label-for-proof-confused
  difficultyDimensions:
  - representationTransfer
  - structuralRecognition
  - errorDiagnosis
  difficultyEvidence: Separates a metalinguistic shorthand from the logical role of the statement it names.
  explanation: |-
    Solution: $Q$ is a shorthand name for the whole statement.
    Why it works: Letters let a proof discuss a claim repeatedly without rewriting it; they do not alter its meaning or truth value.
    Why the other choices fail: B, C, and D respectively confuse a label with an open variable, a proof, and a set.
- id: q009
  type: multipleChoice
  prompt: Which item is a false mathematical statement rather than an open sentence, command, or question?
  choices:
  - id: a
    text: Every integer is odd.
  - id: b
    text: The integer n is odd.
    issueSignals:
    - id: open-sentence-missed
  - id: c
    text: Determine whether n is odd.
    issueSignals:
    - id: command-for-statement
  - id: d
    text: Is n odd?
    issueSignals:
    - id: question-for-statement
  answer:
    choiceId: a
  issueSignals:
  - id: open-sentence-missed
  difficultyDimensions:
  - structuralRecognition
  - errorDiagnosis
  difficultyEvidence: Distinguishes a complete universally framed assertion from three lines that cannot be true or false as written.
  explanation: |-
    Solution: “Every integer is odd” is a false statement.
    Why it works: It makes a definite assertion about a stated class, even though 2 disproves it.
    Why the other choices fail: B leaves n unbound, C directs an action, and D requests information.
- id: q010
  type: multipleChoice
  prompt: A line reads “For every real number x, x+0=x.” Why is it a statement?
  choices:
  - id: a
    text: The domain and quantifier make one truth-evaluable claim about every real number.
  - id: b
    text: Any expression with an equals sign is automatically a statement.
    issueSignals:
    - id: equation-for-statement-overgeneralized
  - id: c
    text: It is a command because it contains a variable.
    issueSignals:
    - id: variable-command-confused
  - id: d
    text: It is open because x appears in it.
    issueSignals:
    - id: quantified-claim-called-open
  answer:
    choiceId: a
  issueSignals:
  - id: quantified-claim-called-open
  difficultyDimensions:
  - quantifierScope
  - structuralRecognition
  difficultyEvidence: Uses the binding role of the universal quantifier rather than superficial equation notation.
  explanation: |-
    Solution: The quantifier and real-number domain make the line a complete claim.
    Why it works: x is bound, so the sentence has a definite truth value.
    Why the other choices fail: B ignores equations that are open, C mistakes a claim for an instruction, and D ignores the quantifier.
