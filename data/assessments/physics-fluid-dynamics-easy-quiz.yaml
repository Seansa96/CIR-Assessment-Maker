questions:
- id: q001
  type: numericResponse
  prompt: |
    Water flows at $2.0 \text{ m/s}$ through a pipe with a cross-sectional area of $0.04 \text{ m}^2$. 
    It enters a narrower section of the pipe with an area of $0.01 \text{ m}^2$. 
    Calculate the speed of the water in the narrower section in m/s.
  answer:
    value: 8.0
    tolerance: 0.1
  explanation: |
    Solution:
    $A_1 v_1 = A_2 v_2$
    $(0.04)(2.0) = (0.01) v_2$
    $0.08 = 0.01 v_2$
    $v_2 = 8.0 \text{ m/s}$.
    
    Why it works:
    By the equation of continuity, the volume flow rate ($Q = Av$) must remain constant. Since the cross-sectional area decreased by a factor of 4 (from $0.04$ to $0.01$), the speed must increase by a factor of 4 (from $2.0$ to $8.0$) to push the same volume of water through.
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
- id: q002
  type: numericResponse
  prompt: |
    Calculate the volume flow rate $Q$ in $\text{m}^3\text{/s}$ of a rectangular channel that is $10 \text{ m}$ wide, $2 \text{ m}$ deep, and flowing at a steady speed of $3 \text{ m/s}$.
  answer:
    value: 60
    tolerance: 1.0
  explanation: |
    Solution:
    First, find the cross-sectional area: $A = \text{width} \times \text{depth} = 10 \times 2 = 20 \text{ m}^2$.
    Then, calculate the flow rate: $Q = A v = 20 \times 3 = 60 \text{ m}^3\text{/s}$.
    
    Why it works:
    The volume flow rate is simply the cross-sectional area multiplied by the flow speed. This tells us that $60 \text{ m}^3$ of fluid passes a given point every second.
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
