- id: q001
  type: multipleChoice
  prompt: |-
    An original Statistics and Probability problem variant is designed to test **mean**. Which solution strategy is most appropriate?
  choices:
  - id: a
    text: Use define sample space after checking the relevant constraints.
  - id: b
    text: Assume the answer from a visually similar problem still applies.
  - id: c
    text: Ignore the distinction between necessary and sufficient conditions.
  - id: d
    text: Try arithmetic first and decide the structure only after the answer appears.
  answer:
    choiceId: a
  explanation: |-
    This mirrors the difficulty of a chapter problem archetype: recognize mean, choose define sample space, and verify the constraints before computing.
  skills:
