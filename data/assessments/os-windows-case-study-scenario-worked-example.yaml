workedExamples:
- id: we001
  title: Reason through a Windows Case Study scenario
  problem: A Windows application opens a registry key, launches a process, and performs device I/O. Trace handles, access checks, and subsystem boundaries.
  steps:
  - id: windows-case-study-deep-s001
    title: Frame the OS boundary
    type: multipleChoice
    prompt: Which boundary is most important to identify first?
    choices:
    - id: a
      text: The boundary between ordinary program behavior and OS-mediated resource control.
    - id: b
      text: Only the user interface colors.
    - id: c
      text: Only the final answer wording.
    - id: d
      text: Only whether the computer is modern.
    answer:
      choiceId: a
    explanation: A handle is a mediated reference, not the object itself.
    instruction: Start by naming what the OS is mediating.
  - id: windows-case-study-deep-s002
    title: Identify the resource
    type: multipleChoice
    prompt: Which kind of thing is most likely being controlled?
    choices:
    - id: a
      text: CPU, memory, storage, device access, naming, or authority.
    - id: b
      text: Only comments in source code.
    - id: c
      text: Only the user's preference for terminology.
    - id: d
      text: Nothing; OS mechanisms do not control resources.
    answer:
      choiceId: a
    explanation: OS reasoning becomes clearer when the resource is explicit.
    instruction: Operating systems usually act because a resource, privilege, or shared state must be controlled.
  - id: windows-case-study-deep-s003
    title: Choose the mechanism
    type: multipleChoice
    prompt: In this scenario, why is **Registry** relevant?
    choices:
    - id: a
      text: The registry is not simply a folder tree.
    - id: b
      text: It replaces all other OS mechanisms.
    - id: c
      text: It only matters for hardware designers, not OS reasoning.
    - id: d
      text: It is a synonym for adding more RAM.
    answer:
      choiceId: a
    explanation: The registry is not simply a folder tree.
    instruction: Match the problem to the mechanism that directly controls it.
  - id: windows-case-study-deep-s004
    title: Spot the common confusion
    type: multipleChoice
    prompt: Which confusion should you avoid around **Security descriptors**?
    choices:
    - id: a
      text: Identity and object policy both matter.
    - id: b
      text: Assuming the concept never affects behavior.
    - id: c
      text: Treating all OS designs as identical.
    - id: d
      text: Ignoring the relationship between policy and mechanism.
    answer:
      choiceId: a
    explanation: Identity and object policy both matter.
    instruction: Good OS answers separate similar-sounding concepts.
  - id: windows-case-study-deep-s005
    title: Name the tradeoff
    type: multipleChoice
    prompt: What tradeoff is most important for **Subsystems and compatibility**?
    choices:
    - id: a
      text: Compatibility can constrain clean design.
    - id: b
      text: There is no tradeoff in OS design.
    - id: c
      text: The fastest-looking choice is always correct.
    - id: d
      text: Compatibility and security never matter.
    answer:
      choiceId: a
    explanation: Compatibility can constrain clean design.
    instruction: The best OS design answer usually admits a cost.
  - id: windows-case-study-deep-s006
    title: Check an edge case
    type: multipleChoice
    prompt: Which edge case would best test your understanding of **I/O manager and driver stack**?
    choices:
    - id: a
      text: A case where the mechanism is stressed by blocking, failure, sharing, or permission limits.
    - id: b
      text: A case with no OS-managed resource.
    - id: c
      text: A case where every actor is single-threaded and isolated forever.
    - id: d
      text: A case where all inputs are ignored.
    answer:
      choiceId: a
    explanation: Boundary cases reveal whether the mental model is real.
    instruction: Now test the reasoning against a boundary case.
  - id: windows-case-study-deep-s007
    title: Explain the complete path
    type: freeResponse
    prompt: Write a short explanation of the scenario using at least three OS terms from this worked example.
    answer:
      expected: A strong answer names the OS-mediated resource, the relevant mechanism, the tradeoff, and the possible failure or boundary case in Windows Case Study.
      gradingMode: selfCheck
      keyPoints:
      - Names OS-mediated resource
      - Names relevant mechanism
      - Mentions tradeoff or failure mode
    explanation: 'Related topic: Windows Case Study. The purpose is to reason through the OS path, not to recite a definition.'
    instruction: Finish by explaining the entire scenario from request to OS decision.
