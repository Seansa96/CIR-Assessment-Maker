workedExamples:
- id: we-work-spring
  title: Work done by a spring
  problem: Derive the work done by a spring $F = -kx$ from $x=0$ to $x=x_f$.
  steps:
  - id: step-we-work-spring-1
    title: Work integral
    type: symbolicResponse
    prompt: Set up the integral for work $W = \int_0^{x_f} F(x) dx$.
    answer:
      gradingMode: auto
      expectedLatex: \int_0^{x_f} -kx dx
      equivalenceMode: expression
      tolerance: 0
    instruction: Review the following step.
  - id: step-we-work-spring-2
    title: Evaluate
    type: symbolicResponse
    prompt: Evaluate.
    answer:
      gradingMode: auto
      expectedLatex: -1/2 k x_f^2
      equivalenceMode: expression
      tolerance: 0
    instruction: Review the following step.
