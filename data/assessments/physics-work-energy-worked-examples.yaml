workedExamples:
  - id: we-work-spring-integral
    title: Derive spring work
    problem: 'Derive the work done by a spring with $F(x)=-kx$ as it moves from $x=0$ to $x=x_f$.'
    steps:
      - id: wsi-1
        title: Set up integral
        instruction: 'Use the one-dimensional variable-force work integral.'
        type: symbolicResponse
        prompt: 'Write the work integral.'
        answer: { gradingMode: auto, expectedLatex: '\int_0^{x_f} -k x dx', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $W=\int_0^{x_f}-kx\,dx$.\n\nWhy it works: Spring force varies linearly with displacement.'
      - id: wsi-2
        title: Evaluate integral
        instruction: 'Integrate with respect to $x$.'
        type: symbolicResponse
        prompt: 'Write the work.'
        answer: { gradingMode: auto, expectedLatex: '-k x_f^2/2', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $W=-\tfrac12kx_f^2$.\n\nWhy it works: The spring force opposes the increasing positive displacement.'
  - id: we-work-constant-force
    title: Work by an angled force
    problem: 'A $50$ N force pulls a crate $4.0$ m at $60^\circ$ above the horizontal. Find its work.'
    steps:
      - id: wcf-1
        title: Choose component
        instruction: 'Only the component parallel to displacement does work.'
        type: symbolicResponse
        prompt: 'Write the parallel force component.'
        answer: { gradingMode: auto, expectedLatex: '50 cos(60)', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $F_{parallel}=50\cos60^\circ$.\n\nWhy it works: The dot product selects the component along the horizontal displacement.'
      - id: wcf-2
        title: Compute work
        instruction: 'Multiply the parallel component by displacement.'
        type: numericResponse
        prompt: 'What work is done in joules?'
        answer: { value: 100, tolerance: 0.01 }
        explanation: 'Solution: $W=(50)(4.0)\cos60^\circ=100$ J.\n\nWhy it works: The force has a positive component in the direction of motion.'
