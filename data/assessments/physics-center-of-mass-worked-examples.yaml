workedExamples:
- id: com-we001
  title: One-dimensional center of mass with signed positions
  problem: >
    Three equipment cases lie on a straight loading rail: $2.0$ kg at $x=-3.0$ m,

    $5.0$ kg at $x=1.0$ m, and $1.0$ kg at $x=5.0$ m. Find the center-of-mass coordinate.
  steps:
  - id: com-we001-step1
    title: Find the total mass
    instruction: Add every mass included in the system.
    hint: 
    type: numericResponse
    prompt: What is the total mass $M$ in kg?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 8.0
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: $M=2.0+5.0+1.0=8.0$ kg.\n\nWhy it works: The denominator of the center-of-mass relation is the total system mass.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: com-we001-step2
    title: Find the signed first moment
    instruction: Multiply each mass by its signed position, then add the products.
    hint: 
    type: numericResponse
    prompt: What is $\sum_i m_i x_i$ in kg m?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 4.0
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: $(2.0)(-3.0)+(5.0)(1.0)+(1.0)(5.0)=-6.0+5.0+5.0=4.0$ kg m.\n\nWhy it works: The negative coordinate must remain negative in the weighted sum.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: com-we001-step3
    title: Divide by total mass and check
    instruction: Divide the signed first moment by total mass.
    hint: 
    type: numericResponse
    prompt: What is $x_{\mathrm{com}}$ in m?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 0.5
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: $x_{\mathrm{com}}=4.0/8.0=0.50$ m.\n\nWhy it works: A mass-weighted average must lie between $-3.0$ m and $5.0$ m, and the 5.0 kg case pulls it near $x=1.0$ m.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
- id: com-we002
  title: Two-dimensional center of mass by components
  problem: >
    Three identical $2.0$ kg sensors are placed at $(0,0)$ m, $(6.0,0)$ m,

    and $(0,3.0)$ m. Find the center-of-mass position vector.
  steps:
  - id: com-we002-step1
    title: Use the common total mass
    instruction: Determine the total mass for both component calculations.
    hint: 
    type: numericResponse
    prompt: What is $M$ in kg?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 6.0
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: $M=2.0+2.0+2.0=6.0$ kg.\n\nWhy it works: The same selected system appears in both the x and y mass-weighted averages.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: com-we002-step2
    title: Calculate the x component
    instruction: Weight only x coordinates by their masses.
    hint: 
    type: numericResponse
    prompt: What is $x_{\mathrm{com}}$ in m?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 2.0
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: $x_{\mathrm{com}}=[(2)(0)+(2)(6.0)+(2)(0)]/6=2.0$ m.\n\nWhy it works: The x calculation ignores y coordinates and averages only the x positions with mass weights.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: com-we002-step3
    title: Calculate the y component and state the vector
    instruction: Weight only y coordinates by their masses.
    hint: 
    type: numericResponse
    prompt: What is $y_{\mathrm{com}}$ in m?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 1.0
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: $y_{\mathrm{com}}=[(2)(0)+(2)(0)+(2)(3.0)]/6=1.0$ m, so $\vec r_{\mathrm{com}}=(2.0\,\hat i+1.0\,\hat j)$ m.\n\nWhy it works: The y component is a separate mass-weighted average; both components lie within their listed coordinate ranges.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
