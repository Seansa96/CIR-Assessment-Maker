items:
  - id: recall-augmented-matrix
    type: flashcard
    prompt: |
      What is an augmented matrix?
    answer:
      expected: A matrix representing a system of equations, combining the coefficient matrix and the constant vector.
  - id: recall-row-operations
    type: flashcard
    prompt: |
      What are the three elementary row operations?
    answer:
      expected: Scaling a row, swapping rows, or adding a multiple of one row to another.
  - id: recall-ref
    type: flashcard
    prompt: |
      What are the conditions for a matrix to be in Row Echelon Form (REF)?
    answer:
      expected: All nonzero rows are above any rows of all zeros, and each leading entry is in a column to the right of the leading entry above it.
  - id: recall-rref
    type: flashcard
    prompt: |
      What are the additional conditions for a matrix to be in Reduced Row Echelon Form (RREF)?
    answer:
      expected: Every leading entry is 1, and each leading 1 is the only nonzero entry in its column.
  - id: recall-pivots
    type: flashcard
    prompt: |
      What are pivots?
    answer:
      expected: The leading entries of the rows in an echelon form matrix.
  - id: recall-free-variables
    type: flashcard
    prompt: |
      What are free variables in the context of solving a system?
    answer:
      expected: Variables corresponding to columns in the coefficient matrix that do not contain a pivot.
  - id: recall-basic-variables
    type: flashcard
    prompt: |
      What are basic variables?
    answer:
      expected: Variables corresponding to columns in the coefficient matrix that contain a pivot.
  - id: recall-inconsistent-system
    type: flashcard
    prompt: |
      How do you recognize an inconsistent system from an augmented matrix?
    answer:
      expected: It contains a row of the form [0 ... 0 | b] where b is nonzero.
