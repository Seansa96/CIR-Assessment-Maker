questions:
- id: vol-cross-hq-1
  title: Shape Ratio Analysis
  type: symbolicResponse
  skills:
  - volumes-cross-sections-hard
  prompt: |
    Let $V_s$ be the volume of a solid whose base is $x^2 + y^2 = R^2$ with square cross sections, and $V_e$ be the volume of a solid with the same base but equilateral triangle cross sections. Find the ratio $V_s / V_e$.
  answer:
    gradingMode: auto
    expectedLatex: 4/\sqrt{3}
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. For squares, $A_s(x) = s^2$. For equilateral triangles, $A_e(x) = rac{\sqrt{3}}{4}s^2$.
    2. The ratio of their areas at any cross section $x$ is constant: $A_s / A_e = 4/\sqrt{3}$.
    3. Therefore, the ratio of their integrated volumes is also $4/\sqrt{3}$.
- id: vol-cross-hq-2
  title: Squares on Sine Wave
  type: symbolicResponse
  skills:
  - volumes-cross-sections-hard
  prompt: |
    The base of a solid is bounded by $y = \sin x$ and the $x$-axis for $0 \le x \le \pi$. Cross-sections perpendicular to the $x$-axis are squares. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: \pi/2
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. $A(x) = \sin^2 x$.
    2. $V = \int_0^\pi \sin^2 x \, dx = \int_0^\pi rac{1 - \cos(2x)}{2} \, dx$.
    3. Evaluate: $[rac{1}{2}x - rac{1}{4}\sin(2x)]_0^\pi = rac{\pi}{2} - 0 = \pi/2$.
- id: vol-cross-hq-3
  title: Equilateral Triangles on Secant
  type: symbolicResponse
  skills:
  - volumes-cross-sections-hard
  prompt: |
    The base of a solid is bounded by $y = \sec x$, $x = -\pi/4$, $x = \pi/4$, and the $x$-axis. Cross-sections perpendicular to the $x$-axis are equilateral triangles. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: \sqrt{3}/2
    equivalenceMode: expression
    tolerance: 0
  explanation: '1. $A(x) = rac{\\sqrt{3}}{4} \\sec^2 x$.\n2. $V = \\int_{-\\pi/4}^{\\pi/4} rac{\\sqrt{3}}{4} \\sec^2 x \\, dx = rac{\\sqrt{3}}{4} [\tan x]_{-\\pi/4}^{\\pi/4}$.\n3. Evaluate: $rac{\\sqrt{3}}{4}(1 - (-1)) = rac{2\\sqrt{3}}{4} = rac{\\sqrt{3}}{2}$.\n'
- id: vol-cross-hq-4
  title: Squares on Ellipse (X-axis)
  type: symbolicResponse
  skills:
  - volumes-cross-sections-hard
  prompt: |
    The base of a solid is bounded by the ellipse $rac{x^2}{4} + rac{y^2}{9} = 1$. Cross-sections perpendicular to the **$x$-axis** are squares. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: 96
    equivalenceMode: expression
    tolerance: 0.1
  explanation: '1. Solving for $y$: $y = 3\\sqrt{1 - x^2/4}$. The full base width $s = 2y = 6\\sqrt{1 - x^2/4}$.\n2. $A(x) = s^2 = 36(1 - x^2/4)$.\n3. $V = \\int_{-2}^2 36(1 - x^2/4) \\, dx = 2 \\int_0^2 36(1 - x^2/4) \\, dx = 72[x - rac{x^3}{12}]_0^2$.\n4. Evaluate: $72(2 - 8/12) = 72(2 - 2/3) = 72(4/3) = 24 \times 4 = 96$.\n'
- id: vol-cross-hq-5
  title: Squares on Ellipse (Y-axis)
  type: symbolicResponse
  skills:
  - volumes-cross-sections-hard
  prompt: |
    The base of a solid is bounded by the ellipse $rac{x^2}{4} + rac{y^2}{9} = 1$. Cross-sections perpendicular to the **$y$-axis** are squares. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: 64
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Solving for $x$: $x = 2\sqrt{1 - y^2/9}$. Full base width $s = 2x = 4\sqrt{1 - y^2/9}$.
    2. $A(y) = s^2 = 16(1 - y^2/9)$.
    3. $V = \int_{-3}^3 16(1 - y^2/9) \, dy = 2 \int_0^3 16(1 - y^2/9) \, dy = 32[y - rac{y^3}{27}]_0^3$.
    4. Evaluate: $32(3 - 27/27) = 32(3 - 1) = 32(2) = 64$.
- id: vol-cross-hq-6
  title: Hypotenuse on Base
  type: symbolicResponse
  skills:
  - volumes-cross-sections-hard
  prompt: |
    The base of a solid is bounded by $y = x^3$, $y = 8$, and the $y$-axis. Cross-sections perpendicular to the **$y$-axis** are isosceles right triangles with their hypotenuse on the base. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: 24/5
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. We integrate with respect to $y$. $x = y^{1/3}$. Base width $s = x - 0 = y^{1/3}$.
    2. For an isosceles right triangle with hypotenuse $s$, the area is $A = rac{1}{4}s^2$.
    3. $A(y) = rac{1}{4} (y^{1/3})^2 = rac{1}{4} y^{2/3}$.
    4. $V = \int_0^8 rac{1}{4} y^{2/3} \, dy = rac{1}{4} [rac{3}{5} y^{5/3}]_0^8$.
    5. Evaluate at 8: $rac{3}{20} (8)^{5/3} = rac{3}{20} (2^5) = rac{3}{20}(32) = rac{96}{20} = rac{24}{5}$.
- id: vol-cross-hq-7
  title: Rational Function Semicircles
  type: symbolicResponse
  skills:
  - volumes-cross-sections-hard
  prompt: |
    The base of a solid is bounded by $y = rac{1}{x}$, $y = 0$, $x = 1$, and $x = 2$. Cross-sections perpendicular to the $x$-axis are semicircles. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: \pi/16
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Base width $d = 1/x$.
    2. Area of semicircle $A(x) = rac{\pi}{8} d^2 = rac{\pi}{8} rac{1}{x^2}$.
    3. $V = \int_1^2 rac{\pi}{8x^2} \, dx = rac{\pi}{8} [-rac{1}{x}]_1^2$.
    4. Evaluate: $rac{\pi}{8} (-1/2 - (-1)) = rac{\pi}{8} (1/2) = rac{\pi}{16}$.
- id: vol-cross-hq-8
  title: Logarithmic Base Squares
  type: symbolicResponse
  skills:
  - volumes-cross-sections-hard
  prompt: |
    The base of a solid is bounded by $y = \ln x$, $y = 0$, and $x = e$. Cross-sections perpendicular to the $x$-axis are squares. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: e - 2
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Base width $s = \ln x$.
    2. $A(x) = (\ln x)^2$.
    3. $V = \int_1^e (\ln x)^2 \, dx$.
    4. Use integration by parts twice. The antiderivative of $(\ln x)^2$ is $x(\ln x)^2 - 2x\ln x + 2x$.
    5. Evaluate at $e$: $e(1)^2 - 2e(1) + 2e = e$.
    6. Evaluate at 1: $1(0)^2 - 2(0) + 2(1) = 2$.
    7. Volume = $e - 2$.
- id: vol-cross-hq-9
  title: Triangular Region Semicircles
  type: symbolicResponse
  skills:
  - volumes-cross-sections-hard
  prompt: |
    The base of a solid is the triangle bounded by $y = 2 - x$, $y = x$, and the $y$-axis. Cross-sections perpendicular to the $x$-axis are semicircles. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: \pi/6
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Intersection: $2 - x = x \implies 2x = 2 \implies x = 1$. The region spans from $x=0$ to $x=1$.
    2. Base width $d = (2-x) - x = 2 - 2x = 2(1-x)$.
    3. Area $A(x) = rac{\pi}{8} d^2 = rac{\pi}{8} [4(1-x)^2] = rac{\pi}{2}(1-x)^2$.
    4. $V = \int_0^1 rac{\pi}{2}(1-x)^2 \, dx = rac{\pi}{2} [-rac{1}{3}(1-x)^3]_0^1$.
    5. Evaluate: $rac{\pi}{2}(0 - (-1/3)) = rac{\pi}{6}$.
- id: vol-cross-hq-10
  title: Tangent Squares
  type: symbolicResponse
  skills:
  - volumes-cross-sections-hard
  prompt: 'The base of a solid is bounded by $y = \tan x$, $y = 0$, and $x = \\pi/4$. Cross-sections perpendicular to the $x$-axis are squares. Find the exact volume.\n'
  answer:
    gradingMode: auto
    expectedLatex: 1 - \pi/4
    equivalenceMode: expression
    tolerance: 0
  explanation: '1. Base width $s = \tan x$.\n2. $A(x) = \tan^2 x$.\n3. $V = \\int_0^{\\pi/4} \tan^2 x \\, dx = \\int_0^{\\pi/4} (\\sec^2 x - 1) \\, dx$.\n4. Evaluate: $[\tan x - x]_0^{\\pi/4} = (1 - \\pi/4) - (0 - 0) = 1 - \\pi/4$.\n'
