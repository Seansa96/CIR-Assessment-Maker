schemaVersion: 1
id: aops-proportions-quiz
title: Proportions Practice Quiz
assessmentType: quiz
categoryId: art-of-problem-solving
topicId: aops-proportions
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - art-of-problem-solving
  - aops-proportions
  - ratios
  - variation
  - percent-change
skills:
- Solve ratio and variation problems from their invariants
- Apply unit rates and scale factors
- Compute percent change using the correct baseline
- Check proportional models and denominator restrictions
questions:
- id: q001
  type: multipleChoice
  prompt: 'If $y$ varies directly with $x$ and $y=18$ when $x=6$, find $y$ when $x=14$.'
  choices:
  - id: a
    text: '26'
  - id: b
    text: '36'
  - id: c
    text: '42'
  - id: d
    text: '84'
  answer:
    choiceId: c
  explanation: The constant ratio is $y/x=3$, so $y=3(14)=42$.
- id: q002
  type: multipleChoice
  prompt: 'If $y$ varies inversely with $x$ and $y=12$ when $x=4$, find $y$ when $x=8$.'
  choices:
  - id: a
    text: '6'
  - id: b
    text: '8'
  - id: c
    text: '16'
  - id: d
    text: '24'
  answer:
    choiceId: a
  explanation: The product remains $xy=48$, so $8y=48$.
- id: q003
  type: multipleChoice
  prompt: 'Orange and green tiles are in the ratio $4:7$. If there are 55 tiles total, how many are orange?'
  choices:
  - id: a
    text: '20'
  - id: b
    text: '22'
  - id: c
    text: '28'
  - id: d
    text: '35'
  answer:
    choiceId: a
  explanation: Orange tiles are $4/(4+7)=4/11$ of 55.
- id: q004
  type: multipleChoice
  prompt: 'A map uses 1 inch for 8 miles. Two towns are 5.5 inches apart on the map. What is the actual distance?'
  choices:
  - id: a
    text: '13.5 miles'
  - id: b
    text: '40 miles'
  - id: c
    text: '44 miles'
  - id: d
    text: '48 miles'
  answer:
    choiceId: c
  explanation: Multiply 5.5 inches by 8 miles per inch.
- id: q005
  type: multipleChoice
  prompt: 'A price rises from $80 to $100. What is the percent increase?'
  choices:
  - id: a
    text: '20%'
  - id: b
    text: '25%'
  - id: c
    text: '80%'
  - id: d
    text: '125%'
  answer:
    choiceId: b
  explanation: Divide the increase of 20 by the original amount 80.
- id: q006
  type: multipleChoice
  prompt: 'Five identical notebooks cost $17.50. What do three notebooks cost?'
  choices:
  - id: a
    text: '$7.00'
  - id: b
    text: '$10.50'
  - id: c
    text: '$12.50'
  - id: d
    text: '$52.50'
  answer:
    choiceId: b
  explanation: Each notebook costs $3.50, so three cost $10.50.
- id: q007
  type: multipleChoice
  prompt: 'A recipe uses flour to sugar in the ratio $2:3$. How much sugar is needed for 20 cups of flour?'
  choices:
  - id: a
    text: '13.3 cups'
  - id: b
    text: '20 cups'
  - id: c
    text: '30 cups'
  - id: d
    text: '40 cups'
  answer:
    choiceId: c
  explanation: Scaling 2 cups of flour to 20 multiplies both ratio parts by 10.
- id: q008
  type: multipleChoice
  prompt: 'Two similar figures have linear scale factor 4 from small to large. What is their area scale factor?'
  choices:
  - id: a
    text: '4'
  - id: b
    text: '8'
  - id: c
    text: '16'
  - id: d
    text: '64'
  answer:
    choiceId: c
  explanation: Areas scale by the square of the linear scale factor.
- id: q009
  type: multipleChoice
  prompt: 'Convert 3.4 kilometers to meters.'
  choices:
  - id: a
    text: '34 meters'
  - id: b
    text: '340 meters'
  - id: c
    text: '3,400 meters'
  - id: d
    text: '34,000 meters'
  answer:
    choiceId: c
  explanation: Multiply by 1,000 meters per kilometer.
- id: q010
  type: multipleChoice
  prompt: 'Solve $\dfrac69=\dfrac{x}{30}$.'
  choices:
  - id: a
    text: '$x=15$'
  - id: b
    text: '$x=18$'
  - id: c
    text: '$x=20$'
  - id: d
    text: '$x=45$'
  answer:
    choiceId: c
  explanation: Cross multiplication gives $9x=180$.
- id: q011
  type: multipleChoice
  prompt: 'After a 25% discount, a jacket costs $54. What was its original price?'
  choices:
  - id: a
    text: '$67.50'
  - id: b
    text: '$72'
  - id: c
    text: '$79'
  - id: d
    text: '$81'
  answer:
    choiceId: b
  explanation: The discounted price is $0.75P$, so $P=54/0.75=72$.
- id: q012
  type: multipleChoice
  prompt: 'A pump fills $3/8$ of a tank in 15 minutes at a constant rate. How long does the full tank take?'
  choices:
  - id: a
    text: '24 minutes'
  - id: b
    text: '30 minutes'
  - id: c
    text: '40 minutes'
  - id: d
    text: '45 minutes'
  answer:
    choiceId: c
  explanation: A whole tank takes $15(8/3)=40$ minutes.
- id: q013
  type: selectAll
  prompt: 'Select every situation modeled by inverse variation under the stated fixed condition.'
  choices:
  - id: a
    text: Workers and completion days for a fixed job at equal productivity
  - id: b
    text: Speed and travel time for a fixed distance
  - id: c
    text: Item count and total cost at a fixed price per item
  - id: d
    text: Width and length for rectangles of fixed area
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: The first, second, and fourth keep a product constant; total cost varies directly with count.
- id: q014
  type: selectAll
  prompt: 'Which statements are correct?'
  choices:
  - id: a
    text: Cross multiplication in $a/b=c/d$ requires $b$ and $d$ to be nonzero.
  - id: b
    text: Direct variation $y=kx$ keeps $y/x$ constant when $x\ne0$.
  - id: c
    text: A 20% increase followed by a 20% decrease always restores the original.
  - id: d
    text: Conversion factors should be oriented so unwanted units cancel.
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: Successive opposite percentages use different baselines and multiply to $1.2(0.8)=0.96$.
- id: q015
  type: freeResponse
  prompt: |-
    Explain why a 20% increase followed by a 20% decrease leaves 96% of the original amount rather than restoring it.
  answer:
    gradingMode: selfCheck
    expected: |-
      If the original is $P$, the increase produces $1.2P$. The decrease is then 20% of that new amount, so the result is $0.8(1.2P)=0.96P$. The percentages do not cancel because they use different reference amounts.
    keyPoints:
    - Represents the changes with factors 1.2 and 0.8.
    - Computes the product as 0.96.
    - Explains that the percentage baselines differ.
  explanation: Multiplicative factors track the changing reference amount.
