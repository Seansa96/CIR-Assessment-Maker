    - type: image
      src: /media/calculus-3/cylindrical-spherical.svg
      alt: Original triple integrals in cylindrical and spherical coordinates reference visual.
      caption: 
    check:
      id: check-01
      type: multipleChoice
      prompt: What coordinates are cylindrical?
      choices:
      - id: a
        text: r theta z
        media: []
        issueSignals: []
      - id: b
        text: r dr dtheta dz (answers 'What is cylindrical dV?', not 'What coordinates are cylindrical?')
        media: []
        issueSignals:
        - id: polar-rectangular-conversion-error
          domains: []
      - id: c
        text: rho squared sin phi drho dphi dtheta (answers 'What is spherical dV?', not 'What coordinates are cylindrical?')
        media: []
        issueSignals:
        - id: polar-rectangular-conversion-error
          domains: []
      - id: d
        text: a sphere (answers 'What solid fits spherical coordinates?', not 'What coordinates are cylindrical?')
        media: []
        issueSignals:
        - id: polar-rectangular-conversion-error
          domains: []
      answer:
