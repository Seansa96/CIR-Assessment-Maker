  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Trigonometry → Polar Coordinates if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Cylindrical extends polar
    required: true
    content: 'Use $(r,\theta,z)$ when a solid has circular symmetry around the z-axis. In Triple Integrals in Cylindrical and Spherical Coordinates, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
