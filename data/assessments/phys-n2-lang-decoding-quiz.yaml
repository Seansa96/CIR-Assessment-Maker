questions:
  - id: n2-lang-q01
    title: '"Moves at a constant speed in a straight line"'
    type: multipleChoice
    prompt: |
      A problem states: "A sled is pulled across the snow, moving at a constant speed in a straight line." What is the immediate mathematical consequence of this phrase?
    choices:
      - id: a
        text: The acceleration is zero, so the net force $\Sigma F$ must equal $0$.
      - id: b
        text: The pulling force must be greater than the friction force.
      - id: c
        text: There are no forces acting on the sled.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "Constant speed in a straight line" is the definition of constant velocity. Constant velocity means zero acceleration. By Newton's Second Law ($\Sigma F = ma$), this means $\Sigma F = 0$.

  - id: n2-lang-q02
    title: '"Apparent weight"'
    type: multipleChoice
    prompt: |
      A problem asks you to calculate the "apparent weight" of a person in an accelerating elevator. Which physical quantity are you actually solving for?
    choices:
      - id: a
        text: The normal force ($N$) exerted by the floor/scale on the person.
      - id: b
        text: The person's true gravitational weight ($mg$).
      - id: c
        text: The net force ($F_\text{net}$) on the person.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "Apparent weight" is how heavy you *feel*. You feel your weight through the contact force supporting you against gravity. Thus, it always refers to the Normal force (or Tension, if hanging).

  - id: n2-lang-q03
    title: '"Massless, frictionless pulley"'
    type: multipleChoice
    prompt: |
      Many Atwood machine problems specify a "massless, frictionless pulley." What two mathematical simplifications does this phrase allow you to make?
    choices:
      - id: a
        text: The tension is the same on both sides of the pulley, and the pulley requires no energy/torque to spin.
      - id: b
        text: The acceleration of the masses is zero, and tension is zero.
      - id: c
        text: Gravity doesn't act on the masses, and the string doesn't stretch.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "Frictionless" means the string doesn't drag on the axle. "Massless" means it requires no net torque to undergo angular acceleration. Together, they guarantee that the tension $T$ is uniform throughout the string.

  - id: n2-lang-q04
    title: '"Uniformly accelerating"'
    type: multipleChoice
    prompt: |
      "A block is uniformly accelerating down a ramp." What does "uniformly" mean in this context?
    choices:
      - id: a
        text: The acceleration is constant, meaning the net force is constant, and you can use standard kinematic equations.
      - id: b
        text: The acceleration is increasing at a steady rate.
      - id: c
        text: The velocity is uniform (constant).
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "Uniform" applied to acceleration means it does not change over time. This implies $\Sigma F$ is constant and standard kinematics apply.

  - id: n2-lang-q05
    title: '"Weightless"'
    type: multipleChoice
    prompt: |
      An astronaut in orbit is described as feeling "weightless." What does this mean in terms of forces?
    choices:
      - id: a
        text: The normal force acting on the astronaut is zero.
      - id: b
        text: The force of gravity acting on the astronaut is zero.
      - id: c
        text: The astronaut's mass has become zero.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** True gravity ($mg$) is very much present (it's what keeps them in orbit!). But because they and the ship are falling at the exact same rate, there are no contact forces (Normal force = 0) pushing against them, creating the sensation of weightlessness.

  - id: n2-lang-q06
    title: '"Light, inextensible string"'
    type: multipleChoice
    prompt: |
      Two masses are connected by a "light, inextensible string." What does "inextensible" tell you about the motion of the two masses?
    choices:
      - id: a
        text: Their accelerations must have the exact same magnitude ($|a_1| = |a_2|$).
      - id: b
        text: Their accelerations must be zero.
      - id: c
        text: The tension in the string is zero.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "Inextensible" means it cannot stretch. Therefore, if one block moves 1 meter, the other must move 1 meter in the same time. They are kinematically linked with identical magnitudes of velocity and acceleration.

  - id: n2-lang-q07
    title: '"Just before the rope breaks"'
    type: multipleChoice
    prompt: |
      A problem asks: "What is the maximum acceleration before the rope breaks?" The rope has a "breaking strength of $500\text{ N}$." What do you do with this number?
    choices:
      - id: a
        text: Set the Tension ($T$) equal to $500\text{ N}$ to solve for the limiting case of acceleration.
      - id: b
        text: Set the net force ($F_\text{net}$) equal to $500\text{ N}$.
      - id: c
        text: Set the acceleration equal to $500$.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The breaking strength is the maximum possible tension. To find the maximum acceleration, you push the system to the absolute limit by setting $T = 500\text{ N}$ in your $\Sigma F = ma$ equations.

  - id: n2-lang-q08
    title: '"Freely falling"'
    type: multipleChoice
    prompt: |
      If an object is "freely falling," what is the ONLY force acting on it?
    choices:
      - id: a
        text: Gravity
      - id: b
        text: Air resistance
      - id: c
        text: Normal force
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** By definition in introductory physics, an object in "free fall" is under the sole influence of gravity. All other forces, including air resistance, are assumed to be zero.

  - id: n2-lang-q09
    title: '"Smooth floor"'
    type: multipleChoice
    prompt: |
      A block is pushed across a "smooth floor." What force is zero?
    choices:
      - id: a
        text: Friction
      - id: b
        text: Normal force
      - id: c
        text: Gravity
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** In physics problems, "smooth" is the code word for a frictionless surface ($\mu = 0$).

  - id: n2-lang-q10
    title: '"Suspended" or "hangs at rest"'
    type: multipleChoice
    prompt: |
      A sign is "suspended" from two cables and "hangs at rest." What does this tell you about the net force in the x and y directions?
    choices:
      - id: a
        text: $\Sigma F_x = 0$ and $\Sigma F_y = 0$.
      - id: b
        text: $\Sigma F_x = 0$, but $\Sigma F_y = mg$.
      - id: c
        text: Both are equal to $ma$.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "At rest" means velocity is zero and remains zero, so acceleration is zero. Therefore, the net force in ALL directions must be zero (static equilibrium).

  - id: n2-lang-q11
    title: '"Terminal velocity"'
    type: multipleChoice
    prompt: |
      A skydiver reaches "terminal velocity." What does this tell you about the equation $\Sigma F_y = ma_y$?
    choices:
      - id: a
        text: It becomes $F_\text{drag} - mg = 0$.
      - id: b
        text: It becomes $F_\text{drag} - mg = mg$.
      - id: c
        text: It becomes $-mg = ma_y$.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Terminal velocity means constant velocity, so $a_y = 0$. The net force must be zero. The upward drag perfectly balances the downward weight.

  - id: n2-lang-q12
    title: '"Pushed by a constant force"'
    type: multipleChoice
    prompt: |
      "A block is pushed by a constant force." If friction is also constant, what can you conclude about the object's kinematics?
    choices:
      - id: a
        text: Its acceleration is constant.
      - id: b
        text: Its velocity is constant.
      - id: c
        text: Its position is constant.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** If all forces (push, friction, gravity, normal) are constant, then $\Sigma F$ is constant. Since $m$ is constant, $a = \Sigma F / m$ must also be constant.

  - id: n2-lang-q13
    title: '"Starts from rest"'
    type: multipleChoice
    prompt: |
      While solving a $\Sigma F = ma$ problem, you are asked to find how far the object travels in $3\text{ seconds}$ after it "starts from rest." What does this mean?
    choices:
      - id: a
        text: The initial velocity $v_0 = 0$.
      - id: b
        text: The initial position $x_0 = 0$.
      - id: c
        text: The initial acceleration $a_0 = 0$.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "Starts from rest" is a kinematic condition giving $v_0 = 0$. You use $\Sigma F = ma$ to find $a$, then kinematics to find distance.

  - id: n2-lang-q14
    title: '"Normal force" meaning in text'
    type: multipleChoice
    prompt: |
      A problem says: "A block is subjected to a normal force of $50\text{ N}$." What does the word "normal" mean here?
    choices:
      - id: a
        text: Perpendicular to the surface of contact.
      - id: b
        text: Ordinary or average.
      - id: c
        text: Pointing straight up.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** In physics, "normal" always means perpendicular to the surface. It does not always point straight up (e.g., on an incline or a wall).

  - id: n2-lang-q15
    title: '"Equilibrium"'
    type: multipleChoice
    prompt: |
      An object is said to be in "dynamic equilibrium." What does this mean?
    choices:
      - id: a
        text: It is moving at a constant velocity (net force is zero).
      - id: b
        text: It is completely stationary (net force is zero).
      - id: c
        text: It is accelerating uniformly.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "Equilibrium" (whether static or dynamic) strictly means $\Sigma F = 0$ and $\Sigma \tau = 0$. "Dynamic" just clarifies that it happens to be moving, but its velocity isn't changing.
