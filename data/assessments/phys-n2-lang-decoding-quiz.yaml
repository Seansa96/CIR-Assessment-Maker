questions:
- id: n2-lang-fbd-1
  type: multipleChoice
  prompt: '[First Three Steps] ''A block of mass m is held against a vertical wall
    by a\rhorizontal applied force P.'' Identify the system to isolate and the target
    unknown if asked for the minimum force P to prevent slipping.'
  choices:
  - id: a
    text: 'System: Block. Target: P, assuming static friction $f_s = \mu_s N$ points
      UP.'
  - id: b
    text: 'System: Wall. Target: N.'
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** To prevent slipping down, friction must point
    up. The normal force is provided by the wall,\rhorizontal.'
- id: n2-lang-pulley-1
  type: multipleChoice
  prompt: '[Language Decoding] ''Two masses are connected by a light string over a
    frictionless pulley. M1 is on a smooth table, M2 hangs vertically.'' What does
    ''smooth'' and ''light'' imply?'
  choices:
  - id: a
    text: Smooth = zero friction. Light = massless string (tension is uniform).
  - id: b
    text: Smooth = constant velocity. Light = massless pulley.
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** ''Smooth'' is standard physics code for frictionless.
    ''Light'' means massless.'
