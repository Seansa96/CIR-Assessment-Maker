questions:
  - id: fric-lang-q01
    title: '"Just barely starts to move"'
    type: multipleChoice
    prompt: |
      In a physics problem, a block is pushed until it "just barely starts to move" or "is on the verge of slipping". What does this specific phrasing tell you to do mathematically?
    choices:
      - id: a
        text: Set the kinetic friction equal to the applied force.
      - id: b
        text: Set the applied force exactly equal to the MAXIMUM static friction ($f_{s,\max} = \mu_s N$).
      - id: c
        text: Set the acceleration to a large positive value.
      - id: d
        text: Ignore friction completely.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** "On the verge of slipping" is the keyword indicating that the static friction has reached its absolute maximum limit, $\mu_s N$. Just before it breaks free, $F_\text{applied} = \mu_s N$.

  - id: fric-lang-q02
    title: '"Constant velocity"'
    type: multipleChoice
    prompt: |
      A problem states: "A student pushes a desk across a rough floor at a constant velocity." What hidden piece of mathematical information is given by the phrase "constant velocity"?
    choices:
      - id: a
        text: The net force on the desk is zero ($F_\text{net} = 0$), so the push force exactly equals the kinetic friction force.
      - id: b
        text: The acceleration is $9.8\text{ m/s}^2$.
      - id: c
        text: Friction is zero.
      - id: d
        text: The push force is greater than the kinetic friction force.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Constant velocity implies zero acceleration. By Newton's Second Law ($F = ma$), zero acceleration means the net horizontal force must be zero. The pushing force must perfectly balance the kinetic friction.

  - id: fric-lang-q03
    title: '"Smooth surface"'
    type: multipleChoice
    prompt: |
      If a physics problem describes a surface as "smooth" or "frictionless" (e.g., "A block slides down a smooth incline"), what assumption must you make?
    choices:
      - id: a
        text: The coefficient of kinetic friction is 0 ($\mu_k = 0$).
      - id: b
        text: The normal force is 0.
      - id: c
        text: The coefficient of kinetic friction is 1.0.
      - id: d
        text: The block is moving at a constant speed.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** In physics problem-speak, "smooth" is a code word for "friction is negligible" or $\mu = 0$. (In contrast, a "rough" surface means friction is present).

  - id: fric-lang-q04
    title: '"Comes to rest"'
    type: multipleChoice
    prompt: |
      A problem reads: "A hockey puck slides across rough ice and eventually comes to rest." What does "comes to rest" tell you about the kinematics?
    choices:
      - id: a
        text: The initial velocity is zero ($v_i = 0$).
      - id: b
        text: The final velocity is zero ($v_f = 0$).
      - id: c
        text: The acceleration is zero ($a = 0$).
      - id: d
        text: The net force is zero.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** "Comes to rest" means the object stops moving. Therefore, its final velocity is $0\text{ m/s}$. It definitely had a non-zero acceleration to slow it down.

  - id: fric-lang-q05
    title: '"Minimum force required"'
    type: multipleChoice
    prompt: |
      You are asked to find the "minimum force required to keep a block pinned against a wall" so that it doesn't slide down. What does this imply about the static friction?
    choices:
      - id: a
        text: Static friction is pointing downwards.
      - id: b
        text: Static friction is pointing upwards and has reached its maximum value ($\mu_s N$) to prevent the downward slide.
      - id: c
        text: Static friction is exactly zero.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** The "minimum" push provides the smallest possible normal force. This means static friction must work as hard as it possibly can ($\mu_s N$) to hold up the weight ($mg$).

  - id: fric-lang-q06
    title: '"Rough surface"'
    type: multipleChoice
    prompt: |
      If a problem specifies a "rough surface" but does not give you a coefficient of friction, what should you generally assume?
    choices:
      - id: a
        text: Friction exists and you will likely need to solve for the coefficient or the friction force using other given information.
      - id: b
        text: You should ignore friction because no coefficient was given.
      - id: c
        text: The coefficient of friction is always $0.5$.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "Rough" explicitly means friction is non-zero. If $\mu$ isn't given, it's usually the unknown variable you are meant to find using Newton's laws or energy conservation.

  - id: fric-lang-q07
    title: '"Light string" or "massless string"'
    type: multipleChoice
    prompt: |
      Many problems involve blocks pulled by a "light" or "massless" string. What is the physical implication of this phrase?
    choices:
      - id: a
        text: The string cannot break.
      - id: b
        text: The tension is uniform (the same) throughout the entire length of the string.
      - id: c
        text: The string exerts no force on the blocks.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** If a string has mass, pulling it requires extra force, and tension would vary along its length. A "massless" string ensures that $T$ is the same at both ends.

  - id: fric-lang-q08
    title: '"Inextensible" or "doesn''t stretch"'
    type: multipleChoice
    prompt: |
      Two blocks are connected by an "inextensible" string. What does this tell you about their motion?
    choices:
      - id: a
        text: They both have zero acceleration.
      - id: b
        text: They must have the exact same magnitude of velocity and acceleration at all times.
      - id: c
        text: The tension in the string is zero.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** If the string can't stretch or go slack (assuming it's taut), the two blocks are forced to move together as a single kinematic unit. $|a_1| = |a_2|$ and $|v_1| = |v_2|$.

  - id: fric-lang-q09
    title: '"Released from rest"'
    type: multipleChoice
    prompt: |
      "A block is released from rest at the top of a rough ramp." What is the hidden initial condition?
    choices:
      - id: a
        text: $v_i = 0$
      - id: b
        text: $v_f = 0$
      - id: c
        text: $a = 0$
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "Released from rest" simply means the initial velocity at the moment you start observing ($t=0$) is $0\text{ m/s}$.

  - id: fric-lang-q10
    title: '"Slides at a steady pace"'
    type: multipleChoice
    prompt: |
      What is another way a problem might say "the net force is zero"?
    choices:
      - id: a
        text: "The block accelerates uniformly."
      - id: b
        text: "The block slides at a steady pace."
      - id: c
        text: "The block is released from rest."
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** "Steady pace", "constant speed", "constant velocity", and "unaccelerated motion" all mean $a=0$, which implies $F_\text{net} = 0$.

  - id: fric-lang-q11
    title: '"Maximum force before sliding"'
    type: multipleChoice
    prompt: |
      You are pulling a block with force $F$. The problem asks for the "maximum force before sliding occurs." Which friction coefficient should you use?
    choices:
      - id: a
        text: $\mu_s$ (static coefficient)
      - id: b
        text: $\mu_k$ (kinetic coefficient)
      - id: c
        text: Both
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "Before sliding occurs" means the block is still at rest. You are dealing with the threshold of motion, which is governed by maximum *static* friction ($f_s = \mu_s N$).

  - id: fric-lang-q12
    title: '"Horizontal surface"'
    type: multipleChoice
    prompt: |
      When a problem states an object is on a "horizontal surface," and no vertical forces are applied other than gravity, what is immediately known about the normal force?
    choices:
      - id: a
        text: $N = mg$
      - id: b
        text: $N = mg \cos\theta$
      - id: c
        text: $N = 0$
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** A horizontal surface has an angle $\theta = 0$. The normal force directly opposes gravity.

  - id: fric-lang-q13
    title: '"Freely falling"'
    type: multipleChoice
    prompt: |
      If an object is "freely falling", what is the assumption about air resistance (friction with the air)?
    choices:
      - id: a
        text: Air resistance is equal to gravity.
      - id: b
        text: Air resistance is zero (negligible).
      - id: c
        text: Air resistance is causing it to reach terminal velocity.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** In introductory physics, "free fall" specifically means the ONLY force acting on the object is gravity. Air resistance must be ignored.

  - id: fric-lang-q14
    title: '"Lightly touching"'
    type: multipleChoice
    prompt: |
      A block is "lightly touching" a vertical wall as it falls. What does this imply about the normal force and friction from the wall?
    choices:
      - id: a
        text: Normal force is very high.
      - id: b
        text: Normal force is zero (or near zero), so friction from the wall is negligible.
      - id: c
        text: Static friction holds it up.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** If it's only "lightly touching", it is not being pushed into the wall. $N \approx 0$, which means $f_k = \mu_k N \approx 0$. The wall exerts no significant forces.

  - id: fric-lang-q15
    title: '"Terminal velocity"'
    type: multipleChoice
    prompt: |
      A skydiver falls until she reaches "terminal velocity". What is the relationship between her weight (gravity) and the fluid friction (air drag) at this point?
    choices:
      - id: a
        text: Air drag is greater than her weight.
      - id: b
        text: Air drag is exactly equal to her weight.
      - id: c
        text: Air drag is zero.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** "Terminal velocity" is a constant velocity. Constant velocity means zero acceleration and zero net force. Therefore, the upward drag force perfectly balances the downward weight.
