randomizeQuestions: true
attemptQuestionCount: 10
questions:
- id: fric-lang-1
  type: multipleChoice
  prompt: '[First Three Steps] ''A block is sliding down a rough incline at a constant
    velocity.'' What are the immediate mathematical translations?'
  choices:
  - id: a
    text: $a = 0$, $f_k = \mu_k N$, and $f_k$ points UP the incline.
  - id: b
    text: $a > 0$, $f_s = \mu_s N$, and $f_s$ points DOWN the incline.
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** ''Constant velocity'' means zero acceleration.
    ''Sliding'' means kinetic friction. Friction opposes motion.'
- id: fric-lang-static-1
  type: multipleChoice
  prompt: '[Language Decoding] ''Determine the maximum force P before the block begins
    to move.'' Which friction regime applies?'
  choices:
  - id: a
    text: 'Max static friction: $f_s = \mu_s N$'
  - id: b
    text: 'Kinetic friction: $f_k = \mu_k N$'
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** ''Before it begins to move'' or ''on the verge
    of slipping'' requires exactly the maximum static friction limit.'
