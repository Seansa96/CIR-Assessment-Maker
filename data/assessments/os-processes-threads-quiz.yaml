- id: q004
  title: Explain Thread model
  type: freeResponse
  prompt: 'In a short answer, explain why **Thread model** matters in Processes and Threads.

    '
  answer:
    expected: 'Threads share a process address space but have their own program counters, stacks, and scheduling state. A
      complete answer should also note that threads share memory, so they reduce isolation while enabling cheaper concurrency.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Thread model
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: Processes and Threads. The key is to connect the term to what the OS controls or protects.

    '
