questions:
- id: q001
  title: Recognize Process model
  type: multipleChoice
  prompt: 'Which statement best describes **Process model** in operating systems?

    '
  choices:
  - id: a
    text: A process is an executing program with registers, memory context, open resources, and scheduling state.
  - id: b
    text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
  - id: c
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: d
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  answer:
    choiceId: a
  explanation: 'A process is an executing program with registers, memory context, open resources, and scheduling state. The
    distractors either ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
