  prompt: |
    For which $p$ does $\sum(-1)^{n-1}/n^p$ converge absolutely?
  choices:
  - id: a
    text: $p>1$
  - id: b
    text: $p>0$
  - id: c
    text: |-
      $p\ge0$
  - id: d
    text: All real $p$
  answer:
    choiceId: a
  explanation: |-
    Solution: Absolute values produce $\sum1/n^p$, which converges exactly above the p-series threshold one. Therefore the answer is $p>1$.

    Why it works: Match the positive tail to $\sum 1/n^p$. Its threshold is strict: it converges only when $p>1$ and diverges for $p\le1$.

    Common trap: The harmonic boundary $p=1$ diverges, so replacing $p>1$ with $p\ge1$ changes the conclusion.

