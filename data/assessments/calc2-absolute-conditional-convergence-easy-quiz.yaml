  prompt: 'Which statement defines conditional convergence?

    '
  choices:
  - id: a
    text: |-
      $\sum a_n$ converges but $\sum|a_n|$ diverges.
  - id: b
    text: |-
      $\sum a_n$ and $\sum|a_n|$ both converge.
  - id: c
    text: |-
      $a_n\to0$ but $\sum a_n$ diverges.
  - id: d
    text: The signs alternate, regardless of convergence.
  answer:
    choiceId: a
  explanation: |-
    Solution: “Conditional” means cancellation is essential because removing signs destroys convergence. Therefore the answer is $\sum a_n$ converges but $\sum|a_n|$ diverges..

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $\sum a_n$ and $\sum|a_n|$ both converge. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $a_n\to0$ but $\sum a_n$ diverges. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; The signs alternate, regardless of convergence. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
