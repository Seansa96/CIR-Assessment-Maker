schemaVersion: 1
id: calc2-absolute-conditional-convergence-easy-quiz
title: Absolute and Conditional Convergence Easy Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: absolute-conditional-convergence
skills:
- Distinguish absolute, conditional, and divergent behavior
- Apply absolute-convergence implications and contrapositives
- Select tests for signed and magnitude series
navigation:
  learningGoal: practice
  activityType: mixedPractice
  tags:
  - calculus-2
  - absolute-conditional-convergence
  - easy
  - convergence-classification
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - define-absolute-convergence
  prompt: |
    What must converge for $\sum a_n$ to converge absolutely?
  choices:
  - id: a
    text: |-
      $\sum|a_n|$
  - id: b
    text: |-
      $\sum(-1)^na_n$
  - id: c
    text: The sequence $(|a_n|)$ to a nonzero limit
  - id: d
    text: Only the positive-indexed terms
  answer:
    choiceId: a
  explanation: Absolute convergence is defined by convergence of the series of term magnitudes.
- id: q002
  type: multipleChoice
  skills:
  - apply-absolute-convergence-implication
  prompt: |
    If $\sum|a_n|$ converges, what is guaranteed?
  choices:
  - id: a
    text: |-
      $\sum a_n$ converges.
  - id: b
    text: |-
      $\sum a_n$ diverges.
  - id: c
    text: $a_n$ is eventually positive.
  - id: d
    text: |-
      $\sum a_n=0$.
  answer:
    choiceId: a
  explanation: The triangle inequality makes absolute convergence a sufficient condition for convergence
    of the signed series.
- id: q003
  type: multipleChoice
  skills:
  - define-conditional-convergence
  prompt: |
    Which statement defines conditional convergence?
  choices:
  - id: a
    text: |-
      $\sum a_n$ converges but $\sum|a_n|$ diverges.
  - id: b
    text: |-
      $\sum a_n$ and $\sum|a_n|$ both converge.
  - id: c
    text: |-
      $a_n\to0$ but $\sum a_n$ diverges.
  - id: d
    text: The signs alternate, regardless of convergence.
  answer:
    choiceId: a
  explanation: “Conditional” means cancellation is essential because removing signs destroys convergence.
- id: q004
  type: multipleChoice
  skills:
  - classify-standard-series
  prompt: |
    Classify $\sum_{n=1}^{\infty}(-1)^{n-1}/n$.
  choices:
  - id: a
    text: Absolutely convergent
  - id: b
    text: Conditionally convergent
  - id: c
    text: Divergent by the term test
  - id: d
    text: Geometric
  answer:
    choiceId: b
  explanation: The signed series passes the alternating test, while its absolute-value series is the divergent
    harmonic series.
- id: q005
  type: multipleChoice
  skills:
  - classify-p-series-magnitudes
  prompt: |
    How does $\sum_{n=1}^{\infty}(-1)^n/n^2$ converge?
  choices:
  - id: a
    text: Absolutely
  - id: b
    text: Conditionally
  - id: c
    text: It diverges.
  - id: d
    text: Only its even terms converge.
  answer:
    choiceId: a
  explanation: |-
    Taking absolute values produces the convergent p-series $\sum1/n^2$.
- id: q006
  type: multipleChoice
  skills:
  - apply-the-divergence-test
  prompt: |
    Classify $\sum_{n=1}^{\infty}(-1)^n n/(n+1)$.
  choices:
  - id: a
    text: Absolutely convergent
  - id: b
    text: Conditionally convergent
  - id: c
    text: Divergent because the terms do not approach zero
  - id: d
    text: Convergent by alternation
  answer:
    choiceId: c
  explanation: |-
    The magnitudes approach one, so the signed terms oscillate near $\pm1$ and violate a necessary convergence condition.
- id: q007
  type: multipleChoice
  skills:
  - select-absolute-convergence-tests
  prompt: |
    Which test is most direct for absolute convergence of
    $\sum(-1)^n3^n/n!$?
  choices:
  - id: a
    text: Ratio test
  - id: b
    text: Alternating-series test only
  - id: c
    text: Integral test
  - id: d
    text: Divergence test, because the terms approach zero
  answer:
    choiceId: a
  explanation: |-
    Consecutive absolute terms have ratio $3/(n+1)\to0$, proving absolute convergence.
- id: q008
  type: multipleChoice
  skills:
  - reason-about-rearrangements
  prompt: |
    Which convergence type guarantees that every rearrangement has the same sum?
  choices:
  - id: a
    text: Absolute convergence
  - id: b
    text: Conditional convergence
  - id: c
    text: Divergence with terms approaching zero
  - id: d
    text: Alternating signs
  answer:
    choiceId: a
  explanation: Finite total magnitude controls all reordered tails, so an absolutely convergent series
    is order-independent.
- id: q009
  type: multipleChoice
  skills:
  - use-contrapositives
  prompt: |
    If $\sum a_n$ diverges, what must be true?
  choices:
  - id: a
    text: |-
      $\sum|a_n|$ diverges.
  - id: b
    text: |-
      $\sum|a_n|$ converges.
  - id: c
    text: $a_n$ never approaches zero.
  - id: d
    text: Every term is positive.
  answer:
    choiceId: a
  explanation: If the magnitude series converged, the absolute-convergence theorem would force the signed
    series to converge; therefore it cannot.
- id: q010
  type: multipleChoice
  skills:
  - classify-parameter-families
  prompt: |
    For which $p$ does $\sum(-1)^{n-1}/n^p$ converge absolutely?
  choices:
  - id: a
    text: $p>1$
  - id: b
    text: $p>0$
  - id: c
    text: |-
      $p\ge0$
  - id: d
    text: All real $p$
  answer:
    choiceId: a
  explanation: |-
    Absolute values produce $\sum1/n^p$, which converges exactly above the p-series threshold one.
- id: q011
  type: multipleChoice
  skills:
  - apply-limit-comparison-to-magnitudes
  prompt: |
    Classify $\sum_{n=1}^{\infty}(-1)^n/(n^2+n)$.
  choices:
  - id: a
    text: Absolutely convergent
  - id: b
    text: Conditionally convergent
  - id: c
    text: Divergent
  - id: d
    text: The term test is the only applicable test.
  answer:
    choiceId: a
  explanation: The magnitudes are bounded above by $1/n^2$, so their series converges by comparison.
- id: q012
  type: multipleChoice
  skills:
  - recognize-positive-series-classifications
  prompt: |
    Can a series with $a_n\ge0$ for every $n$ converge conditionally?
  choices:
  - id: a
    text: |-
      No, because $\sum|a_n|=\sum a_n$.
  - id: b
    text: |-
      Yes, whenever $a_n\to0$.
  - id: c
    text: Yes, if the terms decrease.
  - id: d
    text: Yes, if the sum is less than one.
  answer:
    choiceId: a
  explanation: For nonnegative terms, ordinary and absolute convergence are the same question.
- id: q013
  type: multipleChoice
  skills:
  - understand-finite-term-invariance
  prompt: |
    A conditionally convergent series has its first three terms changed. What
    is guaranteed?
  choices:
  - id: a
    text: It remains conditionally convergent, though its sum may change.
  - id: b
    text: It becomes absolutely convergent.
  - id: c
    text: It diverges.
  - id: d
    text: Its sum remains exactly unchanged.
  answer:
    choiceId: a
  explanation: Finite changes preserve convergence of both the signed and magnitude tails but can shift
    the total by a finite amount.
- id: q014
  type: multipleChoice
  skills:
  - diagnose-failed-test-logic
  prompt: |
    The absolute ratio-test limit for a series is $1$. What follows?
  choices:
  - id: a
    text: The ratio test is inconclusive.
  - id: b
    text: The series converges conditionally.
  - id: c
    text: The series converges absolutely.
  - id: d
    text: The series diverges.
  answer:
    choiceId: a
  explanation: Both convergent p-series and divergent harmonic-type series can have ratio limit one.
- id: q015
  type: multipleChoice
  skills:
  - select-classification-workflows
  prompt: |
    What is generally the best first question when classifying a signed series?
  choices:
  - id: a
    text: Does the series of absolute values converge?
  - id: b
    text: What is the exact sum?
  - id: c
    text: Are all early terms decreasing?
  - id: d
    text: Can the first term be removed?
  answer:
    choiceId: a
  explanation: A positive answer immediately gives the strongest classification; a negative answer leads
    to a separate signed-convergence test.
attemptQuestionCount: 15
