  prompt: |
    What must converge for $\sum a_n$ to converge absolutely?
  choices:
  - id: a
    text: |-
      $\sum|a_n|$
  - id: b
    text: |-
      $\sum(-1)^na_n$
  - id: c
    text: The sequence $(|a_n|)$ to a nonzero limit
  - id: d
    text: Only the positive-indexed terms
  answer:
    choiceId: a
  explanation: |-
    Solution: Absolute convergence is defined by convergence of the series of term magnitudes. Therefore the answer is $\sum|a_n|$.

    Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.

    Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.

    Why the other choices fail: $\sum(-1)^na_n$ conflicts with this criterion: Direct comparison uses nonnegative terms; The sequence $(|a_n|)$ to a nonzero limit conflicts with this criterion: Direct comparison uses nonnegative terms; Only the positive-indexed terms conflicts with this criterion: Direct comparison uses nonnegative terms.
