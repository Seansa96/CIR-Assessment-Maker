items:
- {id: force-r1, type: cloze, prompt: 'A periodic external force produces a {{forced}} oscillation.', answer: forced, explanation: 'Solution: Identify forced oscillation. Why it works: an external driver continually supplies energy.'}
- {id: force-r2, type: typed, prompt: 'Near what frequency does resonance occur in a lightly damped system?', answer: natural frequency, explanation: 'Solution: Near the natural frequency. Why it works: the denominator of the steady-state amplitude is minimized there.'}
- {id: force-r3, type: cloze, prompt: 'The natural angular frequency is $\omega_0={{\sqrt{k/m}}}$.', answer: '\sqrt{k/m}', explanation: 'Solution: Use $\omega_0=\sqrt{k/m}$. Why it works: it follows from the undamped mass-spring equation.'}
- {id: force-r4, type: typed, prompt: 'Does greater damping make a resonance peak broader or sharper?', answer: broader, explanation: 'Solution: Greater damping makes it broader. Why it works: dissipation reduces the selectivity of the driven response.'}
- {id: force-r5, type: cloze, prompt: 'After transient motion fades, the oscillator reaches {{steady state}}.', answer: steady state, explanation: 'Solution: Identify steady state. Why it works: only the ongoing driven response remains at long times.'}
- {id: force-r6, type: typed, prompt: 'At what frequency does steady-state motion occur?', answer: driving frequency, explanation: 'Solution: At the driving frequency. Why it works: the particular solution is synchronized with the external force.'}
