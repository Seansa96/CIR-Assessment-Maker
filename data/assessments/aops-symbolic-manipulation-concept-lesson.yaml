lesson:
  introduction: Learn to solve Symbolic Manipulation problems by recognizing symbolic identities, substitutions, and equivalence and justifying each theorem or transformation.
  sections:
  - id: aops-symbolic-manipulation-motivation
    title: What the topic helps you notice
    required: true
    content: Symbolic Manipulation is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are symbolic identities, substitutions, and equivalence.
    check:
      id: aops-symbolic-manipulation-motivation-check
      type: multipleChoice
      prompt: In Symbolic Manipulation, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-symbolic-manipulation-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-symbolic-manipulation-definitions-check
      type: multipleChoice
      prompt: In Symbolic Manipulation, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-symbolic-manipulation-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: symbolic identities, substitutions, and equivalence. Record the givens, unknown, and any restriction before selecting a method.'
    check:
      id: aops-symbolic-manipulation-recognition-check
      type: multipleChoice
      prompt: In Symbolic Manipulation, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-symbolic-manipulation-method
    title: Choose a method
    required: true
    content: Choose the shortest valid route from the givens to the target. Explain why the condition for the chosen method is satisfied.
    check:
      id: aops-symbolic-manipulation-method-check
      type: multipleChoice
      prompt: In Symbolic Manipulation, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-symbolic-manipulation-mini-example
    title: A small original example
    required: true
    content: Try a small case first, then generalize. Substitute the result back into the original condition instead of checking only an intermediate expression.
    check:
      id: aops-symbolic-manipulation-mini-example-check
      type: multipleChoice
      prompt: In Symbolic Manipulation, what should be checked before applying a method?
      choices:
