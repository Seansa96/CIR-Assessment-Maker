      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-symbolic-manipulation-trap
    title: Common misconception
    required: true
    content: A common error is using a converse, diagram appearance, or familiar formula without its hypothesis. Name the missing hypothesis and test it.
    check:
      id: aops-symbolic-manipulation-trap-check
      type: multipleChoice
      prompt: In Symbolic Manipulation, what should be checked before applying a method?
      choices:
