        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-symbolic-manipulation-synthesis
    title: Contest synthesis
    required: true
    content: Classify the structure, make one justified move at a time, and finish by checking that the result answers the exact question asked.
    check:
      id: aops-symbolic-manipulation-synthesis-check
      type: multipleChoice
      prompt: In Symbolic Manipulation, what should be checked before applying a method?
