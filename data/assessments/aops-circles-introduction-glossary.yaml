glossary:
  introduction: Definitions include the condition that permits each theorem; use the drills to distinguish easily confused objects.
  sections:
  - id: aops-circles-introduction-terms
    title: Terms, conditions, and recognition cues
    required: true
    content: Name an object from its defining incidence or measurement facts, not from how a drawing looks.
    entries:
    - id: circle
      term: Circle
      definition: The set of points in a plane at one fixed positive distance from a center.
      notation: $OP=r$
      examples:
      - Every boundary point P satisfies OP=r.
      aliases: &id001 []
      media: []
      tags:
      - circle
      - aops-circles-introduction
      drills:
      - id: circle-definition-drill
        type: typed
        prompt: 'Name the term: The set of points in a plane at one fixed positive distance from a center.'
        answer:
          expected: Circle
          aliases: *id001
        explanation: The defining feature identifies Circle.
        tags:
        - circle
        - aops-circles-introduction
    - id: disk
      term: Disk
      definition: A circle together with all points in its interior.
      notation: ''
      examples:
      - Area refers to the disk, while circumference refers to its boundary.
      aliases: &id002 []
      media: []
      tags:
      - disk
      - aops-circles-introduction
      drills:
      - id: disk-definition-drill
        type: typed
        prompt: 'Name the term: A circle together with all points in its interior.'
        answer:
          expected: Disk
          aliases: *id002
        explanation: The defining feature identifies Disk.
        tags:
        - disk
        - aops-circles-introduction
    - id: radius
      term: Radius
      definition: A segment from the center to a point on the circle, or its length.
      notation: $r$
      examples:
      - OA is a radius when A lies on the circle.
      aliases: &id003
      - radii
      media: []
      tags:
      - radius
      - aops-circles-introduction
      drills:
      - id: radius-definition-drill
        type: typed
        prompt: 'Name the term: A segment from the center to a point on the circle, or its length.'
        answer:
          expected: Radius
          aliases: *id003
        explanation: The defining feature identifies Radius.
        tags:
        - radius
        - aops-circles-introduction
    - id: diameter
      term: Diameter
      definition: A chord that passes through the center; its length is twice the radius.
      notation: $d=2r$
      examples:
      - A diameter divides the circle into two semicircles.
      aliases: &id004 []
      media: []
      tags:
      - diameter
      - aops-circles-introduction
      drills:
      - id: diameter-definition-drill
        type: typed
        prompt: 'Name the term: A chord that passes through the center; its length is twice the radius.'
        answer:
          expected: Diameter
          aliases: *id004
        explanation: The defining feature identifies Diameter.
        tags:
        - diameter
        - aops-circles-introduction
    - id: chord
      term: Chord
      definition: A segment whose two endpoints lie on the circle.
      notation: ''
      examples:
      - Every diameter is a chord, but not every chord is a diameter.
      aliases: &id005 []
      media: []
      tags:
      - chord
      - aops-circles-introduction
      drills:
      - id: chord-definition-drill
        type: typed
        prompt: 'Name the term: A segment whose two endpoints lie on the circle.'
        answer:
          expected: Chord
          aliases: *id005
        explanation: The defining feature identifies Chord.
        tags:
        - chord
        - aops-circles-introduction
    - id: secant
      term: Secant
      definition: A line that intersects a circle at two points.
      notation: ''
      examples:
      - A secant continues beyond both endpoints of its chord.
      aliases: &id006 []
      media: []
      tags:
      - secant
      - aops-circles-introduction
      drills:
      - id: secant-definition-drill
        type: typed
        prompt: 'Name the term: A line that intersects a circle at two points.'
        answer:
          expected: Secant
          aliases: *id006
        explanation: The defining feature identifies Secant.
        tags:
        - secant
        - aops-circles-introduction
    - id: tangent
      term: Tangent
      definition: A line that meets a circle at exactly one point.
      notation: ''
      examples:
      - The tangent at T is perpendicular to radius OT.
      aliases: &id007 []
      media: []
      tags:
      - tangent
      - aops-circles-introduction
      drills:
      - id: tangent-definition-drill
        type: typed
        prompt: 'Name the term: A line that meets a circle at exactly one point.'
        answer:
          expected: Tangent
          aliases: *id007
        explanation: The defining feature identifies Tangent.
        tags:
        - tangent
        - aops-circles-introduction
    - id: point-of-tangency
      term: Point of tangency
      definition: The unique point where a tangent meets its circle.
      notation: $T$
      examples:
      - A radius to T makes the tangent-radius right angle.
      aliases: &id008
      - contact point
      media: []
      tags:
      - point-of-tangency
      - aops-circles-introduction
      drills:
      - id: point-of-tangency-definition-drill
        type: typed
        prompt: 'Name the term: The unique point where a tangent meets its circle.'
        answer:
          expected: Point of tangency
          aliases: *id008
        explanation: The defining feature identifies Point of tangency.
        tags:
        - point-of-tangency
        - aops-circles-introduction
    - id: circumference
      term: Circumference
      definition: The length of a circle's boundary.
      notation: $C=2\pi r$
      examples:
      - A radius-5 circle has circumference 10pi.
      aliases: &id009 []
      media: []
      tags:
      - circumference
      - aops-circles-introduction
      drills:
      - id: circumference-definition-drill
        type: typed
        prompt: 'Name the term: The length of a circle''s boundary.'
        answer:
          expected: Circumference
          aliases: *id009
        explanation: The defining feature identifies Circumference.
        tags:
        - circumference
        - aops-circles-introduction
    - id: arc
      term: Arc
      definition: A connected portion of a circle's circumference between two endpoints.
      notation: $\widehat{AB}$
      examples:
      - An arc is one-dimensional; it is not a sector.
      aliases: &id010 []
      media: []
      tags:
      - arc
      - aops-circles-introduction
      drills:
      - id: arc-definition-drill
        type: typed
        prompt: 'Name the term: A connected portion of a circle''s circumference between two endpoints.'
        answer:
          expected: Arc
          aliases: *id010
        explanation: The defining feature identifies Arc.
        tags:
        - arc
        - aops-circles-introduction
    - id: minor-arc
      term: Minor arc
      definition: The arc between two points measuring less than 180 degrees.
      notation: ''
      examples:
      - Two-letter arc notation usually names a minor arc.
      aliases: &id011 []
      media: []
      tags:
      - minor-arc
      - aops-circles-introduction
      drills:
      - id: minor-arc-definition-drill
        type: typed
        prompt: 'Name the term: The arc between two points measuring less than 180 degrees.'
        answer:
          expected: Minor arc
          aliases: *id011
        explanation: The defining feature identifies Minor arc.
        tags:
        - minor-arc
        - aops-circles-introduction
    - id: major-arc
      term: Major arc
      definition: The arc between two points measuring more than 180 degrees.
      notation: ''
      examples:
      - A third point often identifies which major arc is intended.
      aliases: &id012 []
      media: []
      tags:
      - major-arc
      - aops-circles-introduction
      drills:
      - id: major-arc-definition-drill
        type: typed
        prompt: 'Name the term: The arc between two points measuring more than 180 degrees.'
        answer:
          expected: Major arc
          aliases: *id012
        explanation: The defining feature identifies Major arc.
        tags:
        - major-arc
        - aops-circles-introduction
    - id: central-angle
      term: Central angle
      definition: An angle whose vertex is the center of a circle.
      notation: '$\angle AOB$'
      examples:
      - Its degree measure equals that of its intercepted arc.
      aliases: &id013 []
      media: []
      tags:
      - central-angle
      - aops-circles-introduction
      drills:
      - id: central-angle-definition-drill
        type: typed
        prompt: 'Name the term: An angle whose vertex is the center of a circle.'
        answer:
          expected: Central angle
          aliases: *id013
        explanation: The defining feature identifies Central angle.
        tags:
        - central-angle
        - aops-circles-introduction
    - id: sector
      term: Sector
      definition: The region bounded by two radii and their intercepted arc.
      notation: ''
      examples:
      - A 90-degree sector is one quarter of a disk.
      aliases: &id014 []
      media: []
      tags:
      - sector
      - aops-circles-introduction
      drills:
      - id: sector-definition-drill
        type: typed
        prompt: 'Name the term: The region bounded by two radii and their intercepted arc.'
        answer:
          expected: Sector
          aliases: *id014
        explanation: The defining feature identifies Sector.
        tags:
        - sector
        - aops-circles-introduction
    - id: concentric-circles
      term: Concentric circles
      definition: Circles that share the same center but have different radii.
      notation: ''
      examples:
      - A washer-shaped region lies between concentric circles.
      aliases: &id015 []
      media: []
      tags:
      - concentric-circles
      - aops-circles-introduction
      drills:
      - id: concentric-circles-definition-drill
        type: typed
        prompt: 'Name the term: Circles that share the same center but have different radii.'
        answer:
          expected: Concentric circles
          aliases: *id015
        explanation: The defining feature identifies Concentric circles.
        tags:
        - concentric-circles
        - aops-circles-introduction
    - id: intercepted-arc
      term: Intercepted arc
      definition: The arc lying between the points where an angle's sides meet a circle.
      notation: ''
      examples:
      - Circle-angle formulas require the correct intercepted arc.
      aliases: &id016 []
      media: []
      tags:
      - intercepted-arc
      - aops-circles-introduction
      drills:
      - id: intercepted-arc-definition-drill
        type: typed
        prompt: 'Name the term: The arc lying between the points where an angle''s sides meet a circle.'
        answer:
          expected: Intercepted arc
          aliases: *id016
        explanation: The defining feature identifies Intercepted arc.
        tags:
        - intercepted-arc
        - aops-circles-introduction
