lesson:
  introduction: 'Welcome to the lesson on Fluid Dynamics. We now move from fluids
    at rest to fluids in motion. By treating fluids as "ideal," we can uncover the
    powerful conservation laws that govern water flowing through pipes and air flowing
    over airplane wings: the Equation of Continuity and Bernoulli''s Equation.

    '
  sections:
  - id: ideal-fluids
    title: 1. Ideal Fluids
    required: true
    content: 'To simplify fluid dynamics, we introduce the **Ideal Fluid Model**,
      which assumes:

      1. **Incompressible**: The density ($\rho$) is constant everywhere.

      2. **Non-viscous**: There is no internal friction or resistance to flow.

      3. **Steady flow**: The velocity at any given point in space remains constant
      over time.

      4. **Irrotational**: The fluid has no angular momentum about any point.


      We visualize fluid flow using **streamlines**, which trace the path of individual
      fluid particles.

      '
    media: []
    check:
      id: check-1
      type: multipleChoice
      prompt: 'Which of the following is NOT an assumption of the ideal fluid model
        used in Bernoulli''s equation?

        '
      choices:
      - id: a
        text: The fluid is highly compressible.
      - id: b
        text: The fluid has no viscosity.
        issueSignals:
        - id: fluid-concept-misunderstood
      - id: c
        text: The flow is steady over time.
        issueSignals:
        - id: velocity-flow-confusion
      answer:
        choiceId: a
      explanation: 'Solution:

        The fluid is highly compressible.


        Why it works:

        Ideal fluids are assumed to be strictly incompressible, meaning their density
        cannot change. This is a very good approximation for liquids like water, and
        a reasonable approximation for gases moving at low speeds (subsonic aerodynamics).


        Why the other choices fail:

        Zero viscosity and steady flow are both core assumptions of the ideal fluid
        model, allowing us to ignore energy lost to heat and turbulence.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: equation-of-continuity
    title: 2. The Equation of Continuity
    required: true
    content: "The Equation of Continuity is simply the **conservation of mass** applied\
      \ to a fluid in a pipe. \nFor an incompressible fluid, the volume flow rate\
      \ ($Q$) must be constant throughout the pipe.\n\n$$ Q = \\frac{\\Delta V}{\\\
      Delta t} = A \\cdot v $$\n\nWhere $A$ is the cross-sectional area and $v$ is\
      \ the fluid speed. Therefore, between any two points 1 and 2:\n$$ A_1 v_1 =\
      \ A_2 v_2 $$\n\nThis tells us that as a pipe narrows (area decreases), the fluid\
      \ must speed up to get the same volume of water through the restriction.\n"
    media: []
    check:
      id: check-2
      type: multipleChoice
      prompt: 'According to the equation of continuity, what happens to the speed
        of water flowing through a hose when you cover exactly half of the opening
        with your thumb?

        '
      choices:
      - id: a
        text: The speed doubles.
      - id: b
        text: The speed halves.
        issueSignals:
        - id: velocity-flow-confusion
      - id: c
        text: The speed quadruples.
        issueSignals:
        - id: velocity-flow-confusion
      - id: d
        text: The speed remains the same.
        issueSignals:
        - id: velocity-flow-confusion
      answer:
        choiceId: a
      explanation: 'Solution:

        The speed doubles.


        Why it works:

        Because $A_1 v_1 = A_2 v_2$, velocity is inversely proportional to cross-sectional
        area. By covering half the opening, you reduce the exit area to $1/2$ its
        original size, forcing the water to travel $2$ times as fast to maintain the
        constant volume flow rate.


        Why the other choices fail:

        If the speed halved, water would back up inside the hose. It only quadruples
        if the radius is halved (since Area $\propto$ radius$^2$), but covering half
        the opening directly halves the area.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: bernoullis-equation
    title: 3. Bernoulli's Equation
    required: true
    content: '**Bernoulli''s Equation** is the conservation of energy applied to an
      ideal fluid. It states that the work done on a fluid by pressure differences
      results in changes to its kinetic and potential energy.


      Along any streamline:

      $$ P_1 + \frac{1}{2}\rho v_1^2 + \rho g y_1 = P_2 + \frac{1}{2}\rho v_2^2 +
      \rho g y_2 $$


      Notice that each term has units of energy per unit volume (Joules/m$^3$, which
      equals Pascals).


      **The Venturi Effect**: A direct consequence of Bernoulli''s equation is that
      for a horizontal pipe ($y_1 = y_2$), an increase in fluid speed (caused by a
      narrowing pipe) must be accompanied by a *decrease* in pressure. Fast-moving
      fluids exert lower pressure!

      '
    media: []
    check:
      id: check-3
      type: multipleChoice
      prompt: 'Why does the canvas roof of a convertible car bulge outward when driving
        at high speeds?

        '
      choices:
      - id: a
        text: The fast-moving air over the roof creates a region of low pressure outside,
          so the higher stationary pressure inside pushes the roof up.
      - id: b
        text: The fast-moving air pushes down hard on the roof, causing it to buckle
          outward at the sides.
        issueSignals:
        - id: force-pressure-confusion
      - id: c
        text: The air inside the car expands due to the heat of the engine.
        issueSignals:
        - id: fluid-concept-misunderstood
      answer:
        choiceId: a
      explanation: 'Solution:

        The fast-moving air over the roof creates a region of low pressure outside,
        so the higher stationary pressure inside pushes the roof up.


        Why it works:

        According to Bernoulli''s principle, the high velocity of the air rushing
        over the curved top of the car ($v$ is large) corresponds to a drop in external
        air pressure ($P$ is small). Inside the car, the air is stationary ($v \approx
        0$), so the pressure is normal atmospheric pressure. This pressure difference
        results in a net outward force on the canvas.


        Why the other choices fail:

        Fast moving air exerts *less* pressure perpendicular to its flow, not more.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - { id: fd4, title: Volume flow rate, content: 'Volume flow rate is $Q=Av$ for an incompressible fluid.', check: { id: fdc4, type: multipleChoice, prompt: 'The SI unit of volume flow rate is:', choices: [{ id: a, text: '$\mathrm{m^3/s}$' }, { id: b, text: '$\mathrm{m/s}$' }], answer: { choiceId: a }, explanation: 'Solution: The unit is $\mathrm{m^3/s}$.\n\nWhy it works: Flow rate is volume divided by time.\n\nWhy the other choices fail: $\mathrm{m/s}$ measures speed.' } }
  - { id: fd5, title: Horizontal flow, content: 'At equal height, a change in speed can be balanced by a pressure change.', check: { id: fdc5, type: multipleChoice, prompt: 'In a horizontal ideal-fluid pipe, where speed is higher pressure is:', choices: [{ id: a, text: 'lower' }, { id: b, text: 'higher' }], answer: { choiceId: a }, explanation: 'Solution: Pressure is lower.\n\nWhy it works: Bernoulli''s energy sum is constant along a streamline.\n\nWhy the other choices fail: Higher pressure would not balance the larger kinetic-energy density.' } }
  - { id: fd6, title: Height term, content: 'Raising a flowing fluid increases gravitational potential energy per volume.', check: { id: fdc6, type: multipleChoice, prompt: 'Bernoulli''s height term is:', choices: [{ id: a, text: '$\rho gy$' }, { id: b, text: '$\rho g/y$' }], answer: { choiceId: a }, explanation: 'Solution: The term is $\rho gy$.\n\nWhy it works: It is gravitational potential energy per volume.\n\nWhy the other choices fail: Inverse height is not the gravitational-energy relation.' } }
  - { id: fd7, title: Model limits, content: 'Viscosity, turbulence, and unsteady flow limit ideal-fluid predictions.', check: { id: fdc7, type: multipleChoice, prompt: 'Which effect violates the ideal-fluid assumption?', choices: [{ id: a, text: 'viscosity' }, { id: b, text: 'steady flow' }], answer: { choiceId: a }, explanation: 'Solution: Viscosity violates the model.\n\nWhy it works: Ideal fluids are non-viscous.\n\nWhy the other choices fail: Steady flow is an ideal-fluid assumption.' } }
