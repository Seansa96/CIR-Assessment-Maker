lesson:
  introduction: Learn to solve Polygons problems by recognizing polygon types, angle sums, regular polygons, regular hexagons and justifying each theorem or transformation.
  sections:
  - id: aops-polygons-motivation
    title: What the topic helps you notice
    required: true
    content: Polygons is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are polygon types, angle sums, regular polygons, regular hexagons.
    check:
      id: aops-polygons-motivation-check
      type: multipleChoice
      prompt: In Polygons, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-polygons-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-polygons-definitions-check
      type: multipleChoice
      prompt: In Polygons, what should be checked before applying a method?
