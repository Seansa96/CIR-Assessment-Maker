lesson:
  introduction: |-
    This concept lesson introduces the problem-solving role of Polygons in AoPS Volume 1 style work.
  sections:
  - id: chapter-map
    title: What Polygons is really training
    required: true
    content: |-
      This lesson treats **Polygons** as a collection of problem-solving moves, not as a list of facts. The main concepts are polygon types, angle sums, regular polygons, regular hexagons. When a contest-style problem looks unfamiliar, first ask which structure is being preserved, transformed, counted, or compared.
    check:
      id: chapter-map-check
      type: multipleChoice
      prompt: What is the best first question when starting a Polygons problem?
      choices:
      - id: a
        text: Which memorized formula is longest?
      - id: b
        text: What structure or relationship is the problem asking me to preserve or exploit?
      - id: c
        text: Can I skip defining the variables?
      - id: d
        text: Can I assume the diagram or numbers were chosen randomly?
      answer:
        choiceId: b
      explanation: |-
        The useful first move is structural: identify the relationship, invariant, or representation that makes the Polygons technique relevant.
  - id: core-methods
    title: Core methods and recognition cues
    required: true
    content: |-
      The recurring methods in this chapter are:

      - **triangulate polygons**: look for a prompt that asks you to compare, rewrite, count, or prove using this structure.
      - **use exterior angles**: look for a prompt that asks you to compare, rewrite, count, or prove using this structure.
      - **use symmetry**: look for a prompt that asks you to compare, rewrite, count, or prove using this structure.
    check:
      id: core-methods-check
      type: selectAll
      prompt: Select the habits that fit AoPS-style problem solving.
      choices:
      - id: a
        text: Name the structure before manipulating symbols.
      - id: b
        text: Check whether a transformation preserves the original quantity.
      - id: c
        text: Ignore constraints once an answer looks plausible.
      - id: d
        text: Look for a simpler equivalent representation.
      answer:
        choiceIds:
        - a
        - b
        - d
      explanation: |-
        AoPS problems reward structure, equivalence, and constraint checking. A plausible answer still needs verification.
  - id: common-trap
    title: Common trap
    required: true
    content: |-
      A common trap in **Polygons** is performing a legal-looking operation without checking the condition that makes it legal. Examples include changing signs without tracking direction, treating a special case as general, assuming a diagram is exact, or counting arrangements twice.
    check:
      id: common-trap-check
      type: multipleChoice
      prompt: Which response best prevents this trap?
      choices:
      - id: a
        text: Write the final answer first and work backward only if challenged.
      - id: b
        text: State the condition that permits each algebraic, geometric, or counting move.
      - id: c
        text: Use only decimal approximations.
      - id: d
        text: Avoid checking edge cases.
      answer:
        choiceId: b
      explanation: Naming the condition keeps the solution honest and exposes hidden cases.
  - id: synthesis
    title: Synthesis habit
    required: true
    content: |-
      For this chapter, the synthesis habit is: **turn the problem into a known structure, then verify that the transformed problem still answers the original question**. This is why examples and end-of-chapter problems are valuable: they show when a method is triggered, not just how the arithmetic finishes.
    check:
      id: synthesis-check
      type: freeResponse
      prompt: |-
        In one or two sentences, describe what you should look for when solving a Polygons problem.
      answer:
        expected: |-
          Look for the chapter structure, choose a method that preserves the original conditions, and verify the result against the question.
        gradingMode: selfCheck
        keyPoints:
        - Identify the structure.
        - Use a legal transformation or theorem.
        - Check the answer against the original problem.
      explanation: |-
        This chapter is about recognizing when triangulate polygons or a related method is the useful move.
