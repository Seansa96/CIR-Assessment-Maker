title: Polygons Concept Lesson
description: Derive polygon angle, diagonal, and regular-area formulas from triangulation, turning, and center decompositions.
assessmentType: conceptLesson
categoryId: art-of-problem-solving
topicId: aops-polygons
modeDefault: learn
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags: [art-of-problem-solving, aops-polygons, geometry, regular-polygons, polygon-angles]
skills:
- Distinguish simple, convex, concave, equilateral, equiangular, and regular polygons
- Derive and apply interior- and exterior-angle relationships
- Count diagonals without double counting
- Derive regular-polygon area from apothem and perimeter
- Use regular-hexagon symmetry and reject unsupported regularity assumptions
lesson:
  introduction: |
    Polygon formulas are compressed geometric arguments. Triangulation explains interior-angle sums, a complete walk explains exterior turns, endpoint counting explains the diagonal formula, and center triangles explain regular-polygon area. Reconstructing those arguments makes it easier to select the right relationship and harder to confuse a general polygon with a regular one.
  sections:
  - id: aops-polygons-motivation
    title: What counts as a polygon
    required: true
    content: |
      A polygon is a simple closed chain of straight segments. “Simple” means nonadjacent sides do not cross. An $n$-gon has $n$ sides, $n$ vertices, and $n$ interior angles. A convex polygon contains every segment joining two of its points; equivalently, all interior angles are less than $180^\circ$. A concave polygon has at least one reflex interior angle. Convexity matters because every diagonal from a chosen vertex stays inside, allowing a clean triangulation. Equal side lengths make a polygon equilateral, equal angle measures make it equiangular, and regular means both.
    media:
    - type: image
      src: /assessments/aops/aops-polygons-triangulation.svg
      alt: Convex heptagon ABCDEFG with all usable diagonals from A drawn inside the polygon.
      caption: Convexity keeps the fan of diagonals inside the boundary.
    check:
      id: aops-polygons-motivation-check
      type: multipleChoice
      prompt: Which condition is included in the definition of a regular polygon?
      choices:
      - {id: a, text: All sides are congruent only.}
      - {id: b, text: All angles are congruent only.}
      - {id: c, text: All sides and all angles are congruent.}
      - {id: d, text: All diagonals are congruent.}
      answer: {choiceId: c}
      explanation: Regular means both equilateral and equiangular; neither condition alone is enough in general.
  - id: aops-polygons-definitions
    title: Triangulation and the interior-angle sum
    required: true
    content: |
      From one vertex of a convex $n$-gon, draw diagonals to every nonadjacent vertex. The fan contains $n-2$ nonoverlapping triangles. Their angles partition the original polygon's interior angles, so the total is $(n-2)180^\circ$. This is a total, not the measure of each angle. Only when the polygon is equiangular—especially regular—may it be divided by $n$ to obtain one interior angle. A heptagon, for example, has five triangles and total $900^\circ$; a regular heptagon has each angle $900^\circ/7$.
    media:
    - type: image
      src: /assessments/aops/aops-polygons-triangulation.svg
      alt: A convex seven-sided polygon partitioned from one vertex into five triangles labeled 1 through 5.
      caption: The number of triangles is two less than the number of vertices.
    check:
      id: aops-polygons-definitions-check
      type: multipleChoice
      prompt: What is the interior-angle sum of a convex 11-gon?
      choices:
      - {id: a, text: '$1260^\circ$'}
      - {id: b, text: '$1440^\circ$'}
      - {id: c, text: '$1620^\circ$'}
      - {id: d, text: '$1980^\circ$'}
      answer: {choiceId: c}
      explanation: An 11-gon triangulates into $11-2=9$ triangles, so the sum is $9(180)=1620$ degrees.
  - id: aops-polygons-recognition
    title: Exterior angles are a turning invariant
    required: true
    content: |
      Walk once around a convex polygon without reversing direction. At each vertex, turn through the exterior angle between the extension of one side and the next side. When the walk returns to its original direction, the signed turns total one full revolution, $360^\circ$, regardless of the number or shape of the sides. Each interior angle and its adjacent exterior turn form a linear pair. In a regular $n$-gon every turn is therefore $360^\circ/n$, while every interior angle is $180^\circ-360^\circ/n$.
    media:
    - type: image
      src: /assessments/aops/aops-polygons-exterior-turns.svg
      alt: Regular pentagon traversed with five equal exterior turns of 72 degrees.
      caption: Equal turns are a consequence of regularity; the total 360 degrees holds for every convex polygon.
    check:
      id: aops-polygons-recognition-check
      type: multipleChoice
      prompt: A regular polygon has exterior angle $24^\circ$. How many sides does it have?
      choices:
      - {id: a, text: '$12$'}
      - {id: b, text: '$15$'}
      - {id: c, text: '$18$'}
      - {id: d, text: '$24$'}
      answer: {choiceId: b}
      explanation: Equal exterior turns total 360 degrees, so $n=360/24=15$.
  - id: aops-polygons-method
    title: Regular-polygon angles and inverse problems
    required: true
    content: |
      In a regular polygon, the central angle between radii to consecutive vertices equals the exterior angle, $360^\circ/n$. This links boundary turning to center geometry. When an angle is given and $n$ is unknown, solve with the exterior angle whenever possible: if the interior angle is $I$, then $E=180^\circ-I$ and $n=360^\circ/E$. The result must be an integer at least 3. For example, $I=165^\circ$ gives $E=15^\circ$ and $n=24$. If the quotient is not an integer, no regular polygon has exactly that angle.
    media:
    - type: image
      src: /assessments/aops/aops-polygons-exterior-turns.svg
      alt: Regular pentagon whose equal exterior turns illustrate 360 degrees divided by the side count.
      caption: Subtract an interior angle from 180 degrees before using the full-turn quotient.
    check:
      id: aops-polygons-method-check
      type: multipleChoice
      prompt: Can a regular polygon have each interior angle equal to $154^\circ$?
      choices:
      - {id: a, text: 'Yes, it has 12 sides.'}
      - {id: b, text: 'Yes, it has 13 sides.'}
      - {id: c, text: 'No, because $360/(180-154)$ is not an integer.'}
      - {id: d, text: 'No, because every regular-polygon angle is acute.'}
      answer: {choiceId: c}
      explanation: The exterior angle would be 26 degrees, but $360/26=180/13$ is not an integer side count.
  - id: aops-polygons-mini-example
    title: Count diagonals by endpoint incidences
    required: true
    content: |
      From any vertex of an $n$-gon, a diagonal may connect to every vertex except the starting vertex and its two neighbors, giving $n-3$ choices. Across all $n$ vertices this counts $n(n-3)$ endpoint incidences. Every diagonal has two endpoints and has therefore been counted twice, so the number of distinct diagonals is $n(n-3)/2$. Do not confuse this with the $n-3$ diagonals drawn from one fixed vertex or the $n-2$ triangles in a fan.
    media:
    - type: image
      src: /assessments/aops/aops-polygons-diagonal-count.svg
      alt: Regular pentagon with all five diagonals drawn as a star and a note dividing ten endpoint incidences by two.
      caption: Each red segment appears once at each of its two endpoints.
    check:
      id: aops-polygons-mini-example-check
      type: multipleChoice
      prompt: How many diagonals does a decagon have?
      choices:
      - {id: a, text: '$27$'}
      - {id: b, text: '$35$'}
      - {id: c, text: '$40$'}
      - {id: d, text: '$70$'}
      answer: {choiceId: b}
      explanation: $10(10-3)/2=35$ distinct diagonals.
  - id: aops-polygons-trap
    title: Apothem, perimeter, and regular-polygon area
    required: true
    content: |
      The apothem of a regular polygon is the perpendicular distance from its center to a side. Radii to all vertices divide the polygon into $n$ congruent isosceles triangles. If each side has length $s$ and the apothem is $a$, each triangle has area $\tfrac12sa$. Summing gives $K=n(\tfrac12sa)=\tfrac12a(ns)=\tfrac12aP$. This formula requires a regular polygon with its center equally placed relative to all sides; it is not a general formula for an arbitrary equilateral polygon.
    media:
    - type: image
      src: /assessments/aops/aops-polygons-apothem-area.svg
      alt: Regular hexagon divided into six center triangles with a perpendicular apothem a to a side s.
      caption: Adding the triangle bases produces the perimeter while every triangle shares height a.
    check:
      id: aops-polygons-trap-check
      type: multipleChoice
      prompt: A regular polygon has perimeter 54 and apothem 8. What is its area?
      choices:
      - {id: a, text: '$216$'}
      - {id: b, text: '$324$'}
      - {id: c, text: '$432$'}
      - {id: d, text: '$864$'}
      answer: {choiceId: a}
      explanation: $K=\tfrac12aP=\tfrac12(8)(54)=216$ square units.
  - id: aops-polygons-synthesis
    title: Symmetry, regular hexagons, and safeguards
    required: true
    content: |
      Regularity permits rotations and reflections that create congruent triangles and equal chords. A regular hexagon is especially efficient: its central angles are $60^\circ$, so each center triangle has two radii with included angle 60 degrees and is equilateral. Thus circumradius equals side length $s$, a diameter diagonal has length $2s$, a diagonal spanning two sides has length $\sqrt3s$, and the apothem is $\sqrt3s/2$. These facts fail for an arbitrary equilateral or equiangular hexagon. Before using symmetry, explicitly identify the regularity or congruence that creates it.
    media:
    - type: image
      src: /assessments/aops/aops-polygons-regular-hexagon.svg
      alt: Regular hexagon with equilateral center triangles, a diameter diagonal 2s, and a two-side diagonal square root of 3 times s.
      caption: The 60-degree center decomposition explains every highlighted length.
    check:
      id: aops-polygons-synthesis-check
      type: multipleChoice
      prompt: A regular hexagon has side length 9. What is the length of a diagonal joining opposite vertices?
      choices:
      - {id: a, text: '$9$'}
      - {id: b, text: '$9\sqrt3$'}
      - {id: c, text: '$18$'}
      - {id: d, text: '$27$'}
      answer: {choiceId: c}
      explanation: The circumradius equals the side length, and an opposite-vertex diagonal is a diameter of length $2s=18$.
