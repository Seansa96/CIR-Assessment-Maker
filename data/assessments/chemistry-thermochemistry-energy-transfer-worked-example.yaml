workedExamples:
  - id: specific-heat
    title: Specific Heat and the Sign of Heat
    problem: |
      A 125.0 g sample of water warms from $18.5^\circ\text{C}$ to $31.0^\circ\text{C}$. Use
      $c_{\text{water}}=4.184\ \text{J/(g}\cdot{}^\circ\text{C)}$ to find the heat absorbed by the water.
    steps:
      - id: identify-change
        title: Identify the temperature change
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Calculate $\Delta T$ before viewing the setup.
        instruction: |
          $$\Delta T=T_f-T_i=31.0-18.5=12.5^\circ\text{C}$$
          The sample warms, so its heat $q$ must be positive.
      - id: calculate-heat
        title: Apply the specific-heat equation
        type: numericResponse
        answer:
          value: 6538
          tolerance: 5
        prompt: What heat, in J, does the water absorb?
        instruction: |
          $$q=mc\Delta T=(125.0)(4.184)(12.5)=6537.5\ \text{J}$$
          Rounded appropriately, $q=+6.54\times10^3\ \text{J}$.
  - id: heat-capacity
    title: Heat Capacity of an Object
    problem: |
      A metal block absorbs 2.50 kJ of heat and its temperature rises by $20.0^\circ\text{C}$.
      Find the heat capacity $C$ of the entire block.
    steps:
      - id: convert-units
        title: Put heat in joules
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Convert 2.50 kJ to J.
        instruction: |
          $$2.50\ \text{kJ}\left(\frac{1000\ \text{J}}{1\ \text{kJ}}\right)=2500\ \text{J}$$
      - id: calculate-capacity
        title: Solve for heat capacity
        type: numericResponse
        answer:
          value: 125
          tolerance: 0.5
        prompt: What is $C$ in J/$^\circ$C?
        instruction: |
          For a whole object, use $q=C\Delta T$.
          $$C=\frac{q}{\Delta T}=\frac{2500\ \text{J}}{20.0^\circ\text{C}}=125\ \text{J}/^\circ\text{C}$$
  - id: reaction-enthalpy
    title: Scale a Reaction Enthalpy
    problem: |
      For the reaction below, $\Delta H=-572\ \text{kJ}$ as written.

      $$2\text{H}_2(g)+\text{O}_2(g)\rightarrow2\text{H}_2\text{O}(l)$$

      How much heat is released when 3.00 mol of liquid water forms?
    steps:
      - id: use-coefficients
        title: Relate the enthalpy to the balanced equation
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: State the enthalpy ratio needed for this calculation.
        instruction: |
          The listed $\Delta H$ corresponds to formation of $2$ mol of $\text{H}_2\text{O}$.
          $$3.00\ \text{mol H}_2\text{O}\left(\frac{-572\ \text{kJ}}{2\ \text{mol H}_2\text{O}}\right)$$
      - id: calculate-reaction-heat
        title: Calculate and interpret the heat
        type: numericResponse
        answer:
          value: -858
          tolerance: 1
        prompt: What is $q_{\text{rxn}}$ in kJ?
        instruction: |
          $$q_{\text{rxn}}=-858\ \text{kJ}$$
          The negative sign means the reaction system releases 858 kJ to its surroundings.
