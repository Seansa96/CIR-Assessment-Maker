questions:
  - id: eq-d-matrix-power
    type: multipleChoice
    prompt: |
      Let $D = \begin{bmatrix}2 & 0 \\ 0 & 3\end{bmatrix}$. What is $D^3$?
    choices:
      - id: c1
        text: '$\begin{bmatrix}8 & 0 \\ 0 & 27\end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix}6 & 0 \\ 0 & 9\end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix}2^3 & 0^3 \\ 0^3 & 3^3\end{bmatrix}$'
      - id: c4
        text: 'Both A and C are correct.'
    answer:
      choiceId: c4
    explanation: |
      To compute the power of a diagonal matrix, you simply raise each main diagonal entry to that power. So $D^3 = \begin{bmatrix}2^3 & 0 \\ 0 & 3^3\end{bmatrix} = \begin{bmatrix}8 & 0 \\ 0 & 27\end{bmatrix}$.

  - id: eq-matrix-power-formula
    type: multipleChoice
    prompt: |
      If $A = PDP^{-1}$, which of the following is the correct formula for computing $A^5$?
    choices:
      - id: c1
        text: '$A^5 = P^5 D^5 P^{-5}$'
      - id: c2
        text: '$A^5 = P D^5 P^{-1}$'
      - id: c3
        text: '$A^5 = P^5 D P^{-1}$'
      - id: c4
        text: '$A^5 = (PDP^{-1})^5$'
    answer:
      choiceId: c2
    explanation: |
      When multiplying $PDP^{-1}$ by itself multiple times, the adjacent $P^{-1}P$ pairs cancel out to the identity matrix. This leaves the outer $P$ and $P^{-1}$ intact, while the $D$ matrices multiply together in the middle. So $A^5 = P D^5 P^{-1}$. (Option D is technically true but doesn't show the simplified formula).

  - id: eq-distinct-eigenvalues
    type: multipleChoice
    prompt: |
      Suppose a $4 \times 4$ matrix $A$ has 4 distinct (different) eigenvalues. What can you conclude?
    choices:
      - id: c1
        text: 'The matrix $A$ is definitely diagonalizable.'
      - id: c2
        text: 'The matrix $A$ is definitely NOT diagonalizable.'
      - id: c3
        text: 'The matrix $A$ is invertible.'
      - id: c4
        text: 'We need to check the eigenvectors to see if it is diagonalizable.'
    answer:
      choiceId: c1
    explanation: |
      A square matrix with distinct eigenvalues is guaranteed to have linearly independent eigenvectors. For a $4 \times 4$ matrix, 4 linearly independent eigenvectors mean the matrix $P$ will be invertible, so $A$ is definitely diagonalizable. (We don't know if it's invertible because one of the distinct eigenvalues could be 0).
