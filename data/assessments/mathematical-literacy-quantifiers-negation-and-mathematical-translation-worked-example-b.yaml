workedExamples:
- id: mathematical-literacy-quantifiers-negation-and-mathematical-translation-worked-example-b-example
  title: Negate a universal claim
  problem: Negate the claim “Every integer is even” without changing its domain.
  steps:
  - id: step-1
    title: Name the outer quantifier
    type: freeResponse
    prompt: What quantifier begins the original claim?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The original claim begins with “for every.”
    explanation: |-
      Solution: The original claim begins with “for every.”
      Why it works: “Every integer” is a universal quantifier over the integers.
  - id: step-2
    title: Switch the quantifier
    type: freeResponse
    prompt: What quantifier begins its negation?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The negation begins with “there exists.”
    explanation: |-
      Solution: The negation begins with “there exists.”
      Why it works: Negating a universal claim produces an existential counterexample claim.
  - id: step-3
    title: Negate the property
    type: freeResponse
    prompt: State the complete negation.
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - There exists an integer that is not even.
    explanation: |-
      Solution: There exists an integer that is not even.
      Why it works: The domain remains integers while the property is negated.
