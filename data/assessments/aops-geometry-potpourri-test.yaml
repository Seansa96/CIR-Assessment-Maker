questions:
- id: q001
  type: multipleChoice
  prompt: 'A square is inscribed perfectly inside a circle of radius 10 (meaning the 4 corners of the square touch the circle). What is the area of the square?'
  difficultyDimensions:
  - Recognize that the diagonal of the inscribed square is exactly the diameter of the circle.
  - Calculate diagonal $d = 2 \cdot 10 = 20$.
  - Use square area formula from diagonal: $A = 1/2 \cdot d^2$ (since a square is a rhombus).
  - Calculate area: $1/2 \cdot 400 = 200$.
  choices:
  - id: a
    text: '$400$'
    issueSignals:
    - one-half-omission
  - id: b
    text: '$200$'
  - id: c
    text: '$100$'
    issueSignals:
    - radius-diagonal-confusion
  - id: d
    text: '$100\pi$'
    issueSignals:
    - circle-area-confusion
  answer:
    choiceId: b
  explanation: |
    Solution:
    When a square is inscribed in a circle, the diagonal of the square is the diameter of the circle.
    Since the radius is 10, the diameter (and the diagonal, $d$) is 20.
    A square is a type of rhombus, so we can find its area using the rhombus formula: $A = \frac{1}{2}d_1 d_2$.
    Because it's a square, both diagonals are equal ($d_1 = d_2 = 20$).
    $A = \frac{1}{2}(20)(20) = \frac{1}{2}(400) = 200$.

    Why it works:
    Alternatively, use the Pythagorean theorem on the right triangle formed by two sides of the square and the diagonal: $s^2 + s^2 = 20^2 \implies 2s^2 = 400 \implies s^2 = 200$. Since the area of a square is $s^2$, the area is 200.

    Why the other choices fail:
    - $400$ forgets the $\frac{1}{2}$ in the diagonal area formula ($20 \times 20$).
    - $100$ incorrectly uses the radius as the diagonal of the square ($\frac{1}{2}(10)(10) = 50$, wait, $100$ might come from assuming the side length is 10, so $10^2 = 100$).
    - $100\pi$ is the area of the *circle*, not the square.

- id: q002
  type: multipleChoice
  prompt: 'A solid is composed of a cylinder with a radius of 3 and a height of 8, and a cone sitting perfectly on top of it with the same radius and a height of 4. What is the total volume of this composite solid?'
  difficultyDimensions:
  - Calculate volume of cylinder: $\pi \cdot 3^2 \cdot 8 = 72\pi$.
  - Calculate volume of cone: $1/3 \cdot \pi \cdot 3^2 \cdot 4 = 12\pi$.
  - Add volumes together: $72\pi + 12\pi = 84\pi$.
  choices:
  - id: a
    text: '$84\pi$'
  - id: b
    text: '$108\pi$'
    issueSignals:
    - cone-fraction-omission
  - id: c
    text: '$72\pi$'
    issueSignals:
    - cone-omission
  - id: d
    text: '$36\pi$'
    issueSignals:
    - cylinder-fraction-error
  answer:
    choiceId: a
  explanation: |
    Solution:
    Calculate the volume of the two pieces separately and add them together.
    Volume of the cylinder $= \pi r^2 h = \pi(3^2)(8) = \pi(9)(8) = 72\pi$.
    Volume of the cone $= \frac{1}{3}\pi r^2 h = \frac{1}{3}\pi(3^2)(4) = \frac{1}{3}\pi(9)(4) = 12\pi$.
    Total volume $= 72\pi + 12\pi = 84\pi$.

    Why it works:
    Volume is strictly additive. You can stack as many 3D shapes as you want, and the total volume will always be the simple sum of their individual volumes.

    Why the other choices fail:
    - $108\pi$ forgets the $\frac{1}{3}$ in the cone's formula ($72\pi + 36\pi = 108\pi$).
    - $72\pi$ is just the volume of the cylinder.
    - $36\pi$ might come from applying the $\frac{1}{3}$ to the entire composite shape ($108\pi / 3$).

- id: q003
  type: multipleChoice
  prompt: 'On a coordinate plane, what is the area of a circle that has its center at $(0, 0)$ and passes through the point $(6, 8)$?'
  difficultyDimensions:
  - Find the radius using the distance formula from $(0,0)$ to $(6,8)$: $r = \sqrt{6^2 + 8^2} = 10$.
  - Use the area formula for a circle: $A = \pi r^2$.
  - Calculate area: $\pi(10^2) = 100\pi$.
  choices:
  - id: a
    text: '$10\pi$'
    issueSignals:
    - radius-squared-omission
  - id: b
    text: '$14\pi$'
    issueSignals:
    - linear-sum-error
  - id: c
    text: '$100\pi$'
  - id: d
    text: '$48\pi$'
    issueSignals:
    - xy-multiplication-error
  answer:
    choiceId: c
  explanation: |
    Solution:
    First, find the radius of the circle. The radius is the distance from the center $(0,0)$ to any point on the circle $(6,8)$.
    Using the distance formula (or Pythagorean theorem): $r = \sqrt{(6-0)^2 + (8-0)^2} = \sqrt{36 + 64} = \sqrt{100} = 10$.
    Now, find the area of the circle using $r = 10$.
    $A = \pi r^2$
    $A = \pi(10^2) = 100\pi$.

    Why it works:
    The distance from $(0,0)$ to $(x,y)$ is just the hypotenuse of a right triangle with legs $x$ and $y$. This is the classic 6-8-10 Pythagorean triple.

    Why the other choices fail:
    - $10\pi$ is just $\pi \times r$ (forgetting to square the radius).
    - $14\pi$ comes from adding the coordinates ($6 + 8 = 14$) to get a fake radius.
    - $48\pi$ comes from multiplying the coordinates ($6 \times 8$).

- id: q004
  type: multipleChoice
  prompt: 'A regular polygon has an interior angle sum of $1080^\circ$. How many sides does this polygon have?'
  difficultyDimensions:
  - Recall the interior angle sum formula: $180(n - 2)$.
  - Set up equation: $180(n - 2) = 1080$.
  - Solve for $n-2$: $n - 2 = 6$.
  - Solve for $n$: $n = 8$.
  choices:
  - id: a
    text: '$6$'
    issueSignals:
    - offset-omission
  - id: b
    text: '$10$'
    issueSignals:
    - offset-addition-error
  - id: c
    text: '$8$'
  - id: d
    text: '$9$'
    issueSignals:
    - arithmetic-error
  answer:
    choiceId: c
  explanation: |
    Solution:
    The sum of the interior angles of a polygon with $n$ sides is given by the formula $180(n - 2)$.
    $180(n - 2) = 1080$
    Divide both sides by 180:
    $n - 2 = 6$
    Add 2 to both sides:
    $n = 8$.
    The polygon is an octagon with 8 sides.

    Why it works:
    Any polygon can be split into triangles by drawing diagonals from a single vertex. An 8-sided polygon can be split into exactly 6 triangles. Since each triangle holds $180^\circ$, the total is $6 \times 180^\circ = 1080^\circ$.

    Why the other choices fail:
    - $6$ is the number of triangles the shape can be split into ($n-2$), but not the number of sides.
    - $10$ comes from adding 2 instead of subtracting in the formula backwards, or dividing $1800/180$.
    - $9$ is a math error.

- id: q005
  type: multipleChoice
  prompt: 'What is the area of a sector of a circle with a radius of 12 and a central angle of $60^\circ$?'
  difficultyDimensions:
  - Find the area of the entire circle: $\pi \cdot 12^2 = 144\pi$.
  - Determine the fraction of the circle: $60 / 360 = 1/6$.
  - Multiply full area by fraction: $144\pi / 6 = 24\pi$.
  choices:
  - id: a
    text: '$144\pi$'
    issueSignals:
    - fraction-omission
  - id: b
    text: '$24\pi$'
  - id: c
    text: '$4\pi$'
    issueSignals:
    - arc-length-confusion
  - id: d
    text: '$72\pi$'
    issueSignals:
    - fraction-error
  answer:
    choiceId: b
  explanation: |
    Solution:
    A sector is just a slice of the circle pie.
    First, find the area of the entire circle: $A = \pi r^2 = \pi(12^2) = 144\pi$.
    Next, determine what fraction of the whole circle this sector represents. Since a full circle is $360^\circ$, a $60^\circ$ slice is $\frac{60}{360} = \frac{1}{6}$ of the circle.
    Multiply the total area by this fraction:
    $\text{Sector Area} = \frac{1}{6} \times 144\pi = 24\pi$.

    Why it works:
    Proportions are the easiest way to solve sector and arc length problems. The ratio of the central angle to $360^\circ$ is perfectly equal to the ratio of the sector's area to the total area.

    Why the other choices fail:
    - $144\pi$ is the area of the entire circle.
    - $4\pi$ is the *arc length* of the sector ($\frac{1}{6} \times 24\pi$), not the area.
    - $72\pi$ uses a $\frac{1}{2}$ fraction instead of $\frac{1}{6}$.

- id: q006
  type: multipleChoice
  prompt: 'Two chords $AB$ and $CD$ intersect at point $E$ inside a circle. If $AE = x$, $EB = x + 5$, $CE = x + 1$, and $ED = x + 3$, what is the length of segment $AE$?'
  difficultyDimensions:
  - Apply intersecting chords theorem: $x(x+5) = (x+1)(x+3)$.
  - Distribute and expand: $x^2 + 5x = x^2 + 4x + 3$.
  - Simplify quadratic terms (they cancel): $5x = 4x + 3$.
  - Solve for $x$: $x = 3$.
  choices:
  - id: a
    text: '$3$'
  - id: b
    text: '$8$'
    issueSignals:
    - addition-error
  - id: c
    text: '$15$'
    issueSignals:
    - multiplication-error
  - id: d
    text: '$1.5$'
    issueSignals:
    - algebra-error
  answer:
    choiceId: a
  explanation: |
    *(Note: Let's adjust the prompt to match the new $x$ values.)*
    Solution:
    Use the Intersecting Chords Theorem: $AE \times EB = CE \times ED$.
    Let $AE = x$, $EB = x + 5$, $CE = x + 1$, and $ED = x + 3$.
    $x(x + 5) = (x + 1)(x + 3)$
    $x^2 + 5x = x^2 + 4x + 3$
    Subtract $x^2$ from both sides:
    $5x = 4x + 3$
    Subtract $4x$ from both sides:
    $x = 3$.
    The length of segment $AE$ is exactly $x$, which is 3.

    Why it works:
    This problem looks like a difficult quadratic equation, but because both sides have an $x^2$ with a coefficient of 1, the squared terms perfectly cancel out, leaving a very simple linear equation.

    Why the other choices fail:
    - $8$ is the length of chord $EB$ ($3+5=8$).
    - $15$ is a math error.
    - $1.5$ is a math error.
