randomizeQuestions: false
workedExamples:
  - id: we-atwood-symbolic
    title: Symbolic Atwood speed
    problem: 'Two masses $m_1$ and $m_2$, with $m_2>m_1$, are connected by an ideal string over an ideal pulley and released from rest. Derive their speed after moving distance $h$.'
    steps:
      - id: ats-1
        title: Change in potential energy
        instruction: 'Mass $m_2$ falls while $m_1$ rises by the same distance.'
        type: symbolicResponse
        prompt: 'Write $\Delta U$. '
        answer: { gradingMode: auto, expectedLatex: '(m_1-m_2)g h', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $\Delta U=(m_1-m_2)gh$.\n\nWhy it works: The lighter mass gains and the heavier mass loses gravitational potential energy.'
      - id: ats-2
        title: Change in kinetic energy
        instruction: 'Both masses share speed $v$.'
        type: symbolicResponse
        prompt: 'Write the final kinetic energy.'
        answer: { gradingMode: auto, expectedLatex: '(m_1+m_2)v^2/2', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $K_f=\tfrac12(m_1+m_2)v^2$.\n\nWhy it works: Each mass contributes $\tfrac12mv^2$ at the common speed.'
      - id: ats-3
        title: Solve by energy conservation
        instruction: 'Set $\Delta K+\Delta U=0$.'
        type: symbolicResponse
        prompt: 'Write $v$. '
        answer: { gradingMode: auto, expectedLatex: '\sqrt{2(m_2-m_1)g h/(m_1+m_2)}', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $v=\sqrt{2(m_2-m_1)gh/(m_1+m_2)}$.\n\nWhy it works: The decrease in gravitational potential energy becomes kinetic energy of both masses.'
  - id: we-atwood-numerical
    title: Numerical Atwood speed
    problem: 'For $m_1=3.0$ kg, $m_2=5.0$ kg, and $h=2.0$ m, find the speed using $g=9.8$ m/s$^2$.'
    steps:
      - id: atn-1
        title: Substitute values
        instruction: 'Use the symbolic Atwood result.'
        type: numericResponse
        prompt: 'What is $v^2$ in m$^2$/s$^2$?'
        answer: { value: 9.8, tolerance: 0.01 }
        explanation: 'Solution: $v^2=2(5.0-3.0)(9.8)(2.0)/(3.0+5.0)=9.8$.\n\nWhy it works: The mass difference supplies the energy while the total mass gains kinetic energy.'
      - id: atn-2
        title: Take square root
        instruction: 'Choose the positive speed magnitude.'
        type: numericResponse
        prompt: 'What is the speed in m/s?'
        answer: { value: 3.1305, tolerance: 0.001 }
        explanation: 'Solution: $v=\sqrt{9.8}=3.13$ m/s.\n\nWhy it works: Speed is the nonnegative magnitude of velocity.'
