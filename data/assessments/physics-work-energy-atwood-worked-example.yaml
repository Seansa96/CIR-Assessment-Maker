workedExamples:
  - id: we-atwood-energy
    title: Speed of an Atwood Machine
    problem: |-
      In an Atwood machine, two masses $m_1$ and $m_2$ ($m_2 > m_1$) are connected by a massless, unstretchable string that passes over a frictionless, massless pulley. The system is released from rest.

      Using **energy methods**, find the speed of the masses after they have moved a distance $h$. 

      Given: 
      $m_1 = 3.0 \text{ kg}$, $m_2 = 5.0 \text{ kg}$, $h = 2.0 \text{ m}$, and $g = 9.8 \text{ m/s}^2$.
    steps:
      - id: step-we-atwood-energy-1
        title: Conceptualize the System and Energy Changes
        type: freeResponse
        prompt: Did you understand this step?
        answer:
          gradingMode: selfCheck
        instruction: |-
          Before calculating anything, we must understand the physical principles at play. Since the pulley is massless and frictionless, and the string is ideal, there are no non-conservative forces doing work on the system as a whole. 

          Therefore, the total mechanical energy of the two-mass system is conserved:
          $$E_i = E_f$$
          $$K_i + U_i = K_f + U_f$$

          Because the system is released from rest, the initial kinetic energy $K_i$ is zero. Let's set our initial potential energy $U_i$ to zero for convenience.
          
          As the system moves, $m_2$ (the heavier mass) falls by a distance $h$, and $m_1$ (the lighter mass) rises by the same distance $h$. 
          
          This means:
          *   $m_2$ loses potential energy.
          *   $m_1$ gains potential energy.
          *   Both masses gain kinetic energy, moving at the same speed $v$.
      - id: step-we-atwood-energy-2
        title: Set up the Conservation of Energy Equation Symbolically
        type: freeResponse
        prompt: Did you understand this step?
        answer:
          gradingMode: selfCheck
        instruction: |-
          Let's formalize the energy changes.

          **Final Potential Energy ($U_f$):**
          The heavier mass $m_2$ drops by $h$, so its change is $-m_2 g h$. The lighter mass $m_1$ rises by $h$, so its change is $+m_1 g h$.
          $$U_f = m_1 g h - m_2 g h = (m_1 - m_2)g h$$

          **Final Kinetic Energy ($K_f$):**
          Both masses are moving with speed $v$.
          $$K_f = \frac{1}{2}m_1 v^2 + \frac{1}{2}m_2 v^2 = \frac{1}{2}(m_1 + m_2)v^2$$

          Equating the initial and final states:
          $$0 = K_f + U_f$$
          $$0 = \frac{1}{2}(m_1 + m_2)v^2 + (m_1 - m_2)g h$$
      - id: step-we-atwood-energy-3
        title: Solve for Velocity Symbolically
        type: freeResponse
        prompt: Did you understand this step?
        answer:
          gradingMode: selfCheck
        instruction: |-
          Now we solve for $v$. 

          First, move the potential energy term to the other side:
          $$\frac{1}{2}(m_1 + m_2)v^2 = (m_2 - m_1)g h$$

          Multiply by 2 and divide by the total mass $(m_1 + m_2)$:
          $$v^2 = \frac{2(m_2 - m_1)g h}{m_1 + m_2}$$

          Take the square root to find the final symbolic expression for speed:
          $$v = \sqrt{\frac{2(m_2 - m_1)g h}{m_1 + m_2}}$$

          This symbolic result is powerful because it shows that the speed is proportional to the difference in mass and inversely proportional to the total mass.
      - id: step-we-atwood-energy-4
        title: Substitute Numerical Values
        type: freeResponse
        prompt: Did you understand this step?
        answer:
          gradingMode: selfCheck
        instruction: |-
          Now that we have the physics completely modeled, we plug in our known values:
          $m_1 = 3.0 \text{ kg}$, $m_2 = 5.0 \text{ kg}$, $h = 2.0 \text{ m}$, $g = 9.8 \text{ m/s}^2$

          $$v = \sqrt{\frac{2(5.0 - 3.0)(9.8)(2.0)}{3.0 + 5.0}}$$
          $$v = \sqrt{\frac{2(2.0)(9.8)(2.0)}{8.0}}$$
          $$v = \sqrt{\frac{78.4}{8.0}}$$
          $$v = \sqrt{9.8} \approx 3.13 \text{ m/s}$$
          
          The masses will be moving at approximately $3.13 \text{ m/s}$ after traveling $2.0 \text{ m}$.
