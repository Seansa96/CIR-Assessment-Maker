- id: ex-mechanical-energy
  title: From Work to Conservation
  problem: |
    Let's derive the principle of conservation of mechanical energy ($\Delta(K+U) = W_{\text{nc}}$) starting from the work-energy theorem.
  steps:
  - id: step-1
    title: Step 1 — Split the Net Work
    instruction: |
      The work-energy theorem states $W_{\text{net}} = \Delta K$. We split the total net work into work done by conservative forces ($W_c$) and work done by nonconservative forces ($W_{\text{nc}}$).
    type: multipleChoice
    prompt: How does $W_c$ relate to potential energy $\Delta U$?
    choices:
    - id: a
      text: $W_c = \Delta U$
    - id: b
      text: $W_c = -\Delta U$
    - id: c
      text: $W_c = \Delta K + \Delta U$
    answer:
      choiceId: b
    explanation: |
      Solution: $W_c=-\Delta U$.

      Why it works: Potential energy is defined so conservative-force work is its negative change.
  - id: step-2
    title: Step 2 — Substitute and Rearrange
    instruction: |
      Substitute $W_{\text{net}} = W_c + W_{\text{nc}}$ and $W_c = -\Delta U$ into $W_{\text{net}} = \Delta K$.
      This gives $-\Delta U + W_{\text{nc}} = \Delta K$.
    type: symbolicResponse
    prompt: Rearrange this equation to solve for $W_{\text{nc}}$. (Write the expression using $\Delta K$ and $\Delta U$)
    answer:
      gradingMode: auto
      expectedLatex: \Delta K + \Delta U
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Solution: $W_{\text{nc}}=\Delta K+\Delta U=\Delta E_{mech}$.

      Why it works: Rearranging the work-energy theorem separates conservative and nonconservative work.
  - id: step-3
    title: Step 3 — The Special Case
    instruction: |
      If there are NO nonconservative forces doing work, then $W_{\text{nc}} = 0$, so $\Delta K + \Delta U = 0$.
      Expand the deltas: $(K_f - K_i) + (U_f - U_i) = 0$.
    type: symbolicResponse
    prompt: Rearrange this to have all the "initial" terms on one side and "final" terms on the other. What does $K_i + U_i$ equal?
    answer:
      gradingMode: auto
      expectedLatex: K_f + U_f
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Solution: $K_i+U_i=K_f+U_f$.

      Why it works: With $W_{\text{nc}}=0$, mechanical energy has no net change.

- id: ex-mechanical-energy-friction
  title: Account for Frictional Work
  problem: A 2.0 kg crate starts from rest 4.0 m above the floor and reaches the floor at 7.0 m/s. Find the work done by air resistance and friction together, using $g=9.8$ m/s$^2$.
  steps:
  - id: friction-step-1
    title: Calculate the mechanical-energy change
    instruction: Take the floor as $U_f=0$.
    type: numericResponse
    prompt: What is $\Delta K+\Delta U$ in J?
    choices: []
    answer: { value: -29.0, tolerance: 0.01 }
    explanation: |
      Solution: $\Delta K=\tfrac12(2.0)(7.0)^2=49.0$ J and $\Delta U=0-(2.0)(9.8)(4.0)=-78.4$ J, so the sum is $-29.4$ J.

      Why it works: The change in mechanical energy equals nonconservative work.
  - id: friction-step-2
    title: Interpret the sign
    instruction: Use $W_{nc}=\Delta K+\Delta U$.
    type: multipleChoice
    prompt: What does the negative nonconservative work mean?
    choices:
    - id: a
      text: Mechanical energy was dissipated to thermal energy or the surroundings.
      issueSignals: []
    - id: b
      text: Gravity did no work.
      issueSignals: [{ id: work-energy-theorem-error, domains: [physics-1] }]
    answer: { choiceId: a }
    explanation: |
      Solution: Choose a.

      Why it works: Negative $W_{nc}$ removes mechanical energy from the crate-Earth system model.

      Why the other choices fail: Gravity changes potential energy even though it is conservative.
