workedExamples:
- id: we001
  title: Pushing a Block with Friction
  problem: "A 10 kg block is initially at rest on a\rhorizontal floor. The coefficient\
    \ of static friction is $\\mu_s = 0.5$ and kinetic friction is $\\mu_k = 0.3$.\
    \ \n\nIf you push the block with a\rhorizontal force of $F = 40$ N, does it move?\
    \ What if you push it with $F = 60$ N? (Take $g = 9.8$ m/s²)\n"
  steps:
  - id: step-we001-1
    title: Calculate the maximum static friction force.
    instruction: 'First, find the normal force. Since there''s no vertical acceleration,
      $N = mg = 10 \times 9.8 = 98$ N.

      The maximum static friction is:

      $$ f_{s, \max} = \mu_s N = 0.5 \times 98 = 49 \text{ N} $$

      '
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: $N=mg=98$ N and $f_{s,max}=\mu_sN=0.5(98)=49$ N.\n\nWhy it works: Static friction can adjust only up to its coefficient-times-normal-force limit.'
  - id: step-we001-2
    title: Analyze the case where $F = 40$ N.
    instruction: "The applied force ($40$ N) is LESS than the maximum static friction\
      \ ($49$ N). \nTherefore, the block **does not move**. \nThe actual force of\
      \ static friction adjusts to exactly oppose the applied force: $f_s = 40$ N.\n"
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: $40$ N is below $49$ N, so static friction supplies $40$ N and the block remains at rest.\n\nWhy it works: Static friction matches the required value until its maximum.'
  - id: step-we001-3
    title: Analyze the case where $F = 60$ N.
    instruction: 'The applied force ($60$ N) is GREATER than the maximum static friction
      ($49$ N).

      Therefore, the block **will move**.

      Once it starts moving, kinetic friction takes over:

      $$ f_k = \mu_k N = 0.3 \times 98 = 29.4 \text{ N} $$

      We can now find the acceleration:

      $$ \sum F_x = F - f_k = 60 - 29.4 = 30.6 \text{ N} $$

      $$ a = \frac{\sum F_x}{m} = \frac{30.6}{10} = 3.06 \text{ m/s}^2 $$

      '
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: The block slides; $f_k=0.3(98)=29.4$ N and $a=(60-29.4)/10=3.06$ m/s$^2$.\n\nWhy it works: Sliding uses kinetic friction, then Newton''s second law gives acceleration.'

- id: friction-we002
  title: Crate Pulled on an Incline
  problem: 'A 5.0 kg crate slides down a $30^\circ$ incline with $\mu_k=0.20$. Find its acceleration along the incline.'
  steps:
  - id: frwe4
    title: Calculate net force
    instruction: Resolve gravity along the slope and subtract kinetic friction.
    prompt: 'What is the net force down the slope in newtons?'
    type: numericResponse
    answer: { value: 16.018, tolerance: 0.02 }
    explanation: 'Solution: $mg\sin30^\circ-\mu_kmg\cos30^\circ=24.5-0.20(42.44)=16.02$ N.\n\nWhy it works: Kinetic friction points up the slope and opposes sliding.'
  - id: frwe5
    title: Find acceleration
    instruction: Apply Newton''s second law along the incline.
    prompt: 'What is the acceleration in m/s$^2$?'
    type: numericResponse
    answer: { value: 3.2036, tolerance: 0.02 }
    explanation: 'Solution: $a=F_{net}/m=16.02/5.0=3.20$ m/s$^2$.\n\nWhy it works: Net force along the slope determines acceleration.'
