assessmentType: quiz
categoryId: calculus-2
topicId: geometric-telescoping-series
skills:
- Derive telescoping sums and products from exact identities
- Evaluate weighted and parameterized geometric series
- Track finite-sum boundaries and convergence conditions
navigation:
