  prompt: |
    Find
    $$\sum_{n=2}^{\infty}\frac1{n^2-1}.$$
  choices:
  - id: a
    text: $1/2$
  - id: b
    text: $2/3$
  - id: c
    text: $3/4$
  - id: d
    text: $1$
  answer:
    choiceId: c
  explanation: |-
    Solution: Write $1/(n^2-1)=\frac12[1/(n-1)-1/(n+1)]$; the finite sum leaves $\frac12(1+1/2)=3/4$. Therefore the answer is $3/4$.

    Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.

    Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.

    Why the other choices fail: $1/2$ conflicts with this criterion: Direct comparison uses nonnegative terms; $2/3$ conflicts with this criterion: Direct comparison uses nonnegative terms; $1$ conflicts with this criterion: Direct comparison uses nonnegative terms.
