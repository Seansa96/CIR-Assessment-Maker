  prompt: |
    Evaluate
    $$\sum_{n=1}^{\infty}\frac5{n(n+5)}.$$
  choices:
  - id: a
    text: $1$
  - id: b
    text: $H_5=137/60$
  - id: c
    text: $5H_5$
  - id: d
    text: |-
      $\pi^2/6$
  answer:
    choiceId: b
  explanation: |-
    Solution: Since $5/[n(n+5)]=1/n-1/(n+5)$, the finite sum leaves the first five reciprocal terms, whose sum is $H_5=137/60$. Therefore the answer is $H_5=137/60$.

    Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.

    Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.

    Why the other choices fail: $1$ conflicts with this criterion: Direct comparison uses nonnegative terms; $5H_5$ conflicts with this criterion: Direct comparison uses nonnegative terms; $\pi^2/6$ conflicts with this criterion: Direct comparison uses nonnegative terms.
