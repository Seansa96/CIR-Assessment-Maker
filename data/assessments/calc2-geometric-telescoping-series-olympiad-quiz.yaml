  prompt: |
    Evaluate
    $$\sum_{n=1}^{\infty}\frac{n(n+1)}{3^n}.$$
  choices:
  - id: a
    text: $3/2$
  - id: b
    text: $2$
  - id: c
    text: $9/4$
  - id: d
    text: $3$
  answer:
    choiceId: c
  explanation: |-
    Solution: From $\sum_{n\ge1}n(n+1)x^n=2x/(1-x)^3$, substitution $x=1/3$ gives $(2/3)/(2/3)^3=9/4$. Therefore the answer is $9/4$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $3/2$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $2$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $3$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
