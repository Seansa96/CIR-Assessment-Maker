- id: q_gt_0
  type: freeResponse
  prompt: "Evaluate $\\sum_{n=1}^\\infty \frac{1}{n(n+1)}$."
  answer:
    gradingMode: selfCheck
    checkModel: '1'
  explanation: "Use partial fractions: $\frac{1}{n} - \frac{1}{n+1}$. The series telescopes to $1 - 0 = 1$."
- id: q_gt_1
  type: freeResponse
  prompt: |-
    Find the sum of the geometric series $3 - 1 + 1/3 - 1/9 + \dots$
  answer:
    gradingMode: selfCheck
    checkModel: 9/4
  explanation: "Here $a=3$ and $r=-1/3$. Sum is $\frac{3}{1 - (-1/3)} = \frac{3}{4/3} = 9/4$."
- id: q_gt_2
  type: freeResponse
  prompt: "Evaluate $\\sum_{n=2}^\\infty \frac{1}{n^2 - 1}$."
  answer:
    gradingMode: selfCheck
    checkModel: 3/4
  explanation: "Partial fractions: $\frac{1}{2}(\frac{1}{n-1} - \frac{1}{n+1})$. Telescopes, leaving $\frac{1}{2}(1 + \frac{1}{2}) = 3/4$."
- id: q_gt_3
  type: freeResponse
  prompt: "Find the exact sum: $\\sum_{n=1}^\\infty \frac{2^n + 3^n}{5^n}$."
  answer:
    gradingMode: selfCheck
    checkModel: 13/6
  explanation: "Split into two geometric series: $\\sum (2/5)^n + \\sum (3/5)^n = \frac{2/5}{1-2/5} + \frac{3/5}{1-3/5} = 2/3 + 3/2 = 13/6$."
- id: q_gt_4
  type: freeResponse
  prompt: "Determine the sum $\\sum_{n=1}^\\infty \\ln\\left(\frac{n+1}{n}\right)$."
  answer:
    gradingMode: selfCheck
    checkModel: Diverges
  explanation: |-
    The partial sum $S_k = \ln(k+1) - \ln(1) = \ln(k+1)$, which goes to infinity.
- id: q_gt_5
  type: freeResponse
  prompt: "Evaluate $\\sum_{n=1}^\\infty \frac{1}{n(n+2)}$."
  answer:
    gradingMode: selfCheck
    checkModel: 3/4
  explanation: "Partial fractions: $\frac{1}{2}(\frac{1}{n} - \frac{1}{n+2})$. Telescoping leaves $\frac{1}{2}(1 + 1/2) = 3/4$."
- id: q_gt_6
  type: freeResponse
  prompt: |-
    Find the sum of $\sum_{n=0}^\infty e^{-2n}$.
  answer:
    gradingMode: selfCheck
    checkModel: |-
      $e^2 / (e^2 - 1)$
  explanation: "Geometric with $r = e^{-2}$. Sum is $\frac{1}{1 - e^{-2}} = \frac{e^2}{e^2 - 1}$."
- id: q_gt_7
  type: freeResponse
  prompt: "Calculate $\\sum_{n=1}^\\infty (\arctan(n+1) - \arctan(n))$."
  answer:
    gradingMode: selfCheck
    checkModel: |-
      $\pi/2 - \pi/4$
  explanation: "Telescoping series. The limit as $n \to \\infty$ of $\arctan(n)$ is $\\pi/2$. The first term is $\arctan(1) = \\pi/4$. Thus, $\\pi/2 - \\pi/4 = \\pi/4$."
- id: q_gt_8
  type: freeResponse
  prompt: "Find the exact value of $\\sum_{n=2}^\\infty \frac{2}{n^2-n}$."
  answer:
    gradingMode: selfCheck
    checkModel: '2'
  explanation: "Partial fractions: $2(\frac{1}{n-1} - \frac{1}{n})$. Telescoping leaves $2(1) = 2$."
- id: q_gt_9
  type: freeResponse
  prompt: "Evaluate $\\sum_{n=1}^\\infty \frac{\\sqrt{n+1} - \\sqrt{n}}{\\sqrt{n^2+n}}$."
  answer:
    gradingMode: selfCheck
    checkModel: '1'
  explanation: "Rewrite as $\frac{1}{\\sqrt{n}} - \frac{1}{\\sqrt{n+1}}$. Telescoping leaves $1/\\sqrt{1} = 1$."
- id: q_gt_10
  type: freeResponse
  prompt: |-
    For what values of $x$ does $\sum_{n=1}^\infty (3x-1)^n$ converge?
  answer:
    gradingMode: selfCheck
    checkModel: |-
      $0 < x < 2/3$
  explanation: |-
    Requires $|3x-1| < 1 \implies -1 < 3x-1 < 1 \implies 0 < 3x < 2 \implies 0 < x < 2/3$.
