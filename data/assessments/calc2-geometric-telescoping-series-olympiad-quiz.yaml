modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - derive-gap-telescoping-sums
  prompt: |
    Evaluate
    $$\sum_{n=1}^{\infty}\frac5{n(n+5)}.$$
  choices:
  - id: a
    text: $1$
  - id: b
    text: $H_5=137/60$
  - id: c
    text: $5H_5$
  - id: d
    text: |-
      $\pi^2/6$
  answer:
    choiceId: b
  explanation: Since $5/[n(n+5)]=1/n-1/(n+5)$, the finite sum leaves the first five reciprocal terms,
    whose sum is $H_5=137/60$.
- id: q002
  type: multipleChoice
  skills:
  - use-partial-fractions
  - track-starting-indices
  prompt: |
    Find
    $$\sum_{n=2}^{\infty}\frac1{n^2-1}.$$
  choices:
  - id: a
    text: $1/2$
  - id: b
    text: $2/3$
  - id: c
    text: $3/4$
  - id: d
    text: $1$
  answer:
    choiceId: c
  explanation: |-
    Write $1/(n^2-1)=\frac12[1/(n-1)-1/(n+1)]$; the finite sum leaves $\frac12(1+1/2)=3/4$.
- id: q003
  type: multipleChoice
  skills:
  - telescope-higher-order-rational-terms
  prompt: |
    Evaluate
    $$\sum_{n=1}^{\infty}\frac1{n(n+1)(n+2)}.$$
  choices:
  - id: a
    text: $1/6$
  - id: b
    text: $1/4$
  - id: c
    text: $1/2$
  - id: d
    text: $1$
  answer:
    choiceId: b
  explanation: |-
    The summand equals $\frac12[1/(n(n+1))-1/((n+1)(n+2))]$, so only half of the first $1/(1\cdot2)$ term remains.
- id: q004
  type: multipleChoice
  skills:
  - rationalize-radical-telescopes
  prompt: |
    Determine
    $$\sum_{n=1}^{\infty}
    \frac{\sqrt{n+1}-\sqrt n}{\sqrt{n(n+1)}}.$$
  choices:
  - id: a
    text: $1$
  - id: b
    text: $1/2$
  - id: c
    text: |-
      $\sqrt2-1$
  - id: d
    text: The series diverges.
  answer:
    choiceId: a
  explanation: |-
    Splitting the quotient gives $1/\sqrt n-1/\sqrt{n+1}$, whose $N$th partial sum is $1-1/\sqrt{N+1}$.
- id: q005
  type: multipleChoice
  skills:
  - analyze-logarithmic-telescopes
  prompt: |
    What is the behavior of
    $$\sum_{n=1}^{\infty}\ln\left(1+\frac1n\right)?$$
  choices:
  - id: a
    text: |-
      It converges to $\ln2$.
  - id: b
    text: It converges to $1$.
  - id: c
    text: |-
      It diverges to $+\infty$.
  - id: d
    text: It oscillates.
  answer:
    choiceId: c
  explanation: |-
    Each term is $\ln(n+1)-\ln n$, so $S_N=\ln(N+1)$, which grows without bound.
- id: q006
  type: multipleChoice
  skills:
  - evaluate-telescoping-products
  prompt: |
    Evaluate the infinite product
    $$\prod_{n=2}^{\infty}\left(1-\frac1{n^2}\right).$$
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1/2$
  - id: c
    text: $2/3$
  - id: d
    text: $1$
  answer:
    choiceId: b
  explanation: |-
    The finite product factors as $\prod(n-1)/n\cdot\prod(n+1)/n=(1/N)((N+1)/2)$, which tends to $1/2$.
- id: q007
  type: multipleChoice
  skills:
  - discover-product-telescopes
  prompt: |
    Find
    $$\prod_{n=1}^{\infty}\left(1+\frac1{n(n+2)}\right).$$
  choices:
  - id: a
    text: $1$
  - id: b
    text: $2$
  - id: c
    text: $e$
  - id: d
    text: |-
      The product diverges to $+\infty$.
  answer:
    choiceId: b
  explanation: |-
    Each factor is $(n+1)^2/[n(n+2)]$; the finite product becomes $(N+1)\cdot2/(N+2)$ and tends to $2$.
- id: q008
  type: multipleChoice
  skills:
  - differentiate-geometric-series
  prompt: |
    Evaluate
    $$\sum_{n=1}^{\infty}\frac{n(n+1)}{3^n}.$$
  choices:
  - id: a
    text: $3/2$
  - id: b
    text: $2$
  - id: c
    text: $9/4$
  - id: d
    text: $3$
  answer:
    choiceId: c
  explanation: |-
    From $\sum_{n\ge1}n(n+1)x^n=2x/(1-x)^3$, substitution $x=1/3$ gives $(2/3)/(2/3)^3=9/4$.
- id: q009
  type: multipleChoice
  skills:
  - telescope-inverse-trigonometric-differences
  prompt: |
    Evaluate
    $$\sum_{n=1}^{\infty}
    \arctan\left(\frac1{n^2+n+1}\right).$$
  choices:
  - id: a
    text: |-
      $\pi/6$
  - id: b
    text: |-
      $\pi/4$
  - id: c
    text: |-
      $\pi/2$
  - id: d
    text: The series diverges.
  answer:
    choiceId: b
  explanation: |-
    The tangent subtraction formula gives each term as $\arctan(n+1)-\arctan n$; the partial sums approach $\pi/2-\pi/4$.
- id: q010
  type: multipleChoice
  skills:
  - analyze-parameterized-geometric-series
  prompt: |
    For which $x$ does
    $$\sum_{n=1}^{\infty}(3x-1)^n$$
    converge, and what is its sum there?
  choices:
  - id: a
    text: $0<x<2/3$, with sum $(3x-1)/(2-3x)$
  - id: b
    text: |-
      $0\le x\le2/3$, with sum $1/(2-3x)$
  - id: c
    text: $x<2/3$, with sum $3x-1$
  - id: d
    text: All real $x$, with sum $1/(1-3x)$
  answer:
    choiceId: a
  explanation: The ratio condition $|3x-1|<1$ gives $0<x<2/3$, and a geometric series beginning at power
    one sums to $r/(1-r)$.
- id: q011
  type: multipleChoice
  skills:
  - convert-repeating-decimals-to-series
  prompt: |
    Express $0.\overline{123}$ as a reduced fraction.
  choices:
  - id: a
    text: $41/333$
  - id: b
    text: $123/1000$
  - id: c
    text: $123/9990$
  - id: d
    text: $1/123$
  answer:
    choiceId: a
  explanation: |-
    The blocks form $123/1000+123/1000^2+\cdots$, whose sum is $123/999=41/333$.
- id: q012
  type: multipleChoice
  skills:
  - telescope-residue-class-series
  prompt: |
    Evaluate
    $$\sum_{n=1}^{\infty}\left(\frac1{3n-2}-\frac1{3n+1}\right).$$
  choices:
  - id: a
    text: $1/3$
  - id: b
    text: $1/2$
  - id: c
    text: $1$
  - id: d
    text: The series diverges.
  answer:
    choiceId: c
  explanation: The negative denominator $3n+1$ equals the next positive denominator $3(n+1)-2$, so the
    finite sum is $1-1/(3N+1)$.
- id: q013
  type: multipleChoice
  skills:
  - telescope-fibonacci-identities
  prompt: |
    Let $F_1=F_2=1$ and $F_{n+2}=F_{n+1}+F_n$. Evaluate
    $$\sum_{n=1}^{\infty}\frac1{F_nF_{n+2}}.$$
  choices:
  - id: a
    text: $1$
  - id: b
    text: $2$
  - id: c
    text: |-
      $\sqrt5$
  - id: d
    text: The series diverges.
  answer:
    choiceId: a
  explanation: The recurrence shows $1/(F_nF_{n+2})=1/(F_nF_{n+1})-1/(F_{n+1}F_{n+2})$, leaving $1/(F_1F_2)=1$.
- id: q014
  type: multipleChoice
  skills:
  - distinguish-term-simplification-from-convergence
  prompt: |
    What is the behavior of
    $$\sum_{n=1}^{\infty}\frac1{\sqrt n+\sqrt{n+1}}?$$
  choices:
  - id: a
    text: It converges to $1$.
  - id: b
    text: |-
      It converges to $\sqrt2-1$.
  - id: c
    text: |-
      It diverges to $+\infty$.
  - id: d
    text: It oscillates.
  answer:
    choiceId: c
  explanation: |-
    Rationalization turns the summand into $\sqrt{n+1}-\sqrt n$, so $S_N=\sqrt{N+1}-1\to+\infty$.
- id: q015
  type: multipleChoice
  skills:
  - derive-tails-from-geometric-series
  prompt: |
    For $\sum_{n=0}^{\infty}(2/3)^n$, what is the least $N$ such that
    the tail after terms $n=0,\ldots,N$ is less than $1/100$?
  choices:
  - id: a
    text: $N=12$
  - id: b
    text: $N=13$
  - id: c
    text: $N=14$
  - id: d
    text: $N=15$
  answer:
    choiceId: c
  explanation: The exact tail is $3(2/3)^{N+1}$; it is above $0.01$ at $N=13$ and below $0.01$ at $N=14$.
