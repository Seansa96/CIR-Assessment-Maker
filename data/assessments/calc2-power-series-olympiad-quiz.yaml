schemaVersion: 1
id: calc2-power-series-olympiad-quiz
title: Power Series Olympiad Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: power-series
skills:
- Determine radii from complex singularities and sparse coefficients
- Derive combinatorial and recurrence generating functions
- Analyze generalized binomial, Hadamard-product, and ODE series
navigation:
  learningGoal: practice
  activityType: mixedPractice
  tags:
  - calculus-2
  - power-series
  - olympiad
  - analytic-generating-functions
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - find-radii-from-complex-singularities
  prompt: |
    What is the radius of the Maclaurin series of $1/(1+x+x^2)$?
  choices:
  - id: a
    text: $1$
  - id: b
    text: |-
      $\infty$
  - id: c
    text: $1/2$
  - id: d
    text: |-
      $\sqrt3$
  answer:
    choiceId: a
  explanation: |-
    The denominator roots are $e^{\pm2\pi i/3}$, both one unit from zero.
- id: q002
  type: multipleChoice
  skills:
  - find-shifted-taylor-radii
  prompt: |
    Find the radius of the Taylor series of $1/(1+x^2)$ centered at
    $x=2$.
  choices:
  - id: a
    text: |-
      $\sqrt5$
  - id: b
    text: $1$
  - id: c
    text: $2$
  - id: d
    text: $3$
  answer:
    choiceId: a
  explanation: |-
    The poles are at plus or minus i, each at distance $\sqrt{(2-0)^2+1^2}=\sqrt5$ from the center.
- id: q003
  type: multipleChoice
  skills:
  - derive-rational-function-coefficients
  prompt: |
    What is the coefficient of $x^n$ in $1/(1-x^2)$?
  choices:
  - id: a
    text: $1$ when n is even and $0$ when n is odd
  - id: b
    text: $1$ for every n
  - id: c
    text: $(-1)^n$
  - id: d
    text: $n+1$
  answer:
    choiceId: a
  explanation: |-
    The expansion is $\sum_{k=0}^{\infty}x^{2k}$ inside the unit disk.
- id: q004
  type: multipleChoice
  skills:
  - derive-fibonacci-generating-functions
  prompt: |
    For $F_0=0$, $F_1=1$, $F_{n+1}=F_n+F_{n-1}$, what is the generating
    function $\sum_{n=0}^{\infty}F_nx^n$?
  choices:
  - id: a
    text: $x/(1-x-x^2)$
  - id: b
    text: $1/(1-x)^2$
  - id: c
    text: $x/(1+x^2)$
  - id: d
    text: $1/(1-x-x^2)$
  answer:
    choiceId: a
  explanation: Multiplying the recurrence by powers of x and shifting indices gives $G-x=xG+x^2G$.
- id: q005
  type: multipleChoice
  skills:
  - identify-generating-function-radii
  prompt: |
    What is the radius of the Fibonacci generating function
    $x/(1-x-x^2)$?
  choices:
  - id: a
    text: |-
      $1/\varphi$
  - id: b
    text: |-
      $\varphi$
  - id: c
    text: $1$
  - id: d
    text: $1/2$
  answer:
    choiceId: a
  explanation: |-
    The closest denominator zero is $(\sqrt5-1)/2=1/\varphi$.
- id: q006
  type: multipleChoice
  skills:
  - use-catalan-generating-functions
  prompt: |
    The Catalan generating function is
    $C(x)=[1-\sqrt{1-4x}]/(2x)$. What is its radius?
  choices:
  - id: a
    text: $1/4$
  - id: b
    text: $4$
  - id: c
    text: $1/2$
  - id: d
    text: $1$
  answer:
    choiceId: a
  explanation: The nearest nonremovable singularity is the square-root branch point where $1-4x=0$.
- id: q007
  type: multipleChoice
  skills:
  - apply-generalized-binomial-series
  prompt: |
    What is the coefficient of $x^3$ in $(1+x)^{1/2}$?
  choices:
  - id: a
    text: $1/16$
  - id: b
    text: $-1/16$
  - id: c
    text: $1/8$
  - id: d
    text: $-1/8$
  answer:
    choiceId: a
  explanation: |-
    $\binom{1/2}{3}=(1/2)(-1/2)(-3/2)/6=1/16$.
- id: q008
  type: multipleChoice
  skills:
  - compose-entire-series
  prompt: |
    Which series represents $e^{x^2}$?
  choices:
  - id: a
    text: |-
      $\sum_{n=0}^{\infty}x^{2n}/n!$
  - id: b
    text: |-
      $\sum x^n/(2n)!$
  - id: c
    text: |-
      $\sum x^{2n}/(2n)!$
  - id: d
    text: |-
      $\sum x^{n+2}/n!$
  answer:
    choiceId: a
  explanation: Substitute x squared for the input in the exponential series.
- id: q009
  type: multipleChoice
  skills:
  - derive-ode-power-series-solutions
  prompt: |
    If $y=\sum c_nx^n$ solves $y''+y=0$, which recurrence holds?
  choices:
  - id: a
    text: $c_{n+2}=-c_n/[(n+2)(n+1)]$
  - id: b
    text: $c_{n+1}=-c_n$
  - id: c
    text: $c_{n+2}=c_n$
  - id: d
    text: $c_{n+2}=-(n+2)(n+1)c_n$
  answer:
    choiceId: a
  explanation: Matching x-to-the-n coefficients gives $(n+2)(n+1)c_{n+2}+c_n=0$.
- id: q010
  type: multipleChoice
  skills:
  - identify-ordinary-and-singular-points
  prompt: |
    For $x^2y''+xy'+y=0$, why is an ordinary power-series recurrence
    centered at zero potentially singular?
  choices:
  - id: a
    text: The coefficient of the highest derivative vanishes at zero.
  - id: b
    text: Power series cannot solve second-order equations.
  - id: c
    text: The coefficient y is nonzero.
  - id: d
    text: Zero is outside the real line.
  answer:
    choiceId: a
  explanation: Dividing into standard form introduces coefficients with poles at zero, marking a singular
    point.
- id: q011
  type: multipleChoice
  skills:
  - analyze-lacunary-series-radii
  prompt: |
    What is the radius of $\sum_{n=1}^{\infty}x^{n!}$?
  choices:
  - id: a
    text: $1$
  - id: b
    text: |-
      $\infty$
  - id: c
    text: $0$
  - id: d
    text: $e$
  answer:
    choiceId: a
  explanation: The series converges absolutely for $|x|<1$, while for $|x|>1$ its terms fail to approach
    zero; the sparse support does not change the boundary radius.
- id: q012
  type: multipleChoice
  skills:
  - distinguish-series-from-analytic-continuation
  prompt: |
    Although $1/(1-x)$ is defined at $x=2$, what happens to its Maclaurin
    series $\sum x^n$ there?
  choices:
  - id: a
    text: It diverges.
  - id: b
    text: It converges to $-1$.
  - id: c
    text: It converges conditionally.
  - id: d
    text: It terminates.
  answer:
    choiceId: a
  explanation: Analytic continuation of the rational function does not extend the convergence disk of
    this particular series.
- id: q013
  type: multipleChoice
  skills:
  - bound-radii-of-hadamard-products
  prompt: |
    Power series $\sum a_nx^n$ and $\sum b_nx^n$ have radii R and S.
    What radius is guaranteed for $\sum a_nb_nx^n$?
  choices:
  - id: a
    text: At least $RS$
  - id: b
    text: Exactly $R+S$
  - id: c
    text: |-
      At most $\min(R,S)$
  - id: d
    text: Always zero
  answer:
    choiceId: a
  explanation: The limsup nth-root growth of products is at most the product of the two limsups, giving
    reciprocal radius at most $1/(RS)$.
- id: q014
  type: multipleChoice
  skills:
  - derive-second-moment-generating-series
  prompt: |
    For $|x|<1$, what is $\sum_{n=1}^{\infty}n^2x^n$?
  choices:
  - id: a
    text: $x(1+x)/(1-x)^3$
  - id: b
    text: $x/(1-x)^2$
  - id: c
    text: $1/(1-x)^3$
  - id: d
    text: $x^2/(1-x)$
  answer:
    choiceId: a
  explanation: |-
    Apply x times the derivative operator to $\sum nx^n=x/(1-x)^2$.
- id: q015
  type: multipleChoice
  skills:
  - analyze-generalized-binomial-endpoints
  prompt: |
    The binomial series for $(1+x)^{1/2}$ has radius one. At $x=1$, how
    does its coefficient series behave?
  choices:
  - id: a
    text: It converges absolutely.
  - id: b
    text: It diverges by the term test.
  - id: c
    text: It converges conditionally.
  - id: d
    text: It is geometric.
  answer:
    choiceId: a
  explanation: The generalized binomial coefficients have magnitude of order $n^{-3/2}$, so their absolute
    sum converges.
attemptQuestionCount: 15
