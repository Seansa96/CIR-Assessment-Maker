schemaVersion: 1
id: python-function-definition-conceptual-quiz
title: Python Function Definition Conceptual Quiz
assessmentType: quiz
categoryId: python
subcategoryId: python-file-io
subcategoryIds:
  - python-functions
modeDefault: practice
randomizeQuestions: true
questionTimerSeconds:
assessmentTimerSeconds:
questions:
  - id: q001
    type: multipleChoice
    prompt: "What keyword begins a function definition in Python?"
    choices:
      - id: a
        text: "`def`"
      - id: b
        text: "`function`"
      - id: c
        text: "`define`"
      - id: d
        text: "`method`"
    answer:
      choiceId: a
    explanation: |
      Python uses the keyword `def` to begin a function definition.

      Related topic: Function declaration syntax in Python.

      Read further: Review the basic structure `def function_name(parameters):`.
  - id: q002
    type: multipleChoice
    prompt: "Which function header is syntactically valid Python?"
    choices:
      - id: a
        text: "`def add(a, b):`"
      - id: b
        text: "`function add(a, b):`"
      - id: c
        text: "`def add[a, b]`"
      - id: d
        text: "`add def(a, b):`"
    answer:
      choiceId: a
    explanation: |
      A valid Python function header uses `def`, the function name, parentheses around the parameter list, and a colon.

      Related topic: Function header structure.

      Read further: Study required punctuation in Python function definitions, especially parentheses and colons.
  - id: q003
    type: multipleChoice
    prompt: "In `def area(width, height):`, what are `width` and `height`?"
    choices:
      - id: a
        text: "Parameters"
      - id: b
        text: "Return values"
      - id: c
        text: "Function calls"
      - id: d
        text: "Modules"
    answer:
      choiceId: a
    explanation: |
      `width` and `height` are parameters: local names that receive values when the function is called.

      Related topic: Parameters in function definitions.

      Read further: Compare parameters in a function definition with arguments in a function call.
  - id: q004
    type: multipleChoice
    prompt: "What is an argument?"
    choices:
      - id: a
        text: "A value passed into a function when it is called."
      - id: b
        text: "The keyword that defines a function."
      - id: c
        text: "The indentation before a function body."
      - id: d
        text: "The name after `return`."
    answer:
      choiceId: a
    explanation: |
      An argument is the actual value supplied during a function call. For example, in `square(5)`, `5` is an argument.

      Related topic: Arguments in function calls.

      Read further: Practice identifying parameters versus arguments in small code examples.
  - id: q005
    type: multipleChoice
    prompt: "Why is indentation important after a Python function header?"
    choices:
      - id: a
        text: "It tells Python which statements belong to the function body."
      - id: b
        text: "It changes the function name."
      - id: c
        text: "It makes the function run faster."
      - id: d
        text: "It replaces the need for parentheses."
    answer:
      choiceId: a
    explanation: |
      Python uses indentation to group statements. The indented statements after a function header are the function body.

      Related topic: Python blocks and indentation.

      Read further: Review how indentation defines blocks for functions, loops, and conditionals.
  - id: q006
    type: multipleChoice
    prompt: "What does a `return` statement do in a function?"
    choices:
      - id: a
        text: "It sends a value back to the caller and exits the function."
      - id: b
        text: "It prints a value on the screen."
      - id: c
        text: "It creates a new parameter."
      - id: d
        text: "It starts a function definition."
    answer:
      choiceId: a
    explanation: |
      `return` exits the function and gives a value back to the code that called it.

      Related topic: Return statements and function output.

      Read further: Study how returned values can be assigned to variables or used inside expressions.
  - id: q007
    type: multipleChoice
    prompt: "What is the main difference between `return x` and `print(x)` inside a function?"
    choices:
      - id: a
        text: "`return x` gives `x` back to the caller; `print(x)` displays `x`."
      - id: b
        text: "`print(x)` gives `x` back to the caller; `return x` only displays it."
      - id: c
        text: "There is no difference."
      - id: d
        text: "`return x` can only be used outside functions."
    answer:
      choiceId: a
    explanation: |
      Returning and printing are different actions. A returned value can be reused by later code, while printed output is only displayed.

      Related topic: Return values versus side effects.

      Read further: Practice writing one function that returns a value and another that prints a value, then compare how they behave.
  - id: q008
    type: multipleChoice
    prompt: |
      Given:

      ```python
      def double(n):
          return n * 2
      ```

      What is `double(6)`?
    choices:
      - id: a
        text: "`12`"
      - id: b
        text: "`6`"
      - id: c
        text: "`n * 2`"
      - id: d
        text: "A syntax error"
    answer:
      choiceId: a
    explanation: |
      The argument `6` is assigned to parameter `n`, so the function returns `6 * 2`, which is `12`.

      Related topic: Function calls and parameter substitution.

      Read further: Trace simple function calls by replacing each parameter with the argument value.
  - id: q009
    type: multipleChoice
    prompt: "What happens when Python reaches a `return` statement?"
    choices:
      - id: a
        text: "The function immediately ends."
      - id: b
        text: "The function restarts from the top."
      - id: c
        text: "Only the current line is skipped."
      - id: d
        text: "Python asks for user input."
    answer:
      choiceId: a
    explanation: |
      A `return` statement exits the function immediately. Statements after that return do not run during that call.

      Related topic: Control flow inside functions.

      Read further: Review early returns and how they affect which statements execute.
  - id: q010
    type: multipleChoice
    prompt: "Which name is the function name in `def calculate_total(price, tax):`?"
    choices:
      - id: a
        text: "`calculate_total`"
      - id: b
        text: "`price`"
      - id: c
        text: "`tax`"
      - id: d
        text: "`def`"
    answer:
      choiceId: a
    explanation: |
      `calculate_total` is the function name. The names inside the parentheses are parameters.

      Related topic: Naming parts of a function definition.

      Read further: Practice labeling the keyword, function name, parameters, colon, body, and return statement.


