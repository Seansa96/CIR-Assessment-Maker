questions:
- id: q001
  type: multipleChoice
  prompt: 'In a driven oscillator, resonance occurs when the driving frequency is closest to:'
  choices: [{ id: a, text: the natural frequency }, { id: b, text: zero frequency }, { id: c, text: the mass in kg }]
  answer: { choiceId: a }
  explanation: |
    Solution: Resonance occurs near the natural frequency.

    Why it works: Energy transfer from the driver is most effective when the drive matches the system's preferred oscillation rate.

    Why the other choices fail: Zero frequency is not generally resonant, and mass is not a frequency.
  difficultyDimensions: [modelOrDerivation, representationTransfer]
- id: q002
  type: numericResponse
  prompt: A mass-spring oscillator has k=200 N/m and m=8.0 kg. Find its natural angular frequency in rad/s.
  answer: { value: 5, tolerance: 0.05 }
  explanation: |
    Solution: $omega0=sqrt(k/m)=sqrt(200/8.0)=5.0$ rad/s.

    Why it works: Stiffness supplies restoring force and mass supplies inertia.
  difficultyDimensions: [modelOrDerivation, simplification]
- id: q003
  type: multipleChoice
  prompt: Increasing damping in a driven oscillator generally has what effect on the resonance peak?
  choices: [{ id: a, text: it becomes lower and broader }, { id: b, text: it becomes infinitely high }, { id: c, text: damping has no effect }]
  answer: { choiceId: a }
  explanation: |
    Solution: The resonance peak becomes lower and broader.

    Why it works: Damping dissipates energy and reduces the sharpness of the frequency response.

    Why the other choices fail: Infinite response is prevented by damping, and damping directly changes the response curve.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
- id: q004
  type: numericResponse
  prompt: An oscillator has natural angular frequency 4.0 rad/s. What ordinary frequency in Hz corresponds to this value?
  answer: { value: 0.6366198, tolerance: 0.01 }
  explanation: |
    Solution: $f=omega/(2pi)=4.0/(2pi)=0.637$ Hz.

    Why it works: One full cycle contains $2pi$ radians of phase.
  difficultyDimensions: [representationTransfer, simplification]
- id: q005
  type: multipleChoice
  prompt: 'A child pumps a swing with small pushes timed to the swing''s motion. This illustrates:'
  choices: [{ id: a, text: driven resonance }, { id: b, text: static equilibrium }, { id: c, text: buoyancy }]
  answer: { choiceId: a }
  explanation: |
    Solution: It illustrates driven resonance.

    Why it works: Timed pushes add energy repeatedly near the swing's natural frequency.

    Why the other choices fail: The swing moves dynamically, and buoyancy is unrelated to the air-supported motion.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
- id: q006
  type: symbolicResponse
  prompt: Starting from omega0=sqrt(k/m), solve for spring constant k.
  answer: { expectedLatex: 'm*omega_0^2', equivalenceMode: expression, variables: [m, omega_0], tolerance: 0.000001 }
  explanation: |
    Solution: Squaring gives $omega0^2=k/m$, so $k=m omega0^2$.

    Why it works: Algebraic rearrangement isolates the stiffness that produces a chosen natural frequency.
  difficultyDimensions: [reverseReasoning, modelOrDerivation]

