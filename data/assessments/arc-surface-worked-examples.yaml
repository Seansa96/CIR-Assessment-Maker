workedExamples:
- id: we-arc-1
  title: Arc Length Example
  problem: Find the arc length of $y = \frac{2}{3}x^{3/2}$ from $x=0$ to $x=3$.
  steps:
  - id: step-1
    title: Find derivative
    instruction: Find $y'$.
    type: symbolicResponse
    prompt: Enter $y'$.
    answer:
      gradingMode: auto
      expected: x^{1/2}
  - id: step-2
    title: Integrate
    instruction: Evaluate $\int_0^3 \sqrt{1 + x} \, dx$.
    type: symbolicResponse
    prompt: Enter arc length.
    answer:
      gradingMode: auto
      expected: 14/3
