directedProject:
  summary: Locate word intervals and transform qualifying spans without disturbing layout.
  estimatedTimeMinutes: 45
  outcomes:
  - Implement the conditional-word-reversal family from a precise contract.
  - Explain the invariant and complexity of the implementation.
  - Adapt the base solution to changed requirements without breaking edge cases.
  environment:
    name: Local C++20 console project
    platform:
    - windows
    - linux
    - macos
    toolVersion: C++20
    requiredAccounts: []
    prerequisites:
    - Functions
    - loops
    - standard library containers
    installLinks: []
  resources: []
  phases:
  - id: phase-1-contract-and-approach
    title: Understand the contract and approach
    required: true
    goal: Translate the problem into an invariant before coding.
    steps:
    - id: step-1-problem-contract
      title: Read the canonical problem
      instruction: |
        Source family: `cpp-fsf-string-032`

        Implement `std::string reverse_words_at_least_three(std::string text)`.
        Input contains ASCII letters and spaces only. Reverse each maximal word
        whose length is at least three, in place; preserve every space. For
        `The quick brown fox jumps over the lazy dog`, return
        `ehT kciuq nworb xof spmuj revo eht yzal god`.
      expectedObservation: Requires locating word intervals, applying a length threshold, and preserving
        all spaces.
      checklist:
      - id: contract-input-output
        text: I can state the exact input, output, and edge-case policy.
      - id: contract-complexity
        text: I identified which operations determine the time and space cost.
      resources: []
    - id: step-2-approach
      title: Plan the implementation
      instruction: |
        Use this approach before opening the sample solution:

        1. Scan for the start and one-past-the-end position of each maximal word.
        2. Compute length from the half-open interval rather than copying the token.
        3. Reverse only qualifying intervals inside the original string.
        4. Advance past separators without rebuilding them so repeated spaces survive.

        Write a short trace for one nontrivial input.
      expectedObservation: Find each non-space interval, reverse it when its length meets the threshold,
        and leave separator positions untouched.
      checklist:
      - id: approach-invariant
        text: My trace preserves the stated invariant at every step.
      resources: []
  - id: phase-2-reference-and-build
    title: Study the example and build your version
    required: true
    goal: Connect the approach to complete, compilable C++.
    steps:
    - id: step-3-example-solution
      title: Trace the example solution
      instruction: |
        Each word is represented by a half-open interval `[start, end)`.
        Reversing inside the original string leaves delimiters exactly where they
        were, including repeated and trailing spaces.

        ```cpp
        #include <algorithm>
        #include <string>

        std::string reverse_words_at_least_three(std::string text) {
            for (std::size_t start = 0; start < text.size();) {
                if (text[start] == ' ') {
                    ++start;
                    continue;
                }
                std::size_t end = text.find(' ', start);
                if (end == std::string::npos) end = text.size();
                if (end - start >= 3) {
                    std::reverse(text.begin() + start, text.begin() + end);
                }
                start = end;
            }
            return text;
        }
        ```

        Trace this solution against every representative case before writing your own version. The sample is a reference, not starter code.
      expectedObservation: Find each non-space interval, reverse it when its length meets the threshold,
        and leave separator positions untouched.
      checklist:
      - id: solution-explained
        text: I can explain every branch, loop, and edge-case decision.
      - id: trap-avoided
        text: 'I can explain why this trap is wrong: Rebuilding with stream extraction, which collapses
          repeated spaces and loses the original layout.'
      resources: []
    - id: step-4-build
      title: Implement independently
      instruction: |
        Create `main.cpp` and implement the canonical contract without copying the reference. Add the representative cases from the bank plus at least three edge cases.
      files:
      - path: main.cpp
        purpose: Learner implementation and tests
        suggestedContent: |
          // Implement the required function here.
          // Keep main() small and use it only for your own test cases.

          int main() {
              return 0;
          }
        readOnly: false
      checklist:
      - id: build-compiles
        text: The program compiles with C++20 warnings enabled.
      - id: build-tests
        text: Representative and edge cases pass.
      troubleshooting:
      - problem: Output differs only at an edge case.
        suggestion: Rebuilding with stream extraction, which collapses repeated spaces and loses the original
          layout.
      resources: []
  - id: phase-3-variants
    title: Implement changed-condition variants
    required: true
    goal: Generalize the family instead of memorizing one solution.
    steps:
    - id: step-5-variants
      title: Complete the family variants
      instruction: |
        Extend the program with these variants:

        1. Make the minimum word length a validated function parameter.
        2. Add a mode that reverses odd-length words rather than using a threshold.
        3. Extend the word definition to ASCII-letter runs while preserving punctuation in place.

        Keep each behavior in a separately testable function.
      checklist:
      - id: variants-distinct
        text: Each variant changes behavior or constraints, not only sample data.
      - id: variants-regression
        text: The original canonical tests still pass.
      notesPrompt: Which part of the original invariant survived every variant, and which part had to
        change?
      resources: []
