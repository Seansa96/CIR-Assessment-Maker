questions:
- id: q001
  type: freeResponse
  skills:
  - average-value
  - olympiad-problem-solving
  prompt: Find the average value of $f(x)=x^2$ on $[0,1]$.
  answer:
    gradingMode: selfCheck
    expected: $\frac1{3}$.
    keyPoints:
    - 'Matches the reference result: $\frac1{3}$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: The average is $(1-0)^-1\int_0^1x^2dx=1/(2+1)$.
