schemaVersion: 1
id: calc2-area-between-curves-recall
title: Area Between Curves Recall
assessmentType: recallDrill
categoryId: calculus-2
subcategoryId: area-between-curves
subcategoryIds:
  - area-between-curves
modeDefault: practice
randomizeQuestions: true
items:
  - id: r001
    type: typed
    prompt: "When integrating with respect to x, the integrand for area is `top` minus what?"
    answer:
      expected: bottom
      aliases:
        - "bottom curve"
  - id: r002
    type: typed
    prompt: "When integrating with respect to y, the integrand for area is `right` minus what?"
    answer:
      expected: left
      aliases:
        - "left curve"
  - id: r003
    type: typed
    prompt: "To find the limits of integration, we set the two functions equal to each other and find their points of what?"
    answer:
      expected: intersection
      aliases:
        - intersect
  - id: r004
    type: flashcard
    prompt: "What must you do if the curves cross each other within the interval of integration?"
    answer:
      expected: "You must split the integral at the intersection point."
  - id: r005
    type: typed
    prompt: "If a curve is given as `x = y^2`, should you slice vertically (dx) or horizontally (dy)?"
    answer:
      expected: horizontally
      aliases:
        - dy
        - "horizontal"


