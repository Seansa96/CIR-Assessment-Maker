lesson:
  introduction: |-
    Integer problems often hide a small invariant inside a huge expression. Prime exponents control factors, a remainder controls a last digit, and place value controls a numeral in any base. The goal is not faster arithmetic; it is choosing the representation that preserves exactly the property being asked about.
  sections:
  - id: divisibility-primes-and-factorization
    title: Divisibility is an existence statement
    required: true
    content: |-
      For integers $d\ne0$ and $n$, the notation $d\mid n$ means that $n=dk$ for some integer $k$. The integer $k$ is a witness to divisibility. The direction matters: $3\mid15$, while $15\nmid3$.

      A prime is a positive integer with exactly two positive divisors, 1 and itself. The number 1 is neither prime nor composite. Every integer greater than 1 has a prime factorization unique up to factor order.

      Divisibility is stable under integer linear combinations. If $d\mid a$ and $d\mid b$, then $d\mid(ma+nb)$ for all integers $m,n$. This fact powers the Euclidean algorithm and many proofs.
    check:
      id: divisibility-primes-and-factorization-check
      type: multipleChoice
      prompt: 'Which statement correctly interprets $7\mid42$?'
      choices:
      - id: a
        text: There is an integer $k=6$ such that $42=7k$.
      - id: b
        text: There is an integer $k$ such that $7=42k$.
      - id: c
        text: Seven and 42 have no common factor.
      - id: d
        text: The remainder when 7 is divided by 42 is zero.
      answer:
        choiceId: a
      explanation: The divisor appears as a factor of the dividend.
  - id: prime-exponents-divisors-gcd-and-lcm
    title: Prime exponents organize factor information
    required: true
    content: |-
      If

      $$N=p_1^{e_1}\cdots p_r^{e_r},$$

      a positive divisor chooses an exponent from $0$ through $e_j$ for each prime. Therefore $N$ has $(e_1+1)\cdots(e_r+1)$ positive divisors.

      For gcd, take each shared prime to the smaller exponent. For lcm, take every prime that appears to the larger exponent. For positive $a,b$,

      $$\gcd(a,b)\operatorname{lcm}(a,b)=ab.$$

      Example: $72=2^3\cdot3^2$ and $120=2^3\cdot3\cdot5$, so the gcd is $2^3\cdot3=24$ and the lcm is $2^3\cdot3^2\cdot5=360$.
    check:
      id: prime-exponents-divisors-gcd-and-lcm-check
      type: multipleChoice
      prompt: 'How many positive divisors does $2^3\cdot3^2\cdot5$ have?'
      choices:
      - id: a
        text: '6'
      - id: b
        text: '12'
      - id: c
        text: '24'
      - id: d
        text: '30'
      answer:
        choiceId: c
      explanation: Choose exponents independently in $(3+1)(2+1)(1+1)=24$ ways.
  - id: euclidean-division-and-positional-bases
    title: Quotient and remainder also explain place value
    required: true
    content: |-
      For positive $m$, every integer $n$ can be written uniquely as

      $$n=qm+r,\qquad0\le r<m.$$

      The integer $r$ is the least nonnegative remainder. Repeated division by a base extracts a numeral's digits from right to left.

      In base $b$, the numeral $(d_k\cdots d_0)_b$ represents

      $$d_kb^k+\cdots+d_1b+d_0,$$

      with every digit satisfying $0\le d_j<b$. Thus $101101_2=32+8+4+1=45$, and the smallest possible base for the numeral $234_b$ is 5 because every digit must be smaller than the base.
    check:
      id: euclidean-division-and-positional-bases-check
      type: multipleChoice
      prompt: 'What is the base-ten value of $123_4$?'
      choices:
      - id: a
        text: '6'
      - id: b
        text: '18'
      - id: c
        text: '27'
      - id: d
        text: '123'
      answer:
        choiceId: c
      explanation: |-
        Expand by place value: $1(4^2)+2(4)+3=27$.
  - id: congruence-and-legal-operations
    title: Congruence records equal remainders
    required: true
    content: |-
      The statement

      $$a\equiv b\pmod m$$

      means $m\mid(a-b)$. Congruent integers may be different, but they have the same remainder modulo $m$. Addition, subtraction, and multiplication respect congruence because they preserve divisibility of differences.

      Cancellation needs care. From $2\cdot1\equiv2\cdot3\pmod4$, one cannot cancel 2: the conclusion $1\equiv3\pmod4$ is false. A factor may be cancelled modulo $m$ only when it is invertible modulo $m$, equivalently coprime to $m$ in this elementary setting.
    check:
      id: congruence-and-legal-operations-check
      type: multipleChoice
      prompt: 'What is the least nonnegative residue of $-17$ modulo 6?'
      choices:
      - id: a
        text: '$-5$'
      - id: b
        text: '$-1$'
      - id: c
        text: '1'
      - id: d
        text: '5'
      answer:
        choiceId: c
      explanation: Since $-17=6(-3)+1$, the residue in $\{0,1,\ldots,5\}$ is 1.
  - id: cycles-last-digits-and-powers
    title: Establish a cycle before reducing an exponent
    required: true
    content: |-
      A units digit is a residue modulo 10; the last two digits form a residue modulo 100. Powers often repeat because there are finitely many residues, but the cycle length must be established rather than guessed.

      Powers of 7 modulo 10 cycle as $7,9,3,1$. Since $23\equiv3\pmod4$, $7^{23}$ has units digit 3. For $2^{20}\pmod7$, observe $2^3\equiv1$, so $2^{20}=2^{18}2^2\equiv4$.

      Reduce an exponent modulo the proven power-cycle length, not modulo the divisor itself.
    check:
      id: cycles-last-digits-and-powers-check
      type: multipleChoice
      prompt: 'What is the units digit of $3^{100}$?'
      choices:
      - id: a
        text: '1'
      - id: b
        text: '3'
      - id: c
        text: '7'
      - id: d
        text: '9'
      answer:
        choiceId: a
      explanation: The units cycle $3,9,7,1$ has length 4, and 100 is divisible by 4.
  - id: divisibility-tests-from-place-value
    title: Digit tests are modular proofs
    required: true
    content: |-
      Decimal place value explains divisibility tests. Since $10\equiv1\pmod9$, every power $10^j\equiv1\pmod9$. Therefore a decimal integer is congruent modulo 9 to the sum of its digits. The same argument works modulo 3.

      Since $10\equiv-1\pmod{11}$, powers of 10 alternate between $1$ and $-1$ modulo 11. This produces the alternating-digit-sum test for 11.

      A test is trustworthy when its place-value congruence is shown. Memorizing a digit pattern without the modulus makes it easy to apply the wrong test.
    check:
      id: divisibility-tests-from-place-value-check
      type: multipleChoice
      prompt: 'Why is $123456$ divisible by 3 but not by 9?'
      choices:
      - id: a
        text: Its digit sum is 21, which is divisible by 3 but not by 9.
      - id: b
        text: Its final digit is 6.
      - id: c
        text: It has six digits.
      - id: d
        text: Its first and last digits differ by 5.
      answer:
        choiceId: a
      explanation: Modulo 3 or 9, a decimal number has the same residue as its digit sum.
  - id: synthesis-three-consecutive-integers
    title: Synthesis—prove $n^3-n$ is always divisible by 6
    required: true
    content: |-
      Factor the expression:

      $$n^3-n=n(n-1)(n+1).$$

      These are three consecutive integers. At least one is even, so their product is divisible by 2. Exactly one of every three consecutive integers is divisible by 3, so the product is divisible by 3. Since 2 and 3 are coprime, the product is divisible by 6.

      The proof does not claim that one factor must be divisible by 6. The factors can supply the 2 and 3 separately. This distinction between “the product contains the needed prime factors” and “one factor contains all of them” appears throughout number theory.
    check:
      id: synthesis-three-consecutive-integers-check
      type: multipleChoice
      prompt: 'Which factorization best begins a proof that $n^3-n$ is divisible by 6?'
      choices:
      - id: a
        text: '$n(n-1)(n+1)$'
      - id: b
        text: '$n(n^2+1)$'
      - id: c
        text: '$(n-1)^3$'
      - id: d
        text: '$3n(n-1)$'
      answer:
        choiceId: a
      explanation: The factorization exposes three consecutive integers, which supply factors 2 and 3.
