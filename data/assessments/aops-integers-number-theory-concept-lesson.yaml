lesson:
  introduction: Learn to solve Using the Integers problems by recognizing divisibility, number bases, last digits, modular arithmetic, primes, gcd and lcm and justifying each theorem or transformation.
  sections:
  - id: aops-integers-number-theory-motivation
    title: What the topic helps you notice
    required: true
    content: Using the Integers is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are divisibility, number bases, last digits, modular arithmetic, primes, gcd and lcm.
    check:
      id: aops-integers-number-theory-motivation-check
      type: multipleChoice
      prompt: In Using the Integers, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-integers-number-theory-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-integers-number-theory-definitions-check
      type: multipleChoice
      prompt: In Using the Integers, what should be checked before applying a method?
