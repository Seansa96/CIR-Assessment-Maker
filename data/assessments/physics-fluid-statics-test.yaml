questions:
- id: q001
  type: numericResponse
  prompt: |
    A hydraulic press has a small input piston of radius $r$ and a large output piston of radius $5r$. 
    If a downward force of $120 \text{ N}$ is applied to the small piston, what is the maximum upward force the large piston can exert?
    Enter your answer in Newtons.
  answer:
    value: 3000
    tolerance: 10
  explanation: |
    Solution:
    The ratio of the radii is $r_2 / r_1 = 5r / r = 5$.
    The ratio of the areas is $A_2 / A_1 = (r_2 / r_1)^2 = 5^2 = 25$.
    By Pascal's Principle, $F_2 = F_1 \frac{A_2}{A_1} = 120 \times 25 = 3000 \text{ N}$.
    
    Why it works:
    The pressure ($F/A$) is identical on both pistons. Because the large piston has an area 25 times greater than the small piston, the resulting force is 25 times larger.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
- id: q002
  type: symbolicResponse
  prompt: |
    Write the expression for the total absolute pressure $P$ at a depth $h$ in a fluid of density $\rho$ that is exposed to the atmosphere at its surface.
    Let atmospheric pressure be $P_0$ and acceleration due to gravity be $g$.
    Use `P_0`, `\rho`, `g`, and `h`.
  answer:
    expectedLatex: P_0 + \rho g h
    equivalenceMode: expression
    variables: [P_0, \rho, g, h]
    tolerance: 0.00001
    keyPoints:
    - P_0 + \rho g h
  explanation: |
    Solution:
    $P = P_0 + \rho g h$
    
    Why it works:
    The total pressure is the sum of the atmospheric pressure pressing down on the surface of the fluid ($P_0$) and the hydrostatic pressure exerted by the weight of the fluid column ($\rho g h$).
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
