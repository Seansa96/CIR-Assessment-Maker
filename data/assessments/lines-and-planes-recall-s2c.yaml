items:
- id: r001
  type: typed
  prompt: What two pieces of data determine a line in space?
  answer:
    expected: a point and a direction vector
    expectedLatex: 
    aliases:
    - point and direction vector
    - a point and nonzero direction vector
    media: []
    choiceId: 
  explanation: >
    Solution: A point and a nonzero direction vector.

    Why it works: In $\mathbf r=\mathbf r_0+t\mathbf v$, $\mathbf r_0$ locates the line and $\mathbf v$ gives its direction.
  tags: []
  skills: []
  issueSignals:
  - id: line-data-insufficiency
    domains: []
  choices: []
- id: r002
  type: cloze
  prompt: 'Complete the vector-line form: $\mathbf r=\underline{\hspace{1cm}}+t\underline{\hspace{1cm}}$.'
  answer:
    expected: r0 + t v
    expectedLatex: 
    aliases:
    - r_0 + t v
    - \mathbf r_0+t\mathbf v
    - point + t direction vector
    media: []
    choiceId: 
  explanation: >
    Solution: $\mathbf r=\mathbf r_0+t\mathbf v$.

    Why it works: The base point is offset by every scalar multiple of the direction vector.
  tags: []
  skills: []
  issueSignals:
  - id: line-parameterization-error
    domains: []
  choices: []
- id: r003
  type: recognition
  prompt: Which vector is normal to the plane $3x-2y+z=7$?
  answer:
    expected: <3,-2,1>
    expectedLatex: 
    aliases:
    - 3,-2,1
    - \langle3,-2,1\rangle
    media: []
    choiceId: a
  explanation: >
    Solution: Choose $\langle3,-2,1\rangle$.

    Why it works: The $x$, $y$, and $z$ coefficients in scalar plane form are normal-vector components.

    Why the other choices fail: b uses the constant instead of coefficients. c reorders coefficients. d reverses only two components, so it is not a scalar multiple of the normal.
  tags: []
  skills: []
  issueSignals:
  - id: normal-component-placement-error
    domains: []
  choices:
  - id: a
    text: $\langle3,-2,1\rangle$
    media: []
    issueSignals: 
  - id: b
    text: $\langle7,0,0\rangle$
    media: []
    issueSignals: 
  - id: c
    text: $\langle1,-2,3\rangle$
    media: []
    issueSignals: 
  - id: d
    text: $\langle-3,2,1\rangle$
    media: []
    issueSignals: 
- id: r004
  type: recognition
  prompt: Which condition identifies two distinct parallel planes?
  answer:
    expected: normal vectors are scalar multiples
    expectedLatex: 
    aliases:
    - their normals are parallel
    media: []
    choiceId: b
  explanation: >
    Solution: Choose scalar-multiple normals with inequivalent equations.

    Why it works: Parallel planes have parallel normals; inequivalent constants prevent the two equations from describing one plane.

    Why the other choices fail: a can describe many nonparallel planes. c gives perpendicular orientations. d can indicate intersecting or coincident planes.
  tags: []
  skills: []
  issueSignals:
  - id: parallel-normal-comparison-error
    domains: []
  choices:
  - id: a
    text: Their constants are equal
    media: []
    issueSignals: 
  - id: b
    text: Their normal vectors are scalar multiples and their equations are not equivalent
    media: []
    issueSignals: 
  - id: c
    text: Their normal vectors are perpendicular
    media: []
    issueSignals: 
  - id: d
    text: They share one point
    media: []
    issueSignals: 
- id: r005
  type: recognition
  prompt: Which expression is the point-normal equation of a plane through $\mathbf r_0$ with normal $\mathbf n$?
  answer:
    expected: n dot (r-r0)=0
    expectedLatex: 
    aliases:
    - \mathbf n\cdot(\mathbf r-\mathbf r_0)=0
    media: []
    choiceId: c
  explanation: >
    Solution: Choose $\mathbf n\cdot(\mathbf r-\mathbf r_0)=0$.

    Why it works: The displacement from the known point to any plane point is perpendicular to the normal.

    Why the other choices fail: a is a normal-direction line. b has no perpendicularity condition. d describes a sphere-like equal-distance condition.
  tags: []
  skills: []
  issueSignals:
  - id: line-plane-role-confusion
    domains: []
  choices:
  - id: a
    text: $\mathbf r=\mathbf r_0+t\mathbf n$
    media: []
    issueSignals: 
  - id: b
    text: $\mathbf r\cdot\mathbf r_0=\mathbf n$
    media: []
    issueSignals: 
  - id: c
    text: $\mathbf n\cdot(\mathbf r-\mathbf r_0)=0$
    media: []
    issueSignals: 
  - id: d
    text: $|\mathbf r-\mathbf r_0|=|\mathbf n|$
    media: []
    issueSignals: 
- id: r006
  type: typed
  prompt: In the point-to-plane distance formula, what geometric quantity is $\sqrt{a^2+b^2+c^2}$ for $ax+by+cz=d$?
  answer:
    expected: the magnitude of the normal vector
    expectedLatex: 
    aliases:
    - length of the normal vector
    - norm of <a,b,c>
    - norm of the normal
    media: []
    choiceId: 
  explanation: >
    Solution: It is the magnitude of the normal vector $\langle a,b,c\rangle$.

    Why it works: Dividing by that magnitude changes the normal-scaled numerator into an actual perpendicular distance.
  tags: []
  skills: []
  issueSignals:
  - id: point-plane-distance-error
    domains: []
  choices: []
