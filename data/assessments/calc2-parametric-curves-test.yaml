skills:
- parametric-curves
modeDefault: test
randomizeQuestions: true
questions:
- id: q-param-curves-test-1
  type: symbolicResponse
  title: Complex Elimination
  prompt: |
    Eliminate the parameter $t$ to find a Cartesian equation for the curve:

    $$
    x = 1 + \sec t, \quad y = 2 + 3\tan t
    $$

    Express your answer by isolating $1$ on one side, using the identity $\sec^2 t - \tan^2 t = 1$. What is the expression equal to $1$?
  answer:
    expectedLatex: (x-1)^2 - \frac{(y-2)^2}{9}
    equivalenceMode: expression
    variables:
    - x
    - y
    tolerance: 0.000001
  explanation: |
    First, isolate the trigonometric functions:
    $\sec t = x - 1$
    $\tan t = \frac{y - 2}{3}$

    Now substitute these into the identity $\sec^2 t - \tan^2 t = 1$:

    $$
    (x - 1)^2 - \left(\frac{y - 2}{3}\right)^2 = 1
    $$

    Simplifying gives $(x - 1)^2 - \frac{(y - 2)^2}{9} = 1$, which is a hyperbola.
  skills:
  - parametric-curves
- id: q-param-curves-test-2
  type: multipleChoice
  title: Intersection vs Collision
  prompt: |
    Two bugs move along the following paths for $t \ge 0$:

    Bug 1: $x_1 = t^2 - 4, \quad y_1 = 3t$

    Bug 2: $x_2 = t - 2, \quad y_2 = t^2$

    Do their paths intersect, and do they collide?
  choices:
  - id: c1
    text: The paths intersect, but they do not collide.
  - id: c2
    text: The paths intersect and they collide at exactly one point.
  - id: c3
    text: The paths intersect and they collide at exactly two points.
  - id: c4
    text: The paths do not intersect.
  answer:
    choiceId: c1
  explanation: "To check for collision, set $x_1(t) = x_2(t)$ and $y_1(t) = y_2(t)$\
    \ for the same time $t$:\n$t^2 - 4 = t - 2 \\implies t^2 - t - 2 = 0 \\implies\
    \ (t-2)(t+1) = 0$. Since $t \\ge 0$, $t = 2$.\nCheck $y$ at $t = 2$: $y_1(2) =\
    \ 6$, $y_2(2) = 4$. Since $6 \\neq 4$, there is no collision.\n\nTo check for\
    \ intersection, eliminate $t$. \nBug 2: $t = x + 2 \\implies y = (x + 2)^2$.\n\
    Bug 1: $x = t^2 - 4 \\implies t = \\sqrt{x+4}$ (since $t \\ge 0$). Thus $y = 3\\\
    sqrt{x+4}$.\nSet Cartesian paths equal: $(x+2)^2 = 3\\sqrt{x+4}$.\nTesting values,\
    \ at $x=5$: $(7)^2 = 49$, $3\\sqrt{9} = 9$. At $x=0$: $4 \\neq 6$. \nWait, observe\
    \ the curves. $(x+2)^4 = 9(x+4)$. Since polynomials of degree 4 cross the square\
    \ root, they must intersect at least once (Intermediate Value Theorem on the difference).\n\
    Hence, the paths intersect, but they do not collide.\n"
  skills:
  - parametric-curves
- id: q-param-curves-test-3
  type: symbolicResponse
  title: Finding Parametric Form
  prompt: "Find a set of parametric equations for the line segment from $(1, 3)$ to\
    \ $(4, 9)$ where $0 \\le t \\le 1$.\nExpress $x(t)$ and $y(t)$ in the form $at\
    \ + b$. \n\nWhat is the expression for $y(t)$?\n"
  answer:
    expectedLatex: 6t + 3
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0.000001
  explanation: |
    The standard parametrization for a line segment from $(x_0, y_0)$ to $(x_1, y_1)$ for $0 \le t \le 1$ is:
    $x(t) = x_0 + t(x_1 - x_0)$
    $y(t) = y_0 + t(y_1 - y_0)$

    For $x$: $x(t) = 1 + t(4 - 1) = 3t + 1$.
    For $y$: $y(t) = 3 + t(9 - 3) = 6t + 3$.
  skills:
  - parametric-curves
- id: q-param-easy-4
  type: numericResponse
  title: Evaluate Position 1
  prompt: |-
    If $x(t) = 3t - 1$ and $y(t) = t^2 + 2$, find the value of $y$ when $t = 4$.
  answer:
    value: 18
    tolerance: 0.01
  explanation: |-
    Substitute $t=4$ into the equation for $y$: $y(4) = 4^2 + 2 = 16 + 2 = 18$.
- id: q-param-easy-5
  type: multipleChoice
  title: Evaluate Position 2
  prompt: |-
    Given $x(t) = 2\cos t$ and $y(t) = 3\sin t$, what is the position at $t = \pi$ ?
  choices:
  - id: c1
    text: $(-2, 0)$
  - id: c2
    text: $(0, -3)$
  - id: c3
    text: $(2, 0)$
  - id: c4
    text: $(0, 3)$
  answer:
    choiceId: c1
  explanation: |-
    Evaluate at $t=\pi$: $x = 2\cos(\pi) = 2(-1) = -2$ and $y = 3\sin(\pi) = 3(0) = 0$. The position is $(-2, 0)$.
- id: q-param-easy-6
  type: numericResponse
  title: Evaluate Position 3
  prompt: |-
    If $x(t) = e^t$ and $y(t) = t^3$, find the value of $x$ when $t = 0$.
  answer:
    value: 1
    tolerance: 0.01
  explanation: |-
    Substitute $t=0$ into the equation for $x$: $x(0) = e^0 = 1$.
- id: q-param-easy-7
  type: symbolicResponse
  title: Basic Elimination 1
  prompt: |-
    Eliminate the parameter $t$ to find a Cartesian equation in terms of $x$ for the curve $x = t + 2, y = 3t - 1$. Express $y$ in terms of $x$.
  answer:
    expectedLatex: 3x - 7
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0.000001
  explanation: |-
    From $x = t + 2$, we get $t = x - 2$. Substitute this into $y = 3t - 1$: $y = 3(x - 2) - 1 = 3x - 6 - 1 = 3x - 7$.
- id: q-param-easy-8
  type: symbolicResponse
  title: Basic Elimination 2
  prompt: |-
    Eliminate the parameter $t$ to find a Cartesian equation in terms of $x$ for the curve $x = \sqrt{t}, y = t + 2$ for $t \ge 0$. Express $y$ in terms of $x$.
  answer:
    expectedLatex: x^2 + 2
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0.000001
  explanation: |-
    From $x = \sqrt{t}$, squaring both sides gives $t = x^2$. Substitute into $y$: $y = x^2 + 2$.
- id: q-param-easy-9
  type: multipleChoice
  title: Basic Elimination 3
  prompt: |-
    Eliminate the parameter to identify the shape of the curve: $x = 5\cos t, \quad y = 5\sin t$.
  choices:
  - id: c1
    text: A circle of radius 5
  - id: c2
    text: A circle of radius 25
  - id: c3
    text: An ellipse
  - id: c4
    text: A parabola
  answer:
    choiceId: c1
  explanation: |-
    Using $\cos^2 t + \sin^2 t = 1$, we have $(x/5)^2 + (y/5)^2 = 1$, which simplifies to $x^2 + y^2 = 25$. This is the equation of a circle with radius 5 centered at the origin.
- id: q-param-easy-10
  type: multipleChoice
  title: Basic Parameterization 1
  prompt: |-
    Which of the following is a valid parameterization for the line segment from $(0,0)$ to $(3,4)$ for $0 \le t \le 1$?
  choices:
  - id: c1
    text: $x = 3t, \quad y = 4t$
  - id: c2
    text: $x = 4t, \quad y = 3t$
  - id: c3
    text: $x = 3t, \quad y = t$
  - id: c4
    text: $x = t, \quad y = 4t$
  answer:
    choiceId: c1
  explanation: |-
    The standard parameterization is $x = x_0 + t(x_1 - x_0)$ and $y = y_0 + t(y_1 - y_0)$. Since the start point is $(0,0)$ and the end point is $(3,4)$, $x = 3t$ and $y = 4t$.
- id: q-param-easy-11
  type: multipleChoice
  title: Basic Parameterization 2
  prompt: |-
    Which of the following parameterizations describes a circle of radius 7 centered at the origin?
  choices:
  - id: c1
    text: $x = 7\cos t, \quad y = 7\sin t$
  - id: c2
    text: $x = \cos(7t), \quad y = \sin(7t)$
  - id: c3
    text: $x = 7t, \quad y = 7t$
  - id: c4
    text: $x = \cos t + 7, \quad y = \sin t + 7$
  answer:
    choiceId: c1
  explanation: |-
    A circle of radius $R$ centered at the origin is parameterized by $x = R\cos t, y = R\sin t$. Substituting $R = 7$ gives $x = 7\cos t, y = 7\sin t$.
- id: q-param-easy-12
  type: symbolicResponse
  title: Basic Parameterization 3
  prompt: |-
    Write the $y(t)$ parameterization for the parabola $y = 2x^2 + 5$ if we choose $x(t) = t$.
  answer:
    expectedLatex: 2t^2 + 5
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0.000001
  explanation: |-
    If $x = t$, we simply substitute $t$ for $x$ in the equation for $y$. Thus, $y(t) = 2t^2 + 5$.
- id: q-param-easy-13
  type: multipleChoice
  title: Direction of Motion 1
  prompt: |-
    Consider the curve $x = t, \quad y = t^2$. As $t$ increases from $-2$ to $2$, what describes the motion of the particle?
  choices:
  - id: c1
    text: It moves left to right along a parabola.
  - id: c2
    text: It moves right to left along a parabola.
  - id: c3
    text: It moves upward in a straight line.
  - id: c4
    text: It moves in a circle.
  answer:
    choiceId: c1
  explanation: |-
    Since $x = t$, as $t$ increases from $-2$ to $2$, $x$ increases from $-2$ to $2$. Increasing $x$ corresponds to motion from left to right along the parabola $y = x^2$.
- id: q-param-easy-14
  type: multipleChoice
  title: Direction of Motion 2
  prompt: |-
    Consider the curve $x = \cos t, \quad y = \sin t$. As $t$ increases from $0$ to $\pi$, in which direction does the particle travel along the unit circle?
  choices:
  - id: c1
    text: Counterclockwise along the top half of the circle.
  - id: c2
    text: Clockwise along the top half of the circle.
  - id: c3
    text: Counterclockwise along the bottom half of the circle.
  - id: c4
    text: Clockwise along the bottom half of the circle.
  answer:
    choiceId: c1
  explanation: |-
    At $t=0$, $(x,y) = (1,0)$. At $t=\pi/2$, $(x,y) = (0,1)$. At $t=\pi$, $(x,y) = (-1,0)$. This motion traces the top half of the circle in the counterclockwise direction.
- id: q-param-easy-15
  type: multipleChoice
  title: Direction of Motion 3
  prompt: |-
    Consider the curve $x = -t, \quad y = 2t + 1$. As $t$ increases, what describes the motion of the particle?
  choices:
  - id: c1
    text: It moves upward and to the left.
  - id: c2
    text: It moves upward and to the right.
  - id: c3
    text: It moves downward and to the left.
  - id: c4
    text: It moves downward and to the right.
  answer:
    choiceId: c1
  explanation: |-
    As $t$ increases, $x = -t$ decreases (moves to the left) and $y = 2t + 1$ increases (moves upward). Therefore, the particle moves upward and to the left.

- id: q-param-curves-test-graph-2
  type: graphingResponse
  title: Graph the Parametric Curve
  prompt: |
    Draw the parametric curve $x(t) = 3\cos(t), y(t) = 2\sin(t)$ for $0 \le t \le 2\pi$. 
    Use the ellipse tool to draw the shape, and use the point tool to plot the starting point at $t=0$.
  answer:
    graphingAnswer:
      features:
        - type: ShapeType
          stringValue: ellipse
          weight: 1.0
        - type: Vertex
          x: 3.0
          y: 0.0
          tolerance: 0.2
          weight: 0.5
        - type: Vertex
          x: -3.0
          y: 0.0
          tolerance: 0.2
          weight: 0.5
        - type: Vertex
          x: 0.0
          y: 2.0
          tolerance: 0.2
          weight: 0.5
        - type: Vertex
          x: 0.0
          y: -2.0
          tolerance: 0.2
          weight: 0.5
        - type: PassesThrough
          x: 3.0
          y: 0.0
          tolerance: 0.2
          weight: 1.0
  explanation: |
    The parametric equations $x = 3\cos(t)$ and $y = 2\sin(t)$ describe an ellipse centered at the origin with a horizontal semi-axis of $3$ and a vertical semi-axis of $2$. At $t=0$, $x = 3\cos(0) = 3$ and $y = 2\sin(0) = 0$, so the starting point is $(3, 0)$.
  skills:
  - parametric-curves

