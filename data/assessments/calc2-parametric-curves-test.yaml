id: calc2-parametric-curves-test
title: Parametric Curves Test
assessmentType: test
categoryId: calculus-2
subcategoryIds:
  - parametric-curves
skills:
- parametric-curves
modeDefault: test
randomizeQuestions: true
questions:
  - id: q-param-curves-test-1
    type: symbolicResponse
    title: Complex Elimination
    prompt: |
      Eliminate the parameter $t$ to find a Cartesian equation for the curve:
      
      $$
      x = 1 + \sec t, \quad y = 2 + 3\tan t
      $$
      
      Express your answer by isolating $1$ on one side, using the identity $\sec^2 t - \tan^2 t = 1$. What is the expression equal to $1$?
    answer:
      expectedLatex: '(x-1)^2 - \frac{(y-2)^2}{9}'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      First, isolate the trigonometric functions:
      $\sec t = x - 1$
      $\tan t = \frac{y - 2}{3}$
      
      Now substitute these into the identity $\sec^2 t - \tan^2 t = 1$:
      
      $$
      (x - 1)^2 - \left(\frac{y - 2}{3}\right)^2 = 1
      $$
      
      Simplifying gives $(x - 1)^2 - \frac{(y - 2)^2}{9} = 1$, which is a hyperbola.
    skills:
      - parametric-curves

  - id: q-param-curves-test-2
    type: multipleChoice
    title: Intersection vs Collision
    prompt: |
      Two bugs move along the following paths for $t \ge 0$:
      
      Bug 1: $x_1 = t^2 - 4, \quad y_1 = 3t$
      
      Bug 2: $x_2 = t - 2, \quad y_2 = t^2$
      
      Do their paths intersect, and do they collide?
    choices:
      - id: c1
        text: 'The paths intersect, but they do not collide.'
      - id: c2
        text: 'The paths intersect and they collide at exactly one point.'
      - id: c3
        text: 'The paths intersect and they collide at exactly two points.'
      - id: c4
        text: 'The paths do not intersect.'
    answer:
      choiceId: c1
    explanation: |
      To check for collision, set $x_1(t) = x_2(t)$ and $y_1(t) = y_2(t)$ for the same time $t$:
      $t^2 - 4 = t - 2 \implies t^2 - t - 2 = 0 \implies (t-2)(t+1) = 0$. Since $t \ge 0$, $t = 2$.
      Check $y$ at $t = 2$: $y_1(2) = 6$, $y_2(2) = 4$. Since $6 \neq 4$, there is no collision.
      
      To check for intersection, eliminate $t$. 
      Bug 2: $t = x + 2 \implies y = (x + 2)^2$.
      Bug 1: $x = t^2 - 4 \implies t = \sqrt{x+4}$ (since $t \ge 0$). Thus $y = 3\sqrt{x+4}$.
      Set Cartesian paths equal: $(x+2)^2 = 3\sqrt{x+4}$.
      Testing values, at $x=5$: $(7)^2 = 49$, $3\sqrt{9} = 9$. At $x=0$: $4 \neq 6$. 
      Wait, observe the curves. $(x+2)^4 = 9(x+4)$. Since polynomials of degree 4 cross the square root, they must intersect at least once (Intermediate Value Theorem on the difference).
      Hence, the paths intersect, but they do not collide.
    skills:
      - parametric-curves

  - id: q-param-curves-test-3
    type: symbolicResponse
    title: Finding Parametric Form
    prompt: |
      Find a set of parametric equations for the line segment from $(1, 3)$ to $(4, 9)$ where $0 \le t \le 1$.
      Express $x(t)$ and $y(t)$ in the form $at + b$. 
      
      What is the expression for $y(t)$?
    answer:
      expectedLatex: '6t + 3'
      equivalenceMode: expression
      variables:
        - t
      tolerance: 0.000001
    explanation: |
      The standard parametrization for a line segment from $(x_0, y_0)$ to $(x_1, y_1)$ for $0 \le t \le 1$ is:
      $x(t) = x_0 + t(x_1 - x_0)$
      $y(t) = y_0 + t(y_1 - y_0)$
      
      For $x$: $x(t) = 1 + t(4 - 1) = 3t + 1$.
      For $y$: $y(t) = 3 + t(9 - 3) = 6t + 3$.
    skills:
      - parametric-curves
