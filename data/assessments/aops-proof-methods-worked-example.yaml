- id: aops-proof-methods-problem-1
  title: 'Direct application: Prove It'
  problem: 'Original Prove It problem 1: use the givens to identify proof vocabulary, contradiction, converse errors, induction, pigeonhole principle, counterexamples, then solve without assuming unstated facts.'
  steps:
  - id: aops-proof-methods-p1-s1
    title: Read the givens
    instruction: List the quantities, relationships, and restrictions that control this Prove It problem.
    type: multipleChoice
    prompt: Which action is required at this stage of the direct application problem?
    choices:
    - id: a
      text: List the quantities, relationships, and restrictions that control this Prove It problem.
    - id: b
      text: Assume the diagram is to scale.
    - id: c
      text: Discard inconvenient cases.
    - id: d
      text: Choose an answer before reasoning.
    answer:
      choiceId: a
    explanation: List the quantities, relationships, and restrictions that control this Prove It problem.
  - id: aops-proof-methods-p1-s2
    title: Select the tool
    instruction: Choose a method from state assumptions, prove both directions only when needed, look for a contradiction or invariant and state the exact condition that permits it.
    type: multipleChoice
    prompt: Which action is required at this stage of the direct application problem?
    choices:
    - id: a
      text: Choose a method from state assumptions, prove both directions only when needed, look for a contradiction or invariant and state the exact condition that permits it.
    - id: b
      text: Assume the diagram is to scale.
    - id: c
      text: Discard inconvenient cases.
    - id: d
      text: Choose an answer before reasoning.
    answer:
      choiceId: a
    explanation: Choose a method from state assumptions, prove both directions only when needed, look for a contradiction or invariant and state the exact condition that permits it.
  - id: aops-proof-methods-p1-s3
    title: Carry out the argument
    instruction: Apply the chosen relationship carefully; preserve equality, direction, and domain restrictions.
    type: multipleChoice
    prompt: Which action is required at this stage of the direct application problem?
    choices:
    - id: a
      text: Apply the chosen relationship carefully; preserve equality, direction, and domain restrictions.
    - id: b
      text: Assume the diagram is to scale.
    - id: c
      text: Discard inconvenient cases.
    - id: d
      text: Choose an answer before reasoning.
    answer:
      choiceId: a
    explanation: Apply the chosen relationship carefully; preserve equality, direction, and domain restrictions.
  - id: aops-proof-methods-p1-s4
    title: Verify the conclusion
    instruction: Check the original question, test any boundary or exceptional case, and state the final conclusion.
    type: multipleChoice
    prompt: Which action is required at this stage of the direct application problem?
    choices:
    - id: a
      text: Check the original question, test any boundary or exceptional case, and state the final conclusion.
    - id: b
      text: Assume the diagram is to scale.
    - id: c
      text: Discard inconvenient cases.
