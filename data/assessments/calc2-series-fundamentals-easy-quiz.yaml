- id: q001
  type: multipleChoice
  skills:
  - define-partial-sums
  prompt: |
    What does $S_N=\sum_{n=1}^{N}a_n$ represent?
  choices:
  - id: a
    text: The finite sum of the first $N$ terms
  - id: b
    text: The $N$th term $a_N$
  - id: c
    text: The infinite-series sum regardless of convergence
  - id: d
    text: The remainder after $N$ terms
  answer:
    choiceId: a
  explanation: |-
    Solution: A partial sum has a finite upper index and accumulates exactly the first $N$ terms. Therefore the answer is The finite sum of the first $N$ terms.

    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

    Why the other choices fail: The $N$th term $a_N$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; The infinite-series sum regardless of convergence conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; The remainder after $N$ terms conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
