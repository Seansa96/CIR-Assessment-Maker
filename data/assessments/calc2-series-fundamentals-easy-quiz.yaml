schemaVersion: 1
id: calc2-series-fundamentals-easy-quiz
title: Series Fundamentals Easy Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: series-fundamentals
skills:
- Interpret partial sums, remainders, and convergence
- Apply necessary and Cauchy conditions
- Recover terms and evaluate elementary series
navigation:
  learningGoal: practice
  activityType: mixedPractice
  tags:
  - calculus-2
  - series-fundamentals
  - easy
  - partial-sums
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - define-partial-sums
  prompt: |
    What does $S_N=\sum_{n=1}^{N}a_n$ represent?
  choices:
  - id: a
    text: The finite sum of the first $N$ terms
  - id: b
    text: The $N$th term $a_N$
  - id: c
    text: The infinite-series sum regardless of convergence
  - id: d
    text: The remainder after $N$ terms
  answer:
    choiceId: a
  explanation: A partial sum has a finite upper index and accumulates exactly the first $N$ terms.
- id: q002
  type: multipleChoice
  skills:
  - define-series-convergence
  prompt: |
    When does $\sum_{n=1}^{\infty}a_n$ converge to $S$?
  choices:
  - id: a
    text: |-
      When $\lim_{N\to\infty}S_N=S$
  - id: b
    text: |-
      Whenever $\lim a_n=0$
  - id: c
    text: Whenever every $a_n$ is bounded
  - id: d
    text: When $S_N=a_N$
  answer:
    choiceId: a
  explanation: The infinite series is defined as the limit of its finite partial-sum sequence.
- id: q003
  type: multipleChoice
  skills:
  - apply-the-divergence-test
  prompt: |
    If $\lim_{n\to\infty}a_n=7$, what happens to $\sum a_n$?
  choices:
  - id: a
    text: It diverges.
  - id: b
    text: It converges to $7$.
  - id: c
    text: It converges absolutely.
  - id: d
    text: It is geometric.
  answer:
    choiceId: a
  explanation: Terms of a convergent series must approach zero; a limit of seven violates that necessary
    condition.
- id: q004
  type: multipleChoice
  skills:
  - recognize-the-invalid-converse
  prompt: |
    Which series shows that $a_n\to0$ does not guarantee $\sum a_n$ converges?
  choices:
  - id: a
    text: |-
      $\sum1/n$
  - id: b
    text: |-
      $\sum1/2^n$
  - id: c
    text: |-
      $\sum0$
  - id: d
    text: |-
      $\sum1/n^2$
  answer:
    choiceId: a
  explanation: Harmonic terms approach zero while their partial sums grow without bound.
- id: q005
  type: multipleChoice
  skills:
  - evaluate-geometric-series
  prompt: |
    Evaluate $\sum_{n=0}^{\infty}3(1/4)^n$.
  choices:
  - id: a
    text: $3$
  - id: b
    text: $4$
  - id: c
    text: $12$
  - id: d
    text: The series diverges.
  answer:
    choiceId: b
  explanation: The geometric sum is $3/(1-1/4)=4$.
- id: q006
  type: multipleChoice
  skills:
  - derive-telescoping-partial-sums
  prompt: |
    What is the sum of
    $$\sum_{n=1}^{\infty}\left(\frac1n-\frac1{n+1}\right)?$$
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1$
  - id: c
    text: $2$
  - id: d
    text: The series diverges.
  answer:
    choiceId: b
  explanation: The finite partial sum is $1-1/(N+1)$, whose limit is one.
- id: q007
  type: multipleChoice
  skills:
  - understand-finite-term-invariance
  prompt: |
    Changing the first term of a convergent series can do what?
  choices:
  - id: a
    text: Change the sum but not convergence.
  - id: b
    text: Force divergence in every case.
  - id: c
    text: Leave both convergence and sum unchanged.
  - id: d
    text: Make the term limit nonzero.
  answer:
    choiceId: a
  explanation: Every later partial sum shifts by one fixed finite amount, preserving existence of a finite
    limit.
- id: q008
  type: multipleChoice
  skills:
  - analyze-positive-partial-sums
  prompt: |
    If every $a_n\ge0$, which additional fact proves $\sum a_n$ converges?
  choices:
  - id: a
    text: The partial sums are bounded above.
  - id: b
    text: The terms are bounded above.
  - id: c
    text: The terms are positive.
  - id: d
    text: The first partial sum is finite.
  answer:
    choiceId: a
  explanation: Nonnegative terms make $S_N$ nondecreasing, and an upper bound then guarantees a finite
    limit.
- id: q009
  type: multipleChoice
  skills:
  - apply-the-cauchy-criterion
  prompt: |
    What must be true of $\sum_{k=m}^{n}a_k$ for a convergent series when
    both $m$ and $n$ are sufficiently large?
  choices:
  - id: a
    text: Its magnitude is smaller than any prescribed positive tolerance.
  - id: b
    text: It equals the first term.
  - id: c
    text: It is always positive.
  - id: d
    text: It contains exactly one term.
  answer:
    choiceId: a
  explanation: Differences of late partial sums must be arbitrarily small because a convergent sequence
    is Cauchy.
- id: q010
  type: multipleChoice
  skills:
  - recover-terms-from-partial-sums
  prompt: |
    For $n\ge2$, how is $a_n$ recovered from the partial sums?
  choices:
  - id: a
    text: $a_n=S_n-S_{n-1}$
  - id: b
    text: $a_n=S_n+S_{n-1}$
  - id: c
    text: $a_n=S_n/n$
  - id: d
    text: $a_n=S_nS_{n-1}$
  answer:
    choiceId: a
  explanation: The two partial sums share all earlier terms, leaving only $a_n$ when subtracted.
- id: q011
  type: multipleChoice
  skills:
  - evaluate-series-from-partial-sum-formulas
  prompt: |
    A series has $S_N=2-1/(N+1)$. What is its sum?
  choices:
  - id: a
    text: $1$
  - id: b
    text: $2$
  - id: c
    text: $3$
  - id: d
    text: It diverges.
  answer:
    choiceId: b
  explanation: |-
    The reciprocal term vanishes, so $\lim S_N=2$.
- id: q012
  type: multipleChoice
  skills:
  - diagnose-oscillating-partial-sums
  prompt: |
    If $S_{2k}=1$ and $S_{2k+1}=3$ for every $k$, what happens to the series?
  choices:
  - id: a
    text: It diverges.
  - id: b
    text: It converges to $2$.
  - id: c
    text: It converges to $1$.
  - id: d
    text: It converges absolutely.
  answer:
    choiceId: a
  explanation: Even and odd partial sums have distinct limits, so the full partial-sum sequence has no
    limit.
- id: q013
  type: multipleChoice
  skills:
  - handle-first-terms-from-partial-sums
  prompt: |
    What is the relationship between $a_1$ and $S_1$?
  choices:
  - id: a
    text: $a_1=S_1$
  - id: b
    text: $a_1=0$
  - id: c
    text: $a_1=S_1-S_2$
  - id: d
    text: $a_1=S_1/2$
  answer:
    choiceId: a
  explanation: The first partial sum contains exactly one term.
- id: q014
  type: multipleChoice
  skills:
  - interpret-series-tails
  prompt: |
    If $\sum a_n$ converges, which expression equals $R_N$?
  choices:
  - id: a
    text: |-
      $\sum_{n=N+1}^{\infty}a_n$
  - id: b
    text: |-
      $\sum_{n=1}^{N}a_n$
  - id: c
    text: $a_N$
  - id: d
    text: $S+S_N$
  answer:
    choiceId: a
  explanation: The remainder consists of exactly the terms omitted after the first $N$.
- id: q015
  type: multipleChoice
  skills:
  - understand-consecutive-grouping
  prompt: |
    If a convergent series is grouped into consecutive finite blocks without
    changing term order, what happens?
  choices:
  - id: a
    text: The grouped series converges to the same sum.
  - id: b
    text: The sum always changes.
  - id: c
    text: It becomes absolutely convergent.
  - id: d
    text: It must diverge.
  answer:
    choiceId: a
  explanation: Grouped partial sums form a subsequence of the original partial sums and therefore approach
    the same limit.
attemptQuestionCount: 15
