- id: q006
  type: multipleChoice
  skills:
  - derive-telescoping-partial-sums
  prompt: |
    What is the sum of
    $$\sum_{n=1}^{\infty}\left(\frac1n-\frac1{n+1}\right)?$$
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1$
  - id: c
    text: $2$
  - id: d
    text: The series diverges.
  answer:
    choiceId: b
  explanation: |-
    Solution: The finite partial sum is $1-1/(N+1)$, whose limit is one. Therefore the answer is $1$.

    Why it works: Rewrite the general term so consecutive partial-sum terms cancel. Write $S_N$ explicitly, cancel only terms that occur with opposite signs, and then take $N\to\infty$ to obtain the infinite-series result.

    Common trap: Do not cancel nonadjacent terms by inspection without writing $S_N$; the surviving last term usually depends on $N$ and must be sent to its limit.

    Why the other choices fail: $0$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; $2$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; The series diverges. conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel.
