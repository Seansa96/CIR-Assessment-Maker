schemaVersion: 1
id: aops-integers-number-theory-quiz
title: Using the Integers Practice Quiz
assessmentType: quiz
categoryId: art-of-problem-solving
topicId: aops-integers-number-theory
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - art-of-problem-solving
  - aops-integers-number-theory
  - divisibility
  - modular-arithmetic
