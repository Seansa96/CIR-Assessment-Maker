skills:
- Factor integers and compute divisor, gcd, and lcm information
- Convert positional numerals between bases
- Compute remainders and final digits with modular cycles
- Justify elementary parity and congruence claims
questions:
- id: q001
  type: multipleChoice
  prompt: 'Which list contains all positive divisors of 18?'
  choices:
  - id: a
    text: '$1,2,3,6,9,18$'
  - id: b
    text: '$2,3,6,9$'
  - id: c
    text: '$1,2,3,4,6,9,18$'
  - id: d
    text: '$1,3,6,18$'
  answer:
    choiceId: a
  explanation: Factor pairs are $(1,18),(2,9),(3,6)$.
- id: q002
  type: multipleChoice
  prompt: 'How is the integer 1 classified?'
  choices:
  - id: a
    text: Prime
  - id: b
    text: Composite
  - id: c
    text: Both prime and composite
  - id: d
    text: Neither prime nor composite
  answer:
    choiceId: d
  explanation: A prime has exactly two positive divisors, while 1 has only one.
- id: q003
  type: multipleChoice
  prompt: 'What is the prime factorization of 360?'
  choices:
  - id: a
    text: '$2^3\cdot3^2\cdot5$'
  - id: b
    text: '$2^2\cdot3^2\cdot10$'
  - id: c
    text: '$2^3\cdot3\cdot5^2$'
  - id: d
    text: '$3^2\cdot40$'
  answer:
    choiceId: a
  explanation: Every factor displayed is prime and their product is 360.
- id: q004
  type: multipleChoice
  prompt: 'Find $\gcd(84,126)$.'
  choices:
  - id: a
    text: '14'
  - id: b
    text: '21'
  - id: c
    text: '42'
  - id: d
    text: '252'
  answer:
    choiceId: c
  explanation: The shared prime product is $2\cdot3\cdot7=42$.
- id: q005
  type: multipleChoice
  prompt: 'Find $\operatorname{lcm}(18,24)$.'
  choices:
  - id: a
    text: '36'
  - id: b
    text: '48'
  - id: c
    text: '72'
  - id: d
    text: '432'
  answer:
    choiceId: c
  explanation: Use $18=2\cdot3^2$ and $24=2^3\cdot3$, then take maximum exponents.
- id: q006
  type: multipleChoice
  prompt: 'Convert $101101_2$ to base ten.'
  choices:
  - id: a
    text: '41'
  - id: b
    text: '43'
  - id: c
    text: '45'
  - id: d
    text: '53'
  answer:
    choiceId: c
  explanation: The nonzero place values are $32+8+4+1=45$.
- id: q007
  type: multipleChoice
  prompt: 'What is the units digit of $7^{23}$?'
  choices:
  - id: a
    text: '1'
  - id: b
    text: '3'
  - id: c
    text: '7'
  - id: d
    text: '9'
  answer:
    choiceId: b
  explanation: Powers of 7 cycle $7,9,3,1$, and $23\equiv3\pmod4$.
- id: q008
  type: multipleChoice
  prompt: 'Find the least nonnegative residue of $-17$ modulo 6.'
  choices:
  - id: a
    text: '$-5$'
  - id: b
    text: '$-1$'
  - id: c
    text: '1'
  - id: d
    text: '5'
  answer:
    choiceId: c
  explanation: Add 18, a multiple of 6, to obtain 1.
- id: q009
  type: multipleChoice
  prompt: 'What is the least nonnegative residue of $38+57$ modulo 7?'
  choices:
  - id: a
    text: '2'
  - id: b
    text: '3'
  - id: c
    text: '4'
  - id: d
    text: '5'
  answer:
    choiceId: c
  explanation: |-
    Reduce first: $38\equiv3$ and $57\equiv1$, so the sum is 4 modulo 7.
- id: q010
  type: multipleChoice
  prompt: 'Which statement about 123456 is correct?'
  choices:
  - id: a
    text: It is divisible by both 3 and 9.
  - id: b
    text: It is divisible by 3 but not by 9.
  - id: c
    text: It is divisible by 9 but not by 3.
  - id: d
    text: It is divisible by neither 3 nor 9.
  answer:
    choiceId: b
  explanation: The digit sum is 21, divisible by 3 but not by 9.
- id: q011
  type: multipleChoice
  prompt: 'Find the remainder when $2^{20}$ is divided by 7.'
  choices:
  - id: a
    text: '1'
  - id: b
    text: '2'
  - id: c
    text: '4'
  - id: d
    text: '6'
  answer:
    choiceId: c
  explanation: Since $2^3\equiv1\pmod7$, reduce $20$ modulo 3 and obtain $2^2=4$.
- id: q012
  type: multipleChoice
  prompt: 'How many positive divisors does $2^3\cdot3^2\cdot5$ have?'
  choices:
  - id: a
    text: '12'
  - id: b
    text: '18'
  - id: c
    text: '24'
  - id: d
    text: '30'
  answer:
    choiceId: c
  explanation: |-
    Multiply the exponent-choice counts: $4\cdot3\cdot2=24$.
- id: q013
  type: selectAll
  prompt: 'If $a\equiv b\pmod m$, which operations always preserve congruence for any integer $c$?'
  choices:
  - id: a
    text: Add $c$ to both representatives.
  - id: b
    text: Subtract $c$ from both representatives.
  - id: c
    text: Multiply both representatives by $c$.
  - id: d
    text: Cancel every nonzero common factor without checking it.
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: Cancellation requires invertibility of the factor modulo $m$ and is not automatic.
- id: q014
  type: selectAll
  prompt: 'Which statements are correct?'
  choices:
  - id: a
    text: Every digit in base $b$ must be less than $b$.
  - id: b
    text: One is neither prime nor composite.
  - id: c
    text: Congruent integers must be equal as ordinary integers.
  - id: d
    text: A last decimal digit is a residue modulo 10.
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: Congruent integers may differ by a nonzero multiple of the modulus.
- id: q015
  type: freeResponse
  prompt: |-
    Prove that the sum of two odd integers is even.
  answer:
    gradingMode: selfCheck
    expected: |-
      Write the odd integers as $2a+1$ and $2b+1$ for integers $a,b$. Their sum is $2a+2b+2=2(a+b+1)$. Since $a+b+1$ is an integer, the sum is divisible by 2 and therefore even.
    keyPoints:
    - Represents arbitrary odd integers in defining form.
    - Factors the sum as 2 times an integer.
    - States the divisibility conclusion.
  explanation: The argument uses arbitrary odd integers, so it proves the claim universally.
