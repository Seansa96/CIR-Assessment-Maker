schemaVersion: 1
id: chem-intermolecular-forces-solid-liquid-properties-quiz
title: Solids, Liquids, and Material Properties Quiz
assessmentType: quiz
categoryId: chemistry
topicId: chem-intermolecular-forces
skills:
  - chem-intermolecular-forces
  - states-of-matter
  - solid-structure-properties
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
    - chemistry
    - chem-intermolecular-forces
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 10
questions:
  - id: q001
    type: multipleChoice
    prompt: 'In a liquid, particles generally:'
    choices:
      - id: a
        text: occupy fixed positions and only vibrate.
      - id: b
        text: are far apart with negligible attractions.
      - id: c
        text: remain close together but can move past one another.
      - id: d
        text: have no kinetic energy.
    answer:
      choiceId: c
    explanation: Liquid particles remain close because of attractions, yet have enough kinetic energy to flow past one another.
  - id: q002
    type: multipleChoice
    prompt: Which description best fits an ionic solid such as $\text{MgO}$?
    choices:
      - id: a
        text: Discrete molecules held together only by dispersion forces
      - id: b
        text: A lattice of oppositely charged ions
      - id: c
        text: A lattice of atoms joined solely by metallic bonds
      - id: d
        text: Individual atoms with no attractions
    answer:
      choiceId: b
    explanation: Ionic solids consist of repeating arrays of cations and anions held together by electrostatic attraction.
  - id: q003
    type: multipleChoice
    prompt: Which substance is most likely a covalent-network solid?
    choices:
      - id: a
        text: $\text{CO}_2(s)$
      - id: b
        text: $\text{NaCl}(s)$
      - id: c
        text: diamond, C(s)
      - id: d
        text: Ar(s)
    answer:
      choiceId: c
    explanation: Diamond is a continuous network of carbon atoms connected by strong covalent bonds.
  - id: q004
    type: multipleChoice
    prompt: Which solid should have the lowest melting point under comparable conditions?
    choices:
      - id: a
        text: A covalent-network solid
      - id: b
        text: An ionic solid
      - id: c
        text: A small nonpolar molecular solid
      - id: d
        text: A ceramic lattice
    answer:
      choiceId: c
    explanation: Small nonpolar molecular solids are held together mainly by weak London dispersion forces.
  - id: q005
    type: multipleChoice
    prompt: Why does solid sodium chloride not conduct electricity, whereas molten sodium chloride does?
    choices:
      - id: a
        text: Melting creates electrons in sodium chloride.
      - id: b
        text: Ions are fixed in the solid but mobile in the liquid.
      - id: c
        text: Chloride ions disappear during melting.
      - id: d
        text: The solid has no ions.
    answer:
      choiceId: b
    explanation: Charge is carried by ions. They cannot move through a rigid ionic lattice but can move when the lattice melts.
  - id: q006
    type: selectAll
    prompt: Select all properties that commonly indicate a covalent-network solid.
    choices:
      - id: a
        text: Very high melting point
      - id: b
        text: Many strong covalent bonds extend throughout the sample
      - id: c
        text: Readily conducts electricity because ions move freely
      - id: d
        text: Often hard and brittle
    answer:
      choiceIds:
        - a
        - b
        - d
    explanation: Extended covalent bonds produce hard, high-melting materials. Most covalent-network solids lack mobile ions or electrons.
  - id: q007
    type: multipleChoice
    prompt: During melting of a molecular solid, which change occurs?
    choices:
      - id: a
        text: Covalent bonds within every molecule break.
      - id: b
        text: Intermolecular attractions are partly overcome so molecules can move past one another.
      - id: c
        text: Atoms become ions.
      - id: d
        text: All particle motion stops.
    answer:
      choiceId: b
    explanation: A physical phase change changes the arrangement and motion of particles, not the covalent identity of each molecule.
  - id: q008
    type: multipleChoice
    prompt: Which comparison correctly orders particle spacing from closest to farthest for a typical substance?
    choices:
      - id: a
        text: gas, liquid, solid
      - id: b
        text: solid, liquid, gas
      - id: c
        text: liquid, gas, solid
      - id: d
        text: all three have identical spacing
    answer:
      choiceId: b
    explanation: Solids generally pack most closely, liquids remain close, and gas particles are widely separated.
  - id: q009
    type: multipleChoice
    prompt: 'Solid dry ice, $\text{CO}_2(s)$, is best classified as:'
    choices:
      - id: a
        text: an ionic solid
      - id: b
        text: a molecular solid
      - id: c
        text: a covalent-network solid
      - id: d
        text: a metallic solid
    answer:
      choiceId: b
    explanation: Dry ice contains discrete $\text{CO}_2$ molecules held together by intermolecular attractions.
  - id: q010
    type: multipleChoice
    prompt: 'A gas fills its container because its particles:'
    choices:
      - id: a
        text: vibrate in fixed locations.
      - id: b
        text: are joined in a permanent lattice.
      - id: c
        text: move freely and are far apart compared with their size.
      - id: d
        text: have stronger attractions than solids.
    answer:
      choiceId: c
    explanation: Gas particles move independently through mostly empty space, so they spread to occupy the available volume.
  - id: q011
    type: multipleChoice
    prompt: Which feature most directly explains the high melting point of an ionic solid?
    choices:
      - id: a
        text: Strong attractions between oppositely charged ions
      - id: b
        text: Weak dispersion forces between atoms
      - id: c
        text: Complete absence of particle motion
      - id: d
        text: Molecules sliding past each other
    answer:
      choiceId: a
    explanation: Separating a lattice of oppositely charged ions requires substantial energy.
  - id: q012
    type: multipleChoice
    prompt: 'A sample is hard, brittle, has a high melting point, and conducts when dissolved in water. It is most likely:'
    choices:
      - id: a
        text: ionic
      - id: b
        text: molecular and nonpolar
      - id: c
        text: a noble gas
      - id: d
        text: a simple liquid
    answer:
      choiceId: a
    explanation: These are characteristic properties of ionic compounds; dissolved ions are mobile and conduct electricity.
