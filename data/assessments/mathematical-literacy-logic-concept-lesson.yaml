  - id: s05
    title: Do not reverse conditionals
    required: true
    content: The converse swaps hypothesis and conclusion; it is a different statement.
    media: []
    check:
      id: check-005
      type: multipleChoice
      prompt: What is the converse of “if P then Q”?
      choices:
      - id: a
        text: if Q then P
        media: []
        issueSignals: []
      - id: b
        text: if not P then not Q
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: c
        text: if not Q then not P
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: d
        text: P if and only if Q
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: if Q then P.

        Why it works: The converse swaps the hypothesis and the conclusion.

        Why the other choices fail: 'if not P then not Q' is the inverse. 'if not Q then not P' is the contrapositive. 'P if and only if Q' is a biconditional.
