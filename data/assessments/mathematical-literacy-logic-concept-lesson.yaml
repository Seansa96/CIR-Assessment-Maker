  introduction: 'This lesson develops Mathematical Statements: Scope and Logic through the exact notation, definitions, and proof structures in the approved source packet. Read the stated condition before drawing a conclusion.'
  sections:
  - id: s01
    title: Identify statements
    required: true
    content: A statement has a definite truth value; commands, questions, and unresolved open sentences do not.
    media: []
    check:
      id: check-001
      type: multipleChoice
      prompt: Is “$2+3=5$” a statement?
      choices:
      - id: a
        text: Yes, because it has a definite truth value.
        media: []
        issueSignals: []
      - id: b
        text: No, because it does not have any variables.
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: c
        text: Yes, but only if it is true.
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: d
        text: No, it is an open sentence.
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: Yes, because it has a definite truth value.

        Why it works: A statement is a mathematical sentence that is either true or false. Since +3=5$ is true, it is a statement.

        Why the other choices fail: A statement does not need variables, and false sentences are still statements. It is not an open sentence because there are no unbound variables.
