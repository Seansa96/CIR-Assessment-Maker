  - id: s02
    title: Recognize open sentences
    required: true
    content: A variable-containing sentence whose truth changes with the variable value is an open sentence until a value or quantifier is supplied.
    media: []
    check:
      id: check-002
      type: multipleChoice
      prompt: Is “$x+1>0$” an open sentence without a stated domain or quantifier?
      choices:
      - id: a
        text: Yes, because its truth value depends on $.
        media: []
        issueSignals: []
      - id: b
        text: No, it is a false statement.
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: c
        text: No, it is an inequality, not a sentence.
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: d
        text: Yes, because $ is positive.
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: Yes, because its truth value depends on $.

        Why it works: The truth of +1>0$ changes depending on what number replaces $.

        Why the other choices fail: It cannot be evaluated as true or false without a domain or quantifier. Inequalities are mathematical sentences. The value of $ is not given, so we cannot claim it is positive.
