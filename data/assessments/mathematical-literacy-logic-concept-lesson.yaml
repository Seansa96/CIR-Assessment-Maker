lesson:
  introduction: |
    Formal mathematical sentences say exactly who is being discussed and what is claimed. Read the outermost connective or quantifier first, then work inward.
  sections:
  - id: s01
    title: A statement has a truth value
    content: |-
      A mathematical statement is capable of being true or false. A command, a question, or a sentence with an unbound variable is not yet a complete statement.


      First identify whether the line is a complete claim, an open sentence, or a request; only a complete claim has a truth value.
  - id: s02
    title: Conditionals have a direction
    content: |-
      “If P, then Q” promises that P is sufficient for Q. It does not automatically promise that Q implies P. Label the hypothesis P and conclusion Q before deciding whether a converse is justified.


      Mark the hypothesis and conclusion before evaluating the conditional or considering its converse.
  - id: s03
    title: Quantifiers control scope
    content: |-
      $\forall$ means “for every,” while $\exists$ means “there exists.” In $\forall x\,\exists y$, the choice of y may depend on x; reversing those symbols makes a different claim.


      Translate a symbolic statement into a full sentence and check that each domain restriction survives.
  - id: s04
    title: Negate the whole claim
    content: |
      To negate “every object has a property,” look for one object that fails the property. To negate “there exists an object,” assert that no object has the property. Change both the quantifier and the assertion it governs.
