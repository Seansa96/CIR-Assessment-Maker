  - id: s06
    title: Name truth status
    required: true
    content: A complete mathematical statement is either true or false, even if it is difficult to determine which.
    media: []
    check:
      id: check-006
      type: multipleChoice
      prompt: What two truth values can a statement have?
      choices:
      - id: a
        text: true or false
        media: []
        issueSignals: []
      - id: b
        text: true, false, or undefined
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: c
        text: positive or negative
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: d
        text: open or closed
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: true or false.

        Why it works: By definition, a mathematical statement is a declarative sentence that is either true or false.

        Why the other choices fail: In classical logic, statements cannot be undefined or open; they must evaluate to exactly one of the two truth values.
