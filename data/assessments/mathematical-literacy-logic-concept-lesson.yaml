  - id: s04
    title: Read a conditional
    required: true
    content: A conditional has a hypothesis and conclusion and is false only when its hypothesis is true and its conclusion is false.
    media: []
    check:
      id: check-004
      type: multipleChoice
      prompt: When is “if P then Q” false?
      choices:
      - id: a
        text: when P is true and Q is false
        media: []
        issueSignals: []
      - id: b
        text: when both P and Q are false
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: c
        text: when P is false and Q is true
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: d
        text: whenever Q is false
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: when P is true and Q is false.

        Why it works: A conditional only fails when a true hypothesis leads to a false conclusion.

        Why the other choices fail: If the hypothesis P is false, the conditional is considered vacuously true, regardless of Q.
