      explanation: >-
        Solution: whether the line is a statement.

        Why it works: You cannot assign a truth value to a command, question, or open sentence, so you must verify it is a statement first.

        Why the other choices fail: Solving for variables or numeric answers, or classifying equations, does not apply if the text is not even a statement to begin with.
