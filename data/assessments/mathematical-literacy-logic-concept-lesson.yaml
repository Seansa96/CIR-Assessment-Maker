  - id: s03
    title: Use a stated domain
    required: true
    content: A sentence with a variable can still be a statement when a domain makes its truth definite.
    media: []
    check:
      id: check-003
      type: multipleChoice
      prompt: Why can a variable-containing sentence be a statement?
      choices:
      - id: a
        text: Its truth is fixed by the stated domain.
        media: []
        issueSignals: []
      - id: b
        text: Because variables always represent numbers.
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: c
        text: Because it contains an equals sign.
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      - id: d
        text: Because the variable can be solved for.
        media: []
        issueSignals:
        - id: mathematical-structure-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: Its truth is fixed by the stated domain.

        Why it works: When a domain is specified (e.g., 'For every real number $'), the sentence makes a definite claim.

        Why the other choices fail: Just having a variable or an equals sign does not fix truth value (e.g. =5$ is open). Solving for a variable finds values, but doesn't make the expression itself a statement.
