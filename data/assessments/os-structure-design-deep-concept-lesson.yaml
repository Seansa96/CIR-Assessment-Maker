lesson:
  introduction: This deeper lesson expands Operating System Structure and Design from Chapters 1 and 12 of the Modern Operating Systems reference structure. It focuses on mechanism, boundary, tradeoff, and common failure modes rather than memorized labels.
  sections:
  - id: monolithic-tradeoff
    title: Monolithic kernel tradeoff
    required: true
    content: 'A monolithic kernel keeps many services in one privileged address space, making internal calls fast but increasing the blast radius of kernel bugs.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Operating System Structure and Design, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: monolithic-tradeoff-deep-check
      title: 'Check: Monolithic kernel tradeoff'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Monolithic kernel tradeoff**?
      choices:
      - id: a
        text: Fast internal calls trade against fault isolation.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Fast internal calls trade against fault isolation. Related topic: Operating System Structure and Design.'
  - id: microkernel-tradeoff
    title: Microkernel tradeoff
    required: true
    content: 'A microkernel moves services into user processes and keeps only minimal mechanisms in the kernel, improving isolation but increasing communication costs.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Operating System Structure and Design, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: microkernel-tradeoff-deep-check
      title: 'Check: Microkernel tradeoff'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Microkernel tradeoff**?
      choices:
      - id: a
        text: Isolation and modularity often cost extra message passing.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Isolation and modularity often cost extra message passing. Related topic: Operating System Structure and Design.'
  - id: layering-boundaries
    title: Layered boundaries
    required: true
    content: 'Layering limits dependency directions so each level can rely only on lower-level services.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Operating System Structure and Design, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: layering-boundaries-deep-check
      title: 'Check: Layered boundaries'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Layered boundaries**?
      choices:
      - id: a
        text: Layering improves reasoning by controlling dependencies.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Layering improves reasoning by controlling dependencies. Related topic: Operating System Structure and Design.'
  - id: mechanism-policy
    title: Mechanism versus policy
    required: true
    content: 'Mechanism provides the capability to do something; policy decides which choice should be made.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Operating System Structure and Design, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: mechanism-policy-deep-check
      title: 'Check: Mechanism versus policy'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Mechanism versus policy**?
      choices:
      - id: a
        text: Separating mechanism from policy makes behavior easier to change.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Separating mechanism from policy makes behavior easier to change. Related topic: Operating System Structure and Design.'
  - id: interface-design
    title: Interface design
    required: true
    content: 'OS interfaces should be stable, minimal where possible, and expressive enough for real programs without exposing unnecessary hardware accidents.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Operating System Structure and Design, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: interface-design-deep-check
      title: 'Check: Interface design'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Interface design**?
      choices:
      - id: a
        text: Interface design controls long-term compatibility.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Interface design controls long-term compatibility. Related topic: Operating System Structure and Design.'
