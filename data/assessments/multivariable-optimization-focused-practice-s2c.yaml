    Choice d, ''An absolute maximum'', does not give ''A saddle point'' for ''If D is negative at a critical point, what is
    it?''. It substitutes a different result, representation, or condition for the one the prompt specifies.'
- id: q003
  type: multipleChoice
  prompt: What equation begins a Lagrange multiplier problem?
  choices:
  - id: a
    text: '$\nabla f=\lambda\nabla g$'
  - id: b
    text: $f=g$
    issueSignals:
    - id: algebraic-simplification-error
  - id: c
    text: $f_x=f_y$
    issueSignals:
    - id: algebraic-simplification-error
  - id: d
    text: '$\nabla f=0$ only'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: algebraic-simplification-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: At a constrained extremum the gradients are parallel.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Classical Theorems of Differential
    Calculus.

    Why the other choices fail: Choice b, ''$f=g$'', does not give ''$\nabla f=\lambda\nabla g$'' for ''What equation begins
