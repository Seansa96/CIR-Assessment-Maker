questions:
- id: q001
  type: multipleChoice
  prompt: What is required at an interior differentiable critical point?
  choices:
  - id: a
    text: $f_x=0$ and $f_y=0$
  - id: b
    text: $f=0$
    issueSignals:
    - id: algebraic-simplification-error
  - id: c
    text: $f_{xy}=0$
    issueSignals:
    - id: algebraic-simplification-error
  - id: d
    text: $x=y$
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: algebraic-simplification-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Both first-order directions must have zero rate.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Classical Theorems of Differential
    Calculus.

    Why the other choices fail: Choice b, ''$f=0$'', does not give ''$f_x=0$ and $f_y=0$'' for ''What is required at an interior
    differentiable critical point?''. It substitutes a different result, representation, or condition for the one the prompt
    specifies.

    Choice c, ''$f_{xy}=0$'', does not give ''$f_x=0$ and $f_y=0$'' for ''What is required at an interior differentiable critical
    point?''. It substitutes a different result, representation, or condition for the one the prompt specifies.

    Choice d, ''$x=y$'', does not give ''$f_x=0$ and $f_y=0$'' for ''What is required at an interior differentiable critical
    point?''. It substitutes a different result, representation, or condition for the one the prompt specifies.'
