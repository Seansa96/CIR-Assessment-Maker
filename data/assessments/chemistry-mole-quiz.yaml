schemaVersion: 1
id: chemistry-mole-quiz
title: Mole Concept and Molar Mass Quiz
assessmentType: quiz
categoryId: chemistry
subcategoryId: chemistry-stoichiometry
subcategoryIds:
  - chemistry-stoichiometry
modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: numericResponse
    prompt: |
      How many moles of aluminum (Al) are in 54.0 g of aluminum? (M(Al) = 26.98 g/mol)
    answer:
      value: 2.00
      tolerance: 0.02
    explanation: |
      n = m / M = 54.0 / 26.98 = 2.001 mol ≈ 2.00 mol.

  - id: q002
    type: numericResponse
    prompt: |
      What mass (in grams) of NaCl corresponds to 0.750 mol of NaCl?
      (M(Na) = 22.990, M(Cl) = 35.453 g/mol)
    answer:
      value: 43.8
      tolerance: 0.2
    explanation: |
      M(NaCl) = 22.990 + 35.453 = 58.443 g/mol. m = 0.750 × 58.443 = 43.83 g ≈ 43.8 g.

  - id: q003
    type: numericResponse
    prompt: |
      Calculate the molar mass of sulfuric acid, H2SO4, in g/mol.
      (H = 1.008, S = 32.065, O = 15.999 g/mol)
    answer:
      value: 98.08
      tolerance: 0.05
    explanation: |
      M = 2(1.008) + 32.065 + 4(15.999) = 2.016 + 32.065 + 63.996 = 98.077 g/mol.

  - id: q004
    type: multipleChoice
    prompt: |
      How many molecules of CO2 are in 2.50 mol of CO2?
    choices:
      - id: a
        text: 1.51 × 10²⁴ molecules
      - id: b
        text: 6.02 × 10²³ molecules
      - id: c
        text: 2.50 × 10²³ molecules
      - id: d
        text: 1.20 × 10²⁴ atoms
    answer:
      choiceId: a
    explanation: |
      Molecules = n × NA = 2.50 × 6.022 × 10²³ = 1.506 × 10²⁴ ≈ 1.51 × 10²⁴ molecules.

  - id: q005
    type: numericResponse
    prompt: |
      What is the percent composition of hydrogen in NH3?
      (H = 1.008, N = 14.007 g/mol). Express as a percentage to 2 decimal places.
    answer:
      value: 17.76
      tolerance: 0.05
    explanation: |
      M(NH3) = 14.007 + 3(1.008) = 17.031 g/mol. %H = 3(1.008)/17.031 × 100% = 17.76%.

  - id: q006
    type: numericResponse
    prompt: |
      What is the percent composition of oxygen in Fe2O3?
      (Fe = 55.845, O = 15.999 g/mol). Express as a percentage to 1 decimal place.
    answer:
      value: 30.1
      tolerance: 0.1
    explanation: |
      M(Fe2O3) = 2(55.845) + 3(15.999) = 159.687 g/mol. %O = 3(15.999)/159.687 × 100% = 30.06% ≈ 30.1%.

  - id: q007
    type: multipleChoice
    prompt: |
      A student needs 3.01 × 10²³ atoms of copper (Cu). How many moles does the student need?
    choices:
      - id: a
        text: 0.500 mol
      - id: b
        text: 1.00 mol
      - id: c
        text: 3.01 mol
      - id: d
        text: 0.250 mol
    answer:
      choiceId: a
    explanation: |
      n = atoms / NA = 3.01 × 10²³ / 6.022 × 10²³ = 0.500 mol.

  - id: q008
    type: numericResponse
    prompt: |
      Calculate the molar mass of Ca3(PO4)2 in g/mol.
      (Ca = 40.078, P = 30.974, O = 15.999 g/mol)
    answer:
      value: 310.18
      tolerance: 0.2
    explanation: |
      M = 3(40.078) + 2(30.974) + 8(15.999) = 120.234 + 61.948 + 127.992 = 310.174 g/mol.

  - id: q009
    type: multipleChoice
    prompt: |
      A compound has the empirical formula CH2O and a molar mass of about 180 g/mol. The molecular formula is most likely:
    choices:
      - id: a
        text: C6H12O6
      - id: b
        text: C3H6O3
      - id: c
        text: CH2O
      - id: d
        text: C2H4O2
    answer:
      choiceId: a
    explanation: |
      M(CH2O) = 12.011 + 2(1.008) + 15.999 = 30.026 g/mol. Multiplier n = 180/30 = 6. Molecular formula = C6H12O6 (glucose).

  - id: q010
    type: multipleChoice
    prompt: |
      How many total atoms are in 2.00 mol of CO2?
      (Each molecule has 3 atoms: 1 C + 2 O)
    choices:
      - id: a
        text: 1.20 × 10²⁴ atoms
      - id: b
        text: 3.61 × 10²⁴ atoms
      - id: c
        text: 2.00 × 10²³ atoms
      - id: d
        text: 6.02 × 10²³ atoms
    answer:
      choiceId: b
    explanation: |
      Molecules = 2.00 × 6.022 × 10²³ = 1.204 × 10²⁴ molecules. Each has 3 atoms: 1.204 × 10²⁴ × 3 = 3.613 × 10²⁴ atoms.

  - id: q011
    type: multipleChoice
    prompt: |
      Which sample contains the greatest number of moles?
    choices:
      - id: a
        text: 100 g of H2O (M = 18.02 g/mol) → 5.55 mol
      - id: b
        text: 100 g of NaCl (M = 58.44 g/mol) → 1.71 mol
      - id: c
        text: 100 g of Fe (M = 55.85 g/mol) → 1.79 mol
      - id: d
        text: 100 g of CaCO3 (M = 100.09 g/mol) → 1.00 mol
    answer:
      choiceId: a
    explanation: |
      For a fixed mass, the compound with the smallest molar mass contains the most moles. H2O (18.02 g/mol) gives 100/18.02 = 5.55 mol — by far the most.

  - id: q012
    type: numericResponse
    prompt: |
      A sample of ethanol (C2H5OH) has a mass of 23.0 g. How many moles of ethanol is this?
      (C = 12.011, H = 1.008, O = 15.999 g/mol)
    answer:
      value: 0.499
      tolerance: 0.01
    explanation: |
      M(C2H5OH) = 2(12.011) + 6(1.008) + 15.999 = 24.022 + 6.048 + 15.999 = 46.069 g/mol. n = 23.0 / 46.069 = 0.4993 mol ≈ 0.499 mol.


