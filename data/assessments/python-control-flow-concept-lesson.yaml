lesson:
  introduction: 'Games are entirely built on decisions: *If* the player''s health
    is 0, they die. *If* they use a fire spell on an ice monster, it deals double
    damage. *Else*, it deals normal damage.


    This lesson covers the `if/elif/else` branching structures and logical operators
    (`and`, `or`, `not`) that allow your Python code to make decisions based on changing
    state.

    '
  sections:
  - id: if-statements
    title: The if, elif, and else statements
    required: true
    content: "The `if` statement checks a condition. If the condition is `True`, the\
      \ indented block of code underneath it runs.\n\nYou can use `elif` (else if)\
      \ to check additional conditions if the first one was false. Finally, `else`\
      \ catches anything that wasn't caught by the previous conditions.\n\n```python\n\
      player_health = 15\n\nif player_health <= 0:\n    print(\"Game Over!\")\nelif\
      \ player_health < 20:\n    print(\"Warning: Health is low!\")\nelse:\n    print(\"\
      You are in good condition.\")\n```\n\nRemember: As soon as one condition evaluates\
      \ to `True`, its block runs, and Python skips the rest of the `elif`/`else`\
      \ chain.\n"
    check:
      id: if-statements-check
      type: multipleChoice
      prompt: "If `enemy_hp = 50`, what will this code print?\n\n```python\nif enemy_hp\
        \ > 0:\n    print(\"Enemy is alive.\")\nelif enemy_hp > 25:\n    print(\"\
        Enemy is strong.\")\nelse:\n    print(\"Enemy is dead.\")\n```\n"
      choices:
      - id: a
        text: '`Enemy is alive.`'
      - id: b
        text: '`Enemy is strong.`'
      - id: c
        text: '`Enemy is alive.`

          `Enemy is strong.`

          '
      - id: d
        text: '`Enemy is dead.`'
      answer:
        choiceId: a
      explanation: 'Because `50 > 0` is `True`, the first block runs. The `elif` is
        skipped entirely, even though `50 > 25` is also technically true. If you want
        both to print, you must use two separate `if` statements instead of `if/elif`.

        '
  - id: logical-operators
    title: Logical Operators (and, or, not)
    required: true
    content: "Sometimes a single comparison isn't enough. You can combine conditions\
      \ using `and`, `or`, and `not`.\n\n- `and`: Both sides must be `True`.\n- `or`:\
      \ At least one side must be `True`.\n- `not`: Flips the boolean value (True\
      \ becomes False).\n\n```python\nhas_key = True\ndoor_unlocked = False\n\nif\
      \ has_key and not door_unlocked:\n    print(\"You use the key to unlock the\
      \ door.\")\n    door_unlocked = True\n```\n\nAnother example:\n```python\nmana\
      \ = 10\nhas_potion = True\n\nif mana >= 20 or has_potion:\n    print(\"You can\
      \ cast the spell!\")\n```\n"
    check:
      id: logical-operators-check
      type: multipleChoice
      prompt: "Which combination of variables allows the player to enter the VIP room?\n\
        \n```python\nif level >= 10 and (has_vip_pass or gold >= 500):\n    print(\"\
        You enter the VIP room.\")\n```\n"
      choices:
      - id: a
        text: '`level = 5`, `has_vip_pass = True`, `gold = 1000`'
      - id: b
        text: '`level = 10`, `has_vip_pass = False`, `gold = 100`'
      - id: c
        text: '`level = 12`, `has_vip_pass = True`, `gold = 0`'
      - id: d
        text: '`level = 9`, `has_vip_pass = False`, `gold = 600`'
      answer:
        choiceId: c
      explanation: 'For the whole expression to be True, `level >= 10` MUST be true.
        Then, the player needs EITHER a VIP pass OR at least 500 gold. Option C is
        level 12 (True) and has the pass (True).

        '
  - id: match-case
    title: Match-Case (Python 3.10+)
    required: true
    content: "If you are checking the exact value of a single variable against many\
      \ possibilities, you can use the `match` statement (introduced in Python 3.10).\
      \ It is similar to `switch` in other languages.\n\n```python\naction = input(\"\
      What do you do? (attack/defend/run): \")\n\nmatch action:\n    case \"attack\"\
      :\n        print(\"You swing your sword!\")\n    case \"defend\":\n        print(\"\
      You raise your shield!\")\n    case \"run\":\n        print(\"You flee the battle!\"\
      )\n    case _:\n        print(\"Invalid action.\")\n```\n\nThe `case _:` acts\
      \ as the default or \"catch-all\" if none of the specific cases match.\n"
    check:
      id: match-case-check
      type: multipleChoice
      prompt: 'What acts as the "default" case in a Python `match` statement?

        '
      choices:
      - id: a
        text: '`case default:`'
      - id: b
        text: '`case _:`'
      - id: c
        text: '`case else:`'
      - id: d
        text: '`default:`'
      answer:
        choiceId: b
      explanation: 'The underscore `_` is the wildcard pattern in Python, meaning
        it matches anything that hasn''t been matched yet.

        '
