skills: [recognize separable equations, solve separable IVPs, model mixtures]
items:
- id: factor-form
  type: flashcard
  prompt: What factor form identifies a separable first-order equation?
  answer: { expected: "dy/dx equals a function of x times a function of y.", aliases: ['y''=g(x)f(y)'] }
  explanation: All $x$ dependence and $y$ dependence can be placed on opposite sides.
  tags: [definition]
- id: separation
  type: cloze
  prompt: For $y'=g(x)f(y)$, divide by ____ before integrating.
  answer: { expected: 'f(y)' }
  explanation: This places the $y$ expression with $dy$.
  tags: [method]
- id: integrate-both
  type: flashcard
  prompt: After variables are separated, what operation is applied to both sides?
  answer: { expected: Integrate }
  explanation: Separation converts the differential equation into an integral equation.
  tags: [method]
- id: constant
  type: flashcard
  prompt: Why is an arbitrary constant included after integrating a separable equation?
  answer: { expected: 'Integration produces a family of antiderivatives.' }
  explanation: An initial condition can then determine a particular member.
  tags: [general-solution]
- id: lost-solutions
  type: flashcard
  prompt: What must be checked before dividing by a $y$-dependent factor?
  answer: { expected: 'Whether setting that factor equal to zero gives an equilibrium solution.' }
  explanation: Division can discard a constant solution.
  tags: [equilibrium]
- id: salt-balance
  type: cloze
  prompt: In a mixing model, amount rate of change equals rate in minus rate ____.
  answer: { expected: out }
  explanation: This is the conservation balance for solute.
  tags: [modeling]
- id: out-concentration
  type: flashcard
  prompt: What is the concentration of solute in a well-stirred tank containing amount $y$ and volume $V$?
  answer: { expected: 'y/V', aliases: ['y divided by V'] }
  explanation: Concentration is amount per volume.
  tags: [mixing]
- id: initial-condition
  type: flashcard
  prompt: When should an initial condition be applied in a separable-equation solution?
  answer: { expected: 'After integration, to determine the arbitrary constant.' }
  explanation: The condition selects a particular solution.
  tags: [ivp]
