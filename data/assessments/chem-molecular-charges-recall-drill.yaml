items:
- id: r001
  type: typed
  prompt: Define formal charge and name the representation in which it is used.
  answer:
    expected: The bookkeeping charge obtained by assigning each atom all nonbonding electrons and half the bonding electrons.
    aliases:
    - formal charge
  explanation: 'Solution: The bookkeeping charge obtained by assigning each atom all nonbonding electrons and half the bonding
    electrons. Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a
    conclusion.'
- id: r002
  type: typed
  prompt: What does formal-charge sum tell you to count or distinguish?
  answer:
    expected: The requirement that all atomic formal charges add to the species' net charge.
    aliases:
    - formal-charge sum
  explanation: 'Solution: The requirement that all atomic formal charges add to the species'' net charge. Why it works: The
    definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r003
  type: typed
  prompt: State one condition that must be checked when using dominant contributor.
  answer:
    expected: A Lewis contributor favored by small formal charges, appropriate charge placement, and complete shells when
      possible.
    aliases:
    - dominant contributor
  explanation: 'Solution: A Lewis contributor favored by small formal charges, appropriate charge placement, and complete
    shells when possible. Why it works: The definition identifies the exact model feature needed before applying a rule or
    drawing a conclusion.'
- id: r004
  type: typed
  prompt: Connect resonance contributor to an observable or particle-level consequence.
  answer:
    expected: One of two or more valid Lewis structures with the same atom arrangement but different electron placement.
    aliases:
    - resonance contributor
  explanation: 'Solution: One of two or more valid Lewis structures with the same atom arrangement but different electron
    placement. Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a
    conclusion.'
- id: r005
  type: typed
  prompt: Define resonance hybrid and name the representation in which it is used.
  answer:
    expected: The actual delocalized structure represented collectively by its resonance contributors.
    aliases:
    - resonance hybrid
  explanation: 'Solution: The actual delocalized structure represented collectively by its resonance contributors. Why it
    works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r006
  type: typed
  prompt: What does delocalization tell you to count or distinguish?
  answer:
    expected: Distribution of bonding or charge over more than one localized atom pair or position.
    aliases:
    - delocalization
  explanation: 'Solution: Distribution of bonding or charge over more than one localized atom pair or position. Why it works:
    The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r007
  type: typed
  prompt: State one condition that must be checked when using fractional bond order.
  answer:
    expected: An average bond order produced when equivalent bonds are represented across resonance contributors.
    aliases:
    - fractional bond order
  explanation: 'Solution: An average bond order produced when equivalent bonds are represented across resonance contributors.
    Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r008
  type: typed
  prompt: Connect equivalent bond to an observable or particle-level consequence.
  answer:
    expected: A bond experimentally indistinguishable from another because of symmetry or delocalization.
    aliases:
    - equivalent bond
  explanation: 'Solution: A bond experimentally indistinguishable from another because of symmetry or delocalization. Why
    it works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r009
  type: typed
  prompt: Define Lewis structure and name the representation in which it is used.
  answer:
    expected: An electron-bookkeeping drawing showing bonds, lone pairs, and sometimes formal charges.
    aliases:
    - Lewis structure
  explanation: 'Solution: An electron-bookkeeping drawing showing bonds, lone pairs, and sometimes formal charges. Why it
    works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r010
  type: typed
  prompt: What does lone pair tell you to count or distinguish?
  answer:
    expected: A localized pair of valence electrons not shared between two atoms.
    aliases:
    - lone pair
  explanation: 'Solution: A localized pair of valence electrons not shared between two atoms. Why it works: The definition
    identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r011
  type: typed
  prompt: State one condition that must be checked when using bonding pair.
  answer:
    expected: A pair of electrons shared between two bonded atoms.
    aliases:
    - bonding pair
  explanation: 'Solution: A pair of electrons shared between two bonded atoms. Why it works: The definition identifies the
    exact model feature needed before applying a rule or drawing a conclusion.'
- id: r012
  type: typed
  prompt: Connect valence electron to an observable or particle-level consequence.
  answer:
    expected: An electron in the occupied outer shell that can participate in bonding or ion formation.
    aliases:
    - valence electron
  explanation: 'Solution: An electron in the occupied outer shell that can participate in bonding or ion formation. Why it
    works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
