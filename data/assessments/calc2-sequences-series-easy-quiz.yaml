- id: q001
  type: multipleChoice
  skills:
  - distinguish-sequences-from-series
  prompt: |
    For a series $\sum_{n=1}^{\infty}a_n$, which sequence must converge for
    the series itself to converge?
  choices:
  - id: a
    text: $a_n$
  - id: b
    text: |-
      $S_N=\sum_{n=1}^{N}a_n$
  - id: c
    text: $a_{n+1}/a_n$
  - id: d
    text: $|a_n|/N$
  answer:
    choiceId: b
  explanation: |-
    Solution: An infinite series is defined as the limit of its finite partial sums, so convergence means $S_N$ approaches a finite number. Therefore the answer is $S_N=\sum_{n=1}^{N}a_n$.

    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

    Why the other choices fail: $a_n$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $a_{n+1}/a_n$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $|a_n|/N$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
