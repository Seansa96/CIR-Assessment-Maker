  prompt: |
    For $n\ge2$, a series has $S_n=n/(n+1)$. Which expression is its $n$th term?
  choices:
  - id: a
    text: $1/(n+1)$
  - id: b
    text: $1/[n(n+1)]$
  - id: c
    text: $n/(n+1)$
  - id: d
    text: $-1/[n(n+1)]$
