- id: q005
  type: multipleChoice
  skills:
  - derive-telescoping-partial-sums
  prompt: |
    Given $a_n=1/n-1/(n+1)$, which formula equals
    $S_N=\sum_{n=1}^{N}a_n$?
  choices:
  - id: a
    text: $1-1/(N+1)$
  - id: b
    text: $1-1/N$
  - id: c
    text: $1+1/(N+1)$
  - id: d
    text: $N/(N+1)+1/N$
  answer:
    choiceId: a
  explanation: |-
    Solution: Expanding the finite sum cancels every reciprocal from $1/2$ through $1/N$, leaving $1-1/(N+1)$. Therefore the answer is $1-1/(N+1)$.

    Why it works: Rewrite the general term so consecutive partial-sum terms cancel. Write $S_N$ explicitly, cancel only terms that occur with opposite signs, and then take $N\to\infty$ to obtain the infinite-series result.

    Common trap: Do not cancel nonadjacent terms by inspection without writing $S_N$; the surviving last term usually depends on $N$ and must be sent to its limit.

    Why the other choices fail: $1-1/N$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; $1+1/(N+1)$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; $N/(N+1)+1/N$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel.
