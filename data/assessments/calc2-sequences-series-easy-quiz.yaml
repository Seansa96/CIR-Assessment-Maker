modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - distinguish-sequences-from-series
  prompt: |
    For a series $\sum_{n=1}^{\infty}a_n$, which sequence must converge for
    the series itself to converge?
  choices:
  - id: a
    text: $a_n$
  - id: b
    text: |-
      $S_N=\sum_{n=1}^{N}a_n$
  - id: c
    text: $a_{n+1}/a_n$
  - id: d
    text: $|a_n|/N$
  answer:
    choiceId: b
  explanation: An infinite series is defined as the limit of its finite partial sums, so convergence means
    $S_N$ approaches a finite number.
- id: q002
  type: multipleChoice
  skills:
  - apply-the-divergence-test
  prompt: |
    Suppose $\lim_{n\to\infty}a_n=-3$. What can be concluded about
    $\sum_{n=1}^{\infty}a_n$?
  choices:
  - id: a
    text: It converges to $-3$.
  - id: b
    text: It converges absolutely.
  - id: c
    text: It diverges.
  - id: d
    text: The term test is inconclusive.
  answer:
    choiceId: c
  explanation: A convergent series must have terms tending to zero; the nonzero term limit violates that
    necessary condition.
- id: q003
  type: multipleChoice
  skills:
  - interpret-zero-term-limits
  prompt: |
    A student computes $\lim_{n\to\infty}a_n=0$. Which statement is always valid?
  choices:
  - id: a
    text: |-
      $\sum a_n$ converges.
  - id: b
    text: |-
      $\sum a_n$ diverges.
  - id: c
    text: The divergence test gives no conclusion.
  - id: d
    text: |-
      $\sum |a_n|$ converges.
  answer:
    choiceId: c
  explanation: The divergence test rejects nonzero or nonexistent term limits, but a zero limit is compatible
    with either convergence or divergence.
- id: q004
  type: multipleChoice
  skills:
  - compute-partial-sums
  prompt: |
    If $a_n=2^{-n}$, what is the third partial sum
    $S_3=\sum_{n=1}^{3}a_n$?
  choices:
  - id: a
    text: $3/4$
  - id: b
    text: $7/8$
  - id: c
    text: $1$
  - id: d
    text: $15/16$
  answer:
    choiceId: b
  explanation: 'Add the first three indexed terms: $1/2+1/4+1/8=7/8$.'
- id: q005
  type: multipleChoice
  skills:
  - derive-telescoping-partial-sums
  prompt: |
    Given $a_n=1/n-1/(n+1)$, which formula equals
    $S_N=\sum_{n=1}^{N}a_n$?
  choices:
  - id: a
    text: $1-1/(N+1)$
  - id: b
    text: $1-1/N$
  - id: c
    text: $1+1/(N+1)$
  - id: d
    text: $N/(N+1)+1/N$
  answer:
    choiceId: a
  explanation: Expanding the finite sum cancels every reciprocal from $1/2$ through $1/N$, leaving $1-1/(N+1)$.
- id: q006
  type: multipleChoice
  skills:
  - connect-partial-sums-to-series-values
  prompt: |
    A series has partial sums $S_N=4-3/(N+2)$. What is its sum?
  choices:
  - id: a
    text: $1$
  - id: b
    text: $3$
  - id: c
    text: $4$
  - id: d
    text: The series diverges.
  answer:
    choiceId: c
  explanation: |-
    Since $3/(N+2)\to0$, the defining limit of the partial sums is $\lim S_N=4$.
- id: q007
  type: multipleChoice
  skills:
  - recover-terms-from-partial-sums
  prompt: |
    For $n\ge2$, a series has $S_n=n/(n+1)$. Which expression is its $n$th term?
  choices:
  - id: a
    text: $1/(n+1)$
  - id: b
    text: $1/[n(n+1)]$
  - id: c
    text: $n/(n+1)$
  - id: d
    text: $-1/[n(n+1)]$
  answer:
    choiceId: b
  explanation: Compute $S_n-S_{n-1}=n/(n+1)-(n-1)/n=1/[n(n+1)]$.
- id: q008
  type: multipleChoice
  skills:
  - distinguish-bounded-terms-from-bounded-partial-sums
  prompt: |
    Which example disproves the claim “if $(a_n)$ is bounded, then
    $\sum a_n$ converges”?
  choices:
  - id: a
    text: $a_n=2^{-n}$
  - id: b
    text: $a_n=1$
  - id: c
    text: $a_n=0$
  - id: d
    text: $a_n=(-1)^n/n$
  answer:
    choiceId: b
  explanation: The constant terms are bounded, but their partial sums are $S_N=N$, which grow without
    bound.
- id: q009
  type: multipleChoice
  skills:
  - understand-finite-term-changes
  prompt: |
    A convergent series is changed only in its first four terms. What is guaranteed?
  choices:
  - id: a
    text: The modified series converges, though its sum may change.
  - id: b
    text: The modified series has exactly the same sum.
  - id: c
    text: The modified series must diverge.
  - id: d
    text: Its terms no longer approach zero.
  answer:
    choiceId: a
  explanation: Adding or subtracting a finite constant from every later partial sum preserves existence
    of a finite limit but shifts that limit.
- id: q010
  type: multipleChoice
  skills:
  - interpret-remainders
  prompt: |
    A convergent series has sum $S=5/3$ and $S_6=13/8$. What is the signed
    remainder $R_6=S-S_6$?
  choices:
  - id: a
    text: $1/24$
  - id: b
    text: $-1/24$
  - id: c
    text: $79/24$
  - id: d
    text: $5/24$
  answer:
    choiceId: a
  explanation: 'Use a common denominator: $5/3-13/8=40/24-39/24=1/24$.'
- id: q011
  type: multipleChoice
  skills:
  - analyze-positive-term-partial-sums
  prompt: |
    Assume $a_n\ge0$ for all $n$. Which additional fact is sufficient to prove
    $\sum a_n$ converges?
  choices:
  - id: a
    text: The partial sums are bounded above.
  - id: b
    text: The terms are bounded above.
  - id: c
    text: The first partial sum is positive.
  - id: d
    text: The terms are nonincreasing.
  answer:
    choiceId: a
  explanation: Positivity makes $S_N$ nondecreasing; an upper bound then invokes the monotone convergence
    theorem for the partial-sum sequence.
- id: q012
  type: multipleChoice
  skills:
  - diagnose-divergent-partial-sums
  prompt: |
    If $S_{2k}=0$ and $S_{2k+1}=1$ for every $k\ge1$, how does the series behave?
  choices:
  - id: a
    text: It converges to $1/2$.
  - id: b
    text: It converges to $0$.
  - id: c
    text: It diverges because its partial sums have two subsequential limits.
  - id: d
    text: It converges absolutely.
  answer:
    choiceId: c
  explanation: The even partial sums stay at $0$ while the odd partial sums stay at $1$, so $(S_N)$ has
    no single limit.
- id: q013
  type: multipleChoice
  skills:
  - recognize-geometric-series
  prompt: |
    Which series is geometric and convergent?
  choices:
  - id: a
    text: |-
      $\sum_{n=0}^{\infty}3(2/5)^n$
  - id: b
    text: |-
      $\sum_{n=1}^{\infty}1/n$
  - id: c
    text: |-
      $\sum_{n=1}^{\infty}n/2$
  - id: d
    text: |-
      $\sum_{n=0}^{\infty}4(3/2)^n$
  answer:
    choiceId: a
  explanation: The first choice has constant ratio $2/5$ with magnitude below one; the fourth is geometric
    but has ratio magnitude above one.
- id: q014
  type: multipleChoice
  skills:
  - evaluate-geometric-series
  prompt: |
    Evaluate $\sum_{n=2}^{\infty}6(1/3)^n$.
  choices:
  - id: a
    text: $1$
  - id: b
    text: $2$
  - id: c
    text: $3$
  - id: d
    text: $9$
  answer:
    choiceId: a
  explanation: The first included term is $6/9=2/3$ and the ratio is $1/3$, so the sum is $(2/3)/(1-1/3)=1$.
- id: q015
  type: multipleChoice
  skills:
  - combine-term-and-partial-sum-reasoning
  prompt: |
    Which statement is true for every real series $\sum a_n$?
  choices:
  - id: a
    text: If $(a_n)$ is bounded, then the series converges.
  - id: b
    text: |-
      If the partial sums converge, then $a_n\to0$.
  - id: c
    text: |-
      If $a_n\to0$, then the partial sums are bounded.
  - id: d
    text: If the partial sums are bounded, then they converge.
  answer:
    choiceId: b
  explanation: |-
    From $a_n=S_n-S_{n-1}$, convergence of both adjacent partial sums to the same limit forces $a_n\to0$.
