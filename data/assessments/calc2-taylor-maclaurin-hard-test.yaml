questions:
- id: q001
  type: freeResponse
  skills:
  - taylor-maclaurin
  blueprintId: calc2-taylor-maclaurin-expansion
  prompt: Find the coefficient of the $x^3$ term in the Maclaurin series for $f(x) = e^{3x}$.
  answer:
    value: 1.9994999999999998
    tolerance: 0.01
    gradingMode: selfCheck
  explanation: Maclaurin series for $e^u$ is $1 + u + u^2/2! + u^3/3!$. Let $u=2x$, so the $x^3$ term is $(2x)^3/6 = 8x^3/6 = (4/3)x^3$. Coefficient is 4/3 = 1.333.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires a representation choice, a series construction or transformation method, and an interval, remainder, or equality condition.
  prerequisiteObjectiveIds:
  - calc2-obj-power-series-representations
- id: q002
  type: freeResponse
  skills:
  - taylor-maclaurin
  blueprintId: calc2-taylor-maclaurin-evaluation
  prompt: Evaluate the infinite sum $\sum_{n=0}^{\infty} \frac{5^n}{n!}$.
  answer:
    value: 50.199999999999996
    tolerance: 0.1
    gradingMode: selfCheck
  explanation: This matches the Maclaurin series for $e^x = \sum \frac{x^n}{n!}$ evaluated at $x=3$. Thus the sum is $e^3 \approx 20.085$.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires a representation choice, a series construction or transformation method, and an interval, remainder, or equality condition.
  prerequisiteObjectiveIds:
  - calc2-obj-power-series-representations
- id: q003
  type: freeResponse
  skills:
  - taylor-maclaurin
  blueprintId: calc2-taylor-maclaurin-expansion
  prompt: Find the coefficient of $x^2$ in the Maclaurin series for $f(x) = x \sin(x)$.
  answer:
    value: 3.5
    tolerance: 0.01
    gradingMode: selfCheck
  explanation: Maclaurin series for $\sin x$ is $x - x^3/3! + ...$ Multiplying by $x$ gives $x^2 - x^4/3! + ...$. The coefficient of $x^2$ is 1.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires a representation choice, a series construction or transformation method, and an interval, remainder, or equality condition.
  prerequisiteObjectiveIds:
  - calc2-obj-power-series-representations
- id: q004
  type: freeResponse
  skills:
  - taylor-maclaurin
  blueprintId: calc2-taylor-maclaurin-evaluation
  prompt: Evaluate the infinite sum $\sum_{n=0}^{\infty} \frac{(-1)^n \pi^{2n+1}}{2^{2n+1} (2n+1)!}$.
  answer:
    value: 4.5
    tolerance: 0.01
    gradingMode: selfCheck
  explanation: This matches the Maclaurin series for $\sin(x) = \sum_{n=0}^{\infty} \frac{(-1)^n x^{2n+1}}{(2n+1)!}$ evaluated at $x = \pi/2$. Thus the sum is $\sin(\pi/2) = 1$.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires a representation choice, a series construction or transformation method, and an interval, remainder, or equality condition.
  prerequisiteObjectiveIds:
  - calc2-obj-power-series-representations
