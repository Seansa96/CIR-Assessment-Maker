questions:
- id: q001
  type: freeResponse
  prompt: Find the coefficient of the $x^3$ term in the Maclaurin series for $f(x) = e^{3x}$.
  choices: []
  answer:
    choiceId: 
    choiceIds: []
    expected: 
    gradingMode: selfCheck
    expectedLatex: 
    equivalenceMode: 
    variables: []
    value: 1.9995
    tolerance: 0.01
    media: []
    keyPoints: []
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: Maclaurin series for $e^u$ is $1 + u + u^2/2! + u^3/3!$. Let $u=2x$, so the $x^3$ term is $(2x)^3/6 = 8x^3/6 = (4/3)x^3$. Coefficient is 4/3 = 1.333.


    Why it works: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$. Compute derivatives at the center, divide by $n!$, and preserve the power $(x-a)^n$ before analyzing convergence.


    Common trap: Do not confuse the derivative value with its Taylor coefficient; the factorial belongs in every coefficient, including the constant term where $0!=1$.
