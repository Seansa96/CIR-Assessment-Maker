- id: q016
  type: freeResponse
  skills:
  - use-geometric-series-as-a-source
  prompt: 'For which $x$ is

    $$\frac1{1-x}=\sum_{n=0}^{\infty}x^n$$

    valid?

    '
  choices:
  - id: a
    text: $|x|<1$
  - id: b
    text: $|x|\le1$
  - id: c
    text: $x>1$
  - id: d
    text: All real $x$
  answer:
    choiceId: a
    gradingMode: selfCheck
  explanation: It is a geometric series with ratio $x$, which converges precisely when the ratio magnitude is below one.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires a representation choice, a series construction or transformation method, and an interval, remainder, or equality condition.
  prerequisiteObjectiveIds:
  - calc2-obj-power-series-representations
- id: q017
  type: freeResponse
  skills:
  - transform-known-series-by-substitution
  prompt: 'Which series represents $1/(1+x)$ for $|x|<1$?

    '
  choices:
  - id: a
    text: $\sum_{n=0}^{\infty}(-1)^nx^n$
  - id: b
    text: $\sum_{n=0}^{\infty}x^n$
  - id: c
    text: $\sum_{n=1}^{\infty}x^n/n$
  - id: d
    text: $\sum_{n=0}^{\infty}x^{2n}$
  answer:
    choiceId: a
    gradingMode: selfCheck
  explanation: Replace $x$ by $-x$ in $1/(1-x)=\sum x^n$.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires a representation choice, a series construction or transformation method, and an interval, remainder, or equality condition.
  prerequisiteObjectiveIds:
  - calc2-obj-power-series-representations
- id: q018
  type: freeResponse
  skills:
  - differentiate-power-series
  prompt: 'Differentiating $\sum_{n=0}^{\infty}x^n=1/(1-x)$ gives which identity?

    '
  choices:
  - id: a
    text: $\sum_{n=1}^{\infty}nx^{n-1}=1/(1-x)^2$
  - id: b
    text: $\sum_{n=1}^{\infty}x^{n-1}=1/(1-x)$
  - id: c
    text: $\sum_{n=0}^{\infty}nx^n=1/(1-x)$
  - id: d
    text: $\sum_{n=1}^{\infty}x^n/n=\ln(1-x)$
  answer:
    choiceId: a
    gradingMode: selfCheck
  explanation: Differentiate each $x^n$ to $nx^{n-1}$ and the rational function to $(1-x)^{-2}$.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires a representation choice, a series construction or transformation method, and an interval, remainder, or equality condition.
  prerequisiteObjectiveIds:
  - calc2-obj-power-series-representations
- id: q019
  type: freeResponse
  skills:
  - integrate-power-series
  prompt: 'Which series equals $\ln(1+x)$ for $|x|<1$?

    '
  choices:
  - id: a
    text: $\sum_{n=1}^{\infty}(-1)^{n-1}x^n/n$
  - id: b
    text: $\sum_{n=0}^{\infty}x^n$
  - id: c
    text: $\sum_{n=1}^{\infty}nx^{n-1}$
  - id: d
    text: $\sum_{n=1}^{\infty}x^n/n!$
  answer:
    choiceId: a
    gradingMode: selfCheck
  explanation: Integrate $1/(1+x)=\sum(-1)^nx^n$ from zero to $x$, using $\ln1=0$.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires a representation choice, a series construction or transformation method, and an interval, remainder, or equality condition.
  prerequisiteObjectiveIds:
  - calc2-obj-power-series-representations
- id: q020
  type: freeResponse
  skills:
  - track-radii-under-calculus-operations
  prompt: 'What happens to the radius of convergence when a power series is

    differentiated term by term?

    '
  choices:
  - id: a
    text: The radius stays the same.
  - id: b
    text: The radius always becomes zero.
  - id: c
    text: The radius doubles.
  - id: d
    text: The radius becomes infinite.
  answer:
    choiceId: a
    gradingMode: selfCheck
  explanation: Differentiation changes coefficients by polynomial factors, which do not alter their exponential growth rate.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires a representation choice, a series construction or transformation method, and an interval, remainder, or equality condition.
