schemaVersion: 1
id: calc2-taylor-maclaurin-hard-test
title: Taylor and Maclaurin Series Hard Test
assessmentType: test
categoryId: calculus-2
topicId: taylor-maclaurin
skills:
- Construct Taylor series at zero and shifted centers
- Extract coefficients after composition, products, differentiation, and integration
- Use series to solve limits and differential equations
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - calculus-2
  - taylor-maclaurin
  - hard
  - coefficient-extraction
modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - extract-exponential-series-coefficients
  prompt: |
    What is the coefficient of $x^5$ in the Maclaurin series for $e^{2x}$?
  choices:
  - id: a
    text: $4/15$
  - id: b
    text: $2/15$
  - id: c
    text: $32$
  - id: d
    text: $1/120$
  answer:
    choiceId: a
  explanation: |-
    Substitute $2x$ into $\sum x^n/n!$ to obtain $2^5/5!=4/15$.
- id: q002
  type: multipleChoice
  skills:
  - construct-shifted-taylor-polynomials
  prompt: |
    Which is the degree-three Taylor polynomial for $\log x$ centered at
    $x=1$?
  choices:
  - id: a
    text: $(x-1)-(x-1)^2/2+(x-1)^3/3$
  - id: b
    text: $x-x^2/2+x^3/3$
  - id: c
    text: $(x-1)+(x-1)^2/2+(x-1)^3/3$
  - id: d
    text: $1+(x-1)+(x-1)^2/2$
  answer:
    choiceId: a
  explanation: |-
    Set $h=x-1$ in $\log(1+h)=h-h^2/2+h^3/3-\cdots$.
- id: q003
  type: multipleChoice
  skills:
  - relate-derivative-series-coefficients
  prompt: |
    If $f(x)=\sum_{n=0}^{\infty}a_nx^n$, what is the coefficient of
    $x^7$ in $f'(x)$?
  choices:
  - id: a
    text: $8a_8$
  - id: b
    text: $7a_7$
  - id: c
    text: $a_8$
  - id: d
    text: $8a_7$
  answer:
    choiceId: a
  explanation: Differentiating $a_8x^8$ produces the unique $x^7$ contribution, namely $8a_8x^7$.
- id: q004
  type: multipleChoice
  skills:
  - compose-trigonometric-series
  prompt: |
    What is the coefficient of $x^4$ in the removable extension of
    $\sin x/x$ at zero?
  choices:
  - id: a
    text: $1/120$
  - id: b
    text: $-1/120$
  - id: c
    text: $1/24$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: |-
    Dividing $x-x^3/3!+x^5/5!-\cdots$ by x makes the $x^4$ coefficient $1/5!$.
- id: q005
  type: multipleChoice
  skills:
  - combine-exponential-and-trigonometric-series
  prompt: |
    What is the coefficient of $x^5$ in $e^x\cos x$?
  choices:
  - id: a
    text: $-1/30$
  - id: b
    text: $1/30$
  - id: c
    text: $-1/120$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: |-
    The function is the real part of $e^{(1+i)x}$, so the coefficient is $\operatorname{Re}(1+i)^5/5!=-4/120$.
- id: q006
  type: multipleChoice
  skills:
  - read-shifted-exponential-coefficients
  prompt: |
    In the Taylor series of $e^x$ centered at $x=2$, what is the
    coefficient of $(x-2)^3$?
  choices:
  - id: a
    text: $e^2/6$
  - id: b
    text: $1/6$
  - id: c
    text: $e^3/2$
  - id: d
    text: $2e^2$
  answer:
    choiceId: a
  explanation: Every derivative of the exponential evaluated at two is $e^2$, and the cubic coefficient
    divides by $3!$.
- id: q007
  type: multipleChoice
  skills:
  - construct-centered-cosine-polynomials
  prompt: |
    Which is the degree-four Taylor polynomial for $\cos x$ centered at
    $x=\pi$?
  choices:
  - id: a
    text: |-
      $-1+(x-\pi)^2/2-(x-\pi)^4/24$
  - id: b
    text: |-
      $1-(x-\pi)^2/2+(x-\pi)^4/24$
  - id: c
    text: |-
      $-(x-\pi)+(x-\pi)^3/6$
  - id: d
    text: |-
      $-1-(x-\pi)^2/2-(x-\pi)^4/24$
  answer:
    choiceId: a
  explanation: |-
    With $h=x-\pi$, $\cos(\pi+h)=-\cos h=-1+h^2/2-h^4/24+\cdots$.
- id: q008
  type: multipleChoice
  skills:
  - compose-logarithmic-series
  prompt: |
    What is the coefficient of $x^6$ in $\log(1+x^2)$?
  choices:
  - id: a
    text: $1/3$
  - id: b
    text: $-1/3$
  - id: c
    text: $1/6$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: |-
    Substitution into $\log(1+u)=u-u^2/2+u^3/3-\cdots$ makes the cubic-in-u term $x^6/3$.
- id: q009
  type: multipleChoice
  skills:
  - recover-coefficients-from-derivatives
  prompt: |
    Suppose $f^{(n)}(0)=3^n n$ for every $n\ge1$. What is the
    coefficient of $x^7$ in the Maclaurin series of f?
  choices:
  - id: a
    text: $3^7/6!$
  - id: b
    text: $3^7/7!$
  - id: c
    text: |-
      $7\cdot3^7$
  - id: d
    text: $3^6/7!$
  answer:
    choiceId: a
  explanation: |-
    The coefficient is $f^{(7)}(0)/7!=7\cdot3^7/7!=3^7/6!$.
- id: q010
  type: multipleChoice
  skills:
  - recognize-exact-taylor-representations
  prompt: |
    If p is a polynomial of degree seven, which statement holds for its
    Taylor polynomial of degree seven about any center a?
  choices:
  - id: a
    text: It equals p for every x.
  - id: b
    text: It equals p only near a.
  - id: c
    text: It omits the constant term unless a is zero.
  - id: d
    text: It requires an infinite remainder series.
  answer:
    choiceId: a
  explanation: All derivatives above order seven vanish, so Taylor's finite formula reconstructs the polynomial
    exactly.
- id: q011
  type: multipleChoice
  skills:
  - integrate-composed-series
  prompt: |
    Let $F(x)=\int_0^x (e^{t^2}-1)/t\,dt$, using the removable value at
    $t=0$. What is the coefficient of $x^6$ in F?
  choices:
  - id: a
    text: $1/36$
  - id: b
    text: $1/18$
  - id: c
    text: $1/6$
  - id: d
    text: $1/720$
  answer:
    choiceId: a
  explanation: |-
    The integrand is $\sum_{k\ge1}t^{2k-1}/k!$, so integration gives $x^{2k}/(2k\,k!)$; use k equals three.
- id: q012
  type: multipleChoice
  skills:
  - solve-linear-odes-with-series
  prompt: |
    The solution of $y'=y+x$ with $y(0)=0$ has a Maclaurin series.
    What is its $x^4$ coefficient?
  choices:
  - id: a
    text: $1/24$
  - id: b
    text: $1/6$
  - id: c
    text: $-1/24$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: Solving gives $y=e^x-x-1$, whose terms of degree two and above have coefficient $1/n!$.
- id: q013
  type: multipleChoice
  skills:
  - compose-cosine-series
  prompt: |
    What is the coefficient of $x^8$ in $\cos(x^2)$?
  choices:
  - id: a
    text: $1/24$
  - id: b
    text: $-1/24$
  - id: c
    text: $1/8!$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: |-
    Since $\cos u=1-u^2/2!+u^4/4!-\cdots$, substituting $u=x^2$ makes the $x^8$ term $x^8/4!$.
- id: q014
  type: multipleChoice
  skills:
  - evaluate-limits-with-leading-series-terms
  prompt: |
    Evaluate $\displaystyle\lim_{x\to0}\frac{e^x-1-x}{x^2}$.
  choices:
  - id: a
    text: $1/2$
  - id: b
    text: $1$
  - id: c
    text: $0$
  - id: d
    text: The limit does not exist
  answer:
    choiceId: a
  explanation: |-
    The numerator begins with $x^2/2+x^3/6+\cdots$, so division by $x^2$ leaves one-half in the limit.
- id: q015
  type: multipleChoice
  skills:
  - extract-cauchy-product-coefficients
  prompt: |
    What is the coefficient of $x^5$ in $e^x/(1-x)$?
  choices:
  - id: a
    text: $163/60$
  - id: b
    text: $1/120$
  - id: c
    text: $31/30$
  - id: d
    text: $5$
  answer:
    choiceId: a
  explanation: |-
    The Cauchy coefficient is $\sum_{k=0}^{5}1/k!=1+1+1/2+1/6+1/24+1/120=163/60$.
