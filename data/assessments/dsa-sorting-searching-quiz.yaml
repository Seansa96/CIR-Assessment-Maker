questions:
  - id: implement-merge
    type: code
    difficultyDimensions: ["Divide and conquer", "Array merging"]
    subjectDifficultyTags: ["Algorithm-Implementation"]
    prerequisiteObjectiveIds: ["obj-dsa-sorting-02"]
    prompt: |
      **The Merge Step**

      Merge Sort relies on a critical subroutine: taking two arrays that are *already sorted*, and merging them into a single, combined sorted array in $O(N)$ time.

      Write a Python function `merge(left, right)` that takes two sorted lists of integers and returns a new list containing all elements from both in sorted order. You must not use the built-in `sort()` or `sorted()` methods.

      ```python
      def merge(left, right):
          result = []
          # Write your O(N) merging logic here
          return result
      ```
    answer:
      gradingMode: automatic
      codeLanguage: python
      testCases:
        - input: "merge([1, 4, 7], [2, 5, 8])"
          expectedOutput: "[1, 2, 4, 5, 7, 8]"
        - input: "merge([3, 4], [1, 2, 5, 6])"
          expectedOutput: "[1, 2, 3, 4, 5, 6]"
        - input: "merge([], [1, 2])"
          expectedOutput: "[1, 2]"
    explanation: |
      Solution:
      ```python
      def merge(left, right):
          result = []
          i = 0
          j = 0
          while i < len(left) and j < len(right):
              if left[i] < right[j]:
                  result.append(left[i])
                  i += 1
              else:
                  result.append(right[j])
                  j += 1
          # Append any remaining elements
          result.extend(left[i:])
          result.extend(right[j:])
          return result
      ```

      Why it works:
      By using two pointers (`i` and `j`), we compare the smallest remaining elements from each list and append the absolute smallest to `result`. This guarantees an $O(N)$ merge, where $N$ is the total number of elements.
