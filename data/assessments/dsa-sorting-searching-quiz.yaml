  prompt: "**The Merge Step**\n\nMerge Sort relies on a critical subroutine: taking two arrays that are\
    \ *already sorted*, and merging them into a single, combined sorted array in $O(N)$ time.\n\nWrite\
    \ a Python function `merge(left, right)` that takes two sorted lists of integers and returns a new\
    \ list containing all elements from both in sorted order. You must not use the built-in `sort()` or\
    \ `sorted()` methods.\n\n```python\ndef merge(left, right):\n    result = []\n    # Write your O(N)\
    \ merging logic here\n    return result\n```\n"
  answer:
    gradingMode: automatic
    codeLanguage: python
    testCases:
    - input: merge([1, 4, 7], [2, 5, 8])
      expectedOutput: '[1, 2, 4, 5, 7, 8]'
    - input: merge([3, 4], [1, 2, 5, 6])
      expectedOutput: '[1, 2, 3, 4, 5, 6]'
    - input: merge([], [1, 2])
      expectedOutput: '[1, 2]'
  explanation: "Solution:\n```python\ndef merge(left, right):\n    result = []\n    i = 0\n    j = 0\n\
    \    while i < len(left) and j < len(right):\n        if left[i] < right[j]:\n            result.append(left[i])\n\
    \            i += 1\n        else:\n            result.append(right[j])\n            j += 1\n    #\
    \ Append any remaining elements\n    result.extend(left[i:])\n    result.extend(right[j:])\n    return\
    \ result\n```\n\nWhy it works:\nBy using two pointers (`i` and `j`), we compare the smallest remaining\
    \ elements from each list and append the absolute smallest to `result`. This guarantees an $O(N)$\
    \ merge, where $N$ is the total number of elements.\n"
