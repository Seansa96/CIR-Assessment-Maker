- id: q-circle-area-sectors-segments-quiz-1
  type: multipleChoice
  prompt: 'What is the area of a sector with radius 8 and central angle 120 degrees?'
  choices:
  - id: choice-A
    text: '64\pi'
  - id: choice-B
    text: '21.3\pi'
  - id: choice-C
    text: '42.7\pi'
  answer:
    choiceId: choice-B
    explanation: 'Area = (angle/360) * pi * r^2 = (120/360) * 8^2 * pi = 21.3\pi.'
  skills:
  - geometry-circle-area-sectors-segments
