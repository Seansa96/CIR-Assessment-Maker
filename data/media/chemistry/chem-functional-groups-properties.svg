<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="t d"><title id="t">Polarity and hydrogen-bonding checklist</title><desc id="d">A nonpolar hydrocarbon and a polar alcohol are compared by their carbon skeleton and oxygen hydrogen bond.</desc><rect width="760" height="260" fill="#eff6ff"/><g font-family="system-ui" font-size="24" fill="#172554"><text x="42" y="45">hydrocarbon: R—R</text><text x="42" y="105">mostly dispersion; size matters</text><text x="420" y="45">alcohol: R—O—H</text><text x="420" y="105">polar O—H; donor + acceptor</text><text x="42" y="190">larger hydrocarbon tail can reduce water solubility</text></g><g stroke="#2563eb" stroke-width="5"><path d="M80 140h230"/><path d="M455 140h230"/><path d="M565 140v45"/></g></svg>