<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="t d"><title id="t">R notation and representation ladder</title><desc id="d">The same ethoxy fragment is shown as expanded, condensed, and skeletal-style endpoint labels.</desc><rect width="760" height="260" fill="#fff7ed"/><g font-family="system-ui" fill="#431407" font-size="22"><text x="30" y="40">expanded</text><text x="30" y="105">H₃C—CH₂—O—H</text><text x="30" y="170">condensed</text><text x="220" y="170">CH₃CH₂OH</text><text x="30" y="235">R means a carbon-containing remainder</text><text x="515" y="170">R—OH</text></g><g stroke="#c2410c" stroke-width="4"><path d="M36 120h300"/><path d="M530 120h120"/></g></svg>