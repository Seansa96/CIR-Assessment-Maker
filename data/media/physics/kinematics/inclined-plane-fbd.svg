<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f" />
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1976d2" />
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c" />
        </marker>
    </defs>
    
    <!-- Inclined Plane -->
    <line x1="41.39613726858627" y1="253.9581958046224" x2="358.60386273141376" y2="106.0418041953776" stroke="#757575" stroke-width="4" />
    <path d="M 41.39613726858627 253.9581958046224 L 358.60386273141376 106.0418041953776 L 41.39613726858627 106.0418041953776 Z" fill="#e0e0e0" opacity="0.5"/>
    
    <!-- Angle Arc -->
    <path d="M 81.39613726858627 106.0418041953776 A 40 40 0 0 0 77.64844875005227 89.13707372574962" fill="none" stroke="#757575" stroke-width="2" />
    <text x="86.39613726858627" y="96.0418041953776" font-family="sans-serif" font-size="14" fill="#757575">θ</text>
    
    <!-- The Block -->
    <g transform="translate(200, 150) rotate(-25)">
        <rect x="-40.0" y="-30.0" width="80" height="60" fill="#ffcc80" stroke="#f57c00" stroke-width="3" />
        <circle cx="0" cy="0" r="4" fill="#d32f2f" />
        
        <!-- Normal Force -->
        <line x1="0" y1="0" x2="0" y2="-90" stroke="#1976d2" stroke-width="3" marker-end="url(#arrow-blue)" />
        <text x="5" y="-75" font-family="sans-serif" font-size="16" fill="#1976d2" font-weight="bold">F_N</text>
        
        <!-- Friction Force -->
        <line x1="0" y1="30.0" x2="-70" y2="30.0" stroke="#388e3c" stroke-width="3" marker-end="url(#arrow-green)" />
        <text x="-65" y="25.0" font-family="sans-serif" font-size="16" fill="#388e3c" font-weight="bold">f_k</text>
    </g>
    
    <!-- Gravity (straight down, not rotated with the block) -->
    <line x1="200" y1="150" x2="200" y2="250" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrow)" />
    <text x="210" y="235" font-family="sans-serif" font-size="16" fill="#d32f2f" font-weight="bold">mg</text>
    
</svg>