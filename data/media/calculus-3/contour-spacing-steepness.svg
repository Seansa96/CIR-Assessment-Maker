<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">Equal contour changes show steep and gradual slopes</title>
  <desc id="desc">Two contour maps use the same six kilometer horizontal scale. Pair A rises from 100 to 110 over two kilometers, so its contours are closer and the average rate magnitude is five units per kilometer. Pair B rises from 100 to 110 over five kilometers, so its contours are farther apart and the average rate magnitude is two units per kilometer.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b3a; }
      .panel { fill: #f8fbfd; stroke: #b8c7d1; stroke-width: 2; }
      .contour { fill: none; stroke: #246a8d; stroke-width: 4; }
      .axis { stroke: #526575; stroke-width: 2; }
      .measure { stroke: #b45309; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .tick { stroke: #526575; stroke-width: 2; }
      .value { font-size: 19px; font-weight: 700; paint-order: stroke; stroke: #f8fbfd; stroke-width: 6px; stroke-linejoin: round; }
      .small { font-size: 17px; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1000" height="570" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="27" font-weight="700">Same 10-unit contour change, different map distance</text>
  <text x="500" y="67" text-anchor="middle" class="small">Both maps use the same horizontal scale; contour labels increase in the same direction.</text>

  <rect class="panel" x="35" y="92" width="450" height="420" rx="12"/>
  <rect class="panel" x="515" y="92" width="450" height="420" rx="12"/>
  <text x="260" y="127" text-anchor="middle" font-size="24" font-weight="700">Pair A · steeper</text>
  <text x="740" y="127" text-anchor="middle" font-size="24" font-weight="700">Pair B · more gradual</text>

  <!-- Each plot spans 0–6 km. Pair A's 100 and 110 contours are 2 km apart. -->
  <path class="contour" d="M110 165 C100 225 120 280 110 345 C102 395 116 430 110 455"/>
  <path class="contour" d="M230 165 C220 225 240 280 230 345 C222 395 236 430 230 455"/>
  <path d="M85 164 L105 164" stroke="#246a8d" stroke-width="3"/><text class="value" x="82" y="159" text-anchor="end">100</text>
  <path d="M235 164 L255 164" stroke="#246a8d" stroke-width="3"/><text class="value" x="260" y="159">110</text>
  <line class="measure" x1="113" y1="300" x2="227" y2="300"/>
  <text x="170" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">2 km</text>
  <line class="axis" x1="70" y1="455" x2="430" y2="455"/>
  <g class="small" text-anchor="middle">
    <line class="tick" x1="70" y1="455" x2="70" y2="464"/><text x="70" y="486">0</text>
    <line class="tick" x1="130" y1="455" x2="130" y2="464"/><text x="130" y="486">1</text>
    <line class="tick" x1="190" y1="455" x2="190" y2="464"/><text x="190" y="486">2</text>
    <line class="tick" x1="250" y1="455" x2="250" y2="464"/><text x="250" y="486">3</text>
    <line class="tick" x1="310" y1="455" x2="310" y2="464"/><text x="310" y="486">4</text>
    <line class="tick" x1="370" y1="455" x2="370" y2="464"/><text x="370" y="486">5</text>
    <line class="tick" x1="430" y1="455" x2="430" y2="464"/><text x="430" y="486">6</text>
  </g>
  <text x="250" y="505" text-anchor="middle" class="small">Map distance (km)</text>

  <!-- Same 0–6 km scale. Pair B's 100 and 110 contours are 5 km apart. -->
  <path class="contour" d="M585 165 C575 225 595 280 585 345 C577 395 591 430 585 455"/>
  <path class="contour" d="M885 165 C875 225 895 280 885 345 C877 395 891 430 885 455"/>
  <path d="M560 164 L580 164" stroke="#246a8d" stroke-width="3"/><text class="value" x="557" y="159" text-anchor="end">100</text>
  <path d="M890 164 L910 164" stroke="#246a8d" stroke-width="3"/><text class="value" x="915" y="159">110</text>
  <line class="measure" x1="588" y1="300" x2="882" y2="300"/>
  <text x="735" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">5 km</text>
  <line class="axis" x1="550" y1="455" x2="910" y2="455"/>
  <g class="small" text-anchor="middle">
    <line class="tick" x1="550" y1="455" x2="550" y2="464"/><text x="550" y="486">0</text>
    <line class="tick" x1="610" y1="455" x2="610" y2="464"/><text x="610" y="486">1</text>
    <line class="tick" x1="670" y1="455" x2="670" y2="464"/><text x="670" y="486">2</text>
    <line class="tick" x1="730" y1="455" x2="730" y2="464"/><text x="730" y="486">3</text>
    <line class="tick" x1="790" y1="455" x2="790" y2="464"/><text x="790" y="486">4</text>
    <line class="tick" x1="850" y1="455" x2="850" y2="464"/><text x="850" y="486">5</text>
    <line class="tick" x1="910" y1="455" x2="910" y2="464"/><text x="910" y="486">6</text>
  </g>
  <text x="730" y="505" text-anchor="middle" class="small">Map distance (km)</text>

  <text x="260" y="548" text-anchor="middle" font-size="18" font-weight="700">Average rate magnitude: 10 ÷ 2 = 5 units/km</text>
  <text x="740" y="548" text-anchor="middle" font-size="18" font-weight="700">Average rate magnitude: 10 ÷ 5 = 2 units/km</text>
</svg>
