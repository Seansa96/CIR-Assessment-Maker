<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Line direction and plane normal in three-dimensional coordinate space</title>
  <desc id="desc">A blue line passes through point r zero with direction v. A translucent gold plane contains the point, and a red normal n is perpendicular to it.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M90 338 L344 338"/><path d="M90 338 L90 90"/><path d="M90 338 L24 394"/>
  </g>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="18">
    <text x="350" y="344">x</text><text x="80" y="80">z</text><text x="14" y="408">y</text>
    <text x="350" y="46" font-size="24" font-weight="bold">A direction determines a line; a normal determines a plane</text>
  </g>
  <polygon points="245,282 530,235 615,294 330,348" fill="#fbbf24" fill-opacity=".28" stroke="#b45309" stroke-width="2"/>
  <g stroke="#2563eb" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M147 357 L544 174"/>
  </g>
  <polygon points="544,174 520,177 535,197" fill="#2563eb"/>
  <circle cx="303" cy="286" r="7" fill="#0f172a"/>
  <g stroke="#dc2626" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M390 267 L346 132"/>
  </g>
  <polygon points="346,132 341,158 365,150" fill="#dc2626"/>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="19">
    <text x="270" y="316">r₀ (point)</text><text x="470" y="163" fill="#1d4ed8">v (direction)</text>
    <text x="354" y="123" fill="#b91c1c">n (normal)</text><text x="466" y="302" fill="#92400e">plane</text>
  </g>
</svg>
