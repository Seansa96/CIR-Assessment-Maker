<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">A vector-valued space curve and tangent vector</title>
  <desc id="desc">Three-dimensional axes frame a blue helical space curve. A black position vector reaches one point on the curve and a red tangent vector points along the curve.</desc>
  <rect width="720" height="420" fill="#fff"/>
  <g stroke="#64748b" stroke-width="2" fill="none"><path d="M90 340H350"/><path d="M90 340V65"/><path d="M90 340L25 393"/></g>
  <g fill="#334155" font-family="Arial,sans-serif" font-size="17"><text x="356" y="346">x</text><text x="80" y="57">z</text><text x="15" y="407">y</text><text x="360" y="55" font-size="24" font-weight="bold">Position, curve, and tangent direction</text></g>
  <path d="M175 300 C270 385 385 140 515 235 C605 300 660 150 685 100" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <circle cx="515" cy="235" r="7" fill="#0f172a"/>
  <path d="M90 340L515 235" stroke="#0f172a" stroke-width="3"/><polygon points="515,235 495,226 499,247" fill="#0f172a"/>
  <path d="M482 265L558 208" stroke="#dc2626" stroke-width="5"/><polygon points="558,208 535,214 547,230" fill="#dc2626"/>
  <g font-family="Arial,sans-serif" font-size="18"><text x="405" y="288" fill="#0f172a">r(t)</text><text x="565" y="202" fill="#b91c1c">r′(t), tangent</text><text x="245" y="370" fill="#1d4ed8">space curve C</text></g>
</svg>
