<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Three-dimensional component vector</title><desc id="desc">A coordinate-space diagram with axes and a vector from the origin to components two, one, three.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#0b6e99"/></marker></defs>
  <rect width="720" height="440" fill="#fbfdff"/><g stroke="#475569" stroke-width="2" marker-end="url(#arrow)"><path d="M130 330 L390 390"/><path d="M130 330 L55 400"/><path d="M130 330 L130 80"/></g>
  <g font-family="Arial, sans-serif" font-size="20" fill="#1e293b"><text x="405" y="397">x</text><text x="38" y="414">y</text><text x="118" y="68">z</text><text x="108" y="352">O</text></g>
  <g stroke="#94a3b8" stroke-dasharray="7 6" stroke-width="2"><path d="M130 330 L300 235 L300 115"/><path d="M300 115 L300 235"/><path d="M300 235 L130 330"/></g>
  <path d="M130 330 L300 115" stroke="#0b6e99" stroke-width="5" marker-end="url(#arrow)"/><circle cx="300" cy="115" r="5" fill="#0b6e99"/>
  <g font-family="Arial, sans-serif" font-size="21" fill="#0f172a"><text x="320" y="110">v = &lt;2, 1, 3&gt;</text><text x="320" y="142">components locate the endpoint</text><text x="330" y="178">|v| is the arrow length</text></g>
  <path d="M316 183 L282 145" stroke="#0b6e99" stroke-width="2"/><text x="78" y="38" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#0f172a">A vector is displacement: components, direction, and magnitude</text>
</svg>
