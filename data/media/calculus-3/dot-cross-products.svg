<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Dot and cross product geometry</title><desc id="desc">Two vectors span a parallelogram. The dot product describes their alignment, while their cross product is perpendicular to the parallelogram.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#0b6e99"/></marker></defs>
  <rect width="720" height="440" fill="#fbfdff"/><text x="50" y="48" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Dot: alignment scalar · Cross: perpendicular area vector</text>
  <polygon points="150,315 420,290 540,155 270,180" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><g stroke="#0b6e99" stroke-width="5" marker-end="url(#a)"><path d="M150 315 L420 290"/><path d="M150 315 L270 180"/><path d="M150 315 L150 85"/></g>
  <g font-family="Arial, sans-serif" font-size="22" fill="#0f172a"><text x="275" y="340">u</text><text x="210" y="235">v</text><text x="164" y="77">u × v</text><text x="455" y="210">parallelogram</text><text x="454" y="238">area = |u × v|</text><text x="70" y="388">u · v = |u||v| cos θ</text></g>
  <path d="M205 311 A54 54 0 0 1 193 264" fill="none" stroke="#e11d48" stroke-width="3"/><text x="205" y="275" font-family="Arial, sans-serif" font-size="20" fill="#be123c">θ</text>
  <text x="425" y="373" font-family="Arial, sans-serif" font-size="19" fill="#334155">right-hand orientation determines the cross-product direction</text>
</svg>
