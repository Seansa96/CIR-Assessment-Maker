<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="title desc">
  <title id="title">Position, velocity, and acceleration along a curved path</title>
  <desc id="desc">A particle travels along a curved path. Position points from an origin to the particle; velocity is tangent to the path; acceleration has tangential and inward normal components.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="currentColor"/></marker></defs>
  <rect width="720" height="410" fill="#f8fbff"/>
  <path d="M110 335 C205 215,310 295,400 175 S555 135,650 78" fill="none" stroke="#2f4858" stroke-width="5"/>
  <circle cx="397" cy="177" r="8" fill="#1d4ed8"/>
  <g stroke-width="4" marker-end="url(#arrow)">
    <path d="M85 350 L397 177" stroke="#7c3aed" style="color:#7c3aed"/>
    <path d="M397 177 L505 131" stroke="#0284c7" style="color:#0284c7"/>
    <path d="M397 177 L345 103" stroke="#e11d48" style="color:#e11d48"/>
    <path d="M397 177 L363 132" stroke="#f59e0b" style="color:#f59e0b"/>
  </g>
  <circle cx="85" cy="350" r="5" fill="#111827"/>
  <text x="64" y="377" font-family="Arial,sans-serif" font-size="20" fill="#111827">origin</text>
  <text x="208" y="250" font-family="Arial,sans-serif" font-size="22" fill="#6d28d9">position r(t)</text>
  <text x="500" y="115" font-family="Arial,sans-serif" font-size="22" fill="#0369a1">velocity v(t)</text>
  <text x="278" y="92" font-family="Arial,sans-serif" font-size="22" fill="#be123c">acceleration a(t)</text>
  <text x="285" y="143" font-family="Arial,sans-serif" font-size="20" fill="#b45309">normal part</text>
  <text x="419" y="211" font-family="Arial,sans-serif" font-size="19" fill="#111827">particle at time t</text>
  <text x="82" y="46" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#111827">Motion along a curved path</text>
  <text x="82" y="75" font-family="Arial,sans-serif" font-size="18" fill="#374151">Velocity is tangent; acceleration may change speed, direction, or both.</text>
</svg>
