<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-labelledby="title desc">
  <title id="title">Gradient and tangent directions on a contour map</title>
  <desc id="desc">Three nearby contour curves are labeled 2, 3, and 4. Point P lies on contour 3. At P, the gradient arrow points perpendicular toward larger contour labels, and a unit tangent arrow lies along contour 3. The picture represents directions at a smooth point.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
      .grid { stroke: #e5eaf0; stroke-width: 1; }
      .contour { fill: none; stroke: #28718d; stroke-width: 4; }
      .axis { stroke: #64748b; stroke-width: 2; }
      .label { font-size: 20px; font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 7px; stroke-linejoin: round; }
      .vector { stroke-width: 4; fill: none; }
    </style>
    <marker id="arrowGrad" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <marker id="arrowTan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563a6"/></marker>
  </defs>
  <rect width="820" height="560" fill="#fff"/>
  <text x="410" y="40" text-anchor="middle" font-size="27" font-weight="700">At P, compare the gradient with the contour tangent</text>
  <text x="410" y="69" text-anchor="middle" font-size="17" fill="#526575">At P, |∇f| = 6; the unit tangent follows the level curve.</text>
  <rect x="80" y="100" width="660" height="370" rx="8" fill="#fbfcfd" stroke="#bac6d1" stroke-width="2"/>
  <g class="grid">
    <line x1="190" y1="100" x2="190" y2="470"/><line x1="300" y1="100" x2="300" y2="470"/><line x1="410" y1="100" x2="410" y2="470"/><line x1="520" y1="100" x2="520" y2="470"/><line x1="630" y1="100" x2="630" y2="470"/>
    <line x1="80" y1="175" x2="740" y2="175"/><line x1="80" y1="250" x2="740" y2="250"/><line x1="80" y1="325" x2="740" y2="325"/><line x1="80" y1="400" x2="740" y2="400"/>
  </g>
  <line class="axis" x1="105" y1="285" x2="710" y2="285"/>
  <line class="axis" x1="410" y1="445" x2="410" y2="120"/>
  <text x="713" y="309" font-size="20" font-style="italic">x</text><text x="427" y="124" font-size="20" font-style="italic">y</text>
  <ellipse class="contour" cx="410" cy="285" rx="250" ry="155"/>
  <ellipse class="contour" cx="410" cy="285" rx="175" ry="105"/>
  <ellipse class="contour" cx="410" cy="285" rx="100" ry="58"/>
  <text class="label" x="495" y="279">2</text>
  <text class="label" x="563" y="279">3</text>
  <text class="label" x="640" y="279">4</text>
  <!-- P is at the top of the middle contour: the tangent is horizontal and the gradient is normal to it. -->
  <circle cx="410" cy="180" r="8" fill="#111827" stroke="#fff" stroke-width="3"/>
  <text x="394" y="174" text-anchor="end" font-size="19" font-weight="700">P</text>
  <line class="vector" x1="410" y1="180" x2="410" y2="108" stroke="#c2410c" marker-end="url(#arrowGrad)"/>
  <text x="426" y="130" font-size="19" font-weight="700" fill="#9a3412">∇f</text>
  <line class="vector" x1="410" y1="180" x2="487" y2="180" stroke="#2563a6" marker-end="url(#arrowTan)"/>
  <text x="494" y="187" font-size="19" font-weight="700" fill="#1d4e89">unit tangent t</text>
  <path d="M410 199 L431 199 L431 180" fill="none" stroke="#334155" stroke-width="2.5"/>
  <text x="410" y="515" text-anchor="middle" font-size="18">The tangent direction stays on the level curve through P.</text>
</svg>
