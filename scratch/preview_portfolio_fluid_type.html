<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    background-color: #121212;
    color: white;
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    padding: 2rem;
  }
  .hero h1 {
    font-weight: 700;
    line-height: 1.1;
    color: #64ffda;
    /* The clamp function! */
    font-size: clamp(2.5rem, 8vw, 6rem);
    margin: 0;
  }
</style>
</head>
<body>
  <div class="hero">
    <h1>Fluid Typography is Magic</h1>
    <p style="margin-top: 1rem; color: #a0a0a0; max-width: 600px;">Resize the window! The heading above will scale perfectly between 2.5rem and 6rem based on the viewport width.</p>
  </div>
</body>
</html>
