<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #222;
    display: flex;
    justify-content: center;
    padding-top: 50px;
    height: 100vh;
    margin: 0;
  }
  
  @keyframes bounce {
    0% {
      transform: translateY(0);
    }
    100% {
      transform: translateY(200px);
    }
  }
  
  .ball {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background-color: #e74c3c;
    animation: bounce 0.5s cubic-bezier(0.5, 0.05, 1, 0.5) infinite alternate;
  }
</style>
</head>
<body>
  <div class="ball"></div>
</body>
</html>
