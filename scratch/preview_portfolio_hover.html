<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background-color: #121212; 
    color: white; 
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  
  .project-card {
    background-color: #1e1e1e;
    border-radius: 8px;
    padding: 3rem;
    box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.6);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
  }
  
  .project-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0px 15px 25px rgba(0, 0, 0, 0.8);
  }
</style>
<!-- Script to simulate hover for the recording subagent -->
<script>
  setTimeout(() => {
    document.querySelector('.project-card').classList.add('hover');
  }, 500);
  setTimeout(() => {
    document.querySelector('.project-card').classList.remove('hover');
  }, 1500);
</script>
<style>
  /* Fallback for script */
  .project-card.hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0px 15px 25px rgba(0, 0, 0, 0.8);
  }
</style>
</head>
<body>
  <div class="project-card">
    <h3>Hover Me!</h3>
  </div>
</body>
</html>
