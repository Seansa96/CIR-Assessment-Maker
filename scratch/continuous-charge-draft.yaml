lesson:
  introduction: |-
    How can Coulomb's law for a point charge predict the field of a rod or a disk? Replace the object with small charged pieces, add their vector fields, and take the limit as the pieces become infinitesimal. The integral is the final expression of that construction.

    You will build charge elements, resolve their fields, and evaluate rod, ring, and disk integrals. You need definite integrals, simple substitution, and vector components. We assume fixed charges in vacuum, use $k=1/(4\pi\varepsilon_0)$, and evaluate fields away from the idealized charged material. Charge densities are signed; the diagrams illustrate positive charge.
  sections:
  - id: physics2-ch05-continuous-charge-s1
    title: From a sum of charges to a field integral
    required: true
    content: |-
      Hold the observation point $\mathbf r$ fixed. A small source charge $\Delta q_i$ sits at $\mathbf r'_i$. The displacement **from the source to the observer** is $\mathbf R_i=\mathbf r-\mathbf r'_i$, with length $R_i=|\mathbf R_i|$ and unit vector $\widehat{\mathbf R}_i=\mathbf R_i/R_i$.

      Coulomb's law and superposition give

      $$\mathbf E(\mathbf r)\approx k\sum_i\frac{\Delta q_i}{R_i^2}\widehat{\mathbf R}_i.$$

      Refine the partition while keeping the charge density fixed. The vector sum becomes

      $$\mathbf E(\mathbf r)=k\int_{\text{source}}\frac{\widehat{\mathbf R}}{R^2}\,dq
      =k\int_{\text{source}}\frac{\mathbf r-\mathbf r'}{|\mathbf r-\mathbf r'|^3}\,dq.$$

      The source coordinate varies during integration; the observation coordinate does not. For a source at $(x,0)$ and observer at $(0,a)$, $\mathbf R=(-x,a)$ and $R=\sqrt{x^2+a^2}$. Reversing this displacement reverses the predicted field. Using signed $dq$ automatically reverses a negative charge's contribution toward the source.
    check:
      id: physics2-ch05-continuous-charge-s1-check
      type: multipleChoice
      prompt: |-
        A positive charge element is at $(x,0)$ and the fixed observer is at $(0,a)$, with $a>0$. Which vector must appear in the numerator of $d\mathbf E=k\,dq\,\mathbf R/R^3$?
      choices:
      - {id: a, text: '$x\widehat{\mathbf x}-a\widehat{\mathbf y}$', issueSignals: [{id: sign-error}]}
      - {id: b, text: '$-x\widehat{\mathbf x}+a\widehat{\mathbf y}$'}
      - {id: c, text: '$a\widehat{\mathbf y}$', issueSignals: [{id: vector-component-resolution-error}]}
      - {id: d, text: '$\sqrt{x^2+a^2}$', issueSignals: [{id: scalar-vector-confusion}]}
      answer: {choiceId: b}
      explanation: |-
        Solution: B. Subtract the source position from the observer position: $(0,a)-(x,0)=(-x,a)$.
        Why it works: A positive source produces a field along the source-to-observer displacement. The length in the denominator is $\sqrt{x^2+a^2}$.
        Why the other choices fail: A points toward the positive source. C drops the horizontal contribution of this individual element before any cancellation is proved. D is a distance, not a vector direction.
  - id: physics2-ch05-continuous-charge-s2
    title: Construct dq from geometry and density
    required: true
    content: |-
      Density converts a geometric element into charge:

      | Distribution | Charge element | Density units |
      | --- | --- | --- |
      | Line | $dq=\lambda\,dl$ | $\mathrm{C/m}$ |
      | Surface | $dq=\sigma\,dA$ | $\mathrm{C/m^2}$ |
      | Volume | $dq=\rho\,dV$ | $\mathrm{C/m^3}$ |

      Choose the element that matches the shape: $dl=dx$ on a straight rod, $dl=R\,d\phi$ on a ring, and $dA=2\pi s\,ds$ for a thin annulus of radius $s$. The annulus already includes its entire circumference: do not multiply by $2\pi$ again.

      Check the charge before calculating the field: $Q=\int dq$. For a rod on $0\le x\le L$ with $\lambda(x)=\lambda_0x/L$,

      $$dq=\lambda_0\frac{x}{L}\,dx,\qquad
      Q=\frac{\lambda_0}{L}\int_0^L x\,dx
      =\frac{\lambda_0}{L}\left[\frac{x^2}{2}\right]_0^L
      =\frac{\lambda_0L}{2}.$$

      This agrees with average density $\lambda_0/2$ times length. Using $\lambda_0L$ incorrectly treats the maximum density as constant. Likewise, $Q$ alone does not determine the nearby field: the integral must retain the spatial distribution.
    check:
      id: physics2-ch05-continuous-charge-s2-check
      type: multipleChoice
      prompt: |-
        A rod on $0\le x\le L$ has $\lambda(x)=\lambda_0x/L$, with $L>0$. Which pair correctly gives its charge element and total charge?
      choices:
      - {id: a, text: '$dq=\lambda_0\,dx,\quad Q=\lambda_0L$', issueSignals: [{id: mathematical-translation-error}]}
      - {id: b, text: '$dq=(\lambda_0x/L)\,dx,\quad Q=\lambda_0L$', issueSignals: [{id: integration-error}]}
      - {id: c, text: '$dq=(\lambda_0x/L)\,dx,\quad Q=\lambda_0L/2$'}
      - {id: d, text: '$dq=(\lambda_0x/L)\,dx,\quad Q=\lambda_0L^2/2$', issueSignals: [{id: algebraic-simplification-error}]}
      answer: {choiceId: c}
      explanation: |-
        Solution: C. Integrate $Q=(\lambda_0/L)\int_0^L x\,dx=(\lambda_0/L)(L^2/2)=\lambda_0L/2$.
        Why it works: Each source slice carries its local density times $dx$. The result has charge units because $[\lambda_0 L]=\mathrm C$.
        Why the other choices fail: A replaces the varying density by its endpoint value. B retains the correct element but loses the factor $1/2$ on integration. D fails to cancel the $L$ in the density and has units of charge times length.
  - id: physics2-ch05-continuous-charge-s3
    title: Resolve components before invoking symmetry
    required: true
    content: |-
      For a rod along the x-axis observed at $(0,a)$, substitute $dq=\lambda(x)dx$ and $\mathbf R=(-x,a)$ into the vector law:

      $$d\mathbf E=k\lambda(x)\frac{-x\widehat{\mathbf x}+a\widehat{\mathbf y}}{(x^2+a^2)^{3/2}}\,dx.$$

      Hence $dE_x=-k\lambda(x)x\,dx/(x^2+a^2)^{3/2}$ and $dE_y=k\lambda(x)a\,dx/(x^2+a^2)^{3/2}$. The extra denominator power comes from projection: $dE_y=(k\,dq/R^2)(a/R)$.

      For a uniform rod centered on the origin, sources at $+x$ and $-x$ carry equal charge and have equal distance to the observer. Their horizontal contributions are opposite; their vertical contributions have the same sign. Equivalently, the $E_x$ integrand is odd and the $E_y$ integrand is even on $[-L,L]$.

      Symmetry belongs to the **charge distribution and observation point together**. A symmetric outline alone is insufficient when $\lambda(x)\ne\lambda(-x)$. Also, cancellation of a component of the total field does not make that component zero for each source element.
    check:
      id: physics2-ch05-continuous-charge-s3-check
      type: multipleChoice
      prompt: |-
        Equal positive elements at $(x,0)$ and $(-x,0)$ produce fields at $(0,a)$, where $x,a>0$. What happens when their fields are added?
      choices:
      - {id: a, text: 'Horizontal components cancel; vertical components add.'}
      - {id: b, text: 'Vertical components cancel; horizontal components add.', issueSignals: [{id: vector-component-resolution-error}]}
      - {id: c, text: 'Both components cancel because the elements are opposite each other.', issueSignals: [{id: vector-field-interpretation-error}]}
      - {id: d, text: 'The net vertical field is twice the magnitude of either individual field.', issueSignals: [{id: scalar-vector-confusion}]}
      answer: {choiceId: a}
      explanation: |-
        Solution: A. The two displacements are $(-x,a)$ and $(x,a)$, so only their horizontal components have opposite signs.
        Why it works: Equal charges at equal distances give a common multiplier $k\,dq/(x^2+a^2)^{3/2}$; adding the displacement vectors gives $(0,2a)$.
        Why the other choices fail: B exchanges the cancelling and reinforcing components. C overlooks the shared positive vertical component. D adds magnitudes without the projection factor $a/\sqrt{x^2+a^2}<1$.
  - id: physics2-ch05-continuous-charge-s4
    title: Evaluate the finite-rod integral
    required: true
    content: |-
      Let a uniform rod have signed density $\lambda$ on $-L\le x\le L$; its total length is **$2L$** and $Q=2\lambda L$. Observe at $(0,a)$, where $a>0$. The previous symmetry argument gives $E_x=0$ and

      $$E_y=k\lambda a\int_{-L}^{L}\frac{dx}{(x^2+a^2)^{3/2}}.$$

      To evaluate the integral, take $x=a\tan\theta$. Then $dx=a\sec^2\theta\,d\theta$ and $(x^2+a^2)^{3/2}=a^3\sec^3\theta$, so

      $$\int\frac{dx}{(x^2+a^2)^{3/2}}
      =\frac1{a^2}\int\cos\theta\,d\theta
      =\frac{x}{a^2\sqrt{x^2+a^2}}+C.$$

      Differentiating the final expression returns $(x^2+a^2)^{-3/2}$. Now evaluate both endpoints:

      $$E_y=\frac{k\lambda}{a}\left[\frac{x}{\sqrt{x^2+a^2}}\right]_{-L}^{L}
      =\frac{2k\lambda L}{a\sqrt{a^2+L^2}},\qquad \mathbf E=E_y\widehat{\mathbf y}.$$

      Positive $\lambda$ gives an upward field; negative $\lambda$ reverses it. Integrating over $[-L,L]$ has already included both halves. You may instead double the integral from $0$ to $L$, but must not double the full-rod integral again.
    check:
      id: physics2-ch05-continuous-charge-s4-check
      type: multipleChoice
      prompt: |-
        For a uniform rod on $[-L,L]$, the vertical field at $(0,a)$ is $k\lambda a\int_{-L}^{L}(x^2+a^2)^{-3/2}dx$, with $a,L>0$. Which endpoint evaluation is correct?
      choices:
      - {id: a, text: '$E_y=k\lambda L/[a\sqrt{a^2+L^2}]$', issueSignals: [{id: integration-bounds-error}]}
      - {id: b, text: '$E_y=4k\lambda L/[a\sqrt{a^2+L^2}]$', issueSignals: [{id: integration-bounds-error}]}
      - {id: c, text: '$E_y=2k\lambda L/(a^2+L^2)$', issueSignals: [{id: integration-error}]}
      - {id: d, text: '$E_y=2k\lambda L/[a\sqrt{a^2+L^2}]$'}
      answer: {choiceId: d}
      explanation: |-
        Solution: D. The antiderivative after multiplying by $k\lambda a$ is $(k\lambda/a)x/\sqrt{x^2+a^2}$. Its values at $L$ and $-L$ are opposite, so their difference is $2k\lambda L/[a\sqrt{a^2+L^2}]$.
        Why it works: The definite integral subtracts the negative lower-end value and accounts for the whole rod exactly once.
        Why the other choices fail: A keeps only one half. B doubles the full-rod result again. C treats every element as if it had an endpoint distance and loses the actual integrated dependence on $a$.
  - id: physics2-ch05-continuous-charge-s5
    title: Integrate around a uniformly charged ring
    required: true
    content: |-
      Put a ring of radius $R$ in the xy-plane and observe at $(0,0,z)$. Parameterize its source points by $\phi$, so $dl=R\,d\phi$, $dq=\lambda R\,d\phi$, and $0\le\phi\le2\pi$. For a uniform ring $Q=2\pi R\lambda$.

      Every element has the same separation distance $D=\sqrt{R^2+z^2}$ from the observer. Opposite elements cancel the transverse components. The signed axial projection of their unit displacements is $z/D$, so

      $$E_z=k\int_0^{2\pi}\frac{\lambda R\,d\phi}{R^2+z^2}\frac{z}{\sqrt{R^2+z^2}}
      =\frac{k\lambda Rz}{(R^2+z^2)^{3/2}}[\phi]_0^{2\pi}
      =\frac{kQz}{(R^2+z^2)^{3/2}}.$$

      During this integral $R$, $z$, $D$, and $\lambda$ are constant; only the angle changes. The vector is $E_z\widehat{\mathbf z}$. It vanishes at the ring center, reverses below the plane, and reverses again if $Q$ changes sign. The distance $D$ is not the ring radius $R$, and a constant distance does not eliminate the need to project the field.
    check:
      id: physics2-ch05-continuous-charge-s5-check
      type: multipleChoice
      prompt: |-
        A uniform ring has positive charge $Q$ and radius $R$. At axial position $z=R>0$, which field follows from resolving and integrating its charge elements?
      choices:
      - {id: a, text: '$\mathbf E=[kQ/(2R^2)]\widehat{\mathbf z}$', issueSignals: [{id: vector-component-resolution-error}]}
      - {id: b, text: '$\mathbf E=[kQ/(2\sqrt2 R^2)]\widehat{\mathbf z}$'}
      - {id: c, text: '$\mathbf E=[kQ/R^2]\widehat{\mathbf z}$', issueSignals: [{id: mathematical-translation-error}]}
      - {id: d, text: '$\mathbf E=0$', issueSignals: [{id: vector-field-interpretation-error}]}
      answer: {choiceId: b}
      explanation: |-
        Solution: B. Substitute $z=R$ into $E_z=kQz/(R^2+z^2)^{3/2}$ to obtain $kQ/(2\sqrt2 R^2)$.
        Why it works: The squared source distance is $2R^2$ and the projection factor is $1/\sqrt2$; multiplying both factors gives the keyed result.
        Why the other choices fail: A uses the right distance but omits axial projection. C replaces the ring by a central point charge even though the observer is not far away. D applies the center's zero-field condition at $z=R$.
  - id: physics2-ch05-continuous-charge-s6
    title: Build a disk integral from annuli
    required: true
    content: |-
      A uniformly charged disk has radius $R$ and signed surface density $\sigma$. At axial position $z>0$, divide the disk into rings of **variable** radius $s$ and width $ds$. Each annulus has $dq=\sigma\,2\pi s\,ds$. Use the ring result for that annulus:

      $$dE_z=\frac{kz\,dq}{(z^2+s^2)^{3/2}},\qquad
      E_z=2\pi k\sigma z\int_0^R\frac{s\,ds}{(z^2+s^2)^{3/2}}.$$

      Let $u=z^2+s^2$, so $du=2s\,ds$. The new bounds are $z^2$ and $z^2+R^2$:

      $$\int_0^R\frac{s\,ds}{(z^2+s^2)^{3/2}}
      =\frac12\int_{z^2}^{z^2+R^2}u^{-3/2}\,du
      =[-u^{-1/2}]_{z^2}^{z^2+R^2}
      =\frac1z-\frac1{\sqrt{z^2+R^2}}.$$

      Here $\sqrt{z^2}=z$ because we specified $z>0$. Thus

      $$\mathbf E=2\pi k\sigma\left(1-\frac{z}{\sqrt{z^2+R^2}}\right)\widehat{\mathbf z}.$$

      The ring distance changes as $s$ changes, so it must remain inside the integral. A common error is to substitute the outer radius $R$ for every ring radius. Also, $2\pi s\,ds$ is an area, whereas $2\pi s$ alone is a circumference. Below the disk use reflection symmetry; do not insert a negative $z$ into this positive-side expression. At the ideal sheet itself the field has a jump, so the one-sided limit is distinct from a value on the sheet.
    check:
      id: physics2-ch05-continuous-charge-s6-check
      type: multipleChoice
      prompt: |-
        For a uniform disk of radius $R$ observed at $z>0$, apply $u=z^2+s^2$ to $E_z=2\pi k\sigma z\int_0^R s(z^2+s^2)^{-3/2}ds$. Which transformed integral is correct?
      choices:
      - {id: a, text: '$\pi k\sigma z\int_{z^2}^{z^2+R^2}u^{-3/2}\,du$'}
      - {id: b, text: '$2\pi k\sigma z\int_{z^2}^{z^2+R^2}u^{-3/2}\,du$', issueSignals: [{id: integration-error}]}
      - {id: c, text: '$\pi k\sigma z\int_0^R u^{-3/2}\,du$', issueSignals: [{id: integration-bounds-error}]}
      - {id: d, text: '$\pi k\sigma z\int_{z^2+R^2}^{z^2}u^{-3/2}\,du$', issueSignals: [{id: sign-error}]}
      answer: {choiceId: a}
      explanation: |-
        Solution: A. Since $du=2s\,ds$, replace $s\,ds$ by $du/2$. Map $s=0$ to $u=z^2$ and $s=R$ to $u=z^2+R^2$.
        Why it works: The Jacobian factor halves the prefactor and the transformed bounds describe exactly the original annuli.
        Why the other choices fail: B omits the factor $1/2$. C keeps bounds for $s$ while integrating with respect to $u$. D reverses the bounds without compensating with a minus sign, reversing the field for positive charge.
  - id: physics2-ch05-continuous-charge-s7
    title: Test the result and transfer the setup
    required: true
    content: |-
      A result needs checks beyond its algebra. For the rod, $k\lambda L/[a\sqrt{a^2+L^2}]$ has units $\mathrm{N/C}$. The ring has the same units as $kQ/R^2$; the disk prefactor $k\sigma$ also has units $\mathrm{N/C}$.

      **Far away:** for $a\gg L$, the rod gives $E_y\approx2k\lambda L/a^2=kQ/a^2$. For $z\gg R$, the ring gives $E_z\approx kQ/z^2$. For the disk, let $u=R^2/z^2\ll1$ and use $(1+u)^{-1/2}\approx1-u/2$:

      $$E_z\approx2\pi k\sigma\frac{R^2}{2z^2}=\frac{k(\pi R^2\sigma)}{z^2}.$$

      The disk's leading terms cancel: retaining only $1-1$ would falsely predict zero. Each finite source approaches a point-charge field at large positive distance.

      **Large source at fixed density:** at fixed $a$ and $\lambda$, let $L\to\infty$ in the rod result to obtain $E_y=2k\lambda/a$. At fixed $z>0$ and $\sigma$, let $R\to\infty$ in the disk result to obtain $E_z=2\pi k\sigma=\sigma/(2\varepsilon_0)$. These limits increase the total charge; holding total charge fixed would be a different limit.

      **Transfer:** now let the rod on $[-L,L]$ have $\lambda(x)=\lambda_0(1+\beta x/L)$, with $\lambda_0>0$ and $0<\beta<1$. The rod outline is still symmetric, but the right side carries more charge. Keep both components:

      $$E_x=-k\lambda_0\int_{-L}^{L}\frac{x(1+\beta x/L)}{(x^2+a^2)^{3/2}}\,dx
      =-\frac{k\lambda_0\beta}{L}\int_{-L}^{L}\frac{x^2}{(x^2+a^2)^{3/2}}\,dx<0,$$

      $$E_y=k\lambda_0 a\int_{-L}^{L}\frac{1+\beta x/L}{(x^2+a^2)^{3/2}}\,dx
      =k\lambda_0 a\int_{-L}^{L}\frac{dx}{(x^2+a^2)^{3/2}}.$$

      In the first integral the odd term vanishes and the even term survives; in the second the density correction is odd and vanishes. This shows precisely why a change in density requires a new symmetry argument.
    check:
      id: physics2-ch05-continuous-charge-s7-check
      type: multipleChoice
      prompt: |-
        A rod on $[-L,L]$ has $\lambda(x)=\lambda_0(1+\beta x/L)$, where $\lambda_0>0$ and $0<\beta<1$. At $(0,a)$ with $a>0$, how does its field compare with a uniform rod of density $\lambda_0$ on the same interval?
      choices:
      - {id: a, text: '$E_x=0$ and $E_y$ is unchanged because the rod outline is symmetric.', issueSignals: [{id: vector-field-interpretation-error}]}
      - {id: b, text: '$E_x>0$ and $E_y$ is unchanged because more positive charge lies on the right.', issueSignals: [{id: sign-error}]}
      - {id: c, text: '$E_x<0$ and $E_y$ is unchanged.'}
      - {id: d, text: '$E_x<0$ and $E_y$ increases by a factor $1+\beta$.', issueSignals: [{id: mathematical-translation-error}]}
      answer: {choiceId: c}
      explanation: |-
        Solution: C. In $E_x$, the correction is $-k\lambda_0\beta x^2/[L(x^2+a^2)^{3/2}]$, whose integral is negative. In $E_y$, the correction is proportional to the odd function $x/(x^2+a^2)^{3/2}$ and integrates to zero.
        Why it works: Pairing equal geometric positions cancels only terms with the required parity. The extra positive charge on the right pushes the field toward the left at this observer.
        Why the other choices fail: A assumes symmetric charge from shape alone. B reverses the direction of the extra right-side contribution. D replaces the varying correction with its maximum value instead of integrating its odd vertical contribution.
