<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: sans-serif;
  }
  .card {
    background-color: #2d2d2d;
    padding: 24px;
    border: 2px solid #4a4a4a;
    margin: 40px;
    border-radius: 8px;
    color: white;
    width: 300px;
  }
  .card-header {
    border-bottom: 1px solid #4a4a4a;
    padding-bottom: 16px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h2 style="margin:0">User Profile</h2>
    </div>
    <p style="margin:0">This is a profile card demonstrating padding, borders, and margins.</p>
  </div>
</body>
</html>
