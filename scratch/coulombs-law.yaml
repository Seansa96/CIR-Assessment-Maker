  - id: physics2-ch05-coulombs-law-s2
    title: Signed vectors, not signed magnitudes
    required: true
    content: 'Write the vector law as $\mathbf F_{12}=kq_1q_2(\mathbf r_2-\mathbf r_1)/|\mathbf r_2-\mathbf r_1|^3$.
      The signed product controls attraction or repulsion while the displacement supplies direction. Keep source
      and target labels explicit before substituting.'
