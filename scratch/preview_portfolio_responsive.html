<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background-color: #121212; color: white; font-family: sans-serif;
    display: grid;
    grid-template-areas: 
      "header header header"
      "sidebar main main"
      "footer footer footer";
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 250px 1fr 1fr;
    height: 100vh;
    gap: 1rem;
    padding: 1rem;
  }
  header { grid-area: header; background: #1e1e1e; padding: 1rem; border-radius: 8px; }
  aside { grid-area: sidebar; background: #2a2a2a; padding: 1rem; border-radius: 8px; }
  main { grid-area: main; background: #1e1e1e; padding: 2rem; border-radius: 8px; }
  footer { grid-area: footer; background: #1e1e1e; padding: 1rem; border-radius: 8px; text-align: center;}
  
  @media (max-width: 768px) {
    body {
      grid-template-areas: 
        "header"
        "main"
        "sidebar"
        "footer";
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<!-- The browser subagent might record at a wide resolution, so we will use an iframe to force mobile width for the preview -->
<body style="display:flex; justify-content:center; align-items:center; background:#000;">
  <iframe srcdoc='<!DOCTYPE html><html><head><style>* { box-sizing: border-box; margin: 0; padding: 0; } body { background-color: #121212; color: white; font-family: sans-serif; display: grid; grid-template-areas: "header" "main" "sidebar" "footer"; grid-template-columns: 1fr; height: 100vh; gap: 1rem; padding: 1rem; } header { grid-area: header; background: #1e1e1e; padding: 1rem; border-radius: 8px; } aside { grid-area: sidebar; background: #2a2a2a; padding: 1rem; border-radius: 8px; } main { grid-area: main; background: #1e1e1e; padding: 2rem; border-radius: 8px; } footer { grid-area: footer; background: #1e1e1e; padding: 1rem; border-radius: 8px; text-align: center;}</style></head><body><header><h3>Portfolio Header</h3></header><main><h1>Main Content Area</h1><p>Stacked for mobile!</p></main><aside><h3>Sidebar / Nav</h3></aside><footer><p>Footer</p></footer></body></html>' width="400" height="700" style="border: 2px solid #555; border-radius: 12px;"></iframe>
</body>
</html>
