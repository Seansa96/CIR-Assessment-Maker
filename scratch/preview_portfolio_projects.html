<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: #121212; color: white; font-family: sans-serif; padding: 2rem; }
  .project-gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    justify-content: center;
  }
  .project-card {
    background-color: #1e1e1e;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 2rem;
    flex-basis: 300px;
    flex-grow: 1;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="project-gallery">
    <div class="project-card"><h3>Project Alpha</h3></div>
    <div class="project-card"><h3>Project Beta</h3></div>
    <div class="project-card"><h3>Project Gamma</h3></div>
    <div class="project-card"><h3>Project Delta</h3></div>
    <div class="project-card"><h3>Project Epsilon</h3></div>
  </div>
</body>
</html>
