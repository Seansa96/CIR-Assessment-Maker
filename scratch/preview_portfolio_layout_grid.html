<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background-color: #121212; color: white; font-family: sans-serif;
    display: grid;
    grid-template-areas: 
      "header header header"
      "sidebar main main"
      "footer footer footer";
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 250px 1fr 1fr;
    height: 100vh;
    gap: 1rem;
    padding: 1rem;
  }
  header { grid-area: header; background: #1e1e1e; padding: 1rem; border-radius: 8px; }
  aside { grid-area: sidebar; background: #2a2a2a; padding: 1rem; border-radius: 8px; }
  main { grid-area: main; background: #1e1e1e; padding: 2rem; border-radius: 8px; }
  footer { grid-area: footer; background: #1e1e1e; padding: 1rem; border-radius: 8px; text-align: center;}
</style>
</head>
<body>
  <header><h3>Portfolio Header</h3></header>
  <aside><h3>Sidebar / Nav</h3></aside>
  <main><h1>Main Content Area</h1><p>The whole app layout is easily managed with grid-template-areas!</p></main>
  <footer><p>Footer</p></footer>
</body>
</html>
