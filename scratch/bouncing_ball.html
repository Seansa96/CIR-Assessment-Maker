<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #222;
    margin: 0;
  }
  .ball {
    width: 50px;
    height: 50px;
    background-color: #e74c3c;
    border-radius: 50%;
    animation: bounce 1s infinite alternate ease-in-out;
  }
  @keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-150px); }
  }
</style>
</head>
<body>
  <div class="ball"></div>
</body>
</html>
