<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #222;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-family: sans-serif;
  }
  .card-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    width: 900px;
    container-type: inline-size;
  }
  .card {
    display: flex;
    flex-direction: row;
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 8px;
    overflow: hidden;
  }
  .card-img {
    background: #e74c3c;
    width: 150px;
    flex-shrink: 0;
  }
  .card-content {
    padding: 1rem;
  }
  
  @container (max-width: 500px) {
    .card {
      flex-direction: column;
    }
    .card-img {
      width: 100%;
      height: 150px;
    }
  }
</style>
</head>
<body>
  <div class="card-grid">
    <div class="card">
      <div class="card-img"></div>
      <div class="card-content"><h3>Wide Card</h3><p>Plenty of room for text here!</p></div>
    </div>
    <!-- Simulate a narrow container by putting a card inside a smaller div -->
    <div style="width: 300px; container-type: inline-size;">
      <div class="card">
        <div class="card-img"></div>
        <div class="card-content"><h3>Narrow Card</h3><p>The container is narrow, so I stacked vertically automatically!</p></div>
      </div>
    </div>
  </div>
</body>
</html>
