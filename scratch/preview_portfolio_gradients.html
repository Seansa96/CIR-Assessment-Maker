<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background-color: #121212; 
    color: white; 
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    gap: 3rem;
  }
  
  .logo {
    font-size: 3rem;
    font-weight: 700;
    background-image: linear-gradient(90deg, #64ffda, #00b4db);
    -webkit-background-clip: text;
    color: transparent;
  }
  
  .project-card {
    background-color: #1e1e1e;
    border-radius: 8px;
    padding: 3rem;
    box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>
  <div class="logo">MyPortfolio</div>
  <div class="project-card">
    <h3>Project Alpha</h3>
  </div>
</body>
</html>
